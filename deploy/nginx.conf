# Hosting for kleine-ark/website-open-parafrase-vertaling; installed at /etc/nginx/sites-available/open-parafrase-weergave.nl
server {
    listen 80;
    listen [::]:80;
    server_name open-parafrase-weergave.nl www.open-parafrase-weergave.nl;

    root /var/www/open-parafrase-weergave.nl;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
        default_type text/plain;
    }

    location / {
        return 301 https://open-parafrase-weergave.nl$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name open-parafrase-weergave.nl;

    root /var/www/open-parafrase-weergave.nl;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/open-parafrase-weergave.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-parafrase-weergave.nl/privkey.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.open-parafrase-weergave.nl;

    ssl_certificate /etc/letsencrypt/live/open-parafrase-weergave.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-parafrase-weergave.nl/privkey.pem;

    return 301 https://open-parafrase-weergave.nl$request_uri;
}
