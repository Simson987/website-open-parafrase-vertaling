<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Haat en liefde zichtbaar</title><desc id="desc">Haat en liefde zichtbaar met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Haat en liefde zichtbaar</text><text x="44" y="113" class="ref">1 Johannes 3:11–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kaïn · vers 12</text><text x="68" y="241" class="body">Slechte werken en het doden van zijn</text><text x="68" y="284" class="body">rechtvaardige broer.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Christus · vers 16</text><text x="68" y="433" class="body">Hij gaf Zijn leven voor ons.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Ons leven · vers 16</text><text x="68" y="582" class="body">Voor elkaar willen leven geven.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De concrete nood · vers 17–18</text><text x="68" y="731" class="body">Het hart openen en met de daad en in</text><text x="68" y="774" class="body">waarheid liefhebben.</text><text x="46" y="867" class="note">De twee voorbeelden onderbouwen de oproep tot</text><text x="46" y="903" class="note">daadwerkelijke liefde.</text></svg>