<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">De drie aangesproken groepen</title><desc id="desc">De drie aangesproken groepen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De drie aangesproken groepen</text><text x="44" y="113" class="ref">1 Johannes 2:12–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kinderen</text><text x="68" y="241" class="body">Zonden vergeven om Zijn Naam; de Vader</text><text x="68" y="284" class="body">kennen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vaders</text><text x="68" y="433" class="body">Hem kennen die er vanaf het begin is.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Jonge mannen</text><text x="68" y="582" class="body">De boze overwonnen; sterk; Gods Woord</text><text x="68" y="625" class="body">blijft in hen.</text><text x="46" y="718" class="note">Dit is de groepering in de brief. De tekst</text><text x="46" y="754" class="note">tekent hier geen biologische stamboom.</text></svg>