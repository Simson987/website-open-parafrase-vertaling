<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De genoemde getuigen</title><desc id="desc">De genoemde getuigen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde getuigen</text><text x="44" y="113" class="ref">1 Johannes 5:6–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In de hemel · vers 7</text><text x="68" y="241" class="body">De Vader, het Woord en de Heilige</text><text x="68" y="284" class="body">Geest; deze drie zijn één.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Op de aarde · vers 8</text><text x="68" y="433" class="body">De Geest, het water en het bloed; deze</text><text x="68" y="476" class="body">drie zijn tot één.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gods getuigenis · vers 9–10</text><text x="68" y="625" class="body">Het getuigenis dat Hij over Zijn Zoon</text><text x="68" y="668" class="body">gegeven heeft.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De inhoud · vers 11–12</text><text x="68" y="817" class="body">Het eeuwige leven is in Zijn Zoon.</text><text x="46" y="910" class="note">De formulering volgt de plaatselijke tekst en</text><text x="46" y="946" class="note">versindeling van dit hoofdstuk.</text></svg>