<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Wat voorbijgaat en wat blijft</title><desc id="desc">Wat voorbijgaat en wat blijft met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat voorbijgaat en wat blijft</text><text x="44" y="113" class="ref">1 Johannes 2:15–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begeerte van het vlees</text><text x="68" y="241" class="body">Een van de genoemde wereldse</text><text x="68" y="284" class="body">verlangens.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Begeerte van de ogen</text><text x="68" y="433" class="body">De tweede genoemde begeerte.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Hoogmoed van het leven</text><text x="68" y="582" class="body">De derde genoemde houding.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Het blijvende</text><text x="68" y="731" class="body">Wie de wil van God doet, blijft tot in</text><text x="68" y="774" class="body">eeuwigheid.</text><text x="46" y="867" class="note">De drie horen bij de wereld die met haar</text><text x="46" y="903" class="note">begeerte voorbijgaat.</text></svg>