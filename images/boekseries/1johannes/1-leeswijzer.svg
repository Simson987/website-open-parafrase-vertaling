<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Het leven, het licht en belijden</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het leven, het licht en belijden</text><text x="44" y="113" class="ref">1 Johannes 1:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–4 · Het getuigenis</text><text x="68" y="241" class="body">Gehoord, gezien en aangeraakt;</text><text x="68" y="284" class="body">gemeenschap en volle blijdschap.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">5–7 · Licht en waarheid</text><text x="68" y="433" class="body">In het licht leven en gemeenschap met</text><text x="68" y="476" class="body">elkaar.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">8–10 · Eerlijk over zonde</text><text x="68" y="625" class="body">Geen zelfbedrog; belijden, vergeving en</text><text x="68" y="668" class="body">reiniging.</text><text x="46" y="761" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="797" class="note">de plaatselijke versindeling.</text></svg>