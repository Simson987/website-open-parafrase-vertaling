<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Belijden en liefhebben</title><desc id="desc">Belijden en liefhebben met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Belijden en liefhebben</text><text x="44" y="113" class="ref">1 Johannes 4:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het belijden · vers 2, 15</text><text x="68" y="241" class="body">Jezus Christus kwam in het vlees; Jezus</text><text x="68" y="284" class="body">is Gods Zoon.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De oorsprong · vers 7–10</text><text x="68" y="433" class="body">Liefde komt uit God; Hij stuurde Zijn</text><text x="68" y="476" class="body">Zoon.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De uitwerking · vers 11–18</text><text x="68" y="625" class="body">Elkaar liefhebben, blijven en</text><text x="68" y="668" class="body">vrijmoedig zijn.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De toets · vers 20–21</text><text x="68" y="817" class="body">God liefhebben gaat samen met liefde</text><text x="68" y="860" class="body">voor de broeder.</text><text x="46" y="953" class="note">De brief verbindt de toets van het getuigenis</text><text x="46" y="989" class="note">met de toets van de onderlinge liefde.</text></svg>