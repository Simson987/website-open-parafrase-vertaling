<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Wat zeggen en doen wij?</title><desc id="desc">Wat zeggen en doen wij? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat zeggen en doen wij?</text><text x="44" y="113" class="ref">1 Johannes 1:6–10</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gemeenschap zeggen · vers 6</text><text x="68" y="241" class="body">In duisternis leven spreekt dat tegen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">In het licht leven · vers 7</text><text x="68" y="390" class="body">Gemeenschap en reiniging door Jezus’</text><text x="68" y="433" class="body">bloed.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Geen zonde zeggen · vers 8, 10</text><text x="68" y="582" class="body">Zelfbedrog en Zijn Woord tegenspreken.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Zonde belijden · vers 9</text><text x="68" y="731" class="body">Hij vergeeft en reinigt, trouw en</text><text x="68" y="774" class="body">rechtvaardig.</text><text x="46" y="867" class="note">De opeenvolgende als-zinnen toetsen de</text><text x="46" y="903" class="note">verhouding tussen woorden en leven.</text></svg>