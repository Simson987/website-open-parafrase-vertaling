<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Wachten en beheren</title><desc id="desc">Wachten en beheren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wachten en beheren</text><text x="44" y="113" class="ref">Lukas 12:35–48</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wachtende knechten · 35–40</text><text x="68" y="241" class="body">Klaar, lampen, deur openen; onverwachte</text><text x="68" y="284" class="body">komst.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Petrus’ vraag · 41</text><text x="68" y="433" class="body">Voor ons of voor iedereen?</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Beheerder · 42–48</text><text x="68" y="582" class="body">Op tijd eten geven; trouw of misbruik;</text><text x="68" y="625" class="body">meer ontvangen betekent meer</text><text x="68" y="668" class="body">verantwoordelijkheid.</text><text x="46" y="761" class="note">Een onderwijsreeks, geen datum of voorspeld</text><text x="46" y="797" class="note">tijdstip.</text></svg>