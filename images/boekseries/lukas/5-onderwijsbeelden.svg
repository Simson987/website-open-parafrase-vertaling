<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Vasten, lap en wijnzakken</title><desc id="desc">Vasten, lap en wijnzakken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vasten, lap en wijnzakken</text><text x="44" y="113" class="ref">Lukas 5:33–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bruidegom · 33–35</text><text x="68" y="241" class="body">Zolang aanwezig geen vasten; weggenomen</text><text x="68" y="284" class="body">en dan wel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kleding · 36</text><text x="68" y="433" class="body">Nieuwe lap scheuren beschadigt nieuw en</text><text x="68" y="476" class="body">past niet bij oud.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wijn · 37–39</text><text x="68" y="625" class="body">Nieuwe wijn in nieuwe zakken; oude wijn</text><text x="68" y="668" class="body">wordt door drinker beter genoemd.</text><text x="46" y="761" class="note">Vergelijkingen uit het onderwijs, geen</text><text x="46" y="797" class="note">beschreven bruiloft of wijnproductie.</text></svg>