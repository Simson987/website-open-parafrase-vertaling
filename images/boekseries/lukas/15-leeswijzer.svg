<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Verloren en teruggevonden</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verloren en teruggevonden</text><text x="44" y="113" class="ref">Lukas 15:1–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanleiding · 1–3</text><text x="68" y="241" class="body">Tollenaars luisteren; leiders mopperen</text><text x="68" y="284" class="body">over ontvangen en eten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Schaap en munt · 4–10</text><text x="68" y="433" class="body">Honderd/één en tien/één; zoeken,</text><text x="68" y="476" class="body">vinden, anderen laten delen in vreugde.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee zonen · 11–32</text><text x="68" y="625" class="body">Vertrek en gebrek, bezinning en</text><text x="68" y="668" class="body">terugkeer, ontvangst en feest; oudste</text><text x="68" y="711" class="body">buiten en vaders antwoord.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>