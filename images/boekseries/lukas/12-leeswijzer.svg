<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Bezit en waakzaamheid</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bezit en waakzaamheid</text><text x="44" y="113" class="ref">Lukas 12:1–59</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vrees en getuigen · 1–12</text><text x="68" y="241" class="body">Gist als schijn, onthulling, Gods</text><text x="68" y="284" class="body">ontzag, mussen, belijden en Geest helpt</text><text x="68" y="327" class="body">spreken.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bezit en zorg · 13–34</text><text x="68" y="476" class="body">Erfenis, hebzucht, grotere schuren;</text><text x="68" y="519" class="body">raven en lelies, koninkrijk en schat.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Waakzaam · 35–48</text><text x="68" y="668" class="body">Lampen, thuiskomst en dienen; Petrus’</text><text x="68" y="711" class="body">vraag, betrouwbare beheerder en</text><text x="68" y="754" class="body">verantwoordelijkheid.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Tijd en keuze · 49–59</text><text x="68" y="903" class="body">Vuur/doop, verdeeld huis, weertekens en</text><text x="68" y="946" class="body">deze tijd, verzoenen onderweg.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>