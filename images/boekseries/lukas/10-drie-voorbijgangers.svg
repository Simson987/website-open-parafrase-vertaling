<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Wie werd de naaste?</title><desc id="desc">Wie werd de naaste? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie werd de naaste?</text><text x="44" y="113" class="ref">Lukas 10:30–37</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Priester · 31</text><text x="68" y="241" class="body">Ziet en gaat voorbij.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Leviet · 32</text><text x="68" y="390" class="body">Ziet en gaat voorbij.</text><rect x="42" y="448" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Samaritaan · 33–35</text><text x="68" y="539" class="body">Ziet, ontfermt, verbindt, vervoert en</text><text x="68" y="582" class="body">verzorgt; twee penningen en</text><text x="68" y="625" class="body">terugkeerbelofte.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Toepassing · 36–37</text><text x="68" y="774" class="body">Wie medelijden had; ga en doe</text><text x="68" y="817" class="body">hetzelfde.</text><text x="46" y="910" class="note">Geen plattegrond van een vastgestelde</text><text x="46" y="946" class="note">historische overval; dit is Jezus’</text><text x="46" y="982" class="note">antwoordverhaal.</text></svg>