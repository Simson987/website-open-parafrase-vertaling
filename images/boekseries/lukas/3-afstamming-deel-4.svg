<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1515" viewBox="0 0 840 1515" role="img" aria-labelledby="title desc"><title id="title">Afstamming: deel 4</title><desc id="desc">Alle opeenvolgende namen uit de plaatselijke afstammingslijst, in volgorde zoon naar voorgaande generatie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1515" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Afstamming: deel 4</text><text x="44" y="113" class="ref">Lukas 3:23–38</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">61–63</text><text x="68" y="241" class="body">Falek → Heber → Sala</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">63–65</text><text x="68" y="390" class="body">Sala → Kaïnan → Arfaxad</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">65–67</text><text x="68" y="539" class="body">Arfaxad → Sem → Noach</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">67–69</text><text x="68" y="688" class="body">Noach → Lamech → Mathusala</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">69–71</text><text x="68" y="837" class="body">Mathusala → Enoch → Jared</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">71–73</text><text x="68" y="986" class="body">Jared → Malaleël → Kaïnan</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">73–75</text><text x="68" y="1135" class="body">Kaïnan → Enos → Seth</text><rect x="42" y="1193" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">75–77</text><text x="68" y="1284" class="body">Seth → Adam → God</text><text x="46" y="1377" class="note">Pijl betekent: zoon van. Begin: men dacht dat</text><text x="46" y="1413" class="note">Jezus Jozefs zoon was. Slot: Adam, zoon van God;</text><text x="46" y="1449" class="note">geen biologisch schema van God.</text></svg>