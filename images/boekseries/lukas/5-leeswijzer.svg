<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Roeping, vergeving en maaltijd</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Roeping, vergeving en maaltijd</text><text x="44" y="113" class="ref">Lukas 5:1–39</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Meer · 1–11</text><text x="68" y="241" class="body">Onderwijs uit boot, diepe water, twee</text><text x="68" y="284" class="body">volle boten; Simon knielt en vissers</text><text x="68" y="327" class="body">volgen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Genezing · 12–26</text><text x="68" y="476" class="body">Gereinigde man, terugtrekken en gebed;</text><text x="68" y="519" class="body">dak, vergeving en bed meenemen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Levi en beelden · 27–39</text><text x="68" y="668" class="body">Roeping en feestmaal; arts, bruidegom,</text><text x="68" y="711" class="body">lap en wijnzakken, oude wijn.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>