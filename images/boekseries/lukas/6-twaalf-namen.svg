<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">De twaalf gekozen apostelen</title><desc id="desc">De twaalf gekozen apostelen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twaalf gekozen apostelen</text><text x="44" y="113" class="ref">Lukas 6:13–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste zes · 14</text><text x="68" y="241" class="body">Simon/Petrus, Andreas, Jakobus,</text><text x="68" y="284" class="body">Johannes, Filippus, Bartholomeüs.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Volgende vier · 15</text><text x="68" y="433" class="body">Mattheüs, Thomas, Jakobus zoon Alfeüs,</text><text x="68" y="476" class="body">Simon de Zeloot.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Laatste twee · 16</text><text x="68" y="625" class="body">Judas broer Jakobus; Judas Iskariot,</text><text x="68" y="668" class="body">later verrader.</text><text x="46" y="761" class="note">De verwantschapsaanduiding volgt letterlijk deze</text><text x="46" y="797" class="note">plaatselijke vertaling.</text></svg>