<svg xmlns="http://www.w3.org/2000/svg" width="840" height="671" viewBox="0 0 840 671" role="img" aria-labelledby="title desc"><title id="title">Twee keer achttien</title><desc id="desc">Twee keer achttien met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="671" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee keer achttien</text><text x="44" y="113" class="ref">Lukas 13:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Siloam · 1–5</text><text x="68" y="241" class="body">Achttien omgekomen; niet schuldiger dan</text><text x="68" y="284" class="body">anderen; oproep bekering.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vrouw · 10–17</text><text x="68" y="433" class="body">Achttien jaar gebogen; bevrijd op</text><text x="68" y="476" class="body">sabbat en rechtop.</text><text x="46" y="569" class="note">Twee verschillende vermeldingen; de vrouw is</text><text x="46" y="605" class="note">geen slachtoffer van de toren.</text></svg>