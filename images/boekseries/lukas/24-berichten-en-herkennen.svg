<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Berichten en herkenning</title><desc id="desc">Berichten en herkenning met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Berichten en herkenning</text><text x="44" y="113" class="ref">Lukas 24:1–53</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vrouwen en Petrus · 1–12</text><text x="68" y="241" class="body">Twee mannen in licht, herinnering en</text><text x="68" y="284" class="body">bericht; elf geloven niet, Petrus ziet</text><text x="68" y="327" class="body">doeken.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Twee reizigers · 13–35</text><text x="68" y="476" class="body">Kleopas genoemd, ander ongenoemd;</text><text x="68" y="519" class="body">Schrift en brood, terugkeer.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bijeenkomst · 36–49</text><text x="68" y="668" class="body">Jezus in midden, handen/voeten en eten;</text><text x="68" y="711" class="body">Schrift en getuigen, blijven in stad.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bethanië · 50–53</text><text x="68" y="860" class="body">Zegen, opname, terug naar Jeruzalem en</text><text x="68" y="903" class="body">tempellof.</text><text x="46" y="996" class="note">Geen naam voor de tweede Emmaüsganger of exacte</text><text x="46" y="1032" class="note">datum voor hemelvaart toegevoegd.</text></svg>