<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Opletten en volhouden</title><desc id="desc">Opletten en volhouden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opletten en volhouden</text><text x="44" y="113" class="ref">Lukas 21:8–36</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet misleid · 8–19</text><text x="68" y="241" class="body">Niet achter namen en tijdclaims; onrust</text><text x="68" y="284" class="body">niet meteen einde, getuigen en</text><text x="68" y="327" class="body">volhouden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jeruzalem · 20–24</text><text x="68" y="476" class="body">Omsingeling, vluchten en niet terug</text><text x="68" y="519" class="body">naar de stad.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bevrijding en gebed · 25–36</text><text x="68" y="668" class="body">Hoofd omhoog, blijvend woord, geen</text><text x="68" y="711" class="body">verdoving door zorgen; waakzaam bidden.</text><text x="46" y="804" class="note">Geen moderne datum, tijdlijnberekening of</text><text x="46" y="840" class="note">hedendaagse oorlog benoemd.</text></svg>