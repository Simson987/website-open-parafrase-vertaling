<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1813" viewBox="0 0 840 1813" role="img" aria-labelledby="title desc"><title id="title">Afstamming: deel 1</title><desc id="desc">Alle opeenvolgende namen uit de plaatselijke afstammingslijst, in volgorde zoon naar voorgaande generatie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1813" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Afstamming: deel 1</text><text x="44" y="113" class="ref">Lukas 3:23–38</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3</text><text x="68" y="241" class="body">Jezus → Jozef → Heli</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">3–5</text><text x="68" y="390" class="body">Heli → Matthat → Levi</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">5–7</text><text x="68" y="539" class="body">Levi → Melchi → Janna</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">7–9</text><text x="68" y="688" class="body">Janna → Jozef → Mattathias</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">9–11</text><text x="68" y="837" class="body">Mattathias → Amos → Naüm</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">11–13</text><text x="68" y="986" class="body">Naüm → Esli → Naggai</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">13–15</text><text x="68" y="1135" class="body">Naggai → Maäth → Mattathias</text><rect x="42" y="1193" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">15–17</text><text x="68" y="1284" class="body">Mattathias → Semeï → Jozef</text><rect x="42" y="1342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1385" class="label">17–19</text><text x="68" y="1433" class="body">Jozef → Juda → Johannes</text><rect x="42" y="1491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1534" class="label">19–21</text><text x="68" y="1582" class="body">Johannes → Rhesa → Zorobabel</text><text x="46" y="1675" class="note">Pijl betekent: zoon van. Begin: men dacht dat</text><text x="46" y="1711" class="note">Jezus Jozefs zoon was. Slot: Adam, zoon van God;</text><text x="46" y="1747" class="note">geen biologisch schema van God.</text></svg>