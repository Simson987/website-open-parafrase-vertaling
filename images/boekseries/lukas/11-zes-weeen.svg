<svg xmlns="http://www.w3.org/2000/svg" width="840" height="714" viewBox="0 0 840 714" role="img" aria-labelledby="title desc"><title id="title">Zes weeën bij de maaltijd</title><desc id="desc">Zes weeën bij de maaltijd met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="714" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes weeën bij de maaltijd</text><text x="44" y="113" class="ref">Lukas 11:42–52</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Farizeeën · 42–44</text><text x="68" y="241" class="body">Kruidentienden maar recht/liefde</text><text x="68" y="284" class="body">overslaan; ereplaatsen; onzichtbare</text><text x="68" y="327" class="body">graven.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wetgeleerden · 46–52</text><text x="68" y="476" class="body">Lasten niet mee tillen; profetengraven;</text><text x="68" y="519" class="body">sleutel kennis weggenomen.</text><text x="46" y="612" class="note">Drie weeën tot iedere groep; geen scène van</text><text x="46" y="648" class="note">profetenmoord gemaakt.</text></svg>