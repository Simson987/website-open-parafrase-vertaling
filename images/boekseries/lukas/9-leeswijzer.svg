<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Wie Jezus is en wat volgen vraagt</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie Jezus is en wat volgen vraagt</text><text x="44" y="113" class="ref">Lukas 9:1–62</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zending en maaltijd · 1–17</text><text x="68" y="241" class="body">Twaalf zonder staf of bagage; Herodes;</text><text x="68" y="284" class="body">vijf broden, twee vissen, groepen</text><text x="68" y="327" class="body">vijftig en twaalf manden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Belijdenis en berg · 18–36</text><text x="68" y="476" class="body">Petrus, lijden en dagelijks kruis; na</text><text x="68" y="519" class="body">ongeveer acht dagen berg, Mozes/Elia,</text><text x="68" y="562" class="body">wolk/stem.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Onderweg · 37–62</text><text x="68" y="711" class="body">Zoon aan vader, overlevering, minste</text><text x="68" y="754" class="body">kind, andere uitdrijver; Samaria en</text><text x="68" y="797" class="body">drie volgvragen.</text><text x="46" y="890" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="926" class="note">de plaatselijke versindeling.</text></svg>