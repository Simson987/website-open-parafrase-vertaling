<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Opdrachten en aantallen</title><desc id="desc">Opdrachten en aantallen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opdrachten en aantallen</text><text x="44" y="113" class="ref">Lukas 9:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De twaalf · 1–6</text><text x="68" y="241" class="body">Verkondigen en genezen; geen staf, tas,</text><text x="68" y="284" class="body">brood, geld of extra kleding.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De maaltijd · 13–16</text><text x="68" y="433" class="body">Vijf broden en twee vissen; ongeveer</text><text x="68" y="476" class="body">vijfduizend mannen, groepen ongeveer</text><text x="68" y="519" class="body">vijftig.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wat overblijft · 17</text><text x="68" y="668" class="body">Allen verzadigd; twaalf manden</text><text x="68" y="711" class="body">broodstukken.</text><text x="46" y="804" class="note">Geen staven uit Markus’ zending of groepen</text><text x="46" y="840" class="note">honderd uit een ander hoofdstuk toegevoegd.</text></svg>