<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Twee kwijtgescholden schulden</title><desc id="desc">Twee kwijtgescholden schulden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee kwijtgescholden schulden</text><text x="44" y="113" class="ref">Lukas 7:41–47</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eén geldschieter</text><text x="68" y="241" class="body">Twee schuldenaars kunnen geen van</text><text x="68" y="284" class="body">beiden betalen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bedragen</text><text x="68" y="433" class="body">Eén: 500 penningen. Ander: 50</text><text x="68" y="476" class="body">penningen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vraag en antwoord</text><text x="68" y="625" class="body">Beiden kwijtgescholden; wie meest lief?</text><text x="68" y="668" class="body">Degene met grootste kwijtgescholden</text><text x="68" y="711" class="body">schuld.</text><text x="46" y="804" class="note">Een onderwijsverhaal, geen gerapporteerde</text><text x="46" y="840" class="note">boekhouding.</text></svg>