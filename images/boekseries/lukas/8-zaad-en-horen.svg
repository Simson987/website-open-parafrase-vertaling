<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Vier plaatsen voor het zaad</title><desc id="desc">Vier plaatsen voor het zaad met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier plaatsen voor het zaad</text><text x="44" y="113" class="ref">Lukas 8:5–15</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Weg · 5 en 12</text><text x="68" y="241" class="body">Vertrapt/vogels; woord weggenomen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Rots · 6 en 13</text><text x="68" y="390" class="body">Geen vocht/wortel; tijdelijk geloof,</text><text x="68" y="433" class="body">beproeving.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Dorens · 7 en 14</text><text x="68" y="582" class="body">Zorgen, rijkdom en genoegens</text><text x="68" y="625" class="body">verstikken.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Goede grond · 8 en 15</text><text x="68" y="774" class="body">Honderdvoudig; vasthouden en volhouden.</text><text x="46" y="867" class="note">Dit hoofdstuk noemt honderdvoudig; geen dertig</text><text x="46" y="903" class="note">of zestig toegevoegd.</text></svg>