<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1813" viewBox="0 0 840 1813" role="img" aria-labelledby="title desc"><title id="title">Afstamming: deel 3</title><desc id="desc">Alle opeenvolgende namen uit de plaatselijke afstammingslijst, in volgorde zoon naar voorgaande generatie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1813" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Afstamming: deel 3</text><text x="44" y="113" class="ref">Lukas 3:23–38</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">41–43</text><text x="68" y="241" class="body">Mattatha → Nathan → David</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">43–45</text><text x="68" y="390" class="body">David → Jesse → Obed</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">45–47</text><text x="68" y="539" class="body">Obed → Booz → Salmon</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">47–49</text><text x="68" y="688" class="body">Salmon → Nahasson → Aminadab</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">49–51</text><text x="68" y="837" class="body">Aminadab → Aram → Esrom</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">51–53</text><text x="68" y="986" class="body">Esrom → Fares → Juda</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">53–55</text><text x="68" y="1135" class="body">Juda → Jakob → Izak</text><rect x="42" y="1193" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">55–57</text><text x="68" y="1284" class="body">Izak → Abraham → Thara</text><rect x="42" y="1342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1385" class="label">57–59</text><text x="68" y="1433" class="body">Thara → Nachor → Saruch</text><rect x="42" y="1491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1534" class="label">59–61</text><text x="68" y="1582" class="body">Saruch → Ragau → Falek</text><text x="46" y="1675" class="note">Pijl betekent: zoon van. Begin: men dacht dat</text><text x="46" y="1711" class="note">Jezus Jozefs zoon was. Slot: Adam, zoon van God;</text><text x="46" y="1747" class="note">geen biologisch schema van God.</text></svg>