<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Pascha, gebed en gevangenneming</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Pascha, gebed en gevangenneming</text><text x="44" y="113" class="ref">Lukas 22:1–71</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorbereiding · 1–13</text><text x="68" y="241" class="body">Complot en Judasgeld; Petrus/Johannes,</text><text x="68" y="284" class="body">waterkruikman en bovenzaal.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tafel · 14–38</text><text x="68" y="433" class="body">Beker, brood en nieuw verbond;</text><text x="68" y="476" class="body">verrader, dienen en Petrus; eerdere</text><text x="68" y="519" class="body">zending, nu beurs/tas en twee zwaarden.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Olijfberg · 39–53</text><text x="68" y="668" class="body">Gebed, engel en slapende leerlingen;</text><text x="68" y="711" class="body">Judas, rechteroor genezen en arrest.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Huis en raad · 54–71</text><text x="68" y="860" class="body">Vuur en drie ontkenningen, blik en</text><text x="68" y="903" class="body">huilen; spot en dagraad vraagt</text><text x="68" y="946" class="body">Christus/Zoon.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>