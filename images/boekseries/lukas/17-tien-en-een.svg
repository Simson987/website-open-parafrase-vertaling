<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Tien gereinigd, één terug</title><desc id="desc">Tien gereinigd, één terug met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tien gereinigd, één terug</text><text x="44" y="113" class="ref">Lukas 17:12–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tien · 12–14</text><text x="68" y="241" class="body">Roepen op afstand; gestuurd naar</text><text x="68" y="284" class="body">priesters; onderweg rein.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eén · 15–16</text><text x="68" y="433" class="body">Keert terug, prijst God, dankt;</text><text x="68" y="476" class="body">Samaritaan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Negen · 17–19</text><text x="68" y="625" class="body">Jezus vraagt naar anderen;</text><text x="68" y="668" class="body">teruggekeerde mag opstaan en gaan.</text><text x="46" y="761" class="note">Negen is de vraag uit vers 17; geen namen of</text><text x="46" y="797" class="note">verdere levensverhalen verzonnen.</text></svg>