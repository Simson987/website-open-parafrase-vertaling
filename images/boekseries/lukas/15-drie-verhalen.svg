<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Drie verhalen over terugvinden</title><desc id="desc">Drie verhalen over terugvinden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie verhalen over terugvinden</text><text x="44" y="113" class="ref">Lukas 15:4–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schaap · 4–7</text><text x="68" y="241" class="body">Honderd, één verloren; zoeken,</text><text x="68" y="284" class="body">schouders en gedeelde vreugde.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Munt · 8–10</text><text x="68" y="433" class="body">Tien, één verloren; lamp, vegen, zoeken</text><text x="68" y="476" class="body">en vriendinnen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zonen · 11–32</text><text x="68" y="625" class="body">Twee zonen, jongste terug en oudste</text><text x="68" y="668" class="body">buiten; vader spreekt beiden aan.</text><text x="46" y="761" class="note">De jongste en oudste blijven onderscheiden; een</text><text x="46" y="797" class="note">gelijkenissenreeks, geen familiegeschiedenis.</text></svg>