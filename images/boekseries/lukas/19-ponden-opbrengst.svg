<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De ponden en de opbrengst</title><desc id="desc">De ponden en de opbrengst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De ponden en de opbrengst</text><text x="44" y="113" class="ref">Lukas 19:13–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin · 13</text><text x="68" y="241" class="body">Tien knechten krijgen tien ponden en</text><text x="68" y="284" class="body">opdracht zaken te doen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste · 16–17</text><text x="68" y="433" class="body">Pond levert tien op; gezag over tien</text><text x="68" y="476" class="body">steden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tweede · 18–19</text><text x="68" y="625" class="body">Pond levert vijf op; bestuur over vijf</text><text x="68" y="668" class="body">steden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ander · 20–26</text><text x="68" y="817" class="body">Pond in doek; niet beheerd, afgenomen</text><text x="68" y="860" class="body">en aan eerste gegeven.</text><text x="46" y="953" class="note">Ponden uit Lukas zijn niet de talenten met</text><text x="46" y="989" class="note">verschillende beginbedragen uit Mattheüs.</text></svg>