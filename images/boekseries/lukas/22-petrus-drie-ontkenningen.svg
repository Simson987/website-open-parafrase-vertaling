<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Petrus’ drie ontkenningen</title><desc id="desc">Petrus’ drie ontkenningen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Petrus’ drie ontkenningen</text><text x="44" y="113" class="ref">Lukas 22:54–62</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste · 56–57</text><text x="68" y="241" class="body">Dienstmeisje bij het vuur: hoorde bij</text><text x="68" y="284" class="body">Hem; ik ken Hem niet.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede · 58</text><text x="68" y="433" class="body">Ander zegt: jij hoort erbij; dat ben ik</text><text x="68" y="476" class="body">niet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Derde · 59–60</text><text x="68" y="625" class="body">Ongeveer uur later, Galilea; weet niet</text><text x="68" y="668" class="body">wat je zegt. Haan kraait.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Daarna · 61–62</text><text x="68" y="817" class="body">Jezus kijkt Petrus aan; herinnering en</text><text x="68" y="860" class="body">bitter huilen.</text><text x="46" y="953" class="note">Geen tweemaal kraaiende haan uit Markus aan</text><text x="46" y="989" class="note">Lukas toegevoegd.</text></svg>