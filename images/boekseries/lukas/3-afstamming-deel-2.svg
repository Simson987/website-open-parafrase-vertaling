<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1813" viewBox="0 0 840 1813" role="img" aria-labelledby="title desc"><title id="title">Afstamming: deel 2</title><desc id="desc">Alle opeenvolgende namen uit de plaatselijke afstammingslijst, in volgorde zoon naar voorgaande generatie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1813" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Afstamming: deel 2</text><text x="44" y="113" class="ref">Lukas 3:23–38</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">21–23</text><text x="68" y="241" class="body">Zorobabel → Salathiël → Neri</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">23–25</text><text x="68" y="390" class="body">Neri → Melchi → Addi</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">25–27</text><text x="68" y="539" class="body">Addi → Kosam → Elmodam</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">27–29</text><text x="68" y="688" class="body">Elmodam → Er → Joses</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">29–31</text><text x="68" y="837" class="body">Joses → Eliëzer → Jorim</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">31–33</text><text x="68" y="986" class="body">Jorim → Matthat → Levi</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">33–35</text><text x="68" y="1135" class="body">Levi → Simeon → Juda</text><rect x="42" y="1193" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">35–37</text><text x="68" y="1284" class="body">Juda → Jozef → Jonan</text><rect x="42" y="1342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1385" class="label">37–39</text><text x="68" y="1433" class="body">Jonan → Eljakim → Meleas</text><rect x="42" y="1491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1534" class="label">39–41</text><text x="68" y="1582" class="body">Meleas → Mainan → Mattatha</text><text x="46" y="1675" class="note">Pijl betekent: zoon van. Begin: men dacht dat</text><text x="46" y="1711" class="note">Jezus Jozefs zoon was. Slot: Adam, zoon van God;</text><text x="46" y="1747" class="note">geen biologisch schema van God.</text></svg>