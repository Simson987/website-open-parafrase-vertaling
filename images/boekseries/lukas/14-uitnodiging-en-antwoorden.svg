<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De uitnodiging en antwoorden</title><desc id="desc">De uitnodiging en antwoorden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De uitnodiging en antwoorden</text><text x="44" y="113" class="ref">Lukas 14:16–24</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste antwoord · 18</text><text x="68" y="241" class="body">Akker gekocht, wil gaan kijken.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tweede antwoord · 19</text><text x="68" y="390" class="body">Vijf span ossen gekocht, wil</text><text x="68" y="433" class="body">uitproberen.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Derde antwoord · 20</text><text x="68" y="582" class="body">Pas getrouwd, kan niet komen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Nieuwe gasten · 21–24</text><text x="68" y="731" class="body">Stad, straten en wegen; er is nog</text><text x="68" y="774" class="body">plaats en het huis moet vol.</text><text x="46" y="867" class="note">Vijf span zijn geen vijf losse ossen; geen</text><text x="46" y="903" class="note">dierengetal getekend.</text></svg>