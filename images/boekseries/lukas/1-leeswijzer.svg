<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Aankondiging en lofzang</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aankondiging en lofzang</text><text x="44" y="113" class="ref">Lukas 1:1–80</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorwoord · 1–4</text><text x="68" y="241" class="body">Geordend onderzoek voor Theofilus;</text><text x="68" y="284" class="body">ooggetuigen en zekerheid.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twee aankondigingen · 5–38</text><text x="68" y="433" class="body">Zacharias, Elizabet en Johannes;</text><text x="68" y="476" class="body">Gabriël in Nazareth bij Maria over</text><text x="68" y="519" class="body">Jezus.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bezoek en zang · 39–56</text><text x="68" y="668" class="body">Maria bezoekt Elizabet, lof aan God en</text><text x="68" y="711" class="body">barmhartigheid; ongeveer drie maanden.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Johannes · 57–80</text><text x="68" y="860" class="body">Geboorte, naam op schrijftafel,</text><text x="68" y="903" class="body">Zacharias spreekt en profeteert; kind</text><text x="68" y="946" class="body">groeit in woestijn.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>