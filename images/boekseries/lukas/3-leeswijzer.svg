<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Johannes, doop en afstamming</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Johannes, doop en afstamming</text><text x="44" y="113" class="ref">Lukas 3:1–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tijd en oproep · 1–20</text><text x="68" y="241" class="body">Bestuurders, Jesaja en bekering; delen,</text><text x="68" y="284" class="body">eerlijk innen en geen afpersing;</text><text x="68" y="327" class="body">Herodes sluit Johannes op.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jezus · 21–22</text><text x="68" y="476" class="body">Gedoopt en biddend, hemel open, Geest</text><text x="68" y="519" class="body">als duif en stem over geliefde Zoon.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Afstamming · 23–38</text><text x="68" y="668" class="body">Ongeveer dertig jaar; men dacht zoon</text><text x="68" y="711" class="body">van Jozef. Genoemde lijn via Nathan en</text><text x="68" y="754" class="body">David tot Adam en God.</text><text x="46" y="847" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="883" class="note">de plaatselijke versindeling.</text></svg>