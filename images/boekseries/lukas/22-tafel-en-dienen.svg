<svg xmlns="http://www.w3.org/2000/svg" width="840" height="913" viewBox="0 0 840 913" role="img" aria-labelledby="title desc"><title id="title">Aan tafel: verbond en dienen</title><desc id="desc">Aan tafel: verbond en dienen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="913" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aan tafel: verbond en dienen</text><text x="44" y="113" class="ref">Lukas 22:14–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beker en brood · 14–20</text><text x="68" y="241" class="body">Pascha, eerste beker delen; brood</text><text x="68" y="284" class="body">gedenken; beker na maaltijd als nieuw</text><text x="68" y="327" class="body">verbond.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Leerlingen · 21–34</text><text x="68" y="476" class="body">Verraad en grootste; leider dient,</text><text x="68" y="519" class="body">trouw en Petrus’ terugkeer/ontkenning.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Uitrusting · 35–38</text><text x="68" y="668" class="body">Eerder niets tekort; nu beurs/tas, twee</text><text x="68" y="711" class="body">zwaarden; vervulling gerekend bij</text><text x="68" y="754" class="body">misdadigers.</text><text x="46" y="847" class="note">De volgorde volgt de plaatselijke Lukas-tekst.</text></svg>