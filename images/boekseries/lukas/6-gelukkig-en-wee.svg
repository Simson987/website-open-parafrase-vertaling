<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Vier uitspraken en vier weeën</title><desc id="desc">Vier uitspraken en vier weeën met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier uitspraken en vier weeën</text><text x="44" y="113" class="ref">Lukas 6:20–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Arm ↔ rijk</text><text x="68" y="241" class="body">Koninkrijk tegenover al ontvangen</text><text x="68" y="284" class="body">troost.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Honger ↔ volop eten</text><text x="68" y="433" class="body">Verzadigd worden tegenover later</text><text x="68" y="476" class="body">hongeren.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Huilen ↔ lachen</text><text x="68" y="625" class="body">Later lachen tegenover later treuren.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Afgewezen ↔ geprezen</text><text x="68" y="774" class="body">Om Mensenzoon, profeten; algemene lof</text><text x="68" y="817" class="body">en valse profeten.</text><text x="46" y="910" class="note">Uitspraken uit de toespraak; geen individuele</text><text x="46" y="946" class="note">levensvoorspellingen toegevoegd.</text></svg>