<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">De rijke man en Lazarus</title><desc id="desc">De rijke man en Lazarus met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De rijke man en Lazarus</text><text x="44" y="113" class="ref">Lukas 16:19–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tijdens het leven · 19–21</text><text x="68" y="241" class="body">Rijke in overvloed; Lazarus bij de</text><text x="68" y="284" class="body">poort verlangt naar kruimels.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Na de dood · 22–26</text><text x="68" y="433" class="body">Lazarus getroost bij Abraham, rijke</text><text x="68" y="476" class="body">gekweld; kloof niet over te steken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vraag · 27–31</text><text x="68" y="625" class="body">Vijf broers waarschuwen; luisteren naar</text><text x="68" y="668" class="body">Mozes en profeten.</text><text x="46" y="761" class="note">Tekstschema bij Jezus’ verhaal; geen kaart van</text><text x="46" y="797" class="note">het hiernamaals.</text></svg>