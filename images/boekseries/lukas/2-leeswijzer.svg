<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Geboorte, tempel en groei</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geboorte, tempel en groei</text><text x="44" y="113" class="ref">Lukas 2:1–52</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bethlehem · 1–20</text><text x="68" y="241" class="body">Registratie, Jozef en Maria; kind in</text><text x="68" y="284" class="body">doeken en voederbak, engelen en</text><text x="68" y="327" class="body">herders.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Opdracht · 21–40</text><text x="68" y="476" class="body">Naam op achtste dag; twee duiven,</text><text x="68" y="519" class="body">Simeon en Anna; terug naar Nazareth en</text><text x="68" y="562" class="body">groei.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Twaalf jaar · 41–52</text><text x="68" y="711" class="body">Pascha, zoeken en leraren; na drie</text><text x="68" y="754" class="body">dagen gevonden, terug en gehoorzaam;</text><text x="68" y="797" class="body">wijsheid groeit.</text><text x="46" y="890" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="926" class="note">de plaatselijke versindeling.</text></svg>