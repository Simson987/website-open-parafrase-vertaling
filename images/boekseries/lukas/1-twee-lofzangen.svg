<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">De twee lofzangen</title><desc id="desc">De twee lofzangen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee lofzangen</text><text x="44" y="113" class="ref">Lukas 1:46–55 en 67–79</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Maria · 46–55</text><text x="68" y="241" class="body">Eigen vreugde; heiligheid,</text><text x="68" y="284" class="body">barmhartigheid, hoogmoedigen en</text><text x="68" y="327" class="body">nederigen, Israël en Abraham.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zacharias · 67–75</text><text x="68" y="476" class="body">Bevrijding, huis van David, profeten,</text><text x="68" y="519" class="body">verbond en eed aan Abraham; zonder</text><text x="68" y="562" class="body">angst dienen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het kind · 76–79</text><text x="68" y="711" class="body">Voorbereiden, vergeving, barmhartigheid</text><text x="68" y="754" class="body">en licht dat naar vrede leidt.</text><text x="46" y="847" class="note">Dit is de opbouw van twee uitspraken, geen extra</text><text x="46" y="883" class="note">historische scène.</text></svg>