<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Horen, vertrouwen en redding</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Horen, vertrouwen en redding</text><text x="44" y="113" class="ref">Lukas 8:1–56</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Reizen en luisteren · 1–21</text><text x="68" y="241" class="body">Twaalf en ondersteunende vrouwen;</text><text x="68" y="284" class="body">zaaier, lamp en familie.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Overkant · 22–39</text><text x="68" y="433" class="body">Storm, Gadarenen, bevrijde man gekleed</text><text x="68" y="476" class="body">en terug naar huis vertellen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Terug · 40–56</text><text x="68" y="625" class="body">Jaïrus, vrouw met twaalf jaar lijden en</text><text x="68" y="668" class="body">dochter van ongeveer twaalf; hand,</text><text x="68" y="711" class="body">opstaan en eten.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>