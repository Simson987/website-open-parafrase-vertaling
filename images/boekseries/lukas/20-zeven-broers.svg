<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">De vraag over zeven broers</title><desc id="desc">De vraag over zeven broers met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vraag over zeven broers</text><text x="44" y="113" class="ref">Lukas 20:27–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Casus · 28–33</text><text x="68" y="241" class="body">Zeven broers achtereen getrouwd met</text><text x="68" y="284" class="body">dezelfde vrouw; allen kinderloos en</text><text x="68" y="327" class="body">gestorven, daarna de vrouw.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Antwoord · 34–36</text><text x="68" y="476" class="body">In de opstanding niet trouwen en niet</text><text x="68" y="519" class="body">meer sterven; als engelen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Mozes · 37–38</text><text x="68" y="668" class="body">God van Abraham, Izak en Jakob; God van</text><text x="68" y="711" class="body">levenden.</text><text x="46" y="804" class="note">Een hypothetische vraag, geen historische</text><text x="46" y="840" class="note">stamboom; mensen worden niet engelen genoemd.</text></svg>