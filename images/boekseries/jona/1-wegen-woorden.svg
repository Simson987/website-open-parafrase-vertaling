<svg xmlns="http://www.w3.org/2000/svg" width="840" height="722" viewBox="0 0 840 722"><title>Opdracht en gevaren route</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="722" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Opdracht en gevaren route</text><text x="42" y="105" font-size="25">Jona 1:1–3; 3:1–3</text><rect x="150" y="155" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="191" text-anchor="middle" font-size="31">Opdracht: ga naar Ninevé</text><path d="M420 209 V229" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="235" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="271" text-anchor="middle" font-size="31">Vlucht: naar Jafo</text><path d="M420 289 V309" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="315" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="351" text-anchor="middle" font-size="31">Betaalde overtocht naar Tarsis</text><path d="M420 369 V389" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="395" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="431" text-anchor="middle" font-size="31">Tweede opdracht: naar Ninevé</text><path d="M420 449 V469" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="475" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="511" text-anchor="middle" font-size="31">Jona gaat nu naar Ninevé</text><text x="42" y="575" font-size="26">Dit is de tekstuele volgorde van opdracht en</text><text x="42" y="609" font-size="26">reactie, geen schaalkaart. De locatie van Tarsis</text><text x="42" y="643" font-size="26">is niet ingevuld.</text></g></svg>