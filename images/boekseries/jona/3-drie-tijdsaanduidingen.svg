<svg xmlns="http://www.w3.org/2000/svg" width="840" height="856" viewBox="0 0 840 856" role="img" aria-labelledby="title desc"><title id="title">Drie verschillende tijdwoorden</title><desc id="desc">Stadsomvang, afgelegde weg en boodschapstermijn onderscheiden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="856" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie verschillende tijdwoorden</text><text x="44" y="113" class="ref">Jona 3:3–4</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie dagreizen · 3</text><text x="68" y="241" class="body">De gegeven omvang van de geweldig grote</text><text x="68" y="284" class="body">stad.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eén dagreis · 4</text><text x="68" y="433" class="body">Hoe ver Jona de stad begon in te gaan.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Nog veertig dagen · 4</text><text x="68" y="582" class="body">Het tijdwoord in zijn aangekondigde</text><text x="68" y="625" class="body">boodschap.</text><text x="46" y="718" class="note">De drie verschillende uitspraken worden niet</text><text x="46" y="754" class="note">opgeteld of omgerekend tot een plattegrond of</text><text x="46" y="790" class="note">een moderne kalenderdatum.</text></svg>