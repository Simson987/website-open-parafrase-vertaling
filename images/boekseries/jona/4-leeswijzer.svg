<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Boosheid en medelijden</title><desc id="desc">De herhaalde vraag en de verhouding tussen plant en grote stad.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boosheid en medelijden</text><text x="44" y="113" class="ref">Jona 4:1–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jona’s bezwaar · 1–4</text><text x="68" y="241" class="body">Boos en verdrietig, bekende genade als</text><text x="68" y="284" class="body">reden voor vlucht, doodswens; is die</text><text x="68" y="327" class="body">boosheid terecht?</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De plant · 5–9</text><text x="68" y="476" class="body">Ten oosten van stad, afdak en plant,</text><text x="68" y="519" class="body">blijdschap; worm, verdorren, oostenwind</text><text x="68" y="562" class="body">en nieuwe boosheid.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De slotvraag · 10–11</text><text x="68" y="711" class="body">Medelijden met plant zonder eigen</text><text x="68" y="754" class="body">arbeid; waarom geen medelijden met</text><text x="68" y="797" class="body">Ninevé, meer dan 120.000 mensen en veel</text><text x="68" y="840" class="body">vee?</text><text x="46" y="933" class="note">De tekst eindigt met een vraag. Een later</text><text x="46" y="969" class="note">antwoord of bekering van Jona wordt niet</text><text x="46" y="1005" class="note">verzonnen.</text></svg>