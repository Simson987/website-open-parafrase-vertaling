<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Roeping, vlucht en redding</title><desc id="desc">De afzonderlijke handelingen in het hele hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Roeping, vlucht en redding</text><text x="44" y="113" class="ref">Jona 1:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De tegengestelde weg · 1–3</text><text x="68" y="241" class="body">Jona, zoon van Amitthai, naar Ninevé</text><text x="68" y="284" class="body">geroepen; naar Jafo en met betaalde</text><text x="68" y="327" class="body">overtocht richting Tarsis.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Storm en onderzoek · 4–10</text><text x="68" y="476" class="body">Lading overboord, Jona slaapt, kapitein</text><text x="68" y="519" class="body">roept, lot valt op hem, belijdenis over</text><text x="68" y="562" class="body">Schepper van zee en land.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De reactie · 11–17</text><text x="68" y="711" class="body">Jona wil in zee, mannen proberen roeien</text><text x="68" y="754" class="body">en bidden; zee stil,</text><text x="68" y="797" class="body">ontzag/offer/beloften, grote vis en</text><text x="68" y="840" class="body">drie dagen/nachten.</text><text x="46" y="933" class="note">De tekst noemt een grote vis, zonder biologische</text><text x="46" y="969" class="note">soort. De betaald gevaren route is geen modern</text><text x="46" y="1005" class="note">geografisch bewijs voor Tarsis.</text></svg>