<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Het gebed en het droge land</title><desc id="desc">Het verloop van roepen via herinneren naar dank en concrete redding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het gebed en het droge land</text><text x="44" y="113" class="ref">Jona 2:1–10</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Roepen en gehoord · 1–2</text><text x="68" y="241" class="body">Gebed uit buik van vis; nood en buik</text><text x="68" y="284" class="body">van dodenrijk, Hij antwoordde en</text><text x="68" y="327" class="body">hoorde.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Diepte en herinnering · 3–7</text><text x="68" y="476" class="body">Golven, weggestoten, toch tempel zien,</text><text x="68" y="519" class="body">water/wier/bergen/grendels; leven uit</text><text x="68" y="562" class="body">put en gebed tot tempel.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Dank en antwoord · 8–10</text><text x="68" y="711" class="body">Afgoden tegenover trouw; dankoffer en</text><text x="68" y="754" class="body">belofte, redding van Hem; vis spuwt</text><text x="68" y="797" class="body">Jona op land.</text><text x="46" y="890" class="note">Het dodenrijk en de grendels staan in het gebed.</text><text x="46" y="926" class="note">De beeldtaal is geen beschrijving van een</text><text x="46" y="962" class="note">letterlijk onderzees gebouw.</text></svg>