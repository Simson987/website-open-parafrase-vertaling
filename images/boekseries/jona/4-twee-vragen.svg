<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De herhaalde vraag en het slot</title><desc id="desc">De twee boosheidsvragen en de afsluitende vergelijking.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De herhaalde vraag en het slot</text><text x="44" y="113" class="ref">Jona 4:4–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste vraag · 4</text><text x="68" y="241" class="body">Is het terecht dat je boos bent?</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tweede vraag · 9</text><text x="68" y="390" class="body">Is het terecht dat je boos bent om die</text><text x="68" y="433" class="body">plant? Jona zegt van wel.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De plant · 10</text><text x="68" y="582" class="body">Geen eigen werk of groei; in één nacht</text><text x="68" y="625" class="body">opgekomen en vergaan.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Ninevé · 11</text><text x="68" y="774" class="body">Meer dan 120.000 mensen die</text><text x="68" y="817" class="body">rechts/links niet onderscheiden, ook</text><text x="68" y="860" class="body">veel vee: geen medelijden?</text><text x="46" y="953" class="note">De plaatselijke tekst noemt mensen. Dit getal</text><text x="46" y="989" class="note">wordt niet zonder tekstbasis tot alleen baby’s</text><text x="46" y="1025" class="note">of kinderen beperkt.</text></svg>