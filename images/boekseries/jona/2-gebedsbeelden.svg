<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De beelden in het gebed</title><desc id="desc">De eigen beeldspraak en de wending van het gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De beelden in het gebed</text><text x="44" y="113" class="ref">Jona 2:2–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nood en diepte · 2–3</text><text x="68" y="241" class="body">Buik van dodenrijk, hart van zee,</text><text x="68" y="284" class="body">stroom, golven en baren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verwijdering en hoop · 4–5</text><text x="68" y="433" class="body">Weggestoten, toch tempel weer zien;</text><text x="68" y="476" class="body">water tot keel en wier rond hoofd.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Omsloten en omhoog · 6–7</text><text x="68" y="625" class="body">Voet van bergen, grendels van aarde;</text><text x="68" y="668" class="body">leven uit put opgehaald, gebed in</text><text x="68" y="711" class="body">tempel.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het slot · 8–9</text><text x="68" y="860" class="body">Trouw tegenover afgoden, dank en</text><text x="68" y="903" class="body">belofte; redding komt van de HEERE.</text><text x="46" y="996" class="note">De vergelijkingen blijven aan het gebed</text><text x="46" y="1032" class="note">gekoppeld en worden niet als extra historische</text><text x="46" y="1068" class="note">locaties getekend.</text></svg>