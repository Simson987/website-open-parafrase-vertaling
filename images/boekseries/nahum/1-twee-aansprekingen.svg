<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Toevlucht en einde van de macht</title><desc id="desc">De eigen richting van de verschillende uitspraken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toevlucht en einde van de macht</text><text x="44" y="113" class="ref">Nahum 1:7–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie vertrouwen · 7</text><text x="68" y="241" class="body">Hij is goed, een vesting op benauwde</text><text x="68" y="284" class="body">dag, kent hen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wie kwaad bedenken · 8–11</text><text x="68" y="433" class="body">Vloed en duisternis, einde van nood,</text><text x="68" y="476" class="body">doornen en stoppels; raadsman van</text><text x="68" y="519" class="body">kwaad.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vernederd volk · 12–13</text><text x="68" y="668" class="body">Niet meer vernederen, juk breken en</text><text x="68" y="711" class="body">ketenen verscheuren.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Naam en beelden · 14</text><text x="68" y="860" class="body">Naam niet voortgezet, afgoden weg en</text><text x="68" y="903" class="body">graf.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Juda · 15</text><text x="68" y="1052" class="body">Vredeboodschap, feesten en beloften;</text><text x="68" y="1095" class="body">kwaad zal niet meer doorheen trekken.</text><text x="46" y="1188" class="note">De verschillende aangesprokenen blijven</text><text x="46" y="1224" class="note">onderscheiden. Geen niet genoemde koningsnaam of</text><text x="46" y="1260" class="note">moderne gebeurtenis is ingevuld.</text></svg>