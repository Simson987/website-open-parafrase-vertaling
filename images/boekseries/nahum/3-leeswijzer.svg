<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1342" viewBox="0 0 840 1342" role="img" aria-labelledby="title desc"><title id="title">De stad en haar einde</title><desc id="desc">Alle grote onderdelen van de aanklacht en de afloop.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1342" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De stad en haar einde</text><text x="44" y="113" class="ref">Nahum 3:1–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanklacht en schande · 1–7</text><text x="68" y="241" class="body">Bloedstad, leugen/roof en strijd;</text><text x="68" y="284" class="body">verleidelijke stad als beeld,</text><text x="68" y="327" class="body">ontmaskering en geen trooster.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vergelijking met No · 8–11</text><text x="68" y="476" class="body">Waterbescherming en sterke helpers</text><text x="68" y="519" class="body">voorkwamen ballingschap niet; ook</text><text x="68" y="562" class="body">Ninevé zoekt schuilplaats.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het falen van bescherming · 12–17</text><text x="68" y="711" class="body">Vestingen als vijgen, open poorten;</text><text x="68" y="754" class="body">water/leem/steenvorm, vuur;</text><text x="68" y="797" class="body">handelaars/wachters/ambtenaren als</text><text x="68" y="840" class="body">wegvliegende sprinkhanen.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Het laatste woord · 18–19</text><text x="68" y="989" class="body">Herders slapen, volk verspreid zonder</text><text x="68" y="1032" class="body">verzamelaar; ongenezen wond en reactie</text><text x="68" y="1075" class="body">op aanhoudend kwaad.</text><text x="46" y="1168" class="note">De vrouwelijke stadspersonificatie wordt</text><text x="46" y="1204" class="note">inhoudelijk weergegeven zonder seksuele</text><text x="46" y="1240" class="note">vernedering te tekenen; het kindergeweld wordt</text><text x="46" y="1276" class="note">niet verbeeld.</text></svg>