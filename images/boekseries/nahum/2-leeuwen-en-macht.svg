<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Het hol en de verdwenen macht</title><desc id="desc">De drie stappen van de expliciete leeuwenvergelijking.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het hol en de verdwenen macht</text><text x="44" y="113" class="ref">Nahum 2:11–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vroegere zekerheid · 11</text><text x="68" y="241" class="body">Leeuw, leeuwin en welp, niemand joeg</text><text x="68" y="284" class="body">schrik aan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vroegere roof · 12</text><text x="68" y="433" class="body">Genoeg prooi voor welpen/leeuwinnen,</text><text x="68" y="476" class="body">holen en legers met buit gevuld.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het tegengestelde slot · 13</text><text x="68" y="625" class="body">Hij keert zich tegen haar: wagens in</text><text x="68" y="668" class="body">rook, jonge leeuwen getroffen, buit weg</text><text x="68" y="711" class="body">en stem van gezanten niet meer.</text><text x="46" y="804" class="note">Het schema houdt dierenbeeld en politieke</text><text x="46" y="840" class="note">gevolgen in hetzelfde verband; dierenleed hoeft</text><text x="46" y="876" class="note">niet als eigen gebeurtenis te worden afgebeeld.</text></svg>