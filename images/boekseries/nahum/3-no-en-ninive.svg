<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">No en Ninevé vergeleken</title><desc id="desc">De genoemde helpers en het uitgesproken vergelijkingsargument.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">No en Ninevé vergeleken</text><text x="44" y="113" class="ref">Nahum 3:8–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De plaats No · 8</text><text x="68" y="241" class="body">Stad aan rivieren, door water omringd;</text><text x="68" y="284" class="body">water als muur.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De helpers · 9</text><text x="68" y="433" class="body">Ethiopië en Egypte als kracht; Put en</text><text x="68" y="476" class="body">Libië hielpen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Toch weggevoerd · 10</text><text x="68" y="625" class="body">Ballingschap, verlies en aanzienlijken</text><text x="68" y="668" class="body">geboeid.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vraag aan Ninevé · 8,11–14</text><text x="68" y="817" class="body">Ben jij beter? Ook schuilplaats zoeken;</text><text x="68" y="860" class="body">vestingen als rijpe vijgen, poorten</text><text x="68" y="903" class="body">open, water en klei klaarzetten.</text><text x="46" y="996" class="note">De tekstuele plaatsnaam No blijft staan;</text><text x="46" y="1032" class="note">waterbescherming en bondgenoten worden niet tot</text><text x="46" y="1068" class="note">een onbewijsbare nieuwe plattegrond gemaakt.</text></svg>