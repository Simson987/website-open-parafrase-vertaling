<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Ninevé leeg en zonder stem</title><desc id="desc">De aanval, leegte en slotvergelijking met gegeven uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ninevé leeg en zonder stem</text><text x="44" y="113" class="ref">Nahum 2:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanval · 1–6</text><text x="68" y="241" class="body">Vestingen bewaken, Jakob hersteld; rode</text><text x="68" y="284" class="body">schilden, wagens, muur/stormdak,</text><text x="68" y="327" class="body">rivierpoorten en paleis weg.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De leegte · 7–10</text><text x="68" y="476" class="body">Wegvoering en duivenklacht, mensen</text><text x="68" y="519" class="body">vluchten, zilver/goud geroofd, angst en</text><text x="68" y="562" class="body">leegplundering.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De leeuwenvraag · 11–13</text><text x="68" y="711" class="body">Waar het hol en de veilige welpen?</text><text x="68" y="754" class="body">Vroegere roof tegenover wagens in rook,</text><text x="68" y="797" class="body">buit weg en geen gezantenstem.</text><text x="46" y="890" class="note">Het leeuwenbeeld is een vergelijking van macht</text><text x="46" y="926" class="note">en roof. Het is geen verhaal over een dierentuin</text><text x="46" y="962" class="note">of een letterlijk gevecht tussen leeuwen.</text></svg>