<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Oordeel en toevlucht</title><desc id="desc">De volledige beweging van macht en oordeel naar vredewoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oordeel en toevlucht</text><text x="44" y="113" class="ref">Nahum 1:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De last en Zijn macht · 1–6</text><text x="68" y="241" class="body">Ninevé, Nahum uit Elkos; geduld en</text><text x="68" y="284" class="body">gericht, storm, droge zee/rivieren,</text><text x="68" y="327" class="body">verwelkende streken en beven.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Twee uitkomsten · 7–11</text><text x="68" y="476" class="body">Goed en vesting voor vertrouwenden;</text><text x="68" y="519" class="body">vloed en duisternis tegen vijanden,</text><text x="68" y="562" class="body">kwaadplan en droge stoppels.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bevrijding en gericht · 12–15</text><text x="68" y="711" class="body">Sterke talrijke macht afgesneden;</text><text x="68" y="754" class="body">juk/ketenen breken, beelden weg en naam</text><text x="68" y="797" class="body">eindigt; vredeboodschap en Juda’s</text><text x="68" y="840" class="body">feesten.</text><text x="46" y="933" class="note">De goede toevlucht en het ernstige oordeel staan</text><text x="46" y="969" class="note">beide in de passage. De wolkenbeeldspraak is</text><text x="46" y="1005" class="note">geen letterlijk godenlichaam.</text></svg>