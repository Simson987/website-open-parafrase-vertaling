<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Drie namen bij het geloof</title><desc id="desc">Drie namen bij het geloof met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie namen bij het geloof</text><text x="44" y="113" class="ref">2 Timotheüs 1:5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Loïs</text><text x="68" y="241" class="body">De grootmoeder van Timotheüs; oprecht</text><text x="68" y="284" class="body">geloof woonde in haar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eunice</text><text x="68" y="433" class="body">De moeder van Timotheüs; ook in haar</text><text x="68" y="476" class="body">woonde dit geloof.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Timotheüs</text><text x="68" y="625" class="body">Paulus is ervan overtuigd dat het</text><text x="68" y="668" class="body">geloof ook in hem woont.</text><text x="46" y="761" class="note">De familierollen volgen precies de relaties die</text><text x="46" y="797" class="note">dit vers noemt.</text></svg>