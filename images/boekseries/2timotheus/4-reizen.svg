<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Wie gaat waarheen?</title><desc id="desc">Wie gaat waarheen? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie gaat waarheen?</text><text x="44" y="113" class="ref">2 Timotheüs 4:9–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Demas, Krescens en Titus</text><text x="68" y="241" class="body">Naar Tessalonica, Galatië en Dalmatië.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tychikus en Markus</text><text x="68" y="390" class="body">Tychikus is naar Efeze gestuurd; Markus</text><text x="68" y="433" class="body">moet meekomen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Karpus in Troas</text><text x="68" y="582" class="body">Daar zijn de reismantel, boeken en</text><text x="68" y="625" class="body">vooral perkamenten.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Erastus en Trofimus</text><text x="68" y="774" class="body">Erastus bleef in Korinthe; Trofimus</text><text x="68" y="817" class="body">bleef ziek achter in Milete.</text><text x="46" y="910" class="note">Paulus vraagt Timotheüs snel, vóór de winter, te</text><text x="46" y="946" class="note">komen; alleen Lukas is bij hem.</text></svg>