<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Soldaat, atleet en boer</title><desc id="desc">Soldaat, atleet en boer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Soldaat, atleet en boer</text><text x="44" y="113" class="ref">2 Timotheüs 2:3–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Soldaat · vers 3–4</text><text x="68" y="241" class="body">Lijdt mee en wil zijn bevelhebber</text><text x="68" y="284" class="body">behagen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Atleet · vers 5</text><text x="68" y="433" class="body">Ontvangt de krans als hij volgens de</text><text x="68" y="476" class="body">regels strijdt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Boer · vers 6</text><text x="68" y="625" class="body">Werkt hard en krijgt als eerste van de</text><text x="68" y="668" class="body">vruchten.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nadenken · vers 7</text><text x="68" y="817" class="body">De Heere zal inzicht geven.</text><text x="46" y="910" class="note">Het zijn drie vergelijkingen voor de dienst,</text><text x="46" y="946" class="note">geen drie beroepen van Timotheüs.</text></svg>