<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Waartoe de Schrift toerust</title><desc id="desc">Waartoe de Schrift toerust met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waartoe de Schrift toerust</text><text x="44" y="113" class="ref">2 Timotheüs 3:14–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onderwijzen</text><text x="68" y="241" class="body">De waarheid leren.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Weerleggen</text><text x="68" y="390" class="body">Het onjuiste aan het licht brengen.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Verbeteren</text><text x="68" y="539" class="body">Weer op de goede weg helpen.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Opvoeden</text><text x="68" y="688" class="body">Oefenen in de gerechtigheid voor elk</text><text x="68" y="731" class="body">goed werk.</text><text x="46" y="824" class="note">De vier functies staan in vers 16; het doel</text><text x="46" y="860" class="note">staat in vers 17.</text></svg>