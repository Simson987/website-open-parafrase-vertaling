<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Een onvoltooide lijst</title><desc id="desc">Een onvoltooide lijst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een onvoltooide lijst</text><text x="44" y="113" class="ref">3 Makkabeeën 4:10–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De opdracht</text><text x="68" y="241" class="body">De koning wil het gehele Joodse volk</text><text x="68" y="284" class="body">met namen registreren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het werk</text><text x="68" y="433" class="body">Van zonsopgang tot zonsondergang,</text><text x="68" y="476" class="body">gedurende 40 dagen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De belemmering</text><text x="68" y="625" class="body">Velen bevinden zich nog elders;</text><text x="68" y="668" class="body">benodigd papier en pennen zijn op.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De betekenis</text><text x="68" y="817" class="body">De verteller ziet hierin hemelse hulp</text><text x="68" y="860" class="body">door Gods voorzienigheid.</text><text x="46" y="953" class="note">Veertig dagen is de beschreven duur van het</text><text x="46" y="989" class="note">inschrijven, geen afgeronde telling van alle</text><text x="46" y="1025" class="note">personen.</text></svg>