<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Vertrek en herstel</title><desc id="desc">Vertrek en herstel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vertrek en herstel</text><text x="44" y="113" class="ref">3 Makkabeeën 7:8–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verzoek · 8–10</text><text x="68" y="241" class="body">Toestemming om bewust afvalligen te</text><text x="68" y="284" class="body">straffen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De zware passage · 11–14</text><text x="68" y="433" class="body">Ruim 300 medeburgers worden gedood; het</text><text x="68" y="476" class="body">verhaal vermeldt ook lof en vertrek.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ptolemaïs · 15–17</text><text x="68" y="625" class="body">Wachtende vloot, zeven dagen maaltijd,</text><text x="68" y="668" class="body">herdenking en gedenkzuil.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Thuis · 17–19</text><text x="68" y="817" class="body">Terugkeer over verschillende wegen en</text><text x="68" y="860" class="body">teruggave van bezit volgens de</text><text x="68" y="903" class="body">inschrijving.</text><text x="46" y="996" class="note">De tekst bevat na de vrijspraak ook geweld</text><text x="46" y="1032" class="note">binnen de gemeenschap. De leeswijzer laat dit</text><text x="46" y="1068" class="note">niet weg en toont het zonder gruwelijke</text><text x="46" y="1104" class="note">afbeelding.</text></svg>