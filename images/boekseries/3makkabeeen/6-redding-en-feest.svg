<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Redding en feest</title><desc id="desc">Redding en feest met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Redding en feest</text><text x="44" y="113" class="ref">3 Makkabeeën 6:15–34</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verschijning · 15–19</text><text x="68" y="241" class="body">Twee engelen, gezien door allen behalve</text><text x="68" y="284" class="body">de Joden; de legermacht raakt verward</text><text x="68" y="327" class="body">en de dieren keren om.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De omkeer · 20–26</text><text x="68" y="476" class="body">De koning huilt, verwijt zijn vrienden</text><text x="68" y="519" class="body">de vervolging en beveelt vrijlating.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De maaltijd · 27–32</text><text x="68" y="668" class="body">Zeven dagen voorzieningen; de plaats</text><text x="68" y="711" class="body">van dreigende dood wordt een plaats van</text><text x="68" y="754" class="body">dank.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De herinnering · 33–34</text><text x="68" y="903" class="body">Jaarlijkse vreugdedagen om verlossing;</text><text x="68" y="946" class="body">daarna verzoek om huiswaarts te gaan.</text><text x="46" y="1039" class="note">Het schema bewaart het bijzondere gezichtspunt:</text><text x="46" y="1075" class="note">de Joden zelf zien de twee engelen niet.</text></svg>