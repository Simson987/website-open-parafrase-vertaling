<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De koninklijke brief</title><desc id="desc">De koninklijke brief met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De koninklijke brief</text><text x="44" y="113" class="ref">3 Makkabeeën 3:9–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afzender en ontvangers · 9</text><text x="68" y="241" class="body">Ptolemeüs Filopator aan stadhouders en</text><text x="68" y="284" class="body">soldaten in Egypte en andere gebieden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zelfrechtvaardiging · 10–17</text><text x="68" y="433" class="body">De koning stelt zijn bezoek als weldaad</text><text x="68" y="476" class="body">voor en beschuldigt de Joden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het bevel · 18–20</text><text x="68" y="625" class="body">Wegvoering van hele gezinnen en</text><text x="68" y="668" class="body">bestraffing van beschermers.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Beloning en dreiging · 21–22</text><text x="68" y="817" class="body">Aangevers krijgen bezit en 2.000</text><text x="68" y="860" class="body">zilveren drachmen; schuilplaatsen</text><text x="68" y="903" class="body">worden met verwoesting bedreigd.</text><text x="46" y="996" class="note">Dit is de vervolgingsbrief van de koning. De</text><text x="46" y="1032" class="note">vijandige typeringen zijn geciteerde</text><text x="46" y="1068" class="note">beschuldigingen, geen oordeel van de leeswijzer.</text></svg>