<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wegvoering en inschrijving</title><desc id="desc">Wegvoering en inschrijving met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wegvoering en inschrijving</text><text x="44" y="113" class="ref">3 Makkabeeën 4:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De reacties · 1–4</text><text x="68" y="241" class="body">Vijandige vreugde tegenover rouw; zelfs</text><text x="68" y="284" class="body">sommige vijanden krijgen medelijden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De tocht · 5–9</text><text x="68" y="433" class="body">Ouderen, pasgehuwden, gedwongen</text><text x="68" y="476" class="body">overtocht en opsluiting op het renveld.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De uitbreiding · 10–12</text><text x="68" y="625" class="body">Ook meelevende stadsgenoten worden</text><text x="68" y="668" class="body">bedreigd; registratie blijft na 40</text><text x="68" y="711" class="body">dagen onvoltooid.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De grens · 13–16</text><text x="68" y="860" class="body">Papier en pennen raken op; de verteller</text><text x="68" y="903" class="body">duidt dat als voorzienigheid.</text><text x="46" y="996" class="note">De vernederende wegvoering wordt zonder</text><text x="46" y="1032" class="note">grafische behandeling van gevangenen samengevat.</text></svg>