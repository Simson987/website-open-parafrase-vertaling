<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Dagen van registratie en redding</title><desc id="desc">Dagen van registratie en redding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dagen van registratie en redding</text><text x="44" y="113" class="ref">3 Makkabeeën 6:35–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Registratie</text><text x="68" y="241" class="body">25 Pachon tot 4 Epif; de tekst noemt 40</text><text x="68" y="284" class="body">dagen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bedreiging</text><text x="68" y="433" class="body">5 tot 7 Epif; drie dagen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Redding en maaltijd</text><text x="68" y="582" class="body">Allen ongedeerd verlost; de</text><text x="68" y="625" class="body">maaltijdvoorziening duurt tot de 14e.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Vertrekverzoek</text><text x="68" y="774" class="body">Op die dag spreken zij de koning; hij</text><text x="68" y="817" class="body">schrijft aan de stadhouders.</text><text x="46" y="910" class="note">Maandnamen en duur zijn uit de tekst</text><text x="46" y="946" class="note">overgenomen, zonder omrekening naar een moderne</text><text x="46" y="982" class="note">kalender.</text></svg>