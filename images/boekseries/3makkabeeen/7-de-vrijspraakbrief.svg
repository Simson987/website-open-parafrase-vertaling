<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">De vrijspraakbrief</title><desc id="desc">De vrijspraakbrief met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vrijspraakbrief</text><text x="44" y="113" class="ref">3 Makkabeeën 7:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afzender en ontvangers · 1</text><text x="68" y="241" class="body">Ptolemeüs Filopator aan stadhouders en</text><text x="68" y="284" class="body">bestuurders in Egypte.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De terugblik · 2–4</text><text x="68" y="433" class="body">De brief legt het initiatief bij</text><text x="68" y="476" class="body">vrienden en noemt de behandeling</text><text x="68" y="519" class="body">onrechtvaardig.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De vrijspraak · 5–6</text><text x="68" y="668" class="body">Alle beschuldigingen vervallen;</text><text x="68" y="711" class="body">terugkeer naar eigen bezit en</text><text x="68" y="754" class="body">bescherming.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De waarschuwing · 7</text><text x="68" y="903" class="body">Wie kwaad doet krijgt volgens de brief</text><text x="68" y="946" class="body">de allerhoogste God tegenover zich.</text><text x="46" y="1039" class="note">De koning spreekt hier over zijn vrienden;</text><text x="46" y="1075" class="note">eerdere hoofdstukken hebben ook zijn eigen</text><text x="46" y="1111" class="note">bevelen verteld.</text></svg>