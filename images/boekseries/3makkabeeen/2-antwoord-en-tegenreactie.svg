<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Antwoord en tegenreactie</title><desc id="desc">Antwoord en tegenreactie met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Antwoord en tegenreactie</text><text x="44" y="113" class="ref">3 Makkabeeën 2:16–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het antwoord · 16–18</text><text x="68" y="241" class="body">De koning wordt machteloos, naar buiten</text><text x="68" y="284" class="body">gedragen en vertrekt zonder berouw.</text><rect x="42" y="342" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het besluit · 19–22</text><text x="68" y="433" class="body">In Egypte volgen registratie,</text><text x="68" y="476" class="body">vernedering en voorwaardelijk</text><text x="68" y="519" class="body">burgerrecht bij deelname aan</text><text x="68" y="562" class="body">Bacchusdienst.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De reacties · 23–25</text><text x="68" y="711" class="body">Enkelen stemmen in; de meesten blijven</text><text x="68" y="754" class="body">standvastig en proberen zich met geld</text><text x="68" y="797" class="body">van inschrijving te bevrijden.</text><text x="46" y="890" class="note">Het beloofde burgerrecht is voorwaardelijk; de</text><text x="46" y="926" class="note">tekst vertelt geen algemene vrije keuze.</text></svg>