<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Eleazars herinneringen</title><desc id="desc">Eleazars herinneringen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eleazars herinneringen</text><text x="44" y="113" class="ref">3 Makkabeeën 6:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het volk · 1–2</text><text x="68" y="241" class="body">Ouderen bidden met Eleazar, priester</text><text x="68" y="284" class="body">van het land, voor Abrahams nageslacht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vroegere reddingen · 3–6</text><text x="68" y="433" class="body">Farao, Sanherib, de drie vrienden,</text><text x="68" y="476" class="body">Daniël en Jona worden herinnerd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De bede · 7–12</text><text x="68" y="625" class="body">Vraag om bescherming, ontferming en</text><text x="68" y="668" class="body">behoud in vreemdelingschap.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De belofte · 13–14</text><text x="68" y="817" class="body">Kinderen en ouders smeken: laat blijken</text><text x="68" y="860" class="body">dat God hen niet verlaat.</text><text x="46" y="953" class="note">Dit is een eigen priester Eleazar in dit</text><text x="46" y="989" class="note">verhaal; hij wordt niet vereenzelvigd met</text><text x="46" y="1025" class="note">Eleazar uit 2 Makkabeeën 6.</text></svg>