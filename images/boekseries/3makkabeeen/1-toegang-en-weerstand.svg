<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Toegang en weerstand</title><desc id="desc">Toegang en weerstand met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toegang en weerstand</text><text x="44" y="113" class="ref">3 Makkabeeën 1:11–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De tempelregel · 11</text><text x="68" y="241" class="body">Niet alle priesters en niet het hele</text><text x="68" y="284" class="body">volk; slechts de hogepriester, eenmaal</text><text x="68" y="327" class="body">per jaar.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De koning · 12–13,22</text><text x="68" y="476" class="body">Meent zelf recht te hebben en zet door.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Raad en oudsten · 19–21</text><text x="68" y="625" class="body">Kalmeren de oproep tot wapens en zoeken</text><text x="68" y="668" class="body">overreding.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De gemeenschap · 14–18,23–25</text><text x="68" y="817" class="body">Priesters, inwoners en zelfs</text><text x="68" y="860" class="body">koninklijke begeleiders zoeken hulp in</text><text x="68" y="903" class="body">gebed.</text><text x="46" y="996" class="note">De dreigende ontwijding is de kern; de opsomming</text><text x="46" y="1032" class="note">onderscheidt de verschillende reacties.</text></svg>