<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Drie uitgestelde bevelen</title><desc id="desc">Drie uitgestelde bevelen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie uitgestelde bevelen</text><text x="44" y="113" class="ref">3 Makkabeeën 5:1–31</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste voorbereiding · 1–13</text><text x="68" y="241" class="body">500 olifanten worden klaargemaakt;</text><text x="68" y="284" class="body">diepe slaap verijdelt het voorgenomen</text><text x="68" y="327" class="body">uur.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tweede voorbereiding · 14–23</text><text x="68" y="476" class="body">De koning is zijn bevel vergeten,</text><text x="68" y="519" class="body">prijst de trouw van de Joden en</text><text x="68" y="562" class="body">bedreigt Hermon.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Derde bevel · 24–31</text><text x="68" y="711" class="body">Verwanten wijzen op de wisselingen;</text><text x="68" y="754" class="body">nieuwe eed en uiteindelijke uittocht</text><text x="68" y="797" class="body">naar het renveld.</text><text x="46" y="890" class="note">De drie fasen worden onderscheiden; de</text><text x="46" y="926" class="note">beschreven drankvoorbereiding is geen</text><text x="46" y="962" class="note">handleiding voor dierenbehandeling.</text></svg>