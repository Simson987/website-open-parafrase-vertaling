<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Gebed tussen de bevelen</title><desc id="desc">Gebed tussen de bevelen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed tussen de bevelen</text><text x="44" y="113" class="ref">3 Makkabeeën 5:3–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Benauwdheid · 3–5</text><text x="68" y="241" class="body">Boeien en bedreiging; allen roepen God</text><text x="68" y="284" class="body">aan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste uitstel · 8</text><text x="68" y="433" class="body">Lof en een vernieuwde bede na het</text><text x="68" y="476" class="body">aangekondigde uur.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tweede uitstel · 16,23</text><text x="68" y="625" class="body">Tranen en gebed, daarna dank voor de</text><text x="68" y="668" class="body">onverwachte hulp.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Aan het einde · 32–35</text><text x="68" y="817" class="body">Gezinnen omhelzen elkaar, herinneren</text><text x="68" y="860" class="body">vroegere reddingen en smeken</text><text x="68" y="903" class="body">eendrachtig.</text><text x="46" y="996" class="note">De gebeden en dankmomenten lopen tussen de</text><text x="46" y="1032" class="note">koninklijke bevelen door.</text></svg>