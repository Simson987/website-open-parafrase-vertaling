<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Mozes en Aäron bij Farao</title><desc id="desc">Mozes is tachtig en Aäron drieëntachtig. Aäron voert het stafteken uit; Farao blijft weigeren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mozes en Aäron bij Farao</text><text x="44" y="113" class="ref">Exodus 7:1–13</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mozes: 80 jaar</text><text x="68" y="241" class="body">Hij ontvangt wat hij moet zeggen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Aäron: 83 jaar</text><text x="68" y="390" class="body">Hij spreekt tot Farao en werpt zijn</text><text x="68" y="433" class="body">staf neer.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het teken</text><text x="68" y="582" class="body">De vertaling noemt het dier een draak.</text><text x="68" y="625" class="body">Aärons staf verslindt de staven van de</text><text x="68" y="668" class="body">tovenaars.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Farao’s reactie</text><text x="68" y="817" class="body">Zijn hart wordt hard; hij luistert</text><text x="68" y="860" class="body">niet.</text><text x="46" y="953" class="note">Het schema houdt de woordkeus van deze vertaling</text><text x="46" y="989" class="note">aan zonder daar een moderne diersoort uit af te</text><text x="46" y="1025" class="note">leiden.</text></svg>