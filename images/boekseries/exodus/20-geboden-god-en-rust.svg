<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Geboden: God en rust</title><desc id="desc">De eerste onderwerpen zijn trouw aan God, beeldenverering, de naam en de sabbat, na de herinnering aan bevrijding uit Egypte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geboden: God en rust</text><text x="44" y="113" class="ref">Exodus 20:2–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De inleiding</text><text x="68" y="241" class="body">De HEERE heeft Israël uit Egypte, het</text><text x="68" y="284" class="body">slavenhuis, geleid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Trouw aan God</text><text x="68" y="433" class="body">Geen andere goden; geen gesneden</text><text x="68" y="476" class="body">beelden maken om te dienen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De naam</text><text x="68" y="625" class="body">De naam van de HEERE niet misbruiken.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De sabbat</text><text x="68" y="774" class="body">Zes dagen werken; de zevende dag</text><text x="68" y="817" class="body">heiligen als rustdag voor het hele</text><text x="68" y="860" class="body">huishouden, vee en vreemdeling.</text><text x="46" y="953" class="note">De geboden worden hier per onderwerp</text><text x="46" y="989" class="note">gegroepeerd; er wordt geen omstreden nummering</text><text x="46" y="1025" class="note">opgelegd.</text></svg>