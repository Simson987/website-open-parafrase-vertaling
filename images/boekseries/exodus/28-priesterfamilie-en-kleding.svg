<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Priesters en hun kleding</title><desc id="desc">Aäron met Nadab, Abihu, Eleazar en Ithamar; kledingstukken, schouderstenen en belletjes met granaatappels.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Priesters en hun kleding</text><text x="44" y="113" class="ref">Exodus 28:1–14, 31–43</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aäron en zijn vier zonen</text><text x="68" y="241" class="body">Nadab, Abihu, Eleazar en Ithamar dienen</text><text x="68" y="284" class="body">als priesters.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aärons kleding</text><text x="68" y="433" class="body">Borststuk, efod, mantel, geweven</text><text x="68" y="476" class="body">onderkleed, tulband en gordel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Op de schouders</text><text x="68" y="625" class="body">Twee sardonixstenen met elk zes namen</text><text x="68" y="668" class="body">van Israëls zonen, in geboortevolgorde.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Langs de blauwe mantel</text><text x="68" y="817" class="body">Gouden belletjes en granaatappels</text><text x="68" y="860" class="body">wisselen elkaar af.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Voor de zonen</text><text x="68" y="1009" class="body">Onderkleden, gordels en</text><text x="68" y="1052" class="body">hoofdbedekkingen; ook bedekkende linnen</text><text x="68" y="1095" class="body">onderkleding.</text><text x="46" y="1188" class="note">Het overzicht onderscheidt Aärons bijzondere</text><text x="46" y="1224" class="note">kleding van die van zijn zonen.</text></svg>