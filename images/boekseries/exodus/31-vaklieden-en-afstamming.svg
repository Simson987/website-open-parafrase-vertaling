<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">De geroepen vaklieden</title><desc id="desc">Afstamming en taken van Bezaleël en Aholiab, met de andere bekwame vakmensen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De geroepen vaklieden</text><text x="44" y="113" class="ref">Exodus 31:2–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uit de stam Juda</text><text x="68" y="241" class="body">Hur → Uri → Bezaleël.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Uit de stam Dan</text><text x="68" y="390" class="body">Ahisamach → Aholiab.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Bekwaamheid voor het werk</text><text x="68" y="539" class="body">Ontwerpen, metaal, edelstenen, hout en</text><text x="68" y="582" class="body">allerlei vakwerk.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Samen met andere vakmensen</text><text x="68" y="731" class="body">Zij maken tent, voorwerpen, kleding,</text><text x="68" y="774" class="body">zalfolie en reukwerk zoals opgedragen.</text><text x="46" y="867" class="note">Pijlen geven de genoemde vader-kindrelaties</text><text x="46" y="903" class="note">weer; Aholiab is aan Bezaleël toegevoegd als</text><text x="46" y="939" class="note">medewerker.</text></svg>