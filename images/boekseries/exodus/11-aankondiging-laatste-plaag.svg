<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De laatste plaag aangekondigd</title><desc id="desc">Exodus 11 kondigt de laatste plaag, het onderscheid voor Israël en het komende vertrek aan; de uitvoering wordt in Exodus 12 verteld.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De laatste plaag aangekondigd</text><text x="44" y="113" class="ref">Exodus 11:1–10</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat nu wordt gezegd</text><text x="68" y="241" class="body">Mozes kondigt aan dat rond middernacht</text><text x="68" y="284" class="body">alle eerstgeborenen in Egypte zullen</text><text x="68" y="327" class="body">sterven.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Onderscheid voor Israël</text><text x="68" y="476" class="body">God zal verschil maken tussen de</text><text x="68" y="519" class="body">Egyptenaren en de Israëlieten.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Aangekondigd vertrek</text><text x="68" y="668" class="body">Farao’s dienaren zullen vragen om met</text><text x="68" y="711" class="body">het hele volk te vertrekken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De volgende stap in het verhaal</text><text x="68" y="860" class="body">De uitvoering en het daadwerkelijke</text><text x="68" y="903" class="body">vertrek staan in Exodus 12.</text><text x="46" y="996" class="note">Dit hoofdstuk bevat de aankondiging. Het schema</text><text x="46" y="1032" class="note">beeldt geen dood van mensen of dieren af.</text></svg>