<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Mozes en zijn gezin</title><desc id="desc">Jethro komt met Zippora en haar zonen Gersom en Eliëzer naar Mozes, bij de berg van God.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mozes en zijn gezin</text><text x="44" y="113" class="ref">Exodus 18:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jethro</text><text x="68" y="241" class="body">Priester van Midian; schoonvader van</text><text x="68" y="284" class="body">Mozes.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mozes + Zippora</text><text x="68" y="433" class="body">Zippora is Jethro’s dochter en Mozes’</text><text x="68" y="476" class="body">vrouw.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gersom</text><text x="68" y="625" class="body">De naam herinnert aan vreemdeling zijn.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Eliëzer</text><text x="68" y="774" class="body">De naam herinnert aan Gods hulp en</text><text x="68" y="817" class="body">redding van Farao’s zwaard.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De hereniging</text><text x="68" y="966" class="body">Jethro brengt Zippora en haar twee</text><text x="68" y="1009" class="body">zonen naar het kamp bij de berg.</text><text x="46" y="1102" class="note">De namen en de uitleg van de beide zonennamen</text><text x="46" y="1138" class="note">volgen Exodus 18.</text></svg>