<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Manna: verzamelen en rusten</title><desc id="desc">Het weekritme van het manna: één gomer per persoon, op de zesde dag twee, op de zevende dag rust. Een gomer is een tiende efa.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Manna: verzamelen en rusten</text><text x="44" y="113" class="ref">Exodus 16:16–30, 36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gewone dagen</text><text x="68" y="241" class="body">Eén gomer per persoon verzamelen; niets</text><text x="68" y="284" class="body">tot de volgende morgen bewaren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zesde dag</text><text x="68" y="433" class="body">Twee gomers per persoon verzamelen en</text><text x="68" y="476" class="body">klaarmaken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zevende dag</text><text x="68" y="625" class="body">Sabbat: eten wat bewaard is; buiten</text><text x="68" y="668" class="body">ligt geen manna.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De maat</text><text x="68" y="817" class="body">Eén gomer is een tiende van een efa.</text><text x="46" y="910" class="note">De tekst noemt een inhoudsverhouding; er wordt</text><text x="46" y="946" class="note">geen vaste moderne litermaat ingevuld.</text></svg>