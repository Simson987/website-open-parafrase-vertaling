<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Leeswijzer bij het lied</title><desc id="desc">Het lied bezingt redding, kracht, leiding en koningschap; Mirjam en de vrouwen antwoorden met een refrein.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leeswijzer bij het lied</text><text x="44" y="113" class="ref">Exodus 15:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verzen 1–5</text><text x="68" y="241" class="body">Lof om de redding en het lot van</text><text x="68" y="284" class="body">Farao’s leger.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verzen 6–12</text><text x="68" y="433" class="body">Poëtische taal over Gods kracht, wind,</text><text x="68" y="476" class="body">water en overwinning.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verzen 13–18</text><text x="68" y="625" class="body">Leiding van het bevrijde volk, ontzag</text><text x="68" y="668" class="body">bij volken en Gods blijvende</text><text x="68" y="711" class="body">koningschap.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Verzen 19–21</text><text x="68" y="860" class="body">Samenvatting van de doortocht; Mirjam</text><text x="68" y="903" class="body">en de vrouwen antwoorden met zang en</text><text x="68" y="946" class="body">trommels.</text><text x="46" y="1039" class="note">Rechterhand en adem zijn beeldspraak in het</text><text x="46" y="1075" class="note">lied; zij worden niet als menselijke</text><text x="46" y="1111" class="note">lichaamsdelen van God afgebeeld.</text></svg>