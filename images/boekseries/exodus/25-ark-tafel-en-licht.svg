<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Ark, tafel en kandelaar</title><desc id="desc">Maten en onderdelen van ark, verzoendeksel, tafel en zevenlampige kandelaar volgens Exodus 25.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ark, tafel en kandelaar</text><text x="44" y="113" class="ref">Exodus 25:10–39</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ark van acaciahout en goud</text><text x="68" y="241" class="body">Ongeveer 1,1 m lang, 70 cm breed en 70</text><text x="68" y="284" class="body">cm hoog; vier ringen en blijvende</text><text x="68" y="327" class="body">draagstokken.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Verzoendeksel</text><text x="68" y="476" class="body">Ongeveer 1,1 m bij 70 cm; twee cherubs</text><text x="68" y="519" class="body">naar elkaar en naar het deksel gericht.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Tafel van acaciahout en goud</text><text x="68" y="668" class="body">Ongeveer 90 bij 45 cm en 70 cm hoog;</text><text x="68" y="711" class="body">brood, gereedschap, ringen en</text><text x="68" y="754" class="body">draagstokken.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Kandelaar uit één stuk goud</text><text x="68" y="903" class="body">Zes zijarmen: drie aan iedere kant;</text><text x="68" y="946" class="body">zeven lampen in totaal.</text><text x="46" y="1039" class="note">De afgeronde moderne maten zijn overgenomen uit</text><text x="46" y="1075" class="note">de plaatselijke hoofdstukvertaling.</text></svg>