<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Drie feesten in het jaar</title><desc id="desc">Drie jaarfeesten: ongezuurde broden, oogstfeest en inzamelingsfeest, met driemaal verschijnen voor de HEERE.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie feesten in het jaar</text><text x="44" y="113" class="ref">Exodus 23:14–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ongezuurde broden</text><text x="68" y="241" class="body">Zeven dagen in de maand Abib, ter</text><text x="68" y="284" class="body">herinnering aan de uittocht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oogstfeest</text><text x="68" y="433" class="body">Wanneer de eerste vruchten rijp zijn</text><text x="68" y="476" class="body">van wat op het land gezaaid is.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Inzamelingsfeest</text><text x="68" y="625" class="body">Aan het einde van het jaar, wanneer de</text><text x="68" y="668" class="body">opbrengst is binnengehaald.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Voor de HEERE verschijnen</text><text x="68" y="817" class="body">Drie keer per jaar verschijnen alle</text><text x="68" y="860" class="body">mannen; niemand komt met lege handen.</text><text x="46" y="953" class="note">De namen en omschrijvingen volgen Exodus 23;</text><text x="46" y="989" class="note">latere kalenderdetails worden hier niet</text><text x="46" y="1025" class="note">ingevuld.</text></svg>