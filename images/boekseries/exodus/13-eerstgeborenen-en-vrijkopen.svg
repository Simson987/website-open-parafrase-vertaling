<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Eerstgeborenen en vrijkopen</title><desc id="desc">Exodus 13 onderscheidt de wijding van eerstgeborenen, het vrijkopen van iedere zoon en van een ezel met een lam, en het doorvertellen van de bevrijding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eerstgeborenen en vrijkopen</text><text x="44" y="113" class="ref">Exodus 13:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerstgeboren mannetjes</text><text x="68" y="241" class="body">Zonen en eerstgeboren mannelijk vee</text><text x="68" y="284" class="body">behoren aan de HEERE.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Iedere eerstgeboren zoon</text><text x="68" y="433" class="body">Moet worden vrijgekocht.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Eerstgeboren ezel</text><text x="68" y="582" class="body">Moet worden vrijgekocht met een lam. De</text><text x="68" y="625" class="body">tekst noemt ook het gevolg als dat niet</text><text x="68" y="668" class="body">gebeurt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Uitleg aan de volgende generatie</text><text x="68" y="817" class="body">Vertel hoe de HEERE Israël met sterke</text><text x="68" y="860" class="body">hand uit de slavernij leidde.</text><text x="46" y="953" class="note">Het schema houdt mensen en dieren afzonderlijk;</text><text x="46" y="989" class="note">het beveelt geen mensenoffer.</text></svg>