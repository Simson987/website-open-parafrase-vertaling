<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">De gemaakte voorwerpen</title><desc id="desc">Ark, tafel, zevenlampige kandelaar, reukaltaar, zalfolie en reukwerk volgens Exodus 37.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gemaakte voorwerpen</text><text x="44" y="113" class="ref">Exodus 37:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ark en verzoendeksel</text><text x="68" y="241" class="body">Acaciahout met goud en een zuivergouden</text><text x="68" y="284" class="body">deksel met twee cherubs.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tafel</text><text x="68" y="433" class="body">Acaciahout met goud, vier ringen en</text><text x="68" y="476" class="body">draagstokken; gouden gereedschap.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Kandelaar</text><text x="68" y="625" class="body">Eén geheel van gehamerd goud, zes</text><text x="68" y="668" class="body">zijarmen en zeven lampen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Reukaltaar</text><text x="68" y="817" class="body">Acaciahout met goud, ongeveer 45 bij 45</text><text x="68" y="860" class="body">cm en 90 cm hoog.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Olie en reukwerk</text><text x="68" y="1009" class="body">Beide worden vakkundig bereid.</text><text x="46" y="1102" class="note">Het overzicht koppelt voorwerpen aan materialen</text><text x="46" y="1138" class="note">en kenmerkende onderdelen.</text></svg>