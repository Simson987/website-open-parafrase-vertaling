<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Bijdrage en wassen</title><desc id="desc">De halve sikkel voor getelde volwassenen en het wassen van handen en voeten door de priesters.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bijdrage en wassen</text><text x="44" y="113" class="ref">Exodus 30:11–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie wordt geteld</text><text x="68" y="241" class="body">Iedereen van twintig jaar en ouder.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Gelijke bijdrage</text><text x="68" y="390" class="body">Een halve heiligdomssikkel: ongeveer</text><text x="68" y="433" class="body">5,5 gram. Rijk en arm geven hetzelfde.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bestemming</text><text x="68" y="582" class="body">Voor de dienst van de ontmoetingstent.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Het koperen wasbekken</text><text x="68" y="731" class="body">Tussen tent en altaar; Aäron en zijn</text><text x="68" y="774" class="body">zonen wassen handen en voeten vóór de</text><text x="68" y="817" class="body">dienst.</text><text x="46" y="910" class="note">De gewichtsaanduiding is overgenomen uit de</text><text x="46" y="946" class="note">plaatselijke vertaling.</text></svg>