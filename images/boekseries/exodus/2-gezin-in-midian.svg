<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">Mozes in Midian</title><desc id="desc">In Midian ontmoet Mozes de dochters van Rehuël, trouwt met Zippora en krijgt een zoon Gersom.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mozes in Midian</text><text x="44" y="113" class="ref">Exodus 2:16–22</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De priester Rehuël</text><text x="68" y="241" class="body">Hij heeft zeven dochters.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Mozes en Zippora</text><text x="68" y="390" class="body">Mozes blijft bij Rehuël; Zippora wordt</text><text x="68" y="433" class="body">zijn vrouw.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Hun zoon Gersom</text><text x="68" y="582" class="body">De naam herinnert Mozes eraan dat hij</text><text x="68" y="625" class="body">een vreemdeling in een vreemd land is.</text><text x="46" y="718" class="note">Exodus 3:1 noemt Mozes’ schoonvader Jethro; dit</text><text x="46" y="754" class="note">schema houdt de naam Rehuël uit Exodus 2 aan.</text></svg>