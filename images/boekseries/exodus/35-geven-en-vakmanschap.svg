<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Vrijwillig geven en meewerken</title><desc id="desc">De verschillende bijdragen aan het heiligdom: bezit, spinwerk, bijzondere materialen en onderwijs in vakwerk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrijwillig geven en meewerken</text><text x="44" y="113" class="ref">Exodus 35:21–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mannen en vrouwen</text><text x="68" y="241" class="body">Brengen vrijwillig materiaal uit hun</text><text x="68" y="284" class="body">bezit.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bedreven vrouwen</text><text x="68" y="433" class="body">Spinnen gekleurde draden, fijn linnen</text><text x="68" y="476" class="body">en geitenhaar.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Leiders</text><text x="68" y="625" class="body">Brengen stenen, specerijen en olie.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Bezaleël en Aholiab</text><text x="68" y="774" class="body">Krijgen bekwaamheid voor het vakwerk én</text><text x="68" y="817" class="body">om anderen te onderwijzen.</text><text x="46" y="910" class="note">De bijdrage omvat materiaal, handwerk en het</text><text x="46" y="946" class="note">doorgeven van vakkennis.</text></svg>