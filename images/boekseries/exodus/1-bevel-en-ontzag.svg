<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Sifra en Pua kiezen voor leven</title><desc id="desc">Sifra en Pua weigeren het bevel tot het doden van pasgeboren jongens uit te voeren. Het schema onderscheidt dit van Farao’s latere bevel aan heel zijn volk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sifra en Pua kiezen voor leven</text><text x="44" y="113" class="ref">Exodus 1:15–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het bevel van de koning</text><text x="68" y="241" class="body">Hij beveelt de vroedvrouwen de</text><text x="68" y="284" class="body">Hebreeuwse jongens bij de geboorte te</text><text x="68" y="327" class="body">doden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Hun antwoord in daden</text><text x="68" y="476" class="body">Sifra en Pua hebben ontzag voor God en</text><text x="68" y="519" class="body">laten de jongens leven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verantwoording aan Farao</text><text x="68" y="668" class="body">De koning roept hen ter verantwoording;</text><text x="68" y="711" class="body">zij antwoorden hem.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het latere bevel</text><text x="68" y="860" class="body">Farao beveelt vervolgens zijn hele volk</text><text x="68" y="903" class="body">de pasgeboren jongens in de rivier te</text><text x="68" y="946" class="body">gooien.</text><text x="46" y="1039" class="note">Het schema benoemt het geweldsbevel zonder</text><text x="46" y="1075" class="note">geweld tegen kinderen af te beelden.</text></svg>