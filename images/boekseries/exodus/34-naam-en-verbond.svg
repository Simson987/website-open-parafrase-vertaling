<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Het vernieuwde verbond</title><desc id="desc">Gods eigenschappen, verbondstrouw, feesten en de veertig dagen bij de nieuwe platen in Exodus 34.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het vernieuwde verbond</text><text x="44" y="113" class="ref">Exodus 34:6–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gods naam uitgeroepen</text><text x="68" y="241" class="body">Barmhartig, genadig, geduldig, rijk aan</text><text x="68" y="284" class="body">goedheid en trouw; vergeving en recht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Trouw aan het verbond</text><text x="68" y="433" class="body">Geen afgodsbeelden en geen verbonden</text><text x="68" y="476" class="body">die tot afgoderij leiden.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ritmen van gedenken</text><text x="68" y="625" class="body">Ongezuurde broden, wekenfeest,</text><text x="68" y="668" class="body">inzamelingsfeest en rust op de zevende</text><text x="68" y="711" class="body">dag.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De nieuwe platen</text><text x="68" y="860" class="body">Mozes blijft veertig dagen en nachten;</text><text x="68" y="903" class="body">de woorden van het verbond worden</text><text x="68" y="946" class="body">opgeschreven.</text><text x="46" y="1039" class="note">Het overzicht verbindt de naamsopenbaring met de</text><text x="46" y="1075" class="note">opdrachten en de nieuwe stenen platen.</text></svg>