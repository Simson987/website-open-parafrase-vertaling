<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Oprichting en verder reizen</title><desc id="desc">Datum van oprichting en het blijvende reisritme bij de wolk en het vuur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oprichting en verder reizen</text><text x="44" y="113" class="ref">Exodus 40:17–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De datum</text><text x="68" y="241" class="body">Eerste dag van de eerste maand van het</text><text x="68" y="284" class="body">tweede jaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oprichting en inrichting</text><text x="68" y="433" class="body">Mozes zet de tent op, plaatst de</text><text x="68" y="476" class="body">voorwerpen en voltooit de voorhof.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De wolk blijft rusten</text><text x="68" y="625" class="body">De heerlijkheid vult de tabernakel;</text><text x="68" y="668" class="body">Mozes kan niet binnengaan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De wolk stijgt op</text><text x="68" y="817" class="body">Het volk trekt verder. Blijft de wolk</text><text x="68" y="860" class="body">rusten, dan blijft het volk.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Dag en nacht</text><text x="68" y="1009" class="body">Overdag de wolk, ’s nachts vuur,</text><text x="68" y="1052" class="body">zichtbaar voor heel Israël.</text><text x="46" y="1145" class="note">Het reisritme volgt de beweging van de wolk; er</text><text x="46" y="1181" class="note">worden geen niet genoemde reistijden ingevuld.</text></svg>