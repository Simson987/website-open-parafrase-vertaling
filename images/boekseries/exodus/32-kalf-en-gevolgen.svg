<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Het kalf en de gevolgen</title><desc id="desc">Volgorde van afgoderij, terugkeer, vernietiging van het kalf, oordeel en voorbede in Exodus 32.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het kalf en de gevolgen</text><text x="44" y="113" class="ref">Exodus 32:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tijdens Mozes’ afwezigheid</text><text x="68" y="241" class="body">Het volk brengt goud; Aäron maakt het</text><text x="68" y="284" class="body">kalf en kondigt een feest aan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mozes daalt af</text><text x="68" y="433" class="body">Hij hoort met Jozua het zingen, ziet</text><text x="68" y="476" class="body">het kalf en breekt de platen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het kalf wordt vernietigd</text><text x="68" y="625" class="body">Het wordt verbrand, vermalen en op het</text><text x="68" y="668" class="body">water gestrooid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Oordeel in het kamp</text><text x="68" y="817" class="body">De Levieten handelen op Mozes’ bevel;</text><text x="68" y="860" class="body">de tekst noemt drieduizend doden.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Voorbede en vervolg</text><text x="68" y="1009" class="body">Mozes vraagt vergeving; de HEERE</text><text x="68" y="1052" class="body">kondigt verdere verantwoordelijkheid</text><text x="68" y="1095" class="body">aan en treft het volk met een plaag.</text><text x="46" y="1188" class="note">Een sober verloop dat ook de gewelddadige</text><text x="46" y="1224" class="note">gevolgen benoemt, zonder die als actiescène af</text><text x="46" y="1260" class="note">te beelden.</text></svg>