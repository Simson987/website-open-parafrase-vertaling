<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Samenwerking bij Rafidim</title><desc id="desc">Jozua voert de strijd; Mozes staat op de heuvel; Aäron en Hur ondersteunen zijn handen. Daarna volgen herinnering en altaar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Samenwerking bij Rafidim</text><text x="44" y="113" class="ref">Exodus 17:8–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jozua</text><text x="68" y="241" class="body">Kiest mannen en voert de strijd tegen</text><text x="68" y="284" class="body">Amalek.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mozes</text><text x="68" y="433" class="body">Gaat met Gods staf op de heuvel staan;</text><text x="68" y="476" class="body">zijn handen worden zwaar.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Aäron en Hur</text><text x="68" y="625" class="body">Laten Mozes op een steen zitten en</text><text x="68" y="668" class="body">ondersteunen elk een hand tot</text><text x="68" y="711" class="body">zonsondergang.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Na de overwinning</text><text x="68" y="860" class="body">Een schriftelijke herinnering en het</text><text x="68" y="903" class="body">altaar: De HEERE is mijn Banier.</text><text x="46" y="996" class="note">Het overzicht geeft de verschillende taken in</text><text x="46" y="1032" class="note">dezelfde gebeurtenis weer.</text></svg>