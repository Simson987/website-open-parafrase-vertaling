<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1498" viewBox="0 0 840 1498" role="img" aria-labelledby="title desc"><title id="title">Dienen en vrij vertrekken</title><desc id="desc">Zes jaar dienst en vrijheid in het zevende jaar, met onderscheiden regels voor gezinsleden, vrijwillig blijven en de vrouwelijke dienares.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1498" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dienen en vrij vertrekken</text><text x="44" y="113" class="ref">Exodus 21:2–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De hoofdregel</text><text x="68" y="241" class="body">Een Hebreeuwse dienaar dient zes jaar</text><text x="68" y="284" class="body">en vertrekt in het zevende jaar zonder</text><text x="68" y="327" class="body">betaling.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Met of zonder vrouw gekomen</text><text x="68" y="476" class="body">Alleen gekomen: alleen vertrekken.</text><text x="68" y="519" class="body">Getrouwd gekomen: zijn vrouw vertrekt</text><text x="68" y="562" class="body">mee.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Een gezin bij de meester</text><text x="68" y="711" class="body">Een door de meester gegeven vrouw en</text><text x="68" y="754" class="body">haar kinderen blijven bij de meester.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Vrijwillig blijven</text><text x="68" y="903" class="body">De dienaar kan verklaren te willen</text><text x="68" y="946" class="body">blijven; de tekst noemt rechters en de</text><text x="68" y="989" class="body">deurpost.</text><rect x="42" y="1047" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">De vrouwelijke dienares</text><text x="68" y="1138" class="body">Voor haar gelden afzonderlijke regels</text><text x="68" y="1181" class="body">over vrijkoop en rechten. Bij</text><text x="68" y="1224" class="body">onthouding van de drie genoemde rechten</text><text x="68" y="1267" class="body">vertrekt zij zonder betaling.</text><text x="46" y="1360" class="note">Dit is een overzicht van de rechtsregels uit dit</text><text x="46" y="1396" class="note">hoofdstuk, met de verschillende situaties</text><text x="46" y="1432" class="note">afzonderlijk.</text></svg>