<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De maaltijd gereed voor vertrek</title><desc id="desc">De eerste paschamaaltijd bestaat uit geroosterd vlees, ongezuurd brood en bittere kruiden, gegeten gereed voor vertrek en onder het teken aan de deur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De maaltijd gereed voor vertrek</text><text x="44" y="113" class="ref">Exodus 12:4–13, 22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat wordt gegeten</text><text x="68" y="241" class="body">Geroosterd vlees, ongezuurd brood en</text><text x="68" y="284" class="body">bittere kruiden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hoe het wordt bereid</text><text x="68" y="433" class="body">Roosteren boven vuur; niet rauw eten of</text><text x="68" y="476" class="body">in water koken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Houding bij de maaltijd</text><text x="68" y="625" class="body">Kleding opgebonden, schoenen aan en</text><text x="68" y="668" class="body">staf in de hand; haastig eten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Teken aan de deur</text><text x="68" y="817" class="body">Bloed aan beide deurposten en de</text><text x="68" y="860" class="body">bovendorpel.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Binnenblijven</text><text x="68" y="1009" class="body">Niemand mag vóór de ochtend het huis</text><text x="68" y="1052" class="body">uit.</text><text x="46" y="1145" class="note">Dit overzicht verklaart de eerste paschamaaltijd</text><text x="46" y="1181" class="note">in de nacht van het vertrek.</text></svg>