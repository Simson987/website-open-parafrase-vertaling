<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">Vergoeding bij gestolen vee</title><desc id="desc">Exodus 22 noemt vijfvoudige vergoeding voor een geslachte of verkochte os, viervoudige voor schaap of geit en dubbele vergoeding bij levend terugvinden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vergoeding bij gestolen vee</text><text x="44" y="113" class="ref">Exodus 22:1–4</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Os geslacht of verkocht</text><text x="68" y="241" class="body">Vijf runderen vergoeden voor één os.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Schaap of geit geslacht of verkocht</text><text x="68" y="390" class="body">Vier dieren vergoeden voor één schaap</text><text x="68" y="433" class="body">of geit.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Levend teruggevonden</text><text x="68" y="582" class="body">Bij een gestolen os, ezel, schaap of</text><text x="68" y="625" class="body">geit wordt het dubbele vergoed.</text><text x="46" y="718" class="note">Het verschil hangt af van wat er met het</text><text x="46" y="754" class="note">gestolen dier is gebeurd.</text></svg>