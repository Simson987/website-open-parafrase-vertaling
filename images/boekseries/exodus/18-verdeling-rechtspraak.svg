<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Samen de rechtspraak dragen</title><desc id="desc">De rechtspraak wordt gedeeld over bekwame leiders van groepen van duizend, honderd, vijftig en tien; moeilijke zaken blijven voor Mozes.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Samen de rechtspraak dragen</text><text x="44" y="113" class="ref">Exodus 18:19–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mozes</text><text x="68" y="241" class="body">Vertegenwoordigt het volk bij God en</text><text x="68" y="284" class="body">onderwijst voorschriften en wetten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bekwame leiders</text><text x="68" y="433" class="body">Hebben ontzag voor God, zijn</text><text x="68" y="476" class="body">betrouwbaar en haten hebzucht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Groepen in de tekst</text><text x="68" y="625" class="body">Leiders over duizend, honderd, vijftig</text><text x="68" y="668" class="body">en tien.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Verdeling van de zaken</text><text x="68" y="817" class="body">Kleine zaken behandelen zij zelf;</text><text x="68" y="860" class="body">moeilijke zaken brengen zij bij Mozes.</text><text x="46" y="953" class="note">De genoemde groepsgroottes vormen geen berekend</text><text x="46" y="989" class="note">totaal van het volk of de leiders.</text></svg>