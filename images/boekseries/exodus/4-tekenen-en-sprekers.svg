<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Tekenen en woordvoerders</title><desc id="desc">Het schema onderscheidt de staf, de hand, het aangekondigde waterteken en Aärons taak als woordvoerder.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tekenen en woordvoerders</text><text x="44" y="113" class="ref">Exodus 4:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste teken</text><text x="68" y="241" class="body">De staf wordt een slang; in Mozes’ hand</text><text x="68" y="284" class="body">wordt zij weer een staf.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede teken</text><text x="68" y="433" class="body">De hand wordt wit door melaatsheid en</text><text x="68" y="476" class="body">daarna weer gezond.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Als zij nog niet geloven</text><text x="68" y="625" class="body">Rivierwater zal op de droge grond in</text><text x="68" y="668" class="body">bloed veranderen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Mozes en Aäron</text><text x="68" y="817" class="body">Mozes ontvangt de woorden; zijn broer</text><text x="68" y="860" class="body">Aäron zal namens hem tot het volk</text><text x="68" y="903" class="body">spreken.</text><text x="46" y="996" class="note">Het derde teken is hier een opdracht voor later;</text><text x="46" y="1032" class="note">de twee eerste worden in dit gesprek uitgevoerd.</text></svg>