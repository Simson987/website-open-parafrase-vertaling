<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1217" viewBox="0 0 840 1217" role="img" aria-labelledby="title desc"><title id="title">Levi en zijn familietakken</title><desc id="desc">Levi’s takken lopen via Gerson, Kehath en Merari; de genoemde nakomelingen van Gerson, Kehath, Merari, Jizhar en Uzziël zijn geordend.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1217" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levi en zijn familietakken</text><text x="44" y="113" class="ref">Exodus 6:15–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Levi → zijn zonen</text><text x="68" y="241" class="body">Gerson, Kehath en Merari.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Gerson → zijn zonen</text><text x="68" y="390" class="body">Libni en Simeï.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Kehath → zijn zonen</text><text x="68" y="539" class="body">Amram, Jizhar, Hebron en Uzziël.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Merari → zijn zonen</text><text x="68" y="688" class="body">Machli en Musi.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Jizhar → zijn zonen</text><text x="68" y="837" class="body">Korah, Nefeg en Zichri.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Uzziël → zijn zonen</text><text x="68" y="986" class="body">Misaël, Elzafan en Sithri.</text><text x="46" y="1079" class="note">De indeling geeft de vader-kindrelaties uit het</text><text x="46" y="1115" class="note">hoofdstuk weer, zonder gelijktijdigheid te</text><text x="46" y="1151" class="note">veronderstellen.</text></svg>