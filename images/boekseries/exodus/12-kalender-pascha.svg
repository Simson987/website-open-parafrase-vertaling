<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De dagen rond het Pascha</title><desc id="desc">De tiende dag wordt het lam gekozen, op de veertiende dag in de avond geslacht; van avond veertien tot avond eenentwintig wordt ongezuurd brood gegeten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De dagen rond het Pascha</text><text x="44" y="113" class="ref">Exodus 12:2–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste maand</text><text x="68" y="241" class="body">Deze maand wordt het begin van de</text><text x="68" y="284" class="body">maanden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dag 10</text><text x="68" y="433" class="body">Ieder gezin kiest een lam; kleine</text><text x="68" y="476" class="body">gezinnen kunnen samen delen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dag 14, in de avond</text><text x="68" y="625" class="body">Het lam wordt geslacht en die nacht</text><text x="68" y="668" class="body">gegeten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Avond 14 tot avond 21</text><text x="68" y="817" class="body">Ongezuurd brood eten; geen zuurdeeg in</text><text x="68" y="860" class="body">de huizen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Eerste en zevende dag</text><text x="68" y="1009" class="body">Een heilige bijeenkomst; alleen</text><text x="68" y="1052" class="body">voedselbereiding is toegestaan.</text><text x="46" y="1145" class="note">De kalender volgt de dag- en avondsaanduidingen</text><text x="46" y="1181" class="note">van de tekst, zonder een moderne datum in te</text><text x="46" y="1217" class="note">vullen.</text></svg>