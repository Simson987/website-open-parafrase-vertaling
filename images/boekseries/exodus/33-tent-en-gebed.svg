<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Tent buiten het kamp en gebed</title><desc id="desc">De plaats van de tent, Jozua’s taak en Mozes’ gebed om Gods aanwezigheid en heerlijkheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tent buiten het kamp en gebed</text><text x="44" y="113" class="ref">Exodus 33:7–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De ontmoetingstent</text><text x="68" y="241" class="body">Mozes zet haar ver buiten het kamp; wie</text><text x="68" y="284" class="body">de HEERE zoekt gaat erheen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mozes en Jozua</text><text x="68" y="433" class="body">Mozes keert terug; Jozua blijft in de</text><text x="68" y="476" class="body">tent.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vraag</text><text x="68" y="625" class="body">Mozes vraagt om Gods aanwezigheid en om</text><text x="68" y="668" class="body">Zijn heerlijkheid te zien.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het antwoord</text><text x="68" y="817" class="body">God belooft aanwezigheid en rust, maar</text><text x="68" y="860" class="body">Mozes kan Zijn gezicht niet zien.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De rotskloof</text><text x="68" y="1009" class="body">Mozes wordt beschut terwijl de</text><text x="68" y="1052" class="body">heerlijkheid voorbijgaat.</text><text x="46" y="1145" class="note">De tent buiten het kamp wordt onderscheiden van</text><text x="46" y="1181" class="note">de later opgerichte tabernakel.</text></svg>