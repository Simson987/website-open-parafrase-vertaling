<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Altaar en voorhof: maten</title><desc id="desc">Maten en materiaal van het brandofferaltaar en de voorhof, met de lange zijden en de oostelijke ingang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Altaar en voorhof: maten</text><text x="44" y="113" class="ref">Exodus 27:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Brandofferaltaar</text><text x="68" y="241" class="body">Ongeveer 2,25 bij 2,25 m en 1,35 m</text><text x="68" y="284" class="body">hoog; acaciahout bekleed met koper.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Voorhof</text><text x="68" y="433" class="body">Ongeveer 45 bij 22,5 m; gordijnen</text><text x="68" y="476" class="body">ongeveer 2,25 m hoog.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Lange zijden</text><text x="68" y="625" class="body">Noord en zuid elk twintig palen; west</text><text x="68" y="668" class="body">tien palen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Oostelijke ingang</text><text x="68" y="817" class="body">Een gordijn van ongeveer 9 m met vier</text><text x="68" y="860" class="body">palen, tussen twee zijstukken van elk</text><text x="68" y="903" class="body">ongeveer 6,75 m.</text><text x="46" y="996" class="note">De moderne maten zijn afgeronde maten uit de</text><text x="46" y="1032" class="note">hoofdstuktekst.</text></svg>