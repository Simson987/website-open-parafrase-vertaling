<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Verbond, leiders en wachttijd</title><desc id="desc">Twaalf zuilen, de groep leiders, de achterblijvende verantwoordelijken en de tijdsaanduidingen bij het verbond op Sinaï.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verbond, leiders en wachttijd</text><text x="44" y="113" class="ref">Exodus 24:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twaalf zuilen</text><text x="68" y="241" class="body">Mozes richt één zuil op voor iedere</text><text x="68" y="284" class="body">stam, bij het altaar onder aan de berg.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De leiders</text><text x="68" y="433" class="body">Aäron, Nadab, Abihu en zeventig oudsten</text><text x="68" y="476" class="body">gaan met Mozes omhoog; alleen Mozes mag</text><text x="68" y="519" class="body">naderen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verantwoordelijkheid beneden</text><text x="68" y="668" class="body">Aäron en Hur blijven beschikbaar voor</text><text x="68" y="711" class="body">zaken van het volk.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zes dagen en de zevende</text><text x="68" y="860" class="body">De wolk bedekt de berg zes dagen; op de</text><text x="68" y="903" class="body">zevende dag wordt Mozes geroepen.</text><rect x="42" y="961" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Veertig dagen en nachten</text><text x="68" y="1052" class="body">Mozes verblijft op de berg.</text><text x="46" y="1145" class="note">De genoemde perioden worden weergegeven zoals de</text><text x="46" y="1181" class="note">tekst ze noemt, zonder ze tot één berekende duur</text><text x="46" y="1217" class="note">op te tellen.</text></svg>