<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Amram, Aäron en Mozes</title><desc id="desc">Amram en Jochebed krijgen Aäron en Mozes. Aäron en Eliseba krijgen vier zonen. Ook Korahs zonen en Eleazars zoon Pinehas worden genoemd.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Amram, Aäron en Mozes</text><text x="44" y="113" class="ref">Exodus 6:19–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Amram + Jochebed</text><text x="68" y="241" class="body">Jochebed is Amrams tante. Hun zonen</text><text x="68" y="284" class="body">hier: Aäron en Mozes.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aäron + Eliseba</text><text x="68" y="433" class="body">Eliseba is Amminadabs dochter en</text><text x="68" y="476" class="body">Nahessons zus. Hun zonen: Nadab, Abihu,</text><text x="68" y="519" class="body">Eleazar en Ithamar.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Korah → zijn zonen</text><text x="68" y="668" class="body">Assir, Elkana en Abiasaf.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Eleazar + Putiels dochter</text><text x="68" y="817" class="body">Hun zoon is Pinehas; de moeder wordt</text><text x="68" y="860" class="body">niet bij naam genoemd.</text><text x="46" y="953" class="note">Alleen de in deze passage genoemde</text><text x="46" y="989" class="note">verwantschappen worden weergegeven; onbekende</text><text x="46" y="1025" class="note">namen blijven onbekend.</text></svg>