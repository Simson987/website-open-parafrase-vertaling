<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Inwijding en dagelijks offer</title><desc id="desc">Inwijdingsdieren, rechter lichaamsdelen, zeven dagen en het ochtend- en avondoffer met de in de vertaling afgeronde hoeveelheden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Inwijding en dagelijks offer</text><text x="44" y="113" class="ref">Exodus 29:1–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voor de inwijding</text><text x="68" y="241" class="body">Eén jonge stier, twee rammen zonder</text><text x="68" y="284" class="body">gebrek en een mand ongezuurd brood.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij de tweede ram</text><text x="68" y="433" class="body">Bloed op de rechteroorlel, rechterduim</text><text x="68" y="476" class="body">en rechtergrote teen van Aäron en zijn</text><text x="68" y="519" class="body">zonen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zeven dagen</text><text x="68" y="668" class="body">Inwijding van de priesters en</text><text x="68" y="711" class="body">verzoening voor het altaar.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Dagelijks twee lammeren</text><text x="68" y="860" class="body">Eén in de ochtend en één tegen de</text><text x="68" y="903" class="body">avond.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Bij ieder lam</text><text x="68" y="1052" class="body">Ongeveer 2 liter fijn meel, 1 liter</text><text x="68" y="1095" class="body">olie en 1 liter wijn, volgens deze</text><text x="68" y="1138" class="body">vertaling.</text><text x="46" y="1231" class="note">Het schema onderscheidt de eenmalige</text><text x="46" y="1267" class="note">inwijdingsperiode van het blijvende dagelijkse</text><text x="46" y="1303" class="note">offer.</text></svg>