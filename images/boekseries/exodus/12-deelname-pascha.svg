<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Wie deelt in het Pascha?</title><desc id="desc">Het schema zet de deelnamevoorwaarden uit Exodus 12 naast elkaar, met dezelfde wet voor ingezetene en vreemdeling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie deelt in het Pascha?</text><text x="44" y="113" class="ref">Exodus 12:43–49</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gemeenschap van Israël</text><text x="68" y="241" class="body">De hele gemeenschap moet het Pascha</text><text x="68" y="284" class="body">vieren.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gekochte dienaar</text><text x="68" y="433" class="body">Mag deelnemen nadat hij besneden is.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Inwonende buitenlander</text><text x="68" y="582" class="body">Een inwonende buitenlander of</text><text x="68" y="625" class="body">ingehuurde arbeider neemt niet vanzelf</text><text x="68" y="668" class="body">deel.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Een vreemdeling die wil vieren</text><text x="68" y="817" class="body">Alle mannen van zijn huishouden moeten</text><text x="68" y="860" class="body">besneden worden; daarna geldt hij als</text><text x="68" y="903" class="body">een ingezetene.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Eén wet</text><text x="68" y="1052" class="body">Voor ingezetene en vreemdeling geldt</text><text x="68" y="1095" class="body">dezelfde wet.</text><text x="46" y="1188" class="note">De voorwaarden volgen deze passage en</text><text x="46" y="1224" class="note">onderscheiden verblijf van deelname aan de</text><text x="46" y="1260" class="note">verbondsviering.</text></svg>