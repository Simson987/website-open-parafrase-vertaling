<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Geboden: leven met de naaste</title><desc id="desc">De geboden over ouders, leven, huwelijk, bezit, waarheid en verlangen volgens Exodus 20:12–17.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geboden: leven met de naaste</text><text x="44" y="113" class="ref">Exodus 20:12–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ouders</text><text x="68" y="241" class="body">Eer je vader en je moeder.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Leven en huwelijk</text><text x="68" y="390" class="body">Pleeg geen moord en geen overspel.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Bezit en waarheid</text><text x="68" y="539" class="body">Steel niet en leg geen vals getuigenis</text><text x="68" y="582" class="body">tegen je naaste af.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Verlangen</text><text x="68" y="731" class="body">Verlang niet naar het huis, de vrouw,</text><text x="68" y="774" class="body">dienaren, vee of andere bezittingen van</text><text x="68" y="817" class="body">je naaste.</text><text x="46" y="910" class="note">Een beknopt tekstoverzicht van de geboden over</text><text x="46" y="946" class="note">de omgang met anderen.</text></svg>