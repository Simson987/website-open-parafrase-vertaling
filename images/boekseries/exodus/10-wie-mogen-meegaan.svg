<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Wie mogen er meegaan?</title><desc id="desc">Farao stelt beperkingen aan wie en wat mag vertrekken. Mozes houdt vast aan vertrek van het hele volk met al het vee.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie mogen er meegaan?</text><text x="44" y="113" class="ref">Exodus 10:8–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mozes’ antwoord</text><text x="68" y="241" class="body">Jong en oud, zonen en dochters, schapen</text><text x="68" y="284" class="body">en runderen moeten meegaan.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Farao’s eerste beperking</text><text x="68" y="433" class="body">Alleen de mannen mogen vertrekken.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Na de duisternis</text><text x="68" y="582" class="body">Ook de kinderen mogen mee, maar het vee</text><text x="68" y="625" class="body">moet blijven.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Mozes houdt vast</text><text x="68" y="774" class="body">Geen enkele hoef mag achterblijven; zij</text><text x="68" y="817" class="body">zullen hun God met het vee dienen.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Uiteindelijk</text><text x="68" y="966" class="body">Farao weigert en stuurt Mozes weg.</text><text x="46" y="1059" class="note">Dit zijn opeenvolgende voorstellen in het</text><text x="46" y="1095" class="note">gesprek; het volk vertrekt in dit hoofdstuk nog</text><text x="46" y="1131" class="note">niet.</text></svg>