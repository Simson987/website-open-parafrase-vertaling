<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1561" viewBox="0 0 840 1561" role="img" aria-labelledby="title desc"><title id="title">De verantwoording van metalen</title><desc id="desc">Inventaris van goud, zilver en koper met de bestemming en het toezicht van Ithamar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1561" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De verantwoording van metalen</text><text x="44" y="113" class="ref">Exodus 38:21–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Goud</text><text x="68" y="241" class="body">Ongeveer 994 kilo volgens deze</text><text x="68" y="284" class="body">vertaling.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zilver</text><text x="68" y="433" class="body">Ongeveer 3.420 kilo; 603.550 getelde</text><text x="68" y="476" class="body">mannen geven ieder ongeveer 5,7 gram.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zilveren voetstukken</text><text x="68" y="625" class="body">Honderd voetstukken; ongeveer 3.400</text><text x="68" y="668" class="body">kilo zilver, circa 34 kilo per</text><text x="68" y="711" class="body">voetstuk.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Overig zilver</text><text x="68" y="860" class="body">Ongeveer 20 kilo voor haken, paaltoppen</text><text x="68" y="903" class="body">en verbindingsbanden.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Koper</text><text x="68" y="1052" class="body">Ongeveer 2.407 kilo voor altaar,</text><text x="68" y="1095" class="body">gereedschap, voeten en pinnen.</text><rect x="42" y="1153" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Toezicht</text><text x="68" y="1244" class="body">De Levieten tellen onder Ithamar;</text><text x="68" y="1287" class="body">Bezaleël en Aholiab voeren het vakwerk</text><text x="68" y="1330" class="body">uit.</text><text x="46" y="1423" class="note">Dit zijn de afgeronde gewichten uit Exodus 38;</text><text x="46" y="1459" class="note">zij worden niet herberekend met de afgeronde</text><text x="46" y="1495" class="note">getallen van andere hoofdstukken.</text></svg>