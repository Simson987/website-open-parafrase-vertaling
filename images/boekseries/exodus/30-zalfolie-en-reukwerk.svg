<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1227" viewBox="0 0 840 1227" role="img" aria-labelledby="title desc"><title id="title">Zalfolie en reukwerk</title><desc id="desc">Ingrediënten en gebruik van de heilige zalfolie en het heilige reukwerk volgens Exodus 30.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1227" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zalfolie en reukwerk</text><text x="44" y="113" class="ref">Exodus 30:22–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zalfolie</text><text x="68" y="241" class="body">Mirre circa 5,5 kg; kaneel en kalmoes</text><text x="68" y="284" class="body">elk circa 2,75 kg; kassie circa 5,5 kg;</text><text x="68" y="327" class="body">olijfolie circa 4 liter.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gebruik van de olie</text><text x="68" y="476" class="body">Tent, ark, tafel, kandelaar, altaren en</text><text x="68" y="519" class="body">wasbekken; ook Aäron en zijn zonen</text><text x="68" y="562" class="body">worden gezalfd.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Reukwerk</text><text x="68" y="711" class="body">Mirresap, oniche, galban en zuivere</text><text x="68" y="754" class="body">wierook; zorgvuldig fijnmaken en</text><text x="68" y="797" class="body">mengen.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Heilige bestemming</text><text x="68" y="946" class="body">Beide samenstellingen zijn voor de</text><text x="68" y="989" class="body">heilige dienst en mogen niet voor eigen</text><text x="68" y="1032" class="body">gebruik worden nagemaakt.</text><text x="46" y="1125" class="note">Olie en reukwerk zijn twee verschillende</text><text x="46" y="1161" class="note">samenstellingen met verschillende toepassingen.</text></svg>