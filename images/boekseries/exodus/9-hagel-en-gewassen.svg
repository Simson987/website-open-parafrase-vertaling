<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Wat de hagel vernielt</title><desc id="desc">De hagel vernielt vlas en gerst maar niet de later groeiende tarwe en spelt. Gosen wordt gespaard en de plaag stopt na Mozes’ gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat de hagel vernielt</text><text x="44" y="113" class="ref">Exodus 9:19–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vooraf gewaarschuwd</text><text x="68" y="241" class="body">Wie ontzag heeft voor het woord van de</text><text x="68" y="284" class="body">HEERE, brengt dienaren en vee binnen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vlas en gerst</text><text x="68" y="433" class="body">Worden vernield: het vlas is</text><text x="68" y="476" class="body">opgeschoten en de gerst staat in de</text><text x="68" y="519" class="body">aar.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Tarwe en spelt</text><text x="68" y="668" class="body">Worden niet vernield, omdat zij nog</text><text x="68" y="711" class="body">niet zo ver gegroeid zijn.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Gosen</text><text x="68" y="860" class="body">Daar valt geen hagel.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Mozes bidt buiten de stad</text><text x="68" y="1009" class="body">Donder, hagel en regen houden op.</text><text x="46" y="1102" class="note">De verschillende groeistadia verklaren het</text><text x="46" y="1138" class="note">verschil tussen de gewassen; er worden geen</text><text x="46" y="1174" class="note">oogstmaanden ingevuld.</text></svg>