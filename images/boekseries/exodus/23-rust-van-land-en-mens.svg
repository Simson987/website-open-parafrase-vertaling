<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Rust voor land, mens en dier</title><desc id="desc">Zes werkjaren met rust in het zevende jaar en zes werkdagen met rust op de zevende dag voor mens en dier.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rust voor land, mens en dier</text><text x="44" y="113" class="ref">Exodus 23:10–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zes jaren</text><text x="68" y="241" class="body">Het land inzaaien en de opbrengst</text><text x="68" y="284" class="body">verzamelen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zevende jaar</text><text x="68" y="433" class="body">Land, wijngaard en olijfbomen rust</text><text x="68" y="476" class="body">geven; armen mogen eten en dieren wat</text><text x="68" y="519" class="body">overblijft.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zes dagen</text><text x="68" y="668" class="body">Werken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zevende dag</text><text x="68" y="817" class="body">Rust voor mensen, os, ezel, dienares’</text><text x="68" y="860" class="body">zoon en vreemdeling.</text><text x="46" y="953" class="note">De tekst beschrijft zowel een ritme van jaren</text><text x="46" y="989" class="note">als een ritme van dagen.</text></svg>