<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Naam, belofte en opdracht</title><desc id="desc">Mozes ontvangt een opdracht, Gods belofte en naam, en instructies over de oudsten, Farao en het toekomstige vertrek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Naam, belofte en opdracht</text><text x="44" y="113" class="ref">Exodus 3:10–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De opdracht</text><text x="68" y="241" class="body">Mozes moet naar Farao om de Israëlieten</text><text x="68" y="284" class="body">uit Egypte te leiden.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De belofte</text><text x="68" y="433" class="body">God zegt dat Hij met Mozes zal zijn.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De naam</text><text x="68" y="582" class="body">God antwoordt: Ik zal zijn die ik zijn</text><text x="68" y="625" class="body">zal. De HEERE is de God van Abraham,</text><text x="68" y="668" class="body">Izak en Jakob.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De volgende stappen</text><text x="68" y="817" class="body">De oudsten bijeenroepen en met hen naar</text><text x="68" y="860" class="body">de koning gaan.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Weerstand en vertrek</text><text x="68" y="1009" class="body">Farao zal weigeren; God zal Egypte</text><text x="68" y="1052" class="body">treffen en het volk niet met lege</text><text x="68" y="1095" class="body">handen laten vertrekken.</text><text x="46" y="1188" class="note">Woorden en aangekondigde stappen worden</text><text x="46" y="1224" class="note">onderscheiden van gebeurtenissen die pas later</text><text x="46" y="1260" class="note">plaatsvinden.</text></svg>