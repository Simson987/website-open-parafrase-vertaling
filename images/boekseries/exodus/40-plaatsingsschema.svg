<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1140" viewBox="0 0 1100 1140" role="img" aria-labelledby="title desc"><title id="title">De plaats van de voorwerpen</title><desc id="desc">Schematische bovenaanblik: ark achter het voorhangsel; tafel noord, kandelaar zuid, reukaltaar ervoor; wasbekken tussen tent en brandofferaltaar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}</style><rect width="1100" height="1140" rx="24" fill="#f7f4e9"/><text x="55" y="58" font-size="39" font-weight="700">De plaats van de voorwerpen</text><text x="55" y="100" font-size="27">Exodus 40:3–8, 22–30; 26:33–35</text><rect x="70" y="160" width="960" height="480" fill="#fffdf8" stroke="#597362" stroke-width="5"/><rect x="115" y="275" width="480" height="250" fill="#eee3ca" stroke="#6b5845" stroke-width="4"/><path d="M285 275V525" stroke="#78517d" stroke-width="8" stroke-dasharray="12 5"/><path d="M1030 350V450" stroke="#78517d" stroke-width="10"/><circle cx="200" cy="400" r="28" fill="#d5b966" stroke="#6b5845" stroke-width="2"/><text x="200" y="410" text-anchor="middle" font-size="31" font-weight="700">1</text><circle cx="430" cy="325" r="28" fill="#d5b966" stroke="#6b5845" stroke-width="2"/><text x="430" y="335" text-anchor="middle" font-size="31" font-weight="700">2</text><circle cx="430" cy="475" r="28" fill="#d5b966" stroke="#6b5845" stroke-width="2"/><text x="430" y="485" text-anchor="middle" font-size="31" font-weight="700">3</text><circle cx="330" cy="400" r="28" fill="#d5b966" stroke="#6b5845" stroke-width="2"/><text x="330" y="410" text-anchor="middle" font-size="31" font-weight="700">4</text><circle cx="730" cy="400" r="28" fill="#d5b966" stroke="#6b5845" stroke-width="2"/><text x="730" y="410" text-anchor="middle" font-size="31" font-weight="700">5</text><circle cx="900" cy="400" r="28" fill="#d5b966" stroke="#6b5845" stroke-width="2"/><text x="900" y="410" text-anchor="middle" font-size="31" font-weight="700">6</text><text x="500" y="135" font-size="28">NOORD</text><text x="500" y="685" font-size="28">ZUID</text><text x="65" y="730" font-size="28">WEST</text><text x="850" y="730" font-size="28">OOST / ingang</text><text x="70" y="790" font-size="29">1 · Ark achter het voorhangsel</text><text x="70" y="833" font-size="29">2 · Tafel aan de noordkant</text><text x="70" y="876" font-size="29">3 · Kandelaar aan de zuidkant</text><text x="70" y="919" font-size="29">4 · Reukaltaar vóór het voorhangsel</text><text x="70" y="962" font-size="29">5 · Wasbekken tussen tent en altaar</text><text x="70" y="1005" font-size="29">6 · Brandofferaltaar vóór de tent</text><text x="70" y="1095" font-size="25" fill="#626957">Plaatsingsschema; afstanden en symbolen zijn niet op schaal.</text></svg>