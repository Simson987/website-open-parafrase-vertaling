<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Kroonplaat en voltooid werk</title><desc id="desc">De kroonplaat draagt HEILIG VOOR DE HEERE; na voltooiing wordt al het werk gebracht, gecontroleerd en gezegend.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kroonplaat en voltooid werk</text><text x="44" y="113" class="ref">Exodus 39:30–43</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gouden kroonplaat</text><text x="68" y="241" class="body">Inschrift: HEILIG VOOR DE HEERE!</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Bevestiging</text><text x="68" y="390" class="body">Een blauw koord verbindt de plaat aan</text><text x="68" y="433" class="body">de tulband.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Overdracht aan Mozes</text><text x="68" y="582" class="body">Tent, voorwerpen, kleding, touwen en</text><text x="68" y="625" class="body">pinnen worden gebracht.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Controle en zegen</text><text x="68" y="774" class="body">Mozes ziet dat alles volgens het bevel</text><text x="68" y="817" class="body">gemaakt is en zegent hen.</text><text x="46" y="910" class="note">Het inschrift staat als exacte tekst; de</text><text x="46" y="946" class="note">overdracht is de afsluiting van het werk.</text></svg>