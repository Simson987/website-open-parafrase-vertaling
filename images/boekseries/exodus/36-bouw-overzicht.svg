<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Het werk aan de tent</title><desc id="desc">De uitgevoerde tentbouw: doekreeksen, haken, dekkleden, planken, voorhangsel en ingang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het werk aan de tent</text><text x="44" y="113" class="ref">Exodus 36:8–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tien binnenste gordijnen</text><text x="68" y="241" class="body">Twee reeksen van vijf; vijftig gouden</text><text x="68" y="284" class="body">haken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Elf gordijnen van geitenhaar</text><text x="68" y="433" class="body">Reeksen van vijf en zes; vijftig</text><text x="68" y="476" class="body">koperen haken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dekkleden</text><text x="68" y="625" class="body">Roodgeverfde ramsvellen en daarover</text><text x="68" y="668" class="body">dassenvellen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Planken en voetstukken</text><text x="68" y="817" class="body">Zuid en noord elk twintig planken met</text><text x="68" y="860" class="body">veertig voetstukken; west acht met</text><text x="68" y="903" class="body">zestien.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Twee afscheidingen</text><text x="68" y="1052" class="body">Voorhangsel met vier pilaren en</text><text x="68" y="1095" class="body">zilveren voeten; ingangsgordijn met</text><text x="68" y="1138" class="body">vijf pilaren en koperen voeten.</text><text x="46" y="1231" class="note">Dit hoofdstuk vertelt de uitvoering van de</text><text x="46" y="1267" class="note">eerder gegeven opdrachten.</text></svg>