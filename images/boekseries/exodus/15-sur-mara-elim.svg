<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Van Sur via Mara naar Elim</title><desc id="desc">Na drie dagen zonder water in Sur volgt Mara met bitter water dat zoet wordt, en daarna Elim met twaalf bronnen en zeventig palmen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Sur via Mara naar Elim</text><text x="44" y="113" class="ref">Exodus 15:22–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Woestijn Sur</text><text x="68" y="241" class="body">Drie dagen reizen zonder water te</text><text x="68" y="284" class="body">vinden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mara</text><text x="68" y="433" class="body">Het water is bitter; het volk klaagt en</text><text x="68" y="476" class="body">Mozes roept tot de HEERE.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het aangewezen hout</text><text x="68" y="625" class="body">Mozes gooit het in het water; het water</text><text x="68" y="668" class="body">wordt zoet.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Elim</text><text x="68" y="817" class="body">Twaalf waterbronnen en zeventig</text><text x="68" y="860" class="body">palmbomen; het volk slaat er zijn kamp</text><text x="68" y="903" class="body">op.</text><text x="46" y="996" class="note">De aantallen bij Elim staan hier exact; een</text><text x="46" y="1032" class="note">landschapsbeeld toont alleen een gedeelte van de</text><text x="46" y="1068" class="note">oase.</text></svg>