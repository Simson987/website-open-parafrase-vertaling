<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Kikkers, luizen en ongedierte</title><desc id="desc">Het verloop van de drie plagen in Exodus 8 met Aärons teken, Mozes’ gebeden, bescherming van Gosen en Farao’s herhaalde weigering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kikkers, luizen en ongedierte</text><text x="44" y="113" class="ref">Exodus 8:1–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kikkers</text><text x="68" y="241" class="body">Aäron strekt zijn staf uit; Farao</text><text x="68" y="284" class="body">vraagt om gebed. Na verlichting weigert</text><text x="68" y="327" class="body">hij weer.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Luizen</text><text x="68" y="476" class="body">Aäron slaat het stof. De tovenaars</text><text x="68" y="519" class="body">kunnen dit niet nadoen en spreken van</text><text x="68" y="562" class="body">Gods vinger.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Ongedierte</text><text x="68" y="711" class="body">Egyptische huizen worden getroffen;</text><text x="68" y="754" class="body">Gosen wordt apart gehouden.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Gebed en weigering</text><text x="68" y="903" class="body">Na Mozes’ gebed verdwijnt het</text><text x="68" y="946" class="body">ongedierte volledig. Toch laat Farao</text><text x="68" y="989" class="body">het volk niet gaan.</text><text x="46" y="1082" class="note">Kikkers, luizen en het later genoemde ongedierte</text><text x="46" y="1118" class="note">zijn drie verschillende plagen in dit hoofdstuk.</text></svg>