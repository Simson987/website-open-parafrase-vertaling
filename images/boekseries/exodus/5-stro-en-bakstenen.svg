<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Geen stro, dezelfde dagtaak</title><desc id="desc">Farao stopt de levering van stro maar houdt de dagelijkse baksteenquota gelijk, waarna de opzichters bij hem en bij Mozes en Aäron klagen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geen stro, dezelfde dagtaak</text><text x="44" y="113" class="ref">Exodus 5:6–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorheen</text><text x="68" y="241" class="body">Stro wordt geleverd voor het maken van</text><text x="68" y="284" class="body">bakstenen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het nieuwe bevel</text><text x="68" y="433" class="body">De mensen moeten zelf stro of stoppels</text><text x="68" y="476" class="body">verzamelen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dezelfde hoeveelheid</text><text x="68" y="625" class="body">De dagelijkse productie mag niet dalen.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het gevolg</text><text x="68" y="774" class="body">De opzichters worden geslagen, klagen</text><text x="68" y="817" class="body">bij Farao en verwijten Mozes en Aäron</text><text x="68" y="860" class="body">de verslechtering.</text><text x="46" y="953" class="note">Het hoofdstuk noemt geen exact aantal bakstenen;</text><text x="46" y="989" class="note">daarom staat hier geen verzonnen</text><text x="46" y="1025" class="note">productiecijfer.</text></svg>