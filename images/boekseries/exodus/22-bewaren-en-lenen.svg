<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Bewaren, lenen en vergoeden</title><desc id="desc">De tekst onderscheidt bewaring, diefstal, verscheuring, lenen met afwezige of aanwezige eigenaar en huur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bewaren, lenen en vergoeden</text><text x="44" y="113" class="ref">Exodus 22:7–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Toevertrouwde spullen</text><text x="68" y="241" class="body">Een gevonden dief vergoedt dubbel;</text><text x="68" y="284" class="body">zonder gevonden dief volgt onderzoek</text><text x="68" y="327" class="body">bij de rechters.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dier in bewaring</text><text x="68" y="476" class="body">Bij onopgemerkt verlies volgt een eed;</text><text x="68" y="519" class="body">diefstal bij de bewaker moet worden</text><text x="68" y="562" class="body">vergoed.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Verscheurd dier</text><text x="68" y="711" class="body">Resten als bewijs; dan hoeft het niet</text><text x="68" y="754" class="body">te worden vergoed.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Geleend dier</text><text x="68" y="903" class="body">Schade of dood wordt vergoed als de</text><text x="68" y="946" class="body">eigenaar afwezig was.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Eigenaar erbij of huur</text><text x="68" y="1095" class="body">Bij aanwezigheid hoeft de lener niet te</text><text x="68" y="1138" class="body">vergoeden; bij huur is de schade in de</text><text x="68" y="1181" class="body">prijs begrepen.</text><text x="46" y="1274" class="note">Elke rij beschrijft een afzonderlijke</text><text x="46" y="1310" class="note">rechtsregel; bewaren en lenen worden</text><text x="46" y="1346" class="note">onderscheiden.</text></svg>