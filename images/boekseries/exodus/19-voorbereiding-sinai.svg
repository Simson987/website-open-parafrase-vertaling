<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Voorbereiding bij de Sinaï</title><desc id="desc">De voorbereiding omvat heiliging, wassen, grensstelling en gereedstaan op de derde dag bij de berg Sinaï.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voorbereiding bij de Sinaï</text><text x="44" y="113" class="ref">Exodus 19:10–25</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vandaag en morgen</text><text x="68" y="241" class="body">Zich heiligen en de kleren wassen.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Een grens om de berg</text><text x="68" y="390" class="body">Het volk mag die grens niet doorbreken.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">De derde ochtend</text><text x="68" y="539" class="body">Donder, bliksem, een zware wolk en een</text><text x="68" y="582" class="body">luide bazuin.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Aan de voet van de berg</text><text x="68" y="731" class="body">Mozes leidt het volk naar buiten en</text><text x="68" y="774" class="body">ontvangt verdere waarschuwingen.</text><text x="46" y="867" class="note">De dichte wolk en het vuur worden weergegeven</text><text x="46" y="903" class="note">zonder menselijke gestalte van God.</text></svg>