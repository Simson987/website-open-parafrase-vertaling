<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Als een os schade veroorzaakt</title><desc id="desc">De rechtsregels onderscheiden een onverwacht gevaarlijke os van een bekend gevaarlijke os en verschillende soorten schade.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Als een os schade veroorzaakt</text><text x="44" y="113" class="ref">Exodus 21:28–36</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet eerder gevaarlijk bekend</text><text x="68" y="241" class="body">Bij het doden van een mens wordt de os</text><text x="68" y="284" class="body">gestenigd; de eigenaar blijft</text><text x="68" y="327" class="body">ongestraft.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wel gewaarschuwd</text><text x="68" y="476" class="body">Als de eigenaar de bekende gevaarlijke</text><text x="68" y="519" class="body">os niet vasthoudt, draagt ook hij</text><text x="68" y="562" class="body">verantwoordelijkheid.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Opgelegd losgeld</text><text x="68" y="711" class="body">Als losgeld wordt opgelegd, betaalt hij</text><text x="68" y="754" class="body">het vastgestelde bedrag.</text><rect x="42" y="812" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Schade aan een andere os</text><text x="68" y="903" class="body">Zonder eerdere waarschuwing worden</text><text x="68" y="946" class="body">levende waarde en dood dier gedeeld;</text><text x="68" y="989" class="body">bij bekende gevaarlijkheid wordt een</text><text x="68" y="1032" class="body">levende os vergoed.</text><text x="46" y="1125" class="note">De situaties en uitzonderingen volgen de</text><text x="46" y="1161" class="note">hoofdstuktekst; het diagram beeldt geen</text><text x="46" y="1197" class="note">verwondingen af.</text></svg>