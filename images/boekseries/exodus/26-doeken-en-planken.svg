<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Doeken, planken en voetstukken</title><desc id="desc">Tien linnen gordijnen, elf van geitenhaar, twee dekkleden, twintig planken aan elke lange zijde en acht aan de westzijde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Doeken, planken en voetstukken</text><text x="44" y="113" class="ref">Exodus 26:1–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Binnenste gordijnen</text><text x="68" y="241" class="body">Tien gordijnen, elk ongeveer 12,5 bij</text><text x="68" y="284" class="body">1,8 m; twee reeksen van vijf, vijftig</text><text x="68" y="327" class="body">gouden haakjes.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Geitenharen tent</text><text x="68" y="476" class="body">Elf gordijnen, elk ongeveer 13,5 bij</text><text x="68" y="519" class="body">1,8 m; reeksen van vijf en zes, vijftig</text><text x="68" y="562" class="body">koperen haakjes.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bovenste dekkleden</text><text x="68" y="711" class="body">Roodgeverfde ramsvellen en daarover</text><text x="68" y="754" class="body">dassenvellen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Zuid en noord</text><text x="68" y="903" class="body">Per zijde twintig planken en veertig</text><text x="68" y="946" class="body">zilveren voetstukken.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Westzijde</text><text x="68" y="1095" class="body">Zes planken en twee hoekplanken: acht</text><text x="68" y="1138" class="body">planken met zestien voetstukken.</text><text x="46" y="1231" class="note">De doeklagen, aantallen en afgeronde maten</text><text x="46" y="1267" class="note">volgen de plaatselijke vertaling.</text></svg>