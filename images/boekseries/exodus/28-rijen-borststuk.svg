<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1310" viewBox="0 0 840 1310" role="img" aria-labelledby="title desc"><title id="title">Vier rijen edelstenen</title><desc id="desc">De twaalf stenen in vier rijen volgens Exodus 28, zonder een ongenoemde stam-steenkoppeling te verzinnen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1310" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier rijen edelstenen</text><text x="44" y="113" class="ref">Exodus 28:16–21, 30</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste rij</text><text x="68" y="241" class="body">Sardis · topaas · karbonkel.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tweede rij</text><text x="68" y="390" class="body">Smaragd · saffier · diamant.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Derde rij</text><text x="68" y="539" class="body">Hyacint · agaat · amethist.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Vierde rij</text><text x="68" y="688" class="body">Turkoois · sardonix · jaspis.</text><rect x="42" y="746" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Twaalf stammen</text><text x="68" y="837" class="body">Elke steen draagt een naam; de passage</text><text x="68" y="880" class="body">koppelt geen specifieke stamnaam aan</text><text x="68" y="923" class="body">een bepaalde steensoort.</text><rect x="42" y="981" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1024" class="label">Bij het hart</text><text x="68" y="1072" class="body">Urim en Thummim worden in het borststuk</text><text x="68" y="1115" class="body">gelegd.</text><text x="46" y="1208" class="note">De steennamen volgen deze vertaling; het</text><text x="46" y="1244" class="note">vierkante borststuk is ongeveer 22 bij 22 cm.</text></svg>