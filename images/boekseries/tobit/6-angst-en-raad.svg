<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Tobias’ angst en de raad</title><desc id="desc">Tobias’ angst en de raad met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tobias’ angst en de raad</text><text x="44" y="113" class="ref">Tobit 6:15–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vrees</text><text x="68" y="241" class="body">Zeven mannen zijn gestorven; Tobias is</text><text x="68" y="284" class="body">het enige kind van zijn ouders.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De herinnering</text><text x="68" y="433" class="body">Zijn vader vroeg een vrouw uit de eigen</text><text x="68" y="476" class="body">familie te nemen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De instructie</text><text x="68" y="625" class="body">Het reukoffer en het samen aanroepen</text><text x="68" y="668" class="body">van God.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het gevolg</text><text x="68" y="817" class="body">Tobias krijgt Sara lief en hecht zich</text><text x="68" y="860" class="body">aan haar.</text><text x="46" y="953" class="note">Vraag, antwoord en gevolg zijn onderscheiden;</text><text x="46" y="989" class="note">Sara wordt niet als schuldige aan de</text><text x="46" y="1025" class="note">sterfgevallen afgebeeld.</text></svg>