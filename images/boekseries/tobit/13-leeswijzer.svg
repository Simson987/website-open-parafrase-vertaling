<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Een danklied voor herstel</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een danklied voor herstel</text><text x="44" y="113" class="ref">Tobit 13:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–9 · Prijs God onder de volken</text><text x="68" y="241" class="body">Tobit prijst Gods eeuwige koninkrijk,</text><text x="68" y="284" class="body">ontferming en de terugkeer naar Hem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">10–17 · Jeruzalem aangesproken</text><text x="68" y="433" class="body">De heilige stad zal opnieuw vreugde</text><text x="68" y="476" class="body">kennen; volken komen met gaven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">18–21 · De kostbare stad</text><text x="68" y="625" class="body">Stenen, goud en lofliederen verbeelden</text><text x="68" y="668" class="body">haar luister.</text><text x="46" y="761" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="797" class="note">de plaatselijke versindeling.</text></svg>