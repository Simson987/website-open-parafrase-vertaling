<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">Materialen in het stadslied</title><desc id="desc">Materialen in het stadslied met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Materialen in het stadslied</text><text x="44" y="113" class="ref">Tobit 13:18–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gebouwd · vers 18</text><text x="68" y="241" class="body">Saffier, smaragd en kostbare stenen.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Muren, torens en bolwerken</text><text x="68" y="390" class="body">Zuiver goud.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Straten · vers 20</text><text x="68" y="539" class="body">Beril, karbonkel en stenen uit Ofir.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Wat de wijken zeggen</text><text x="68" y="688" class="body">Halleluja; de stad klinkt van</text><text x="68" y="731" class="body">lofliederen.</text><text x="46" y="824" class="note">Eigen materiaalnamen van dit lied. De twaalf</text><text x="46" y="860" class="note">fundamentstenen uit Openbaring worden hier niet</text><text x="46" y="896" class="note">ingevoegd.</text></svg>