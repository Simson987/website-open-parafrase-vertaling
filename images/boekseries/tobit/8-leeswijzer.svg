<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Gebed, leven en vreugde</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, leven en vreugde</text><text x="44" y="113" class="ref">Tobit 8:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3 · Het reukoffer</text><text x="68" y="241" class="body">De raad van Rafaël wordt opgevolgd; de</text><text x="68" y="284" class="body">boze geest vlucht en wordt gebonden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">4–8 · Samen bidden</text><text x="68" y="433" class="body">Tobias en Sara prijzen God en vragen om</text><text x="68" y="476" class="body">samen oud te worden.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">9–16 · Angst wordt dank</text><text x="68" y="625" class="body">Raguël graaft een graf; het</text><text x="68" y="668" class="body">dienstmeisje vindt hen levend; het graf</text><text x="68" y="711" class="body">gaat dicht.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">17–18 · Veertien dagen</text><text x="68" y="860" class="body">Raguël geeft een bruiloftsfeest en</text><text x="68" y="903" class="body">bepaalt de erfenis.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>