<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Geven naar vermogen</title><desc id="desc">Geven naar vermogen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geven naar vermogen</text><text x="44" y="113" class="ref">Tobit 4:7–12,17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie veel heeft</text><text x="68" y="241" class="body">Geef veel.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Wie weinig heeft</text><text x="68" y="390" class="body">Wees niet bang ook van het weinige te</text><text x="68" y="433" class="body">geven.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Hoe je geeft</text><text x="68" y="582" class="body">Keer je gezicht niet af van armen; kijk</text><text x="68" y="625" class="body">niet gierig.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Wat je deelt</text><text x="68" y="774" class="body">Brood voor wie honger heeft en kleren</text><text x="68" y="817" class="body">voor wie niets heeft.</text><text x="46" y="910" class="note">Tobits raad aan zijn zoon; er wordt geen</text><text x="46" y="946" class="note">zelfgekozen vast percentage aan toegevoegd.</text></svg>