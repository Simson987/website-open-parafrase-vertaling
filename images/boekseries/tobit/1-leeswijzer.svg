<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Tobits trouw in ballingschap</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tobits trouw in ballingschap</text><text x="44" y="113" class="ref">Tobit 1:1–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–9 · Familie en trouw</text><text x="68" y="241" class="body">Naftali, Jeruzalem, eerstelingen en</text><text x="68" y="284" class="body">tienden; huwelijk met Anna en geboorte</text><text x="68" y="327" class="body">van Tobias.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">10–18 · In Nineve</text><text x="68" y="476" class="body">Eigen leefwijze, gunst bij Enemessar en</text><text x="68" y="519" class="body">zilver in bewaring bij Gabaël.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">19–23 · Goeddoen en gevaar</text><text x="68" y="668" class="body">Brood, kleren en begrafenissen; Tobit</text><text x="68" y="711" class="body">wordt verraden, vlucht en verliest</text><text x="68" y="754" class="body">bezit.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">24–25 · Terugkeer</text><text x="68" y="903" class="body">Onder Assar-Haddon doet neef Achiachar</text><text x="68" y="946" class="body">een goed woord voor hem.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>