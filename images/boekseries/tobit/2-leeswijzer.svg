<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Feest, begrafenis en blindheid</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Feest, begrafenis en blindheid</text><text x="44" y="113" class="ref">Tobit 2:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · Een onderbroken maaltijd</text><text x="68" y="241" class="body">Tobit zoekt een arme gast, maar hoort</text><text x="68" y="284" class="body">van een dode en bergt hem.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">6–11 · Rouw en nacht</text><text x="68" y="433" class="body">Amos’ woorden, begrafenis na</text><text x="68" y="476" class="body">zonsondergang en blindheid na de nacht</text><text x="68" y="519" class="body">bij de muur.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">12–15 · Anna en het bokje</text><text x="68" y="668" class="body">Anna verdient loon en een geschenk;</text><text x="68" y="711" class="body">Tobit verdenkt haar en zij weerspreekt</text><text x="68" y="754" class="body">hem.</text><text x="46" y="847" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="883" class="note">de plaatselijke versindeling.</text></svg>