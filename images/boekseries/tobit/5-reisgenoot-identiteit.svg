<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Wie is de reisgenoot?</title><desc id="desc">Wie is de reisgenoot? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie is de reisgenoot?</text><text x="44" y="113" class="ref">Tobit 5:5–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat de verteller zegt</text><text x="68" y="241" class="body">Rafaël is een engel; Tobias weet dat</text><text x="68" y="284" class="body">nog niet.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hoe hij zich noemt</text><text x="68" y="433" class="body">Azarias, zoon van de grote Ananias.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Wat Tobit onderzoekt</text><text x="68" y="582" class="body">Stam, familie, betrouwbaarheid en</text><text x="68" y="625" class="body">bekendheid.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het afgesproken loon</text><text x="68" y="774" class="body">Een drachme per dag, benodigdheden en</text><text x="68" y="817" class="body">iets extra bij gezonde terugkeer.</text><text x="46" y="910" class="note">Het onderscheid tussen lezerskennis en de kennis</text><text x="46" y="946" class="note">van Tobias blijft bewaard.</text></svg>