<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Hoe het huwelijk wordt bezegeld</title><desc id="desc">Hoe het huwelijk wordt bezegeld met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoe het huwelijk wordt bezegeld</text><text x="44" y="113" class="ref">Tobit 7:9–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vraag vóór de maaltijd</text><text x="68" y="241" class="body">Tobias wil eerst duidelijkheid over</text><text x="68" y="284" class="body">Sara.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Raguël vertelt de waarheid</text><text x="68" y="433" class="body">Hij verzwijgt de eerdere sterfgevallen</text><text x="68" y="476" class="body">niet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zegen en handslag</text><text x="68" y="625" class="body">Sara wordt aan Tobias gegeven volgens</text><text x="68" y="668" class="body">de wet van Mozes.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Schriftelijk vastgelegd</text><text x="68" y="817" class="body">Raguël schrijft en verzegelt een</text><text x="68" y="860" class="body">huwelijksakte; daarna eten zij.</text><text x="46" y="953" class="note">De akte en de zegen zijn afzonderlijke stappen</text><text x="46" y="989" class="note">in de plaatselijke volgorde.</text></svg>