<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Hoe het verdriet toeneemt</title><desc id="desc">Hoe het verdriet toeneemt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoe het verdriet toeneemt</text><text x="44" y="113" class="ref">Tobit 2:2–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerst de gast</text><text x="68" y="241" class="body">Tobit wil op het feest iemand</text><text x="68" y="284" class="body">uitnodigen die gebrek lijdt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dan de begrafenis</text><text x="68" y="433" class="body">Het bericht over een dode onderbreekt</text><text x="68" y="476" class="body">zijn maaltijd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Daarna de blindheid</text><text x="68" y="625" class="body">De nacht bij de muur, mussen en witte</text><text x="68" y="668" class="body">oogvlekken; artsen helpen niet.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ten slotte het conflict</text><text x="68" y="817" class="body">Anna’s bokje is volgens haar een</text><text x="68" y="860" class="body">geschenk boven op het loon, geen</text><text x="68" y="903" class="body">diefstal.</text><text x="46" y="996" class="note">De vrouw geeft zelf uitleg over haar loon en</text><text x="46" y="1032" class="note">geschenk; Tobits verdenking wordt niet als</text><text x="46" y="1068" class="note">bewezen diefstal verteld.</text></svg>