<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De beweging van het danklied</title><desc id="desc">De beweging van het danklied met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De beweging van het danklied</text><text x="44" y="113" class="ref">Tobit 13:2–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gods handelen</text><text x="68" y="241" class="body">Hij straft en ontfermt Zich; brengt</text><text x="68" y="284" class="body">neer en weer omhoog.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het antwoord van Israël</text><text x="68" y="433" class="body">Dank Hem onder de volken en keer</text><text x="68" y="476" class="body">oprecht naar Hem terug.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De stad hersteld</text><text x="68" y="625" class="body">Gevangenen en ellendigen ontvangen</text><text x="68" y="668" class="body">vreugde en liefde.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De volken komen</text><text x="68" y="817" class="body">Van ver brengen zij gaven en prijzen de</text><text x="68" y="860" class="body">Koning van de hemel.</text><text x="46" y="953" class="note">Lof en verwachting in Tobits lied; de</text><text x="46" y="989" class="note">stadspracht is geen verslag van een reeds</text><text x="46" y="1025" class="note">voltooide bouw.</text></svg>