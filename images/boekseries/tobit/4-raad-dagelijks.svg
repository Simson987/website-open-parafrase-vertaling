<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Raad voor dagelijks handelen</title><desc id="desc">Raad voor dagelijks handelen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Raad voor dagelijks handelen</text><text x="44" y="113" class="ref">Tobit 4:15–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Werk en loon</text><text x="68" y="241" class="body">Laat loon niet overnachten; betaal het</text><text x="68" y="284" class="body">meteen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Omgang</text><text x="68" y="433" class="body">Doe niemand aan wat hij haat; vermijd</text><text x="68" y="476" class="body">dronkenschap.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verstand</text><text x="68" y="625" class="body">Vraag goede raad en veracht die niet.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Gebed</text><text x="68" y="774" class="body">Prijs de Heere en vraag om rechte wegen</text><text x="68" y="817" class="body">en goede plannen.</text><text x="46" y="910" class="note">De korte toepassingen volgen de genoemde raad,</text><text x="46" y="946" class="note">zonder nieuwe gebeurtenissen toe te voegen.</text></svg>