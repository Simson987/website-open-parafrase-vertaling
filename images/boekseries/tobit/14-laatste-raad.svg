<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wat Tobit wil meegeven</title><desc id="desc">Wat Tobit wil meegeven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Tobit wil meegeven</text><text x="44" y="113" class="ref">Tobit 14:6–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Familie</text><text x="68" y="241" class="body">Tobias moet zijn zes zonen meenemen en</text><text x="68" y="284" class="body">naar Medië vertrekken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verwachting</text><text x="68" y="433" class="body">Nineve zal vallen; Jeruzalem krijgt na</text><text x="68" y="476" class="body">oordeel ook herstel.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Leefwijze</text><text x="68" y="625" class="body">Bewaar wet en geboden, heb</text><text x="68" y="668" class="body">barmhartigheid lief en wees</text><text x="68" y="711" class="body">rechtvaardig.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Ouders</text><text x="68" y="860" class="body">Begraaf Tobit met eer en Anna naast</text><text x="68" y="903" class="body">hem.</text><text x="46" y="996" class="note">Dit is Tobits raad vóór zijn overlijden; vertrek</text><text x="46" y="1032" class="note">volgt pas na het begraven van beide ouders.</text></svg>