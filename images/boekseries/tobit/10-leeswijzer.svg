<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Wachten en laten gaan</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wachten en laten gaan</text><text x="44" y="113" class="ref">Tobit 10:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–9 · In Nineve</text><text x="68" y="241" class="body">Tobit telt; Anna vreest het ergste en</text><text x="68" y="284" class="body">kijkt dagelijks uit naar de weg.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">10–11 · Bij Raguël</text><text x="68" y="433" class="body">Na veertien bruiloftsdagen vraagt</text><text x="68" y="476" class="body">Tobias te vertrekken; hij krijgt Sara</text><text x="68" y="519" class="body">en de helft mee.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">12–13 · De zegen</text><text x="68" y="668" class="body">Raguël en Edna zegenen hen en vragen</text><text x="68" y="711" class="body">respect en zorg; Tobias dankt.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>