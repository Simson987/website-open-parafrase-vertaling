<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Twee plaatsen en het antwoord</title><desc id="desc">Twee plaatsen en het antwoord met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee plaatsen en het antwoord</text><text x="44" y="113" class="ref">Tobit 3:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nineve · Tobit</text><text x="68" y="241" class="body">Verdriet na verwijten en blindheid;</text><text x="68" y="284" class="body">gebed om ontferming.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ecbatana · Sara</text><text x="68" y="433" class="body">Verdriet door spot en verlies; gebed</text><text x="68" y="476" class="body">bij het raam.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Op dezelfde dag</text><text x="68" y="625" class="body">Beide gebeden worden vóór Gods</text><text x="68" y="668" class="body">heerlijkheid gehoord.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Rafaëls opdracht</text><text x="68" y="817" class="body">Tobits ogen genezen, Sara aan Tobias</text><text x="68" y="860" class="body">verbinden en Asmodeüs binden.</text><text x="46" y="953" class="note">De laatste regel is de aangekondigde opdracht,</text><text x="46" y="989" class="note">nog niet de uitvoering in dit hoofdstuk.</text></svg>