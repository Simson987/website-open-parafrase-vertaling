<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Rafaël maakt zich bekend</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rafaël maakt zich bekend</text><text x="44" y="113" class="ref">Tobit 12:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–6 · Het loon</text><text x="68" y="241" class="body">Tobit en Tobias willen de reisgenoot de</text><text x="68" y="284" class="body">helft geven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">7–11 · Dank en gerechtigheid</text><text x="68" y="433" class="body">Maak Gods werken openbaar, bid, geef en</text><text x="68" y="476" class="body">leef rechtvaardig.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">12–19 · De onthulling</text><text x="68" y="625" class="body">Rafaël bracht hun gebeden en werd voor</text><text x="68" y="668" class="body">hun herstel gezonden; hij is een van de</text><text x="68" y="711" class="body">zeven engelen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">20–21 · Het afscheid</text><text x="68" y="860" class="body">Schrijf het op; Rafaël verdwijnt en zij</text><text x="68" y="903" class="body">prijzen God openlijk.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>