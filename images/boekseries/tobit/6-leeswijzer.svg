<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">De vis en de raad</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vis en de raad</text><text x="44" y="113" class="ref">Tobit 6:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–7 · Bij de Tigris</text><text x="68" y="241" class="body">Een vis valt aan; Tobias pakt hem,</text><text x="68" y="284" class="body">bewaart delen en zij eten de vis.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">8–10 · De betekenis van de delen</text><text x="68" y="433" class="body">Hart en lever voor rook tegen een boze</text><text x="68" y="476" class="body">geest, gal voor de witte oogvlekken.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">11–23 · Sara en het gebed</text><text x="68" y="625" class="body">Rafaël spreekt over huwelijk en</text><text x="68" y="668" class="body">erfenis; Tobias’ angst krijgt een</text><text x="68" y="711" class="body">antwoord en opdracht tot samen bidden.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>