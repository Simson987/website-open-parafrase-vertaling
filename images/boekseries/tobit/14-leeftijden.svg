<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Leeftijden in het slot</title><desc id="desc">Leeftijden in het slot met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leeftijden in het slot</text><text x="44" y="113" class="ref">Tobit 14:2–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Blind geworden · vers 2</text><text x="68" y="241" class="body">Tobit is 58 jaar.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Weer zien · vers 3</text><text x="68" y="390" class="body">Na acht jaar; de tekst noemt de duur</text><text x="68" y="433" class="body">van de blindheid.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Tobits overlijden · vers 13</text><text x="68" y="582" class="body">158 jaar.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Tobias’ overlijden · vers 16</text><text x="68" y="731" class="body">127 jaar, in Ecbatana in Medië.</text><text x="46" y="824" class="note">Tobit en Tobias zijn twee verschillende</text><text x="46" y="860" class="note">personen; hun leeftijden worden niet verwisseld.</text></svg>