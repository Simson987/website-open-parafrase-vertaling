<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Raad voor Tobias</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Raad voor Tobias</text><text x="44" y="113" class="ref">Tobit 4:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · Ouders en begraven</text><text x="68" y="241" class="body">Tobit roept Tobias, vraagt zorg voor</text><text x="68" y="284" class="body">Anna en noemt het gezamenlijke graf.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">6–14 · Recht en vrijgevigheid</text><text x="68" y="433" class="body">Denk aan God, geef naar vermogen en</text><text x="68" y="476" class="body">vermijd trots.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">15–20 · Dagelijks handelen</text><text x="68" y="625" class="body">Meteen betalen, verstandig omgaan,</text><text x="68" y="668" class="body">delen, raad vragen en God prijzen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">21 · Het geld</text><text x="68" y="817" class="body">Tien talenten bij Gabaël in Rages;</text><text x="68" y="860" class="body">rijkdom ligt ook in ontzag en</text><text x="68" y="903" class="body">rechtvaardigheid.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>