<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Het geld en de bruiloft</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het geld en de bruiloft</text><text x="44" y="113" class="ref">Tobit 9:1–8</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · Tobias’ verzoek</text><text x="68" y="241" class="body">Rafaël moet met een knecht en twee</text><text x="68" y="284" class="body">kamelen naar Rages; Tobit telt thuis de</text><text x="68" y="327" class="body">dagen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">6–7 · Bij Gabaël</text><text x="68" y="476" class="body">Schuldbewijs getoond; de nog verzegelde</text><text x="68" y="519" class="body">zakjes worden overgedragen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">8 · Terug</text><text x="68" y="668" class="body">Rafaël en Gabaël komen naar de</text><text x="68" y="711" class="body">bruiloft; Tobias zegent zijn vrouw.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>