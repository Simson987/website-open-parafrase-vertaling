<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat Rafaël al gedaan had</title><desc id="desc">Wat Rafaël al gedaan had met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Rafaël al gedaan had</text><text x="44" y="113" class="ref">Tobit 12:12–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gebeden</text><text x="68" y="241" class="body">Bracht de herinnering aan Tobits en</text><text x="68" y="284" class="body">Sara’s gebed voor de Heilige.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Goeddoen</text><text x="68" y="433" class="body">Was aanwezig toen Tobit zijn maaltijd</text><text x="68" y="476" class="body">verliet om doden te begraven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Herstel</text><text x="68" y="625" class="body">Werd gestuurd om Tobit en Sara te</text><text x="68" y="668" class="body">genezen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nu de opdracht</text><text x="68" y="817" class="body">Wees niet bang, prijs God en schrijf</text><text x="68" y="860" class="body">alles op wat is gebeurd.</text><text x="46" y="953" class="note">De reisgenoot wordt nu pas aan de twee mannen</text><text x="46" y="989" class="note">als Rafaël bekend.</text></svg>