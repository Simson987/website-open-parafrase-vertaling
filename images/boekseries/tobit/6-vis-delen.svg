<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De bewaarde delen van de vis</title><desc id="desc">De bewaarde delen van de vis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De bewaarde delen van de vis</text><text x="44" y="113" class="ref">Tobit 6:6–10,19–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hart en lever</text><text x="68" y="241" class="body">Op de as van het reukoffer laten roken.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Hun rol in het verhaal</text><text x="68" y="390" class="body">De boze geest zal die geur ruiken en</text><text x="68" y="433" class="body">vluchten.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Gal</text><text x="68" y="582" class="body">Voor witte vlekken op de ogen; deze</text><text x="68" y="625" class="body">verhaallijn wordt later uitgevoerd.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Daarnaast: samen bidden</text><text x="68" y="774" class="body">Beiden moeten de barmhartige God</text><text x="68" y="817" class="body">aanroepen.</text><text x="46" y="910" class="note">Een overzicht van Rafaëls raad binnen het</text><text x="46" y="946" class="note">reisverhaal; de uitvoering volgt in latere</text><text x="46" y="982" class="note">hoofdstukken.</text></svg>