<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">Tobits gezin en zijn neef</title><desc id="desc">Tobits gezin en zijn neef met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tobits gezin en zijn neef</text><text x="44" y="113" class="ref">Tobit 1:9,24–25</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tobit en Anna</text><text x="68" y="241" class="body">Echtgenoten uit dezelfde familie.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tobias</text><text x="68" y="390" class="body">De zoon van Tobit en Anna.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Anaël</text><text x="68" y="539" class="body">De broer van Tobit.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Achiachar</text><text x="68" y="688" class="body">De zoon van Anaël; dus Tobits neef. Hij</text><text x="68" y="731" class="body">pleit voor Tobits terugkeer.</text><text x="46" y="824" class="note">Gabaël uit Tobits voorouderlijst wordt niet</text><text x="46" y="860" class="note">zonder bewijs gelijkgesteld aan de geldbewaarder</text><text x="46" y="896" class="note">in Rages.</text></svg>