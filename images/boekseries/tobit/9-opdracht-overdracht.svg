<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Verzoek, bewijs en overdracht</title><desc id="desc">Verzoek, bewijs en overdracht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verzoek, bewijs en overdracht</text><text x="44" y="113" class="ref">Tobit 9:3–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie reist?</text><text x="68" y="241" class="body">Rafaël, een knecht en twee kamelen;</text><text x="68" y="284" class="body">Tobias blijft bij het feest.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waarheen?</text><text x="68" y="433" class="body">Naar Gabaël in Rages in Medië.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Welk bewijs?</text><text x="68" y="582" class="body">Het schuldbewijs dat Tobit had</text><text x="68" y="625" class="body">meegegeven.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Wat komt terug?</text><text x="68" y="774" class="body">De verzegelde geldzakjes en Gabaël zelf</text><text x="68" y="817" class="body">voor de bruiloft.</text><text x="46" y="910" class="note">De geldbewaarder Gabaël en Sara’s vader Raguël</text><text x="46" y="946" class="note">zijn twee verschillende personen.</text></svg>