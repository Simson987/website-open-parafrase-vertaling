<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">De kring van lof</title><desc id="desc">De kring van lof met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De kring van lof</text><text x="44" y="113" class="ref">Gezang in de vuuroven 1:51–90</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De drie · 51–56</text><text x="68" y="241" class="body">Eén stem van lof tot de God van de</text><text x="68" y="284" class="body">vaderen, in tempel en hemel.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hemel en weer · 57–73</text><text x="68" y="433" class="body">Werken, engelen, hemel, water,</text><text x="68" y="476" class="body">lichtdragers, regen, wind, hitte, kou,</text><text x="68" y="519" class="body">ijs en wolken.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Aarde en leven · 74–81</text><text x="68" y="668" class="body">Bergen, planten, bronnen, zeeën,</text><text x="68" y="711" class="body">rivieren, waterdieren, vogels, wilde</text><text x="68" y="754" class="body">dieren en vee.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Mensen en dank · 82–90</text><text x="68" y="903" class="body">Mensen, Israël, priesters, dienaren,</text><text x="68" y="946" class="body">rechtvaardigen, nederigen en de drie</text><text x="68" y="989" class="body">geredden.</text><text x="46" y="1082" class="note">Ananias, Azaria en Misaël worden in vers 88</text><text x="46" y="1118" class="note">genoemd. De schepping wordt poëtisch tot lof</text><text x="46" y="1154" class="note">uitgenodigd.</text></svg>