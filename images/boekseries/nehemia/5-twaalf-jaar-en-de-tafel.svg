<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Twaalf jaar en de tafel</title><desc id="desc">De langere bestuursperiode, vrijstelling van lasten en tafelvoorziening.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twaalf jaar en de tafel</text><text x="44" y="113" class="ref">Nehemia 5:14–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bestuursperiode</text><text x="68" y="241" class="body">Jaar twintig tot tweeëndertig van</text><text x="68" y="284" class="body">Arthahsasta: twaalf jaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Geen landvoogdsbrood</text><text x="68" y="433" class="body">Nehemia en zijn broers leggen deze</text><text x="68" y="476" class="body">voorziening niet aan het volk op.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Werk aan de muur</text><text x="68" y="625" class="body">Geen land gekocht; knechten werken mee.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De tafel</text><text x="68" y="774" class="body">150 Joden en bestuurders, plus</text><text x="68" y="817" class="body">bezoekers uit omliggende volken.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Voorziening</text><text x="68" y="966" class="body">Dagelijks één rund, zes schapen en</text><text x="68" y="1009" class="body">vogels; om de tien dagen allerlei wijn.</text><text x="46" y="1102" class="note">Dit is een terugblik op zijn bestuur, geen</text><text x="46" y="1138" class="note">mededeling dat alle twaalf jaren tijdens de</text><text x="46" y="1174" class="note">tweeënvijftig bouwdagen verlopen.</text></svg>