<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Tobia’s familiebanden</title><desc id="desc">De twee huwelijksverbindingen en hun rol in de brievenwisseling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tobia’s familiebanden</text><text x="44" y="113" class="ref">Nehemia 6:17–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sechanja, zoon van Arah</text><text x="68" y="241" class="body">Zijn dochter is getrouwd met Tobia;</text><text x="68" y="284" class="body">Tobia is Sechanja’s schoonzoon.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tobia en zijn zoon</text><text x="68" y="433" class="body">Johanan is Tobia’s zoon.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Mesullam, zoon van Berechja</text><text x="68" y="582" class="body">Zijn dochter is getrouwd met Johanan.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De brieven</text><text x="68" y="731" class="body">Edelen corresponderen met Tobia,</text><text x="68" y="774" class="body">prijzen hem bij Nehemia en geven</text><text x="68" y="817" class="body">Nehemia’s woorden door.</text><text x="46" y="910" class="note">De dochters krijgen hier geen eigennaam; beide</text><text x="46" y="946" class="note">huwelijksbanden worden niet tot één vader-</text><text x="46" y="982" class="note">zoonketen gemaakt.</text></svg>