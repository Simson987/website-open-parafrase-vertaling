<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1000" viewBox="0 0 840 1000"><title>Tobia’s familiebanden</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="1000" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Tobia’s familiebanden</text><text x="42" y="108" font-size="28">Nehemia 6:17–19</text><path d="M140 210V270" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><path d="M140 330V390" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 210V270" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 330V570" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 450V570" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><path d="M240 416H320M240 424H320" stroke="#9b7652" stroke-width="3"/><path d="M520 596H600M520 604H600" stroke="#9b7652" stroke-width="3"/><rect x="40" y="150" width="200" height="60" rx="10" fill="white" stroke="#92a18e"/><text x="140" y="189" text-anchor="middle" font-size="26">Arah</text><rect x="600" y="150" width="200" height="60" rx="10" fill="white" stroke="#92a18e"/><text x="700" y="189" text-anchor="middle" font-size="26">Berechja</text><rect x="40" y="270" width="200" height="60" rx="10" fill="white" stroke="#92a18e"/><text x="140" y="309" text-anchor="middle" font-size="26">Sechanja</text><rect x="600" y="270" width="200" height="60" rx="10" fill="white" stroke="#92a18e"/><text x="700" y="309" text-anchor="middle" font-size="26">Mesullam</text><rect x="40" y="390" width="200" height="60" rx="10" fill="white" stroke="#92a18e"/><text x="140" y="429" text-anchor="middle" font-size="26">Dochter</text><rect x="320" y="390" width="200" height="60" rx="10" fill="white" stroke="#92a18e"/><text x="420" y="429" text-anchor="middle" font-size="26">Tobia</text><rect x="320" y="570" width="200" height="60" rx="10" fill="white" stroke="#92a18e"/><text x="420" y="609" text-anchor="middle" font-size="26">Johanan</text><rect x="600" y="570" width="200" height="60" rx="10" fill="white" stroke="#92a18e"/><text x="700" y="609" text-anchor="middle" font-size="26">Dochter</text><text x="42" y="700" font-size="27">Pijl: genoemde ouder → kind.</text><text x="42" y="746" font-size="27">Dubbele lijn: huwelijk.</text><text x="42" y="792" font-size="27">De dochters worden niet bij name genoemd.</text><text x="42" y="858" font-size="27">Deze huwelijksbanden verbinden Tobia met Juda.</text><text x="42" y="900" font-size="27">Edelen wisselen brieven met hem uit en brengen</text><text x="42" y="942" font-size="27">Nehemia’s woorden over; Tobia wil hem bang maken.</text></g></svg>