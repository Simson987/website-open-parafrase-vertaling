<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1769" viewBox="0 0 840 1769" role="img" aria-labelledby="title desc"><title id="title">Terugkeer en herstel</title><desc id="desc">De verschillende hervormingen, context en opvolgende maatregelen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1769" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Terugkeer en herstel</text><text x="44" y="113" class="ref">Nehemia 13:1–31</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afwezig en terug</text><text x="68" y="241" class="body">Nehemia was in Arthahsasta’s jaar 32</text><text x="68" y="284" class="body">naar de koning; later opnieuw verlof en</text><text x="68" y="327" class="body">terugkeer.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tobia’s kamer</text><text x="68" y="476" class="body">Huishoudelijke spullen eruit; reinigen</text><text x="68" y="519" class="body">en heilig gerei, graanoffer en wierook</text><text x="68" y="562" class="body">terug.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Verwaarloosde dienst</text><text x="68" y="711" class="body">Levieten waren naar hun akkers;</text><text x="68" y="754" class="body">terugroepen, tienden en betrouwbare</text><text x="68" y="797" class="body">beheerders.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Sabbat</text><text x="68" y="946" class="body">Geen handel; poorten vóór sabbat dicht,</text><text x="68" y="989" class="body">handelaars buiten gewaarschuwd en</text><text x="68" y="1032" class="body">Levieten bewaken.</text><rect x="42" y="1090" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1133" class="label">Huwelijken en taal</text><text x="68" y="1181" class="body">Kinderen spreken andere talen;</text><text x="68" y="1224" class="body">aanklacht, eed en verwijzing naar</text><text x="68" y="1267" class="body">Salomo’s zonde.</text><rect x="42" y="1325" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1368" class="label">Slot</text><text x="68" y="1416" class="body">Een schoonzoon van Sanballat</text><text x="68" y="1459" class="body">weggejaagd; diensten, hout en</text><text x="68" y="1502" class="body">eerstelingen geregeld.</text><text x="46" y="1595" class="note">Het hoofdstuk onderscheidt afwezigheid en</text><text x="46" y="1631" class="note">terugkeer. Bij de huwelijkskwestie noemt het ook</text><text x="46" y="1667" class="note">slaan, haren uittrekken en een eed als</text><text x="46" y="1703" class="note">afzonderlijke handelingen.</text></svg>