<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1561" viewBox="0 0 840 1561" role="img" aria-labelledby="title desc"><title id="title">Beroepen en gelijknamigen</title><desc id="desc">Samenwerking van verschillende groepen met onderscheid tussen gelijknamige personen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1561" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beroepen en gelijknamigen</text><text x="44" y="113" class="ref">Nehemia 3:8–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verschillende beroepen</text><text x="68" y="241" class="body">Goudsmeden, zalfbereider, priesters,</text><text x="68" y="284" class="body">Levieten, leiders en handelaars werken</text><text x="68" y="327" class="body">mee.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Sallum, zoon van Lohes</text><text x="68" y="476" class="body">Leider van de andere helft van</text><text x="68" y="519" class="body">Jeruzalem; bouwt met zijn dochters.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Sallum, zoon van Kol-Hoze</text><text x="68" y="668" class="body">Andere persoon: leider van Mizpa,</text><text x="68" y="711" class="body">hersteller van de Bronpoort.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Nehemia, zoon van Azbuk</text><text x="68" y="860" class="body">Leider van een helft van Beth-Zur;</text><text x="68" y="903" class="body">andere persoon dan de verteller, zoon</text><text x="68" y="946" class="body">van Hachalja.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Thekoa</text><text x="68" y="1095" class="body">Bouwt twee gedeelten; de vooraanstaande</text><text x="68" y="1138" class="body">mannen weigeren het werk in vers 5.</text><rect x="42" y="1196" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1239" class="label">Eigen huis of kamer</text><text x="68" y="1287" class="body">Onder meer Jedaja, Benjamin, Hassub,</text><text x="68" y="1330" class="body">Azaria, priesters, Zadok en Mesullam.</text><text x="46" y="1423" class="note">Gelijke voornamen betekenen niet automatisch</text><text x="46" y="1459" class="note">dezelfde persoon. De tekst noemt vaak</text><text x="46" y="1495" class="note">verschillende vaders en functies.</text></svg>