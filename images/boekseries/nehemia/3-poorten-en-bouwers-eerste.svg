<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">Poorten en bouwers, deel één</title><desc id="desc">Bij naam genoemde poorten, hun bouwers en het meetgegeven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Poorten en bouwers, deel één</text><text x="44" y="113" class="ref">Nehemia 3:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schaapspoort</text><text x="68" y="241" class="body">Hogepriester Eljasib en priesters; tot</text><text x="68" y="284" class="body">Mea en Hananeël.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vispoort</text><text x="68" y="433" class="body">Mensen van Senaä plaatsen balken,</text><text x="68" y="476" class="body">deuren, sloten en grendels.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Oude Poort</text><text x="68" y="625" class="body">Jojada, zoon van Paseah, en Mesullam,</text><text x="68" y="668" class="body">zoon van Besodja.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dalpoort</text><text x="68" y="817" class="body">Hanun en Zanoah; ook 450 meter muur tot</text><text x="68" y="860" class="body">de Mestpoort.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Mestpoort</text><text x="68" y="1009" class="body">Malchia, zoon van Rechab; leider van</text><text x="68" y="1052" class="body">Beth-Cherem.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Bronpoort</text><text x="68" y="1201" class="body">Sallum, zoon van Kol-Hoze, uit Mizpa;</text><text x="68" y="1244" class="body">ook overdekking en muur bij Selah.</text><text x="46" y="1337" class="note">Deze kaartjes volgen de tekst; de verhoudingen</text><text x="46" y="1373" class="note">geven geen afstanden aan behalve de</text><text x="46" y="1409" class="note">uitdrukkelijk genoemde 450 meter.</text></svg>