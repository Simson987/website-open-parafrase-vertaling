<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1346" viewBox="0 0 840 1346" role="img" aria-labelledby="title desc"><title id="title">Familiehoofden, eerste deel</title><desc id="desc">Paren uit de familiehoofdenlijst met behoud van de gezamenlijke formulering in vers 17.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1346" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familiehoofden, eerste deel</text><text x="44" y="113" class="ref">Nehemia 12:12–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Seraja en Jeremia</text><text x="68" y="241" class="body">Meraja bij Seraja; Hananja bij Jeremia.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Ezra en Amarja</text><text x="68" y="390" class="body">Mesullam bij Ezra; Johanan bij Amarja.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Melichu en Sebanja</text><text x="68" y="539" class="body">Jonathan bij Melichu; Jozef bij</text><text x="68" y="582" class="body">Sebanja.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Harim en Merajoth</text><text x="68" y="731" class="body">Adna bij Harim; Helkai bij Merajoth.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Iddo en Ginnethon</text><text x="68" y="880" class="body">Zacharia bij Iddo; Mesullam bij</text><text x="68" y="923" class="body">Ginnethon.</text><rect x="42" y="981" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1024" class="label">Abia, Minjamin en Moadja</text><text x="68" y="1072" class="body">Zichri bij Abia; Piltai bij Minjamin en</text><text x="68" y="1115" class="body">Moadja zoals samen in vers 17 genoemd.</text><text x="46" y="1208" class="note">Familie en bijbehorend hoofd in Jojakims tijd;</text><text x="46" y="1244" class="note">de tekst noemt niet overal een expliciete</text><text x="46" y="1280" class="note">directe vader-zoonrelatie.</text></svg>