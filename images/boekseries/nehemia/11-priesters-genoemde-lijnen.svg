<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Genoemde priesterlijnen</title><desc id="desc">Pijlen van genoemde voorouder naar nakomeling; afzonderlijke lijnen blijven apart.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Genoemde priesterlijnen</text><text x="44" y="113" class="ref">Nehemia 11:11–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Seraja</text><text x="68" y="241" class="body">Ahitub → Merajoth → Zadok → Mesullam →</text><text x="68" y="284" class="body">Hilkia → Seraja</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Adaja</text><text x="68" y="433" class="body">Malchia → Pashur → Zacharja → Amzi →</text><text x="68" y="476" class="body">Pelalja → Jeroham → Adaja</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Amassai</text><text x="68" y="625" class="body">Immer → Mesillemoth → Achzai → Azareël</text><text x="68" y="668" class="body">→ Amassai</text><text x="46" y="761" class="note">De drie lijnen horen bij afzonderlijke mensen.</text><text x="46" y="797" class="note">Gelijknamige personen uit een andere passage</text><text x="46" y="833" class="note">worden niet automatisch ingevoegd.</text></svg>