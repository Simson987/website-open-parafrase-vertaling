<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">De eed en de afspraken</title><desc id="desc">Deelnemers en de concrete afspraken over samenleving en eredienst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eed en de afspraken</text><text x="44" y="113" class="ref">Nehemia 10:28–35</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie sluiten zich aan</text><text x="68" y="241" class="body">Dienstgroepen en het overige volk; ook</text><text x="68" y="284" class="body">vrouwen, zonen en dochters die</text><text x="68" y="327" class="body">begrijpen kunnen.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De eed</text><text x="68" y="476" class="body">Gods wet en geboden houden en doen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Huwelijken</text><text x="68" y="625" class="body">Geen dochters over en weer aan de</text><text x="68" y="668" class="body">volken van het land geven.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Sabbat en zevende jaar</text><text x="68" y="817" class="body">Niet kopen op heilige dagen; landrust</text><text x="68" y="860" class="body">en schuldkwijtschelding in jaar zeven.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Jaarlijkse bijdrage</text><text x="68" y="1009" class="body">Circa vier gram zilver voor de dienst,</text><text x="68" y="1052" class="body">offers, feestdagen en heilige gaven.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Brandhout en eerstelingen</text><text x="68" y="1201" class="body">Lot per familie op vaste tijden; eerste</text><text x="68" y="1244" class="body">opbrengst en boomvruchten jaarlijks.</text><text x="46" y="1337" class="note">Deze afspraken behoren bij het in dit hoofdstuk</text><text x="46" y="1373" class="note">gesloten verbond; het schema voegt geen latere</text><text x="46" y="1409" class="note">regels toe.</text></svg>