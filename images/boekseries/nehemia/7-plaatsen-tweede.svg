<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1366" viewBox="0 0 840 1366" role="img" aria-labelledby="title desc"><title id="title">Woonplaatsen, tweede deel</title><desc id="desc">Namen en aantallen uit de plaatselijke passage.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1366" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Woonplaatsen, tweede deel</text><text x="44" y="113" class="ref">Nehemia 7:32–38</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bethel en Ai</text><text x="68" y="241" class="body">123</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">het andere Nebo</text><text x="68" y="390" class="body">52</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">de andere Elam</text><text x="68" y="539" class="body">1.254</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Harim</text><text x="68" y="688" class="body">320</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Jericho</text><text x="68" y="837" class="body">345</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Lod, Hadid en Ono</text><text x="68" y="986" class="body">721</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">Senaä</text><text x="68" y="1135" class="body">3.930</text><text x="46" y="1228" class="note">Deze aantallen volgen Nehemia 7. Verschillen met</text><text x="46" y="1264" class="note">Ezra 2 zijn niet stilzwijgend gelijkgetrokken;</text><text x="46" y="1300" class="note">namen blijven bij hun eigen lijst.</text></svg>