<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1498" viewBox="0 0 840 1498" role="img" aria-labelledby="title desc"><title id="title">Twee dankkoren en hun routes</title><desc id="desc">De twee afzonderlijke routes en hun samenkomst zonder een verzonnen kaart.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1498" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee dankkoren en hun routes</text><text x="44" y="113" class="ref">Nehemia 12:31–42</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste koor</text><text x="68" y="241" class="body">Rechts naar de Mestpoort; Hosaja en</text><text x="68" y="284" class="body">helft leiders volgen; Ezra loopt voor</text><text x="68" y="327" class="body">hen uit.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Eerste route verder</text><text x="68" y="476" class="body">Bronpoort → trappen Stad van David →</text><text x="68" y="519" class="body">opgang muur → huis van David →</text><text x="68" y="562" class="body">Waterpoort in het oosten.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Tweede koor</text><text x="68" y="711" class="body">Andere richting; Nehemia met helft volk</text><text x="68" y="754" class="body">erachter.</text><rect x="42" y="812" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Tweede route verder</text><text x="68" y="903" class="body">Bakoventoren → brede muur → Efraïmpoort</text><text x="68" y="946" class="body">→ Oude Poort → Vispoort → Hananeël →</text><text x="68" y="989" class="body">Mea → Schaapspoort; stilstaan bij</text><text x="68" y="1032" class="body">Wachtpoort.</text><rect x="42" y="1090" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1133" class="label">Samen</text><text x="68" y="1181" class="body">Beide koren daarna in Gods huis;</text><text x="68" y="1224" class="body">priesters met trompetten en zangers</text><text x="68" y="1267" class="body">onder Jizrahja.</text><text x="46" y="1360" class="note">De pijlen geven de tekstvolgorde, geen</text><text x="46" y="1396" class="note">noordpijl, schaal of bewezen straatgeometrie.</text><text x="46" y="1432" class="note">Twee verschillende optochten komen samen.</text></svg>