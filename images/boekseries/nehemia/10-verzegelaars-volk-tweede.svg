<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1366" viewBox="0 0 840 1366" role="img" aria-labelledby="title desc"><title id="title">Volkshoofden, tweede deel</title><desc id="desc">De eigen namenlijst met versankers en zonder toegevoegde verwantschappen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1366" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volkshoofden, tweede deel</text><text x="44" y="113" class="ref">Nehemia 10:21–27</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 21</text><text x="68" y="241" class="body">Mesezabeël, Zadok, Jaddua,</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vers 22</text><text x="68" y="390" class="body">Pelatja, Hanan, Anaja,</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Vers 23</text><text x="68" y="539" class="body">Hosea, Hananja, Hassub,</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Vers 24</text><text x="68" y="688" class="body">Hallohes, Pilha, Sobek,</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Vers 25</text><text x="68" y="837" class="body">Rehum, Hasabna, Maäseja,</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Vers 26</text><text x="68" y="986" class="body">Ahia, Hanan, Anan,</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">Vers 27</text><text x="68" y="1135" class="body">Malluch, Harim en Baäna.</text><text x="46" y="1228" class="note">Namen staan in de volgorde van deze eigen lijst.</text><text x="46" y="1264" class="note">Herhaalde namen blijven zichtbaar; opeenvolging</text><text x="46" y="1300" class="note">is geen vader-zoonrelatie.</text></svg>