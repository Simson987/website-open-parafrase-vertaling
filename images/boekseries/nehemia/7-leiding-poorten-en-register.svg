<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1362" viewBox="0 0 840 1362" role="img" aria-labelledby="title desc"><title id="title">Leiding, poorten en register</title><desc id="desc">Leiders, veiligheidsmaatregelen en de functie van het gevonden register.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1362" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leiding, poorten en register</text><text x="44" y="113" class="ref">Nehemia 7:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Na de muur</text><text x="68" y="241" class="body">Deuren geplaatst; poortwachters,</text><text x="68" y="284" class="body">zangers en Levieten aangesteld.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twee leiders</text><text x="68" y="433" class="body">Hanani, Nehemia’s broer, en Hananja,</text><text x="68" y="476" class="body">bevelhebber van de burcht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De poorten</text><text x="68" y="625" class="body">Pas open als de zon warm is; sluiten en</text><text x="68" y="668" class="body">grendelen onder toezicht.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Een grote, lege stad</text><text x="68" y="817" class="body">Weinig inwoners, huizen nog niet</text><text x="68" y="860" class="body">herbouwd.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het register</text><text x="68" y="1009" class="body">Familie-inschrijving; gevonden lijst</text><text x="68" y="1052" class="body">van de eerste terugkeerders met</text><text x="68" y="1095" class="body">Zerubbabel.</text><text x="46" y="1188" class="note">De oudere terugkeerlijst wordt in het huidige</text><text x="46" y="1224" class="note">verhaal aangehaald; de daarin genoemde Nehemia</text><text x="46" y="1260" class="note">wordt niet automatisch gelijkgesteld aan de</text><text x="46" y="1296" class="note">verteller.</text></svg>