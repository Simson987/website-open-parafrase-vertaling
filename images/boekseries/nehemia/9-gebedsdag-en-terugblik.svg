<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">De gebedsdag en terugblik</title><desc id="desc">Gebedsdag, tijdsverdeling en de eerste historische bewegingen in het gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gebedsdag en terugblik</text><text x="44" y="113" class="ref">Nehemia 9:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dag vierentwintig</text><text x="68" y="241" class="body">Vasten, rouwkleding en aarde op het</text><text x="68" y="284" class="body">hoofd; schuld belijden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twee kwartdagen</text><text x="68" y="433" class="body">Eén kwart lezen; één kwart belijden en</text><text x="68" y="476" class="body">aanbidden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Schepping en Abraham</text><text x="68" y="625" class="body">Lof voor de Schepper; Abram gekozen,</text><text x="68" y="668" class="body">naam Abraham en landbelofte.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Uittocht en wet</text><text x="68" y="817" class="body">Egypte, zee, wolk en vuur; Sinaï,</text><text x="68" y="860" class="body">geboden, brood en water.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Ontrouw en trouw</text><text x="68" y="1009" class="body">Weigering en kalf, toch veertig jaar</text><text x="68" y="1052" class="body">onderhouden.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Het land</text><text x="68" y="1201" class="body">Sihon, Og, talrijke kinderen, steden en</text><text x="68" y="1244" class="body">overvloed ontvangen.</text><text x="46" y="1337" class="note">De uittocht en woestijn zijn herinnerde</text><text x="46" y="1373" class="note">geschiedenis binnen dit gebed; ze vinden niet</text><text x="46" y="1409" class="note">opnieuw op deze gebedsdag plaats.</text></svg>