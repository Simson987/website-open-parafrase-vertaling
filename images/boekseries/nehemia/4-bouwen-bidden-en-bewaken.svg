<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1518" viewBox="0 0 840 1518" role="img" aria-labelledby="title desc"><title id="title">Bouwen, bidden en bewaken</title><desc id="desc">Voortgang, dreiging en de organisatie van werk en bewaking.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1518" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bouwen, bidden en bewaken</text><text x="44" y="113" class="ref">Nehemia 4:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spot en voortgang</text><text x="68" y="241" class="body">Sanballat en Tobia spotten; de muur</text><text x="68" y="284" class="body">raakt tot de helft gesloten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Samenzwering</text><text x="68" y="433" class="body">Vijanden willen verwarring en aanval;</text><text x="68" y="476" class="body">gebed én dag-en-nachtwacht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Uitputting</text><text x="68" y="625" class="body">Veel puin en vermoeide dragers;</text><text x="68" y="668" class="body">herhaalde waarschuwingen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Verdeling</text><text x="68" y="817" class="body">Families bewapend op kwetsbare plekken;</text><text x="68" y="860" class="body">helft werkt en helft bewaakt.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Signaal</text><text x="68" y="1009" class="body">Hoornblazer naast Nehemia; bij het</text><text x="68" y="1052" class="body">geluid samenkomen.</text><rect x="42" y="1110" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Dag en nacht</text><text x="68" y="1201" class="body">Werken tot de sterren, binnen</text><text x="68" y="1244" class="body">overnachten en wapens bij de hand</text><text x="68" y="1287" class="body">houden.</text><text x="46" y="1380" class="note">De aanval is een dreigplan; dit hoofdstuk</text><text x="46" y="1416" class="note">vertelt geen uitgevoerde veldslag. De vos in</text><text x="46" y="1452" class="note">vers 3 is spotspraak.</text></svg>