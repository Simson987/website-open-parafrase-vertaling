<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1644" viewBox="0 0 840 1644" role="img" aria-labelledby="title desc"><title id="title">Verzegelaars en priesters</title><desc id="desc">De eigen namenlijst met versankers en zonder toegevoegde verwantschappen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1644" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verzegelaars en priesters</text><text x="44" y="113" class="ref">Nehemia 10:1–8</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 1</text><text x="68" y="241" class="body">De verzegelaars waren: Nehemia, de</text><text x="68" y="284" class="body">landvoogd, de zoon van Hachalja, en</text><text x="68" y="327" class="body">Zidkia,</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vers 2</text><text x="68" y="476" class="body">Seraja, Azarja, Jeremia,</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vers 3</text><text x="68" y="625" class="body">Pashur, Amarja, Malchia,</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Vers 4</text><text x="68" y="774" class="body">Hattus, Sebanja, Malluch,</text><rect x="42" y="832" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Vers 5</text><text x="68" y="923" class="body">Harim, Meremoth, Obadja,</text><rect x="42" y="981" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1024" class="label">Vers 6</text><text x="68" y="1072" class="body">Daniël, Ginnethon, Baruch,</text><rect x="42" y="1130" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1173" class="label">Vers 7</text><text x="68" y="1221" class="body">Mesullam, Abia, Mijamin,</text><rect x="42" y="1279" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1322" class="label">Vers 8</text><text x="68" y="1370" class="body">Maäzia, Bilgai en Semaja. Dit waren de</text><text x="68" y="1413" class="body">priesters.</text><text x="46" y="1506" class="note">Namen staan in de volgorde van deze eigen lijst.</text><text x="46" y="1542" class="note">Herhaalde namen blijven zichtbaar; opeenvolging</text><text x="46" y="1578" class="note">is geen vader-zoonrelatie.</text></svg>