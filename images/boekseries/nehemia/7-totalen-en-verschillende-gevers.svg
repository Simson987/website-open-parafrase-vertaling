<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1518" viewBox="0 0 840 1518" role="img" aria-labelledby="title desc"><title id="title">Totalen en verschillende gevers</title><desc id="desc">De verschillende totalen, dieren en bijdragen met hun gevers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1518" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Totalen en verschillende gevers</text><text x="44" y="113" class="ref">Nehemia 7:66–73</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vergadering</text><text x="68" y="241" class="body">42.360; daarnaast 7.337 slaven en</text><text x="68" y="284" class="body">slavinnen en 245 zangers en</text><text x="68" y="327" class="body">zangeressen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dieren</text><text x="68" y="476" class="body">736 paarden; 245 muildieren; 435</text><text x="68" y="519" class="body">kamelen; 6.720 ezels.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De landvoogd</text><text x="68" y="668" class="body">1.000 gouden munten, vijftig</text><text x="68" y="711" class="body">sprengschalen en 530 priestergewaden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Andere familiehoofden</text><text x="68" y="860" class="body">20.000 gouden munten en circa 1,3 ton</text><text x="68" y="903" class="body">zilver.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Rest van het volk</text><text x="68" y="1052" class="body">20.000 gouden munten, circa 1,1 ton</text><text x="68" y="1095" class="body">zilver en 67 priestergewaden.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Vestiging</text><text x="68" y="1244" class="body">Dienstgroepen en heel Israël wonen in</text><text x="68" y="1287" class="body">hun steden.</text><text x="46" y="1380" class="note">Bedragen en aparte gevers volgen deze vertaling;</text><text x="46" y="1416" class="note">de drie bijdragen worden niet tot één afgebeelde</text><text x="46" y="1452" class="note">schenker gemaakt.</text></svg>