<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Naast Ezra op de verhoging</title><desc id="desc">Alle namen van de twee kanten en de afzonderlijke onderwijsgroep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Naast Ezra op de verhoging</text><text x="44" y="113" class="ref">Nehemia 8:5–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rechts van Ezra</text><text x="68" y="241" class="body">Mattithja, Sema, Anaja, Uria, Hilkia en</text><text x="68" y="284" class="body">Maäseja.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">In het midden</text><text x="68" y="433" class="body">Ezra, priester en schriftgeleerde, op</text><text x="68" y="476" class="body">de houten verhoging.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Links van Ezra</text><text x="68" y="625" class="body">Pedaja, Misaël, Malchia, Hasum,</text><text x="68" y="668" class="body">Hasbaddana, Zacharja en Mesullam.</text><rect x="42" y="726" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het onderwijs</text><text x="68" y="817" class="body">Jesua, Bani, Serebja, Jamin, Akkub,</text><text x="68" y="860" class="body">Sabbethai, Hodia, Maäseja, Kelita,</text><text x="68" y="903" class="body">Azaria, Jozabad, Hanan en Pelaja met de</text><text x="68" y="946" class="body">Levieten.</text><text x="46" y="1039" class="note">Rechts en links zijn zoals de tekst ze noemt; de</text><text x="46" y="1075" class="note">laatste groep wordt niet als extra rij op de</text><text x="46" y="1111" class="note">verhoging geplaatst.</text></svg>