<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Vijf berichten en de muur</title><desc id="desc">Verschillende pogingen tot intimidatie en de precies genoemde voltooiing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijf berichten en de muur</text><text x="44" y="113" class="ref">Nehemia 6:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vier uitnodigingen</text><text x="68" y="241" class="body">Naar het dal Ono; Nehemia weigert</text><text x="68" y="284" class="body">telkens om het werk niet stil te</text><text x="68" y="327" class="body">leggen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De vijfde boodschap</text><text x="68" y="476" class="body">Open brief: verzonnen beschuldiging van</text><text x="68" y="519" class="body">opstand en koningschap.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Semaja’s voorstel</text><text x="68" y="668" class="body">Vlucht naar de tempel; Nehemia herkent</text><text x="68" y="711" class="body">ingehuurde bangmakerij en weigert.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het gebed</text><text x="68" y="860" class="body">Sterke handen gevraagd; ook Noadja en</text><text x="68" y="903" class="body">andere profeten worden genoemd.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Voltooiing</text><text x="68" y="1052" class="body">Elul 25, na tweeënvijftig dagen;</text><text x="68" y="1095" class="body">vijanden verliezen hun zelfvertrouwen.</text><text x="46" y="1188" class="note">De bewering dat Nehemia koning wil worden is een</text><text x="46" y="1224" class="note">lasterlijke beschuldiging, geen werkelijkheid</text><text x="46" y="1260" class="note">die hier uitgebeeld moet worden.</text></svg>