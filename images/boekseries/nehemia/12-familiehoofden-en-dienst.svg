<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1389" viewBox="0 0 840 1389" role="img" aria-labelledby="title desc"><title id="title">Familiehoofden en dienst</title><desc id="desc">Verdere paren, tegenover elkaar dienende groepen en bewaking.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1389" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familiehoofden en dienst</text><text x="44" y="113" class="ref">Nehemia 12:18–26</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bilga en Semaja</text><text x="68" y="241" class="body">Sammua bij Bilga; Jonathan bij Semaja.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Jojarib en Jedaja</text><text x="68" y="390" class="body">Matthenai bij Jojarib; Uzzi bij Jedaja.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Sallai en Amok</text><text x="68" y="539" class="body">Kallai bij Sallai; Heber bij Amok.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Hilkia en Jedaja</text><text x="68" y="688" class="body">Hasabja bij Hilkia; Nethaneël bij</text><text x="68" y="731" class="body">Jedaja.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Tegenover elkaar</text><text x="68" y="880" class="body">Hasabja, Serebja en Jesua, zoon van</text><text x="68" y="923" class="body">Kadmiël: groepen voor lof en dank.</text><rect x="42" y="981" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1024" class="label">Poortwachters</text><text x="68" y="1072" class="body">Matthanja, Bakbukja, Obadja, Mesullam,</text><text x="68" y="1115" class="body">Talmon en Akkub bewaken de</text><text x="68" y="1158" class="body">voorraadkamers.</text><text x="46" y="1251" class="note">Jedaja komt op twee eigen plaatsen in de lijst</text><text x="46" y="1287" class="note">voor. Uzzi en Nethaneël worden daardoor niet tot</text><text x="46" y="1323" class="note">dezelfde persoon gemaakt.</text></svg>