<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1154" viewBox="0 0 840 1154" role="img" aria-labelledby="title desc"><title id="title">Betrouwbare beheerders</title><desc id="desc">Namen, verschillende functies en de gedeelde verantwoordelijkheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1154" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Betrouwbare beheerders</text><text x="44" y="113" class="ref">Nehemia 13:13–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Selemja</text><text x="68" y="241" class="body">Priester.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zadok</text><text x="68" y="390" class="body">Schrijver.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Pedaja</text><text x="68" y="539" class="body">Uit de Levieten.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Hanan</text><text x="68" y="688" class="body">Zoon van Zakkur, zoon van Matthanja;</text><text x="68" y="731" class="body">staat hen bij.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Hun taak</text><text x="68" y="880" class="body">Delen aan de broers uitdelen; zij</text><text x="68" y="923" class="body">gelden als betrouwbaar.</text><text x="46" y="1016" class="note">Functies en expliciete afstamming worden apart</text><text x="46" y="1052" class="note">weergegeven. Er staat niet dat alle vier</text><text x="46" y="1088" class="note">priesters zijn.</text></svg>