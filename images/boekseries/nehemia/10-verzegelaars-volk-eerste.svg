<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1409" viewBox="0 0 840 1409" role="img" aria-labelledby="title desc"><title id="title">Volkshoofden, eerste deel</title><desc id="desc">De eigen namenlijst met versankers en zonder toegevoegde verwantschappen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1409" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volkshoofden, eerste deel</text><text x="44" y="113" class="ref">Nehemia 10:14–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 14</text><text x="68" y="241" class="body">De hoofden van het volk waren: Parhos,</text><text x="68" y="284" class="body">Pahath-Moab, Elam, Zatthu, Bani,</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 15</text><text x="68" y="433" class="body">Bunni, Azgad, Bebai,</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vers 16</text><text x="68" y="582" class="body">Adonia, Bigvai, Adin,</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Vers 17</text><text x="68" y="731" class="body">Ater, Hizkia, Azzur,</text><rect x="42" y="789" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Vers 18</text><text x="68" y="880" class="body">Hodia, Hasum, Bezai,</text><rect x="42" y="938" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="981" class="label">Vers 19</text><text x="68" y="1029" class="body">Harif, Anathoth, Nebai,</text><rect x="42" y="1087" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1130" class="label">Vers 20</text><text x="68" y="1178" class="body">Magpias, Mesullam, Hezir,</text><text x="46" y="1271" class="note">Namen staan in de volgorde van deze eigen lijst.</text><text x="46" y="1307" class="note">Herhaalde namen blijven zichtbaar; opeenvolging</text><text x="46" y="1343" class="note">is geen vader-zoonrelatie.</text></svg>