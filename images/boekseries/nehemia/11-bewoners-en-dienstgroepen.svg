<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1482" viewBox="0 0 840 1482" role="img" aria-labelledby="title desc"><title id="title">Bewoners en dienstgroepen</title><desc id="desc">Bewonersverdeling, afzonderlijke groepsaantallen en functies.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1482" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bewoners en dienstgroepen</text><text x="44" y="113" class="ref">Nehemia 11:1–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verdeling</text><text x="68" y="241" class="body">Eén op de tien naar Jeruzalem, negen op</text><text x="68" y="284" class="body">de tien naar andere steden; daarnaast</text><text x="68" y="327" class="body">vrijwillige bewoners.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Juda en Benjamin</text><text x="68" y="476" class="body">Perez: 468 dappere mannen; bij Gabbai</text><text x="68" y="519" class="body">en Sallai: 928 man.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Priestergroepen</text><text x="68" y="668" class="body">822 voor het werk; 242 familiehoofden;</text><text x="68" y="711" class="body">128 dappere helden.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Levieten en poortwachters</text><text x="68" y="860" class="body">284 Levieten; 172 poortwachters.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Taken</text><text x="68" y="1009" class="body">Sabbethai en Jozabad: buitenwerk;</text><text x="68" y="1052" class="body">Matthanja: dankgebed; zangers: vaste</text><text x="68" y="1095" class="body">dagelijkse delen.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Ofel en hof</text><text x="68" y="1244" class="body">Ziha en Gispa over de tempelknechten;</text><text x="68" y="1287" class="body">Petahja staat de koning terzijde.</text><text x="46" y="1380" class="note">De aantallen horen bij de genoemde groepen en</text><text x="46" y="1416" class="note">zijn geen volledige volkstelling van heel Juda.</text></svg>