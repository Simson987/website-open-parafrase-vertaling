<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1604" viewBox="0 0 840 1604" role="img" aria-labelledby="title desc"><title id="title">Tienden en bewaring</title><desc id="desc">De verschillende ontvangers en de tiende die de Levieten verder afdragen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1604" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tienden en bewaring</text><text x="44" y="113" class="ref">Nehemia 10:36–39</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerstgeborenen</text><text x="68" y="241" class="body">Zonen en dieren volgens de wet;</text><text x="68" y="284" class="body">runderen en schapen naar de dienende</text><text x="68" y="327" class="body">priesters.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Eerstelingen</text><text x="68" y="476" class="body">Deeg, hefoffers, boomvruchten, nieuwe</text><text x="68" y="519" class="body">wijn en olie naar de priesters in de</text><text x="68" y="562" class="body">kamers.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De tienden</text><text x="68" y="711" class="body">Landopbrengst naar Levieten, ingezameld</text><text x="68" y="754" class="body">in de landbouwsteden.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Priester erbij</text><text x="68" y="903" class="body">Een zoon van Aäron aanwezig bij het</text><text x="68" y="946" class="body">innen.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Tiende van de tienden</text><text x="68" y="1095" class="body">De Levieten brengen een tiende naar de</text><text x="68" y="1138" class="body">kamers van het schathuis.</text><rect x="42" y="1196" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1239" class="label">Het doel</text><text x="68" y="1287" class="body">Voorwerpen en dienstdoende groepen in</text><text x="68" y="1330" class="body">het huis; het huis van God niet in de</text><text x="68" y="1373" class="body">steek laten.</text><text x="46" y="1466" class="note">Priesters en Levieten hebben verschillende</text><text x="46" y="1502" class="note">stappen in deze stroom; eerstelingen en tienden</text><text x="46" y="1538" class="note">worden niet vereenzelvigd.</text></svg>