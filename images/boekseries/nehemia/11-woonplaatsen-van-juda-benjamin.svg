<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1455" viewBox="0 0 840 1455" role="img" aria-labelledby="title desc"><title id="title">Woonplaatsen van twee groepen</title><desc id="desc">De twee plaatsengroepen en de uitdrukkelijk beschreven vestiging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1455" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Woonplaatsen van twee groepen</text><text x="44" y="113" class="ref">Nehemia 11:25–36</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Juda, eerste deel</text><text x="68" y="241" class="body">Kirjath-Arba, Dibon, Jekabzeël, Jesua,</text><text x="68" y="284" class="body">Molada, Beth-Pelet, Hazar-Sual en</text><text x="68" y="327" class="body">Berseba.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Juda, verder</text><text x="68" y="476" class="body">Ziklag, Mechona, En-Rimmon, Zora,</text><text x="68" y="519" class="body">Jarmuth, Zanoah, Adullam, Lachis en</text><text x="68" y="562" class="body">Azeka.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bereik van Juda</text><text x="68" y="711" class="body">Van Berseba tot het dal Hinnom;</text><text x="68" y="754" class="body">plaatsen met hun dorpen of akkers zoals</text><text x="68" y="797" class="body">de passage ze noemt.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Benjamin</text><text x="68" y="946" class="body">Geba, Michmas, Aja, Bethel, Anathoth,</text><text x="68" y="989" class="body">Nob, Ananja, Hazor, Rama, Gitthaïm,</text><text x="68" y="1032" class="body">Hadid, Zeboïm, Neballat, Lod en Ono.</text><rect x="42" y="1090" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1133" class="label">Levieten</text><text x="68" y="1181" class="body">Sommige groepen uit Juda wonen bij</text><text x="68" y="1224" class="body">Benjamin.</text><text x="46" y="1317" class="note">Dit is een plaatsnamenoverzicht, geen</text><text x="46" y="1353" class="note">schaalkaart; het hoofdstuk geeft niet voor elk</text><text x="46" y="1389" class="note">dorp coördinaten of bewonersaantallen.</text></svg>