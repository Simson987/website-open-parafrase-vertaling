<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Lijnen van Juda en Benjamin</title><desc id="desc">Pijlen van genoemde voorouder naar nakomeling; afzonderlijke lijnen blijven apart.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lijnen van Juda en Benjamin</text><text x="44" y="113" class="ref">Nehemia 11:4–9</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Athaja</text><text x="68" y="241" class="body">Perez (nakomelingen) → Mahalaleël →</text><text x="68" y="284" class="body">Sefatja → Amarja → Zacharja → Uzzia →</text><text x="68" y="327" class="body">Athaja</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Maäseja</text><text x="68" y="476" class="body">Siloni → Zacharja → Jojarib → Adaja →</text><text x="68" y="519" class="body">Hazaja → Kol-Hose → Baruch → Maäseja</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Sallu</text><text x="68" y="668" class="body">Jesaja → Ithiël → Maäseja → Kolaja →</text><text x="68" y="711" class="body">Pedaja → Joëd → Mesullam → Sallu</text><text x="46" y="804" class="note">De eerste pijl vanaf Perez betekent afstamming,</text><text x="46" y="840" class="note">geen uitdrukkelijk genoemde directe vader.</text><text x="46" y="876" class="note">Andere schakels volgen de genoemde</text><text x="46" y="912" class="note">zoonsrelaties.</text></svg>