<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">Dienstgroepen en herkomst</title><desc id="desc">Dienstfuncties, eigen aantallen en de grens van het registerbewijs.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dienstgroepen en herkomst</text><text x="44" y="113" class="ref">Nehemia 7:39–65</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Priesters</text><text x="68" y="241" class="body">Jedaja 973; Immer 1.052; Pashur 1.247;</text><text x="68" y="284" class="body">Harim 1.017.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Levieten en zangers</text><text x="68" y="433" class="body">Jesua, via Kadmiël uit Hodeva: 74;</text><text x="68" y="476" class="body">nakomelingen van Asaf: 148.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Poortwachters</text><text x="68" y="625" class="body">Sallum, Ater, Talmon, Akkub, Hatita,</text><text x="68" y="668" class="body">Sobai: samen 138.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Twee dienstlijsten</text><text x="68" y="817" class="body">Tempelknechten en nakomelingen van</text><text x="68" y="860" class="body">Salomo’s dienaren: samen 392.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Herkomst niet aangetoond</text><text x="68" y="1009" class="body">Delaja, Tobia en Nekoda: 642; ook</text><text x="68" y="1052" class="body">priesters zoeken vergeefs hun register.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Voorlopige uitsluiting</text><text x="68" y="1201" class="body">Geen allerheiligste gaven tot er een</text><text x="68" y="1244" class="body">priester met urim en tummim is.</text><text x="46" y="1337" class="note">De lijst bewijst geen onbekende afstamming; de</text><text x="46" y="1373" class="note">hier gegeven getallen verschillen op enkele</text><text x="46" y="1409" class="note">plaatsen van Ezra 2.</text></svg>