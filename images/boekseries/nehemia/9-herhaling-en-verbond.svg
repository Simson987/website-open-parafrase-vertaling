<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Herhaling, nood en verbond</title><desc id="desc">Het herhaalde patroon en de overgang van schuldbelijdenis naar een vast verbond.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herhaling, nood en verbond</text><text x="44" y="113" class="ref">Nehemia 9:26–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herhaald patroon</text><text x="68" y="241" class="body">Opstand → onderdrukking → roepen →</text><text x="68" y="284" class="body">redding → rust → nieuwe opstand.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Lange waarschuwing</text><text x="68" y="433" class="body">Profeten spreken; niet luisteren brengt</text><text x="68" y="476" class="body">overheersing door andere volken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Toch niet verlaten</text><text x="68" y="625" class="body">Het gebed belijdt Gods genade en</text><text x="68" y="668" class="body">barmhartigheid.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vandaag</text><text x="68" y="817" class="body">Landopbrengst naar koningen;</text><text x="68" y="860" class="body">heerschappij over lichaam en vee, grote</text><text x="68" y="903" class="body">nood.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Vast verbond</text><text x="68" y="1052" class="body">Leiders, Levieten en priesters</text><text x="68" y="1095" class="body">schrijven de verbintenis op en</text><text x="68" y="1138" class="body">verzegelen die.</text><text x="46" y="1231" class="note">De terugblik maakt Gods trouw en de eigen schuld</text><text x="46" y="1267" class="note">zichtbaar. De opeenvolging is een patroon in het</text><text x="46" y="1303" class="note">gebed, geen nieuwe veldslag.</text></svg>