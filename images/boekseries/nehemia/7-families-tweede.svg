<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1515" viewBox="0 0 840 1515" role="img" aria-labelledby="title desc"><title id="title">Familiegroepen, tweede deel</title><desc id="desc">Namen en aantallen uit de plaatselijke passage.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1515" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familiegroepen, tweede deel</text><text x="44" y="113" class="ref">Nehemia 7:17–24</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Azgad</text><text x="68" y="241" class="body">2.322</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Adonikam</text><text x="68" y="390" class="body">667</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Bigvai</text><text x="68" y="539" class="body">2.067</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Adin</text><text x="68" y="688" class="body">655</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Ater, via Hizkia</text><text x="68" y="837" class="body">98</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Hassum</text><text x="68" y="986" class="body">328</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">Bezai</text><text x="68" y="1135" class="body">324</text><rect x="42" y="1193" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">Harif</text><text x="68" y="1284" class="body">112</text><text x="46" y="1377" class="note">Deze aantallen volgen Nehemia 7. Verschillen met</text><text x="46" y="1413" class="note">Ezra 2 zijn niet stilzwijgend gelijkgetrokken;</text><text x="46" y="1449" class="note">namen blijven bij hun eigen lijst.</text></svg>