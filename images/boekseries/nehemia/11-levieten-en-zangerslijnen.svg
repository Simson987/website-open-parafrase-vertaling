<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1233" viewBox="0 0 840 1233" role="img" aria-labelledby="title desc"><title id="title">Levieten en zangerslijnen</title><desc id="desc">Pijlen van genoemde voorouder naar nakomeling; afzonderlijke lijnen blijven apart.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1233" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levieten en zangerslijnen</text><text x="44" y="113" class="ref">Nehemia 11:15–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Semaja</text><text x="68" y="241" class="body">Buni → Hasabja → Azrikam → Hassub →</text><text x="68" y="284" class="body">Semaja</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Matthanja</text><text x="68" y="433" class="body">Asaf → Zabdi → Micha → Matthanja</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Abda</text><text x="68" y="582" class="body">Jeduthun → Galal → Sammua → Abda</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Uzzi</text><text x="68" y="731" class="body">Micha → Matthanja → Hasabja → Bani →</text><text x="68" y="774" class="body">Uzzi</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Petahja</text><text x="68" y="923" class="body">Juda → Zerah (nakomelingen) →</text><text x="68" y="966" class="body">Mesezabeël → Petahja</text><text x="46" y="1059" class="note">Bij Petahja noemt de tekst afstamming uit Zerah;</text><text x="46" y="1095" class="note">de pijl Zerah naar Mesezabeël beweert geen</text><text x="46" y="1131" class="note">directe vader. Elke lijn volgt uitsluitend deze</text><text x="46" y="1167" class="note">passage.</text></svg>