<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">De nachtelijke inspectie</title><desc id="desc">Genoemde route en het verschil tussen geheime inspectie en publieke oproep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nachtelijke inspectie</text><text x="44" y="113" class="ref">Nehemia 2:12–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vooraf</text><text x="68" y="241" class="body">Enkele mannen mee, één rijdier; het</text><text x="68" y="284" class="body">plan nog niet bekendgemaakt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Naar buiten</text><text x="68" y="433" class="body">Dalpoort → Drakenbron → Mestpoort;</text><text x="68" y="476" class="body">afgebroken muur en verbrande poorten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verder</text><text x="68" y="625" class="body">Bronpoort → vijver van de koning; het</text><text x="68" y="668" class="body">dier kan niet verder.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Terugkeer</text><text x="68" y="817" class="body">Omhoog door het dal, muur bekijken,</text><text x="68" y="860" class="body">omkeren en weer door de Dalpoort</text><text x="68" y="903" class="body">binnen.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Daarna openbaar</text><text x="68" y="1052" class="body">Oproep tot bouwen, instemming en</text><text x="68" y="1095" class="body">antwoord op spot van Sanballat, Tobia</text><text x="68" y="1138" class="body">en Gesem.</text><text x="46" y="1231" class="note">Een leesvolgorde van genoemde plaatsen; geen</text><text x="46" y="1267" class="note">schaalkaart of exact gereconstrueerd</text><text x="46" y="1303" class="note">stratenplan.</text></svg>