<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Verzegelaars: Levieten</title><desc id="desc">De eigen namenlijst met versankers en zonder toegevoegde verwantschappen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verzegelaars: Levieten</text><text x="44" y="113" class="ref">Nehemia 10:9–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 9</text><text x="68" y="241" class="body">De Levieten waren: Jesua, de zoon van</text><text x="68" y="284" class="body">Azanja, Binnuï van de zonen van</text><text x="68" y="327" class="body">Henadad, en Kadmiël,</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vers 10</text><text x="68" y="476" class="body">en hun broers Sebanja, Hodia, Kelita,</text><text x="68" y="519" class="body">Pelaja, Hanan,</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vers 11</text><text x="68" y="668" class="body">Micha, Rehob, Hasabja,</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vers 12</text><text x="68" y="817" class="body">Zakkur, Serebja, Sebanja,</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Vers 13</text><text x="68" y="966" class="body">Hodia, Bani en Beninu.</text><text x="46" y="1059" class="note">Namen staan in de volgorde van deze eigen lijst.</text><text x="46" y="1095" class="note">Herhaalde namen blijven zichtbaar; opeenvolging</text><text x="46" y="1131" class="note">is geen vader-zoonrelatie.</text></svg>