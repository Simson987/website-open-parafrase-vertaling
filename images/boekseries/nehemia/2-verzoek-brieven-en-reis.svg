<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Verzoek, brieven en reis</title><desc id="desc">Opdracht, middelen, begeleiding en volgorde van de reis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verzoek, brieven en reis</text><text x="44" y="113" class="ref">Nehemia 2:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nisan, jaar twintig</text><text x="68" y="241" class="body">Verdriet bij de koning; de koningin zit</text><text x="68" y="284" class="body">naast hem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verzoek en termijn</text><text x="68" y="433" class="body">Nehemia vraagt naar Juda te gaan en</text><text x="68" y="476" class="body">noemt een terugkeerdatum.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee soorten brieven</text><text x="68" y="625" class="body">Doorgang bij landvoogden en hout van</text><text x="68" y="668" class="body">Asaf voor poorten, muur en woonhuis.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Begeleiding</text><text x="68" y="817" class="body">De koning stuurt legeraanvoerders en</text><text x="68" y="860" class="body">ruiters mee.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Jeruzalem</text><text x="68" y="1009" class="body">Aankomst, drie dagen verblijf;</text><text x="68" y="1052" class="body">Sanballat en Tobia zijn ontevreden.</text><text x="46" y="1145" class="note">Dit hoofdstuk noemt militaire begeleiding; dat</text><text x="46" y="1181" class="note">verschilt van Ezra’s reis zonder gevraagde</text><text x="46" y="1217" class="note">soldaten.</text></svg>