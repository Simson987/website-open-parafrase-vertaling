<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1482" viewBox="0 0 840 1482" role="img" aria-labelledby="title desc"><title id="title">Lezen, begrijpen en feest</title><desc id="desc">De samenhang tussen lezen, begrip, gedeelde vreugde en feestduur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1482" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lezen, begrijpen en feest</text><text x="44" y="113" class="ref">Nehemia 8:2–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste dag, maand zeven</text><text x="68" y="241" class="body">Ezra leest van ochtend tot middag bij</text><text x="68" y="284" class="body">de Waterpoort; mannen, vrouwen en wie</text><text x="68" y="327" class="body">begrijpen kan luisteren.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Opstaan en aanbidden</text><text x="68" y="476" class="body">Boek open, volk staat; amen, opgeheven</text><text x="68" y="519" class="body">handen en buigen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Uitleg</text><text x="68" y="668" class="body">Duidelijk lezen en de betekenis</text><text x="68" y="711" class="body">uitleggen, zodat het volk begrijpt.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Huilen wordt feest</text><text x="68" y="860" class="body">Niet rouwen; eten, drinken en porties</text><text x="68" y="903" class="body">sturen naar wie niets heeft.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De volgende dag</text><text x="68" y="1052" class="body">Leiders onderzoeken de wet en ontdekken</text><text x="68" y="1095" class="body">het voorschrift over loofhutten.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Zeven en acht</text><text x="68" y="1244" class="body">Zeven dagen feest met dagelijks lezen;</text><text x="68" y="1287" class="body">de achtste dag een slotdag.</text><text x="46" y="1380" class="note">Het feest krijgt opeenvolgende fasen; de uitleg</text><text x="46" y="1416" class="note">in kleine groepen is geen tweede koningsrede.</text></svg>