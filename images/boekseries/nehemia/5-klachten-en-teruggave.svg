<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1561" viewBox="0 0 840 1561" role="img" aria-labelledby="title desc"><title id="title">Klachten en teruggave</title><desc id="desc">Oorzaken, gevolgen en de afgesproken financiële en sociale correctie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1561" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Klachten en teruggave</text><text x="44" y="113" class="ref">Nehemia 5:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie lasten</text><text x="68" y="241" class="body">Te weinig graan, grond en huizen</text><text x="68" y="284" class="body">verpanden, lenen voor koningsbelasting.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het gevolg</text><text x="68" y="433" class="body">Zonen en dochters als slaven; een deel</text><text x="68" y="476" class="body">van de dochters al weg.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De aanklacht</text><text x="68" y="625" class="body">Edelen en bestuurders leggen hun eigen</text><text x="68" y="668" class="body">broers schuldlast op.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vandaag teruggeven</text><text x="68" y="817" class="body">Akkers, wijngaarden, olijfgaarden en</text><text x="68" y="860" class="body">huizen; ook het honderdste deel van</text><text x="68" y="903" class="body">geld, graan, wijn en olie.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Belofte en eed</text><text x="68" y="1052" class="body">Priesters erbij, eed van teruggave en</text><text x="68" y="1095" class="body">niets meer eisen.</text><rect x="42" y="1153" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Tekenhandeling</text><text x="68" y="1244" class="body">Nehemia schudt zijn kleed uit; de</text><text x="68" y="1287" class="body">vergadering zegt amen en houdt zich</text><text x="68" y="1330" class="body">eraan.</text><text x="46" y="1423" class="note">De terug te geven bezittingen en opbrengsten</text><text x="46" y="1459" class="note">zijn apart genoemd; de passage beschrijft een</text><text x="46" y="1495" class="note">concrete economische crisis.</text></svg>