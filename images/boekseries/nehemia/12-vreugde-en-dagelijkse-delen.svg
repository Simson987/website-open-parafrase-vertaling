<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Vreugde en dagelijkse delen</title><desc id="desc">De overgang van feest naar blijvende ondersteuning van de diensten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vreugde en dagelijkse delen</text><text x="44" y="113" class="ref">Nehemia 12:43–47</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Blijdschap</text><text x="68" y="241" class="body">Grote offers; ook vrouwen en kinderen</text><text x="68" y="284" class="body">blij; Jeruzalems vreugde ver te horen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Beheerders</text><text x="68" y="433" class="body">Mannen over schatkamers, hefoffers,</text><text x="68" y="476" class="body">eerstelingen en tienden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verzameling</text><text x="68" y="625" class="body">Uit akkers bij de steden voor priesters</text><text x="68" y="668" class="body">en Levieten wat de wet toewijst.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dagelijkse delen</text><text x="68" y="817" class="body">Zangers en poortwachters ontvangen</text><text x="68" y="860" class="body">vaste delen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Verdere overdracht</text><text x="68" y="1009" class="body">Volk geeft gewijde gaven aan Levieten;</text><text x="68" y="1052" class="body">Levieten aan Aärons nakomelingen.</text><text x="46" y="1145" class="note">De feestelijke inwijdingsdag en het terugkerende</text><text x="46" y="1181" class="note">dagelijkse onderhoud hebben elk hun plaats in</text><text x="46" y="1217" class="note">het hoofdstuk.</text></svg>