<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1597" viewBox="0 0 840 1597" role="img" aria-labelledby="title desc"><title id="title">Het beeld en de gegeven uitleg</title><desc id="desc">Materiaal, lichaamsdeel en de expliciete gegeven uitleg zonder toegevoegde rijksnamen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1597" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het beeld en de gegeven uitleg</text><text x="44" y="113" class="ref">Daniël 2:32–45</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gouden hoofd · 32,37–38</text><text x="68" y="241" class="body">Nebukadnezar, die koninkrijk, macht en</text><text x="68" y="284" class="body">eer kreeg: u bent het gouden hoofd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zilver · 32,39</text><text x="68" y="433" class="body">Borst en armen; daarna een ander,</text><text x="68" y="476" class="body">minder groot koninkrijk.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Brons · 32,39</text><text x="68" y="625" class="body">Buik en heupen; een derde koninkrijk</text><text x="68" y="668" class="body">dat over heel de aarde zal heersen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">IJzer · 33,40</text><text x="68" y="817" class="body">Benen; vierde koninkrijk, sterk en</text><text x="68" y="860" class="body">verbrijzelend als ijzer.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">IJzer en klei · 33,41–43</text><text x="68" y="1009" class="body">Voeten en tenen; verdeeld, deels sterk</text><text x="68" y="1052" class="body">en deels breekbaar, ondanks huwelijken</text><text x="68" y="1095" class="body">niet hechtend.</text><rect x="42" y="1153" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Steen en Koninkrijk · 34–35,44–45</text><text x="68" y="1244" class="body">Zonder mensenhanden uit de berg,</text><text x="68" y="1287" class="body">vernietigt het beeld en wordt berg; God</text><text x="68" y="1330" class="body">geeft een blijvend Koninkrijk.</text><text x="46" y="1423" class="note">Alleen het gouden hoofd wordt hier aan een</text><text x="46" y="1459" class="note">genoemde koning gekoppeld. Niet genoemde namen</text><text x="46" y="1495" class="note">van latere rijken worden niet als tekstfeit</text><text x="46" y="1531" class="note">ingevuld.</text></svg>