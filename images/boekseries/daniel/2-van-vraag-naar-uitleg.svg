<svg xmlns="http://www.w3.org/2000/svg" width="840" height="836" viewBox="0 0 840 836"><title>Van gevaar naar bekendmaking</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="836" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Van gevaar naar bekendmaking</text><text x="42" y="105" font-size="25">Daniël 2:14–30</text><rect x="150" y="155" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="191" text-anchor="middle" font-size="31">Arioch legt het bevel uit</text><path d="M420 209 V229" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="235" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="271" text-anchor="middle" font-size="31">Daniël vraagt tijd aan koning</text><path d="M420 289 V309" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="315" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="351" text-anchor="middle" font-size="31">Vrienden vragen om ontferming</text><path d="M420 369 V389" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="395" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="431" text-anchor="middle" font-size="31">Nachtvisioen en dankgebed</text><path d="M420 449 V469" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="475" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="511" text-anchor="middle" font-size="31">Arioch brengt hem bij koning</text><path d="M420 529 V549" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="555" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="591" text-anchor="middle" font-size="31">God onthult; Daniël verklaart</text><text x="42" y="655" font-size="26">Daniël vraagt eerst om het doden van de wijzen</text><text x="42" y="689" font-size="26">te stoppen. Hij zegt dat het geheim hem niet om</text><text x="42" y="723" font-size="26">uitzonderlijke eigen wijsheid is onthuld, maar</text><text x="42" y="757" font-size="26">om de koning te laten begrijpen.</text></g></svg>