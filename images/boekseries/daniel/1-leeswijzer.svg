<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1157" viewBox="0 0 840 1157" role="img" aria-labelledby="title desc"><title id="title">Vier jongeren, proef en dienst</title><desc id="desc">De volledige voortgang van de gebeurtenissen en de plaats van de uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1157" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier jongeren, proef en dienst</text><text x="44" y="113" class="ref">Daniël 1:1–21</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wegvoering en opleiding · 1–7</text><text x="68" y="241" class="body">Jojakim, voorwerpen naar Sinear;</text><text x="68" y="284" class="body">geselecteerde jongeren, drie jaar</text><text x="68" y="327" class="body">boeken en taal, koninklijk eten en</text><text x="68" y="370" class="body">andere namen.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De proef · 8–16</text><text x="68" y="519" class="body">Niet onrein worden, gunst en vrees van</text><text x="68" y="562" class="body">de hofdienaar; opzichter stemt toe in</text><text x="68" y="605" class="body">tien dagen groente en water, beter</text><text x="68" y="648" class="body">uiterlijk.</text><rect x="42" y="706" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">De gaven en dienst · 17–21</text><text x="68" y="797" class="body">Kennis en inzicht voor vier, dromen en</text><text x="68" y="840" class="body">visioenen voor Daniël; bij de koning</text><text x="68" y="883" class="body">tien keer beter bevonden, Daniël tot</text><text x="68" y="926" class="body">Kores.</text><text x="46" y="1019" class="note">De versnummering volgt deze hoofdstuktekst.</text><text x="46" y="1055" class="note">Vertelde gebeurtenissen, geciteerde uitspraken</text><text x="46" y="1091" class="note">en droombeelden hebben elk hun eigen plaats.</text></svg>