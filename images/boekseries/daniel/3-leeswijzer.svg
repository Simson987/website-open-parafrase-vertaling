<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Bevel, weigering en redding</title><desc id="desc">De volledige voortgang van de gebeurtenissen en de plaats van de uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bevel, weigering en redding</text><text x="44" y="113" class="ref">Daniël 3:1–30</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het bevel · 1–12</text><text x="68" y="241" class="body">Gouden beeld 30 m hoog en 3 m breed in</text><text x="68" y="284" class="body">Dura, ambtenaren en muzieksignaal;</text><text x="68" y="327" class="body">weigering van drie Judeeërs</text><text x="68" y="370" class="body">aangeklaagd.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Het antwoord · 13–18</text><text x="68" y="519" class="body">Tweede kans, dreiging en vertrouwen;</text><text x="68" y="562" class="body">God kan redden, en ook anders zullen</text><text x="68" y="605" class="body">zij het beeld niet aanbidden.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het vuur · 19–27</text><text x="68" y="754" class="body">Zevenmaal heter, drie gebonden in vuur;</text><text x="68" y="797" class="body">koning ziet vier los en ongedeerd, drie</text><text x="68" y="840" class="body">naar buiten en kleding onderzocht.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Het gevolg · 28–30</text><text x="68" y="989" class="body">Koning prijst hun God die een engel</text><text x="68" y="1032" class="body">zond, bevel tegen kwaadspreken en</text><text x="68" y="1075" class="body">voorspoed voor de drie.</text><text x="46" y="1168" class="note">De versnummering volgt deze hoofdstuktekst.</text><text x="46" y="1204" class="note">Vertelde gebeurtenissen, geciteerde uitspraken</text><text x="46" y="1240" class="note">en droombeelden hebben elk hun eigen plaats.</text></svg>