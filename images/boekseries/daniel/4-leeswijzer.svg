<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Boomdroom en vernederde koning</title><desc id="desc">De volledige voortgang van de gebeurtenissen en de plaats van de uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boomdroom en vernederde koning</text><text x="44" y="113" class="ref">Daniël 4:1–37</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het getuigenis · 1–9</text><text x="68" y="241" class="body">Koninklijke groet, tekenen, rust en</text><text x="68" y="284" class="body">verontrustende droom; wijzen falen,</text><text x="68" y="327" class="body">Daniël gevraagd.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De droom · 10–18</text><text x="68" y="476" class="body">Grote voedende boom, wachter, omhakken</text><text x="68" y="519" class="body">maar stronk met ijzer en brons;</text><text x="68" y="562" class="body">dierenhart en zeven tijden.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Uitleg en raad · 19–27</text><text x="68" y="711" class="body">Boom is de koning, verstoten en daarna</text><text x="68" y="754" class="body">erkenning; stronk bewaart koninkrijk,</text><text x="68" y="797" class="body">oproep tot recht en zorg voor armen.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De vervulling · 28–37</text><text x="68" y="946" class="body">Na twaalf maanden grootspraak op het</text><text x="68" y="989" class="body">dak; woord, leven bij dieren, later</text><text x="68" y="1032" class="body">verstand, lof en koninkrijk hersteld.</text><text x="46" y="1125" class="note">De versnummering volgt deze hoofdstuktekst.</text><text x="46" y="1161" class="note">Vertelde gebeurtenissen, geciteerde uitspraken</text><text x="46" y="1197" class="note">en droombeelden hebben elk hun eigen plaats.</text></svg>