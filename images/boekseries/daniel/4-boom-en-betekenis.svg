<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">Boom, stronk en de koning</title><desc id="desc">De expliciete symbolische verbanden en het onderscheid tussen droom, raad en vervulling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boom, stronk en de koning</text><text x="44" y="113" class="ref">Daniël 4:20–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De hoge boom · 20–22</text><text x="68" y="241" class="body">De koning: grootheid en macht, voedsel</text><text x="68" y="284" class="body">en schaduw voor velen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De afgehakte boom · 23–25</text><text x="68" y="433" class="body">Weggejaagd van mensen, bij dieren, gras</text><text x="68" y="476" class="body">en dauw; zeven tijden tot hij de</text><text x="68" y="519" class="body">Allerhoogste erkent.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De blijvende stronk · 26</text><text x="68" y="668" class="body">Het koninkrijk blijft voor hem zodra</text><text x="68" y="711" class="body">hij erkent dat de Hemel regeert.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Raad en vervulling · 27–37</text><text x="68" y="860" class="body">Recht en armenzorg; twaalf maanden</text><text x="68" y="903" class="body">later grootspraak, vernedering, later</text><text x="68" y="946" class="body">verstand en koningschap terug.</text><text x="46" y="1039" class="note">De zeven tijden worden niet zonder toelichting</text><text x="46" y="1075" class="note">in zeven kalenderjaren veranderd. De</text><text x="46" y="1111" class="note">dierenvergelijkingen worden niet als</text><text x="46" y="1147" class="note">bovennatuurlijke lichaamsdelen getekend.</text></svg>