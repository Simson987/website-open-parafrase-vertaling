<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De drie tijdwoorden</title><desc id="desc">Drie verschillende tijdformuleringen met de eigen tekstvoorwaarden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De drie tijdwoorden</text><text x="44" y="113" class="ref">Daniël 12:7–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een, twee en een halve tijd · 7</text><text x="68" y="241" class="body">Tot de macht van het heilige volk</text><text x="68" y="284" class="body">gebroken is en alles voltooid is.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">1290 dagen · 11</text><text x="68" y="433" class="body">Vanaf het wegnemen van het dagelijkse</text><text x="68" y="476" class="body">offer en het neerzetten van de</text><text x="68" y="519" class="body">verwoestende gruwel.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">1335 dagen · 12</text><text x="68" y="668" class="body">Gelukkig wie blijft wachten en die</text><text x="68" y="711" class="body">dagen bereikt.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Tot Daniël · 13</text><text x="68" y="860" class="body">Ga heen tot einde, rust en opstaan voor</text><text x="68" y="903" class="body">eigen deel aan einde der dagen.</text><text x="46" y="996" class="note">De verschillende formuleringen blijven intact;</text><text x="46" y="1032" class="note">er worden geen alternatieve eenheden,</text><text x="46" y="1068" class="note">kalenderbeginpunten of datums berekend.</text></svg>