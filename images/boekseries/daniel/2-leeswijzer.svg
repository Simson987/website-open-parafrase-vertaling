<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Droom, openbaring en koninkrijk</title><desc id="desc">De volledige voortgang van de gebeurtenissen en de plaats van de uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Droom, openbaring en koninkrijk</text><text x="44" y="113" class="ref">Daniël 2:1–49</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De onmogelijke eis · 1–13</text><text x="68" y="241" class="body">Tweede jaar, onrustige droom; koning</text><text x="68" y="284" class="body">vraagt droom én uitleg, wijzen kunnen</text><text x="68" y="327" class="body">niet, doodsbevel.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vragen en danken · 14–23</text><text x="68" y="476" class="body">Arioch, tijd vragen, vrienden om</text><text x="68" y="519" class="body">ontferming, nachtvisioen en dank voor</text><text x="68" y="562" class="body">geschonken wijsheid.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Droom en uitleg · 24–45</text><text x="68" y="711" class="body">Daniël voorkomt doden, schrijft</text><text x="68" y="754" class="body">onthulling aan God toe; beeld, steen,</text><text x="68" y="797" class="body">berg en opvolgende koninkrijken.</text><rect x="42" y="855" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De aanstellingen · 46–49</text><text x="68" y="946" class="body">Koning erkent de onthuller van</text><text x="68" y="989" class="body">geheimen; Daniël groot en over Babel en</text><text x="68" y="1032" class="body">wijzen, drie vrienden in bestuur,</text><text x="68" y="1075" class="body">Daniël aan het hof.</text><text x="46" y="1168" class="note">De versnummering volgt deze hoofdstuktekst.</text><text x="46" y="1204" class="note">Vertelde gebeurtenissen, geciteerde uitspraken</text><text x="46" y="1240" class="note">en droombeelden hebben elk hun eigen plaats.</text></svg>