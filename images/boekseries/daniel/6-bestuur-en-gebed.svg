<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1498" viewBox="0 0 840 1498" role="img" aria-labelledby="title desc"><title id="title">Bestuur, verbod en gebed</title><desc id="desc">De precieze aantallen, hiërarchie en onderscheiden handelingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1498" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bestuur, verbod en gebed</text><text x="44" y="113" class="ref">Daniël 6:2–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bestuur · 2–4</text><text x="68" y="241" class="body">120 stadhouders onder drie</text><text x="68" y="284" class="body">rijksbestuurders; Daniël de eerste,</text><text x="68" y="327" class="body">koning wil hem over het hele rijk.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De zoektocht · 5–6</text><text x="68" y="476" class="body">Geen bestuursfout of nalatigheid</text><text x="68" y="519" class="body">gevonden; alleen via de wet van zijn</text><text x="68" y="562" class="body">God een aanleiding zoeken.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het verbod · 7–10</text><text x="68" y="711" class="body">Dertig dagen niets vragen aan god of</text><text x="68" y="754" class="body">mens behalve koning, ondertekend en</text><text x="68" y="797" class="body">niet intrekbaar.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Daniëls gewoonte · 11–14</text><text x="68" y="946" class="body">Open vensters naar Jeruzalem, driemaal</text><text x="68" y="989" class="body">per dag knielen, bidden en danken zoals</text><text x="68" y="1032" class="body">daarvoor.</text><rect x="42" y="1090" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1133" class="label">Darius · 15–16</text><text x="68" y="1181" class="body">Verdrietig en tot zonsondergang bezig</text><text x="68" y="1224" class="body">hem te redden; herinnerd aan</text><text x="68" y="1267" class="body">onwijzigbare wet.</text><text x="46" y="1360" class="note">Dertig dagen hoort bij het verbod, drie keer bij</text><text x="46" y="1396" class="note">de dagelijkse gebeden. De aantallen worden niet</text><text x="46" y="1432" class="note">met de drie bestuurders verwisseld.</text></svg>