<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1349" viewBox="0 0 840 1349" role="img" aria-labelledby="title desc"><title id="title">Ram, bok en hun uitleg</title><desc id="desc">Exacte relaties tussen de twee dieren, hoorns en genoemde rijken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1349" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ram, bok en hun uitleg</text><text x="44" y="113" class="ref">Daniël 8:3–12,20–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ram met twee hoorns · 3–4,20</text><text x="68" y="241" class="body">Twee hoge ongelijke hoorns, hoogste</text><text x="68" y="284" class="body">later; stoten west/noord/zuid. Uitleg:</text><text x="68" y="327" class="body">koningen van de Meden en de Perzen.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bok met grote hoorn · 5–7,21</text><text x="68" y="476" class="body">Uit westen, zonder grond te raken;</text><text x="68" y="519" class="body">grote hoorn tussen ogen. Uitleg: koning</text><text x="68" y="562" class="body">van Griekenland, grote hoorn eerste</text><text x="68" y="605" class="body">koning.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Vier in zijn plaats · 8,22</text><text x="68" y="754" class="body">Grote hoorn breekt, vier naar</text><text x="68" y="797" class="body">windstreken; vier koninkrijken uit dat</text><text x="68" y="840" class="body">volk, niet met dezelfde kracht.</text><rect x="42" y="898" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Kleine hoorn en einde · 9–12,23–25</text><text x="68" y="989" class="body">Uit één, groeit zuid/oost/prachtige</text><text x="68" y="1032" class="body">land; koning met listen en verwoesting,</text><text x="68" y="1075" class="body">tegen Vorst der vorsten, gebroken</text><text x="68" y="1118" class="body">zonder mensenhand.</text><text x="46" y="1211" class="note">De gegeven rijksnamen zijn wel genoemd, maar</text><text x="46" y="1247" class="note">individuele persoonsnamen niet. Het schema houdt</text><text x="46" y="1283" class="note">zich aan dat onderscheid.</text></svg>