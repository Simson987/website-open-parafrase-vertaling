<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1157" viewBox="0 0 840 1157" role="img" aria-labelledby="title desc"><title id="title">Koningen, verdragen en tegenstand</title><desc id="desc">Overzicht van alle drie grote gedeelten van het lange hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1157" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Koningen, verdragen en tegenstand</text><text x="44" y="113" class="ref">Daniël 11:1–45</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opvolgingen · 1–20</text><text x="68" y="241" class="body">Perzische koningen, machtig rijk</text><text x="68" y="284" class="body">verdeeld, Zuiden en Noorden,</text><text x="68" y="327" class="body">dochterverdragen, veldtochten en</text><text x="68" y="370" class="body">belastingambtenaar.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Bedrog en verbond · 21–35</text><text x="68" y="519" class="body">Verachte man, vleierij, legers, leugens</text><text x="68" y="562" class="body">aan één tafel, Chittim, heiligdom en</text><text x="68" y="605" class="body">offer, standvastig volk en vervolgde</text><text x="68" y="648" class="body">leraars.</text><rect x="42" y="706" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Hoogmoed en het einde · 36–45</text><text x="68" y="797" class="body">Eigen grootheid, god van vestingen,</text><text x="68" y="840" class="body">nieuwe strijd, genoemde landen,</text><text x="68" y="883" class="body">berichten en tenten; einde zonder</text><text x="68" y="926" class="body">helper.</text><text x="46" y="1019" class="note">Dit hoofdstuk geeft rollen en ontwikkelingen.</text><text x="46" y="1055" class="note">Niet genoemde koningsnamen worden hier niet als</text><text x="46" y="1091" class="note">tekstfeit toegevoegd.</text></svg>