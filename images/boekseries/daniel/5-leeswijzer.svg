<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Schrift, uitleg en de nacht</title><desc id="desc">De volledige voortgang van de gebeurtenissen en de plaats van de uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schrift, uitleg en de nacht</text><text x="44" y="113" class="ref">Daniël 5:1–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Feest en schrik · 1–9</text><text x="68" y="241" class="body">Duizend hovelingen, tempelvoorwerpen en</text><text x="68" y="284" class="body">afgodenlof; vingers schrijven bij</text><text x="68" y="327" class="body">kandelaar, wijzen kunnen niet lezen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Daniël gehaald · 10–17</text><text x="68" y="476" class="body">Koningin herinnert aan inzicht, Daniël</text><text x="68" y="519" class="body">geroepen; beloning aangeboden en</text><text x="68" y="562" class="body">afgewezen, uitleg wel gegeven.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De aanklacht en uitleg · 18–28</text><text x="68" y="711" class="body">Vader vernederd, Belsazar wist het en</text><text x="68" y="754" class="body">verheft zich toch; adem niet geëerd,</text><text x="68" y="797" class="body">geteld, gewogen en verdeeld.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Dezelfde nacht · 29–30</text><text x="68" y="946" class="body">Toch purper, ketting en derde heerser;</text><text x="68" y="989" class="body">die nacht wordt Belsazar gedood.</text><text x="46" y="1082" class="note">De versnummering volgt deze hoofdstuktekst.</text><text x="46" y="1118" class="note">Vertelde gebeurtenissen, geciteerde uitspraken</text><text x="46" y="1154" class="note">en droombeelden hebben elk hun eigen plaats.</text></svg>