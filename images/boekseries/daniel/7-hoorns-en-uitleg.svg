<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">De hoorns en de gegeven uitleg</title><desc id="desc">De tekstuele relaties van dieren, hoorns, koningen, onderdrukking en oordeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De hoorns en de gegeven uitleg</text><text x="44" y="113" class="ref">Daniël 7:17–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vier dieren · 17–18</text><text x="68" y="241" class="body">Vier koningen die opstaan; heiligen</text><text x="68" y="284" class="body">ontvangen en bezitten het Koninkrijk</text><text x="68" y="327" class="body">voor altijd.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vierde dier · 23</text><text x="68" y="476" class="body">Vierde rijk op aarde, anders dan alle</text><text x="68" y="519" class="body">andere, etend, vertrappend en</text><text x="68" y="562" class="body">verbrijzelend.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Tien en een andere · 24</text><text x="68" y="711" class="body">Tien koningen uit het rijk; daarna een</text><text x="68" y="754" class="body">andere die drie koningen vernedert.</text><rect x="42" y="812" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Tijd en oordeel · 25–27</text><text x="68" y="903" class="body">Grote woorden, heiligen onderdrukt en</text><text x="68" y="946" class="body">tijden/wet willen veranderen; een tijd,</text><text x="68" y="989" class="body">twee tijden, halve tijd, dan gerecht en</text><text x="68" y="1032" class="body">eeuwig Rijk.</text><text x="46" y="1125" class="note">Het hoofdstuk noemt geen eigen namen van deze</text><text x="46" y="1161" class="note">koningen. De tijdformule blijft staan zonder een</text><text x="46" y="1197" class="note">nieuwe kalenderdatum te berekenen.</text></svg>