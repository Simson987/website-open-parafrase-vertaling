<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1349" viewBox="0 0 840 1349" role="img" aria-labelledby="title desc"><title id="title">Trouw, verbod en redding</title><desc id="desc">De volledige voortgang van de gebeurtenissen en de plaats van de uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1349" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Trouw, verbod en redding</text><text x="44" y="113" class="ref">Daniël 6:1–29</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het plan · 1–10</text><text x="68" y="241" class="body">Darius, 120 stadhouders en drie</text><text x="68" y="284" class="body">bestuurders; betrouwbare Daniël</text><text x="68" y="327" class="body">aangeklaagd via dertigdaags</text><text x="68" y="370" class="body">gebedsverbod.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Gebed en de kuil · 11–19</text><text x="68" y="519" class="body">Driemaal per dag zoals altijd,</text><text x="68" y="562" class="body">aanklacht en vergeefse reddingspoging;</text><text x="68" y="605" class="body">kuil, verzegelde steen en slapeloze</text><text x="68" y="648" class="body">koning.</text><rect x="42" y="706" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Het eerste licht · 20–25</text><text x="68" y="797" class="body">Koning roept, Daniël antwoordt over</text><text x="68" y="840" class="body">engel en gesloten muilen; ongedeerd</text><text x="68" y="883" class="body">omhoog, oordeel over aanklagers.</text><rect x="42" y="941" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="984" class="label">De verkondiging · 26–29</text><text x="68" y="1032" class="body">Brief aan alle volken met vrede en</text><text x="68" y="1075" class="body">eerbied voor levende God die redt;</text><text x="68" y="1118" class="body">Daniël voorspoed onder Darius en Kores.</text><text x="46" y="1211" class="note">De versnummering volgt deze hoofdstuktekst.</text><text x="46" y="1247" class="note">Vertelde gebeurtenissen, geciteerde uitspraken</text><text x="46" y="1283" class="note">en droombeelden hebben elk hun eigen plaats.</text></svg>