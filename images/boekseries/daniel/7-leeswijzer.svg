<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Dieren, gerecht en Koninkrijk</title><desc id="desc">De gehele droom, gegeven uitleg en de verontruste reactie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dieren, gerecht en Koninkrijk</text><text x="44" y="113" class="ref">Daniël 7:1–28</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het nachtgezicht · 1–8</text><text x="68" y="241" class="body">Eerste jaar Belsazar, droom</text><text x="68" y="284" class="body">opgeschreven; zee, vier winden, vier</text><text x="68" y="327" class="body">verschillende dieren, tien en kleine</text><text x="68" y="370" class="body">hoorn.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Het gerecht · 9–14</text><text x="68" y="519" class="body">Oude van dagen, vuur, boeken en</text><text x="68" y="562" class="body">oordeel; iemand als een mensenzoon met</text><text x="68" y="605" class="body">de wolken ontvangt eeuwige macht.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De uitleg · 15–27</text><text x="68" y="754" class="body">Vier koningen, vierde rijk en hoorns,</text><text x="68" y="797" class="body">onderdrukking en gerecht; heiligen</text><text x="68" y="840" class="body">ontvangen het blijvende Rijk.</text><rect x="42" y="898" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">De reactie · 28</text><text x="68" y="989" class="body">Daniël zeer verontrust en verbleekt,</text><text x="68" y="1032" class="body">bewaart het woord in zijn hart.</text><text x="46" y="1125" class="note">Dit is een droom met uitleg binnen hetzelfde</text><text x="46" y="1161" class="note">hoofdstuk. De dierkenmerken zijn beschreven</text><text x="46" y="1197" class="note">symbolen.</text></svg>