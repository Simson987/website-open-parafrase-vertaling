<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1084" viewBox="0 0 840 1084" role="img" aria-labelledby="title desc"><title id="title">De woorden en hun uitleg</title><desc id="desc">Exacte geschreven reeks en de drie gegeven verklaringen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1084" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De woorden en hun uitleg</text><text x="44" y="113" class="ref">Daniël 5:25–28</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het schrift · 25</text><text x="68" y="241" class="body">MENE, MENE, TEKEL, UPHARSIN.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">MENE · 26</text><text x="68" y="390" class="body">God heeft de dagen van uw koninkrijk</text><text x="68" y="433" class="body">geteld en er een einde aan gemaakt.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">TEKEL · 27</text><text x="68" y="582" class="body">Op de weegschaal gewogen en te licht</text><text x="68" y="625" class="body">bevonden.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">PERES · 28</text><text x="68" y="774" class="body">Uw koninkrijk is verdeeld en aan de</text><text x="68" y="817" class="body">Meden en de Perzen gegeven.</text><text x="46" y="910" class="note">De geschreven reeks heeft tweemaal MENE en</text><text x="46" y="946" class="note">eindigt hier met UPHARSIN. Bij de uitleg</text><text x="46" y="982" class="note">gebruikt de hoofdstuktekst PERES; beide vormen</text><text x="46" y="1018" class="note">blijven zichtbaar.</text></svg>