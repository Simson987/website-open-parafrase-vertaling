<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1256" viewBox="0 0 840 1256" role="img" aria-labelledby="title desc"><title id="title">De vier beschreven dieren</title><desc id="desc">Alle vier dieren met de exact genoemde kenmerken en aantallen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1256" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vier beschreven dieren</text><text x="44" y="113" class="ref">Daniël 7:4–8,19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste · 4</text><text x="68" y="241" class="body">Als leeuw met arendsvleugels; vleugels</text><text x="68" y="284" class="body">weg, op twee voeten als mens gezet,</text><text x="68" y="327" class="body">mensenhart gegeven.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tweede · 5</text><text x="68" y="476" class="body">Als beer, half overeind; drie ribben</text><text x="68" y="519" class="body">tussen de tanden, opdracht veel vlees</text><text x="68" y="562" class="body">te eten.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Derde · 6</text><text x="68" y="711" class="body">Als luipaard; vier vogelvleugels op de</text><text x="68" y="754" class="body">rug, vier koppen, macht gegeven.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Vierde · 7–8,19</text><text x="68" y="903" class="body">Anders en zeer sterk, ijzeren tanden en</text><text x="68" y="946" class="body">bronzen klauwen, tien hoorns; kleine</text><text x="68" y="989" class="body">hoorn met ogen en sprekende mond.</text><text x="46" y="1082" class="note">De verschillende aantallen horen bij</text><text x="46" y="1118" class="note">verschillende dieren. De vier koppen en vier</text><text x="46" y="1154" class="note">vleugels zijn opzettelijke visioenelementen,</text><text x="46" y="1190" class="note">geen gewone dierenanatomie.</text></svg>