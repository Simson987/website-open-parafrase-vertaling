<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1349" viewBox="0 0 840 1349" role="img" aria-labelledby="title desc"><title id="title">Verdragen en opvolgingen</title><desc id="desc">De volgorde van beide diplomatieke stappen en onderscheiden opvolgers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1349" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verdragen en opvolgingen</text><text x="44" y="113" class="ref">Daniël 11:2–24</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Perzië en breuk · 2–4</text><text x="68" y="241" class="body">Drie en een vierde rijke koning; daarna</text><text x="68" y="284" class="body">machtige koning, rijk verdeeld naar</text><text x="68" y="327" class="body">vier windstreken en niet naar</text><text x="68" y="370" class="body">nakomelingen.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Eerste dochter · 5–9</text><text x="68" y="519" class="body">Zuiden en Noorden verbinden; dochter</text><text x="68" y="562" class="body">verliest positie, haar familie volgt</text><text x="68" y="605" class="body">met overwinning en buit naar Egypte.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Nieuwe strijd en dochter · 10–19</text><text x="68" y="754" class="body">Legers en ommekeer; verdrag met dochter</text><text x="68" y="797" class="body">om rijk te gronde te richten mislukt,</text><text x="68" y="840" class="body">kustlanden en eigen einde.</text><rect x="42" y="898" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Nog twee opvolgers · 20–24</text><text x="68" y="989" class="body">Belastingambtenaar snel gebroken zonder</text><text x="68" y="1032" class="body">oorlog; verachte man krijgt rijk via</text><text x="68" y="1075" class="body">vleierij, verbond, bedrog en verdeling</text><text x="68" y="1118" class="body">van buit.</text><text x="46" y="1211" class="note">De twee dochterpassages blijven apart. De tekst</text><text x="46" y="1247" class="note">noemt deze vrouwen en opvolgers hier niet bij</text><text x="46" y="1283" class="note">naam.</text></svg>