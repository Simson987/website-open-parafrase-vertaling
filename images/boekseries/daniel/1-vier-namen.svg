<svg xmlns="http://www.w3.org/2000/svg" width="840" height="919" viewBox="0 0 840 919" role="img" aria-labelledby="title desc"><title id="title">Vier mannen, andere namen</title><desc id="desc">Exacte koppeling van de vier eigen namen en hofnamen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="919" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier mannen, andere namen</text><text x="44" y="113" class="ref">Daniël 1:6–7</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Daniël</text><text x="68" y="241" class="body">Wordt Beltsazar genoemd.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Hananja</text><text x="68" y="390" class="body">Wordt Sadrach genoemd.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Misaël</text><text x="68" y="539" class="body">Wordt Mesach genoemd.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Azarja</text><text x="68" y="688" class="body">Wordt Abed-Nego genoemd.</text><text x="46" y="781" class="note">Beltsazar is Daniëls hofnaam. Belsazar zonder de</text><text x="46" y="817" class="note">t is de naam van de koning in hoofdstuk 5; de</text><text x="46" y="853" class="note">twee personen blijven onderscheiden.</text></svg>