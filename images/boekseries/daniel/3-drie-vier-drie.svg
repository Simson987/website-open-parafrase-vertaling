<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Drie, vier en drie</title><desc id="desc">Exacte aantallen en verandering van gebonden naar los en ongedeerd.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie, vier en drie</text><text x="44" y="113" class="ref">Daniël 3:20–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie gebonden · 20–23</text><text x="68" y="241" class="body">Sadrach, Mesach en Abed-Nego in hun</text><text x="68" y="284" class="body">kleding vastgebonden en in de oven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vier los · 24–25</text><text x="68" y="433" class="body">De koning ziet vier mannen zonder</text><text x="68" y="476" class="body">letsel rondlopen; de vierde lijkt hem</text><text x="68" y="519" class="body">op een zoon van de goden.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Drie naar buiten · 26–27</text><text x="68" y="668" class="body">De drie bij naam geroepen en</text><text x="68" y="711" class="body">onderzocht: geen verbrand haar, kapotte</text><text x="68" y="754" class="body">mantel of brandlucht.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Zijn erkenning · 28</text><text x="68" y="903" class="body">De koning prijst hun God die Zijn engel</text><text x="68" y="946" class="body">stuurde en Zijn vertrouwende dienaren</text><text x="68" y="989" class="body">redde.</text><text x="46" y="1082" class="note">De waarneming in vers 25 en de uitspraak over de</text><text x="46" y="1118" class="note">engel in vers 28 staan beide vermeld. De vierde</text><text x="46" y="1154" class="note">krijgt geen extra persoonsnaam.</text></svg>