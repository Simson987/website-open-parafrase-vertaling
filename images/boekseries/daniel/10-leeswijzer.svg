<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1313" viewBox="0 0 840 1313" role="img" aria-labelledby="title desc"><title id="title">Rouw, ontzetting en versterking</title><desc id="desc">De onderscheiden reacties, aanrakingen en woorden van versterking.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1313" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rouw, ontzetting en versterking</text><text x="44" y="113" class="ref">Daniël 10:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tijd en rouw · 1–4</text><text x="68" y="241" class="body">Derde jaar Kores, drie weken geen</text><text x="68" y="284" class="body">lekker eten, vlees, wijn of olie; dag</text><text x="68" y="327" class="body">24 van maand 1 aan de Tigris.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het gezicht · 5–9</text><text x="68" y="476" class="body">Man in linnen, gouden gordel en glans;</text><text x="68" y="519" class="body">Daniël ziet, metgezellen niet, zij</text><text x="68" y="562" class="body">vluchten; hij verliest kracht en valt</text><text x="68" y="605" class="body">in slaap.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Opgericht · 10–19</text><text x="68" y="754" class="body">Aangeraakt, woorden vanaf eerste dag</text><text x="68" y="797" class="body">gehoord; 21 dagen tegenstand en</text><text x="68" y="840" class="body">Michaëls hulp; lippen en lichaam</text><text x="68" y="883" class="body">aangeraakt, vrede en kracht.</text><rect x="42" y="941" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="984" class="label">Wat volgt · 20–21</text><text x="68" y="1032" class="body">Strijd met vorst van Perzië, daarna</text><text x="68" y="1075" class="body">Griekenland; boek van waarheid en</text><text x="68" y="1118" class="body">Michaël als hulp.</text><text x="46" y="1211" class="note">De drie weken rouw en 21 dagen tegenstand worden</text><text x="46" y="1247" class="note">beide vermeld zonder meer datums toe te voegen.</text></svg>