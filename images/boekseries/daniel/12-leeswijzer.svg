<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Benauwdheid, woorden en wachten</title><desc id="desc">De opbouw met de verschillende toekomstwoorden en Daniëls eigen vraag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Benauwdheid, woorden en wachten</text><text x="44" y="113" class="ref">Daniël 12:1–13</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Redding en ontwaken · 1–3</text><text x="68" y="241" class="body">Michaël, benauwdheid, gered wie in het</text><text x="68" y="284" class="body">boek staat; ontwaken tot twee</text><text x="68" y="327" class="body">uitkomsten, leraars en</text><text x="68" y="370" class="body">rechtvaardigmakers stralen.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Bewaren en vragen · 4–10</text><text x="68" y="519" class="body">Boek verzegeld, twee oevers en Man</text><text x="68" y="562" class="body">boven water, tijdwoord; Daniël begrijpt</text><text x="68" y="605" class="body">niet, geheim tot einde, wijzen en</text><text x="68" y="648" class="body">goddelozen.</text><rect x="42" y="706" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Dagen en laatste woord · 11–13</text><text x="68" y="797" class="body">1290 dagen, gelukkig wie 1335 bereikt;</text><text x="68" y="840" class="body">Daniël gaat heen, rust en staat op voor</text><text x="68" y="883" class="body">zijn deel.</text><text x="46" y="976" class="note">Ontwaken heeft in de passage twee uitkomsten.</text><text x="46" y="1012" class="note">Die worden in de uitleg allebei genoemd.</text></svg>