<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Ram, bok en de betekenis</title><desc id="desc">De opeenvolging van het visioen, de vraag, de uitleg en de reactie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ram, bok en de betekenis</text><text x="44" y="113" class="ref">Daniël 8:1–27</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het visioen · 1–12</text><text x="68" y="241" class="body">Derde jaar Belsazar, Susan in Elam bij</text><text x="68" y="284" class="body">Ulai; ram, bok, gebroken en nieuwe</text><text x="68" y="327" class="body">hoorns, aanslag op heiligdom en</text><text x="68" y="370" class="body">waarheid.</text><rect x="42" y="428" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De vraag · 13–14</text><text x="68" y="519" class="body">Hoelang? 2300 avonden en morgens,</text><text x="68" y="562" class="body">daarna herstel van het heiligdom.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De uitleg · 15–26</text><text x="68" y="711" class="body">Gabriël laat begrijpen, Daniël schrikt</text><text x="68" y="754" class="body">en wordt opgericht; namen van rijken en</text><text x="68" y="797" class="body">machtsverloop verklaard, geheim houden.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De reactie · 27</text><text x="68" y="946" class="body">Daniël zwak en enkele dagen ziek,</text><text x="68" y="989" class="body">daarna koningswerk; blijft ontsteld.</text><text x="46" y="1082" class="note">Het visioen en de uitleg horen bij elkaar. De</text><text x="46" y="1118" class="note">oude plaatsnamen en namen van de koninkrijken</text><text x="46" y="1154" class="note">volgen deze tekst.</text></svg>