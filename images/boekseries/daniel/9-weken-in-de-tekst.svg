<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1514" viewBox="0 0 840 1514" role="img" aria-labelledby="title desc"><title id="title">De weken in de ontvangen woorden</title><desc id="desc">Alle genoemde weekgroepen en de beschreven gebeurtenissen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1514" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De weken in de ontvangen woorden</text><text x="44" y="113" class="ref">Daniël 9:24–27</text><rect x="42" y="150" width="756" height="299" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zeventig weken · 24</text><text x="68" y="241" class="body">Over volk en heilige stad: ontrouw</text><text x="68" y="284" class="body">beëindigen, zonden verzegelen, schuld</text><text x="68" y="327" class="body">verzoenen, eeuwige gerechtigheid,</text><text x="68" y="370" class="body">visioen en profeet bezegelen,</text><text x="68" y="413" class="body">allerheiligste zalven.</text><rect x="42" y="471" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="514" class="label">Zeven en tweeënzestig · 25</text><text x="68" y="562" class="body">Vanaf het woord om Jeruzalem te</text><text x="68" y="605" class="body">herbouwen tot de Messias, de Vorst;</text><text x="68" y="648" class="body">straten en grachten in benauwdheid</text><text x="68" y="691" class="body">herbouwd.</text><rect x="42" y="749" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="792" class="label">Na de tweeënzestig · 26</text><text x="68" y="840" class="body">Messias uitgeroeid, niet voor zichzelf;</text><text x="68" y="883" class="body">volk van komende vorst verwoest stad en</text><text x="68" y="926" class="body">heiligdom, oorlog en vaststaande</text><text x="68" y="969" class="body">verwoestingen.</text><rect x="42" y="1027" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1070" class="label">Eén week en de helft · 27</text><text x="68" y="1118" class="body">Verbond voor velen versterkt;</text><text x="68" y="1161" class="body">halverwege slachtoffer en graanoffer</text><text x="68" y="1204" class="body">weg, gruwel en vastgesteld einde over</text><text x="68" y="1247" class="body">de verwoester.</text><text x="46" y="1340" class="note">De formuleringen en volgorde blijven staan. Er</text><text x="46" y="1376" class="note">zijn geen eigen beginjaren, huidige</text><text x="46" y="1412" class="note">kalenderdatums of niet genoemde persoonsnamen</text><text x="46" y="1448" class="note">ingevuld.</text></svg>