<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1157" viewBox="0 0 840 1157" role="img" aria-labelledby="title desc"><title id="title">Tafel, schepen en het verbond</title><desc id="desc">De verbanden van tafelleugens, schepen, verbond en standvastigheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1157" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tafel, schepen en het verbond</text><text x="44" y="113" class="ref">Daniël 11:25–35</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Legers en tafel · 25–28</text><text x="68" y="241" class="body">Zuiden door plannen en tafelgenoten</text><text x="68" y="284" class="body">gebroken; twee koningen liegen,</text><text x="68" y="327" class="body">terugkeer met bezit en hart tegen het</text><text x="68" y="370" class="body">verbond.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Terugkeer en Chittim · 29–31</text><text x="68" y="519" class="body">Nieuwe zuidelijke tocht loopt anders;</text><text x="68" y="562" class="body">schepen, moedverlies, woede tegen</text><text x="68" y="605" class="body">verbond, heiligdom en dagelijks offer</text><text x="68" y="648" class="body">aangetast.</text><rect x="42" y="706" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Twee reacties · 32–35</text><text x="68" y="797" class="body">Vleierij tot huichelen tegenover volk</text><text x="68" y="840" class="body">dat God kent; leraars onderwijzen,</text><text x="68" y="883" class="body">vervolging, beperkte hulp en loutering</text><text x="68" y="926" class="body">tot vaste tijd.</text><text x="46" y="1019" class="note">Het schema onderscheidt politiek bedrog en de</text><text x="46" y="1055" class="note">reacties onder het volk. De uitspraak over de</text><text x="46" y="1091" class="note">vastgestelde tijd loopt door de passage.</text></svg>