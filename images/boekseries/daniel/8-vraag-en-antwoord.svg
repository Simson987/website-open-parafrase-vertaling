<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">De vraag en het tijdwoord</title><desc id="desc">De precieze vraag, antwoordformule en verwerkingsreactie van Daniël.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vraag en het tijdwoord</text><text x="44" y="113" class="ref">Daniël 8:13–19,26–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 13</text><text x="68" y="241" class="body">Hoelang dagelijks offer weg,</text><text x="68" y="284" class="body">verwoestende ontrouw, heiligdom en</text><text x="68" y="327" class="body">leger vertrapt?</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het antwoord · 14</text><text x="68" y="476" class="body">Tot tweeduizend driehonderd avonden en</text><text x="68" y="519" class="body">morgens; dan heiligdom weer in ere</text><text x="68" y="562" class="body">hersteld.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De opdracht aan Gabriël · 15–19</text><text x="68" y="711" class="body">Daniël zoekt betekenis, stem noemt</text><text x="68" y="754" class="body">Gabriël; tijd van het einde, diepe</text><text x="68" y="797" class="body">slaap en weer opgericht.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Het bewaren · 26–27</text><text x="68" y="946" class="body">Avonden-en-morgensvisioen is waar,</text><text x="68" y="989" class="body">geheim want nog veel dagen; Daniël ziek</text><text x="68" y="1032" class="body">en later weer aan het werk.</text><text x="46" y="1125" class="note">De formulering avonden en morgens blijft intact.</text><text x="46" y="1161" class="note">Er wordt geen andere eenheid of eigen begin- en</text><text x="46" y="1197" class="note">einddatum voor in de plaats gezet.</text></svg>