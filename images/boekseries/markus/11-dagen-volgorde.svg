<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">De opeenvolgende dagen</title><desc id="desc">De opeenvolgende dagen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De opeenvolgende dagen</text><text x="44" y="113" class="ref">Markus 11:11–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Avond aankomst · 11</text><text x="68" y="241" class="body">Tempel bekijken, met twaalf naar</text><text x="68" y="284" class="body">Bethanië.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Volgende dag · 12–19</text><text x="68" y="433" class="body">Vijgenboom aangesproken, tempelhandel</text><text x="68" y="476" class="body">verwijderd; avond uit stad.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Volgende ochtend · 20–27</text><text x="68" y="625" class="body">Boom vanaf wortels verdord, Petrus</text><text x="68" y="668" class="body">herinnert, geloof/gebed/vergeving; weer</text><text x="68" y="711" class="body">Jeruzalem.</text><text x="46" y="804" class="note">De boom is in dit evangelie de volgende ochtend</text><text x="46" y="840" class="note">als verdord gezien; geen tijden uit een ander</text><text x="46" y="876" class="note">evangelie samengevoegd.</text></svg>