<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Aantallen bij de maaltijd</title><desc id="desc">Aantallen bij de maaltijd met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aantallen bij de maaltijd</text><text x="44" y="113" class="ref">Markus 6:35–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vraag · 37–38</text><text x="68" y="241" class="body">Tweehonderd penningen als vraag;</text><text x="68" y="284" class="body">werkelijk vijf broden en twee vissen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zitten · 39–40</text><text x="68" y="433" class="body">Groen gras, groepen van honderd en</text><text x="68" y="476" class="body">vijftig.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Uitdelen · 41–44</text><text x="68" y="625" class="body">Zegen/breken, allen genoeg; twaalf</text><text x="68" y="668" class="body">manden brood/vis, ongeveer vijfduizend</text><text x="68" y="711" class="body">mannen.</text><text x="46" y="804" class="note">Tweehonderd penningen is geen uitgevoerde</text><text x="46" y="840" class="note">aankoop; aantallen volgen de plaatselijke tekst.</text></svg>