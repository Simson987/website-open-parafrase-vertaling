<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Voorbereiding van het Pascha</title><desc id="desc">Voorbereiding van het Pascha met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voorbereiding van het Pascha</text><text x="44" y="113" class="ref">Markus 14:12–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De twee · 13</text><text x="68" y="241" class="body">Stad in, man met kruik water ontmoeten,</text><text x="68" y="284" class="body">hem volgen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het huis · 14–15</text><text x="68" y="433" class="body">Eigenaar vragen naar eetzaal; grote</text><text x="68" y="476" class="body">ingerichte bovenzaal.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De uitvoering · 16</text><text x="68" y="625" class="body">Alles zo gevonden en Pascha</text><text x="68" y="668" class="body">klaargemaakt.</text><text x="46" y="761" class="note">Waterkruikman is alleen voor dit evangelie in</text><text x="46" y="797" class="note">deze reeks opgenomen; geen naam verzonnen.</text></svg>