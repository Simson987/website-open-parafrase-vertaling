<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De verschillende gesprekken</title><desc id="desc">De verschillende gesprekken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De verschillende gesprekken</text><text x="44" y="113" class="ref">Markus 12:13–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Belasting · 13–17</text><text x="68" y="241" class="body">Farizeeën/Herodesaanhangers; keizer en</text><text x="68" y="284" class="body">God geven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Opstanding · 18–27</text><text x="68" y="433" class="body">Sadduceeën, zevenbroerscasus; geen</text><text x="68" y="476" class="body">huwelijk, God van levenden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gebod · 28–34</text><text x="68" y="625" class="body">Schriftgeleerde, ene Heere en liefde</text><text x="68" y="668" class="body">God/naaste; niet ver koninkrijk.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Messias en geven · 35–44</text><text x="68" y="817" class="body">David noemt Hem Heere; waarschuwing</text><text x="68" y="860" class="body">schijn, weduwe geeft alles.</text><text x="46" y="953" class="note">Casus is geen historische stamboom; twee muntjes</text><text x="46" y="989" class="note">blijven geen modern eurobedrag.</text></svg>