<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Opgestaan en uitgezonden</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opgestaan en uitgezonden</text><text x="44" y="113" class="ref">Markus 16:1–20</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij het graf · 1–8</text><text x="68" y="241" class="body">Drie vrouwen/geurige kruiden, vroege</text><text x="68" y="284" class="body">zon/steen weg; jonge man rechts in wit,</text><text x="68" y="327" class="body">opgestaan, leerlingen en</text><text x="68" y="370" class="body">Petrus/Galilea; schrik en vluchten.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Verschijningen · 9–14</text><text x="68" y="519" class="body">Eerst Maria Magdalena, rouwenden</text><text x="68" y="562" class="body">geloven niet; twee op landweg en</text><text x="68" y="605" class="body">opnieuw ongeloof; elf aan tafel</text><text x="68" y="648" class="body">aangesproken.</text><rect x="42" y="706" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Opdracht en vervolg · 15–20</text><text x="68" y="797" class="body">Wereldwijd evangelie, geloof/doop en</text><text x="68" y="840" class="body">tekenen; opgenomen en rechterhand,</text><text x="68" y="883" class="body">overal verkondigen, Heere werkt mee.</text><text x="46" y="976" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1012" class="note">de plaatselijke versindeling.</text></svg>