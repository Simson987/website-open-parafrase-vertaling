<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Opletten en wakker blijven</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opletten en wakker blijven</text><text x="44" y="113" class="ref">Markus 13:1–37</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 1–13</text><text x="68" y="241" class="body">Tempelstenen, vier leerlingen op</text><text x="68" y="284" class="body">Olijfberg; misleiding, oorlog/weeën,</text><text x="68" y="327" class="body">vervolging, Geest spreekt, volhouden.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vlucht en komst · 14–27</text><text x="68" y="476" class="body">Daniëlwoord en Judea naar bergen,</text><text x="68" y="519" class="body">wintergebed en verkorte dagen; valse</text><text x="68" y="562" class="body">christussen, hemeltekens/Mensenzoon en</text><text x="68" y="605" class="body">verzamelen.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Leren en waken · 28–37</text><text x="68" y="754" class="body">Vijg/zomer, woorden blijven, alleen</text><text x="68" y="797" class="body">Vader dag/uur;</text><text x="68" y="840" class="body">reiziger/dienaren/deurwachter, vier</text><text x="68" y="883" class="body">nachtperioden en iedereen wakker.</text><text x="46" y="976" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1012" class="note">de plaatselijke versindeling.</text></svg>