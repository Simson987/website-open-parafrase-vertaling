<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Vergeving, tafel en sabbat</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vergeving, tafel en sabbat</text><text x="44" y="113" class="ref">Markus 2:1–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dak en mat · 1–12</text><text x="68" y="241" class="body">Vier dragen, dak open,</text><text x="68" y="284" class="body">geloof/vergeving, Schriftgeleerden</text><text x="68" y="327" class="body">denken, gezag en opstaan/naar huis.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Levi en nieuwe tijd · 13–22</text><text x="68" y="476" class="body">Levi zoon Alfeüs geroepen,</text><text x="68" y="519" class="body">maaltijd/artsvergelijking; vastenvraag,</text><text x="68" y="562" class="body">bruidegom, lap en wijnzakken.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Aren · 23–28</text><text x="68" y="711" class="body">Sabbatvraag, David/toonbroden in</text><text x="68" y="754" class="body">Abjathartijd; sabbat voor mens,</text><text x="68" y="797" class="body">Mensenzoon Heere.</text><text x="46" y="890" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="926" class="note">de plaatselijke versindeling.</text></svg>