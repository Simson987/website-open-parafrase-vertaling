<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Uitzending, brood en vertrouwen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uitzending, brood en vertrouwen</text><text x="44" y="113" class="ref">Markus 6:1–56</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vaderstad en twaalf · 1–13</text><text x="68" y="241" class="body">Ongeloof, enkele genezingen, dorpen;</text><text x="68" y="284" class="body">twee aan twee, staf/sandalen wel maar</text><text x="68" y="327" class="body">geen voorraad, verkondigen/genezen.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Herodes en terugkeer · 14–34</text><text x="68" y="476" class="body">Meningen over Jezus, terugblik Johannes</text><text x="68" y="519" class="body">en Herodias’ dochter, dood/begraven;</text><text x="68" y="562" class="body">apostelen terug, rustschip maar menigte</text><text x="68" y="605" class="body">voor.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Maaltijd en meer · 35–56</text><text x="68" y="754" class="body">Vijf broden/twee vissen, groepen</text><text x="68" y="797" class="body">100/50, vijfduizend en twaalf manden;</text><text x="68" y="840" class="body">gebed, tegenwind/waterlopen,</text><text x="68" y="883" class="body">Gennesaretzieken.</text><text x="46" y="976" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1012" class="note">de plaatselijke versindeling.</text></svg>