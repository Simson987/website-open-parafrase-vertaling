<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Twee verzoeken langs de weg</title><desc id="desc">Twee verzoeken langs de weg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee verzoeken langs de weg</text><text x="44" y="113" class="ref">Markus 10:35–52</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jakobus en Johannes · 35–40</text><text x="68" y="241" class="body">Wat willen jullie? Rechts/links;</text><text x="68" y="284" class="body">beker/doop, plaatsen voor bestemde</text><text x="68" y="327" class="body">mensen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De tien en de les · 41–45</text><text x="68" y="476" class="body">Boos, Jezus roept; groot/eerste door</text><text x="68" y="519" class="body">dienen, losprijs velen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bartimeüs · 46–52</text><text x="68" y="668" class="body">Wat wilt u? Kunnen zien; geloof, meteen</text><text x="68" y="711" class="body">zicht en volgen.</text><text x="46" y="804" class="note">De vergelijkbare vraag leidt tot verschillende</text><text x="46" y="840" class="note">verzoeken; Bartimeüs is zoon van Timeüs.</text></svg>