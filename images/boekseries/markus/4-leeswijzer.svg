<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Horen, groeien en vertrouwen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Horen, groeien en vertrouwen</text><text x="44" y="113" class="ref">Markus 4:1–41</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zaaier en uitleg · 1–20</text><text x="68" y="241" class="body">Boot/oever, vier gronden,</text><text x="68" y="284" class="body">geheim/hoorwoorden; zaaier woord en</text><text x="68" y="327" class="body">verschillende reacties,</text><text x="68" y="370" class="body">dertig/zestig/honderd.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Andere beelden · 21–34</text><text x="68" y="519" class="body">Lamp/zichtbaar, maat/horen, vanzelf</text><text x="68" y="562" class="body">groeiend zaad en oogst, mosterd met</text><text x="68" y="605" class="body">vogels, leerlingen uitleg apart.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het meer · 35–41</text><text x="68" y="754" class="body">Avond overkant, andere schepen, storm</text><text x="68" y="797" class="body">en kussen; wakker maken, wind/meer</text><text x="68" y="840" class="body">stil, vraag naar geloof.</text><text x="46" y="933" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="969" class="note">de plaatselijke versindeling.</text></svg>