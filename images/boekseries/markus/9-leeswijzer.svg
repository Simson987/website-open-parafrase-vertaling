<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Heerlijkheid, geloof en dienen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Heerlijkheid, geloof en dienen</text><text x="44" y="113" class="ref">Markus 9:1–50</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De berg · 1–13</text><text x="68" y="241" class="body">Zes dagen, drie leerlingen, Elia/Mozes</text><text x="68" y="284" class="body">en tentvoorstel, wolk/stem;</text><text x="68" y="327" class="body">afdalen/zwijgen, opstandingvraag en</text><text x="68" y="370" class="body">Elia.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De jongen · 14–29</text><text x="68" y="519" class="body">Discussie, vader sinds jeugd,</text><text x="68" y="562" class="body">geloof/ongeloof, bevrijding en overeind</text><text x="68" y="605" class="body">helpen; apart gebed/vasten.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De weg en het huis · 30–50</text><text x="68" y="754" class="body">Lijden/derde dag, wie grootste?</text><text x="68" y="797" class="body">Laatste/dienen, kind omarmd, niet tegen</text><text x="68" y="840" class="body">is voor; water, kleinen, radicale</text><text x="68" y="883" class="body">beelden, zout/vrede.</text><text x="46" y="976" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1012" class="note">de plaatselijke versindeling.</text></svg>