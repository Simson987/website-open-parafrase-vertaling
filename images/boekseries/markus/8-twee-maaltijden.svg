<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">De twee maaltijden herinnerd</title><desc id="desc">De twee maaltijden herinnerd met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee maaltijden herinnerd</text><text x="44" y="113" class="ref">Markus 8:19–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste herinnering · 19</text><text x="68" y="241" class="body">Vijf broden, vijfduizend mannen, twaalf</text><text x="68" y="284" class="body">manden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede herinnering · 20</text><text x="68" y="433" class="body">Zeven broden, vierduizend mannen, zeven</text><text x="68" y="476" class="body">manden.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vraag · 21</text><text x="68" y="625" class="body">Begrijpen jullie het nog steeds niet?</text><text x="46" y="718" class="note">Dit zijn Jezus’ vragen en hun antwoorden binnen</text><text x="46" y="754" class="note">dit hoofdstuk; de aantallen blijven gekoppeld.</text></svg>