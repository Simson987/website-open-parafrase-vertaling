<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1164" viewBox="0 0 840 1164" role="img" aria-labelledby="title desc"><title id="title">Proces, kruis en begrafenis</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1164" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Proces, kruis en begrafenis</text><text x="44" y="113" class="ref">Markus 15:1–47</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Pilatus · 1–20</text><text x="68" y="241" class="body">Koningsvraag, zwijgen, Barabbas of</text><text x="68" y="284" class="body">Jezus, druk menigte; geseling/spot in</text><text x="68" y="327" class="body">purper en doornen, eigen kleding weer</text><text x="68" y="370" class="body">aan.</text><rect x="42" y="428" width="756" height="299" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Het kruis · 21–41</text><text x="68" y="519" class="body">Simon vader Alexander/Rufus draagt,</text><text x="68" y="562" class="body">Golgotha/wijn geweigerd, negen uur drie</text><text x="68" y="605" class="body">kruisen, spot; duisternis twaalf/drie,</text><text x="68" y="648" class="body">roep/dood, voorhangsel,</text><text x="68" y="691" class="body">hoofdman/vrouwen.</text><rect x="42" y="749" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="792" class="label">De avond · 42–47</text><text x="68" y="840" class="body">Voorbereidingsdag, Jozef vraagt moedig,</text><text x="68" y="883" class="body">Pilatus verifieert via hoofdman,</text><text x="68" y="926" class="body">linnen/rotsgraf/steen; twee Maria’s</text><text x="68" y="969" class="body">kijken.</text><text x="46" y="1062" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1098" class="note">de plaatselijke versindeling.</text></svg>