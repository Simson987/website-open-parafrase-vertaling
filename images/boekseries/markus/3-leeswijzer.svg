<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Goeddoen, twaalf en familie</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Goeddoen, twaalf en familie</text><text x="44" y="113" class="ref">Markus 3:1–35</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sabbat en meer · 1–12</text><text x="68" y="241" class="body">Hand in midden, goed of kwaad, herstel</text><text x="68" y="284" class="body">en vijandig overleg; menigte uit veel</text><text x="68" y="327" class="body">streken, bootje en zwijggebod.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Twaalf · 13–19</text><text x="68" y="476" class="body">Bij Hem zijn, verkondigen,</text><text x="68" y="519" class="body">genezen/uitdrijven; namen en bijnamen.</text><rect x="42" y="577" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Huis en beschuldiging · 20–35</text><text x="68" y="668" class="body">Niet kunnen eten, familie wil</text><text x="68" y="711" class="body">tegenhouden; Beëlzebul/verdeeld rijk en</text><text x="68" y="754" class="body">sterke man, Geestlaster; familie</text><text x="68" y="797" class="body">buiten, Gods wil doen.</text><text x="46" y="890" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="926" class="note">de plaatselijke versindeling.</text></svg>