<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">De vier genoemde nachtperioden</title><desc id="desc">De vier genoemde nachtperioden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vier genoemde nachtperioden</text><text x="44" y="113" class="ref">Markus 13:32–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat onbekend is</text><text x="68" y="241" class="body">Dag en uur: engelen niet, Zoon niet,</text><text x="68" y="284" class="body">alleen Vader.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wanneer heer kan komen</text><text x="68" y="433" class="body">Avond, middernacht, hanengekraai of</text><text x="68" y="476" class="body">morgen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat te doen</text><text x="68" y="625" class="body">Ieder eigen taak, deurwachter wakker;</text><text x="68" y="668" class="body">allen opletten, bidden en wakker</text><text x="68" y="711" class="body">blijven.</text><text x="46" y="804" class="note">Geen kalender, voorspelde datum of modern exact</text><text x="46" y="840" class="note">tijdschema toegevoegd.</text></svg>