<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De twee verhalen onderweg</title><desc id="desc">De twee verhalen onderweg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee verhalen onderweg</text><text x="44" y="113" class="ref">Markus 5:21–43</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vader · 21–24</text><text x="68" y="241" class="body">Jaïrus vraagt om stervend dochtertje;</text><text x="68" y="284" class="body">Jezus gaat mee.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vrouw · 25–34</text><text x="68" y="433" class="body">Twaalf jaar ziek, aanraken en genezen,</text><text x="68" y="476" class="body">zoeken/waarheid en vrede.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het bericht · 35–36</text><text x="68" y="625" class="body">Dochter gestorven, niet lastigvallen?</text><text x="68" y="668" class="body">Jezus: blijf geloven.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het huis · 37–43</text><text x="68" y="817" class="body">Drie leerlingen en ouders, opstaan en</text><text x="68" y="860" class="body">lopen; meisje twaalf jaar, eten geven.</text><text x="46" y="953" class="note">Twaalf jaar ziekte en twaalfjarige dochter zijn</text><text x="46" y="989" class="note">twee verschillende vermeldingen.</text></svg>