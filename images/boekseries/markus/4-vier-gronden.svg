<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Vier gronden en het woord</title><desc id="desc">Vier gronden en het woord met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier gronden en het woord</text><text x="44" y="113" class="ref">Markus 4:3–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Weg</text><text x="68" y="241" class="body">Vogels eten, satan neemt woord weg.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Rots</text><text x="68" y="390" class="body">Snel blij, geen wortel, bij</text><text x="68" y="433" class="body">verdrukking/vervolging loslaten.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Doornen</text><text x="68" y="582" class="body">Zorgen, bedrieglijke rijkdom en andere</text><text x="68" y="625" class="body">verlangens verstikken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Goede grond</text><text x="68" y="774" class="body">Horen, aanvaarden en vrucht</text><text x="68" y="817" class="body">dertig/zestig/honderdvoud.</text><text x="46" y="910" class="note">De vier reacties blijven aan hun eigen beeld</text><text x="46" y="946" class="note">gekoppeld.</text></svg>