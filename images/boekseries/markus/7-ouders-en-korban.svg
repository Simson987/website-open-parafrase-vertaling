<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">Gebod en het korbanberoep</title><desc id="desc">Gebod en het korbanberoep met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebod en het korbanberoep</text><text x="44" y="113" class="ref">Markus 7:9–13</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gebod · 10</text><text x="68" y="241" class="body">Vader en moeder eren.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het beroep · 11</text><text x="68" y="390" class="body">Wat voor ouders kon worden gedaan is</text><text x="68" y="433" class="body">korban, gave aan God.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De uitkomst · 12–13</text><text x="68" y="582" class="body">Niets meer voor ouders laten doen; zo</text><text x="68" y="625" class="body">woord krachteloos door overlevering.</text><text x="46" y="718" class="note">Dit is kritiek op de beschreven ontwijking van</text><text x="46" y="754" class="note">ouderzorg.</text></svg>