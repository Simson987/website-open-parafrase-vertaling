<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Begin, roeping en ontferming</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Begin, roeping en ontferming</text><text x="44" y="113" class="ref">Markus 1:1–45</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Johannes en Jezus · 1–15</text><text x="68" y="241" class="body">Boodschapper/woestijn, doop/bekering,</text><text x="68" y="284" class="body">Jezus Jordaan/Geest/stem, veertig dagen</text><text x="68" y="327" class="body">en dieren/engelen; Galileaboodschap.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Roeping en Kapernaüm · 16–34</text><text x="68" y="476" class="body">Twee broederparen, Zebedeüs/dagloners;</text><text x="68" y="519" class="body">synagoge/gezag, man bevrijd;</text><text x="68" y="562" class="body">schoonmoeder en avondzieken bij deur.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Eenzaam en onderweg · 35–45</text><text x="68" y="711" class="body">Vroeg bidden, Simon zoekt, nabije</text><text x="68" y="754" class="body">dorpen; melaatse rein,</text><text x="68" y="797" class="body">priester/zwijgopdracht maar verspreid</text><text x="68" y="840" class="body">bericht.</text><text x="46" y="933" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="969" class="note">de plaatselijke versindeling.</text></svg>