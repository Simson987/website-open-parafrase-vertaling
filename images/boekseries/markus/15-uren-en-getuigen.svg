<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Uren en getuigen in de tekst</title><desc id="desc">Uren en getuigen in de tekst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uren en getuigen in de tekst</text><text x="44" y="113" class="ref">Markus 15:21–47</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Negen uur · 25</text><text x="68" y="241" class="body">Ongeveer dit uur gekruisigd.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Twaalf tot drie · 33–39</text><text x="68" y="390" class="body">Donker, rond drie roep, dood en</text><text x="68" y="433" class="body">voorhangsel; hoofdman belijdt.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vrouwen · 40–41</text><text x="68" y="582" class="body">Maria Magdalena, Maria moeder Jakobus</text><text x="68" y="625" class="body">jongere/Joses, Salome; veel andere</text><text x="68" y="668" class="body">vrouwen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Avond · 42–47</text><text x="68" y="817" class="body">Jozef raadslid verwacht koninkrijk,</text><text x="68" y="860" class="body">hoofdman verifieert, linnen/graf; Maria</text><text x="68" y="903" class="body">Magdalena en Maria moeder Joses.</text><text x="46" y="996" class="note">Simon is vader van Alexander en Rufus volgens</text><text x="46" y="1032" class="note">vers 21; getuigenlijst geeft niet een totaal</text><text x="46" y="1068" class="note">aantal vrouwen.</text></svg>