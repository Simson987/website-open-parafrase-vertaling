<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1121" viewBox="0 0 840 1121" role="img" aria-labelledby="title desc"><title id="title">Trouw, bezit en de weg</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1121" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Trouw, bezit en de weg</text><text x="44" y="113" class="ref">Markus 10:1–52</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Huwelijk en kinderen · 1–16</text><text x="68" y="241" class="body">Judea/Jordaan, Mozes/hard hart,</text><text x="68" y="284" class="body">schepping/één, binnenhuistoelichting;</text><text x="68" y="327" class="body">kinderen niet hinderen,</text><text x="68" y="370" class="body">ontvangen/zegenen.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Bezit en volgen · 17–31</text><text x="68" y="519" class="body">Geboden, liefhebben,</text><text x="68" y="562" class="body">verkopen/geven/kruis/volgen, vertrek;</text><text x="68" y="605" class="body">kameel/naald, Gods mogelijkheid,</text><text x="68" y="648" class="body">honderdvoud mét vervolgingen.</text><rect x="42" y="706" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Jeruzalem en Jericho · 32–52</text><text x="68" y="797" class="body">Twaalf apart lijdenswoord, twee broers</text><text x="68" y="840" class="body">rechts/links, dienen/losprijs;</text><text x="68" y="883" class="body">Bartimeüs geroepen, mantel weg, zien en</text><text x="68" y="926" class="body">volgen.</text><text x="46" y="1019" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1055" class="note">de plaatselijke versindeling.</text></svg>