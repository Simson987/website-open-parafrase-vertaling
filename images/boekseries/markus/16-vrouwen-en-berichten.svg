<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Vrouwen en berichten</title><desc id="desc">Vrouwen en berichten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrouwen en berichten</text><text x="44" y="113" class="ref">Markus 16:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie bij het graf · 1–8</text><text x="68" y="241" class="body">Maria Magdalena, Maria moeder Jakobus</text><text x="68" y="284" class="body">en Salome; jonge man geeft boodschap.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Maria · 9–11</text><text x="68" y="433" class="body">Ziet Jezus, vertelt rouwenden; niet</text><text x="68" y="476" class="body">geloofd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee · 12–13</text><text x="68" y="625" class="body">Onderweg naar platteland, vertellen;</text><text x="68" y="668" class="body">ook niet geloofd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Elf · 14</text><text x="68" y="817" class="body">Aan tafel, ongeloof en hard hart</text><text x="68" y="860" class="body">aangesproken.</text><text x="46" y="953" class="note">Dit hoofdstuk noemt drie grafbezoeksters,</text><text x="46" y="989" class="note">terwijl Mattheüs er twee noemt; elke illustratie</text><text x="46" y="1025" class="note">volgt het eigen hoofdstuk.</text></svg>