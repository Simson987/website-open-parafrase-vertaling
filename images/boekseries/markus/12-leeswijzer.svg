<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Vrucht, liefde en geven</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrucht, liefde en geven</text><text x="44" y="113" class="ref">Markus 12:1–44</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wijngaard · 1–12</text><text x="68" y="241" class="body">Aanleg en pachters, dienaren en</text><text x="68" y="284" class="body">geliefde zoon verworpen, andere</text><text x="68" y="327" class="body">pachters; afgekeurde hoeksteen, leiders</text><text x="68" y="370" class="body">doorzien toepassing.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De gesprekken · 13–37</text><text x="68" y="519" class="body">Munt/keizer/God,</text><text x="68" y="562" class="body">zevenbroerscasus/opstanding,</text><text x="68" y="605" class="body">liefdesgebod en verstandig antwoord,</text><text x="68" y="648" class="body">David noemt Messias Heere.</text><rect x="42" y="706" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Waarschuwing en weduwe · 38–44</text><text x="68" y="797" class="body">Ereplaatsen/schijngebed/weduwenhuizen;</text><text x="68" y="840" class="body">offerkist, twee muntjes en alles</text><text x="68" y="883" class="body">tegenover overvloed.</text><text x="46" y="976" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1012" class="note">de plaatselijke versindeling.</text></svg>