<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1019" viewBox="0 0 840 1019" role="img" aria-labelledby="title desc"><title id="title">Petrus en de twee haankraaien</title><desc id="desc">Petrus en de twee haankraaien met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1019" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Petrus en de twee haankraaien</text><text x="44" y="113" class="ref">Markus 14:66–72</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij het vuur · 66–68</text><text x="68" y="241" class="body">Dienstmeisje: Jezus Nazareth;</text><text x="68" y="284" class="body">ontkennen, voorportaal en eerste haan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nogmaals · 69–70</text><text x="68" y="433" class="body">Dienstmeisje zegt tegen omstanders:</text><text x="68" y="476" class="body">hoort bij hen; weer ontkennen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De omstanders · 70–71</text><text x="68" y="625" class="body">Galileeër/spraak; vervloeken/zweren dat</text><text x="68" y="668" class="body">hij Hem niet kent.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tweede haan · 72</text><text x="68" y="817" class="body">Voorspelling herinnerd: driemaal voor</text><text x="68" y="860" class="body">tweemaal haan; huilen.</text><text x="46" y="953" class="note">Volgt de eigen tweemaal-haanvolgorde van Markus.</text></svg>