<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1442" viewBox="0 0 840 1442" role="img" aria-labelledby="title desc"><title id="title">Zalving, tafel en gevangenneming</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1442" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zalving, tafel en gevangenneming</text><text x="44" y="113" class="ref">Markus 14:1–72</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De voorbereiding · 1–16</text><text x="68" y="241" class="body">Pascha, complot, Bethanië/Simon/nardus</text><text x="68" y="284" class="body">en begrafenisduiding, Judasgeld; twee</text><text x="68" y="327" class="body">volgen waterkruikman naar ingerichte</text><text x="68" y="370" class="body">bovenzaal.</text><rect x="42" y="428" width="756" height="299" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De tafel en weg · 17–31</text><text x="68" y="519" class="body">Twaalf, verraadvraag,</text><text x="68" y="562" class="body">brood/beker/verbond en nieuwe wijn,</text><text x="68" y="605" class="body">lofzang/Olijfberg; uiteendrijven,</text><text x="68" y="648" class="body">Galilea en tweemaal haan/driemaal</text><text x="68" y="691" class="body">ontkennen.</text><rect x="42" y="749" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="792" class="label">Gethsemané · 32–52</text><text x="68" y="840" class="body">Drie mee, Abba/Uw wil, slapen en drie</text><text x="68" y="883" class="body">terugkeren; kus/arrest, oor/zwaard,</text><text x="68" y="926" class="body">leerlingen vluchten, jongeman laat doek</text><text x="68" y="969" class="body">achter.</text><rect x="42" y="1027" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1070" class="label">Raad en binnenplaats · 53–72</text><text x="68" y="1118" class="body">Valse verklaringen niet eens, zwijgen</text><text x="68" y="1161" class="body">en belijdenis/veroordeling; Petrus</text><text x="68" y="1204" class="body">vuur, dienstmeisje/omstanders, twee</text><text x="68" y="1247" class="body">haankraaien en huilen.</text><text x="46" y="1340" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1376" class="note">de plaatselijke versindeling.</text></svg>