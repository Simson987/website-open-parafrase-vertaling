<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Namen en bijnamen van de twaalf</title><desc id="desc">Namen en bijnamen van de twaalf met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Namen en bijnamen van de twaalf</text><text x="44" y="113" class="ref">Markus 3:13–19</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Simon</text><text x="68" y="241" class="body">Bijnaam Petrus.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zebedeüs’ zonen</text><text x="68" y="390" class="body">Jakobus en broer Johannes: Boanerges,</text><text x="68" y="433" class="body">zonen van de donder.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Verder gekozen</text><text x="68" y="582" class="body">Andreas, Filippus, Bartholomeüs,</text><text x="68" y="625" class="body">Mattheüs, Thomas.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De laatste vier</text><text x="68" y="774" class="body">Jakobus zoon Alfeüs, Thaddeüs, Simon</text><text x="68" y="817" class="body">Kananiet, Judas Iskariot.</text><text x="46" y="910" class="note">Bijnamen voegen geen extra apostelen toe; lijst</text><text x="46" y="946" class="note">volgt dit hoofdstuk.</text></svg>