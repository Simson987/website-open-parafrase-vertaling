<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Het hart, de vrouw en de dove</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het hart, de vrouw en de dove</text><text x="44" y="113" class="ref">Markus 7:1–37</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Overlevering · 1–23</text><text x="68" y="241" class="body">Handen/vaten, Jesaja lippen/hart,</text><text x="68" y="284" class="body">korban/ouders; huisuitleg: binnenuit</text><text x="68" y="327" class="body">komende kwaden maken onrein.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De vrouw · 24–30</text><text x="68" y="476" class="body">Tyrus/Sidon, Grieks/Syro-Fenicisch en</text><text x="68" y="519" class="body">dochter; brood/hondjes/kruimels, naar</text><text x="68" y="562" class="body">huis en dochter vrij.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De man · 31–37</text><text x="68" y="711" class="body">Via Dekapolis naar meer, dove moeilijk</text><text x="68" y="754" class="body">sprekende man apart; oren/tong,</text><text x="68" y="797" class="body">omhoog/zucht, Effatha, horen/spreken en</text><text x="68" y="840" class="body">verbod/bericht.</text><text x="46" y="933" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="969" class="note">de plaatselijke versindeling.</text></svg>