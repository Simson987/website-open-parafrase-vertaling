<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Reiniging en jaarfeest</title><desc id="desc">Reiniging en jaarfeest met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reiniging en jaarfeest</text><text x="44" y="113" class="ref">2 Makkabeeën 10:1–10</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herstel · 1–4</text><text x="68" y="241" class="body">Stad en tempel terug, vreemde altaren</text><text x="68" y="284" class="body">weg, nieuw altaar, vuur en herstelde</text><text x="68" y="327" class="body">dienst; gezamenlijk gebed.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De datum · 5</text><text x="68" y="476" class="body">25 Kislev: reiniging op dezelfde dag</text><text x="68" y="519" class="body">als de eerdere ontheiliging.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De viering · 6–8</text><text x="68" y="668" class="body">Acht vreugdedagen met takken en</text><text x="68" y="711" class="body">lofzang, herinnering aan schuilen bij</text><text x="68" y="754" class="body">Loofhutten; jaarlijks te vieren.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Overgang · 9–10</text><text x="68" y="903" class="body">Van het einde van Epifanes naar het</text><text x="68" y="946" class="body">bewind van zijn zoon Eupator.</text><text x="46" y="1039" class="note">De acht dagen volgen het feestkarakter dat de</text><text x="46" y="1075" class="note">tekst beschrijft; er wordt geen later oliewonder</text><text x="46" y="1111" class="note">toegevoegd.</text></svg>