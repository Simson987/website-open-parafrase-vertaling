<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Van angst naar getuigenis</title><desc id="desc">Van angst naar getuigenis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van angst naar getuigenis</text><text x="44" y="113" class="ref">2 Makkabeeën 3:24–40</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De verschijning · 24–29</text><text x="68" y="241" class="body">Paard en ruiter, twee jonge mannen en</text><text x="68" y="284" class="body">Heliodorus’ machteloosheid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De voorbede · 30–34</text><text x="68" y="433" class="body">Vreugde, smeken van vrienden, Onias’</text><text x="68" y="476" class="body">offer en de vernieuwde verschijning.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De dank · 35–36</text><text x="68" y="625" class="body">Offer, beloften, afscheid en openlijk</text><text x="68" y="668" class="body">getuigenis.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het antwoord · 37–40</text><text x="68" y="817" class="body">Heliodorus waarschuwt de koning tegen</text><text x="68" y="860" class="body">een nieuwe poging bij de schatkamer.</text><text x="46" y="953" class="note">De twee verschijningen zijn onderscheiden door</text><text x="46" y="989" class="note">de voorbede en de daaropvolgende opdracht om te</text><text x="46" y="1025" class="note">getuigen.</text></svg>