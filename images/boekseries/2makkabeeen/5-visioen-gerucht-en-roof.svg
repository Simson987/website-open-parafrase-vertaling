<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Visioen, gerucht en roof</title><desc id="desc">Visioen, gerucht en roof met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Visioen, gerucht en roof</text><text x="44" y="113" class="ref">2 Makkabeeën 5:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Visioen · 1–4</text><text x="68" y="241" class="body">Hemelse ruiters worden beschreven; de</text><text x="68" y="284" class="body">stad bidt om een goede betekenis.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vals gerucht · 5–10</text><text x="68" y="433" class="body">Jason valt aan na het bericht dat</text><text x="68" y="476" class="body">Antiochus dood is; hij krijgt het gezag</text><text x="68" y="519" class="body">niet en vlucht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Veldtocht en roof · 11–23</text><text x="68" y="668" class="body">Antiochus neemt de stad in, plundert de</text><text x="68" y="711" class="body">tempel en laat bevelhebbers achter.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Apollonius en Judas · 24–27</text><text x="68" y="860" class="body">Een schijnbaar vreedzame komst wordt</text><text x="68" y="903" class="body">geweld op sabbat; Judas trekt met negen</text><text x="68" y="946" class="body">anderen weg.</text><text x="46" y="1039" class="note">Het bericht van Antiochus’ dood is uitdrukkelijk</text><text x="46" y="1075" class="note">vals; het visioen is geen gewone veldslag.</text></svg>