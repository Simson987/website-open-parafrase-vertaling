<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Ambt en biedingen</title><desc id="desc">Ambt en biedingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ambt en biedingen</text><text x="44" y="113" class="ref">2 Makkabeeën 4:7–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jason · 7–10</text><text x="68" y="241" class="body">Broer van Onias; belooft 360 talenten,</text><text x="68" y="284" class="body">80 uit andere inkomsten en nog 150 voor</text><text x="68" y="327" class="body">nieuwe bevoegdheden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Menelaüs · 23–27</text><text x="68" y="476" class="body">Broer van Simon; biedt 300 talenten</text><text x="68" y="519" class="body">meer dan Jason en verdringt hem, maar</text><text x="68" y="562" class="body">betaalt niet.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Waarnemers · 28–29</text><text x="68" y="711" class="body">Menelaüs laat Lysimachus achter;</text><text x="68" y="754" class="body">Sostratus laat Crates achter.</text><text x="46" y="847" class="note">De bedragen zijn toezeggingen en biedingen; het</text><text x="46" y="883" class="note">schema stelt niet dat alles betaald is.</text></svg>