<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Toezegging en vrijlating</title><desc id="desc">Toezegging en vrijlating met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toezegging en vrijlating</text><text x="44" y="113" class="ref">2 Makkabeeën 12:24–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gevangene</text><text x="68" y="241" class="body">Timotheüs valt in handen van Dositheüs</text><text x="68" y="284" class="body">en Sosipater.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn argument</text><text x="68" y="433" class="body">Zegt ouders en broers in handen te</text><text x="68" y="476" class="body">hebben en dreigt met hun lot.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn toezegging</text><text x="68" y="625" class="body">Belooft hen ongedeerd uit te leveren.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De beslissing</text><text x="68" y="774" class="body">De aanvoerders laten hem vrij om hun</text><text x="68" y="817" class="body">broeders te redden.</text><text x="46" y="910" class="note">De verteller noemt zijn smeken bedrieglijk; het</text><text x="46" y="946" class="note">schema maakt de toezegging niet tot bewezen</text><text x="46" y="982" class="note">uitvoering.</text></svg>