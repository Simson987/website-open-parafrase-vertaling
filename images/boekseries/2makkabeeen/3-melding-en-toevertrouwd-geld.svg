<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Melding en toevertrouwd geld</title><desc id="desc">Melding en toevertrouwd geld met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Melding en toevertrouwd geld</text><text x="44" y="113" class="ref">2 Makkabeeën 3:4–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Simon → Apollonius → koning · 4–7</text><text x="68" y="241" class="body">Een beschuldiging over het geld leidt</text><text x="68" y="284" class="body">tot Heliodorus’ opdracht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onias · 9–12</text><text x="68" y="433" class="body">Bewaring voor weduwen en wezen en bezit</text><text x="68" y="476" class="body">van Hyrcanus, zoon van Tobia.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De bedragen · 11</text><text x="68" y="625" class="body">400 talenten zilver en 200 talenten</text><text x="68" y="668" class="body">goud.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het conflict · 13–23</text><text x="68" y="817" class="body">Koninklijke opdracht tegenover de</text><text x="68" y="860" class="body">bescherming van toevertrouwde goederen;</text><text x="68" y="903" class="body">de stad bidt.</text><text x="46" y="996" class="note">Het geld is niet zonder meer beschikbare</text><text x="46" y="1032" class="note">tempelopbrengst; de tekst maakt de bewaarfactor</text><text x="46" y="1068" class="note">expliciet.</text></svg>