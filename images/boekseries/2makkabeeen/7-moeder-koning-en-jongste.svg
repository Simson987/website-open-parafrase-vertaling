<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Moeder, koning en jongste</title><desc id="desc">Moeder, koning en jongste met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Moeder, koning en jongste</text><text x="44" y="113" class="ref">2 Makkabeeën 7:20–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De moeder · 20–23</text><text x="68" y="241" class="body">Bemoedigt in de voorouderlijke taal; de</text><text x="68" y="284" class="body">Schepper zal geest en leven teruggeven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De koning · 24–26</text><text x="68" y="433" class="body">Biedt rijkdom, vriendschap en ambten;</text><text x="68" y="476" class="body">wil dat de moeder haar zoon overhaalt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Haar antwoord · 27–29</text><text x="68" y="625" class="body">Verwijst naar zwangerschap, opvoeding,</text><text x="68" y="668" class="body">hemel en aarde en verwacht hereniging.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De afloop · 30–41</text><text x="68" y="817" class="body">De jongste blijft bij de wet; hij</text><text x="68" y="860" class="body">sterft en de moeder sterft na haar</text><text x="68" y="903" class="body">zonen.</text><text x="46" y="996" class="note">Het uitzicht op leven en hereniging is</text><text x="46" y="1032" class="note">uitgesproken hoop, geen in dit hoofdstuk</text><text x="46" y="1068" class="note">beschreven opstanding.</text></svg>