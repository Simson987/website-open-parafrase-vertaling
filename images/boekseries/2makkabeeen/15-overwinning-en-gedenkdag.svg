<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Overwinning en gedenkdag</title><desc id="desc">Overwinning en gedenkdag met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Overwinning en gedenkdag</text><text x="44" y="113" class="ref">2 Makkabeeën 15:25–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het treffen · 25–29</text><text x="68" y="241" class="body">Trompetten tegenover gebed; Nikanor is</text><text x="68" y="284" class="body">gevallen en het volk looft God.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het teken · 30–35</text><text x="68" y="433" class="body">Het verhaal beschrijft de gewelddadige</text><text x="68" y="476" class="body">vertoning van Nikanors overblijfselen</text><text x="68" y="519" class="body">bij de burcht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De jaarlijkse dag · 36–37</text><text x="68" y="668" class="body">13 Adar, de dag vóór het feest van</text><text x="68" y="711" class="body">Mordechai.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het eindpunt · 38</text><text x="68" y="860" class="body">Na deze afloop en het bezit van de stad</text><text x="68" y="903" class="body">breekt de schrijver zijn verhaal af.</text><text x="46" y="996" class="note">Het schema noemt de geweldspassage zonder</text><text x="46" y="1032" class="note">gruwelijke afbeelding en bewaart de precieze</text><text x="46" y="1068" class="note">feestdatum.</text></svg>