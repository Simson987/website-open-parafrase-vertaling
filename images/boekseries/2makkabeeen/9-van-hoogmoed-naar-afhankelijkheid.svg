<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Hoogmoed en afhankelijkheid</title><desc id="desc">Hoogmoed en afhankelijkheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoogmoed en afhankelijkheid</text><text x="44" y="113" class="ref">2 Makkabeeën 9:1–18,28–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mislukking en woede · 1–4</text><text x="68" y="241" class="body">Persepolis wijst hem terug; nieuws in</text><text x="68" y="284" class="body">Ecbatana leidt tot dreiging tegen</text><text x="68" y="327" class="body">Jeruzalem.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Ziekte en val · 5–10</text><text x="68" y="476" class="body">Pijn, val en draagbaar maken zijn</text><text x="68" y="519" class="body">machteloosheid zichtbaar.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Erkenning en beloften · 11–18</text><text x="68" y="668" class="body">Erkent sterfelijkheid, belooft herstel</text><text x="68" y="711" class="body">en schrijft; de pijn houdt aan.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het einde · 28–29</text><text x="68" y="860" class="body">Sterft in het bergland; Filippus neemt</text><text x="68" y="903" class="body">het lichaam mee en vlucht naar Egypte.</text><text x="46" y="996" class="note">De zware ziekte wordt hier zonder grafische</text><text x="46" y="1032" class="note">lichaamsdetails samengevat.</text></svg>