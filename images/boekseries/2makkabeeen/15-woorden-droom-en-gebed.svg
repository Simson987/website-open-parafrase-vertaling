<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Woorden, droom en gebed</title><desc id="desc">Woorden, droom en gebed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Woorden, droom en gebed</text><text x="44" y="113" class="ref">2 Makkabeeën 15:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nikanor · 1–6</text><text x="68" y="241" class="body">Wil op sabbat aanvallen en beroept zich</text><text x="68" y="284" class="body">op aardse macht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Judas · 7–11</text><text x="68" y="433" class="body">Vertrouwt, herinnert aan wet en</text><text x="68" y="476" class="body">profeten en vertelt zijn droom.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De droom · 12–16</text><text x="68" y="625" class="body">Onias bidt; Jeremia wordt aangeduid en</text><text x="68" y="668" class="body">geeft een gouden zwaard.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De voorbereiding · 17–24</text><text x="68" y="817" class="body">Zorg om de tempel, moedig besluit en</text><text x="68" y="860" class="body">gebed om Gods engel.</text><text x="46" y="953" class="note">Onias en Jeremia verschijnen binnen de vertelde</text><text x="46" y="989" class="note">droom; dit is geen gewone ontmoeting met</text><text x="46" y="1025" class="note">tijdgenoten.</text></svg>