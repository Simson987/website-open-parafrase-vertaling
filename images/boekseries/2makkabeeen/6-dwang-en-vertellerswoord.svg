<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Dwang en vertellerswoord</title><desc id="desc">Dwang en vertellerswoord met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dwang en vertellerswoord</text><text x="44" y="113" class="ref">2 Makkabeeën 6:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Godsdienstige dwang · 1–9</text><text x="68" y="241" class="body">Tempelnamen veranderen; sabbat en</text><text x="68" y="284" class="body">feesten verboden; offereten en optocht</text><text x="68" y="327" class="body">opgelegd.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Slachtoffers · 10–11</text><text x="68" y="476" class="body">Twee vrouwen met hun kinderen en</text><text x="68" y="519" class="body">sabbatvierders in grotten worden</text><text x="68" y="562" class="body">gedood.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Onderbreking · 12–17</text><text x="68" y="711" class="body">De schrijver spreekt de lezer aan en</text><text x="68" y="754" class="body">duidt de tegenspoed als opvoeding,</text><text x="68" y="797" class="body">zonder verlaten te zijn.</text><text x="46" y="890" class="note">De gruwelen worden in woorden verantwoord</text><text x="46" y="926" class="note">weergegeven; het vertellerswoord is een aparte</text><text x="46" y="962" class="note">tekstlaag.</text></svg>