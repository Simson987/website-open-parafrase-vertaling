<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Van verdrag naar dreiging</title><desc id="desc">Van verdrag naar dreiging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van verdrag naar dreiging</text><text x="44" y="113" class="ref">2 Makkabeeën 14:1–36</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Alcimus · 1–14</text><text x="68" y="241" class="body">Zoekt via Demetrius herstel van zijn</text><text x="68" y="284" class="body">ambt; Nikanor krijgt bevelen tegen</text><text x="68" y="327" class="body">Judas.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het verdrag · 15–25</text><text x="68" y="476" class="body">Gebed, ontmoeting, twee zetels,</text><text x="68" y="519" class="body">wederzijds vertrouwen en een rustig</text><text x="68" y="562" class="body">gezinsleven.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De beschuldiging · 26–30</text><text x="68" y="711" class="body">Alcimus klaagt opnieuw aan; Demetrius</text><text x="68" y="754" class="body">eist gevangenneming en Judas houdt zich</text><text x="68" y="797" class="body">verborgen.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De tempel · 31–36</text><text x="68" y="946" class="body">Nikanor dreigt met verwoesting; de</text><text x="68" y="989" class="body">priesters vragen om bewaring.</text><text x="46" y="1082" class="note">De tekst laat Nikanors houding veranderen; zijn</text><text x="46" y="1118" class="note">eerdere goede omgang wordt niet uitgewist.</text></svg>