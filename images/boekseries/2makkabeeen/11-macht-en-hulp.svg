<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Macht en hulp</title><desc id="desc">Macht en hulp met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Macht en hulp</text><text x="44" y="113" class="ref">2 Makkabeeën 11:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lysias · 1–5</text><text x="68" y="241" class="body">Ongeveer 80.000 voetknechten, ruiterij</text><text x="68" y="284" class="body">en 80 olifanten; plannen tegen stad,</text><text x="68" y="327" class="body">tempel en hogepriesterschap.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het antwoord · 6–10</text><text x="68" y="476" class="body">Gebed, uitval en de witte ruiter met</text><text x="68" y="519" class="body">gouden wapenrusting.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De nederlaag · 11–12</text><text x="68" y="668" class="body">11.000 voetknechten en 1.600 ruiters</text><text x="68" y="711" class="body">vallen; Lysias vlucht.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Onderhandeling · 13–15</text><text x="68" y="860" class="body">Lysias erkent de tegenstand en biedt</text><text x="68" y="903" class="body">redelijke voorwaarden; Judas stemt in.</text><text x="46" y="996" class="note">Getallen en de duiding van Gods hulp volgen de</text><text x="46" y="1032" class="note">plaatselijke tekst; zij zijn geen onafhankelijke</text><text x="46" y="1068" class="note">legerreconstructie.</text></svg>