<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Eleazars keuze</title><desc id="desc">Eleazars keuze met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eleazars keuze</text><text x="44" y="113" class="ref">2 Makkabeeën 6:18–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De dwang · 18–20</text><text x="68" y="241" class="body">De oude schriftgeleerde weigert</text><text x="68" y="284" class="body">verboden vlees.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het voorstel · 21–22</text><text x="68" y="433" class="body">Bekenden stellen toegestaan vlees voor</text><text x="68" y="476" class="body">waarmee hij zou doen alsof.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De reden · 23–28</text><text x="68" y="625" class="body">Hij is negentig en wil jonge mensen</text><text x="68" y="668" class="body">niet misleiden met een schijnbare</text><text x="68" y="711" class="body">afval.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het einde · 29–31</text><text x="68" y="860" class="body">Hij sterft onder de slagen; de</text><text x="68" y="903" class="body">schrijver noemt hem een voorbeeld van</text><text x="68" y="946" class="body">moed.</text><text x="46" y="1039" class="note">Een misleidend compromis en een openlijke</text><text x="46" y="1075" class="note">weigering zijn verschillende momenten in het</text><text x="46" y="1111" class="note">gesprek.</text></svg>