<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Razis en de gemeenschap</title><desc id="desc">Razis en de gemeenschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Razis en de gemeenschap</text><text x="44" y="113" class="ref">2 Makkabeeën 14:37–46</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zijn plaats · 37–38</text><text x="68" y="241" class="body">Een gerespecteerde oudste, om zijn</text><text x="68" y="284" class="body">goedheid vader van de Joden genoemd.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nikanors doel · 39–40</text><text x="68" y="433" class="body">Stuurt meer dan 500 soldaten; wil de</text><text x="68" y="476" class="body">gemeenschap door zijn gevangenneming</text><text x="68" y="519" class="body">treffen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De crisis · 41–46</text><text x="68" y="668" class="body">De insluiting mondt uit in Razis’</text><text x="68" y="711" class="body">gewelddadige dood; hij roept de Heere</text><text x="68" y="754" class="body">van leven en geest aan.</text><text x="46" y="847" class="note">De passage beschrijft een tragische crisis. Het</text><text x="46" y="883" class="note">schema bevat geen methodebeschrijving of</text><text x="46" y="919" class="note">uitbeelding van zelfverwonding.</text></svg>