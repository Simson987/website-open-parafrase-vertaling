<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">De woorden van de broers</title><desc id="desc">De woorden van de broers met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De woorden van de broers</text><text x="44" y="113" class="ref">2 Makkabeeën 7:1–19,30–40</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste · 2–6</text><text x="68" y="241" class="body">Liever sterven dan de voorouderlijke</text><text x="68" y="284" class="body">wetten overtreden; de familie bemoedigt</text><text x="68" y="327" class="body">elkaar.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De tweede · 7–9</text><text x="68" y="476" class="body">Verwacht de eeuwige opstanding tot</text><text x="68" y="519" class="body">leven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De derde en vierde · 10–14</text><text x="68" y="668" class="body">Hopen terug te ontvangen wat God gaf en</text><text x="68" y="711" class="body">door Hem opgewekt te worden.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De vijfde en zesde · 15–19</text><text x="68" y="860" class="body">Waarschuwen de koning; het volk is niet</text><text x="68" y="903" class="body">verlaten en de koning is niet</text><text x="68" y="946" class="body">onschuldig.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De jongste · 30–40</text><text x="68" y="1095" class="body">Gehoorzaamt de wet, bidt om ontferming</text><text x="68" y="1138" class="body">en verzoening en blijft vertrouwen.</text><text x="46" y="1231" class="note">De tekst noemt geen namen van de zeven broers;</text><text x="46" y="1267" class="note">het schema verzint die niet en toont geen</text><text x="46" y="1303" class="note">foltering.</text></svg>