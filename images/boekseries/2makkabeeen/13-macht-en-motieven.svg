<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Macht en motieven</title><desc id="desc">Macht en motieven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Macht en motieven</text><text x="44" y="113" class="ref">2 Makkabeeën 13:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De genoemde macht · 1–2</text><text x="68" y="241" class="body">De tekst noemt bij elk 110.000</text><text x="68" y="284" class="body">voetknechten, 5.300 ruiters, 22</text><text x="68" y="327" class="body">olifanten en 300 zeiswagens.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Menelaüs · 3–8</text><text x="68" y="476" class="body">Zoekt het hoogste ambt door vleierij;</text><text x="68" y="519" class="body">Lysias beschuldigt hem.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Judas en het volk · 10–14</text><text x="68" y="668" class="body">Bidden om behoud van wet, land en</text><text x="68" y="711" class="body">tempel; overleggen en trekken de koning</text><text x="68" y="754" class="body">tegemoet.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het wachtwoord · 15–17</text><text x="68" y="903" class="body">Van God is de overwinning; nachtactie</text><text x="68" y="946" class="body">en vertrek bij het aanbreken van de</text><text x="68" y="989" class="body">dag.</text><text x="46" y="1082" class="note">De formulering bij elk volgt de lokale</text><text x="46" y="1118" class="note">vertaling; het schema maakt er geen berekend</text><text x="46" y="1154" class="note">totaal van.</text></svg>