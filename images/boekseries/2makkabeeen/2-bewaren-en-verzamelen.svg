<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Bewaren en verzamelen</title><desc id="desc">Bewaren en verzamelen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bewaren en verzamelen</text><text x="44" y="113" class="ref">2 Makkabeeën 2:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jeremia · 1–8</text><text x="68" y="241" class="body">Wet meegeven, tent/ark/reukofferaltaar</text><text x="68" y="284" class="body">bewaren en wachten op Gods verzoening.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mozes en Salomo · 9–12</text><text x="68" y="433" class="body">Inwijdingsgebed, vuur en acht</text><text x="68" y="476" class="body">feestdagen worden herinnerd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nehemia · 13</text><text x="68" y="625" class="body">Geschriften van koningen, profeten en</text><text x="68" y="668" class="body">David en brieven bijeenbrengen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Judas · 14–19</text><text x="68" y="817" class="body">Door oorlog bedreigde geschriften</text><text x="68" y="860" class="body">bijeenbrengen en uitnodigen tot</text><text x="68" y="903" class="body">reinigingsfeest.</text><text x="46" y="996" class="note">De grot blijft volgens het verhaal onbekend; het</text><text x="46" y="1032" class="note">schema lokaliseert haar niet op een moderne</text><text x="46" y="1068" class="note">kaart.</text></svg>