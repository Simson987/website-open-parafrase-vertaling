<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Vijf boeken, één samenvatting</title><desc id="desc">Vijf boeken, één samenvatting met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijf boeken, één samenvatting</text><text x="44" y="113" class="ref">2 Makkabeeën 2:20–33</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het onderwerp · 20–23</text><text x="68" y="241" class="body">Judas, zijn broers, oorlogen,</text><text x="68" y="284" class="body">verschijningen, tempel en herstelde</text><text x="68" y="327" class="body">wetten.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De bron · 24</text><text x="68" y="476" class="body">Jason van Cyrene beschreef het in vijf</text><text x="68" y="519" class="body">boeken.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De bewerking · 24–29</text><text x="68" y="668" class="body">De schrijver vat samen voor</text><text x="68" y="711" class="body">leesplezier, geheugensteun en nut.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het onderscheid · 30–33</text><text x="68" y="860" class="body">Uitvoerige geschiedschrijving tegenover</text><text x="68" y="903" class="body">korte weergave; bouwer en versierder</text><text x="68" y="946" class="body">als vergelijking.</text><text x="46" y="1039" class="note">De samenvatter noemt zijn werk een andere taak</text><text x="46" y="1075" class="note">dan de brede behandeling door de oorspronkelijke</text><text x="46" y="1111" class="note">schrijver.</text></svg>