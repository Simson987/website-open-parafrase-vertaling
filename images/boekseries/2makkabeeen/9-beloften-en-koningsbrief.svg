<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Beloften en koningsbrief</title><desc id="desc">Beloften en koningsbrief met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beloften en koningsbrief</text><text x="44" y="113" class="ref">2 Makkabeeën 9:14–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beloften · 14–17</text><text x="68" y="241" class="body">Vrijheid voor de stad, burgerrechten,</text><text x="68" y="284" class="body">tempelherstel en eigen bekering worden</text><text x="68" y="327" class="body">toegezegd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De aanhef · 19–22</text><text x="68" y="476" class="body">De brief wenst welzijn en zegt nog op</text><text x="68" y="519" class="body">herstel van de ziekte te hopen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Opvolging · 23–25</text><text x="68" y="668" class="body">Antiochus stelt zijn zoon Antiochus als</text><text x="68" y="711" class="body">koning voor.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het verzoek · 26–27</text><text x="68" y="860" class="body">Vraagt blijvende welwillendheid</text><text x="68" y="903" class="body">tegenover hem en zijn zoon.</text><text x="46" y="996" class="note">De verteller geeft de nood weer; de koninklijke</text><text x="46" y="1032" class="note">brief spreekt in een andere stem. Beloften zijn</text><text x="46" y="1068" class="note">geen uitgevoerd herstel.</text></svg>