<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Gedachten bij de collecte</title><desc id="desc">Gedachten bij de collecte met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gedachten bij de collecte</text><text x="44" y="113" class="ref">2 Makkabeeën 12:39–46</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De ontdekking · 39–40</text><text x="68" y="241" class="body">Bij de gesneuvelden worden verboden aan</text><text x="68" y="284" class="body">afgoden gewijde voorwerpen gevonden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het antwoord · 41–42</text><text x="68" y="433" class="body">Lof, gebed om uitwissing van zonde en</text><text x="68" y="476" class="body">oproep zonder zonde te blijven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De collecte · 43</text><text x="68" y="625" class="body">2.000 drachmen zilver naar Jeruzalem</text><text x="68" y="668" class="body">voor een zondoffer.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De duiding · 44–46</text><text x="68" y="817" class="body">De schrijver verbindt het gebed met</text><text x="68" y="860" class="body">verwachting van opstanding en</text><text x="68" y="903" class="body">verzoening.</text><text x="46" y="996" class="note">Het schema geeft de redenering van deze passage</text><text x="46" y="1032" class="note">weer en onderscheidt handeling en uitleg.</text></svg>