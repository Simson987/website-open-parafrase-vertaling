<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Roof en onrecht</title><desc id="desc">Roof en onrecht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Roof en onrecht</text><text x="44" y="113" class="ref">2 Makkabeeën 4:30–50</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onias · 32–38</text><text x="68" y="241" class="body">Wijst tempelroof terecht, wordt uit de</text><text x="68" y="284" class="body">vrijplaats gelokt en gedood; de koning</text><text x="68" y="327" class="body">treurt en straft Andronicus.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Lysimachus · 39–42</text><text x="68" y="476" class="body">Nieuwe roof leidt tot opstand en zijn</text><text x="68" y="519" class="body">dood bij de schatkamer.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Drie gezanten · 43–49</text><text x="68" y="668" class="body">Klagen Menelaüs aan; na omkoping volgt</text><text x="68" y="711" class="body">hun onrechtvaardige veroordeling en</text><text x="68" y="754" class="body">eervolle begrafenis.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Menelaüs · 50</text><text x="68" y="903" class="body">Behoudt door de hebzucht van</text><text x="68" y="946" class="body">machthebbers zijn ambt.</text><text x="46" y="1039" class="note">De rechtszaak eindigt volgens het verhaal</text><text x="46" y="1075" class="note">onrechtvaardig; de vrijspraak bewijst geen</text><text x="46" y="1111" class="note">onschuld.</text></svg>