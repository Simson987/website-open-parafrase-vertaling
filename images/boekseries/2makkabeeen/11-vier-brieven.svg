<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De vier brieven</title><desc id="desc">De vier brieven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vier brieven</text><text x="44" y="113" class="ref">2 Makkabeeën 11:16–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lysias → Joodse volk · 16–21</text><text x="68" y="241" class="body">Johannes en Absalom brengen antwoorden;</text><text x="68" y="284" class="body">redelijke verzoeken zijn ingewilligd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Antiochus → Lysias · 22–26</text><text x="68" y="433" class="body">Tempel teruggeven en voorouderlijke</text><text x="68" y="476" class="body">gewoonten toestaan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Antiochus → raad en volk · 27–33</text><text x="68" y="625" class="body">Eigen voedsel en wetten, zekerheid en</text><text x="68" y="668" class="body">geruststelling via Menelaüs.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Romeinse gezanten → volk · 34–38</text><text x="68" y="817" class="body">Quintus Memmius en Titus Manlius</text><text x="68" y="860" class="body">bevestigen en vragen snel gezanten te</text><text x="68" y="903" class="body">sturen.</text><text x="46" y="996" class="note">Het zijn verschillende afzenders en ontvangers;</text><text x="46" y="1032" class="note">de in de brieven genoemde data worden niet tot</text><text x="46" y="1068" class="note">één brief samengevoegd.</text></svg>