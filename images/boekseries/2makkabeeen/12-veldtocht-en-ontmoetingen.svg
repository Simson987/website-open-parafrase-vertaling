<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Veldtocht en ontmoetingen</title><desc id="desc">Veldtocht en ontmoetingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Veldtocht en ontmoetingen</text><text x="44" y="113" class="ref">2 Makkabeeën 12:1–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin · 1–9</text><text x="68" y="241" class="body">Landbouw na verdragen, nieuwe</text><text x="68" y="284" class="body">tegenwerking en geweld bij Joppe en</text><text x="68" y="327" class="body">Jamnia.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Arabieren en Caspin · 10–16</text><text x="68" y="476" class="body">Strijd, vredesverbond en vervolgens een</text><text x="68" y="519" class="body">andere vestingaanval.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Timotheüs en steden · 17–31</text><text x="68" y="668" class="body">Charax, Karnion, Efron en vriendelijke</text><text x="68" y="711" class="body">ontvangst in Scythopolis; terugkeer</text><text x="68" y="754" class="body">voor Wekenfeest.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Na Pinksteren · 32–38</text><text x="68" y="903" class="body">Strijd tegen Gorgias; daarna rust op</text><text x="68" y="946" class="body">sabbat in Odollam.</text><text x="46" y="1039" class="note">Dit is de volgorde van het hoofdstuk, geen</text><text x="46" y="1075" class="note">moderne kaart of berekening van reisafstanden.</text></svg>