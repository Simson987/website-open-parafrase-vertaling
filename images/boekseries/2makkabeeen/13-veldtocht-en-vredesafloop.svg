<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Veldtocht en vredesafloop</title><desc id="desc">Veldtocht en vredesafloop met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Veldtocht en vredesafloop</text><text x="44" y="113" class="ref">2 Makkabeeën 13:1–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De komst · 1–9</text><text x="68" y="241" class="body">Eupator en Lysias rukken op; Menelaüs</text><text x="68" y="284" class="body">wordt beschuldigd en sterft in Berea.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het antwoord · 10–17</text><text x="68" y="433" class="body">Drie dagen gebed en vasten, raad met</text><text x="68" y="476" class="body">oudsten en nachtelijke aanval bij</text><text x="68" y="519" class="body">Modin.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bet-Sur · 18–22</text><text x="68" y="668" class="body">Beleg, bevoorrading, verraad door</text><text x="68" y="711" class="body">Rodocus en onderhandeling.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De afloop · 23–26</text><text x="68" y="860" class="body">Nieuws over Filippus, verzoening,</text><text x="68" y="903" class="body">tempelverering en uitleg door Lysias in</text><text x="68" y="946" class="body">Ptolemaïs.</text><text x="46" y="1039" class="note">De chronologische onderdelen zijn onderscheiden;</text><text x="46" y="1075" class="note">de zware dood van Menelaüs wordt zonder</text><text x="46" y="1111" class="note">grafische uitwerking genoemd.</text></svg>