<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Twee brieven en het feest</title><desc id="desc">Twee brieven en het feest met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee brieven en het feest</text><text x="44" y="113" class="ref">2 Makkabeeën 1:1–36</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste brief · 1–9</text><text x="68" y="241" class="body">Groet aan de Joden in Egypte, gebed,</text><text x="68" y="284" class="body">herinnerde nood en uitnodiging tot het</text><text x="68" y="327" class="body">feest.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De tweede aanhef · 10–18</text><text x="68" y="476" class="body">Judas en de raad groeten Aristobulus en</text><text x="68" y="519" class="body">de andere Joden; redding en reiniging</text><text x="68" y="562" class="body">worden herinnerd.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het oude vuur · 19–22</text><text x="68" y="711" class="body">Vuur verborgen, later dik water</text><text x="68" y="754" class="body">gevonden en opnieuw vuur bij het offer.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Gebed en herinnering · 23–36</text><text x="68" y="903" class="body">Jonathan begint de voorbede; de plaats</text><text x="68" y="946" class="body">wordt onderzocht en Neftar genoemd.</text><text x="46" y="1039" class="note">Het hoofdstuk bevat brieven met terugblikken; de</text><text x="46" y="1075" class="note">beschreven tijden zijn niet één doorlopende dag.</text></svg>