<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Overwinning, sabbat en zorg</title><desc id="desc">Overwinning, sabbat en zorg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Overwinning, sabbat en zorg</text><text x="44" y="113" class="ref">2 Makkabeeën 8:24–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het treffen · 24–25</text><text x="68" y="241" class="body">Nikanors troepen vluchten; koopgeld</text><text x="68" y="284" class="body">valt in handen van Judas’ mannen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De rustdag · 26–29</text><text x="68" y="433" class="body">Achtervolging stopt voor sabbat; daarna</text><text x="68" y="476" class="body">buitdeling en algemene biddag.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verdere strijd · 30–33</text><text x="68" y="625" class="body">Nieuwe overwinningen, zorgdelen en</text><text x="68" y="668" class="body">opslag van wapens; Callisthenes wordt</text><text x="68" y="711" class="body">gedood.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Nikanors omkeer · 34–36</text><text x="68" y="860" class="body">Vlucht zonder prachtkleding en getuigt</text><text x="68" y="903" class="body">van Gods bescherming.</text><text x="46" y="996" class="note">De tekst onderscheidt de sabbatviering van de</text><text x="46" y="1032" class="note">verdeling na de sabbat.</text></svg>