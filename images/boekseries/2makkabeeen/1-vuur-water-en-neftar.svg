<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Vuur, water en Neftar</title><desc id="desc">Vuur, water en Neftar met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vuur, water en Neftar</text><text x="44" y="113" class="ref">2 Makkabeeën 1:19–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vóór de wegvoering · 19</text><text x="68" y="241" class="body">Priesters verbergen altaarvuur in een</text><text x="68" y="284" class="body">droge putholte.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vele jaren later · 20–22</text><text x="68" y="433" class="body">Nehemia laat dik water halen en</text><text x="68" y="476" class="body">sprenkelen; zonlicht en vuur volgen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het resterende water · 31–32</text><text x="68" y="625" class="body">Op grote stenen uitgegoten; opnieuw</text><text x="68" y="668" class="body">wordt een vlam beschreven.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De plaats en naam · 33–36</text><text x="68" y="817" class="body">De koning onderzoekt en omheint; Neftar</text><text x="68" y="860" class="body">wordt als reiniging uitgelegd.</text><text x="46" y="953" class="note">De naam en de beschreven verschijnselen volgen</text><text x="46" y="989" class="note">de tekst; dit is geen chemische handleiding.</text></svg>