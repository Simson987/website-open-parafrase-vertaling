<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De gaven voor het Pascha</title><desc id="desc">De gaven voor het Pascha met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gaven voor het Pascha</text><text x="44" y="113" class="ref">3 Ezra 1:7–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Josia · vers 7</text><text x="68" y="241" class="body">30.000 lammeren en bokken; 3000</text><text x="68" y="284" class="body">kalveren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tempelleiders · vers 9</text><text x="68" y="433" class="body">2600 schapen en 300 kalveren voor de</text><text x="68" y="476" class="body">priesters.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gaven aan de Levieten · vers 9</text><text x="68" y="625" class="body">5000 schapen en 700 kalveren.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Herkomst en doel</text><text x="68" y="774" class="body">Gaven van koning en leiders voor de</text><text x="68" y="817" class="body">priesters, Levieten en het aanwezige</text><text x="68" y="860" class="body">volk.</text><text x="46" y="953" class="note">Aantallen en verschillende ontvangers volgen</text><text x="46" y="989" class="note">deze hoofdstukweergave.</text></svg>