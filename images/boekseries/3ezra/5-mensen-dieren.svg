<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Mensen en lastdieren</title><desc id="desc">Mensen en lastdieren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mensen en lastdieren</text><text x="44" y="113" class="ref">3 Ezra 5:41–45</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De genoemde hoofdgroep</text><text x="68" y="241" class="body">42.360 Israëlieten van twaalf jaar en</text><text x="68" y="284" class="body">ouder, zonder slaven en slavinnen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Andere genoemde groepen</text><text x="68" y="433" class="body">7337 knechten en dienstmeisjes; 245</text><text x="68" y="476" class="body">zangers en zangeressen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dieren · vers 43</text><text x="68" y="625" class="body">435 kamelen, 7036 paarden, 245</text><text x="68" y="668" class="body">muildieren en 5525 ezels.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bouwkas · vers 45</text><text x="68" y="817" class="body">1000 talenten goud, 5000 talenten</text><text x="68" y="860" class="body">zilver en 100 priesterkleden.</text><text x="46" y="953" class="note">Eigen aantallen van deze hoofdstuktekst; niet</text><text x="46" y="989" class="note">vervangen door aantallen uit een parallel</text><text x="46" y="1025" class="note">verhaal.</text></svg>