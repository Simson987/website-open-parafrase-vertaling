<svg xmlns="http://www.w3.org/2000/svg" width="840" height="642" viewBox="0 0 840 642"><title>Koningen na Josia</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="642" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Koningen na Josia</text><text x="42" y="105" font-size="25">3 Ezra 1:34–48</text><rect x="150" y="155" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="191" text-anchor="middle" font-size="31">Joachaz · 3 maanden</text><path d="M420 209 V229" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="235" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="271" text-anchor="middle" font-size="31">Jojakim · door farao aangesteld</text><path d="M420 289 V309" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="315" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="351" text-anchor="middle" font-size="31">Jojachin · 3 maanden en 10 dagen</text><path d="M420 369 V389" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="395" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="431" text-anchor="middle" font-size="31">Zedekia · 11 jaar</text><text x="42" y="495" font-size="26">Vertelde regeringsvolgorde, geen volledige</text><text x="42" y="529" font-size="26">stamboom. Leeftijden bij aantreden: 23, 25, 18</text><text x="42" y="563" font-size="26">en 21 jaar.</text></g></svg>