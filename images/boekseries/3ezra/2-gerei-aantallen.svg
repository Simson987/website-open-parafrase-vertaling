<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Aantallen van het gerei</title><desc id="desc">Aantallen van het gerei met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aantallen van het gerei</text><text x="44" y="113" class="ref">3 Ezra 2:13–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schalen voor drankoffers</text><text x="68" y="241" class="body">1000 gouden en 1000 zilveren.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Wierookpannen en gouden bekers</text><text x="68" y="390" class="body">29 zilveren wierookpannen; 30 gouden</text><text x="68" y="433" class="body">bekers.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Zilveren bekers en overige</text><text x="68" y="582" class="body">2430 zilveren bekers; 1000 andere</text><text x="68" y="625" class="body">voorwerpen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Twee verschillende uitkomsten</text><text x="68" y="774" class="body">Vers 14 noemt 5469; de aantallen in</text><text x="68" y="817" class="body">vers 13 tellen op tot 5489.</text><text x="46" y="910" class="note">Het telverschil van 20 in de plaatselijke tekst</text><text x="46" y="946" class="note">is zichtbaar gelaten; er is geen aantal</text><text x="46" y="982" class="note">stilzwijgend aangepast.</text></svg>