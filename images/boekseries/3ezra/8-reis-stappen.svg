<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Van Ahava naar Jeruzalem</title><desc id="desc">Van Ahava naar Jeruzalem met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Ahava naar Jeruzalem</text><text x="44" y="113" class="ref">3 Ezra 8:43–68</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie dagen bij Ahava</text><text x="68" y="241" class="body">Inspectie van de reizigers; extra</text><text x="68" y="284" class="body">dienaren worden gevraagd en komen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vasten en bewaring</text><text x="68" y="433" class="body">Geen koninklijk leger gevraagd; gebed</text><text x="68" y="476" class="body">om bescherming en het gerei afgewogen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vertrek · vers 62</text><text x="68" y="625" class="body">Twaalfde dag van de eerste maand bij de</text><text x="68" y="668" class="body">rivier Ahava.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Aankomst en overdracht</text><text x="68" y="817" class="body">Drie dagen verblijf, op de vierde dag</text><text x="68" y="860" class="body">wegen en afleveren; daarna offers en</text><text x="68" y="903" class="body">bevelen.</text><text x="46" y="996" class="note">De stappen volgen deze passage. Er wordt geen</text><text x="46" y="1032" class="note">extra reisroute of landkaart verondersteld.</text></svg>