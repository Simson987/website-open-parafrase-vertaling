<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Wat Darius laat schrijven</title><desc id="desc">Wat Darius laat schrijven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Darius laat schrijven</text><text x="44" y="113" class="ref">3 Ezra 4:47–57</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geleide en cederhout</text><text x="68" y="241" class="body">Bescherming voor de reizigers; hout van</text><text x="68" y="284" class="body">de Libanon voor de bouw.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vrijheid en vrijstelling</text><text x="68" y="433" class="body">Vrijheid voor terugkerenden en</text><text x="68" y="476" class="body">nakomelingen; het bewoonde land</text><text x="68" y="519" class="body">belastingvrij.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Jaarlijkse bijdragen</text><text x="68" y="668" class="body">20 talenten voor de tempelbouw;</text><text x="68" y="711" class="body">daarnaast 10 talenten voor de offers.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Onderhoud en teruggave</text><text x="68" y="860" class="body">Priesters, Levieten en bewakers krijgen</text><text x="68" y="903" class="body">onderhoud; het gerei wordt</text><text x="68" y="946" class="body">teruggestuurd.</text><text x="46" y="1039" class="note">De twee jaarlijkse bedragen hebben een</text><text x="46" y="1075" class="note">verschillend doel en blijven apart.</text></svg>