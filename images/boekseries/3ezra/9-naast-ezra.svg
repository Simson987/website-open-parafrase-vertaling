<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Naast Ezra op de verhoging</title><desc id="desc">Naast Ezra op de verhoging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Naast Ezra op de verhoging</text><text x="44" y="113" class="ref">3 Ezra 9:42–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rechts genoemd · vers 43</text><text x="68" y="241" class="body">Matthatias, Sammus, Ananias, Azarias,</text><text x="68" y="284" class="body">Urias, Ezekias en Baälsamus.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Links genoemd · vers 44</text><text x="68" y="433" class="body">Chaldeüs, Misaël, Melchias,</text><text x="68" y="476" class="body">Haothasufus, Nabarias en Zacharias.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ezra · vers 42</text><text x="68" y="625" class="body">Op de speciaal gemaakte verhoogde</text><text x="68" y="668" class="body">houten katheder.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De plaats · vers 41</text><text x="68" y="817" class="body">Het grote plein voor de heilige poort.</text><text x="46" y="910" class="note">Rechts en links zijn de woorden van de tekst; de</text><text x="46" y="946" class="note">namen van de helpers worden niet met de latere</text><text x="46" y="982" class="note">leraren vermengd.</text></svg>