<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Van Pascha tot ballingschap</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Pascha tot ballingschap</text><text x="44" y="113" class="ref">3 Ezra 1:1–58</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–24 · Het Pascha van Josia</text><text x="68" y="241" class="body">Priesters en Levieten dienen, de koning</text><text x="68" y="284" class="body">geeft offers; het feest wordt zeven</text><text x="68" y="327" class="body">dagen gevierd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">25–33 · De dood van Josia</text><text x="68" y="476" class="body">Hij trekt farao tegemoet, sterft na de</text><text x="68" y="519" class="body">strijd en wordt betreurd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">34–48 · De volgende koningen</text><text x="68" y="668" class="body">Joachaz, Jojakim, Jojachin en Zedekia;</text><text x="68" y="711" class="body">Egypte en Babel grijpen in.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">49–58 · Ondergang en rust</text><text x="68" y="860" class="body">Boden worden bespot; tempel en stad</text><text x="68" y="903" class="body">verwoest, overlevenden weggevoerd;</text><text x="68" y="946" class="body">zeventig jaar.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>