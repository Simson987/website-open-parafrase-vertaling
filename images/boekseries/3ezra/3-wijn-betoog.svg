<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Het betoog over de wijn</title><desc id="desc">Het betoog over de wijn met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het betoog over de wijn</text><text x="44" y="113" class="ref">3 Ezra 3:18–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Iedereen gelijk · vers 19–20</text><text x="68" y="241" class="body">Volgens de spreker raakt wijn koning en</text><text x="68" y="284" class="body">wees, slaaf en vrije, arm en rijk.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verdriet vergeten · vers 21–22</text><text x="68" y="433" class="body">Hij beschrijft vreugde en de waan rijk</text><text x="68" y="476" class="body">te zijn.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vriendschap verstoord · vers 23</text><text x="68" y="625" class="body">Vriendelijkheid verdwijnt en mensen</text><text x="68" y="668" class="body">trekken het zwaard.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Geheugen weg · vers 24–25</text><text x="68" y="817" class="body">Na het drinken herinneren zij zich hun</text><text x="68" y="860" class="body">daden niet meer.</text><text x="46" y="953" class="note">Argumenten van de eerste jonge man in de</text><text x="46" y="989" class="note">wedstrijd; geen aanbeveling om wijn te drinken.</text></svg>