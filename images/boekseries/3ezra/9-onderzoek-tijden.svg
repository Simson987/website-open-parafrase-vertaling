<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Tijden van het onderzoek</title><desc id="desc">Tijden van het onderzoek met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tijden van het onderzoek</text><text x="44" y="113" class="ref">3 Ezra 9:3–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oproep</text><text x="68" y="241" class="body">Binnen twee of drie dagen naar</text><text x="68" y="284" class="body">Jeruzalem komen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bijeenkomst · vers 5</text><text x="68" y="433" class="body">Twintigste dag van de negende maand, in</text><text x="68" y="476" class="body">de winterkou.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Begin · vers 16</text><text x="68" y="625" class="body">Nieuwe maan van de tiende maand: de</text><text x="68" y="668" class="body">aangewezen leiders onderzoeken de</text><text x="68" y="711" class="body">zaken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Afgerond · vers 17</text><text x="68" y="860" class="body">Nieuwe maan van de eerste maand: het</text><text x="68" y="903" class="body">onderzoek is afgerond.</text><text x="46" y="996" class="note">Dit betreft de winterbijeenkomst. Het lezen van</text><text x="46" y="1032" class="note">de wet wordt daarna bij de zevende maand</text><text x="46" y="1068" class="note">verteld.</text></svg>