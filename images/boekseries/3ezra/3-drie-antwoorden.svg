<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Drie antwoorden op één vraag</title><desc id="desc">Drie antwoorden op één vraag met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie antwoorden op één vraag</text><text x="44" y="113" class="ref">3 Ezra 3:4–12</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste · vers 10</text><text x="68" y="241" class="body">De wijn is de sterkste.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De tweede · vers 11</text><text x="68" y="390" class="body">De koning is de sterkste.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">De derde · vers 12</text><text x="68" y="539" class="body">De vrouwen zijn de sterkste, maar boven</text><text x="68" y="582" class="body">alles overwint de waarheid.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De inzet · vers 5–7</text><text x="68" y="731" class="body">De wijste spreker krijgt eer en</text><text x="68" y="774" class="body">geschenken van Darius.</text><text x="46" y="867" class="note">Dit hoofdstuk geeft alleen de eerste verdediging</text><text x="46" y="903" class="note">volledig; de andere toespraken volgen later.</text></svg>