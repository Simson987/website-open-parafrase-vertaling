<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Waarom de waarheid overwint</title><desc id="desc">Waarom de waarheid overwint met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom de waarheid overwint</text><text x="44" y="113" class="ref">3 Ezra 4:33–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schepping · vers 34–36</text><text x="68" y="241" class="body">Aarde, hemel en zon worden groot</text><text x="68" y="284" class="body">genoemd, maar de waarheid is sterker.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het contrast · vers 37</text><text x="68" y="433" class="body">In wijn, koning, vrouwen en</text><text x="68" y="476" class="body">mensenkinderen is onrecht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Blijvend · vers 38</text><text x="68" y="625" class="body">De waarheid blijft, leeft en heerst</text><text x="68" y="668" class="body">voor altijd.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Rechtvaardig · vers 39–41</text><text x="68" y="817" class="body">Geen aanzien des persoons of onrecht in</text><text x="68" y="860" class="body">haar oordeel; God van de waarheid wordt</text><text x="68" y="903" class="body">geprezen.</text><text x="46" y="996" class="note">Dit ordent Zerubabels eigen betoog, inclusief</text><text x="46" y="1032" class="note">zijn kritiek op alle genoemde menselijke</text><text x="46" y="1068" class="note">groepen.</text></svg>