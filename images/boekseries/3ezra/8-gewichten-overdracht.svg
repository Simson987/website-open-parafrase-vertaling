<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Gewogen en overgedragen</title><desc id="desc">Gewogen en overgedragen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gewogen en overgedragen</text><text x="44" y="113" class="ref">3 Ezra 8:55–65</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gewogen · vers 57</text><text x="68" y="241" class="body">650 talenten zilver, 100 talenten aan</text><text x="68" y="284" class="body">gouden voorwerpen en 100 talenten goud.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gerei · vers 58</text><text x="68" y="433" class="body">20 gouden schalen en 12 voorwerpen van</text><text x="68" y="476" class="body">fijn brons.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bewaren · vers 59–61</text><text x="68" y="625" class="body">Heilige mensen bewaken het heilige</text><text x="68" y="668" class="body">gerei tot het in de tempel wordt</text><text x="68" y="711" class="body">afgeleverd.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Verantwoorden · vers 63–65</text><text x="68" y="860" class="body">Op de vierde dag in Jeruzalem naar</text><text x="68" y="903" class="body">aantal en gewicht overgedragen en</text><text x="68" y="946" class="body">opgeschreven.</text><text x="46" y="1039" class="note">De materiaalbenamingen zijn precies die van de</text><text x="46" y="1075" class="note">plaatselijke tekst; er wordt niets uit een</text><text x="46" y="1111" class="note">parallelboek vervangen.</text></svg>