<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wat Artaxerxes toestaat</title><desc id="desc">Wat Artaxerxes toestaat met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Artaxerxes toestaat</text><text x="44" y="113" class="ref">3 Ezra 8:11–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vrijwillige reis en gaven</text><text x="68" y="241" class="body">Wie wil mag meetrekken; goud, zilver en</text><text x="68" y="284" class="body">gerei voor Jeruzalem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bijdragen · vers 22</text><text x="68" y="433" class="body">Tot 100 talenten zilver, 100 maten</text><text x="68" y="476" class="body">graan en 100 vaten wijn.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vrijstelling · vers 24–25</text><text x="68" y="625" class="body">Geen belasting of andere lasten voor de</text><text x="68" y="668" class="body">genoemde tempeldienaren en</text><text x="68" y="711" class="body">schriftgeleerden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Recht en onderwijs · vers 26</text><text x="68" y="860" class="body">Ezra stelt rechters aan en leert de wet</text><text x="68" y="903" class="body">aan wie haar niet kent.</text><text x="46" y="996" class="note">De bevoegdheden zijn onderdeel van dit</text><text x="46" y="1032" class="note">koninklijk bevel in het verhaal.</text></svg>