<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wat het bouwbevel bepaalt</title><desc id="desc">Wat het bouwbevel bepaalt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat het bouwbevel bepaalt</text><text x="44" y="113" class="ref">3 Ezra 6:24–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Maten · vers 25</text><text x="68" y="241" class="body">Hoogte 60 el en breedte 60 el. De</text><text x="68" y="284" class="body">lengte wordt hier niet genoemd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Constructie · vers 25</text><text x="68" y="433" class="body">Drie lagen gehouwen stenen en één laag</text><text x="68" y="476" class="body">nieuw hout.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Betaling en teruggave</text><text x="68" y="625" class="body">Kosten uit het huis van Cyrus; het</text><text x="68" y="668" class="body">heilige gouden en zilveren gerei terug.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Darius’ uitvoering · vers 29–31</text><text x="68" y="817" class="body">Bijdragen uit regionale inkomsten voor</text><text x="68" y="860" class="body">offers en gebed voor koning en</text><text x="68" y="903" class="body">kinderen.</text><text x="46" y="996" class="note">De twee maten zijn tekstgegevens; dit is geen</text><text x="46" y="1032" class="note">volledige plattegrond of reconstructie.</text></svg>