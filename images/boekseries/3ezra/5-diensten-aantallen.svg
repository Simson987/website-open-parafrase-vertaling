<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">Groepen rond het heiligdom</title><desc id="desc">Groepen rond het heiligdom met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Groepen rond het heiligdom</text><text x="44" y="113" class="ref">3 Ezra 5:24–42</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Levieten · vers 26</text><text x="68" y="241" class="body">74 uit de genoemde families.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zonen van Asaf · vers 27</text><text x="68" y="390" class="body">128 heilige zangers.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Poortwachters · vers 28</text><text x="68" y="539" class="body">139 uit zes genoemde families.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Tempeldienst · vers 35</text><text x="68" y="688" class="body">372 dienaren van het heiligdom en zonen</text><text x="68" y="731" class="body">van Salomo’s dienaren.</text><text x="46" y="824" class="note">Dit zijn groepstotalen. Vers 42 noemt daarnaast</text><text x="46" y="860" class="note">245 zangers en zangeressen; die categorie wordt</text><text x="46" y="896" class="note">niet samengevoegd met vers 27.</text></svg>