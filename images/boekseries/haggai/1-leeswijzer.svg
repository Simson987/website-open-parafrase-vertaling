<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Let op je wegen en bouw</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Let op je wegen en bouw</text><text x="44" y="113" class="ref">Haggai 1:1–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aangesprokenen · 1–4</text><text x="68" y="241" class="body">Tweede jaar Darius, maand zes dag één;</text><text x="68" y="284" class="body">Haggai tot Zerubbabel en Josua; eigen</text><text x="68" y="327" class="body">betimmerd huis tegenover puin.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het tekort en de oproep · 5–11</text><text x="68" y="476" class="body">Weinig opbrengst, honger/dorst/kou en</text><text x="68" y="519" class="body">lekke buidel; hout halen en bouwen,</text><text x="68" y="562" class="body">droogte wegens eigen huis voorop.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het antwoord · 12–14</text><text x="68" y="711" class="body">Leiders en rest luisteren, ontzag, Ik</text><text x="68" y="754" class="body">ben met jullie; geest gewekt en samen</text><text x="68" y="797" class="body">aan werk.</text><text x="46" y="890" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="926" class="note">volgen de plaatselijke versindeling.</text></svg>