<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Werk, onderwijs en belofte</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Werk, onderwijs en belofte</text><text x="44" y="113" class="ref">Haggai 2:1–24</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sterk en aan werk · 1–10</text><text x="68" y="241" class="body">Nieuwe datum, oude pracht en huidig</text><text x="68" y="284" class="body">huis, sterke leiders/volk; Geest en</text><text x="68" y="327" class="body">geen angst, beven en grotere</text><text x="68" y="370" class="body">heerlijkheid/vrede.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Priestervragen · 11–20</text><text x="68" y="519" class="body">Heiligheid niet via kleedpunt,</text><text x="68" y="562" class="body">onreinheid wel; volk/werk, tekort,</text><text x="68" y="605" class="body">fundamentdatum en vanaf nu zegen.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Zerubbabel · 21–24</text><text x="68" y="754" class="body">Tweede woord die dag, koninkrijken en</text><text x="68" y="797" class="body">wagens omgekeerd; uitgekozen knecht als</text><text x="68" y="840" class="body">zegelring.</text><text x="46" y="933" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="969" class="note">volgen de plaatselijke versindeling.</text></svg>