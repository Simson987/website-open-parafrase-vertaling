<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Wapens worden werktuigen</title><desc id="desc">De twee concrete omvormingen en het uitgesproken gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wapens worden werktuigen</text><text x="44" y="113" class="ref">Micha 4:2–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zwaarden → ploegen · 3</text><text x="68" y="241" class="body">Geen zwaard meer opheffen tegen ander</text><text x="68" y="284" class="body">volk.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Speren → snoeimessen · 3</text><text x="68" y="433" class="body">De oorlog niet meer leren.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Veilig wonen · 4</text><text x="68" y="582" class="body">Ieder onder wijnstok en vijgenboom,</text><text x="68" y="625" class="body">niemand jaagt schrik aan.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Wegen gaan · 2,5</text><text x="68" y="774" class="body">Zijn wegen leren en paden gaan; onze</text><text x="68" y="817" class="body">weg in Zijn naam.</text><text x="46" y="910" class="note">Deze richting van omsmeden staat in Micha. Het</text><text x="46" y="946" class="note">eigen hoofdstukwoord wordt gevolgd, zonder de</text><text x="46" y="982" class="note">omgekeerde oproep elders ermee te verwarren.</text></svg>