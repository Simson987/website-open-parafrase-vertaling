<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Herinneringen en gevraagde weg</title><desc id="desc">Exacte namen en relaties, de vragen en het feitelijk gegeven antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herinneringen en gevraagde weg</text><text x="44" y="113" class="ref">Micha 6:3–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uit Egypte · 3–4</text><text x="68" y="241" class="body">Bevrijd uit slavenhuis; Mozes, Aäron en</text><text x="68" y="284" class="body">Mirjam vooruit gestuurd.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Moab en de reis · 5</text><text x="68" y="433" class="body">Balak, koning van Moab, zijn plan;</text><text x="68" y="476" class="body">antwoord van Bileam, zoon van Beor; van</text><text x="68" y="519" class="body">Sittim tot Gilgal.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De offer-vragen · 6–7</text><text x="68" y="668" class="body">Eenjarige kalveren, duizenden rammen,</text><text x="68" y="711" class="body">tienduizenden oliestromen en zelfs</text><text x="68" y="754" class="body">eigen kind als vraag.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het gegeven antwoord · 8</text><text x="68" y="903" class="body">Recht doen, trouw liefhebben en nederig</text><text x="68" y="946" class="body">wandelen met je God.</text><text x="46" y="1039" class="note">De vraag over een eigen kind is geen gegeven</text><text x="46" y="1075" class="note">opdracht tot een offer. Het antwoord in vers 8</text><text x="46" y="1111" class="note">blijft daarvan onderscheiden.</text></svg>