<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Plaatsen en rouwwoorden</title><desc id="desc"></desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plaatsen en rouwwoorden</text><text x="44" y="113" class="ref">Micha 1:10–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gath, Beth-Afra, Safir · 10–11</text><text x="68" y="241" class="body">Niet vertellen; in stof wentelen;</text><text x="68" y="284" class="body">schaamte en verder trekken.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zaänan, Beth-Haëzel, Maroth · 11–12</text><text x="68" y="433" class="body">Niet buiten komen; rouw en steun weg;</text><text x="68" y="476" class="body">angstig wachten, onheil tot Jeruzalems</text><text x="68" y="519" class="body">poort.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Lachis · 13</text><text x="68" y="668" class="body">Paarden voor wagen spannen; begin van</text><text x="68" y="711" class="body">zonde voor Sion genoemd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Moreset-Gath en Achzib · 14</text><text x="68" y="860" class="body">Afscheidsgeschenken; huizen bedriegen</text><text x="68" y="903" class="body">Israëls koningen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Maresa en Adullam · 15–16</text><text x="68" y="1052" class="body">Veroveraar komt; Israëls heerlijkheid</text><text x="68" y="1095" class="body">naar Adullam, kinderen weg en rouw.</text><text x="46" y="1188" class="note">De namen en de eigen woorden staan naast elkaar.</text><text x="46" y="1224" class="note">Niet gegeven Hebreeuwse woordspelingen of</text><text x="46" y="1260" class="note">moderne coördinaten worden niet ingevuld.</text></svg>