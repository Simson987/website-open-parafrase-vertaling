<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Heerser, vrede en overblijfsel</title><desc id="desc">De inhoud en opbouw van het gehele hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Heerser, vrede en overblijfsel</text><text x="44" y="113" class="ref">Micha 5:1–14</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bethlehem en de Heerser · 1–5</text><text x="68" y="241" class="body">Efratha, oorsprong van ouds;</text><text x="68" y="284" class="body">terugkerende verwanten, weiden en</text><text x="68" y="327" class="body">veiligheid, vrede; Assur en zeven</text><text x="68" y="370" class="body">herders/acht leiders.</text><rect x="42" y="428" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Onder de volken · 6–8</text><text x="68" y="519" class="body">Jakobs rest als dauw/regen en als</text><text x="68" y="562" class="body">leeuw; hand boven tegenstanders.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Wat wordt verwijderd · 9–14</text><text x="68" y="711" class="body">Paarden/wagens, steden/vestingen,</text><text x="68" y="754" class="body">toverij/waarzeggers,</text><text x="68" y="797" class="body">beelden/stenen/palen; gericht over niet</text><text x="68" y="840" class="body">luisterende volken.</text><text x="46" y="933" class="note">Plaatselijke versindeling; beeldspraak en</text><text x="46" y="969" class="note">beloofde gebeurtenissen worden niet als reeds</text><text x="46" y="1005" class="note">voltooide geschiedenis samengevoegd.</text></svg>