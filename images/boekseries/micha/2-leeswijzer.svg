<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Geroofd erfdeel en verzameling</title><desc id="desc">De inhoud en opbouw van het gehele hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geroofd erfdeel en verzameling</text><text x="44" y="113" class="ref">Micha 2:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het machtsmisbruik · 1–5</text><text x="68" y="241" class="body">Op bed beramen, akkers/huizen/erfdeel</text><text x="68" y="284" class="body">roven; onheil, klaaglied en geen</text><text x="68" y="327" class="body">meetlint bij het loten.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het verkeerde woord · 6–11</text><text x="68" y="476" class="body">Profeteren tegengehouden,</text><text x="68" y="519" class="body">voorbijgangers ontmanteld, vrouwen en</text><text x="68" y="562" class="body">kinderen beroofd; geen rust en gewenste</text><text x="68" y="605" class="body">wijnprofeet.</text><rect x="42" y="663" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De belofte · 12–13</text><text x="68" y="754" class="body">Jakob bijeen als kudde; bres, poort en</text><text x="68" y="797" class="body">voorgaan van koning en de HEERE.</text><text x="46" y="890" class="note">Plaatselijke versindeling; beeldspraak en</text><text x="46" y="926" class="note">beloofde gebeurtenissen worden niet als reeds</text><text x="46" y="962" class="note">voltooide geschiedenis samengevoegd.</text></svg>