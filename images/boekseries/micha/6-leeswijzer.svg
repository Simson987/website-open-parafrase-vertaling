<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Rechtszaak en het gevraagde</title><desc id="desc">De inhoud en opbouw van het gehele hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rechtszaak en het gevraagde</text><text x="44" y="113" class="ref">Micha 6:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Horen en herinneren · 1–5</text><text x="68" y="241" class="body">Bergen/heuvels als getuigen, vraag aan</text><text x="68" y="284" class="body">volk; Egypte, Mozes/Aäron/Mirjam,</text><text x="68" y="327" class="body">Balak/Bileam, Sittim/Gilgal.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De vraag en het antwoord · 6–8</text><text x="68" y="476" class="body">Offers en steeds grotere hoeveelheden</text><text x="68" y="519" class="body">als vragen; recht doen, trouw</text><text x="68" y="562" class="body">liefhebben, nederig met God wandelen.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het onrecht en gevolg · 9–16</text><text x="68" y="711" class="body">Kleine maat, valse</text><text x="68" y="754" class="body">weegschaal/gewichten, geweld/leugen;</text><text x="68" y="797" class="body">niet verzadigd en arbeid niet genoten,</text><text x="68" y="840" class="body">Omri/Achab gevolgd.</text><text x="46" y="933" class="note">Plaatselijke versindeling; beeldspraak en</text><text x="46" y="969" class="note">beloofde gebeurtenissen worden niet als reeds</text><text x="46" y="1005" class="note">voltooide geschiedenis samengevoegd.</text></svg>