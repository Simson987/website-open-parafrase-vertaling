<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Zeven herders en acht leiders</title><desc id="desc">De genoemde aantallen en de beide vergelijkingen in hun verband.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeven herders en acht leiders</text><text x="44" y="113" class="ref">Micha 5:3–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De Heerser · 3–4</text><text x="68" y="241" class="body">Weiden in Zijn kracht, veilig wonen;</text><text x="68" y="284" class="body">Hij zal vrede zijn.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij binnendringen Assur · 4–5</text><text x="68" y="433" class="body">Zeven herders en acht leiders uit de</text><text x="68" y="476" class="body">mensen tegen hem opstellen;</text><text x="68" y="519" class="body">Assur/Nimrod en redding.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De rest onder volken · 6</text><text x="68" y="668" class="body">Als dauw en regendruppels, wacht niet</text><text x="68" y="711" class="body">op een mens.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De andere vergelijking · 7–8</text><text x="68" y="860" class="body">Als leeuw onder dieren, kracht boven</text><text x="68" y="903" class="body">tegenstanders.</text><text x="46" y="996" class="note">De tekst geeft twee aantallen met verschillende</text><text x="46" y="1032" class="note">woorden. Dit schema verzint geen lijst van</text><text x="46" y="1068" class="note">vijftien namen.</text></svg>