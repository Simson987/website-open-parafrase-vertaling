<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Onrecht, betaling en het woord</title><desc id="desc">De inhoud en opbouw van het gehele hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onrecht, betaling en het woord</text><text x="44" y="113" class="ref">Micha 3:1–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Leiders · 1–4</text><text x="68" y="241" class="body">Recht moeten kennen, goed haten en</text><text x="68" y="284" class="body">kwaad liefhebben; uitbuiting als vlees</text><text x="68" y="327" class="body">in pot, geen antwoord op roepen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Profeten · 5–8</text><text x="68" y="476" class="body">Eten ontvangen: vrede, anders oorlog;</text><text x="68" y="519" class="body">duisternis en geen antwoord, tegenover</text><text x="68" y="562" class="body">Geest/kracht/recht/moed van Micha.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De gezamenlijke schuld · 9–12</text><text x="68" y="711" class="body">Recht verdraaid, Sion met bloed;</text><text x="68" y="754" class="body">rechter, priester en profeet voor</text><text x="68" y="797" class="body">betaling, valse zekerheid, stad als</text><text x="68" y="840" class="body">akker en puin.</text><text x="46" y="933" class="note">Plaatselijke versindeling; beeldspraak en</text><text x="46" y="969" class="note">beloofde gebeurtenissen worden niet als reeds</text><text x="46" y="1005" class="note">voltooide geschiedenis samengevoegd.</text></svg>