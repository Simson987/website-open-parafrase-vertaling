<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Zoek Hem en doe recht</title><desc id="desc">De volledige hoofdstukopbouw met aanklacht en gegeven gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zoek Hem en doe recht</text><text x="44" y="113" class="ref">Amos 5:1–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Klaaglied en oproep · 1–9</text><text x="68" y="241" class="body">Gevallen Israël en kleine rest; zoek</text><text x="68" y="284" class="body">Hem, niet heiligdomplaatsen; Schepper</text><text x="68" y="327" class="body">en gericht.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Recht in de poort · 10–17</text><text x="68" y="476" class="body">Eerlijk spreken gehaat, arme</text><text x="68" y="519" class="body">verdrongen, steekpenning; goed zoeken</text><text x="68" y="562" class="body">en recht herstellen, rouw volgt.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Dag en eredienst · 18–27</text><text x="68" y="711" class="body">Duisternis en ontsnappingsvergelijking;</text><text x="68" y="754" class="body">feesten/offers/muziek afgewezen, recht</text><text x="68" y="797" class="body">als beek; ballingschap voorbij</text><text x="68" y="840" class="body">Damaskus.</text><text x="46" y="933" class="note">Aanklacht, retorische vraag, visioen,</text><text x="46" y="969" class="note">herinnering en belofte worden volgens de</text><text x="46" y="1005" class="note">plaatselijke tekst onderscheiden.</text></svg>