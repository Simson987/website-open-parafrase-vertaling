<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Rijpe vrucht en het einde</title><desc id="desc">De volledige hoofdstukopbouw met aanklacht en gegeven gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rijpe vrucht en het einde</text><text x="44" y="113" class="ref">Amos 8:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het visioen · 1–3</text><text x="68" y="241" class="body">Mand zomervruchten, einde voor Israël,</text><text x="68" y="284" class="body">niet voorbijgaan, liederen in rouw.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De handel · 4–8</text><text x="68" y="433" class="body">Armen vertrapt, wachten op markt, te</text><text x="68" y="476" class="body">kleine maat en te zwaar gewicht, kaf en</text><text x="68" y="519" class="body">sandalenprijs; daden niet vergeten.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De gevolgen · 9–14</text><text x="68" y="668" class="body">Donker op middag, rouw en bittere dag;</text><text x="68" y="711" class="body">honger naar woord, zoeken zonder vinden</text><text x="68" y="754" class="body">en vallen.</text><text x="46" y="847" class="note">Aanklacht, retorische vraag, visioen,</text><text x="46" y="883" class="note">herinnering en belofte worden volgens de</text><text x="46" y="919" class="note">plaatselijke tekst onderscheiden.</text></svg>