<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De kleine rest en de oproep</title><desc id="desc">De beide genoemde aantallen naast de oproep tot leven en recht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De kleine rest en de oproep</text><text x="44" y="113" class="ref">Amos 5:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Duizend → honderd · 3</text><text x="68" y="241" class="body">Een stad die met duizend man uittrekt,</text><text x="68" y="284" class="body">houdt honderd over.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Honderd → tien · 3</text><text x="68" y="433" class="body">Een stad die met honderd uittrekt,</text><text x="68" y="476" class="body">houdt tien over.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zoek Hem · 4–6</text><text x="68" y="625" class="body">Leven wordt verbonden aan Hem zoeken,</text><text x="68" y="668" class="body">niet aan Beth-El, Gilgal of Berseba.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Doe recht · 14–15</text><text x="68" y="817" class="body">Goed zoeken, kwaad haten, goed</text><text x="68" y="860" class="body">liefhebben, recht in de poort;</text><text x="68" y="903" class="body">misschien genade voor Jozefs rest.</text><text x="46" y="996" class="note">De aantallen beschrijven zwaar verlies. Er</text><text x="46" y="1032" class="note">worden geen nieuwe legersterktes of kalenderdata</text><text x="46" y="1068" class="note">berekend.</text></svg>