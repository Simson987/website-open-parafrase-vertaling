<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Vragen die naar het woord leiden</title><desc id="desc">De vraagreeks en het uitdrukkelijke eindpunt: het gesproken woord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vragen die naar het woord leiden</text><text x="44" y="113" class="ref">Amos 3:3–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Samen lopen · 3</text><text x="68" y="241" class="body">Is er geen afspraak?</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Leeuw en hol · 4</text><text x="68" y="390" class="body">Is er geen prooi of vangst?</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Vogel en val · 5</text><text x="68" y="539" class="body">Is er geen strik of aanleiding om dicht</text><text x="68" y="582" class="body">te klappen?</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Stad en hoorn · 6</text><text x="68" y="731" class="body">Beef je niet bij het alarm? Onheil</text><text x="68" y="774" class="body">wordt aan Hem verbonden.</text><rect x="42" y="832" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Openbaren en spreken · 7–8</text><text x="68" y="923" class="body">Plan aan profeten onthuld; leeuw</text><text x="68" y="966" class="body">gebruld: vrees, Hij gesproken:</text><text x="68" y="1009" class="body">profeteren.</text><text x="46" y="1102" class="note">Het zijn retorische verbanden in de toespraak.</text><text x="46" y="1138" class="note">Het schema voegt geen natuurkundige wet of</text><text x="46" y="1174" class="note">aparte gebeurtenissen toe.</text></svg>