<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Ook Juda en Israël</title><desc id="desc">De volledige hoofdstukopbouw met aanklacht en gegeven gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ook Juda en Israël</text><text x="44" y="113" class="ref">Amos 2:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Moab en Juda · 1–5</text><text x="68" y="241" class="body">Koningsbotten tot kalk verbrand; wet</text><text x="68" y="284" class="body">verworpen en leugens gevolgd; vuur en</text><text x="68" y="327" class="body">gericht.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Israëls onrecht · 6–8</text><text x="68" y="476" class="body">Armen verkocht en verdrongen, naam</text><text x="68" y="519" class="body">ontheiligd, pandkleren en boetewijn bij</text><text x="68" y="562" class="body">altaren.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Gaven en antwoord · 9–12</text><text x="68" y="711" class="body">Amorieten weg, veertig jaar geleid,</text><text x="68" y="754" class="body">profeten/nazireeërs; wijn opgedrongen</text><text x="68" y="797" class="body">en profeteren verboden.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Geen ontsnapping · 13–16</text><text x="68" y="946" class="body">Volle wagen kraakt; snel, sterk, held,</text><text x="68" y="989" class="body">boogschutter en ruiter kunnen zich niet</text><text x="68" y="1032" class="body">redden.</text><text x="46" y="1125" class="note">Aanklacht, retorische vraag, visioen,</text><text x="46" y="1161" class="note">herinnering en belofte worden volgens de</text><text x="46" y="1197" class="note">plaatselijke tekst onderscheiden.</text></svg>