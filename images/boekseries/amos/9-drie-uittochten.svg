<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Drie genoemde volksbewegingen</title><desc id="desc">De drie expliciete herkomsten en de daaropvolgende uitspraak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie genoemde volksbewegingen</text><text x="44" y="113" class="ref">Amos 9:7–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Israël</text><text x="68" y="241" class="body">Uit Egypte geleid.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Filistijnen</text><text x="68" y="390" class="body">Uit Kafthor geleid.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Syriërs</text><text x="68" y="539" class="body">Uit Kir geleid.</text><rect x="42" y="597" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">De gevolgtrekking · 8</text><text x="68" y="688" class="body">Gericht tegen het zondige koninkrijk;</text><text x="68" y="731" class="body">huis van Jakob toch niet helemaal</text><text x="68" y="774" class="body">verdelgd.</text><text x="46" y="867" class="note">Dit zijn de drie herkomsten die de plaatselijke</text><text x="46" y="903" class="note">tekst noemt. Een kaart met onbewezen moderne</text><text x="46" y="939" class="note">grenzen of exacte routes is niet toegevoegd.</text></svg>