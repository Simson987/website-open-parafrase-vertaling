<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Zorgeloosheid en ondergang</title><desc id="desc">De volledige hoofdstukopbouw met aanklacht en gegeven gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zorgeloosheid en ondergang</text><text x="44" y="113" class="ref">Amos 6:1–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zelfverzekerden · 1–7</text><text x="68" y="241" class="body">Sion/Samaria en andere steden, dag</text><text x="68" y="284" class="body">wegschuiven; ivoorbed, vlees, muziek,</text><text x="68" y="327" class="body">wijn, olie, geen zorg om Jozef.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De verwoesting · 8–11</text><text x="68" y="476" class="body">Trots en paleizen gehaat, huis en</text><text x="68" y="519" class="body">bewoners gaan te gronde, stilte en</text><text x="68" y="562" class="body">puin.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De tegenstelling · 12–14</text><text x="68" y="711" class="body">Paarden/rots en runderen/ploeg als</text><text x="68" y="754" class="body">vragen; recht tot gif, eigen kracht</text><text x="68" y="797" class="body">geroemd, verdrukking over genoemd</text><text x="68" y="840" class="body">gebied.</text><text x="46" y="933" class="note">Aanklacht, retorische vraag, visioen,</text><text x="46" y="969" class="note">herinnering en belofte worden volgens de</text><text x="46" y="1005" class="note">plaatselijke tekst onderscheiden.</text></svg>