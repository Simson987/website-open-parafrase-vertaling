<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Vijfmaal niet teruggekeerd</title><desc id="desc">De exact vijf herinneringen met hun herhaalde menselijke reactie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijfmaal niet teruggekeerd</text><text x="44" y="113" class="ref">Amos 4:6–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Broodgebrek · 6</text><text x="68" y="241" class="body">Schone tanden en geen brood.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Regengebrek · 7–8</text><text x="68" y="390" class="body">Drie maanden voor oogst, ongelijk</text><text x="68" y="433" class="body">regen, steden zoeken tevergeefs genoeg</text><text x="68" y="476" class="body">water.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gewasverlies · 9</text><text x="68" y="625" class="body">Graanbrand, meeldauw en sprinkhanen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Pest en zwaard · 10</text><text x="68" y="774" class="body">Pest als in Egypte, jonge mannen en</text><text x="68" y="817" class="body">paarden verloren, stinkend kamp.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Omkering · 11</text><text x="68" y="966" class="body">Als Sodom en Gomorra, brandhout uit</text><text x="68" y="1009" class="body">vuur gerukt.</text><text x="46" y="1102" class="note">Na ieder onderdeel: toch zijn jullie niet naar</text><text x="46" y="1138" class="note">mij teruggekeerd, zegt de HEERE. Daarna volgt de</text><text x="46" y="1174" class="note">oproep van vers 12.</text></svg>