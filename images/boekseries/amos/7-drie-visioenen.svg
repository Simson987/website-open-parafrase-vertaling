<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Twee voorbeden, dan paslood</title><desc id="desc">De drie visioenen met hun eigen voorbede en antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee voorbeden, dan paslood</text><text x="44" y="113" class="ref">Amos 7:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sprinkhanen · 1–3</text><text x="68" y="241" class="body">Nagras na maaiing voor koning; vergeef,</text><text x="68" y="284" class="body">Jakob is klein; het zal niet gebeuren.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vuur · 4–6</text><text x="68" y="433" class="body">Diepte en akkerland getroffen; houd op,</text><text x="68" y="476" class="body">Jakob is klein; ook dit zal niet</text><text x="68" y="519" class="body">gebeuren.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Paslood · 7–9</text><text x="68" y="668" class="body">Wat zie je? Paslood; midden in Israël,</text><text x="68" y="711" class="body">niet meer voorbijgaan; offerhoogten en</text><text x="68" y="754" class="body">koningshuis getroffen.</text><text x="46" y="847" class="note">De derde passage heeft niet hetzelfde antwoord</text><text x="46" y="883" class="note">als de eerste twee. De onderscheiden reacties</text><text x="46" y="919" class="note">blijven zichtbaar.</text></svg>