<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1498" viewBox="0 0 840 1498" role="img" aria-labelledby="title desc"><title id="title">Vijf volken, vijf aanklachten</title><desc id="desc">De vijf aangesproken volken met hun eigen aanklacht en gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1498" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijf volken, vijf aanklachten</text><text x="44" y="113" class="ref">Amos 1:3–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Damaskus · 3–5</text><text x="68" y="241" class="body">Gilead met ijzeren dorssleden gedorst;</text><text x="68" y="284" class="body">Hazaël/Benhadad, grendel breekt, Syrië</text><text x="68" y="327" class="body">naar Kir.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gaza · 6–8</text><text x="68" y="476" class="body">Hele volk aan Edom overgeleverd; ook</text><text x="68" y="519" class="body">Asdod, Askelon, Ekron en overige</text><text x="68" y="562" class="body">Filistijnen getroffen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Tyrus · 9–10</text><text x="68" y="711" class="body">Overlevering aan Edom, verbond tussen</text><text x="68" y="754" class="body">broedervolken vergeten; muur en</text><text x="68" y="797" class="body">paleizen in vuur.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Edom · 11–12</text><text x="68" y="946" class="body">Broer vervolgd, medelijden verstikt,</text><text x="68" y="989" class="body">blijvende razernij; Theman en Bozra in</text><text x="68" y="1032" class="body">vuur.</text><rect x="42" y="1090" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1133" class="label">Ammon · 13–15</text><text x="68" y="1181" class="body">Zwangeren in Gilead gedood om grond;</text><text x="68" y="1224" class="body">Rabba in vuur, koning en vorsten in</text><text x="68" y="1267" class="body">ballingschap.</text><text x="46" y="1360" class="note">De herhaalde formule drie overtredingen en vier</text><text x="46" y="1396" class="note">is geen opdracht om bij elk volk zeven</text><text x="46" y="1432" class="note">afzonderlijke misdaden te verzinnen.</text></svg>