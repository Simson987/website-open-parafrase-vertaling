<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Oordeel en hernieuwd planten</title><desc id="desc">De volledige hoofdstukopbouw met aanklacht en gegeven gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oordeel en hernieuwd planten</text><text x="44" y="113" class="ref">Amos 9:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geen schuilplaats · 1–6</text><text x="68" y="241" class="body">Altaar en beven, nergens ontsnappen,</text><text x="68" y="284" class="body">land als Nijl, zee en aarde in Zijn</text><text x="68" y="327" class="body">macht.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Volken en het zeven · 7–10</text><text x="68" y="476" class="body">Israël, Filistijnen en Syriërs geleid;</text><text x="68" y="519" class="body">zondig rijk gericht, Jakob niet</text><text x="68" y="562" class="body">helemaal verdelgd, zeef en</text><text x="68" y="605" class="body">zelfzekerheid.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het herstel · 11–15</text><text x="68" y="754" class="body">Davids hut opgericht, Edom en volken,</text><text x="68" y="797" class="body">overvloedige arbeid, steden en tuinen,</text><text x="68" y="840" class="body">nooit meer uitgerukt.</text><text x="46" y="933" class="note">Aanklacht, retorische vraag, visioen,</text><text x="46" y="969" class="note">herinnering en belofte worden volgens de</text><text x="46" y="1005" class="note">plaatselijke tekst onderscheiden.</text></svg>