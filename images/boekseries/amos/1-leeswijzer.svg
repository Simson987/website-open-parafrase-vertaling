<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Vijf volken aangesproken</title><desc id="desc">De volledige hoofdstukopbouw met aanklacht en gegeven gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijf volken aangesproken</text><text x="44" y="113" class="ref">Amos 1:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Woord en plaats · 1–2</text><text x="68" y="241" class="body">Amos uit Thekoa, Uzzia en Jerobeam,</text><text x="68" y="284" class="body">twee jaar voor aardbeving; brullen uit</text><text x="68" y="327" class="body">Sion en Karmel verdort.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Damaskus, Gaza en Tyrus · 3–10</text><text x="68" y="476" class="body">Gilead mishandeld, volk weggevoerd en</text><text x="68" y="519" class="body">overgeleverd, broederverbond vergeten;</text><text x="68" y="562" class="body">vuur en ballingschap.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Edom en Ammon · 11–15</text><text x="68" y="711" class="body">Broer met zwaard vervolgd, medelijden</text><text x="68" y="754" class="body">verstikt; geweld tegen zwangeren om</text><text x="68" y="797" class="body">grond, vuur en koning weggevoerd.</text><text x="46" y="890" class="note">Aanklacht, retorische vraag, visioen,</text><text x="46" y="926" class="note">herinnering en belofte worden volgens de</text><text x="46" y="962" class="note">plaatselijke tekst onderscheiden.</text></svg>