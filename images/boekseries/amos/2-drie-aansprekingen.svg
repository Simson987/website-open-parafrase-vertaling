<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Moab, Juda en Israël</title><desc id="desc">De eigen inhoud en omvang van de drie aansprekingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Moab, Juda en Israël</text><text x="44" y="113" class="ref">Amos 2:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Moab · 1–3</text><text x="68" y="241" class="body">Botten van Edoms koning verbrand tot</text><text x="68" y="284" class="body">kalk; vuur in Kerioth, rechter en</text><text x="68" y="327" class="body">vorsten weg.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Juda · 4–5</text><text x="68" y="476" class="body">Wet en regels verworpen, leugens</text><text x="68" y="519" class="body">gevolgd; vuur in Jeruzalems paleizen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Israël · 6–12</text><text x="68" y="668" class="body">Sociaal onrecht en ontheiliging, gaven</text><text x="68" y="711" class="body">vergeten; profeten en nazireeërs</text><text x="68" y="754" class="body">tegengewerkt.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De afloop voor Israël · 13–16</text><text x="68" y="903" class="body">Wagenvergelijking en falende vlucht:</text><text x="68" y="946" class="body">snelheid, kracht, heldendom, boog en</text><text x="68" y="989" class="body">paard helpen niet.</text><text x="46" y="1082" class="note">Israëls aanklacht is hier uitgebreider dan de</text><text x="46" y="1118" class="note">andere twee. De passage wordt niet tot drie</text><text x="46" y="1154" class="note">identieke oorlogsscènes teruggebracht.</text></svg>