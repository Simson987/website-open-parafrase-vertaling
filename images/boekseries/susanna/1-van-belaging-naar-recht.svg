<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Van belaging naar recht</title><desc id="desc">Van belaging naar recht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van belaging naar recht</text><text x="44" y="113" class="ref">Susanna 1:1–64</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De achtergrond · 1–14</text><text x="68" y="241" class="body">Susanna, haar huis en het misbruik van</text><text x="68" y="284" class="body">vertrouwen door de twee rechters.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dwang en laster · 15–41</text><text x="68" y="433" class="body">Zij weigert hun eis; zij brengen valse</text><text x="68" y="476" class="body">beschuldigingen en krijgen aanvankelijk</text><text x="68" y="519" class="body">geloof.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het keerpunt · 42–59</text><text x="68" y="668" class="body">Haar gebed, Daniëls ingrijpen en</text><text x="68" y="711" class="body">afzonderlijke ondervraging.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De erkenning · 60–64</text><text x="68" y="860" class="body">Onschuld wordt vastgesteld; de familie</text><text x="68" y="903" class="body">dankt en Daniëls aanzien groeit.</text><text x="46" y="996" class="note">De aantijging van de oudsten is vals; het schema</text><text x="46" y="1032" class="note">houdt beschuldiging en vastgestelde waarheid uit</text><text x="46" y="1068" class="note">elkaar.</text></svg>