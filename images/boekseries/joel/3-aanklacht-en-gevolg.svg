<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1256" viewBox="0 0 840 1256" role="img" aria-labelledby="title desc"><title id="title">De genoemde aanklachten</title><desc id="desc">De verschillende gronden van de rechtszaak zonder geografische uitvindingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1256" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde aanklachten</text><text x="44" y="113" class="ref">Joël 3:2–8,19–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verstrooiing en grond · 2</text><text x="68" y="241" class="body">Zijn volk verstrooid onder de volken en</text><text x="68" y="284" class="body">Zijn land verdeeld.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mensen tot handelswaar · 3,6</text><text x="68" y="433" class="body">Jongen en meisje geruild of verkocht;</text><text x="68" y="476" class="body">Juda en Jeruzalem naar de Grieken</text><text x="68" y="519" class="body">verkocht.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Weggenomen bezit · 4–5</text><text x="68" y="668" class="body">Tyrus, Sidon en Filistijnse gebieden</text><text x="68" y="711" class="body">aangesproken; zilver, goud en schatten</text><text x="68" y="754" class="body">in hun tempels.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Geweld en recht · 7–8,19–21</text><text x="68" y="903" class="body">Daden keren op eigen hoofd; Egypte en</text><text x="68" y="946" class="body">Edom wegens onschuldig bloed, Juda en</text><text x="68" y="989" class="body">Jeruzalem blijven.</text><text x="46" y="1082" class="note">De tekst benoemt mensenhandel als aanklacht. Dit</text><text x="46" y="1118" class="note">wordt in het schema weergegeven zonder seksuele</text><text x="46" y="1154" class="note">exploitatie of geweld tegen kinderen af te</text><text x="46" y="1190" class="note">beelden.</text></svg>