<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1084" viewBox="0 0 840 1084" role="img" aria-labelledby="title desc"><title id="title">De belofte aan alle mensen</title><desc id="desc">De genoemde groepen, tekenen en de uitspraak over redding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1084" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De belofte aan alle mensen</text><text x="44" y="113" class="ref">Joël 2:28–32</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zonen en dochters · 28</text><text x="68" y="241" class="body">Zij zullen profeteren.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Ouderen en jongeren · 28</text><text x="68" y="390" class="body">Oude mensen dromen, jonge mannen zien</text><text x="68" y="433" class="body">visioenen.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Dienaren en dienaressen · 29</text><text x="68" y="582" class="body">Ook over hen wordt de Geest uitgegoten.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Tekenen en redding · 30–32</text><text x="68" y="731" class="body">Bloed, vuur, rook, donkere zon en</text><text x="68" y="774" class="body">bloedmaan; ieder die Zijn naam aanroept</text><text x="68" y="817" class="body">gered, redding op Sion en in Jeruzalem.</text><text x="46" y="910" class="note">Deze opsomming houdt de genoemde groepen en</text><text x="46" y="946" class="note">handelingen precies bijeen. Er wordt geen</text><text x="46" y="982" class="note">afzonderlijke historische scène van Pinksteren</text><text x="46" y="1018" class="note">toegevoegd.</text></svg>