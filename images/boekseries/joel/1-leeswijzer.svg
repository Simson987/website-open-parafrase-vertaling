<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Verwoesting en vasten</title><desc id="desc">De volledige opbouw van verlies, rouw en oproep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verwoesting en vasten</text><text x="44" y="113" class="ref">Joël 1:1–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Horen en doorvertellen · 1–4</text><text x="68" y="241" class="body">Joël, zoon van Pethuël; oudsten en</text><text x="68" y="284" class="body">landbewoners, kinderen en volgende</text><text x="68" y="327" class="body">generaties; vier opeenvolgende vreters.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wat verdwijnt · 5–12</text><text x="68" y="476" class="body">Wijn, vijg, graanoffer en drankoffer,</text><text x="68" y="519" class="body">koren en olie; boeren, wijnbouwers en</text><text x="68" y="562" class="body">alle veldbomen treuren.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Samen roepen · 13–20</text><text x="68" y="711" class="body">Priesters rouwen, vasten en samenkomst;</text><text x="68" y="754" class="body">dag nabij, lege schuren, vee zonder</text><text x="68" y="797" class="body">weide, vuur en droge stromen.</text><text x="46" y="890" class="note">De hoofdstukbeelden omvatten meer dan</text><text x="46" y="926" class="note">sprinkhanen alleen: ook eredienst, boeren, bomen</text><text x="46" y="962" class="note">en dieren worden getroffen.</text></svg>