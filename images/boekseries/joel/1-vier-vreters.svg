<svg xmlns="http://www.w3.org/2000/svg" width="840" height="676" viewBox="0 0 840 676"><title>Vier namen, telkens het restant</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="676" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Vier namen, telkens het restant</text><text x="42" y="105" font-size="25">Joël 1:4</text><rect x="150" y="155" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="191" text-anchor="middle" font-size="31">Knaagsprinkhaan</text><path d="M420 209 V229" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="235" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="271" text-anchor="middle" font-size="31">Gewone sprinkhaan</text><path d="M420 289 V309" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="315" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="351" text-anchor="middle" font-size="31">Jonge sprinkhaan</text><path d="M420 369 V389" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="395" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="431" text-anchor="middle" font-size="31">Kaalvreter</text><text x="42" y="495" font-size="26">Telkens wordt opgegeten wat de vorige overliet.</text><text x="42" y="529" font-size="26">De vier plaatselijke namen worden niet zonder</text><text x="42" y="563" font-size="26">bron als exacte biologische soorten of</text><text x="42" y="597" font-size="26">ontwikkelingsfasen vastgelegd.</text></g></svg>