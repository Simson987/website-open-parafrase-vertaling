<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Alarm, terugkeer en herstel</title><desc id="desc">De vier bewegingen van alarm naar terugkeer en antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Alarm, terugkeer en herstel</text><text x="44" y="113" class="ref">Joël 2:1–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De naderende dag · 1–11</text><text x="68" y="241" class="body">Hoorn en duisternis; verwoestend leger</text><text x="68" y="284" class="body">met vergelijkingen, muren en ramen,</text><text x="68" y="327" class="body">hemel en aarde beven.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zelfs nu · 12–17</text><text x="68" y="476" class="body">Met heel hart terugkeren; hart</text><text x="68" y="519" class="body">scheuren, vasten, alle leeftijden</text><text x="68" y="562" class="body">bijeen, priesters bidden tussen voorhal</text><text x="68" y="605" class="body">en altaar.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het antwoord · 18–27</text><text x="68" y="754" class="body">Ontferming, koren/wijn/olie, vijand</text><text x="68" y="797" class="body">weg, groen en regen, volle kuipen,</text><text x="68" y="840" class="body">jaren vergoed, geen schaamte.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Daarna · 28–32</text><text x="68" y="989" class="body">Geest over allen,</text><text x="68" y="1032" class="body">profeteren/dromen/visioenen, tekenen en</text><text x="68" y="1075" class="body">redding voor wie Zijn naam aanroept.</text><text x="46" y="1168" class="note">De tekst noemt legervergelijkingen en beloftes.</text><text x="46" y="1204" class="note">De latere vervulling wordt hier niet met extra</text><text x="46" y="1240" class="note">gebeurtenissen ingevuld.</text></svg>