<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1114" viewBox="0 0 840 1114" role="img" aria-labelledby="title desc"><title id="title">Rechtszaak en blijvende woning</title><desc id="desc">De aanklacht, het oordeelsbeeld en de beloofde woning onderscheiden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1114" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rechtszaak en blijvende woning</text><text x="44" y="113" class="ref">Joël 3:1–21</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanklacht · 1–8</text><text x="68" y="241" class="body">Lot Juda/Jeruzalem gekeerd;</text><text x="68" y="284" class="body">verstrooiing, land verdelen,</text><text x="68" y="327" class="body">mensenhandel en geroofde schatten,</text><text x="68" y="370" class="body">vergelding.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Oproep en oordeel · 9–16</text><text x="68" y="519" class="body">Volken en strijdmiddelen, Josafatdal,</text><text x="68" y="562" class="body">oogst en pers als oordeelsbeelden,</text><text x="68" y="605" class="body">menigten en donkerheid; toevlucht voor</text><text x="68" y="648" class="body">Israël.</text><rect x="42" y="706" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">De woonplaats · 17–21</text><text x="68" y="797" class="body">Heilig Jeruzalem, water en bron uit</text><text x="68" y="840" class="body">Zijn huis naar Sittim, Egypte/Edom</text><text x="68" y="883" class="body">verlaten, Juda en Jeruzalem blijven.</text><text x="46" y="976" class="note">De pers in vers 13 verbeeldt groot kwaad en</text><text x="46" y="1012" class="note">oordeel; de overvloed van vers 18 hoort bij het</text><text x="46" y="1048" class="note">herstelwoord.</text></svg>