<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De tijd en Gods geduld</title><desc id="desc">De tijd en Gods geduld met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De tijd en Gods geduld</text><text x="44" y="113" class="ref">2 Petrus 3:8–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vergelijking · vers 8</text><text x="68" y="241" class="body">Eén dag als duizend jaar en duizend</text><text x="68" y="284" class="body">jaar als één dag.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het geduld · vers 9</text><text x="68" y="433" class="body">Hij wil dat allen tot bekering komen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De dag · vers 10–12</text><text x="68" y="582" class="body">Onverwacht; een oproep tot heilig en</text><text x="68" y="625" class="body">vroom leven.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De belofte · vers 13–14</text><text x="68" y="774" class="body">Nieuwe hemel en aarde met</text><text x="68" y="817" class="body">gerechtigheid; leef in vrede.</text><text x="46" y="910" class="note">De dag-jaarvergelijking beschrijft Gods</text><text x="46" y="946" class="note">verhouding tot tijd en is hier geen</text><text x="46" y="982" class="note">datumberekening.</text></svg>