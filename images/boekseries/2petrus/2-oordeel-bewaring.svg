<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Oordeel en bewaring</title><desc id="desc">Oordeel en bewaring met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oordeel en bewaring</text><text x="44" y="113" class="ref">2 Petrus 2:4–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De engelen · vers 4</text><text x="68" y="241" class="body">Bewaard in duisternis voor het oordeel.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De vloed · vers 5</text><text x="68" y="390" class="body">Noach en zeven anderen bewaard.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">De steden · vers 6–8</text><text x="68" y="539" class="body">Sodom en Gomorra veroordeeld; de</text><text x="68" y="582" class="body">rechtvaardige Lot gered.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De gevolgtrekking · vers 9</text><text x="68" y="731" class="body">De Heere redt vromen uit beproeving en</text><text x="68" y="774" class="body">bewaart onrechtvaardigen voor oordeel.</text><text x="46" y="867" class="note">De brief gebruikt eerdere voorbeelden om de</text><text x="46" y="903" class="note">waarschuwing te onderbouwen.</text></svg>