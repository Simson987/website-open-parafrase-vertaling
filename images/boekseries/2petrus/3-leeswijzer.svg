<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Geduld, verwachting en groei</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geduld, verwachting en groei</text><text x="44" y="113" class="ref">2 Petrus 3:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–7 · Herinnering en spot</text><text x="68" y="241" class="body">Schepping, vloed en het komende</text><text x="68" y="284" class="body">oordeel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">8–10 · Geduld en de dag</text><text x="68" y="433" class="body">Gods tijd en geduld; de dag komt</text><text x="68" y="476" class="body">onverwacht.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">11–14 · Heilig en in vrede</text><text x="68" y="625" class="body">De nieuwe hemel en aarde verwachten.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">15–18 · Schrift en groei</text><text x="68" y="774" class="body">Paulus’ brieven, geen verdraaiing en</text><text x="68" y="817" class="body">groeien in genade.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>