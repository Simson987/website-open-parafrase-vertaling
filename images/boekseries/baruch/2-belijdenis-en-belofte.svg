<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Belijdenis en belofte</title><desc id="desc">Belijdenis en belofte met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Belijdenis en belofte</text><text x="44" y="113" class="ref">Baruch 2:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De erkenning · 1–10</text><text x="68" y="241" class="body">Ellende en verstrooiing worden</text><text x="68" y="284" class="body">verbonden met het niet luisteren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het smeekgebed · 11–19</text><text x="68" y="433" class="body">Herinnering aan de uittocht en verzoek</text><text x="68" y="476" class="body">om ontferming en verhoring.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het profetische woord · 20–27</text><text x="68" y="625" class="body">Dienst aan Babel, verwoesting en de</text><text x="68" y="668" class="body">erkende gevolgen van ongehoorzaamheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De belofte · 28–35</text><text x="68" y="817" class="body">Tot inkeer komen, een luisterend hart,</text><text x="68" y="860" class="body">terugkeer en een eeuwig verbond.</text><text x="46" y="953" class="note">De afgebeelde terugkeer hoort bij de belofte in</text><text x="46" y="989" class="note">het gebed; het hoofdstuk vertelt niet dat deze</text><text x="46" y="1025" class="note">al is voltrokken.</text></svg>