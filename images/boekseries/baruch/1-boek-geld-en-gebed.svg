<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Boek, geld en gebed</title><desc id="desc">Boek, geld en gebed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boek, geld en gebed</text><text x="44" y="113" class="ref">Baruch 1:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In Babel · 1–6</text><text x="68" y="241" class="body">Baruch schrijft en leest; de ballingen</text><text x="68" y="284" class="body">huilen, vasten, bidden en zamelen in.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Naar Jeruzalem · 7–10</text><text x="68" y="433" class="body">Geld en tempelvoorwerpen; een opdracht</text><text x="68" y="476" class="body">tot het brengen van offers.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De opdracht · 11–14</text><text x="68" y="625" class="body">Bidden voor de Babylonische heersers en</text><text x="68" y="668" class="body">voor de ballingen; het boek openbaar</text><text x="68" y="711" class="body">voorlezen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De belijdenis · 15–22</text><text x="68" y="860" class="body">Gerechtigheid bij God, schaamte bij het</text><text x="68" y="903" class="body">volk vanwege aanhoudende</text><text x="68" y="946" class="body">ongehoorzaamheid.</text><text x="46" y="1039" class="note">De opdracht tot voorlezen in Jeruzalem is</text><text x="46" y="1075" class="note">onderscheiden van Baruchs voorlezing in Babel.</text></svg>