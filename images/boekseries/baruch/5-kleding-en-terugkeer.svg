<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Kleding en veilige terugkeer</title><desc id="desc">Kleding en veilige terugkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kleding en veilige terugkeer</text><text x="44" y="113" class="ref">Baruch 5:1–9</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nieuwe kleding · 1–2</text><text x="68" y="241" class="body">Rouw uit, pracht aan; mantel van</text><text x="68" y="284" class="body">gerechtigheid en tulband van</text><text x="68" y="327" class="body">heerlijkheid.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Nieuwe naam · 3–4</text><text x="68" y="476" class="body">Vrede van gerechtigheid en</text><text x="68" y="519" class="body">heerlijkheid, lof van godsvrucht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het uitzicht · 5–6</text><text x="68" y="668" class="body">De kinderen verzamelen zich; weggeleid</text><text x="68" y="711" class="body">te voet, teruggebracht in eer.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De veilige weg · 7–9</text><text x="68" y="860" class="body">Bergen laag, dalen gevuld, schaduw van</text><text x="68" y="903" class="body">bomen en leiding met vreugde.</text><text x="46" y="996" class="note">Kleding en landschap verbeelden herstel van</text><text x="46" y="1032" class="note">Jeruzalem en Israël; zij horen bij een</text><text x="46" y="1068" class="note">toekomstbelofte.</text></svg>