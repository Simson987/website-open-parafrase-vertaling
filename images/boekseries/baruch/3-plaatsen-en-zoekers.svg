<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Plaatsen en zoekers</title><desc id="desc">Plaatsen en zoekers met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plaatsen en zoekers</text><text x="44" y="113" class="ref">Baruch 3:22–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kanaän en Teman · 22</text><text x="68" y="241" class="body">De wijsheid is er niet gehoord of</text><text x="68" y="284" class="body">gezien.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hagars nakomelingen · 23</text><text x="68" y="433" class="body">Zij zoeken kennis, maar kennen de weg</text><text x="68" y="476" class="body">van de wijsheid niet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Merran en Teman · 23</text><text x="68" y="625" class="body">Kooplieden, dichters en onderzoekers</text><text x="68" y="668" class="body">worden genoemd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Hemel en zee · 29–31</text><text x="68" y="817" class="body">Vragen over omhooggaan en oversteken</text><text x="68" y="860" class="body">benadrukken dat niemand haar weg kent.</text><text x="46" y="953" class="note">Dit zijn vindplaatsen en zoekbeelden in de</text><text x="46" y="989" class="note">tekst, geen uitgestippelde reisroute.</text></svg>