<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Nuttig en machteloos</title><desc id="desc">Nuttig en machteloos met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nuttig en machteloos</text><text x="44" y="113" class="ref">Baruch 6:58–69</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Huis en bestuur · 58</text><text x="68" y="241" class="body">Dappere koning, bruikbare pot,</text><text x="68" y="284" class="body">beschermende deur en paleiszuil worden</text><text x="68" y="327" class="body">hoger gewaardeerd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De natuur · 59–62</text><text x="68" y="476" class="body">Zon, maan, sterren, bliksem, wind,</text><text x="68" y="519" class="body">wolken en vuur vervullen hun taak.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De dieren · 67</text><text x="68" y="668" class="body">Zij kunnen zichzelf helpen door in een</text><text x="68" y="711" class="body">hol te vluchten.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De vogelverschrikker · 69</text><text x="68" y="860" class="body">Hij kan het komkommerveld niet bewaken;</text><text x="68" y="903" class="body">de vergelijking ontmaskert schijnmacht.</text><text x="46" y="996" class="note">De tekst gebruikt vergelijkingen; dit schema</text><text x="46" y="1032" class="note">kent de genoemde voorwerpen geen goddelijke rol</text><text x="46" y="1068" class="note">toe.</text></svg>