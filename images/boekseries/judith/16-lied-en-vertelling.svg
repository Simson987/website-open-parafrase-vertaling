<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Beeldspraak en vervolgverhaal</title><desc id="desc">Beeldspraak en vervolgverhaal met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beeldspraak en vervolgverhaal</text><text x="44" y="113" class="ref">Judith 16:15–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Loflied · 15–21</text><text x="68" y="241" class="body">Gods stem, bewegende bergen en rotsen</text><text x="68" y="284" class="body">als was drukken Zijn macht uit.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jeruzalem · 22–24</text><text x="68" y="433" class="body">Het volk aanbidt; Judith geeft het</text><text x="68" y="476" class="body">vaatwerk en gordijn als heilige gaven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Terugkeer · 25–27</text><text x="68" y="625" class="body">Zij keert naar Betulia terug en trouwt</text><text x="68" y="668" class="body">niet opnieuw.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ouderdom · 28–30</text><text x="68" y="817" class="body">Zij bevrijdt haar dienares, verdeelt</text><text x="68" y="860" class="body">bezit en sterft; Israël leeft zonder</text><text x="68" y="903" class="body">nieuwe angst.</text><text x="46" y="996" class="note">Het beeld van smeltende rotsen behoort tot het</text><text x="46" y="1032" class="note">lied; het wordt niet als afzonderlijke</text><text x="46" y="1068" class="note">historische gebeurtenis behandeld.</text></svg>