<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Achior stelt een voorwaarde</title><desc id="desc">Achior stelt een voorwaarde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Achior stelt een voorwaarde</text><text x="44" y="113" class="ref">Judith 5:19–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zijn terugblik</text><text x="68" y="241" class="body">Zolang Israël niet tegen God zondigde,</text><text x="68" y="284" class="body">ging het goed.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij afdwaling</text><text x="68" y="433" class="body">Oorlog, gevangenschap en verwoeste</text><text x="68" y="476" class="body">tempel.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nu volgens Achior</text><text x="68" y="625" class="body">Terugkeer tot God en naar Jeruzalem.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Zijn advies</text><text x="68" y="774" class="body">Alleen bij gevonden schuld aanvallen;</text><text x="68" y="817" class="body">zonder onrecht voorbijgaan, anders kan</text><text x="68" y="860" class="body">God hen beschermen.</text><text x="46" y="953" class="note">Achior redeneert over de toestand van dit volk;</text><text x="46" y="989" class="note">hij geeft geen garantie op grond van</text><text x="46" y="1025" class="note">legergrootte.</text></svg>