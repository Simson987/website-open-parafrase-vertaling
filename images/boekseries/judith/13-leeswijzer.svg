<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Van de tent terug naar Betulia</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van de tent terug naar Betulia</text><text x="44" y="113" class="ref">Judith 13:1–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–11 · In de tent</text><text x="68" y="241" class="body">Dienaren vertrekken; Judith bidt, neemt</text><text x="68" y="284" class="body">de sabel, doodt Holofernes en neemt het</text><text x="68" y="327" class="body">gordijn.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">12–20 · Terugkeer en verslag</text><text x="68" y="476" class="body">Judith en haar dienstmeisje keren</text><text x="68" y="519" class="body">terug; de poort opent en zij vertelt</text><text x="68" y="562" class="body">wat gebeurd is.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">21–26 · Dank en zegen</text><text x="68" y="711" class="body">Het volk aanbidt God; Ozias zegent haar</text><text x="68" y="754" class="body">en het volk stemt in.</text><text x="46" y="847" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="883" class="note">de plaatselijke versindeling.</text></svg>