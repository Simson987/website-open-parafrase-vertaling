<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Judiths laatste jaren en bezit</title><desc id="desc">Judiths laatste jaren en bezit met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Judiths laatste jaren en bezit</text><text x="44" y="113" class="ref">Judith 16:24–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie maanden</text><text x="68" y="241" class="body">Vreugde in Jeruzalem voor het</text><text x="68" y="284" class="body">heiligdom.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">105 jaar</text><text x="68" y="433" class="body">Judiths ouderdom in het huis van haar</text><text x="68" y="476" class="body">overleden man Manasse.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Voor haar dood</text><text x="68" y="625" class="body">Vrijheid voor haar dienares; bezit naar</text><text x="68" y="668" class="body">verwanten van Manasse en van haarzelf.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zeven dagen</text><text x="68" y="817" class="body">Het huis van Israël rouwt om haar;</text><text x="68" y="860" class="body">begrafenis in Manasses grafspelonk.</text><text x="46" y="953" class="note">Geen kinderen, nieuwe echtgenoot of namen van</text><text x="46" y="989" class="note">erfgenamen worden aan de genoemde verwantschap</text><text x="46" y="1025" class="note">toegevoegd.</text></svg>