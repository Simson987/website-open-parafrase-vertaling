<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Van voorbereiding tot ontmoeting</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van voorbereiding tot ontmoeting</text><text x="44" y="113" class="ref">Judith 10:1–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · In het huis</text><text x="68" y="241" class="body">Judith legt rouwkleren af, kleedt zich</text><text x="68" y="284" class="body">feestelijk en geeft proviand aan haar</text><text x="68" y="327" class="body">dienstmeisje.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">6–10 · Door de poort</text><text x="68" y="476" class="body">De leiders zegenen haar; de poort gaat</text><text x="68" y="519" class="body">open en beiden trekken weg.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">11–16 · In het dal en kamp</text><text x="68" y="668" class="body">De voorwacht ondervraagt haar en</text><text x="68" y="711" class="body">honderd mannen begeleiden hen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">17–19 · Voor Holofernes</text><text x="68" y="860" class="body">Dienaren brengen haar binnen; zij buigt</text><text x="68" y="903" class="body">en wordt opgericht.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>