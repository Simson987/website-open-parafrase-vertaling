<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Judiths gebed en vertrouwen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Judiths gebed en vertrouwen</text><text x="44" y="113" class="ref">Judith 9:1–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · Aanroep en herinnering</text><text x="68" y="241" class="body">Judith bidt met as en rouwkleed; zij</text><text x="68" y="284" class="body">herinnert aan Simeon en aan Gods</text><text x="68" y="327" class="body">kennis.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">6–14 · Het verzoek</text><text x="68" y="476" class="body">Tegenover wapentrots vraagt zij kracht</text><text x="68" y="519" class="body">voor haar voorgenomen handelen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">15–19 · Hulp voor de kleinen</text><text x="68" y="668" class="body">Zij belijdt Gods hulp aan zwakken en</text><text x="68" y="711" class="body">vraagt bescherming van huis en volk.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>