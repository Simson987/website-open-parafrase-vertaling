<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Uitlokking en ontdekking</title><desc id="desc">Uitlokking en ontdekking met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uitlokking en ontdekking</text><text x="44" y="113" class="ref">Judith 14:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Judiths plan · 1–5</text><text x="68" y="241" class="body">Wapenrusting aan, tot de pas gaan en de</text><text x="68" y="284" class="body">vlakte niet in trekken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Israël · 8</text><text x="68" y="433" class="body">Bij het aanbreken van de dag trekken</text><text x="68" y="476" class="body">mannen in groepen uit.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De Assyriërs · 8–13</text><text x="68" y="625" class="body">Melden de beweging en willen Holofernes</text><text x="68" y="668" class="body">wakker maken.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De uitkomst · 14–17</text><text x="68" y="817" class="body">Bagoas ontdekt zijn dood en Judiths</text><text x="68" y="860" class="body">afwezigheid; de leiding raakt in</text><text x="68" y="903" class="body">verwarring.</text><text x="46" y="996" class="note">De verwachte reactie uit haar plan en de later</text><text x="46" y="1032" class="note">vertelde uitvoering blijven apart zichtbaar.</text></svg>