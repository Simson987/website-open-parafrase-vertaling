<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Judiths betoog in het kamp</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Judiths betoog in het kamp</text><text x="44" y="113" class="ref">Judith 11:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3 · Holofernes verzekert</text><text x="68" y="241" class="body">Hij belooft veiligheid en vraagt waarom</text><text x="68" y="284" class="body">zij gekomen is.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">4–13 · Judith antwoordt</text><text x="68" y="433" class="body">Zij vleit hem, verwijst naar Achior en</text><text x="68" y="476" class="body">beweert dat Betulia verboden voedsel</text><text x="68" y="519" class="body">wil gebruiken.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">14–17 · Haar toezegging</text><text x="68" y="668" class="body">Nachtelijk gebed, een bericht en</text><text x="68" y="711" class="body">begeleiding naar Jeruzalem worden</text><text x="68" y="754" class="body">beloofd.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">18–21 · De reactie</text><text x="68" y="903" class="body">De woorden bevallen; Holofernes belooft</text><text x="68" y="946" class="body">haar aanzien als zij doet wat zij zegt.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>