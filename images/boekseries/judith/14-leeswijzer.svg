<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Het plan en de ontdekking</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het plan en de ontdekking</text><text x="44" y="113" class="ref">Judith 14:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · Judiths opdracht</text><text x="68" y="241" class="body">Bij zonsopgang gewapend tot de pas; de</text><text x="68" y="284" class="body">vijand zal de aanvoerder zoeken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">6–7 · Achior</text><text x="68" y="433" class="body">Herkenning, Judiths verslag en Achiors</text><text x="68" y="476" class="body">aansluiting bij Israël.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">8–17 · Het kamp in verwarring</text><text x="68" y="625" class="body">De beweging wordt gemeld; Bagoas</text><text x="68" y="668" class="body">ontdekt de dood en de aanvoerders raken</text><text x="68" y="711" class="body">ontzet.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>