<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Tijd en voedsel in het kamp</title><desc id="desc">Tijd en voedsel in het kamp met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tijd en voedsel in het kamp</text><text x="44" y="113" class="ref">Judith 12:1–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eigen eten · 1–4,19</text><text x="68" y="241" class="body">Zij neemt niet van zijn aangeboden</text><text x="68" y="284" class="body">eten; haar dienares bereidt haar eigen</text><text x="68" y="327" class="body">voorraad.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Drie dagen · 7–9</text><text x="68" y="476" class="body">Nachtelijke uitgang, wassen bij de</text><text x="68" y="519" class="body">waterbronnen, gebed en terugkeer.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vierde dag · 10–15</text><text x="68" y="668" class="body">Bagoas nodigt uit; Judith kleedt zich</text><text x="68" y="711" class="body">en haar dienares spreidt de vellen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De maaltijd · 16–20</text><text x="68" y="860" class="body">Judith eet en drinkt; Holofernes drinkt</text><text x="68" y="903" class="body">meer wijn dan ooit op één dag.</text><text x="46" y="996" class="note">De drie dagen en de vierde dag volgen de tekst;</text><text x="46" y="1032" class="note">exacte uren en hoeveelheden wijn zijn niet</text><text x="46" y="1068" class="note">genoemd.</text></svg>