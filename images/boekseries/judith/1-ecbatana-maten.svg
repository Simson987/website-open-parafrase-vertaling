<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Maten van de vesting</title><desc id="desc">Maten van de vesting met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Maten van de vesting</text><text x="44" y="113" class="ref">Judith 1:2–5</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Stenen · vers 2</text><text x="68" y="241" class="body">Drie el breed en zes el lang.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Muur · vers 2 en 4</text><text x="68" y="390" class="body">Zeventig el hoog en vijftig el breed;</text><text x="68" y="433" class="body">fundament zestig el breed.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Torens · vers 3</text><text x="68" y="582" class="body">Honderd el hoog, op de poorten.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Poorten · vers 5</text><text x="68" y="731" class="body">Zeventig el hoog en veertig el breed,</text><text x="68" y="774" class="body">voor het uittrekkende leger.</text><text x="46" y="867" class="note">De maten zijn die van het verhaal; onbekende</text><text x="46" y="903" class="note">details zijn niet tot een bouwtekening</text><text x="46" y="939" class="note">aangevuld.</text></svg>