<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Aanbod en gevolg</title><desc id="desc">Aanbod en gevolg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aanbod en gevolg</text><text x="44" y="113" class="ref">Judith 3:1–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het aanbod</text><text x="68" y="241" class="body">Land, boerderijen, voorraad, kudden,</text><text x="68" y="284" class="body">steden en inwoners staan ter</text><text x="68" y="327" class="body">beschikking.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De ontvangst</text><text x="68" y="476" class="body">Kransen, reidansen en tamboerijnen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat Holofernes doet</text><text x="68" y="625" class="body">Bezet steden, neemt mannen op en</text><text x="68" y="668" class="body">verwoest de heilige bossen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn doel</text><text x="68" y="817" class="body">Alle volken moeten alleen Nebukadnezar</text><text x="68" y="860" class="body">dienen en als god aanroepen.</text><text x="46" y="953" class="note">Het vredesaanbod en de latere vernietiging van</text><text x="46" y="989" class="note">de plaatselijke eredienst blijven onderscheiden.</text></svg>