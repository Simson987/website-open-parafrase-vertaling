<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Leger en duur van het beleg</title><desc id="desc">Leger en duur van het beleg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leger en duur van het beleg</text><text x="44" y="113" class="ref">Judith 7:2,12–13,19–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij Betulia · vers 2</text><text x="68" y="241" class="body">170.000 voetvolk en 12.000 ruiters; de</text><text x="68" y="284" class="body">tros niet meegerekend.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij de bronnen · vers 12</text><text x="68" y="433" class="body">Ammonieten met 5000 Assyriërs nemen</text><text x="68" y="476" class="body">waterleidingen en bronnen in.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het beleg · vers 13</text><text x="68" y="625" class="body">34 dagen; de watervoorraad raakt op.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De belofte · vers 19–20</text><text x="68" y="774" class="body">Nog vijf dagen wachten op hulp; dan zou</text><text x="68" y="817" class="body">Ozias overgave toestaan.</text><text x="46" y="910" class="note">De 170.000 van dit hoofdstuk blijven</text><text x="46" y="946" class="note">onderscheiden van de 120.000 bij de eerdere</text><text x="46" y="982" class="note">uittocht in 2:7.</text></svg>