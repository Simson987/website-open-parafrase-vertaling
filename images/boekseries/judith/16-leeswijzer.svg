<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Danklied en Judiths latere leven</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Danklied en Judiths latere leven</text><text x="44" y="113" class="ref">Judith 16:1–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–14 · De terugblik in het lied</text><text x="68" y="241" class="body">Judith zingt over de redding door de</text><text x="68" y="284" class="body">hand van een vrouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">15–21 · Lof en ontzag</text><text x="68" y="433" class="body">Schepping, smeltende rotsen en oordeel</text><text x="68" y="476" class="body">klinken als poëtische lof.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">22–30 · Daarna in het verhaal</text><text x="68" y="625" class="body">Gaven in Jeruzalem, drie maanden</text><text x="68" y="668" class="body">vreugde, terugkeer en Judiths ouderdom</text><text x="68" y="711" class="body">en dood.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>