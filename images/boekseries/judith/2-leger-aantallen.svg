<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Leger en voorraad</title><desc id="desc">Leger en voorraad met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leger en voorraad</text><text x="44" y="113" class="ref">Judith 2:5–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voetvolk</text><text x="68" y="241" class="body">120.000 uitgelezen mannen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Ruiters</text><text x="68" y="390" class="body">12.000 paarden met ruiters; vers 7</text><text x="68" y="433" class="body">noemt boogschutters te paard.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bagage en voedsel</text><text x="68" y="582" class="body">Veel kamelen en ezels; schapen,</text><text x="68" y="625" class="body">runderen, geiten en graan.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Middelen en gevolg</text><text x="68" y="774" class="body">Veel goud en zilver; een ontelbaar</text><text x="68" y="817" class="body">gemengd gevolg sluit zich aan.</text><text x="46" y="910" class="note">De getelde strijders en het ongetelde gevolg</text><text x="46" y="946" class="note">worden niet als één berekend totaal weergegeven.</text></svg>