<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Overgave zonder behoud</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Overgave zonder behoud</text><text x="44" y="113" class="ref">Judith 3:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–6 · Vredesgezanten</text><text x="68" y="241" class="body">Steden, land en inwoners worden aan</text><text x="68" y="284" class="body">Holofernes aangeboden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">7–9 · Bezetting en ontvangst</text><text x="68" y="433" class="body">Hij bezet steden, neemt mannen op en</text><text x="68" y="476" class="body">wordt met kransen en dans ontvangen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">10–12 · Vernietiging van eredienst</text><text x="68" y="625" class="body">Heilige bossen en goden vernietigd om</text><text x="68" y="668" class="body">alleen Nebukadnezar te laten dienen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">13–14 · Een maand bij het kamp</text><text x="68" y="817" class="body">Tussen Gaba en Scythopolis wacht hij om</text><text x="68" y="860" class="body">de bagage bijeen te brengen.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>