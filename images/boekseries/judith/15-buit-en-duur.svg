<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Buit, duur en ontvangers</title><desc id="desc">Buit, duur en ontvangers met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Buit, duur en ontvangers</text><text x="44" y="113" class="ref">Judith 15:7–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het kamp · 7–8</text><text x="68" y="241" class="body">Betulia en terugkerende strijders nemen</text><text x="68" y="284" class="body">de achtergelaten goederen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dertig dagen · 12</text><text x="68" y="433" class="body">Zo lang plundert het volk volgens het</text><text x="68" y="476" class="body">hoofdstuk het kamp.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Voor Judith · 13</text><text x="68" y="625" class="body">Tent, zilverwerk, bedden, bekkens en</text><text x="68" y="668" class="body">huisraad; vervoer met muildier en</text><text x="68" y="711" class="body">wagens.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De reidans · 14–15</text><text x="68" y="860" class="body">Groene takken en olijftakken, vrouwen</text><text x="68" y="903" class="body">voorop en mannen met lofliederen.</text><text x="46" y="996" class="note">De dertig dagen zijn een tijdsduur; hoeveelheden</text><text x="46" y="1032" class="note">zilver en aantallen wagens zijn niet gegeven.</text></svg>