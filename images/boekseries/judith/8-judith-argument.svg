<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Judiths bezwaar tegen de eed</title><desc id="desc">Judiths bezwaar tegen de eed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Judiths bezwaar tegen de eed</text><text x="44" y="113" class="ref">Judith 8:10–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat zij afwijst</text><text x="68" y="241" class="body">Overgave beloven als God niet binnen</text><text x="68" y="284" class="body">vijf dagen helpt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Haar vraag</text><text x="68" y="433" class="body">Wie zijn jullie om God te onderzoeken</text><text x="68" y="476" class="body">of op de proef te stellen?</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Haar reden</text><text x="68" y="625" class="body">Zelfs een mensenhart is niet te</text><text x="68" y="668" class="body">doorgronden; Gods plannen nog minder.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wat zij vraagt</text><text x="68" y="817" class="body">Wachten op redding en om hulp roepen,</text><text x="68" y="860" class="body">zonder God te dwingen.</text><text x="46" y="953" class="note">De vijf dagen zijn een afspraak van de leiders;</text><text x="46" y="989" class="note">Judith behandelt die niet als een bevel van God.</text></svg>