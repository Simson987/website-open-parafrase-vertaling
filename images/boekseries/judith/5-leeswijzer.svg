<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Achior verklaart Israëls kracht</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Achior verklaart Israëls kracht</text><text x="44" y="113" class="ref">Judith 5:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · Holofernes vraagt</text><text x="68" y="241" class="body">Wie is het bergvolk en waarom verzet</text><text x="68" y="284" class="body">het zich? Achior belooft de waarheid.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">6–22 · De geschiedenis</text><text x="68" y="433" class="body">Chaldea, Mesopotamië, Kanaän, Egypte,</text><text x="68" y="476" class="body">uittocht, land, ballingschap en</text><text x="68" y="519" class="body">terugkeer.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">23–24 · Het advies</text><text x="68" y="668" class="body">Onderzoek hun schuld; als er geen</text><text x="68" y="711" class="body">onrecht is, ga hen voorbij.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">25–27 · De reactie</text><text x="68" y="860" class="body">Het kamp mort en wil Israël aanvallen;</text><text x="68" y="903" class="body">Achior wordt bedreigd.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>