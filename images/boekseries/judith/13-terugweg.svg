<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De terugweg van twee vrouwen</title><desc id="desc">De terugweg van twee vrouwen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De terugweg van twee vrouwen</text><text x="44" y="113" class="ref">Judith 13:11–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij de slaapkamer</text><text x="68" y="241" class="body">Judith geeft het hoofd aan haar</text><text x="68" y="284" class="body">dienstmeisje; die bergt het in de</text><text x="68" y="327" class="body">voedselzak.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Door het kamp</text><text x="68" y="476" class="body">Beiden gaan naar buiten zoals zij</text><text x="68" y="519" class="body">gewend zijn.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Om het dal en de berg op</text><text x="68" y="668" class="body">Zij komen samen bij de poorten van</text><text x="68" y="711" class="body">Betulia.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Binnen de stad</text><text x="68" y="860" class="body">De poort gaat open en men maakt licht</text><text x="68" y="903" class="body">om haar heen.</text><text x="46" y="996" class="note">De volgorde volgt de verzen; er wordt geen</text><text x="46" y="1032" class="note">onbekende route op een kaart ingevuld.</text></svg>