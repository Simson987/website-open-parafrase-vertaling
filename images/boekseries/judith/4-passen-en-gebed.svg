<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Voorbereiding en gebed</title><desc id="desc">Voorbereiding en gebed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voorbereiding en gebed</text><text x="44" y="113" class="ref">Judith 4:3–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Materiële voorbereiding</text><text x="68" y="241" class="body">Boodschappers, bezette bergtoppen,</text><text x="68" y="284" class="body">dorpsmuren en graanvoorraden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De pas · vers 5–6</text><text x="68" y="433" class="body">Bij Betulia en Betomestaïm; hoogstens</text><text x="68" y="476" class="body">twee mannen passen naast elkaar.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het gebed · vers 8–13</text><text x="68" y="625" class="body">Mannen, vrouwen, kinderen,</text><text x="68" y="668" class="body">loonarbeiders en slaven delen de</text><text x="68" y="711" class="body">vernedering en de zorg.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De priesters · vers 16–17</text><text x="68" y="860" class="body">Blijven offers brengen, met rouwkleren</text><text x="68" y="903" class="body">en as, en roepen voor heel Israël.</text><text x="46" y="996" class="note">Verdediging en gebed zijn beide onderdeel van</text><text x="46" y="1032" class="note">het hoofdstuk; de smalle doorgang verklaart de</text><text x="46" y="1068" class="note">opdracht.</text></svg>