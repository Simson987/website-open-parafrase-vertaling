<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Wat Judith Holofernes vertelt</title><desc id="desc">Wat Judith Holofernes vertelt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Judith Holofernes vertelt</text><text x="44" y="113" class="ref">Judith 11:7–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achiors uitgangspunt · 7–8</text><text x="68" y="241" class="body">Israël wordt volgens haar niet</text><text x="68" y="284" class="body">verslagen zonder zonde tegen God.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Haar bewering · 9–13</text><text x="68" y="433" class="body">Zij zegt dat het volk verboden voedsel</text><text x="68" y="476" class="body">en geheiligde voorraden wil gebruiken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Haar belofte · 14–17</text><text x="68" y="625" class="body">Zij zal bidden, bericht brengen en hem</text><text x="68" y="668" class="body">naar Jeruzalem leiden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn antwoord · 18–21</text><text x="68" y="817" class="body">Hij is onder de indruk en belooft haar</text><text x="68" y="860" class="body">een plaats bij de koning.</text><text x="46" y="953" class="note">Dit geeft haar woorden in het gesprek weer; haar</text><text x="46" y="989" class="note">beweringen zijn geen afzonderlijk waargenomen</text><text x="46" y="1025" class="note">gebeurtenissen.</text></svg>