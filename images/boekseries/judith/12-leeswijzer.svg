<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Drie dagen en een maaltijd</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie dagen en een maaltijd</text><text x="44" y="113" class="ref">Judith 12:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–4 · Eigen voorraad</text><text x="68" y="241" class="body">Judith weigert het aangeboden voedsel</text><text x="68" y="284" class="body">en vertrouwt op haar eigen voorraad.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">5–9 · De nachten</text><text x="68" y="433" class="body">Zij krijgt vrije doorgang, wast zich</text><text x="68" y="476" class="body">bij de bronnen en bidt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">10–14 · De uitnodiging</text><text x="68" y="625" class="body">Op de vierde dag stuurt Holofernes</text><text x="68" y="668" class="body">Bagoas naar haar toe.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">15–20 · De maaltijd</text><text x="68" y="817" class="body">De dienares spreidt vellen; Judith eet</text><text x="68" y="860" class="body">eigen voedsel en Holofernes drinkt zeer</text><text x="68" y="903" class="body">veel.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>