<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Judiths huis en leefwijze</title><desc id="desc">Judiths huis en leefwijze met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Judiths huis en leefwijze</text><text x="44" y="113" class="ref">Judith 8:2–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Manasse</text><text x="68" y="241" class="body">Haar man uit dezelfde stam en familie;</text><text x="68" y="284" class="body">overleden tijdens de gersteoogst.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Weduwschap</text><text x="68" y="433" class="body">Drie jaar en vier maanden; weduwekleren</text><text x="68" y="476" class="body">en een tent op het dak.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vasten</text><text x="68" y="625" class="body">Behalve sabbat, de dag ervoor, nieuwe</text><text x="68" y="668" class="body">maan, de dag ervoor en de feest- en</text><text x="68" y="711" class="body">vreugdedagen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Haar bezit en naam</text><text x="68" y="860" class="body">Goud, zilver, knechten, vee en akkers;</text><text x="68" y="903" class="body">niemand kon kwaad over haar zeggen.</text><text x="46" y="996" class="note">Dit beschrijft haar eigen leefwijze in het</text><text x="46" y="1032" class="note">verhaal; er wordt geen kind of erfgenaam</text><text x="46" y="1068" class="note">toegevoegd.</text></svg>