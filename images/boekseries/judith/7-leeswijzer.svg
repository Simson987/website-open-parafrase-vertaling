<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Waterblokkade en vijf dagen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waterblokkade en vijf dagen</text><text x="44" y="113" class="ref">Judith 7:1–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–7 · De belegering</text><text x="68" y="241" class="body">Leger en kamp bij Betulia;</text><text x="68" y="284" class="body">torenwachten, verkenning en bezette</text><text x="68" y="327" class="body">bron.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">8–12 · Het plan</text><text x="68" y="476" class="body">Water afsnijden en bergtoppen bewaken</text><text x="68" y="519" class="body">in plaats van bestormen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">13–18 · De nood</text><text x="68" y="668" class="body">Na vierendertig dagen zijn de bakken</text><text x="68" y="711" class="body">leeg; het volk wil overgave.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">19–20 · Ozias’ belofte</text><text x="68" y="860" class="body">Nog vijf dagen standhouden; daarna wil</text><text x="68" y="903" class="body">hij doen wat het volk vraagt.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>