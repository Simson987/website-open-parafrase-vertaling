<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Waar Judith kracht zoekt</title><desc id="desc">Waar Judith kracht zoekt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waar Judith kracht zoekt</text><text x="44" y="113" class="ref">Judith 9:6–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het leger · vers 6</text><text x="68" y="241" class="body">Vertrouwt op paarden, ruiters, voetvolk</text><text x="68" y="284" class="body">en wapens.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Haar verzoek · vers 12–14</text><text x="68" y="433" class="body">Kracht in haar hand en het breken van</text><text x="68" y="476" class="body">hoogmoed door een vrouw.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Haar belijdenis · vers 15</text><text x="68" y="625" class="body">God helpt kleinen en zwakken en redt</text><text x="68" y="668" class="body">wie geen hoop hebben.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Haar doel · vers 18–19</text><text x="68" y="817" class="body">Bescherming van verbond, heilig huis en</text><text x="68" y="860" class="body">het volk Israël.</text><text x="46" y="953" class="note">Dit ordent Judiths gebed. De hulp aan de kleinen</text><text x="46" y="989" class="note">is een belijdenis, geen afzonderlijk verteld</text><text x="46" y="1025" class="note">voorval.</text></svg>