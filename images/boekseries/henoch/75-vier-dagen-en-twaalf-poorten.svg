<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Vier dagen en twaalf poorten</title><desc id="desc">Vier dagen en twaalf poorten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier dagen en twaalf poorten</text><text x="44" y="113" class="ref">Henoch 75:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vier dagen · 1–2</text><text x="68" y="241" class="body">Toegevoegde dagen; poorten 1, 3, 4 en</text><text x="68" y="284" class="body">6; 364 wereldstandplaatsen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Uriël · 3</text><text x="68" y="433" class="body">Toont tekenen, tijden, jaren en dagen</text><text x="68" y="476" class="body">van zon, maan en sterren.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twaalf poorten · 4–7</text><text x="68" y="625" class="body">Stralen en warmte; ook wind, dauw en</text><text x="68" y="668" class="body">vele vensters worden genoemd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De wagens · 8–9</text><text x="68" y="817" class="body">Boven en onder de poorten; één groter</text><text x="68" y="860" class="body">dan alle andere.</text><text x="46" y="953" class="note">De vier toegevoegde dagen en de twaalf poorten</text><text x="46" y="989" class="note">zijn verschillende tellingen binnen het visioen.</text></svg>