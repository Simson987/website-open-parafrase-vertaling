<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Runderen in de tweede droom</title><desc id="desc">Runderen in de tweede droom met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Runderen in de tweede droom</text><text x="44" y="113" class="ref">Henoch 85:3–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin · 3</text><text x="68" y="241" class="body">Witte stier, eerste vaars, zwart en</text><text x="68" y="284" class="body">rood kalf.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verdwijning · 4–7</text><text x="68" y="433" class="body">Zwart kalf stoot en achtervolgt rood</text><text x="68" y="476" class="body">kalf; de vaars zoekt en wordt door de</text><text x="68" y="519" class="body">eerste stier gerustgesteld.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zwarte lijn · 5</text><text x="68" y="668" class="body">Het zwarte kalf groeit op; veel</text><text x="68" y="711" class="body">runderen lijken op hem en volgen hem.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Witte lijn · 8–9</text><text x="68" y="860" class="body">Een andere witte stier wordt geboren;</text><text x="68" y="903" class="body">veel gelijkende witte runderen volgen.</text><text x="46" y="996" class="note">De dieren blijven droomfiguren; er worden geen</text><text x="46" y="1032" class="note">persoonsnamen ingevuld die dit hoofdstuk zelf</text><text x="46" y="1068" class="note">niet noemt.</text></svg>