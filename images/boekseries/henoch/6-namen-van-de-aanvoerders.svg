<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1217" viewBox="0 0 840 1217" role="img" aria-labelledby="title desc"><title id="title">Namen van de aanvoerders</title><desc id="desc">Namen van de aanvoerders met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1217" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Namen van de aanvoerders</text><text x="44" y="113" class="ref">Henoch 6:7–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3</text><text x="68" y="241" class="body">Semjaza · Urakibarameël · Akibeël</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">4–6</text><text x="68" y="390" class="body">Tamiël · Ramuël · Danël</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">7–9</text><text x="68" y="539" class="body">Ezekeël · Sarakujal · Asaël</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">10–12</text><text x="68" y="688" class="body">Armars · Batreal · Anani</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">13–15</text><text x="68" y="837" class="body">Zakebe · Samsaweël · Sartaël</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">16–18</text><text x="68" y="986" class="body">Turël · Jomjaël · Arazjal</text><text x="46" y="1079" class="note">Deze plaatselijke lijst bevat 18 namen. Het</text><text x="46" y="1115" class="note">verhaal noemt in totaal 200 engelen, niet 200</text><text x="46" y="1151" class="note">aanvoerders.</text></svg>