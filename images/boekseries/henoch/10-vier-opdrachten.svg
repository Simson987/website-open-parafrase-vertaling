<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De vier opdrachten</title><desc id="desc">De vier opdrachten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vier opdrachten</text><text x="44" y="113" class="ref">Henoch 10:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Arsjelaljur · 1–3</text><text x="68" y="241" class="body">Waarschuw de zoon van Lamech voor de</text><text x="68" y="284" class="body">vloed en leer hem ontkomen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rafaël · 4–8</text><text x="68" y="433" class="body">Bind Azazel in Dudaël, bedek hem en</text><text x="68" y="476" class="body">kondig genezing van de aarde aan.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gabriël · 9–10</text><text x="68" y="625" class="body">Keer je tegen de kinderen van de</text><text x="68" y="668" class="body">wachters; zij zullen elkaar</text><text x="68" y="711" class="body">vernietigen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Michaël · 11–15</text><text x="68" y="860" class="body">Kondig het oordeel aan Semjaza en zijn</text><text x="68" y="903" class="body">groep aan; binding tot het oordeel.</text><text x="46" y="996" class="note">Arsjelaljur en Rafaël zijn hier verschillende</text><text x="46" y="1032" class="note">namen met verschillende opdrachten; zij worden</text><text x="46" y="1068" class="note">niet met namen uit andere lijsten vervangen.</text></svg>