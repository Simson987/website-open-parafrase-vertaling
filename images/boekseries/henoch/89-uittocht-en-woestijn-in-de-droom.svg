<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Uittocht en woestijn in de droom</title><desc id="desc">Uittocht en woestijn in de droom met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uittocht en woestijn in de droom</text><text x="44" y="113" class="ref">Henoch 89:15–40</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onderdrukking · 15–20</text><text x="68" y="241" class="body">Wolven onderdrukken; een ontsnapt</text><text x="68" y="284" class="body">schaap krijgt een opdracht en een</text><text x="68" y="327" class="body">metgezel.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zee · 21–27</text><text x="68" y="476" class="body">Schapen vertrekken; zee splitst;</text><text x="68" y="519" class="body">vervolgende wolven komen om.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Woestijn en rots · 28–35</text><text x="68" y="668" class="body">Water en gras; rotsbeklimming; ogen</text><text x="68" y="711" class="body">worden blind, schapen dwalen af.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Huis en oversteek · 36–40</text><text x="68" y="860" class="body">Leidend schaap wordt mens; bouwt huis;</text><text x="68" y="903" class="body">leiders slapen in; kudde trekt naar</text><text x="68" y="946" class="body">goed land.</text><text x="46" y="1039" class="note">De zichtbare zee- en rotsscènes worden door een</text><text x="46" y="1075" class="note">tijdvolgorde verbonden; dit blijft dierlijke</text><text x="46" y="1111" class="note">beeldspraak.</text></svg>