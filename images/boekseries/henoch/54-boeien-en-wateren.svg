<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Boeien en wateren</title><desc id="desc">Boeien en wateren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boeien en wateren</text><text x="44" y="113" class="ref">Henoch 54:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het vuur · 1–3</text><text x="68" y="241" class="body">Dal, koningen en machtigen; ijzeren</text><text x="68" y="284" class="body">ketenen worden vervaardigd.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De bestemming · 4–6</text><text x="68" y="433" class="body">Het leger van Azazel; Michaël, Gabriël,</text><text x="68" y="476" class="body">Rafaël en Fanuël voeren het oordeel</text><text x="68" y="519" class="body">uit.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De wateren · 7–8</text><text x="68" y="668" class="body">Schatkamers boven de hemel en bronnen</text><text x="68" y="711" class="body">beneden worden geopend en verenigd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De uitkomst · 9–10</text><text x="68" y="860" class="body">De aardbewoners erkennen hun onrecht en</text><text x="68" y="903" class="body">gaan te gronde.</text><text x="46" y="996" class="note">Mannelijk en vrouwelijk water zijn termen van de</text><text x="46" y="1032" class="note">kosmologische beeldtaal van vers 8, geen moderne</text><text x="46" y="1068" class="note">waterclassificatie.</text></svg>