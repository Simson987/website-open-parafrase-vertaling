<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Troost en spot onderscheiden</title><desc id="desc">Troost en spot onderscheiden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Troost en spot onderscheiden</text><text x="44" y="113" class="ref">Henoch 102:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schrik · 1–3</text><text x="68" y="241" class="body">Vuur, beroerde hemellichten, bevende</text><text x="68" y="284" class="body">aarde en engelen in opdracht.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Troost · 4–5</text><text x="68" y="433" class="body">De zielen van rechtvaardigen hoeven</text><text x="68" y="476" class="body">niet bang te zijn; wachten op het</text><text x="68" y="519" class="body">gericht.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De tegenstem · 6–9</text><text x="68" y="668" class="body">Zondaars spotten: allen sterven, wat</text><text x="68" y="711" class="body">baat hun goedheid? Zij beroemen zich op</text><text x="68" y="754" class="body">bezit.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De spanning · 10–11</text><text x="68" y="903" class="body">Een vredig einde zonder geweld, maar</text><text x="68" y="946" class="body">nog benauwdheid in het dodenrijk.</text><text x="46" y="1039" class="note">De spotstem is geen conclusie van het boek. De</text><text x="46" y="1075" class="note">volgende hoofdstukken beantwoorden de gestelde</text><text x="46" y="1111" class="note">vraag naar het lot van rechtvaardigen.</text></svg>