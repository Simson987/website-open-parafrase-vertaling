<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Bewaring en veranderend water</title><desc id="desc">Bewaring en veranderend water met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bewaring en veranderend water</text><text x="44" y="113" class="ref">Henoch 67:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De bewaring · 1–3</text><text x="68" y="241" class="body">Noach, houten bouwwerk door engelen en</text><text x="68" y="284" class="body">toekomst voor zijn nageslacht.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het dal · 4–7</text><text x="68" y="433" class="body">Vuur, metaalbergen, zwavel en onrustige</text><text x="68" y="476" class="body">wateren; straf voor verleidende</text><text x="68" y="519" class="body">engelen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het dubbele gebruik · 8–10</text><text x="68" y="668" class="body">Genezing van ziel en lichaam, maar</text><text x="68" y="711" class="body">oordeel van de geest bij de machtigen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De verandering · 11–13</text><text x="68" y="860" class="body">Hitte en koude wisselen; Michaël duidt</text><text x="68" y="903" class="body">het oordeel als getuigenis voor</text><text x="68" y="946" class="body">koningen.</text><text x="46" y="1039" class="note">Het hoofdstuk beschrijft visionaire</text><text x="46" y="1075" class="note">oordeelswateren; er wordt geen geneeskundige</text><text x="46" y="1111" class="note">werking aan werkelijke bronnen toegekend.</text></svg>