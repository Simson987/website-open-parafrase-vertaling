<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Van verbinding naar aanklacht</title><desc id="desc">Van verbinding naar aanklacht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van verbinding naar aanklacht</text><text x="44" y="113" class="ref">Henoch 7:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin · 1</text><text x="68" y="241" class="body">Verbinding met vrouwen en onderwijs in</text><text x="68" y="284" class="body">bezweringen, wortels en planten.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De reuzen · 2</text><text x="68" y="433" class="body">De tekst noemt een lengte van 3.000 el.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De uitputting · 3–5</text><text x="68" y="582" class="body">Voortbrengselen raken op; geweld richt</text><text x="68" y="625" class="body">zich tegen mensen en dieren.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het antwoord · 6</text><text x="68" y="774" class="body">De aarde brengt een aanklacht tegen de</text><text x="68" y="817" class="body">goddelozen in.</text><text x="46" y="910" class="note">De extreme maat behoort tot de apocalyptische</text><text x="46" y="946" class="note">vertelling; de illustratie is geen schaalmodel.</text><text x="46" y="982" class="note">De aanklagende aarde is personificatie.</text></svg>