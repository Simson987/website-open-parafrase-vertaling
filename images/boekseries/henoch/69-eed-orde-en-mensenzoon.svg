<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Eed, orde en Mensenzoon</title><desc id="desc">Eed, orde en Mensenzoon met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eed, orde en Mensenzoon</text><text x="44" y="113" class="ref">Henoch 69:13–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eed · 13–15</text><text x="68" y="241" class="body">Kasbeël, ook Biqa genoemd, en de eed</text><text x="68" y="284" class="body">Akaë in Michaëls hand.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vaste orde · 16–23</text><text x="68" y="433" class="body">Hemel, aarde, zee, diepten, zon, maan,</text><text x="68" y="476" class="body">sterren, winden en weersschatkamers.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De lof · 24–26</text><text x="68" y="625" class="body">Dank als voedsel; bewaarde banen en</text><text x="68" y="668" class="body">vreugde om de bekendgemaakte naam.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het slot · 27–30</text><text x="68" y="817" class="body">Oordeel door de Mensenzoon, einde van</text><text x="68" y="860" class="body">verderf en slot van de derde</text><text x="68" y="903" class="body">gelijkenis.</text><text x="46" y="996" class="note">Kasdeja uit vers 12 en Kasbeël uit vers 13</text><text x="46" y="1032" class="note">blijven verschillende namen. De eed wordt</text><text x="46" y="1068" class="note">beschreven, niet als ritueel aangeleerd.</text></svg>