<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Nieuw huis en verandering</title><desc id="desc">Nieuw huis en verandering met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nieuw huis en verandering</text><text x="44" y="113" class="ref">Henoch 90:28–42</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Huiswisseling · 28–30</text><text x="68" y="241" class="body">Oude huis opgerold en naar het zuiden;</text><text x="68" y="284" class="body">groter nieuw huis op de vroegere</text><text x="68" y="327" class="body">plaats.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gemeenschap · 31–36</text><text x="68" y="476" class="body">Henoch bij witte schapen; terugkeer;</text><text x="68" y="519" class="body">zwaard verzegeld; alle ogen open.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verandering · 37–38</text><text x="68" y="668" class="body">Witte stier met grote horens; allen</text><text x="68" y="711" class="body">worden witte runderen; eerste wordt een</text><text x="68" y="754" class="body">woord en een groot dier.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Ontwaken · 39–42</text><text x="68" y="903" class="body">Henoch wordt wakker, looft en huilt;</text><text x="68" y="946" class="body">denkt aan zijn eerste droom.</text><text x="46" y="1039" class="note">Het woord uit vers 38 blijft staan; het wordt</text><text x="46" y="1075" class="note">niet stilzwijgend vervangen door een andere</text><text x="46" y="1111" class="note">lezing of een persoonsnaam.</text></svg>