<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Het antwoord op het verzoek</title><desc id="desc">Het antwoord op het verzoek met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het antwoord op het verzoek</text><text x="44" y="113" class="ref">Henoch 14:1–8,24–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De schrijver · 1–3</text><text x="68" y="241" class="body">Henoch geeft het in zijn slaap geziene</text><text x="68" y="284" class="body">visioen in menselijke woorden door.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het verzoek · 4–7</text><text x="68" y="433" class="body">Wordt niet ingewilligd; binding, geen</text><text x="68" y="476" class="body">hemelopgang en ondergang van hun zonen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De hemelwaartse beweging · 8</text><text x="68" y="625" class="body">Wolken, nevel, sterren, bliksem en wind</text><text x="68" y="668" class="body">voeren Henoch omhoog.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De roep · 24–25</text><text x="68" y="817" class="body">Henoch ligt bevend neer, wordt geroepen</text><text x="68" y="860" class="body">en tot de deur gebracht met</text><text x="68" y="903" class="body">neergeslagen gezicht.</text><text x="46" y="996" class="note">Het antwoord en de hemelse ruimte behoren tot</text><text x="46" y="1032" class="note">hetzelfde vertelde droomvisioen.</text></svg>