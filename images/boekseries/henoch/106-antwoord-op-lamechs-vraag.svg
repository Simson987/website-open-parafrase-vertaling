<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Antwoord op Lamechs vraag</title><desc id="desc">Antwoord op Lamechs vraag met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Antwoord op Lamechs vraag</text><text x="44" y="113" class="ref">Henoch 106:13–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achtergrond · 13–14</text><text x="68" y="241" class="body">Overtreding in het geslacht van Jered,</text><text x="68" y="284" class="body">Henochs vader; vermenging door engelen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Watervloed · 15–16</text><text x="68" y="433" class="body">Groot verderf in één jaar; de zoon en</text><text x="68" y="476" class="body">zijn drie kinderen blijven over.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Naam en bevestiging · 18</text><text x="68" y="625" class="body">Aan Lamech doorgeven: werkelijk zijn</text><text x="68" y="668" class="body">eigen zoon; noem hem Noach.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vervolg · 17,19</text><text x="68" y="817" class="body">Reuzen, reiniging en later meer onrecht</text><text x="68" y="860" class="body">worden genoemd.</text><text x="46" y="953" class="note">Jered is Henochs vader; de drie kinderen zijn</text><text x="46" y="989" class="note">die van Noach. Het schema voegt hun hier</text><text x="46" y="1025" class="note">ongenoemde namen niet toe.</text></svg>