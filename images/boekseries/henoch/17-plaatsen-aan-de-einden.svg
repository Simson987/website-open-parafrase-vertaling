<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Plaatsen aan de einden</title><desc id="desc">Plaatsen aan de einden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plaatsen aan de einden</text><text x="44" y="113" class="ref">Henoch 17:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste plaatsen · 1–3</text><text x="68" y="241" class="body">Vuurachtige wezens, duisternis, hoge</text><text x="68" y="284" class="body">berg en vuurwapens.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Water en vuur · 4–5</text><text x="68" y="433" class="body">Sprekend levenswater, westelijk vuur en</text><text x="68" y="476" class="body">een vuurrivier naar de zee.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De donkerte · 6–7</text><text x="68" y="625" class="body">Rivieren, een ontoegankelijke plaats,</text><text x="68" y="668" class="body">winterbergen en uitstromend</text><text x="68" y="711" class="body">afgrondwater.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het slot · 8</text><text x="68" y="860" class="body">Monden van de rivieren en de mond van</text><text x="68" y="903" class="body">de afgrond.</text><text x="46" y="996" class="note">De opsomming volgt de reis in het visioen en</text><text x="46" y="1032" class="note">vormt geen moderne aardrijkskundige route.</text></svg>