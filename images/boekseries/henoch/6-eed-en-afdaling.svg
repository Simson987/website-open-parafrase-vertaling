<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Eed en afdaling</title><desc id="desc">Eed en afdaling met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eed en afdaling</text><text x="44" y="113" class="ref">Henoch 6:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het plan · 1–2</text><text x="68" y="241" class="body">Hemelse engelen willen vrouwen uit de</text><text x="68" y="284" class="body">mensen kiezen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vrees · 3</text><text x="68" y="433" class="body">Semjaza vreest alleen voor de zonde te</text><text x="68" y="476" class="body">zullen boeten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De eed · 4–5</text><text x="68" y="625" class="body">Allen binden zich om het plan</text><text x="68" y="668" class="body">gezamenlijk uit te voeren.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De plaats en groep · 6–8</text><text x="68" y="817" class="body">200 engelen dalen af op Ardis, de top</text><text x="68" y="860" class="body">van Hermon; de naam wordt met de eed</text><text x="68" y="903" class="body">verbonden.</text><text x="46" y="996" class="note">Het schema volgt het verhaal en de</text><text x="46" y="1032" class="note">naamverklaring van dit hoofdstuk; de namen</text><text x="46" y="1068" class="note">worden niet met lijsten elders gelijkgetrokken.</text></svg>