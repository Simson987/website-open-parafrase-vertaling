<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Maanlicht met maat</title><desc id="desc">Maanlicht met maat met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Maanlicht met maat</text><text x="44" y="113" class="ref">Henoch 73:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het kleine licht · 1–3</text><text x="68" y="241" class="body">Schijf en door wind gedreven wagen;</text><text x="68" y="284" class="body">licht met maat en veranderende opkomst.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het begin · 4–6</text><text x="68" y="433" class="body">Eerste schijnsel op de dertigste</text><text x="68" y="476" class="body">ochtend; zevende delen en halve delen</text><text x="68" y="519" class="body">worden genoemd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Samen en uiteen · 7–8</text><text x="68" y="668" class="body">Samen opgaan en ondergaan met de zon,</text><text x="68" y="711" class="body">daarna van haar opkomst afwijken.</text><text x="46" y="804" class="note">De breuken en veertien lichtdelen horen bij dit</text><text x="46" y="840" class="note">oude tekstmodel; de illustraties zijn geen</text><text x="46" y="876" class="note">moderne maanfaseberekening.</text></svg>