<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Rammen, huis en getuigen</title><desc id="desc">Rammen, huis en getuigen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rammen, huis en getuigen</text><text x="44" y="113" class="ref">Henoch 89:41–58</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Open en blinde ogen · 41–44</text><text x="68" y="241" class="body">Leidend schaap, eerste ram en</text><text x="68" y="284" class="body">bedreiging door honden, vossen en wilde</text><text x="68" y="327" class="body">zwijnen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tweede ram · 45–49</text><text x="68" y="476" class="body">Een andere ram aangesteld; achtervolgd;</text><text x="68" y="519" class="body">wordt leider; klein schaap volgt hem</text><text x="68" y="562" class="body">op.</text><rect x="42" y="620" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Huis en toren · 50</text><text x="68" y="711" class="body">Laag huis met hoge toren; volle tafel.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Afval en getuigen · 51–58</text><text x="68" y="860" class="body">Weggaan; gezonden schapen verworpen;</text><text x="68" y="903" class="body">één wordt gered en naar Henoch gevoerd;</text><text x="68" y="946" class="body">roofdieren krijgen de kudde.</text><text x="46" y="1039" class="note">Het schema vult geen konings- of profetennamen</text><text x="46" y="1075" class="note">in; de opeenvolging volgt alleen de</text><text x="46" y="1111" class="note">droomwoorden.</text></svg>