<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Woorden, keuze en uitbuiting</title><desc id="desc">Woorden, keuze en uitbuiting met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Woorden, keuze en uitbuiting</text><text x="44" y="113" class="ref">Henoch 99:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verdraaide woorden · 1–3</text><text x="68" y="241" class="body">Leugentaal tegenover gebeden als</text><text x="68" y="284" class="body">getuigenis.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Beroering · 4–6</text><text x="68" y="433" class="body">Volken in nood; kinderen verlaten;</text><text x="68" y="476" class="body">geweld aangekondigd.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Afgoden en wijsheid · 7–10</text><text x="68" y="625" class="body">Geen hulp bij afgoden; redding voor wie</text><text x="68" y="668" class="body">wijsheid aannemen en rechtvaardig</text><text x="68" y="711" class="body">leven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Uitbuiting · 11–16</text><text x="68" y="860" class="body">Kwaadspreken, bedrieglijk fundament,</text><text x="68" y="903" class="body">huizen uit andermans arbeid en geweld.</text><text x="46" y="996" class="note">De kinderen-in-noodpassage wordt zakelijk in de</text><text x="46" y="1032" class="note">leeswijzer opgenomen; de drie bestaande beelden</text><text x="46" y="1068" class="note">tonen de hoofdtegenstellingen zonder leed uit te</text><text x="46" y="1104" class="note">beelden.</text></svg>