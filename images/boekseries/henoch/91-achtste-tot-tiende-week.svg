<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De achtste tot tiende week</title><desc id="desc">De achtste tot tiende week met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De achtste tot tiende week</text><text x="44" y="113" class="ref">Henoch 91:12–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achtste week · 12–13</text><text x="68" y="241" class="body">Gerechtigheid en gericht; huizen en een</text><text x="68" y="284" class="body">huis voor de grote Koning.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Negende week · 14</text><text x="68" y="433" class="body">Gericht bekend aan de hele wereld;</text><text x="68" y="476" class="body">goddeloos werk verdwijnt.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tiende week · 15–16</text><text x="68" y="625" class="body">In het zevende deel: eeuwig gericht</text><text x="68" y="668" class="body">over wachters; nieuwe hemel en</text><text x="68" y="711" class="body">zevenvoudig licht.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Daarna · 17–19</text><text x="68" y="860" class="body">Ontelbare weken in gerechtigheid;</text><text x="68" y="903" class="body">kinderen kiezen de goede paden.</text><text x="46" y="996" class="note">De eerste tot zevende week staan in hoofdstuk</text><text x="46" y="1032" class="note">93. De plaatselijke boekvolgorde wordt behouden</text><text x="46" y="1068" class="note">zonder moderne jaartallen.</text></svg>