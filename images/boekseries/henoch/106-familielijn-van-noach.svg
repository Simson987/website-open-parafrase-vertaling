<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Familielijn van Noach</title><desc id="desc">Familielijn van Noach met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familielijn van Noach</text><text x="44" y="113" class="ref">Henoch 106:1,4,7–18</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Henoch</text><text x="68" y="241" class="body">Vader van Metuselach; geeft de uitleg.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Metuselach</text><text x="68" y="390" class="body">Vader van Lamech; gaat met diens vraag</text><text x="68" y="433" class="body">naar Henoch.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Lamech</text><text x="68" y="582" class="body">Vader van de pasgeboren Noach; zijn</text><text x="68" y="625" class="body">twijfel wordt weersproken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Noach</text><text x="68" y="774" class="body">Werkelijk Lamechs zoon; wordt met zijn</text><text x="68" y="817" class="body">drie kinderen gered.</text><text x="46" y="910" class="note">De hoofdstuktekst bevestigt menselijk</text><text x="46" y="946" class="note">vaderschap; Lamechs vermoeden van engelenafkomst</text><text x="46" y="982" class="note">wordt niet als feit opgenomen.</text></svg>