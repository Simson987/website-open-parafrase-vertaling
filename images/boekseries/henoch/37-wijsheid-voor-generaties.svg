<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Wijsheid voor generaties</title><desc id="desc">Wijsheid voor generaties met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijsheid voor generaties</text><text x="44" y="113" class="ref">Henoch 37:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het kader · 1</text><text x="68" y="241" class="body">Een tweede visioen van wijsheid, gezien</text><text x="68" y="284" class="body">door Henoch.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De hoorders · 2–3</text><text x="68" y="433" class="body">Wie vroeger waren en wie later komen;</text><text x="68" y="476" class="body">de wijsheid wordt niet onthouden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De gave · 4</text><text x="68" y="625" class="body">Ontvangen naar de wil van de Heere van</text><text x="68" y="668" class="body">de geesten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vorm · 5</text><text x="68" y="817" class="body">Drie gelijkenissen worden voor de</text><text x="68" y="860" class="body">aardbewoners uitgesproken.</text><text x="46" y="953" class="note">Dit is de aanhef van de drie gelijkenissen; hun</text><text x="46" y="989" class="note">volledige inhoud staat niet al in dit korte</text><text x="46" y="1025" class="note">hoofdstuk.</text></svg>