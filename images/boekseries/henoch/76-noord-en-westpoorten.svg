<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1425" viewBox="0 0 840 1425" role="img" aria-labelledby="title desc"><title id="title">Windpoorten: noord en west</title><desc id="desc">Windpoorten: noord en west met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1425" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Windpoorten: noord en west</text><text x="44" y="113" class="ref">Henoch 76:10–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Noord · eerste · 10</text><text x="68" y="241" class="body">Naar oost en zuid: dauw, regen,</text><text x="68" y="284" class="body">sprinkhanen en verwoesting.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Noord · midden · 11</text><text x="68" y="433" class="body">Regen, dauw, leven en vrede.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Noord · derde · 11</text><text x="68" y="582" class="body">Naar west en noord: wolk, rijp, sneeuw,</text><text x="68" y="625" class="body">regen, dauw en sprinkhanen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">West · eerste · 12</text><text x="68" y="774" class="body">Naar noord: dauw, regen, rijp, kou,</text><text x="68" y="817" class="body">sneeuw en vorst.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">West · midden · 13</text><text x="68" y="966" class="body">Dauw, regen, vrede en zegen.</text><rect x="42" y="1024" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1067" class="label">West · laatste · 13</text><text x="68" y="1115" class="body">Naar zuid: droogte, verwoesting, brand</text><text x="68" y="1158" class="body">en verderf.</text><text x="46" y="1251" class="note">Vers 12 spreekt van vier westenwinden; de</text><text x="46" y="1287" class="note">daaropvolgende opsomming noemt drie poorten en</text><text x="46" y="1323" class="note">vers 14 twaalf in totaal. Het schema bewaart die</text><text x="46" y="1359" class="note">spanning.</text></svg>