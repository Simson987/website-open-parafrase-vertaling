<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1217" viewBox="0 0 840 1217" role="img" aria-labelledby="title desc"><title id="title">Zonnepoorten: de eerste helft</title><desc id="desc">Zonnepoorten: de eerste helft met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1217" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zonnepoorten: de eerste helft</text><text x="44" y="113" class="ref">Henoch 72:6–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1 · poort 4 · 30 ochtenden</text><text x="68" y="241" class="body">Eindstand: dag 10 delen, nacht 8.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">2 · poort 5 · 30 ochtenden</text><text x="68" y="390" class="body">Eindstand: dag 11 delen, nacht 7.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">3 · poort 6 · 31 ochtenden</text><text x="68" y="539" class="body">Eindstand: dag 12 delen, nacht 6.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">4 · poort 6 · 30 ochtenden</text><text x="68" y="688" class="body">Eindstand: dag 11 delen, nacht 7.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">5 · poort 5 · 30 ochtenden</text><text x="68" y="837" class="body">Eindstand: dag 10 delen, nacht 8.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">6 · poort 4 · 31 ochtenden</text><text x="68" y="986" class="body">Eindstand: dag 9 delen, nacht 9.</text><text x="46" y="1079" class="note">Oostelijke opkomst en westelijke ondergang</text><text x="46" y="1115" class="note">gebruiken telkens hetzelfde poortnummer. Dit is</text><text x="46" y="1151" class="note">het tekstmodel.</text></svg>