<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De aanklacht voor de hemel</title><desc id="desc">De aanklacht voor de hemel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De aanklacht voor de hemel</text><text x="44" y="113" class="ref">Henoch 9:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vier · 1</text><text x="68" y="241" class="body">Michaël, Gabriël, Surjan en Urjan zien</text><text x="68" y="284" class="body">het onrecht.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vraag · 2–3</text><text x="68" y="433" class="body">Het geschreeuw bereikt de hemel; de</text><text x="68" y="476" class="body">gestorvenen vragen hun zaak voor te</text><text x="68" y="519" class="body">leggen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De belijdenis · 4–5</text><text x="68" y="668" class="body">God ziet en weet alles; niets kan</text><text x="68" y="711" class="body">verborgen blijven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De beschuldiging · 6–10</text><text x="68" y="860" class="body">Azazel, Semjaza, verbindingen en het</text><text x="68" y="903" class="body">geweld worden genoemd.</text><rect x="42" y="961" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De open vraag · 11</text><text x="68" y="1052" class="body">Wat moeten de hemelse heiligen doen?</text><text x="46" y="1145" class="note">De roep van de gestorvenen en het hemelse</text><text x="46" y="1181" class="note">overleg behoren tot de apocalyptische</text><text x="46" y="1217" class="note">verhaalwereld.</text></svg>