<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Winden, bergen en sterren</title><desc id="desc">Winden, bergen en sterren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Winden, bergen en sterren</text><text x="44" y="113" class="ref">Henoch 18:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De winden · 1–5</text><text x="68" y="241" class="body">Schatkamers, dragende winden,</text><text x="68" y="284" class="body">hemelgewelf en paden van engelen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De bergen · 6–9</text><text x="68" y="433" class="body">Zeven bergen; een middelste als troon</text><text x="68" y="476" class="body">met saffieren top.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De kloof · 10–12</text><text x="68" y="625" class="body">Wateren, vuurpilaren en een woeste</text><text x="68" y="668" class="body">plaats zonder gewelf of fundament.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De zeven sterren · 13–16</text><text x="68" y="817" class="body">Als brandende bergen; gevangen wegens</text><text x="68" y="860" class="body">het overtreden van hun vastgestelde</text><text x="68" y="903" class="body">tijd.</text><text x="46" y="996" class="note">De sterren worden hier als overtreders geduid;</text><text x="46" y="1032" class="note">de landschappen behoren tot het apocalyptische</text><text x="46" y="1068" class="note">visioen.</text></svg>