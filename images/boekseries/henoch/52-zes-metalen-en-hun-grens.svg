<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Zes metalen en hun grens</title><desc id="desc">Zes metalen en hun grens met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes metalen en hun grens</text><text x="44" y="113" class="ref">Henoch 52:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zes bergen · 2,6</text><text x="68" y="241" class="body">IJzer · koper · zilver · goud · zacht</text><text x="68" y="284" class="body">metaal · lood.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De uitleg · 3–6</text><text x="68" y="433" class="body">Zullen de Gezalfde dienen en voor de</text><text x="68" y="476" class="body">Uitverkorene krachteloos worden, als</text><text x="68" y="519" class="body">was voor vuur.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Rijkdom · 7</text><text x="68" y="668" class="body">Goud en zilver bieden geen ontsnapping.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bewapening · 8–9</text><text x="68" y="817" class="body">IJzer, brons, tin en lood helpen niet;</text><text x="68" y="860" class="body">zij verdwijnen bij zijn verschijning.</text><text x="46" y="953" class="note">Zacht metaal uit de bergenlijst blijft zo</text><text x="46" y="989" class="note">genoemd; het wordt niet stilzwijgend door tin</text><text x="46" y="1025" class="note">vervangen.</text></svg>