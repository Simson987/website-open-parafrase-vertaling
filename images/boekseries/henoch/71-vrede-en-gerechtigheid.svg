<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Vrede en gerechtigheid</title><desc id="desc">Vrede en gerechtigheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrede en gerechtigheid</text><text x="44" y="113" class="ref">Henoch 71:5–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het huis · 5–9</text><text x="68" y="241" class="body">Kristal en levend vuur; serafs, cherubs</text><text x="68" y="284" class="body">en ofannim; Michaël, Rafaël, Gabriël en</text><text x="68" y="327" class="body">Fanuël.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De verandering · 10–13</text><text x="68" y="476" class="body">Henoch valt neer; zijn geest verandert;</text><text x="68" y="519" class="body">zegeningen voor het Hoofd van de dagen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De begroeting · 14–17</text><text x="68" y="668" class="body">De engel spreekt hem aan als</text><text x="68" y="711" class="body">Mensenzoon; gerechtigheid, vrede en</text><text x="68" y="754" class="body">blijvend samenzijn.</text><text x="46" y="847" class="note">De begroeting volgt de plaatselijke tekst; het</text><text x="46" y="883" class="note">schema legt geen andere identiteit in de</text><text x="46" y="919" class="note">aanspreekvorm.</text></svg>