<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Oordeel en vernieuwing</title><desc id="desc">Oordeel en vernieuwing met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oordeel en vernieuwing</text><text x="44" y="113" class="ref">Henoch 45:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het kader · 1–2</text><text x="68" y="241" class="body">Tweede gelijkenis; wie de heilige naam</text><text x="68" y="284" class="body">verloochenen wachten op benauwdheid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De Uitverkorene · 3</text><text x="68" y="433" class="body">Zit op de troon van heerlijkheid en</text><text x="68" y="476" class="body">onderzoekt werken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De verandering · 4–5</text><text x="68" y="625" class="body">Hemel tot eeuwige zegen en licht; aarde</text><text x="68" y="668" class="body">tot woning voor de uitverkorenen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het onderscheid · 5–6</text><text x="68" y="817" class="body">Vrede voor rechtvaardigen; overtreders</text><text x="68" y="860" class="body">betreden de vernieuwde aarde niet.</text><text x="46" y="953" class="note">Dit zijn toekomstige uitspraken binnen de</text><text x="46" y="989" class="note">gelijkenis. De beelden van vrede zijn</text><text x="46" y="1025" class="note">illustraties van die belofte.</text></svg>