<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wijsheid, geest en waarheid</title><desc id="desc">Wijsheid, geest en waarheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijsheid, geest en waarheid</text><text x="44" y="113" class="ref">Henoch 49:1–4</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vergelijking · 1</text><text x="68" y="241" class="body">Wijsheid is uitgegoten als water.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De duurzaamheid · 2</text><text x="68" y="390" class="body">Onrecht verdwijnt als schaduw;</text><text x="68" y="433" class="body">heerlijkheid en macht van de</text><text x="68" y="476" class="body">Uitverkorene blijven.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat in hem woont · 3</text><text x="68" y="625" class="body">Geest van wijsheid, inzicht, onderwijs,</text><text x="68" y="668" class="body">kracht en wie rechtvaardig ontslapen</text><text x="68" y="711" class="body">zijn.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het oordeel · 4</text><text x="68" y="860" class="body">Verborgen dingen worden geoordeeld; een</text><text x="68" y="903" class="body">leugen houdt geen stand.</text><text x="46" y="996" class="note">Water en schaduw zijn vergelijkingen; het schema</text><text x="46" y="1032" class="note">bewaakt hun samenhang met geest en oordeel.</text></svg>