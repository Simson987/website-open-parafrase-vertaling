<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Geest, vlees en woonplaats</title><desc id="desc">Geest, vlees en woonplaats met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geest, vlees en woonplaats</text><text x="44" y="113" class="ref">Henoch 15:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De taak · 1–2</text><text x="68" y="241" class="body">Henoch moet spreken: wachters horen</text><text x="68" y="284" class="body">voor mensen te bidden, niet omgekeerd.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De grens · 3–7</text><text x="68" y="433" class="body">Hemelse geestelijke wezens verlaten hun</text><text x="68" y="476" class="body">eigen woonplaats en verbinden zich met</text><text x="68" y="519" class="body">sterfelijk vlees.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De reuzen · 8–9</text><text x="68" y="668" class="body">Uit geest en vlees; hun geesten worden</text><text x="68" y="711" class="body">boze geesten op aarde genoemd.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De woonplaatsen · 10–11</text><text x="68" y="860" class="body">Hemelse geesten in de hemel, aardse op</text><text x="68" y="903" class="body">aarde; de laatste passage beschrijft</text><text x="68" y="946" class="body">onderdrukking en verderf.</text><text x="46" y="1039" class="note">Dit is de verklaring binnen Henochs</text><text x="46" y="1075" class="note">visioenwereld; het schema is geen beschrijving</text><text x="46" y="1111" class="note">van menselijke anatomie.</text></svg>