<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1217" viewBox="0 0 840 1217" role="img" aria-labelledby="title desc"><title id="title">Zonnepoorten: de tweede helft</title><desc id="desc">Zonnepoorten: de tweede helft met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1217" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zonnepoorten: de tweede helft</text><text x="44" y="113" class="ref">Henoch 72:21–37</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">7 · poort 3 · 30 ochtenden</text><text x="68" y="241" class="body">Eindstand: dag 8 delen, nacht 10.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">8 · poort 2 · 30 ochtenden</text><text x="68" y="390" class="body">Eindstand: dag 7 delen, nacht 11.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">9 · poort 1 · 31 ochtenden</text><text x="68" y="539" class="body">Vers 26: nacht 12 en dag 7 delen.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">10 · poort 1 · 30 ochtenden</text><text x="68" y="688" class="body">Eindstand: dag 7 delen, nacht 11.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">11 · poort 2 · 30 ochtenden</text><text x="68" y="837" class="body">Eindstand: dag 8 delen, nacht 10.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">12 · poort 3 · 31 ochtenden</text><text x="68" y="986" class="body">Dag 9, nacht 9; jaar 364 dagen.</text><text x="46" y="1079" class="note">Vers 26 zegt ook dat de nacht tweemaal de dag</text><text x="46" y="1115" class="note">is, maar noemt 12 en 7. Beide tekstgegevens</text><text x="46" y="1151" class="note">blijven staan; geen stilzwijgende correctie.</text></svg>