<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Onderwijs en ontwrichting</title><desc id="desc">Onderwijs en ontwrichting met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onderwijs en ontwrichting</text><text x="44" y="113" class="ref">Henoch 8:1–3</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Azazel · 1</text><text x="68" y="241" class="body">Wapens, metaalwerk, sieraden, oogzwart,</text><text x="68" y="284" class="body">stenen en kleurstoffen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Amezarak en Armaros · 2</text><text x="68" y="433" class="body">Bezweringen en wortels; het ongedaan</text><text x="68" y="476" class="body">maken van bezweringen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Barakal en Kokabeël · 2</text><text x="68" y="625" class="body">Sterrenwichelaars en tekenen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Tumeël en Asradeël · 2</text><text x="68" y="774" class="body">Waarnemen van sterren en de loop van de</text><text x="68" y="817" class="body">maan.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De afloop · 2–3</text><text x="68" y="966" class="body">Goddeloosheid en verderf; het</text><text x="68" y="1009" class="body">geschreeuw van mensen bereikt de hemel.</text><text x="46" y="1102" class="note">De namen en toeschrijvingen volgen dit</text><text x="46" y="1138" class="note">hoofdstuk. De tekst duidt deze onthullingen als</text><text x="46" y="1174" class="note">bron van ontwrichting.</text></svg>