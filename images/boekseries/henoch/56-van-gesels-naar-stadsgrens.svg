<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Van gesels naar stadsgrens</title><desc id="desc">Van gesels naar stadsgrens met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van gesels naar stadsgrens</text><text x="44" y="113" class="ref">Henoch 56:1–8</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Strafengelen · 1–4</text><text x="68" y="241" class="body">Dragen gesels van ijzer en koper; de</text><text x="68" y="284" class="body">engel van de vrede verklaart hun</text><text x="68" y="327" class="body">opdracht.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het oosten · 5–6</text><text x="68" y="476" class="body">Parthen en Meden, opgezweepte koningen</text><text x="68" y="519" class="body">en vertrapt land.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De hindernis · 7</text><text x="68" y="668" class="body">De rechtvaardigenstad houdt de paarden</text><text x="68" y="711" class="body">tegen; strijd keert zich naar binnen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het einde · 8</text><text x="68" y="860" class="body">Het dodenrijk wordt als een</text><text x="68" y="903" class="body">opengesperde mond beschreven.</text><text x="46" y="996" class="note">Leeuwen, wolven, dorsvloer en de mond van het</text><text x="46" y="1032" class="note">dodenrijk zijn beelden, geen extra afzonderlijke</text><text x="46" y="1068" class="note">historische gebeurtenissen.</text></svg>