<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Verantwoordelijkheid en getuigenis</title><desc id="desc">Verantwoordelijkheid en getuigenis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verantwoordelijkheid en getuigenis</text><text x="44" y="113" class="ref">Henoch 98:4–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Menselijk handelen · 4–5</text><text x="68" y="241" class="body">De tekst legt zonde bij mensen zelf en</text><text x="68" y="284" class="body">spreekt daarna over kinderloos sterven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hemelse registratie · 6–8</text><text x="68" y="433" class="body">Geen geweld verborgen; elke dag</text><text x="68" y="476" class="body">opgeschreven tot het oordeel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Waarschuwingen · 9–14</text><text x="68" y="625" class="body">Dwaasheid, hardheid en vreugde om</text><text x="68" y="668" class="body">andermans nood worden aangeklaagd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Twee soorten schrift · 7,15–16</text><text x="68" y="817" class="body">Waarachtig verslag tegenover</text><text x="68" y="860" class="body">opgeschreven leugenwoorden.</text><text x="46" y="953" class="note">Vers 5 blijft een uitspraak binnen deze</text><text x="46" y="989" class="note">oordeelsrede; het schema stelt daarmee geen</text><text x="46" y="1025" class="note">medische oorzaak van kinderloosheid vast.</text></svg>