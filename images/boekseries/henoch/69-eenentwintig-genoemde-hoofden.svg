<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1366" viewBox="0 0 840 1366" role="img" aria-labelledby="title desc"><title id="title">Eenentwintig genoemde hoofden</title><desc id="desc">Eenentwintig genoemde hoofden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1366" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eenentwintig genoemde hoofden</text><text x="44" y="113" class="ref">Henoch 69:2–3</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3</text><text x="68" y="241" class="body">Semjaza · Artaqifa · Armen</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">4–6</text><text x="68" y="390" class="body">Kekabaël · Turaël · Rumjaël</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">7–9</text><text x="68" y="539" class="body">Danaël · Nuqaël · Baraqaël</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">10–12</text><text x="68" y="688" class="body">Azazaël · Armaros · Batarjaël</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">13–15</text><text x="68" y="837" class="body">Basasaël · Ananaël · Turjaël</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">16–18</text><text x="68" y="986" class="body">Simapesiël · Jetaraël · Tumaël</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">19–21</text><text x="68" y="1135" class="body">Taraël · Rumaël · Izizeël</text><text x="46" y="1228" class="note">De 21 namen volgen deze plaatselijke lijst. De</text><text x="46" y="1264" class="note">oversten over honderd, vijftig en tien uit vers</text><text x="46" y="1300" class="note">3 zijn rangen, geen extra namen.</text></svg>