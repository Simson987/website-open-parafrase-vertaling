<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Van ontregeling naar dwaling</title><desc id="desc">Van ontregeling naar dwaling met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van ontregeling naar dwaling</text><text x="44" y="113" class="ref">Henoch 80:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Land · 2–3</text><text x="68" y="241" class="body">Kortere jaren; te laat zaad en vrucht;</text><text x="68" y="284" class="body">regen blijft uit.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hemel · 4–6</text><text x="68" y="433" class="body">Maan verandert haar orde;</text><text x="68" y="476" class="body">sterrenleiders wijken van banen en</text><text x="68" y="519" class="body">tijden af.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Uitleg · 7–8</text><text x="68" y="668" class="body">Mensen begrijpen de orde niet en houden</text><text x="68" y="711" class="body">sterren voor goden; kwaad en plaag</text><text x="68" y="754" class="body">volgen.</text><text x="46" y="847" class="note">De passage is een visioen over de dagen van</text><text x="46" y="883" class="note">zondaars; geen datum of hedendaagse voorspelling</text><text x="46" y="919" class="note">wordt toegevoegd.</text></svg>