<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">Bergen en geurende boom</title><desc id="desc">Bergen en geurende boom met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bergen en geurende boom</text><text x="44" y="113" class="ref">Henoch 24:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste berg · 1</text><text x="68" y="241" class="body">Een berg van vuur, dag en nacht</text><text x="68" y="284" class="body">brandend.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De zeven · 2–3</text><text x="68" y="433" class="body">Drie naar het oosten, drie naar het</text><text x="68" y="476" class="body">noorden en een zevende in het midden,</text><text x="68" y="519" class="body">met diepe kronkelende dalen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De boom · 4–5</text><text x="68" y="668" class="body">Ongekende geur; blad, bloesem en hout</text><text x="68" y="711" class="body">verwelken niet; vrucht als</text><text x="68" y="754" class="body">dadelpalm-trossen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De spreker · 6</text><text x="68" y="903" class="body">Michaël, een van de heilige en geëerde</text><text x="68" y="946" class="body">engelen en hun aanvoerder, antwoordt.</text><text x="46" y="1039" class="note">Hier staat noorden, anders dan zuiden in Henoch</text><text x="46" y="1075" class="note">18. De plaatselijke formulering blijft behouden;</text><text x="46" y="1111" class="note">de boom wordt niet als botanisch</text><text x="46" y="1147" class="note">geïdentificeerde dadelpalm vastgelegd.</text></svg>