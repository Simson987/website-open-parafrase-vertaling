<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Vaste orde en menselijke keuze</title><desc id="desc">Vaste orde en menselijke keuze met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vaste orde en menselijke keuze</text><text x="44" y="113" class="ref">Henoch 5:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De schepping · 1–3</text><text x="68" y="241" class="body">Bladeren, vrucht, jaarlijkse orde,</text><text x="68" y="284" class="body">zeeën en rivieren dienen hun Maker.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het verwijt · 4–6</text><text x="68" y="433" class="body">Mensen zijn onstandvastig, overtreden</text><text x="68" y="476" class="body">en lasteren; voor hen geen vrede.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De uitverkorenen · 7–8</text><text x="68" y="625" class="body">Licht, vreugde, erfenis en wijsheid</text><text x="68" y="668" class="body">zonder hoogmoed.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het uitzicht · 9</text><text x="68" y="817" class="body">Een volledig leven in vrede, zonder</text><text x="68" y="860" class="body">veroordeling of plaag.</text><text x="46" y="953" class="note">Het contrast verbindt de natuurwaarnemingen met</text><text x="46" y="989" class="note">het morele onderwijs en de beloofde toekomst.</text></svg>