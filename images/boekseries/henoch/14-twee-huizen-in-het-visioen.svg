<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Twee huizen in het visioen</title><desc id="desc">Twee huizen in het visioen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee huizen in het visioen</text><text x="44" y="113" class="ref">Henoch 14:9–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Muur en eerste huis · 9–14</text><text x="68" y="241" class="body">Kristal, vuur, sterrengewelf en water;</text><text x="68" y="284" class="body">heet als vuur en koud als ijs; angst en</text><text x="68" y="327" class="body">neervallen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het grotere huis · 15–17</text><text x="68" y="476" class="body">Deur, bodem en gewelf van vuur;</text><text x="68" y="519" class="body">heerlijkheid die Henoch niet kan</text><text x="68" y="562" class="body">navertellen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Troon en heerlijkheid · 18–20</text><text x="68" y="711" class="body">Kristalachtige troon, zonachtige wielen</text><text x="68" y="754" class="body">en vuurstromen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De afstand · 21–23</text><text x="68" y="903" class="body">Niemand van vlees kan het gezicht</text><text x="68" y="946" class="body">aanzien; heiligen blijven in dienst.</text><text x="46" y="1039" class="note">De twee huizen worden onderscheiden. God wordt</text><text x="46" y="1075" class="note">in de illustraties door ontoegankelijk licht</text><text x="46" y="1111" class="note">aangeduid, zonder menselijke gestalte.</text></svg>