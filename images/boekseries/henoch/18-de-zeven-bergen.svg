<svg xmlns="http://www.w3.org/2000/svg" width="840" height="856" viewBox="0 0 840 856" role="img" aria-labelledby="title desc"><title id="title">De zeven bergen</title><desc id="desc">De zeven bergen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="856" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De zeven bergen</text><text x="44" y="113" class="ref">Henoch 18:6–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie naar het oosten</text><text x="68" y="241" class="body">Gekleurd gesteente; één van parel en</text><text x="68" y="284" class="body">één van hyacint.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Drie naar het zuiden</text><text x="68" y="433" class="body">Rood gesteente.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De middelste</text><text x="68" y="582" class="body">Albast, reikt naar de hemel, als Gods</text><text x="68" y="625" class="body">troon; de top is saffier.</text><text x="46" y="718" class="note">3 + 3 + 1 = 7. De tekst geeft geen namen voor</text><text x="46" y="754" class="note">elke afzonderlijke berg; het schema verzint geen</text><text x="46" y="790" class="note">locatie of rangschikking.</text></svg>