<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Meten, wegen en loven</title><desc id="desc">Meten, wegen en loven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Meten, wegen en loven</text><text x="44" y="113" class="ref">Henoch 61:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het meten · 1–5</text><text x="68" y="241" class="body">Koorden naar het noorden; maten voor</text><text x="68" y="284" class="body">rechtvaardigen en terugkeer van wie</text><text x="68" y="327" class="body">verloren leken.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De eenheid · 6–7</text><text x="68" y="476" class="body">Eén macht, stem en vuurachtig licht;</text><text x="68" y="519" class="body">zegen met wijsheid.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het oordeel · 8–9</text><text x="68" y="668" class="body">De Uitverkorene op de troon; daden en</text><text x="68" y="711" class="body">verborgen wegen worden gewogen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De lof · 10–13</text><text x="68" y="860" class="body">Cherubs, serafs, ofannim, machten en</text><text x="68" y="903" class="body">heiligen zegenen eensgezind.</text><text x="46" y="996" class="note">De koorden meten in het visioen; het hoofdstuk</text><text x="46" y="1032" class="note">geeft geen maten voor een letterlijk gebouw.</text></svg>