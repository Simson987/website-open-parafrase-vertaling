<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1303" viewBox="0 0 840 1303" role="img" aria-labelledby="title desc"><title id="title">Zes namen en taken</title><desc id="desc">Zes namen en taken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1303" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes namen en taken</text><text x="44" y="113" class="ref">Henoch 20:1–7</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uriël · 2</text><text x="68" y="241" class="body">Donder en aardbeving.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Rafaël · 3</text><text x="68" y="390" class="body">Geesten van de mensen.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Raguël · 4</text><text x="68" y="539" class="body">Wraak over de wereld en de lichten.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Michaël · 5</text><text x="68" y="688" class="body">Het beste deel van de mensen en het</text><text x="68" y="731" class="body">volk.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Saraqaël · 6</text><text x="68" y="880" class="body">Geesten van mensenkinderen die met hun</text><text x="68" y="923" class="body">geest zondigen.</text><rect x="42" y="981" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1024" class="label">Gabriël · 7</text><text x="68" y="1072" class="body">Slangen, paradijs en cherubs.</text><text x="46" y="1165" class="note">Deze plaatselijke versie noemt zes engelen. Er</text><text x="46" y="1201" class="note">wordt geen zevende naam uit een andere</text><text x="46" y="1237" class="note">tekstversie ingevoegd.</text></svg>