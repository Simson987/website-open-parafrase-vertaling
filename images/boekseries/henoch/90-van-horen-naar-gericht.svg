<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Van horen naar gericht</title><desc id="desc">Van horen naar gericht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van horen naar gericht</text><text x="44" y="113" class="ref">Henoch 90:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herders en lammeren · 1–8</text><text x="68" y="241" class="body">37 herders; daarna 23 en 58 voltooide</text><text x="68" y="284" class="body">tijden; lammeren openen hun ogen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De horen · 9–19</text><text x="68" y="433" class="body">Eén grote horen; raven kunnen hem niet</text><text x="68" y="476" class="body">breken; schrijver helpt; aarde opent en</text><text x="68" y="519" class="body">zwaard wordt gegeven.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De boeken · 20–23</text><text x="68" y="668" class="body">Verzegelde boeken open; zeven eerste</text><text x="68" y="711" class="body">witten; sterren en 70 herders voor het</text><text x="68" y="754" class="body">gericht.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het oordeel · 24–27</text><text x="68" y="903" class="body">Achtereenvolgens sterren, herders en</text><text x="68" y="946" class="body">blinde schapen veroordeeld.</text><text x="46" y="1039" class="note">De verschillende aantallen blijven</text><text x="46" y="1075" class="note">tekstgegevens; het schema rekent ze niet tot een</text><text x="46" y="1111" class="note">tijdlijn met historische jaartallen om.</text></svg>