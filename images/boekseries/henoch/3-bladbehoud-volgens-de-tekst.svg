<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Bladbehoud volgens de tekst</title><desc id="desc">Bladbehoud volgens de tekst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bladbehoud volgens de tekst</text><text x="44" y="113" class="ref">Henoch 3:1</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het winterbeeld</text><text x="68" y="241" class="body">Bomen lijken verdord en verliezen hun</text><text x="68" y="284" class="body">bladeren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De uitzondering</text><text x="68" y="433" class="body">Veertien bomen houden hun oude blad</text><text x="68" y="476" class="body">totdat het nieuwe verschijnt.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De genoemde duur</text><text x="68" y="625" class="body">Twee tot drie jaar.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De grens van de lijst</text><text x="68" y="774" class="body">De tekst geeft geen namen van de</text><text x="68" y="817" class="body">veertien bomen.</text><text x="46" y="910" class="note">De drie bestaande natuurfoto’s illustreren</text><text x="46" y="946" class="note">bladverlies, bladbehoud en nieuw blad; zij zijn</text><text x="46" y="982" class="note">geen volledige soortenlijst.</text></svg>