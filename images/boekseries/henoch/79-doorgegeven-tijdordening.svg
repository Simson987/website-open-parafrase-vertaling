<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Doorgegeven tijdordening</title><desc id="desc">Doorgegeven tijdordening met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Doorgegeven tijdordening</text><text x="44" y="113" class="ref">Henoch 79:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De ontvanger · 1–2</text><text x="68" y="241" class="body">Metuselach; dagen, tijden, jaren,</text><text x="68" y="284" class="body">maanden en weken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De poorten · 3–4</text><text x="68" y="433" class="body">Zesde en eerste poort; 177 dagen = 25</text><text x="68" y="476" class="body">weken en 2 dagen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De achterstand · 5</text><text x="68" y="625" class="body">Vijf dagen ten opzichte van zon en</text><text x="68" y="668" class="body">sterren in één tijdvak.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De bron · 6</text><text x="68" y="817" class="body">Uriël toont het beeld en de gelijkenis</text><text x="68" y="860" class="body">van elk hemellichaam.</text><text x="46" y="953" class="note">Het tijdvak wordt niet eigenmachtig tot een</text><text x="46" y="989" class="note">moderne maand of jaar benoemd.</text></svg>