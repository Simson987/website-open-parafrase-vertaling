<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Noachs vraag en de belofte</title><desc id="desc">Noachs vraag en de belofte met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Noachs vraag en de belofte</text><text x="44" y="113" class="ref">Henoch 65:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De nood · 1–4</text><text x="68" y="241" class="body">Verzakkende aarde; Noach roept driemaal</text><text x="68" y="284" class="body">om uitleg en valt neer.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Henoch · 5–9</text><text x="68" y="433" class="body">Zijn overgrootvader verklaart de</text><text x="68" y="476" class="body">onthulde geheimen en richt hem bij de</text><text x="68" y="519" class="body">hand op.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het onderscheid · 10–11</text><text x="68" y="668" class="body">Oordeel over onrecht; Noach wordt juist</text><text x="68" y="711" class="body">zuiver en goed genoemd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het nageslacht · 12</text><text x="68" y="860" class="body">Bewaring en een beloofde bron van</text><text x="68" y="903" class="body">ontelbare rechtvaardigen en heiligen.</text><text x="46" y="996" class="note">De verklaring over metaalbronnen behoort tot de</text><text x="46" y="1032" class="note">visioenwereld; het schema presenteert geen</text><text x="46" y="1068" class="note">moderne mijnbouwkunde.</text></svg>