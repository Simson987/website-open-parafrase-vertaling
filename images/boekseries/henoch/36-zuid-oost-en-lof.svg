<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Zuid, oost en lof</title><desc id="desc">Zuid, oost en lof met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zuid, oost en lof</text><text x="44" y="113" class="ref">Henoch 36:1–4</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zuiden · 1</text><text x="68" y="241" class="body">Drie poorten; zuidenwind, dauw en</text><text x="68" y="284" class="body">regen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oosten · 2</text><text x="68" y="433" class="body">Drie poorten, met kleine poorten</text><text x="68" y="476" class="body">daarboven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Sterren · 3</text><text x="68" y="625" class="body">Gaan door de kleine poorten over hun</text><text x="68" y="668" class="body">aangewezen weg naar het westen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De reactie · 4</text><text x="68" y="817" class="body">Henoch prijst Gods werk, opdat engelen</text><text x="68" y="860" class="body">en mensen de Schepper loven.</text><text x="46" y="953" class="note">De hemelpoorten zijn onderdeel van het visioen;</text><text x="46" y="989" class="note">dit schema is geen modern model van de</text><text x="46" y="1025" class="note">atmosfeer.</text></svg>