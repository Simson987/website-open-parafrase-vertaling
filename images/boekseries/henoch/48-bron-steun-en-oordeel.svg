<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Bron, steun en oordeel</title><desc id="desc">Bron, steun en oordeel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bron, steun en oordeel</text><text x="44" y="113" class="ref">Henoch 48:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De bron · 1</text><text x="68" y="241" class="body">Gerechtigheid en talloze bronnen van</text><text x="68" y="284" class="body">wijsheid voor dorstigen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De Mensenzoon · 2–7</text><text x="68" y="433" class="body">Naam genoemd vóór zon en sterren; staf,</text><text x="68" y="476" class="body">licht en hoop voor rechtvaardigen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De machthebbers · 8–9</text><text x="68" y="625" class="body">Kunnen zich niet redden; vergeleken met</text><text x="68" y="668" class="body">stro in vuur en lood in water.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het einde · 10</text><text x="68" y="817" class="body">Rust op aarde en oordeel wegens</text><text x="68" y="860" class="body">verloochening van de Heere en Zijn</text><text x="68" y="903" class="body">Gezalfde.</text><text x="46" y="996" class="note">Bron, staf, licht, stro en lood zijn</text><text x="46" y="1032" class="note">verschillende beelden; de tekst vertelt geen</text><text x="46" y="1068" class="note">letterlijk experiment met mensen.</text></svg>