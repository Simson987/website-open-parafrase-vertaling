<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Gescheiden wachtplaatsen</title><desc id="desc">Gescheiden wachtplaatsen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gescheiden wachtplaatsen</text><text x="44" y="113" class="ref">Henoch 22:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanblik · 1–4</text><text x="68" y="241" class="body">Vier plaatsen in de berg voor zielen</text><text x="68" y="284" class="body">tot het grote oordeel.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Abels stem · 5–7</text><text x="68" y="433" class="body">De gedode Abel klaagt Kaïn aan.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het onderscheid · 8–13</text><text x="68" y="582" class="body">Een verlichte bron voor rechtvaardigen;</text><text x="68" y="625" class="body">daarnaast verschillende groepen</text><text x="68" y="668" class="body">zondaars en aanklagers.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De lof · 14</text><text x="68" y="817" class="body">Henoch zegent de Heere van heerlijkheid</text><text x="68" y="860" class="body">en gerechtigheid.</text><text x="46" y="953" class="note">Vers 1 spreekt van vier plaatsen; vers 9 zegt</text><text x="46" y="989" class="note">deze drie. Dit schema bewaart beide</text><text x="46" y="1025" class="note">formuleringen zonder een sluitend</text><text x="46" y="1061" class="note">plattegrondmodel te verzinnen.</text></svg>