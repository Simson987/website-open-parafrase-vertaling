<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Vijf verleiders en hun onderwijs</title><desc id="desc">Vijf verleiders en hun onderwijs met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijf verleiders en hun onderwijs</text><text x="44" y="113" class="ref">Henoch 69:4–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jequn · 4</text><text x="68" y="241" class="body">Verleidt de heilige engelen om af te</text><text x="68" y="284" class="body">dalen en naar mensendochters te gaan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Asbeël · 5</text><text x="68" y="433" class="body">Geeft slechte raad over lichamelijke</text><text x="68" y="476" class="body">verontreiniging.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gadreël · 6–7</text><text x="68" y="625" class="body">Verleidt Eva en toont dodelijke</text><text x="68" y="668" class="body">bewapening.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Penemue · 8–11</text><text x="68" y="817" class="body">Bitter en zoet, wijsheid en schrijven</text><text x="68" y="860" class="body">met inkt en papier.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Kasdeja · 12</text><text x="68" y="1009" class="body">Schadelijke slagen van geesten en</text><text x="68" y="1052" class="body">demonen; Tabaët wordt genoemd.</text><text x="46" y="1145" class="note">Deze vijf namen uit de nadere uitleg worden niet</text><text x="46" y="1181" class="note">stilzwijgend gelijkgesteld aan de eerste vijf</text><text x="46" y="1217" class="note">uit de vorige lijst.</text></svg>