<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Gezegend land en oordeelsdal</title><desc id="desc">Gezegend land en oordeelsdal met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gezegend land en oordeelsdal</text><text x="44" y="113" class="ref">Henoch 27:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 1</text><text x="68" y="241" class="body">Waarom een vervloekt dal midden in een</text><text x="68" y="284" class="body">gezegend bomenland?</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Uriëls antwoord · 2</text><text x="68" y="433" class="body">Verzameling van wie onpassende en harde</text><text x="68" y="476" class="body">woorden tegen Gods heerlijkheid</text><text x="68" y="519" class="body">spreken.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het uitzicht · 3–4</text><text x="68" y="668" class="body">Oordeel in de laatste dagen en lof van</text><text x="68" y="711" class="body">de barmhartigen om ontvangen</text><text x="68" y="754" class="body">barmhartigheid.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Henoch · 5</text><text x="68" y="903" class="body">Sluit zich aan bij de lof van de</text><text x="68" y="946" class="body">eeuwige Koning.</text><text x="46" y="1039" class="note">Het antwoord legt de betekenis van het visioen</text><text x="46" y="1075" class="note">uit; de kale kloof is niet alleen een</text><text x="46" y="1111" class="note">landschapsbeschrijving.</text></svg>