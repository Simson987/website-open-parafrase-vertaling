<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Jaarberekeningen en achterstand</title><desc id="desc">Jaarberekeningen en achterstand met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jaarberekeningen en achterstand</text><text x="44" y="113" class="ref">Henoch 74:10–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zon · 10–13</text><text x="68" y="241" class="body">364 per jaar; 3 jaar = 1092; 5 jaar =</text><text x="68" y="284" class="body">1820; 8 jaar = 2912 dagen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Maan · 14–15</text><text x="68" y="433" class="body">3 jaar = 1062; 5 jaar = 1770; 8 jaar =</text><text x="68" y="476" class="body">2832 dagen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verschil · 16</text><text x="68" y="625" class="body">2912 − 2832 = 80 dagen in 8 jaar.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Bijzondere zin · 14</text><text x="68" y="774" class="body">Ook 62 toegevoegde dagen bij 1770</text><text x="68" y="817" class="body">worden genoemd; dat wordt niet in de</text><text x="68" y="860" class="body">totalen verwerkt.</text><text x="46" y="953" class="note">De reeks bewaart de opgegeven totalen en de</text><text x="46" y="989" class="note">afzonderlijke zin uit vers 14; er wordt geen</text><text x="46" y="1025" class="note">sluitende moderne kalender van gemaakt.</text></svg>