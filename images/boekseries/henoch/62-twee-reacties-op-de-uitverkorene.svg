<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Reacties op de Uitverkorene</title><desc id="desc">Reacties op de Uitverkorene met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reacties op de Uitverkorene</text><text x="44" y="113" class="ref">Henoch 62:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Erkenning · 1–8</text><text x="68" y="241" class="body">Koningen zien de Uitverkorene; schrik</text><text x="68" y="284" class="body">en pijn als barensnood, tegenover de</text><text x="68" y="327" class="body">gemeenschap van uitverkorenen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Smeekbede en schaamte · 9–12</text><text x="68" y="476" class="body">De machtigen vallen neer en vragen</text><text x="68" y="519" class="body">ontferming; oordeel wegens hun</text><text x="68" y="562" class="body">onderdrukking.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Redding · 13–14</text><text x="68" y="711" class="body">Rechtvaardigen gered; wonen en eten met</text><text x="68" y="754" class="body">de Mensenzoon.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Levenskleed · 15–16</text><text x="68" y="903" class="body">Opgericht gezicht, kleed dat niet oud</text><text x="68" y="946" class="body">wordt en blijvende heerlijkheid.</text><text x="46" y="1039" class="note">De barensnood is een vergelijking voor de schrik</text><text x="46" y="1075" class="note">van koningen; het levenskleed verbeeldt de</text><text x="46" y="1111" class="note">beloofde blijvende toestand.</text></svg>