<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Licht en verlies van macht</title><desc id="desc">Licht en verlies van macht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Licht en verlies van macht</text><text x="44" y="113" class="ref">Henoch 38:1–6</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De verschijning · 1–2</text><text x="68" y="241" class="body">Rechtvaardigen komen bijeen; de</text><text x="68" y="284" class="body">Rechtvaardige verschijnt en licht komt</text><text x="68" y="327" class="body">voor de uitverkorenen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De onthulling · 3</text><text x="68" y="476" class="body">Verborgen dingen worden bekend;</text><text x="68" y="519" class="body">zondaars geoordeeld en goddelozen</text><text x="68" y="562" class="body">verdreven.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De machtsomkeer · 4–5</text><text x="68" y="711" class="body">Aardse bezitters en machtige koningen</text><text x="68" y="754" class="body">verliezen hun verheven positie.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De grens · 6</text><text x="68" y="903" class="body">Hun leven eindigt; zij zoeken niet meer</text><text x="68" y="946" class="body">voor zichzelf ontferming.</text><text x="46" y="1039" class="note">De eerste gelijkenis spreekt in een toekomstig</text><text x="46" y="1075" class="note">oordeelsbeeld; het is geen gedateerde</text><text x="46" y="1111" class="note">troonswisseling.</text></svg>