<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">De vraag naar de Mensenzoon</title><desc id="desc">De vraag naar de Mensenzoon met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vraag naar de Mensenzoon</text><text x="44" y="113" class="ref">Henoch 46:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanblik · 1</text><text x="68" y="241" class="body">Het Hoofd van de dagen en een ander met</text><text x="68" y="284" class="body">een menselijk, genadig gezicht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Henochs vraag · 2</text><text x="68" y="433" class="body">Wie is de Mensenzoon, waar komt hij</text><text x="68" y="476" class="body">vandaan en waarom gaat hij mee?</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het antwoord · 3</text><text x="68" y="625" class="body">Gerechtigheid woont bij hem; hij maakt</text><text x="68" y="668" class="body">verborgen schatten bekend en is</text><text x="68" y="711" class="body">uitgekozen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De omkeer · 4–8</text><text x="68" y="860" class="body">Koningen en sterken verliezen macht;</text><text x="68" y="903" class="body">onrecht, rijkdomsvertrouwen en afgoden</text><text x="68" y="946" class="body">worden aangeklaagd.</text><text x="46" y="1039" class="note">Het schema volgt de benamingen van de passage en</text><text x="46" y="1075" class="note">voegt geen nieuwe persoon of historische</text><text x="46" y="1111" class="note">datering toe.</text></svg>