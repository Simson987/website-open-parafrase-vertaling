<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Geweld, bewaring en getuigen</title><desc id="desc">Geweld, bewaring en getuigen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geweld, bewaring en getuigen</text><text x="44" y="113" class="ref">Henoch 100:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geweld · 1–3</text><text x="68" y="241" class="body">Vaders, zonen en broers keren zich</text><text x="68" y="284" class="body">tegen elkaar; bloed als beek en tot de</text><text x="68" y="327" class="body">borst van het paard.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Oordeel en bewaring · 4–6</text><text x="68" y="476" class="body">Verzameling van schuldigen; heilige</text><text x="68" y="519" class="body">engelen bewaken rechtvaardigen; rijkdom</text><text x="68" y="562" class="body">redt niet.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Aanklacht · 7–10</text><text x="68" y="711" class="body">Vervolging, kwaad bedenken en woorden</text><text x="68" y="754" class="body">en daden worden onderzocht.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Weer als getuige · 11–13</text><text x="68" y="903" class="body">Wolk, nevel, dauw en regen onthouden;</text><text x="68" y="946" class="body">rijp, sneeuw en stormen niet te</text><text x="68" y="989" class="body">beheersen.</text><text x="46" y="1082" class="note">De extreme bloedbeelden blijven woorden van de</text><text x="46" y="1118" class="note">visioenrede. De beeldreeks toont bewaring en</text><text x="46" y="1154" class="note">weer; het geldbeeld duidt de ironie van vers 12.</text></svg>