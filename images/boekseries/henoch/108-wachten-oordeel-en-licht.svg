<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Wachten, oordeel en licht</title><desc id="desc">Wachten, oordeel en licht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wachten, oordeel en licht</text><text x="44" y="113" class="ref">Henoch 108:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Boek en wachten · 1–3</text><text x="68" y="241" class="body">Voor Metuselach en latere getrouwen;</text><text x="68" y="284" class="body">wachten tot het kwaad eindigt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De diepte · 4–7</text><text x="68" y="433" class="body">Vuur, glinsterende bergen en uitleg van</text><text x="68" y="476" class="body">de heilige engel over gericht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De getrouwen · 8–10</text><text x="68" y="625" class="body">Liefde voor God boven bezit en eigen</text><text x="68" y="668" class="body">leven; zegen tijdens smaad.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De verandering · 11–15</text><text x="68" y="817" class="body">Geesten van goeden naar helder licht,</text><text x="68" y="860" class="body">eer en blijvend schitteren.</text><text x="46" y="953" class="note">De ascetische taal wordt hier samengevat als</text><text x="46" y="989" class="note">beschrijving van deze groep; de leeswijzer geeft</text><text x="46" y="1025" class="note">geen aanwijzing om voedsel te weigeren.</text></svg>