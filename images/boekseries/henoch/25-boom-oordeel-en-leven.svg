<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1362" viewBox="0 0 840 1362" role="img" aria-labelledby="title desc"><title id="title">Boom, oordeel en leven</title><desc id="desc">Boom, oordeel en leven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1362" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boom, oordeel en leven</text><text x="44" y="113" class="ref">Henoch 25:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Henochs vraag · 1–2</text><text x="68" y="241" class="body">Wil alles weten, vooral over de</text><text x="68" y="284" class="body">geurende boom.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De berg · 3</text><text x="68" y="433" class="body">Troon voor de toekomstige komst van de</text><text x="68" y="476" class="body">Heilige en Grote.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De grens · 4</text><text x="68" y="625" class="body">Geen mens mag de boom aanraken tot het</text><text x="68" y="668" class="body">grote oordeel.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De gave · 4–6</text><text x="68" y="817" class="body">Daarna voor rechtvaardigen en</text><text x="68" y="860" class="body">nederigen; vrucht geeft leven, geplant</text><text x="68" y="903" class="body">bij het heilige huis in het noorden.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De reactie · 7</text><text x="68" y="1052" class="body">Henoch dankt voor wat God heeft</text><text x="68" y="1095" class="body">klaargemaakt.</text><text x="46" y="1188" class="note">De vrucht en vreugde zijn beloofd voor na het</text><text x="46" y="1224" class="note">oordeel; het bestaande beeld is een</text><text x="46" y="1260" class="note">visioenillustratie, geen reeds uitgevoerde</text><text x="46" y="1296" class="note">verhuizing.</text></svg>