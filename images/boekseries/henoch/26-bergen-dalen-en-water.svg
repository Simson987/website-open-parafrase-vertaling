<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Bergen, dalen en water</title><desc id="desc">Bergen, dalen en water met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bergen, dalen en water</text><text x="44" y="113" class="ref">Henoch 26:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De plaats · 1</text><text x="68" y="241" class="body">Gezegend en besproeid; bloeiende takken</text><text x="68" y="284" class="body">uit een omgehakte boom.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De heilige berg · 2</text><text x="68" y="433" class="body">Water aan de oostkant, met een stroom</text><text x="68" y="476" class="body">naar het noorden.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De andere bergen · 3–4</text><text x="68" y="625" class="body">Een hogere berg naar het oosten en nog</text><text x="68" y="668" class="body">een lagere aan de westkant daarvan;</text><text x="68" y="711" class="body">dalen en water ertussen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De rotsdalen · 4–6</text><text x="68" y="860" class="body">Diep, nauw en deels droog; zonder</text><text x="68" y="903" class="body">geplante bomen en oorzaak van Henochs</text><text x="68" y="946" class="body">verwondering.</text><text x="46" y="1039" class="note">De ruimtelijke relaties volgen de woorden van</text><text x="46" y="1075" class="note">het visioen; afstanden en moderne plaatsnamen</text><text x="46" y="1111" class="note">worden niet toegevoegd.</text></svg>