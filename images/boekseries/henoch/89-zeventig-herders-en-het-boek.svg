<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Zeventig herders en het boek</title><desc id="desc">Zeventig herders en het boek met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeventig herders en het boek</text><text x="44" y="113" class="ref">Henoch 89:59–77</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opdracht · 59–64</text><text x="68" y="241" class="body">70 herders; een andere waarnemer moet</text><text x="68" y="284" class="body">per herder aantallen en overmaat</text><text x="68" y="327" class="body">opschrijven, zonder hen in te lichten.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Overmaat · 65–71</text><text x="68" y="476" class="body">Meer vernietiging dan opgedragen; huis</text><text x="68" y="519" class="body">en toren verwoest; boek gelezen en</text><text x="68" y="562" class="body">verzegeld.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Terugkeer · 72–75</text><text x="68" y="711" class="body">Na 12 uren keren 3 schapen terug en</text><text x="68" y="754" class="body">bouwen; onrein brood en opnieuw</text><text x="68" y="797" class="body">verstrooiing.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Getuigenis · 76–77</text><text x="68" y="946" class="body">De schrijver toont en leest het boek,</text><text x="68" y="989" class="body">smeekt en legt het neer.</text><text x="46" y="1082" class="note">De aantallen zijn 70 herders, 12 uren en 3</text><text x="46" y="1118" class="note">terugkerende schapen; er wordt geen ongenoemde</text><text x="46" y="1154" class="note">jaartelling berekend.</text></svg>