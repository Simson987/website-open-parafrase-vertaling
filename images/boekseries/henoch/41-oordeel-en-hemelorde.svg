<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Oordeel en hemelorde</title><desc id="desc">Oordeel en hemelorde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oordeel en hemelorde</text><text x="44" y="113" class="ref">Henoch 41:1–9</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De weging · 1–2</text><text x="68" y="241" class="body">Verdeling van het koninkrijk,</text><text x="68" y="284" class="body">menselijke daden op de weegschaal en</text><text x="68" y="327" class="body">gescheiden woningen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het weer · 3–4</text><text x="68" y="476" class="body">Geheimen en schatkamers van donder,</text><text x="68" y="519" class="body">bliksem, wind, wolken, dauw, hagel en</text><text x="68" y="562" class="body">nevel.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Zon en maan · 5–8</text><text x="68" y="711" class="body">Vaste banen, terugkeer, trouw en</text><text x="68" y="754" class="body">onophoudelijke dank.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De Heerser · 9</text><text x="68" y="903" class="body">Geen engel of macht kan Zijn toezicht</text><text x="68" y="946" class="body">en oordeel verhinderen.</text><text x="46" y="1039" class="note">Schatkamers, weegschaal en hemelbanen behoren</text><text x="46" y="1075" class="note">tot de visioentaal en worden niet tot moderne</text><text x="46" y="1111" class="note">natuurkunde omgeschreven.</text></svg>