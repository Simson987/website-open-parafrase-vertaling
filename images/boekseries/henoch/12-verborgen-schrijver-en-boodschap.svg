<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Verborgen schrijver en boodschap</title><desc id="desc">Verborgen schrijver en boodschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verborgen schrijver en boodschap</text><text x="44" y="113" class="ref">Henoch 12:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verblijf · 1–2</text><text x="68" y="241" class="body">Henoch is voor mensen verborgen en</text><text x="68" y="284" class="body">werkt met heiligen en wachters.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De roep · 3–4</text><text x="68" y="433" class="body">Tijdens zijn lof wordt de schrijver van</text><text x="68" y="476" class="body">gerechtigheid naar de overtredende</text><text x="68" y="519" class="body">wachters gestuurd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De boodschap · 5–6</text><text x="68" y="668" class="body">Geen vrede of vergeving; ondergang van</text><text x="68" y="711" class="body">hun kinderen en onverhoorde smeekbeden.</text><text x="46" y="804" class="note">De heiligen die Henoch roepen en de wachters tot</text><text x="46" y="840" class="note">wie hij moet spreken vervullen verschillende</text><text x="46" y="876" class="note">rollen.</text></svg>