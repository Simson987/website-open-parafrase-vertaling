<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Geuren, tuin en wijsheid</title><desc id="desc">Geuren, tuin en wijsheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geuren, tuin en wijsheid</text><text x="44" y="113" class="ref">Henoch 32:1–6</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De reis · 1–2</text><text x="68" y="241" class="body">Zeven geurende bergen, ver naar het</text><text x="68" y="284" class="body">oosten over de Rode Zee en voorbij</text><text x="68" y="327" class="body">Zutiël.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De tuin · 3–5</text><text x="68" y="476" class="body">Tuin van gerechtigheid met de boom van</text><text x="68" y="519" class="body">wijsheid; als johannesbroodboom, vrucht</text><text x="68" y="562" class="body">als druiventrossen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Rafaëls uitleg · 6</text><text x="68" y="711" class="body">De vroegere vader en moeder aten,</text><text x="68" y="754" class="body">kenden wijsheid, zagen hun naaktheid en</text><text x="68" y="797" class="body">werden verdreven.</text><text x="46" y="890" class="note">De boom wordt met twee verschillende planten</text><text x="46" y="926" class="note">vergeleken; de passage noemt hem niet eenvoudig</text><text x="46" y="962" class="note">een druivenrank.</text></svg>