<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Gebed, boeken en vreugde</title><desc id="desc">Gebed, boeken en vreugde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, boeken en vreugde</text><text x="44" y="113" class="ref">Henoch 47:1–4</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vanaf de aarde · 1</text><text x="68" y="241" class="body">Gebed en de roep om recht voor vergoten</text><text x="68" y="284" class="body">rechtvaardig bloed stijgen op.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">In de hemel · 2</text><text x="68" y="433" class="body">Heiligen smeken en loven eensgezind,</text><text x="68" y="476" class="body">opdat recht gedaan wordt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De zitting · 3</text><text x="68" y="625" class="body">Het Hoofd van de dagen op de troon; de</text><text x="68" y="668" class="body">boeken van de levenden worden geopend.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De verhoring · 4</text><text x="68" y="817" class="body">Het getal is vol, het gebed verhoord en</text><text x="68" y="860" class="body">de heiligen zijn verheugd.</text><text x="46" y="953" class="note">De boeken vormen een afzonderlijk moment tussen</text><text x="46" y="989" class="note">voorbede en vreugde; de afbeelding toont geen</text><text x="46" y="1025" class="note">menselijke Godsfiguur.</text></svg>