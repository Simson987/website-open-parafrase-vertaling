<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Boeken, woningen en lof</title><desc id="desc">Boeken, woningen en lof met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boeken, woningen en lof</text><text x="44" y="113" class="ref">Henoch 39:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De opening · 1–3</text><text x="68" y="241" class="body">Heilige kinderen, ontvangen boeken en</text><text x="68" y="284" class="body">transport door wolk en wervelwind.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De woningen · 4–8</text><text x="68" y="433" class="body">Rechtvaardigen bij engelen; voorbede,</text><text x="68" y="476" class="body">gerechtigheid als water en ontferming</text><text x="68" y="519" class="body">als dauw.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Henochs lof · 9–11</text><text x="68" y="668" class="body">Verlangt daar te wonen en prijst de</text><text x="68" y="711" class="body">alwetende Heere.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Wie niet sluimeren · 12–14</text><text x="68" y="860" class="body">Onophoudelijke zegen en</text><text x="68" y="903" class="body">heiligverklaring; Henoch kan ten slotte</text><text x="68" y="946" class="body">niet meer zien.</text><text x="46" y="1039" class="note">Water, dauw en vleugels beschrijven</text><text x="46" y="1075" class="note">gerechtigheid, ontferming en bescherming in de</text><text x="46" y="1111" class="note">beeldtaal van dit visioen.</text></svg>