<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Vier stemmen en namen</title><desc id="desc">Vier stemmen en namen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier stemmen en namen</text><text x="44" y="113" class="ref">Henoch 40:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste · Michaël</text><text x="68" y="241" class="body">Barmhartig en geduldig; de eerste stem</text><text x="68" y="284" class="body">zegent de Heere van de geesten.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede · Rafaël</text><text x="68" y="433" class="body">Aangesteld over ziekten en wonden; de</text><text x="68" y="476" class="body">tweede stem zegent de Uitverkorene en</text><text x="68" y="519" class="body">de uitverkorenen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Derde · Gabriël</text><text x="68" y="668" class="body">Aangesteld over alle machten; de derde</text><text x="68" y="711" class="body">stem pleit voor aardbewoners.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vierde · Fanuël</text><text x="68" y="860" class="body">Aangesteld over bekering tot hoop; de</text><text x="68" y="903" class="body">vierde stem weert de satans en hun</text><text x="68" y="946" class="body">aanklacht af.</text><text x="46" y="1039" class="note">Namen en taken volgen deze passage. Fanuël wordt</text><text x="46" y="1075" class="note">niet vervangen door een naam uit Henoch 20.</text></svg>