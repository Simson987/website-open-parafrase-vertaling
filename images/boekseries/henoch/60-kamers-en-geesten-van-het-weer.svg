<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Kamers en geesten van het weer</title><desc id="desc">Kamers en geesten van het weer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kamers en geesten van het weer</text><text x="44" y="113" class="ref">Henoch 60:11–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verdeling · 11–15</text><text x="68" y="241" class="body">Winden, sterren, donder en bliksem:</text><text x="68" y="284" class="body">eigen tijden, rustplaatsen en kracht.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zee en koude · 16–18</text><text x="68" y="433" class="body">Geest van de zee; rijp en hagel hebben</text><text x="68" y="476" class="body">engelen; sneeuw en de bijzondere geest</text><text x="68" y="519" class="body">Dedek.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Nevel en dauw · 19–20</text><text x="68" y="668" class="body">Eigen kamer voor nevel; dauw verbonden</text><text x="68" y="711" class="body">met regenkamers.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Regen · 21–22</text><text x="68" y="860" class="body">Engelen openen de kamer; water voedt</text><text x="68" y="903" class="body">het droge land en wordt naar maat</text><text x="68" y="946" class="body">bewaard.</text><text x="46" y="1039" class="note">Dit is het weerbeeld van de visioenwereld; de</text><text x="46" y="1075" class="note">kamers worden niet als moderne meteorologie</text><text x="46" y="1111" class="note">uitgelegd.</text></svg>