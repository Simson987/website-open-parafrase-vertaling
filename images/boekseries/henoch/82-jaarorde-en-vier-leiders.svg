<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Jaarorde en vier leiders</title><desc id="desc">Jaarorde en vier leiders met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jaarorde en vier leiders</text><text x="44" y="113" class="ref">Henoch 82:4–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het jaar · 4–6</text><text x="68" y="241" class="body">364 dagen, inclusief vier ingevoegde</text><text x="68" y="284" class="body">dagen; poorten 1, 3, 4 en 6.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De ordening · 10–12</text><text x="68" y="433" class="body">Vier leiders voor jaardelen; twaalf</text><text x="68" y="476" class="body">voor maanden; hoofden van duizenden</text><text x="68" y="519" class="body">voor dagen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vier namen · 13</text><text x="68" y="668" class="body">Milkiël · Hel’emmelek · Mel’ejal ·</text><text x="68" y="711" class="body">Narel.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Drie volgende namen · 14</text><text x="68" y="860" class="body">Adnarel · Iyasusaël · Iyilumiël.</text><text x="46" y="953" class="note">Het schema bewaart de vier en drie afzonderlijke</text><text x="46" y="989" class="note">lijsten; de drie worden niet aan drie van de</text><text x="46" y="1025" class="note">vier gekoppeld.</text></svg>