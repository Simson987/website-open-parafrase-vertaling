<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Namen en lichtcyclus</title><desc id="desc">Namen en lichtcyclus met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Namen en lichtcyclus</text><text x="44" y="113" class="ref">Henoch 78:1–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zon · 1</text><text x="68" y="241" class="body">Orjares · Tomas.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Maan · 2</text><text x="68" y="390" class="body">Asonja · Ebla · Benase · Erae.</text><rect x="42" y="448" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Opbouw en afname · 6–14</text><text x="68" y="539" class="body">Vol licht rond dag 14–15; afname tot</text><text x="68" y="582" class="body">een lege schijf; nieuwe maan krijgt</text><text x="68" y="625" class="body">haar naam van licht.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Maandtellingen · 9,15–16</text><text x="68" y="774" class="body">Vers 9: 29 of 28 dagen; later 3 × 30 en</text><text x="68" y="817" class="body">3 × 29 = 177 dagen.</text><text x="46" y="910" class="note">De verschillende maandtellingen worden vermeld</text><text x="46" y="946" class="note">zonder ze tot één kalender te harmoniseren.</text></svg>