<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Beving en onderscheid</title><desc id="desc">Beving en onderscheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beving en onderscheid</text><text x="44" y="113" class="ref">Henoch 60:1–10,23–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanhef · 1</text><text x="68" y="241" class="body">Jaar 500, maand 7, dag 14; grote beving</text><text x="68" y="284" class="body">en onrust in het hemelse leger.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De hulp · 2–6</text><text x="68" y="433" class="body">Henoch valt neer; een door Michaël</text><text x="68" y="476" class="body">gezonden engel richt hem op; oordeel en</text><text x="68" y="519" class="body">barmhartigheid worden onderscheiden.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De monsters · 7–10</text><text x="68" y="668" class="body">Leviathan: vrouwelijk, zee; Behemoth:</text><text x="68" y="711" class="body">mannelijk, Dendaïn ten oosten van de</text><text x="68" y="754" class="body">tuin.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het slot · 23–25</text><text x="68" y="903" class="body">Tuin, verklaring van de vredesengel,</text><text x="68" y="946" class="body">straf en daarna oordeel in</text><text x="68" y="989" class="body">barmhartigheid.</text><text x="46" y="1082" class="note">De aanhef zegt Henoch, terwijl vers 8 over mijn</text><text x="46" y="1118" class="note">grootvader spreekt. Het schema bewaart de lokale</text><text x="46" y="1154" class="note">formuleringen zonder de verteller te hernoemen.</text></svg>