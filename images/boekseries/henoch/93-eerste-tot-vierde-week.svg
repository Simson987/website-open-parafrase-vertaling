<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">De eerste tot vierde week</title><desc id="desc">De eerste tot vierde week met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eerste tot vierde week</text><text x="44" y="113" class="ref">Henoch 93:1–6</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bron · 1–2</text><text x="68" y="241" class="body">Henoch spreekt uit geschriften,</text><text x="68" y="284" class="body">hemelvisioen, engelenstem en hemelse</text><text x="68" y="327" class="body">tafels.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Week 1 · 3</text><text x="68" y="476" class="body">Henoch als zevende geboren; gericht en</text><text x="68" y="519" class="body">gerechtigheid.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Week 2 · 4</text><text x="68" y="668" class="body">Slechtheid en eerste einde; één mens</text><text x="68" y="711" class="body">gered; daarna opnieuw onrecht.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Week 3 · 5</text><text x="68" y="860" class="body">Een mens uitgekozen tot plant van</text><text x="68" y="903" class="body">rechtvaardig gericht; blijvende plant</text><text x="68" y="946" class="body">volgt.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Week 4 · 6</text><text x="68" y="1095" class="body">Visioenen, wet voor alle generaties en</text><text x="68" y="1138" class="body">een omheining.</text><text x="46" y="1231" class="note">De ene geredde en de uitgekozen mens krijgen</text><text x="46" y="1267" class="note">hier geen persoonsnamen die deze verzen zelf</text><text x="46" y="1303" class="note">niet geven.</text></svg>