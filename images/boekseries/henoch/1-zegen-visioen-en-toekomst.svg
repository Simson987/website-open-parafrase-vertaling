<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Zegen, visioen en toekomst</title><desc id="desc">Zegen, visioen en toekomst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zegen, visioen en toekomst</text><text x="44" y="113" class="ref">Henoch 1:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De hoorders · 1–2</text><text x="68" y="241" class="body">Uitverkorenen en rechtvaardigen; een</text><text x="68" y="284" class="body">ver toekomstig geslacht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De openbaring · 2–4</text><text x="68" y="433" class="body">Henoch hoort en ziet door engelen; de</text><text x="68" y="476" class="body">Heilige verschijnt bij Sinaï.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het oordeel · 5–7,9</text><text x="68" y="625" class="body">Ontzag, geschudde bergen en oordeel</text><text x="68" y="668" class="body">over onrecht.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De bewaring · 8</text><text x="68" y="817" class="body">Vrede, barmhartigheid, zegen en licht</text><text x="68" y="860" class="body">voor de rechtvaardigen.</text><text x="46" y="953" class="note">Het hoofdstuk spreekt vanuit een visioen over</text><text x="46" y="989" class="note">een toekomstig geslacht; de beelden zijn geen</text><text x="46" y="1025" class="note">gewone ooggetuigenfoto’s.</text></svg>