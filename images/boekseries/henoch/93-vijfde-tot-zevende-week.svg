<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De vijfde tot zevende week</title><desc id="desc">De vijfde tot zevende week met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vijfde tot zevende week</text><text x="44" y="113" class="ref">Henoch 93:7–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Week 5 · 7</text><text x="68" y="241" class="body">Huis van heerlijkheid en heerschappij</text><text x="68" y="284" class="body">wordt gebouwd.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Week 6 · 8</text><text x="68" y="433" class="body">Blindheid en vergeten wijsheid; een</text><text x="68" y="476" class="body">mens klimt op; huis verbrand en</text><text x="68" y="519" class="body">geslacht verstrooid.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Week 7 · 9–10</text><text x="68" y="668" class="body">Afval; uitverkoren rechtvaardigen</text><text x="68" y="711" class="body">beloond en zevenvoudig onderwezen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vragen · 11–14</text><text x="68" y="860" class="body">Grenzen van menselijk horen, denken en</text><text x="68" y="903" class="body">meten van hemel en aarde.</text><text x="46" y="996" class="note">De achtste tot tiende week staan in 91:12–17. De</text><text x="46" y="1032" class="note">zevenvoudige leer wordt niet met zeven</text><text x="46" y="1068" class="note">ongenoemde vakken ingevuld.</text></svg>