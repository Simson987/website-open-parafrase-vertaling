<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Verzoekschrift, droom, terugkeer</title><desc id="desc">Verzoekschrift, droom, terugkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verzoekschrift, droom, terugkeer</text><text x="44" y="113" class="ref">Henoch 13:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De waarschuwing · 1–3</text><text x="68" y="241" class="body">Azazel en daarna de hele groep horen</text><text x="68" y="284" class="body">het oordeel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het verzoek · 4–6</text><text x="68" y="433" class="body">Beschaamde wachters vragen Henoch hun</text><text x="68" y="476" class="body">smeekbeden op te schrijven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij Dan · 7–8</text><text x="68" y="625" class="body">Voorlezing, slaap en een visioen van</text><text x="68" y="668" class="body">straf.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Terugkeer · 9–10</text><text x="68" y="817" class="body">In Abelsjaïl, tussen Libanon en</text><text x="68" y="860" class="body">Sénésér, vertelt hij de slapend geziene</text><text x="68" y="903" class="body">visioenen.</text><text x="46" y="996" class="note">De plaatsnamen volgen de tekst; het schema legt</text><text x="46" y="1032" class="note">ze niet vast op een moderne kaart.</text></svg>