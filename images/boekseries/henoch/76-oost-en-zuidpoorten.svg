<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1303" viewBox="0 0 840 1303" role="img" aria-labelledby="title desc"><title id="title">Windpoorten: oost en zuid</title><desc id="desc">Windpoorten: oost en zuid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1303" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Windpoorten: oost en zuid</text><text x="44" y="113" class="ref">Henoch 76:1–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oost · naar zuid · 5</text><text x="68" y="241" class="body">Verwoesting, droogte, hitte en verderf.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Oost · midden · 6</text><text x="68" y="390" class="body">Regen, vrucht, vrede en dauw.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Oost · naar noord · 6</text><text x="68" y="539" class="body">Kou en droogte.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Zuid · naar oost · 7</text><text x="68" y="688" class="body">Hete wind.</text><rect x="42" y="746" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Zuid · midden · 8</text><text x="68" y="837" class="body">Goede geur, dauw, regen, vrede en</text><text x="68" y="880" class="body">leven.</text><rect x="42" y="938" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="981" class="label">Zuid · naar west · 9</text><text x="68" y="1029" class="body">Dauw, regen, sprinkhanen en</text><text x="68" y="1072" class="body">verwoesting.</text><text x="46" y="1165" class="note">Drie poorten per windstreek volgens de</text><text x="46" y="1201" class="note">beschreven orde; symbolische windleer, geen</text><text x="46" y="1237" class="note">weerkaart.</text></svg>