<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Belijdenis zonder rust</title><desc id="desc">Belijdenis zonder rust met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Belijdenis zonder rust</text><text x="44" y="113" class="ref">Henoch 63:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verzoek · 1–5</text><text x="68" y="241" class="body">Een korte rust om neer te vallen, te</text><text x="68" y="284" class="body">belijden en God te loven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het inzicht · 6–8</text><text x="68" y="433" class="body">Rust ontbreekt; hun hoop lag op</text><text x="68" y="476" class="body">koninklijke scepter en eigen</text><text x="68" y="519" class="body">heerlijkheid.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De rekenschap · 9–10</text><text x="68" y="668" class="body">Zonden worden opgeteld; onrechtmatig</text><text x="68" y="711" class="body">bezit biedt geen redding.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het oordeel · 11–12</text><text x="68" y="860" class="body">Schaamte en verwijdering; dit geldt de</text><text x="68" y="903" class="body">machtigen en aardse bezitters.</text><text x="46" y="996" class="note">De koningen spreken zelf over hun verkeerde</text><text x="46" y="1032" class="note">vertrouwen; hun inzicht wordt niet tot verkregen</text><text x="46" y="1068" class="note">vrijspraak gemaakt.</text></svg>