<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Verandering, bekering, oordeel</title><desc id="desc">Verandering, bekering, oordeel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verandering, bekering, oordeel</text><text x="44" y="113" class="ref">Henoch 50:1–5</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De heiligen · 1</text><text x="68" y="241" class="body">Blijvend licht, heerlijkheid en eer.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De anderen · 2–3</text><text x="68" y="390" class="body">Zien de overwinning en worden tot</text><text x="68" y="433" class="body">bekering geroepen; redding door de Naam</text><text x="68" y="476" class="body">en ontferming.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De grens · 4–5</text><text x="68" y="625" class="body">Onrecht houdt geen stand; wie zich niet</text><text x="68" y="668" class="body">bekeert gaat verloren en ontvangt geen</text><text x="68" y="711" class="body">verdere ontferming.</text><text x="46" y="804" class="note">De passage verbindt barmhartigheid met een</text><text x="46" y="840" class="note">oproep tot bekering en een grens in het oordeel.</text></svg>