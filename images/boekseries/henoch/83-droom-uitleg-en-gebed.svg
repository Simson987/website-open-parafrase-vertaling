<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Droom, uitleg en gebed</title><desc id="desc">Droom, uitleg en gebed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Droom, uitleg en gebed</text><text x="44" y="113" class="ref">Henoch 83:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste droom · 1–4</text><text x="68" y="241" class="body">Vóór het huwelijk; hemel, aarde, bergen</text><text x="68" y="284" class="body">en bomen storten in.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mahalalel · 5–9</text><text x="68" y="433" class="body">Grootvader wekt hem, duidt de zonden en</text><text x="68" y="476" class="body">vraagt om gebed voor een overblijfsel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Henoch · 10–11</text><text x="68" y="625" class="body">Bidt en schrijft; ziet zon, maan en</text><text x="68" y="668" class="body">sterren in hun bekende orde en looft.</text><text x="46" y="761" class="note">Dit is Henochs eerste droom; de tweede volgt in</text><text x="46" y="797" class="note">hoofdstuk 85. De droom wordt niet als</text><text x="46" y="833" class="note">waargenomen aardgeschiedenis gepresenteerd.</text></svg>