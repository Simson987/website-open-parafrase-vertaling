<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Gaven, werktuigen en rust</title><desc id="desc">Gaven, werktuigen en rust met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gaven, werktuigen en rust</text><text x="44" y="113" class="ref">Henoch 53:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het ongevulde dal · 1–2</text><text x="68" y="241" class="body">Gaven en hulde vullen het dal niet;</text><text x="68" y="284" class="body">onrecht verslindt de arbeid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De werktuigen · 3–5</text><text x="68" y="433" class="body">Strafengelen maken ze klaar voor</text><text x="68" y="476" class="body">koningen en machtigen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De gemeenschap · 6</text><text x="68" y="625" class="body">De Rechtvaardige en Uitverkorene laat</text><text x="68" y="668" class="body">haar huis verschijnen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De rust · 7</text><text x="68" y="817" class="body">Bergen worden vlak en heuvels als een</text><text x="68" y="860" class="body">bron; rust na verdrukking.</text><text x="46" y="953" class="note">Het schema verbindt het onrecht met het oordeel</text><text x="46" y="989" class="note">en de beloofde rust zonder onbekende</text><text x="46" y="1025" class="note">folterwerktuigen te verzinnen.</text></svg>