<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Beelden van schuilen en hoop</title><desc id="desc">Beelden van schuilen en hoop met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beelden van schuilen en hoop</text><text x="44" y="113" class="ref">Henoch 96:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Arenden en gieren · 2</text><text x="68" y="241" class="body">Opstijgen en een hogere schuilplaats:</text><text x="68" y="284" class="body">beeld voor veiligheid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Klipdassen · 2</text><text x="68" y="433" class="body">Binnengaan in rotsspleten: beeld voor</text><text x="68" y="476" class="body">beschutting.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Sirenen · 2</text><text x="68" y="625" class="body">Zuchten en huilen van tegenstanders in</text><text x="68" y="668" class="body">de vergelijking.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Licht en rust · 3–8</text><text x="68" y="817" class="body">Hoop voor geleden onrecht, tegenover</text><text x="68" y="860" class="body">rijkdom die schuld niet wegneemt.</text><text x="46" y="953" class="note">De vergelijkingen zeggen niet dat mensen</text><text x="46" y="989" class="note">letterlijk in vogels of klipdassen veranderen.</text><text x="46" y="1025" class="note">Het bestaande rotsbeeld toont de menselijke</text><text x="46" y="1061" class="note">schuilplaats.</text></svg>