<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Twee monsters, twee woonplaatsen</title><desc id="desc">Twee monsters, twee woonplaatsen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee monsters, twee woonplaatsen</text><text x="44" y="113" class="ref">Henoch 60:7–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Leviathan · 7</text><text x="68" y="241" class="body">Vrouwelijk monster; zeediepten, boven</text><text x="68" y="284" class="body">de waterbronnen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Behemoth · 8</text><text x="68" y="433" class="body">Mannelijk monster; woestijn Dendaïn,</text><text x="68" y="476" class="body">ten oosten van de rechtvaardigentuin.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vraag · 9–10</text><text x="68" y="625" class="body">Henoch vraagt naar hun kracht en</text><text x="68" y="668" class="body">scheiding; de engel noemt dat verborgen</text><text x="68" y="711" class="body">kennis.</text><text x="46" y="804" class="note">De bestaande rasterbeelden zijn</text><text x="46" y="840" class="note">visioenillustraties; het schema controleert</text><text x="46" y="876" class="note">naam, geslacht en verschillende woonplaatsen.</text></svg>