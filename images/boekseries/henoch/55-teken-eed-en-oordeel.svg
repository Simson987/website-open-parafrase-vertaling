<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Teken, eed en oordeel</title><desc id="desc">Teken, eed en oordeel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Teken, eed en oordeel</text><text x="44" y="113" class="ref">Henoch 55:1–4</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De terugblik · 1</text><text x="68" y="241" class="body">Het Hoofd van de dagen spreekt over de</text><text x="68" y="284" class="body">vernietiging van aardbewoners.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De eed · 2</text><text x="68" y="433" class="body">Niet nogmaals zo handelen; een hemels</text><text x="68" y="476" class="body">teken als onderpand van trouw.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De grens · 3</text><text x="68" y="625" class="body">Het bevel over engelen, benauwdheid en</text><text x="68" y="668" class="body">straf blijft staan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De Uitverkorene · 4</text><text x="68" y="817" class="body">Koningen zien hem op de troon Azazel en</text><text x="68" y="860" class="body">zijn leger oordelen.</text><text x="46" y="953" class="note">Het hemelse trouwteken en het voortgaande</text><text x="46" y="989" class="note">oordeel zijn twee onderscheiden uitspraken in de</text><text x="46" y="1025" class="note">passage.</text></svg>