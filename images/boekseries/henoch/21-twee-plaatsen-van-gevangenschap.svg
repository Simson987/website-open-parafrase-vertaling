<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Twee plaatsen van gevangenschap</title><desc id="desc">Twee plaatsen van gevangenschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee plaatsen van gevangenschap</text><text x="44" y="113" class="ref">Henoch 21:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste plaats · 1–6</text><text x="68" y="241" class="body">Woest en ongegrond; zeven sterren als</text><text x="68" y="284" class="body">brandende bergen zijn samen gebonden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De uitleg · 4–6</text><text x="68" y="433" class="body">Uriël noemt overtreding van El Eljon en</text><text x="68" y="476" class="body">een termijn van 10.000 jaren.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De andere plaats · 7–10</text><text x="68" y="625" class="body">Nog gruwelijker, met afgrond en</text><text x="68" y="668" class="body">vuurpilaren; gevangenis van engelen tot</text><text x="68" y="711" class="body">in eeuwigheid.</text><text x="46" y="804" class="note">De twee plaatsen en hun genoemde termijnen</text><text x="46" y="840" class="note">worden niet samengevoegd tot één algemene</text><text x="46" y="876" class="note">vuurplaats.</text></svg>