<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Lichten en rechtvaardigen</title><desc id="desc">Lichten en rechtvaardigen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lichten en rechtvaardigen</text><text x="44" y="113" class="ref">Henoch 43:1–4</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De roep · 1</text><text x="68" y="241" class="body">Bliksem en sterren worden bij naam</text><text x="68" y="284" class="body">geroepen en luisteren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De weging · 2</text><text x="68" y="433" class="body">Lichtglans, plaats, verschijning en</text><text x="68" y="476" class="body">omwenteling worden gewogen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vraag · 3</text><text x="68" y="625" class="body">Henoch vraagt naar de betekenis.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De uitleg · 4</text><text x="68" y="774" class="body">De engel noemt het een gelijkenis van</text><text x="68" y="817" class="body">de namen van rechtvaardigen die op</text><text x="68" y="860" class="body">aarde geloven.</text><text x="46" y="953" class="note">De sleutel is de verklaarde gelijkenis: de</text><text x="46" y="989" class="note">sterren verbeelden hier rechtvaardigen, geen</text><text x="46" y="1025" class="note">gewone sterrenatlas.</text></svg>