<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Twee soorten boeken</title><desc id="desc">Twee soorten boeken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee soorten boeken</text><text x="44" y="113" class="ref">Henoch 104:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Namen · 1–6</text><text x="68" y="241" class="body">Engelen gedenken rechtvaardigen; hoop,</text><text x="68" y="284" class="body">geopende poorten en vreugde.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Daden · 7–9</text><text x="68" y="433" class="body">Elke dag genoteerd; licht en duisternis</text><text x="68" y="476" class="body">als getuigen; geen leugens of</text><text x="68" y="519" class="body">verdraaiing.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vervorming · 10</text><text x="68" y="668" class="body">Zondaars veranderen woorden en</text><text x="68" y="711" class="body">schrijven verzinsels in boeken.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Getrouw overschrijven · 11–13</text><text x="68" y="860" class="body">In hun talen, zonder veranderen of</text><text x="68" y="903" class="body">weglaten; boeken tot vreugde, wijsheid</text><text x="68" y="946" class="body">en oprechtheid.</text><text x="46" y="1039" class="note">De passage onderscheidt opgeschreven namen en</text><text x="46" y="1075" class="note">daden van het menselijk doorgeven van boeken;</text><text x="46" y="1111" class="note">het zijn geen drie identieke schrijversscènes.</text></svg>