<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Windstreken en zeventallen</title><desc id="desc">Windstreken en zeventallen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Windstreken en zeventallen</text><text x="44" y="113" class="ref">Henoch 77:1–8</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oost, zuid en west · 1–2</text><text x="68" y="241" class="body">Oost: eerste; zuid: neerdalen van de</text><text x="68" y="284" class="body">Allerhoogste; west: afnemen van</text><text x="68" y="327" class="body">lichten.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Noord · 3</text><text x="68" y="476" class="body">Drie delen: mensen; wateren en</text><text x="68" y="519" class="body">duisternis; tuin van de gerechtigheid.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zeven bergen · 4</text><text x="68" y="668" class="body">Hoger dan alle andere; bron van rijp.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zeven rivieren · 5–7</text><text x="68" y="817" class="body">Richtingen en zeeën worden beschreven;</text><text x="68" y="860" class="body">de formulering van vers 7 blijft</text><text x="68" y="903" class="body">onvereenvoudigd.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Zeven eilanden · 8</text><text x="68" y="1052" class="body">Twee op het vasteland en vijf in de</text><text x="68" y="1095" class="body">grote zee.</text><text x="46" y="1188" class="note">Dit is visionaire wereldindeling; de rivieren</text><text x="46" y="1224" class="note">worden niet met moderne geografische namen</text><text x="46" y="1260" class="note">vereenzelvigd.</text></svg>