<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Sterren en de gevolgen</title><desc id="desc">Sterren en de gevolgen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sterren en de gevolgen</text><text x="44" y="113" class="ref">Henoch 86:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Neerdalen · 1–3</text><text x="68" y="241" class="body">Eerst één ster, daarna veel sterren</text><text x="68" y="284" class="body">tussen de grazende runderen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vermenging · 4</text><text x="68" y="433" class="body">De tekst beschrijft seksuele</text><text x="68" y="476" class="body">vermenging; olifanten, kamelen en ezels</text><text x="68" y="519" class="body">worden geboren.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ontwrichting · 5–6</text><text x="68" y="668" class="body">Angst, onderling geweld en verslinden;</text><text x="68" y="711" class="body">de kinderen van de aarde vluchten.</text><text x="46" y="804" class="note">De seksuele passage krijgt een zakelijke</text><text x="46" y="840" class="note">tekstregel; de nieuwe illustratie toont de</text><text x="46" y="876" class="note">vlucht en geen paring.</text></svg>