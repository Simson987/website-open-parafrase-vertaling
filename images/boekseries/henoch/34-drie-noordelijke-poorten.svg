<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Drie noordelijke poorten</title><desc id="desc">Drie noordelijke poorten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie noordelijke poorten</text><text x="44" y="113" class="ref">Henoch 34:1–3</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De richting · 1–2</text><text x="68" y="241" class="body">Noorden, aan de einden van de aarde;</text><text x="68" y="284" class="body">drie geopende hemelpoorten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De verschijnselen · 2</text><text x="68" y="433" class="body">Kou, hagel, vorst, sneeuw, dauw en</text><text x="68" y="476" class="body">regen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Eén poort · 3</text><text x="68" y="625" class="body">De wind gaat ten goede uit.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Twee poorten · 3</text><text x="68" y="774" class="body">Geweldige wind met verval over de</text><text x="68" y="817" class="body">aarde.</text><text x="46" y="910" class="note">De verdeling is één tegenover twee; welke</text><text x="46" y="946" class="note">afzonderlijke poort dat is wordt niet genoemd.</text></svg>