<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Twee beschreven heerschappijen</title><desc id="desc">Twee beschreven heerschappijen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee beschreven heerschappijen</text><text x="44" y="113" class="ref">Henoch 82:15–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Milkiël · 15–17</text><text x="68" y="241" class="body">Ook Tem’ani en de zon genoemd; 91</text><text x="68" y="284" class="body">dagen; hitte, blad, bloemen en</text><text x="68" y="327" class="body">tarweoogst.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zijn namen · 17</text><text x="68" y="476" class="body">Berkaël · Zelebsaël; toegevoegd hoofd</text><text x="68" y="519" class="body">van duizend: Heloyaseph.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Hel’emmelek · 18–19</text><text x="68" y="668" class="body">De blinkende zon; 91 dagen; droogte,</text><text x="68" y="711" class="body">rijpe vrucht, schapen en wijnpers.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zijn namen · 20</text><text x="68" y="860" class="body">Gedaël · Keël · Heël; toegevoegd hoofd</text><text x="68" y="903" class="body">van duizend: Asfaël.</text><text x="46" y="996" class="note">De plaatselijke spellingen en aantallen blijven</text><text x="46" y="1032" class="note">behouden; de andere twee jaardelen worden hier</text><text x="46" y="1068" class="note">niet aangevuld.</text></svg>