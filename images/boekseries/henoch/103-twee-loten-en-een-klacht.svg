<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Twee loten en een klacht</title><desc id="desc">Twee loten en een klacht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee loten en een klacht</text><text x="44" y="113" class="ref">Henoch 103:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hemelse tafels · 1–4</text><text x="68" y="241" class="body">Goedheid, vreugde en blijvende</text><text x="68" y="284" class="body">herinnering voor rechtvaardig</text><text x="68" y="327" class="body">gestorvenen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Schijnbaar geluk · 5–8</text><text x="68" y="476" class="body">Een rijk en geëerd einde van zondaars</text><text x="68" y="519" class="body">is niet hetzelfde als hun uiteindelijke</text><text x="68" y="562" class="body">lot.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De klacht · 9–13</text><text x="68" y="711" class="body">Zwoegen, machteloosheid, juk en nergens</text><text x="68" y="754" class="body">veilig kunnen vluchten.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Niet gehoord · 14–15</text><text x="68" y="903" class="body">Machthebbers negeren de klacht en</text><text x="68" y="946" class="body">steunen de onderdrukkers.</text><text x="46" y="1039" class="note">De vreugde- en klachtbeelden tonen verschillende</text><text x="46" y="1075" class="note">delen van de rede; uiterlijke voorspoed wordt</text><text x="46" y="1111" class="note">niet als vrijspraak behandeld.</text></svg>