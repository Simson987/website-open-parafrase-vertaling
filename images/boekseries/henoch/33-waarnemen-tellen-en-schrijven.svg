<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Waarnemen, tellen en schrijven</title><desc id="desc">Waarnemen, tellen en schrijven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarnemen, tellen en schrijven</text><text x="44" y="113" class="ref">Henoch 33:1–4</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verscheidenheid · 1</text><text x="68" y="241" class="body">Dieren en vogels verschillen in</text><text x="68" y="284" class="body">gedaante, schoonheid en stem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De poorten · 2–3</text><text x="68" y="433" class="body">Oostelijk uiteinde en geopende</text><text x="68" y="476" class="body">hemelpoorten waaruit sterren komen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Henochs registratie · 3</text><text x="68" y="625" class="body">Uitgangen, getal, namen, volgorde,</text><text x="68" y="668" class="body">standplaatsen, tijden en maanden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Uriëls onderwijs · 3–4</text><text x="68" y="817" class="body">Toont en schrijft namen, voorschriften</text><text x="68" y="860" class="body">en taken op.</text><text x="46" y="953" class="note">Het hoofdstuk noemt wel het tellen, maar geeft</text><text x="46" y="989" class="note">hier geen compleet aantal poorten of</text><text x="46" y="1025" class="note">sterrennamen.</text></svg>