<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Familie, verlies en terugkeer</title><desc id="desc">Het gezin, de verliezen, de verschillende keuzes en de aankomst bij de gersteoogst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familie, verlies en terugkeer</text><text x="44" y="113" class="ref">Ruth 1:2–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het vertrekkende gezin</text><text x="68" y="241" class="body">Elimelech en Naomi met hun zonen</text><text x="68" y="284" class="body">Machlon en Chiljon.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">In Moab</text><text x="68" y="433" class="body">Elimelech sterft; de zonen trouwen met</text><text x="68" y="476" class="body">Orpa en Ruth. Later sterven ook de</text><text x="68" y="519" class="body">zonen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De terugweg</text><text x="68" y="668" class="body">Orpa neemt afscheid; Ruth gaat met</text><text x="68" y="711" class="body">Naomi mee.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bethlehem</text><text x="68" y="860" class="body">De vrouwen herkennen Naomi; zij spreekt</text><text x="68" y="903" class="body">over haar bitterheid en de naam Mara.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het oogstmoment</text><text x="68" y="1052" class="body">Aankomst aan het begin van de</text><text x="68" y="1095" class="body">gersteoogst.</text><text x="46" y="1188" class="note">Ruth 1 koppelt nog niet iedere zoon aan een</text><text x="46" y="1224" class="note">schoondochter; hoofdstuk 4 noemt Ruth als</text><text x="46" y="1260" class="note">Machlons vrouw.</text></svg>