<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Obed, Ruth en Naomi</title><desc id="desc">De verschillende rollen van moeder, vader, verzorgster en de naamgeving van Obed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Obed, Ruth en Naomi</text><text x="44" y="113" class="ref">Ruth 4:13–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De ouders</text><text x="68" y="241" class="body">Boaz en Ruth krijgen een zoon.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De vrouwen tot Naomi</text><text x="68" y="390" class="body">Zij spreken over nieuwe levensmoed en</text><text x="68" y="433" class="body">verzorging in de ouderdom.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Naomi’s plaats</text><text x="68" y="582" class="body">Zij neemt het kind op schoot en wordt</text><text x="68" y="625" class="body">zijn verzorgster.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De naam</text><text x="68" y="774" class="body">De buurvrouwen noemen hem Obed.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">De verdere lijn</text><text x="68" y="923" class="body">Obed is de vader van Isaï; Isaï de</text><text x="68" y="966" class="body">vader van David.</text><text x="46" y="1059" class="note">Naomi is de verzorgster, Ruth de moeder; de</text><text x="46" y="1095" class="note">vreugde-uitspraak over Naomi verandert die</text><text x="46" y="1131" class="note">relatie niet.</text></svg>