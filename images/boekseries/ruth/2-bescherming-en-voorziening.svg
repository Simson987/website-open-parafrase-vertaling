<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Bescherming en voorziening</title><desc id="desc">De verschillende concrete vormen van bescherming, voedsel en werk voor Ruth.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bescherming en voorziening</text><text x="44" y="113" class="ref">Ruth 2:8–23</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Op hetzelfde veld</text><text x="68" y="241" class="body">Ruth blijft bij de meisjes van Boaz.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Veiligheid en water</text><text x="68" y="390" class="body">De knechten mogen haar niet aanraken;</text><text x="68" y="433" class="body">zij mag uit hun kruiken drinken.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De maaltijd</text><text x="68" y="582" class="body">Brood, azijn en geroosterd graan; ze</text><text x="68" y="625" class="body">houdt over.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het werk</text><text x="68" y="774" class="body">Ook tussen de schoven oplezen; knechten</text><text x="68" y="817" class="body">laten bewust aren liggen.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Naar Naomi</text><text x="68" y="966" class="body">Ongeveer twintig liter gerst én het</text><text x="68" y="1009" class="body">overgebleven eten; het werk loopt door</text><text x="68" y="1052" class="body">tot het einde van beide graanoogsten.</text><text x="46" y="1145" class="note">De twintig liter hoort bij de avond van deze</text><text x="46" y="1181" class="note">dag, niet bij de totale oogstperiode.</text></svg>