<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Het verzoek en twee lossers</title><desc id="desc">Het verzoek, de voorrang van de andere losser en de zes maten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het verzoek en twee lossers</text><text x="44" y="113" class="ref">Ruth 3:9–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruths verzoek</text><text x="68" y="241" class="body">Sla uw vleugel uit over uw dienares:</text><text x="68" y="284" class="body">zij beroept zich op Boaz als losser.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Boaz’ antwoord</text><text x="68" y="433" class="body">Hij wil handelen, maar er bestaat een</text><text x="68" y="476" class="body">nauwer verwante losser.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De volgorde</text><text x="68" y="625" class="body">Die ander krijgt de eerste</text><text x="68" y="668" class="body">mogelijkheid; zo niet, dan zal Boaz</text><text x="68" y="711" class="body">lossen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zes maten gerst</text><text x="68" y="860" class="body">Mee voor Naomi; de tekst geeft hier</text><text x="68" y="903" class="body">geen literomrekening.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Naomi’s raad</text><text x="68" y="1052" class="body">Rustig afwachten; Boaz zal de zaak die</text><text x="68" y="1095" class="body">dag afhandelen.</text><text x="46" y="1188" class="note">De vleugel is beeldspraak in Ruths verzoek; de</text><text x="46" y="1224" class="note">lossers zijn twee verschillende mannen.</text></svg>