<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Lossing bij de stadspoort</title><desc id="desc">De stappen van de bespreking, de tien oudsten en de sandaal als bewijs.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lossing bij de stadspoort</text><text x="44" y="113" class="ref">Ruth 4:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanwezigen</text><text x="68" y="241" class="body">Boaz, de nauwer verwante losser en tien</text><text x="68" y="284" class="body">oudsten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerst het land</text><text x="68" y="433" class="body">De ander wil aanvankelijk het land</text><text x="68" y="476" class="body">lossen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dan de volledige zaak</text><text x="68" y="625" class="body">Ook Ruth en de naam van de overledene</text><text x="68" y="668" class="body">op zijn erfdeel; de ander ziet af van</text><text x="68" y="711" class="body">zijn recht.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het bewijs</text><text x="68" y="860" class="body">De sandaal wordt uitgetrokken en</text><text x="68" y="903" class="body">overgedragen.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De getuigen</text><text x="68" y="1052" class="body">Boaz verklaart de overname en zijn</text><text x="68" y="1095" class="body">huwelijk met Ruth; oudsten en volk</text><text x="68" y="1138" class="body">bevestigen.</text><text x="46" y="1231" class="note">De naam van de andere losser wordt in de tekst</text><text x="46" y="1267" class="note">niet gegeven.</text></svg>