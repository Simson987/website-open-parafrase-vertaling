<title id="title">Van Perez tot David</title>
<desc id="desc">Tien namen in de vader-zoonlijn van Ruth 4:18–22. Elke pijl betekent vader van. Salma in vers 20 en Salmon in vers 21 staan bij dezelfde schakel.</desc>
