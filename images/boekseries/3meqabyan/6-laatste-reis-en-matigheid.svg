<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Laatste reis en matigheid</title><desc id="desc">Laatste reis en matigheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Laatste reis en matigheid</text><text x="44" y="113" class="ref">3 Meqabyan 6:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Reis · 1–8</text><text x="68" y="241" class="body">Rijkdom achterlaten; verschillende</text><text x="68" y="284" class="body">ontvangst van zielen; bekering tijdens</text><text x="68" y="327" class="body">leven.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Matigheid · 9–11</text><text x="68" y="476" class="body">Overvulling leidt af; Jakob verzadigd</text><text x="68" y="519" class="body">en God verlaten; paard en zwijn als</text><text x="68" y="562" class="body">beelden.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Vastheid · 12–13</text><text x="68" y="711" class="body">Muur van diamant en sterke wal;</text><text x="68" y="754" class="body">rechtvaardige als vertrouwende leeuw.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Waarschuwing · 14–16</text><text x="68" y="903" class="body">Onoprecht hart, angst, onrust en ziekte</text><text x="68" y="946" class="body">in de rede.</text><text x="46" y="1039" class="note">De dier- en muurbeelden zijn vergelijkingen voor</text><text x="46" y="1075" class="note">gedrag en vertrouwen, geen veranderde</text><text x="46" y="1111" class="note">mensenlichamen.</text></svg>