<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Het sieraad van een mens</title><desc id="desc">Het sieraad van een mens met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het sieraad van een mens</text><text x="44" y="113" class="ref">3 Meqabyan 10:16–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Middelen · 16–18</text><text x="68" y="241" class="body">Bezit, kleding, macht en kennis geven</text><text x="68" y="284" class="body">verantwoordelijkheid voor de naaste.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Matigheid · 19–21</text><text x="68" y="433" class="body">Vasten en bidden; aardse sieraden,</text><text x="68" y="476" class="body">topaas en smaragd niet het hoogste.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Sieraad · 22–23</text><text x="68" y="625" class="body">Zuiverheid, wijsheid, kennis, liefde en</text><text x="68" y="668" class="body">geen kwaad vergelden.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Slot · 24–29</text><text x="68" y="817" class="body">Opstanding erkennen; nu berouw;</text><text x="68" y="860" class="body">voorbereiden op het goede en blijvende</text><text x="68" y="903" class="body">vreugde.</text><text x="46" y="996" class="note">Voedsel, kleding, recht en onderwijs zijn vier</text><text x="46" y="1032" class="note">concrete taken in de slotrede.</text></svg>