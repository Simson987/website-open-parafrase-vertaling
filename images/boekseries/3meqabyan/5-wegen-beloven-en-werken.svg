<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Wegen, beloven en werken</title><desc id="desc">Wegen, beloven en werken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wegen, beloven en werken</text><text x="44" y="113" class="ref">3 Meqabyan 5:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rekenschap · 1–6</text><text x="68" y="241" class="body">Uit stof; daden wegen en goed of kwaad</text><text x="68" y="284" class="body">overwegen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Woord · 7–10</text><text x="68" y="433" class="body">Laster, valse eed en belofte zonder</text><text x="68" y="476" class="body">geven; oppotten laat naaste</text><text x="68" y="519" class="body">tekortkomen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Maat · 11–13</text><text x="68" y="668" class="body">Geen vervalste weegschaal en geen</text><text x="68" y="711" class="body">geroofd bezit.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Werk · 14–16</text><text x="68" y="860" class="body">Eerlijk eigen werk; weinig met recht</text><text x="68" y="903" class="body">boven grote onrechtmatige rijkdom;</text><text x="68" y="946" class="body">rookbeeld.</text><text x="46" y="1039" class="note">De weegschaal verbindt letterlijk eerlijk</text><text x="46" y="1075" class="note">handelen met het figuurlijke afwegen van eigen</text><text x="46" y="1111" class="note">daden.</text></svg>