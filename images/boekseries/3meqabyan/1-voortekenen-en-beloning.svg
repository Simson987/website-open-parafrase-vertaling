<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Voortekenen en beloning</title><desc id="desc">Voortekenen en beloning met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voortekenen en beloning</text><text x="44" y="113" class="ref">3 Meqabyan 1:11–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tekens · 11–12</text><text x="68" y="241" class="body">Sterren, wolkenvormen, vuur,</text><text x="68" y="284" class="body">vogelvlucht en dieren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mechanisme · 13–14</text><text x="68" y="433" class="body">Waarzeggers spreken; teken komt uit;</text><text x="68" y="476" class="body">raadplegers betalen en prijzen hen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Doel · 15</text><text x="68" y="625" class="body">Volgens de spreker leidt succes tot</text><text x="68" y="668" class="body">verdere dwaling.</text><text x="46" y="761" class="note">De beschreven waarzeggerij is onderwerp van</text><text x="46" y="797" class="note">kritiek in Sablyanos’ eigen rede, geen</text><text x="46" y="833" class="note">betrouwbare voorspelmethode.</text></svg>