<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Gaven en verantwoording</title><desc id="desc">Gaven en verantwoording met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gaven en verantwoording</text><text x="44" y="113" class="ref">3 Meqabyan 9:13–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gaven · 13–18</text><text x="68" y="241" class="body">Regen, gras, vrucht, kleding en hemelse</text><text x="68" y="284" class="body">eer; gebod bewaren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oproep · 19–24</text><text x="68" y="433" class="body">Voor sterven Gods wil doen; mens als</text><text x="68" y="476" class="body">ademtocht en schaduw.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gezag · 25–32</text><text x="68" y="625" class="body">Sauls koningschap aan David; Schepper</text><text x="68" y="668" class="body">tegenover gemaakte afgoden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Opstanding · 33–36</text><text x="68" y="817" class="body">Zielen terug in lichamen; werken van</text><text x="68" y="860" class="body">jeugd tot heden openbaar.</text><text x="46" y="953" class="note">Naakt staan verbeeldt onbedekte rekenschap; de</text><text x="46" y="989" class="note">beelden tonen mensen respectvol bedekt.</text></svg>