<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Herleven en rekenschap</title><desc id="desc">Herleven en rekenschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herleven en rekenschap</text><text x="44" y="113" class="ref">3 Meqabyan 10:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Planten · 1–8</text><text x="68" y="241" class="body">Regen en levensadem als vergelijking;</text><text x="68" y="284" class="body">Gods woord laat herleven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dag · 9–13</text><text x="68" y="433" class="body">Opstaan en boek van schuld; eigen</text><text x="68" y="476" class="body">uitvluchten houden geen stand.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Oproep · 14–15</text><text x="68" y="625" class="body">Nu berouw en goeddoen; vreugde met</text><text x="68" y="668" class="body">engelen als verwachting.</text><text x="46" y="761" class="note">Natuurbeeld, aansporing en oordeelsvoorstelling</text><text x="46" y="797" class="note">zijn verschillende onderdelen van het betoog.</text></svg>