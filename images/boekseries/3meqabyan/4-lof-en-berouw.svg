<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Lof en berouw</title><desc id="desc">Lof en berouw met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lof en berouw</text><text x="44" y="113" class="ref">3 Meqabyan 4:1–36</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Redden · 1–7</text><text x="68" y="241" class="body">Schaap uit wolfshand; nederige mensen</text><text x="68" y="284" class="body">en engelen loven; hoogmoed verliest</text><text x="68" y="327" class="body">eer.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Adam · 8–19</text><text x="68" y="476" class="body">Tiende geslacht; klei, water, vuur en</text><text x="68" y="519" class="body">wind; aardse lof bij hemelse lof.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Nederigheid · 20–28</text><text x="68" y="668" class="body">Geen paardenkracht maar ontzag; mens</text><text x="68" y="711" class="body">buigt in berouw, verleider niet.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Volharding · 29–36</text><text x="68" y="860" class="body">Fout erkennen en niet herhalen;</text><text x="68" y="903" class="body">Schepper kent zwakheid van vlees en</text><text x="68" y="946" class="body">bloed.</text><text x="46" y="1039" class="note">Het tiende geslacht wordt genoemd zonder een</text><text x="46" y="1075" class="note">volledige engelenrangorde in te vullen. De</text><text x="46" y="1111" class="note">scheppingstaal is theologische beeldspraak.</text></svg>