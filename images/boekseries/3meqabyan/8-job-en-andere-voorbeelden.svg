<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Job en andere voorbeelden</title><desc id="desc">Job en andere voorbeelden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job en andere voorbeelden</text><text x="44" y="113" class="ref">3 Meqabyan 8:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Job · 1–3</text><text x="68" y="241" class="body">Vertrouwt, looft en volhardt; genezing</text><text x="68" y="284" class="body">en grotere rijkdom.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aansporing · 4–6</text><text x="68" y="433" class="body">Geduld, vertrouwen, roepen, hopen en</text><text x="68" y="476" class="body">bidden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Genoemde reeks · 7–8</text><text x="68" y="625" class="body">Esther, Mordechai, Judit, Gideon,</text><text x="68" y="668" class="body">Barak, Debora, Simson en Jefta.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Slot · 9–12</text><text x="68" y="817" class="body">Onpartijdig recht; leven en dood,</text><text x="68" y="860" class="body">vernederen en verhogen.</text><text x="46" y="953" class="note">De namenreeks is een herinnering aan</text><text x="46" y="989" class="note">voorbeelden, geen volledige biografie of</text><text x="46" y="1025" class="note">chronologische volgorde.</text></svg>