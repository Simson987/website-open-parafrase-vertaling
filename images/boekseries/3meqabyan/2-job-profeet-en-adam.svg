<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Job, profeet en Adam</title><desc id="desc">Job, profeet en Adam met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job, profeet en Adam</text><text x="44" y="113" class="ref">3 Meqabyan 2:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gods antwoord · 1</text><text x="68" y="241" class="body">Job als voorbeeld van niet overwonnen</text><text x="68" y="284" class="body">trouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verleider · 2–7</text><text x="68" y="433" class="body">Verlangen, zintuigen, woorden, slaap,</text><text x="68" y="476" class="body">drank en laster als listen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Profeet · 8–14</text><text x="68" y="625" class="body">Spreekt tegen hoogmoedige geest; Adam</text><text x="68" y="668" class="body">uit stof tot lofprijzing.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tuin · 15–23</text><text x="68" y="817" class="body">Verbod; Eva als schaap en duif in</text><text x="68" y="860" class="body">vergelijking; Adam verleid; slot breekt</text><text x="68" y="903" class="body">af.</text><text x="46" y="996" class="note">De spreker wisselt. Schaap, duif en gif zijn</text><text x="46" y="1032" class="note">beelden van de rede, geen extra diersoorten in</text><text x="46" y="1068" class="note">de scheppingshandeling.</text></svg>