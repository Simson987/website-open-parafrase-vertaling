<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Gedachten, ballingschap en troost</title><desc id="desc">Gedachten, ballingschap en troost met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gedachten, ballingschap en troost</text><text x="44" y="113" class="ref">3 Meqabyan 3:1–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Open begin · 1–2,5</text><text x="68" y="241" class="body">Meerdere zinnen afgebroken.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Gedachten · 3–4</text><text x="68" y="390" class="body">Golven, stofwervel en regendruppels als</text><text x="68" y="433" class="body">veelheid van menselijke gedachten.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Tuin verlaten · 6–7</text><text x="68" y="582" class="body">Overtreding en rechtvaardig oordeel;</text><text x="68" y="625" class="body">tegelijk troost op aarde.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Nieuwe groei · 8–11</text><text x="68" y="774" class="body">Jonge boomloten, kinderen, koren, water</text><text x="68" y="817" class="body">en landvrucht vernieuwen hart.</text><text x="46" y="910" class="note">De troost volgt op de verbanning; de tekst</text><text x="46" y="946" class="note">vertelt geen definitieve vijandschap tussen</text><text x="46" y="982" class="note">Schepper en mens.</text></svg>