<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Wegen die God kent</title><desc id="desc">Wegen die God kent met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wegen die God kent</text><text x="44" y="113" class="ref">3 Meqabyan 9:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie sporen · 2–3</text><text x="68" y="241" class="body">Arend in lucht, slang op rots, schip op</text><text x="68" y="284" class="body">zee.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ziel · 4–10</text><text x="68" y="433" class="body">Waarheen zij gaat is alleen God bekend;</text><text x="68" y="476" class="body">dauw, storm, sterren, zand, diamant,</text><text x="68" y="519" class="body">bomen en wolk.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verborgen raad · 11–12</text><text x="68" y="668" class="body">Niemand doorgrondt Gods plan; aarde op</text><text x="68" y="711" class="body">water en hemel als tentdoek.</text><text x="46" y="804" class="note">De natuurbeelden benadrukken verborgen wegen;</text><text x="46" y="840" class="note">zij zijn geen routekaart van zielen na de dood.</text></svg>