<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De stem van Sablyanos</title><desc id="desc">De stem van Sablyanos met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De stem van Sablyanos</text><text x="44" y="113" class="ref">3 Meqabyan 1:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verteller · 1–2</text><text x="68" y="241" class="body">Verwacht recht tegen Sablyanos en zijn</text><text x="68" y="284" class="body">hoogmoed.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sablyanos · 3–16</text><text x="68" y="433" class="body">Spreekt zelf over listen: rijkdom,</text><text x="68" y="476" class="body">edelstenen, kleding, ruzie en</text><text x="68" y="519" class="body">voortekenen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Smeekbede · 17–21</text><text x="68" y="668" class="body">Vraagt oordeel voor wie volgt en kroon</text><text x="68" y="711" class="body">voor wie hem weerstaat.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Antwoord · 22–24</text><text x="68" y="860" class="body">Gevolg van verleiding en blijvend</text><text x="68" y="903" class="body">oordeel.</text><text x="46" y="996" class="note">Het ik in de verleidingsrede is Sablyanos. De</text><text x="46" y="1032" class="note">tekst beschrijft zijn aanspraken; het zijn geen</text><text x="46" y="1068" class="note">adviezen van de verteller.</text></svg>