<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Gezin, namen en omkeer</title><desc id="desc">De volledige hoofdstukopbouw met de belangrijkste beelden en de eigen uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gezin, namen en omkeer</text><text x="44" y="113" class="ref">Hosea 1:1–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin · 1–5</text><text x="68" y="241" class="body">Tijd van genoemde koningen, Hosea en</text><text x="68" y="284" class="body">Gomer; zoon Jizreël, oordeel over</text><text x="68" y="327" class="body">Jehu’s huis en gebroken boog.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De volgende namen · 6–9</text><text x="68" y="476" class="body">Dochter Lo-Ruchama, ontferming over</text><text x="68" y="519" class="body">Juda; zoon Lo-Ammi en de breuk met het</text><text x="68" y="562" class="body">volk.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De belofte · 10–12</text><text x="68" y="711" class="body">Ontelbaar volk, kinderen van levende</text><text x="68" y="754" class="body">God, Juda en Israël samen, één hoofd;</text><text x="68" y="797" class="body">Ammi en Ruchama.</text><text x="46" y="890" class="note">De plaatselijke versindeling wordt gevolgd.</text><text x="46" y="926" class="note">Gezinshandeling, vergelijking, aanklacht en</text><text x="46" y="962" class="note">belofte zijn onderscheiden.</text></svg>