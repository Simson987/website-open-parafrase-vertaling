<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Gebrek aan trouw en kennis</title><desc id="desc">De volledige hoofdstukopbouw met de belangrijkste beelden en de eigen uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebrek aan trouw en kennis</text><text x="44" y="113" class="ref">Hosea 4:1–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De rechtszaak · 1–3</text><text x="68" y="241" class="body">Geen trouw, liefde of kennis, kwaad en</text><text x="68" y="284" class="body">grensloos bloed; het land, mensen en</text><text x="68" y="327" class="body">dieren kwijnen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Priester en volk · 4–11</text><text x="68" y="476" class="body">Verworpen kennis en wet, schuld als</text><text x="68" y="519" class="body">voedsel, zelfde vergelding, niet</text><text x="68" y="562" class="body">verzadigd en verstand weg.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De afgoderij · 12–19</text><text x="68" y="711" class="body">Hout raadplegen, offerhoogten en</text><text x="68" y="754" class="body">ontrouw; mannen zelf schuldig,</text><text x="68" y="797" class="body">waarschuwing aan Juda, koppige koe en</text><text x="68" y="840" class="body">wind.</text><text x="46" y="933" class="note">De plaatselijke versindeling wordt gevolgd.</text><text x="46" y="969" class="note">Gezinshandeling, vergelijking, aanklacht en</text><text x="46" y="1005" class="note">belofte zijn onderscheiden.</text></svg>