<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">Jakob en de profeet</title><desc id="desc">De verschillende verwijzingen naar Jakob en Israël en de centrale oproep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jakob en de profeet</text><text x="44" y="113" class="ref">Hosea 12:4–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jakob · 4–5</text><text x="68" y="241" class="body">Hiel van broer, strijd met Engel,</text><text x="68" y="284" class="body">huilen en smeken, Hem in Beth-El</text><text x="68" y="327" class="body">vinden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De oproep · 6–7</text><text x="68" y="476" class="body">HEERE, God van legermachten: terugkeer,</text><text x="68" y="519" class="body">liefde en recht vasthouden, altijd</text><text x="68" y="562" class="body">hopen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Jakob als hoeder · 13</text><text x="68" y="711" class="body">Vlucht naar Syrië, dienen om een vrouw</text><text x="68" y="754" class="body">en kudde hoeden om een vrouw.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Israël gehoed · 14</text><text x="68" y="903" class="body">Door een profeet uit Egypte gebracht,</text><text x="68" y="946" class="body">door een profeet gehoed.</text><text x="46" y="1039" class="note">De plaatselijke tekst noemt bij deze</text><text x="46" y="1075" class="note">herinneringen geen vrouwennaam of profetennaam.</text><text x="46" y="1111" class="note">Die worden hier niet als nieuwe gegevens</text><text x="46" y="1147" class="note">ingevuld.</text></svg>