<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Twee manieren van zaaien</title><desc id="desc">De tegenstelling tussen opgedragen recht en de beschreven eigen daden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee manieren van zaaien</text><text x="44" y="113" class="ref">Hosea 10:11–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Toebedeelde arbeid · 11</text><text x="68" y="241" class="body">Efraïm inspannen, Juda ploegen, Jakob</text><text x="68" y="284" class="body">eggen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De oproep · 12</text><text x="68" y="433" class="body">Gerechtigheid zaaien, liefde oogsten,</text><text x="68" y="476" class="body">nieuw land ploegen en Hem zoeken tot</text><text x="68" y="519" class="body">Hij gerechtigheid laat regenen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De eigen daad · 13</text><text x="68" y="668" class="body">Goddeloosheid geploegd, onrecht</text><text x="68" y="711" class="body">geoogst, leugenvrucht gegeten; eigen</text><text x="68" y="754" class="body">weg en helden vertrouwd.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het gevolg · 14–15</text><text x="68" y="903" class="body">Oorlogsrumoer, vestingen verwoest,</text><text x="68" y="946" class="body">Beth-Arbel als vergelijking, oordeel</text><text x="68" y="989" class="body">over Beth-El en koning.</text><text x="46" y="1082" class="note">Het gaat om twee morele wegen in landbouwtaal.</text><text x="46" y="1118" class="note">De opdracht en de feitelijke verkeerde oogst</text><text x="46" y="1154" class="note">worden niet samengevoegd.</text></svg>