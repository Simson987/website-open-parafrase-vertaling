<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Alarmplaatsen en gezochte hulp</title><desc id="desc">De verschillende concrete waarschuwingen en de vergeefse gezochte hulp.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Alarmplaatsen en gezochte hulp</text><text x="44" y="113" class="ref">Hosea 5:1,8–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Strik en net · 1</text><text x="68" y="241" class="body">Mizpa en Tabor, gericht tot priesters,</text><text x="68" y="284" class="body">volk en koninklijk huis.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Alarm · 8</text><text x="68" y="433" class="body">Ramshoorn in Gibea, trompet in Rama,</text><text x="68" y="476" class="body">alarm in Beth-Aven; Benjamin</text><text x="68" y="519" class="body">gewaarschuwd.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Onrecht en verzwakking · 10–12</text><text x="68" y="668" class="body">Juda’s vorsten als</text><text x="68" y="711" class="body">grenssteenverplaatsers, woede als</text><text x="68" y="754" class="body">water; Efraïm mot en Juda verrotting.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Geen genezing daar · 13–15</text><text x="68" y="903" class="body">Efraïm naar Assur en bode naar Jareb,</text><text x="68" y="946" class="body">geen genezing; leeuwbeelden en wachten</text><text x="68" y="989" class="body">op schulderkenning.</text><text x="46" y="1082" class="note">De plaatsen worden per uitspraak onderscheiden,</text><text x="46" y="1118" class="note">zonder een route of moderne coördinaten aan te</text><text x="46" y="1154" class="note">vullen.</text></svg>