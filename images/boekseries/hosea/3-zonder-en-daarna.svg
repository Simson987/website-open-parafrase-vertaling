<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Lange tijd zonder, daarna zoeken</title><desc id="desc">De concrete afspraak, alle zes zaken en de gegeven uitleg van terugkeer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lange tijd zonder, daarna zoeken</text><text x="44" y="113" class="ref">Hosea 3:1–5</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De concrete handeling · 1–3</text><text x="68" y="241" class="body">Liefhebben, 15 zilverstukken en</text><text x="68" y="284" class="body">ongeveer 300 l gerst; wachten en</text><text x="68" y="327" class="body">wederzijds blijven.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zonder · 4</text><text x="68" y="476" class="body">Koning, vorst, offer, gedenksteen,</text><text x="68" y="519" class="body">priesterkleed en huisgoden.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Daarna · 5</text><text x="68" y="668" class="body">Terugkeren, de HEERE zoeken en David</text><text x="68" y="711" class="body">hun koning; ontzag voor Hem en Zijn</text><text x="68" y="754" class="body">goedheid aan einde der dagen.</text><text x="46" y="847" class="note">De zes ontbrekende zaken staan als opsomming in</text><text x="46" y="883" class="note">het hoofdstuk. Het schema maakt de beschreven</text><text x="46" y="919" class="note">lange tijd niet tot een eigen kalenderperiode.</text></svg>