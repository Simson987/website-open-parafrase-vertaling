<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Terugkeer, genezing en vrucht</title><desc id="desc">De opbouw van het volledige hoofdstuk met zorg, aanklacht en gegeven antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Terugkeer, genezing en vrucht</text><text x="44" y="113" class="ref">Hosea 14:1–10</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oordeel en gebed · 1–4</text><text x="68" y="241" class="body">Verwoesting Samaria; terugkeer met</text><text x="68" y="284" class="body">schuldbelijdenis en lippenwoorden,</text><text x="68" y="327" class="body">Assur/paarden/afgoden afwijzen, wees</text><text x="68" y="370" class="body">vindt ontferming.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Het antwoord · 5–9</text><text x="68" y="519" class="body">Genezen en van harte liefhebben; dauw,</text><text x="68" y="562" class="body">lelie, wortels, olijf, Libanongeur,</text><text x="68" y="605" class="body">koren, wijnstok en groene cipres.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het slot · 10</text><text x="68" y="754" class="body">Wijs begrijpen: Zijn wegen recht;</text><text x="68" y="797" class="body">rechtvaardigen lopen, overtreders</text><text x="68" y="840" class="body">struikelen.</text><text x="46" y="933" class="note">De beelden zijn vergelijkingen; de herinneringen</text><text x="46" y="969" class="note">en de aankondigingen worden van elkaar</text><text x="46" y="1005" class="note">onderscheiden.</text></svg>