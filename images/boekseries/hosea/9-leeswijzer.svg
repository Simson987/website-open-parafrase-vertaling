<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Vergelding en verloren vrucht</title><desc id="desc">De volledige hoofdstukopbouw met de belangrijkste beelden en de eigen uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vergelding en verloren vrucht</text><text x="44" y="113" class="ref">Hosea 9:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De komende leegte · 1–6</text><text x="68" y="241" class="body">Dorsvloer en wijnpers voeden niet,</text><text x="68" y="284" class="body">Egypte/Assur, geen aangenomen offers of</text><text x="68" y="327" class="body">feest; netels en doorns bij bezit.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vijandschap en herinnering · 7–10</text><text x="68" y="476" class="body">Bezoeking, profeet en val, Gibea; eerst</text><text x="68" y="519" class="body">druiven/vijgen, toen Baäl-Peor.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De vrucht verdwijnt · 11–17</text><text x="68" y="668" class="body">Vogel en geboorte, verlies van</text><text x="68" y="711" class="body">kinderen, droge wortel en geen vrucht;</text><text x="68" y="754" class="body">niet horen en zwerven onder volken.</text><text x="46" y="847" class="note">De plaatselijke versindeling wordt gevolgd.</text><text x="46" y="883" class="note">Gezinshandeling, vergelijking, aanklacht en</text><text x="46" y="919" class="note">belofte zijn onderscheiden.</text></svg>