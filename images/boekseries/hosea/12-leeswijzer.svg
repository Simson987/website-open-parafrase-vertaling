<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Herinnering en terugkeer</title><desc id="desc">De opbouw van het volledige hoofdstuk met zorg, aanklacht en gegeven antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herinnering en terugkeer</text><text x="44" y="113" class="ref">Hosea 12:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Huidige aanklacht · 1–3</text><text x="68" y="241" class="body">Leugen, bedrog, wind en geweld;</text><text x="68" y="284" class="body">Assurverbond en olie naar Egypte,</text><text x="68" y="327" class="body">rechtszaak met Juda.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jakob en oproep · 4–7</text><text x="68" y="476" class="body">Hiel, strijd met Engel, huilen en</text><text x="68" y="519" class="body">smeken, Beth-El; terugkeren, liefde,</text><text x="68" y="562" class="body">recht en hoop.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Rijkdom en herinnering · 8–15</text><text x="68" y="711" class="body">Bedrieglijke weegschaal,</text><text x="68" y="754" class="body">zelfrechtvaardiging; tenten, profeten,</text><text x="68" y="797" class="body">altaren als hopen, Jakob als hoeder en</text><text x="68" y="840" class="body">uittocht door profeet.</text><text x="46" y="933" class="note">De beelden zijn vergelijkingen; de herinneringen</text><text x="46" y="969" class="note">en de aankondigingen worden van elkaar</text><text x="46" y="1005" class="note">onderscheiden.</text></svg>