<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Zorg en reactie</title><desc id="desc">De concrete zorgbeelden, de menselijke reactie en het ontfermingswoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zorg en reactie</text><text x="44" y="113" class="ref">Hosea 11:1–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Liefde en zorg · 1–4</text><text x="68" y="241" class="body">Uit Egypte geroepen; lopen leren,</text><text x="68" y="284" class="body">dragen, genezen, juk optillen en</text><text x="68" y="327" class="body">voeden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Reactie van het volk · 2,5–7</text><text x="68" y="476" class="body">Weggaan, afgoden, weigeren terug te</text><text x="68" y="519" class="body">keren, eigen plannen en vastzitten in</text><text x="68" y="562" class="body">afkeer.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het hart en het woord · 8–11</text><text x="68" y="711" class="body">Medelijden, niet opnieuw vernietigen;</text><text x="68" y="754" class="body">God en geen mens, kinderen komen terug,</text><text x="68" y="797" class="body">opnieuw thuis.</text><text x="46" y="890" class="note">Menselijke ouderschapstaal beschrijft Zijn zorg.</text><text x="46" y="926" class="note">Het schema maakt die vergelijking niet tot een</text><text x="46" y="962" class="note">beschrijving van een menselijk godenlichaam.</text></svg>