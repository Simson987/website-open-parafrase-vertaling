<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De beelden van herstel</title><desc id="desc">De verschillende herstelvergelijkingen zonder ze tot aparte gebeurtenissen te maken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De beelden van herstel</text><text x="44" y="113" class="ref">Hosea 14:5–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin · 5–6</text><text x="68" y="241" class="body">Genezing, liefde, dauw; lelie en wortel</text><text x="68" y="284" class="body">schieten als de Libanon.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De uitbreiding · 7</text><text x="68" y="433" class="body">Loten, pracht als olijfboom en geur als</text><text x="68" y="476" class="body">de Libanon.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De schaduw · 8</text><text x="68" y="625" class="body">Weer thuis, koren, bloeiende wijnstok</text><text x="68" y="668" class="body">en roem als Libanonwijn.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De bron · 9–10</text><text x="68" y="817" class="body">Groene cipres en vrucht van Hem; rechte</text><text x="68" y="860" class="body">wegen en twee verschillende reacties.</text><text x="46" y="953" class="note">De natuurlijke beelden horen bij de belofte. De</text><text x="46" y="989" class="note">olijfoogst is al afgebeeld; dit schema bewaart</text><text x="46" y="1025" class="note">ook alle overige groeiwoorden.</text></svg>