<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1362" viewBox="0 0 840 1362" role="img" aria-labelledby="title desc"><title id="title">De namen en hun boodschap</title><desc id="desc">Exacte namen, herkomsten en omkering van de aanspreking.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1362" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De namen en hun boodschap</text><text x="44" y="113" class="ref">Hosea 1:3–12; 2:22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ouders en herkomst · 1:1,3</text><text x="68" y="241" class="body">Hosea, zoon van Beëri; Gomer, dochter</text><text x="68" y="284" class="body">van Diblaïm.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jizreël · 1:4–5,11</text><text x="68" y="433" class="body">Zoon; oordeel over huis van Jehu en</text><text x="68" y="476" class="body">breuk van de boog, later grote dag van</text><text x="68" y="519" class="body">Jizreël.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Lo-Ruchama · 1:6–7; 2:22</text><text x="68" y="668" class="body">Dochter, geen ontferming over Israël;</text><text x="68" y="711" class="body">Juda wel ontferming, later ontferming</text><text x="68" y="754" class="body">over Lo-Ruchama.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Lo-Ammi · 1:8–10; 2:22</text><text x="68" y="903" class="body">Zoon, mijn volk niet; later kinderen</text><text x="68" y="946" class="body">van levende God en jij bent mijn volk.</text><rect x="42" y="1004" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Aanspreking · 1:12</text><text x="68" y="1095" class="body">Broers Ammi noemen, zussen Ruchama.</text><text x="46" y="1188" class="note">Deze namenlijst geeft de tekstuele</text><text x="46" y="1224" class="note">gezinsrelaties en de uitspraken bij de namen.</text><text x="46" y="1260" class="note">Geen onbekende generaties of biologische details</text><text x="46" y="1296" class="note">zijn aangevuld.</text></svg>