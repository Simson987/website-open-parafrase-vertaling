<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Liefde, afkeer en ontferming</title><desc id="desc">De opbouw van het volledige hoofdstuk met zorg, aanklacht en gegeven antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Liefde, afkeer en ontferming</text><text x="44" y="113" class="ref">Hosea 11:1–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zorg · 1–4</text><text x="68" y="241" class="body">Zoon uit Egypte, leren lopen, genezen</text><text x="68" y="284" class="body">en voeden; toch Baäls en gesneden</text><text x="68" y="327" class="body">beelden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De weigering · 5–7</text><text x="68" y="476" class="body">Niet terugkeren, Assur als koning,</text><text x="68" y="519" class="body">zwaard in steden; vastzitten in afkeer.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De omkeer · 8–11</text><text x="68" y="668" class="body">Niet als Adama en Zeboïm prijsgeven;</text><text x="68" y="711" class="body">God en geen mens, brullende leeuw,</text><text x="68" y="754" class="body">vogel en duif terug naar huizen.</text><text x="46" y="847" class="note">De beelden zijn vergelijkingen; de herinneringen</text><text x="46" y="883" class="note">en de aankondigingen worden van elkaar</text><text x="46" y="919" class="note">onderscheiden.</text></svg>