<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Van aanklacht naar trouw</title><desc id="desc">De volledige hoofdstukopbouw met de belangrijkste beelden en de eigen uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van aanklacht naar trouw</text><text x="44" y="113" class="ref">Hosea 2:1–22</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De breuk · 1–12</text><text x="68" y="241" class="body">Moeder en kinderen, minnaars en</text><text x="68" y="284" class="body">misbruikte gaven; doornenweg,</text><text x="68" y="327" class="body">terugnemen, feesten stil en wijngaard</text><text x="68" y="370" class="body">verwoest.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Het aanspreken · 13–19</text><text x="68" y="519" class="body">Woestijn en hart, Achor als hoop, namen</text><text x="68" y="562" class="body">van Baäl weg; vrede en blijvende</text><text x="68" y="605" class="body">verbintenis in recht en vertrouwen.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het antwoord · 20–22</text><text x="68" y="754" class="body">Hemel, aarde, koren, wijn, olie en</text><text x="68" y="797" class="body">Jizreël antwoorden; gezaaid volk,</text><text x="68" y="840" class="body">ontferming en mijn volk.</text><text x="46" y="933" class="note">De plaatselijke versindeling wordt gevolgd.</text><text x="46" y="969" class="note">Gezinshandeling, vergelijking, aanklacht en</text><text x="46" y="1005" class="note">belofte zijn onderscheiden.</text></svg>