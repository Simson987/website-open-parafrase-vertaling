<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De vragen over eer en offer</title><desc id="desc">De vragen over eer en offer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vragen over eer en offer</text><text x="44" y="113" class="ref">Maleachi 1:6–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Als Vader en Heer · 6</text><text x="68" y="241" class="body">Waar eer en ontzag? Priesters vragen</text><text x="68" y="284" class="body">hoe zij naam verachten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Brood en vee · 7–9</text><text x="68" y="433" class="body">Onrein brood, blind/kreupel/ziek; zou</text><text x="68" y="476" class="body">gouverneur dit graag ontvangen?</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De deuren · 10</text><text x="68" y="625" class="body">Liever sluiten dan vergeefs altaarvuur,</text><text x="68" y="668" class="body">offer niet aangenomen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De belofte · 11–14</text><text x="68" y="817" class="body">Naam groot onder volken; gaaf mannetje</text><text x="68" y="860" class="body">beloofd maar gebrekkig gebracht.</text><text x="46" y="953" class="note">De vergelijking veroordeelt de offerpraktijk.</text><text x="46" y="989" class="note">Zij verklaart mensen met een beperking niet</text><text x="46" y="1025" class="note">minderwaardig.</text></svg>