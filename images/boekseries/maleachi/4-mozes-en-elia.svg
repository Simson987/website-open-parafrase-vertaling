<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Mozes, Elia en de harten</title><desc id="desc">Mozes, Elia en de harten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mozes, Elia en de harten</text><text x="44" y="113" class="ref">Maleachi 4:4–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mozes · 4</text><text x="68" y="241" class="body">Zijn knecht; wet, regels en bepalingen</text><text x="68" y="284" class="body">bij Horeb aan heel Israël.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Elia · 5</text><text x="68" y="433" class="body">Profeet die voor de grote,</text><text x="68" y="476" class="body">ontzagwekkende dag gestuurd wordt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De harten · 6</text><text x="68" y="625" class="body">Vaderen naar kinderen en kinderen naar</text><text x="68" y="668" class="body">vaderen terugbrengen.</text><text x="46" y="761" class="note">Beide namen hebben een eigen functie in het</text><text x="46" y="797" class="note">slotwoord; geen extra gebeurtenissen worden hier</text><text x="46" y="833" class="note">als reeds verteld ingevoegd.</text></svg>