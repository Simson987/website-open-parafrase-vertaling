<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Betrouwbaarheid en ontrouw</title><desc id="desc">Betrouwbaarheid en ontrouw met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Betrouwbaarheid en ontrouw</text><text x="44" y="113" class="ref">Maleachi 2:5–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Levi · 5–7</text><text x="68" y="241" class="body">Leven/vrede, ontzag, betrouwbaar</text><text x="68" y="284" class="body">onderwijs, oprechtheid en velen terug</text><text x="68" y="327" class="body">van schuld.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Aangesproken priesters · 8–9</text><text x="68" y="476" class="body">Weg af, velen laten struikelen en</text><text x="68" y="519" class="body">partijdig onderwijs.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verbond met elkaar · 10–12</text><text x="68" y="668" class="body">Eén Vader/Schepper tegenover ontrouw en</text><text x="68" y="711" class="body">ontheiliging.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Huwelijksverbond · 13–16</text><text x="68" y="860" class="body">Gezellin en vrouw van jeugd; Hij</text><text x="68" y="903" class="body">getuige, geen ontrouw en geweld.</text><text x="46" y="996" class="note">Priesterlijk onderwijs en huwelijksverbond horen</text><text x="46" y="1032" class="note">bij dezelfde oproep tot betrouwbaarheid maar</text><text x="46" y="1068" class="note">hebben eigen concrete beschuldigingen.</text></svg>