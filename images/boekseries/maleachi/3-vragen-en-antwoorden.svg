<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Vragen en antwoorden</title><desc id="desc">Vragen en antwoorden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vragen en antwoorden</text><text x="44" y="113" class="ref">Maleachi 3:7–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hoe terugkomen? · 7–12</text><text x="68" y="241" class="body">Afgeweken regels; tienden/offergaven</text><text x="68" y="284" class="body">onthouden, alles brengen naar</text><text x="68" y="327" class="body">voorraadhuis.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wat tegen U gezegd? · 13–15</text><text x="68" y="476" class="body">Zinloos God dienen, hoogmoedigen</text><text x="68" y="519" class="body">gelukkig en goddelozen opgebouwd</text><text x="68" y="562" class="body">genoemd.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Wie ontzag hebben · 16–18</text><text x="68" y="711" class="body">Spreken samen, Hij hoort, gedenkboek;</text><text x="68" y="754" class="body">gespaard eigendom en onderscheid wordt</text><text x="68" y="797" class="body">zichtbaar.</text><text x="46" y="890" class="note">De tekstuele discussie en het concrete volk</text><text x="46" y="926" class="note">staan centraal; er worden geen nieuwe financiële</text><text x="46" y="962" class="note">beloften aan individuele lezers toegevoegd.</text></svg>