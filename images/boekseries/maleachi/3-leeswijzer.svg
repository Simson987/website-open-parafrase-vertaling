<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Bode, terugkeer en gedenkboek</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bode, terugkeer en gedenkboek</text><text x="44" y="113" class="ref">Maleachi 3:1–18</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Komst en recht · 1–6</text><text x="68" y="241" class="body">Bode en tempel, vuur/zeep, Levieten</text><text x="68" y="284" class="body">gelouterd, recht tegen eedbreuk,</text><text x="68" y="327" class="body">loonroof en verdrukking; Hij verandert</text><text x="68" y="370" class="body">niet.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Terugkeer en gaven · 7–12</text><text x="68" y="519" class="body">Hoe terugkomen? Tienden/offergaven en</text><text x="68" y="562" class="body">voedsel, zegen, vreter gestuit en</text><text x="68" y="605" class="body">vrucht behouden.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Woorden en onderscheid · 13–18</text><text x="68" y="754" class="body">Dienst zinloos genoemd; eerbiedigen</text><text x="68" y="797" class="body">spreken en gehoord,</text><text x="68" y="840" class="body">gedenkboek/eigendom, verschil dienaar</text><text x="68" y="883" class="body">en niet-dienaar.</text><text x="46" y="976" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="1012" class="note">volgen de plaatselijke versindeling.</text></svg>