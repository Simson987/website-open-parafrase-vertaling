<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Liefde, eer en het afgewezen offer</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Liefde, eer en het afgewezen offer</text><text x="44" y="113" class="ref">Maleachi 1:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Liefde en de vraag · 1–5</text><text x="68" y="241" class="body">Israël, Maleachi, Jakob/Ezau en Edom;</text><text x="68" y="284" class="body">Zijn grootheid buiten Israël.</text><rect x="42" y="342" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Priesters en eer · 6–10</text><text x="68" y="433" class="body">Zoon/vader en dienaar/heer, naam</text><text x="68" y="476" class="body">veracht, onrein brood en gebrekkig vee;</text><text x="68" y="519" class="body">gouverneurvergelijking en deuren</text><text x="68" y="562" class="body">sluiten.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Naam onder de volken · 11–14</text><text x="68" y="711" class="body">Overal naam groot en rein offer;</text><text x="68" y="754" class="body">minachting, geroofd/ziek vee en</text><text x="68" y="797" class="body">gebroken belofte, grote Koning.</text><text x="46" y="890" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="926" class="note">volgen de plaatselijke versindeling.</text></svg>