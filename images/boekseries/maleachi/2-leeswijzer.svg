<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Levi en het geschonden verbond</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levi en het geschonden verbond</text><text x="44" y="113" class="ref">Maleachi 2:1–17</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De priesters · 1–9</text><text x="68" y="241" class="body">Horen en eer, vloek; Levi</text><text x="68" y="284" class="body">leven/vrede/ontzag, betrouwbaar</text><text x="68" y="327" class="body">onderwijs tegenover partijdige</text><text x="68" y="370" class="body">struikelblokken.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Onderlinge ontrouw · 10–16</text><text x="68" y="519" class="body">Eén Vader/Schepper, verbond en</text><text x="68" y="562" class="body">heiligdom, vrouw van jeugd/gezellin;</text><text x="68" y="605" class="body">let op jezelf, geen ontrouw of geweld.</text><rect x="42" y="663" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De vermoeiende woorden · 17</text><text x="68" y="754" class="body">Kwaaddoener goed noemen en vragen waar</text><text x="68" y="797" class="body">de God van recht is.</text><text x="46" y="890" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="926" class="note">volgen de plaatselijke versindeling.</text></svg>