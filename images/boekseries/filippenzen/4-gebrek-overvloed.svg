<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Tevredenheid en ontvangen steun</title><desc id="desc">Tevredenheid en ontvangen steun met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tevredenheid en ontvangen steun</text><text x="44" y="113" class="ref">Filippenzen 4:10–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geleerde tevredenheid</text><text x="68" y="241" class="body">Met weinig en met overvloed, verzadigd</text><text x="68" y="284" class="body">of hongerig.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kracht van Christus</text><text x="68" y="433" class="body">In deze omstandigheden kan Paulus alles</text><text x="68" y="476" class="body">aan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De hulp uit Filippi</text><text x="68" y="625" class="body">De gemeente deelde in zijn moeite, ook</text><text x="68" y="668" class="body">eerder in Tessalonica.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De ontvangst</text><text x="68" y="817" class="body">Epafroditus bracht de gave; Paulus</text><text x="68" y="860" class="body">heeft genoeg.</text><text x="46" y="953" class="note">De kracht van vers 13 staat hier in de</text><text x="46" y="989" class="note">bespreking van gebrek, overvloed en steun.</text></svg>