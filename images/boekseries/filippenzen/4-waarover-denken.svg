<svg xmlns="http://www.w3.org/2000/svg" width="840" height="777" viewBox="0 0 840 777" role="img" aria-labelledby="title desc"><title id="title">Waarover Paulus laat nadenken</title><desc id="desc">Waarover Paulus laat nadenken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="777" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarover Paulus laat nadenken</text><text x="44" y="113" class="ref">Filippenzen 4:8–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Waar · eerbaar</text><text x="68" y="241" class="body">En wat rechtvaardig en rein is.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Lieflijk · goed klinkend</text><text x="68" y="390" class="body">En wat deugd is en lof verdient.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Niet alleen denken · vers 9</text><text x="68" y="539" class="body">Doe wat geleerd, ontvangen, gehoord en</text><text x="68" y="582" class="body">bij Paulus gezien is.</text><text x="46" y="675" class="note">De acht aanduidingen van vers 8 volgen de</text><text x="46" y="711" class="note">woorden van deze plaatselijke tekst.</text></svg>