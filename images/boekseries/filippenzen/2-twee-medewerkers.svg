<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Twee medewerkers en hun komst</title><desc id="desc">Twee medewerkers en hun komst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee medewerkers en hun komst</text><text x="44" y="113" class="ref">Filippenzen 2:19–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Timotheüs · vers 19–24</text><text x="68" y="241" class="body">Paulus hoopt hem te sturen zodra hij</text><text x="68" y="284" class="body">weet hoe zijn zaak afloopt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn bewezen inzet</text><text x="68" y="433" class="body">Hij diende het evangelie als een kind</text><text x="68" y="476" class="body">met zijn vader.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Epafroditus · vers 25–28</text><text x="68" y="625" class="body">Gezant van de gemeente; ziek geweest en</text><text x="68" y="668" class="body">nu teruggestuurd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De ontvangst · vers 29–30</text><text x="68" y="817" class="body">Ontvang hem blij en houd zulke mensen</text><text x="68" y="860" class="body">in ere.</text><text x="46" y="953" class="note">Timotheüs’ voorgenomen komst en Epafroditus’</text><text x="46" y="989" class="note">terugkeer zijn twee onderscheiden situaties.</text></svg>