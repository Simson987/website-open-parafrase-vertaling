<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat Paulus winst en verlies noemt</title><desc id="desc">Wat Paulus winst en verlies noemt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Paulus winst en verlies noemt</text><text x="44" y="113" class="ref">Filippenzen 3:4–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vroegere aanknopingspunten</text><text x="68" y="241" class="body">Afkomst, besnijdenis, farizeeër zijn en</text><text x="68" y="284" class="body">ijver.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De nieuwe waardering</text><text x="68" y="433" class="body">Wat winst was, als verlies beschouwen</text><text x="68" y="476" class="body">om Christus.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het verlangen</text><text x="68" y="625" class="body">Christus kennen en in Hem gevonden</text><text x="68" y="668" class="body">worden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De gerechtigheid</text><text x="68" y="817" class="body">Uit God, door het geloof; niet een</text><text x="68" y="860" class="body">eigen gerechtigheid uit de wet.</text><text x="46" y="953" class="note">Paulus bespreekt zijn eigen loopbaan en</text><text x="46" y="989" class="note">verlangen, geen financiële verliesrekening.</text></svg>