<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1518" viewBox="0 0 840 1518" role="img" aria-labelledby="title desc"><title id="title">Erts vinden, wijsheid zoeken</title><desc id="desc">De vergelijking tussen technische vondsten, onbetaalbare wijsheid en de afsluitende praktische definitie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1518" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Erts vinden, wijsheid zoeken</text><text x="44" y="113" class="ref">Job 28:1–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat de mens vindt</text><text x="68" y="241" class="body">Zilver, goud, ijzer en koper; schachten</text><text x="68" y="284" class="body">en gangen brengen verborgen</text><text x="68" y="327" class="body">kostbaarheden aan het licht.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wat dieren niet vinden</text><text x="68" y="476" class="body">Het verborgen mijnpad is onbekend aan</text><text x="68" y="519" class="body">roofvogels en roofdieren.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De herhaalde vraag</text><text x="68" y="668" class="body">Maar wijsheid, waar is die te vinden?</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Geen betaalmiddel voldoende</text><text x="68" y="817" class="body">Goud, zilver, onyx, saffier, glas,</text><text x="68" y="860" class="body">koraal, kristal, robijnen en topaas</text><text x="68" y="903" class="body">kunnen haar niet kopen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Wie de weg kent</text><text x="68" y="1052" class="body">God kent haar plaats en overziet aarde,</text><text x="68" y="1095" class="body">wind, water, regen en bliksem.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Antwoord voor de mens</text><text x="68" y="1244" class="body">Ontzag voor de HEERE is wijsheid;</text><text x="68" y="1287" class="body">wegblijven van kwaad is inzicht.</text><text x="46" y="1380" class="note">De mijnbouw toont menselijke vindkracht; de</text><text x="46" y="1416" class="note">wijsheid is juist niet als een volgende ertslaag</text><text x="46" y="1452" class="note">of marktprijs beschikbaar.</text></svg>