<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1554" viewBox="0 0 840 1554" role="img" aria-labelledby="title desc"><title id="title">Bildad: redenering en beelden</title><desc id="desc">Bron van de redenering, de schuldtoeschrijving en het onderscheid tussen belofte en gerealiseerd herstel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1554" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bildad: redenering en beelden</text><text x="44" y="113" class="ref">Job 8:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Bildad uit Suah, de tweede vriend die</text><text x="68" y="284" class="body">antwoordt.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn beginsel</text><text x="68" y="433" class="body">God verdraait het recht niet.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Zijn harde toepassing</text><text x="68" y="582" class="body">Verbindt de dood van Jobs kinderen aan</text><text x="68" y="625" class="body">hun overtreding; een bewering van</text><text x="68" y="668" class="body">Bildad.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Beroep op traditie</text><text x="68" y="817" class="body">Vorige generaties moeten onderwijzen;</text><text x="68" y="860" class="body">eigen dagen zijn een schaduw.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Afhankelijkheid</text><text x="68" y="1009" class="body">Papyrus heeft water nodig; spinnenweb</text><text x="68" y="1052" class="body">en ontwortelde plant geven geen</text><text x="68" y="1095" class="body">blijvende zekerheid.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Voorwaardelijke hoop</text><text x="68" y="1244" class="body">Als Job zuiver is en God zoekt,</text><text x="68" y="1287" class="body">verwacht Bildad herstel en lachen.</text><text x="46" y="1380" class="note">Bildads beschuldiging is niet door de verteller</text><text x="46" y="1416" class="note">bewezen. Papyrus, web en plant zijn zijn</text><text x="46" y="1452" class="note">argumentbeelden, geen nieuwe rampen bij Jobs</text><text x="46" y="1488" class="note">huis.</text></svg>