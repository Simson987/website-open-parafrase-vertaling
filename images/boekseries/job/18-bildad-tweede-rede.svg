<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1511" viewBox="0 0 840 1511" role="img" aria-labelledby="title desc"><title id="title">Bildads tweede rede</title><desc id="desc">De beeldgroepen van gevangenschap, uitdovend leven en verdwijnende herinnering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1511" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bildads tweede rede</text><text x="44" y="113" class="ref">Job 18:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Bildad uit Suah neemt opnieuw het</text><text x="68" y="284" class="body">woord.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn ergernis</text><text x="68" y="433" class="body">Voelt dat Job de vrienden als dom vee</text><text x="68" y="476" class="body">behandelt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn portret</text><text x="68" y="625" class="body">Het licht van de goddeloze dooft; het</text><text x="68" y="668" class="body">eigen plan wordt een val.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vangbeelden</text><text x="68" y="817" class="body">Net, kuil, strik, klem en verborgen</text><text x="68" y="860" class="body">touw.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Verlies van toekomst</text><text x="68" y="1009" class="body">Ziekte, verdroogde wortels en takken,</text><text x="68" y="1052" class="body">verdwijnende naam en geen nakomelingen.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Zijn slot</text><text x="68" y="1201" class="body">Zo vergaat volgens hem het huis van</text><text x="68" y="1244" class="body">iemand die God niet kent.</text><text x="46" y="1337" class="note">Bildad beschrijft een algemeen portret dat Job</text><text x="46" y="1373" class="note">raakt. Het net en de gedoofde lamp zijn</text><text x="46" y="1409" class="note">argumentbeelden, geen gebeurtenissen die nu</text><text x="46" y="1445" class="note">naast de ashoop plaatsvinden.</text></svg>