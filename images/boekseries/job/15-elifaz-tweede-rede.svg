<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1518" viewBox="0 0 840 1518" role="img" aria-labelledby="title desc"><title id="title">Elifaz’ tweede rede</title><desc id="desc">De verscherping van zijn redenering en de functie van de vervalbeelden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1518" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elifaz’ tweede rede</text><text x="44" y="113" class="ref">Job 15:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nieuwe ronde</text><text x="68" y="241" class="body">Elifaz spreekt opnieuw na Jobs lange</text><text x="68" y="284" class="body">antwoord.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn aanklacht</text><text x="68" y="433" class="body">Jobs eigen woorden zouden zijn schuld</text><text x="68" y="476" class="body">bewijzen en het ontzag voor God</text><text x="68" y="519" class="body">afbreken.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zijn gezag</text><text x="68" y="668" class="body">Oude wijzen en de overgeleverde kennis</text><text x="68" y="711" class="body">van voorouders.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Menselijke onreinheid</text><text x="68" y="860" class="body">Voert de kwetsbaarheid en onreinheid</text><text x="68" y="903" class="body">van mensen als argument aan.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Portret van de goddeloze</text><text x="68" y="1052" class="body">Angst, verlies, verlaten huizen en</text><text x="68" y="1095" class="body">vluchtig bezit.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Beeldspraak</text><text x="68" y="1244" class="body">Onrijpe druiven, afgeworpen</text><text x="68" y="1287" class="body">olijfbloesem en verdroogde takken.</text><text x="46" y="1380" class="note">Elifaz’ portret is een indirect verwijt aan Job;</text><text x="46" y="1416" class="note">de beschrijving vormt geen vertellersbewijs dat</text><text x="46" y="1452" class="note">Job een tiran of omkoper is.</text></svg>