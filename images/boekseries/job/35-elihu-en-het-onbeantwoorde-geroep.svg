<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Elihu over roepen en wachten</title><desc id="desc">De redeneerstappen van Elihu bij het uitblijven van antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elihu over roepen en wachten</text><text x="44" y="113" class="ref">Job 35:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 1–4</text><text x="68" y="241" class="body">Elihu reageert op het nut van</text><text x="68" y="284" class="body">rechtvaardig leven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hoogte · 5–8</text><text x="68" y="433" class="body">Hij wijst naar de wolken en spreekt</text><text x="68" y="476" class="body">over de gevolgen van gedrag voor</text><text x="68" y="519" class="body">medemensen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Geroep · 9–13</text><text x="68" y="668" class="body">Hij beschrijft nood, het vergeten van</text><text x="68" y="711" class="body">de Maker en lege kreten.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Wachten · 14–16</text><text x="68" y="860" class="body">Hij zegt dat de zaak voor God ligt en</text><text x="68" y="903" class="body">dat Job moet wachten.</text><text x="46" y="996" class="note">De nachtelijke liederen zijn een motief in</text><text x="46" y="1032" class="note">Elihu’s rede. De drie bestaande beelden dekken</text><text x="46" y="1068" class="note">wolken, nachtlied en wachten; de leeswijzer</text><text x="46" y="1104" class="note">bewaart hun verband.</text></svg>