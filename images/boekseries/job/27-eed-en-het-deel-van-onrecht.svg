<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1511" viewBox="0 0 840 1511" role="img" aria-labelledby="title desc"><title id="title">Eed en het deel van onrecht</title><desc id="desc">De twee delen van de rede en hun verschillende onderwerp.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1511" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eed en het deel van onrecht</text><text x="44" y="113" class="ref">Job 27:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Job gaat verder</text><text x="68" y="241" class="body">De eigen tekst houdt Job als spreker</text><text x="68" y="284" class="body">aan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn eed</text><text x="68" y="433" class="body">Zolang er adem is: geen onrecht of</text><text x="68" y="476" class="body">bedrog op zijn lippen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vasthouden</text><text x="68" y="625" class="body">Geeft de vrienden geen gelijk en laat</text><text x="68" y="668" class="body">zijn oprechtheid niet los.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Godsloze verwachting</text><text x="68" y="817" class="body">Vraagt welke hoop overblijft wanneer</text><text x="68" y="860" class="body">het leven wordt opgeëist.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Portret van de tiran</text><text x="68" y="1009" class="body">Nageslacht, brood, zilver, kleding en</text><text x="68" y="1052" class="body">woonhuis houden geen vaste toekomst.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Beeldspraak</text><text x="68" y="1201" class="body">Zilver als stof, kleding als leem,</text><text x="68" y="1244" class="body">kwetsbare hut, storm en oostenwind.</text><text x="46" y="1337" class="note">Het hoofdstuk bevat zowel Jobs onschuldseed als</text><text x="46" y="1373" class="note">een beschrijving van het lot van tirannen. De</text><text x="46" y="1409" class="note">aanwezige bezitsbeelden zijn geen verslag van</text><text x="46" y="1445" class="note">nieuw verkregen rijkdom van Job.</text></svg>