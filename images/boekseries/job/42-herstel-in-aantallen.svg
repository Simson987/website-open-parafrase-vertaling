<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1147" viewBox="0 0 840 1147" role="img" aria-labelledby="title desc"><title id="title">Herstel in aantallen</title><desc id="desc">Exacte aantallen en eenheden uit het herstelgedeelte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1147" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herstel in aantallen</text><text x="44" y="113" class="ref">Job 42:12–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kleinvee</text><text x="68" y="241" class="body">14.000 schapen</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Kamelen</text><text x="68" y="390" class="body">6.000 kamelen</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Runderen</text><text x="68" y="539" class="body">1.000 span runderen</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Ezels</text><text x="68" y="688" class="body">1.000 ezelinnen</text><rect x="42" y="746" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Familie en tijd</text><text x="68" y="837" class="body">Zeven zonen en drie dochters; nog 140</text><text x="68" y="880" class="body">levensjaren en vier generaties gezien.</text><text x="46" y="973" class="note">Het aantal runderen wordt als span overgenomen.</text><text x="46" y="1009" class="note">Het kindertal wordt afzonderlijk vermeld; het</text><text x="46" y="1045" class="note">schema noemt de kinderen niet een verdubbeld</text><text x="46" y="1081" class="note">bezit.</text></svg>