<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Elihu: spreken en herstel</title><desc id="desc">Opeenvolgende fasen in Elihu’s voorbeeld, met verzen en onderscheid van Jobs eigen verhaal.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elihu: spreken en herstel</text><text x="44" y="113" class="ref">Job 33:14–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Waarschuwing · 14–18</text><text x="68" y="241" class="body">God kan volgens Elihu door dromen</text><text x="68" y="284" class="body">spreken om een mens van hoogmoed en</text><text x="68" y="327" class="body">gevaar af te houden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Lijden · 19–22</text><text x="68" y="476" class="body">Hij beschrijft een zieke die dicht bij</text><text x="68" y="519" class="body">de dood komt.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bemiddeling · 23–24</text><text x="68" y="668" class="body">Een boodschapper, genade en het</text><text x="68" y="711" class="body">genoemde losgeld.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vernieuwing · 25–28</text><text x="68" y="860" class="body">Nieuwe kracht, gebed en erkenning van</text><text x="68" y="903" class="body">verkeerd handelen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Herhaling · 29–30</text><text x="68" y="1052" class="body">Elihu zegt dat God zo herhaaldelijk</text><text x="68" y="1095" class="body">handelt om leven te bewaren.</text><text x="46" y="1188" class="note">Dit zijn Elihu’s algemene voorbeelden binnen</text><text x="46" y="1224" class="note">zijn rede. Hier wordt nog geen genezing van Job</text><text x="46" y="1260" class="note">verteld.</text></svg>