<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1432" viewBox="0 0 840 1432" role="img" aria-labelledby="title desc"><title id="title">Job: borgtocht en hoop</title><desc id="desc">Borgtocht, volharding en de spanning tussen beloofde hoop en beleefde duisternis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1432" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job: borgtocht en hoop</text><text x="44" y="113" class="ref">Job 17:1–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vervolg van Job</text><text x="68" y="241" class="body">Geen nieuwe spreker na hoofdstuk 16.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Borg gevraagd</text><text x="68" y="390" class="body">God zelf moet voor hem instaan; niemand</text><text x="68" y="433" class="body">anders biedt zekerheid.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Tegen de spotters</text><text x="68" y="582" class="body">Vindt geen wijze onder zijn vrienden en</text><text x="68" y="625" class="body">verwerpt hun gemakkelijke lichtbelofte.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Toch standhouden</text><text x="68" y="774" class="body">De rechtvaardige houdt zijn weg; reine</text><text x="68" y="817" class="body">handen worden sterker.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Gebroken verwachtingen</text><text x="68" y="966" class="body">Dagen, plannen en alles waaraan zijn</text><text x="68" y="1009" class="body">hart hing zijn voorbij.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Waar blijft hoop?</text><text x="68" y="1158" class="body">Graf als familie, duisternis als huis;</text><text x="68" y="1201" class="body">vraagt waar zijn hoop nog zichtbaar is.</text><text x="46" y="1294" class="note">Familienamen voor graf en wormen zijn</text><text x="46" y="1330" class="note">schrijnende personificaties, geen genealogie of</text><text x="46" y="1366" class="note">scène met Jobs werkelijke ouders.</text></svg>