<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">Job: vragen en fluistering</title><desc id="desc">De overgang van kritiek op ontoereikende raad naar de grenzen van menselijk begrijpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job: vragen en fluistering</text><text x="44" y="113" class="ref">Job 26:1–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Job antwoordt op Bildads korte rede.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Eerst de vrienden</text><text x="68" y="390" class="body">Hoe hebben hun woorden iemand zonder</text><text x="68" y="433" class="body">kracht en wijsheid werkelijk geholpen?</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Diepte en leegte</text><text x="68" y="582" class="body">Dodenrijk, uitgestrekt noorden en aarde</text><text x="68" y="625" class="body">die aan niets hangt.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Water en wolken</text><text x="68" y="774" class="body">Vastgehouden water, bedekte troon en de</text><text x="68" y="817" class="body">grens van licht en donker.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Macht over de chaos</text><text x="68" y="966" class="body">Zee, Rahab en vluchtende slang in</text><text x="68" y="1009" class="body">verheven beeldtaal.</text><rect x="42" y="1067" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Zijn slot</text><text x="68" y="1158" class="body">Dit zijn slechts randen van Gods wegen,</text><text x="68" y="1201" class="body">een fluistering; de donder gaat het</text><text x="68" y="1244" class="body">begrip te boven.</text><text x="46" y="1337" class="note">De kosmische beelden vormen Jobs lof- en</text><text x="46" y="1373" class="note">machtstaal. Het hoofdstuk geeft geen kaart met</text><text x="46" y="1409" class="note">afstanden, coördinaten of een portret van God.</text></svg>