<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1511" viewBox="0 0 840 1511" role="img" aria-labelledby="title desc"><title id="title">De dierenvragen</title><desc id="desc">De diersoorten en de reactie van Job volgens de eigen hoofdstuknummering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1511" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De dierenvragen</text><text x="44" y="113" class="ref">Job 39:1–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Roof en voedsel · 1–3</text><text x="68" y="241" class="body">Leeuwin en jonge leeuwen; de jongen van</text><text x="68" y="284" class="body">de raaf.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Geboorte en vrijheid · 4–11</text><text x="68" y="433" class="body">Steengeit en hinde; de vrije wilde</text><text x="68" y="476" class="body">ezel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ongetemde kracht · 12–15</text><text x="68" y="625" class="body">De wilde os laat zich niet vanzelf voor</text><text x="68" y="668" class="body">de akker gebruiken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Eieren en snelheid · 16–21</text><text x="68" y="817" class="body">Struisvogel: eieren op de grond en</text><text x="68" y="860" class="body">snelle beweging.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Kracht en vlucht · 22–33</text><text x="68" y="1009" class="body">Strijdpaard, valk en hoog nestelende</text><text x="68" y="1052" class="body">arend.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Jobs antwoord · 34–38</text><text x="68" y="1201" class="body">Hij legt zijn hand op zijn mond en</text><text x="68" y="1244" class="body">antwoordt niet verder.</text><text x="46" y="1337" class="note">De plaatselijke tekst zet de dierenvragen én</text><text x="46" y="1373" class="note">Jobs eerste antwoord in hoofdstuk 39. De</text><text x="46" y="1409" class="note">natuurbeelden zijn illustraties bij de vragen,</text><text x="46" y="1445" class="note">geen dieren die bij Job worden afgeleverd.</text></svg>