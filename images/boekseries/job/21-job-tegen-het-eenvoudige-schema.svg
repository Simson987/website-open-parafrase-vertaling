<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1561" viewBox="0 0 840 1561" role="img" aria-labelledby="title desc"><title id="title">Job betwist het simpele schema</title><desc id="desc">De logische tegenspraak tussen de voorspoed van slechte mensen en de eenvoudige verklaring van de vrienden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1561" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job betwist het simpele schema</text><text x="44" y="113" class="ref">Job 21:1–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Job antwoordt Zofar en vraagt luisteren</text><text x="68" y="284" class="body">als echte troost.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn tegenvoorbeeld</text><text x="68" y="433" class="body">Goddelozen kunnen oud worden, hun</text><text x="68" y="476" class="body">kinderen zien en voorspoed met muziek</text><text x="68" y="519" class="body">genieten.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zijn vraag</text><text x="68" y="668" class="body">Hoe vaak dooft hun lamp werkelijk uit?</text><text x="68" y="711" class="body">Waarom straf pas bij de kinderen?</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Twee levens, één stof</text><text x="68" y="860" class="body">De één sterft voldaan, de ander bitter;</text><text x="68" y="903" class="body">beiden eindigen in het stof.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Reizigers en begrafenis</text><text x="68" y="1052" class="body">Beroept zich op hun ervaring: een</text><text x="68" y="1095" class="body">slecht mens kan gespaard worden en</text><text x="68" y="1138" class="body">eervol begraven.</text><rect x="42" y="1196" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1239" class="label">Zijn conclusie</text><text x="68" y="1287" class="body">De vaste vergeldingsuitleg van de</text><text x="68" y="1330" class="body">vrienden troost hem niet.</text><text x="46" y="1423" class="note">Job beschrijft waargenomen tegenvoorbeelden. Hij</text><text x="46" y="1459" class="note">zegt niet dat hij de raad van goddelozen zelf</text><text x="46" y="1495" class="note">volgt; hij neemt er uitdrukkelijk afstand van.</text></svg>