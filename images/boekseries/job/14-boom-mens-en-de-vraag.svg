<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1561" viewBox="0 0 840 1561" role="img" aria-labelledby="title desc"><title id="title">Boom, mens en de vraag</title><desc id="desc">De tegenstelling tussen uitlopende boom en sterfelijke mens, met de open vraag en het verlangen naar herinnering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1561" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boom, mens en de vraag</text><text x="44" y="113" class="ref">Job 14:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mens</text><text x="68" y="241" class="body">Kort leven vol onrust; als afgesneden</text><text x="68" y="284" class="body">bloem en vluchtende schaduw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Boom</text><text x="68" y="433" class="body">Omgehakt en oude wortel; bij water kan</text><text x="68" y="476" class="body">hij toch weer uitlopen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De scherpe vergelijking</text><text x="68" y="625" class="body">Een gestorven mens lijkt voor Job niet</text><text x="68" y="668" class="body">op dezelfde manier terug te keren.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn verlangen</text><text x="68" y="817" class="body">Verborgen worden tot de toorn voorbij</text><text x="68" y="860" class="body">is; een termijn en opnieuw herinnerd</text><text x="68" y="903" class="body">worden.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Zijn vraag</text><text x="68" y="1052" class="body">Als een man sterft, zou hij weer leven?</text><text x="68" y="1095" class="body">Roepen, antwoorden en aflossing worden</text><text x="68" y="1138" class="body">verlangd.</text><rect x="42" y="1196" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1239" class="label">Zijn huidige ervaring</text><text x="68" y="1287" class="body">Schuld verzegeld, hoop afgesleten als</text><text x="68" y="1330" class="body">rots door water; pijn en afstand.</text><text x="46" y="1423" class="note">Het hoofdstuk beweegt tussen huidige ervaring,</text><text x="46" y="1459" class="note">vergelijking en wens. De gehoopte aflossing</text><text x="46" y="1495" class="note">wordt hier nog niet als gebeurd verteld.</text></svg>