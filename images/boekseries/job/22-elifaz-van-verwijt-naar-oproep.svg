<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1518" viewBox="0 0 840 1518" role="img" aria-labelledby="title desc"><title id="title">Elifaz: verwijt en oproep</title><desc id="desc">De verscherping tot concrete beschuldigingen en de voorwaardelijke oproep tot herstel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1518" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elifaz: verwijt en oproep</text><text x="44" y="113" class="ref">Job 22:1–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Elifaz uit Theman, nu voor de derde</text><text x="68" y="284" class="body">keer.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Concreet verwijt</text><text x="68" y="433" class="body">Onderpand, kleding afnemen, geen brood</text><text x="68" y="476" class="body">of water geven, weduwen en wezen</text><text x="68" y="519" class="body">benadelen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zijn gevolgtrekking</text><text x="68" y="668" class="body">Daarom zouden strikken en schrik Job</text><text x="68" y="711" class="body">treffen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vermeende woorden van Job</text><text x="68" y="860" class="body">Stelt dat Job Gods zicht op de wereld</text><text x="68" y="903" class="body">beperkt acht.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Zijn oproep</text><text x="68" y="1052" class="body">Terugkeren, onderwijs aannemen en</text><text x="68" y="1095" class="body">onrecht wegdoen.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Zijn belofte</text><text x="68" y="1244" class="body">Goud loslaten; God als rijkdom, gehoord</text><text x="68" y="1287" class="body">gebed, licht en redding.</text><text x="46" y="1380" class="note">De specifieke misdrijven staan hier als Elifaz’</text><text x="46" y="1416" class="note">beschuldigingen. Er wordt geen bewijs geleverd</text><text x="46" y="1452" class="note">dat Job die handelingen verricht heeft.</text></svg>