<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1511" viewBox="0 0 840 1511" role="img" aria-labelledby="title desc"><title id="title">Zofars tweede rede</title><desc id="desc">De logica van kortstondige winst en onvermijdelijk verlies, met de sociale grond van zijn verwijt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1511" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zofars tweede rede</text><text x="44" y="113" class="ref">Job 20:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Zofar antwoordt opnieuw, geraakt door</text><text x="68" y="284" class="body">een verwijt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn stelling</text><text x="68" y="433" class="body">Vreugde van de goddeloze is volgens hem</text><text x="68" y="476" class="body">van korte duur.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verdwijnen</text><text x="68" y="625" class="body">Droom en nachtvisioen; zijn plaats kent</text><text x="68" y="668" class="body">hem niet meer.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zoet naar gif</text><text x="68" y="817" class="body">Kwaad in de mond wordt gif in de buik;</text><text x="68" y="860" class="body">ingeslikte rijkdom moet eruit.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Sociale aanklacht</text><text x="68" y="1009" class="body">Verbindt onrecht met onderdrukking van</text><text x="68" y="1052" class="body">armen en roof van een huis.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Zijn einde</text><text x="68" y="1201" class="body">Voorraad, veiligheid en nageslacht gaan</text><text x="68" y="1244" class="body">verloren onder Gods toorn.</text><text x="46" y="1337" class="note">Zofars beschrijving is een aanklacht in de</text><text x="46" y="1373" class="note">discussie, geen vastgestelde biografie van Job.</text><text x="46" y="1409" class="note">De voedsel- en gifbeelden zijn poëtische</text><text x="46" y="1445" class="note">vergelijkingen.</text></svg>