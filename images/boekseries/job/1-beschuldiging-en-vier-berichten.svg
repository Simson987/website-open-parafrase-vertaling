<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1789" viewBox="0 0 840 1789" role="img" aria-labelledby="title desc"><title id="title">Beschuldiging en vier berichten</title><desc id="desc">Twee vertelniveaus en vier afzonderlijke berichten in hun volgorde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1789" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beschuldiging en vier berichten</text><text x="44" y="113" class="ref">Job 1:6–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hemels gesprek</text><text x="68" y="241" class="body">De satan betwijfelt of Jobs ontzag</text><text x="68" y="284" class="body">zonder voorspoed blijft bestaan. Job</text><text x="68" y="327" class="body">hoort dit gesprek niet.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De grens</text><text x="68" y="476" class="body">Bezittingen in zijn hand; Job zelf niet</text><text x="68" y="519" class="body">aanraken.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Eerste bericht</text><text x="68" y="668" class="body">Sabeeërs nemen runderen en ezelinnen;</text><text x="68" y="711" class="body">knechten gedood.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Tweede bericht</text><text x="68" y="860" class="body">Vuur treft schapen en knechten, volgens</text><text x="68" y="903" class="body">de bode.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Derde bericht</text><text x="68" y="1052" class="body">Chaldeeën in drie groepen nemen</text><text x="68" y="1095" class="body">kamelen; knechten gedood.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Vierde bericht</text><text x="68" y="1244" class="body">Woestijnwind verwoest het huis; zonen</text><text x="68" y="1287" class="body">en dochters sterven.</text><rect x="42" y="1345" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1388" class="label">Jobs antwoord</text><text x="68" y="1436" class="body">Mantel scheuren, hoofd scheren en</text><text x="68" y="1479" class="body">neerbuigen; geen verkeerde</text><text x="68" y="1522" class="body">beschuldiging tegen God.</text><text x="46" y="1615" class="note">De lezer kent een kader dat Job niet kent. De</text><text x="46" y="1651" class="note">verteller noemt Job oprecht; het verlies wordt</text><text x="46" y="1687" class="note">niet als bewezen straf voor verborgen schuld</text><text x="46" y="1723" class="note">verklaard.</text></svg>