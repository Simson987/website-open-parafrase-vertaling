<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760"><title>Jobs vergelijking: zwaarder dan zeezand</title><rect width="840" height="760" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Zwaarder dan zeezand</text><text x="42" y="108" font-size="28">Job 6:2–3 · beeldspraak</text><path d="M420 260V570M350 570H490M160 390L680 230" stroke="#52725e" stroke-width="7" fill="none"/><path d="M170 390V500M650 240V350" stroke="#52725e" stroke-width="3"/><path d="M80 500Q170 610 260 500ZM560 350Q650 460 740 350Z" fill="#dfe8d6" stroke="#52725e" stroke-width="3"/><text x="170" y="300" text-anchor="middle" font-size="29">Verdriet</text><text x="170" y="340" text-anchor="middle" font-size="29">en ellende</text><text x="650" y="185" text-anchor="middle" font-size="29">Zeezand</text><text x="42" y="650" font-size="27">Job vraagt zijn pijn eerlijk mee te wegen.</text><text x="42" y="698" font-size="27">Het beeld geeft geen letterlijk gemeten gewicht.</text></g></svg>