<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">Job spreekt zijn Maker aan</title><desc id="desc">De spanning tussen schepping, herinnerde zorg en ervaren vervolging, met de beelden als beeldspraak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job spreekt zijn Maker aan</text><text x="44" y="113" class="ref">Job 10:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rechtstreeks tot God</text><text x="68" y="241" class="body">Veroordeel mij niet; maak de oorzaak</text><text x="68" y="284" class="body">van het geschil bekend.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De spanning</text><text x="68" y="433" class="body">God heeft hem gevormd, maar Job ervaart</text><text x="68" y="476" class="body">dezelfde handen als vernietigend.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Beelden van vorming</text><text x="68" y="625" class="body">Klei, melk die stolt, huid, vlees,</text><text x="68" y="668" class="body">botten en pezen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ontvangen zorg</text><text x="68" y="817" class="body">Leven, trouw en bewaarde adem worden</text><text x="68" y="860" class="body">herinnerd.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De huidige aanklacht</text><text x="68" y="1009" class="body">Onschuld geeft hem geen verlichting;</text><text x="68" y="1052" class="body">hij voelt zich opgejaagd en belegerd.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Laat mij op adem komen</text><text x="68" y="1201" class="body">Nog een beetje rust vóór het donkere</text><text x="68" y="1244" class="body">dodenrijk.</text><text x="46" y="1337" class="note">Klei en melk zijn poëtische vergelijkingen voor</text><text x="46" y="1373" class="note">het gevormde leven; zij zijn geen technische</text><text x="46" y="1409" class="note">beschrijving van de menselijke ontstaanswijze.</text></svg>