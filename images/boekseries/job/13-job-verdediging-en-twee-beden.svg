<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1432" viewBox="0 0 840 1432" role="img" aria-labelledby="title desc"><title id="title">Verdediging en twee beden</title><desc id="desc">Het verschil tussen partijdige verdediging en Jobs eigen twee voorwaarden voor een open gesprek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1432" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verdediging en twee beden</text><text x="44" y="113" class="ref">Job 13:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tegen de vrienden</text><text x="68" y="241" class="body">Hun verdediging van God mag niet uit</text><text x="68" y="284" class="body">leugens en partijdigheid bestaan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Geen hulp</text><text x="68" y="433" class="body">Dokters die niets kunnen; spreuken van</text><text x="68" y="476" class="body">as en een wal van leem.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn rechtszaak</text><text x="68" y="625" class="body">Job wil zelf zijn wegen bij God</text><text x="68" y="668" class="body">verdedigen en zijn woorden laten horen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Eerste bede</text><text x="68" y="817" class="body">Neem de drukkende hand weg.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Tweede bede</text><text x="68" y="966" class="body">Laat de schrik voor U mij niet</text><text x="68" y="1009" class="body">overvallen.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Dan spreken</text><text x="68" y="1158" class="body">Roep en ik antwoord; of laat mij</text><text x="68" y="1201" class="body">spreken. Noem concreet mijn zonden.</text><text x="46" y="1294" class="note">De slotbeelden van blad, halm, voetenblok en</text><text x="46" y="1330" class="note">motkleed verbeelden kwetsbaarheid en beklemming.</text><text x="46" y="1366" class="note">Er wordt geen nieuwe fysieke opsluiting verteld.</text></svg>