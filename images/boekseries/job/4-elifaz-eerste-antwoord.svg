<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1468" viewBox="0 0 840 1468" role="img" aria-labelledby="title desc"><title id="title">Elifaz’ eerste antwoord</title><desc id="desc">Spreker, bewijsvoering, beeldspraak en de bijzondere status van het vertelde visioen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1468" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elifaz’ eerste antwoord</text><text x="44" y="113" class="ref">Job 4:1–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Elifaz uit Theman antwoordt Job.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Herinnering</text><text x="68" y="390" class="body">Job heeft anderen gesterkt; nu raakt de</text><text x="68" y="433" class="body">ellende hemzelf.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Elifaz’ redenering</text><text x="68" y="582" class="body">Onschuldigen komen volgens hem niet om;</text><text x="68" y="625" class="body">onrecht zaaien levert ellende op.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Beeldspraak</text><text x="68" y="774" class="body">Ploegen en oogsten, leeuwen en</text><text x="68" y="817" class="body">kwetsbare lemen huizen.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Zijn nachtvertelling</text><text x="68" y="966" class="body">Angst, een onherkende gedaante en een</text><text x="68" y="1009" class="body">stem over mens en Maker.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Zijn gevolgtrekking</text><text x="68" y="1158" class="body">De mens is kwetsbaar en niet reiner dan</text><text x="68" y="1201" class="body">zijn Maker.</text><text x="46" y="1294" class="note">Deze beweringen en het nachtverhaal zijn aan</text><text x="46" y="1330" class="note">Elifaz toegeschreven. Zijn verklaring is niet</text><text x="46" y="1366" class="note">automatisch het oordeel van de verteller over</text><text x="46" y="1402" class="note">Jobs schuld.</text></svg>