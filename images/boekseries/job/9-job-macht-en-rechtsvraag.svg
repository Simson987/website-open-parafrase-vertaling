<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1554" viewBox="0 0 840 1554" role="img" aria-labelledby="title desc"><title id="title">Job: macht en rechtsvraag</title><desc id="desc">De stap van kosmische macht naar de vraag naar een gelijkwaardige rechtsgang en een bemiddelaar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1554" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job: macht en rechtsvraag</text><text x="44" y="113" class="ref">Job 9:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Job antwoordt Bildad; zijn rede loopt</text><text x="68" y="284" class="body">door in hoofdstuk 10.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vraag</text><text x="68" y="433" class="body">Hoe kan een mens gelijk krijgen bij</text><text x="68" y="476" class="body">God?</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Macht van de Maker</text><text x="68" y="625" class="body">Bergen, aarde, zon, zee en sterren</text><text x="68" y="668" class="body">tonen een overweldigende grootheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Jobs ervaring</text><text x="68" y="817" class="body">Ook als hij onschuldig is, ervaart hij</text><text x="68" y="860" class="body">geen veilige toegang tot het recht.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Snel voorbij</text><text x="68" y="1009" class="body">Hardloper, rietboot en duikende adelaar</text><text x="68" y="1052" class="body">beelden zijn dagen uit.</text><rect x="42" y="1110" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Wat ontbreekt</text><text x="68" y="1201" class="body">Geen scheidsrechter tussen hen; hij</text><text x="68" y="1244" class="body">verlangt zonder schrik te kunnen</text><text x="68" y="1287" class="body">spreken.</text><text x="46" y="1380" class="note">De uitspraken over Gods handelen zijn Jobs</text><text x="46" y="1416" class="note">worstelende woorden. De sterrenillustratie is</text><text x="46" y="1452" class="note">geen exacte kaart van een gedateerde nacht boven</text><text x="46" y="1488" class="note">Uz.</text></svg>