<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1554" viewBox="0 0 840 1554" role="img" aria-labelledby="title desc"><title id="title">Elifaz: raad en beloften</title><desc id="desc">Redenering en belofte onderscheiden van gebeurtenissen die al hebben plaatsgevonden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1554" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elifaz: raad en beloften</text><text x="44" y="113" class="ref">Job 5:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vervolg van Elifaz</text><text x="68" y="241" class="body">Geen nieuwe spreker; hij zet zijn</text><text x="68" y="284" class="body">eerste rede voort.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dwaasheid en moeite</text><text x="68" y="433" class="body">Ergernis en jaloezie brengen schade; de</text><text x="68" y="476" class="body">mens kent ellende.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn advies</text><text x="68" y="625" class="body">God zoeken en de zaak aan Hem</text><text x="68" y="668" class="body">voorleggen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn redenen</text><text x="68" y="817" class="body">Regen, redding van armen en het</text><text x="68" y="860" class="body">verijdelen van sluwe plannen.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Tucht en herstel</text><text x="68" y="1009" class="body">Gods terechtwijzing aannemen; hij</text><text x="68" y="1052" class="body">belooft redding, vrede, talrijk</text><text x="68" y="1095" class="body">nageslacht en hoge ouderdom.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Zijn stellige slot</text><text x="68" y="1244" class="body">Zo hebben wij het onderzocht: luister</text><text x="68" y="1287" class="body">en neem het ter harte.</text><text x="46" y="1380" class="note">De beloften over een vredige tent zijn Elifaz’</text><text x="46" y="1416" class="note">raad aan Job. Zij zijn op dit moment nog geen</text><text x="46" y="1452" class="note">vertelling dat Jobs gezin en bezit hersteld</text><text x="46" y="1488" class="note">zijn.</text></svg>