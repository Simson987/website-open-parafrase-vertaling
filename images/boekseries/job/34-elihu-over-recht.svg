<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Elihu over recht</title><desc id="desc">Opbouw van Elihu’s tweede rede en het onderscheid tussen geciteerde klacht en reactie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elihu over recht</text><text x="44" y="113" class="ref">Job 34:1–37</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Toetsen · 1–4</text><text x="68" y="241" class="body">Zoals oren woorden en een mond voedsel</text><text x="68" y="284" class="body">proeft, zo willen de hoorders samen</text><text x="68" y="327" class="body">onderscheiden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zijn weergave · 5–9</text><text x="68" y="476" class="body">Elihu haalt Jobs klacht aan en</text><text x="68" y="519" class="body">beoordeelt die.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zijn verdediging · 10–30</text><text x="68" y="668" class="body">Hij verdedigt Gods recht,</text><text x="68" y="711" class="body">onpartijdigheid, kennis en macht.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zijn oproep · 31–33</text><text x="68" y="860" class="body">Leren en erkennen wat men niet ziet.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Zijn scherpe slot · 34–37</text><text x="68" y="1009" class="body">Hij verwijt Job gebrek aan inzicht en</text><text x="68" y="1052" class="body">verzet.</text><text x="46" y="1145" class="note">De beschuldigingen en conclusies blijven als</text><text x="46" y="1181" class="note">woorden van Elihu herkenbaar. De illustraties</text><text x="46" y="1217" class="note">van rijk en arm zijn voorbeelden in zijn betoog.</text></svg>