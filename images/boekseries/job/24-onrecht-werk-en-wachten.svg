<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1597" viewBox="0 0 840 1597" role="img" aria-labelledby="title desc"><title id="title">Onrecht, werk en wachten</title><desc id="desc">Samenhang van sociale uitbuiting, gebrek aan onderdak en de vraag naar het tijdstip van gerechtigheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1597" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onrecht, werk en wachten</text><text x="44" y="113" class="ref">Job 24:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De openingsvraag</text><text x="68" y="241" class="body">Waarom zien wie God kennen geen vaste</text><text x="68" y="284" class="body">dag van recht?</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Machtsmisbruik</text><text x="68" y="433" class="body">Grensstenen, kudden, onderpand van</text><text x="68" y="476" class="body">wezen en weduwen, armen van de weg</text><text x="68" y="519" class="body">verdrijven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Arbeid zonder deel</text><text x="68" y="668" class="body">Hongerig schoven dragen, olie persen en</text><text x="68" y="711" class="body">dorstig wijn treden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Geen beschutting</text><text x="68" y="860" class="body">Nachtkou en bergregen, schuilen tegen</text><text x="68" y="903" class="body">rotsen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Misdaad in het donker</text><text x="68" y="1052" class="body">Moord, overspel en inbraak zoeken de</text><text x="68" y="1095" class="body">verborgenheid.</text><rect x="42" y="1153" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Het slot</text><text x="68" y="1244" class="body">Dood en verlies worden genoemd, maar de</text><text x="68" y="1287" class="body">spanning van veiligheid en uitgesteld</text><text x="68" y="1330" class="body">oordeel blijft staan.</text><text x="46" y="1423" class="note">Deze voorbeelden dienen Jobs vraag naar</text><text x="46" y="1459" class="note">zichtbaar recht. Zij vertellen niet dat Job zelf</text><text x="46" y="1495" class="note">nu grensstenen verplaatst of een nieuwe oogst</text><text x="46" y="1531" class="note">binnenhaalt.</text></svg>