<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1561" viewBox="0 0 840 1561" role="img" aria-labelledby="title desc"><title id="title">Job vervloekt zijn geboortedag</title><desc id="desc">De beweging van verwensing via waaromvragen naar de concrete pijn, met het juiste voorwerp van de vervloeking.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1561" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job vervloekt zijn geboortedag</text><text x="44" y="113" class="ref">Job 3:1–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie spreekt</text><text x="68" y="241" class="body">Job, nadat de vrienden zeven dagen</text><text x="68" y="284" class="body">gezwegen hebben.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dag en nacht</text><text x="68" y="433" class="body">Hij vervloekt zijn geboortedag en</text><text x="68" y="476" class="body">conceptienacht, niet God.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Waarom geboren?</text><text x="68" y="625" class="body">Vraagt waarom hij niet bij de geboorte</text><text x="68" y="668" class="body">stierf; verlangt naar rust.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Een omgekeerde wereld</text><text x="68" y="817" class="body">In zijn voorstelling hebben koningen,</text><text x="68" y="860" class="body">gevangenen en slaven rust en gelijkheid</text><text x="68" y="903" class="body">in de dood.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Waarom nog leven?</text><text x="68" y="1052" class="body">Vraagt waarom licht gegeven wordt aan</text><text x="68" y="1095" class="body">wie bitter lijden.</text><rect x="42" y="1153" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Het slot</text><text x="68" y="1244" class="body">Zuchten in plaats van brood; de</text><text x="68" y="1287" class="body">gevreesde ellende is gekomen, rust</text><text x="68" y="1330" class="body">ontbreekt.</text><text x="46" y="1423" class="note">Dit is Jobs wanhoopstaal binnen het gesprek. De</text><text x="46" y="1459" class="note">beelden van duisternis en rust zijn geen nieuwe</text><text x="46" y="1495" class="note">gebeurtenissen op de ashoop.</text></svg>