<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Uz, gezin en bezittingen</title><desc id="desc">De precieze aantallen, eenheden en Jobs zorg vóór de rampspoed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uz, gezin en bezittingen</text><text x="44" y="113" class="ref">Job 1:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Job</text><text x="68" y="241" class="body">Eerlijk, oprecht, ontzag voor God en</text><text x="68" y="284" class="body">ver van kwaad; woont in Uz.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gezin</text><text x="68" y="433" class="body">Zeven zonen en drie dochters; zonen</text><text x="68" y="476" class="body">nodigen zussen voor maaltijden uit.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vee</text><text x="68" y="625" class="body">7.000 schapen; 3.000 kamelen; 500 span</text><text x="68" y="668" class="body">runderen; 500 ezelinnen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Knechten</text><text x="68" y="817" class="body">Heel veel; geen exact aantal genoemd.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Gewoonte</text><text x="68" y="966" class="body">Na feestdagen heiligen en vroeg voor</text><text x="68" y="1009" class="body">ieder een brandoffer brengen.</text><text x="46" y="1102" class="note">Vijfhonderd span runderen is een aantal spannen,</text><text x="46" y="1138" class="note">niet slechts vijfhonderd afzonderlijke runderen.</text><text x="46" y="1174" class="note">De kinderen krijgen hier nog geen namen.</text></svg>