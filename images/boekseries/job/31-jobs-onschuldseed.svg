<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1405" viewBox="0 0 840 1405" role="img" aria-labelledby="title desc"><title id="title">Jobs onschuldseed</title><desc id="desc">De samenhang tussen Jobs eden, gelijke rechten en zijn verzoek om gehoord te worden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1405" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jobs onschuldseed</text><text x="44" y="113" class="ref">Job 31:1–40</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ogen en hart · 1–12</text><text x="68" y="241" class="body">Job legt zijn gedrag voor aan een</text><text x="68" y="284" class="body">eerlijke weging; hij formuleert</text><text x="68" y="327" class="body">voorwaardelijke eden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gelijke Schepper · 13–15</text><text x="68" y="476" class="body">Zijn knecht en dienares hebben recht om</text><text x="68" y="519" class="body">hun zaak te laten horen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zorg · 16–23</text><text x="68" y="668" class="body">Arme, weduwe, wees en wie kleding nodig</text><text x="68" y="711" class="body">heeft.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vertrouwen · 24–28</text><text x="68" y="860" class="body">Geen hoop op goud, geen verering van</text><text x="68" y="903" class="body">zon en maan.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Openheid · 29–40</text><text x="68" y="1052" class="body">Geen vreugde om een vijand;</text><text x="68" y="1095" class="body">gastvrijheid, verantwoording en zorg</text><text x="68" y="1138" class="body">voor de akker.</text><text x="46" y="1231" class="note">De aanwezige zorgbeelden illustreren Jobs</text><text x="46" y="1267" class="note">verdediging van zijn vroegere gedrag. Zijn</text><text x="46" y="1303" class="note">voorwaardelijke eden zijn geen bekentenis van de</text><text x="46" y="1339" class="note">genoemde misdaden.</text></svg>