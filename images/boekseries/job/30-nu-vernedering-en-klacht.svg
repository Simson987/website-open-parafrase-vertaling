<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1518" viewBox="0 0 840 1518" role="img" aria-labelledby="title desc"><title id="title">Nu: vernedering en klacht</title><desc id="desc">De omkering van toen naar nu, met de klacht over onbeantwoorde zorg en verloren vreugde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1518" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nu: vernedering en klacht</text><text x="44" y="113" class="ref">Job 30:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tegenover hoofdstuk 29</text><text x="68" y="241" class="body">Na de herinnering van toen komt de</text><text x="68" y="284" class="body">scherpe omslag: maar nu.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sociale vernedering</text><text x="68" y="433" class="body">Wordt een spotlied, vermeden en</text><text x="68" y="476" class="body">bespuugd door mensen op wie hij eerder</text><text x="68" y="519" class="body">neerkeek.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Geen rust</text><text x="68" y="668" class="body">Pijn, koorts en onrust; eer en geluk</text><text x="68" y="711" class="body">als weggeblazen.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Aanspraak tot God</text><text x="68" y="860" class="body">Roept om hulp en ervaart geen antwoord.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Zijn vraag aan de omgeving</text><text x="68" y="1009" class="body">Hij had zelf medelijden met wie het</text><text x="68" y="1052" class="body">moeilijk had; waarom nu geen hulp?</text><rect x="42" y="1110" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Poëtisch slot</text><text x="68" y="1201" class="body">Broer van jakhalzen, metgezel van</text><text x="68" y="1244" class="body">struisvogels; harp en fluit worden</text><text x="68" y="1287" class="body">klacht.</text><text x="46" y="1380" class="note">Aanvalswegen, storm en dierenverwantschap zijn</text><text x="46" y="1416" class="note">beelden van vernedering en eenzaamheid. Er wordt</text><text x="46" y="1452" class="note">geen werkelijke familieband met dieren verteld.</text></svg>