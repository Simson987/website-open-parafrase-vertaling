<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Elihu: onderricht en natuur</title><desc id="desc">De overgang van onderricht door lijden naar de grootheid van de natuur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elihu: onderricht en natuur</text><text x="44" y="113" class="ref">Job 36:1–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zijn uitgangspunt · 1–7</text><text x="68" y="241" class="body">God is machtig en veracht volgens Elihu</text><text x="68" y="284" class="body">niemand; Hij doet armen recht.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onderricht · 8–15</text><text x="68" y="433" class="body">Gevangenschap en ellende worden als</text><text x="68" y="476" class="body">waarschuwing beschreven; Elihu</text><text x="68" y="519" class="body">onderscheidt luisteren en weigeren.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Aanspraak op Job · 16–21</text><text x="68" y="668" class="body">Ruimte en een volle tafel staan in zijn</text><text x="68" y="711" class="body">oproep naast waarschuwingen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Van leraar naar schepping · 22–33</text><text x="68" y="860" class="body">Hij wijst op regen, wolken, donder en</text><text x="68" y="903" class="body">naderend onweer.</text><text x="46" y="996" class="note">De volle tafel is een beeld binnen Elihu’s</text><text x="46" y="1032" class="note">aanspraak, nog geen verslag van Jobs herstel. De</text><text x="46" y="1068" class="note">natuurbeelden lopen door in hoofdstuk 37.</text></svg>