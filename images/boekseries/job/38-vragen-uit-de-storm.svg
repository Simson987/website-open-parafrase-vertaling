<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc"><title id="title">Vragen uit de storm</title><desc id="desc">Thematische groepen van de scheppingsvragen volgens de plaatselijke nummering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1319" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vragen uit de storm</text><text x="44" y="113" class="ref">Job 38:1–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De spreker · 1–3</text><text x="68" y="241" class="body">De HEERE antwoordt Job vanuit de storm</text><text x="68" y="284" class="body">en stelt vragen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aarde en zee · 4–11</text><text x="68" y="433" class="body">Fundamenten, geboorte en begrenzing van</text><text x="68" y="476" class="body">de zee.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dag en diepte · 12–21</text><text x="68" y="625" class="body">Dageraad, diepe zee, dood, licht en</text><text x="68" y="668" class="body">donker.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Weer · 22–30</text><text x="68" y="817" class="body">Sneeuw, hagel, wind, regen, dauw, ijs</text><text x="68" y="860" class="body">en rijp.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Hemel en wolken · 31–38</text><text x="68" y="1009" class="body">Sterrenverbanden, regen, bliksem en de</text><text x="68" y="1052" class="body">wolken.</text><text x="46" y="1145" class="note">De vragen gebruiken rijke beeldtaal. De</text><text x="46" y="1181" class="note">illustraties tonen motieven uit de rede; zij</text><text x="46" y="1217" class="note">voegen geen menselijk portret van de spreker of</text><text x="46" y="1253" class="note">meetkundige scheppingskaart toe.</text></svg>