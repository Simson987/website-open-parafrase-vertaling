<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1468" viewBox="0 0 840 1468" role="img" aria-labelledby="title desc"><title id="title">Job: nacht en aanspraak</title><desc id="desc">De overgang in aangesprokene en de verschillende beelden voor vermoeidheid en korte levensduur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1468" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job: nacht en aanspraak</text><text x="44" y="113" class="ref">Job 7:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vervolg van Job</text><text x="68" y="241" class="body">Zijn antwoord gaat van vrienden naar</text><text x="68" y="284" class="body">een rechtstreekse aanspraak tot God.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zwaar bestaan</text><text x="68" y="433" class="body">Slaaf en dagloner verlangen naar</text><text x="68" y="476" class="body">schaduw en loon.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn nachten</text><text x="68" y="625" class="body">Woelen, huidpijn en schrikdromen; zijn</text><text x="68" y="668" class="body">dagen zijn snel als een weversspoel.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vergankelijkheid</text><text x="68" y="817" class="body">Leven als wind en een oplossende wolk.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Waarom bewaken?</text><text x="68" y="966" class="body">Hij vraagt waarom God hem zonder</text><text x="68" y="1009" class="body">onderbreking lijkt te onderzoeken.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Laatste vraag</text><text x="68" y="1158" class="body">Vraagt om vergeving en een ogenblik</text><text x="68" y="1201" class="body">ademruimte.</text><text x="46" y="1294" class="note">Zee, zeemonster, weefwerk en wolk zijn</text><text x="46" y="1330" class="note">vergelijkingen in Jobs klacht. Zij vormen geen</text><text x="46" y="1366" class="note">nieuwe reis of letterlijke taak die Job nu</text><text x="46" y="1402" class="note">uitvoert.</text></svg>