<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1448" viewBox="0 0 840 1448" role="img" aria-labelledby="title desc"><title id="title">Elihu neemt het woord</title><desc id="desc">Wie Elihu is, waarom hij gewacht heeft en wat hij de gesprekspartners verwijt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1448" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elihu neemt het woord</text><text x="44" y="113" class="ref">Job 32:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het gesprek stokt</text><text x="68" y="241" class="body">De drie vrienden houden op Job te</text><text x="68" y="284" class="body">antwoorden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De nieuwe spreker</text><text x="68" y="433" class="body">Elihu, zoon van Baracheël, uit Buz, uit</text><text x="68" y="476" class="body">de familie van Ram.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee bezwaren</text><text x="68" y="625" class="body">Hij is boos op Job en op de drie</text><text x="68" y="668" class="body">vrienden die geen antwoord gevonden</text><text x="68" y="711" class="body">hebben.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Leeftijd en inzicht</text><text x="68" y="860" class="body">Hij wachtte als jongere; inzicht hangt</text><text x="68" y="903" class="body">volgens hem niet alleen van ouderdom</text><text x="68" y="946" class="body">af.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Spreekdrang</text><text x="68" y="1095" class="body">Hij vergelijkt zichzelf met volle</text><text x="68" y="1138" class="body">wijnzakken; hij belooft zonder vleierij</text><text x="68" y="1181" class="body">te spreken.</text><text x="46" y="1274" class="note">De wijnzak is Elihu’s vergelijking voor zijn</text><text x="46" y="1310" class="note">spreekdrang. Ram wordt als familie aangeduid,</text><text x="46" y="1346" class="note">niet als hier rechtstreeks genoemde vader van</text><text x="46" y="1382" class="note">Baracheël.</text></svg>