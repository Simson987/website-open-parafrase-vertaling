<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1432" viewBox="0 0 840 1432" role="img" aria-labelledby="title desc"><title id="title">Job: pijn en vriendschap</title><desc id="desc">Jobs antwoord, het falen van de vriendschap en zijn vraag om concrete, eerlijke weerlegging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1432" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job: pijn en vriendschap</text><text x="44" y="113" class="ref">Job 6:1–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Job antwoordt Elifaz; zijn antwoord</text><text x="68" y="284" class="body">gaat verder in hoofdstuk 7.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De maat van de pijn</text><text x="68" y="433" class="body">Verdriet zwaarder dan zeezand; pijlen</text><text x="68" y="476" class="body">en bedorven voedsel als beelden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Einde van zijn kracht</text><text x="68" y="625" class="body">Vraagt hoe hij nog kan volhouden en</text><text x="68" y="668" class="body">spreekt een doodswens uit.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wat een vriend verschuldigd is</text><text x="68" y="817" class="body">Trouw aan iemand die het zwaar heeft.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Droge beken</text><text x="68" y="966" class="body">Vrienden als water dat bij hitte</text><text x="68" y="1009" class="body">verdwijnt; karavanen hopen vergeefs.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Zijn verzoek</text><text x="68" y="1158" class="body">Toon zijn fout met eerlijke woorden;</text><text x="68" y="1201" class="body">kijk hem aan en doe geen onrecht.</text><text x="46" y="1294" class="note">De weegschaal, pijlen en beken verbeelden zijn</text><text x="46" y="1330" class="note">ervaring. Er vindt geen letterlijke beschieting</text><text x="46" y="1366" class="note">of weging van zijn lichaam plaats.</text></svg>