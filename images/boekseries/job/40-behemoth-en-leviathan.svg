<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Behemoth en Leviathan</title><desc id="desc">De twee namen en hun verschillende tekstkenmerken; geen stellige zoologische identificatie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Behemoth en Leviathan</text><text x="44" y="113" class="ref">Job 40:10–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Behemoth · 10–19</text><text x="68" y="241" class="body">Eet gras, heeft kracht in buik en</text><text x="68" y="284" class="body">lendenen en een staart vergeleken met</text><text x="68" y="327" class="body">een ceder.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Omgeving · 15–18</text><text x="68" y="476" class="body">Bergen, schaduw, riet, wilgen en de</text><text x="68" y="519" class="body">kracht van de rivier.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Leviathan · 20–28</text><text x="68" y="668" class="body">Vragen over vishaak, touw,</text><text x="68" y="711" class="body">gevangennemen, bedwingen en ontzag.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Open vergelijking</text><text x="68" y="860" class="body">De genoemde kracht laat zich niet als</text><text x="68" y="903" class="body">een gewoon huisdier behandelen.</text><text x="46" y="996" class="note">Dit schema ordent wat de tekst zegt. Het stelt</text><text x="46" y="1032" class="note">geen onzekere soortnaam vast en vermengt de</text><text x="46" y="1068" class="note">beide dieren niet met elkaar.</text></svg>