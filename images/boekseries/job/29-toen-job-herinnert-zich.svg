<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1597" viewBox="0 0 840 1597" role="img" aria-labelledby="title desc"><title id="title">Toen: Job herinnert zich</title><desc id="desc">De tijdlaag en de verbinding tussen vroeger aanzien en daadwerkelijke zorg voor anderen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1597" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toen: Job herinnert zich</text><text x="44" y="113" class="ref">Job 29:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tijdlaag</text><text x="68" y="241" class="body">Job verlangt terug naar vroegere</text><text x="68" y="284" class="body">maanden van bewaring en nabijheid.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Huis en aanzien</text><text x="68" y="433" class="body">Kinderen om hem heen, voorspoed en een</text><text x="68" y="476" class="body">gerespecteerde plaats bij de</text><text x="68" y="519" class="body">stadspoort.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Recht voor kwetsbaren</text><text x="68" y="668" class="body">Arme, wees, weduwe, blinde, kreupele en</text><text x="68" y="711" class="body">onbekende met een rechtszaak.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zijn beelden</text><text x="68" y="860" class="body">Gerechtigheid als kleding, ogen en</text><text x="68" y="903" class="body">voeten voor de ander, wortel bij water</text><text x="68" y="946" class="body">en raad als regen.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Zijn verwachting toen</text><text x="68" y="1095" class="body">Lang leven in eigen nest; blijvende eer</text><text x="68" y="1138" class="body">en kracht.</text><rect x="42" y="1196" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1239" class="label">Het slotbeeld</text><text x="68" y="1287" class="body">Als een koning tussen troepen en een</text><text x="68" y="1330" class="body">trooster tussen treurenden.</text><text x="46" y="1423" class="note">Dit is herinnering aan vóór de ellende, geen</text><text x="46" y="1459" class="note">herstel dat al na de gesprekken is ingetreden.</text><text x="46" y="1495" class="note">Job wordt met een koning vergeleken, niet tot</text><text x="46" y="1531" class="note">koning gekroond.</text></svg>