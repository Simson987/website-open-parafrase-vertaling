<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">Tweede grens en zeven dagen</title><desc id="desc">Grenzen van de proef, de drie herkomsten en het onderscheid tussen stilte en discussie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tweede grens en zeven dagen</text><text x="44" y="113" class="ref">Job 2:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De nieuwe aantijging</text><text x="68" y="241" class="body">De satan verplaatst de proef van bezit</text><text x="68" y="284" class="body">naar lichaam.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De grens</text><text x="68" y="433" class="body">Job mag getroffen worden, maar zijn</text><text x="68" y="476" class="body">leven moet gespaard.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">As en potscherf</text><text x="68" y="625" class="body">Zweren van voetzool tot hoofd; Job</text><text x="68" y="668" class="body">krabt met een scherf.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn vrouw</text><text x="68" y="817" class="body">Vraagt oprechtheid los te laten; Job</text><text x="68" y="860" class="body">weigert God te vervloeken.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Drie vrienden</text><text x="68" y="1009" class="body">Elifaz uit Theman, Bildad uit Suah,</text><text x="68" y="1052" class="body">Zofar uit Naäma.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Zeven dagen en nachten</text><text x="68" y="1201" class="body">Zwijgend op de grond, omdat zijn pijn</text><text x="68" y="1244" class="body">heel groot is.</text><text x="46" y="1337" class="note">De vrienden beginnen met medeleven en stilte.</text><text x="46" y="1373" class="note">Hun uitleg en discussie beginnen pas nadat Job</text><text x="46" y="1409" class="note">in hoofdstuk 3 zijn klacht uit.</text></svg>