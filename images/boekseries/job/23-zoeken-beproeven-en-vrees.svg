<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1554" viewBox="0 0 840 1554" role="img" aria-labelledby="title desc"><title id="title">Zoeken, beproeven en vrees</title><desc id="desc">De spanning tussen vertrouwen op zijn levensweg en vrees voor de onvindbare rechter.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1554" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zoeken, beproeven en vrees</text><text x="44" y="113" class="ref">Job 23:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Job; zijn antwoord gaat verder in</text><text x="68" y="284" class="body">hoofdstuk 24.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Een gehoor gezocht</text><text x="68" y="433" class="body">Zou God vinden en zijn zaak met</text><text x="68" y="476" class="body">argumenten voorleggen; verwacht dat een</text><text x="68" y="519" class="body">eerlijk mens gehoord wordt.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Geen vindplaats</text><text x="68" y="668" class="body">Vooruit, achteruit, links en rechts:</text><text x="68" y="711" class="body">Job ziet Hem niet.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Toch gekend</text><text x="68" y="860" class="body">God kent zijn weg; onderzoek zou hem</text><text x="68" y="903" class="body">als goud tonen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Vasthouden</text><text x="68" y="1052" class="body">Zijn spoor, gebod en woorden zijn Job</text><text x="68" y="1095" class="body">kostbaarder dan dagelijks brood.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">De spanning</text><text x="68" y="1244" class="body">Gods vaste besluit maakt hem ook bang;</text><text x="68" y="1287" class="body">duisternis bedekt zijn gezicht.</text><text x="46" y="1380" class="note">Het zoeken in vier richtingen is geen</text><text x="46" y="1416" class="note">beschrijving van een voltooide reis naar vier</text><text x="46" y="1452" class="note">genoemde steden. De goudproef is een</text><text x="46" y="1488" class="note">vergelijking met Jobs beproeving.</text></svg>