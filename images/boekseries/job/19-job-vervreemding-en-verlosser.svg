<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1597" viewBox="0 0 840 1597" role="img" aria-labelledby="title desc"><title id="title">Vervreemding en Verlosser</title><desc id="desc">De omkeer van uiterste eenzaamheid naar het uitgesproken vertrouwen en verlangen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1597" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vervreemding en Verlosser</text><text x="44" y="113" class="ref">Job 19:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tegen de vrienden</text><text x="68" y="241" class="body">Woorden verpletteren; hij vraagt</text><text x="68" y="284" class="body">herhaaldelijk om medelijden.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verbroken relaties</text><text x="68" y="433" class="body">Familie, huisgenoten, knecht, vrouw,</text><text x="68" y="476" class="body">kinderen en vertrouwelingen keren zich</text><text x="68" y="519" class="body">volgens zijn klacht af.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zijn rechtsroep</text><text x="68" y="668" class="body">Er is geen antwoord op zijn roepen om</text><text x="68" y="711" class="body">recht; hij ervaart God als</text><text x="68" y="754" class="body">tegenstander.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Woorden bewaren</text><text x="68" y="903" class="body">Wenst een boek of blijvende inscriptie</text><text x="68" y="946" class="body">met ijzer en lood in de rots.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Zijn belijdenis</text><text x="68" y="1095" class="body">Mijn Verlosser leeft; hij verlangt God</text><text x="68" y="1138" class="body">zelf te zien.</text><rect x="42" y="1196" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1239" class="label">Waarschuwing</text><text x="68" y="1287" class="body">De vrienden moeten zelf bedenken dat er</text><text x="68" y="1330" class="body">een oordeel is.</text><text x="46" y="1423" class="note">De wens om woorden in steen te laten zetten is</text><text x="46" y="1459" class="note">nog geen opdracht aan een aanwezige steenhouwer.</text><text x="46" y="1495" class="note">De Verlosser wordt niet met een verzonnen</text><text x="46" y="1531" class="note">zichtbare gestalte afgebeeld.</text></svg>