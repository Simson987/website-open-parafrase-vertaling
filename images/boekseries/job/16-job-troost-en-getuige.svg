<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1554" viewBox="0 0 840 1554" role="img" aria-labelledby="title desc"><title id="title">Job: troost en getuige</title><desc id="desc">Het verschil tussen schadelijke menselijke troost en het verlangen naar een hemelse getuige.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1554" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Job: troost en getuige</text><text x="44" y="113" class="ref">Job 16:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Job antwoordt Elifaz en gaat door in</text><text x="68" y="284" class="body">hoofdstuk 17.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verkeerde troost</text><text x="68" y="433" class="body">De woorden maken de pijn groter; hij</text><text x="68" y="476" class="body">zou juist sterken als de rollen</text><text x="68" y="519" class="body">omgekeerd waren.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zijn aanvalstaal</text><text x="68" y="668" class="body">Mikpunt, schutters, bressen en soldaat</text><text x="68" y="711" class="body">verbeelden het overweldigende lijden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zijn beroep</text><text x="68" y="860" class="body">Geen geweld in zijn handen en zijn</text><text x="68" y="903" class="body">gebed is zuiver.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Getuige in de hemel</text><text x="68" y="1052" class="body">Hij zegt dat iemand daar voor hem</text><text x="68" y="1095" class="body">instaat.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Het verlangen</text><text x="68" y="1244" class="body">Iemand die voor een mens bij God pleit,</text><text x="68" y="1287" class="body">zoals een vriend voor een vriend.</text><text x="46" y="1380" class="note">De militaire beelden zijn geen verslag van een</text><text x="46" y="1416" class="note">letterlijk schietincident. De identiteit van de</text><text x="46" y="1452" class="note">hemelse getuige krijgt hier geen naam of</text><text x="46" y="1488" class="note">portret.</text></svg>