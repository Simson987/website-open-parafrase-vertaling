<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1511" viewBox="0 0 840 1511" role="img" aria-labelledby="title desc"><title id="title">Zofar: schuld en wijsheid</title><desc id="desc">De verhouding tussen beschuldiging, onpeilbaarheid en voorwaardelijke herstelbelofte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1511" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zofar: schuld en wijsheid</text><text x="44" y="113" class="ref">Job 11:1–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker</text><text x="68" y="241" class="body">Zofar uit Naäma, de derde vriend.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zijn verwijt</text><text x="68" y="390" class="body">Vindt Jobs woorden aanmatigend; beweert</text><text x="68" y="433" class="body">dat God zelfs een deel van zijn schuld</text><text x="68" y="476" class="body">vergeet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Onpeilbare wijsheid</text><text x="68" y="625" class="body">Hoger dan hemel, dieper dan dodenrijk,</text><text x="68" y="668" class="body">langer dan aarde en breder dan zee.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn voorwaarde</text><text x="68" y="817" class="body">Hart richten, handen uitstrekken en</text><text x="68" y="860" class="body">onrecht wegdoen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Zijn belofte</text><text x="68" y="1009" class="body">Moeite als voorbijgestroomd water,</text><text x="68" y="1052" class="body">licht en rustige slaap.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Zijn waarschuwing</text><text x="68" y="1201" class="body">De goddeloze heeft volgens hem geen</text><text x="68" y="1244" class="body">blijvende toevlucht.</text><text x="46" y="1337" class="note">De schuldtoeschrijving is Zofars oordeel, geen</text><text x="46" y="1373" class="note">nieuw bewijs van verborgen kwaad bij Job.</text><text x="46" y="1409" class="note">Afmetingen zijn vergelijkingen, geen meetbare</text><text x="46" y="1445" class="note">kaart.</text></svg>