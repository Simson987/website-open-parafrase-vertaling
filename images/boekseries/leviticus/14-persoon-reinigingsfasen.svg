<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">De reiniging in fasen</title><desc id="desc">De fasen vanaf het onderzoek buiten het kamp tot de offers op de achtste dag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De reiniging in fasen</text><text x="44" y="113" class="ref">Leviticus 14:3–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Buiten het kamp</text><text x="68" y="241" class="body">De priester onderzoekt of de aantasting</text><text x="68" y="284" class="body">genezen is.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twee vogels</text><text x="68" y="433" class="body">Met cederhout, rode wol en hysop;</text><text x="68" y="476" class="body">zevenmaal besprenkelen en de levende</text><text x="68" y="519" class="body">vogel vrijlaten.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wassen en wachten</text><text x="68" y="668" class="body">Wassen, scheren en zeven dagen buiten</text><text x="68" y="711" class="body">de eigen tent blijven; op dag zeven</text><text x="68" y="754" class="body">opnieuw wassen en scheren.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De achtste dag</text><text x="68" y="903" class="body">Offers bij de ingang van de</text><text x="68" y="946" class="body">ontmoetingstent.</text><text x="46" y="1039" class="note">De vrijgelaten vogel en de wachtdagen zijn</text><text x="46" y="1075" class="note">afzonderlijke onderdelen.</text></svg>