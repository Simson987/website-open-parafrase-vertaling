<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Perioden en reiniging</title><desc id="desc">Onderscheid tussen de genoemde perioden en de offers na langdurige afscheiding of bloeding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Perioden en reiniging</text><text x="44" y="113" class="ref">Leviticus 15:13–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Abnormale afscheiding bij een man</text><text x="68" y="241" class="body">Na het stoppen zeven dagen tellen,</text><text x="68" y="284" class="body">wassen; op dag acht twee vogels</text><text x="68" y="327" class="body">brengen.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gewone zaadlozing</text><text x="68" y="476" class="body">Wassen; onrein tot de avond.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gewone menstruatie</text><text x="68" y="625" class="body">Zeven dagen in de genoemde rituele</text><text x="68" y="668" class="body">categorie.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Langdurige bloeding bij een vrouw</text><text x="68" y="817" class="body">Na het stoppen zeven dagen tellen; op</text><text x="68" y="860" class="body">dag acht twee vogels brengen.</text><text x="46" y="953" class="note">Een leeswijzer bij rituele bepalingen, zonder</text><text x="46" y="989" class="note">lichamelijke afbeeldingen.</text></svg>