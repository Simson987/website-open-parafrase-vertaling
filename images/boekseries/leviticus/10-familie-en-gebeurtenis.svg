<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Aäron en zijn zonen</title><desc id="desc">De familierelaties en het verloop na het ongeoorloofde vuur, met de overgebleven zonen en het gesprek tussen Mozes en Aäron.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aäron en zijn zonen</text><text x="44" y="113" class="ref">Leviticus 10:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nadab en Abihu</text><text x="68" y="241" class="body">Aärons zonen brengen ongeoorloofd vuur</text><text x="68" y="284" class="body">en sterven door vuur voor de HEERE.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Misaël en Elzafan</text><text x="68" y="433" class="body">Zonen van Uzziël, Aärons oom; zij</text><text x="68" y="476" class="body">dragen hun familieleden buiten het</text><text x="68" y="519" class="body">kamp.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Eleazar en Ithamar</text><text x="68" y="668" class="body">Aärons overgebleven zonen blijven bij</text><text x="68" y="711" class="body">de dienst.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De opdracht</text><text x="68" y="860" class="body">Heilig en onheilig, rein en onrein</text><text x="68" y="903" class="body">onderscheiden en Israël onderwijzen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het gesprek over het offer</text><text x="68" y="1052" class="body">Aäron verklaart zijn verdriet; Mozes</text><text x="68" y="1095" class="body">aanvaardt zijn antwoord.</text><text x="46" y="1188" class="note">Verwantschappen en gebeurtenissen worden sober</text><text x="46" y="1224" class="note">weergegeven, zonder het sterven af te beelden.</text></svg>