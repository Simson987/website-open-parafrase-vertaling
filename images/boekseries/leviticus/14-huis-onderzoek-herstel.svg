<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Onderzoek van een huis</title><desc id="desc">De volgorde van leeghalen, onderzoek, herstel en de verschillende uitkomsten voor een huis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onderzoek van een huis</text><text x="44" y="113" class="ref">Leviticus 14:33–53</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vóór het onderzoek</text><text x="68" y="241" class="body">Het huis eerst leeghalen; daarna</text><text x="68" y="284" class="body">bekijkt de priester de muren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zeven dagen</text><text x="68" y="433" class="body">Het huis wordt gesloten; daarna volgt</text><text x="68" y="476" class="body">heronderzoek.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij uitbreiding</text><text x="68" y="625" class="body">Aangetaste stenen verwijderen,</text><text x="68" y="668" class="body">afschrapen en opnieuw bepleisteren.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bij terugkeer</text><text x="68" y="817" class="body">Het huis afbreken en het materiaal</text><text x="68" y="860" class="body">buiten de stad brengen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Zonder uitbreiding</text><text x="68" y="1009" class="body">Rein verklaren; de beschreven reiniging</text><text x="68" y="1052" class="body">met twee vogels volgt.</text><text x="46" y="1145" class="note">Dit voorschrift betreft huizen na de intocht in</text><text x="46" y="1181" class="note">Kanaän.</text></svg>