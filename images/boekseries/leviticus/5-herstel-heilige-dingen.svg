<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Herstel van heilige dingen</title><desc id="desc">Schade aan heilige dingen wordt vergoed met twintig procent erbij, samen met een ram als schuldoffer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herstel van heilige dingen</text><text x="44" y="113" class="ref">Leviticus 5:14–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onbedoeld misbruik</text><text x="68" y="241" class="body">Iets wat aan de HEERE geheiligd is,</text><text x="68" y="284" class="body">wordt misbruikt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Volledig vergoeden</text><text x="68" y="433" class="body">De waarde wordt vastgesteld volgens de</text><text x="68" y="476" class="body">heiligdomssikkel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Een vijfde erbij</text><text x="68" y="625" class="body">Twintig procent boven op de vergoeding,</text><text x="68" y="668" class="body">te geven aan de priester.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het schuldoffer</text><text x="68" y="817" class="body">Een ram zonder gebrek; de priester doet</text><text x="68" y="860" class="body">verzoening.</text><text x="46" y="953" class="note">De vergoeding en het offer zijn afzonderlijke</text><text x="46" y="989" class="note">onderdelen van de regeling.</text></svg>