<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Het dankoffer en de delen</title><desc id="desc">De dieren en de taakverdeling van het dankoffer, met de genoemde vetdelen en het verbod op vet en bloed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het dankoffer en de delen</text><text x="44" y="113" class="ref">Leviticus 3:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Welke dieren</text><text x="68" y="241" class="body">Rund, schaap of geit; mannelijk of</text><text x="68" y="284" class="body">vrouwelijk, zonder gebrek.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De offeraar</text><text x="68" y="433" class="body">Legt zijn hand op de kop en biedt het</text><text x="68" y="476" class="body">dier bij de ontmoetingstent aan.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De priesters</text><text x="68" y="625" class="body">Sprenkelen het bloed rondom het altaar.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Op het altaar</text><text x="68" y="774" class="body">Vet rond de ingewanden, nieren en</text><text x="68" y="817" class="body">leverkwab; bij het lam ook de</text><text x="68" y="860" class="body">vetstaart.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Blijvende bepaling</text><text x="68" y="1009" class="body">Vet en bloed mogen niet gegeten worden.</text><text x="46" y="1102" class="note">Dit hoofdstuk beschrijft het altaardeel; latere</text><text x="46" y="1138" class="note">hoofdstukken geven meer regels over de maaltijd.</text></svg>