<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Drie vormen van brandoffer</title><desc id="desc">Rund, schaap of geit, en vogel als de drie vormen van brandoffer in Leviticus 1.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie vormen van brandoffer</text><text x="44" y="113" class="ref">Leviticus 1:3–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rund</text><text x="68" y="241" class="body">Een mannelijk dier zonder gebrek, bij</text><text x="68" y="284" class="body">de ingang van de ontmoetingstent.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Schaap of geit</text><text x="68" y="433" class="body">Een mannelijk dier zonder gebrek; aan</text><text x="68" y="476" class="body">de noordkant van het altaar.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vogel</text><text x="68" y="625" class="body">Een tortelduif of een jonge duif.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Verdeling van taken</text><text x="68" y="774" class="body">De offeraar brengt het dier; Aärons</text><text x="68" y="817" class="body">zonen verzorgen het bloed en het</text><text x="68" y="860" class="body">altaar.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De bestemming</text><text x="68" y="1009" class="body">Het offer gaat op het altaar in rook op</text><text x="68" y="1052" class="body">als een aangename geur.</text><text x="46" y="1145" class="note">De verschillende offermogelijkheden krijgen elk</text><text x="46" y="1181" class="note">hun plaats in de voorschriften.</text></svg>