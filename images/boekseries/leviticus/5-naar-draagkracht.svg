<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Het offer naar draagkracht</title><desc id="desc">De trapsgewijze mogelijkheden na schuldbelijdenis: kleinvee, twee vogels of fijn meel zonder olie en wierook.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het offer naar draagkracht</text><text x="44" y="113" class="ref">Leviticus 5:5–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerst belijden</text><text x="68" y="241" class="body">De persoon belijdt waarin hij heeft</text><text x="68" y="284" class="body">gezondigd.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dier uit het kleinvee</text><text x="68" y="433" class="body">Een vrouwelijk lam of een jonge geit.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Als dat te kostbaar is</text><text x="68" y="582" class="body">Twee tortelduiven of twee jonge duiven:</text><text x="68" y="625" class="body">één zondoffer en één brandoffer.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Als ook dat te kostbaar is</text><text x="68" y="774" class="body">Ongeveer twee liter fijn meel als</text><text x="68" y="817" class="body">zondoffer, zonder olie of wierook.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Priester en vergeving</text><text x="68" y="966" class="body">De priester doet verzoening; het</text><text x="68" y="1009" class="body">overblijvende meel is zijn deel.</text><text x="46" y="1102" class="note">Dit meeloffer is een zondoffer; daarom verschilt</text><text x="46" y="1138" class="note">het van het graanoffer met olie en wierook.</text></svg>