<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Offerplaats en bloed</title><desc id="desc">De centrale offerplaats, de betekenis van bloed en het bedekken van jachtbloed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Offerplaats en bloed</text><text x="44" y="113" class="ref">Leviticus 17:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De offerplaats</text><text x="68" y="241" class="body">De genoemde offers worden bij de ingang</text><text x="68" y="284" class="body">van de ontmoetingstent gebracht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het bloed</text><text x="68" y="433" class="body">De tekst verbindt bloed met het leven</text><text x="68" y="476" class="body">en de verzoening.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij de jacht</text><text x="68" y="625" class="body">Het bloed van eetbaar wild of gevogelte</text><text x="68" y="668" class="body">uitgieten en met aarde bedekken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Eén toepassing</text><text x="68" y="817" class="body">De bepalingen noemen Israëlieten én</text><text x="68" y="860" class="body">inwonende vreemdelingen.</text><text x="46" y="953" class="note">Een overzicht van de verbanden in dit hoofdstuk,</text><text x="46" y="989" class="note">zonder slachtbeelden.</text></svg>