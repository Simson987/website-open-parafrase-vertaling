<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wie eet van heilige gaven?</title><desc id="desc">Reiniging, huishoudelijke categorieën en vergoeding bij de heilige gaven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie eet van heilige gaven?</text><text x="44" y="113" class="ref">Leviticus 22:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Reiniging</text><text x="68" y="241" class="body">Na de genoemde aanraking: wassen en</text><text x="68" y="284" class="body">wachten tot na zonsondergang.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Priesterlijk huishouden</text><text x="68" y="433" class="body">De tekst onderscheidt familie en</text><text x="68" y="476" class="body">huisgenoten van gasten en dagloners.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Een teruggekeerde dochter</text><text x="68" y="625" class="body">Weduwe of gescheiden, zonder kinderen</text><text x="68" y="668" class="body">en weer in het ouderlijk huis: zij mag</text><text x="68" y="711" class="body">weer mee-eten.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Per ongeluk gegeten</text><text x="68" y="860" class="body">De waarde vergoeden en een vijfde</text><text x="68" y="903" class="body">toevoegen.</text><text x="46" y="996" class="note">De uitzonderingen worden naast de algemene</text><text x="46" y="1032" class="note">regels gelezen.</text></svg>