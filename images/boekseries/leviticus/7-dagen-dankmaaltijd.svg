<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Wanneer wordt het offer gegeten?</title><desc id="desc">Lofoffer op dezelfde dag, gelofte- en vrijwillig offer ook op de tweede dag; op de derde dag wordt het overgeblevene verbrand.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wanneer wordt het offer gegeten?</text><text x="44" y="113" class="ref">Leviticus 7:15–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dankoffer als lofoffer</text><text x="68" y="241" class="body">Dezelfde dag eten; niets tot de</text><text x="68" y="284" class="body">volgende morgen bewaren.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gelofte of vrijwillig offer</text><text x="68" y="433" class="body">Op de offerdag en de volgende dag eten.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Derde dag</text><text x="68" y="582" class="body">Overgebleven vlees verbranden; niet</text><text x="68" y="625" class="body">meer eten.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Reinheid</text><text x="68" y="774" class="body">Onrein geworden vlees verbranden; wie</text><text x="68" y="817" class="body">eet moet rein zijn.</text><text x="46" y="910" class="note">De tekst maakt onderscheid tussen soorten</text><text x="46" y="946" class="note">dankoffer en hun bewaartermijnen.</text></svg>