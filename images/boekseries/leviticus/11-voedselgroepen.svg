<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Voedselgroepen in de tekst</title><desc id="desc">De vier voedselgroepen en de gecombineerde kenmerken uit Leviticus 11.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voedselgroepen in de tekst</text><text x="44" y="113" class="ref">Leviticus 11:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Landdieren</text><text x="68" y="241" class="body">Herkauwen én volledig gespleten hoeven:</text><text x="68" y="284" class="body">beide kenmerken samen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waterdieren</text><text x="68" y="433" class="body">Vinnen én schubben: beide kenmerken</text><text x="68" y="476" class="body">samen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vogels</text><text x="68" y="625" class="body">De tekst noemt de uitgesloten</text><text x="68" y="668" class="body">vogelsoorten bij naam.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gevleugelde insecten</text><text x="68" y="817" class="body">De genoemde soorten met springpoten</text><text x="68" y="860" class="body">vormen een uitzondering.</text><text x="46" y="953" class="note">Dit schema volgt de categorieën van het</text><text x="46" y="989" class="note">hoofdstuk.</text></svg>