<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Belijdenis en het verbond</title><desc id="desc">De afsluiting met schuldbelijdenis, verootmoediging en het herinnerde verbond.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Belijdenis en het verbond</text><text x="44" y="113" class="ref">Leviticus 26:40–45</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Belijdenis</text><text x="68" y="241" class="body">Eigen schuld en de schuld van de</text><text x="68" y="284" class="body">voorouders erkennen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verootmoediging</text><text x="68" y="433" class="body">Het koppige hart verootmoedigt zich en</text><text x="68" y="476" class="body">aanvaardt de straf.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het herinnerde verbond</text><text x="68" y="625" class="body">Jakob, Izak en Abraham worden</text><text x="68" y="668" class="body">uitdrukkelijk genoemd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ook in het vijandige land</text><text x="68" y="817" class="body">De HEERE zal hen niet geheel verwerpen</text><text x="68" y="860" class="body">of zijn verbond verbreken.</text><text x="46" y="953" class="note">Dit slot vormt een eigen beweging na de eerdere</text><text x="46" y="989" class="note">waarschuwingen.</text></svg>