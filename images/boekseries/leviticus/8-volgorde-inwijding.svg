<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">De volgorde van de inwijding</title><desc id="desc">Wassen, kleden, zalven, drie offers, de rechter lichaamsdelen, maaltijd en zeven dagen verblijf.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De volgorde van de inwijding</text><text x="44" y="113" class="ref">Leviticus 8:6–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wassen en kleden</text><text x="68" y="241" class="body">Mozes wast Aäron en zijn zonen en trekt</text><text x="68" y="284" class="body">hun de kleding aan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zalven en heiligen</text><text x="68" y="433" class="body">Tent, altaar, wasbekken en Aäron worden</text><text x="68" y="476" class="body">geheiligd.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Drie dieren</text><text x="68" y="625" class="body">Stier voor het zondoffer, eerste ram</text><text x="68" y="668" class="body">als brandoffer, tweede ram voor de</text><text x="68" y="711" class="body">inwijding.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Rechts</text><text x="68" y="860" class="body">Bloed op rechteroorlel, rechterduim en</text><text x="68" y="903" class="body">rechtergrote teen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Maaltijd en zeven dagen</text><text x="68" y="1052" class="body">Priesters eten bij de ingang en blijven</text><text x="68" y="1095" class="body">er zeven dagen en nachten.</text><text x="46" y="1188" class="note">Het schema ordent de inwijdingshandelingen</text><text x="46" y="1224" class="note">zonder slacht- of bloedbeelden.</text></svg>