<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Welke delen voor de priesters?</title><desc id="desc">Priesterlijke delen van zondoffer, schuldoffer, brandoffer, graanoffer en dankoffer volgens Leviticus 7.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Welke delen voor de priesters?</text><text x="44" y="113" class="ref">Leviticus 7:6–10, 30–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zondoffer en schuldoffer</text><text x="68" y="241" class="body">Voor de priester die verzoening doet;</text><text x="68" y="284" class="body">eten op een heilige plaats.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Huid van het brandoffer</text><text x="68" y="433" class="body">Voor de priester die dat offer offert.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bereid graanoffer</text><text x="68" y="582" class="body">Voor de priester die het aanbiedt;</text><text x="68" y="625" class="body">ander graanoffer wordt gelijk onder</text><text x="68" y="668" class="body">Aärons zonen verdeeld.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dankoffer: de borst</text><text x="68" y="817" class="body">Het beweegdeel is voor Aäron en zijn</text><text x="68" y="860" class="body">zonen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Dankoffer: rechterschouder</text><text x="68" y="1009" class="body">Voor de priester die bloed en vet</text><text x="68" y="1052" class="body">aanbiedt.</text><text x="46" y="1145" class="note">De verschillende delen en ontvangers worden</text><text x="46" y="1181" class="note">apart gehouden.</text></svg>