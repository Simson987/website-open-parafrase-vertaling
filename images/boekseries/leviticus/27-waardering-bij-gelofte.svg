<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Bedragen bij een gelofte</title><desc id="desc">De leeftijdsgroepen, bedragen in gram zilver en de draagkrachtuitzondering van Leviticus 27.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bedragen bij een gelofte</text><text x="44" y="113" class="ref">Leviticus 27:2–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Van één maand tot vijf jaar</text><text x="68" y="241" class="body">Jongen: circa 55 gram zilver. Meisje:</text><text x="68" y="284" class="body">circa 33 gram.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Van vijf tot twintig jaar</text><text x="68" y="433" class="body">Mannelijk: circa 220 gram. Vrouwelijk:</text><text x="68" y="476" class="body">circa 110 gram.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Van twintig tot zestig jaar</text><text x="68" y="625" class="body">Man: circa 550 gram. Vrouw: circa 330</text><text x="68" y="668" class="body">gram.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vanaf zestig jaar</text><text x="68" y="817" class="body">Man: circa 165 gram. Vrouw: circa 110</text><text x="68" y="860" class="body">gram.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Bij onvoldoende middelen</text><text x="68" y="1009" class="body">De priester stelt een bedrag vast dat</text><text x="68" y="1052" class="body">de geloftegever kan betalen.</text><text x="46" y="1145" class="note">Bedragen uit de plaatselijke vertaling voor deze</text><text x="46" y="1181" class="note">gelofteregeling; geen waardering van menselijke</text><text x="46" y="1217" class="note">waardigheid.</text></svg>