<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">De jaarlijkse Verzoendag</title><desc id="desc">De hogepriester, verzoeningshandelingen en de datum van de jaarlijkse Verzoendag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De jaarlijkse Verzoendag</text><text x="44" y="113" class="ref">Leviticus 16:3–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De hogepriester</text><text x="68" y="241" class="body">Wast zich en draagt de voorgeschreven</text><text x="68" y="284" class="body">linnen kleding.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerst voor het priesterhuis</text><text x="68" y="433" class="body">Een stier als zondoffer voor Aäron en</text><text x="68" y="476" class="body">zijn huis.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wierook en bloed</text><text x="68" y="625" class="body">De wierookwolk bedekt het</text><text x="68" y="668" class="body">verzoendeksel; daarna volgen de</text><text x="68" y="711" class="body">bloedrituelen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Voor het volk</text><text x="68" y="860" class="body">Verzoening voor heiligdom, tent,</text><text x="68" y="903" class="body">altaar, priesters en gemeenschap.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Vaste dag</text><text x="68" y="1052" class="body">De tiende dag van de zevende maand:</text><text x="68" y="1095" class="body">verootmoediging en volledige rust,</text><text x="68" y="1138" class="body">ieder jaar.</text><text x="46" y="1231" class="note">Het schema ordent de handelingen; de levende bok</text><text x="46" y="1267" class="note">staat in het afzonderlijke schema.</text></svg>