<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Van schoof naar twee broden</title><desc id="desc">De volgorde van eerste schoof, zeven weken, vijftigste dag en twee broden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van schoof naar twee broden</text><text x="44" y="113" class="ref">Leviticus 23:9–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste opbrengst</text><text x="68" y="241" class="body">De priester beweegt de eerste schoof op</text><text x="68" y="284" class="body">de dag na de sabbat.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zeven volle weken</text><text x="68" y="433" class="body">Vanaf die dag zeven weken tellen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De vijftigste dag</text><text x="68" y="582" class="body">Een nieuw graanoffer: twee met desem</text><text x="68" y="625" class="body">gebakken broden.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Bij de oogst</text><text x="68" y="774" class="body">De akkerranden en achtergebleven aren</text><text x="68" y="817" class="body">blijven voor arme en vreemdeling.</text><text x="46" y="910" class="note">Het schema volgt de telling en de daarbij</text><text x="46" y="946" class="note">genoemde zorg voor de naaste.</text></svg>