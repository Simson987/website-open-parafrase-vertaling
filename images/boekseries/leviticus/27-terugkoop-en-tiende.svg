<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1419" viewBox="0 0 840 1419" role="img" aria-labelledby="title desc"><title id="title">Terugkoop en de tiende</title><desc id="desc">De toeslag bij toegestane terugkoop, het verband met het jubeljaar en de tienden van land en kudde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1419" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Terugkoop en de tiende</text><text x="44" y="113" class="ref">Leviticus 27:9–33</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dier en huis</text><text x="68" y="241" class="body">Waar terugkoop is toegestaan: de</text><text x="68" y="284" class="body">vastgestelde waarde plus twintig</text><text x="68" y="327" class="body">procent.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Erfgrond en gekochte grond</text><text x="68" y="476" class="body">Verschillende regelingen; waarde en</text><text x="68" y="519" class="body">bestemming hangen samen met het</text><text x="68" y="562" class="body">jubeljaar.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Wat al toebehoort</text><text x="68" y="711" class="body">Een eerstgeboren offerdier kan niet</text><text x="68" y="754" class="body">nogmaals door een gelofte worden</text><text x="68" y="797" class="body">gewijd.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Opbrengst van het land</text><text x="68" y="946" class="body">Een tiende behoort aan de HEERE; bij</text><text x="68" y="989" class="body">toegestane terugkoop twintig procent</text><text x="68" y="1032" class="body">erbij.</text><rect x="42" y="1090" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1133" class="label">De kudde</text><text x="68" y="1181" class="body">Elk tiende dier onder de staf is</text><text x="68" y="1224" class="body">heilig; niet selecteren of omruilen.</text><text x="46" y="1317" class="note">De regels voor terugkoop zijn niet op alle</text><text x="46" y="1353" class="note">soorten wijding gelijk toepasbaar.</text></svg>