<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Verbond en gevolgen</title><desc id="desc">De opbouw van de verbondsbeloften en opeenvolgende waarschuwingen in Leviticus 26.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verbond en gevolgen</text><text x="44" y="113" class="ref">Leviticus 26:1–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij gehoorzaamheid</text><text x="68" y="241" class="body">Regen, opbrengst, vrede, talrijk worden</text><text x="68" y="284" class="body">en Gods wonen in hun midden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij verwerping</text><text x="68" y="433" class="body">De tekst waarschuwt voor ziekte,</text><text x="68" y="476" class="body">nederlaag en verlies van opbrengst.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij volhardend verzet</text><text x="68" y="625" class="body">De waarschuwingen nemen toe: droogte,</text><text x="68" y="668" class="body">oorlog, verwoesting en verstrooiing.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het verlaten land</text><text x="68" y="817" class="body">Het krijgt de sabbatsrust die het</text><text x="68" y="860" class="body">eerder niet ontving.</text><text x="46" y="953" class="note">De tekst spreekt over beloften en</text><text x="46" y="989" class="note">waarschuwingen, niet over gebeurtenissen die</text><text x="46" y="1025" class="note">hier al plaatsvinden.</text></svg>