<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Priester en hogepriester</title><desc id="desc">De verschillende bepalingen voor priester en hogepriester bij rouw en familie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Priester en hogepriester</text><text x="44" y="113" class="ref">Leviticus 21:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Priester: naaste familie</text><text x="68" y="241" class="body">De tekst noemt uitzonderingen bij</text><text x="68" y="284" class="body">overlijden van ouders, kinderen, broer</text><text x="68" y="327" class="body">en de genoemde ongehuwde zus.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Hogepriester</text><text x="68" y="476" class="body">Ook bij overlijden van vader of moeder</text><text x="68" y="519" class="body">niet bij de dode komen of een</text><text x="68" y="562" class="body">begrafenis volgen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Rouw en heiliging</text><text x="68" y="711" class="body">Kleding, haar, huwelijk en dienst</text><text x="68" y="754" class="body">krijgen afzonderlijke voorschriften.</text><text x="46" y="847" class="note">Dit schema beschrijft de verschillen in deze</text><text x="46" y="883" class="note">historische priesterwet.</text></svg>