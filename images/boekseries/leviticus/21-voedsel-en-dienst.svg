<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Voedsel en altaardienst</title><desc id="desc">Het onderscheid tussen deelname aan het heilige voedsel en de genoemde altaardienst in Leviticus 21.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voedsel en altaardienst</text><text x="44" y="113" class="ref">Leviticus 21:16–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De genoemde beperking</text><text x="68" y="241" class="body">Een nakomeling van Aäron met een</text><text x="68" y="284" class="body">genoemde lichamelijke beperking mag de</text><text x="68" y="327" class="body">offers niet aanbieden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wel het voedsel</text><text x="68" y="476" class="body">Hij mag eten van zowel de</text><text x="68" y="519" class="body">allerheiligste als de heilige gaven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Grens van de dienst</text><text x="68" y="668" class="body">De tekst noemt het voorhangsel en het</text><text x="68" y="711" class="body">altaar afzonderlijk.</text><text x="46" y="804" class="note">Een beschrijving van de tekst; het voedselrecht</text><text x="46" y="840" class="note">blijft uitdrukkelijk zichtbaar.</text></svg>