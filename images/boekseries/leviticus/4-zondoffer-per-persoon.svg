<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Zondoffer: voor wie?</title><desc id="desc">Een overzicht van de verschillende zondoffers voor hogepriester, gemeenschap, leider en gewoon volkslid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zondoffer: voor wie?</text><text x="44" y="113" class="ref">Leviticus 4:3–35</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gezalfde hogepriester</text><text x="68" y="241" class="body">Een jonge stier zonder gebrek.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De hele gemeenschap</text><text x="68" y="390" class="body">Een jonge stier; de oudsten leggen hun</text><text x="68" y="433" class="body">handen op zijn kop.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Een leider</text><text x="68" y="582" class="body">Een jonge bok zonder gebrek.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Een gewoon lid van het volk</text><text x="68" y="731" class="body">Een jonge vrouwelijke geit of een</text><text x="68" y="774" class="body">vrouwelijk lam, zonder gebrek.</text><rect x="42" y="832" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Verschil in het bloedritueel</text><text x="68" y="923" class="body">Bij priester en gemeenschap vóór het</text><text x="68" y="966" class="body">voorhangsel en aan het reukaltaar; bij</text><text x="68" y="1009" class="body">leider en volkslid aan het</text><text x="68" y="1052" class="body">brandofferaltaar.</text><text x="46" y="1145" class="note">Het gaat om de in dit hoofdstuk beschreven</text><text x="46" y="1181" class="note">onbedoelde overtredingen.</text></svg>