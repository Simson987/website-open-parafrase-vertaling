<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Dienstbaarheid en vrijkoop</title><desc id="desc">Ondersteuning, dienstbaarheid, vrijkoop en het onderscheid tussen volksgenoten en buitenlandse slaven in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dienstbaarheid en vrijkoop</text><text x="44" y="113" class="ref">Leviticus 25:35–55</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een verarmde volksgenoot</text><text x="68" y="241" class="body">Ondersteunen zonder rente; niet</text><text x="68" y="284" class="body">hardvochtig behandelen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dienst bij een volksgenoot</text><text x="68" y="433" class="body">Als dagloner behandelen; in het</text><text x="68" y="476" class="body">jubeljaar terug naar familie en bezit.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dienst bij een vreemdeling</text><text x="68" y="625" class="body">Vrĳkoop door familie of zichzelf; het</text><text x="68" y="668" class="body">bedrag hangt af van de resterende</text><text x="68" y="711" class="body">jaren.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Een blijvend onderscheid</text><text x="68" y="860" class="body">Verzen 44–46 staan blijvend slavenbezit</text><text x="68" y="903" class="body">uit andere volken toe; deze regeling is</text><text x="68" y="946" class="body">niet gelijk aan die voor volksgenoten.</text><text x="46" y="1039" class="note">Een beschrijving van de historische wetstekst,</text><text x="46" y="1075" class="note">met het onderscheid tussen de groepen zichtbaar.</text></svg>