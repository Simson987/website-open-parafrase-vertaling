<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">Aantasting van kleding</title><desc id="desc">Onderzoek, wassen, heronderzoek en de verschillende uitkomsten voor aangetaste kleding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aantasting van kleding</text><text x="44" y="113" class="ref">Leviticus 13:47–59</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste onderzoek</text><text x="68" y="241" class="body">De priester bekijkt de aantasting en</text><text x="68" y="284" class="body">sluit het voorwerp zeven dagen op.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Als het zich uitbreidt</text><text x="68" y="433" class="body">Het aangetaste voorwerp wordt verbrand.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Als het niet uitbreidt</text><text x="68" y="582" class="body">Wassen en nog zeven dagen opsluiten;</text><text x="68" y="625" class="body">opnieuw onderzoeken.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Als de plek verdwijnt</text><text x="68" y="774" class="body">Nogmaals wassen; het voorwerp is rein.</text><rect x="42" y="832" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Als de plek terugkomt</text><text x="68" y="923" class="body">Het voorwerp wordt verbrand.</text><text x="46" y="1016" class="note">De tekst onderscheidt kledingonderzoek van het</text><text x="46" y="1052" class="note">onderzoek van mensen.</text></svg>