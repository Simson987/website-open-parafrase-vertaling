<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Lampen en toonbroden</title><desc id="desc">De olie voor de lampen en het aantal, de ordening en vervanging van de toonbroden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lampen en toonbroden</text><text x="44" y="113" class="ref">Leviticus 24:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Licht</text><text x="68" y="241" class="body">Zuivere olijfolie; Aäron verzorgt de</text><text x="68" y="284" class="body">lampen van avond tot ochtend.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twaalf broden</text><text x="68" y="433" class="body">Twee rijen van zes broden op de zuiver</text><text x="68" y="476" class="body">gouden tafel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wierook</text><text x="68" y="625" class="body">Op elke rij zuivere wierook als</text><text x="68" y="668" class="body">gedenkoffer.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Elke sabbat</text><text x="68" y="817" class="body">De broden opnieuw neerleggen; Aäron en</text><text x="68" y="860" class="body">zijn zonen eten ze op een heilige</text><text x="68" y="903" class="body">plaats.</text><text x="46" y="996" class="note">Het ritme van de lampen en het wekelijkse brood</text><text x="46" y="1032" class="note">worden apart genoemd.</text></svg>