<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Verwantschap en grenzen</title><desc id="desc">De in Leviticus 18:6–18 genoemde groepen van naaste familie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verwantschap en grenzen</text><text x="44" y="113" class="ref">Leviticus 18:6–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ouders en kinderen</text><text x="68" y="241" class="body">De tekst sluit de genoemde relaties met</text><text x="68" y="284" class="body">moeder, vaders vrouw en</text><text x="68" y="327" class="body">kleindochter uit.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Broers en zussen</text><text x="68" y="476" class="body">Ook de genoemde zuster en halfzuster</text><text x="68" y="519" class="body">vallen onder de bepalingen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Andere naaste familie</text><text x="68" y="668" class="body">Tantes, ooms vrouw, schoondochter en</text><text x="68" y="711" class="body">broers vrouw worden afzonderlijk</text><text x="68" y="754" class="body">genoemd.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Meerdere generaties</text><text x="68" y="903" class="body">Geen vrouw samen met haar dochter of</text><text x="68" y="946" class="body">kleindochter.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Zusters als rivalen</text><text x="68" y="1095" class="body">Niet ook de zus van de vrouw nemen</text><text x="68" y="1138" class="body">zolang de vrouw leeft.</text><text x="46" y="1231" class="note">Een niet-grafische leeswijzer bij de</text><text x="46" y="1267" class="note">verwantschappen die de tekst opsomt.</text></svg>