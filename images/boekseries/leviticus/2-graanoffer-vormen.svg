<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Vormen van het graanoffer</title><desc id="desc">Ingrediënten, bereidingsvormen, zout, desem, honing en eerste opbrengst bij het graanoffer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vormen van het graanoffer</text><text x="44" y="113" class="ref">Leviticus 2:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Fijn meel</text><text x="68" y="241" class="body">Met olie en wierook; een handvol als</text><text x="68" y="284" class="body">gedenkdeel, de rest voor de priesters.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bereide vormen</text><text x="68" y="433" class="body">Ongezuurd uit oven, bakplaat of</text><text x="68" y="476" class="body">kookpot; met olie.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zout van het verbond</text><text x="68" y="625" class="body">Zout mag bij het graanoffer niet</text><text x="68" y="668" class="body">ontbreken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Desem en honing</text><text x="68" y="817" class="body">Niet als vuuroffer op het altaar; wel</text><text x="68" y="860" class="body">als eerstelingen aangeboden.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Eerste opbrengst</text><text x="68" y="1009" class="body">Geroosterde groene aren en fijngestampt</text><text x="68" y="1052" class="body">graan, met olie en wierook.</text><text x="46" y="1145" class="note">Het gedenkdeel en het priesterdeel worden</text><text x="46" y="1181" class="note">onderscheiden; de bepalingen gaan over deze</text><text x="46" y="1217" class="note">offers.</text></svg>