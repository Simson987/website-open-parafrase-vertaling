<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Twee bokken, twee taken</title><desc id="desc">De loting en de afzonderlijke rollen van de twee bokken op de Verzoendag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee bokken, twee taken</text><text x="44" y="113" class="ref">Leviticus 16:5–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De loting</text><text x="68" y="241" class="body">Eén lot voor de HEERE, één voor de bok</text><text x="68" y="284" class="body">die wordt weggestuurd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De eerste bok</text><text x="68" y="433" class="body">Zondoffer voor het volk; het bloed</text><text x="68" y="476" class="body">wordt voor verzoening gebruikt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De levende bok</text><text x="68" y="625" class="body">Aäron legt beide handen op zijn kop en</text><text x="68" y="668" class="body">belijdt de ongerechtigheden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Naar de woestijn</text><text x="68" y="817" class="body">Een aangewezen man leidt hem weg; de</text><text x="68" y="860" class="body">bok wordt daar vrijgelaten.</text><text x="46" y="953" class="note">De twee bokken en hun verschillende rollen mogen</text><text x="46" y="989" class="note">niet worden verwisseld.</text></svg>