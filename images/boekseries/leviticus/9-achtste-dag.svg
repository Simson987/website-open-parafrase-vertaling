<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De achtste dag</title><desc id="desc">Gebeurtenissen op de achtste dag: offers voor priester en volk, zegen en het vuur op het altaar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De achtste dag</text><text x="44" y="113" class="ref">Leviticus 9:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Na de inwijdingsweek</text><text x="68" y="241" class="body">Mozes roept Aäron, zijn zonen en de</text><text x="68" y="284" class="body">oudsten bijeen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerst Aärons offers</text><text x="68" y="433" class="body">Een kalf als zondoffer en een ram als</text><text x="68" y="476" class="body">brandoffer.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Daarna de offers van het volk</text><text x="68" y="625" class="body">Bok, eenjarig kalf, eenjarig lam, rund</text><text x="68" y="668" class="body">en ram; ook een graanoffer.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zegen</text><text x="68" y="817" class="body">Aäron zegent; daarna komen Mozes en</text><text x="68" y="860" class="body">Aäron uit de tent en zegenen samen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Vuur en antwoord</text><text x="68" y="1009" class="body">Het vuur verteert het offer; het volk</text><text x="68" y="1052" class="body">juicht en valt voorover.</text><text x="46" y="1145" class="note">De volgorde onderscheidt de offers voor Aäron</text><text x="46" y="1181" class="note">van die voor de gemeenschap.</text></svg>