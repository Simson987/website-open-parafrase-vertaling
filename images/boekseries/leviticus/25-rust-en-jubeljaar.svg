<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Rustjaar en jubeljaar</title><desc id="desc">De telling van sabbatsjaren en de afkondiging en betekenis van het jubeljaar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rustjaar en jubeljaar</text><text x="44" y="113" class="ref">Leviticus 25:1–22</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zes werkjaren</text><text x="68" y="241" class="body">Zaaien, snoeien en oogsten.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het zevende jaar</text><text x="68" y="390" class="body">Volledige rust voor het land; wat</text><text x="68" y="433" class="body">vanzelf groeit, dient als voedsel.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Zeven maal zeven</text><text x="68" y="582" class="body">Zeven perioden van zeven jaar vormen 49</text><text x="68" y="625" class="body">jaar.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het vijftigste jaar</text><text x="68" y="774" class="body">Jubeljaar: vrijheid afkondigen en</text><text x="68" y="817" class="body">terugkeer naar familie en familiebezit.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De afkondiging</text><text x="68" y="966" class="body">Ramshoorn op de tiende dag van de</text><text x="68" y="1009" class="body">zevende maand, de Verzoendag.</text><text x="46" y="1102" class="note">De rust van het zevende jaar en het vijftigste</text><text x="46" y="1138" class="note">jaar worden onderscheiden.</text></svg>