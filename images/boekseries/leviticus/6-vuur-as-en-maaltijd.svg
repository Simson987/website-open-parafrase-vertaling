<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Vuur, as en het priesterdeel</title><desc id="desc">Voortdurend vuur, verwijderen van as en het onderscheid tussen eten en volledig verbranden bij verschillende offers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vuur, as en het priesterdeel</text><text x="44" y="113" class="ref">Leviticus 6:9–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vuur op het altaar</text><text x="68" y="241" class="body">Blijft de hele nacht en voortdurend</text><text x="68" y="284" class="body">branden; elke ochtend komt er hout bij.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">As verwijderen</text><text x="68" y="433" class="body">Eerst naast het altaar; na het omkleden</text><text x="68" y="476" class="body">naar een reine plaats buiten het kamp.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gewoon graanoffer</text><text x="68" y="625" class="body">Het gedenkdeel wordt verbrand;</text><text x="68" y="668" class="body">priesters eten het overige ongezuurd op</text><text x="68" y="711" class="body">een heilige plaats.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Graanoffer van de priester</text><text x="68" y="860" class="body">Wordt volledig verbrand; niets wordt</text><text x="68" y="903" class="body">gegeten.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Zondoffer met bloed binnen</text><text x="68" y="1052" class="body">Als het bloed voor verzoening in de</text><text x="68" y="1095" class="body">tent is gebracht, wordt het offer niet</text><text x="68" y="1138" class="body">gegeten.</text><text x="46" y="1231" class="note">De uitzonderingen voorkomen dat verschillende</text><text x="46" y="1267" class="note">priestermaaltijden met elkaar worden verward.</text></svg>