<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">De eerste vijf boomjaren</title><desc id="desc">Tijdlijn van de eerste drie jaren, het vierde jaar en het vijfde jaar van een fruitboom.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eerste vijf boomjaren</text><text x="44" y="113" class="ref">Leviticus 19:23–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jaar 1, 2 en 3</text><text x="68" y="241" class="body">Van de vruchten van pas geplante</text><text x="68" y="284" class="body">fruitbomen niet eten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jaar 4</text><text x="68" y="433" class="body">Alle vruchten zijn heilig: een lofgave</text><text x="68" y="476" class="body">aan de HEERE.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vanaf jaar 5</text><text x="68" y="625" class="body">De vruchten mogen worden gegeten.</text><text x="46" y="718" class="note">Dit voorschrift betreft het planten van</text><text x="46" y="754" class="note">fruitbomen na de intocht in het land.</text></svg>