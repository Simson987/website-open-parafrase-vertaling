<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Leeswijzer bij hoofdstuk 20</title><desc id="desc">De opbouw van Leviticus 20 met verwijzingen naar de verschillende tekstgedeelten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leeswijzer bij hoofdstuk 20</text><text x="44" y="113" class="ref">Leviticus 20:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verzen 1–8</text><text x="68" y="241" class="body">Molech, raadplegen van geesten en de</text><text x="68" y="284" class="body">oproep tot heiliging.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verzen 9–21</text><text x="68" y="433" class="body">De tekst noemt familierelaties,</text><text x="68" y="476" class="body">seksuele overtredingen en verschillende</text><text x="68" y="519" class="body">straffen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verzen 22–26</text><text x="68" y="668" class="body">Verband tussen het land,</text><text x="68" y="711" class="body">gehoorzaamheid, heiligheid en rein of</text><text x="68" y="754" class="body">onrein.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Vers 27</text><text x="68" y="903" class="body">Afsluitende bepaling over het oproepen</text><text x="68" y="946" class="body">van doden en geesten.</text><text x="46" y="1039" class="note">Een beschrijving van historische religieuze</text><text x="46" y="1075" class="note">wetstekst; straffen worden niet afgebeeld.</text></svg>