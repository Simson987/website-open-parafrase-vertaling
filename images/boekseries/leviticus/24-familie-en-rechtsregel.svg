<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Familie en rechtsregel</title><desc id="desc">De afstamming van de genoemde man en het verband met één wet voor inwoner en vreemdeling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familie en rechtsregel</text><text x="44" y="113" class="ref">Leviticus 24:10–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De moeder</text><text x="68" y="241" class="body">Selomith, dochter van Dibri, uit de</text><text x="68" y="284" class="body">stam Dan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vader</text><text x="68" y="433" class="body">Een Egyptische man; zijn naam wordt</text><text x="68" y="476" class="body">hier niet genoemd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De gebeurtenis</text><text x="68" y="625" class="body">Hun zoon lastert de naam en wordt</text><text x="68" y="668" class="body">vastgehouden tot er een uitspraak komt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De rechtsregel</text><text x="68" y="817" class="body">De tekst noemt dezelfde wet voor</text><text x="68" y="860" class="body">vreemdeling en geboren Israëliet.</text><text x="46" y="953" class="note">De afstamming wordt exact benoemd; de</text><text x="46" y="989" class="note">terechtstelling wordt niet afgebeeld.</text></svg>