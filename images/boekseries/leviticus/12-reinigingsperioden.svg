<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De genoemde perioden</title><desc id="desc">Tijdlijn met de afzonderlijke perioden na de geboorte en de twee offermogelijkheden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde perioden</text><text x="44" y="113" class="ref">Leviticus 12:2–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Na de geboorte van een zoon</text><text x="68" y="241" class="body">Zeven dagen; op de achtste dag de</text><text x="68" y="284" class="body">besnijdenis; daarna nog 33 dagen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Na de geboorte van een dochter</text><text x="68" y="433" class="body">Veertien dagen; daarna nog 66 dagen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Na de periode</text><text x="68" y="582" class="body">Een eenjarig lam en een tortelduif of</text><text x="68" y="625" class="body">jonge duif.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Naar draagkracht</text><text x="68" y="774" class="body">Wie geen lam kan betalen, brengt twee</text><text x="68" y="817" class="body">tortelduiven of twee jonge duiven.</text><text x="46" y="910" class="note">Rituele reinigingsperioden uit de tekst; 7 + 33</text><text x="46" y="946" class="note">= 40 en 14 + 66 = 80 dagen.</text></svg>