<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">De vaste feestdagen</title><desc id="desc">Overzicht van de wekelijkse sabbat en de vaste feestdagen in de eerste en zevende maand.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vaste feestdagen</text><text x="44" y="113" class="ref">Leviticus 23:3–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Elke zevende dag</text><text x="68" y="241" class="body">Sabbat: volledige rust en een heilige</text><text x="68" y="284" class="body">bijeenkomst.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste maand</text><text x="68" y="433" class="body">Dag 14 tegen de avond: pascha. Vanaf</text><text x="68" y="476" class="body">dag 15: zeven dagen ongezuurde broden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Na de eerste schoof</text><text x="68" y="625" class="body">Zeven volle weken tellen; op de</text><text x="68" y="668" class="body">vijftigste dag een nieuw graanoffer.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zevende maand</text><text x="68" y="817" class="body">Dag 1: trompetgeschal. Dag 10:</text><text x="68" y="860" class="body">Verzoendag. Vanaf dag 15:</text><text x="68" y="903" class="body">loofhuttenfeest.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Loofhuttenfeest</text><text x="68" y="1052" class="body">Zeven dagen feest; de achtste dag is</text><text x="68" y="1095" class="body">een plechtige slot- en rustdag.</text><text x="46" y="1188" class="note">De maandnummers volgen de tekst; moderne</text><text x="46" y="1224" class="note">kalenderdatums worden niet ingevuld.</text></svg>