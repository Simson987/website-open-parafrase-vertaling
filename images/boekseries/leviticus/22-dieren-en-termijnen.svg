<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Offerdieren en termijnen</title><desc id="desc">De voorwaarden voor offerdieren, de eerste zeven dagen en de termijn van het lofoffer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Offerdieren en termijnen</text><text x="44" y="113" class="ref">Leviticus 22:17–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Brandoffer en gelofte</text><text x="68" y="241" class="body">De genoemde dieren moeten zonder gebrek</text><text x="68" y="284" class="body">zijn.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vrijwillig offer</text><text x="68" y="433" class="body">Vers 23 noemt een beperkte uitzondering</text><text x="68" y="476" class="body">bij een te lang of te kort</text><text x="68" y="519" class="body">lichaamsdeel.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Moeder en jong</text><text x="68" y="668" class="body">Het jong blijft zeven dagen bij de</text><text x="68" y="711" class="body">moeder; vanaf dag acht aanvaard. Niet</text><text x="68" y="754" class="body">beide op dezelfde dag slachten.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Lofoffer</text><text x="68" y="903" class="body">Op dezelfde dag eten; niets bewaren tot</text><text x="68" y="946" class="body">de morgen.</text><text x="46" y="1039" class="note">Het schema houdt de uitzondering en de</text><text x="46" y="1075" class="note">verschillende termijnen uit elkaar.</text></svg>