<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Onderzoek en heronderzoek</title><desc id="desc">De opeenvolgende onderzoeken bij een onduidelijke huidaantasting in Leviticus 13:2–8.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onderzoek en heronderzoek</text><text x="44" y="113" class="ref">Leviticus 13:2–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Naar de priester</text><text x="68" y="241" class="body">Bij een zwelling, uitslag of lichte</text><text x="68" y="284" class="body">plek.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij een onduidelijk geval</text><text x="68" y="433" class="body">Zeven dagen afzonderen; de priester</text><text x="68" y="476" class="body">onderzoekt opnieuw.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nog niet uitgebreid</text><text x="68" y="625" class="body">Nog zeven dagen afzonderen en opnieuw</text><text x="68" y="668" class="body">onderzoeken.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Verbleekt en niet uitgebreid</text><text x="68" y="817" class="body">Rein verklaren en kleding wassen; bij</text><text x="68" y="860" class="body">latere uitbreiding terug naar de</text><text x="68" y="903" class="body">priester.</text><text x="46" y="996" class="note">Dit ordent alleen verzen 2–8; het is geen</text><text x="46" y="1032" class="note">volledige of moderne medische diagnose.</text></svg>