<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Zorg voor de naaste</title><desc id="desc">Sociale bepalingen over oogst, loon, kwetsbaren, rechtspraak, vreemdelingen en eerlijke maten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zorg voor de naaste</text><text x="44" y="113" class="ref">Leviticus 19:9–18, 33–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Armen en vreemdelingen</text><text x="68" y="241" class="body">Akkerranden en achtergebleven oogst</text><text x="68" y="284" class="body">voor hen laten liggen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Loon en kwetsbaarheid</text><text x="68" y="433" class="body">Loon niet tot de morgen achterhouden;</text><text x="68" y="476" class="body">een dove of blinde niet benadelen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Rechtspraak</text><text x="68" y="625" class="body">Geen partij kiezen voor arm of rijk;</text><text x="68" y="668" class="body">eerlijk oordelen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Onderlinge omgang</text><text x="68" y="817" class="body">Geen wrok of wraak; de naaste</text><text x="68" y="860" class="body">liefhebben.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De vreemdeling</text><text x="68" y="1009" class="body">Hem liefhebben als jezelf; eerlijk</text><text x="68" y="1052" class="body">wegen en meten.</text><text x="46" y="1145" class="note">De afzonderlijke voorbeelden geven inhoud aan</text><text x="46" y="1181" class="note">het gebod van naastenliefde.</text></svg>