<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Drie voorstellen, drie antwoorden</title><desc id="desc">Drie voorstellen, drie antwoorden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie voorstellen, drie antwoorden</text><text x="44" y="113" class="ref">Mattheüs 4:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Stenen naar brood · 3–4</text><text x="68" y="241" class="body">Niet alleen brood, maar elk woord uit</text><text x="68" y="284" class="body">Gods mond.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Van tempel springen · 5–7</text><text x="68" y="433" class="body">De Heere je God niet op de proef</text><text x="68" y="476" class="body">stellen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Koninkrijken voor aanbidding · 8–10</text><text x="68" y="625" class="body">Hem aanbidden en Hem alleen dienen.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De afloop · 11</text><text x="68" y="774" class="body">Duivel gaat weg, engelen dienen.</text><text x="46" y="867" class="note">De antwoorden worden naast de voorstellen gezet;</text><text x="46" y="903" class="note">er wordt geen sprong of broodwonder als</text><text x="46" y="939" class="note">uitgevoerd afgebeeld.</text></svg>