<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wie ontmoet Jezus?</title><desc id="desc">Wie ontmoet Jezus? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie ontmoet Jezus?</text><text x="44" y="113" class="ref">Mattheüs 8:1–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Man met melaatsheid · 2–4</text><text x="68" y="241" class="body">Aanraken, gereinigd, priester en</text><text x="68" y="284" class="body">voorgeschreven offer.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hoofdman · 5–13</text><text x="68" y="433" class="body">Knecht thuis; gezag/woord en geloof;</text><text x="68" y="476" class="body">knecht op hetzelfde moment gezond.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Petrus’ schoonmoeder · 14–17</text><text x="68" y="625" class="body">Hand aanraken, koorts weg en dienen;</text><text x="68" y="668" class="body">velen in avond.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Leerlingen en twee mannen · 18–34</text><text x="68" y="817" class="body">Volgen, storm stil; twee bezetenen,</text><text x="68" y="860" class="body">kudde en vertrekverzoek.</text><text x="46" y="953" class="note">Twee mannen volgens Mattheüs; geen details uit</text><text x="46" y="989" class="note">andere evangeliën toegevoegd.</text></svg>