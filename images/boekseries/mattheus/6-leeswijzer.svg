<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Leven voor de Vader</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leven voor de Vader</text><text x="44" y="113" class="ref">Mattheüs 6:1–34</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verborgen doen · 1–18</text><text x="68" y="241" class="body">Geven, binnenkamer en bidden, Onze</text><text x="68" y="284" class="body">Vader, vergeven en verzorgd vasten;</text><text x="68" y="327" class="body">geen vertoon.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Schat en dienst · 19–24</text><text x="68" y="476" class="body">Mot/roest/dieven, hart bij schat, oog</text><text x="68" y="519" class="body">als lamp, niet tegelijk God en rijkdom</text><text x="68" y="562" class="body">dienen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Zorg en prioriteit · 25–34</text><text x="68" y="711" class="body">Voedsel/kleding, vogels en lelies,</text><text x="68" y="754" class="body">Vader weet het; eerst koninkrijk/recht,</text><text x="68" y="797" class="body">dag voor dag.</text><text x="46" y="890" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="926" class="note">volgen de plaatselijke versindeling.</text></svg>