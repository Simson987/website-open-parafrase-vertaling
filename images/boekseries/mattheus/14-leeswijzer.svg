<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1121" viewBox="0 0 840 1121" role="img" aria-labelledby="title desc"><title id="title">Verdriet, ontferming en vertrouwen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1121" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verdriet, ontferming en vertrouwen</text><text x="44" y="113" class="ref">Mattheüs 14:1–36</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Johannes · 1–12</text><text x="68" y="241" class="body">Herodes’ gedachte over Jezus; terugblik</text><text x="68" y="284" class="body">gevangenis, Herodias/dochter en eed,</text><text x="68" y="327" class="body">dood; leerlingen begraven en berichten</text><text x="68" y="370" class="body">Jezus.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De maaltijd · 13–21</text><text x="68" y="519" class="body">Afzondering per schip, menigte te voet,</text><text x="68" y="562" class="body">ontferming/genezing; vijf broden/twee</text><text x="68" y="605" class="body">vissen, zegen/uitdelen en twaalf manden</text><text x="68" y="648" class="body">over.</text><rect x="42" y="706" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Meer en overkant · 22–36</text><text x="68" y="797" class="body">Leerlingen varen, Jezus alleen bidden,</text><text x="68" y="840" class="body">wind en waterlopen; Petrus</text><text x="68" y="883" class="body">vreest/roept/gegrepen, wind stil en</text><text x="68" y="926" class="body">belijdenis; Gennesaret/zoom.</text><text x="46" y="1019" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="1055" class="note">volgen de plaatselijke versindeling.</text></svg>