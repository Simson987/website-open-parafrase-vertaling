<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1227" viewBox="0 0 840 1227" role="img" aria-labelledby="title desc"><title id="title">De volgende wee-uitspraken</title><desc id="desc">De volgende wee-uitspraken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1227" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De volgende wee-uitspraken</text><text x="44" y="113" class="ref">Mattheüs 23:23–36</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tienden · 23–24</text><text x="68" y="241" class="body">Munt/dille/komijn maar</text><text x="68" y="284" class="body">recht/barmhartigheid/trouw vergeten;</text><text x="68" y="327" class="body">mug/kameel.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Beker · 25–26</text><text x="68" y="476" class="body">Buiten schoon, binnen</text><text x="68" y="519" class="body">roof/mateloosheid; eerst binnen</text><text x="68" y="562" class="body">reinigen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Graven · 27–28</text><text x="68" y="711" class="body">Buiten mooi, binnen onrein;</text><text x="68" y="754" class="body">rechtvaardig lijken maar</text><text x="68" y="797" class="body">huichelarij/wetteloosheid.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Profeten · 29–36</text><text x="68" y="946" class="body">Graven versieren, voorouders</text><text x="68" y="989" class="body">veroordelen; eigen vervolging, Abel tot</text><text x="68" y="1032" class="body">Zacharia zoon Barachia.</text><text x="46" y="1125" class="note">Kritiek betreft het beschreven gedrag; geen</text><text x="46" y="1161" class="note">karikatuur van een hedendaagse geloofsgroep.</text></svg>