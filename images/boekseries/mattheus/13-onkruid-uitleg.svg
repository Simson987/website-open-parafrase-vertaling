<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De gegeven uitleg van de akker</title><desc id="desc">De gegeven uitleg van de akker met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gegeven uitleg van de akker</text><text x="44" y="113" class="ref">Mattheüs 13:24–30,37–43</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zaaier en akker</text><text x="68" y="241" class="body">Mensenzoon en wereld.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Goed zaad en onkruid</text><text x="68" y="390" class="body">Mensen koninkrijk en mensen van de</text><text x="68" y="433" class="body">boze.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vijand en oogst</text><text x="68" y="582" class="body">Duivel en einde van de wereld.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Maaiers en afloop</text><text x="68" y="731" class="body">Engelen, scheiding/oordeel en</text><text x="68" y="774" class="body">rechtvaardigen stralen als zon.</text><text x="46" y="867" class="note">Dit schema bewaart Jezus’ eigen duiding; er</text><text x="46" y="903" class="note">worden geen mensen met plantenlichamen getekend.</text></svg>