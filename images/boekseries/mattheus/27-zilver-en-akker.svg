<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">De zilverstukken en de akker</title><desc id="desc">De zilverstukken en de akker met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De zilverstukken en de akker</text><text x="44" y="113" class="ref">Mattheüs 27:3–10</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Teruggebracht · 3–5</text><text x="68" y="241" class="body">Dertig zilverstukken, onschuldig bloed</text><text x="68" y="284" class="body">erkend, tempel ingeworpen; Judas</text><text x="68" y="327" class="body">vertrekt.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Besluit · 6–8</text><text x="68" y="476" class="body">Niet in offerkist wegens bloedgeld;</text><text x="68" y="519" class="body">pottenbakkersakker als</text><text x="68" y="562" class="body">vreemdelingenbegraafplaats.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Profetenwoord · 9–10</text><text x="68" y="711" class="body">Dertig zilverstukken en akker;</text><text x="68" y="754" class="body">plaatselijke tekst noemt Jeremia.</text><text x="46" y="847" class="note">Zelfdoding wordt in hoofdstukoverzicht benoemd;</text><text x="46" y="883" class="note">geen methode of uitvoering geïllustreerd.</text></svg>