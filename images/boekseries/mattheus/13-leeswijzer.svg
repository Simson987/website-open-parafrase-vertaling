<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Gelijkenissen en het verstaan</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gelijkenissen en het verstaan</text><text x="44" y="113" class="ref">Mattheüs 13:1–58</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Meer en zaad · 1–23</text><text x="68" y="241" class="body">Boot en oever, zaaier/vier gronden;</text><text x="68" y="284" class="body">waarom gelijkenissen, Jesaja en geluk</text><text x="68" y="327" class="body">zien/horen; uitleg vruchten.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Groei en uitleg · 24–43</text><text x="68" y="476" class="body">Tarwe/onkruid, mosterd en zuurdesem;</text><text x="68" y="519" class="body">thuis vragen leerlingen uitleg van</text><text x="68" y="562" class="body">onkruid, einde en rechtvaardigen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Waarde en scheiding · 44–52</text><text x="68" y="711" class="body">Schat, parel, net; begrepen?</text><text x="68" y="754" class="body">Schriftgeleerde als huiseigenaar met</text><text x="68" y="797" class="body">nieuw/oud.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Vaderstad · 53–58</text><text x="68" y="946" class="body">Synagoge, verbazing, familie genoemd,</text><text x="68" y="989" class="body">aanstoot en ongeloof; weinig wonderen.</text><text x="46" y="1082" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="1118" class="note">volgen de plaatselijke versindeling.</text></svg>