<svg xmlns="http://www.w3.org/2000/svg" width="840" height="628" viewBox="0 0 840 628" role="img" aria-labelledby="title desc"><title id="title">Twee fundamenten vergeleken</title><desc id="desc">Twee fundamenten vergeleken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="628" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee fundamenten vergeleken</text><text x="44" y="113" class="ref">Mattheüs 7:24–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Horen en handelen</text><text x="68" y="241" class="body">Huis op rotsgrond; stortregen, water en</text><text x="68" y="284" class="body">wind; blijft staan.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Horen zonder handelen</text><text x="68" y="433" class="body">Huis op zand; dezelfde storm; stort in.</text><text x="46" y="526" class="note">Het onderscheid is handelen naar Jezus’ woorden,</text><text x="46" y="562" class="note">niet twee verschillende stormen.</text></svg>