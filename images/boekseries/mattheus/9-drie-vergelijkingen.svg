<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Bruidegom, stof en wijnzakken</title><desc id="desc">Bruidegom, stof en wijnzakken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bruidegom, stof en wijnzakken</text><text x="44" y="113" class="ref">Mattheüs 9:14–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bruidegom · 15</text><text x="68" y="241" class="body">Gasten treuren niet zolang hij bij hen</text><text x="68" y="284" class="body">is; na wegnemen vasten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Lap · 16</text><text x="68" y="433" class="body">Nieuwe ongekrompen stof op oud kleed</text><text x="68" y="476" class="body">trekt scheur groter.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nieuwe wijn · 17</text><text x="68" y="625" class="body">Oude zakken barsten; nieuwe wijn in</text><text x="68" y="668" class="body">nieuwe zakken bewaart beide.</text><text x="46" y="761" class="note">Drie antwoorden bij de vastenvraag; geen extra</text><text x="46" y="797" class="note">historische bruiloft geclaimd.</text></svg>