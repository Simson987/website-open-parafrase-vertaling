<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Beproeving, roeping en dienst</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beproeving, roeping en dienst</text><text x="44" y="113" class="ref">Mattheüs 4:1–25</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De beproeving · 1–11</text><text x="68" y="241" class="body">Veertig dagen/nachten, stenen/brood,</text><text x="68" y="284" class="body">tempelhoogte en koninkrijken; drie</text><text x="68" y="327" class="body">Schriftantwoorden, verleider weg en</text><text x="68" y="370" class="body">engelen dienen.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Galilea · 12–17</text><text x="68" y="519" class="body">Johannes gevangen, Nazareth/Kapernaüm,</text><text x="68" y="562" class="body">Zebulon/Naftali en licht; bekering,</text><text x="68" y="605" class="body">koninkrijk dichtbij.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De roeping en dienst · 18–25</text><text x="68" y="754" class="body">Simon/Petrus en Andreas,</text><text x="68" y="797" class="body">Jakobus/Johannes met Zebedeüs; volgen,</text><text x="68" y="840" class="body">onderwijzen, verkondigen, genezen en</text><text x="68" y="883" class="body">vele streken.</text><text x="46" y="976" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="1012" class="note">volgen de plaatselijke versindeling.</text></svg>