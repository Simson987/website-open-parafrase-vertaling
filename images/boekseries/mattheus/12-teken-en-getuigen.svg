<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Teken en getuigen</title><desc id="desc">Teken en getuigen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Teken en getuigen</text><text x="44" y="113" class="ref">Mattheüs 12:38–42</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 38–39</text><text x="68" y="241" class="body">Schriftgeleerden/Farizeeën willen</text><text x="68" y="284" class="body">teken; teken Jona aangekondigd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jona · 40</text><text x="68" y="433" class="body">Drie dagen/nachten in grote vis;</text><text x="68" y="476" class="body">Mensenzoon in hart van aarde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ninevé · 41</text><text x="68" y="625" class="body">Bekeerd bij Jona’s prediking; hier meer</text><text x="68" y="668" class="body">dan Jona.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Koningin zuiden · 42</text><text x="68" y="817" class="body">Ver gereisd voor Salomo’s wijsheid;</text><text x="68" y="860" class="body">hier meer dan Salomo.</text><text x="46" y="953" class="note">Grote vis volgens deze tekst; geen walvissoort</text><text x="46" y="989" class="note">of ander detail ingevuld.</text></svg>