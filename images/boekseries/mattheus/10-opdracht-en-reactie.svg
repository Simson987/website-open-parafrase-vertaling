<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Opdracht en reactie</title><desc id="desc">Opdracht en reactie met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opdracht en reactie</text><text x="44" y="113" class="ref">Mattheüs 10:5–23,40–42</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bestemming · 5–8</text><text x="68" y="241" class="body">Nu verloren schapen Israël, koninkrijk</text><text x="68" y="284" class="body">dichtbij; genezen en gratis geven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ontvangst · 9–14</text><text x="68" y="433" class="body">Zonder voorraad, geschikte gastheer</text><text x="68" y="476" class="body">zoeken, begroeten; blijven of stof</text><text x="68" y="519" class="body">afschudden.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vervolging · 16–23</text><text x="68" y="668" class="body">Wijs/oprecht, getuigen, Geest geeft</text><text x="68" y="711" class="body">woorden; volhouden en naar volgende</text><text x="68" y="754" class="body">stad.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Ontvangen · 40–42</text><text x="68" y="903" class="body">Hen ontvangen is Hem ontvangen;</text><text x="68" y="946" class="body">profeet/rechtvaardige, zelfs beker koud</text><text x="68" y="989" class="body">water.</text><text x="46" y="1082" class="note">Opdracht en waarschuwing onderscheiden van</text><text x="46" y="1118" class="note">gebeurtenissen die hier al zouden zijn</text><text x="46" y="1154" class="note">uitgevoerd.</text></svg>