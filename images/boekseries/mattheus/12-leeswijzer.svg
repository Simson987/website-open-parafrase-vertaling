<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Barmhartigheid en woorden</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Barmhartigheid en woorden</text><text x="44" y="113" class="ref">Mattheüs 12:1–50</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De sabbat · 1–14</text><text x="68" y="241" class="body">Aren/honger, David/toonbrood en</text><text x="68" y="284" class="body">priesters, barmhartigheid; hand</text><text x="68" y="327" class="body">genezen, schaapvergelijking, vijandig</text><text x="68" y="370" class="body">overleg.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Dienaar en reactie · 15–32</text><text x="68" y="519" class="body">Terugtrekken, genezen, Jesajawoord;</text><text x="68" y="562" class="body">blind/niet-sprekend genezen,</text><text x="68" y="605" class="body">Beëlzebulbeschuldiging, verdeeld rijk</text><text x="68" y="648" class="body">en Geest.</text><rect x="42" y="706" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Vrucht, teken en familie · 33–50</text><text x="68" y="797" class="body">Mond/hart/woorden, Jona en koningin</text><text x="68" y="840" class="body">zuiden; leeg huis/zeven geesten;</text><text x="68" y="883" class="body">moeder/broers buiten, Vaderwil doen.</text><text x="46" y="976" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="1012" class="note">volgen de plaatselijke versindeling.</text></svg>