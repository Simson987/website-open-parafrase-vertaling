<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">Zes concrete vormen van zorg</title><desc id="desc">Zes concrete vormen van zorg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes concrete vormen van zorg</text><text x="44" y="113" class="ref">Mattheüs 25:35–45</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Honger en dorst</text><text x="68" y="241" class="body">Voedsel geven en drinken geven.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vreemdeling en kleding</text><text x="68" y="390" class="body">Gastvrij ontvangen en kleden.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Ziekte en gevangenis</text><text x="68" y="539" class="body">Bezoeken en naar iemand toekomen.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">De minsten</text><text x="68" y="688" class="body">Wel of niet voor hen gedaan, voor de</text><text x="68" y="731" class="body">Koning gedaan.</text><text x="46" y="824" class="note">Menselijke zorg wordt respectvol verbeeld;</text><text x="46" y="860" class="note">mensen zonder kleding blijven in illustraties</text><text x="46" y="896" class="note">bedekt.</text></svg>