<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De familie die de stad noemt</title><desc id="desc">De familie die de stad noemt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De familie die de stad noemt</text><text x="44" y="113" class="ref">Mattheüs 13:54–58</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beroep en moeder</text><text x="68" y="241" class="body">Zoon van de timmerman; moeder Maria.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vier broers</text><text x="68" y="390" class="body">Jakobus, Joses, Simon en Judas.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Zussen</text><text x="68" y="539" class="body">Meervoud, zonder namen of aantal in</text><text x="68" y="582" class="body">deze tekst.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Reactie</text><text x="68" y="731" class="body">Waar wijsheid/krachten vandaan?</text><text x="68" y="774" class="body">Aanstoot; profeet in vaderstad en eigen</text><text x="68" y="817" class="body">huis.</text><text x="46" y="910" class="note">Geen zussennamen of aantallen ingevuld; dit</text><text x="46" y="946" class="note">volgt de woorden van de stadsbewoners.</text></svg>