<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Waarschuwingen en de twee dopen</title><desc id="desc">Waarschuwingen en de twee dopen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarschuwingen en de twee dopen</text><text x="44" y="113" class="ref">Mattheüs 3:7–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vrucht en boom · 7–10</text><text x="68" y="241" class="body">Echte inkeer zichtbaar, Abraham als</text><text x="68" y="284" class="body">afstamming geen vrijbrief; bijl/wortel</text><text x="68" y="327" class="body">en goede vrucht.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Johannes · 11</text><text x="68" y="476" class="body">Water als teken van bekering; komende</text><text x="68" y="519" class="body">Machtigere, sandalen niet waard.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De Komende · 11–12</text><text x="68" y="668" class="body">Heilige Geest en vuur; wan, tarwe</text><text x="68" y="711" class="body">bewaren, kaf verbranden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Jezus’ doop · 13–17</text><text x="68" y="860" class="body">Alles doen wat recht is, Geest als duif</text><text x="68" y="903" class="body">en geliefde Zoon genoemd.</text><text x="46" y="996" class="note">Beeldspraak is onderwijs; het is geen lijst van</text><text x="46" y="1032" class="note">vier extra gebeurtenissen op de doopdag.</text></svg>