<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Intocht, tempel en antwoord</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Intocht, tempel en antwoord</text><text x="44" y="113" class="ref">Mattheüs 21:1–46</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Intocht en tempel · 1–17</text><text x="68" y="241" class="body">Bethfagé, twee</text><text x="68" y="284" class="body">leerlingen/ezelin/veulen,</text><text x="68" y="327" class="body">mantels/takken/Hosanna, handel weg,</text><text x="68" y="370" class="body">gebed/genezing/kinderlof, Bethanië.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Boom en gezag · 18–27</text><text x="68" y="519" class="body">Vijgenboom verdort, geloof/bidden;</text><text x="68" y="562" class="body">gezagsvraag en tegenvraag over</text><text x="68" y="605" class="body">Johannes, leiders weten niet.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Twee zonen en pachters · 28–46</text><text x="68" y="754" class="body">Eerst nee/dan doen, ja/niet doen;</text><text x="68" y="797" class="body">ingerichte wijngaard, dienaren/zoon en</text><text x="68" y="840" class="body">oordeel; afgekeurde steen, vrucht en</text><text x="68" y="883" class="body">tegenstand.</text><text x="46" y="976" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1012" class="note">de plaatselijke versindeling.</text></svg>