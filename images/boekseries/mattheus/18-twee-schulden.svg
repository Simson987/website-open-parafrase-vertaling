<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Twee schulden, twee reacties</title><desc id="desc">Twee schulden, twee reacties met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee schulden, twee reacties</text><text x="44" y="113" class="ref">Mattheüs 18:21–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 21–22</text><text x="68" y="241" class="body">Niet zeven keer maar zeventig maal</text><text x="68" y="284" class="body">zeven vergeven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste dienaar · 24–27</text><text x="68" y="433" class="body">Tienduizend talenten, onbetaalbaar;</text><text x="68" y="476" class="body">koning krijgt medelijden en scheldt</text><text x="68" y="519" class="body">kwijt.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Mededienaar · 28–30</text><text x="68" y="668" class="body">Honderd penningen; smeekt hetzelfde,</text><text x="68" y="711" class="body">toch gevangen gezet.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De toepassing · 31–35</text><text x="68" y="860" class="body">Andere dienaren berichten, koning</text><text x="68" y="903" class="body">spreekt aan; van harte vergeven.</text><text x="46" y="996" class="note">Talenten en penningen zijn verschillende</text><text x="46" y="1032" class="note">eenheden. Geen oncontroleerbare euro-omrekening</text><text x="46" y="1068" class="note">of martelscène.</text></svg>