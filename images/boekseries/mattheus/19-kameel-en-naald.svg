<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Kameel, naald en mogelijkheid</title><desc id="desc">Kameel, naald en mogelijkheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kameel, naald en mogelijkheid</text><text x="44" y="113" class="ref">Mattheüs 19:23–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vergelijking · 23–24</text><text x="68" y="241" class="body">Rijke het koninkrijk binnen: moeilijker</text><text x="68" y="284" class="body">dan kameel door oog van naald.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De schrik · 25–26</text><text x="68" y="433" class="body">Wie gered? Voor mensen onmogelijk, voor</text><text x="68" y="476" class="body">God alles mogelijk.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het volgen · 27–30</text><text x="68" y="625" class="body">Alles verlaten, twaalf tronen/twaalf</text><text x="68" y="668" class="body">stammen, honderdvoud en eeuwig leven;</text><text x="68" y="711" class="body">eersten/laatsten.</text><text x="46" y="804" class="note">De tekst noemt een naaldoog, geen stadspoort met</text><text x="46" y="840" class="note">die naam. Het beeld wordt niet tot een zogenaamd</text><text x="46" y="876" class="note">makkelijke doorgang verkleind.</text></svg>