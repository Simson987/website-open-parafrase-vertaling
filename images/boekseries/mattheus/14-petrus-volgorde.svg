<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Petrus: de volgorde</title><desc id="desc">Petrus: de volgorde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Petrus: de volgorde</text><text x="44" y="113" class="ref">Mattheüs 14:28–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vraag en antwoord · 28–29</text><text x="68" y="241" class="body">Als U het bent, geef opdracht; Kom. Uit</text><text x="68" y="284" class="body">boot en over water.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Angst en roep · 30</text><text x="68" y="433" class="body">Ziet sterke wind, bang, begint te</text><text x="68" y="476" class="body">zinken; Heere, red mij.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Greep en vraag · 31</text><text x="68" y="625" class="body">Jezus grijpt meteen; kleingeloof en</text><text x="68" y="668" class="body">twijfel aangesproken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">In het schip · 32–33</text><text x="68" y="817" class="body">Wind gaat liggen; aanbidding en Gods</text><text x="68" y="860" class="body">Zoon beleden.</text><text x="46" y="953" class="note">De reddingsgreep volgt op de roep; de wind ligt</text><text x="46" y="989" class="note">pas stil wanneer zij in de boot zijn.</text></svg>