<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Gereed, trouw en barmhartig</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gereed, trouw en barmhartig</text><text x="44" y="113" class="ref">Mattheüs 25:1–46</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tien vrouwen · 1–13</text><text x="68" y="241" class="body">Vijf wijs/vijf dwaas, lampen en</text><text x="68" y="284" class="body">reserveolie, wachten/slaap,</text><text x="68" y="327" class="body">middernachtroep, deur gesloten;</text><text x="68" y="370" class="body">waakzaam.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Toevertrouwd bezit · 14–30</text><text x="68" y="519" class="body">Vijf/twee/één naar vermogen; handelen</text><text x="68" y="562" class="body">of begraven, afrekening, trouw beloond</text><text x="68" y="605" class="body">en nalaten veroordeeld.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De volken · 31–46</text><text x="68" y="754" class="body">Mensenzoon als Koning, schapen/bokken,</text><text x="68" y="797" class="body">zes concrete zorgen voor minsten wel of</text><text x="68" y="840" class="body">niet gedaan; twee uitkomsten.</text><text x="46" y="933" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="969" class="note">de plaatselijke versindeling.</text></svg>