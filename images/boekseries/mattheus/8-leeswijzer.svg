<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Genezing, volgen en gezag</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Genezing, volgen en gezag</text><text x="44" y="113" class="ref">Mattheüs 8:1–34</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Genezing · 1–17</text><text x="68" y="241" class="body">Melaatse gereinigd en priesteropdracht;</text><text x="68" y="284" class="body">hoofdman/knecht, schoonmoeder en</text><text x="68" y="327" class="body">avondgenezingen; Jesajawoord.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Volgen en varen · 18–27</text><text x="68" y="476" class="body">Overkant,</text><text x="68" y="519" class="body">schriftgeleerde/vossen/nesten,</text><text x="68" y="562" class="body">leerling/vader; storm, slapende Jezus,</text><text x="68" y="605" class="body">leerlingen roepen, stilte.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De Gergesenen · 28–34</text><text x="68" y="754" class="body">Twee mannen, gesprek, varkenskudde naar</text><text x="68" y="797" class="body">meer, hoeders berichten en stad vraagt</text><text x="68" y="840" class="body">vertrek.</text><text x="46" y="933" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="969" class="note">volgen de plaatselijke versindeling.</text></svg>