<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Afkomst, droom en geboorte</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Afkomst, droom en geboorte</text><text x="44" y="113" class="ref">Mattheüs 1:1–25</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De lijn · 1–17</text><text x="68" y="241" class="body">Abraham tot David, wegvoering Babylon</text><text x="68" y="284" class="body">en Christus; vaderreeksen, genoemde</text><text x="68" y="327" class="body">vrouwen, Jozef man van Maria, Jezus uit</text><text x="68" y="370" class="body">Maria.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De verwachte geboorte · 18–23</text><text x="68" y="519" class="body">Maria verloofd, zwangerschap door</text><text x="68" y="562" class="body">Geest, Jozefs besluit en droom; naam</text><text x="68" y="605" class="body">Jezus en uitleg Immanuël.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De reactie · 24–25</text><text x="68" y="754" class="body">Jozef neemt Maria bij zich, geen</text><text x="68" y="797" class="body">gemeenschap vóór geboorte, geeft naam</text><text x="68" y="840" class="body">Jezus.</text><text x="46" y="933" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="969" class="note">volgen de plaatselijke versindeling.</text></svg>