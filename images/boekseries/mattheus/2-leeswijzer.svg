<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Wijzen, vlucht en terugkeer</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijzen, vlucht en terugkeer</text><text x="44" y="113" class="ref">Mattheüs 2:1–23</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jeruzalem en huis · 1–12</text><text x="68" y="241" class="body">Herodes, schriftgeleerden/Bethlehem,</text><text x="68" y="284" class="body">geheime vraag, ster, vreugde,</text><text x="68" y="327" class="body">huis/Maria/kind, drie soorten gaven,</text><text x="68" y="370" class="body">andere route.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Egypte en rouw · 13–18</text><text x="68" y="519" class="body">Droom, nachtelijke vlucht, Herodes’</text><text x="68" y="562" class="body">geweld tegen kinderen, Jeremiawoord</text><text x="68" y="605" class="body">over Rachels rouw.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Terugkeer · 19–23</text><text x="68" y="754" class="body">Na Herodesdood, nieuwe droom, Israël,</text><text x="68" y="797" class="body">angst voor Archelaüs en waarschuwing,</text><text x="68" y="840" class="body">Galilea/Nazareth.</text><text x="46" y="933" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="969" class="note">volgen de plaatselijke versindeling.</text></svg>