<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Kleinen, broederzorg en vergeving</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kleinen, broederzorg en vergeving</text><text x="44" y="113" class="ref">Mattheüs 18:1–35</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Klein worden en bewaren · 1–14</text><text x="68" y="241" class="body">Kind in midden, niet</text><text x="68" y="284" class="body">verleiden/verachten, radicale</text><text x="68" y="327" class="body">lichaamsbeelden; verloren schaap en</text><text x="68" y="370" class="body">Vader wil geen verlies.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De broer terugwinnen · 15–20</text><text x="68" y="519" class="body">Privé, getuigen en gemeente;</text><text x="68" y="562" class="body">binden/ontbinden, overeenstemmen en</text><text x="68" y="605" class="body">twee/drie in Zijn naam.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Van harte vergeven · 21–35</text><text x="68" y="754" class="body">Petrus zeven keer? Zeventig maal zeven;</text><text x="68" y="797" class="body">koning en grote schuld, kwijtschelding,</text><text x="68" y="840" class="body">kleine schuld geweigerd, aanklacht en</text><text x="68" y="883" class="body">oordeel.</text><text x="46" y="976" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1012" class="note">de plaatselijke versindeling.</text></svg>