<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De personen op de berg</title><desc id="desc">De personen op de berg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De personen op de berg</text><text x="44" y="113" class="ref">Mattheüs 17:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mee omhoog · 1</text><text x="68" y="241" class="body">Jezus neemt Petrus, Jakobus en zijn</text><text x="68" y="284" class="body">broer Johannes mee.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zichtbaar · 2–3</text><text x="68" y="433" class="body">Jezus veranderd; Mozes en Elia spreken</text><text x="68" y="476" class="body">met Hem.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Voorstel · 4</text><text x="68" y="625" class="body">Petrus wil drie tenten, voor</text><text x="68" y="668" class="body">Jezus/Mozes/Elia; geen voltooide bouw</text><text x="68" y="711" class="body">vermeld.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Na de stem · 5–9</text><text x="68" y="860" class="body">Leerlingen bang, Jezus raakt aan;</text><text x="68" y="903" class="body">alleen Jezus over, samen afdalen.</text><text x="46" y="996" class="note">De drie leerlingen zijn de getuigen; Vaderstem</text><text x="46" y="1032" class="note">krijgt geen menselijk portret.</text></svg>