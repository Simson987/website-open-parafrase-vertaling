<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Ontvangen, handelen en afrekenen</title><desc id="desc">Ontvangen, handelen en afrekenen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ontvangen, handelen en afrekenen</text><text x="44" y="113" class="ref">Mattheüs 25:14–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste dienaar</text><text x="68" y="241" class="body">Vijf ontvangen → vijf verdiend → tien</text><text x="68" y="284" class="body">aanwezig.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede dienaar</text><text x="68" y="433" class="body">Twee ontvangen → twee verdiend → vier</text><text x="68" y="476" class="body">aanwezig.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Derde dienaar</text><text x="68" y="625" class="body">Eén ontvangen → begraven → één terug.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Reactie van de heer</text><text x="68" y="774" class="body">Eerste twee dezelfde lof/trouw en</text><text x="68" y="817" class="body">vreugde; derde aangesproken en talent</text><text x="68" y="860" class="body">afgenomen.</text><text x="46" y="953" class="note">Talenten zijn hier toevertrouwd geld, geen</text><text x="46" y="989" class="note">omgerekende eurobedragen.</text></svg>