<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Oordeel, keuze en gehoorzaamheid</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oordeel, keuze en gehoorzaamheid</text><text x="44" y="113" class="ref">Mattheüs 7:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zelfonderzoek · 1–6</text><text x="68" y="241" class="body">Maat, splinter/balk en heilig/parels;</text><text x="68" y="284" class="body">beeldspraak, geen ooghandeling.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vragen en behandelen · 7–12</text><text x="68" y="433" class="body">Vraag/zoek/klop, vader geeft goede</text><text x="68" y="476" class="body">dingen; anderen behandelen zoals zelf</text><text x="68" y="519" class="body">gewenst.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Onderscheiden en doen · 13–29</text><text x="68" y="668" class="body">Nauwe poort, wolven/vruchten, Vaderwil</text><text x="68" y="711" class="body">doen, twee fundamenten; menigte</text><text x="68" y="754" class="body">verwonderd over gezag.</text><text x="46" y="847" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="883" class="note">volgen de plaatselijke versindeling.</text></svg>