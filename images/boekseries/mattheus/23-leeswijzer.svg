<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Waarschuwing en klacht</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarschuwing en klacht</text><text x="44" y="113" class="ref">Mattheüs 23:1–39</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zeggen en doen · 1–12</text><text x="68" y="241" class="body">Stoel Mozes, doen wat opgedragen maar</text><text x="68" y="284" class="body">niet voorbeeld,</text><text x="68" y="327" class="body">lasten/vertoon/eretitels; broers en</text><text x="68" y="370" class="body">dienen, nederigheid.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Wee-uitspraken · 13–36</text><text x="68" y="519" class="body">Toegang, weduwen, bekeerlingen, eden;</text><text x="68" y="562" class="body">tienden/recht, beker, graven, profeten</text><text x="68" y="605" class="body">en rechtvaardig bloed.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De klacht · 37–39</text><text x="68" y="754" class="body">Jeruzalem weigert verzamelen als</text><text x="68" y="797" class="body">hen/kuikens; huis verlaten, weer zien</text><text x="68" y="840" class="body">bij zegening van Komende.</text><text x="46" y="933" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="969" class="note">de plaatselijke versindeling.</text></svg>