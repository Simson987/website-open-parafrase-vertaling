<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De plaatsvolgorde in het verhaal</title><desc id="desc">De plaatsvolgorde in het verhaal met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De plaatsvolgorde in het verhaal</text><text x="44" y="113" class="ref">Mattheüs 2:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wijzen · 1–12</text><text x="68" y="241" class="body">Oosten → Jeruzalem → Bethlehemhuis →</text><text x="68" y="284" class="body">langs andere route naar eigen land.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het gezin · 13–15</text><text x="68" y="433" class="body">Bethlehem → Egypte, in de nacht, tot na</text><text x="68" y="476" class="body">Herodesdood.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Terugkeer · 19–23</text><text x="68" y="625" class="body">Egypte → land Israël; wegens Archelaüs</text><text x="68" y="668" class="body">naar Galilea, wonen Nazareth.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tekstwoorden</text><text x="68" y="817" class="body">Bethlehemherder, uit Egypte zoon</text><text x="68" y="860" class="body">geroepen, Rachel in Rama, Nazarener.</text><text x="46" y="953" class="note">Het hoofdstuk noemt soorten geschenken, geen</text><text x="46" y="989" class="note">totaal aantal wijzen. Routes zijn volgorde, geen</text><text x="46" y="1025" class="note">onbewezen exacte kaart.</text></svg>