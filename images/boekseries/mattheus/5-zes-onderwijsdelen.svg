<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1439" viewBox="0 0 840 1439" role="img" aria-labelledby="title desc"><title id="title">Zes delen van het onderwijs</title><desc id="desc">Zes delen van het onderwijs met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1439" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes delen van het onderwijs</text><text x="44" y="113" class="ref">Mattheüs 5:21–48</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Doden en boosheid · 21–26</text><text x="68" y="241" class="body">Recht, niet verachten; eerst verzoenen</text><text x="68" y="284" class="body">en het met tegenstander bijleggen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Overspel en begeerte · 27–30</text><text x="68" y="433" class="body">Hart telt; radicale oog/handtaal tegen</text><text x="68" y="476" class="body">zonde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Scheiding · 31–32</text><text x="68" y="625" class="body">Scheidingsbrief en ontrouw; de gegeven</text><text x="68" y="668" class="body">uitzondering blijft staan.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Eed · 33–37</text><text x="68" y="817" class="body">Niet zweren; ja is ja, nee is nee.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Vergelding · 38–42</text><text x="68" y="966" class="body">Wang, onder/bovenkleed, anderhalve/drie</text><text x="68" y="1009" class="body">km, geven en lenen.</text><rect x="42" y="1067" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Liefde · 43–48</text><text x="68" y="1158" class="body">Vijanden liefhebben, zegenen/bidden,</text><text x="68" y="1201" class="body">zon/regen over allen; verder dan eigen</text><text x="68" y="1244" class="body">kring.</text><text x="46" y="1337" class="note">Radicale lichaamsbeeldspraak wordt inhoudelijk</text><text x="46" y="1373" class="note">benoemd zonder verminking te tekenen.</text></svg>