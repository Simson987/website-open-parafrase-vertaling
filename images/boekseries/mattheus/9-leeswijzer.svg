<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1227" viewBox="0 0 840 1227" role="img" aria-labelledby="title desc"><title id="title">Vergeving, roeping en ontferming</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1227" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vergeving, roeping en ontferming</text><text x="44" y="113" class="ref">Mattheüs 9:1–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De mat en de tafel · 1–13</text><text x="68" y="241" class="body">Vergeving, Schriftgeleerdenvraag,</text><text x="68" y="284" class="body">opstaan; Mattheüs roepen, maaltijd en</text><text x="68" y="327" class="body">barmhartigheid.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vasten en nieuw · 14–17</text><text x="68" y="476" class="body">Bruidegom, lap stof en wijnzakken:</text><text x="68" y="519" class="body">vragen en vergelijkingen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ontmoetingen · 18–34</text><text x="68" y="668" class="body">Leider/dochter, vrouw met twaalf jaar</text><text x="68" y="711" class="body">bloedverlies, dochter op, twee blinden</text><text x="68" y="754" class="body">en man die weer spreekt.</text><rect x="42" y="812" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het slot · 35–38</text><text x="68" y="903" class="body">Steden/dorpen,</text><text x="68" y="946" class="body">onderwijs/verkondiging/genezing;</text><text x="68" y="989" class="body">schapen zonder herder, grote oogst en</text><text x="68" y="1032" class="body">weinig arbeiders, bidden.</text><text x="46" y="1125" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="1161" class="note">volgen de plaatselijke versindeling.</text></svg>