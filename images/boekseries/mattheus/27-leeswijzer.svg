<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1313" viewBox="0 0 840 1313" role="img" aria-labelledby="title desc"><title id="title">Proces, kruis en graf</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1313" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Proces, kruis en graf</text><text x="44" y="113" class="ref">Mattheüs 27:1–66</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Overgeleverd en geld · 1–10</text><text x="68" y="241" class="body">Naar Pilatus, Judas berouw/geld terug</text><text x="68" y="284" class="body">en dood; pottenbakkersakker voor</text><text x="68" y="327" class="body">vreemdelingen, profetenwoord.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Voor Pilatus · 11–31</text><text x="68" y="476" class="body">Koningsvraag/zwijgen, Barabbas,</text><text x="68" y="519" class="body">vrouwsdroom, handen wassen, vrijlaten</text><text x="68" y="562" class="body">en mishandeling/spot.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Golgotha · 32–56</text><text x="68" y="711" class="body">Simon draagt, wijn geweigerd, drie</text><text x="68" y="754" class="body">gekruisigden/kleren verdeeld, spot;</text><text x="68" y="797" class="body">donker twaalf tot drie, roep/dood,</text><text x="68" y="840" class="body">tempel en aardbeving, hoofdman/vrouwen.</text><rect x="42" y="898" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Het graf · 57–66</text><text x="68" y="989" class="body">Jozef vraagt lichaam, schoon</text><text x="68" y="1032" class="body">linnen/nieuw rotsgraf/steen; twee</text><text x="68" y="1075" class="body">Maria’s, volgende dag</text><text x="68" y="1118" class="body">bewaking/verzegeling.</text><text x="46" y="1211" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1247" class="note">de plaatselijke versindeling.</text></svg>