<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Belijdenis en de weg van volgen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Belijdenis en de weg van volgen</text><text x="44" y="113" class="ref">Mattheüs 16:1–28</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het teken en de leer · 1–12</text><text x="68" y="241" class="body">Farizeeën/Sadduceeën vragen, rode</text><text x="68" y="284" class="body">lucht/Jona; brood vergeten, twee</text><text x="68" y="327" class="body">maaltijden herinnerd en zuurdesem als</text><text x="68" y="370" class="body">leer.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De belijdenis · 13–20</text><text x="68" y="519" class="body">Caesarea Filippi, meningen en Petrus:</text><text x="68" y="562" class="body">Christus/Zoon levende God; openbaring,</text><text x="68" y="605" class="body">rots/gemeente en sleutels, zwijggebod.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Lijden en volgen · 21–28</text><text x="68" y="754" class="body">Jeruzalem, dood/derde dag; Petrus</text><text x="68" y="797" class="body">spreekt tegen, terechtwijzing; zelf</text><text x="68" y="840" class="body">verloochenen, kruis, leven en daden.</text><text x="46" y="933" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="969" class="note">de plaatselijke versindeling.</text></svg>