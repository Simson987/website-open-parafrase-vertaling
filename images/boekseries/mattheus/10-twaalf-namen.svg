<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De twaalf genoemde apostelen</title><desc id="desc">De twaalf genoemde apostelen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twaalf genoemde apostelen</text><text x="44" y="113" class="ref">Mattheüs 10:2–4</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste broers</text><text x="68" y="241" class="body">Simon/Petrus en Andreas, zijn broer.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zebedeüs’ zonen</text><text x="68" y="390" class="body">Jakobus en Johannes, zijn broer.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Volgende vier</text><text x="68" y="539" class="body">Filippus, Bartholomeüs, Thomas en</text><text x="68" y="582" class="body">Mattheüs de tollenaar.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Laatste vier</text><text x="68" y="731" class="body">Jakobus zoon van Alfeüs;</text><text x="68" y="774" class="body">Lebbeüs/Thaddeüs; Simon de IJveraar;</text><text x="68" y="817" class="body">Judas Iskariot.</text><text x="46" y="910" class="note">Twaalf namen; Lebbeüs en Thaddeüs zijn hier</text><text x="46" y="946" class="note">dezelfde persoon, niet twee extra apostelen.</text></svg>