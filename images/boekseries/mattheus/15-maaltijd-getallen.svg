<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">De maaltijdgetallen</title><desc id="desc">De maaltijdgetallen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De maaltijdgetallen</text><text x="44" y="113" class="ref">Mattheüs 15:32–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Duur en voorraad</text><text x="68" y="241" class="body">Drie dagen bij Jezus; zeven broden en</text><text x="68" y="284" class="body">een paar kleine vissen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Delen en overschot</text><text x="68" y="433" class="body">Danken, breken, via leerlingen; allen</text><text x="68" y="476" class="body">genoeg, zeven manden stukken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De menigte</text><text x="68" y="625" class="body">Vierduizend mannen, naast vrouwen en</text><text x="68" y="668" class="body">kinderen.</text><text x="46" y="761" class="note">Dit hoofdstuk noemt zeven manden; vrouwen en</text><text x="46" y="797" class="note">kinderen vallen buiten de genoemde vierduizend</text><text x="46" y="833" class="note">mannen.</text></svg>