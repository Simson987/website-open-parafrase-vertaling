<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Werktijden en hetzelfde loon</title><desc id="desc">Werktijden en hetzelfde loon met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Werktijden en hetzelfde loon</text><text x="44" y="113" class="ref">Mattheüs 20:1–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vroege groep · 1–2</text><text x="68" y="241" class="body">Afspraak één penning voor de dag.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Later · 3–7</text><text x="68" y="390" class="body">Negen uur, middag, drie uur en vijf</text><text x="68" y="433" class="body">uur; laatste groep één uur gewerkt.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De avond · 8–12</text><text x="68" y="582" class="body">Laatsten eerst, ieder één penning;</text><text x="68" y="625" class="body">eersten verwachtten meer en mopperen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het antwoord · 13–16</text><text x="68" y="774" class="body">Afspraak gehouden, eigenaar wil royaal</text><text x="68" y="817" class="body">zijn; laatsten/eersten.</text><text x="46" y="910" class="note">De tijden volgen de plaatselijke vertaling; geen</text><text x="46" y="946" class="note">moderne arbeidswet toegepast.</text></svg>