<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Johannes en de uitnodiging</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Johannes en de uitnodiging</text><text x="44" y="113" class="ref">Mattheüs 11:1–30</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vraag en getuigenis · 1–15</text><text x="68" y="241" class="body">Opdrachten gegeven, Johannes gevangen,</text><text x="68" y="284" class="body">twee leerlingen vragen; horen/zien,</text><text x="68" y="327" class="body">profeet en bode, Johannes/Elia en</text><text x="68" y="370" class="body">luisteren.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Generatie en steden · 16–24</text><text x="68" y="519" class="body">Marktkinderen, Johannes/eten en</text><text x="68" y="562" class="body">Mensenzoon/eten; wondersteden zonder</text><text x="68" y="605" class="body">bekering, vergelijking met Tyrus/Sidon</text><text x="68" y="648" class="body">en Sodom.</text><rect x="42" y="706" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Dank en rust · 25–30</text><text x="68" y="797" class="body">Vader/Zoon en bekendmaken, kleine</text><text x="68" y="840" class="body">kinderen; vermoeiden, juk leren,</text><text x="68" y="883" class="body">zachtmoedig/nederig en rust.</text><text x="46" y="976" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="1012" class="note">volgen de plaatselijke versindeling.</text></svg>