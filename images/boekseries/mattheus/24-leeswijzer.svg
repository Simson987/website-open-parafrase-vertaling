<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Waarschuwing en waakzaamheid</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarschuwing en waakzaamheid</text><text x="44" y="113" class="ref">Mattheüs 24:1–51</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vraag en eerste waarschuwing · 1–14</text><text x="68" y="241" class="body">Tempelstenen en Olijfbergvraag;</text><text x="68" y="284" class="body">misleiding, oorlog/weeën, vervolging,</text><text x="68" y="327" class="body">volhouden en wereldwijd evangelie.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vlucht en komst · 15–31</text><text x="68" y="476" class="body">Daniëlgruwel, Judea naar bergen,</text><text x="68" y="519" class="body">verdrukking; valse messiassen, bliksem,</text><text x="68" y="562" class="body">hemeltekenen en verzamelen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Leren en gereed zijn · 32–51</text><text x="68" y="711" class="body">Vijgenboom, woorden blijven, niemand</text><text x="68" y="754" class="body">dag/uur; Noach, twee/twee, huiswacht en</text><text x="68" y="797" class="body">trouwe/slechte dienaar.</text><text x="46" y="890" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="926" class="note">de plaatselijke versindeling.</text></svg>