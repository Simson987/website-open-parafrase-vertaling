<svg xmlns="http://www.w3.org/2000/svg" width="840" height="707" viewBox="0 0 840 707" role="img" aria-labelledby="title desc"><title id="title">Twee broederparen geroepen</title><desc id="desc">Twee broederparen geroepen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="707" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee broederparen geroepen</text><text x="44" y="113" class="ref">Mattheüs 4:18–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Simon/Petrus en Andreas</text><text x="68" y="241" class="body">Broers, net in water, vissers; netten</text><text x="68" y="284" class="body">direct achterlaten en volgen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jakobus en Johannes</text><text x="68" y="433" class="body">Broers, zonen van Zebedeüs; boot/netten</text><text x="68" y="476" class="body">en vader achterlaten, volgen.</text><text x="46" y="569" class="note">Zebedeüs is expliciet vader van het tweede paar;</text><text x="46" y="605" class="note">er wordt geen familierelatie tussen de twee</text><text x="46" y="641" class="note">paren verzonnen.</text></svg>