<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Driemaal bidden en terugkeren</title><desc id="desc">Driemaal bidden en terugkeren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Driemaal bidden en terugkeren</text><text x="44" y="113" class="ref">Mattheüs 26:36–46</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste keer · 39–41</text><text x="68" y="241" class="body">Beker voorbij als mogelijk, niet eigen</text><text x="68" y="284" class="body">maar Vaders wil; slapen en waak/bid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede keer · 42–43</text><text x="68" y="433" class="body">Als drinken nodig, Uw wil; opnieuw</text><text x="68" y="476" class="body">slapend, ogen zwaar.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Derde keer · 44–46</text><text x="68" y="625" class="body">Dezelfde woorden, daarna uur/verrader</text><text x="68" y="668" class="body">dichtbij en opstaan.</text><text x="46" y="761" class="note">Geen engel, genezing van oor of bloeddruppels</text><text x="46" y="797" class="note">toegevoegd; die details staan niet in dit</text><text x="46" y="833" class="note">hoofdstuk.</text></svg>