<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Vier gronden met uitleg</title><desc id="desc">Vier gronden met uitleg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier gronden met uitleg</text><text x="44" y="113" class="ref">Mattheüs 13:3–8,18–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Langs de weg</text><text x="68" y="241" class="body">Vogels eten zaad; horen zonder</text><text x="68" y="284" class="body">begrijpen, boze rooft boodschap.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rotsgrond</text><text x="68" y="433" class="body">Snel op, geen wortel, verdort; vreugde</text><text x="68" y="476" class="body">maar bij verdrukking opgeven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Doornen</text><text x="68" y="625" class="body">Verstikken planten; zorgen en rijkdom</text><text x="68" y="668" class="body">verstikken boodschap.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Goede aarde</text><text x="68" y="817" class="body">Horen en begrijpen; honderd-, zestig-</text><text x="68" y="860" class="body">of dertigvoud vrucht.</text><text x="46" y="953" class="note">De gegeven uitleg blijft gekoppeld aan elke</text><text x="46" y="989" class="note">grond; aantallen zijn de drie tekstopbrengsten.</text></svg>