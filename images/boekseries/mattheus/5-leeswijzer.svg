<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Het begin van de Bergrede</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het begin van de Bergrede</text><text x="44" y="113" class="ref">Mattheüs 5:1–48</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gelukkig en zichtbaar · 1–16</text><text x="68" y="241" class="body">Leerlingen bij zittende Jezus,</text><text x="68" y="284" class="body">gelukkigsprekingen; zout, bergstad/lamp</text><text x="68" y="327" class="body">en goede daden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wet en vervulling · 17–20</text><text x="68" y="476" class="body">Wet/profeten vervullen, klein gebod</text><text x="68" y="519" class="body">doen/leren, grotere gerechtigheid.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het concrete leven · 21–48</text><text x="68" y="668" class="body">Boosheid/verzoening, begeerte,</text><text x="68" y="711" class="body">huwelijk, eed/ja-nee, vergelding/geven</text><text x="68" y="754" class="body">en vijandenliefde; Vader als maatstaf.</text><text x="46" y="847" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="883" class="note">volgen de plaatselijke versindeling.</text></svg>