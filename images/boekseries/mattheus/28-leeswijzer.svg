<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Opstanding en opdracht</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opstanding en opdracht</text><text x="44" y="113" class="ref">Mattheüs 28:1–20</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij het graf · 1–10</text><text x="68" y="241" class="body">Twee Maria’s, aardbeving/engel/steen,</text><text x="68" y="284" class="body">bewakers bang; niet hier maar</text><text x="68" y="327" class="body">opgestaan, bericht Galilea en Jezus</text><text x="68" y="370" class="body">ontmoet vrouwen.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Het tegenverhaal · 11–15</text><text x="68" y="519" class="body">Bewakers berichten, leiders betalen,</text><text x="68" y="562" class="body">opdracht gestolen-terwijl-wij-sliepen</text><text x="68" y="605" class="body">te zeggen; aangenomen geld.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De berg · 16–20</text><text x="68" y="754" class="body">Elf naar Galilea, aanbidding en</text><text x="68" y="797" class="body">twijfel; alle macht, volken tot</text><text x="68" y="840" class="body">leerlingen, dopen/leren en dagelijkse</text><text x="68" y="883" class="body">nabijheid.</text><text x="46" y="976" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1012" class="note">de plaatselijke versindeling.</text></svg>