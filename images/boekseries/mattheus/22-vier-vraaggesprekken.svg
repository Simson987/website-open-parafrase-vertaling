<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Vier vraaggesprekken</title><desc id="desc">Vier vraaggesprekken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier vraaggesprekken</text><text x="44" y="113" class="ref">Mattheüs 22:15–46</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Farizeeleerlingen/Herodianen</text><text x="68" y="241" class="body">Belastingvraag; afbeelding/opschrift,</text><text x="68" y="284" class="body">keizer geven en God geven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sadduceeën</text><text x="68" y="433" class="body">Zeven broers en opstanding;</text><text x="68" y="476" class="body">Schriften/kracht, geen huwelijk en God</text><text x="68" y="519" class="body">van levenden.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wetgeleerde</text><text x="68" y="668" class="body">Grootste gebod; liefde God en naaste,</text><text x="68" y="711" class="body">wet/profeten.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Jezus aan Farizeeën</text><text x="68" y="860" class="body">Messias wiens Zoon? David noemt Hem</text><text x="68" y="903" class="body">Heere; geen antwoord.</text><text x="46" y="996" class="note">De gesprekspartners en hun verschillende vragen</text><text x="46" y="1032" class="note">blijven herkenbaar.</text></svg>