<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1356" viewBox="0 0 840 1356" role="img" aria-labelledby="title desc"><title id="title">Maaltijd, gebed en verhoor</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1356" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Maaltijd, gebed en verhoor</text><text x="44" y="113" class="ref">Mattheüs 26:1–75</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorbereiding · 1–19</text><text x="68" y="241" class="body">Pascha over twee dagen, Kajafaspaleis,</text><text x="68" y="284" class="body">zalving in Bethanië/Simon, Judas dertig</text><text x="68" y="327" class="body">zilver en maaltijd klaar.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De tafel · 20–35</text><text x="68" y="476" class="body">Twaalf, verraadvraag,</text><text x="68" y="519" class="body">brood/beker/verbond, lofzang en</text><text x="68" y="562" class="body">Olijfberg, verstrooiing en Petrus’</text><text x="68" y="605" class="body">belofte/voorspelling.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Gethsemané · 36–56</text><text x="68" y="754" class="body">Petrus en Zebedeüszonen mee, drie</text><text x="68" y="797" class="body">gebeden/terugkeer, leerlingen slapen;</text><text x="68" y="840" class="body">Judas’ kus, arrest, zwaard terug,</text><text x="68" y="883" class="body">leerlingen vluchten.</text><rect x="42" y="941" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="984" class="label">Kajafas en Petrus · 57–75</text><text x="68" y="1032" class="body">Verhoor, twee valse getuigen,</text><text x="68" y="1075" class="body">zwijgen/belijdenis en veroordeling;</text><text x="68" y="1118" class="body">buiten driemaal ontkennen, haan en</text><text x="68" y="1161" class="body">bitter huilen.</text><text x="46" y="1254" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1290" class="note">de plaatselijke versindeling.</text></svg>