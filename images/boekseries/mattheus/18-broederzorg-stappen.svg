<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De stappen van broederzorg</title><desc id="desc">De stappen van broederzorg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De stappen van broederzorg</text><text x="44" y="113" class="ref">Mattheüs 18:15–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerst · 15</text><text x="68" y="241" class="body">Onder vier ogen spreken, luisteren</text><text x="68" y="284" class="body">betekent teruggewonnen broer.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Daarna · 16</text><text x="68" y="433" class="body">Eén of twee meenemen, twee of drie</text><text x="68" y="476" class="body">getuigen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vervolgens · 17</text><text x="68" y="625" class="body">Aan gemeente vertellen; ook dan niet</text><text x="68" y="668" class="body">horen: heiden/tollenaar beschouwen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Samen · 18–20</text><text x="68" y="817" class="body">Binden/ontbinden, overeenstemmen in</text><text x="68" y="860" class="body">vragen en twee of drie bijeen.</text><text x="46" y="953" class="note">Geen fase overslaan; de inzet van de eerste stap</text><text x="46" y="989" class="note">is terugwinnen.</text></svg>