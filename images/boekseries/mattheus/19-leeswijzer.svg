<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1078" viewBox="0 0 840 1078" role="img" aria-labelledby="title desc"><title id="title">Huwelijk, kinderen en bezit</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1078" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Huwelijk, kinderen en bezit</text><text x="44" y="113" class="ref">Mattheüs 19:1–30</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het huwelijk · 1–12</text><text x="68" y="241" class="body">Judea/Jordaan, vraag, schepping en één</text><text x="68" y="284" class="body">vlees; Mozes/hard hart,</text><text x="68" y="327" class="body">ontrouwuitzondering; niet iedereen</text><text x="68" y="370" class="body">aanvaardt ongehuwd leven.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De kinderen · 13–15</text><text x="68" y="519" class="body">Brengen voor gebed/handoplegging,</text><text x="68" y="562" class="body">leerlingen houden tegen, Jezus laat</text><text x="68" y="605" class="body">komen en zegent.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Bezit en volgen · 16–30</text><text x="68" y="754" class="body">Gebodsvraag, verkopen/armen/volgen,</text><text x="68" y="797" class="body">bedroefde jongeman; kameel/naald en</text><text x="68" y="840" class="body">Gods mogelijkheid; verlaten/belofte,</text><text x="68" y="883" class="body">eersten/laatsten.</text><text x="46" y="976" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1012" class="note">de plaatselijke versindeling.</text></svg>