<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1385" viewBox="0 0 840 1385" role="img" aria-labelledby="title desc"><title id="title">De genoemde geslachtslijn</title><desc id="desc">Alle namen in de gegeven hoofdlijn, huwelijk en geboorte onderscheiden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1385" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde geslachtslijn</text><text x="44" y="113" class="ref">Mattheüs 1:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Abraham tot David · 2–6</text><text x="68" y="241" class="body">Abraham → Izak → Jakob → Juda → Fares →</text><text x="68" y="284" class="body">Esrom → Aram → Aminadab → Nahasson →</text><text x="68" y="327" class="body">Salmon → Booz → Obed → Jessai → David.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">David tot wegvoering · 6–11</text><text x="68" y="476" class="body">David → Salomon → Roboam → Abia → Asa →</text><text x="68" y="519" class="body">Josafat → Joram → Ozias → Joatham →</text><text x="68" y="562" class="body">Achaz → Ezekias → Manasse → Amon →</text><text x="68" y="605" class="body">Josias → Jechonias.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Na wegvoering · 12–16</text><text x="68" y="754" class="body">Jechonias → Salathiël → Zorobabel →</text><text x="68" y="797" class="body">Abiud → Eljakim → Azor → Sadok → Achim</text><text x="68" y="840" class="body">→ Elihud → Eleazar → Matthan → Jakob →</text><text x="68" y="883" class="body">Jozef.</text><rect x="42" y="941" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="984" class="label">Huwelijk en geboorte · 16</text><text x="68" y="1032" class="body">Jozef is de man van Maria. Uit Maria</text><text x="68" y="1075" class="body">werd Jezus geboren, die Christus wordt</text><text x="68" y="1118" class="body">genoemd.</text><text x="46" y="1211" class="note">De pijlen volgen de vaderformuleringen van het</text><text x="46" y="1247" class="note">hoofdstuk. Zara en de broers staan naast de</text><text x="46" y="1283" class="note">hoofdlijn; Jozef wordt hier niet als biologische</text><text x="46" y="1319" class="note">vader van Jezus aangeduid.</text></svg>