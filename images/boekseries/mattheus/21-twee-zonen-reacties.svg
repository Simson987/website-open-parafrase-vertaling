<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Twee antwoorden, twee daden</title><desc id="desc">Twee antwoorden, twee daden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee antwoorden, twee daden</text><text x="44" y="113" class="ref">Mattheüs 21:28–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste zoon</text><text x="68" y="241" class="body">Zegt: Ik wil niet. Krijgt later spijt</text><text x="68" y="284" class="body">en gaat toch.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede zoon</text><text x="68" y="433" class="body">Zegt: Ja, heer. Gaat niet.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het antwoord</text><text x="68" y="582" class="body">De eerste doet wat de vader wil.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De toepassing</text><text x="68" y="731" class="body">Johannes geloofd door</text><text x="68" y="774" class="body">tollenaars/prostituees; leiders ook na</text><text x="68" y="817" class="body">zien geen berouw.</text><text x="46" y="910" class="note">Gesproken instemming en werkelijk doen blijven</text><text x="46" y="946" class="note">apart.</text></svg>