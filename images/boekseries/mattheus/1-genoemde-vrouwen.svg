<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc"><title id="title">Vrouwen en bijzondere verbanden</title><desc id="desc">Vrouwen en bijzondere verbanden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1319" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrouwen en bijzondere verbanden</text><text x="44" y="113" class="ref">Mattheüs 1:3–6,16–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Thamar · 3</text><text x="68" y="241" class="body">Juda is bij haar vader van Fares en</text><text x="68" y="284" class="body">Zara.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rachab en Ruth · 5</text><text x="68" y="433" class="body">Salmon bij Rachab: Booz; Booz bij Ruth:</text><text x="68" y="476" class="body">Obed.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vrouw van Uria · 6</text><text x="68" y="625" class="body">David bij haar vader van Salomon; haar</text><text x="68" y="668" class="body">eigen naam wordt hier niet ingevuld.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Maria en Jozef · 16</text><text x="68" y="817" class="body">Jozef is man van Maria; uit Maria is</text><text x="68" y="860" class="body">Jezus geboren.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het raamwerk · 17</text><text x="68" y="1009" class="body">Veertien van Abraham tot David, tot</text><text x="68" y="1052" class="body">wegvoering en tot Christus.</text><text x="46" y="1145" class="note">Relaties volgen de formulering van dit</text><text x="46" y="1181" class="note">hoofdstuk. De huwelijksschakel Jozef/Maria wordt</text><text x="46" y="1217" class="note">niet als biologisch vaderschap van Jezus</text><text x="46" y="1253" class="note">getekend.</text></svg>