<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Het voorgelegde zevenbroersgeval</title><desc id="desc">Het voorgelegde zevenbroersgeval met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het voorgelegde zevenbroersgeval</text><text x="44" y="113" class="ref">Mattheüs 22:23–33</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De casus · 24–28</text><text x="68" y="241" class="body">Zeven broers achtereen kinderloos</text><text x="68" y="284" class="body">gestorven, dezelfde vrouw, ook zij</text><text x="68" y="327" class="body">sterft; wie bij opstanding?</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het antwoord · 29–30</text><text x="68" y="476" class="body">Schriften en Gods kracht niet gekend;</text><text x="68" y="519" class="body">bij opstanding geen trouwen, als</text><text x="68" y="562" class="body">engelen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">God van levenden · 31–33</text><text x="68" y="711" class="body">Abraham, Izak en Jakob; menigte</text><text x="68" y="754" class="body">verbaasd.</text><text x="46" y="847" class="note">Dit is een door de Sadduceeën voorgelegde casus,</text><text x="46" y="883" class="note">geen historische stamboom van zeven genoemde</text><text x="46" y="919" class="note">mannen.</text></svg>