<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De eerste wee-uitspraken</title><desc id="desc">De eerste wee-uitspraken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eerste wee-uitspraken</text><text x="44" y="113" class="ref">Mattheüs 23:13–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Toegang · 13</text><text x="68" y="241" class="body">Zelf niet binnen en anderen</text><text x="68" y="284" class="body">tegenhouden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Weduwen · 14</text><text x="68" y="433" class="body">Huizen beroven en lange schijngebeden;</text><text x="68" y="476" class="body">zwaarder oordeel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bekeerling · 15</text><text x="68" y="625" class="body">Land/zee reizen, tweemaal zo geschikt</text><text x="68" y="668" class="body">voor hel maken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Eden · 16–22</text><text x="68" y="817" class="body">Tempel/goud, altaar/gave; heiligend</text><text x="68" y="860" class="body">geheel, hemel/troon.</text><text x="46" y="953" class="note">De plaatselijke tekst bevat vers 14; het</text><text x="46" y="989" class="note">weduwenwoord blijft daarom in het overzicht.</text></svg>