<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Genade, dienen en ontferming</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Genade, dienen en ontferming</text><text x="44" y="113" class="ref">Mattheüs 20:1–34</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De wijngaard · 1–16</text><text x="68" y="241" class="body">Vroeg en later ingehuurd, afgesproken</text><text x="68" y="284" class="body">penning, laatsten eerst betaald;</text><text x="68" y="327" class="body">gemopper en goedheid eigenaar.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jeruzalem en de plaatsen · 17–28</text><text x="68" y="476" class="body">Twaalf apart, derde dag; moeder</text><text x="68" y="519" class="body">Zebedeüszonen vraagt rechts/links,</text><text x="68" y="562" class="body">beker/doop en tien boos; dienen en</text><text x="68" y="605" class="body">losprijs.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Bij Jericho · 29–34</text><text x="68" y="754" class="body">Twee blinden roepen door, Jezus staat</text><text x="68" y="797" class="body">stil/vraagt, ontferming/aanraking, zien</text><text x="68" y="840" class="body">en volgen.</text><text x="46" y="933" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="969" class="note">de plaatselijke versindeling.</text></svg>