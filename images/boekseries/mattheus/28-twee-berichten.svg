<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Twee berichten en de opdracht</title><desc id="desc">Twee berichten en de opdracht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee berichten en de opdracht</text><text x="44" y="113" class="ref">Mattheüs 28:7–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Engel en Jezus aan vrouwen</text><text x="68" y="241" class="body">Opgestaan, leerlingen/broers berichten,</text><text x="68" y="284" class="body">naar Galilea.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bewakers aan leiders</text><text x="68" y="433" class="body">Vertellen wat gebeurd; leiders betalen</text><text x="68" y="476" class="body">voor verhaal over diefstal tijdens</text><text x="68" y="519" class="body">slaap.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Jezus aan de elf</text><text x="68" y="668" class="body">Alle macht, alle volken leerlingen</text><text x="68" y="711" class="body">maken, dopen en leren gehoorzamen;</text><text x="68" y="754" class="body">dagelijks bij hen.</text><text x="46" y="847" class="note">Het betaalde diefstalverhaal wordt als</text><text x="46" y="883" class="note">opgedragen verhaal gemarkeerd, niet als</text><text x="46" y="919" class="note">werkelijk afgebeelde diefstal.</text></svg>