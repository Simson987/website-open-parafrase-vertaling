<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De bede in volgorde</title><desc id="desc">De bede in volgorde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De bede in volgorde</text><text x="44" y="113" class="ref">Mattheüs 6:9–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Naam, koninkrijk en wil · 9–10</text><text x="68" y="241" class="body">Naam geheiligd, koninkrijk komen, wil</text><text x="68" y="284" class="body">op aarde als in hemel.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dagelijks brood · 11</text><text x="68" y="433" class="body">Geef ons vandaag ons dagelijks brood.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vergeving · 12,14–15</text><text x="68" y="582" class="body">Onze schulden en onze schuldenaren;</text><text x="68" y="625" class="body">vervolg over anderen vergeven.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Bewaring en slot · 13</text><text x="68" y="774" class="body">Niet in verzoeking, red van boze;</text><text x="68" y="817" class="body">koninkrijk, kracht en heerlijkheid,</text><text x="68" y="860" class="body">voor altijd.</text><text x="46" y="953" class="note">Gebed volgens de volledige plaatselijke tekst,</text><text x="46" y="989" class="note">geen weggelaten slotbede.</text></svg>