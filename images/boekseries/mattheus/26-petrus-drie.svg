<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Petrus’ drie ontkenningen</title><desc id="desc">Petrus’ drie ontkenningen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Petrus’ drie ontkenningen</text><text x="44" y="113" class="ref">Mattheüs 26:69–75</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Binnenplaats · 69–70</text><text x="68" y="241" class="body">Dienstmeisje: bij Jezus Galilea; ik</text><text x="68" y="284" class="body">weet niet wat je zegt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Poort · 71–72</text><text x="68" y="433" class="body">Ander dienstmeisje: Jezus Nazareth; met</text><text x="68" y="476" class="body">eed ontkennen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Omstanders · 73–74</text><text x="68" y="625" class="body">Spraak verraadt; vervloeken/zweren, ik</text><text x="68" y="668" class="body">ken Hem niet.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Na de haan · 75</text><text x="68" y="817" class="body">Woorden herinnerd, naar buiten en</text><text x="68" y="860" class="body">bitter huilen.</text><text x="46" y="953" class="note">De plaatselijke volgorde en verschillende</text><text x="46" y="989" class="note">aansprekers blijven bewaard.</text></svg>