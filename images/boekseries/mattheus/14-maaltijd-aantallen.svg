<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De genoemde aantallen</title><desc id="desc">De genoemde aantallen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde aantallen</text><text x="44" y="113" class="ref">Mattheüs 14:17–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aan het begin · 17</text><text x="68" y="241" class="body">Vijf broden en twee vissen.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De handeling · 19</text><text x="68" y="390" class="body">Menigte in gras, omhoog kijken en</text><text x="68" y="433" class="body">zegen, breken, aan leerlingen en zij</text><text x="68" y="476" class="body">delen uit.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat overbleef · 20</text><text x="68" y="625" class="body">Twaalf manden vol stukken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De eters · 21</text><text x="68" y="774" class="body">Ongeveer vijfduizend mannen, naast</text><text x="68" y="817" class="body">vrouwen en kinderen.</text><text x="46" y="910" class="note">Vrouwen en kinderen niet meegerekend in de</text><text x="46" y="946" class="note">vijfduizend; geen totaal aantal verzonnen.</text></svg>