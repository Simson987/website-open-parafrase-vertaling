<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Waakzaamheid zonder datum</title><desc id="desc">Waakzaamheid zonder datum met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waakzaamheid zonder datum</text><text x="44" y="113" class="ref">Mattheüs 24:32–51</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Leren · 32–35</text><text x="68" y="241" class="body">Vijgenbladeren als teken, woorden</text><text x="68" y="284" class="body">blijven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Niet weten · 36–39</text><text x="68" y="433" class="body">Alleen Vader dag/uur; Noachvergelijking</text><text x="68" y="476" class="body">en onvoorbereidheid.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gereed · 40–44</text><text x="68" y="625" class="body">Twee op land/twee malen, wakker blijven</text><text x="68" y="668" class="body">en huiswacht.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dienen · 45–51</text><text x="68" y="817" class="body">Voedsel op tijd tegenover</text><text x="68" y="860" class="body">mishandelen/drinken; onverwachte</text><text x="68" y="903" class="body">terugkomst.</text><text x="46" y="996" class="note">Geen jaartal of berekende einddatum toegevoegd;</text><text x="46" y="1032" class="note">dit bewaart de expliciete waarschuwing.</text></svg>