<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">De waarschuwing verstaan</title><desc id="desc">De waarschuwing verstaan met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De waarschuwing verstaan</text><text x="44" y="113" class="ref">Mattheüs 16:5–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Misverstand · 5–8</text><text x="68" y="241" class="body">Brood vergeten, daarom denken zij aan</text><text x="68" y="284" class="body">geen voedsel.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Herinnering · 9–10</text><text x="68" y="433" class="body">Vijf broden/vijfduizend en</text><text x="68" y="476" class="body">zeven/vierduizend; vragen hoeveel</text><text x="68" y="519" class="body">manden.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Inzicht · 11–12</text><text x="68" y="668" class="body">Geen broodgist bedoeld, maar leer</text><text x="68" y="711" class="body">Farizeeën en Sadduceeën.</text><text x="46" y="804" class="note">De tekst geeft de uitleg; geen letterlijke</text><text x="46" y="840" class="note">wonderbare zuurdesem uitgebeeld.</text></svg>