<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">De steden in de vergelijking</title><desc id="desc">De steden in de vergelijking met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De steden in de vergelijking</text><text x="44" y="113" class="ref">Mattheüs 11:20–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Chorazin en Bethsaïda</text><text x="68" y="241" class="body">Veel wonderen, geen bekering;</text><text x="68" y="284" class="body">Tyrus/Sidon zouden zich hebben bekeerd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kapernaüm</text><text x="68" y="433" class="body">Hoog verheven, neergestoten; Sodom zou</text><text x="68" y="476" class="body">zijn blijven bestaan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het oordeel</text><text x="68" y="625" class="body">Tyrus/Sidon en land Sodom draaglijker</text><text x="68" y="668" class="body">dan de aangesproken steden.</text><text x="46" y="761" class="note">Voorwaardelijke vergelijkingen worden niet als</text><text x="46" y="797" class="note">werkelijk uitgevoerde wonderreizen naar die</text><text x="46" y="833" class="note">steden getekend.</text></svg>