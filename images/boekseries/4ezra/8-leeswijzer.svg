<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Ezra bidt om ontferming</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ezra bidt om ontferming</text><text x="44" y="113" class="ref">4 Ezra 8:1–63</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–19 · Velen en weinigen</text><text x="68" y="241" class="body">Aarde en goud als vergelijking; Ezra</text><text x="68" y="284" class="body">bidt voor het zorgvuldig geschapen</text><text x="68" y="327" class="body">leven.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">20–36 · De smeekbede</text><text x="68" y="476" class="body">Verhoor Uw maaksel; laat barmhartigheid</text><text x="68" y="519" class="body">blijken aan mensen die tekortschieten.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">37–49 · Zaad en antwoord</text><text x="68" y="668" class="body">Niet elk zaad blijft behouden; Ezra</text><text x="68" y="711" class="body">vraagt om sparen en ontvangt een</text><text x="68" y="754" class="body">antwoord.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">50–63 · Toekomst en vraag</text><text x="68" y="903" class="body">Paradijs en rust worden toegezegd; Ezra</text><text x="68" y="946" class="body">vraagt opnieuw naar het moment.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>