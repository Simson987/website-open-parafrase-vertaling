<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Waarom God barmhartig heet</title><desc id="desc">Waarom God barmhartig heet met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom God barmhartig heet</text><text x="44" y="113" class="ref">4 Ezra 7:62–70</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ontferming</text><text x="68" y="241" class="body">Voor wie nog komen en voor wie zich</text><text x="68" y="284" class="body">naar Zijn wet bekeren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Geduld</text><text x="68" y="433" class="body">Met wie gezondigd hebben, omdat zij</text><text x="68" y="476" class="body">Zijn schepselen zijn.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Goedheid</text><text x="68" y="625" class="body">Hij geeft wat nodig is; Zijn ontferming</text><text x="68" y="668" class="body">draagt het leven.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vergeving</text><text x="68" y="817" class="body">Hij verlicht onrecht en wist</text><text x="68" y="860" class="body">aanklachten uit.</text><text x="46" y="953" class="note">Ezra’s slotpleidooi in dit hoofdstuk,</text><text x="46" y="989" class="note">onderscheiden van het eerdere antwoord over</text><text x="46" y="1025" class="note">oordeel.</text></svg>