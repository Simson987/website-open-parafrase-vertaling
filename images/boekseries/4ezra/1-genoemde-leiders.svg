<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De genoemde leiders</title><desc id="desc">De genoemde leiders met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde leiders</text><text x="44" y="113" class="ref">4 Ezra 1:39–40</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aartsvaders · vers 39</text><text x="68" y="241" class="body">Abraham, Izaäk en Jakob.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Eerste zes profeten · vers 39</text><text x="68" y="390" class="body">Hosea, Amos, Micha, Joël, Obadja en</text><text x="68" y="433" class="body">Jona.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Volgende zes · vers 40</text><text x="68" y="582" class="body">Nahum, Habakuk, Zefanja, Haggai,</text><text x="68" y="625" class="body">Zacharia en Maleachi.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De toevoeging</text><text x="68" y="774" class="body">Maleachi wordt hier ook de engel van de</text><text x="68" y="817" class="body">Heere genoemd.</text><text x="46" y="910" class="note">De lijst volgt deze twee verzen; er wordt geen</text><text x="46" y="946" class="note">andere profetenvolgorde ingevoegd.</text></svg>