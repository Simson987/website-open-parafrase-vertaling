<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Ezra laat de woorden opschrijven</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ezra laat de woorden opschrijven</text><text x="44" y="113" class="ref">4 Ezra 14:1–47</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–17 · Stem en opdracht</text><text x="68" y="241" class="body">Onder de eik, stem uit de doornstruik;</text><text x="68" y="284" class="body">bewaar de dromen en regel je huis.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">18–36 · De wet voor later</text><text x="68" y="433" class="body">Ezra vraagt om de verbrande wet op te</text><text x="68" y="476" class="body">schrijven; het volk moet veertig dagen</text><text x="68" y="519" class="body">wegblijven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">37–44 · Vijf schrijvers</text><text x="68" y="668" class="body">Ezra drinkt uit de beker, spreekt en</text><text x="68" y="711" class="body">laat de mannen veertig dagen schrijven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">45–47 · Twee bestemmingen</text><text x="68" y="860" class="body">Een deel openbaar; de laatste zeventig</text><text x="68" y="903" class="body">voor de wijzen.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>