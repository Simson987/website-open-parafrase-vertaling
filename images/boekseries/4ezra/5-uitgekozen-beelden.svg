<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Beelden van het ene volk</title><desc id="desc">Beelden van het ene volk met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beelden van het ene volk</text><text x="44" y="113" class="ref">4 Ezra 5:23–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wijnstok en lelie</text><text x="68" y="241" class="body">Eén wijnstok uit alle bomen; één lelie</text><text x="68" y="284" class="body">uit alle bloemen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Land en stad</text><text x="68" y="433" class="body">Eén stuk grond en één geheiligde stad:</text><text x="68" y="476" class="body">Sion.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Duif en lam</text><text x="68" y="625" class="body">Eén duif uit de vogels en één lammetje</text><text x="68" y="668" class="body">uit het vee.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ezra’s vraag</text><text x="68" y="817" class="body">Waarom is het ene uitgekozen volk aan</text><text x="68" y="860" class="body">velen overgegeven?</text><text x="46" y="953" class="note">Dit zijn beelden in Ezra’s gebed; de opsomming</text><text x="46" y="989" class="note">is geen rangorde van huidige volken.</text></svg>