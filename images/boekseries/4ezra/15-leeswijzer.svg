<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Profetie over onrecht en rampen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Profetie over onrecht en rampen</text><text x="44" y="113" class="ref">4 Ezra 15:1–63</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–9 · Spreek en schrijf</text><text x="68" y="241" class="body">Betrouwbare woorden, oordeel over</text><text x="68" y="284" class="body">onrecht en het geroep van onschuldigen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">10–27 · Bevrijding en ontregeling</text><text x="68" y="433" class="body">Egypte, misoogst, oorlog en oproer;</text><text x="68" y="476" class="body">oproep om uit hun macht weg te gaan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">28–45 · Het stormvisioen</text><text x="68" y="625" class="body">Strijdende machten en botsende wolken;</text><text x="68" y="668" class="body">verwoesting van Babel.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">46–63 · Aanspraak aan Asia</text><text x="68" y="817" class="body">Navolging van Babel en geweld tegen</text><text x="68" y="860" class="body">uitverkorenen leiden tot oordeel.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>