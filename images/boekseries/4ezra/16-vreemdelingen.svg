<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Leven als vreemdelingen</title><desc id="desc">Leven als vreemdelingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leven als vreemdelingen</text><text x="44" y="113" class="ref">4 Ezra 16:41–53</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kopen en verkopen</text><text x="68" y="241" class="body">Als iemand die moet vluchten of bezit</text><text x="68" y="284" class="body">zal verliezen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bouwen en planten</text><text x="68" y="433" class="body">Geen zekerheid dat je er woont, maait</text><text x="68" y="476" class="body">of vruchten plukt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het contrast</text><text x="68" y="625" class="body">Roof en pronkzucht worden tegenover</text><text x="68" y="668" class="body">gerechtigheid gezet.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De opdracht · vers 52–53</text><text x="68" y="817" class="body">Word niet als hun daden; het onrecht</text><text x="68" y="860" class="body">wordt weggenomen en gerechtigheid zal</text><text x="68" y="903" class="body">heersen.</text><text x="46" y="996" class="note">De voorbeelden relativeren bezit in de</text><text x="46" y="1032" class="note">aangekondigde ramp; het zijn geen afzonderlijke</text><text x="46" y="1068" class="note">biografische gebeurtenissen.</text></svg>