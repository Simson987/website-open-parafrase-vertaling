<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Waarom deze woorden klinken</title><desc id="desc">Waarom deze woorden klinken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom deze woorden klinken</text><text x="44" y="113" class="ref">4 Ezra 15:1–9,24–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opdracht</text><text x="68" y="241" class="body">Spreek de profetie en laat haar</text><text x="68" y="284" class="body">opschrijven: de woorden zijn</text><text x="68" y="327" class="body">betrouwbaar.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Geen vrees voor tegenstand</text><text x="68" y="476" class="body">Laat ongeloof of plannen van</text><text x="68" y="519" class="body">tegensprekers je niet tegenhouden.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De aanklacht</text><text x="68" y="668" class="body">Onrecht en schadelijke daden vullen de</text><text x="68" y="711" class="body">aarde; onschuldig bloed en</text><text x="68" y="754" class="body">rechtvaardigen roepen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De oproep</text><text x="68" y="903" class="body">Ga weg uit hun macht en maak het</text><text x="68" y="946" class="body">heiligdom niet onrein.</text><text x="46" y="1039" class="note">Dit ordent de profetische boodschap en legt geen</text><text x="46" y="1075" class="note">verband met hedendaagse landen.</text></svg>