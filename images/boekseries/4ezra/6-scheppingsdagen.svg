<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Ezra herinnert de schepping</title><desc id="desc">Ezra herinnert de schepping met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ezra herinnert de schepping</text><text x="44" y="113" class="ref">4 Ezra 6:38–54</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dag 1 en 2 · vers 38–41</text><text x="68" y="241" class="body">Hemel en aarde, helder licht; daarna</text><text x="68" y="284" class="body">het hemelgewelf dat wateren scheidt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dag 3 · vers 42–44</text><text x="68" y="433" class="body">Water verzameld, droge aarde, vruchten</text><text x="68" y="476" class="body">en bloemen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dag 4 en 5 · vers 45–52</text><text x="68" y="625" class="body">Zon, maan en sterren; waterdieren en</text><text x="68" y="668" class="body">vogels; Behemoth en Leviathan</text><text x="68" y="711" class="body">gescheiden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Dag 6 · vers 53–54</text><text x="68" y="860" class="body">Groot en klein vee, kruipende dieren en</text><text x="68" y="903" class="body">Adam.</text><text x="46" y="996" class="note">Volgorde van Ezra’s terugblik in dit hoofdstuk;</text><text x="46" y="1032" class="note">details zijn niet vervangen door een ander</text><text x="46" y="1068" class="note">scheppingsverhaal.</text></svg>