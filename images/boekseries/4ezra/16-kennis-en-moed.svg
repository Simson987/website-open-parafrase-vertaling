<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">God kent en leidt</title><desc id="desc">God kent en leidt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">God kent en leidt</text><text x="44" y="113" class="ref">4 Ezra 16:55–77</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Daden en hart · vers 55–65</text><text x="68" y="241" class="body">Alle daden, plannen en verborgen</text><text x="68" y="284" class="body">gedachten zijn bekend.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oproep · vers 68</text><text x="68" y="433" class="body">Heb ontzag, houd op met zonden en</text><text x="68" y="476" class="body">onrecht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Beproeving · vers 74</text><text x="68" y="625" class="body">De uitverkorenen worden zichtbaar</text><text x="68" y="668" class="body">beproefd zoals goud door vuur.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Moed · vers 75–77</text><text x="68" y="817" class="body">Wees niet bang: God is jullie leider;</text><text x="68" y="860" class="body">houd Zijn geboden en bevelen.</text><text x="46" y="953" class="note">Waarschuwing en bemoediging staan samen in het</text><text x="46" y="989" class="note">slot van dit hoofdstuk.</text></svg>