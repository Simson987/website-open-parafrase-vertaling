<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Recht en concrete zorg</title><desc id="desc">Recht en concrete zorg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Recht en concrete zorg</text><text x="44" y="113" class="ref">4 Ezra 2:20–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Recht en middelen</text><text x="68" y="241" class="body">Recht voor weduwen en wezen; geven aan</text><text x="68" y="284" class="body">armen en bescherming voor verlatenen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ziekte en beperking</text><text x="68" y="433" class="body">Genees en bescherm; lach wie kreupel is</text><text x="68" y="476" class="body">niet uit; laat wie blind is komen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Binnen de muren</text><text x="68" y="625" class="body">Houd oud en jong veilig.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De doden</text><text x="68" y="774" class="body">Geef gevonden doden een teken en</text><text x="68" y="817" class="body">begraaf hen.</text><text x="46" y="910" class="note">Dit zijn opdrachten in de profetische tekst,</text><text x="46" y="946" class="note">naast het beeld van de moeder en haar kinderen.</text></svg>