<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Van rouwende vrouw tot stad</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van rouwende vrouw tot stad</text><text x="44" y="113" class="ref">4 Ezra 10:1–60</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–24 · Verlies en troost</text><text x="68" y="241" class="body">De vrouw vertelt haar verlies; Ezra</text><text x="68" y="284" class="body">spreekt over het verdriet van Sion.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">25–37 · De onthulling</text><text x="68" y="433" class="body">De vrouw straalt en verdwijnt; een stad</text><text x="68" y="476" class="body">wordt zichtbaar. Uriël sterkt Ezra.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">38–54 · De uitleg</text><text x="68" y="625" class="body">De vrouw is Sion; haar verhaal</text><text x="68" y="668" class="body">verklaart offers, bewoning en val van</text><text x="68" y="711" class="body">Jeruzalem.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">55–60 · Kijk en wacht</text><text x="68" y="860" class="body">Ezra mag de stad zien en blijft wachten</text><text x="68" y="903" class="body">op de volgende visioenen.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>