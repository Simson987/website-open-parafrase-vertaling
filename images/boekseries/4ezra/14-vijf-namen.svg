<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De vijf schrijvers</title><desc id="desc">De vijf schrijvers met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vijf schrijvers</text><text x="44" y="113" class="ref">4 Ezra 14:23–26,37–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hun namen · vers 24</text><text x="68" y="241" class="body">Sareas, Dabreas, Salemias, Echanus en</text><text x="68" y="284" class="body">Asiël.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hun materiaal</text><text x="68" y="433" class="body">Veel schrijfplankjes van palmhout.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Hun werk</text><text x="68" y="582" class="body">Opschrijven wat Ezra in vervoering</text><text x="68" y="625" class="body">zegt; de Allerhoogste geeft inzicht.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Hun tijd</text><text x="68" y="774" class="body">Veertig dagen; eten in de nacht,</text><text x="68" y="817" class="body">schrijven en spreken gaan door.</text><text x="46" y="910" class="note">Ezra is degene die dicteert; hij wordt niet als</text><text x="46" y="946" class="note">een zesde schrijver meegeteld.</text></svg>