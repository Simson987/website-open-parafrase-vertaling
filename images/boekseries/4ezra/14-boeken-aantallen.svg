<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Wat de tekst over boeken zegt</title><desc id="desc">Wat de tekst over boeken zegt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat de tekst over boeken zegt</text><text x="44" y="113" class="ref">4 Ezra 14:44–47</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aantal in vers 44</text><text x="68" y="241" class="body">Tweehonderdvier boeken in veertig</text><text x="68" y="284" class="body">dagen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Openbaar · vers 45</text><text x="68" y="433" class="body">De eerste geschreven dingen voor</text><text x="68" y="476" class="body">waardigen en onwaardigen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bewaren · vers 46</text><text x="68" y="625" class="body">De laatste zeventig boeken voor de</text><text x="68" y="668" class="body">wijzen onder het volk.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Kop en vers verschillen</text><text x="68" y="817" class="body">De hoofdstukkop noemt vierentwintig en</text><text x="68" y="860" class="body">zeventig; vers 44 noemt 204.</text><text x="46" y="953" class="note">Het verschil tussen kop en vers is zichtbaar</text><text x="46" y="989" class="note">gelaten. Het aantal openbare boeken is niet zelf</text><text x="46" y="1025" class="note">ingevuld.</text></svg>