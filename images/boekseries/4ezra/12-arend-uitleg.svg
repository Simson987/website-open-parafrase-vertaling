<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De kenmerken uitgelegd</title><desc id="desc">De kenmerken uitgelegd met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De kenmerken uitgelegd</text><text x="44" y="113" class="ref">4 Ezra 12:11–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Arend</text><text x="68" y="241" class="body">Het rijk dat ook Daniël in een visioen</text><text x="68" y="284" class="body">gezien heeft.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twaalf vleugels · vers 14–16</text><text x="68" y="433" class="body">Twaalf koningen na elkaar; de tweede</text><text x="68" y="476" class="body">houdt het het langst vol.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Acht onderste vleugels</text><text x="68" y="625" class="body">Acht koningen met korte tijd;</text><text x="68" y="668" class="body">verschillende groepen worden bewaard of</text><text x="68" y="711" class="body">verdwijnen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Drie koppen · vers 22–28</text><text x="68" y="860" class="body">Drie rijken aan het einde, met zwaard</text><text x="68" y="903" class="body">en onderlinge ondergang.</text><text x="46" y="996" class="note">Alleen de verklaarde verbanden uit deze verzen;</text><text x="46" y="1032" class="note">er worden geen koningsnamen of regeringsjaren</text><text x="46" y="1068" class="note">ingevuld.</text></svg>