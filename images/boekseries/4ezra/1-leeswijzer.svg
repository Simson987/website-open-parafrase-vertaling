<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Aanklacht en herinnering</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aanklacht en herinnering</text><text x="44" y="113" class="ref">4 Ezra 1:1–40</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–8 · Ezra en de opdracht</text><text x="68" y="241" class="body">Afstamming en opdracht om het volk zijn</text><text x="68" y="284" class="body">overtredingen te vertellen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">9–23 · Eerdere weldaden</text><text x="68" y="433" class="body">Uittocht, leiding, voedsel, water en</text><text x="68" y="476" class="body">het gegeven land worden herinnerd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">24–34 · De aanklacht</text><text x="68" y="625" class="body">Niet luisteren en geweld tegen</text><text x="68" y="668" class="body">profeten; beelden van verlatenheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">35–40 · Een komend volk</text><text x="68" y="817" class="body">Geloof zonder geziene tekenen; de</text><text x="68" y="860" class="body">genoemde leiders.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>