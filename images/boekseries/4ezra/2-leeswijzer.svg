<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Moeder, zorg en bekroning</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Moeder, zorg en bekroning</text><text x="44" y="113" class="ref">4 Ezra 2:1–48</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–9 · Rouw en aanklacht</text><text x="68" y="241" class="body">De moeder spreekt als verlaten weduwe;</text><text x="68" y="284" class="body">het volk luisterde niet.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">10–32 · Belofte en zorg</text><text x="68" y="433" class="body">Koninkrijk en levensboom; de moeder</text><text x="68" y="476" class="body">omarmt, kwetsbaren moeten recht</text><text x="68" y="519" class="body">ontvangen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">33–41 · Verwacht de Herder</text><text x="68" y="668" class="body">Rust, licht, feestkleren en het volle</text><text x="68" y="711" class="body">aantal van Sion.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">42–48 · Menigte op Sion</text><text x="68" y="860" class="body">De jongeman kroont hen en geeft</text><text x="68" y="903" class="body">palmtakken; de engel verklaart wie Hij</text><text x="68" y="946" class="body">is.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>