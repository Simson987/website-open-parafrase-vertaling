<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">De vredige menigte uitgelegd</title><desc id="desc">De vredige menigte uitgelegd met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vredige menigte uitgelegd</text><text x="44" y="113" class="ref">4 Ezra 13:39–48</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie · vers 40</text><text x="68" y="241" class="body">De tien stammen, weggevoerd in de dagen</text><text x="68" y="284" class="body">van Hosea door Salmanasser.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hun besluit · vers 41–42</text><text x="68" y="433" class="body">Naar een verder land om daar de regels</text><text x="68" y="476" class="body">te houden.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De passage · vers 43–45</text><text x="68" y="625" class="body">Door de Eufraat; de rivier wordt</text><text x="68" y="668" class="body">tegengehouden. Reis van anderhalf jaar;</text><text x="68" y="711" class="body">de naam Assareth.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De terugkeer · vers 46–48</text><text x="68" y="860" class="body">Opnieuw over de tegengehouden rivier;</text><text x="68" y="903" class="body">overgebleven volk binnen de genoemde</text><text x="68" y="946" class="body">grenzen.</text><text x="46" y="1039" class="note">De route volgt het verhaal, zonder Assareth op</text><text x="46" y="1075" class="note">een moderne kaart te plaatsen.</text></svg>