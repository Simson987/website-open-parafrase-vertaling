<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De vrouw verklaard als Sion</title><desc id="desc">De vrouw verklaard als Sion met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vrouw verklaard als Sion</text><text x="44" y="113" class="ref">4 Ezra 10:40–50</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vrouw</text><text x="68" y="241" class="body">Is Sion en wordt als gebouwde stad</text><text x="68" y="284" class="body">getoond.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dertig jaar zonder kind</text><text x="68" y="433" class="body">Volgens de uitleg: nog geen offer</text><text x="68" y="476" class="body">gebracht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Geboorte en opgroeien</text><text x="68" y="625" class="body">Salomo bouwt en offert; daarna het</text><text x="68" y="668" class="body">wonen binnen Jeruzalem.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De dood van de zoon</text><text x="68" y="817" class="body">De val die Jeruzalem overkomen is.</text><text x="46" y="910" class="note">Dit is Uriëls uitleg van het visioen; de vrouw</text><text x="46" y="946" class="note">is geen apart benoemde historische moeder.</text></svg>