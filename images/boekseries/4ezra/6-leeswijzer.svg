<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Begin, tekenen en schepping</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Begin, tekenen en schepping</text><text x="44" y="113" class="ref">4 Ezra 6:1–59</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–10 · Het begin en de tijden</text><text x="68" y="241" class="body">De Schepper alleen maakt begin en</text><text x="68" y="284" class="body">einde; Jakob en Ezau als tijdsbeeld.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">11–34 · De stem en de tekenen</text><text x="68" y="433" class="body">Ezra staat op, hoort een stem als veel</text><text x="68" y="476" class="body">water en wordt tot moed opgeroepen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">35–54 · Vasten en herinneren</text><text x="68" y="625" class="body">Opnieuw zeven dagen vasten; Ezra</text><text x="68" y="668" class="body">herinnert de zes scheppingsdagen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">55–59 · De vraag blijft</text><text x="68" y="817" class="body">Waarom ontvangt het uitgekozen volk</text><text x="68" y="860" class="body">geen erfdeel met de wereld?</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>