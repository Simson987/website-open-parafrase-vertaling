<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Wat de man betekent</title><desc id="desc">Wat de man betekent met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat de man betekent</text><text x="44" y="113" class="ref">4 Ezra 13:25–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De man uit zee</text><text x="68" y="241" class="body">Hij wordt door de Allerhoogste bewaard</text><text x="68" y="284" class="body">om de schepping te verlossen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De genoemde Zoon · vers 32</text><text x="68" y="433" class="body">Dezelfde wordt als mijn Zoon verklaard</text><text x="68" y="476" class="body">en zal verschijnen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De berg · vers 35–36</text><text x="68" y="625" class="body">Sion wordt opgebouwd getoond, als de</text><text x="68" y="668" class="body">berg zonder mensenhanden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wind, vuur en onweer</text><text x="68" y="817" class="body">In de uitleg: terechtwijzing van</text><text x="68" y="860" class="body">goddeloosheid, pijn en wet als vuur.</text><text x="46" y="953" class="note">Beeld en gegeven verklaring blijven</text><text x="46" y="989" class="note">onderscheiden. De man heeft in vers 9 geen</text><text x="46" y="1025" class="note">zwaard of ander wapen.</text></svg>