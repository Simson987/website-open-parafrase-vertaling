<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Waarom Babel boven Sion?</title><desc id="desc">Waarom Babel boven Sion? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom Babel boven Sion?</text><text x="44" y="113" class="ref">4 Ezra 3:28–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ezra ziet</text><text x="68" y="241" class="body">Het verwoeste Sion tegenover de</text><text x="68" y="284" class="body">overvloed en zonden van Babel.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ezra vraagt</text><text x="68" y="433" class="body">Doet Babel het beter? Waarom wordt het</text><text x="68" y="476" class="body">eigen volk getroffen en de vijand</text><text x="68" y="519" class="body">gespaard?</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ezra beroept zich</text><text x="68" y="668" class="body">Op Israël, Jakob, Gods verbonden en wie</text><text x="68" y="711" class="body">geboden bewaarden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zijn beeld · vers 34</text><text x="68" y="860" class="body">Onze schuld en die van de wereld op een</text><text x="68" y="903" class="body">weegschaal leggen.</text><text x="46" y="996" class="note">Dit is Ezra’s vraag en pleidooi. Het antwoord</text><text x="46" y="1032" class="note">van Uriël begint in het volgende hoofdstuk.</text></svg>