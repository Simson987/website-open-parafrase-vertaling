<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Uitleg, geheim en het volk</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uitleg, geheim en het volk</text><text x="44" y="113" class="ref">4 Ezra 12:1–51</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–9 · Ontwaken en bidden</text><text x="68" y="241" class="body">De arend verdwijnt en brandt; Ezra bidt</text><text x="68" y="284" class="body">om kracht en uitleg.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">10–35 · Het rijk verklaard</text><text x="68" y="433" class="body">Vleugels, veren en koppen worden</text><text x="68" y="476" class="body">uitgelegd; de leeuw kondigt het gericht</text><text x="68" y="519" class="body">aan.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">36–39 · Bewaren en leren</text><text x="68" y="668" class="body">Opschrijven, verbergen en onderwijzen</text><text x="68" y="711" class="body">aan wie het geheim kunnen bewaren.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">40–51 · Het volk en de wacht</text><text x="68" y="860" class="body">Het volk zoekt Ezra; hij bemoedigt hen</text><text x="68" y="903" class="body">en wacht opnieuw zeven dagen.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>