<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Drie onmogelijke opdrachten</title><desc id="desc">Drie onmogelijke opdrachten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie onmogelijke opdrachten</text><text x="44" y="113" class="ref">4 Ezra 4:3–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vuur</text><text x="68" y="241" class="body">Weeg het gewicht van het vuur.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Wind</text><text x="68" y="390" class="body">Meet het blazen van de wind.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Tijd</text><text x="68" y="539" class="body">Roep de dag terug die voorbij is.</text><rect x="42" y="597" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">De les</text><text x="68" y="688" class="body">Wie de eigen nabije dingen niet</text><text x="68" y="731" class="body">doorgrondt, kan de weg van de</text><text x="68" y="774" class="body">Allerhoogste niet omvatten.</text><text x="46" y="867" class="note">De opdrachten zijn vergelijkingen over</text><text x="46" y="903" class="note">menselijke grenzen; geen uitvoerbare</text><text x="46" y="939" class="note">natuurproef.</text></svg>