<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">De aangekondigde volgorde</title><desc id="desc">De aangekondigde volgorde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De aangekondigde volgorde</text><text x="44" y="113" class="ref">4 Ezra 7:26–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tekenen en verschijnen</text><text x="68" y="241" class="body">De bruid wordt zichtbaar; de Zoon Jezus</text><text x="68" y="284" class="body">verschijnt met wie bij Hem zijn.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vierhonderd jaar · vers 28–29</text><text x="68" y="433" class="body">De overgeblevenen zijn blij; daarna</text><text x="68" y="476" class="body">sterven Christus en allen die adem</text><text x="68" y="519" class="body">hebben.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zeven dagen · vers 30</text><text x="68" y="668" class="body">De wereld keert terug naar de oude</text><text x="68" y="711" class="body">stilte.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Ontwaken en oordeel · vers 31–35</text><text x="68" y="860" class="body">Aarde, stof en kamers geven hun doden</text><text x="68" y="903" class="body">terug; recht, waarheid en geloof houden</text><text x="68" y="946" class="body">stand.</text><text x="46" y="1039" class="note">De eigen volgorde en getallen van deze passage;</text><text x="46" y="1075" class="note">geen samenvoeging met de duizend jaar uit</text><text x="46" y="1111" class="note">Openbaring.</text></svg>