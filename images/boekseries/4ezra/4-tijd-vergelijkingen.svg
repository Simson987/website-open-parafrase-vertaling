<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Wat voorbij is en overblijft</title><desc id="desc">Wat voorbij is en overblijft met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat voorbij is en overblijft</text><text x="44" y="113" class="ref">4 Ezra 4:40–52</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geboorte · vers 40–42</text><text x="68" y="241" class="body">De voldragen schoot houdt het kind niet</text><text x="68" y="284" class="body">onbeperkt vast: beeld van de kamers van</text><text x="68" y="327" class="body">de zielen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vuur en rook · vers 48</text><text x="68" y="476" class="body">Het vuur trekt voorbij; daarna blijft</text><text x="68" y="519" class="body">rook over.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Regen en druppels · vers 49–50</text><text x="68" y="668" class="body">De grote regen is voorbij; enkele</text><text x="68" y="711" class="body">druppels blijven over.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De uitleg · vers 50–52</text><text x="68" y="860" class="body">De voorbijgegane maat is groter. Over</text><text x="68" y="903" class="body">Ezra’s levensduur weet de engel het</text><text x="68" y="946" class="body">niet.</text><text x="46" y="1039" class="note">Dit geeft de uitleg in deze passage weer en</text><text x="46" y="1075" class="note">berekent geen datum.</text></svg>