<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De wet en haar dragers</title><desc id="desc">De wet en haar dragers met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De wet en haar dragers</text><text x="44" y="113" class="ref">4 Ezra 9:31–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De belofte · vers 31</text><text x="68" y="241" class="body">God zaait Zijn wet; zij zal vrucht</text><text x="68" y="284" class="body">dragen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het probleem · vers 32–33</text><text x="68" y="433" class="body">De ontvangers bewaren haar niet en gaan</text><text x="68" y="476" class="body">verloren.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gewone voorbeelden · vers 34–35</text><text x="68" y="625" class="body">Bij zaad, schip en voedsel vergaat de</text><text x="68" y="668" class="body">inhoud met wat haar bevat.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het verschil · vers 36–37</text><text x="68" y="817" class="body">Wij en ons hart vergaan als wij</text><text x="68" y="860" class="body">zondigen, maar de wet blijft werkzaam.</text><text x="46" y="953" class="note">Het schema volgt Ezra’s redenering en</text><text x="46" y="989" class="note">onderscheidt het voorbeeld van zijn conclusie.</text></svg>