<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Ezra’s pleidooi</title><desc id="desc">Ezra’s pleidooi met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ezra’s pleidooi</text><text x="44" y="113" class="ref">4 Ezra 8:24–36</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verhoor Uw maaksel</text><text x="68" y="241" class="body">Luister naar het gebed van Uw dienaar.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zie de trouwe mensen</text><text x="68" y="390" class="body">Niet alleen de misdaden, maar wie Uw</text><text x="68" y="433" class="body">wil en getuigenissen bewaren.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Erken onze zwakheid</text><text x="68" y="582" class="body">Wij en onze voorouders hebben gebreken;</text><text x="68" y="625" class="body">niemand is zonder fouten.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Toon Uw goedheid</text><text x="68" y="774" class="body">Barmhartigheid wordt juist zichtbaar</text><text x="68" y="817" class="body">bij wie goede werken tekortkomen.</text><text x="46" y="910" class="note">Dit geeft het gebed in eigen onderdelen weer;</text><text x="46" y="946" class="note">het antwoord volgt vanaf vers 37.</text></svg>