<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Tekenen, wet en de vrouw</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tekenen, wet en de vrouw</text><text x="44" y="113" class="ref">4 Ezra 9:1–47</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–22 · Tijd en redding</text><text x="68" y="241" class="body">Tekenen tonen het bezoek;</text><text x="68" y="284" class="body">vergelijkingen van zaad, druif en stek.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">23–27 · Het veld Ardath</text><text x="68" y="433" class="body">Zeven dagen tussen bloemen, zonder</text><text x="68" y="476" class="body">vlees of wijn, met onophoudelijk gebed.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">28–37 · De wet en haar dragers</text><text x="68" y="625" class="body">Mensen vergaan, maar de wet blijft</text><text x="68" y="668" class="body">werkzaam: Ezra’s vraag.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">38–47 · Een rouwende vrouw</text><text x="68" y="817" class="body">Ezra vraagt naar haar verdriet; zij</text><text x="68" y="860" class="body">vertelt over haar langverwachte zoon.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>