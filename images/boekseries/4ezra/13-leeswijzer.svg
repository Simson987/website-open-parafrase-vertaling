<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De man en de vredige menigte</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De man en de vredige menigte</text><text x="44" y="113" class="ref">4 Ezra 13:1–58</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–13 · De droom</text><text x="68" y="241" class="body">Man uit zee, een berg, verzet en een</text><text x="68" y="284" class="body">tweede vredige menigte.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">14–28 · Vraag en uitleg</text><text x="68" y="433" class="body">Ezra vraagt naar de droom; de bewaarde</text><text x="68" y="476" class="body">Verlosser wordt verklaard.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">29–50 · De Zoon en de volken</text><text x="68" y="625" class="body">De Zoon op Sion; wet als vuur; de</text><text x="68" y="668" class="body">vredige menigte als terugkerende</text><text x="68" y="711" class="body">stammen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">51–58 · Verborgen en geopenbaard</text><text x="68" y="860" class="body">De zee verbeeldt het ondoorgrondelijke;</text><text x="68" y="903" class="body">Ezra prijst en wacht drie dagen.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>