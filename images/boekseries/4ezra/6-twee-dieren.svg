<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Behemoth en Leviathan</title><desc id="desc">Behemoth en Leviathan met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Behemoth en Leviathan</text><text x="44" y="113" class="ref">4 Ezra 6:49–52</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee namen</text><text x="68" y="241" class="body">Behemoth en Leviathan worden apart</text><text x="68" y="284" class="body">bestemd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waarom gescheiden?</text><text x="68" y="433" class="body">Het genoemde waterdeel kan volgens de</text><text x="68" y="476" class="body">tekst niet beide bevatten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Behemoth</text><text x="68" y="625" class="body">Ontvangt droog land, waar duizend</text><text x="68" y="668" class="body">bergen zijn.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Leviathan</text><text x="68" y="817" class="body">Ontvangt het zevende deel van het water</text><text x="68" y="860" class="body">en wordt voor Gods tijd bewaard.</text><text x="46" y="953" class="note">Verdeling in de vertelde kosmologie; geen</text><text x="46" y="989" class="note">identificatie als een bestaande diersoort of</text><text x="46" y="1025" class="note">moderne wereldkaart.</text></svg>