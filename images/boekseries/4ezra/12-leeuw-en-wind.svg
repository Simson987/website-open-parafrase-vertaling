<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Leeuw en gericht</title><desc id="desc">Leeuw en gericht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leeuw en gericht</text><text x="44" y="113" class="ref">4 Ezra 12:31–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het beeld · vers 31</text><text x="68" y="241" class="body">De leeuw komt uit het bos, spreekt en</text><text x="68" y="284" class="body">wijst de arend terecht.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De uitleg · vers 32</text><text x="68" y="433" class="body">De plaatselijke tekst noemt de wind die</text><text x="68" y="476" class="body">de Allerhoogste tot het einde bewaard</text><text x="68" y="519" class="body">heeft.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Gericht en redding</text><text x="68" y="668" class="body">Terechtwijzing en straf; het</text><text x="68" y="711" class="body">overgebleven volk uit de ellende</text><text x="68" y="754" class="body">bevrijd.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Ezra’s taak</text><text x="68" y="903" class="body">Schrijf het op, verberg het boek en</text><text x="68" y="946" class="body">leer het aan verstandigen die het</text><text x="68" y="989" class="body">kunnen bewaren.</text><text x="46" y="1082" class="note">De ongebruikelijke benaming wind blijft staan</text><text x="46" y="1118" class="note">zoals zij in deze hoofdstukweergave staat.</text></svg>