<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">De droom van de arend</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De droom van de arend</text><text x="44" y="113" class="ref">4 Ezra 11:1–46</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–11 · De verschijning</text><text x="68" y="241" class="body">Een arend uit zee met twaalf vleugels,</text><text x="68" y="284" class="body">drie koppen en acht kleinere veren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">12–35 · Macht verdwijnt</text><text x="68" y="433" class="body">Veren en koppen heersen na elkaar,</text><text x="68" y="476" class="body">verdwijnen of verslinden elkaar.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">36–46 · De leeuw spreekt</text><text x="68" y="625" class="body">De leeuw klaagt de macht van de arend</text><text x="68" y="668" class="body">aan; de aarde moet van zijn geweld rust</text><text x="68" y="711" class="body">krijgen.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>