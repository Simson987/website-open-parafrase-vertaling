<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Waarom de leeuw aanklaagt</title><desc id="desc">Waarom de leeuw aanklaagt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom de leeuw aanklaagt</text><text x="44" y="113" class="ref">4 Ezra 11:37–46</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onware regering</text><text x="68" y="241" class="body">De aarde is niet naar waarheid</text><text x="68" y="284" class="body">geregeerd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Geweld tegen mensen</text><text x="68" y="433" class="body">Zachtmoedigen onderdrukt en wie rustig</text><text x="68" y="476" class="body">leefden pijn gedaan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verwoesting en leugen</text><text x="68" y="625" class="body">Huizen en muren afgebroken; de leugen</text><text x="68" y="668" class="body">liefgehad.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het doel van de val</text><text x="68" y="817" class="body">De aarde moet weer op adem komen en</text><text x="68" y="860" class="body">hopen op oordeel en ontferming.</text><text x="46" y="953" class="note">Aanklacht in de droom; geen huidige machthebber</text><text x="46" y="989" class="note">wordt ermee gelijkgesteld.</text></svg>