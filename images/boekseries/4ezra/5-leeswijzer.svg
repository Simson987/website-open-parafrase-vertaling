<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Tekenen en Ezra’s verdriet</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tekenen en Ezra’s verdriet</text><text x="44" y="113" class="ref">4 Ezra 5:1–56</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–15 · Ontregeling en steun</text><text x="68" y="241" class="body">Tekenen worden aangekondigd; de</text><text x="68" y="284" class="body">geschrokken Ezra wordt door de engel</text><text x="68" y="327" class="body">opgericht.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">16–30 · Bezoek en gebed</text><text x="68" y="476" class="body">Salathiël komt, Ezra vast zeven dagen</text><text x="68" y="519" class="body">en vraagt naar het uitgekozen volk.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">31–40 · Grenzen aan begrip</text><text x="68" y="668" class="body">De engel vraagt of Ezra meer liefheeft</text><text x="68" y="711" class="body">dan de Maker en stelt onmogelijke</text><text x="68" y="754" class="body">opdrachten.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">41–56 · Tijden na elkaar</text><text x="68" y="903" class="body">Oordeel als kring, geboorten na elkaar</text><text x="68" y="946" class="body">en een ouder wordende wereld als</text><text x="68" y="989" class="body">vergelijking.</text><text x="46" y="1082" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1118" class="note">de plaatselijke versindeling.</text></svg>