<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Antwoord, hart en raad</title><desc id="desc">Thematische leeswijzer met gecontroleerde verwijzingen naar de afzonderlijke spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Antwoord, hart en raad</text><text x="44" y="113" class="ref">Spreuken 15:1–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Antwoord · 1–7, 23, 26–28</text><text x="68" y="241" class="body">Zacht, genezend, tijdig en doordacht</text><text x="68" y="284" class="body">spreken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hart en maaltijd · 13–17</text><text x="68" y="433" class="body">Blijdschap, verdriet, weinig met ontzag</text><text x="68" y="476" class="body">en groente met liefde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Omgang en raad · 18–22</text><text x="68" y="625" class="body">Twist tot rust brengen, rechte weg en</text><text x="68" y="668" class="body">overleg.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gebed en onderwijs · 8–12, 29–33</text><text x="68" y="817" class="body">Rechtvaardigheid zoeken, luisteren en</text><text x="68" y="860" class="body">nederigheid vóór eer.</text><text x="46" y="953" class="note">De genoemde thema’s keren verspreid in korte</text><text x="46" y="989" class="note">spreuken terug. De versverwijzingen verbinden de</text><text x="46" y="1025" class="note">beelden met hun eigen uitspraken; dit is geen</text><text x="46" y="1061" class="note">doorlopend gebeurtenissenverslag.</text></svg>