<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1084" viewBox="0 0 840 1084" role="img" aria-labelledby="title desc"><title id="title">Aandachtig en rechtvaardig</title><desc id="desc">Thematische leeswijzer met gecontroleerde verwijzingen naar de afzonderlijke spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1084" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aandachtig en rechtvaardig</text><text x="44" y="113" class="ref">Spreuken 14:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Huis en arbeid · 1–4, 23</text><text x="68" y="241" class="body">Opbouwen, oprechte weg en de kracht van</text><text x="68" y="284" class="body">de os.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waarnemen · 5–18</text><text x="68" y="433" class="body">Getuigenis, eigen verdriet, schijnbaar</text><text x="68" y="476" class="body">rechte weg en aandachtige stappen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Naaste · 20–22, 29–33</text><text x="68" y="625" class="body">Armenzorg, geduld en een rustig hart.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Volk en bestuur · 25–28, 34–35</text><text x="68" y="774" class="body">Betrouwbaar getuigen, toevlucht,</text><text x="68" y="817" class="body">gerechtigheid en verstandig dienen.</text><text x="46" y="910" class="note">De genoemde thema’s keren verspreid in korte</text><text x="46" y="946" class="note">spreuken terug. De versverwijzingen verbinden de</text><text x="46" y="982" class="note">beelden met hun eigen uitspraken; dit is geen</text><text x="46" y="1018" class="note">doorlopend gebeurtenissenverslag.</text></svg>