<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Plannen, recht en beheersing</title><desc id="desc">Thematische leeswijzer met gecontroleerde verwijzingen naar de afzonderlijke spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plannen, recht en beheersing</text><text x="44" y="113" class="ref">Spreuken 16:1–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Plannen · 1–9</text><text x="68" y="241" class="body">Eigen voornemens, toetsing,</text><text x="68" y="284" class="body">toevertrouwen en bepaalde stappen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Koning en recht · 10–15</text><text x="68" y="433" class="body">Eerlijk vonnis, zuiver gewicht,</text><text x="68" y="476" class="body">gerechtigheid en gunst.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Woorden en weg · 16–30</text><text x="68" y="625" class="body">Wijsheid, nederigheid, honingwoorden en</text><text x="68" y="668" class="body">roddel tegenover inzicht.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Kroon en beheersing · 31–33</text><text x="68" y="817" class="body">Grijze haren, geduld boven heldenkracht</text><text x="68" y="860" class="body">en het geworpen lot.</text><text x="46" y="953" class="note">De genoemde thema’s keren verspreid in korte</text><text x="46" y="989" class="note">spreuken terug. De versverwijzingen verbinden de</text><text x="46" y="1025" class="note">beelden met hun eigen uitspraken; dit is geen</text><text x="46" y="1061" class="note">doorlopend gebeurtenissenverslag.</text></svg>