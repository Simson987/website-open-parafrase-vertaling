<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Vergelijkingen en grenzen</title><desc id="desc">Leeswijzer met gecontroleerde verwijzingen naar de besproken onderwerpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vergelijkingen en grenzen</text><text x="44" y="113" class="ref">Spreuken 25:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 1</text><text x="68" y="241" class="body">Spreuken van Salomo, overgeschreven</text><text x="68" y="284" class="body">door de mannen van Hizkia.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Recht en terughoudendheid · 2–10</text><text x="68" y="433" class="body">Onderzoeken, gerechtigheid, bescheiden</text><text x="68" y="476" class="body">plaats en zorgvuldig geschil.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tijdig en trouw · 11–15, 25</text><text x="68" y="625" class="body">Gouden appels, luisterend oor,</text><text x="68" y="668" class="body">betrouwbare bode en goed nieuws.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Maat en naaste · 16–28</text><text x="68" y="817" class="body">Niet te veel, geheimen bewaren, vijand</text><text x="68" y="860" class="body">eten geven en zelfbeheersing als</text><text x="68" y="903" class="body">stadsmuur.</text><text x="46" y="996" class="note">De versgroepen verbinden terugkerende</text><text x="46" y="1032" class="note">onderwerpen in het onderricht. Beeldspraak en</text><text x="46" y="1068" class="note">waarschuwingen zijn geen extra historische</text><text x="46" y="1104" class="note">gebeurtenissen.</text></svg>