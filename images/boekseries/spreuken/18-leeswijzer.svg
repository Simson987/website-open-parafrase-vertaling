<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Luisteren en verbondenheid</title><desc id="desc">Thematische leeswijzer met gecontroleerde verwijzingen naar de afzonderlijke spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Luisteren en verbondenheid</text><text x="44" y="113" class="ref">Spreuken 18:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Woorden en luisteren · 1–8, 13, 15</text><text x="68" y="241" class="body">Eigen zin, roddel, strik, inzicht en</text><text x="68" y="284" class="body">eerst luisteren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Veiligheid · 10–12</text><text x="68" y="433" class="body">Sterke toren tegenover rijkdom als</text><text x="68" y="476" class="body">vermeende hoge muur.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hoor beide kanten · 17–18</text><text x="68" y="625" class="body">De eerste pleiter en vervolgens de</text><text x="68" y="668" class="body">doorvragende tegenpartij.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Relaties · 19–24</text><text x="68" y="817" class="body">Gekrenkte broer, tongvrucht, huwelijk</text><text x="68" y="860" class="body">en trouwe vriendschap.</text><text x="46" y="953" class="note">De genoemde thema’s keren verspreid in korte</text><text x="46" y="989" class="note">spreuken terug. De versverwijzingen verbinden de</text><text x="46" y="1025" class="note">beelden met hun eigen uitspraken; dit is geen</text><text x="46" y="1061" class="note">doorlopend gebeurtenissenverslag.</text></svg>