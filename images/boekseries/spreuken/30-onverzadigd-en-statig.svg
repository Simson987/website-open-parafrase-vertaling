<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Onverzadigd en statig</title><desc id="desc">De drie andere viertallen met tekstueel gecontroleerde onderdelen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onverzadigd en statig</text><text x="44" y="113" class="ref">Spreuken 30:15–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nooit genoeg · 15–16</text><text x="68" y="241" class="body">Dodenrijk, gesloten moederschoot,</text><text x="68" y="284" class="body">dorstige aarde en vuur.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aarde beeft · 21–23</text><text x="68" y="433" class="body">Slaaf als koning, verzadigde dwaas,</text><text x="68" y="476" class="body">getrouwde ongeliefde vrouw en slavin in</text><text x="68" y="519" class="body">de plaats van meesteres.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Statige gang · 29–31</text><text x="68" y="668" class="body">Leeuw, trots stappende haan, bok en</text><text x="68" y="711" class="body">koning met zijn leger.</text><text x="46" y="804" class="note">Elke reeks telt vier verschillende onderdelen,</text><text x="46" y="840" class="note">ingeleid met drie, ja vier. De voorbeelden zijn</text><text x="46" y="876" class="note">beschrijvingen in de wijsheidsrede.</text></svg>