<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Eerlijkheid, geduld en raad</title><desc id="desc">Thematische leeswijzer met gecontroleerde verwijzingen naar de afzonderlijke spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eerlijkheid, geduld en raad</text><text x="44" y="113" class="ref">Spreuken 19:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Arm en eerlijk · 1, 4–7, 17, 22</text><text x="68" y="241" class="body">Verlaten worden en ontvangen</text><text x="68" y="284" class="body">ontferming; trouw boven bezit.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Getuigen en raad · 5, 8–9, 20–21, 28</text><text x="68" y="433" class="body">Inzicht, ware woorden en een blijvende</text><text x="68" y="476" class="body">raad tegenover vele plannen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Geduld en gezin · 11–18, 23–27</text><text x="68" y="625" class="body">Overtreding voorbijgaan, woede, trouw</text><text x="68" y="668" class="body">en tijdig opvoeden.</text><text x="46" y="761" class="note">De genoemde thema’s keren verspreid in korte</text><text x="46" y="797" class="note">spreuken terug. De versverwijzingen verbinden de</text><text x="46" y="833" class="note">beelden met hun eigen uitspraken; dit is geen</text><text x="46" y="869" class="note">doorlopend gebeurtenissenverslag.</text></svg>