<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1021" viewBox="0 0 840 1021" role="img" aria-labelledby="title desc"><title id="title">Naam, onderwijs en grens</title><desc id="desc">Leeswijzer met gecontroleerde verwijzingen naar de besproken onderwerpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1021" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Naam, onderwijs en grens</text><text x="44" y="113" class="ref">Spreuken 22:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Naam en omgang · 1–16</text><text x="68" y="241" class="body">Arm en rijk, gevaar, brood delen,</text><text x="68" y="284" class="body">schulden en een goede naam.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Luister · 17–21</text><text x="68" y="433" class="body">Woorden van wijzen bewaren om</text><text x="68" y="476" class="body">betrouwbaar te antwoorden en te</text><text x="68" y="519" class="body">vertrouwen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Concrete raad · 22–29</text><text x="68" y="668" class="body">Armen niet beroven, driftig gezelschap</text><text x="68" y="711" class="body">mijden, geen borgstelling, grenssteen</text><text x="68" y="754" class="body">bewaren en bekwaam werk.</text><text x="46" y="847" class="note">De versgroepen verbinden terugkerende</text><text x="46" y="883" class="note">onderwerpen in het onderricht. Beeldspraak en</text><text x="46" y="919" class="note">waarschuwingen zijn geen extra historische</text><text x="46" y="955" class="note">gebeurtenissen.</text></svg>