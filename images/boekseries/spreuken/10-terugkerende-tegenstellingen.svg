<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Terugkerende tegenstellingen</title><desc id="desc">Thematische leeswijzer met gecontroleerde verwijzingen naar korte spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Terugkerende tegenstellingen</text><text x="44" y="113" class="ref">Spreuken 10:1–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Werk en bezit · 2–5, 15–16, 22</text><text x="68" y="241" class="body">Oneerlijke winst, ijver en oogst; bezit</text><text x="68" y="284" class="body">en ontvangen zegen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mond en lippen · 6, 8, 10–14</text><text x="68" y="433" class="body">Geweld of een levensbron; kennis of</text><text x="68" y="476" class="body">onbezonnen spreken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Woorden · 18–21, 31–32</text><text x="68" y="625" class="body">Haat, leugen en veelpraterij tegenover</text><text x="68" y="668" class="body">wijsheid en voedende woorden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Weg en verwachting · 9, 17, 24–30</text><text x="68" y="817" class="body">Veilig lopen, onderricht, vrees, hoop</text><text x="68" y="860" class="body">en vaststaan.</text><text x="46" y="953" class="note">Dit hoofdstuk bevat korte spreuken naast elkaar.</text><text x="46" y="989" class="note">De thema’s keren op verschillende plaatsen terug</text><text x="46" y="1025" class="note">en vormen geen doorlopend historisch verhaal.</text></svg>