<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Wijsheid zien en doen</title><desc id="desc">Leeswijzer met gecontroleerde verwijzingen naar de besproken onderwerpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijsheid zien en doen</text><text x="44" y="113" class="ref">Spreuken 24:1–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sterkte en hulp · 1–12</text><text x="68" y="241" class="body">Wijs bouwen, overleggen en bedreigde</text><text x="68" y="284" class="body">mensen redden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hoop en recht · 13–29</text><text x="68" y="433" class="body">Honing, weer opstaan, geen leedvermaak,</text><text x="68" y="476" class="body">eerlijk recht en eerst de akker.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Waarnemen · 30–34</text><text x="68" y="625" class="body">Distels, onkruid en een afgebroken</text><text x="68" y="668" class="body">muur: kijken en er een les uit trekken.</text><text x="46" y="761" class="note">De versgroepen verbinden terugkerende</text><text x="46" y="797" class="note">onderwerpen in het onderricht. Beeldspraak en</text><text x="46" y="833" class="note">waarschuwingen zijn geen extra historische</text><text x="46" y="869" class="note">gebeurtenissen.</text></svg>