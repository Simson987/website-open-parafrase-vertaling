<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Het werk van haar handen</title><desc id="desc">Samenhang van de onderscheiden werkzaamheden en de slotwaardering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het werk van haar handen</text><text x="44" y="113" class="ref">Spreuken 31:10–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vertrouwen · 10–12</text><text x="68" y="241" class="body">Meer waard dan robijnen; haar man</text><text x="68" y="284" class="body">vertrouwt op haar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Werk en beleid · 13–19, 21–24</text><text x="68" y="433" class="body">Textiel, voedsel, akker, wijngaard,</text><text x="68" y="476" class="body">handel en kleding.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zorg en woorden · 20, 25–27</text><text x="68" y="625" class="body">Open handen, waardigheid, wijsheid en</text><text x="68" y="668" class="body">vriendelijk onderwijs.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Waardering · 28–31</text><text x="68" y="817" class="body">Gezin prijst haar; ontzag en de vrucht</text><text x="68" y="860" class="body">van haar werk krijgen lof.</text><text x="46" y="953" class="note">Het portret omvat ondernemerschap, zorg,</text><text x="46" y="989" class="note">onderwijs en ontzag. Het slot vraagt haar het</text><text x="46" y="1025" class="note">resultaat van haar eigen handen te geven.</text></svg>