<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Recht, plannen en geven</title><desc id="desc">Leeswijzer met gecontroleerde verwijzingen naar de besproken onderwerpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Recht, plannen en geven</text><text x="44" y="113" class="ref">Spreuken 21:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Recht · 1–3, 7–8, 15</text><text x="68" y="241" class="body">Koningshart, gewogen harten en recht</text><text x="68" y="284" class="body">boven offer.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Werk en bezit · 5–6, 17, 20, 25–26</text><text x="68" y="433" class="body">IJver, valse rijkdom, verbruik en</text><text x="68" y="476" class="body">vrijgevigheid.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Woorden en vertrouwen · 23–24, 28–31</text><text x="68" y="625" class="body">Mond bewaren, waar getuigen en de grens</text><text x="68" y="668" class="body">van menselijke plannen.</text><text x="46" y="761" class="note">De versgroepen verbinden terugkerende</text><text x="46" y="797" class="note">onderwerpen in het onderricht. Beeldspraak en</text><text x="46" y="833" class="note">waarschuwingen zijn geen extra historische</text><text x="46" y="869" class="note">gebeurtenissen.</text></svg>