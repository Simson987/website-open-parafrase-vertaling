<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Als, dan en bewaring</title><desc id="desc">De als-danstructuur en de twee genoemde gevaren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Als, dan en bewaring</text><text x="44" y="113" class="ref">Spreuken 2:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Als · 1–4</text><text x="68" y="241" class="body">Aannemen, bewaren, luisteren, roepen en</text><text x="68" y="284" class="body">zoeken als een schat.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dan · 5–11</text><text x="68" y="433" class="body">Ontzag, gegeven wijsheid, recht en</text><text x="68" y="476" class="body">beschermend inzicht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Van twee gevaren · 12–19</text><text x="68" y="625" class="body">De man met valse woorden en de</text><text x="68" y="668" class="body">verbondsvergetende vrouw.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De goede weg · 20–22</text><text x="68" y="817" class="body">Goede mensen en rechtvaardigen</text><text x="68" y="860" class="body">tegenover trouweloosheid.</text><text x="46" y="953" class="note">De opeenvolgende voorwaarden laten actief zoeken</text><text x="46" y="989" class="note">zien. Beide gevaren horen bij de waarschuwing</text><text x="46" y="1025" class="note">voor een verkeerde weg.</text></svg>