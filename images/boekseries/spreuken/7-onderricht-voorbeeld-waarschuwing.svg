<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Voorbeeld en waarschuwing</title><desc id="desc">De vertelsituatie, overreding en uitleg in het onderricht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voorbeeld en waarschuwing</text><text x="44" y="113" class="ref">Spreuken 7:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bewaren · 1–5</text><text x="68" y="241" class="body">Woorden als oogappel, aan vingers en op</text><text x="68" y="284" class="body">het hart; wijsheid als zus.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het voorbeeld · 6–13</text><text x="68" y="433" class="body">Een waarnemer bij het raam ziet een</text><text x="68" y="476" class="body">onervaren jongeman in de schemering.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De overreding · 14–21</text><text x="68" y="625" class="body">Offers, bed, geuren en de afwezige</text><text x="68" y="668" class="body">echtgenoot worden als argumenten</text><text x="68" y="711" class="body">gebruikt.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Gevolg en slot · 22–27</text><text x="68" y="860" class="body">Os, geboeide dwaas en vogel bij de</text><text x="68" y="903" class="body">strik; blijf van die weg weg.</text><text x="46" y="996" class="note">Het voorbeeld staat binnen een waarschuwing voor</text><text x="46" y="1032" class="note">overspel. De diervergelijkingen beschrijven</text><text x="46" y="1068" class="note">onbesefte gevolgen en vertellen geen extra</text><text x="46" y="1104" class="note">dierenverhaal.</text></svg>