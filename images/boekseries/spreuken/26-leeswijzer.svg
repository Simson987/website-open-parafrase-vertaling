<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Dwaasheid, luiheid en roddel</title><desc id="desc">Leeswijzer met gecontroleerde verwijzingen naar de besproken onderwerpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dwaasheid, luiheid en roddel</text><text x="44" y="113" class="ref">Spreuken 26:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dwaasheid · 1–12</text><text x="68" y="241" class="body">Onpassende eer, antwoorden en verkeerd</text><text x="68" y="284" class="body">gebruikte spreuken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Luiheid · 13–16</text><text x="68" y="433" class="body">Een vermeende leeuw, draaien op bed en</text><text x="68" y="476" class="body">de hand in de schotel.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ruzie en bedrog · 17–28</text><text x="68" y="625" class="body">Niet bemoeien, geen schadelijk grapje,</text><text x="68" y="668" class="body">vuur zonder hout en glazuur over slecht</text><text x="68" y="711" class="body">materiaal.</text><text x="46" y="804" class="note">De versgroepen verbinden terugkerende</text><text x="46" y="840" class="note">onderwerpen in het onderricht. Beeldspraak en</text><text x="46" y="876" class="note">waarschuwingen zijn geen extra historische</text><text x="46" y="912" class="note">gebeurtenissen.</text></svg>