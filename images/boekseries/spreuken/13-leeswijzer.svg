<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1084" viewBox="0 0 840 1084" role="img" aria-labelledby="title desc"><title id="title">Hoop, bezit en omgang</title><desc id="desc">Thematische leeswijzer met gecontroleerde verwijzingen naar de afzonderlijke spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1084" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoop, bezit en omgang</text><text x="44" y="113" class="ref">Spreuken 13:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mond en opvoeding · 1–3, 13–18</text><text x="68" y="241" class="body">Luisteren, woorden bewaken en</text><text x="68" y="284" class="body">terechtwijzing aannemen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Werk en bezit · 4, 7–11, 22–23</text><text x="68" y="433" class="body">Schijn en werkelijkheid, geleidelijke</text><text x="68" y="476" class="body">groei, erfdeel en onrecht aan armen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hoop en omgang · 12, 19–21</text><text x="68" y="625" class="body">Vervuld verlangen en het gezelschap van</text><text x="68" y="668" class="body">wijzen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gezin en tafel · 24–25</text><text x="68" y="817" class="body">Tijdige opvoeding en genoeg eten.</text><text x="46" y="910" class="note">De genoemde thema’s keren verspreid in korte</text><text x="46" y="946" class="note">spreuken terug. De versverwijzingen verbinden de</text><text x="46" y="982" class="note">beelden met hun eigen uitspraken; dit is geen</text><text x="46" y="1018" class="note">doorlopend gebeurtenissenverslag.</text></svg>