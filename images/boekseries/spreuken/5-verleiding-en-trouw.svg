<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Verleiding en trouw</title><desc id="desc">De tegenstelling tussen aantrekkelijke woorden, gevolgen en huwelijkstrouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verleiding en trouw</text><text x="44" y="113" class="ref">Spreuken 5:3–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin en afloop · 3–6</text><text x="68" y="241" class="body">Honing en olie tegenover alsem, zwaard</text><text x="68" y="284" class="body">en een doodlopende weg.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Afstand · 7–14</text><text x="68" y="433" class="body">Ver van de deur blijven; berouw over</text><text x="68" y="476" class="body">afgewezen onderricht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Eigen bron · 15–20</text><text x="68" y="625" class="body">Water, blij zijn met de vrouw van je</text><text x="68" y="668" class="body">jeugd en de hinde als vergelijking.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Eigen wegen · 21–23</text><text x="68" y="817" class="body">Open voor de HEERE; schuld als touwen</text><text x="68" y="860" class="body">die vasthouden.</text><text x="46" y="953" class="note">Bron en hinde verwoorden trouw en liefde binnen</text><text x="46" y="989" class="note">het huwelijk. Het zijn vergelijkingen in de</text><text x="46" y="1025" class="note">aansporing, geen letterlijk verslag van een</text><text x="46" y="1061" class="note">waterbezitgeschil.</text></svg>