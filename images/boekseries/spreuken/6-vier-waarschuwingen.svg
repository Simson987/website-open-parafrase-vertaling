<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Vier waarschuwingen</title><desc id="desc">De vier onderwerpen en hun eigen waarschuwing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier waarschuwingen</text><text x="44" y="113" class="ref">Spreuken 6:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Borgstelling · 1–5</text><text x="68" y="241" class="body">Verstrikt door eigen woorden; ga</text><text x="68" y="284" class="body">dringend om vrijmaking vragen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Luiheid · 6–11</text><text x="68" y="433" class="body">Leer van de mier die op tijd voedsel</text><text x="68" y="476" class="body">verzamelt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bedrog · 12–19</text><text x="68" y="625" class="body">Ruzie zaaien en de opsomming van zeven</text><text x="68" y="668" class="body">verfoeide dingen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Trouw · 20–35</text><text x="68" y="817" class="body">Ouderlijk onderricht als lamp; vuur en</text><text x="68" y="860" class="body">kolen als waarschuwing bij overspel.</text><text x="46" y="953" class="note">De losse aansporingen hebben elk een eigen</text><text x="46" y="989" class="note">onderwerp. De mier is een voorbeeld voor</text><text x="46" y="1025" class="note">voorbereiding en arbeid.</text></svg>