<svg xmlns="http://www.w3.org/2000/svg" width="840" height="856" viewBox="0 0 840 856" role="img" aria-labelledby="title desc"><title id="title">Twee gebeden</title><desc id="desc">De twee gevraagde dingen en hun redenen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="856" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee gebeden</text><text x="44" y="113" class="ref">Spreuken 30:7–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste · 8</text><text x="68" y="241" class="body">Leegte en leugentaal ver weg.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tweede · 8</text><text x="68" y="390" class="body">Geen armoede en geen rijkdom; het</text><text x="68" y="433" class="body">nodige brood.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Reden · 9</text><text x="68" y="582" class="body">Niet door overvloed verloochenen en</text><text x="68" y="625" class="body">niet door gebrek tot diefstal komen.</text><text x="46" y="718" class="note">De twee vragen worden samen gemotiveerd. Het</text><text x="46" y="754" class="note">brood verwoordt genoeg ontvangen, tussen beide</text><text x="46" y="790" class="note">genoemde gevaren.</text></svg>