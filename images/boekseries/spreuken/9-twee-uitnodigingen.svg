<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Twee uitnodigingen</title><desc id="desc">Vergelijking van de twee uitnodigingen met de les over terechtwijzing ertussen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee uitnodigingen</text><text x="44" y="113" class="ref">Spreuken 9:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wijsheid · 1–6</text><text x="68" y="241" class="body">Huis met zeven zuilen, gedekte tafel,</text><text x="68" y="284" class="body">brood en wijn: leef en ga de weg van</text><text x="68" y="327" class="body">inzicht.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Reactie op onderwijs · 7–12</text><text x="68" y="476" class="body">Spotter en wijze reageren anders;</text><text x="68" y="519" class="body">ontzag is het begin van wijsheid.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Dwaasheid · 13–18</text><text x="68" y="668" class="body">Dezelfde oproep aan de onervarene, maar</text><text x="68" y="711" class="body">met gestolen water en geheim brood; een</text><text x="68" y="754" class="body">doodlopend gevolg.</text><text x="46" y="847" class="note">Beide uitnodigingen richten zich tot de</text><text x="46" y="883" class="note">onervarene. De overeenkomst in woorden maakt het</text><text x="46" y="919" class="note">verschil in gevolg des te scherper.</text></svg>