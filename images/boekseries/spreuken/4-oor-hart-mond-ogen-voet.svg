<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Oor, hart, mond, ogen, voet</title><desc id="desc">Exacte lichaamsbeelden en de erbij behorende opdrachten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oor, hart, mond, ogen, voet</text><text x="44" y="113" class="ref">Spreuken 4:20–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oor en ogen · 20–21</text><text x="68" y="241" class="body">Luisteren en de woorden voor ogen</text><text x="68" y="284" class="body">houden.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hart · 21–23</text><text x="68" y="433" class="body">Bewaren; daaruit komt het leven voort.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Mond · 24</text><text x="68" y="582" class="body">Valse taal en bedrieglijke lippen</text><text x="68" y="625" class="body">wegdoen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Ogen en voet · 25–27</text><text x="68" y="774" class="body">Recht vooruit; letten op de weg en</text><text x="68" y="817" class="body">wegblijven van het kwaad.</text><text x="46" y="910" class="note">Dit overzicht volgt de genoemde lichaamsdelen en</text><text x="46" y="946" class="note">hun opdrachten. Het hart is hier het beeld voor</text><text x="46" y="982" class="note">het innerlijke leven, geen medisch schema.</text></svg>