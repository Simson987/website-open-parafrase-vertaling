<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Wortel, zorg en woorden</title><desc id="desc">Thematische leeswijzer met gecontroleerde verwijzingen naar de afzonderlijke spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wortel, zorg en woorden</text><text x="44" y="113" class="ref">Spreuken 12:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wortel en huis · 3–7, 12</text><text x="68" y="241" class="body">Standhouden en vrucht dragen tegenover</text><text x="68" y="284" class="body">bedrog.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zorg en arbeid · 9–11, 24, 27</text><text x="68" y="433" class="body">Eigen werk, dierenzorg en brood van de</text><text x="68" y="476" class="body">akker.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Woorden · 13–23, 25–26</text><text x="68" y="625" class="body">Valstrik of redding; waarheid,</text><text x="68" y="668" class="body">genezende taal, goed woord en raad.</text><text x="46" y="761" class="note">De genoemde thema’s keren verspreid in korte</text><text x="46" y="797" class="note">spreuken terug. De versverwijzingen verbinden de</text><text x="46" y="833" class="note">beelden met hun eigen uitspraken; dit is geen</text><text x="46" y="869" class="note">doorlopend gebeurtenissenverslag.</text></svg>