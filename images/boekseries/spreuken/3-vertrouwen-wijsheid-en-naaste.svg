<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Vertrouwen, wijsheid en naaste</title><desc id="desc">Vier gedeelten die vertrouwen, waarde en direct goed handelen verbinden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vertrouwen, wijsheid en naaste</text><text x="44" y="113" class="ref">Spreuken 3:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bewaren en vertrouwen · 1–12</text><text x="68" y="241" class="body">Trouw, liefde, heel het hart,</text><text x="68" y="284" class="body">eerstelingen en goede terechtwijzing.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waarde · 13–20</text><text x="68" y="433" class="body">Wijsheid boven goud en robijnen;</text><text x="68" y="476" class="body">levensboom en scheppingswijsheid.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Veilig gaan · 21–26</text><text x="68" y="625" class="body">Bedachtzaamheid, slaap en bewaring voor</text><text x="68" y="668" class="body">de val.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Goed doen · 27–35</text><text x="68" y="817" class="body">Niet uitstellen, geen kwaad of ruzie;</text><text x="68" y="860" class="body">nederigheid en oprechtheid.</text><text x="46" y="953" class="note">Het hoofdstuk verbindt vertrouwen met heel</text><text x="46" y="989" class="note">concreet handelen tegenover de naaste. Rijkdom</text><text x="46" y="1025" class="note">is niet de enige vergelijking voor wijsheid.</text></svg>