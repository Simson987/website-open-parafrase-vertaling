<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Moederraad aan Lemuël</title><desc id="desc">Spreker, waarschuwing en de concrete bestuursopdracht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Moederraad aan Lemuël</text><text x="44" y="113" class="ref">Spreuken 31:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreker · 1–2</text><text x="68" y="241" class="body">De moeder onderwijst koning Lemuël,</text><text x="68" y="284" class="body">haar zoon.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waarschuwing · 3–7</text><text x="68" y="433" class="body">Geen kracht verspillen of door drank</text><text x="68" y="476" class="body">wet en recht vergeten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Opdracht · 8–9</text><text x="68" y="625" class="body">Spreek voor wie niet kan spreken; kom</text><text x="68" y="668" class="body">op voor armen en verdrukten.</text><text x="46" y="761" class="note">Het openingsonderricht richt zich tot de koning.</text><text x="46" y="797" class="note">Het onderscheidt zich van het daaropvolgende</text><text x="46" y="833" class="note">portret van de sterke vrouw.</text></svg>