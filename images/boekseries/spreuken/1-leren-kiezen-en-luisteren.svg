<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Leren, kiezen en luisteren</title><desc id="desc">Doel, twee oproepen en de gevolgen van gekozen wegen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leren, kiezen en luisteren</text><text x="44" y="113" class="ref">Spreuken 1:1–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Doel · 1–7</text><text x="68" y="241" class="body">Wijsheid en opvoeding, recht en</text><text x="68" y="284" class="body">inzicht; ontzag als begin.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ouders · 8–9</text><text x="68" y="433" class="body">Onderwijs van vader en moeder als krans</text><text x="68" y="476" class="body">en ketting.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Niet meegaan · 10–19</text><text x="68" y="625" class="body">Oneerlijke winst, één beurs en een weg</text><text x="68" y="668" class="body">die het eigen leven bedreigt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wijsheid roept · 20–33</text><text x="68" y="817" class="body">Openbare oproep, afgewezen raad,</text><text x="68" y="860" class="body">gevolgen en veiligheid bij luisteren.</text><text x="46" y="953" class="note">Wijsheid spreekt als een persoon in de straten.</text><text x="46" y="989" class="note">Dat is personificatie binnen het onderricht; de</text><text x="46" y="1025" class="note">tekst noemt hier geen nieuwe historische</text><text x="46" y="1061" class="note">lerares.</text></svg>