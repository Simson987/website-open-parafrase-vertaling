<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">De sprekende Wijsheid</title><desc id="desc">De vier gedeelten van de rede van Wijsheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De sprekende Wijsheid</text><text x="44" y="113" class="ref">Spreuken 8:1–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oproep · 1–11</text><text x="68" y="241" class="body">Hoogten, kruispunt en poort; eerlijke</text><text x="68" y="284" class="body">woorden boven kostbaarheden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Recht en beleid · 12–21</text><text x="68" y="433" class="body">Raad, regeren, gerechtigheid en de</text><text x="68" y="476" class="body">belofte aan wie zoeken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Aan het begin · 22–31</text><text x="68" y="625" class="body">Vóór diepten, bergen en aarde; bij</text><text x="68" y="668" class="body">hemel, zeegrens en vreugde in mensen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Luister · 32–36</text><text x="68" y="817" class="body">Bewaar de wegen; wachten bij de deur,</text><text x="68" y="860" class="body">leven en gunst.</text><text x="46" y="953" class="note">Wijsheid spreekt in de ik-vorm als</text><text x="46" y="989" class="note">personificatie. Het schema houdt de</text><text x="46" y="1025" class="note">verschillende fasen bij deze rede zonder een</text><text x="46" y="1061" class="note">menselijke scheppingsfiguur te verzinnen.</text></svg>