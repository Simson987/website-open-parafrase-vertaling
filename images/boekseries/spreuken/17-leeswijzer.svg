<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Rust, recht en vriendschap</title><desc id="desc">Thematische leeswijzer met gecontroleerde verwijzingen naar de afzonderlijke spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rust, recht en vriendschap</text><text x="44" y="113" class="ref">Spreuken 17:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rust en verbondenheid · 1, 6, 9, 17</text><text x="68" y="241" class="body">Droge korst, kleinkinderen, toedekken</text><text x="68" y="284" class="body">en de vriend in nood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Toetsing · 3, 10, 22</text><text x="68" y="433" class="body">Smeltkroes, goede terechtwijzing en een</text><text x="68" y="476" class="body">blij hart.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Recht · 5, 15, 23, 26</text><text x="68" y="625" class="body">Arme niet bespotten; rechtvaardig</text><text x="68" y="668" class="body">oordeel zonder omkoping.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ruzie en woorden · 14, 19–20, 27–28</text><text x="68" y="817" class="body">Stop vóór de doorbraak; koel blijven en</text><text x="68" y="860" class="body">woorden inhouden.</text><text x="46" y="953" class="note">De genoemde thema’s keren verspreid in korte</text><text x="46" y="989" class="note">spreuken terug. De versverwijzingen verbinden de</text><text x="46" y="1025" class="note">beelden met hun eigen uitspraken; dit is geen</text><text x="46" y="1061" class="note">doorlopend gebeurtenissenverslag.</text></svg>