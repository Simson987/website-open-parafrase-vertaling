<svg xmlns="http://www.w3.org/2000/svg" width="840" height="750" viewBox="0 0 840 750" role="img" aria-labelledby="title desc"><title id="title">Vier wegen, vier kleine dieren</title><desc id="desc">Twee exact getelde opsommingen met de genoemde wegen en dieren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="750" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier wegen, vier kleine dieren</text><text x="44" y="113" class="ref">Spreuken 30:18–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vier wegen · 18–19</text><text x="68" y="241" class="body">Arend in de lucht; slang op rots; schip</text><text x="68" y="284" class="body">op zee; man bij een jonge vrouw.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vier kleine dieren · 24–28</text><text x="68" y="433" class="body">Mieren: zomervoorraad; klipdassen:</text><text x="68" y="476" class="body">rotswoning; sprinkhanen: geordende</text><text x="68" y="519" class="body">zwermen; hagedis: paleizen.</text><text x="46" y="612" class="note">De twee reeksen hebben elk vier onderdelen. Ze</text><text x="46" y="648" class="note">staan op verschillende plaatsen in het hoofdstuk</text><text x="46" y="684" class="note">en vormen geen één-op-éénverklaring van elkaar.</text></svg>