<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Eerlijkheid en macht</title><desc id="desc">Leeswijzer met gecontroleerde verwijzingen naar de besproken onderwerpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eerlijkheid en macht</text><text x="44" y="113" class="ref">Spreuken 28:1–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Recht · 1–16</text><text x="68" y="241" class="body">Moed, orde, arme en rijke, wet,</text><text x="68" y="284" class="body">belijdenis en een onderdrukkende</text><text x="68" y="327" class="body">heerser.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Werk en bezit · 18–22</text><text x="68" y="476" class="body">Eerlijkheid, akkerwerk, betrouwbaarheid</text><text x="68" y="519" class="body">en de haast naar rijkdom.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Raad en geven · 23–28</text><text x="68" y="668" class="body">Terechtwijzen, ouders niet bestelen,</text><text x="68" y="711" class="body">wijs leven en armen niet voorbijzien.</text><text x="46" y="804" class="note">De versgroepen verbinden terugkerende</text><text x="46" y="840" class="note">onderwerpen in het onderricht. Beeldspraak en</text><text x="46" y="876" class="note">waarschuwingen zijn geen extra historische</text><text x="46" y="912" class="note">gebeurtenissen.</text></svg>