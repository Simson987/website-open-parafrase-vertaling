<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Maat, toekomst en luisteren</title><desc id="desc">Leeswijzer met gecontroleerde verwijzingen naar de besproken onderwerpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Maat, toekomst en luisteren</text><text x="44" y="113" class="ref">Spreuken 23:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tafel en bezit · 1–11</text><text x="68" y="241" class="body">Zelfbeheersing, vluchtige rijkdom en de</text><text x="68" y="284" class="body">akker van wezen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hart en ouders · 12–28</text><text x="68" y="433" class="body">Opvoeding, toekomsthoop, waarheid en</text><text x="68" y="476" class="body">respect voor oudere ouders.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Drank · 29–35</text><text x="68" y="625" class="body">Verdriet en ruzie; wijn die ten slotte</text><text x="68" y="668" class="body">als een slang bijt en het waarnemen</text><text x="68" y="711" class="body">verstoort.</text><text x="46" y="804" class="note">De versgroepen verbinden terugkerende</text><text x="46" y="840" class="note">onderwerpen in het onderricht. Beeldspraak en</text><text x="46" y="876" class="note">waarschuwingen zijn geen extra historische</text><text x="46" y="912" class="note">gebeurtenissen.</text></svg>