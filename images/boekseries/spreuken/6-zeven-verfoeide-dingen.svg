<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1366" viewBox="0 0 840 1366" role="img" aria-labelledby="title desc"><title id="title">Zeven verfoeide dingen</title><desc id="desc">Exact getelde lijst van de zeven onderdelen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1366" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeven verfoeide dingen</text><text x="44" y="113" class="ref">Spreuken 6:16–19</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1 · Trotse ogen</text><text x="68" y="241" class="body">Vers 17.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">2 · Valse tong</text><text x="68" y="390" class="body">Vers 17.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">3 · Handen die bloed vergieten</text><text x="68" y="539" class="body">Onschuldig bloed; vers 17.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">4 · Hart met kwade plannen</text><text x="68" y="688" class="body">Vers 18.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">5 · Voeten die naar kwaad haasten</text><text x="68" y="837" class="body">Vers 18.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">6 · Valse getuige</text><text x="68" y="986" class="body">Leugens uitblazen; vers 19.</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">7 · Ruzie tussen broers zaaien</text><text x="68" y="1135" class="body">Vers 19.</text><text x="46" y="1228" class="note">De inleiding noemt zes, ja zeven dingen. Het</text><text x="46" y="1264" class="note">overzicht telt de zeven vervolgens genoemde</text><text x="46" y="1300" class="note">onderdelen in hun tekstvolgorde.</text></svg>