<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Vrijheid die werkt door liefde</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrijheid die werkt door liefde</text><text x="44" y="113" class="ref">Galaten 5:1–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–12 · Blijf in de vrijheid</text><text x="68" y="241" class="body">Niet door besnijdenis rechtvaardig</text><text x="68" y="284" class="body">worden; geloof werkt door liefde.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">13–15 · Vrijheid tot dienen</text><text x="68" y="433" class="body">Dien elkaar en heb je naaste lief.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">16–21 · Vlees en Geest</text><text x="68" y="582" class="body">De tegengestelde verlangens en de</text><text x="68" y="625" class="body">genoemde werken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">22–26 · De vrucht van de Geest</text><text x="68" y="774" class="body">Negen kenmerken; geen lege eer of</text><text x="68" y="817" class="body">jaloezie.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>