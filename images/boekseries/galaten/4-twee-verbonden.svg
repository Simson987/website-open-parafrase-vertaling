<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De diepere betekenis in het betoog</title><desc id="desc">De diepere betekenis in het betoog met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De diepere betekenis in het betoog</text><text x="44" y="113" class="ref">Galaten 4:21–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De slavin en haar zoon</text><text x="68" y="241" class="body">De zoon is op gewone menselijke manier</text><text x="68" y="284" class="body">geboren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hagar in de vergelijking</text><text x="68" y="433" class="body">Sinaï in Arabië; verbonden met het</text><text x="68" y="476" class="body">Jeruzalem van nu.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vrije vrouw en haar zoon</text><text x="68" y="625" class="body">De zoon is geboren door de belofte.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De vrije stad en de toepassing</text><text x="68" y="774" class="body">Het Jeruzalem boven; wij zijn kinderen</text><text x="68" y="817" class="body">van de belofte, als Izak.</text><text x="46" y="910" class="note">Paulus geeft hier zelf een diepere betekenis;</text><text x="46" y="946" class="note">familieverhaal en toepassing blijven</text><text x="46" y="982" class="note">onderscheiden.</text></svg>