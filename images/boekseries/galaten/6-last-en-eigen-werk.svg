<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Elkaar helpen en jezelf toetsen</title><desc id="desc">Elkaar helpen en jezelf toetsen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elkaar helpen en jezelf toetsen</text><text x="44" y="113" class="ref">Galaten 6:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij een misstap</text><text x="68" y="241" class="body">Zachtmoedig herstellen en ook op jezelf</text><text x="68" y="284" class="body">letten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Elkaars lasten</text><text x="68" y="433" class="body">Help de ander dragen; zo de wet van</text><text x="68" y="476" class="body">Christus vervullen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het eigen werk</text><text x="68" y="625" class="body">Toets het zonder je met een ander te</text><text x="68" y="668" class="body">vergelijken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het eigen pak</text><text x="68" y="817" class="body">Ieder draagt ook zijn eigen</text><text x="68" y="860" class="body">verantwoordelijkheid.</text><text x="46" y="953" class="note">De twee beelden van dragen staan samen in het</text><text x="46" y="989" class="note">betoog en worden niet tegen elkaar uitgespeeld.</text></svg>