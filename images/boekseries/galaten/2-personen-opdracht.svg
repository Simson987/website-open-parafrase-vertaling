<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De mensen en de besproken dienst</title><desc id="desc">De mensen en de besproken dienst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De mensen en de besproken dienst</text><text x="44" y="113" class="ref">Galaten 2:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Paulus, Barnabas en Titus</text><text x="68" y="241" class="body">Zij gaan naar Jeruzalem; Titus wordt</text><text x="68" y="284" class="body">niet tot besnijdenis gedwongen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jakobus, Cefas en Johannes</text><text x="68" y="433" class="body">De genoemde steunpilaren erkennen de</text><text x="68" y="476" class="body">ontvangen genade.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De werkverdeling</text><text x="68" y="625" class="body">Paulus naar de volken; Petrus naar de</text><text x="68" y="668" class="body">besnedenen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De gezamenlijke zorg</text><text x="68" y="817" class="body">Aan de armen blijven denken.</text><text x="46" y="910" class="note">Dezelfde genade wordt erkend, met onderscheiden</text><text x="46" y="946" class="note">werkvelden.</text></svg>