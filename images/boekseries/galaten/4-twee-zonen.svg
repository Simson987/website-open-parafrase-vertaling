<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650"><title>De twee zonen in het betoog</title><rect width="840" height="650" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">De twee zonen in het betoog</text><text x="42" y="108" font-size="26">Galaten 4:22–28</text><rect x="45" y="160" width="350" height="120" rx="16" fill="#dfe8d6" stroke="#52725e"/><rect x="445" y="160" width="350" height="120" rx="16" fill="#dfe8d6" stroke="#52725e"/><text x="220" y="208" text-anchor="middle" font-size="29" font-weight="700">Abraham en Hagar</text><text x="220" y="252" text-anchor="middle" font-size="27">De slavin</text><text x="620" y="208" text-anchor="middle" font-size="29" font-weight="700">Abraham</text><text x="620" y="252" text-anchor="middle" font-size="27">en de vrije vrouw</text><path d="M220 280 V345 M620 280 V345" fill="none" stroke="#52725e" stroke-width="4"/><rect x="45" y="345" width="350" height="120" rx="16" fill="white" stroke="#52725e"/><rect x="445" y="345" width="350" height="120" rx="16" fill="white" stroke="#52725e"/><text x="220" y="394" text-anchor="middle" font-size="25" font-weight="700">De zoon van de slavin</text><text x="220" y="438" text-anchor="middle" font-size="25">Op gewone wijze geboren</text><text x="620" y="394" text-anchor="middle" font-size="29" font-weight="700">Izak</text><text x="620" y="438" text-anchor="middle" font-size="25">Geboren door de belofte</text><text x="42" y="530" font-size="26">De familierelaties zoals deze brief ze noemt.</text><text x="42" y="574" font-size="26">Vanaf vers 24 geeft Paulus een diepere betekenis.</text><text x="42" y="618" font-size="26">Dat onderscheid staat in het bijbehorende schema.</text></g></svg>