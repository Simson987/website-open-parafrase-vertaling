<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De dagen van rouw om Jakob</title><desc id="desc">Genesis 50 noemt veertig dagen voor het balsemen, zeventig dagen Egyptische rouw en zeven dagen rouw bij Atad, gevolgd door begrafenis en terugkeer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De dagen van rouw om Jakob</text><text x="44" y="113" class="ref">Genesis 50:3–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">40 dagen</text><text x="68" y="241" class="body">De tijd die voor het balsemen wordt</text><text x="68" y="284" class="body">genoemd.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">70 dagen</text><text x="68" y="433" class="body">De Egyptenaren rouwen om Jakob.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">7 dagen bij de dorsvloer</text><text x="68" y="582" class="body">Bij Atad houden Jozef en de stoet een</text><text x="68" y="625" class="body">grote rouwplechtigheid.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Begrafenis en terugkeer</text><text x="68" y="774" class="body">Jakob wordt in Machpela begraven;</text><text x="68" y="817" class="body">daarna keren zij terug naar Egypte.</text><text x="46" y="910" class="note">De genoemde perioden worden niet bij elkaar</text><text x="46" y="946" class="note">opgeteld; de tekst geeft geen simpele optelsom</text><text x="46" y="982" class="note">van alle dagen.</text></svg>