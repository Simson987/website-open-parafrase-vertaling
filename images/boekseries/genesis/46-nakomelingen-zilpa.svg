<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De nakomelingen via Zilpa</title><desc id="desc">Zilpa is de moeder van Gad en Aser. Gads zeven zonen, Asers kinderen inclusief Sera, en Berija’s zonen Heber en Malchiël worden genoemd.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nakomelingen via Zilpa</text><text x="44" y="113" class="ref">Genesis 46:16–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gad → zijn zonen</text><text x="68" y="241" class="body">Zifjon, Haggi, Schuni, Ezbon, Eri,</text><text x="68" y="284" class="body">Arodi en Areli.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aser → zijn kinderen</text><text x="68" y="433" class="body">Jimna, Jisva, Jisvi en Berija; hun zus</text><text x="68" y="476" class="body">is Sera.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Berija → zijn zonen</text><text x="68" y="625" class="body">Heber en Malchiël.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Totaal in de tekst</text><text x="68" y="774" class="body">Zestien nakomelingen via Zilpa.</text><text x="46" y="867" class="note">Sera staat als dochter en zus in de familietak;</text><text x="46" y="903" class="note">zij wordt niet uit de lijst weggelaten.</text></svg>