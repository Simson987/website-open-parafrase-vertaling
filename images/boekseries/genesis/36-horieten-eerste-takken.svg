<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1111" viewBox="0 0 840 1111" role="img" aria-labelledby="title desc"><title id="title">De Horieten: eerste takken</title><desc id="desc">De eerste Horietische takken in Genesis 36: nakomelingen van Seïr, met de lijnen van Lotan, Sobal, Zibeon en Ana.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1111" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De Horieten: eerste takken</text><text x="44" y="113" class="ref">Genesis 36:20–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Seïr → zijn nakomelingen</text><text x="68" y="241" class="body">Lotan, Sobal, Zibeon, Ana, Dison, Ezer</text><text x="68" y="284" class="body">en Disan.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Lotan → zijn zonen</text><text x="68" y="433" class="body">Hori en Hemam. Timna is Lotans zus.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Sobal → zijn zonen</text><text x="68" y="582" class="body">Alvan, Manahath, Ebal, Sefo en Onam.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Zibeon → zijn zonen</text><text x="68" y="731" class="body">Aja en Ana.</text><rect x="42" y="789" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Ana → zijn kinderen</text><text x="68" y="880" class="body">Dison en Aholibama worden genoemd.</text><text x="46" y="973" class="note">Herhaalde namen blijven bij de relatie waarin de</text><text x="46" y="1009" class="note">tekst ze noemt; gelijknamige personen worden</text><text x="46" y="1045" class="note">niet samengevoegd.</text></svg>