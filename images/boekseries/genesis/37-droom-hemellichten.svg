<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Zon, maan en elf sterren</title><desc id="desc">Jozef droomt dat zon, maan en elf sterren voor hem buigen. Jakob vraagt naar de betekenis voor de familie en onthoudt de woorden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zon, maan en elf sterren</text><text x="44" y="113" class="ref">Genesis 37:9–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het droombeeld</text><text x="68" y="241" class="body">De zon, de maan en elf sterren buigen</text><text x="68" y="284" class="body">voor Jozef.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vraag van Jakob</text><text x="68" y="433" class="body">Moeten je moeder, je broers en ik voor</text><text x="68" y="476" class="body">jou buigen?</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De reactie van de broers</text><text x="68" y="625" class="body">Zij zijn jaloers.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De reactie van Jakob</text><text x="68" y="774" class="body">Hij blijft over deze woorden nadenken.</text><text x="46" y="867" class="note">De familiebetekenis wordt als Jakobs vraag</text><text x="46" y="903" class="note">weergegeven; het is geen natuurkundige</text><text x="46" y="939" class="note">gebeurtenis.</text></svg>