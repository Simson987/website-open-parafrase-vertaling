<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Van ruzie naar ruimte</title><desc id="desc">Esek en Sitna zijn omstreden putten; bij Rehoboth is ruimte zonder ruzie. Daarna volgt Berseba, het verbond en de vondst van water bij de put Seba.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van ruzie naar ruimte</text><text x="44" y="113" class="ref">Genesis 26:18–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Esek · vers 20</text><text x="68" y="241" class="body">De herders van Gerar maken ruzie om het</text><text x="68" y="284" class="body">water.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sitna · vers 21</text><text x="68" y="433" class="body">Ook over de tweede put ontstaat ruzie.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Rehoboth · vers 22</text><text x="68" y="582" class="body">Over deze put is geen ruzie: de HEERE</text><text x="68" y="625" class="body">heeft ruimte gemaakt.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Berseba · vers 23–33</text><text x="68" y="774" class="body">Izak bouwt een altaar en sluit een</text><text x="68" y="817" class="body">verbond. Zijn dienaren vinden water; de</text><text x="68" y="860" class="body">put heet Seba.</text><text x="46" y="953" class="note">Een volgorde van gebeurtenissen en namen, geen</text><text x="46" y="989" class="note">kaart met berekende locaties.</text></svg>