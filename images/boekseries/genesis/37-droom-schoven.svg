<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Jozefs droom van de schoven</title><desc id="desc">In Jozefs eerste droom staat zijn schoof rechtop en buigen de schoven van zijn broers ervoor.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jozefs droom van de schoven</text><text x="44" y="113" class="ref">Genesis 37:5–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De setting</text><text x="68" y="241" class="body">De broers binden schoven midden op het</text><text x="68" y="284" class="body">veld.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jozefs schoof</text><text x="68" y="433" class="body">Zijn schoof gaat rechtop staan.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De schoven van de broers</text><text x="68" y="582" class="body">Zij komen eromheen en buigen ervoor.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De reactie</text><text x="68" y="731" class="body">Zijn broers vragen of hij over hen</text><text x="68" y="774" class="body">denkt te regeren.</text><text x="46" y="867" class="note">Dit is een droombeeld, geen werkelijk buigende</text><text x="46" y="903" class="note">oogst of historische kroning.</text></svg>