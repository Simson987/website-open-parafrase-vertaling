<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De nakomelingen via Rachel</title><desc id="desc">Rachels tak bestaat uit Jozef met Asnath en hun zonen Manasse en Efraïm, en Benjamin met de tien genoemde zonen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nakomelingen via Rachel</text><text x="44" y="113" class="ref">Genesis 46:19–22</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rachel → haar zonen</text><text x="68" y="241" class="body">Jozef en Benjamin.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Jozef + Asnath</text><text x="68" y="390" class="body">Hun zonen Manasse en Efraïm zijn in</text><text x="68" y="433" class="body">Egypte geboren.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Benjamin → zijn zonen</text><text x="68" y="582" class="body">Bela, Becher, Asbel, Gera, Naäman,</text><text x="68" y="625" class="body">Echi, Ros, Muppim, Huppim en Ard.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Totaal in de tekst</text><text x="68" y="774" class="body">Veertien nakomelingen via Rachel.</text><text x="46" y="867" class="note">Jozefs twee zonen woonden al in Egypte; zij</text><text x="46" y="903" class="note">maakten die reis vanuit Kanaän niet mee.</text></svg>