<svg xmlns="http://www.w3.org/2000/svg" width="840" height="883" viewBox="0 0 840 883" role="img" aria-labelledby="title desc"><title id="title">De nakomelingen van Lot</title><desc id="desc">Lot en zijn oudste dochter krijgen Moab, de stamvader van de Moabieten. Lot en zijn jongste dochter krijgen Ben-Ammi, de stamvader van de Ammonieten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="883" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nakomelingen van Lot</text><text x="44" y="113" class="ref">Genesis 19:36–38</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lot en zijn oudste dochter</text><text x="68" y="241" class="body">Hun zoon heet Moab.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Moab → Moabieten</text><text x="68" y="390" class="body">Moab wordt hun stamvader (vers 37).</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Lot en zijn jongste dochter</text><text x="68" y="539" class="body">Hun zoon heet Ben-Ammi.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Ben-Ammi → Ammonieten</text><text x="68" y="688" class="body">Ben-Ammi wordt hun stamvader (vers 38).</text><text x="46" y="781" class="note">Familieoverzicht volgens de tekst. De dochters</text><text x="46" y="817" class="note">worden hier niet bij naam genoemd.</text></svg>