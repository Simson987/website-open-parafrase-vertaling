<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Een vijfde van de oogst</title><desc id="desc">Jozefs regeling verdeelt de oogst in een vijfde voor Farao en vier vijfde voor zaaigoed en het levensonderhoud. Priestergrond blijft uitgezonderd.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een vijfde van de oogst</text><text x="44" y="113" class="ref">Genesis 47:22–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1 van de 5 delen → Farao</text><text x="68" y="241" class="body">Een vijfde van de opbrengst wordt aan</text><text x="68" y="284" class="body">Farao gegeven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">4 van de 5 delen → de gezinnen</text><text x="68" y="433" class="body">Voor zaaigoed, voedsel voor de werkers,</text><text x="68" y="476" class="body">hun huishoudens en hun kinderen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Uitzondering: priesters</text><text x="68" y="625" class="body">Hun grond is niet door Farao gekocht;</text><text x="68" y="668" class="body">zij ontvangen een vaste toelage.</text><text x="46" y="761" class="note">Dit is de regeling die Genesis 47 beschrijft;</text><text x="46" y="797" class="note">geen advies voor een hedendaags</text><text x="46" y="833" class="note">belastingstelsel.</text></svg>