<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1111" viewBox="0 0 840 1111" role="img" aria-labelledby="title desc"><title id="title">Zeven goede en slechte jaren</title><desc id="desc">Farao’s twee dromen wijzen op zeven jaren overvloed gevolgd door zeven jaren hongersnood. Jozef stelt voor een vijfde van de oogst op te slaan.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1111" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeven goede en slechte jaren</text><text x="44" y="113" class="ref">Genesis 41:25–36</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zeven vette koeien</text><text x="68" y="241" class="body">Zeven jaren van overvloed.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zeven volle korenaren</text><text x="68" y="390" class="body">Dezelfde zeven goede jaren.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Zeven magere koeien</text><text x="68" y="539" class="body">Zeven jaren van hongersnood volgen.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Zeven dunne korenaren</text><text x="68" y="688" class="body">Dezelfde zeven jaren van hongersnood.</text><rect x="42" y="746" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Het voorstel van Jozef</text><text x="68" y="837" class="body">In de goede jaren een vijfde van de</text><text x="68" y="880" class="body">oogst innemen en bewaren als voorraad.</text><text x="46" y="973" class="note">De twee dromen hebben volgens Jozef dezelfde</text><text x="46" y="1009" class="note">betekenis; zij vormen geen vier afzonderlijke</text><text x="46" y="1045" class="note">perioden.</text></svg>