<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De ark volgens de tekst</title><desc id="desc">De ark: 300 el lang, 50 el breed en 30 el hoog, met drie verdiepingen, kamers, een lichtopening en een zijdeur; van goferhout en met pek bestreken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De ark volgens de tekst</text><text x="44" y="113" class="ref">Genesis 6:14–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afmetingen in el</text><text x="68" y="241" class="body">Lengte 300 · breedte 50 · hoogte 30.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Drie verdiepingen</text><text x="68" y="390" class="body">Een onderste, middelste en bovenste</text><text x="68" y="433" class="body">verdieping.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bouwmateriaal</text><text x="68" y="582" class="body">Goferhout; kamers; pek aan binnenkant</text><text x="68" y="625" class="body">en buitenkant.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Openingen</text><text x="68" y="774" class="body">Een lichtopening bovenin en een deur</text><text x="68" y="817" class="body">aan de zijkant.</text><text x="46" y="910" class="note">Schema van de beschrijving; geen bouwtekening.</text><text x="46" y="946" class="note">De el wordt niet naar een vaste moderne maat</text><text x="46" y="982" class="note">omgerekend.</text></svg>