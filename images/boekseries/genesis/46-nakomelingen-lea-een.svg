<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">Lea: Ruben, Simeon en Levi</title><desc id="desc">De familietakken via Lea: Ruben met vier zonen, Simeon met zes zonen en Levi met drie zonen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lea: Ruben, Simeon en Levi</text><text x="44" y="113" class="ref">Genesis 46:8–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben → zijn zonen</text><text x="68" y="241" class="body">Hanoch, Pallu, Hezron en Karmi.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Simeon → zijn zonen</text><text x="68" y="390" class="body">Jemuël, Jamin, Ohad, Jachin, Zohar en</text><text x="68" y="433" class="body">Saul. Sauls moeder is een Kanaänitische</text><text x="68" y="476" class="body">vrouw.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Levi → zijn zonen</text><text x="68" y="625" class="body">Gerson, Kehath en Merari.</text><text x="46" y="718" class="note">De namen en verwantschappen volgen de opsomming</text><text x="46" y="754" class="note">in dit hoofdstuk.</text></svg>