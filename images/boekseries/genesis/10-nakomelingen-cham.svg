<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1482" viewBox="0 0 840 1482" role="img" aria-labelledby="title desc"><title id="title">De nakomelingen van Cham</title><desc id="desc">Chams zonen zijn Cusch, Mitsraim, Put en Kanaän. Het schema splitst de genoemde nakomelingen van Cusch, Raema, Mitsraim en Kanaän uit volgens Genesis 10:6–20.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1482" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nakomelingen van Cham</text><text x="44" y="113" class="ref">Genesis 10:6–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Noach → Cham</text><text x="68" y="241" class="body">Cham → Cusch, Mitsraim, Put en Kanaän.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Cusch → zijn zonen</text><text x="68" y="390" class="body">Seba, Havila, Sabta, Raema, Sabtecha en</text><text x="68" y="433" class="body">Nimrod.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Raema → zijn zonen</text><text x="68" y="582" class="body">Scheba en Dedan.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Mitsraim → zijn nakomelingen</text><text x="68" y="731" class="body">Ludieten, Anamieten, Lehabieten,</text><text x="68" y="774" class="body">Naftuchieten, Pathrusieten,</text><text x="68" y="817" class="body">Casluchieten en Caftorieten.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Casluchieten → Filistijnen</text><text x="68" y="966" class="body">De Filistijnen komen volgens deze tekst</text><text x="68" y="1009" class="body">uit de Casluchieten voort.</text><rect x="42" y="1067" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Kanaän → zijn nakomelingen</text><text x="68" y="1158" class="body">Sidon, Heth; Jebusieten, Amorieten,</text><text x="68" y="1201" class="body">Girgasieten, Hivvieten, Arkieten,</text><text x="68" y="1244" class="body">Sinieten, Arvadieten, Tsemarieten en</text><text x="68" y="1287" class="body">Hamathieten.</text><text x="46" y="1380" class="note">Pijlen volgen de lokale hoofdstuktekst. Personen</text><text x="46" y="1416" class="note">en volken worden samen genoemd.</text></svg>