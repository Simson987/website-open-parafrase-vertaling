<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Efraïm en Manasse aangenomen</title><desc id="desc">Jakob neemt Efraïm en Manasse aan als zijn eigen zonen, zoals Ruben en Simeon, volgens Genesis 48:5–6.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Efraïm en Manasse aangenomen</text><text x="44" y="113" class="ref">Genesis 48:5–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jozef → zijn twee zonen</text><text x="68" y="241" class="body">Efraïm en Manasse zijn in Egypte</text><text x="68" y="284" class="body">geboren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jakob neemt hen aan</text><text x="68" y="433" class="body">Zij zullen hem toebehoren zoals Ruben</text><text x="68" y="476" class="body">en Simeon.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Latere kinderen van Jozef</text><text x="68" y="625" class="body">Zij horen bij Jozef en worden voor hun</text><text x="68" y="668" class="body">erfdeel bij hun broers gerekend.</text><text x="46" y="761" class="note">De aanneming geeft de twee zonen een plaats in</text><text x="46" y="797" class="note">Jakobs familie; hun biologische vader blijft</text><text x="46" y="833" class="note">Jozef.</text></svg>