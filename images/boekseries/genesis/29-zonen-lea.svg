<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De eerste vier zonen van Lea</title><desc id="desc">Lea krijgt achtereenvolgens Ruben, Simeon, Levi en Juda. Bij elke naam beschrijft de tekst haar woorden en verlangen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eerste vier zonen van Lea</text><text x="44" y="113" class="ref">Genesis 29:32–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben · vers 32</text><text x="68" y="241" class="body">Lea zegt dat de HEERE haar ellende</text><text x="68" y="284" class="body">heeft gezien.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Simeon · vers 33</text><text x="68" y="433" class="body">Zij zegt dat de HEERE heeft gehoord dat</text><text x="68" y="476" class="body">zij niet geliefd is.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Levi · vers 34</text><text x="68" y="625" class="body">Zij hoopt dat haar man zich aan haar</text><text x="68" y="668" class="body">hecht.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Juda · vers 35</text><text x="68" y="817" class="body">Deze keer zal ik de HEERE loven.</text><text x="46" y="910" class="note">Dit zijn Lea’s eerste vier zonen. Meer kinderen</text><text x="46" y="946" class="note">worden in Genesis 30 genoemd.</text></svg>