<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1515" viewBox="0 0 840 1515" role="img" aria-labelledby="title desc"><title id="title">De koningen van Edom</title><desc id="desc">De acht opeenvolgende koningen van Edom: Bela, Jobab, Husam, Hadad, Samla, Saul, Baäl-Hanan en Hadar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1515" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De koningen van Edom</text><text x="44" y="113" class="ref">Genesis 36:31–39</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1 · Bela</text><text x="68" y="241" class="body">Zoon van Beor; stad Dinhaba.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">2 · Jobab</text><text x="68" y="390" class="body">Zoon van Zerah; uit Bozra.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">3 · Husam</text><text x="68" y="539" class="body">Uit het land van de Temanieten.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">4 · Hadad</text><text x="68" y="688" class="body">Zoon van Bedad; stad Avith.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">5 · Samla</text><text x="68" y="837" class="body">Uit Masreka.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">6 · Saul</text><text x="68" y="986" class="body">Uit Rehoboth aan de rivier.</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">7 · Baäl-Hanan</text><text x="68" y="1135" class="body">Zoon van Achbor.</text><rect x="42" y="1193" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">8 · Hadar</text><text x="68" y="1284" class="body">Stad Pahu; zijn vrouw heet Mehetabeël.</text><text x="46" y="1377" class="note">Dit is een volgorde van koningen, geen vader-</text><text x="46" y="1413" class="note">zoonstamboom. Er worden geen jaartallen</text><text x="46" y="1449" class="note">berekend.</text></svg>