<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1154" viewBox="0 0 840 1154" role="img" aria-labelledby="title desc"><title id="title">Bilha en de familietotalen</title><desc id="desc">Bilha’s tak via Dan en Nafthali telt zeven. De tekst onderscheidt 66 reizende nakomelingen zonder de vrouwen van Jakobs zonen en het familietotaal van 70.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1154" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bilha en de familietotalen</text><text x="44" y="113" class="ref">Genesis 46:23–27</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dan → zijn zoon</text><text x="68" y="241" class="body">Chusim.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Nafthali → zijn zonen</text><text x="68" y="390" class="body">Jahzeel, Guni, Jezer en Sillem.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Via Bilha</text><text x="68" y="539" class="body">Zeven nakomelingen, volgens vers 25.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">66 reizende nakomelingen</text><text x="68" y="688" class="body">Vers 26 telt de vrouwen van Jakobs</text><text x="68" y="731" class="body">zonen niet mee.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">70 personen in de familie</text><text x="68" y="880" class="body">Vers 27 noemt het familietotaal en</text><text x="68" y="923" class="body">Jozefs twee in Egypte geboren zonen.</text><text x="46" y="1016" class="note">De twee totalen hebben een verschillende</text><text x="46" y="1052" class="note">omschrijving; het schema houdt die van de tekst</text><text x="46" y="1088" class="note">aan.</text></svg>