<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">Lea: Juda, Issaschar en Zebulon</title><desc id="desc">De overige familietakken via Lea: Juda en Perez, Issaschar en Zebulon; Dina wordt afzonderlijk vermeld. Er en Onan zijn in Kanaän gestorven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lea: Juda, Issaschar en Zebulon</text><text x="44" y="113" class="ref">Genesis 46:12–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Juda → zijn zonen</text><text x="68" y="241" class="body">Er, Onan, Sela, Perez en Zerah. Er en</text><text x="68" y="284" class="body">Onan waren al in Kanaän gestorven.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Perez → zijn zonen</text><text x="68" y="433" class="body">Hezron en Hamul.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Issaschar → zijn zonen</text><text x="68" y="582" class="body">Tola, Puwa, Job en Simron.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Zebulon → zijn zonen</text><text x="68" y="731" class="body">Sered, Elon en Jahleel.</text><rect x="42" y="789" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Ook Dina wordt genoemd</text><text x="68" y="880" class="body">Vers 15 noemt Jakobs dochter Dina en</text><text x="68" y="923" class="body">een totaal van 33 personen in deze</text><text x="68" y="966" class="body">familietak.</text><text x="46" y="1059" class="note">Er en Onan worden wel genoemd, maar zijn geen</text><text x="46" y="1095" class="note">levende reizigers naar Egypte.</text></svg>