<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De beloften bij Beth-el</title><desc id="desc">Bij Beth-el ontvangt Jakob beloften van land, veel nakomelingen, zegen, bescherming en terugkeer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De beloften bij Beth-el</text><text x="44" y="113" class="ref">Genesis 28:13–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het land · vers 13</text><text x="68" y="241" class="body">Het land waarop Jakob ligt wordt aan</text><text x="68" y="284" class="body">hem en zijn nakomelingen gegeven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nakomelingen · vers 14</text><text x="68" y="433" class="body">Talrijk als het stof; verspreiding naar</text><text x="68" y="476" class="body">alle windrichtingen; zegen voor alle</text><text x="68" y="519" class="body">families.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Nabijheid · vers 15</text><text x="68" y="668" class="body">Ik ben bij je en zal je overal</text><text x="68" y="711" class="body">beschermen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Terugkeer · vers 15</text><text x="68" y="860" class="body">Ik zal je terugbrengen naar dit land en</text><text x="68" y="903" class="body">je niet verlaten.</text><text x="46" y="996" class="note">Een overzicht van de belofte in de droom; geen</text><text x="46" y="1032" class="note">afbeelding van God als mens.</text></svg>