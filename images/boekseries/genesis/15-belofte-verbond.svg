<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De beloften aan Abram</title><desc id="desc">Genesis 15 belooft een eigen zoon, veel nakomelingen, vreemdelingschap en onderdrukking, uittocht en terugkeer en een land vanaf de rivier van Egypte tot de Eufraat.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De beloften aan Abram</text><text x="44" y="113" class="ref">Genesis 15:4–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een eigen zoon · 15:4–5</text><text x="68" y="241" class="body">Abrams eigen zoon wordt erfgenaam;</text><text x="68" y="284" class="body">nakomelingen zo talrijk als sterren.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vreemdelingschap · 15:13</text><text x="68" y="433" class="body">Zijn nakomelingen wonen in een ander</text><text x="68" y="476" class="body">land en worden vierhonderd jaar</text><text x="68" y="519" class="body">onderdrukt.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Uittocht en terugkeer · 15:14–16</text><text x="68" y="668" class="body">Daarna vertrekken zij met bezittingen;</text><text x="68" y="711" class="body">de vierde generatie keert terug.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het land · 15:18</text><text x="68" y="860" class="body">Vanaf de rivier van Egypte tot de</text><text x="68" y="903" class="body">Eufraat.</text><text x="46" y="996" class="note">Dit is een overzicht van de uitgesproken</text><text x="46" y="1032" class="note">beloften, geen berekende jaartallenlijn.</text></svg>