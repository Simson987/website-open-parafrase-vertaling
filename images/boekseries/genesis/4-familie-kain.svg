<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1032" viewBox="0 0 840 1032" role="img" aria-labelledby="title desc"><title id="title">De familie van Kaïn</title><desc id="desc">Kaïn is de vader van Henoch; Henoch van Hirad; Hirad van Mechujael; Mechujael van Methusael; Methusael van Lamech. Lamech en Ada krijgen Jabal en Jubal; Lamech en Zilla krijgen Tubal-Kaïn en Naema.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1032" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De familie van Kaïn</text><text x="44" y="113" class="ref">Genesis 4:17–22</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kaïn → Henoch</text><text x="68" y="241" class="body">Kaïn noemt de stad naar zijn zoon.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Henoch → Hirad</text><text x="68" y="390" class="body">Hirad → Mechujael → Methusael.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Methusael → Lamech</text><text x="68" y="539" class="body">Deze Lamech behoort tot Kaïns lijn.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Lamech + Ada</text><text x="68" y="688" class="body">Hun zonen: Jabal en Jubal.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Lamech + Zilla</text><text x="68" y="837" class="body">Hun kinderen: Tubal-Kaïn en Naema.</text><text x="46" y="930" class="note">Een pijl betekent: vader → kind. Dit is niet de</text><text x="46" y="966" class="note">Lamech uit Genesis 5.</text></svg>