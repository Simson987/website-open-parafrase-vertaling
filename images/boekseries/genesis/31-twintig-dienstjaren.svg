<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Jakobs twintig dienstjaren</title><desc id="desc">Jakob beschrijft twintig jaar bij Laban: veertien jaar voor de twee dochters en zes voor de kudde. Hij noemt tien loonwijzigingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jakobs twintig dienstjaren</text><text x="44" y="113" class="ref">Genesis 31:38–42</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">14 jaar</text><text x="68" y="241" class="body">Jakob werkt voor Labans twee dochters.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">6 jaar</text><text x="68" y="390" class="body">Jakob werkt voor de kudde.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Samen 20 jaar</text><text x="68" y="539" class="body">Veertien plus zes jaar in Labans huis.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">10 wijzigingen van het loon</text><text x="68" y="688" class="body">Jakob verwijt Laban dat hij zijn loon</text><text x="68" y="731" class="body">zo vaak heeft veranderd.</text><text x="46" y="824" class="note">Dit zijn de aantallen uit Jakobs terugblik, geen</text><text x="46" y="860" class="note">reconstructie van absolute jaartallen.</text></svg>