<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1813" viewBox="0 0 840 1813" role="img" aria-labelledby="title desc"><title id="title">Van Adam naar Noach</title><desc id="desc">Stamboom: Adam, Seth, Enos, Kenan, Mahalal-el, Jered, Henoch, Methusalach, Lamech, Noach. Noachs zonen zijn Sem, Cham en Jafeth. Elke opeenvolgende naam is een zoon van de voorgaande.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1813" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Adam naar Noach</text><text x="44" y="113" class="ref">Genesis 5:3–32</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1 · Adam → Seth</text><text x="68" y="241" class="body">Genesis 5:3</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">2 · Seth → Enos</text><text x="68" y="390" class="body">Genesis 5:6</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">3 · Enos → Kenan</text><text x="68" y="539" class="body">Genesis 5:9</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">4 · Kenan → Mahalal-el</text><text x="68" y="688" class="body">Genesis 5:12</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">5 · Mahalal-el → Jered</text><text x="68" y="837" class="body">Genesis 5:15</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">6 · Jered → Henoch</text><text x="68" y="986" class="body">Genesis 5:18</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">7 · Henoch → Methusalach</text><text x="68" y="1135" class="body">Genesis 5:21</text><rect x="42" y="1193" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">8 · Methusalach → Lamech</text><text x="68" y="1284" class="body">Genesis 5:25</text><rect x="42" y="1342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1385" class="label">9 · Lamech → Noach</text><text x="68" y="1433" class="body">Genesis 5:28–29</text><rect x="42" y="1491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1534" class="label">10 · Noachs zonen</text><text x="68" y="1582" class="body">Sem, Cham en Jafeth (5:32).</text><text x="46" y="1675" class="note">De genoemde lijn is geen opsomming van alle</text><text x="46" y="1711" class="note">kinderen; de tekst vermeldt ook zonen en</text><text x="46" y="1747" class="note">dochters.</text></svg>