<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De twaalf zonen van Ismaël</title><desc id="desc">Ismaëls twaalf zonen in volgorde: Nabajoth, Kedar, Adbeel, Mibsam, Misma, Duma, Massa, Hadar, Thema, Jetur, Nafis en Kedma.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twaalf zonen van Ismaël</text><text x="44" y="113" class="ref">Genesis 25:12–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–4</text><text x="68" y="241" class="body">Nabajoth, Kedar, Adbeel en Mibsam.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">5–8</text><text x="68" y="390" class="body">Misma, Duma, Massa en Hadar.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">9–12</text><text x="68" y="539" class="body">Thema, Jetur, Nafis en Kedma.</text><rect x="42" y="597" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Twaalf stammen</text><text x="68" y="688" class="body">Elke zoon wordt leider van een stam;</text><text x="68" y="731" class="body">dorpen en tentenkampen dragen hun</text><text x="68" y="774" class="body">namen.</text><text x="46" y="867" class="note">De volgorde en schrijfwijze volgen de</text><text x="46" y="903" class="note">plaatselijke hoofdstuktekst.</text></svg>