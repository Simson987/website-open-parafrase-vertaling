<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Het verbond bij Berseba</title><desc id="desc">Het verbond van Abraham en Abimelech bij Berseba: trouw, de betwiste waterput en zeven jonge ooien als bewijs dat Abraham de put gegraven heeft.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het verbond bij Berseba</text><text x="44" y="113" class="ref">Genesis 21:22–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Abraham en Abimelech</text><text x="68" y="241" class="body">Zij zweren elkaar trouw en sluiten een</text><text x="68" y="284" class="body">verbond.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De betwiste waterput</text><text x="68" y="433" class="body">Abraham spreekt Abimelech aan over de</text><text x="68" y="476" class="body">ingenomen put.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zeven jonge ooien</text><text x="68" y="625" class="body">Abraham zet ze apart; zij dienen als</text><text x="68" y="668" class="body">bewijs dat hij de put gegraven heeft.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Berseba</text><text x="68" y="817" class="body">De plek krijgt deze naam omdat zij daar</text><text x="68" y="860" class="body">beiden een eed zweren.</text><text x="46" y="953" class="note">Pichol is Abimelechs legeraanvoerder. De zeven</text><text x="46" y="989" class="note">ooien zijn getuigenis bij de put, geen</text><text x="46" y="1025" class="note">offerdieren.</text></svg>