<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1267" viewBox="0 0 840 1267" role="img" aria-labelledby="title desc"><title id="title">Abrahams voorbede</title><desc id="desc">Abraham pleit achtereenvolgens om de stad te sparen voor vijftig, vijfenveertig, veertig, dertig, twintig en tien rechtvaardigen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1267" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Abrahams voorbede</text><text x="44" y="113" class="ref">Genesis 18:24–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">50 rechtvaardigen · vers 24–26</text><text x="68" y="241" class="body">Abraham vraagt of de stad voor hen</text><text x="68" y="284" class="body">gespaard wordt.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">45 · vers 28</text><text x="68" y="433" class="body">Vijf minder dan vijftig.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">40 · vers 29</text><text x="68" y="582" class="body">Abraham vraagt opnieuw.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">30 · vers 30</text><text x="68" y="731" class="body">Zijn verzoek gaat verder.</text><rect x="42" y="789" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">20 · vers 31</text><text x="68" y="880" class="body">Nogmaals vraagt Abraham om sparen.</text><rect x="42" y="938" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="981" class="label">10 · vers 32</text><text x="68" y="1029" class="body">De laatste vraag; de HEERE zegt de stad</text><text x="68" y="1072" class="body">ook om tien rechtvaardigen te sparen.</text><text x="46" y="1165" class="note">Deze getallen zijn vragen in het gesprek, geen</text><text x="46" y="1201" class="note">telling van gevonden inwoners.</text></svg>