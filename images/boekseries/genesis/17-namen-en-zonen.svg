<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Nieuwe namen en beloften</title><desc id="desc">Abram krijgt de naam Abraham, Sarai de naam Sara. Sara zal Izak krijgen, met wie het verbond wordt gesloten; ook Ismaël ontvangt een belofte van talrijke nakomelingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nieuwe namen en beloften</text><text x="44" y="113" class="ref">Genesis 17:5, 15–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Abram → Abraham · 17:5</text><text x="68" y="241" class="body">Vader van een groot aantal volken.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Sarai → Sara · 17:15–16</text><text x="68" y="390" class="body">Zij zal Abraham een zoon geven.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Izak · 17:19, 21</text><text x="68" y="539" class="body">De zoon van Sara; met hem wordt het</text><text x="68" y="582" class="body">verbond gesloten.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Ismaël · 17:20</text><text x="68" y="731" class="body">Ook hij wordt gezegend: twaalf vorsten</text><text x="68" y="774" class="body">en een groot volk.</text><text x="46" y="867" class="note">Een schema van namen en beloften; de geboorte</text><text x="46" y="903" class="note">van Izak volgt in Genesis 21.</text></svg>