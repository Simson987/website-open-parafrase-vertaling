<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De nakomelingen van Jafeth</title><desc id="desc">Jafeth heeft zonen Gomer, Magog, Madai, Javan, Tubal, Mesech en Thiras. Gomers zonen zijn Askenaz, Rifath en Togarma. Javans nakomelingen zijn Elisa, Tarsis, de Chittieten en de Dodanieten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nakomelingen van Jafeth</text><text x="44" y="113" class="ref">Genesis 10:2–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Noach → Jafeth</text><text x="68" y="241" class="body">De eerste tak in het overzicht van</text><text x="68" y="284" class="body">Genesis 10.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jafeth → zijn zonen</text><text x="68" y="433" class="body">Gomer, Magog, Madai, Javan, Tubal,</text><text x="68" y="476" class="body">Mesech en Thiras.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gomer → zijn zonen</text><text x="68" y="625" class="body">Askenaz, Rifath en Togarma.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Javan → zijn nakomelingen</text><text x="68" y="774" class="body">Elisa, Tarsis, de Chittieten en de</text><text x="68" y="817" class="body">Dodanieten.</text><text x="46" y="910" class="note">Pijlen tonen de in de tekst genoemde afstamming;</text><text x="46" y="946" class="note">volken en personen staan in hetzelfde overzicht.</text></svg>