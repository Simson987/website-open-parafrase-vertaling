<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1330" viewBox="0 0 840 1330" role="img" aria-labelledby="title desc"><title id="title">Schepping: dag voor dag</title><desc id="desc">Overzicht van de zes scheppingsdagen uit Genesis 1 en de rustdag uit Genesis 2:1–3.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1330" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schepping: dag voor dag</text><text x="44" y="113" class="ref">Genesis 1:1–31 en 2:1–3</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dag 1 · 1:3–5</text><text x="68" y="241" class="body">Licht; scheiding tussen dag en nacht.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Dag 2 · 1:6–8</text><text x="68" y="390" class="body">Het hemelgewelf scheidt de wateren.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Dag 3 · 1:9–13</text><text x="68" y="539" class="body">Land en zee; planten en vruchtbomen.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Dag 4 · 1:14–19</text><text x="68" y="688" class="body">Zon, maan en sterren.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Dag 5 · 1:20–23</text><text x="68" y="837" class="body">Dieren in het water en vogels.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Dag 6 · 1:24–31</text><text x="68" y="986" class="body">Landdieren; mensen als man en vrouw.</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">Dag 7 · 2:1–3</text><text x="68" y="1135" class="body">God rust en heiligt de zevende dag.</text><text x="46" y="1228" class="note">De rustdag wordt beschreven aan het begin van</text><text x="46" y="1264" class="note">hoofdstuk 2.</text></svg>