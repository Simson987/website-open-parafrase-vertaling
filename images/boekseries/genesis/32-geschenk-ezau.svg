<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1224" viewBox="0 0 840 1224" role="img" aria-labelledby="title desc"><title id="title">Jakobs geschenk aan Ezau</title><desc id="desc">Jakob geeft Ezau geiten, bokken, ooien, rammen, kamelen met jongen, koeien, stieren, ezelinnen en jonge ezels, verdeeld over afzonderlijke kudden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1224" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jakobs geschenk aan Ezau</text><text x="44" y="113" class="ref">Genesis 32:13–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geiten en bokken</text><text x="68" y="241" class="body">200 geiten en 20 bokken.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Schapen en rammen</text><text x="68" y="390" class="body">200 ooien en 20 rammen.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Kamelen</text><text x="68" y="539" class="body">30 zogende kamelen met hun jongen.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Runderen</text><text x="68" y="688" class="body">40 koeien en 10 stieren.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Ezels</text><text x="68" y="837" class="body">20 ezelinnen en 10 jonge ezels.</text><rect x="42" y="895" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Afzonderlijke kudden</text><text x="68" y="986" class="body">Elke kudde krijgt een dienaar mee; er</text><text x="68" y="1029" class="body">blijft ruimte tussen de groepen.</text><text x="46" y="1122" class="note">Het aantal kameeljongen wordt niet afzonderlijk</text><text x="46" y="1158" class="note">genoemd; daarom staat hier geen berekend totaal.</text></svg>