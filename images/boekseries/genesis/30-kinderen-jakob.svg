<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Jakobs gezin tot Genesis 30</title><desc id="desc">Tot en met Genesis 30: Lea heeft Ruben, Simeon, Levi, Juda, Issaschar, Zebulon en Dina; Bilha Dan en Nafthali; Zilpa Gad en Aser; Rachel Jozef. Benjamin wordt later geboren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jakobs gezin tot Genesis 30</text><text x="44" y="113" class="ref">Genesis 29:32–35; 30:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lea → haar kinderen</text><text x="68" y="241" class="body">Ruben, Simeon, Levi, Juda, Issaschar,</text><text x="68" y="284" class="body">Zebulon en Dina.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bilha → haar zonen</text><text x="68" y="433" class="body">Dan en Nafthali.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Zilpa → haar zonen</text><text x="68" y="582" class="body">Gad en Aser.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Rachel → haar zoon</text><text x="68" y="731" class="body">Jozef. Benjamin is op dit punt nog niet</text><text x="68" y="774" class="body">geboren.</text><text x="46" y="867" class="note">Overzicht van de in deze hoofdstukken geboren</text><text x="46" y="903" class="note">kinderen; de volgorde van de moeders is geen</text><text x="46" y="939" class="note">huwelijksrangorde.</text></svg>