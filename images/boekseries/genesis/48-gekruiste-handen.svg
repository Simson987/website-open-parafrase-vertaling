<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Jakobs gekruiste handen</title><desc id="desc">Jakob kruist bewust zijn handen: zijn rechterhand op de jongste Efraïm en zijn linkerhand op de eerstgeboren Manasse.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jakobs gekruiste handen</text><text x="44" y="113" class="ref">Genesis 48:13–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rechterhand van Jakob</text><text x="68" y="241" class="body">Op Efraïm, de jongste.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Linkerhand van Jakob</text><text x="68" y="390" class="body">Op Manasse, de eerstgeborene.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Jozef wil de handen verleggen</text><text x="68" y="539" class="body">Hij wil de rechterhand op Manasse</text><text x="68" y="582" class="body">leggen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Jakob kiest bewust</text><text x="68" y="731" class="body">Hij weigert en noemt Efraïm vóór</text><text x="68" y="774" class="body">Manasse in de zegen.</text><text x="46" y="867" class="note">Rechts en links zijn vanuit Jakob beschreven,</text><text x="46" y="903" class="note">onafhankelijk van de kijkrichting van de lezer.</text></svg>