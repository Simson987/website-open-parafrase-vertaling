<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Dina en de stad Sichem</title><desc id="desc">Genesis 34 beschrijft geweld tegen Dina, onderhandelingen, het bedrog van haar broers, de aanval op Sichem en Jakobs verwijt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dina en de stad Sichem</text><text x="44" y="113" class="ref">Genesis 34:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dina wordt geweld aangedaan</text><text x="68" y="241" class="body">Sichem verkracht haar; Jakob en haar</text><text x="68" y="284" class="body">broers horen wat is gebeurd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het voorstel</text><text x="68" y="433" class="body">Hemor en Sichem vragen om een huwelijk</text><text x="68" y="476" class="body">en samenwonen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het bedrieglijke antwoord</text><text x="68" y="625" class="body">Jakobs zonen eisen dat alle mannen</text><text x="68" y="668" class="body">besneden worden.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Geweld en vertrek</text><text x="68" y="817" class="body">Simeon en Levi doden de mannen en halen</text><text x="68" y="860" class="body">Dina uit het huis; de stad wordt</text><text x="68" y="903" class="body">geplunderd.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Jakobs reactie</text><text x="68" y="1052" class="body">Jakob verwijt Simeon en Levi dat zij</text><text x="68" y="1095" class="body">het hele gezin in gevaar hebben</text><text x="68" y="1138" class="body">gebracht.</text><text x="46" y="1231" class="note">Een sober verhaaloverzicht dat het geweld</text><text x="46" y="1267" class="note">benoemt; geen romantische voorstelling van</text><text x="46" y="1303" class="note">Dina’s situatie.</text></svg>