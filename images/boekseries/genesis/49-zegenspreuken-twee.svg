<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1502" viewBox="0 0 840 1502" role="img" aria-labelledby="title desc"><title id="title">Jakobs woorden: tweede groep</title><desc id="desc">De overige zegenspreuken gaan over Dan, Gad, Aser, Nafthali, Jozef en Benjamin. Het zijn poëtische woorden met een afzonderlijke zegen voor elke stam.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1502" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jakobs woorden: tweede groep</text><text x="44" y="113" class="ref">Genesis 49:16–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dan</text><text x="68" y="241" class="body">Rechtspraak en het beeld van een slang</text><text x="68" y="284" class="body">langs het pad.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gad</text><text x="68" y="433" class="body">Wordt aangevallen en zal uiteindelijk</text><text x="68" y="476" class="body">zelf aanvallen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Aser</text><text x="68" y="625" class="body">Rijk brood en lekkernijen voor een</text><text x="68" y="668" class="body">koning.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nafthali</text><text x="68" y="817" class="body">Een vrijgelaten hinde en mooie woorden.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Jozef</text><text x="68" y="966" class="body">Vruchtbare tak bij een bron; kracht en</text><text x="68" y="1009" class="body">overvloedige zegen.</text><rect x="42" y="1067" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Benjamin</text><text x="68" y="1158" class="body">Een wolf als beeld van kracht en buit.</text><rect x="42" y="1216" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1259" class="label">Twaalf stammen</text><text x="68" y="1307" class="body">Ieder ontvangt zijn eigen zegen.</text><text x="46" y="1400" class="note">Vers 18 onderbreekt de spreuken met een gebed om</text><text x="46" y="1436" class="note">de redding van de HEERE.</text></svg>