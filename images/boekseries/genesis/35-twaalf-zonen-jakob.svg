<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">De twaalf zonen van Jakob</title><desc id="desc">Jakobs twaalf zonen per moeder: Lea heeft Ruben, Simeon, Levi, Juda, Issaschar en Zebulon; Rachel Jozef en Benjamin; Bilha Dan en Nafthali; Zilpa Gad en Aser.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twaalf zonen van Jakob</text><text x="44" y="113" class="ref">Genesis 35:23–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lea → zes zonen</text><text x="68" y="241" class="body">Ruben, Simeon, Levi, Juda, Issaschar en</text><text x="68" y="284" class="body">Zebulon.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rachel → twee zonen</text><text x="68" y="433" class="body">Jozef en Benjamin.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bilha → twee zonen</text><text x="68" y="582" class="body">Dan en Nafthali.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Zilpa → twee zonen</text><text x="68" y="731" class="body">Gad en Aser.</text><text x="46" y="824" class="note">Dit overzicht gaat over de twaalf zonen. Dina is</text><text x="46" y="860" class="note">Jakobs dochter en staat daarom niet in deze</text><text x="46" y="896" class="note">zonenlijst.</text></svg>