<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">Twee dromen in de gevangenis</title><desc id="desc">De schenker droomt van drie ranken en wordt na drie dagen hersteld. De bakker droomt van drie manden en wordt na drie dagen ter dood gebracht. De schenker vergeet Jozef.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee dromen in de gevangenis</text><text x="44" y="113" class="ref">Genesis 40:9–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De schenker: drie ranken</text><text x="68" y="241" class="body">De wijnstok draagt druiven; hij geeft</text><text x="68" y="284" class="body">de beker aan Farao.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Uitleg: drie dagen</text><text x="68" y="433" class="body">De schenker wordt hersteld in zijn</text><text x="68" y="476" class="body">ambt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De bakker: drie manden</text><text x="68" y="625" class="body">Vogels eten uit de bovenste mand met</text><text x="68" y="668" class="body">gebak.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Uitleg: drie dagen</text><text x="68" y="817" class="body">De bakker wordt ter dood gebracht.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Na afloop</text><text x="68" y="966" class="body">De schenker vergeet Jozef.</text><text x="46" y="1059" class="note">Het schema benoemt de verschillende uitkomsten</text><text x="46" y="1095" class="note">zonder de executie af te beelden.</text></svg>