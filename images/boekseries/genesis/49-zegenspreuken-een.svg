<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Jakobs woorden: eerste groep</title><desc id="desc">De eerste zegenspreuken gaan over Ruben, Simeon, Levi, Juda, Zebulon en Issaschar, met beeldspraak over water, leeuw, kust en lastdier.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jakobs woorden: eerste groep</text><text x="44" y="113" class="ref">Genesis 49:3–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben</text><text x="68" y="241" class="body">Eerstgeborene, maar onstuimig als</text><text x="68" y="284" class="body">water; hij verliest zijn voorrang.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Simeon en Levi</text><text x="68" y="433" class="body">Hun woede en geweld worden afgekeurd;</text><text x="68" y="476" class="body">zij worden verdeeld en verspreid.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Juda</text><text x="68" y="625" class="body">Lof van broers; leeuw en scepter zijn</text><text x="68" y="668" class="body">beelden van zijn positie.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zebulon</text><text x="68" y="817" class="body">Zeekust en een haven voor schepen, in</text><text x="68" y="860" class="body">de richting van Sidon.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Issaschar</text><text x="68" y="1009" class="body">Een sterke ezel, rust en vruchtbaar</text><text x="68" y="1052" class="body">land, maar ook lasten en dwangarbeid.</text><text x="46" y="1145" class="note">Poëtische woorden over de zonen en stammen;</text><text x="46" y="1181" class="note">dierbeelden zijn geen afzonderlijke historische</text><text x="46" y="1217" class="note">gebeurtenissen.</text></svg>