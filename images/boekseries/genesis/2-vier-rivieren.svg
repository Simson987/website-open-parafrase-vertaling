<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">De rivier splitst zich</title><desc id="desc">Vanuit Eden stroomt één rivier die zich splitst in Pison, Gihon, Hiddekel en Frath. De ligging van Eden wordt niet op een kaart vastgelegd.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De rivier splitst zich</text><text x="44" y="113" class="ref">Genesis 2:10–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eden</text><text x="68" y="241" class="body">Eén rivier geeft de tuin water en</text><text x="68" y="284" class="body">splitst zich vervolgens in vier</text><text x="68" y="327" class="body">rivieren.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">1 · Pison</text><text x="68" y="476" class="body">Stroomt om Havila, waar goud is.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">2 · Gihon</text><text x="68" y="625" class="body">Stroomt om het land Cusch.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">3 · Hiddekel</text><text x="68" y="774" class="body">Stroomt ten oosten van Assur.</text><rect x="42" y="832" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">4 · Frath</text><text x="68" y="923" class="body">De vierde genoemde rivier.</text><text x="46" y="1016" class="note">Dit is een tekstschema, geen geografische</text><text x="46" y="1052" class="note">reconstructie van Eden.</text></svg>