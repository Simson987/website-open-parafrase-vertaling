<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Vier koningen tegen vijf</title><desc id="desc">De vier koningen Amrafel, Arioch, Kedor-laomer en Tideal strijden tegen de vijf koningen van Sodom, Gomorra, Adama, Zeboim en Bela of Zoar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier koningen tegen vijf</text><text x="44" y="113" class="ref">Genesis 14:1–9</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vier bondgenoten</text><text x="68" y="241" class="body">Amrafel — Sinear; Arioch — Ellasar;</text><text x="68" y="284" class="body">Kedor-laomer — Elam; Tideal — de</text><text x="68" y="327" class="body">volken.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vijf koningen van de vlakte</text><text x="68" y="476" class="body">Bera — Sodom; Birsa — Gomorra; Sinab —</text><text x="68" y="519" class="body">Adama; Semeber — Zeboim; de niet bij</text><text x="68" y="562" class="body">naam genoemde koning van Bela (Zoar).</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Plaats van de strijd</text><text x="68" y="711" class="body">Het dal Siddim, waar nu de Zoutzee</text><text x="68" y="754" class="body">ligt.</text><text x="46" y="847" class="note">Het schema volgt de namen in de plaatselijke</text><text x="46" y="883" class="note">tekst. De koning van Bela krijgt geen verzonnen</text><text x="46" y="919" class="note">naam.</text></svg>