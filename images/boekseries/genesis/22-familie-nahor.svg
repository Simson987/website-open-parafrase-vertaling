<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De familie van Nahor</title><desc id="desc">Nahor en Milka hebben acht zonen: Uz, Buz, Kemuël, Chesed, Hazo, Pildas, Jidlaf en Bethuël. Kemuël is de vader van Aram, Bethuël van Rebekka. Reüma krijgt Tebah, Gaham, Tahas en Maächa.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De familie van Nahor</text><text x="44" y="113" class="ref">Genesis 22:20–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nahor + Milka</text><text x="68" y="241" class="body">Hun acht zonen: Uz, Buz, Kemuël,</text><text x="68" y="284" class="body">Chesed, Hazo, Pildas, Jidlaf en</text><text x="68" y="327" class="body">Bethuël.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Kemuël → Aram</text><text x="68" y="476" class="body">Kemuël wordt als vader van Aram</text><text x="68" y="519" class="body">genoemd.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bethuël → Rebekka</text><text x="68" y="668" class="body">Zo introduceert dit hoofdstuk Rebekka.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nahor + Reüma</text><text x="68" y="817" class="body">Hun zonen: Tebah, Gaham, Tahas en</text><text x="68" y="860" class="body">Maächa.</text><text x="46" y="953" class="note">Milka en Reüma hebben verschillende</text><text x="46" y="989" class="note">familietakken; de naam Aram staat hier bij</text><text x="46" y="1025" class="note">Kemuël.</text></svg>