<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1111" viewBox="0 0 840 1111" role="img" aria-labelledby="title desc"><title id="title">Van Sem naar Abram</title><desc id="desc">Afstammingslijn Sem, Arfachsad, Selah, Heber, Peleg, Rehu, Serug, Nahor, Terah. Terahs zonen zijn Abram, Nahor en Haran. Harans kinderen zijn Lot, Milka en Jiska; Abram trouwt met Sarai en Nahor met Milka.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1111" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Sem naar Abram</text><text x="44" y="113" class="ref">Genesis 11:10–29</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sem → Arfachsad → Selah</text><text x="68" y="241" class="body">Selah → Heber → Peleg.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Peleg → Rehu → Serug</text><text x="68" y="390" class="body">Serug → Nahor → Terah.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Terah → zijn zonen</text><text x="68" y="539" class="body">Abram, Nahor en Haran.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Haran → zijn kinderen</text><text x="68" y="688" class="body">Lot, Milka en Jiska.</text><rect x="42" y="746" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Huwelijken in de tekst</text><text x="68" y="837" class="body">Abram trouwt met Sarai; Nahor trouwt</text><text x="68" y="880" class="body">met Milka, de dochter van Haran.</text><text x="46" y="973" class="note">Nahor komt twee keer voor: als vader van Terah</text><text x="46" y="1009" class="note">en als zoon van Terah. Dit zijn verschillende</text><text x="46" y="1045" class="note">personen.</text></svg>