<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De nakomelingen van Sem</title><desc id="desc">Sems zonen: Elam, Assur, Arfachsad, Lud en Aram. Arams zonen: Uz, Hul, Gether en Maz. Arfachsad krijgt Selah; Selah Heber; Heber Peleg en Joktan. Joktans dertien genoemde zonen staan afzonderlijk vermeld.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nakomelingen van Sem</text><text x="44" y="113" class="ref">Genesis 10:21–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Noach → Sem</text><text x="68" y="241" class="body">Sem → Elam, Assur, Arfachsad, Lud en</text><text x="68" y="284" class="body">Aram.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aram → zijn zonen</text><text x="68" y="433" class="body">Uz, Hul, Gether en Maz.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Arfachsad → Selah → Heber</text><text x="68" y="582" class="body">Heber → Peleg en Joktan.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Joktan → zijn zonen</text><text x="68" y="731" class="body">Almodad, Selef, Hatsarmaveth, Jarach,</text><text x="68" y="774" class="body">Hadoram, Usal, Dikla, Obal, Abimaël,</text><text x="68" y="817" class="body">Scheba, Ofir, Havila en Jobab.</text><text x="46" y="910" class="note">Pijlen tonen de in dit hoofdstuk genoemde</text><text x="46" y="946" class="note">afstamming. De lijn via Peleg gaat verder in</text><text x="46" y="982" class="note">Genesis 11.</text></svg>