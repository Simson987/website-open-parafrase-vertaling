<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">De nakomelingen van Ketura</title><desc id="desc">Abraham en Ketura hebben zes zonen. Joksan krijgt Seba en Dedan. Dedans nakomelingen zijn Assurieten, Letusieten en Leummieten. Midian krijgt Efa, Efer, Henoch, Abida en Eldaa.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nakomelingen van Ketura</text><text x="44" y="113" class="ref">Genesis 25:1–4</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Abraham + Ketura</text><text x="68" y="241" class="body">Zimran, Joksan, Medan, Midian, Jisbak</text><text x="68" y="284" class="body">en Suah.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Joksan → zijn zonen</text><text x="68" y="433" class="body">Seba en Dedan.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Dedan → zijn nakomelingen</text><text x="68" y="582" class="body">Assurieten, Letusieten en Leummieten.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Midian → zijn zonen</text><text x="68" y="731" class="body">Efa, Efer, Henoch, Abida en Eldaa.</text><text x="46" y="824" class="note">Deze familietak staat naast de lijnen van Izak</text><text x="46" y="860" class="note">en Ismaël.</text></svg>