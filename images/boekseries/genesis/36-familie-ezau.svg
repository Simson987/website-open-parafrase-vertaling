<svg xmlns="http://www.w3.org/2000/svg" width="840" height="813" viewBox="0 0 840 813" role="img" aria-labelledby="title desc"><title id="title">Ezau en zijn familietakken</title><desc id="desc">Ezau heeft familietakken via Ada en Elifaz, Basmath en Rehuël, en Aholibama met Jehus, Jaëlam en Korah.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="813" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ezau en zijn familietakken</text><text x="44" y="113" class="ref">Genesis 36:2–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ada + Ezau → Elifaz</text><text x="68" y="241" class="body">Elifaz → Teman, Omar, Zefo, Gaëtam en</text><text x="68" y="284" class="body">Kenaz. Elifaz en Timna → Amalek.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Basmath + Ezau → Rehuël</text><text x="68" y="433" class="body">Rehuël → Nahath, Zerah, Samma en Mizza.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Aholibama + Ezau</text><text x="68" y="582" class="body">Hun zonen: Jehus, Jaëlam en Korah.</text><text x="46" y="675" class="note">De namen volgen Genesis 36; eerdere hoofdstukken</text><text x="46" y="711" class="note">gebruiken deels andere namen voor Ezau’s</text><text x="46" y="747" class="note">vrouwen.</text></svg>