<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Drie gesprekken na de vlucht</title><desc id="desc">Belangrijke verschillende gesprekken, landverdeling en spanningen tussen stammen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie gesprekken na de vlucht</text><text x="44" y="113" class="ref">2 Samuël 19:24–43</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mefiboseth</text><text x="68" y="241" class="body">Onverzorgd uit trouw; zegt dat Ziba hem</text><text x="68" y="284" class="body">bedroog en belasterde.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het land</text><text x="68" y="433" class="body">David laat delen; Mefiboseth stelt de</text><text x="68" y="476" class="body">veilige terugkeer boven het bezit.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Barzillai</text><text x="68" y="625" class="body">Tachtig jaar; wil thuis blijven;</text><text x="68" y="668" class="body">Chimham mag meegaan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het afscheid</text><text x="68" y="817" class="body">David kust en zegent Barzillai; verder</text><text x="68" y="860" class="body">naar Gilgal.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het geschil</text><text x="68" y="1009" class="body">Israël noemt tien delen aan de koning;</text><text x="68" y="1052" class="body">Juda beroept zich op verwantschap en</text><text x="68" y="1095" class="body">spreekt harder.</text><text x="46" y="1188" class="note">Mefiboseths verklaring staat tegenover Ziba’s</text><text x="46" y="1224" class="note">bericht in hoofdstuk 16; geen van beide wordt</text><text x="46" y="1260" class="note">als ongeciteerd vertellersfeit behandeld.</text></svg>