<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Tekoa en Joabs plan</title><desc id="desc">De vertelling, toepassing en beperkte toestemming voor Absalom.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tekoa en Joabs plan</text><text x="44" y="113" class="ref">2 Samuël 14:2–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De opdracht</text><text x="68" y="241" class="body">Joab laat de wijze vrouw rouw spelen en</text><text x="68" y="284" class="body">legt haar woorden in de mond.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het voorgestelde geval</text><text x="68" y="433" class="body">Weduwe met twee zonen; één gedood,</text><text x="68" y="476" class="body">overlevende erfgenaam bedreigd.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Davids toezegging</text><text x="68" y="625" class="body">Bescherming voor de zoon.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De toepassing</text><text x="68" y="774" class="body">Waarom de eigen verstoten zoon niet</text><text x="68" y="817" class="body">terughalen? David doorziet Joabs</text><text x="68" y="860" class="body">aandeel.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De beperkte terugkeer</text><text x="68" y="1009" class="body">Absalom uit Gesur naar Jeruzalem; naar</text><text x="68" y="1052" class="body">eigen huis, niet voor de koning.</text><text x="46" y="1145" class="note">Het geval van de weduwe hoort bij de overreding;</text><text x="46" y="1181" class="note">het is geen bevestigd familiebericht over de</text><text x="46" y="1217" class="note">vrouw.</text></svg>