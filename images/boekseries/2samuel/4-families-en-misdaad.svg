<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Families en de misdaad</title><desc id="desc">De broers, de afzonderlijke terugblik en Davids afwijzing van de moord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Families en de misdaad</text><text x="44" y="113" class="ref">2 Samuël 4:2–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De twee broers</text><text x="68" y="241" class="body">Baëna en Rechab, zonen van Rimmon, uit</text><text x="68" y="284" class="body">Beëroth en Benjamin.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het aparte familiebericht</text><text x="68" y="433" class="body">Mefiboseth is Jonathans zoon; vijf jaar</text><text x="68" y="476" class="body">bij de vlucht na Sauls dood; verlamd</text><text x="68" y="519" class="body">aan beide voeten.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De moord</text><text x="68" y="668" class="body">De broers komen bij Isboseths</text><text x="68" y="711" class="body">middagrust onder het voorwendsel tarwe</text><text x="68" y="754" class="body">te halen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Bij David</text><text x="68" y="903" class="body">Zij presenteren hun daad als wraak voor</text><text x="68" y="946" class="body">de koning; David veroordeelt die.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De afloop</text><text x="68" y="1095" class="body">De daders worden gedood; Isboseths</text><text x="68" y="1138" class="body">hoofd wordt in Abners graf te Hebron</text><text x="68" y="1181" class="body">begraven.</text><text x="46" y="1274" class="note">Het bericht over de vijfjarige Mefiboseth is een</text><text x="46" y="1310" class="note">terugblik, niet de leeftijd tijdens alle latere</text><text x="46" y="1346" class="note">gebeurtenissen.</text></svg>