<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De opbouw van het reddingslied</title><desc id="desc">Leeswijzer bij de vijf grotere bewegingen van het lied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De opbouw van het reddingslied</text><text x="44" y="113" class="ref">2 Samuël 22:1–51</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanhef en nood</text><text x="68" y="241" class="body">De HEERE als redder; hulpgeroep in de</text><text x="68" y="284" class="body">doodsnood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De redding</text><text x="68" y="433" class="body">Machtig ingrijpen en bevrijding van</text><text x="68" y="476" class="body">vijanden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Trouw en gerechtigheid</text><text x="68" y="625" class="body">David spreekt over zijn wegen, reinheid</text><text x="68" y="668" class="body">en Gods trouw.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ontvangen kracht</text><text x="68" y="817" class="body">Licht, vaste voeten, oefening en</text><text x="68" y="860" class="body">ruimte.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Slotlof</text><text x="68" y="1009" class="body">Redding en heerschappij; lof onder de</text><text x="68" y="1052" class="body">volken; goedheid aan David en zijn</text><text x="68" y="1095" class="body">nakomelingen.</text><text x="46" y="1188" class="note">De uitspraken over gerechtigheid zijn woorden</text><text x="46" y="1224" class="note">binnen Davids lied, naast het verhaal dat ook</text><text x="46" y="1260" class="note">zijn schuld heeft beschreven.</text></svg>