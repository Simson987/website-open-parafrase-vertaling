<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Het bestuur onder David</title><desc id="desc">Functies, namen en vaderrelaties uit de bestuurslijst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het bestuur onder David</text><text x="44" y="113" class="ref">2 Samuël 8:15–18</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De koning</text><text x="68" y="241" class="body">David doet recht en gerechtigheid.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Leger en kanselier</text><text x="68" y="390" class="body">Joab, zoon van Zeruja; Josafat, zoon</text><text x="68" y="433" class="body">van Achilud.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Priesters</text><text x="68" y="582" class="body">Zadok, zoon van Ahitub; Achimelech,</text><text x="68" y="625" class="body">zoon van Abjathar.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Schrijver</text><text x="68" y="774" class="body">Seraja.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Krethi en Plethi</text><text x="68" y="923" class="body">Benaja, zoon van Jojada; Davids zonen</text><text x="68" y="966" class="body">worden prinsen genoemd.</text><text x="46" y="1059" class="note">De naam en vaderrelatie van Achimelech volgen</text><text x="46" y="1095" class="note">precies deze lijst; niet verwisselen met eerdere</text><text x="46" y="1131" class="note">naamgenoten.</text></svg>