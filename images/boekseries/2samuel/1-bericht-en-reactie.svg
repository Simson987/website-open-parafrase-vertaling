<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Het bericht en de reactie</title><desc id="desc">Bode, bewijsstukken, bewering en Davids reactie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het bericht en de reactie</text><text x="44" y="113" class="ref">2 Samuël 1:2–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aankomst</text><text x="68" y="241" class="body">Derde dag; gescheurde kleren en aarde</text><text x="68" y="284" class="body">op het hoofd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het bericht</text><text x="68" y="433" class="body">De Amalekiet meldt Sauls en Jonathans</text><text x="68" y="476" class="body">dood en beweert Saul te hebben gedood.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De voorwerpen</text><text x="68" y="625" class="body">Hij brengt kroon en armband naar David.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Davids rouw</text><text x="68" y="774" class="body">Kleren scheuren, huilen en vasten tot</text><text x="68" y="817" class="body">de avond.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het oordeel</text><text x="68" y="966" class="body">David laat de bode doden op grond van</text><text x="68" y="1009" class="body">diens eigen uitspraak.</text><text x="46" y="1102" class="note">De bewering van de bode blijft onderscheiden van</text><text x="46" y="1138" class="note">het vertellersverslag in 1 Samuël 31.</text></svg>