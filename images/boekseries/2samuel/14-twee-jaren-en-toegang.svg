<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Twee jaren zonder toegang</title><desc id="desc">Uiterlijk, naamgenoten, wachttijd en gedwongen bemiddeling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee jaren zonder toegang</text><text x="44" y="113" class="ref">2 Samuël 14:25–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Absaloms uiterlijk</text><text x="68" y="241" class="body">Geprezen schoonheid; jaarlijks haar</text><text x="68" y="284" class="body">knippen, ongeveer twee kilo genoemd.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn gezin</text><text x="68" y="433" class="body">Drie zonen en één dochter Tamar.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De wachttijd</text><text x="68" y="582" class="body">Twee volle jaren in Jeruzalem zonder de</text><text x="68" y="625" class="body">koning te zien.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Joab komt niet</text><text x="68" y="774" class="body">Twee oproepen zonder gevolg; Absalom</text><text x="68" y="817" class="body">laat Joabs gerstakker verbranden.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De ontvangst</text><text x="68" y="966" class="body">Joab brengt de vraag; David laat</text><text x="68" y="1009" class="body">Absalom komen en kust hem.</text><text x="46" y="1102" class="note">De dochter Tamar is een andere persoon dan</text><text x="46" y="1138" class="note">Absaloms zus Tamar. Het haargewicht volgt deze</text><text x="46" y="1174" class="note">vertaling.</text></svg>