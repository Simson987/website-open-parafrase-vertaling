<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De route en de telling</title><desc id="desc">Reisvolgorde, duur, aantallen en bezwaar tegen de telling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De route en de telling</text><text x="44" y="113" class="ref">2 Samuël 24:2–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De opdracht</text><text x="68" y="241" class="body">Van Dan tot Berseba tellen; Joab maakt</text><text x="68" y="284" class="body">bezwaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Over de Jordaan</text><text x="68" y="433" class="body">Aroër, Gad en Jaëzer; daarna Gilead,</text><text x="68" y="476" class="body">Hodsi en Dan-Jaän.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De kust en het zuiden</text><text x="68" y="625" class="body">Omgeving Sidon, vesting Tyrus, Hevieten</text><text x="68" y="668" class="body">en Kanaänieten; als laatste Berseba.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De duur</text><text x="68" y="817" class="body">Negen maanden en twintig dagen.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De uitkomst</text><text x="68" y="966" class="body">Israël: 800.000 strijdbare mannen;</text><text x="68" y="1009" class="body">Juda: 500.000. Davids geweten spreekt</text><text x="68" y="1052" class="body">daarna.</text><text x="46" y="1145" class="note">Deze route geeft de genoemde volgorde, zonder</text><text x="46" y="1181" class="note">onbewezen coördinaten of moderne grenzen.</text></svg>