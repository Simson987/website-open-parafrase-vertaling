<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Twee adviezen aan Absalom</title><desc id="desc">De verschillende aantallen, timing, risico’s en gekozen strategie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee adviezen aan Absalom</text><text x="44" y="113" class="ref">2 Samuël 17:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achitofel</text><text x="68" y="241" class="body">Twaalfduizend man; direct vannacht; de</text><text x="68" y="284" class="body">vermoeide David alleen doden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Husai’s bezwaar</text><text x="68" y="433" class="body">David en mannen zijn ervaren; mogelijk</text><text x="68" y="476" class="body">in hinderlaag; kans op vroege paniek.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Husai’s voorstel</text><text x="68" y="625" class="body">Heel Israël verzamelen; Absalom zelf</text><text x="68" y="668" class="body">mee; overmacht tegen allen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De keuze</text><text x="68" y="817" class="body">Absalom en Israël verkiezen Husai’s</text><text x="68" y="860" class="body">raad.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De vertellersverklaring</text><text x="68" y="1009" class="body">De HEERE verijdelt Achitofels goede</text><text x="68" y="1052" class="body">raad om onheil over Absalom te brengen.</text><text x="46" y="1145" class="note">Beer, leeuw, zand en dauw zijn vergelijkingen in</text><text x="46" y="1181" class="note">Husai’s overreding, geen letterlijk extra</text><text x="46" y="1217" class="note">gebeurde scènes.</text></svg>