<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Gelijkenis en de aanklacht</title><desc id="desc">Verhaal, oordeel, toepassing en het verschil tussen vergeving en gevolgen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gelijkenis en de aanklacht</text><text x="44" y="113" class="ref">2 Samuël 12:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het vertelde verhaal</text><text x="68" y="241" class="body">Rijke man met veel vee; arme man met</text><text x="68" y="284" class="body">één geliefd ooilam.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het onrecht</text><text x="68" y="433" class="body">De rijke neemt het lam voor zijn gast.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Davids oordeel</text><text x="68" y="582" class="body">De daad verdient de dood; vierdubbele</text><text x="68" y="625" class="body">vergoeding.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Nathans toepassing</text><text x="68" y="774" class="body">U bent die man: Uria gedood en zijn</text><text x="68" y="817" class="body">vrouw genomen.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Erkenning en gevolgen</text><text x="68" y="966" class="body">David belijdt zonde; vergeving wordt</text><text x="68" y="1009" class="body">uitgesproken, maar ook blijvende</text><text x="68" y="1052" class="body">gevolgen en de dood van het kind.</text><text x="46" y="1145" class="note">Het lam hoort bij een gelijkenis, niet bij een</text><text x="46" y="1181" class="note">afzonderlijk voorval uit Davids huishouding.</text></svg>