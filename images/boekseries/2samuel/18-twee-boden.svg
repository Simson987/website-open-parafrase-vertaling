<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Twee boden naar David</title><desc id="desc">Vertrekvolgorde, inhalen, berichten en Davids reactie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee boden naar David</text><text x="44" y="113" class="ref">2 Samuël 18:19–33</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste zending</text><text x="68" y="241" class="body">Joab stuurt de Cuschiet.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Ahimaäz blijft vragen</text><text x="68" y="390" class="body">Hij mag ook lopen en haalt de Cuschiet</text><text x="68" y="433" class="body">via de vlakte in.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De wacht</text><text x="68" y="582" class="body">Ziet eerst één man, daarna de tweede,</text><text x="68" y="625" class="body">en herkent Ahimaäz.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De twee berichten</text><text x="68" y="774" class="body">Ahimaäz meldt overwinning maar ontwijkt</text><text x="68" y="817" class="body">de vraag; de Cuschiet bevestigt</text><text x="68" y="860" class="body">Absaloms dood indirect.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De vader</text><text x="68" y="1009" class="body">David gaat huilend naar de kamer boven</text><text x="68" y="1052" class="body">de poort.</text><text x="46" y="1145" class="note">Een overwinningsbericht kan voor David tegelijk</text><text x="46" y="1181" class="note">een diep verlies betekenen.</text></svg>