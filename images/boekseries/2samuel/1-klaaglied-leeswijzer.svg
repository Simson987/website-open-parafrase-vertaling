<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Leeswijzer bij het klaaglied</title><desc id="desc">De opbouw en beeldspraak van Davids rouwlied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leeswijzer bij het klaaglied</text><text x="44" y="113" class="ref">2 Samuël 1:17–27</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het terugkerende refrein</text><text x="68" y="241" class="body">Hoe zijn de helden gevallen!</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Wat niet moet gebeuren</text><text x="68" y="390" class="body">Geen vreugdebericht voor Gath en</text><text x="68" y="433" class="body">Askelon.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Gilboa</text><text x="68" y="582" class="body">De bergen en het weggegooide schild</text><text x="68" y="625" class="body">dragen de rouwtaal.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Saul en Jonathan</text><text x="68" y="774" class="body">Samen geliefd; sneller dan arenden,</text><text x="68" y="817" class="body">sterker dan leeuwen.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Persoonlijk verdriet</text><text x="68" y="966" class="body">David spreekt Jonathan als zijn</text><text x="68" y="1009" class="body">dierbare broer aan.</text><text x="46" y="1102" class="note">Arenden en leeuwen zijn vergelijkingen in het</text><text x="46" y="1138" class="note">lied, geen beschreven gedaanteveranderingen.</text></svg>