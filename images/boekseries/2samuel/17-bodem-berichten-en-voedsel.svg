<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Boden, berichten en voedsel</title><desc id="desc">De juiste informatieketen, schuilplaats en bevoorraders.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boden, berichten en voedsel</text><text x="44" y="113" class="ref">2 Samuël 17:15–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De keten</text><text x="68" y="241" class="body">Husai → Zadok en Abjathar →</text><text x="68" y="284" class="body">dienstmeisje → Jonathan en Ahimaäz →</text><text x="68" y="327" class="body">David.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De schuilplaats</text><text x="68" y="476" class="body">Gezien door een jongen; put in Bahurim,</text><text x="68" y="519" class="body">met kleed en gort afgedekt.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De oversteek</text><text x="68" y="668" class="body">David en heel het gevolg vóór het</text><text x="68" y="711" class="body">ochtendlicht over de Jordaan.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De twee kampen</text><text x="68" y="860" class="body">David in Mahanaïm; Absalom met Amasa</text><text x="68" y="903" class="body">als bevelhebber in Gilead.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De helpers</text><text x="68" y="1052" class="body">Sobi uit Rabba, Machir uit Lodebar en</text><text x="68" y="1095" class="body">Barzillai uit Rogelim brengen</text><text x="68" y="1138" class="body">beddengoed en voedsel.</text><text x="46" y="1231" class="note">Achitofel ziet zijn advies verworpen, gaat naar</text><text x="46" y="1267" class="note">huis en sterft door zelfdoding; dat wordt niet</text><text x="46" y="1303" class="note">grafisch afgebeeld.</text></svg>