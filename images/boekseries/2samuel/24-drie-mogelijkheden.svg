<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Drie mogelijkheden en de plaag</title><desc id="desc">De drie verschillende tijdseenheden en het stoppen van de plaag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie mogelijkheden en de plaag</text><text x="44" y="113" class="ref">2 Samuël 24:11–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gad komt</text><text x="68" y="241" class="body">De profeet en ziener brengt de keuze.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zeven jaar</text><text x="68" y="390" class="body">Hongersnood, volgens deze</text><text x="68" y="433" class="body">hoofdstuktekst.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Drie maanden</text><text x="68" y="582" class="body">Vlucht voor vijanden die achtervolgen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Drie dagen</text><text x="68" y="731" class="body">Pest; David beroept zich op Gods</text><text x="68" y="774" class="body">barmhartigheid.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">De uitkomst</text><text x="68" y="923" class="body">70.000 doden; het oordeel wordt gestopt</text><text x="68" y="966" class="body">bij Jeruzalem, bij Arauna’s dorsvloer.</text><text x="46" y="1059" class="note">De drie tijdsduren en 70.000 zijn exact deze</text><text x="46" y="1095" class="note">tekstwaarden; andere lezingen worden niet</text><text x="46" y="1131" class="note">ingevoegd.</text></svg>