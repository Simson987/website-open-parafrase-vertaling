<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Hongersnood en Rizpa</title><desc id="desc">Eed, honger, de zeven gedoden, de wake en de begrafenis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hongersnood en Rizpa</text><text x="44" y="113" class="ref">2 Samuël 21:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie jaar</text><text x="68" y="241" class="body">Hongersnood; David vraagt raad; Sauls</text><text x="68" y="284" class="body">geweld tegen Gibeonieten wordt genoemd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De eerdere eed</text><text x="68" y="433" class="body">Israël had hun een eed gezworen; Saul</text><text x="68" y="476" class="body">had hen toch willen uitroeien.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zeven uitgeleverd</text><text x="68" y="625" class="body">Twee zonen van Rizpa en vijf zonen van</text><text x="68" y="668" class="body">Michals zus; gedood bij begin</text><text x="68" y="711" class="body">gersteoogst.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Rizpa’s wake</text><text x="68" y="860" class="body">Rouwgewaad op de rots; vogels en wilde</text><text x="68" y="903" class="body">dieren weg houden tot de regen.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De gezamenlijke rustplaats</text><text x="68" y="1052" class="body">Beenderen van Saul, Jonathan en de</text><text x="68" y="1095" class="body">gedoden verzameld; begrafenis in Zela,</text><text x="68" y="1138" class="body">in Kis’ graf.</text><text x="46" y="1231" class="note">Rizpa’s volhardende zorg en de uiteindelijke</text><text x="46" y="1267" class="note">begrafenis krijgen aandacht; de lichamen worden</text><text x="46" y="1303" class="note">niet grafisch afgebeeld.</text></svg>