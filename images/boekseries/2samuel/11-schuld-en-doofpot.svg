<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Schuld en de doofpot</title><desc id="desc">De verantwoordelijkheid en opeenvolgende pogingen om de zwangerschap te verbergen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schuld en de doofpot</text><text x="44" y="113" class="ref">2 Samuël 11:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De achtergrond</text><text x="68" y="241" class="body">Joab en het leger belegeren Rabba;</text><text x="68" y="284" class="body">David blijft in Jeruzalem.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bathseba</text><text x="68" y="433" class="body">Dochter van Eliam, vrouw van Uria de</text><text x="68" y="476" class="body">Hethiet; David laat haar halen; zij</text><text x="68" y="519" class="body">meldt haar zwangerschap.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Uria teruggeroepen</text><text x="68" y="668" class="body">Gaat uit trouw aan de manschappen niet</text><text x="68" y="711" class="body">naar huis, ook niet na Davids maaltijd.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De brief</text><text x="68" y="860" class="body">Uria draagt zelf de opdracht die tot</text><text x="68" y="903" class="body">zijn dood moet leiden; Joab voert de</text><text x="68" y="946" class="body">plaatsing uit.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De afsluiting</text><text x="68" y="1095" class="body">Rouw om Uria; David neemt Bathseba als</text><text x="68" y="1138" class="body">vrouw; de verteller noemt Davids</text><text x="68" y="1181" class="body">handelen slecht.</text><text x="46" y="1274" class="note">Davids verhullende woorden over het zwaard zijn</text><text x="46" y="1310" class="note">zijn eigen reactie; de verteller verontschuldigt</text><text x="46" y="1346" class="note">hem niet.</text></svg>