<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1823" viewBox="0 0 840 1823" role="img" aria-labelledby="title desc"><title id="title">De namenlijst · verzen 24–31</title><desc id="desc">De gecontroleerde namen en relaties, gegroepeerd per bronvers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1823" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De namenlijst · verzen 24–31</text><text x="44" y="113" class="ref">2 Samuël 23:24–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 24</text><text x="68" y="241" class="body">Asahel, de broer van Joab, en Elhanan,</text><text x="68" y="284" class="body">de zoon van Dodo, uit Bethlehem,</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 25</text><text x="68" y="433" class="body">Samma, de Harodiet, Elika, de Harodiet,</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vers 26</text><text x="68" y="582" class="body">Helez, de Paltiet, Ira, de zoon van</text><text x="68" y="625" class="body">Ikes, de Thekoïet,</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Vers 27</text><text x="68" y="774" class="body">Abi-ezer, de Anethothiet, Mebunnai, de</text><text x="68" y="817" class="body">Husathiet,</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Vers 28</text><text x="68" y="966" class="body">Zalmon, de Ahohiet, Maharai, de</text><text x="68" y="1009" class="body">Netofathiet,</text><rect x="42" y="1067" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Vers 29</text><text x="68" y="1158" class="body">Heleb, de zoon van Baëna, de</text><text x="68" y="1201" class="body">Netofathiet, Ithai, de zoon van Ribai,</text><text x="68" y="1244" class="body">uit Gibea van de Benjaminieten,</text><rect x="42" y="1302" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1345" class="label">Vers 30</text><text x="68" y="1393" class="body">Benaja, de Pirhathoniet, Hiddai uit de</text><text x="68" y="1436" class="body">beken van Gaas,</text><rect x="42" y="1494" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1537" class="label">Vers 31</text><text x="68" y="1585" class="body">Abi-albon, de Arbathiet, Azmaveth, de</text><text x="68" y="1628" class="body">Barhumiet,</text><text x="46" y="1721" class="note">Naam, vaderrelatie en plaatsaanduiding zijn per</text><text x="46" y="1757" class="note">vers overgenomen. Het slot noemt in totaal 37.</text></svg>