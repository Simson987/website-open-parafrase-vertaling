<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Gezanten en twee fronten</title><desc id="desc">Aanleiding, ingehuurde aantallen en de gedeelde verdediging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gezanten en twee fronten</text><text x="44" y="113" class="ref">2 Samuël 10:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin</text><text x="68" y="241" class="body">Nahas sterft; Hanun volgt hem op; David</text><text x="68" y="284" class="body">stuurt troosters.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De belediging</text><text x="68" y="433" class="body">Hanun vertrouwt de vorsten; baarden en</text><text x="68" y="476" class="body">kleren van gezanten worden geschonden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De bescherming</text><text x="68" y="625" class="body">David laat hen in Jericho blijven tot</text><text x="68" y="668" class="body">de baarden zijn aangegroeid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De troepen</text><text x="68" y="817" class="body">20.000 uit Beth-rechob en Zoba; 1.000</text><text x="68" y="860" class="body">van Maächa; 12.000 van Tob.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Twee kanten</text><text x="68" y="1009" class="body">Joab tegenover Syriërs; Abisai</text><text x="68" y="1052" class="body">tegenover Ammonieten bij de stad;</text><text x="68" y="1095" class="body">wederzijdse hulp afgesproken.</text><text x="46" y="1188" class="note">De vernedering wordt beschreven; de afbeeldingen</text><text x="46" y="1224" class="note">tonen de mannen respectvol bedekt.</text></svg>