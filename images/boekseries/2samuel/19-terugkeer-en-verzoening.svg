<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Terugkeer en verzoening</title><desc id="desc">Rouw, politiek overleg, oversteek en terughouding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Terugkeer en verzoening</text><text x="44" y="113" class="ref">2 Samuël 19:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De rouw en de mannen</text><text x="68" y="241" class="body">Joab spreekt David aan; David ontvangt</text><text x="68" y="284" class="body">het volk in de poort.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De oproep</text><text x="68" y="433" class="body">Israël en Juda bespreken terughalen;</text><text x="68" y="476" class="body">Amasa krijgt het bevel aangeboden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De Jordaan</text><text x="68" y="625" class="body">Juda begeleidt de koning; veerpont voor</text><text x="68" y="668" class="body">de familie.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Simeï</text><text x="68" y="817" class="body">Komt met duizend Benjaminieten; erkent</text><text x="68" y="860" class="body">zijn zonde.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De eed</text><text x="68" y="1009" class="body">David weigert Abisai’s wraak en belooft</text><text x="68" y="1052" class="body">Simeï het leven.</text><text x="46" y="1145" class="note">De benoeming van Amasa en de belofte aan Simeï</text><text x="46" y="1181" class="note">zijn aparte beslissingen bij de terugkeer.</text></svg>