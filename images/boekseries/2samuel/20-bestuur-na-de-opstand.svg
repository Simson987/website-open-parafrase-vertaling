<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">Het bestuur na de opstand</title><desc id="desc">Alle genoemde ambten en de bijbehorende namen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het bestuur na de opstand</text><text x="44" y="113" class="ref">2 Samuël 20:23–26</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het leger</text><text x="68" y="241" class="body">Joab.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Krethi en Plethi</text><text x="68" y="390" class="body">Benaja, zoon van Jojada.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Arbeid en kanselier</text><text x="68" y="539" class="body">Adoram over dwangarbeid; Josafat, zoon</text><text x="68" y="582" class="body">van Ahilud, kanselier.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Schrijver en priesters</text><text x="68" y="731" class="body">Seja is schrijver; Zadok en Abjathar</text><text x="68" y="774" class="body">priesters.</text><rect x="42" y="832" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Hoge dienaar</text><text x="68" y="923" class="body">Ira, de Jaïriet.</text><text x="46" y="1016" class="note">De namen en functies volgen deze slotlijst, die</text><text x="46" y="1052" class="note">verschilt van de eerdere bestuurslijst.</text></svg>