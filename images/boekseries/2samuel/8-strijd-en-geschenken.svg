<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Veldtochten en geschenken</title><desc id="desc">De partijen, plaatsen en herkomst van voorwerpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Veldtochten en geschenken</text><text x="44" y="113" class="ref">2 Samuël 8:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Filistijnen en Moab</text><text x="68" y="241" class="body">Meteg-amma ingenomen; Moab onderworpen</text><text x="68" y="284" class="body">na gewelddadig oordeel.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zoba en Damaskus</text><text x="68" y="433" class="body">Hadad-ezer, zoon van Rechob; wagens,</text><text x="68" y="476" class="body">ruiters en voetvolk; Syrische hulp</text><text x="68" y="519" class="body">verslagen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De goederen</text><text x="68" y="668" class="body">Gouden schilden; koper uit Betach en</text><text x="68" y="711" class="body">Berothai.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Hamath</text><text x="68" y="860" class="body">Thoi stuurt zijn zoon Joram met</text><text x="68" y="903" class="body">zilveren, gouden en koperen voorwerpen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Toewijding en bezetting</text><text x="68" y="1052" class="body">Goederen aan de HEERE gewijd; ook</text><text x="68" y="1095" class="body">bezettingen in Edom genoemd.</text><text x="46" y="1188" class="note">De onderwerping en het geweld worden benoemd,</text><text x="46" y="1224" class="note">zonder de overwonnenen als decor voor een</text><text x="46" y="1260" class="note">feestbeeld te gebruiken.</text></svg>