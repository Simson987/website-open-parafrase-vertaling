<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Tamar en het geweld</title><desc id="desc">Familierelaties, bedrog, expliciete weigering en de gevolgen voor Tamar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tamar en het geweld</text><text x="44" y="113" class="ref">2 Samuël 13:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De familie</text><text x="68" y="241" class="body">Amnon en Absalom zijn zonen van David;</text><text x="68" y="284" class="body">Tamar is Absaloms zus.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het bedrog</text><text x="68" y="433" class="body">Jonadab, zoon van Davids broer Simea,</text><text x="68" y="476" class="body">geeft het plan om ziekte voor te</text><text x="68" y="519" class="body">wenden.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De duidelijke weigering</text><text x="68" y="668" class="body">Tamar noemt het geweld en een</text><text x="68" y="711" class="body">schanddaad; Amnon luistert niet en</text><text x="68" y="754" class="body">verkracht haar.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Daarna</text><text x="68" y="903" class="body">Amnon haat haar, laat haar buitenzetten</text><text x="68" y="946" class="body">en de deur sluiten.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De gevolgen</text><text x="68" y="1095" class="body">Tamar rouwt en woont eenzaam bij</text><text x="68" y="1138" class="body">Absalom. David is kwaad; Absalom zwijgt</text><text x="68" y="1181" class="body">tegen Amnon en haat hem.</text><text x="46" y="1274" class="note">De schuld ligt bij Amnon. Tamars protest en</text><text x="46" y="1310" class="note">gevolgen worden niet veranderd in een romantisch</text><text x="46" y="1346" class="note">tafereel.</text></svg>