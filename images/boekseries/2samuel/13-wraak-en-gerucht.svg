<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Wraak, gerucht en vlucht</title><desc id="desc">De twee tijdsprongen, de wraak en het verschil tussen gerucht en werkelijkheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wraak, gerucht en vlucht</text><text x="44" y="113" class="ref">2 Samuël 13:23–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee jaar later</text><text x="68" y="241" class="body">Absalom heeft scheerders in Baäl-hazor</text><text x="68" y="284" class="body">en nodigt de koningszonen uit.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De opdracht</text><text x="68" y="433" class="body">Hij laat Amnon door zijn knechten</text><text x="68" y="476" class="body">doden; de overige zonen vluchten op</text><text x="68" y="519" class="body">muildieren.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het onjuiste bericht</text><text x="68" y="668" class="body">Alle zonen zouden gedood zijn.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Jonadabs correctie</text><text x="68" y="817" class="body">Alleen Amnon is dood; daarna komen de</text><text x="68" y="860" class="body">andere zonen huilend terug.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Gesur</text><text x="68" y="1009" class="body">Absalom vlucht naar koning Thalmai,</text><text x="68" y="1052" class="body">zoon van Ammihur; verblijf drie jaar.</text><text x="46" y="1145" class="note">Het eerste bericht aan David is een gerucht en</text><text x="46" y="1181" class="note">wordt door de gebeurtenissen gecorrigeerd.</text></svg>