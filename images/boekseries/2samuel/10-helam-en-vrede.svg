<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Helam en de vrede</title><desc id="desc">De tweede strijd en de politieke afloop.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Helam en de vrede</text><text x="44" y="113" class="ref">2 Samuël 10:15–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opnieuw verzamelen</text><text x="68" y="241" class="body">Hadad-ezer roept Syriërs van over de</text><text x="68" y="284" class="body">rivier op; Sobach leidt hen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">David trekt op</text><text x="68" y="433" class="body">Hij steekt de Jordaan over naar Helam.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De afloop</text><text x="68" y="582" class="body">De tekst noemt 700 wagens en 40.000</text><text x="68" y="625" class="body">ruiters; Sobach sterft.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De vrede</text><text x="68" y="774" class="body">Ondergeschikte koningen van Hadad-ezer</text><text x="68" y="817" class="body">sluiten vrede met Israël.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het gevolg</text><text x="68" y="966" class="body">Syriërs durven Ammon niet meer te</text><text x="68" y="1009" class="body">helpen.</text><text x="46" y="1102" class="note">De aantallen volgen dit hoofdstuk; andere</text><text x="46" y="1138" class="note">parallelle tellingen worden hier niet</text><text x="46" y="1174" class="note">stilzwijgend ingevoegd.</text></svg>