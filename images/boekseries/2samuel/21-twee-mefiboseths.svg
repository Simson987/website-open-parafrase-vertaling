<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Twee mensen: Mefiboseth</title><desc id="desc">De twee verschillende personen en de gecontroleerde ouderrelaties.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee mensen: Mefiboseth</text><text x="44" y="113" class="ref">2 Samuël 21:7–8</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gespaarde</text><text x="68" y="241" class="body">Zoon van Jonathan, kleinzoon van Saul;</text><text x="68" y="284" class="body">gespaard wegens Davids eed aan</text><text x="68" y="327" class="body">Jonathan.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De andere naamgenoot</text><text x="68" y="476" class="body">Zoon van Saul en Rizpa, dochter van</text><text x="68" y="519" class="body">Aja; broer van Armoni.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De vijf anderen</text><text x="68" y="668" class="body">Zonen van de zus van Michal en Adriël,</text><text x="68" y="711" class="body">zoon van Barzillai, de Meholathiet.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De eed</text><text x="68" y="860" class="body">Het sparen betreft Jonathans zoon, niet</text><text x="68" y="903" class="body">alle mensen met dezelfde naam.</text><text x="46" y="996" class="note">De plaatselijke tekst noemt de moeder van de</text><text x="46" y="1032" class="note">vijf: de zus van Michal. De naam wordt hier niet</text><text x="46" y="1068" class="note">zonder vermelding vervangen.</text></svg>