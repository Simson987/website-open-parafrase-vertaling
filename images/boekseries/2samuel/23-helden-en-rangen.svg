<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Helden, daden en rangen</title><desc id="desc">De benoemde helden en de verschillende rangvermeldingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Helden, daden en rangen</text><text x="44" y="113" class="ref">2 Samuël 23:8–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Joscheb-Baschebeth</text><text x="68" y="241" class="body">De Tachkemoniet, ook Adino de Ezniet</text><text x="68" y="284" class="body">genoemd; voornaamste aanvoerder.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eleazar</text><text x="68" y="433" class="body">Zoon van Dodo, de Ahohiet; houdt stand</text><text x="68" y="476" class="body">tot zijn hand moe wordt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Samma</text><text x="68" y="625" class="body">Zoon van Age, de Harariet; verdedigt de</text><text x="68" y="668" class="body">linzenakker.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De drie bij Bethlehem</text><text x="68" y="817" class="body">Halen water uit de put bij de poort;</text><text x="68" y="860" class="body">David giet het uit in plaats van het te</text><text x="68" y="903" class="body">drinken.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Abisai en Benaja</text><text x="68" y="1052" class="body">Geëerde aanvoerders met eigen daden; de</text><text x="68" y="1095" class="body">tekst onderscheidt hen van de eerste</text><text x="68" y="1138" class="body">drie.</text><text x="46" y="1231" class="note">De verschillende vermeldingen van drie en dertig</text><text x="46" y="1267" class="note">blijven onderscheiden; gelijke rang wordt niet</text><text x="46" y="1303" class="note">uit gelijke aantallen afgeleid.</text></svg>