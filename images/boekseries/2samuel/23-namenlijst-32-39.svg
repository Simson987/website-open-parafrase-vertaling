<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1866" viewBox="0 0 840 1866" role="img" aria-labelledby="title desc"><title id="title">De namenlijst · verzen 32–39</title><desc id="desc">De gecontroleerde namen en relaties, gegroepeerd per bronvers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1866" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De namenlijst · verzen 32–39</text><text x="44" y="113" class="ref">2 Samuël 23:32–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 32</text><text x="68" y="241" class="body">Eljachba, de Saälboniet, Jonathan uit</text><text x="68" y="284" class="body">de zonen van Jazen,</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 33</text><text x="68" y="433" class="body">Samma, de Harariet, Ahiam, de zoon van</text><text x="68" y="476" class="body">Sarar, de Harariet,</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vers 34</text><text x="68" y="625" class="body">Elifelet, de zoon van Ahasbai, de zoon</text><text x="68" y="668" class="body">van een Maächathiet, Eliam, de zoon van</text><text x="68" y="711" class="body">Achitofel, de Giloniet,</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vers 35</text><text x="68" y="860" class="body">Hezrai, de Karmeliet, Paërai, de</text><text x="68" y="903" class="body">Arbiet,</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Vers 36</text><text x="68" y="1052" class="body">Jigal, de zoon van Nathan, uit Zoba,</text><text x="68" y="1095" class="body">Bani, de Gadiet,</text><rect x="42" y="1153" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">Vers 37</text><text x="68" y="1244" class="body">Zelek, de Ammoniet, Naharai, de</text><text x="68" y="1287" class="body">Beërothiet, de wapendrager van Joab, de</text><text x="68" y="1330" class="body">zoon van Zeruja,</text><rect x="42" y="1388" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1431" class="label">Vers 38</text><text x="68" y="1479" class="body">Ira, de Jethriet, Gareb, de Jethriet,</text><rect x="42" y="1537" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1580" class="label">Vers 39</text><text x="68" y="1628" class="body">en Uria, de Hethiet. In totaal waren</text><text x="68" y="1671" class="body">het er 37.</text><text x="46" y="1764" class="note">Naam, vaderrelatie en plaatsaanduiding zijn per</text><text x="46" y="1800" class="note">vers overgenomen. Het slot noemt in totaal 37.</text></svg>