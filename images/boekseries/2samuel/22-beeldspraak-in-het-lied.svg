<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Beeldspraak in het reddingslied</title><desc id="desc">Verbindingen tussen concrete beelden en hun poëtische betekenis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beeldspraak in het reddingslied</text><text x="44" y="113" class="ref">2 Samuël 22:2–37</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rots en vesting</text><text x="68" y="241" class="body">Toevlucht, bescherming en redding.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Water en touwen</text><text x="68" y="390" class="body">Doodsangst, benauwdheid en vastzitten.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Storm en donder</text><text x="68" y="539" class="body">Dichterlijke taal van Gods macht en</text><text x="68" y="582" class="body">ingrijpen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Opgetrokken en ruimte</text><text x="68" y="731" class="body">Redding uit sterke vijanden en een</text><text x="68" y="774" class="body">nieuwe vrije plaats.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Lamp en hinde</text><text x="68" y="923" class="body">Licht in de duisternis; vaste, snelle</text><text x="68" y="966" class="body">voeten op de hoogten.</text><text x="46" y="1059" class="note">Dit is een lied. Rook uit Gods neus, vuur uit</text><text x="46" y="1095" class="note">Zijn mond en de cherub worden niet als een</text><text x="46" y="1131" class="note">verzonnen portret van God afgebeeld.</text></svg>