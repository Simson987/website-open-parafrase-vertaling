<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Van Hebron naar Jeruzalem</title><desc id="desc">Leiderschap, regeringsduren, burcht en paleisbouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Hebron naar Jeruzalem</text><text x="44" y="113" class="ref">2 Samuël 5:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Alle stammen</text><text x="68" y="241" class="body">Erkennen David; verbond en zalving in</text><text x="68" y="284" class="body">Hebron.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De regeringsduur</text><text x="68" y="433" class="body">Dertig jaar bij aanvang; veertig jaar</text><text x="68" y="476" class="body">totaal genoemd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De twee steden</text><text x="68" y="625" class="body">Zeven jaar en zes maanden in Hebron; 33</text><text x="68" y="668" class="body">jaar in Jeruzalem.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Sion</text><text x="68" y="817" class="body">De Jebusitische burcht wordt de stad</text><text x="68" y="860" class="body">van David; David bouwt rondom.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Hiram van Tyrus</text><text x="68" y="1009" class="body">Cederhout, timmerlieden en steenhouwers</text><text x="68" y="1052" class="body">voor het paleis.</text><text x="46" y="1145" class="note">De totale en plaatselijke regeringsduren zijn</text><text x="46" y="1181" class="note">overgenomen zoals de tekst ze noemt.</text></svg>