<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Een huis: twee betekenissen</title><desc id="desc">Het onderscheid tussen gebouw, familie en koningschap.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een huis: twee betekenissen</text><text x="44" y="113" class="ref">2 Samuël 7:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Davids voornemen</text><text x="68" y="241" class="body">Zijn paleis is van cederhout; de ark</text><text x="68" y="284" class="body">staat onder tentdoeken.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nathans eerste antwoord</text><text x="68" y="433" class="body">Doe wat u van plan bent.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het woord in de nacht</text><text x="68" y="582" class="body">God heeft rondgetrokken in tent en</text><text x="68" y="625" class="body">tabernakel en vraagt niet om Davids</text><text x="68" y="668" class="body">bouwplan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Een huis voor David</text><text x="68" y="817" class="body">De belofte betreft zijn nakomelingen en</text><text x="68" y="860" class="body">koningschap.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De komende zoon</text><text x="68" y="1009" class="body">Zal een huis voor Gods naam bouwen; een</text><text x="68" y="1052" class="body">blijvende troon, vader-zoonrelatie en</text><text x="68" y="1095" class="body">goedheid.</text><text x="46" y="1188" class="note">Huis betekent hier zowel een gebouw als een</text><text x="46" y="1224" class="note">dynastie; de tekst noemt de komende zoon in dit</text><text x="46" y="1260" class="note">hoofdstuk niet bij naam.</text></svg>