<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Absaloms opbouw van macht</title><desc id="desc">Openbare toenadering, geheime afspraak en de onwetende genodigden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Absaloms opbouw van macht</text><text x="44" y="113" class="ref">2 Samuël 15:1–13</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het gevolg</text><text x="68" y="241" class="body">Wagens, paarden en vijftig voorlopers.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Bij de poort</text><text x="68" y="390" class="body">Hij bevestigt rechtszoekers, kleineert</text><text x="68" y="433" class="body">de toegang tot David en wint hun hart.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De reis naar Hebron</text><text x="68" y="582" class="body">Hij noemt een gelofte; de tekst zegt na</text><text x="68" y="625" class="body">veertig jaar.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het geheime signaal</text><text x="68" y="774" class="body">Boden en bazuin: Absalom is koning in</text><text x="68" y="817" class="body">Hebron. Tweehonderd genodigden weten</text><text x="68" y="860" class="body">van niets.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De groei</text><text x="68" y="1009" class="body">Achitofel sluit aan; David hoort dat</text><text x="68" y="1052" class="body">het hart van Israël naar Absalom</text><text x="68" y="1095" class="body">uitgaat.</text><text x="46" y="1188" class="note">Het jaargetal volgt deze hoofdstuktekst; geen</text><text x="46" y="1224" class="note">alternatieve lezing wordt zonder vermelding</text><text x="46" y="1260" class="note">ingevuld.</text></svg>