<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Wagen, dragers en tent</title><desc id="desc">Het verloop en het belangrijke verschil tussen beide tochten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wagen, dragers en tent</text><text x="44" y="113" class="ref">2 Samuël 6:3–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De nieuwe wagen</text><text x="68" y="241" class="body">Uza en Ahio, zonen van Abinadab; Ahio</text><text x="68" y="284" class="body">loopt voorop.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij Nachon</text><text x="68" y="433" class="body">Runderen struikelen, Uza grijpt de ark</text><text x="68" y="476" class="body">vast en sterft.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De onderbreking</text><text x="68" y="625" class="body">David bang; drie maanden in het huis</text><text x="68" y="668" class="body">van Obed-edom en zegen voor diens</text><text x="68" y="711" class="body">gezin.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De nieuwe tocht</text><text x="68" y="860" class="body">Dragers, zes stappen, offers, dans en</text><text x="68" y="903" class="body">bazuinen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">In de stad</text><text x="68" y="1052" class="body">Ark in de voorbereide tent; offers,</text><text x="68" y="1095" class="body">zegen en voedsel voor iedereen.</text><text x="46" y="1188" class="note">De wagen in de eerste tocht en de dragers in de</text><text x="46" y="1224" class="note">volgende tocht zijn verschillende</text><text x="46" y="1260" class="note">vervoerswijzen.</text></svg>