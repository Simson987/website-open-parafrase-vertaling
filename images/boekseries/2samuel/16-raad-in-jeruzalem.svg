<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Raad in Jeruzalem</title><desc id="desc">De raadgevers, hun woorden en de politieke bedoeling van het daktafereel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Raad in Jeruzalem</text><text x="44" y="113" class="ref">2 Samuël 16:15–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aankomst</text><text x="68" y="241" class="body">Absalom met Israël en Achitofel in</text><text x="68" y="284" class="body">Jeruzalem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Husai’s begroeting</text><text x="68" y="433" class="body">Leve de koning; Absalom bevraagt zijn</text><text x="68" y="476" class="body">trouw aan David.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Husai’s antwoord</text><text x="68" y="625" class="body">Hij biedt aan de zoon te dienen zoals</text><text x="68" y="668" class="body">de vader.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Achitofels advies</text><text x="68" y="817" class="body">De achtergelaten bijvrouwen publiek in</text><text x="68" y="860" class="body">bezit nemen; een tent op het dak.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De bedoeling</text><text x="68" y="1009" class="body">De breuk met David openlijk maken en de</text><text x="68" y="1052" class="body">aanhang versterken.</text><text x="46" y="1145" class="note">De daad wordt als machtspolitiek benoemd; de</text><text x="46" y="1181" class="note">vrouwen worden niet als seksueel schouwspel</text><text x="46" y="1217" class="note">afgebeeld.</text></svg>