<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Trouw aan Jonathans huis</title><desc id="desc">Vier generaties, landbeheer en het blijvende plaatsaanbod aan tafel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Trouw aan Jonathans huis</text><text x="44" y="113" class="ref">2 Samuël 9:1–13</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De familielijn</text><text x="68" y="241" class="body">Saul → Jonathan → Mefiboseth → Micha.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De vindplaats</text><text x="68" y="390" class="body">Huis van Machir, zoon van Ammiël, in</text><text x="68" y="433" class="body">Lodebar.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Davids toezegging</text><text x="68" y="582" class="body">Sauls akkers terug; altijd eten aan de</text><text x="68" y="625" class="body">koningstafel.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Ziba’s opdracht</text><text x="68" y="774" class="body">Met vijftien zonen en twintig slaven</text><text x="68" y="817" class="body">land bewerken en oogst binnenhalen.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De nieuwe woonplaats</text><text x="68" y="966" class="body">Mefiboseth woont in Jeruzalem en eet</text><text x="68" y="1009" class="body">als een koningszoon aan tafel.</text><text x="46" y="1102" class="note">Pijlen betekenen vader van. De zoon Micha is een</text><text x="46" y="1138" class="note">andere persoon dan de profeet met die naam.</text></svg>