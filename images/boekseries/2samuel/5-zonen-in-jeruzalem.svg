<svg xmlns="http://www.w3.org/2000/svg" width="840" height="770" viewBox="0 0 840 770" role="img" aria-labelledby="title desc"><title id="title">Genoemde zonen in Jeruzalem</title><desc id="desc">De elf namen gegroepeerd volgens de drie bronverzen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="770" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Genoemde zonen in Jeruzalem</text><text x="44" y="113" class="ref">2 Samuël 5:14–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 14</text><text x="68" y="241" class="body">Sammua, Sobab, Nathan en Salomo.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vers 15</text><text x="68" y="390" class="body">Jibchar, Elisua, Nefeg en Jafia.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Vers 16</text><text x="68" y="539" class="body">Elisama, Eljada en Elifeleth.</text><text x="46" y="632" class="note">Hier staan elf namen. Dit hoofdstuk geeft bij</text><text x="46" y="668" class="note">deze lijst geen moeders aan; die worden dus niet</text><text x="46" y="704" class="note">ingevuld.</text></svg>