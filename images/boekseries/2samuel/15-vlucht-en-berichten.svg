<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Vlucht en het berichtennetwerk</title><desc id="desc">De rollen bij vertrek, bewaring van de ark en het berichtennetwerk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vlucht en het berichtennetwerk</text><text x="44" y="113" class="ref">2 Samuël 15:14–37</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het vertrek</text><text x="68" y="241" class="body">David te voet met gezin; tien</text><text x="68" y="284" class="body">bijvrouwen blijven voor het paleis</text><text x="68" y="327" class="body">achter.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De trouwe Ithai</text><text x="68" y="476" class="body">Zeshonderd Gethieten; Ithai kiest te</text><text x="68" y="519" class="body">blijven met mannen en kinderen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De priesters</text><text x="68" y="668" class="body">Zadok en Abjathar brengen de ark terug</text><text x="68" y="711" class="body">naar de stad.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De zonen als boden</text><text x="68" y="860" class="body">Ahimaäz is Zadoks zoon; Jonathan is</text><text x="68" y="903" class="body">Abjathars zoon.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Husai</text><text x="68" y="1052" class="body">Terug naar Absalom; raad verijdelen en</text><text x="68" y="1095" class="body">informatie via priesters en zonen</text><text x="68" y="1138" class="body">doorgeven.</text><text x="46" y="1231" class="note">Jonathan in dit netwerk is de zoon van Abjathar,</text><text x="46" y="1267" class="note">niet de gestorven zoon van Saul.</text></svg>