<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">De laatste woorden</title><desc id="desc">De spreker, de bestuursvergelijking en de verbondswoorden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De laatste woorden</text><text x="44" y="113" class="ref">2 Samuël 23:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De spreker</text><text x="68" y="241" class="body">David, zoon van Isaï; gezalfde en</text><text x="68" y="284" class="body">psalmdichter van Israël.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het rechtvaardige bestuur</text><text x="68" y="433" class="body">Heersen in ontzag voor God.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De vergelijking</text><text x="68" y="582" class="body">Morgenlicht zonder wolken; gras na</text><text x="68" y="625" class="body">regen en zon.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het verbond</text><text x="68" y="774" class="body">Eeuwig, goed geregeld en bewaard; grond</text><text x="68" y="817" class="body">van redding en verlangen.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De doornstruiken</text><text x="68" y="966" class="body">Beeldspraak voor de nietsnutten en hun</text><text x="68" y="1009" class="body">einde.</text><text x="46" y="1102" class="note">Dit tekstdeel is poëtisch. De zon en het gras</text><text x="46" y="1138" class="note">vormen een vergelijking met rechtvaardig</text><text x="46" y="1174" class="note">bestuur.</text></svg>