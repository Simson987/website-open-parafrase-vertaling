<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Gibeon en de terugtocht</title><desc id="desc">De partijen, familiebanden, verliezen en verschillende terugroutes.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gibeon en de terugtocht</text><text x="44" y="113" class="ref">2 Samuël 2:12–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De twee zijden</text><text x="68" y="241" class="body">Abner met Isboseths dienaren; Joab met</text><text x="68" y="284" class="body">Davids dienaren bij de vijver.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De eerste mannen</text><text x="68" y="433" class="body">Twaalf per kant; het gevecht eindigt</text><text x="68" y="476" class="body">dodelijk.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Asahel</text><text x="68" y="625" class="body">Broer van Joab en Abisai; blijft Abner</text><text x="68" y="668" class="body">achtervolgen en wordt gedood.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De beëindiging</text><text x="68" y="817" class="body">Abner roept; Joab blaast; de</text><text x="68" y="860" class="body">achtervolging stopt.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De nasleep</text><text x="68" y="1009" class="body">Negentien mannen plus Asahel bij David;</text><text x="68" y="1052" class="body">360 bij Abner. Abner naar Mahanaïm;</text><text x="68" y="1095" class="body">Joab via Bethlehem naar Hebron.</text><text x="46" y="1188" class="note">De negentien vermisten en Asahel zijn in de</text><text x="46" y="1224" class="note">tekst afzonderlijk genoemd.</text></svg>