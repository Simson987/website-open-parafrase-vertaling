<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Michal en David</title><desc id="desc">Tijdstippen en verschillende uitspraken in het conflict.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Michal en David</text><text x="44" y="113" class="ref">2 Samuël 6:16–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uit het raam</text><text x="68" y="241" class="body">Michal ziet het dansen en minacht</text><text x="68" y="284" class="body">David.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Na de uitdeling</text><text x="68" y="433" class="body">David keert terug om zijn gezin te</text><text x="68" y="476" class="body">zegenen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Michals verwijt</text><text x="68" y="625" class="body">Zij spreekt over ontbloting en</text><text x="68" y="668" class="body">schaamteloosheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Davids antwoord</text><text x="68" y="817" class="body">Hij heeft voor de HEERE gedanst; hij</text><text x="68" y="860" class="body">wil gering zijn in eigen ogen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het slotbericht</text><text x="68" y="1009" class="body">Michal krijgt geen kinderen tot haar</text><text x="68" y="1052" class="body">dood.</text><text x="46" y="1145" class="note">Davids kleding wordt in vers 14 een linnen</text><text x="46" y="1181" class="note">priesterkleed genoemd; de rasterbeelden blijven</text><text x="46" y="1217" class="note">respectvol gekleed.</text></svg>