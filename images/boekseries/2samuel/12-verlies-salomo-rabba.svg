<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Verlies, Salomo en Rabba</title><desc id="desc">Verschillende geboorten en de afzonderlijke politieke slotgebeurtenissen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verlies, Salomo en Rabba</text><text x="44" y="113" class="ref">2 Samuël 12:15–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het zieke kind</text><text x="68" y="241" class="body">David bidt en vast; het kind sterft op</text><text x="68" y="284" class="body">de zevende dag.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De verandering</text><text x="68" y="433" class="body">David staat op, wast zich, aanbidt en</text><text x="68" y="476" class="body">eet; hij verklaart zijn hoop tijdens</text><text x="68" y="519" class="body">het leven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Een latere zoon</text><text x="68" y="668" class="body">Bathseba krijgt Salomo; Nathan brengt</text><text x="68" y="711" class="body">de naam Jedidja over.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Rabba</text><text x="68" y="860" class="body">Joab neemt de waterstad en laat David</text><text x="68" y="903" class="body">komen voor de verdere inname.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De nasleep</text><text x="68" y="1052" class="body">Kroon en buit; de tekst beschrijft ook</text><text x="68" y="1095" class="body">gewelddadige behandeling van de</text><text x="68" y="1138" class="body">Ammonieten.</text><text x="46" y="1231" class="note">De twee kinderen zijn verschillende zonen. De</text><text x="46" y="1267" class="note">gruwelijke nasleep wordt niet als</text><text x="46" y="1303" class="note">feestillustratie verbeeld.</text></svg>