<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Het bevel en de uitkomst</title><desc id="desc">De drie bevelhebbers, het genegeerde bevel en twee verschillende gedenkplekken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het bevel en de uitkomst</text><text x="44" y="113" class="ref">2 Samuël 18:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie afdelingen</text><text x="68" y="241" class="body">Joab; Abisai; Ithai de Gethiet. David</text><text x="68" y="284" class="body">blijft op verzoek in de stad.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het openbare bevel</text><text x="68" y="433" class="body">Zacht omgaan met Absalom; iedereen</text><text x="68" y="476" class="body">hoort het.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het woud</text><text x="68" y="625" class="body">Twintigduizend doden; het woud eist</text><text x="68" y="668" class="body">meer slachtoffers dan het zwaard.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Absalom</text><text x="68" y="817" class="body">Zijn hoofd raakt klem in een eik; de</text><text x="68" y="860" class="body">getuige wil hem niet doden, Joab en</text><text x="68" y="903" class="body">zijn mannen wel.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De nasleep</text><text x="68" y="1052" class="body">Bazuin, kuil en steenhoop; daarnaast</text><text x="68" y="1095" class="body">staat een eerder opgericht gedenkteken</text><text x="68" y="1138" class="body">in het Koningsdal.</text><text x="46" y="1231" class="note">De tekst zegt dat zijn hoofd klemraakt; niet dat</text><text x="46" y="1267" class="note">hij aan zijn haar wordt opgehangen. Het oudere</text><text x="46" y="1303" class="note">gedenkteken is een andere plek dan de kuil.</text></svg>