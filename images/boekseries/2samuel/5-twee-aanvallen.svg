<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Twee aanvallen in Refaïm</title><desc id="desc">De verschillende opdrachten bij twee aanvallen in hetzelfde dal.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee aanvallen in Refaïm</text><text x="44" y="113" class="ref">2 Samuël 5:17–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanleiding</text><text x="68" y="241" class="body">Filistijnen zoeken de pas gezalfde</text><text x="68" y="284" class="body">David en verspreiden zich in Refaïm.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste raad</text><text x="68" y="433" class="body">Optrekken; overwinning bij</text><text x="68" y="476" class="body">Baäl-perazim; achtergelaten afgoden.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tweede aanval</text><text x="68" y="625" class="body">Opnieuw verspreiding in hetzelfde dal.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Tweede raad</text><text x="68" y="774" class="body">Omgaan naar de moerbeziënbomen; wachten</text><text x="68" y="817" class="body">op het geluid in de toppen.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De uitvoering</text><text x="68" y="966" class="body">David gehoorzaamt; overwinning van Geba</text><text x="68" y="1009" class="body">tot Gezer.</text><text x="46" y="1102" class="note">Water dat doorbreekt is Davids vergelijking voor</text><text x="46" y="1138" class="note">de eerste overwinning.</text></svg>