<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Twee koningen en twee huizen</title><desc id="desc">Plaatsen, leiders, gebieden en verschillende regeringsduren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee koningen en twee huizen</text><text x="44" y="113" class="ref">2 Samuël 2:1–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">David</text><text x="68" y="241" class="body">Op raad naar Hebron; gezalfd door Juda.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zijn gezin en mannen</text><text x="68" y="390" class="body">Ahinoam en Abigaïl; mannen met hun</text><text x="68" y="433" class="body">gezinnen in omliggende steden.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Jabes in Gilead</text><text x="68" y="582" class="body">David eert de trouw bij Sauls</text><text x="68" y="625" class="body">begrafenis.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Isboseth</text><text x="68" y="774" class="body">Sauls zoon; door Abner in Mahanaïm als</text><text x="68" y="817" class="body">koning gevestigd.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De termijnen</text><text x="68" y="966" class="body">Isboseth: veertig jaar oud, twee jaar</text><text x="68" y="1009" class="body">regering. David in Hebron: zeven jaar</text><text x="68" y="1052" class="body">en zes maanden.</text><text x="46" y="1145" class="note">De twee regeringsduren worden naast elkaar</text><text x="46" y="1181" class="note">genoemd, zonder ze tot dezelfde periode te</text><text x="46" y="1217" class="note">verklaren.</text></svg>