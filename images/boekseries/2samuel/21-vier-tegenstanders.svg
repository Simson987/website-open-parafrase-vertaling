<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Vier tegenstanders van Rafa</title><desc id="desc">De namen, verwantschappen, locaties en de bijzondere telling van 24.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier tegenstanders van Rafa</text><text x="44" y="113" class="ref">2 Samuël 21:15–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Isbi-benob</text><text x="68" y="241" class="body">Wil de uitgeputte David doden; Abisai</text><text x="68" y="284" class="body">komt David te hulp.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Saf bij Gob</text><text x="68" y="433" class="body">Verslagen door Sibbechai, de Husathiet.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bij Gob</text><text x="68" y="582" class="body">Elhanan, zoon van Jaare-oregim,</text><text x="68" y="625" class="body">verslaat een metgezel van Goliath</text><text x="68" y="668" class="body">volgens deze tekst.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bij Gath</text><text x="68" y="817" class="body">Man met zes vingers per hand en zes</text><text x="68" y="860" class="body">tenen per voet: 24 totaal; Jonathan,</text><text x="68" y="903" class="body">zoon van Simea, verslaat hem.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De voorzorg</text><text x="68" y="1052" class="body">Davids mannen laten hem niet meer mee</text><text x="68" y="1095" class="body">ten strijde trekken: de lamp van Israël</text><text x="68" y="1138" class="body">mag niet doven.</text><text x="46" y="1231" class="note">Deze Jonathan is Davids neef. Vers 20 noemt zes</text><text x="46" y="1267" class="note">vingers per hand en zes tenen per voet: samen</text><text x="46" y="1303" class="note">24.</text></svg>