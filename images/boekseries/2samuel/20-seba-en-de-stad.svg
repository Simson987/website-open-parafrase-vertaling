<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Seba en de belegerde stad</title><desc id="desc">Nieuwe opstand, verantwoordelijkheden en het beëindigde beleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Seba en de belegerde stad</text><text x="44" y="113" class="ref">2 Samuël 20:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De nieuwe breuk</text><text x="68" y="241" class="body">Seba, zoon van Bichri, roept Israël van</text><text x="68" y="284" class="body">David weg; Juda blijft trouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Amasa en Abisai</text><text x="68" y="433" class="body">Drie dagen opdracht; Amasa te laat;</text><text x="68" y="476" class="body">Abisai op pad.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Joabs misdaad</text><text x="68" y="625" class="body">Hij doodt Amasa bij de steen van Gibeon</text><text x="68" y="668" class="body">en vervolgt Seba.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Abel-Beth-Maächa</text><text x="68" y="817" class="body">Belegeringswal en ondermijning; een</text><text x="68" y="860" class="body">wijze vrouw onderhandelt.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De afloop</text><text x="68" y="1009" class="body">Seba wordt gedood; Joab blaast en het</text><text x="68" y="1052" class="body">leger trekt weg.</text><text x="46" y="1145" class="note">De wijze vrouw vraagt behoud van de stad; de</text><text x="46" y="1181" class="note">uitvoering rond Seba wordt zakelijk benoemd</text><text x="46" y="1217" class="note">zonder verminking te tonen.</text></svg>