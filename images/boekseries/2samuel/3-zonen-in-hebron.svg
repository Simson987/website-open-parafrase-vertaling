<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1130" viewBox="0 0 1120 1130" role="img" aria-labelledby="title desc">
<title id="title">Davids zonen in Hebron</title>
<desc id="desc">David is de vader van zes genoemde zonen; per zoon staat de moeder. De volgorde is die van 2 Samuël 3:2–5.</desc>
<rect width="1120" height="1130" rx="24" fill="#f7f5ea"/>
<text x="42" y="66" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#173c31">Davids zonen in Hebron</text>
<text x="42" y="111" font-family="DejaVu Sans" font-size="28" fill="#5e665e">2 Samuël 3:2–5 · van oudste naar zesde</text>
<rect x="42" y="155" width="250" height="80" rx="15" fill="#dceadf"/>
<text x="167" y="206" text-anchor="middle" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#173c31">David · vader</text>
<path d="M90 235v680" stroke="#467d64" stroke-width="3"/>
<path d="M90 317h60" stroke="#467d64" stroke-width="3"/>
<rect x="150" y="275" width="410" height="84" rx="12" fill="white" stroke="#b9cbbd"/>
<text x="180" y="328" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#173c31">1. Amnon</text>
<text x="590" y="305" font-family="DejaVu Sans" font-size="25" fill="#5e665e">moeder</text>
<text x="590" y="340" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#173c31">Ahinoam uit Jizreël</text>
<path d="M90 432h60" stroke="#467d64" stroke-width="3"/>
<rect x="150" y="390" width="410" height="84" rx="12" fill="white" stroke="#b9cbbd"/>
<text x="180" y="443" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#173c31">2. Chileab</text>
<text x="590" y="420" font-family="DejaVu Sans" font-size="25" fill="#5e665e">moeder</text>
<text x="590" y="455" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#173c31">Abigaïl</text>
<path d="M90 547h60" stroke="#467d64" stroke-width="3"/>
<rect x="150" y="505" width="410" height="84" rx="12" fill="white" stroke="#b9cbbd"/>
<text x="180" y="558" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#173c31">3. Absalom</text>
<text x="590" y="535" font-family="DejaVu Sans" font-size="25" fill="#5e665e">moeder</text>
<text x="590" y="570" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#173c31">Maächa</text>
<path d="M90 662h60" stroke="#467d64" stroke-width="3"/>
<rect x="150" y="620" width="410" height="84" rx="12" fill="white" stroke="#b9cbbd"/>
<text x="180" y="673" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#173c31">4. Adonia</text>
<text x="590" y="650" font-family="DejaVu Sans" font-size="25" fill="#5e665e">moeder</text>
<text x="590" y="685" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#173c31">Haggith</text>
<path d="M90 777h60" stroke="#467d64" stroke-width="3"/>
<rect x="150" y="735" width="410" height="84" rx="12" fill="white" stroke="#b9cbbd"/>
<text x="180" y="788" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#173c31">5. Sefatja</text>
<text x="590" y="765" font-family="DejaVu Sans" font-size="25" fill="#5e665e">moeder</text>
<text x="590" y="800" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#173c31">Abital</text>
<path d="M90 892h60" stroke="#467d64" stroke-width="3"/>
<rect x="150" y="850" width="410" height="84" rx="12" fill="white" stroke="#b9cbbd"/>
<text x="180" y="903" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#173c31">6. Jithream</text>
<text x="590" y="880" font-family="DejaVu Sans" font-size="25" fill="#5e665e">moeder</text>
<text x="590" y="915" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#173c31">Egla</text>
<text x="42" y="1005" font-family="DejaVu Sans" font-size="27" fill="#5e665e">Maächa is de dochter van Thalmai, koning van Gesur.</text>
<text x="42" y="1041" font-family="DejaVu Sans" font-size="27" fill="#5e665e">Abigaïl was de weduwe van Nabal uit Karmel.</text>
<text x="42" y="1077" font-family="DejaVu Sans" font-size="27" fill="#5e665e">Dit overzicht betreft de geboorten in Hebron.</text>
</svg>
