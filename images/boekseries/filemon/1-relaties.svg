<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De personen in het verzoek</title><desc id="desc">De personen in het verzoek met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De personen in het verzoek</text><text x="44" y="113" class="ref">Filemon 1:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Paulus</text><text x="68" y="241" class="body">Oud en gevangen; vader in het geloof</text><text x="68" y="284" class="body">van Onesimus.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Filemon</text><text x="68" y="433" class="body">Geliefde medewerker; de gemeente komt</text><text x="68" y="476" class="body">bij hem thuis samen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Onesimus</text><text x="68" y="625" class="body">Teruggestuurd; ontvangen als geliefde</text><text x="68" y="668" class="body">broeder.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De oproep</text><text x="68" y="817" class="body">Filemon moet Onesimus ontvangen alsof</text><text x="68" y="860" class="body">hij Paulus zelf is.</text><text x="46" y="953" class="note">Het vaderschap is geestelijk. De brief vermeldt</text><text x="46" y="989" class="note">het verzoek, niet Filemons latere antwoord.</text></svg>