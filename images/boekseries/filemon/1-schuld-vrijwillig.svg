<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Schuld en vrijwillige goedheid</title><desc id="desc">Schuld en vrijwillige goedheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schuld en vrijwillige goedheid</text><text x="44" y="113" class="ref">Filemon 1:13–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geen dwang · vers 13–14</text><text x="68" y="241" class="body">Paulus wil niets zonder Filemons</text><text x="68" y="284" class="body">goedkeuring doen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Als er schuld is · vers 18</text><text x="68" y="433" class="body">Reken die aan Paulus toe.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Eigen hand · vers 19</text><text x="68" y="582" class="body">Paulus belooft het te betalen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Vertrouwen · vers 20–21</text><text x="68" y="731" class="body">Paulus vraagt verfrissing en verwacht</text><text x="68" y="774" class="body">zelfs meer goedheid.</text><text x="46" y="867" class="note">De mogelijke schuld wordt voorwaardelijk</text><text x="46" y="903" class="note">genoemd; de brief specificeert geen bedrag of</text><text x="46" y="939" class="note">diefstal.</text></svg>