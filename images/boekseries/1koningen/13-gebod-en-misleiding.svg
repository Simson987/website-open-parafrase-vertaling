<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Gebod en misleiding</title><desc id="desc">De oorspronkelijke opdracht tegenover de misleidende bewering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebod en misleiding</text><text x="44" y="113" class="ref">1 Koningen 13:8–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De opdracht</text><text x="68" y="241" class="body">Niet eten of drinken in Bethel; langs</text><text x="68" y="284" class="body">een andere weg teruggaan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De weigering</text><text x="68" y="433" class="body">De man van God weigert eerst de koning</text><text x="68" y="476" class="body">en later de oude profeet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De leugen</text><text x="68" y="625" class="body">De oude profeet beweert dat een engel</text><text x="68" y="668" class="body">hem een ander bevel gaf.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De overtreding</text><text x="68" y="817" class="body">De man van God gaat toch mee terug om</text><text x="68" y="860" class="body">te eten en drinken.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het oordeel</text><text x="68" y="1009" class="body">Hij krijgt te horen dat zijn lichaam</text><text x="68" y="1052" class="body">niet bij zijn voorouders begraven zal</text><text x="68" y="1095" class="body">worden.</text><text x="46" y="1188" class="note">De tekst noemt het engelverhaal uitdrukkelijk</text><text x="46" y="1224" class="note">een leugen; het is geen echte nieuwe opdracht</text><text x="46" y="1260" class="note">van een engel.</text></svg>