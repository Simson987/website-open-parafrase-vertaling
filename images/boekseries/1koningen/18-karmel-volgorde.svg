<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De gebeurtenissen op de Karmel</title><desc id="desc">De vergelijking en opeenvolgende stappen, met vermelding van het gewelddadige slot.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gebeurtenissen op de Karmel</text><text x="44" y="113" class="ref">1 Koningen 18:19–40</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oproep</text><text x="68" y="241" class="body">Kiezen tussen de HEERE en Baäl.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Baäls profeten</text><text x="68" y="390" class="body">Roepen van morgen tot avond; geen</text><text x="68" y="433" class="body">antwoord.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Elia’s altaar</text><text x="68" y="582" class="body">Twaalf stenen naar de stammen van</text><text x="68" y="625" class="body">Israël; hout en offer voorbereid.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het water</text><text x="68" y="774" class="body">Vier kruiken, drie keer uitgegoten; ook</text><text x="68" y="817" class="body">de greppel wordt nat.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het antwoord</text><text x="68" y="966" class="body">Vuur verteert offer, hout, stenen,</text><text x="68" y="1009" class="body">aarde en water; het volk belijdt de</text><text x="68" y="1052" class="body">HEERE.</text><text x="46" y="1145" class="note">Na de belijdenis laat Elia de profeten van Baäl</text><text x="46" y="1181" class="note">grijpen en doodt hen bij de Kison (vers 40).</text></svg>