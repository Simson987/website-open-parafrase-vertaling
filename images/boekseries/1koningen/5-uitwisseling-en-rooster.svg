<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Hout, voedsel en werkrooster</title><desc id="desc">De wederzijdse leveringen en het beurtrooster voor de bouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hout, voedsel en werkrooster</text><text x="44" y="113" class="ref">1 Koningen 5:9–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hiram levert</text><text x="68" y="241" class="body">Ceder- en dennenhout via vlotten over</text><text x="68" y="284" class="body">zee.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Salomo levert jaarlijks</text><text x="68" y="433" class="body">Ongeveer 4,4 miljoen liter tarwe en</text><text x="68" y="476" class="body">4.400 liter zuivere olie.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dertigduizend man</text><text x="68" y="625" class="body">Maandelijks 10.000 naar de Libanon: één</text><text x="68" y="668" class="body">maand daar, twee maanden thuis.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Andere werkers</text><text x="68" y="817" class="body">70.000 lastdragers, 80.000 steenhouwers</text><text x="68" y="860" class="body">en 3.300 opzichters.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De samenwerking</text><text x="68" y="1009" class="body">Bouwlieden van Salomo en Hiram met de</text><text x="68" y="1052" class="body">Giblieten bereiden hout en steen voor.</text><text x="46" y="1145" class="note">De aantallen en omrekeningen volgen dit</text><text x="46" y="1181" class="note">hoofdstuk van de Open Parafrase Weergave.</text></svg>