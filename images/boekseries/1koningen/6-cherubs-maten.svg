<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Maten van de cherubs</title><desc id="desc">De tekstuele maten en het contact van de vier uitgespreide vleugels.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Maten van de cherubs</text><text x="44" y="113" class="ref">1 Koningen 6:23–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee beelden</text><text x="68" y="241" class="body">Olijfhout, bekleed met goud; gelijke</text><text x="68" y="284" class="body">maat en vorm.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hoogte per cherub</text><text x="68" y="433" class="body">Ongeveer 4,5 meter.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vleugel per zijde</text><text x="68" y="582" class="body">Ongeveer 2,25 meter; totale spanwijdte</text><text x="68" y="625" class="body">circa 4,5 meter.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De opstelling</text><text x="68" y="774" class="body">Buitenste vleugels raken de</text><text x="68" y="817" class="body">tegenoverliggende muren; binnenste</text><text x="68" y="860" class="body">vleugels raken elkaar.</text><text x="46" y="953" class="note">Deze maten beschrijven de grote beelden in het</text><text x="46" y="989" class="note">binnenste heiligdom.</text></svg>