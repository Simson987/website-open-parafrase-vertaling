<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Wat Salomo vraagt</title><desc id="desc">Verzoek, antwoord en voorwaarde in Salomo’s droom.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Salomo vraagt</text><text x="44" y="113" class="ref">1 Koningen 3:5–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag</text><text x="68" y="241" class="body">In een droom in Gibeon mag Salomo</text><text x="68" y="284" class="body">vragen wat God hem zal geven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn verzoek</text><text x="68" y="433" class="body">Een opmerkzaam hart om recht te spreken</text><text x="68" y="476" class="body">en goed van kwaad te onderscheiden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het antwoord</text><text x="68" y="625" class="body">Een wijs en verstandig hart; ook</text><text x="68" y="668" class="body">ongevraagde rijkdom en eer.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De voorwaarde</text><text x="68" y="817" class="body">Een lang leven wordt verbonden aan</text><text x="68" y="860" class="body">wandelen in Gods wegen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Na het ontwaken</text><text x="68" y="1009" class="body">Naar Jeruzalem, offers voor de ark en</text><text x="68" y="1052" class="body">een maaltijd voor zijn dienaren.</text><text x="46" y="1145" class="note">De droom en de gebeurtenissen na het ontwaken</text><text x="46" y="1181" class="note">zijn verschillende momenten.</text></svg>