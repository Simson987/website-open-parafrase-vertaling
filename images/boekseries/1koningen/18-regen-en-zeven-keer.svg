<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Zeven keer uitkijken</title><desc id="desc">Volgorde van gebed, uitkijken, wolk en regen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeven keer uitkijken</text><text x="44" y="113" class="ref">1 Koningen 18:41–46</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achab</text><text x="68" y="241" class="body">Krijgt opdracht te eten en drinken.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Elia</text><text x="68" y="390" class="body">Buigt zich op de top van de Karmel naar</text><text x="68" y="433" class="body">de grond.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De knecht</text><text x="68" y="582" class="body">Kijkt naar zee; moet zeven keer</text><text x="68" y="625" class="body">teruggaan.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De zevende keer</text><text x="68" y="774" class="body">Een kleine wolk als een mannenhand</text><text x="68" y="817" class="body">verschijnt.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De regen</text><text x="68" y="966" class="body">Zwarte wolken, wind en zware regen;</text><text x="68" y="1009" class="body">Achab en Elia naar Jizreël.</text><text x="46" y="1102" class="note">De vergelijking met een hand geeft de grootte</text><text x="46" y="1138" class="note">van de wolk aan, geen letterlijke hand in de</text><text x="46" y="1174" class="note">lucht.</text></svg>