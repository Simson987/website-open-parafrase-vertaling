<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Gebed: recht en herstel</title><desc id="desc">Verschillende gebedsvragen en hun voorwaardelijke situatie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed: recht en herstel</text><text x="44" y="113" class="ref">1 Koningen 8:31–43</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij een eed</text><text x="68" y="241" class="body">Oordeel over schuld en onschuld.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Na een nederlaag</text><text x="68" y="390" class="body">Terugkeer, belijdenis, vergeving en</text><text x="68" y="433" class="body">herstel in het land.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bij droogte</text><text x="68" y="582" class="body">Bekering, vergeving, onderwijs en</text><text x="68" y="625" class="body">regen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Bij nood en ziekte</text><text x="68" y="774" class="body">Ieders hart is bekend bij God; gebed om</text><text x="68" y="817" class="body">vergeving en ingrijpen.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Voor de buitenlander</text><text x="68" y="966" class="body">Ook diens gebed wordt genoemd, opdat</text><text x="68" y="1009" class="body">alle volken Gods naam kennen.</text><text x="46" y="1102" class="note">Dit zijn situaties waarvoor Salomo bidt, geen</text><text x="46" y="1138" class="note">verslag dat al deze rampen tijdens het feest</text><text x="46" y="1174" class="note">gebeuren.</text></svg>