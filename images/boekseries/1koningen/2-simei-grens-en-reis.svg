<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Simeï: de grens en de reis</title><desc id="desc">Bevel, termijn, overtreding en de uitleg van het vonnis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Simeï: de grens en de reis</text><text x="44" y="113" class="ref">1 Koningen 2:36–46</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het bevel</text><text x="68" y="241" class="body">In Jeruzalem wonen en nergens heengaan.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De waarschuwing</text><text x="68" y="390" class="body">Weggaan en Kidron oversteken betekent</text><text x="68" y="433" class="body">de dood; Simeï aanvaardt het.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Na drie jaar</text><text x="68" y="582" class="body">Twee slaven naar Achis, zoon van</text><text x="68" y="625" class="body">Maächa, in Gath gevlucht.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De overtreding</text><text x="68" y="774" class="body">Simeï zadelt zijn ezel, reist naar Gath</text><text x="68" y="817" class="body">en haalt hen terug.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het oordeel</text><text x="68" y="966" class="body">Salomo spreekt hem aan op eed en bevel;</text><text x="68" y="1009" class="body">Benaja voert het vonnis uit.</text><text x="46" y="1102" class="note">De drie jaar slaan op het latere weglopen van de</text><text x="46" y="1138" class="note">slaven, niet op de duur van Davids regering.</text></svg>