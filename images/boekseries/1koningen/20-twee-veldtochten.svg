<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Twee Syrische veldtochten</title><desc id="desc">Plaatsen, tijdsverschil en uitkomst van de twee oorlogen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee Syrische veldtochten</text><text x="44" y="113" class="ref">1 Koningen 20:13–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij Samaria</text><text x="68" y="241" class="body">232 jonge mannen van de gouverneurs,</text><text x="68" y="284" class="body">daarna 7.000 Israëlieten; Syrië vlucht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De waarschuwing</text><text x="68" y="433" class="body">Volgend jaar komt de koning van Syrië</text><text x="68" y="476" class="body">terug.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De verkeerde redenering</text><text x="68" y="625" class="body">De Syriërs denken dat Israëls God</text><text x="68" y="668" class="body">alleen een berggod is.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bij Afek</text><text x="68" y="817" class="body">Na zeven dagen volgt de tweede</text><text x="68" y="860" class="body">nederlaag; ook de stadsmuur valt.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het verbond</text><text x="68" y="1009" class="body">Benhadad biedt steden en handelsstraten</text><text x="68" y="1052" class="body">aan; Achab laat hem gaan.</text><text x="46" y="1145" class="note">Het hoofdstuk weerlegt de beperking van Gods</text><text x="46" y="1181" class="note">macht tot bergen. De beide veldtochten zijn niet</text><text x="46" y="1217" class="note">één gevecht.</text></svg>