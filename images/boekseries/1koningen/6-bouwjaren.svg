<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Zeven bouwjaren</title><desc id="desc">De maandnamen, regeringsjaren en genoemde bouwduur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeven bouwjaren</text><text x="44" y="113" class="ref">1 Koningen 6:1, 37–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin</text><text x="68" y="241" class="body">Vierde regeringsjaar van Salomo; Ziv,</text><text x="68" y="284" class="body">de tweede maand.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Plaats in de geschiedenis</text><text x="68" y="433" class="body">Het 480ste jaar na de uittocht uit</text><text x="68" y="476" class="body">Egypte.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Voltooiing</text><text x="68" y="625" class="body">Elfde regeringsjaar; Bul, de achtste</text><text x="68" y="668" class="body">maand.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Duur</text><text x="68" y="817" class="body">Het hoofdstuk noemt zeven jaar</text><text x="68" y="860" class="body">bouwtijd.</text><text x="46" y="953" class="note">De dertien jaar voor het paleis staan in het</text><text x="46" y="989" class="note">volgende hoofdstuk en worden hier niet opgeteld.</text></svg>