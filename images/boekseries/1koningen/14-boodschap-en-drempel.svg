<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Boodschap en thuiskomst</title><desc id="desc">Identiteit, profetische aankondiging, thuiskomst en opvolging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boodschap en thuiskomst</text><text x="44" y="113" class="ref">1 Koningen 14:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Abia is ziek</text><text x="68" y="241" class="body">Jerobeam stuurt zijn vrouw vermomd naar</text><text x="68" y="284" class="body">Ahia in Silo.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De herkenning</text><text x="68" y="433" class="body">De oude blinde profeet kent haar</text><text x="68" y="476" class="body">identiteit vóór zij spreekt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De boodschap</text><text x="68" y="625" class="body">Oordeel over Jerobeams huis; Abia zal</text><text x="68" y="668" class="body">wel begraven en beweend worden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De drempel</text><text x="68" y="817" class="body">Bij haar thuiskomst in Tirza sterft de</text><text x="68" y="860" class="body">jongen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De opvolging</text><text x="68" y="1009" class="body">Jerobeam regeert 22 jaar; zijn zoon</text><text x="68" y="1052" class="body">Nadab volgt hem op.</text><text x="46" y="1145" class="note">Abia, Jerobeams zoon, is hier een andere persoon</text><text x="46" y="1181" class="note">dan Abiam, de latere koning van Juda.</text></svg>