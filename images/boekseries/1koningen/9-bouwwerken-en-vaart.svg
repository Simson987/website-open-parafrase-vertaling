<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Bouwwerken en zeevaart</title><desc id="desc">De onderscheiden leveringen, bouwprojecten, arbeidsverhoudingen en vaart.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bouwwerken en zeevaart</text><text x="44" y="113" class="ref">1 Koningen 9:10–28</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twintig bouwjaren</text><text x="68" y="241" class="body">Tempel en koninklijk paleis.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Twintig steden</text><text x="68" y="390" class="body">In Galilea aan Hiram; hij noemt ze</text><text x="68" y="433" class="body">Kabul omdat ze hem niet bevallen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De bouwplaatsen</text><text x="68" y="582" class="body">Millo, Jeruzalems muur, Hazor, Megiddo,</text><text x="68" y="625" class="body">Gezer en meer steden.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De dwangarbeid</text><text x="68" y="774" class="body">Vers 20–22 onderscheidt achtergebleven</text><text x="68" y="817" class="body">volken van de functies van Israëlieten.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De vloot</text><text x="68" y="966" class="body">Ezeon-geber bij Eloth; Hirams zeelieden</text><text x="68" y="1009" class="body">varen mee naar Ofir.</text><text x="46" y="1102" class="note">Ofirs precieze ligging wordt hier niet</text><text x="46" y="1138" class="note">vastgelegd; het hoofdstuk noemt de bestemming</text><text x="46" y="1174" class="note">zonder coördinaten.</text></svg>