<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Gebed, zegen en feest</title><desc id="desc">De slotvragen van het gebed en de volgorde naar de afsluiting van het feest.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, zegen en feest</text><text x="44" y="113" class="ref">1 Koningen 8:44–66</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onderweg ten strijde</text><text x="68" y="241" class="body">Bidden naar de gekozen stad en het</text><text x="68" y="284" class="body">huis; gebed om recht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">In gevangenschap</text><text x="68" y="433" class="body">Tot inkeer komen, zonde belijden en met</text><text x="68" y="476" class="body">hart en ziel terugkeren.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Salomo staat op</text><text x="68" y="625" class="body">Na geknield gebed zegent hij de</text><text x="68" y="668" class="body">gemeenschap.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het appel</text><text x="68" y="817" class="body">Het hart volkomen toewijden en Gods</text><text x="68" y="860" class="body">geboden bewaren.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het feest</text><text x="68" y="1009" class="body">Zeven dagen en nog zeven dagen; daarna</text><text x="68" y="1052" class="body">gaat het volk opgewekt naar huis.</text><text x="46" y="1145" class="note">De buitenlandse gevangenschap is een mogelijke</text><text x="46" y="1181" class="note">toekomstige situatie in het gebed.</text></svg>