<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Micha en de meerderheid</title><desc id="desc">Het verschil tussen de eensgezinde voorspelling, het visioen en Micha’s waarschuwing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Micha en de meerderheid</text><text x="44" y="113" class="ref">1 Koningen 22:6–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De meerderheid</text><text x="68" y="241" class="body">Ongeveer 400 profeten beloven voorspoed</text><text x="68" y="284" class="body">bij Ramoth in Gilead.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De bode</text><text x="68" y="433" class="body">Vraagt Micha hetzelfde gunstige woord</text><text x="68" y="476" class="body">te spreken.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Micha’s trouw</text><text x="68" y="625" class="body">Hij zal spreken wat de HEERE hem zegt.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het visioen</text><text x="68" y="774" class="body">Israël als schapen zonder herder;</text><text x="68" y="817" class="body">daarna de hemelse raad en de</text><text x="68" y="860" class="body">leugengeest.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De reactie</text><text x="68" y="1009" class="body">Micha wordt geslagen en gevangengezet;</text><text x="68" y="1052" class="body">hij noemt de terugkeer de toets.</text><text x="46" y="1145" class="note">De schapen zijn beeldspraak in het visioen, niet</text><text x="46" y="1181" class="note">een letterlijk verdwaalde kudde in het leger.</text></svg>