<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Belofte en waarschuwing</title><desc id="desc">De voorwaarden in het tweede antwoord aan Salomo.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Belofte en waarschuwing</text><text x="44" y="113" class="ref">1 Koningen 9:3–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het antwoord</text><text x="68" y="241" class="body">God zegt het gebed gehoord en het huis</text><text x="68" y="284" class="body">geheiligd te hebben.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij trouw</text><text x="68" y="433" class="body">Wandelen zoals David; het koningschap</text><text x="68" y="476" class="body">wordt bevestigd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij afkeer</text><text x="68" y="625" class="body">Andere goden dienen heeft verlies van</text><text x="68" y="668" class="body">land en huis tot gevolg.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De uitleg aan voorbijgangers</text><text x="68" y="817" class="body">Het verlaten van de God van de uittocht</text><text x="68" y="860" class="body">verklaart het onheil.</text><text x="46" y="953" class="note">De waarschuwing beschrijft een gevolg van</text><text x="46" y="989" class="note">afkeer, geen al plaatsgevonden verwoesting in</text><text x="46" y="1025" class="note">dit hoofdstuk.</text></svg>