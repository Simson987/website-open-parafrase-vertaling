<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Twee adviezen, twee rijken</title><desc id="desc">De tegengestelde raad en de politieke en profetische gevolgen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee adviezen, twee rijken</text><text x="44" y="113" class="ref">1 Koningen 12:6–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oudsten</text><text x="68" y="241" class="body">Dien het volk en geef een vriendelijk</text><text x="68" y="284" class="body">antwoord.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De leeftijdgenoten</text><text x="68" y="433" class="body">Maak het juk zwaarder; Rehabeam kiest</text><text x="68" y="476" class="body">dit harde antwoord.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het gevolg</text><text x="68" y="625" class="body">Israël verbreekt de band met het huis</text><text x="68" y="668" class="body">van David; Jerobeam wordt koning.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Rehabeams aanhang</text><text x="68" y="817" class="body">Juda en Benjamin worden voor de</text><text x="68" y="860" class="body">tegenactie bijeengeroepen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Semaja’s woord</text><text x="68" y="1009" class="body">Niet tegen de broers optrekken; ieder</text><text x="68" y="1052" class="body">gaat naar huis.</text><text x="46" y="1145" class="note">De taal over juk, zwepen en schorpioenen is</text><text x="46" y="1181" class="note">onderdeel van de dreigende rede.</text></svg>