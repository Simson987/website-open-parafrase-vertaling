<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Van Krith naar Zarfath</title><desc id="desc">De plaatsen, voorziening en het herstel van de zoon in hun volgorde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Krith naar Zarfath</text><text x="44" y="113" class="ref">1 Koningen 17:3–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij de beek Krith</text><text x="68" y="241" class="body">Raven brengen morgen en avond brood en</text><text x="68" y="284" class="body">vlees; Elia drinkt uit de beek.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Als de beek opdroogt</text><text x="68" y="433" class="body">De volgende opdracht voert naar Zarfath</text><text x="68" y="476" class="body">bij Sidon.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De weduwe</text><text x="68" y="625" class="body">Het laatste meel en de olie raken</text><text x="68" y="668" class="body">volgens de belofte niet op.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Haar zoon</text><text x="68" y="817" class="body">Sterft; Elia bidt in de bovenkamer;</text><text x="68" y="860" class="body">zijn leven keert terug.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De erkenning</text><text x="68" y="1009" class="body">De moeder erkent Gods ware woord door</text><text x="68" y="1052" class="body">Elia.</text><text x="46" y="1145" class="note">De beloofde voorziening van meel en olie duurt</text><text x="46" y="1181" class="note">tot de dag waarop God weer regen geeft.</text></svg>