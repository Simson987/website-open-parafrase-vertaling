<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Hoe Naboth zijn erfdeel verliest</title><desc id="desc">Verzoek, vals proces, moord, bezit en profetische aanklacht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoe Naboth zijn erfdeel verliest</text><text x="44" y="113" class="ref">1 Koningen 21:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verzoek</text><text x="68" y="241" class="body">Achab wil de wijngaard als moestuin,</text><text x="68" y="284" class="body">tegen ruil of betaling.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De weigering</text><text x="68" y="433" class="body">Naboth beroept zich op het erfdeel van</text><text x="68" y="476" class="body">zijn vaders.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Izebels brieven</text><text x="68" y="625" class="body">Gebruik van Achabs naam en zegel; bevel</text><text x="68" y="668" class="body">tot valse getuigenis.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het onrecht</text><text x="68" y="817" class="body">Na de beschuldiging wordt Naboth</text><text x="68" y="860" class="body">gedood; Achab neemt de wijngaard.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Elia’s aanklacht</text><text x="68" y="1009" class="body">Moord én het bezit inpikken worden</text><text x="68" y="1052" class="body">samen veroordeeld.</text><text x="46" y="1145" class="note">De beschuldiging van de twee getuigen is vals;</text><text x="46" y="1181" class="note">zij wordt niet als schuld van Naboth</text><text x="46" y="1217" class="note">weergegeven.</text></svg>