<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Verzoeken en de besluiten</title><desc id="desc">De verzoeken, verschillende gronden voor besluiten en nieuwe ambten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verzoeken en de besluiten</text><text x="44" y="113" class="ref">1 Koningen 2:13–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Adonia’s verzoek</text><text x="68" y="241" class="body">Via Bathseba vraagt hij Abisag als</text><text x="68" y="284" class="body">vrouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Salomo’s uitleg</text><text x="68" y="433" class="body">Hij ziet er een aanspraak op het</text><text x="68" y="476" class="body">koningschap in; Adonia wordt gedood.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Abjathar</text><text x="68" y="625" class="body">Naar de akkers in Anathoth; wegens</text><text x="68" y="668" class="body">eerdere dienst en lijden gespaard maar</text><text x="68" y="711" class="body">uit het ambt gezet.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Joab</text><text x="68" y="860" class="body">Vlucht naar het altaar; Benaja voert</text><text x="68" y="903" class="body">het doodvonnis uit wegens Abner en</text><text x="68" y="946" class="body">Amasa.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De nieuwe functies</text><text x="68" y="1095" class="body">Benaja over het leger; Zadok in</text><text x="68" y="1138" class="body">Abjathars plaats.</text><text x="46" y="1231" class="note">De verplaatsing van Abjathar wordt onderscheiden</text><text x="46" y="1267" class="note">van de doodvonnissen over Adonia en Joab.</text></svg>