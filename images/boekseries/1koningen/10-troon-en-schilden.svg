<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Troon, schilden en handel</title><desc id="desc">De aantallen bij de rijkdom en troon van Salomo.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Troon, schilden en handel</text><text x="44" y="113" class="ref">1 Koningen 10:14–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De schilden</text><text x="68" y="241" class="body">200 grote en 300 kleine gouden schilden</text><text x="68" y="284" class="body">in het Libanonwoudhuis.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De troon</text><text x="68" y="433" class="body">Ivoor met zuiver goud; zes treden en</text><text x="68" y="476" class="body">twee leeuwen bij de armleuningen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twaalf op de treden</text><text x="68" y="625" class="body">Aan elke kant zes leeuwen;</text><text x="68" y="668" class="body">onderscheiden van de twee naast de</text><text x="68" y="711" class="body">zitting.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Om de drie jaar</text><text x="68" y="860" class="body">Tarsisschepen keren terug met goud,</text><text x="68" y="903" class="body">zilver, ivoor, apen en pauwen.</text><rect x="42" y="961" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het wagenpark</text><text x="68" y="1052" class="body">1.400 wagens en 12.000 ruiters.</text><text x="46" y="1145" class="note">De twaalf leeuwen op de treden en de twee bij de</text><text x="46" y="1181" class="note">zitting worden afzonderlijk geteld.</text></svg>