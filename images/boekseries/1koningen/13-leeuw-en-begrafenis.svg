<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De leeuw en de begrafenis</title><desc id="desc">De niet afgebeelde dood, het teken bij de dieren en de begrafenis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De leeuw en de begrafenis</text><text x="44" y="113" class="ref">1 Koningen 13:24–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Op de weg</text><text x="68" y="241" class="body">Een leeuw doodt de man van God; ezel en</text><text x="68" y="284" class="body">leeuw blijven bij het lichaam.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het bijzondere teken</text><text x="68" y="433" class="body">De leeuw eet het lichaam niet op en</text><text x="68" y="476" class="body">verscheurt de ezel niet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De oude profeet</text><text x="68" y="625" class="body">Haalt het lichaam op, rouwt en begraaft</text><text x="68" y="668" class="body">hem in zijn eigen graf.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn verzoek</text><text x="68" y="817" class="body">Zijn zonen moeten hem later naast de</text><text x="68" y="860" class="body">man van God begraven.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Jerobeams reactie</text><text x="68" y="1009" class="body">Hij keert niet terug van zijn slechte</text><text x="68" y="1052" class="body">weg.</text><text x="46" y="1145" class="note">De oude profeet en de man van God uit Juda zijn</text><text x="46" y="1181" class="note">twee verschillende personen.</text></svg>