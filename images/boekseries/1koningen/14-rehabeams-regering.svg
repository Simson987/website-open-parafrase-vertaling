<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Rehabeam in Juda</title><desc id="desc">Regeringsgegevens, plundering en opvolging in Juda.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rehabeam in Juda</text><text x="44" y="113" class="ref">1 Koningen 14:21–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin en duur</text><text x="68" y="241" class="body">41 jaar bij zijn aantreden; zeventien</text><text x="68" y="284" class="body">jaar koning in Jeruzalem.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn moeder</text><text x="68" y="433" class="body">Naäma, de Ammonitische.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het oordeel over Juda</text><text x="68" y="582" class="body">Offerhoogten, beelden en gewijde palen;</text><text x="68" y="625" class="body">het volk doet kwaad.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">In zijn vijfde jaar</text><text x="68" y="774" class="body">Sisak neemt tempel- en paleisschatten</text><text x="68" y="817" class="body">en de gouden schilden mee.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Na zijn dood</text><text x="68" y="966" class="body">Begraven in de stad van David; Abiam</text><text x="68" y="1009" class="body">volgt hem op.</text><text x="46" y="1102" class="note">De koperen vervangingsschilden tonen verlies van</text><text x="46" y="1138" class="note">rijkdom; zij zijn niet Salomo’s oorspronkelijke</text><text x="46" y="1174" class="note">gouden schilden.</text></svg>