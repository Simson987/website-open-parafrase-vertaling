<svg xmlns="http://www.w3.org/2000/svg" width="840" height="856" viewBox="0 0 840 856" role="img" aria-labelledby="title desc"><title id="title">Vernedering en uitstel</title><desc id="desc">Achabs reactie en de nauwkeurig afgebakende betekenis van het uitstel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="856" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vernedering en uitstel</text><text x="44" y="113" class="ref">1 Koningen 21:27–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achabs reactie</text><text x="68" y="241" class="body">Hij scheurt zijn kleren, draagt een</text><text x="68" y="284" class="body">rouwgewaad, vast en loopt ingetogen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het woord aan Elia</text><text x="68" y="433" class="body">God merkt op dat Achab zich vernedert.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het uitstel</text><text x="68" y="582" class="body">Het onheil over zijn huis zal in de</text><text x="68" y="625" class="body">tijd van zijn zoon komen.</text><text x="46" y="718" class="note">De tekst stelt het onheil over het huis uit; hij</text><text x="46" y="754" class="note">noemt het onrecht tegen Naboth niet ongedaan</text><text x="46" y="790" class="note">gemaakt.</text></svg>