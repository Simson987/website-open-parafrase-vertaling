<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690"><title>Tempelruimten volgens 1 Koningen 6</title><rect width="1100" height="690" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="45" y="62" font-size="36" font-weight="700">Tempel: de genoemde ruimten</text><text x="45" y="105" font-size="25">1 Koningen 6:2–3, 16–20 • benaderde maten</text><rect x="70" y="210" width="216" height="216" fill="#e5cc88" stroke="#456451" stroke-width="4"/><rect x="286" y="210" width="432" height="216" fill="#e4eadb" stroke="#456451" stroke-width="4"/><rect x="718" y="210" width="108" height="216" fill="#f0dfc0" stroke="#456451" stroke-width="4"/><text x="178" y="275" text-anchor="middle" font-size="23">Binnenste</text><text x="178" y="308" text-anchor="middle" font-size="23">heiligdom</text><text x="178" y="354" text-anchor="middle" font-size="24">9 × 9 m</text><text x="502" y="297" text-anchor="middle" font-size="28">Grote zaal</text><text x="502" y="346" text-anchor="middle" font-size="25">18 × 9 m</text><text x="772" y="278" text-anchor="middle" font-size="22">Voorhal</text><text x="772" y="324" text-anchor="middle" font-size="20">4,5 m</text><text x="772" y="355" text-anchor="middle" font-size="20">diep</text><text x="880" y="315" font-size="24">Ingang</text><text x="70" y="181" font-size="25">Huis: circa 27 m lang • 9 m breed • 13,5 m hoog</text><text x="70" y="483" font-size="25">Binnenste heiligdom: circa 9 m hoog (een kubus).</text><text x="70" y="529" font-size="25">Voorhal: circa 9 m breed, vóór het huis.</text><text x="70" y="586" font-size="23">Ruimteschema; wanddikten en zijkamers niet uitgewerkt.</text><text x="70" y="624" font-size="23">Geen noordpijl: dit hoofdstuk bepaalt die hier niet.</text></g></svg>