<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Twee kandidaten en hun steun</title><desc id="desc">De twee kampen, de uitgesloten genodigden en het plan voor de audiëntie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee kandidaten en hun steun</text><text x="44" y="113" class="ref">1 Koningen 1:5–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Adonia</text><text x="68" y="241" class="body">Zoon van David en Haggith; roept</text><text x="68" y="284" class="body">zichzelf uit tot koning; vijftig</text><text x="68" y="327" class="body">voorlopers.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zijn bondgenoten</text><text x="68" y="476" class="body">Joab en de priester Abjathar.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wie niet voor hem kiezen</text><text x="68" y="625" class="body">Zadok, Benaja, Nathan, Simeï, Reï en</text><text x="68" y="668" class="body">Davids helden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn maaltijd</text><text x="68" y="817" class="body">Bij Zoheleth en de bron Rogel; Salomo</text><text x="68" y="860" class="body">en zijn medestanders niet uitgenodigd.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Nathans plan</text><text x="68" y="1009" class="body">Bathseba vraagt naar de eerdere eed;</text><text x="68" y="1052" class="body">Nathan zal haar woorden bevestigen.</text><text x="46" y="1145" class="note">De benoemde Simeï bij de getrouwen wordt hier</text><text x="46" y="1181" class="note">niet zonder nadere bron gelijkgesteld aan elke</text><text x="46" y="1217" class="note">naamgenoot.</text></svg>