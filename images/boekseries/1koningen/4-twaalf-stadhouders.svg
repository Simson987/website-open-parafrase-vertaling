<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Twaalf stadhouders</title><desc id="desc">De twaalf bestuurders met onderscheid tussen naamgenoten en hun gebieden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twaalf stadhouders</text><text x="44" y="113" class="ref">1 Koningen 4:7–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3</text><text x="68" y="241" class="body">Zoon van Hur: Efraïm; zoon van Deker:</text><text x="68" y="284" class="body">Makaz en omgeving; zoon van Hesed:</text><text x="68" y="327" class="body">Arubboth en omgeving.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">4–6</text><text x="68" y="476" class="body">Zoon van Abinadab: Dor; Baëna, zoon van</text><text x="68" y="519" class="body">Ahilud: Taanach en omgeving; zoon van</text><text x="68" y="562" class="body">Geber: Ramoth in Gilead.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">7–9</text><text x="68" y="711" class="body">Abinadab, zoon van Iddo: Mahanaïm;</text><text x="68" y="754" class="body">Ahimaäz: Nafthali; Baëna, zoon van</text><text x="68" y="797" class="body">Husai: Aser en Aloth.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">10–12</text><text x="68" y="946" class="body">Josafat, zoon van Paruah: Issaschar;</text><text x="68" y="989" class="body">Simeï, zoon van Ela: Benjamin; Geber,</text><text x="68" y="1032" class="body">zoon van Uri: Gilead.</text><text x="46" y="1125" class="note">Ieder verzorgt het hof één maand per jaar. De</text><text x="46" y="1161" class="note">nummering volgt de lijst en noemt geen</text><text x="46" y="1197" class="note">toegewezen kalendermaanden.</text></svg>