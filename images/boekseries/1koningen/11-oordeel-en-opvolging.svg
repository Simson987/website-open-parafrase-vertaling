<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Afkeer, oordeel en opvolging</title><desc id="desc">Oorzaak, tijdstip, voorwaarden en opvolging in het oordeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Afkeer, oordeel en opvolging</text><text x="44" y="113" class="ref">1 Koningen 11:9–13, 31–43</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oorzaak</text><text x="68" y="241" class="body">Salomo houdt zich niet aan Gods verbod</text><text x="68" y="284" class="body">andere goden te volgen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De timing</text><text x="68" y="433" class="body">De afscheuring gebeurt uit de hand van</text><text x="68" y="476" class="body">zijn zoon, niet tijdens zijn eigen</text><text x="68" y="519" class="body">leven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De belofte aan Jerobeam</text><text x="68" y="668" class="body">Zijn blijvende huis wordt verbonden aan</text><text x="68" y="711" class="body">luisteren en gehoorzamen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Davids huis</text><text x="68" y="860" class="body">Behoud van een stam en een lamp in</text><text x="68" y="903" class="body">Jeruzalem; de vernedering is niet voor</text><text x="68" y="946" class="body">altijd.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De opvolger</text><text x="68" y="1095" class="body">Na veertig jaar regering sterft Salomo;</text><text x="68" y="1138" class="body">Rehabeam wordt koning.</text><text x="46" y="1231" class="note">Het beeld van een lamp bij Davids huis verwoordt</text><text x="46" y="1267" class="note">een belofte over zijn nakomelingen.</text></svg>