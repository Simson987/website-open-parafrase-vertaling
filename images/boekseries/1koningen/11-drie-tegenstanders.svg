<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Drie tegenstanders</title><desc id="desc">Achtergrond, relaties en tijdlijn van de drie tegenstanders.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie tegenstanders</text><text x="44" y="113" class="ref">1 Koningen 11:14–40</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hadad</text><text x="68" y="241" class="body">Edomitische koningszoon; als kind naar</text><text x="68" y="284" class="body">Egypte gevlucht; wil later terug naar</text><text x="68" y="327" class="body">zijn land.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Rezon, zoon van Eljada</text><text x="68" y="476" class="body">Gevlucht voor Hadad-ezer; verzamelt een</text><text x="68" y="519" class="body">bende en regeert in Damaskus.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Jerobeam, zoon van Nebat</text><text x="68" y="668" class="body">Uit Zereda; moeder Zerua; leidt eerst</text><text x="68" y="711" class="body">de dwangarbeid van het huis van Jozef.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Ahia’s boodschap</text><text x="68" y="860" class="body">Tien mantelstukken voor Jerobeam;</text><text x="68" y="903" class="body">afscheuring uit de hand van Salomo’s</text><text x="68" y="946" class="body">zoon.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De vlucht</text><text x="68" y="1095" class="body">Salomo wil Jerobeam doden; Jerobeam</text><text x="68" y="1138" class="body">verblijft bij Sisak tot Salomo sterft.</text><text x="46" y="1231" class="note">Hadad, Hadad-ezer en Rezon zijn verschillende</text><text x="46" y="1267" class="note">personen.</text></svg>