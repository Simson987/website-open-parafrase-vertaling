<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Bij de Horeb</title><desc id="desc">De opeenvolgende verschijnselen en de nieuwe opdrachten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bij de Horeb</text><text x="44" y="113" class="ref">1 Koningen 19:11–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Storm</text><text x="68" y="241" class="body">Bergen splijten en rotsen breken; de</text><text x="68" y="284" class="body">HEERE is niet in de storm.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aardbeving en vuur</text><text x="68" y="433" class="body">Ook daarin is de HEERE niet.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Daarna</text><text x="68" y="582" class="body">Het suizen van een zachte stilte; Elia</text><text x="68" y="625" class="body">bedekt zijn gezicht.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Nieuwe opdracht</text><text x="68" y="774" class="body">Hazaël voor Syrië, Jehu voor Israël en</text><text x="68" y="817" class="body">Elisa als profeet in zijn plaats.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Niet alleen</text><text x="68" y="966" class="body">7.000 zijn overgebleven die hun knieën</text><text x="68" y="1009" class="body">niet voor Baäl bogen.</text><text x="46" y="1102" class="note">De drie zalvingen zijn hier opdrachten. Dit</text><text x="46" y="1138" class="note">hoofdstuk beschrijft vervolgens Elisa’s roeping.</text></svg>