<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">Jerobeams eigen eredienst</title><desc id="desc">Motief, locaties, priesters en feestdatum van Jerobeams verandering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jerobeams eigen eredienst</text><text x="44" y="113" class="ref">1 Koningen 12:25–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zijn angst</text><text x="68" y="241" class="body">Wie in Jeruzalem offert, kan terugkeren</text><text x="68" y="284" class="body">naar Rehabeam.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twee kalveren</text><text x="68" y="433" class="body">Eén in Bethel en één in Dan.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Nieuwe priesters</text><text x="68" y="582" class="body">Uit het gewone volk, niet uit Levi.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Eigen feestdatum</text><text x="68" y="731" class="body">Vijftiende dag van de achtste maand;</text><text x="68" y="774" class="body">door Jerobeam zelf bedacht.</text><rect x="42" y="832" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Het oordeel van de tekst</text><text x="68" y="923" class="body">Deze eredienst wordt een zonde genoemd.</text><text x="46" y="1016" class="note">Bethel en Dan zijn afzonderlijke plaatsen; de</text><text x="46" y="1052" class="note">kalveren staan niet samen bij één altaar.</text></svg>