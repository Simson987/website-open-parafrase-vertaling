<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Machtswisselingen in Israël</title><desc id="desc">Regeringsduren, rivaliteit en verplaatsing naar Samaria.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Machtswisselingen in Israël</text><text x="44" y="113" class="ref">1 Koningen 16:8–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ela</text><text x="68" y="241" class="body">Zoon van Baësa; twee jaar koning in</text><text x="68" y="284" class="body">Tirza.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zimri</text><text x="68" y="433" class="body">Doodt Ela; regeert zeven dagen en</text><text x="68" y="476" class="body">sterft bij de brand van zijn paleis.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Omri en Tibni</text><text x="68" y="625" class="body">Rivaliserende aanhangers; na Tibni’s</text><text x="68" y="668" class="body">dood wint Omri.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Omri</text><text x="68" y="817" class="body">Twaalf jaar regering, zes in Tirza;</text><text x="68" y="860" class="body">koopt de berg van Semer en bouwt</text><text x="68" y="903" class="body">Samaria.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Achab</text><text x="68" y="1052" class="body">Zoon van Omri; regeert 22 jaar in</text><text x="68" y="1095" class="body">Samaria.</text><text x="46" y="1188" class="note">Opvolging is geen afstammingsketen: Ela en</text><text x="46" y="1224" class="note">Zimri, of Zimri en Omri, worden niet vader en</text><text x="46" y="1260" class="note">zoon genoemd.</text></svg>