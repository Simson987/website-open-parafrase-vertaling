<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Zee en tien wasvaten</title><desc id="desc">Aantallen, richtingen, maten en onderscheid van de watervoorwerpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zee en tien wasvaten</text><text x="44" y="113" class="ref">1 Koningen 7:23–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gegoten zee</text><text x="68" y="241" class="body">Rond: circa 4,5 meter breed, 2,25 meter</text><text x="68" y="284" class="body">hoog; omtrek circa 13,5 meter.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twaalf runderen</text><text x="68" y="433" class="body">Drie naar elke windrichting;</text><text x="68" y="476" class="body">achterlijven naar binnen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Inhoud en wand</text><text x="68" y="625" class="body">Circa 44.000 liter; wand ongeveer 7,5</text><text x="68" y="668" class="body">centimeter dik.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tien wasvaten</text><text x="68" y="817" class="body">Elk circa 880 liter, op een koperen</text><text x="68" y="860" class="body">onderstel met vier wielen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De plaats</text><text x="68" y="1009" class="body">Vijf onderstellen rechts en vijf links;</text><text x="68" y="1052" class="body">de zee rechts naar het zuidoosten.</text><text x="46" y="1145" class="note">Maten en inhoud zijn de benaderingen in deze</text><text x="46" y="1181" class="note">vertaling; de zee en wasvaten zijn verschillende</text><text x="46" y="1217" class="note">voorwerpen.</text></svg>