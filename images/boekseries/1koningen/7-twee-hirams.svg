<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Twee mannen met de naam Hiram</title><desc id="desc">Naamgenoten onderscheiden naar familie en taak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee mannen met de naam Hiram</text><text x="44" y="113" class="ref">1 Koningen 7:13–14; zie ook 5:1</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hiram, de koning</text><text x="68" y="241" class="body">Koning van Tyrus; vriend van David en</text><text x="68" y="284" class="body">leverancier van hout.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hiram, de kopersmid</text><text x="68" y="433" class="body">Zoon van een weduwe uit Nafthali en een</text><text x="68" y="476" class="body">man uit Tyrus die kopersmid was.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn bekwaamheid</text><text x="68" y="625" class="body">Wijsheid, inzicht en kennis om allerlei</text><text x="68" y="668" class="body">koperwerk te maken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn opdracht</text><text x="68" y="817" class="body">Hij komt bij Salomo en maakt de koperen</text><text x="68" y="860" class="body">tempelvoorwerpen.</text><text x="46" y="953" class="note">De koning uit hoofdstuk 5 en de vakman uit</text><text x="46" y="989" class="note">hoofdstuk 7 hebben dezelfde naam maar zijn</text><text x="46" y="1025" class="note">verschillende personen.</text></svg>