<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Het verhaal van de bewaker</title><desc id="desc">De opbouw van het profetische verhaal en zijn toepassing op Achab.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het verhaal van de bewaker</text><text x="44" y="113" class="ref">1 Koningen 20:38–43</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vermomde spreker</text><text x="68" y="241" class="body">Een profeet wacht Achab langs de weg</text><text x="68" y="284" class="body">op, met as boven de ogen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn vertelling</text><text x="68" y="433" class="body">Een toevertrouwde gevangene zou tijdens</text><text x="68" y="476" class="body">zijn bezigheden ontsnapt zijn.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De gestelde prijs</text><text x="68" y="625" class="body">Zijn leven voor dat leven, of ongeveer</text><text x="68" y="668" class="body">34 kilo zilver.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Achabs uitspraak</text><text x="68" y="817" class="body">Je hebt je vonnis zelf uitgesproken.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De toepassing</text><text x="68" y="966" class="body">De profeet onthult zich: Achab liet de</text><text x="68" y="1009" class="body">door God veroordeelde man vrij.</text><text x="46" y="1102" class="note">Het bewakersverhaal is de profetische</text><text x="46" y="1138" class="note">voorstelling waarmee Achab wordt aangesproken;</text><text x="46" y="1174" class="note">het is geen apart gevechtsverslag.</text></svg>