<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Twee reeksen van koningen</title><desc id="desc">De parallelle opvolging zonder een onterechte stamboom.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee reeksen van koningen</text><text x="44" y="113" class="ref">1 Koningen 15:1–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Juda</text><text x="68" y="241" class="body">Abiam: drie jaar → zijn zoon Asa: 41</text><text x="68" y="284" class="body">jaar → zijn zoon Josafat.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Israël</text><text x="68" y="433" class="body">Nadab, zoon van Jerobeam: twee jaar →</text><text x="68" y="476" class="body">Baësa: 24 jaar.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De machtsovername</text><text x="68" y="625" class="body">Baësa doodt Nadab bij Gibbethon; hij is</text><text x="68" y="668" class="body">geen zoon van Nadab.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het huis van Jerobeam</text><text x="68" y="817" class="body">Door Baësa uitgeroeid, volgens het</text><text x="68" y="860" class="body">eerdere woord van Ahia.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het morele onderscheid</text><text x="68" y="1009" class="body">Asa doet goed; Nadab en Baësa volgen</text><text x="68" y="1052" class="body">Jerobeams zonde.</text><text x="46" y="1145" class="note">Pijlen geven opvolging aan. Alleen waar de tekst</text><text x="46" y="1181" class="note">het zegt, is daarbij een vader-zoonrelatie</text><text x="46" y="1217" class="note">vermeld.</text></svg>