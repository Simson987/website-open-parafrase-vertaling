<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Davids laatste opdrachten</title><desc id="desc">De verschillende personen en redenen in Davids laatste instructies.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Davids laatste opdrachten</text><text x="44" y="113" class="ref">1 Koningen 2:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Trouw aan de wet</text><text x="68" y="241" class="body">Salomo moet Gods wegen en Mozes’ wet</text><text x="68" y="284" class="body">bewaren met hart en ziel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Joab</text><text x="68" y="433" class="body">David noemt de moorden op Abner en</text><text x="68" y="476" class="body">Amasa.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Barzillai’s zonen</text><text x="68" y="625" class="body">Goedheid bewijzen en laten eten aan de</text><text x="68" y="668" class="body">koningstafel.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Simeï</text><text x="68" y="817" class="body">De eerdere vloek en Davids eed worden</text><text x="68" y="860" class="body">genoemd; Salomo moet wijs handelen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De overgang</text><text x="68" y="1009" class="body">David begraven in zijn stad; veertig</text><text x="68" y="1052" class="body">jaar regering; Salomo op de troon.</text><text x="46" y="1145" class="note">De morele en politieke opdrachten worden naast</text><text x="46" y="1181" class="note">elkaar weergegeven; gewelddadige gevolgen worden</text><text x="46" y="1217" class="note">niet verzwegen.</text></svg>