<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De twee aanspraken</title><desc id="desc">De opeenvolgende stappen en de bescherming van het kind in Salomo’s oordeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee aanspraken</text><text x="44" y="113" class="ref">1 Koningen 3:23–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het geschil</text><text x="68" y="241" class="body">Beide vrouwen noemen het levende kind</text><text x="68" y="284" class="body">hun zoon.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De beproeving</text><text x="68" y="433" class="body">De koning laat een zwaard brengen en</text><text x="68" y="476" class="body">beveelt een verdeling.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De moeder</text><text x="68" y="625" class="body">Zij wil het levende kind afstaan om</text><text x="68" y="668" class="body">zijn leven te redden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het vonnis</text><text x="68" y="817" class="body">Het kind moet blijven leven en wordt</text><text x="68" y="860" class="body">aan haar gegeven.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De reactie</text><text x="68" y="1009" class="body">Israël herkent Gods wijsheid in het</text><text x="68" y="1052" class="body">rechtspreken.</text><text x="46" y="1145" class="note">Het kind wordt niet doorgesneden; het bevel</text><text x="46" y="1181" class="note">wordt door het uiteindelijke vonnis voorkomen.</text></svg>