<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Rama en het verbond</title><desc id="desc">De diplomatieke wisseling en herbestemming van bouwmateriaal.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rama en het verbond</text><text x="44" y="113" class="ref">1 Koningen 15:17–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Baësa’s blokkade</text><text x="68" y="241" class="body">Hij versterkt Rama om verkeer naar Asa</text><text x="68" y="284" class="body">tegen te houden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Asa’s geschenk</text><text x="68" y="433" class="body">Zilver en goud uit tempel en paleis</text><text x="68" y="476" class="body">naar Benhadad in Damaskus.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het verzoek</text><text x="68" y="625" class="body">Benhadad moet zijn verbond met Baësa</text><text x="68" y="668" class="body">verbreken.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De uitkomst</text><text x="68" y="817" class="body">Na Syrische aanvallen stopt Baësa;</text><text x="68" y="860" class="body">materiaal uit Rama gaat naar Geba en</text><text x="68" y="903" class="body">Mizpa.</text><rect x="42" y="961" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De opvolger</text><text x="68" y="1052" class="body">Na Asa wordt zijn zoon Josafat koning.</text><text x="46" y="1145" class="note">De Syriërs trekken tegen Israëlitische steden</text><text x="46" y="1181" class="note">op; het schema verwisselt de bondgenootschappen</text><text x="46" y="1217" class="note">niet.</text></svg>