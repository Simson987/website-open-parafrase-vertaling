<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">De slag en twee opvolgers</title><desc id="desc">De vermomming, afloop en afzonderlijke opvolging in Israël en Juda.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De slag en twee opvolgers</text><text x="44" y="113" class="ref">1 Koningen 22:29–54</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee kledingkeuzen</text><text x="68" y="241" class="body">Achab vermomt zich; Josafat houdt zijn</text><text x="68" y="284" class="body">koninklijke kleren aan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De miskenning</text><text x="68" y="433" class="body">Wagenaanvoerders zien Josafat eerst</text><text x="68" y="476" class="body">voor de koning van Israël aan.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Achabs einde</text><text x="68" y="625" class="body">Een pijl treft hem tussen de</text><text x="68" y="668" class="body">pantsernaden; hij sterft die avond en</text><text x="68" y="711" class="body">wordt in Samaria begraven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Israël</text><text x="68" y="860" class="body">Ahazia, zoon van Achab, wordt koning;</text><text x="68" y="903" class="body">twee jaar regering.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Juda</text><text x="68" y="1052" class="body">Josafat wordt na 25 jaar regering door</text><text x="68" y="1095" class="body">zijn zoon Joram opgevolgd.</text><text x="46" y="1188" class="note">Het slot beschrijft twee rijken. Joram in dit</text><text x="46" y="1224" class="note">slot is Josafats zoon in Juda.</text></svg>