<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Aanwijzing, zalving en altaar</title><desc id="desc">De opdracht, publieke bevestiging, berichtgeving en voorwaardelijke vrijlating.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aanwijzing, zalving en altaar</text><text x="44" y="113" class="ref">1 Koningen 1:28–53</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Davids bevestiging</text><text x="68" y="241" class="body">Hij bevestigt zijn eed aan Bathseba:</text><text x="68" y="284" class="body">Salomo zal vandaag opvolgen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De opdracht</text><text x="68" y="433" class="body">Zadok, Nathan en Benaja; koninklijke</text><text x="68" y="476" class="body">muilezelin naar de Gihon.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De zalving</text><text x="68" y="625" class="body">Hoorn met olie uit de tent; bazuin en</text><text x="68" y="668" class="body">vreugde; Salomo op de troon.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Jonathan brengt het nieuws</text><text x="68" y="817" class="body">Zoon van Abjathar; Adonia’s gasten</text><text x="68" y="860" class="body">vertrekken verschrikt.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De bescherming</text><text x="68" y="1009" class="body">Adonia bij altaarhoorns; Salomo stelt</text><text x="68" y="1052" class="body">betrouwbaarheid als voorwaarde en laat</text><text x="68" y="1095" class="body">hem naar huis gaan.</text><text x="46" y="1188" class="note">Jonathan is de zoon van Abjathar; de overleden</text><text x="46" y="1224" class="note">zoon van Saul is een andere persoon.</text></svg>