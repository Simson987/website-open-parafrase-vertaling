<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Ambten aan het hof</title><desc id="desc">Namen, vaders en functies van Salomo’s hoogste dienaren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ambten aan het hof</text><text x="44" y="113" class="ref">1 Koningen 4:2–6</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Azaria, zoon van Zadok</text><text x="68" y="241" class="body">Eerste minister.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Elihoref en Ahia</text><text x="68" y="390" class="body">Zonen van Sisa; schrijvers. Josafat,</text><text x="68" y="433" class="body">zoon van Ahilud, is kanselier.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Benaja en de priesters</text><text x="68" y="582" class="body">Benaja, zoon van Jojada, over het</text><text x="68" y="625" class="body">leger; Zadok en Abjathar als priesters</text><text x="68" y="668" class="body">genoemd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nathans zonen</text><text x="68" y="817" class="body">Azaria over de stadhouders; Zabud als</text><text x="68" y="860" class="body">hoge ambtenaar en vriend van de koning.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Ahisar en Adoniram</text><text x="68" y="1009" class="body">Ahisar is hofmeester; Adoniram, zoon</text><text x="68" y="1052" class="body">van Abda, leidt de dwangarbeid.</text><text x="46" y="1145" class="note">De twee Azaria’s worden met hun verschillende</text><text x="46" y="1181" class="note">vaders en ambten onderscheiden.</text></svg>