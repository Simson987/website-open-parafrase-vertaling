<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Gajus, Diotrefes en Demetrius</title><desc id="desc">Gajus, Diotrefes en Demetrius met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gajus, Diotrefes en Demetrius</text><text x="44" y="113" class="ref">3 Johannes 1:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gajus · vers 1–8</text><text x="68" y="241" class="body">Geliefd; leeft in waarheid en handelt</text><text x="68" y="284" class="body">trouw voor reizende gelovigen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Diotrefes · vers 9–10</text><text x="68" y="433" class="body">Wil de eerste zijn; ontvangt niet en</text><text x="68" y="476" class="body">houdt anderen tegen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Demetrius · vers 12</text><text x="68" y="625" class="body">Heeft een goed getuigenis van allen, de</text><text x="68" y="668" class="body">waarheid en de schrijver.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De oproep · vers 11</text><text x="68" y="817" class="body">Volg niet het kwade na, maar het goede.</text><text x="46" y="910" class="note">De drie verschillende rollen volgen de</text><text x="46" y="946" class="note">expliciete berichten in de brief.</text></svg>