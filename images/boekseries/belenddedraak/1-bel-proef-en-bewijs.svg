<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Bel: proef en bewijs</title><desc id="desc">Bel: proef en bewijs met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bel: proef en bewijs</text><text x="44" y="113" class="ref">Bel en de draak 1:2–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanspraak · 2–8</text><text x="68" y="241" class="body">Het dagelijkse voedsel zou bewijzen dat</text><text x="68" y="284" class="body">Bel leeft.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De proef · 9–14</text><text x="68" y="433" class="body">Deur op slot en zegel intact; Daniël</text><text x="68" y="476" class="body">laat de vloer met as bestrooien.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De waarneming · 15–19</text><text x="68" y="625" class="body">Voedsel verdwenen, maar voetsporen van</text><text x="68" y="668" class="body">mannen, vrouwen en kinderen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De verklaring · 20–21</text><text x="68" y="817" class="body">Een verborgen toegang verklaart wie er</text><text x="68" y="860" class="body">werkelijk at.</text><text x="46" y="953" class="note">De zeventig priesters zijn in vers 9 genoemd</text><text x="46" y="989" class="note">zonder hun vrouwen en kinderen mee te tellen.</text></svg>