<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Draak, kuil en redding</title><desc id="desc">Draak, kuil en redding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Draak, kuil en redding</text><text x="44" y="113" class="ref">Bel en de draak 1:22–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De draak · 22–26</text><text x="68" y="241" class="body">Levend, maar door Daniël niet aanbeden;</text><text x="68" y="284" class="body">de test gebeurt zonder zwaard of stok.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De tegenstand · 27–31</text><text x="68" y="433" class="body">Dwang tegen de koning en Daniël zes</text><text x="68" y="476" class="body">dagen in de kuil met zeven leeuwen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het voedsel · 32–38</text><text x="68" y="625" class="body">Habakuk bereidt eten in Judea; het komt</text><text x="68" y="668" class="body">door engelenhulp bij Daniël.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De zevende dag · 39–41</text><text x="68" y="817" class="body">De koning ziet hem levend, prijst God</text><text x="68" y="860" class="body">en haalt hem uit de kuil.</text><text x="46" y="953" class="note">De ontmoeting met de draak en de kuil zijn</text><text x="46" y="989" class="note">opeenvolgende episodes; de maaltijd is een eigen</text><text x="46" y="1025" class="note">reddingsmoment.</text></svg>