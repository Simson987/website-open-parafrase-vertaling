<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Lof, berouw en genade</title><desc id="desc">Lof, berouw en genade met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lof, berouw en genade</text><text x="44" y="113" class="ref">Gebed van Manasse 1:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het aanspreken · 1–5</text><text x="68" y="241" class="body">God van de vaderen, Schepper en</text><text x="68" y="284" class="body">ontzagwekkende Rechter.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De barmhartigheid · 6–8</text><text x="68" y="433" class="body">Geduld, vergeving en berouw dat tot</text><text x="68" y="476" class="body">redding leidt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De erkenning · 9–11</text><text x="68" y="625" class="body">Veel zonden, zware boeien en de knieën</text><text x="68" y="668" class="body">van het hart buigen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het verzoek · 12–14</text><text x="68" y="817" class="body">Vergeving, behoud uit barmhartigheid en</text><text x="68" y="860" class="body">levenslange lof.</text><text x="46" y="953" class="note">De tekst is een gebed. Het bestaande</text><text x="46" y="989" class="note">terugkeerbeeld verbeeldt herstel; hier wordt nog</text><text x="46" y="1025" class="note">om vergeving gevraagd.</text></svg>