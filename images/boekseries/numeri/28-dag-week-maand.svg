<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Dag, sabbat en nieuwe maand</title><desc id="desc">Het onderscheid tussen de dagelijkse, sabbat- en nieuwemaansoffers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dag, sabbat en nieuwe maand</text><text x="44" y="113" class="ref">Numeri 28:3–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Elke dag</text><text x="68" y="241" class="body">Twee eenjarige lammeren: één in de</text><text x="68" y="284" class="body">ochtend en één tegen de avond.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Elke sabbat</text><text x="68" y="433" class="body">Twee extra eenjarige lammeren, naast</text><text x="68" y="476" class="body">het dagelijkse offer.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Begin van de maand</text><text x="68" y="625" class="body">Twee jonge stieren, één ram, zeven</text><text x="68" y="668" class="body">lammeren en een bok als zondoffer.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vaste basis blijft</text><text x="68" y="817" class="body">De offers van de nieuwe maand komen</text><text x="68" y="860" class="body">naast het dagelijkse offer.</text><text x="46" y="953" class="note">De aanvullende offers vervangen het dagelijkse</text><text x="46" y="989" class="note">offer niet.</text></svg>