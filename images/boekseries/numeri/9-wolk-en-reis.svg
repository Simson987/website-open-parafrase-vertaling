<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">De wolk en het reizen</title><desc id="desc">De beslisregel voor blijven, vertrekken en opnieuw kamperen onder de wolk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De wolk en het reizen</text><text x="44" y="113" class="ref">Numeri 9:15–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Overdag en in de nacht</text><text x="68" y="241" class="body">Overdag de wolk; in de avond iets dat</text><text x="68" y="284" class="body">op vuur lijkt.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De wolk blijft</text><text x="68" y="433" class="body">Het kamp blijft op zijn plaats.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De wolk stijgt</text><text x="68" y="582" class="body">De Israëlieten breken op.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De wolk daalt neer</text><text x="68" y="731" class="body">Daar slaan zij hun kamp op.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Geen vaste verblijfsduur</text><text x="68" y="880" class="body">Eén nacht, dagen, een maand of langer:</text><text x="68" y="923" class="body">de wolk bepaalt het vertrek.</text><text x="46" y="1016" class="note">Een schema van de herhaalde reisregel, geen</text><text x="46" y="1052" class="note">extra gebeurtenis die de tekst niet vertelt.</text></svg>