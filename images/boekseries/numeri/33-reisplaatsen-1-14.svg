<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1032" viewBox="0 0 840 1032" role="img" aria-labelledby="title desc"><title id="title">Reisplaatsen 1–14</title><desc id="desc">Geordend routeschema van Rameses tot Hazeroth, volgens Numeri 33:3–17.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1032" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reisplaatsen 1–14</text><text x="44" y="113" class="ref">Numeri 33:3–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Plaatsen 1–3</text><text x="68" y="241" class="body">Rameses → Sukkoth → Etham</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Plaatsen 4–6</text><text x="68" y="390" class="body">Pi-Hachiroth → Mara → Elim</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Plaatsen 7–9</text><text x="68" y="539" class="body">Schelfzee → woestijn Sin → Dofka</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Plaatsen 10–12</text><text x="68" y="688" class="body">Aluz → Rafidim → Sinaïwoestijn</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Plaatsen 13–14</text><text x="68" y="837" class="body">Kibroth-Taava → Hazeroth</text><text x="46" y="930" class="note">Volgorde van de genoemde kampplaatsen; de</text><text x="46" y="966" class="note">nummering is een leessteun, geen moderne kaart.</text></svg>