<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1227" viewBox="0 0 840 1227" role="img" aria-labelledby="title desc"><title id="title">Feesten in de zevende maand</title><desc id="desc">De eerste, tiende en vijftiende dag van de zevende maand en de achtste slotdag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1227" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Feesten in de zevende maand</text><text x="44" y="113" class="ref">Numeri 29:1–12, 35–39</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dag 1</text><text x="68" y="241" class="body">Trompetgeschal: één stier, één ram,</text><text x="68" y="284" class="body">zeven lammeren en een bok; naast nieuwe</text><text x="68" y="327" class="body">maand en dagelijks offer.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dag 10</text><text x="68" y="476" class="body">Verootmoediging: één stier, één ram,</text><text x="68" y="519" class="body">zeven lammeren en een bok; naast</text><text x="68" y="562" class="body">verzoenings- en dagelijks offer.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Vanaf dag 15</text><text x="68" y="711" class="body">Zeven dagen feest, met afnemend aantal</text><text x="68" y="754" class="body">stieren en de voorgeschreven andere</text><text x="68" y="797" class="body">dieren.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De achtste feestdag</text><text x="68" y="946" class="body">Plechtige slotdag: één stier, één ram,</text><text x="68" y="989" class="body">zeven lammeren en een bok; naast het</text><text x="68" y="1032" class="body">dagelijkse offer.</text><text x="46" y="1125" class="note">De verschillende feestdagen en hun aanvullende</text><text x="46" y="1161" class="note">offers worden onderscheiden.</text></svg>