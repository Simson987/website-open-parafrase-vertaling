<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De vier genoemde grenzen</title><desc id="desc">De vier grenzen met de opeenvolgende plaatsnamen die Numeri 34 noemt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vier genoemde grenzen</text><text x="44" y="113" class="ref">Numeri 34:3–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zuid</text><text x="68" y="241" class="body">Zoutzee → langs Akrabbim en Zin → ten</text><text x="68" y="284" class="body">zuiden van Kades-Barnea → Hazar-Addar →</text><text x="68" y="327" class="body">Azmon → beek van Egypte → zee.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">West</text><text x="68" y="476" class="body">De Grote Zee.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Noord</text><text x="68" y="625" class="body">Grote Zee → berg Hor → toegang tot</text><text x="68" y="668" class="body">Hamath → Zedad → Zifron → Hazar-Enan.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Oost</text><text x="68" y="817" class="body">Hazar-Enan → Sefam → Ribla, ten oosten</text><text x="68" y="860" class="body">van Ain → oostoever Kinneret → Jordaan</text><text x="68" y="903" class="body">→ Zoutzee.</text><text x="46" y="996" class="note">Een tekstueel grensschema, geen exacte moderne</text><text x="46" y="1032" class="note">landkaart. De noordelijke berg Hor wordt niet</text><text x="46" y="1068" class="note">gelijkgesteld aan Aärons sterfplaats.</text></svg>