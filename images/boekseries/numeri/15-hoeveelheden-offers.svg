<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Meel, olie en wijn</title><desc id="desc">De verschillende hoeveelheden graanoffer en drankoffer bij lam, ram en jonge stier.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Meel, olie en wijn</text><text x="44" y="113" class="ref">Numeri 15:4–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij een lam</text><text x="68" y="241" class="body">Circa twee liter meel, één liter olie</text><text x="68" y="284" class="body">en één liter wijn.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij een ram</text><text x="68" y="433" class="body">Circa vier liter meel, 1,3 liter olie</text><text x="68" y="476" class="body">en 1,3 liter wijn.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij een jonge stier</text><text x="68" y="625" class="body">Circa zes liter meel, twee liter olie</text><text x="68" y="668" class="body">en twee liter wijn.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Per dier</text><text x="68" y="817" class="body">De hoeveelheden gelden telkens voor</text><text x="68" y="860" class="body">ieder afzonderlijk offerdier.</text><text x="46" y="953" class="note">Benaderingen volgens de plaatselijke vertaling;</text><text x="46" y="989" class="note">er geldt één regel voor inwoner en vreemdeling.</text></svg>