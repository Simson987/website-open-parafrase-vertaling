<svg xmlns="http://www.w3.org/2000/svg" width="840" height="2075" viewBox="0 0 840 2075" role="img" aria-labelledby="title desc"><title id="title">De twaalf aangewezen leiders</title><desc id="desc">De twaalf stamleiders met hun vaders, zoals aangewezen om Mozes en Aäron te helpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="2075" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twaalf aangewezen leiders</text><text x="44" y="113" class="ref">Numeri 1:5–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben</text><text x="68" y="241" class="body">Elizur — zoon van Sedeür</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Simeon</text><text x="68" y="390" class="body">Selumiël — zoon van Zurisaddai</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Juda</text><text x="68" y="539" class="body">Nahesson — zoon van Amminadab</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Issaschar</text><text x="68" y="688" class="body">Nethaneël — zoon van Zuar</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Zebulon</text><text x="68" y="837" class="body">Eliab — zoon van Helon</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Efraïm</text><text x="68" y="986" class="body">Elisama — zoon van Ammihud</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">Manasse</text><text x="68" y="1135" class="body">Gamaliël — zoon van Pedazur</text><rect x="42" y="1193" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">Benjamin</text><text x="68" y="1284" class="body">Abidan — zoon van Gideoni</text><rect x="42" y="1342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1385" class="label">Dan</text><text x="68" y="1433" class="body">Ahiëzer — zoon van Ammisaddai</text><rect x="42" y="1491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1534" class="label">Aser</text><text x="68" y="1582" class="body">Pagiël — zoon van Ochran</text><rect x="42" y="1640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1683" class="label">Gad</text><text x="68" y="1731" class="body">Eljasaf — zoon van Dehuël</text><rect x="42" y="1789" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1832" class="label">Nafthali</text><text x="68" y="1880" class="body">Ahira — zoon van Enan</text><text x="46" y="1973" class="note">Namen en vadernamen volgen de plaatselijke tekst</text><text x="46" y="2009" class="note">van Numeri 1.</text></svg>