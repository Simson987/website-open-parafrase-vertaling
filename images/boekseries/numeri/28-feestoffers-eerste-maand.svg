<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Feestoffers en hoeveelheden</title><desc id="desc">De feestmomenten, aantallen dieren en hoeveelheden meel en wijn per dier.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Feestoffers en hoeveelheden</text><text x="44" y="113" class="ref">Numeri 28:12–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste maand</text><text x="68" y="241" class="body">Dag 14 pascha; vanaf dag 15 zeven dagen</text><text x="68" y="284" class="body">ongezuurde broden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Elke feestdag</text><text x="68" y="433" class="body">Twee stieren, één ram, zeven lammeren</text><text x="68" y="476" class="body">en een bok, naast het dagelijkse offer.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wekenfeest</text><text x="68" y="625" class="body">Ook twee stieren, één ram, zeven</text><text x="68" y="668" class="body">lammeren en een bok, met de</text><text x="68" y="711" class="body">voorgeschreven gaven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Meel per dier</text><text x="68" y="860" class="body">Circa zes liter per stier, vier liter</text><text x="68" y="903" class="body">per ram en twee liter per lam.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Wijn per dier</text><text x="68" y="1052" class="body">Circa twee liter per stier, 1,3 liter</text><text x="68" y="1095" class="body">per ram en één liter per lam.</text><text x="46" y="1188" class="note">De benaderingen volgen de plaatselijke</text><text x="46" y="1224" class="note">vertaling; de tekst noemt ook de bijbehorende</text><text x="46" y="1260" class="note">olie.</text></svg>