<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Wijding en diensttijd</title><desc id="desc">De inwijding van de Levieten en de leeftijdsbepalingen van Numeri 8, onderscheiden van hoofdstuk 4.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijding en diensttijd</text><text x="44" y="113" class="ref">Numeri 8:6–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Reinigen</text><text x="68" y="241" class="body">Reinigingswater, scheren en de kleding</text><text x="68" y="284" class="body">wassen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gemeenschap en offers</text><text x="68" y="433" class="body">Handoplegging, twee jonge stieren en</text><text x="68" y="476" class="body">het aanbieden van de Levieten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hun plaats</text><text x="68" y="625" class="body">Gegeven aan Aäron en zijn zonen in</text><text x="68" y="668" class="body">plaats van Israëls eerstgeborenen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vanaf vijfentwintig jaar</text><text x="68" y="817" class="body">Begin van de dienst bij de</text><text x="68" y="860" class="body">ontmoetingstent.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Vanaf vijftig jaar</text><text x="68" y="1009" class="body">Stoppen met het werk zelf; wel helpen</text><text x="68" y="1052" class="body">met de wacht.</text><text x="46" y="1145" class="note">Numeri 8 noemt vijfentwintig jaar; de</text><text x="46" y="1181" class="note">draagtaaktelling van hoofdstuk 4 noemt dertig</text><text x="46" y="1217" class="note">tot en met vijftig.</text></svg>