<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De gave per stamleider</title><desc id="desc">De inhoud van de herhaalde gave per stamleider, zonder twaalf vrijwel gelijke scènes te maken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gave per stamleider</text><text x="44" y="113" class="ref">Numeri 7:13–17, 84–88</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zilver en goud</text><text x="68" y="241" class="body">Schaal circa 1,4 kilo en sprengbekken</text><text x="68" y="284" class="body">circa 770 gram, met meel en olie;</text><text x="68" y="327" class="body">gouden schaal circa 110 gram met</text><text x="68" y="370" class="body">reukwerk.</text><rect x="42" y="428" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Brandoffer</text><text x="68" y="519" class="body">Eén jonge stier, één ram en één</text><text x="68" y="562" class="body">eenjarig lam.</text><rect x="42" y="620" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Zondoffer</text><text x="68" y="711" class="body">Eén geitenbok.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Dankoffer</text><text x="68" y="860" class="body">Twee runderen, vijf rammen, vijf bokken</text><text x="68" y="903" class="body">en vijf eenjarige lammeren.</text><text x="46" y="996" class="note">Iedere leider brengt dezelfde gave; het</text><text x="46" y="1032" class="note">hoofdstuk noemt daarna de totalen voor twaalf</text><text x="46" y="1068" class="note">leiders.</text></svg>