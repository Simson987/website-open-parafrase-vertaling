<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160" role="img"><title>Het aantal stieren per feestdag</title><rect width="1100" height="1160" fill="#f7f5e9"/><text x="50" y="65" font-family="DejaVu Sans" font-size="40" font-weight="700" fill="#20483e">Het aantal stieren per feestdag</text><text x="50" y="112" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#20483e">Numeri 29:12–38 — het zevendaagse feest en de slotdag</text><text x="50" y="209" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">Dag 1</text><rect x="220" y="175" width="650" height="48" rx="8" fill="#497c6c"/><text x="885" y="209" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">13</text><text x="50" y="292" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">Dag 2</text><rect x="220" y="258" width="600" height="48" rx="8" fill="#497c6c"/><text x="835" y="292" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">12</text><text x="50" y="375" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">Dag 3</text><rect x="220" y="341" width="550" height="48" rx="8" fill="#497c6c"/><text x="785" y="375" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">11</text><text x="50" y="458" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">Dag 4</text><rect x="220" y="424" width="500" height="48" rx="8" fill="#497c6c"/><text x="735" y="458" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">10</text><text x="50" y="541" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">Dag 5</text><rect x="220" y="507" width="450" height="48" rx="8" fill="#497c6c"/><text x="685" y="541" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">9</text><text x="50" y="624" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">Dag 6</text><rect x="220" y="590" width="400" height="48" rx="8" fill="#497c6c"/><text x="635" y="624" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">8</text><text x="50" y="707" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">Dag 7</text><rect x="220" y="673" width="350" height="48" rx="8" fill="#497c6c"/><text x="585" y="707" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">7</text><text x="50" y="790" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">Dag 8</text><rect x="220" y="756" width="50" height="48" rx="8" fill="#497c6c"/><text x="285" y="790" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#20483e">1</text><text x="50" y="925" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#20483e">Dag 1–7: daarnaast telkens 2 rammen, 14 lammeren en 1 bok.</text><text x="50" y="975" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#20483e">Dag 8: daarnaast 1 ram, 7 lammeren en 1 bok.</text><text x="50" y="1025" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#20483e">Iedere dag ook het vaste dagelijkse offer en de bijbehorende gaven.</text><text x="50" y="1090" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#20483e">De achtste dag is de afzonderlijke plechtige slotdag.</text></svg>