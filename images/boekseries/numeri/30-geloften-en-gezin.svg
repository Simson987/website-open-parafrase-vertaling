<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Geloften en het gezin</title><desc id="desc">De onderscheiden gevallen voor man, dochter, getrouwde vrouw, weduwe en verstoten vrouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geloften en het gezin</text><text x="44" y="113" class="ref">Numeri 30:2–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een man</text><text x="68" y="241" class="body">Hij moet uitvoeren wat hij heeft</text><text x="68" y="284" class="body">uitgesproken.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jonge vrouw in vaders huis</text><text x="68" y="433" class="body">Zwijgen bij het horen bekrachtigt de</text><text x="68" y="476" class="body">gelofte; verbieden op die dag maakt</text><text x="68" y="519" class="body">haar ongeldig.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Een getrouwde vrouw</text><text x="68" y="668" class="body">De tekst onderscheidt zwijgen op de dag</text><text x="68" y="711" class="body">van horen van tijdig ongeldig maken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Weduwe of verstoten vrouw</text><text x="68" y="860" class="body">Alles waaraan zij zich gebonden heeft,</text><text x="68" y="903" class="body">blijft van kracht.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Pas later ongeldig gemaakt</text><text x="68" y="1052" class="body">De man draagt volgens vers 15 haar</text><text x="68" y="1095" class="body">schuld.</text><text x="46" y="1188" class="note">Een vergelijking van de verschillende gevallen</text><text x="46" y="1224" class="note">in deze historische gelofteregeling.</text></svg>