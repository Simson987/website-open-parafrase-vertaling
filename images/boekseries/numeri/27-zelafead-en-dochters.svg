<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Zelafead en zijn dochters</title><desc id="desc">De afstamming van Zelafead, de vijf dochters en de beslissing over hun erfdeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zelafead en zijn dochters</text><text x="44" y="113" class="ref">Numeri 27:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De afstamming</text><text x="68" y="241" class="body">Jozef → Manasse → Machir → Gilead →</text><text x="68" y="284" class="body">Hefer → Zelafead.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vijf dochters</text><text x="68" y="433" class="body">Machla, Noa, Hogla, Milka en Tirza.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Hun verzoek</text><text x="68" y="582" class="body">Een eigen erfelijk bezit tussen de</text><text x="68" y="625" class="body">broers van hun vader, die geen zoon</text><text x="68" y="668" class="body">naliet.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De uitspraak</text><text x="68" y="817" class="body">Hun verzoek is terecht; het erfdeel van</text><text x="68" y="860" class="body">hun vader gaat op hen over.</text><text x="46" y="953" class="note">De vijf namen en de hele afstammingslijn volgen</text><text x="46" y="989" class="note">de plaatselijke hoofdstuktekst.</text></svg>