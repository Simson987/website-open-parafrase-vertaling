<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De priesterlijke zegen</title><desc id="desc">De drie regels van de priesterlijke zegen, gegroepeerd naar bescherming, genade en vrede.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De priesterlijke zegen</text><text x="44" y="113" class="ref">Numeri 6:22–27</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zegen en bescherming</text><text x="68" y="241" class="body">Moge de HEERE u zegenen en beschermen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Licht en genade</text><text x="68" y="390" class="body">Moge de HEERE Zijn aangezicht over u</text><text x="68" y="433" class="body">laten stralen en u genadig zijn.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Toewending en vrede</text><text x="68" y="582" class="body">Moge de HEERE Zijn aangezicht naar u</text><text x="68" y="625" class="body">toekeren en u vrede geven.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De opdracht</text><text x="68" y="774" class="body">Aäron en zijn zonen leggen zo Gods naam</text><text x="68" y="817" class="body">op de Israëlieten.</text><text x="46" y="910" class="note">De drie zegenregels worden als tekst zichtbaar</text><text x="46" y="946" class="note">gemaakt; Gods aangezicht wordt niet letterlijk</text><text x="46" y="982" class="note">afgebeeld.</text></svg>