<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Reiniging en verdeling</title><desc id="desc">De reinigingsperiode en de twee verschillende bijdragen uit de twee helften van de buit.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reiniging en verdeling</text><text x="44" y="113" class="ref">Numeri 31:19–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zeven dagen buiten het kamp</text><text x="68" y="241" class="body">De genoemde betrokkenen reinigen zich</text><text x="68" y="284" class="body">op dag drie en zeven; op dag zeven</text><text x="68" y="327" class="body">kleding wassen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De voorwerpen</text><text x="68" y="476" class="body">Vuurvaste metalen door vuur én</text><text x="68" y="519" class="body">reinigingswater; wat niet tegen vuur</text><text x="68" y="562" class="body">kan door water.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Twee helften</text><text x="68" y="711" class="body">Eén helft voor de strijders en één voor</text><text x="68" y="754" class="body">de gemeenschap.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Van het strijdersdeel</text><text x="68" y="903" class="body">Eén op vijfhonderd voor de priester</text><text x="68" y="946" class="body">Eleazar.</text><rect x="42" y="1004" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Van het gemeenschapsdeel</text><text x="68" y="1095" class="body">Eén op vijftig voor de Levieten.</text><text x="46" y="1188" class="note">Dit ordent de tekst zonder gevangenen of geweld</text><text x="46" y="1224" class="note">af te beelden.</text></svg>