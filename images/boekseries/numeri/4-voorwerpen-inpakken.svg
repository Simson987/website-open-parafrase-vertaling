<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Eerst bedekken, dan dragen</title><desc id="desc">De volgorde en verschillende lagen bij het inpakken van heilige voorwerpen voor de reis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eerst bedekken, dan dragen</text><text x="44" y="113" class="ref">Numeri 4:5–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aäron en zijn zonen</text><text x="68" y="241" class="body">Bedekken de heilige voorwerpen vóór de</text><text x="68" y="284" class="body">dragers binnenkomen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ark en tafel</text><text x="68" y="433" class="body">Ark: voorhangsel, dekkleed, blauw.</text><text x="68" y="476" class="body">Tafel: blauw, scharlaken en dekkleed.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Kandelaar en gouden altaar</text><text x="68" y="625" class="body">Blauw kleed en dekkleed; de kandelaar</text><text x="68" y="668" class="body">gaat op een draagbaar.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Offeraltaar</text><text x="68" y="817" class="body">As verwijderen, purperen kleed,</text><text x="68" y="860" class="body">gereedschap en dekkleed.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Daarna de Kohathieten</text><text x="68" y="1009" class="body">Dragen de ingepakte voorwerpen zonder</text><text x="68" y="1052" class="body">ze rechtstreeks aan te raken of bij het</text><text x="68" y="1095" class="body">inpakken toe te kijken.</text><text x="46" y="1188" class="note">De afzonderlijke taken van priesters en dragers</text><text x="46" y="1224" class="note">blijven onderscheiden.</text></svg>