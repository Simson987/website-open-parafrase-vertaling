<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1111" viewBox="0 0 840 1111" role="img" aria-labelledby="title desc"><title id="title">Volgorde van de kampgroepen</title><desc id="desc">De vier kampgroepen en hun totalen, met de Levieten in het midden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1111" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volgorde van de kampgroepen</text><text x="44" y="113" class="ref">Numeri 2:9–31</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste: Juda</text><text x="68" y="241" class="body">Juda, Issaschar en Zebulon: 186.400.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tweede: Ruben</text><text x="68" y="390" class="body">Ruben, Simeon en Gad: 151.450.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">In het midden</text><text x="68" y="539" class="body">De ontmoetingstent met het kamp van de</text><text x="68" y="582" class="body">Levieten.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Derde: Efraïm</text><text x="68" y="731" class="body">Efraïm, Manasse en Benjamin: 108.100.</text><rect x="42" y="789" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Laatste: Dan</text><text x="68" y="880" class="body">Dan, Aser en Nafthali: 157.600.</text><text x="46" y="973" class="note">Dit is de groepsvolgorde uit Numeri 2; hoofdstuk</text><text x="46" y="1009" class="note">10 beschrijft de draaggroepen bij het vertrek</text><text x="46" y="1045" class="note">nader.</text></svg>