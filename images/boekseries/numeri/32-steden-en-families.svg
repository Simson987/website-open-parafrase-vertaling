<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Steden en families</title><desc id="desc">De genoemde steden van Gad en Ruben en de afzonderlijke handelingen van Machir, Jaïr en Nobah.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Steden en families</text><text x="44" y="113" class="ref">Numeri 32:34–42</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gad</text><text x="68" y="241" class="body">Dibon, Ataroth, Aroër, Atroth-Sofan,</text><text x="68" y="284" class="body">Jaëzer, Jogbeha, Beth-Nimra en</text><text x="68" y="327" class="body">Beth-Haran.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Ruben</text><text x="68" y="476" class="body">Hesbon, Eleale, Kirjathaïm, Nebo,</text><text x="68" y="519" class="body">Baäl-Meon en Sibma; de tekst vermeldt</text><text x="68" y="562" class="body">nieuwe namen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Machir</text><text x="68" y="711" class="body">Zoon van Manasse; zijn nakomelingen</text><text x="68" y="754" class="body">nemen Gilead in bezit.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Jaïr en Nobah</text><text x="68" y="903" class="body">Jaïr noemt dorpen Havvoth-Jaïr; Nobah</text><text x="68" y="946" class="body">noemt Kenath met de dorpen Nobah.</text><text x="46" y="1039" class="note">Namen volgen dit hoofdstuk; er worden geen</text><text x="46" y="1075" class="note">onbevestigde plaatscoördinaten ingevuld.</text></svg>