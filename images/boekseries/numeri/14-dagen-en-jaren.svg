<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Veertig dagen, veertig jaar</title><desc id="desc">Het verband tussen de verkenning, de aangekondigde veertig jaar en de genoemde uitzonderingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Veertig dagen, veertig jaar</text><text x="44" y="113" class="ref">Numeri 14:20–38</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De verkenning</text><text x="68" y="241" class="body">Veertig dagen in het land.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De aangekondigde gevolgen</text><text x="68" y="390" class="body">Voor elke dag een jaar: veertig jaar in</text><text x="68" y="433" class="body">de woestijn.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De genoemde generatie</text><text x="68" y="582" class="body">De getelden van twintig jaar en ouder</text><text x="68" y="625" class="body">die gemopperd hebben, zullen het land</text><text x="68" y="668" class="body">niet binnengaan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De uitzonderingen</text><text x="68" y="817" class="body">Kaleb, zoon van Jefunne, en Jozua, zoon</text><text x="68" y="860" class="body">van Nun.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De kinderen</text><text x="68" y="1009" class="body">Zij zullen het land leren kennen dat</text><text x="68" y="1052" class="body">hun ouders afwezen.</text><text x="46" y="1145" class="note">De tekst legt zelf het verband tussen dagen en</text><text x="46" y="1181" class="note">jaren.</text></svg>