<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Tienden en diensttaken</title><desc id="desc">De verschillende diensttaken en de stroom van tienden van Israël naar Levieten en vervolgens naar Aäron.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tienden en diensttaken</text><text x="44" y="113" class="ref">Numeri 18:1–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aäron en zijn zonen</text><text x="68" y="241" class="body">Priesterdienst bij altaar en achter het</text><text x="68" y="284" class="body">voorhangsel; zorg voor de heilige</text><text x="68" y="327" class="body">gaven.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De Levieten</text><text x="68" y="476" class="body">Dienst bij de tent; de tienden als loon</text><text x="68" y="519" class="body">en erfdeel.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Een tiende van de tiende</text><text x="68" y="668" class="body">De Levieten zetten van hun ontvangen</text><text x="68" y="711" class="body">tienden zelf het beste deel apart.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De ontvanger</text><text x="68" y="860" class="body">Dat deel geven zij aan de priester</text><text x="68" y="903" class="body">Aäron.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De rest</text><text x="68" y="1052" class="body">De Levieten en hun gezinnen mogen de</text><text x="68" y="1095" class="body">rest overal eten.</text><text x="46" y="1188" class="note">De eerste tiende en het deel daaruit worden niet</text><text x="46" y="1224" class="note">met elkaar verwisseld.</text></svg>