<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Eerstgeborenen en losgeld</title><desc id="desc">De vergelijking en exacte berekening van het losgeld voor de 273 overgebleven eerstgeborenen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eerstgeborenen en losgeld</text><text x="44" y="113" class="ref">Numeri 3:39–51</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De genoemde totalen</text><text x="68" y="241" class="body">22.000 Levieten tegenover 22.273</text><text x="68" y="284" class="body">mannelijke eerstgeborenen, vanaf één</text><text x="68" y="327" class="body">maand.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het verschil</text><text x="68" y="476" class="body">22.273 − 22.000 = 273 eerstgeborenen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Per persoon</text><text x="68" y="625" class="body">Vijf heiligdomssikkels, ongeveer 55</text><text x="68" y="668" class="body">gram zilver.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Samen</text><text x="68" y="817" class="body">273 × 5 = 1.365 heiligdomssikkels.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De overdracht</text><text x="68" y="966" class="body">Mozes geeft het losgeld aan Aäron en</text><text x="68" y="1009" class="body">zijn zonen.</text><text x="46" y="1102" class="note">Dit gebruikt het totaal uit vers 39 en de</text><text x="46" y="1138" class="note">daaropvolgende berekening; de familietellingen</text><text x="46" y="1174" class="note">worden hier niet opgeteld.</text></svg>