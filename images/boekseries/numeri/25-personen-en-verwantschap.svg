<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Personen en verwantschap</title><desc id="desc">De drie genoemde personen met hun vaders, stam en het genoemde verbond.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Personen en verwantschap</text><text x="44" y="113" class="ref">Numeri 25:7–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Pinehas</text><text x="68" y="241" class="body">Zoon van Eleazar, zoon van de priester</text><text x="68" y="284" class="body">Aäron.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zimri</text><text x="68" y="433" class="body">Zoon van Salu; familiehoofd van de</text><text x="68" y="476" class="body">Simeonieten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Kozbi</text><text x="68" y="625" class="body">Dochter van Zur, een familie- en</text><text x="68" y="668" class="body">stamhoofd in Midian.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het verbond</text><text x="68" y="817" class="body">De tekst noemt voor Pinehas en zijn</text><text x="68" y="860" class="body">nakomelingen een verbond van vrede en</text><text x="68" y="903" class="body">priesterschap.</text><text x="46" y="996" class="note">De namen en relaties worden sober gecontroleerd;</text><text x="46" y="1032" class="note">de doding wordt niet afgebeeld.</text></svg>