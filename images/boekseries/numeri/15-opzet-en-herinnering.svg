<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Vergissing en herinnering</title><desc id="desc">De categorieën van onbedoelde en opzettelijke overtreding en de functie van de kwastjes.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vergissing en herinnering</text><text x="44" y="113" class="ref">Numeri 15:22–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gemeenschap zonder opzet</text><text x="68" y="241" class="body">Jonge stier als brandoffer, met</text><text x="68" y="284" class="body">bijbehorende gaven; bok als zondoffer.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Enkeling zonder opzet</text><text x="68" y="433" class="body">Een eenjarige geit als zondoffer; de</text><text x="68" y="476" class="body">priester doet verzoening.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Met opzet</text><text x="68" y="625" class="body">De tekst onderscheidt opzettelijke</text><text x="68" y="668" class="body">minachting van een vergissing.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De houtverzamelaar</text><text x="68" y="817" class="body">Afzonderlijke gebeurtenis over de</text><text x="68" y="860" class="body">sabbat; de terechtstelling wordt niet</text><text x="68" y="903" class="body">afgebeeld.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Kwastjes met blauwe draad</text><text x="68" y="1052" class="body">Een zichtbaar teken om de geboden te</text><text x="68" y="1095" class="body">herinneren en te doen.</text><text x="46" y="1188" class="note">Verschillende tekstgedeelten worden</text><text x="46" y="1224" class="note">onderscheiden zonder strafbeelden.</text></svg>