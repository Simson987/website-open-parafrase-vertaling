<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Beeldspraak in de spreuken</title><desc id="desc">Uitleg van de poëtische vergelijkingen en het toekomstbeeld van ster en scepter.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beeldspraak in de spreuken</text><text x="44" y="113" class="ref">Numeri 24:5–9, 17–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tenten als tuinen</text><text x="68" y="241" class="body">Het kamp wordt vergeleken met</text><text x="68" y="284" class="body">beekdalen, tuinen en bomen langs water.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Os en leeuw</text><text x="68" y="433" class="body">Beelden van kracht en rust; geen</text><text x="68" y="476" class="body">letterlijke dierverandering van Israël.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ster en scepter</text><text x="68" y="625" class="body">Beeldspraak over een toekomstige</text><text x="68" y="668" class="body">heerser uit Jakob en Israël.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De blik vooruit</text><text x="68" y="817" class="body">Daarna worden Moab, Edom, Amalek,</text><text x="68" y="860" class="body">Kenieten en schepen van Kittim genoemd.</text><text x="46" y="953" class="note">De beelden zijn woorden in een spreuk; ze worden</text><text x="46" y="989" class="note">niet als al gebeurde historische scènes</text><text x="46" y="1025" class="note">voorgesteld.</text></svg>