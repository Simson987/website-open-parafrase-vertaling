<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Koningen en gebieden</title><desc id="desc">Arad, Sihon en Og met de bijbehorende plaatsen en gebeurtenissen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Koningen en gebieden</text><text x="44" y="113" class="ref">Numeri 21:1–3, 21–35</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Arad</text><text x="68" y="241" class="body">De Kanaänitische koning valt Israël</text><text x="68" y="284" class="body">aan; daarna volgen gelofte en</text><text x="68" y="327" class="body">overwinning.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Sihon</text><text x="68" y="476" class="body">Koning van de Amorieten in Hesbon;</text><text x="68" y="519" class="body">weigert doortocht en valt aan bij</text><text x="68" y="562" class="body">Jahaz.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het ingenomen gebied</text><text x="68" y="711" class="body">Van de Arnon tot de Jabbok, tot aan het</text><text x="68" y="754" class="body">gebied van de Ammonieten.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Og</text><text x="68" y="903" class="body">Koning van Basan; trekt Israël tegemoet</text><text x="68" y="946" class="body">bij Edreï.</text><text x="46" y="1039" class="note">Het schema onderscheidt de verschillende</text><text x="46" y="1075" class="note">tegenstanders en plaatsen zonder slagvelden te</text><text x="46" y="1111" class="note">verbeelden.</text></svg>