<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De twaalf verkenners</title><desc id="desc">De twaalf verkenners met hun vaders en stammen, en de naamgeving van Jozua.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twaalf verkenners</text><text x="44" y="113" class="ref">Numeri 13:4–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben · Simeon · Juda</text><text x="68" y="241" class="body">Sammua, zoon van Zakkur · Safat, zoon</text><text x="68" y="284" class="body">van Hori · Kaleb, zoon van Jefunne.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Issaschar · Efraïm · Benjamin</text><text x="68" y="433" class="body">Jigeal, zoon van Jozef · Hosea, zoon</text><text x="68" y="476" class="body">van Nun · Palti, zoon van Rafu.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zebulon · Manasse · Dan</text><text x="68" y="625" class="body">Gaddiel, zoon van Sodi · Gaddi, zoon</text><text x="68" y="668" class="body">van Susi · Ammiël, zoon van Gemalli.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Aser · Nafthali · Gad</text><text x="68" y="817" class="body">Sethur, zoon van Michaël · Nachbi, zoon</text><text x="68" y="860" class="body">van Wofsi · Guël, zoon van Machi.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Een nieuwe naam</text><text x="68" y="1009" class="body">Mozes geeft Hosea, zoon van Nun, de</text><text x="68" y="1052" class="body">naam Jozua.</text><text x="46" y="1145" class="note">Binnen elke rij horen de namen in dezelfde</text><text x="46" y="1181" class="note">volgorde bij de genoemde stammen.</text></svg>