<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De gebeurtenissen rond Mirjam</title><desc id="desc">De volgorde van het conflict, voorbede, zeven dagen wachten en het verdere vertrek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gebeurtenissen rond Mirjam</text><text x="44" y="113" class="ref">Numeri 12:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanleiding</text><text x="68" y="241" class="body">Mirjam en Aäron spreken tegen Mozes;</text><text x="68" y="284" class="body">zijn Cusjitische vrouw en zijn gezag</text><text x="68" y="327" class="body">worden genoemd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bij de ontmoetingstent</text><text x="68" y="476" class="body">Alle drie worden geroepen; Aäron en</text><text x="68" y="519" class="body">Mirjam komen naar voren.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Voorbede</text><text x="68" y="668" class="body">Aäron erkent hun schuld en Mozes bidt</text><text x="68" y="711" class="body">om Mirjams genezing.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zeven dagen</text><text x="68" y="860" class="body">Mirjam blijft buiten het kamp; het volk</text><text x="68" y="903" class="body">wacht tot zij terug is.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Daarna verder</text><text x="68" y="1052" class="body">Van Hazeroth naar de woestijn van</text><text x="68" y="1095" class="body">Paran.</text><text x="46" y="1188" class="note">Dit schema voegt geen afstamming of naam van de</text><text x="46" y="1224" class="note">Cusjitische vrouw toe die het hoofdstuk niet</text><text x="46" y="1260" class="note">geeft.</text></svg>