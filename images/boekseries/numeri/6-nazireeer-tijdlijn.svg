<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">De nazireeërsgelofte</title><desc id="desc">De regels, mogelijke onderbreking en afsluiting van de nazireeërsgelofte voor mannen en vrouwen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nazireeërsgelofte</text><text x="44" y="113" class="ref">Numeri 6:2–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voor man of vrouw</text><text x="68" y="241" class="body">Een bijzondere periode van toewijding</text><text x="68" y="284" class="body">aan de HEERE.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tijdens de periode</text><text x="68" y="433" class="body">Niets van de wijnstok, het haar laten</text><text x="68" y="476" class="body">groeien en niet bij een dode komen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij onverwachte verontreiniging</text><text x="68" y="625" class="body">Reiniging, offers en een nieuwe</text><text x="68" y="668" class="body">volledige periode; de vorige dagen</text><text x="68" y="711" class="body">tellen niet mee.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bij de voltooiing</text><text x="68" y="860" class="body">Mannelijk lam, ooilam, ram en</text><text x="68" y="903" class="body">ongezuurde koeken; de voorgeschreven</text><text x="68" y="946" class="body">handelingen bij de tent.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Na de afsluiting</text><text x="68" y="1095" class="body">De tekst staat weer toe wijn te</text><text x="68" y="1138" class="body">drinken.</text><text x="46" y="1231" class="note">Het schema onderscheidt een onderbroken gelofte</text><text x="46" y="1267" class="note">van een voltooide gelofte.</text></svg>