<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1330" viewBox="0 0 840 1330" role="img" aria-labelledby="title desc"><title id="title">Reisplaatsen 15–34</title><desc id="desc">Geordend routeschema van Rithma tot berg Hor, volgens Numeri 33:18–39.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1330" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reisplaatsen 15–34</text><text x="44" y="113" class="ref">Numeri 33:18–39</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Plaatsen 15–17</text><text x="68" y="241" class="body">Rithma → Rimmon-Perez → Libna</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Plaatsen 18–20</text><text x="68" y="390" class="body">Rissa → Kehelatha → berg Safer</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Plaatsen 21–23</text><text x="68" y="539" class="body">Harada → Makheloth → Tachath</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Plaatsen 24–26</text><text x="68" y="688" class="body">Tharah → Mithka → Hasmona</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Plaatsen 27–29</text><text x="68" y="837" class="body">Moseroth → Bene-Jaakan → Hor-Gidgad</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Plaatsen 30–32</text><text x="68" y="986" class="body">Jotbatha → Abrona → Ezeon-Geber</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">Plaatsen 33–34</text><text x="68" y="1135" class="body">woestijn Zin (Kades) → berg Hor</text><text x="46" y="1228" class="note">Volgorde van de genoemde kampplaatsen; de</text><text x="46" y="1264" class="note">nummering is een leessteun, geen moderne kaart.</text></svg>