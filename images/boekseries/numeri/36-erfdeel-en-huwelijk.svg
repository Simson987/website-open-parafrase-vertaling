<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Erfdeel en huwelijk</title><desc id="desc">Het verband tussen de vraag, de huwelijksbepaling, de vijf dochters en behoud van het erfdeel in Manasse.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Erfdeel en huwelijk</text><text x="44" y="113" class="ref">Numeri 36:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag</text><text x="68" y="241" class="body">Een huwelijk buiten de stam zou het</text><text x="68" y="284" class="body">erfdeel naar een andere stam brengen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De uitspraak</text><text x="68" y="433" class="body">De dochters mogen kiezen met wie zij</text><text x="68" y="476" class="body">trouwen, binnen een familie van hun</text><text x="68" y="519" class="body">vaders stam.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De vijf dochters</text><text x="68" y="668" class="body">Machla, Tirza, Hogla, Milka en Noa</text><text x="68" y="711" class="body">trouwen met de zonen van hun ooms.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het gevolg</text><text x="68" y="860" class="body">Het erfdeel blijft in de families van</text><text x="68" y="903" class="body">Manasse, zoon van Jozef.</text><text x="46" y="996" class="note">Hetzelfde vijftal als in Numeri 27; dit</text><text x="46" y="1032" class="note">hoofdstuk noemt hen in een andere volgorde.</text></svg>