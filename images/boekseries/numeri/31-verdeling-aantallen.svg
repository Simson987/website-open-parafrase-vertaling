<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De aantallen in de verdeling</title><desc id="desc">De genoemde totalen, helften en één-op-vijfhonderd-bijdragen uit Numeri 31.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De aantallen in de verdeling</text><text x="44" y="113" class="ref">Numeri 31:32–47</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schapen</text><text x="68" y="241" class="body">Totaal 675.000; per helft 337.500;</text><text x="68" y="284" class="body">bijdrage uit het strijdersdeel 675.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Runderen</text><text x="68" y="433" class="body">Totaal 72.000; per helft 36.000;</text><text x="68" y="476" class="body">bijdrage uit het strijdersdeel 72.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ezels</text><text x="68" y="625" class="body">Totaal 61.000; per helft 30.500;</text><text x="68" y="668" class="body">bijdrage uit het strijdersdeel 61.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Personen</text><text x="68" y="817" class="body">Totaal 32.000; per helft 16.000;</text><text x="68" y="860" class="body">bijdrage uit het strijdersdeel 32.</text><text x="46" y="953" class="note">De aantallen beschrijven de buitverdeling in de</text><text x="46" y="989" class="note">historische tekst; mensen worden niet als</text><text x="46" y="1025" class="note">handelswaar afgebeeld.</text></svg>