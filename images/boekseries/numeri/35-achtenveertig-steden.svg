<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Achtenveertig Levietensteden</title><desc id="desc">De verdeling van de 48 Levietensteden, met zes vrijsteden aan beide zijden van de Jordaan.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Achtenveertig Levietensteden</text><text x="44" y="113" class="ref">Numeri 35:2–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zes vrijsteden</text><text x="68" y="241" class="body">Drie aan deze kant van de Jordaan en</text><text x="68" y="284" class="body">drie in Kanaän.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweeënveertig andere steden</text><text x="68" y="433" class="body">Naast de vrijsteden, met de</text><text x="68" y="476" class="body">weidegronden.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Samen achtenveertig</text><text x="68" y="625" class="body">6 + 42 = 48 Levietensteden.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Uit de stamgebieden</text><text x="68" y="774" class="body">Een grote stam geeft meer steden; een</text><text x="68" y="817" class="body">kleine stam minder.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Voor wie de toevlucht geldt</text><text x="68" y="966" class="body">Israëliet, vreemdeling en tijdelijke</text><text x="68" y="1009" class="body">bewoner bij onopzettelijk doden.</text><text x="46" y="1102" class="note">De tekst noemt hier de aantallen en spreiding,</text><text x="46" y="1138" class="note">nog geen zes stadsnamen.</text></svg>