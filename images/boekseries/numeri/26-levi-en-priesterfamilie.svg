<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Levi en de priesterfamilie</title><desc id="desc">De genoemde familiebanden van Levi tot Aärons zonen en de afzonderlijke Levietentelling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levi en de priesterfamilie</text><text x="44" y="113" class="ref">Numeri 26:57–62</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De drie families</text><text x="68" y="241" class="body">Gerson, Kohath en Merari.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Kohath en Amram</text><text x="68" y="390" class="body">Kohath wordt de vader van Amram.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Amram en Jochebed</text><text x="68" y="539" class="body">Jochebed is een dochter van Levi. Hun</text><text x="68" y="582" class="body">kinderen zijn Aäron, Mozes en Mirjam.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Aärons zonen</text><text x="68" y="731" class="body">Nadab, Abihu, Eleazar en Ithamar. De</text><text x="68" y="774" class="body">tekst vermeldt dat Nadab en Abihu</text><text x="68" y="817" class="body">gestorven zijn.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Afzonderlijke telling</text><text x="68" y="966" class="body">23.000 mannelijke Levieten vanaf één</text><text x="68" y="1009" class="body">maand; niet in de legertelling</text><text x="68" y="1052" class="body">opgenomen.</text><text x="46" y="1145" class="note">Deze telling gebruikt een andere leeftijdsgrens</text><text x="46" y="1181" class="note">dan de telling van het leger.</text></svg>