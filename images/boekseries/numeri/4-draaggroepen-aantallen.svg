<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">De getelde draaggroepen</title><desc id="desc">Taken en aantallen van de drie groepen, met de leeftijdsgrens en het totaal.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De getelde draaggroepen</text><text x="44" y="113" class="ref">Numeri 4:22–49</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kohathieten: 2.750</text><text x="68" y="241" class="body">Zorg en draagtaak voor de heilige</text><text x="68" y="284" class="body">voorwerpen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gersonieten: 2.630</text><text x="68" y="433" class="body">Tentkleden, gordijnen, dekkleden en</text><text x="68" y="476" class="body">touwen; toezicht door Ithamar.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Merarieten: 3.200</text><text x="68" y="625" class="body">Planken, balken, palen, voetstukken en</text><text x="68" y="668" class="body">voorhofbenodigdheden; toezicht door</text><text x="68" y="711" class="body">Ithamar.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Totaal: 8.580</text><text x="68" y="860" class="body">Mannen van dertig tot en met vijftig</text><text x="68" y="903" class="body">jaar, ieder met zijn eigen taak en</text><text x="68" y="946" class="body">draaglast.</text><text x="46" y="1039" class="note">Dit is de diensttelling van Numeri 4, niet de</text><text x="46" y="1075" class="note">telling vanaf één maand uit hoofdstuk 3.</text></svg>