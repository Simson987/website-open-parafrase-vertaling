<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Meriba en de opvolging</title><desc id="desc">De verschillende gebeurtenissen en het onderscheid tussen de opdracht bij de rots en wat Mozes doet.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Meriba en de opvolging</text><text x="44" y="113" class="ref">Numeri 20:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kades</text><text x="68" y="241" class="body">Mirjam sterft en wordt begraven; de</text><text x="68" y="284" class="body">gemeenschap heeft geen water.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Opdracht en handeling</text><text x="68" y="433" class="body">De opdracht is spreken tot de rots;</text><text x="68" y="476" class="body">Mozes slaat de rots tweemaal.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Edom</text><text x="68" y="625" class="body">Het verzoek om doortocht wordt</text><text x="68" y="668" class="body">geweigerd; Israël gaat een andere weg.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De berg Hor</text><text x="68" y="817" class="body">Mozes, Aäron en Eleazar gaan omhoog; de</text><text x="68" y="860" class="body">priesterkleding gaat naar Eleazar.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Na Aärons dood</text><text x="68" y="1009" class="body">Mozes en Eleazar dalen af; Israël rouwt</text><text x="68" y="1052" class="body">dertig dagen.</text><text x="46" y="1145" class="note">De opvolging wordt onderscheiden van de eerdere</text><text x="46" y="1181" class="note">gebeurtenis bij Meriba.</text></svg>