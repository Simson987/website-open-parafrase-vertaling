<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Pascha en de tweede maand</title><desc id="desc">De vaste paschatijd en de bijzondere regeling voor de tweede maand.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Pascha en de tweede maand</text><text x="44" y="113" class="ref">Numeri 9:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vaste tijd</text><text x="68" y="241" class="body">Veertiende dag van de eerste maand,</text><text x="68" y="284" class="body">tegen de avond.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De uitzondering</text><text x="68" y="433" class="body">Onrein door een dode of ver weg op</text><text x="68" y="476" class="body">reis.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De tweede gelegenheid</text><text x="68" y="625" class="body">Veertiende dag van de tweede maand,</text><text x="68" y="668" class="body">tegen de avond.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dezelfde voorschriften</text><text x="68" y="817" class="body">Ongezuurd brood, bittere kruiden, niets</text><text x="68" y="860" class="body">tot de morgen en geen bot breken.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Eén regel</text><text x="68" y="1009" class="body">Ook voor de vreemdeling die het pascha</text><text x="68" y="1052" class="body">wil vieren.</text><text x="46" y="1145" class="note">De uitzondering is geen willekeurige</text><text x="46" y="1181" class="note">verplaatsing van het pascha.</text></svg>