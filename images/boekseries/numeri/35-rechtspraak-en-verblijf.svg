<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Rechtspraak en verblijf</title><desc id="desc">De volgorde van bescherming, onderzoek, verblijf en terugkeer en de bepalingen over getuigen en losgeld.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rechtspraak en verblijf</text><text x="44" y="113" class="ref">Numeri 35:11–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerst bescherming</text><text x="68" y="241" class="body">De gevluchte persoon blijft in leven</text><text x="68" y="284" class="body">tot de gemeenschap rechtspreekt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het onderzoek</text><text x="68" y="433" class="body">De tekst onderscheidt vijandschap en</text><text x="68" y="476" class="body">opzet van een onverwacht ongeval.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij onopzettelijk doden</text><text x="68" y="625" class="body">De gemeenschap laat hem terugkeren naar</text><text x="68" y="668" class="body">de vrijstad.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De verblijfsgrens</text><text x="68" y="817" class="body">Blijven tot de dood van de</text><text x="68" y="860" class="body">hogepriester; dan terug naar de eigen</text><text x="68" y="903" class="body">grond.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Getuigen en losgeld</text><text x="68" y="1052" class="body">Eén getuige volstaat niet voor de</text><text x="68" y="1095" class="body">doodstraf; geen afkoop van de genoemde</text><text x="68" y="1138" class="body">straffen of verblijfsduur.</text><text x="46" y="1231" class="note">Een leeswijzer bij de historische</text><text x="46" y="1267" class="note">rechtsregeling, zonder terechtstellingen af te</text><text x="46" y="1303" class="note">beelden.</text></svg>