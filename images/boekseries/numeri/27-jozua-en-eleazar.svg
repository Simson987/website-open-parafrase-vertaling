<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Jozua, Mozes en Eleazar</title><desc id="desc">De vraag, aanwijzing, handoplegging en de verschillende taken van Jozua en Eleazar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jozua, Mozes en Eleazar</text><text x="44" y="113" class="ref">Numeri 27:15–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag van Mozes</text><text x="68" y="241" class="body">Een leider die het volk voorgaat, zodat</text><text x="68" y="284" class="body">het niet als schapen zonder herder is.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De aangewezene</text><text x="68" y="433" class="body">Jozua, zoon van Nun, een man in wie de</text><text x="68" y="476" class="body">Geest is.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De aanstelling</text><text x="68" y="625" class="body">Voor Eleazar en de gemeenschap; Mozes</text><text x="68" y="668" class="body">legt zijn handen op Jozua en geeft hem</text><text x="68" y="711" class="body">zijn opdracht.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het raadplegen</text><text x="68" y="860" class="body">Eleazar zal de HEERE voor hem</text><text x="68" y="903" class="body">raadplegen met de Urim.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Leiden van de gemeenschap</text><text x="68" y="1052" class="body">Op het genoemde bevel trekken zij uit</text><text x="68" y="1095" class="body">en komen zij terug.</text><text x="46" y="1188" class="note">De leiderstaak van Jozua en de priestertaak van</text><text x="46" y="1224" class="note">Eleazar worden onderscheiden.</text></svg>