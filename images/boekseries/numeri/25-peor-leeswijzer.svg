<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De gebeurtenissen bij Peor</title><desc id="desc">Het verloop van het hoofdstuk, met de afzonderlijke vermelding van de plaag en het verbond.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gebeurtenissen bij Peor</text><text x="44" y="113" class="ref">Numeri 25:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In Sittim</text><text x="68" y="241" class="body">Het volk sluit zich via de genoemde</text><text x="68" y="284" class="body">maaltijden en afgoderij aan bij</text><text x="68" y="327" class="body">Baäl-Peor.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De gemeenschap</text><text x="68" y="476" class="body">Zij huilt bij de ingang van de</text><text x="68" y="519" class="body">ontmoetingstent.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De crisis</text><text x="68" y="668" class="body">De tekst beschrijft Pinehas’ dodelijke</text><text x="68" y="711" class="body">optreden en het stoppen van de plaag.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De genoemde omvang</text><text x="68" y="860" class="body">24.000 mensen sterven aan de plaag.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het vervolg</text><text x="68" y="1009" class="body">Verbond met Pinehas en de opdracht over</text><text x="68" y="1052" class="body">Midian.</text><text x="46" y="1145" class="note">Een leeswijzer bij de tekst, zonder seksuele</text><text x="46" y="1181" class="note">scènes, terechtstellingen of slachtoffers af te</text><text x="46" y="1217" class="note">beelden.</text></svg>