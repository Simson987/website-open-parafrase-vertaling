<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De staven en het teken</title><desc id="desc">De volgorde van verzamelen, neerleggen, bloeien, teruggeven en bewaren van de staven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De staven en het teken</text><text x="44" y="113" class="ref">Numeri 17:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twaalf staven</text><text x="68" y="241" class="body">Van de stamleiders; Aärons naam op de</text><text x="68" y="284" class="body">staf van Levi.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">In de ontmoetingstent</text><text x="68" y="433" class="body">Mozes legt ze voor de ark van de</text><text x="68" y="476" class="body">getuigenis.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De volgende dag</text><text x="68" y="625" class="body">Aärons staf heeft knoppen, bloesems en</text><text x="68" y="668" class="body">rijpe amandelen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Teruggeven en bewaren</text><text x="68" y="817" class="body">Iedere leider krijgt zijn staf terug;</text><text x="68" y="860" class="body">Aärons staf blijft als teken bewaard.</text><text x="46" y="953" class="note">De drie stadia aan Aärons staf worden</text><text x="46" y="989" class="note">afzonderlijk genoemd.</text></svg>