<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">De derde en de zevende dag</title><desc id="desc">De reinigingshandelingen op dag drie en zeven en het rein worden in de avond.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De derde en de zevende dag</text><text x="44" y="113" class="ref">Numeri 19:11–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Na aanraking van een dode</text><text x="68" y="241" class="body">Zeven dagen onrein; de tekst noemt ook</text><text x="68" y="284" class="body">tent, bot en graf.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De derde dag</text><text x="68" y="433" class="body">Een reine persoon sprenkelt het</text><text x="68" y="476" class="body">voorgeschreven reinigingswater.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De zevende dag</text><text x="68" y="625" class="body">Opnieuw besprenkelen; kleding wassen en</text><text x="68" y="668" class="body">zich baden.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">In de avond</text><text x="68" y="817" class="body">Dan is de gereinigde persoon rein.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het water</text><text x="68" y="966" class="body">As in een vat met stromend water; hysop</text><text x="68" y="1009" class="body">voor het sprenkelen.</text><text x="46" y="1102" class="note">Dit is de rituele tijdlijn uit de tekst, met de</text><text x="46" y="1138" class="note">afzonderlijke handelingen.</text></svg>