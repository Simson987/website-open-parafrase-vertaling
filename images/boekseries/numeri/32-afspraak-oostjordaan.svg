<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De afspraak over Gilead</title><desc id="desc">Verzoek, belofte, voorwaarde en toewijzing van het erfdeel ten oosten van de Jordaan.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De afspraak over Gilead</text><text x="44" y="113" class="ref">Numeri 32:16–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verzoek</text><text x="68" y="241" class="body">Ruben en Gad vragen het veerijke land</text><text x="68" y="284" class="body">ten oosten van de Jordaan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wat daar blijft</text><text x="68" y="433" class="body">Gezinnen en vee blijven in steden en</text><text x="68" y="476" class="body">schaapskooien.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat zij beloven</text><text x="68" y="625" class="body">Gewapend meegaan tot de andere</text><text x="68" y="668" class="body">Israëlieten hun erfdeel bezitten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De voorwaarde</text><text x="68" y="817" class="body">Bij nakomen krijgen zij Gilead; zonder</text><text x="68" y="860" class="body">meegaan bezit in Kanaän.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De toewijzing</text><text x="68" y="1009" class="body">Ruben, Gad en de halve stam Manasse</text><text x="68" y="1052" class="body">krijgen land van Sihon en Og.</text><text x="46" y="1145" class="note">Het beloofde meegaan wordt niet verward met een</text><text x="46" y="1181" class="note">vrijstelling van gezamenlijke</text><text x="46" y="1217" class="note">verantwoordelijkheid.</text></svg>