<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Het verloop van de opstand</title><desc id="desc">De opeenvolgende gebeurtenissen rond de opstand, de altaarplaten en Aärons optreden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het verloop van de opstand</text><text x="44" y="113" class="ref">Numeri 16:18–50</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij de tent</text><text x="68" y="241" class="body">Wierookvaten worden gebracht en de</text><text x="68" y="284" class="body">gemeenschap verzamelt zich.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Afstand nemen</text><text x="68" y="433" class="body">Het volk moet weg van de genoemde</text><text x="68" y="476" class="body">tenten; daarna volgt het oordeel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De koperen wierookvaten</text><text x="68" y="625" class="body">Eleazar neemt ze; er worden platen voor</text><text x="68" y="668" class="body">het altaar van geslagen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De volgende dag</text><text x="68" y="817" class="body">Nieuw gemopper en een plaag.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Aärons voorbede</text><text x="68" y="966" class="body">Hij brengt reukwerk en verzoening; de</text><text x="68" y="1009" class="body">plaag stopt.</text><text x="46" y="1102" class="note">Aarde, vuur en plaag zijn verschillende</text><text x="46" y="1138" class="note">momenten; geen slachtoffers worden afgebeeld.</text></svg>