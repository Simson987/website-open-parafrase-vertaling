<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Boden, weg en ezelin</title><desc id="desc">De twee delegaties en de drie reacties van de ezelin, gevolgd door Bileams ontmoeting met Balak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boden, weg en ezelin</text><text x="44" y="113" class="ref">Numeri 22:7–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste boden</text><text x="68" y="241" class="body">Bileam mag niet meegaan en niet</text><text x="68" y="284" class="body">vervloeken: het volk is gezegend.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede boden</text><text x="68" y="433" class="body">Meer en voornamere vorsten; later</text><text x="68" y="476" class="body">toestemming met de grens: alleen Gods</text><text x="68" y="519" class="body">woorden spreken.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Drie keer tegengehouden</text><text x="68" y="668" class="body">De ezelin wijkt uit naar een veld,</text><text x="68" y="711" class="body">drukt tegen een muur en gaat liggen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Mond en ogen geopend</text><text x="68" y="860" class="body">Eerst spreekt de ezelin; daarna ziet</text><text x="68" y="903" class="body">Bileam de engel.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Bij Balak</text><text x="68" y="1052" class="body">Bileam herhaalt dat hij alleen kan</text><text x="68" y="1095" class="body">spreken wat God hem ingeeft.</text><text x="46" y="1188" class="note">De verschillende momenten van zien en spreken</text><text x="46" y="1224" class="note">worden niet samengevoegd.</text></svg>