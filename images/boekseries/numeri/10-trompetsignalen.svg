<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">De trompetsignalen</title><desc id="desc">De verschillende signalen van één of twee zilveren trompetten en wie ze blaast.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De trompetsignalen</text><text x="44" y="113" class="ref">Numeri 10:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beide trompetten</text><text x="68" y="241" class="body">De hele gemeenschap komt bijeen bij de</text><text x="68" y="284" class="body">ingang van de tent.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eén trompet</text><text x="68" y="433" class="body">De leiders komen bijeen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Alarmsignalen</text><text x="68" y="582" class="body">Eerste: oostkampen vertrekken. Tweede:</text><text x="68" y="625" class="body">zuidkampen vertrekken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Ook bij andere gelegenheden</text><text x="68" y="774" class="body">Oorlog, feestdagen, vaste feesten en</text><text x="68" y="817" class="body">het begin van de maand.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Wie blaast</text><text x="68" y="966" class="body">De priesters, Aärons zonen.</text><text x="46" y="1059" class="note">Bijeenroepen en het alarmsignaal voor opbreken</text><text x="46" y="1095" class="note">zijn onderscheiden.</text></svg>