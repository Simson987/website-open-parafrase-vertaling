<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1062" viewBox="0 0 840 1062" role="img" aria-labelledby="title desc"><title id="title">Altaren en drie plaatsen</title><desc id="desc">De herhaalde zeven altaren op de verschillende plaatsen en de eerste twee spreuken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1062" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Altaren en drie plaatsen</text><text x="44" y="113" class="ref">Numeri 23:1–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste plaats</text><text x="68" y="241" class="body">Zeven altaren; op elk één stier en één</text><text x="68" y="284" class="body">ram. Bileam gaat een kale heuvel op.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste spreuk</text><text x="68" y="433" class="body">Wie God niet vervloekt, kan hij niet</text><text x="68" y="476" class="body">vervloeken; Balak protesteert.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zofim op de Pisga</text><text x="68" y="625" class="body">Opnieuw zeven altaren, telkens een</text><text x="68" y="668" class="body">stier en een ram; de tweede spreuk</text><text x="68" y="711" class="body">zegent opnieuw.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Peor</text><text x="68" y="860" class="body">Balak neemt Bileam naar een derde plek;</text><text x="68" y="903" class="body">weer zeven altaren, stieren en rammen.</text><text x="46" y="996" class="note">De derde zegenspreuk volgt in hoofdstuk 24.</text></svg>