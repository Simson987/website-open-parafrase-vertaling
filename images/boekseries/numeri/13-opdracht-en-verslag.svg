<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Opdracht en verslag</title><desc id="desc">De onderzoeksvragen, plaatsen, duur, vruchten en verschillende conclusies van het verslag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opdracht en verslag</text><text x="44" y="113" class="ref">Numeri 13:17–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat onderzoeken?</text><text x="68" y="241" class="body">Bevolking, steden, bodem, bomen en</text><text x="68" y="284" class="body">vruchten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waar en hoe lang?</text><text x="68" y="433" class="body">Van Zin tot Rehob; Hebron en Eskol</text><text x="68" y="476" class="body">worden genoemd; veertig dagen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat mee terug?</text><text x="68" y="625" class="body">Druiventros, granaatappels en vijgen.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Twee beoordelingen</text><text x="68" y="774" class="body">Kaleb roept op tot optrekken; de andere</text><text x="68" y="817" class="body">mannen benadrukken de sterke</text><text x="68" y="860" class="body">tegenstanders.</text><text x="46" y="953" class="note">Uitspraken van de verkenners worden als hun</text><text x="46" y="989" class="note">verslag weergegeven.</text></svg>