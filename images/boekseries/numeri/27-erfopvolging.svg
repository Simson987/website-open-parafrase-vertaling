<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De genoemde erfopvolging</title><desc id="desc">De opeenvolgende erfgenamen wanneer een gestorven man geen zoon nalaat.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde erfopvolging</text><text x="44" y="113" class="ref">Numeri 27:8–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geen zoon</text><text x="68" y="241" class="body">Het erfdeel gaat naar de dochter.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Geen dochter</text><text x="68" y="390" class="body">Het erfdeel gaat naar zijn broers.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Geen broers</text><text x="68" y="539" class="body">Het erfdeel gaat naar de broers van</text><text x="68" y="582" class="body">zijn vader.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Ook die ontbreken</text><text x="68" y="731" class="body">Het erfdeel gaat naar de naaste</text><text x="68" y="774" class="body">bloedverwant in zijn familie.</text><text x="46" y="867" class="note">Een volgordeschema van de wettelijke regeling in</text><text x="46" y="903" class="note">deze tekst.</text></svg>