<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">De groepen op reis</title><desc id="desc">De vertrekdatum en de precieze volgorde van stammen en draaggroepen in Numeri 10.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De groepen op reis</text><text x="44" y="113" class="ref">Numeri 10:11–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Datum en vertrek</text><text x="68" y="241" class="body">Jaar twee, tweede maand, dag twintig;</text><text x="68" y="284" class="body">van Sinaï richting Paran.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Juda, dan het tentmateriaal</text><text x="68" y="433" class="body">Juda met Issaschar en Zebulon; daarna</text><text x="68" y="476" class="body">Gerson en Merari met de tabernakel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ruben, dan de heilige voorwerpen</text><text x="68" y="625" class="body">Ruben met Simeon en Gad; daarna de</text><text x="68" y="668" class="body">Kehathieten.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Efraïm</text><text x="68" y="817" class="body">Efraïm, Manasse en Benjamin.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De achterhoede</text><text x="68" y="966" class="body">Dan, Aser en Nafthali sluiten de</text><text x="68" y="1009" class="body">kampgroepen af.</text><text x="46" y="1102" class="note">De ark die voor hen uitgaat wordt in verzen</text><text x="46" y="1138" class="note">33–36 afzonderlijk beschreven.</text></svg>