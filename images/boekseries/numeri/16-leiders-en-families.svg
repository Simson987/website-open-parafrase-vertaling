<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">De genoemde leiders</title><desc id="desc">De afstamming van de genoemde leiders en de groep van 250 vertegenwoordigers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde leiders</text><text x="44" y="113" class="ref">Numeri 16:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Korach</text><text x="68" y="241" class="body">Zoon van Jizhar, zoon van Kehath, zoon</text><text x="68" y="284" class="body">van Levi.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dathan en Abiram</text><text x="68" y="433" class="body">Zonen van Eliab, uit de stam Ruben.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">On</text><text x="68" y="582" class="body">Zoon van Peleth, uit de stam Ruben; in</text><text x="68" y="625" class="body">vers 1 genoemd.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De vertegenwoordigers</text><text x="68" y="774" class="body">Tweehonderdvijftig bekende leiders</text><text x="68" y="817" class="body">komen in verzet.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Waarover het gaat</text><text x="68" y="966" class="body">Mozes onderscheidt de Levietendienst</text><text x="68" y="1009" class="body">van het begeerde priesterschap.</text><text x="46" y="1102" class="note">On wordt niet bij latere gebeurtenissen ingevuld</text><text x="46" y="1138" class="note">waar zijn naam niet meer wordt genoemd.</text></svg>