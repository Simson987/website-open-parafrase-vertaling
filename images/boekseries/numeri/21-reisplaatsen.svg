<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De genoemde reisplaatsen</title><desc id="desc">De reisplaatsen en hun volgorde, met Beer en het lied bij de put.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde reisplaatsen</text><text x="44" y="113" class="ref">Numeri 21:4–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rond Edom</text><text x="68" y="241" class="body">Vanaf Hor richting Schelfzee, om Edom</text><text x="68" y="284" class="body">heen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De kampen</text><text x="68" y="433" class="body">Oboth → Ije-Abarim → dal van de Zered →</text><text x="68" y="476" class="body">overkant van de Arnon.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De put</text><text x="68" y="625" class="body">Beer: water en het lied bij de put.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Daarna verder</text><text x="68" y="774" class="body">Mattana → Nahaliel → Bamoth → het dal</text><text x="68" y="817" class="body">bij de top van de Pisga.</text><text x="46" y="910" class="note">Een volgordeschema uit de tekst, zonder</text><text x="46" y="946" class="note">onbevestigde kaartcoördinaten.</text></svg>