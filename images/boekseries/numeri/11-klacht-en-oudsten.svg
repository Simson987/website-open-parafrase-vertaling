<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Klacht, hulp en gevolgen</title><desc id="desc">Het verloop van de klachten, Mozes’ hulpvraag, de oudsten, Eldad en Medad, kwartels en vertrek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Klacht, hulp en gevolgen</text><text x="44" y="113" class="ref">Numeri 11:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tabera</text><text x="68" y="241" class="body">Vuur aan de rand van het kamp; Mozes</text><text x="68" y="284" class="body">bidt en het vuur dooft.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De last van Mozes</text><text x="68" y="433" class="body">Zeventig oudsten worden aangewezen om</text><text x="68" y="476" class="body">de last mee te dragen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Eldad en Medad</text><text x="68" y="625" class="body">Zij staan op de lijst, blijven in het</text><text x="68" y="668" class="body">kamp en profeteren daar.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De kwartels</text><text x="68" y="817" class="body">De wind brengt kwartels; daarna noemt</text><text x="68" y="860" class="body">de tekst een zware plaag.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Plaatsen</text><text x="68" y="1009" class="body">Van Kibroth-Taava naar Hazeroth.</text><text x="46" y="1102" class="note">De verschillende gebeurtenissen blijven in hun</text><text x="46" y="1138" class="note">eigen volgorde staan.</text></svg>