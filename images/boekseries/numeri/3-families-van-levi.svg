<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Levi en zijn families</title><desc id="desc">De drie zonen van Levi, hun zonen, kampzijden en taken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levi en zijn families</text><text x="44" y="113" class="ref">Numeri 3:17–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gerson</text><text x="68" y="241" class="body">Zonen: Libni en Simeï. Westkant;</text><text x="68" y="284" class="body">tentkleden, gordijnen en touwen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kahath</text><text x="68" y="433" class="body">Zonen: Amram, Izhar, Hebron en Uzziël.</text><text x="68" y="476" class="body">Zuidkant; heilige voorwerpen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Merari</text><text x="68" y="625" class="body">Zonen: Maheli en Musi. Noordkant;</text><text x="68" y="668" class="body">planken, balken, palen en voetstukken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Aan de oostkant</text><text x="68" y="817" class="body">Mozes, Aäron en zijn zonen bij de</text><text x="68" y="860" class="body">ingang van de ontmoetingstent.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Toezicht</text><text x="68" y="1009" class="body">Eleazar, zoon van Aäron, houdt toezicht</text><text x="68" y="1052" class="body">op de dienst aan het heiligdom.</text><text x="46" y="1145" class="note">De namen volgen Numeri 3; andere hoofdstukken</text><text x="46" y="1181" class="note">gebruiken ook de schrijfwijze Kehath.</text></svg>