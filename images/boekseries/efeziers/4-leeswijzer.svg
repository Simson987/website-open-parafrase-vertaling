<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Eenheid, groei en een nieuw leven</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eenheid, groei en een nieuw leven</text><text x="44" y="113" class="ref">Efeziërs 4:1–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–6 · Bewaar de eenheid</text><text x="68" y="241" class="body">Nederigheid, geduld en de zeven keer</text><text x="68" y="284" class="body">genoemde eenheid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">7–16 · Gaven voor opbouw</text><text x="68" y="433" class="body">Toerusting, volwassenheid en waarheid</text><text x="68" y="476" class="body">in liefde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">17–24 · Oud en nieuw</text><text x="68" y="625" class="body">Vernieuwd denken en de nieuwe mens</text><text x="68" y="668" class="body">aantrekken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">25–32 · Concreet gedrag</text><text x="68" y="817" class="body">Waarheid, arbeid, goede woorden en</text><text x="68" y="860" class="body">vergeving.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>