<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Het nieuwe leven wordt concreet</title><desc id="desc">Het nieuwe leven wordt concreet met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het nieuwe leven wordt concreet</text><text x="44" y="113" class="ref">Efeziërs 4:25–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Leugen en boosheid</text><text x="68" y="241" class="body">Spreek waarheid; zondig niet in</text><text x="68" y="284" class="body">boosheid en geef de duivel geen kans.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Diefstal en arbeid</text><text x="68" y="433" class="body">Niet meer stelen; goed werken om te</text><text x="68" y="476" class="body">kunnen delen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De woorden</text><text x="68" y="625" class="body">Spreek wat opbouwt en de hoorders</text><text x="68" y="668" class="body">goeddoet.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De omgang</text><text x="68" y="817" class="body">Bitterheid wegdoen; goed, barmhartig en</text><text x="68" y="860" class="body">vergevend zijn.</text><text x="46" y="953" class="note">De voorbeelden volgen op de oproep de oude mens</text><text x="46" y="989" class="note">af te leggen en de nieuwe aan te trekken.</text></svg>