<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Genade en goede werken</title><desc id="desc">Genade en goede werken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Genade en goede werken</text><text x="44" y="113" class="ref">Efeziërs 2:8–10</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De redding</text><text x="68" y="241" class="body">Uit genade, door het geloof.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De oorsprong</text><text x="68" y="390" class="body">Niet uit jezelf, maar een gave van God.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">De uitsluiting</text><text x="68" y="539" class="body">Niet uit werken, zodat niemand kan</text><text x="68" y="582" class="body">opscheppen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Het nieuwe leven</text><text x="68" y="731" class="body">Gods maaksel, geschapen om in goede</text><text x="68" y="774" class="body">werken te leven.</text><text x="46" y="867" class="note">Redding uit genade en de plaats van goede werken</text><text x="46" y="903" class="note">staan samen in deze verzen.</text></svg>