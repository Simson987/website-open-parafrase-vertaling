<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Volhardend bidden en bemoedigen</title><desc id="desc">Volhardend bidden en bemoedigen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volhardend bidden en bemoedigen</text><text x="44" y="113" class="ref">Efeziërs 6:18–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voor alle heiligen</text><text x="68" y="241" class="body">Altijd in de Geest bidden en daarin</text><text x="68" y="284" class="body">blijven waken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Voor Paulus</text><text x="68" y="433" class="body">Om woorden en vrijmoedigheid bij het</text><text x="68" y="476" class="body">bekendmaken van het evangelie.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn situatie</text><text x="68" y="625" class="body">Hij is een gezant in ketenen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Tychikus’ opdracht</text><text x="68" y="774" class="body">Vertellen hoe het gaat en de harten</text><text x="68" y="817" class="body">bemoedigen.</text><text x="46" y="910" class="note">Het gebed en het persoonlijke bericht sluiten op</text><text x="46" y="946" class="note">elkaar aan in de slotverzen.</text></svg>