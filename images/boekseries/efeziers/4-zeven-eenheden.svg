<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1262" viewBox="0 0 840 1262"><title>Zeven keer één</title><rect width="840" height="1262" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Zeven keer één</text><text x="42" y="105" font-size="25">Efeziërs 4:4–6</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Bewaar de eenheid van de Geest</text><path d="M470 215 V235 H75 V1073.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 311.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Eén lichaam</text><text x="175" y="337" font-size="29">De gemeenschap in het betoog.</text><path d="M75 438.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="387" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="424" font-size="31" font-weight="700">Eén Geest</text><text x="175" y="464" font-size="29">Dezelfde Geest.</text><path d="M75 565.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="514" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="551" font-size="31" font-weight="700">Eén hoop</text><text x="175" y="591" font-size="29">De hoop van de roeping.</text><path d="M75 692.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="641" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="678" font-size="31" font-weight="700">Eén Heere</text><text x="175" y="718" font-size="29">Dezelfde Heere.</text><path d="M75 819.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="768" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="805" font-size="31" font-weight="700">Eén geloof</text><text x="175" y="845" font-size="29">Hetzelfde geloof.</text><path d="M75 946.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="895" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="932" font-size="31" font-weight="700">Eén doop</text><text x="175" y="972" font-size="29">Dezelfde doop.</text><path d="M75 1073.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="1022" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="1059" font-size="31" font-weight="700">Eén God en Vader</text><text x="175" y="1099" font-size="29">Boven allen, door allen en in allen.</text><text x="42" y="1171" font-size="26">De zeven keer genoemde eenheid volgt vers 4–6;</text><text x="42" y="1205" font-size="26">vers 3 verbindt haar met de vrede.</text></g></svg>