<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De delen van de wapenrusting</title><desc id="desc">De delen van de wapenrusting met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De delen van de wapenrusting</text><text x="44" y="113" class="ref">Efeziërs 6:14–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gordel en borstplaat</text><text x="68" y="241" class="body">Waarheid en gerechtigheid.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Schoeisel</text><text x="68" y="390" class="body">De bereidheid van het evangelie van de</text><text x="68" y="433" class="body">vrede.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Schild</text><text x="68" y="582" class="body">Het geloof, waarmee de brandende pijlen</text><text x="68" y="625" class="body">worden gedoofd.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Helm en zwaard</text><text x="68" y="774" class="body">Redding en de Geest; het zwaard is het</text><text x="68" y="817" class="body">woord van God.</text><text x="46" y="910" class="note">De zes onderdelen worden aan hun betekenis</text><text x="46" y="946" class="note">gekoppeld; de strijd is volgens vers 12 niet</text><text x="46" y="982" class="note">tegen vlees en bloed.</text></svg>