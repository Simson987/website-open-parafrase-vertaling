<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De onderlinge band in het betoog</title><desc id="desc">De onderlinge band in het betoog met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De onderlinge band in het betoog</text><text x="44" y="113" class="ref">Efeziërs 5:21–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De overgang · vers 21</text><text x="68" y="241" class="body">Onderschik je aan elkaar in ontzag voor</text><text x="68" y="284" class="body">God.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vrouwen · vers 22–24</text><text x="68" y="433" class="body">Paulus beschrijft onderschikking aan de</text><text x="68" y="476" class="body">eigen man.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Mannen · vers 25–30</text><text x="68" y="625" class="body">De eigen vrouw liefhebben en verzorgen</text><text x="68" y="668" class="body">als het eigen lichaam.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vergelijking · vers 31–33</text><text x="68" y="817" class="body">De eenheid van het huwelijk wordt</text><text x="68" y="860" class="body">betrokken op Christus en Zijn</text><text x="68" y="903" class="body">gemeenschap.</text><text x="46" y="996" class="note">De aangesproken groepen en de vergelijking</text><text x="46" y="1032" class="note">worden in de volgorde van de brief weergegeven.</text></svg>