<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Wat het verlichte hart mag weten</title><desc id="desc">Wat het verlichte hart mag weten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat het verlichte hart mag weten</text><text x="44" y="113" class="ref">Efeziërs 1:17–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De hoop</text><text x="68" y="241" class="body">Van Zijn roeping.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De erfenis</text><text x="68" y="390" class="body">Hoe rijk en heerlijk zij onder de</text><text x="68" y="433" class="body">heiligen is.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De kracht</text><text x="68" y="582" class="body">Hoe geweldig groot Zijn kracht is voor</text><text x="68" y="625" class="body">wie geloven.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De genoemde werking</text><text x="68" y="774" class="body">God gebruikte die kracht bij Christus’</text><text x="68" y="817" class="body">opwekking.</text><text x="46" y="910" class="note">De drie gebedspunten volgen vers 18–19 en worden</text><text x="46" y="946" class="note">verbonden met vers 20.</text></svg>