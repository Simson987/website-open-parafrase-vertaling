<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De genoemde geestelijke zegen</title><desc id="desc">De genoemde geestelijke zegen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde geestelijke zegen</text><text x="44" y="113" class="ref">Efeziërs 1:3–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uitgekozen en aangenomen · vers 4–6</text><text x="68" y="241" class="body">Heilig in liefde en tot kinderen</text><text x="68" y="284" class="body">bestemd door Jezus Christus.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verlossing en bekendmaking · vers 7–10</text><text x="68" y="433" class="body">Vergeving, rijkdom van genade en het</text><text x="68" y="476" class="body">geheim van Zijn wil.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Erfenis · vers 11–12</text><text x="68" y="625" class="body">Erfgenamen tot lof van Zijn</text><text x="68" y="668" class="body">heerlijkheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Verzegeling · vers 13–14</text><text x="68" y="817" class="body">De beloofde Geest als onderpand van de</text><text x="68" y="860" class="body">erfenis.</text><text x="46" y="953" class="note">De zegeningen worden door de herhaalde woorden</text><text x="46" y="989" class="note">in Hem met Christus verbonden.</text></svg>