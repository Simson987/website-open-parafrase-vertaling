<svg xmlns="http://www.w3.org/2000/svg" width="840" height="976" viewBox="0 0 840 976" role="img" aria-labelledby="title desc"><title id="title">De eisen aan een opziener</title><desc id="desc">De eisen aan een opziener met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="976" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eisen aan een opziener</text><text x="44" y="113" class="ref">1 Timotheüs 3:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Karakter · vers 2–3</text><text x="68" y="241" class="body">Onberispelijk, beheerst, gastvrij, mild</text><text x="68" y="284" class="body">en vreedzaam; niet geldzuchtig.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onderwijs · vers 2</text><text x="68" y="433" class="body">In staat om te onderwijzen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Huis · vers 2, 4–5</text><text x="68" y="582" class="body">Man van één vrouw; het eigen huis goed</text><text x="68" y="625" class="body">leiden.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Ervaring en naam · vers 6–7</text><text x="68" y="774" class="body">Geen pasbekeerde; ook buiten de</text><text x="68" y="817" class="body">gemeente een goede naam.</text><text x="46" y="910" class="note">Deze groepen ordenen de eisen uit de tekst.</text></svg>