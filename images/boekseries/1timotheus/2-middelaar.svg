<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Eén God en één Middelaar</title><desc id="desc">Eén God en één Middelaar met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eén God en één Middelaar</text><text x="44" y="113" class="ref">1 Timotheüs 2:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voor wie bidden?</text><text x="68" y="241" class="body">Voor alle mensen, ook koningen en</text><text x="68" y="284" class="body">gezagsdragers.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wat wil God?</text><text x="68" y="433" class="body">Dat alle mensen gered worden en de</text><text x="68" y="476" class="body">waarheid kennen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wie is de Middelaar?</text><text x="68" y="625" class="body">De Mens Christus Jezus; Hij gaf Zich</text><text x="68" y="668" class="body">als losprijs voor allen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wat is Paulus’ opdracht?</text><text x="68" y="817" class="body">Verkondiger, apostel en leraar van de</text><text x="68" y="860" class="body">volken.</text><text x="46" y="953" class="note">Het gebed, de redding en de verkondiging zijn in</text><text x="46" y="989" class="note">het betoog met elkaar verbonden.</text></svg>