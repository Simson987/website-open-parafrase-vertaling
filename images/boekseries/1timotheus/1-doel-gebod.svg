<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Het doel is liefde</title><desc id="desc">Het doel is liefde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het doel is liefde</text><text x="44" y="113" class="ref">1 Timotheüs 1:3–7</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zuiver hart</text><text x="68" y="241" class="body">Liefde komt uit een zuiver hart.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Goed geweten</text><text x="68" y="390" class="body">Liefde komt uit een goed geweten.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Oprecht geloof</text><text x="68" y="539" class="body">Liefde komt uit een oprecht geloof.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">De afwijking</text><text x="68" y="688" class="body">Andere leer en leeg gepraat voeren van</text><text x="68" y="731" class="body">dit doel af.</text><text x="46" y="824" class="note">De drie bronnen van liefde staan in vers 5 naast</text><text x="46" y="860" class="note">elkaar.</text></svg>