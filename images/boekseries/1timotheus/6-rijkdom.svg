<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Tevredenheid en rijkdom</title><desc id="desc">Tevredenheid en rijkdom met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tevredenheid en rijkdom</text><text x="44" y="113" class="ref">1 Timotheüs 6:6–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ware winst · vers 6–8</text><text x="68" y="241" class="body">Vroomheid met tevredenheid; voedsel en</text><text x="68" y="284" class="body">kleding.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het gevaar · vers 9–10</text><text x="68" y="433" class="body">Rijk willen worden en de liefde voor</text><text x="68" y="476" class="body">geld.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De jacht · vers 11–12</text><text x="68" y="625" class="body">Gerechtigheid, vroomheid, geloof,</text><text x="68" y="668" class="body">liefde, volharding en zachtmoedigheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De opdracht · vers 17–19</text><text x="68" y="817" class="body">God vertrouwen; goed doen, vrijgevig</text><text x="68" y="860" class="body">zijn en delen.</text><text x="46" y="953" class="note">De brief onderscheidt geldliefde van het gebruik</text><text x="46" y="989" class="note">van rijkdom om goed te doen.</text></svg>