<svg xmlns="http://www.w3.org/2000/svg" width="840" height="976" viewBox="0 0 840 976" role="img" aria-labelledby="title desc"><title id="title">Eer en zorgvuldigheid</title><desc id="desc">Eer en zorgvuldigheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="976" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eer en zorgvuldigheid</text><text x="44" y="113" class="ref">1 Timotheüs 5:17–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eer · vers 17–18</text><text x="68" y="241" class="body">Goede leiding en inzet voor woord en</text><text x="68" y="284" class="body">onderwijs waarderen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Getuigen · vers 19</text><text x="68" y="433" class="body">Een beschuldiging alleen op twee of</text><text x="68" y="476" class="body">drie getuigen aannemen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Onpartijdigheid · vers 20–21</text><text x="68" y="625" class="body">Zonde terechtwijzen en zonder voorkeur</text><text x="68" y="668" class="body">handelen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Handen opleggen · vers 22</text><text x="68" y="817" class="body">Niet overhaast; jezelf zuiver houden.</text><text x="46" y="910" class="note">Erkenning en verantwoording staan hier samen.</text></svg>