<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Hoe de zorg wordt verdeeld</title><desc id="desc">Hoe de zorg wordt verdeeld met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoe de zorg wordt verdeeld</text><text x="44" y="113" class="ref">1 Timotheüs 5:3–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De familie · vers 4, 8, 16</text><text x="68" y="241" class="body">Kinderen, kleinkinderen en gelovige</text><text x="68" y="284" class="body">verwanten helpen hun eigen mensen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De alleenstaande · vers 5</text><text x="68" y="433" class="body">Hoopt op God en blijft bidden.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De lijst · vers 9–10</text><text x="68" y="582" class="body">Minstens zestig jaar; vrouw van één</text><text x="68" y="625" class="body">man; bekend om goede werken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De gemeenschap · vers 16</text><text x="68" y="774" class="body">Kan zo zorgen voor wie echt weduwe</text><text x="68" y="817" class="body">zijn.</text><text x="46" y="910" class="note">Deze indeling bewaart zowel</text><text x="46" y="946" class="note">familieverantwoordelijkheid als gemeentelijke</text><text x="46" y="982" class="note">zorg.</text></svg>