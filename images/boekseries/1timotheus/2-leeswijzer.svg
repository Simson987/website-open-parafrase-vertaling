<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Gebed en gepaste levenswandel</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed en gepaste levenswandel</text><text x="44" y="113" class="ref">1 Timotheüs 2:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–7 · Gebed voor allen</text><text x="68" y="241" class="body">Ook voor gezagsdragers; één God en één</text><text x="68" y="284" class="body">Middelaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">8–10 · Handen en goede werken</text><text x="68" y="433" class="body">Bidden zonder ruzie; bescheidenheid en</text><text x="68" y="476" class="body">goeddoen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">11–15 · Leren en de oorsprong</text><text x="68" y="625" class="body">Paulus’ voorschrift en zijn verwijzing</text><text x="68" y="668" class="body">naar Adam en Eva.</text><text x="46" y="761" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="797" class="note">de plaatselijke versindeling.</text></svg>