<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wie doet wat bij de onrust?</title><desc id="desc">Wie doet wat bij de onrust? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie doet wat bij de onrust?</text><text x="44" y="113" class="ref">Handelingen 19:24–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Demetrius</text><text x="68" y="241" class="body">Hij mobiliseert de vaklieden uit vrees</text><text x="68" y="284" class="body">voor verlies.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gajus en Aristarchus</text><text x="68" y="433" class="body">De menigte neemt deze reisgenoten mee</text><text x="68" y="476" class="body">naar het theater.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Paulus</text><text x="68" y="625" class="body">Hij wil gaan, maar leerlingen en</text><text x="68" y="668" class="body">vrienden raden het af.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Stadssecretaris</text><text x="68" y="817" class="body">Hij maant tot rust en verwijst naar</text><text x="68" y="860" class="body">wettige rechtswegen.</text><text x="46" y="953" class="note">Paulus spreekt in dit hoofdstuk niet zelf in het</text><text x="46" y="989" class="note">theater.</text></svg>