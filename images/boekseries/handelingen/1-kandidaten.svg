<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Wie kan Judas’ plaats innemen?</title><desc id="desc">Wie kan Judas’ plaats innemen? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie kan Judas’ plaats innemen?</text><text x="44" y="113" class="ref">Handelingen 1:21–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorwaarde</text><text x="68" y="241" class="body">Meegetrokken van Johannes’ doop tot de</text><text x="68" y="284" class="body">hemelvaart.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Opdracht</text><text x="68" y="433" class="body">Met de apostelen getuige van de</text><text x="68" y="476" class="body">opstanding zijn.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee voorgestelden</text><text x="68" y="625" class="body">Jozef Barsabbas, ook Justus, en</text><text x="68" y="668" class="body">Matthias.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Beslissing</text><text x="68" y="817" class="body">Na gebed valt het lot op Matthias.</text><text x="46" y="910" class="note">De namen Jozef, Barsabbas en Justus horen bij</text><text x="46" y="946" class="note">één kandidaat.</text></svg>