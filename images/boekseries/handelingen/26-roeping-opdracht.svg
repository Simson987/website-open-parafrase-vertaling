<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De opdracht in Paulus’ verhaal</title><desc id="desc">De opdracht in Paulus’ verhaal met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De opdracht in Paulus’ verhaal</text><text x="44" y="113" class="ref">Handelingen 26:16–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dienaar en getuige</text><text x="68" y="241" class="body">Van wat hij gezien heeft en nog zal</text><text x="68" y="284" class="body">zien.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gezonden</text><text x="68" y="433" class="body">Tot dit volk en tot de andere volken.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Doel</text><text x="68" y="582" class="body">Van duisternis naar licht, tot</text><text x="68" y="625" class="body">vergeving en erfdeel.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Zijn antwoord</text><text x="68" y="774" class="body">Bekering verkondigen en passende daden</text><text x="68" y="817" class="body">oproepen.</text><text x="46" y="910" class="note">De roeping wordt in zijn verdediging als</text><text x="46" y="946" class="note">terugblik verteld.</text></svg>