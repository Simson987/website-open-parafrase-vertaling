<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Waarom gaat de zaak verder?</title><desc id="desc">Waarom gaat de zaak verder? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom gaat de zaak verder?</text><text x="44" y="113" class="ref">Handelingen 25:6–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Festus vraagt</text><text x="68" y="241" class="body">Wil Paulus in Jeruzalem geoordeeld</text><text x="68" y="284" class="body">worden?</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Paulus beroept zich</text><text x="68" y="433" class="body">Hij wil voor de rechterstoel van de</text><text x="68" y="476" class="body">keizer blijven.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Festus beslist</text><text x="68" y="625" class="body">Na overleg: naar de keizer.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Agrippa hoort hem later</text><text x="68" y="774" class="body">Festus zoekt zekere informatie voor de</text><text x="68" y="817" class="body">begeleidende brief.</text><text x="46" y="910" class="note">Het hoofdstuk vertelt nog geen aankomst bij de</text><text x="46" y="946" class="note">keizer.</text></svg>