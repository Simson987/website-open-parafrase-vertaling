<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Verkondigen en terugkeren</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verkondigen en terugkeren</text><text x="44" y="113" class="ref">Handelingen 14:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–7 · Ikonium</text><text x="68" y="241" class="body">Veel geloof, verdeeldheid en vlucht</text><text x="68" y="284" class="body">naar Lykaonië.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">8–18 · Lystre</text><text x="68" y="433" class="body">Genezing; de apostelen weigeren</text><text x="68" y="476" class="body">goddelijke eer.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">19–23 · Derbe en terug</text><text x="68" y="625" class="body">Paulus staat op; leerlingen versterkt;</text><text x="68" y="668" class="body">oudsten gekozen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">24–28 · Volbrachte reis</text><text x="68" y="817" class="body">Perge, Attalië en verslag in Antiochië.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>