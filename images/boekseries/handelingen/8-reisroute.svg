<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Filippus volgt de opdracht</title><desc id="desc">Filippus volgt de opdracht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Filippus volgt de opdracht</text><text x="44" y="113" class="ref">Handelingen 8:26–40</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Weg Jeruzalem–Gaza</text><text x="68" y="241" class="body">Een engel stuurt hem naar de verlaten</text><text x="68" y="284" class="body">weg.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij de wagen</text><text x="68" y="433" class="body">De Geest stuurt hem naderbij; hij legt</text><text x="68" y="476" class="body">Jesaja uit.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij het water</text><text x="68" y="625" class="body">Filippus doopt de gelovende hoveling.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Azote naar Cesarea</text><text x="68" y="774" class="body">Filippus verkondigt in de steden; de</text><text x="68" y="817" class="body">man reist blij.</text><text x="46" y="910" class="note">De route is tekstueel; de precieze doopplaats</text><text x="46" y="946" class="note">wordt niet vastgesteld.</text></svg>