<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Het samenleven van de gemeente</title><desc id="desc">Het samenleven van de gemeente met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het samenleven van de gemeente</text><text x="44" y="113" class="ref">Handelingen 2:42–47</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onderwijs</text><text x="68" y="241" class="body">Trouw aan het onderwijs van de</text><text x="68" y="284" class="body">apostelen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gemeenschap</text><text x="68" y="433" class="body">Bezittingen en opbrengst worden naar</text><text x="68" y="476" class="body">behoefte gedeeld.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Brood breken</text><text x="68" y="625" class="body">In de huizen eten zij met vreugde en</text><text x="68" y="668" class="body">eenvoud.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gebeden</text><text x="68" y="817" class="body">Zij bidden, prijzen God en komen in de</text><text x="68" y="860" class="body">tempel.</text><text x="46" y="953" class="note">Ongeveer 3.000 kwamen erbij; dit is geen telling</text><text x="46" y="989" class="note">van één afgebeelde groep.</text></svg>