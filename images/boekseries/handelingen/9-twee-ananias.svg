<svg xmlns="http://www.w3.org/2000/svg" width="840" height="976" viewBox="0 0 840 976" role="img" aria-labelledby="title desc"><title id="title">Ananias in Damaskus</title><desc id="desc">Ananias in Damaskus met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="976" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ananias in Damaskus</text><text x="44" y="113" class="ref">Handelingen 9:10–19</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een leerling in Damaskus</text><text x="68" y="241" class="body">Deze Ananias ontvangt een visioen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Opdracht</text><text x="68" y="390" class="body">Ga naar de Rechte straat, het huis van</text><text x="68" y="433" class="body">Judas.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Saulus</text><text x="68" y="582" class="body">Hij bidt en verwacht iemand die Ananias</text><text x="68" y="625" class="body">heet.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Bezoek en herstel</text><text x="68" y="774" class="body">Ananias legt handen op; Saulus ziet en</text><text x="68" y="817" class="body">wordt gedoopt.</text><text x="46" y="910" class="note">Deze leerling is niet Ananias uit Handelingen 5.</text></svg>