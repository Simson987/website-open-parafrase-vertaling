<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Twee manieren van burger zijn</title><desc id="desc">Twee manieren van burger zijn met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee manieren van burger zijn</text><text x="44" y="113" class="ref">Handelingen 22:25–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag van Paulus</text><text x="68" y="241" class="body">Mag een Romein zonder vonnis gegeseld</text><text x="68" y="284" class="body">worden?</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De officier</text><text x="68" y="433" class="body">Hij waarschuwt de commandant.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De commandant</text><text x="68" y="582" class="body">Hij heeft zijn burgerrecht voor veel</text><text x="68" y="625" class="body">geld gekocht.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Paulus</text><text x="68" y="774" class="body">Hij is als burger geboren; de</text><text x="68" y="817" class="body">ondervragers wijken terug.</text><text x="46" y="910" class="note">Dit verklaart de reactie van de officieren</text><text x="46" y="946" class="note">binnen deze vertelling.</text></svg>