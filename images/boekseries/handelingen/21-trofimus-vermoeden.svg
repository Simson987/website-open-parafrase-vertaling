<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat weten de aanklagers?</title><desc id="desc">Wat weten de aanklagers? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9" /><text x="44" y="65" class="title">Wat weten de aanklagers?</text><text x="44" y="113" class="ref">Handelingen 21:27–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2" /><text x="68" y="193" class="label">Eerder in de stad</text><text x="68" y="241" class="body">Zij hadden Paulus samen met Trofimus</text><text x="68" y="284" class="body">gezien.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2" /><text x="68" y="385" class="label">Hun veronderstelling</text><text x="68" y="433" class="body">Zij denken dat Paulus hem de tempel</text><text x="68" y="476" class="body">heeft binnengebracht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2" /><text x="68" y="577" class="label">Hun aanklacht</text><text x="68" y="625" class="body">Zij roepen dat de heilige plaats</text><text x="68" y="668" class="body">ontheiligd is.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2" /><text x="68" y="769" class="label">Het onderscheid</text><text x="68" y="817" class="body">De verteller noemt het hun vermoeden,</text><text x="68" y="860" class="body">geen bewezen gebeurtenis.</text><text x="46" y="953" class="note">De verteller noemt het hun vermoeden; hij</text><text x="46" y="989" class="note">bevestigt geen toegang van Trofimus tot de tempel.</text></svg>