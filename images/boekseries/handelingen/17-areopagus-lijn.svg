<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De lijn van de toespraak</title><desc id="desc">De lijn van de toespraak met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De lijn van de toespraak</text><text x="44" y="113" class="ref">Handelingen 17:22–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De onbekende God</text><text x="68" y="241" class="body">Paulus sluit aan bij het altaar dat hij</text><text x="68" y="284" class="body">gezien heeft.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Schepper en Gever</text><text x="68" y="433" class="body">God geeft leven en adem; Hij is niet</text><text x="68" y="476" class="body">afhankelijk.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zoeken en bekeren</text><text x="68" y="625" class="body">Alle mensen worden tot bekering</text><text x="68" y="668" class="body">opgeroepen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Oordeel en opstanding</text><text x="68" y="817" class="body">God heeft een dag en een Man</text><text x="68" y="860" class="body">vastgesteld.</text><text x="46" y="953" class="note">Dit ordent Paulus’ woorden, zonder God als</text><text x="46" y="989" class="note">afgodsbeeld te tekenen.</text></svg>