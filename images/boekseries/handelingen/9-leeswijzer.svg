<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Saulus en Petrus onderweg</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Saulus en Petrus onderweg</text><text x="44" y="113" class="ref">Handelingen 9:1–43</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–19 · Damaskus</text><text x="68" y="241" class="body">Licht, blindheid, Ananias en doop.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">20–31 · Nieuwe getuige</text><text x="68" y="390" class="body">Verkondiging, mand, Barnabas en vertrek</text><text x="68" y="433" class="body">naar Tarsus.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">32–35 · Lydda</text><text x="68" y="582" class="body">Eneas staat op; velen keren zich tot de</text><text x="68" y="625" class="body">Heere.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">36–43 · Joppe</text><text x="68" y="774" class="body">Tabitha leeft; Petrus blijft bij Simon</text><text x="68" y="817" class="body">de leerlooier.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>