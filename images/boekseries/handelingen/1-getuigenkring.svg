<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Het bereik van het getuigenis</title><desc id="desc">Het bereik van het getuigenis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het bereik van het getuigenis</text><text x="44" y="113" class="ref">Handelingen 1:7–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jeruzalem</text><text x="68" y="241" class="body">Hier moeten de leerlingen wachten op de</text><text x="68" y="284" class="body">belofte.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Judea en Samaria</text><text x="68" y="433" class="body">Hun getuigenis krijgt een ruimer</text><text x="68" y="476" class="body">bereik.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het einde van de aarde</text><text x="68" y="625" class="body">De opdracht reikt verder dan deze</text><text x="68" y="668" class="body">streken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tijden en kracht</text><text x="68" y="817" class="body">Geen tijdschema gegeven; wel kracht</text><text x="68" y="860" class="body">door de Geest.</text><text x="46" y="953" class="note">Een tekstschema van bereik, geen geografisch</text><text x="46" y="989" class="note">exacte reisroute.</text></svg>