<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Twee plaatsen worden verbonden</title><desc id="desc">Twee plaatsen worden verbonden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee plaatsen worden verbonden</text><text x="44" y="113" class="ref">Handelingen 10:1–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Cesarea · Cornelius</text><text x="68" y="241" class="body">Een engel draagt hem op Petrus te laten</text><text x="68" y="284" class="body">halen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onderweg · drie mannen</text><text x="68" y="433" class="body">Twee huisknechten en een vrome soldaat.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Joppe · Petrus</text><text x="68" y="582" class="body">Visioen, boodschap van de Geest en</text><text x="68" y="625" class="body">ontvangst.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Cesarea · het huis</text><text x="68" y="774" class="body">Familie en vrienden wachten om Gods</text><text x="68" y="817" class="body">woorden te horen.</text><text x="46" y="910" class="note">Cornelius blijft thuis terwijl zijn drie</text><text x="46" y="946" class="note">gezanten naar Joppe reizen.</text></svg>