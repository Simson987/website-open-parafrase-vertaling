<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat gebeurt vóór het aanlanden?</title><desc id="desc">Wat gebeurt vóór het aanlanden? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat gebeurt vóór het aanlanden?</text><text x="44" y="113" class="ref">Handelingen 27:30–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sloep los</text><text x="68" y="241" class="body">De soldaten kappen de touwen; de</text><text x="68" y="284" class="body">zeelieden blijven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Voedsel</text><text x="68" y="433" class="body">Paulus dankt; iedereen eet en krijgt</text><text x="68" y="476" class="body">moed.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Schip vast</text><text x="68" y="625" class="body">Het voorschip zit vast; het achterschip</text><text x="68" y="668" class="body">breekt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Iedereen aan land</text><text x="68" y="817" class="body">Wie kan zwemmen eerst; anderen op</text><text x="68" y="860" class="body">planken en scheepsdelen.</text><text x="46" y="953" class="note">De tekst zegt dat iedereen veilig aankomt, niet</text><text x="46" y="989" class="note">dat het schip behouden blijft.</text></svg>