<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Van de Raad naar Cesarea</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van de Raad naar Cesarea</text><text x="44" y="113" class="ref">Handelingen 23:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–10 · Verdeelde Raad</text><text x="68" y="241" class="body">Geweten, hogepriester en de hoop op de</text><text x="68" y="284" class="body">opstanding.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">11–22 · Moed en waarschuwing</text><text x="68" y="433" class="body">De Heere bemoedigt; Paulus’ neef meldt</text><text x="68" y="476" class="body">de aanslag.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">23–30 · Beschermde overdracht</text><text x="68" y="625" class="body">De commandant regelt escorte en een</text><text x="68" y="668" class="body">brief.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">31–35 · Aankomst</text><text x="68" y="817" class="body">Via Antipatris naar Felix in Cesarea.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>