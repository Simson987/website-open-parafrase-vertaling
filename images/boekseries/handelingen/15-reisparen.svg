<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Na het meningsverschil</title><desc id="desc">Na het meningsverschil met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Na het meningsverschil</text><text x="44" y="113" class="ref">Handelingen 15:36–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verschil</text><text x="68" y="241" class="body">Barnabas wil Johannes Markus mee;</text><text x="68" y="284" class="body">Paulus niet.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Barnabas en Markus</text><text x="68" y="433" class="body">Zij varen naar Cyprus.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Paulus en Silas</text><text x="68" y="582" class="body">Zij gaan door Syrië en Cilicië.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Doel</text><text x="68" y="731" class="body">Terug naar de gelovigen om hen te</text><text x="68" y="774" class="body">versterken.</text><text x="46" y="867" class="note">De tekst vertelt geen latere verzoening in dit</text><text x="46" y="903" class="note">hoofdstuk.</text></svg>