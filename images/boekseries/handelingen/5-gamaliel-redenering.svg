<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Gamaliëls waarschuwing</title><desc id="desc">Gamaliëls waarschuwing met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gamaliëls waarschuwing</text><text x="44" y="113" class="ref">Handelingen 5:34–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerdere bewegingen</text><text x="68" y="241" class="body">Theudas en Judas de Galileeër zijn</text><text x="68" y="284" class="body">omgekomen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Als het uit mensen is</text><text x="68" y="433" class="body">Dan gaat het werk vanzelf ten onder.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Als het uit God is</text><text x="68" y="582" class="body">Dan kunnen zij het niet kapotmaken.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Zijn waarschuwing</text><text x="68" y="731" class="body">Pas op dat jullie niet tegen God</text><text x="68" y="774" class="body">blijken te strijden.</text><text x="46" y="867" class="note">Dit is Gamaliëls redenering tot de Raad, met de</text><text x="46" y="903" class="note">voorwaarden bewaard.</text></svg>