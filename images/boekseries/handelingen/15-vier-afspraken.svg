<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Wat staat in de brief?</title><desc id="desc">Wat staat in de brief? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat staat in de brief?</text><text x="44" y="113" class="ref">Handelingen 15:23–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geen zwaardere last</text><text x="68" y="241" class="body">Het besluit wordt aan de Geest en de</text><text x="68" y="284" class="body">vergadering verbonden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Voedsel</text><text x="68" y="433" class="body">Geen afgodenoffers, bloed of verstikt</text><text x="68" y="476" class="body">vlees.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Levenswandel</text><text x="68" y="625" class="body">Zich onthouden van ontucht.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Boodschappers</text><text x="68" y="774" class="body">Judas en Silas bevestigen het ook</text><text x="68" y="817" class="body">mondeling.</text><text x="46" y="910" class="note">De vier genoemde zaken blijven onderscheiden; de</text><text x="46" y="946" class="note">brief maakt bekering niet van besnijdenis</text><text x="46" y="982" class="note">afhankelijk.</text></svg>