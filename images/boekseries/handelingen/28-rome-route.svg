<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Van Malta naar Rome</title><desc id="desc">Van Malta naar Rome met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Malta naar Rome</text><text x="44" y="113" class="ref">Handelingen 28:11–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Malta naar Syrakuse</text><text x="68" y="241" class="body">Na drie maanden verder; drie dagen in</text><text x="68" y="284" class="body">Syrakuse.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Regium naar Puteoli</text><text x="68" y="433" class="body">Met zuidenwind; zeven dagen bij</text><text x="68" y="476" class="body">gelovigen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tegemoet gereisd</text><text x="68" y="625" class="body">Gelovigen ontmoeten hen bij Forum Appii</text><text x="68" y="668" class="body">en Tres Tabernae.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">In Rome</text><text x="68" y="817" class="body">Paulus mag apart wonen onder bewaking</text><text x="68" y="860" class="body">van een soldaat.</text><text x="46" y="953" class="note">Forum Appii en Tres Tabernae zijn</text><text x="46" y="989" class="note">ontmoetingsplaatsen vóór de aankomst.</text></svg>