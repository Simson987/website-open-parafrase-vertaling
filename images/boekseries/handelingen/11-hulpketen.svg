<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Gemeenschappen helpen elkaar</title><desc id="desc">Gemeenschappen helpen elkaar met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gemeenschappen helpen elkaar</text><text x="44" y="113" class="ref">Handelingen 11:22–30</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jeruzalem naar Antiochië</text><text x="68" y="241" class="body">Barnabas wordt gezonden en bemoedigt.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tarsus naar Antiochië</text><text x="68" y="390" class="body">Barnabas haalt Saulus voor het</text><text x="68" y="433" class="body">onderwijs.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Antiochië naar Judea</text><text x="68" y="582" class="body">Na Agabus’ waarschuwing geeft ieder</text><text x="68" y="625" class="body">naar vermogen.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Barnabas en Saulus</text><text x="68" y="774" class="body">Zij dragen de hulp naar de oudsten.</text><text x="46" y="867" class="note">Onderwijs, bemoediging en materiële hulp lopen</text><text x="46" y="903" class="note">in verschillende richtingen.</text></svg>