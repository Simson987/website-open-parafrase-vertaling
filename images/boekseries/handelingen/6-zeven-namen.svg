<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">De zeven gekozen mannen</title><desc id="desc">De zeven gekozen mannen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De zeven gekozen mannen</text><text x="44" y="113" class="ref">Handelingen 6:3–6</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–2</text><text x="68" y="241" class="body">Stefanus en Filippus.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">3–4</text><text x="68" y="390" class="body">Prochorus en Nicanor.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">5–6</text><text x="68" y="539" class="body">Timon en Parmenas.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">7</text><text x="68" y="688" class="body">Nicolaüs uit Antiochië, tot het</text><text x="68" y="731" class="body">Jodendom toegetreden.</text><text x="46" y="824" class="note">Goed bekend, vol Geest en wijsheid; de apostelen</text><text x="46" y="860" class="note">bidden en leggen handen op.</text></svg>