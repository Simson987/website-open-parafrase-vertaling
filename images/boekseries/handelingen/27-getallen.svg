<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Getallen tijdens de laatste nacht</title><desc id="desc">Getallen tijdens de laatste nacht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Getallen tijdens de laatste nacht</text><text x="44" y="113" class="ref">Handelingen 27:27–38</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Veertiende nacht</text><text x="68" y="241" class="body">De zeelieden vermoeden land.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Diepten in deze vertaling</text><text x="68" y="390" class="body">Eerst ongeveer 36 meter, daarna</text><text x="68" y="433" class="body">ongeveer 27 meter.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vier ankers</text><text x="68" y="582" class="body">Uitgeworpen vanaf het achterschip.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">276 mensen</text><text x="68" y="731" class="body">Het totale aantal mensen aan boord.</text><text x="46" y="824" class="note">De lengtematen volgen de omrekening in de</text><text x="46" y="860" class="note">plaatselijke hoofdstuktekst.</text></svg>