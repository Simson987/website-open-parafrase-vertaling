<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Rhode en de gesloten poort</title><desc id="desc">Rhode en de gesloten poort met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rhode en de gesloten poort</text><text x="44" y="113" class="ref">Handelingen 12:13–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Petrus klopt</text><text x="68" y="241" class="body">Rhode komt naar de poort luisteren.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Rhode herkent zijn stem</text><text x="68" y="390" class="body">Van vreugde rent ze naar binnen zonder</text><text x="68" y="433" class="body">open te doen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De anderen twijfelen</text><text x="68" y="582" class="body">Zij noemen haar gek en spreken over</text><text x="68" y="625" class="body">zijn engel.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De poort gaat open</text><text x="68" y="774" class="body">Zij zien Petrus zelf; hij vertelt de</text><text x="68" y="817" class="body">bevrijding.</text><text x="46" y="910" class="note">Het is-zijn-engel is hun vermoeden, niet wat er</text><text x="46" y="946" class="note">aan de poort blijkt te staan.</text></svg>