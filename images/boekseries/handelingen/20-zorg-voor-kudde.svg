<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Paulus’ opdracht aan de oudsten</title><desc id="desc">Paulus’ opdracht aan de oudsten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Paulus’ opdracht aan de oudsten</text><text x="44" y="113" class="ref">Handelingen 20:28–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Let op jezelf en de kudde</text><text x="68" y="241" class="body">De Geest heeft hen als opzieners</text><text x="68" y="284" class="body">aangesteld.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wees waakzaam</text><text x="68" y="433" class="body">Gevaren komen van buiten en uit eigen</text><text x="68" y="476" class="body">midden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vertrouw op Gods genade</text><text x="68" y="625" class="body">Zijn woord kan hen opbouwen en een</text><text x="68" y="668" class="body">erfdeel geven.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Werk en help de zwakken</text><text x="68" y="817" class="body">Geven maakt gelukkiger dan ontvangen.</text><text x="46" y="910" class="note">Wolven en kudde functioneren hier als</text><text x="46" y="946" class="note">beeldspraak over de gemeente.</text></svg>