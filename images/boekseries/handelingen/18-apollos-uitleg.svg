<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Apollos leert en ondersteunt</title><desc id="desc">Apollos leert en ondersteunt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Apollos leert en ondersteunt</text><text x="44" y="113" class="ref">Handelingen 18:24–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Efeze · vers 24–25</text><text x="68" y="241" class="body">Welsprekend, sterk in de Schrift; kent</text><text x="68" y="284" class="body">Johannes’ doop.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Priscilla en Aquila · vers 26</text><text x="68" y="433" class="body">Zij leggen de weg van God nauwkeuriger</text><text x="68" y="476" class="body">uit.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Naar Achaje · vers 27</text><text x="68" y="625" class="body">De gelovigen moedigen hem aan en</text><text x="68" y="668" class="body">bevelen hem aan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Achaje · vers 27–28</text><text x="68" y="817" class="body">Hij helpt gelovigen en bewijst uit de</text><text x="68" y="860" class="body">Schrift wie Jezus is.</text><text x="46" y="953" class="note">De twee uitleggevers en Apollos blijven</text><text x="46" y="989" class="note">onderscheiden.</text></svg>