<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Waarheid, bevrijding en getuigenis</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarheid, bevrijding en getuigenis</text><text x="44" y="113" class="ref">Handelingen 5:1–42</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–11 · Ananias en Saffira</text><text x="68" y="241" class="body">Het achterhouden én liegen over de</text><text x="68" y="284" class="body">opbrengst.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">12–16 · Tekenen</text><text x="68" y="433" class="body">De apostelen en mensen die genezing</text><text x="68" y="476" class="body">zoeken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">17–26 · Gevangenis en tempel</text><text x="68" y="625" class="body">Een engel opent; de apostelen</text><text x="68" y="668" class="body">onderwijzen weer.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">27–42 · Raad en Gamaliël</text><text x="68" y="817" class="body">God gehoorzamen; waarschuwing en</text><text x="68" y="860" class="body">voortgezet onderwijs.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>