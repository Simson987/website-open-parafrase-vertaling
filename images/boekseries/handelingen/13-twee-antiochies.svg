<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Twee steden met dezelfde naam</title><desc id="desc">Twee steden met dezelfde naam met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee steden met dezelfde naam</text><text x="44" y="113" class="ref">Handelingen 13:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Antiochië in Syrië</text><text x="68" y="241" class="body">Begin van de uitzending van Barnabas en</text><text x="68" y="284" class="body">Saulus.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Cyprus</text><text x="68" y="433" class="body">Via Seleucië naar Salamis en Pafos.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Perge in Pamfylië</text><text x="68" y="582" class="body">Johannes verlaat de reisgenoten.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Antiochië in Pisidië</text><text x="68" y="731" class="body">De stad met de toespraak in de</text><text x="68" y="774" class="body">synagoge.</text><text x="46" y="867" class="note">Het zendende Antiochië en Antiochië in Pisidië</text><text x="46" y="903" class="note">zijn verschillende steden.</text></svg>