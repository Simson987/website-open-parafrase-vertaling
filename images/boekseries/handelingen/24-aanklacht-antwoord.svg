<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Aanklacht en antwoord</title><desc id="desc">Aanklacht en antwoord met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aanklacht en antwoord</text><text x="44" y="113" class="ref">Handelingen 24:5–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tertullus</text><text x="68" y="241" class="body">Oproer, leider van de Nazoreeërs en</text><text x="68" y="284" class="body">ontheiliging.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Paulus ontkent</text><text x="68" y="433" class="body">Geen oproer, geen bewezen</text><text x="68" y="476" class="body">beschuldiging.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Paulus belijdt</text><text x="68" y="625" class="body">Wet en profeten; hoop op de opstanding.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Zijn concrete vraag</text><text x="68" y="774" class="body">Laat aanklagers zelf zeggen welk</text><text x="68" y="817" class="body">onrecht bewezen is.</text><text x="46" y="910" class="note">Beschuldigingen blijven herkenbaar als</text><text x="46" y="946" class="note">uitspraken van de aanklager.</text></svg>