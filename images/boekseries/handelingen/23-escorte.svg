<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De bevolen escorte</title><desc id="desc">De bevolen escorte met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De bevolen escorte</text><text x="44" y="113" class="ref">Handelingen 23:23–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">200 soldaten</text><text x="68" y="241" class="body">Worden gereedgemaakt voor de tocht naar</text><text x="68" y="284" class="body">Cesarea.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">70 ruiters</text><text x="68" y="433" class="body">Gaan mee en trekken daarna verder met</text><text x="68" y="476" class="body">Paulus.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">200 speerdragers</text><text x="68" y="625" class="body">Worden eveneens gereedgemaakt.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De route</text><text x="68" y="774" class="body">In de nacht tot Antipatris; ruiters</text><text x="68" y="817" class="body">gaan naar Felix.</text><text x="46" y="910" class="note">Dit zijn de genoemde aantallen van het bevel;</text><text x="46" y="946" class="note">geen bewering dat elk getekend figuurtje één</text><text x="46" y="982" class="note">soldaat telt.</text></svg>