<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Waarom raakt de Raad verdeeld?</title><desc id="desc">Waarom raakt de Raad verdeeld? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom raakt de Raad verdeeld?</text><text x="44" y="113" class="ref">Handelingen 23:6–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Paulus’ uitspraak</text><text x="68" y="241" class="body">Hij wordt geoordeeld om hoop en</text><text x="68" y="284" class="body">opstanding.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sadduceeën</text><text x="68" y="433" class="body">Volgens de tekst ontkennen zij</text><text x="68" y="476" class="body">opstanding, engel en geest.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Farizeeën</text><text x="68" y="625" class="body">Volgens de tekst belijden zij dit wel.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De commandant</text><text x="68" y="774" class="body">Hij laat Paulus weghalen wanneer het</text><text x="68" y="817" class="body">uit de hand loopt.</text><text x="46" y="910" class="note">De verschillen worden hier weergegeven zoals de</text><text x="46" y="946" class="note">verteller ze uitlegt.</text></svg>