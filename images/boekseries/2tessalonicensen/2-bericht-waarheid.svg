<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Berichten en waarheid</title><desc id="desc">Berichten en waarheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Berichten en waarheid</text><text x="44" y="113" class="ref">2 Tessalonicensen 2:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het alarmerende bericht</text><text x="68" y="241" class="body">Geest, woord of een brief die van de</text><text x="68" y="284" class="body">schrijvers zou komen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De reactie · vers 2–3</text><text x="68" y="433" class="body">Laat je niet opschrikken of misleiden.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Wat eerst genoemd wordt</text><text x="68" y="582" class="body">De afval en het verschijnen van de mens</text><text x="68" y="625" class="body">van de wetteloosheid.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De afloop · vers 8</text><text x="68" y="774" class="body">De Heere vernietigt de wetteloze bij</text><text x="68" y="817" class="body">Zijn verschijning.</text><text x="46" y="910" class="note">De tekst noemt een tegenhouder zonder hier zijn</text><text x="46" y="946" class="note">naam te geven.</text></svg>