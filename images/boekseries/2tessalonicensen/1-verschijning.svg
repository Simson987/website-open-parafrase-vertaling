<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Bij Jezus’ verschijning</title><desc id="desc">Bij Jezus’ verschijning met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bij Jezus’ verschijning</text><text x="44" y="113" class="ref">2 Tessalonicensen 1:5–12</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De verdrukten · vers 7</text><text x="68" y="241" class="body">Rust samen met de verkondigers.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het oordeel · vers 6–9</text><text x="68" y="390" class="body">God oordeelt rechtvaardig over</text><text x="68" y="433" class="body">verdrukking en ongehoorzaamheid.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De gelovigen · vers 10</text><text x="68" y="582" class="body">Jezus wordt in hen verheerlijkt en</text><text x="68" y="625" class="body">bewonderd.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het gebed · vers 11–12</text><text x="68" y="774" class="body">Roeping en geloofswerk vervuld; Zijn</text><text x="68" y="817" class="body">Naam verheerlijkt.</text><text x="46" y="910" class="note">De brief beschrijft een toekomstverwachting en</text><text x="46" y="946" class="note">het gebed dat daarop volgt.</text></svg>