<svg xmlns="http://www.w3.org/2000/svg" width="840" height="664" viewBox="0 0 840 664" role="img" aria-labelledby="title desc"><title id="title">Herkomst en koningsdagen</title><desc id="desc">Herkomst en koningsdagen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="664" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herkomst en koningsdagen</text><text x="44" y="113" class="ref">Zefanja 1:1</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De herkomstketen</text><text x="68" y="241" class="body">Hizkia → Amarja → Gedalja → Cuschi →</text><text x="68" y="284" class="body">Zefanja.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De genoemde koning</text><text x="68" y="433" class="body">Josia, zoon van Amon, koning van Juda.</text><text x="46" y="526" class="note">Hizkia in de herkomstketen wordt hier niet</text><text x="46" y="562" class="note">zonder nadere tekst als de koning Hizkia</text><text x="46" y="598" class="note">geïdentificeerd.</text></svg>