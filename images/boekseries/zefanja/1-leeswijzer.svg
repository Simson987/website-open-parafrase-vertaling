<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">De dag en de doorzoeking</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De dag en de doorzoeking</text><text x="44" y="113" class="ref">Zefanja 1:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het woord · 1–6</text><text x="68" y="241" class="body">Zefanja’s herkomst, Josia; land en</text><text x="68" y="284" class="body">Juda/Jeruzalem, Baäl, dakaanbidding en</text><text x="68" y="327" class="body">afkeer.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De doorzoeking · 7–13</text><text x="68" y="476" class="body">Stil, dag nabij; vorsten, drempel,</text><text x="68" y="519" class="body">Vispoort/benedenstad, lantaarns en</text><text x="68" y="562" class="body">zelfgenoegzaamheid; bezit weg.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De grote dag · 14–18</text><text x="68" y="711" class="body">Benauwdheid, donker en hoorn, zonde en</text><text x="68" y="754" class="body">oordeel; zilver/goud redden niet.</text><text x="46" y="847" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="883" class="note">volgen de plaatselijke versindeling.</text></svg>