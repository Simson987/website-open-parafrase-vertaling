<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Wie worden bijeengebracht?</title><desc id="desc">Wie worden bijeengebracht? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie worden bijeengebracht?</text><text x="44" y="113" class="ref">Zefanja 3:9–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Volken · 9–10</text><text x="68" y="241" class="body">Reine lippen, schouder aan schouder</text><text x="68" y="284" class="body">dienen; van over Ethiopische rivieren</text><text x="68" y="327" class="body">aanbidders.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Klein en arm volk · 11–13</text><text x="68" y="476" class="body">Hoogmoed weg; vertrouwen, geen leugen</text><text x="68" y="519" class="body">of onrecht, ongestoord rusten.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Rouwenden en verstotenen · 18–20</text><text x="68" y="668" class="body">Feesten missen, kreupelen beschermd,</text><text x="68" y="711" class="body">verstotenen bijeen, thuisgebracht en</text><text x="68" y="754" class="body">lot gekeerd.</text><text x="46" y="847" class="note">De onderscheiden groepen zijn die van de</text><text x="46" y="883" class="note">belofte. Geen extra historische thuiskomst wordt</text><text x="46" y="919" class="note">als reeds gebeurd geclaimd.</text></svg>