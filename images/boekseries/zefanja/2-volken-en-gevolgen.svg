<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Volken en hun eigen woorden</title><desc id="desc">Volken en hun eigen woorden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volken en hun eigen woorden</text><text x="44" y="113" class="ref">Zefanja 2:4–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Filistijnse kust · 4–7</text><text x="68" y="241" class="body">Gaza, Askelon, Asdod en Ekron; weiden,</text><text x="68" y="284" class="body">kudden en rest van Juda.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Moab en Ammon · 8–11</text><text x="68" y="433" class="body">Spot en hoogmoed; netels, zoutgroeve en</text><text x="68" y="476" class="body">bezit voor de rest.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ethiopië · 12</text><text x="68" y="625" class="body">Aangekondigd zwaard.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Assur en Ninevé · 13–15</text><text x="68" y="774" class="body">Noorden, dorre woestenij, dieren en</text><text x="68" y="817" class="body">verlaten zelfverzekerde stad.</text><text x="46" y="910" class="note">Dit is een tekstoverzicht, geen ingevulde</text><text x="46" y="946" class="note">moderne landsgrenzen.</text></svg>