<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Zesenzestig jaar en verse vijgen</title><desc id="desc">Zesenzestig jaar en verse vijgen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zesenzestig jaar en verse vijgen</text><text x="44" y="113" class="ref">4 Baruch 5:1–35</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rust · 1–6</text><text x="68" y="241" class="body">Hoofd op vijgenmand; 66 jaar slaap,</text><text x="68" y="284" class="body">ervaren als korte rust; vijgen vers en</text><text x="68" y="327" class="body">melkachtig.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Verwarring · 7–14</text><text x="68" y="476" class="body">Stad en huis onbekend; geen bekende</text><text x="68" y="519" class="body">gevonden; gaat buiten zitten.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Oude man · 15–31</text><text x="68" y="668" class="body">Jeremia in Babel; 66 jaar weg; velden</text><text x="68" y="711" class="body">nog niet uitgekomen en vijgen buiten</text><text x="68" y="754" class="body">seizoen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Datum en delen · 32–35</text><text x="68" y="903" class="body">Dag 12 Nisan, hier Miyazya genoemd;</text><text x="68" y="946" class="body">Abimelech deelt vijgen met oude man.</text><text x="46" y="1039" class="note">De kalendernamen en Nebukadnezar als koning van</text><text x="46" y="1075" class="note">Perzië in vers 19 blijven de plaatselijke</text><text x="46" y="1111" class="note">formulering.</text></svg>