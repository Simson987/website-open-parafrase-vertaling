<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">Jordaan en nieuwe woonplaats</title><desc id="desc">Jordaan en nieuwe woonplaats met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jordaan en nieuwe woonplaats</text><text x="44" y="113" class="ref">4 Baruch 8:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vertrek · 1–4</text><text x="68" y="241" class="body">Jeremia leest opdracht; gewoonten van</text><text x="68" y="284" class="body">Babel achterlaten; toets bij Jordaan.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Weigering · 5–7</text><text x="68" y="433" class="body">Sommigen willen hun partners niet</text><text x="68" y="476" class="body">verlaten; toegang tot Jeruzalem</text><text x="68" y="519" class="body">geweigerd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Terugkeer · 8–10</text><text x="68" y="668" class="body">Babel weigert hen ook toegang; beroep</text><text x="68" y="711" class="body">op eerdere breuk.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Nabij Jeruzalem · 11–12</text><text x="68" y="860" class="body">Zij bouwen woonplaatsen en noemen stad</text><text x="68" y="903" class="body">Samaria; boodschap over engel van</text><text x="68" y="946" class="body">gerechtigheid.</text><text x="46" y="1039" class="note">Dit is de oorsprongsvertelling en</text><text x="46" y="1075" class="note">uitsluitingsopvatting van dit boek, geen</text><text x="46" y="1111" class="note">vastgestelde geschiedenis van Samaria of advies</text><text x="46" y="1147" class="note">aan hedendaagse gezinnen.</text></svg>