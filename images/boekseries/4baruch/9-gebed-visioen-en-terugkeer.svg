<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Gebed, visioen en terugkeer</title><desc id="desc">Gebed, visioen en terugkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, visioen en terugkeer</text><text x="44" y="113" class="ref">4 Baruch 9:1–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dagen · 1–7</text><text x="68" y="241" class="body">7 dagen offers; tiende dag Jeremia</text><text x="68" y="284" class="body">alleen; gebed met Michaël, cherubs en</text><text x="68" y="327" class="body">serafs.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Waken · 8–13</text><text x="68" y="476" class="body">Lijkt gestorven; stem verbiedt</text><text x="68" y="519" class="body">begraven; 3 dagen wachten.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Messias · 14–15,19–20</text><text x="68" y="668" class="body">Jezus, Zoon van God; 477 jaar tot</text><text x="68" y="711" class="body">komst; 12 apostelen en Olijfberg.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Beelden · 16–18</text><text x="68" y="860" class="body">Levensboom verzamelt bomen; dauw,</text><text x="68" y="903" class="body">vrucht en water dat van smaak</text><text x="68" y="946" class="body">verandert.</text><text x="46" y="1039" class="note">477 jaar is de telling in dit visioen, geen</text><text x="46" y="1075" class="note">berekening die hier naar een modern kalenderjaar</text><text x="46" y="1111" class="note">wordt vertaald.</text></svg>