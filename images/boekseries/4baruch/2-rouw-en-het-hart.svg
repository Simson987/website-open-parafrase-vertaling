<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Rouw en het hart</title><desc id="desc">Rouw en het hart met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rouw en het hart</text><text x="44" y="113" class="ref">4 Baruch 2:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jeremia · 1–4</text><text x="68" y="241" class="body">Gescheurde kleren en as; Baruch vraagt</text><text x="68" y="284" class="body">naar oorzaak.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oproep · 5</text><text x="68" y="433" class="body">Hart scheuren en drinkbakken met tranen</text><text x="68" y="476" class="body">vullen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bericht · 7–9</text><text x="68" y="625" class="body">Stad overgegeven, volk gevangen;</text><text x="68" y="668" class="body">wachten tot zesde nachtuur.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Samen · 10</text><text x="68" y="817" class="body">Beiden blijven huilend in het</text><text x="68" y="860" class="body">heiligdom.</text><text x="46" y="953" class="note">Hart scheuren en bakken vol tranen zijn</text><text x="46" y="989" class="note">nadrukkelijke rouwbeelden; geen lichamelijke</text><text x="46" y="1025" class="note">verwonding.</text></svg>