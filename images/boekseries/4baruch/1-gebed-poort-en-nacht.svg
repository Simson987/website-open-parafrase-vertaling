<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Gebed, poort en nacht</title><desc id="desc">Gebed, poort en nacht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, poort en nacht</text><text x="44" y="113" class="ref">4 Baruch 1:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opdracht · 1–3,8–10</text><text x="68" y="241" class="body">Jeremia en Baruch moeten stad uit;</text><text x="68" y="284" class="body">zonde van inwoners als reden.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gebed · 2,4–7</text><text x="68" y="433" class="body">Pilaar en diamantmuur als vergelijking</text><text x="68" y="476" class="body">voor Jeremia’s gebed; hij spreekt voor</text><text x="68" y="519" class="body">stad.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Poort · 9</text><text x="68" y="668" class="body">Leger kan niet binnen voordat God</text><text x="68" y="711" class="body">poorten opent.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Afspraak · 11–12</text><text x="68" y="860" class="body">Zesde uur van nacht op stadsmuur;</text><text x="68" y="903" class="body">belofte wordt in hoofdstuk 3 vervuld.</text><text x="46" y="996" class="note">De muur en pilaar zijn gebedsbeelden; de</text><text x="46" y="1032" class="note">nachtelijke afspraak is een verteld</text><text x="46" y="1068" class="note">verhaalmoment.</text></svg>