<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Antwoord en zorg</title><desc id="desc">Antwoord en zorg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Antwoord en zorg</text><text x="44" y="113" class="ref">4 Baruch 7:24–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Terugbrief · 24–28</text><text x="68" y="241" class="body">Baruch blijven bidden; niet naar Babel</text><text x="68" y="284" class="body">komen; 66 jaar nood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verdriet · 29–34</text><text x="68" y="433" class="body">Vreemde god aangeroepen; herinnering</text><text x="68" y="476" class="body">feest; geen Sionslied in vreemd land.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Retour · 34–36</text><text x="68" y="625" class="body">Arend brengt brief; Baruch leest en</text><text x="68" y="668" class="body">huilt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vijgen · 37</text><text x="68" y="817" class="body">Jeremia geeft ze aan zieken en blijft</text><text x="68" y="860" class="body">onderwijzen.</text><text x="46" y="953" class="note">De beschermde afwezigheid van Baruch wordt</text><text x="46" y="989" class="note">vergeleken met een vader die leed van zijn zoon</text><text x="46" y="1025" class="note">niet moet zien.</text></svg>