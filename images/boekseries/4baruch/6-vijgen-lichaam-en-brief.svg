<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Vijgen, lichaam en brief</title><desc id="desc">Vijgen, lichaam en brief met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijgen, lichaam en brief</text><text x="44" y="113" class="ref">4 Baruch 6:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hereniging · 1–4</text><text x="68" y="241" class="body">Engel brengt Abimelech naar Baruch in</text><text x="68" y="284" class="body">graf; groet, tranen en omhelzing.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Lichaam · 5–10</text><text x="68" y="433" class="body">66 jaar verse vijgen worden beeld van</text><text x="68" y="476" class="body">lichaamsbewaring en herleven.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bode · 11–18</text><text x="68" y="625" class="body">Gebed; engel belooft arend bij</text><text x="68" y="668" class="body">ochtendlicht; 15 dagen afzondering</text><text x="68" y="711" class="body">genoemd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Brief · 19–25</text><text x="68" y="860" class="body">Papier en zwarte inkt; Baruch schrijft</text><text x="68" y="903" class="body">aan Jeremia; toets bij Jordaan.</text><text x="46" y="996" class="note">De vijgen zijn eerst een verteld wonder en</text><text x="46" y="1032" class="note">worden daarna uitgelegd als vergelijking voor</text><text x="46" y="1068" class="note">het lichaam.</text></svg>