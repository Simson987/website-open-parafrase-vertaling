<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De arend als bode</title><desc id="desc">De arend als bode met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De arend als bode</text><text x="44" y="113" class="ref">4 Baruch 7:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ontmoeting · 1–6</text><text x="68" y="241" class="body">Sprekende arend aan graf; gestuurd om</text><text x="68" y="284" class="body">bericht te dragen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zending · 7–12</text><text x="68" y="433" class="body">Brief en 15 vijgen aan hals; raaf en</text><text x="68" y="476" class="body">duif van Noach als vergelijking; zuil</text><text x="68" y="519" class="body">bij Babel.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Teken · 13–20</text><text x="68" y="668" class="body">Rouwstoet; arend daalt op gestorvene;</text><text x="68" y="711" class="body">man leeft.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Voorlezen · 21–23</text><text x="68" y="860" class="body">Jeremia leest aan heel volk; tranen, as</text><text x="68" y="903" class="body">en vraag naar terugkeer.</text><text x="46" y="996" class="note">De uitspraak dat de arend misschien God is komt</text><text x="46" y="1032" class="note">van verbaasde omstanders; de bode presenteert</text><text x="46" y="1068" class="note">zich als gezonden vogel.</text></svg>