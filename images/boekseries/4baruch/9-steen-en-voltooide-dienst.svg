<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Steen en voltooide dienst</title><desc id="desc">Steen en voltooide dienst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Steen en voltooide dienst</text><text x="44" y="113" class="ref">4 Baruch 9:21–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Reactie · 21–24</text><text x="68" y="241" class="body">Woede; verwijzing naar Jesaja, zoon van</text><text x="68" y="284" class="body">Amos; Baruch en Abimelech protesteren.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Steen · 25–28</text><text x="68" y="433" class="body">Steen krijgt Jeremia’s gedaante; volk</text><text x="68" y="476" class="body">vergist zich; Jeremia vertelt zijn</text><text x="68" y="519" class="body">verborgen visioen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Dienst · 29–31</text><text x="68" y="668" class="body">Jeremia verschijnt; steen spreekt;</text><text x="68" y="711" class="body">Jeremia wordt gedood.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Graf · 32</text><text x="68" y="860" class="body">Steen als deur bij zijn graf;</text><text x="68" y="903" class="body">opschrift: helper van Jeremia.</text><text x="46" y="996" class="note">De wondersteen, Jeremia en zijn graf worden</text><text x="46" y="1032" class="note">onderscheiden. De tekst legt</text><text x="46" y="1068" class="note">verantwoordelijkheid bij deze verhaalgroep, niet</text><text x="46" y="1104" class="note">bij alle latere Israëlieten.</text></svg>