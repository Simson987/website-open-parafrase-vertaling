<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Drie personen, drie opdrachten</title><desc id="desc">Drie personen, drie opdrachten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie personen, drie opdrachten</text><text x="44" y="113" class="ref">4 Baruch 3:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Op de muur · 1–7</text><text x="68" y="241" class="body">Zesde nachtuur; bazuin en engelen met</text><text x="68" y="284" class="body">fakkels; vernietiging wacht op Jeremia.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Heilig gerei · 8–11,18–20</text><text x="68" y="433" class="body">Aarde bewaart het tot komst van de</text><text x="68" y="476" class="body">Geliefde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jeremia en Baruch · 15–16</text><text x="68" y="625" class="body">Jeremia met volk naar Babel; Baruch</text><text x="68" y="668" class="body">achter in Jeruzalem.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Abimelech · 12–14,21–22</text><text x="68" y="817" class="body">Hielp Jeremia uit put; naar Agrippa’s</text><text x="68" y="860" class="body">wijngaard langs bergweg voor vijgen</text><text x="68" y="903" class="body">voor zieken.</text><text x="46" y="996" class="note">De drie blijven niet samen: hun afzonderlijke</text><text x="46" y="1032" class="note">opdrachten verklaren de volgende hoofdstukken.</text></svg>