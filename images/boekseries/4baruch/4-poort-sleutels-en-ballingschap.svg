<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Poort, sleutels en ballingschap</title><desc id="desc">Poort, sleutels en ballingschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Poort, sleutels en ballingschap</text><text x="44" y="113" class="ref">4 Baruch 4:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ingang · 1–3</text><text x="68" y="241" class="body">Ochtend; grote engel blaast; Chaldeeuws</text><text x="68" y="284" class="body">leger en koning komen binnen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sleutels · 4–5</text><text x="68" y="433" class="body">Jeremia vertrouwt tempelsleutels aan</text><text x="68" y="476" class="body">zon toe; onwaardige bewaking beleden.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jeremia · 6</text><text x="68" y="625" class="body">Met volk weggevoerd naar Babel.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Baruch · 7–12</text><text x="68" y="774" class="body">Weeklacht, voorouders en hoop op</text><text x="68" y="817" class="body">terugkeer; woont in graf; engelen</text><text x="68" y="860" class="body">bezoeken.</text><text x="46" y="953" class="note">De bewaring van sleutels en de bewaring van</text><text x="46" y="989" class="note">gerei in hoofdstuk 3 zijn twee verschillende</text><text x="46" y="1025" class="note">handelingen.</text></svg>