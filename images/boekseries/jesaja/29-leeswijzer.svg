<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Gesloten begrip en nieuw inzicht</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gesloten begrip en nieuw inzicht</text><text x="44" y="113" class="ref">Jesaja 29:1–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ariël · 1–8</text><text x="68" y="241" class="body">Belegering en vernedering; de</text><text x="68" y="284" class="body">aanvallers verdwijnen als een</text><text x="68" y="327" class="body">onvervulde eet- of drinkdroom.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Onbegrip · 9–16</text><text x="68" y="476" class="body">Slaap, verzegeld boek, lippen zonder</text><text x="68" y="519" class="body">hart en de pot die zijn maker miskent.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wending · 17–24</text><text x="68" y="668" class="body">Doven horen, blinden zien, armen</text><text x="68" y="711" class="body">verheugen zich; tiran weg en dwalenden</text><text x="68" y="754" class="body">leren.</text><text x="46" y="847" class="note">De versgroepen verbinden de onderscheiden</text><text x="46" y="883" class="note">stemmen, vergelijkingen en beloften in de</text><text x="46" y="919" class="note">plaatselijke tekst.</text></svg>