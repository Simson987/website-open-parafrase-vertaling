<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Bewaren en bijeenbrengen</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bewaren en bijeenbrengen</text><text x="44" y="113" class="ref">Jesaja 27:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Strijdbeeld · 1</text><text x="68" y="241" class="body">Leviathan, vluchtende en kronkelende</text><text x="68" y="284" class="body">slang en zeemonster.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wijngaard · 2–6</text><text x="68" y="433" class="body">Zingen, water, bewaken, vrede en de</text><text x="68" y="476" class="body">wereld met vrucht vullen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Reiniging · 7–11</text><text x="68" y="625" class="body">Met mate twisten, schuld verzoenen,</text><text x="68" y="668" class="body">altaren weg, verlaten stad en verdorde</text><text x="68" y="711" class="body">takken.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bijeenbrengen · 12–13</text><text x="68" y="860" class="body">Een voor een opgeraapt; bazuin en</text><text x="68" y="903" class="body">terugkeer uit Assur en Egypte naar</text><text x="68" y="946" class="body">Jeruzalem.</text><text x="46" y="1039" class="note">De versgroepen verbinden de onderscheiden</text><text x="46" y="1075" class="note">stemmen, vergelijkingen en beloften in de</text><text x="46" y="1111" class="note">plaatselijke tekst.</text></svg>