<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Luisteren, louteren en weggaan</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Luisteren, louteren en weggaan</text><text x="44" y="113" class="ref">Jesaja 48:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hardheid · 1–8</text><text x="68" y="241" class="body">Naam zonder waarheid; eerdere en nieuwe</text><text x="68" y="284" class="body">dingen verteld, toch niet gehoord.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eigen naam · 9–16</text><text x="68" y="433" class="body">Toorn ingehouden, oven van ellende en</text><text x="68" y="476" class="body">de Eerste en Laatste.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Onderwijs · 17–19</text><text x="68" y="625" class="body">De goede weg; de gemiste vrede als</text><text x="68" y="668" class="body">rivier en gerechtigheid als zeegolven.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vertrek · 20–22</text><text x="68" y="817" class="body">Babel verlaten, verlossing vertellen en</text><text x="68" y="860" class="body">water uit de rots; geen vrede voor</text><text x="68" y="903" class="body">goddelozen.</text><text x="46" y="996" class="note">De leeswijzer verbindt belofte en aanklacht en</text><text x="46" y="1032" class="note">maakt de wisselende aanspraak zichtbaar.</text><text x="46" y="1068" class="note">Beeldspraak blijft verbonden met haar</text><text x="46" y="1104" class="note">verscontext.</text></svg>