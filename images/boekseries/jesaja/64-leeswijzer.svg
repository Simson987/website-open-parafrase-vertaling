<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Een gebed om niet te zwijgen</title><desc id="desc">Volledige hoofdstukopbouw met gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een gebed om niet te zwijgen</text><text x="44" y="113" class="ref">Jesaja 64:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kom · 1–5</text><text x="68" y="241" class="body">Open hemel, bergen, vuur en borrelend</text><text x="68" y="284" class="body">water; ontmoeting met wie op U wachten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wij · 6–8</text><text x="68" y="433" class="body">Onrein kleed, blad en wind; niemand</text><text x="68" y="476" class="body">roept, toch Vader en pottenbakker.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zie · 9–12</text><text x="68" y="625" class="body">Wij zijn Uw volk; woeste steden en</text><text x="68" y="668" class="body">verbrand huis; blijf niet zwijgen.</text><text x="46" y="761" class="note">Aanspraak, herinnering, vergelijking en belofte</text><text x="46" y="797" class="note">zijn in hun eigen verband weergegeven. De</text><text x="46" y="833" class="note">versgroepen volgen deze hoofdstuktekst.</text></svg>