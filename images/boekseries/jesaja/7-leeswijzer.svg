<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1021" viewBox="0 0 840 1021" role="img" aria-labelledby="title desc"><title id="title">Achaz, het teken en Assyrië</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1021" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Achaz, het teken en Assyrië</text><text x="44" y="113" class="ref">Jesaja 7:1–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dreiging · 1–9</text><text x="68" y="241" class="body">Syrië en Efraïm tegen Juda; Jesaja en</text><text x="68" y="284" class="body">Schear-Jaschub bij Achaz; kalm blijven</text><text x="68" y="327" class="body">en geloven.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Teken · 10–16</text><text x="68" y="476" class="body">Achaz weigert; jonge vrouw, zoon en de</text><text x="68" y="519" class="body">naam Immanuël; boter en honing.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Aangekondigde dagen · 17–25</text><text x="68" y="668" class="body">Assyrië, vliegen en bijen, scheermes,</text><text x="68" y="711" class="body">overgebleven vee en doorns in de</text><text x="68" y="754" class="body">wijngaard.</text><text x="46" y="847" class="note">De leeswijzer onderscheidt aanklacht, visioen,</text><text x="46" y="883" class="note">vergelijking en aangekondigde toekomst.</text><text x="46" y="919" class="note">Versverwijzingen volgen de plaatselijke</text><text x="46" y="955" class="note">hoofdstukindeling.</text></svg>