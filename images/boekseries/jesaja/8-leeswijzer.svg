<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1256" viewBox="0 0 840 1256" role="img" aria-labelledby="title desc"><title id="title">Tekens, water en getuigenis</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1256" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tekens, water en getuigenis</text><text x="44" y="113" class="ref">Jesaja 8:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Teken · 1–4</text><text x="68" y="241" class="body">Rol, getuigen en Maher-Schalal-Chazbaz;</text><text x="68" y="284" class="body">roof en buit vóór het kind vader of</text><text x="68" y="327" class="body">moeder roept.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Water · 5–10</text><text x="68" y="476" class="body">Zacht Siloa afgewezen; Assyrië als</text><text x="68" y="519" class="body">buiten de oevers tredende rivier; God</text><text x="68" y="562" class="body">is met ons.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Ontzag en bron · 11–20</text><text x="68" y="711" class="body">Geen volksvrees; heiligdom en</text><text x="68" y="754" class="body">struikelsteen; getuigenis bewaren,</text><text x="68" y="797" class="body">hopen en naar wet en getuigenis gaan.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Donker en eer · 21–23</text><text x="68" y="946" class="body">Honger en benauwdheid; het gekwelde</text><text x="68" y="989" class="body">land zal niet in het donker blijven.</text><text x="46" y="1082" class="note">De leeswijzer onderscheidt aanklacht, visioen,</text><text x="46" y="1118" class="note">vergelijking en aangekondigde toekomst.</text><text x="46" y="1154" class="note">Versverwijzingen volgen de plaatselijke</text><text x="46" y="1190" class="note">hoofdstukindeling.</text></svg>