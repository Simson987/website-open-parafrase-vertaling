<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Recht, verlies en vrede</title><desc id="desc">Opbouw, onderscheiden stemmen en gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Recht, verlies en vrede</text><text x="44" y="113" class="ref">Jesaja 32:1–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Recht bestuur · 1–8</text><text x="68" y="241" class="body">Koning en vorsten als beschutting;</text><text x="68" y="284" class="body">dwaasheid en bedrog onderscheiden van</text><text x="68" y="327" class="body">edele daden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Waarschuwing · 9–14</text><text x="68" y="476" class="body">Zorgeloosheid, mislukte oogst, rouw,</text><text x="68" y="519" class="body">doorns en verlaten paleis en torens.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wending · 15–20</text><text x="68" y="668" class="body">Geest, vruchtbaarheid, recht en</text><text x="68" y="711" class="body">gerechtigheid; vrede, rust en veilig</text><text x="68" y="754" class="body">wonen.</text><text x="46" y="847" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst;</text><text x="46" y="883" class="note">bij redevoeringen wordt ook zichtbaar wie</text><text x="46" y="919" class="note">spreekt en wie antwoordt.</text></svg>