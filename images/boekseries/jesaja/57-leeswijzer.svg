<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Aanklacht en genezende troost</title><desc id="desc">Versgroepen en hun onderlinge samenhang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aanklacht en genezende troost</text><text x="44" y="113" class="ref">Jesaja 57:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rechtvaardigen · 1–2</text><text x="68" y="241" class="body">Hun wegname wordt niet verstaan; vrede</text><text x="68" y="284" class="body">en rust.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Afgoderij · 3–13</text><text x="68" y="433" class="body">Spot, gruwelijke offers, gladde stenen,</text><text x="68" y="476" class="body">hoogten, gezanten en vergeefse eigen</text><text x="68" y="519" class="body">kracht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Troost · 14–19</text><text x="68" y="668" class="body">Weg vrij; wonen bij nederigen, leiden</text><text x="68" y="711" class="body">en genezen; vrede voor ver en dichtbij.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Grens · 20–21</text><text x="68" y="860" class="body">Goddeloosheid als opgezweepte zee die</text><text x="68" y="903" class="body">slijk opwerpt; geen vrede.</text><text x="46" y="996" class="note">De leeswijzer bewaart de samenhang van belofte,</text><text x="46" y="1032" class="note">opdracht en aanklacht in de plaatselijke</text><text x="46" y="1068" class="note">hoofdstuktekst.</text></svg>