<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1021" viewBox="0 0 840 1021" role="img" aria-labelledby="title desc"><title id="title">Uitzending en aankomst</title><desc id="desc">Exact genoemde bestemmingen, opdracht en vervoerswijzen in de verzameling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1021" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uitzending en aankomst</text><text x="44" y="113" class="ref">Jesaja 66:18–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Genoemde bestemmingen · 19</text><text x="68" y="241" class="body">Tarsis, Pul, Lud, Tubal, Javan en de</text><text x="68" y="284" class="body">verre eilanden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Opdracht · 19</text><text x="68" y="433" class="body">Zijn heerlijkheid onder de volken</text><text x="68" y="476" class="body">verkondigen.</text><rect x="42" y="534" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Aankomst · 20–21</text><text x="68" y="625" class="body">Verwanten uit alle volken naar</text><text x="68" y="668" class="body">Jeruzalem: paarden, wagens,</text><text x="68" y="711" class="body">draagstoelen, muildieren en snelle</text><text x="68" y="754" class="body">kamelen; ook priesters en Levieten.</text><text x="46" y="847" class="note">Alle volken en talen worden verzameld. De</text><text x="46" y="883" class="note">volgorde loopt van uitgezondenen naar</text><text x="46" y="919" class="note">verkondiging en het brengen van de verwanten, in</text><text x="46" y="955" class="note">het beeld van een graanoffer.</text></svg>