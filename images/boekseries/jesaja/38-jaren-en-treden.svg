<svg xmlns="http://www.w3.org/2000/svg" width="840" height="856" viewBox="0 0 840 856" role="img" aria-labelledby="title desc"><title id="title">Vijftien jaar en tien treden</title><desc id="desc">De precieze aantallen en hun onderscheiden betekenis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="856" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijftien jaar en tien treden</text><text x="44" y="113" class="ref">Jesaja 38:5–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vijftien jaar · 5</text><text x="68" y="241" class="body">Toegevoegd aan Hizkia’s leven.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Bescherming · 6</text><text x="68" y="390" class="body">Hizkia en deze stad gered uit de hand</text><text x="68" y="433" class="body">van de koning van Assyrië.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Tien treden · 7–8</text><text x="68" y="582" class="body">De schaduw op de zonnewijzer van Achaz</text><text x="68" y="625" class="body">gaat tien treden terug.</text><text x="46" y="718" class="note">De levensverlenging en het schaduwteken hebben</text><text x="46" y="754" class="note">verschillende aantallen en functies. Het schema</text><text x="46" y="790" class="note">houdt vijftien en tien uit elkaar.</text></svg>