<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Bloei, bemoediging en terugkeer</title><desc id="desc">Opbouw, onderscheiden stemmen en gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bloei, bemoediging en terugkeer</text><text x="44" y="113" class="ref">Jesaja 35:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bloei · 1–2</text><text x="68" y="241" class="body">Woestijn en dor land; Libanon, Karmel</text><text x="68" y="284" class="body">en Saron.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bemoediging · 3–7</text><text x="68" y="433" class="body">Handen en knieën sterk; blinden zien,</text><text x="68" y="476" class="body">doven horen, springen en juichen; water</text><text x="68" y="519" class="body">in droogte.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De weg · 8–10</text><text x="68" y="668" class="body">Heilige weg zonder roofdier; de</text><text x="68" y="711" class="body">verlosten keren met blijvende vreugde</text><text x="68" y="754" class="body">naar Sion terug.</text><text x="46" y="847" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst;</text><text x="46" y="883" class="note">bij redevoeringen wordt ook zichtbaar wie</text><text x="46" y="919" class="note">spreekt en wie antwoordt.</text></svg>