<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Kom, luister en keer terug</title><desc id="desc">Versgroepen en hun onderlinge samenhang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kom, luister en keer terug</text><text x="44" y="113" class="ref">Jesaja 55:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uitnodiging · 1–5</text><text x="68" y="241" class="body">Water, wijn, melk en goed voedsel</text><text x="68" y="284" class="body">zonder prijs; luisteren en het verbond</text><text x="68" y="327" class="body">met David.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Omkeer · 6–9</text><text x="68" y="476" class="body">Zoeken, aanroepen en wegen verlaten;</text><text x="68" y="519" class="body">hogere wegen en gedachten.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Werkzaam woord · 10–13</text><text x="68" y="668" class="body">Regen en sneeuw, zaad en brood; woord</text><text x="68" y="711" class="body">doet zijn werk, vreugde en andere</text><text x="68" y="754" class="body">bomen.</text><text x="46" y="847" class="note">De leeswijzer bewaart de samenhang van belofte,</text><text x="46" y="883" class="note">opdracht en aanklacht in de plaatselijke</text><text x="46" y="919" class="note">hoofdstuktekst.</text></svg>