<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Oordeel, herinnering en gebed</title><desc id="desc">Volledige hoofdstukopbouw met gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oordeel, herinnering en gebed</text><text x="44" y="113" class="ref">Jesaja 63:1–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vraag en antwoord · 1–6</text><text x="68" y="241" class="body">Edom en Bozra; rood gewaad,</text><text x="68" y="284" class="body">wijnpersvergelijking en alleen</text><text x="68" y="327" class="body">uitgevoerd oordeel.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Goedheid en opstand · 7–14</text><text x="68" y="476" class="body">Verlossing, gedragen volk, bedroefde</text><text x="68" y="519" class="body">Geest, Mozes, zeeweg en rust.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Gebed · 15–19</text><text x="68" y="668" class="body">Vraag naar barmhartigheid; U bent onze</text><text x="68" y="711" class="body">Vader, keer terug en zie het vertrapte</text><text x="68" y="754" class="body">heiligdom.</text><text x="46" y="847" class="note">Aanspraak, herinnering, vergelijking en belofte</text><text x="46" y="883" class="note">zijn in hun eigen verband weergegeven. De</text><text x="46" y="919" class="note">versgroepen volgen deze hoofdstuktekst.</text></svg>