<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Valse zekerheid en wijze maat</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Valse zekerheid en wijze maat</text><text x="44" y="113" class="ref">Jesaja 28:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Trots en weigering · 1–13</text><text x="68" y="241" class="body">Verwelkende kroon, drank, falend recht</text><text x="68" y="284" class="body">en niet luisteren naar aangeboden rust.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Grond en maat · 14–22</text><text x="68" y="433" class="body">Leugen als toevlucht tegenover</text><text x="68" y="476" class="body">hoeksteen, recht als meetlint en</text><text x="68" y="519" class="body">gerechtigheid als schietlood.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Landbouw · 23–29</text><text x="68" y="668" class="body">Ploegen kent een doel; zaaien en dorsen</text><text x="68" y="711" class="body">passen bij het gewas en gaan niet</text><text x="68" y="754" class="body">eindeloos door.</text><text x="46" y="847" class="note">De versgroepen verbinden de onderscheiden</text><text x="46" y="883" class="note">stemmen, vergelijkingen en beloften in de</text><text x="46" y="919" class="note">plaatselijke tekst.</text></svg>