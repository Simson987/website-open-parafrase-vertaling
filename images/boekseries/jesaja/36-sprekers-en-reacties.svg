<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Wie spreekt en wie antwoordt</title><desc id="desc">De drie groepen en hun precieze rol in de ontmoeting.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie spreekt en wie antwoordt</text><text x="44" y="113" class="ref">Jesaja 36:2–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rabsake</text><text x="68" y="241" class="body">Vertegenwoordigt de koning van Assyrië;</text><text x="68" y="284" class="body">spreekt luid in het Judees.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eljakim, Sebna en Joah</text><text x="68" y="433" class="body">Vragen om Aramees en brengen ten slotte</text><text x="68" y="476" class="body">verslag uit aan Hizkia.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Mensen op de muur</text><text x="68" y="625" class="body">Luisteren, maar antwoorden niet: de</text><text x="68" y="668" class="body">koning heeft dat bevolen.</text><text x="46" y="761" class="note">De bedreigingen en beloften van Rabsake zijn</text><text x="46" y="797" class="note">zijn woorden. Zij worden onderscheiden van de</text><text x="46" y="833" class="note">vertellersinformatie en de reactie van Juda.</text></svg>