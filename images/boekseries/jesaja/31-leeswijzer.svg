<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Menselijke hulp en bescherming</title><desc id="desc">Opbouw, onderscheiden stemmen en gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Menselijke hulp en bescherming</text><text x="44" y="113" class="ref">Jesaja 31:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vertrouwen · 1–3</text><text x="68" y="241" class="body">Paarden en wagens uit Egypte; helpers</text><text x="68" y="284" class="body">en geholpenen vallen samen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vergelijkingen · 4–5</text><text x="68" y="433" class="body">Onbevreesde leeuw en beschermende</text><text x="68" y="476" class="body">vogels bij Sion.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Omkeer · 6–9</text><text x="68" y="625" class="body">Afgoden weg; Assur valt niet door een</text><text x="68" y="668" class="body">mensenzwaard.</text><text x="46" y="761" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst;</text><text x="46" y="797" class="note">bij redevoeringen wordt ook zichtbaar wie</text><text x="46" y="833" class="note">spreekt en wie antwoordt.</text></svg>