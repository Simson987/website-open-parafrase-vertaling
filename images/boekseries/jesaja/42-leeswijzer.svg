<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1021" viewBox="0 0 840 1021" role="img" aria-labelledby="title desc"><title id="title">Recht en het niet horen</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1021" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Recht en het niet horen</text><text x="44" y="113" class="ref">Jesaja 42:1–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Knecht · 1–9</text><text x="68" y="241" class="body">Geest, zachtmoedig recht, verbond,</text><text x="68" y="284" class="body">licht, geopende ogen en vrijgelaten</text><text x="68" y="327" class="body">gevangenen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Nieuw lied · 10–17</text><text x="68" y="476" class="body">Van zee tot woestijn; krachtig</text><text x="68" y="519" class="body">ingrijpen, onbekende paden en</text><text x="68" y="562" class="body">beschaamde beeldvertrouwers.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Aanklacht · 18–25</text><text x="68" y="711" class="body">Een blinde knecht en dove bode; beroofd</text><text x="68" y="754" class="body">volk en geweigerde wegen en wet.</text><text x="46" y="847" class="note">De leeswijzer verbindt belofte en aanklacht en</text><text x="46" y="883" class="note">maakt de wisselende aanspraak zichtbaar.</text><text x="46" y="919" class="note">Beeldspraak blijft verbonden met haar</text><text x="46" y="955" class="note">verscontext.</text></svg>