<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Recht, vrede en verzamelen</title><desc id="desc">Opbouw van de profetie met gecontroleerde namen en versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Recht, vrede en verzamelen</text><text x="44" y="113" class="ref">Jesaja 11:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Scheut · 1–5</text><text x="68" y="241" class="body">Isaï, Geest, ontzag, recht voor armen</text><text x="68" y="284" class="body">en trouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vredesvisioen · 6–9</text><text x="68" y="433" class="body">Vijandige dieren leven samen; niemand</text><text x="68" y="476" class="body">doet kwaad op de heilige berg.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verzamelen · 10–16</text><text x="68" y="625" class="body">Wortel en vaandel, terugkeer van de</text><text x="68" y="668" class="body">rest, verzoening van Efraïm en Juda en</text><text x="68" y="711" class="body">een gebaande weg.</text><text x="46" y="804" class="note">Aankondiging, beeldspraak en reactie hebben</text><text x="46" y="840" class="note">ieder hun plaats in de profetie. De versgroepen</text><text x="46" y="876" class="note">laten de samenhang van het hoofdstuk zien.</text></svg>