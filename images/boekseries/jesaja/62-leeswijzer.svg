<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Niet zwijgen over Sion</title><desc id="desc">Volledige hoofdstukopbouw met gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Niet zwijgen over Sion</text><text x="44" y="113" class="ref">Jesaja 62:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nieuwe naam · 1–5</text><text x="68" y="241" class="body">Gerechtigheid, glans, kroon, welbehagen</text><text x="68" y="284" class="body">en de vreugde van een bruidegom.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wachters en oogst · 6–9</text><text x="68" y="433" class="body">Geen rust tot herstel; de oogsters eten</text><text x="68" y="476" class="body">zelf koren en druiven.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Opgang · 10–12</text><text x="68" y="625" class="body">Weg bereiden, stenen weg, vaandel en</text><text x="68" y="668" class="body">komende redding; heilig en gezocht</text><text x="68" y="711" class="body">genoemd.</text><text x="46" y="804" class="note">Aanspraak, herinnering, vergelijking en belofte</text><text x="46" y="840" class="note">zijn in hun eigen verband weergegeven. De</text><text x="46" y="876" class="note">versgroepen volgen deze hoofdstuktekst.</text></svg>