<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Licht, aankomst en vrede</title><desc id="desc">Versgroepen en hun onderlinge samenhang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Licht, aankomst en vrede</text><text x="44" y="113" class="ref">Jesaja 60:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aankomst · 1–9</text><text x="68" y="241" class="body">Licht over Sion, terugkerende kinderen,</text><text x="68" y="284" class="body">kamelen, schapen, duivenbeeld en</text><text x="68" y="327" class="body">schepen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Stad · 10–18</text><text x="68" y="476" class="body">Muren, open poorten, hout, veranderde</text><text x="68" y="519" class="body">materialen, vrede en gerechtigheid.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Blijvend · 19–22</text><text x="68" y="668" class="body">Eeuwig licht, einde van rouw,</text><text x="68" y="711" class="body">rechtvaardig volk en de kleinste tot</text><text x="68" y="754" class="body">duizend.</text><text x="46" y="847" class="note">De leeswijzer bewaart de samenhang van belofte,</text><text x="46" y="883" class="note">opdracht en aanklacht in de plaatselijke</text><text x="46" y="919" class="note">hoofdstuktekst.</text></svg>