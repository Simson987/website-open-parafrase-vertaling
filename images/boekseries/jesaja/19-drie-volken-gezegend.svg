<svg xmlns="http://www.w3.org/2000/svg" width="840" height="770" viewBox="0 0 840 770" role="img" aria-labelledby="title desc"><title id="title">Drie volken gezegend</title><desc id="desc">De exacte koppeling tussen drie volken en hun benamingen in de zegen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="770" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie volken gezegend</text><text x="44" y="113" class="ref">Jesaja 19:23–25</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Egypte</text><text x="68" y="241" class="body">Mijn volk.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Assyrië</text><text x="68" y="390" class="body">Het werk van mijn handen.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Israël</text><text x="68" y="539" class="body">Mijn eigendom.</text><text x="46" y="632" class="note">In de slotbelofte dient men samen. De drie</text><text x="46" y="668" class="note">benamingen horen bij de drie genoemde volken;</text><text x="46" y="704" class="note">zij worden niet met elkaar verwisseld.</text></svg>