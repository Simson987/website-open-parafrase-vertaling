<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Toevlucht en het feestmaal</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toevlucht en het feestmaal</text><text x="44" y="113" class="ref">Jesaja 25:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lof · 1–5</text><text x="68" y="241" class="body">Trouwe plannen; gevallen vesting en</text><text x="68" y="284" class="body">beschutting voor armen en behoeftigen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Alle volken · 6–9</text><text x="68" y="433" class="body">Feestmaal, weggenomen sluier, dood</text><text x="68" y="476" class="body">verslonden en tranen afgeveegd; wachten</text><text x="68" y="519" class="body">en juichen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vernederde trots · 10–12</text><text x="68" y="668" class="body">Moab en zijn hoge vestingen worden</text><text x="68" y="711" class="body">neergehaald.</text><text x="46" y="804" class="note">De versgroepen verbinden de onderscheiden</text><text x="46" y="840" class="note">stemmen, vergelijkingen en beloften in de</text><text x="46" y="876" class="note">plaatselijke tekst.</text></svg>