<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Verlies, rest en omkeer</title><desc id="desc">Opbouw van de profetie met gecontroleerde namen en versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verlies, rest en omkeer</text><text x="44" y="113" class="ref">Jesaja 17:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Stad en oogst · 1–6</text><text x="68" y="241" class="body">Damaskus en Efraïm; Jakob als gemaaid</text><text x="68" y="284" class="body">koren, toch enkele olijven over.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kijken · 7–11</text><text x="68" y="433" class="body">Naar de Maker in plaats van eigen</text><text x="68" y="476" class="body">altaren; redding vergeten en een</text><text x="68" y="519" class="body">verdwijnende oogst.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Volken · 12–14</text><text x="68" y="668" class="body">Bruisend water, bestraffing en vlucht</text><text x="68" y="711" class="body">als kaf en distelpluis.</text><text x="46" y="804" class="note">Aankondiging, beeldspraak en reactie hebben</text><text x="46" y="840" class="note">ieder hun plaats in de profetie. De versgroepen</text><text x="46" y="876" class="note">laten de samenhang van het hoofdstuk zien.</text></svg>