<svg xmlns="http://www.w3.org/2000/svg" width="840" height="849" viewBox="0 0 840 849" role="img" aria-labelledby="title desc"><title id="title">Landen, steden en koningen</title><desc id="desc">De precies genoemde landen, steden, leiders en de richting van de dreiging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="849" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Landen, steden en koningen</text><text x="44" y="113" class="ref">Jesaja 7:1–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Syrië</text><text x="68" y="241" class="body">Hoofdstad Damaskus; koning Rezin.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Israël / Efraïm</text><text x="68" y="390" class="body">Samaria; Pekah, de zoon van Remalia.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Juda</text><text x="68" y="539" class="body">Jeruzalem; Achaz, zoon van Jotham, zoon</text><text x="68" y="582" class="body">van Uzzia.</text><text x="46" y="675" class="note">Syrië en Efraïm trekken samen tegen Juda op.</text><text x="46" y="711" class="note">Jesaja en zijn zoon Schear-Jaschub moeten Achaz</text><text x="46" y="747" class="note">ontmoeten. De zoon van Tabeal is hun beoogde</text><text x="46" y="783" class="note">vervanger, geen reeds regerende koning.</text></svg>