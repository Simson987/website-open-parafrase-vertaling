<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Welkom en falende wachters</title><desc id="desc">Versgroepen en hun onderlinge samenhang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Welkom en falende wachters</text><text x="44" y="113" class="ref">Jesaja 56:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Recht en sabbat · 1–2</text><text x="68" y="241" class="body">Gerechtigheid, komende redding en de</text><text x="68" y="284" class="body">hand van kwaad terughouden.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Niet buitengesloten · 3–8</text><text x="68" y="433" class="body">Vreemdeling en ontmande; naam en</text><text x="68" y="476" class="body">plaats, verbond en een huis van gebed</text><text x="68" y="519" class="body">voor alle volken.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Aanklacht · 9–12</text><text x="68" y="668" class="body">Blinde wachters als stomme honden; geen</text><text x="68" y="711" class="body">begrip, eigen winst, slaap en drank.</text><text x="46" y="804" class="note">De leeswijzer bewaart de samenhang van belofte,</text><text x="46" y="840" class="note">opdracht en aanklacht in de plaatselijke</text><text x="46" y="876" class="note">hoofdstuktekst.</text></svg>