<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Horen en verzamelde volken</title><desc id="desc">Volledige hoofdstukopbouw met gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Horen en verzamelde volken</text><text x="44" y="113" class="ref">Jesaja 66:1–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Horen · 1–6</text><text x="68" y="241" class="body">Geen gebouw omvat de Maker; nederige</text><text x="68" y="284" class="body">luisteraar tegenover gekozen gruwelen</text><text x="68" y="327" class="body">en niet antwoorden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Troost · 7–14</text><text x="68" y="476" class="body">Sion baart, Jeruzalem verheugt, vrede</text><text x="68" y="519" class="body">als rivier en troost als van een</text><text x="68" y="562" class="body">moeder.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Oordeel en verzamelen · 15–21</text><text x="68" y="711" class="body">Vuur en vergelding; alle talen,</text><text x="68" y="754" class="body">uitgezondenen en verwanten naar</text><text x="68" y="797" class="body">Jeruzalem.</text><rect x="42" y="855" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Blijven · 22–24</text><text x="68" y="946" class="body">Nageslacht en naam blijven,</text><text x="68" y="989" class="body">gezamenlijke aanbidding en het</text><text x="68" y="1032" class="body">afschrikwekkende slot over de</text><text x="68" y="1075" class="body">opstandigen.</text><text x="46" y="1168" class="note">Aanspraak, herinnering, vergelijking en belofte</text><text x="46" y="1204" class="note">zijn in hun eigen verband weergegeven. De</text><text x="46" y="1240" class="note">versgroepen volgen deze hoofdstuktekst.</text></svg>