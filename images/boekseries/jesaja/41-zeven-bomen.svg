<svg xmlns="http://www.w3.org/2000/svg" width="840" height="892" viewBox="0 0 840 892" role="img" aria-labelledby="title desc"><title id="title">Zeven bomen in de wildernis</title><desc id="desc">De zeven exact genoemde bomen en hun plaats in de waterbelofte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="892" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeven bomen in de wildernis</text><text x="44" y="113" class="ref">Jesaja 41:18–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste vier · vers 19</text><text x="68" y="241" class="body">Ceder; acacia; mirte; olijfboom.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Nog drie · vers 19</text><text x="68" y="390" class="body">Cipres; olm; buksboom.</text><rect x="42" y="448" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Context · 18, 20</text><text x="68" y="539" class="body">Water op kale hoogten en dor land;</text><text x="68" y="582" class="body">zien, erkennen, overwegen en begrijpen</text><text x="68" y="625" class="body">wie dit geschapen heeft.</text><text x="46" y="718" class="note">De lijst bevat vier plus drie boomnamen. De</text><text x="46" y="754" class="note">volgorde en benamingen volgen deze vertaling; er</text><text x="46" y="790" class="note">worden geen andere soorten voor in de plaats</text><text x="46" y="826" class="note">gezet.</text></svg>