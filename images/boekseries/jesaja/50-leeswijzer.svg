<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Horen, volhouden en vertrouwen</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Horen, volhouden en vertrouwen</text><text x="44" y="113" class="ref">Jesaja 50:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vragen · 1–3</text><text x="68" y="241" class="body">Geen hulpeloosheid bij de Redder;</text><text x="68" y="284" class="body">schuld en het uitblijvende antwoord.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Leren en volhouden · 4–9</text><text x="68" y="433" class="body">Luisteren, vermoeiden bijstaan,</text><text x="68" y="476" class="body">mishandeling verdragen en nabij recht</text><text x="68" y="519" class="body">verwachten.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Keuze · 10–11</text><text x="68" y="668" class="body">Vertrouwen in het donker tegenover</text><text x="68" y="711" class="body">lopen in zelf aangestoken vuur.</text><text x="46" y="804" class="note">De leeswijzer verbindt belofte en aanklacht en</text><text x="46" y="840" class="note">maakt de wisselende aanspraak zichtbaar.</text><text x="46" y="876" class="note">Beeldspraak blijft verbonden met haar</text><text x="46" y="912" class="note">verscontext.</text></svg>