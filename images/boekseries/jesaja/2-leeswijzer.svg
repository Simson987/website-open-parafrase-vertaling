<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Vrede en gebogen hoogmoed</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrede en gebogen hoogmoed</text><text x="44" y="113" class="ref">Jesaja 2:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Toekomst · 1–5</text><text x="68" y="241" class="body">Volken naar Sion; onderwijs, recht en</text><text x="68" y="284" class="body">wapens tot landbouwgereedschap.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aanklacht · 6–9</text><text x="68" y="433" class="body">Schatten, paarden en eigen gemaakte</text><text x="68" y="476" class="body">afgoden.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dag · 10–22</text><text x="68" y="625" class="body">Menselijke hoogte wordt gebogen;</text><text x="68" y="668" class="body">grotten, weggeworpen afgoden en de</text><text x="68" y="711" class="body">grens van menselijk vertrouwen.</text><text x="46" y="804" class="note">De leeswijzer onderscheidt aanklacht, visioen,</text><text x="46" y="840" class="note">vergelijking en aangekondigde toekomst.</text><text x="46" y="876" class="note">Versverwijzingen volgen de plaatselijke</text><text x="46" y="912" class="note">hoofdstukindeling.</text></svg>