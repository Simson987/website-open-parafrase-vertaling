<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Gekozen, geholpen en gehoord</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gekozen, geholpen en gehoord</text><text x="44" y="113" class="ref">Jesaja 41:1–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voor het gerecht · 1–7</text><text x="68" y="241" class="body">Volken en de geroepene; makers moedigen</text><text x="68" y="284" class="body">elkaar aan bij hun vastgespijkerde</text><text x="68" y="327" class="body">beeld.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jakob · 8–20</text><text x="68" y="476" class="body">Gekozen knecht; niet vrezen, hulp,</text><text x="68" y="519" class="body">dorsslee, water en bomen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Uitdaging · 21–29</text><text x="68" y="668" class="body">Vertel wat komt; geen antwoord van de</text><text x="68" y="711" class="body">beelden, wel de beloofde boodschapper.</text><text x="46" y="804" class="note">De leeswijzer verbindt belofte en aanklacht en</text><text x="46" y="840" class="note">maakt de wisselende aanspraak zichtbaar.</text><text x="46" y="876" class="note">Beeldspraak blijft verbonden met haar</text><text x="46" y="912" class="note">verscontext.</text></svg>