<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Van dank naar bekendmaken</title><desc id="desc">Opbouw van de profetie met gecontroleerde namen en versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van dank naar bekendmaken</text><text x="44" y="113" class="ref">Jesaja 12:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Persoonlijk · 1–2</text><text x="68" y="241" class="body">Dank, voorbijgaande toorn, troost,</text><text x="68" y="284" class="body">vertrouwen en redding.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Samen · 3</text><text x="68" y="433" class="body">Met vreugde putten uit de bronnen van</text><text x="68" y="476" class="body">redding.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Naar buiten · 4–6</text><text x="68" y="625" class="body">Danken, aanroepen, daden bekendmaken,</text><text x="68" y="668" class="body">zingen en juichen in Sion.</text><text x="46" y="761" class="note">Aankondiging, beeldspraak en reactie hebben</text><text x="46" y="797" class="note">ieder hun plaats in de profetie. De versgroepen</text><text x="46" y="833" class="note">laten de samenhang van het hoofdstuk zien.</text></svg>