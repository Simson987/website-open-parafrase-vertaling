<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Rust en de gevallen heerser</title><desc id="desc">Opbouw van de profetie met gecontroleerde namen en versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rust en de gevallen heerser</text><text x="44" y="113" class="ref">Jesaja 14:1–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Terugkeer en rust · 1–3</text><text x="68" y="241" class="body">Jakob opnieuw in eigen land; einde van</text><text x="68" y="284" class="body">harde dienst.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Spotlied · 4–23</text><text x="68" y="433" class="body">Koning van Babel, gebroken scepter,</text><text x="68" y="476" class="body">gevallen morgenster en vernederde</text><text x="68" y="519" class="body">trots.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Assur · 24–27</text><text x="68" y="668" class="body">Het besluit om juk en last te</text><text x="68" y="711" class="body">verbreken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Filistea · 28–32</text><text x="68" y="860" class="body">Niet te vroeg juichen; dreiging en</text><text x="68" y="903" class="body">toevlucht voor verdrukten in Sion.</text><text x="46" y="996" class="note">Aankondiging, beeldspraak en reactie hebben</text><text x="46" y="1032" class="note">ieder hun plaats in de profetie. De versgroepen</text><text x="46" y="1068" class="note">laten de samenhang van het hoofdstuk zien.</text></svg>