<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Drie lasten en de wachter</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie lasten en de wachter</text><text x="44" y="113" class="ref">Jesaja 21:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Woestijn aan de zee · 1–10</text><text x="68" y="241" class="body">Elam en Media; hard visioen, wachter,</text><text x="68" y="284" class="body">wagens en het bericht: Babel gevallen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Duma · 11–12</text><text x="68" y="433" class="body">Een roep uit Seïr: hoe ver is de nacht?</text><text x="68" y="476" class="body">De morgen komt, en ook de nacht.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Arabië · 13–17</text><text x="68" y="625" class="body">Dedanieten, water en brood uit Thema</text><text x="68" y="668" class="body">voor vluchtelingen; binnen één jaar</text><text x="68" y="711" class="body">Kedars eer voorbij.</text><text x="46" y="804" class="note">De versgroepen verbinden de onderscheiden</text><text x="46" y="840" class="note">stemmen, vergelijkingen en beloften in de</text><text x="46" y="876" class="note">plaatselijke tekst.</text></svg>