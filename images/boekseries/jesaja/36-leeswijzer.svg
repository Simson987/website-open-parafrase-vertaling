<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Een dreigende stem bij de muur</title><desc id="desc">Opbouw, onderscheiden stemmen en gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een dreigende stem bij de muur</text><text x="44" y="113" class="ref">Jesaja 36:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ontmoeting · 1–10</text><text x="68" y="241" class="body">Sanherib; Rabsake uit Lachis bij de</text><text x="68" y="284" class="body">waterloop; Eljakim, Sebna en Joah.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Taal en druk · 11–20</text><text x="68" y="433" class="body">Aramees gevraagd, Judees geroepen;</text><text x="68" y="476" class="body">beloofde overvloed tegenover twijfel</text><text x="68" y="519" class="body">aan redding.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Reactie · 21–22</text><text x="68" y="668" class="body">Zwijgen op bevel; gescheurde kleren en</text><text x="68" y="711" class="body">verslag aan Hizkia.</text><text x="46" y="804" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst;</text><text x="46" y="840" class="note">bij redevoeringen wordt ook zichtbaar wie</text><text x="46" y="876" class="note">spreekt en wie antwoordt.</text></svg>