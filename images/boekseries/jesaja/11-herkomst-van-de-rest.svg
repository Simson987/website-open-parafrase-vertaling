<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1064" viewBox="0 0 840 1064" role="img" aria-labelledby="title desc"><title id="title">Waarvandaan de rest terugkomt</title><desc id="desc">De acht genoemde herkomstgebieden en de beelden van de terugweg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1064" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarvandaan de rest terugkomt</text><text x="44" y="113" class="ref">Jesaja 11:11–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Genoemd in vers 11</text><text x="68" y="241" class="body">Assyrië; Egypte; Pathros; Ethiopië;</text><text x="68" y="284" class="body">Elam; Sinear; Hamath; eilanden van de</text><text x="68" y="327" class="body">zee.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Verzamelen · 12–13</text><text x="68" y="476" class="body">Verdrevenen van Israël en verstrooiden</text><text x="68" y="519" class="body">van Juda; geen jaloezie of benauwen</text><text x="68" y="562" class="body">tussen Efraïm en Juda.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Doorgang · 15–16</text><text x="68" y="711" class="body">De zeearm droog; de rivier in zeven</text><text x="68" y="754" class="body">beken; een gebaande weg voor de rest</text><text x="68" y="797" class="body">uit Assur.</text><text x="46" y="890" class="note">Dit schema geeft de genoemde herkomsten en</text><text x="46" y="926" class="note">beelden weer. Het ordent de opsomming zonder</text><text x="46" y="962" class="note">extra landen of geografische grenzen toe te</text><text x="46" y="998" class="note">voegen.</text></svg>