<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Lasten dragen of gedragen worden</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lasten dragen of gedragen worden</text><text x="44" y="113" class="ref">Jesaja 46:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beelden · 1–2</text><text x="68" y="241" class="body">Bel en Nebo als last op vermoeide</text><text x="68" y="284" class="body">dieren; beelden zelf in ballingschap.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gedragen · 3–4</text><text x="68" y="433" class="body">Jakob en Israël gedragen vanaf geboorte</text><text x="68" y="476" class="body">tot grijze ouderdom.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vergelijken · 5–11</text><text x="68" y="625" class="body">Betaalde goudsmid, opgetild beeld dat</text><text x="68" y="668" class="body">niet antwoordt; het blijvende plan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dichtbij · 12–13</text><text x="68" y="817" class="body">Gerechtigheid en redding komen</text><text x="68" y="860" class="body">dichtbij; redding in Sion.</text><text x="46" y="953" class="note">De leeswijzer verbindt belofte en aanklacht en</text><text x="46" y="989" class="note">maakt de wisselende aanspraak zichtbaar.</text><text x="46" y="1025" class="note">Beeldspraak blijft verbonden met haar</text><text x="46" y="1061" class="note">verscontext.</text></svg>