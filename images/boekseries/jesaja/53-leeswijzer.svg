<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">De Knecht en onze schuld</title><desc id="desc">Versgroepen en hun onderlinge samenhang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De Knecht en onze schuld</text><text x="44" y="113" class="ref">Jesaja 53:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet geacht · 1–3</text><text x="68" y="241" class="body">Ongeloof, wortel uit dorre grond en de</text><text x="68" y="284" class="body">verachte Man van smarten.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onze schuld · 4–6</text><text x="68" y="433" class="body">Onze ziekten en smarten; verwond om</text><text x="68" y="476" class="body">onze overtredingen; wij als dwalende</text><text x="68" y="519" class="body">schapen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zwijgen en graf · 7–9</text><text x="68" y="668" class="body">Lam, dwang en recht, afgesneden leven</text><text x="68" y="711" class="body">en graf; geen onrecht of bedrog.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Gevolg · 10–12</text><text x="68" y="860" class="body">Schuldoffer, velen rechtvaardig, schuld</text><text x="68" y="903" class="body">dragen, deel ontvangen en voor</text><text x="68" y="946" class="body">overtreders bidden.</text><text x="46" y="1039" class="note">De leeswijzer bewaart de samenhang van belofte,</text><text x="46" y="1075" class="note">opdracht en aanklacht in de plaatselijke</text><text x="46" y="1111" class="note">hoofdstuktekst.</text></svg>