<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">Knecht en niet vergeten Sion</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Knecht en niet vergeten Sion</text><text x="44" y="113" class="ref">Jesaja 49:1–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Roeping · 1–7</text><text x="68" y="241" class="body">Mond als zwaard, pijl, knecht Israël;</text><text x="68" y="284" class="body">Jakob terugbrengen en licht tot aan het</text><text x="68" y="327" class="body">einde.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Herstel · 8–13</text><text x="68" y="476" class="body">Verbond, erfdelen, gevangenen vrij,</text><text x="68" y="519" class="body">wegen en water; ontferming en gejuich.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Sion · 14–23</text><text x="68" y="668" class="body">Niet vergeten als een moeder; muren,</text><text x="68" y="711" class="body">terugkerende kinderen en te kleine</text><text x="68" y="754" class="body">woonruimte.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Bevrijding · 24–26</text><text x="68" y="903" class="body">Buit van de tiran ontkomt; de kinderen</text><text x="68" y="946" class="body">verlost en de Redder bekend.</text><text x="46" y="1039" class="note">De leeswijzer verbindt belofte en aanklacht en</text><text x="46" y="1075" class="note">maakt de wisselende aanspraak zichtbaar.</text><text x="46" y="1111" class="note">Beeldspraak blijft verbonden met haar</text><text x="46" y="1147" class="note">verscontext.</text></svg>