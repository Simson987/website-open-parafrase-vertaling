<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Vasten dat onrecht losmaakt</title><desc id="desc">Versgroepen en hun onderlinge samenhang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vasten dat onrecht losmaakt</text><text x="44" y="113" class="ref">Jesaja 58:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Klacht · 1–5</text><text x="68" y="241" class="body">Vasten naast eigen voordeel, opgedreven</text><text x="68" y="284" class="body">werkers en ruzie.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gekozen vasten · 6–7</text><text x="68" y="433" class="body">Boeien los, verdrukten vrij; brood,</text><text x="68" y="476" class="body">onderdak en kleding, eigen familie niet</text><text x="68" y="519" class="body">ontlopen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Belofte en weg · 8–12</text><text x="68" y="668" class="body">Antwoord, licht, verzadiging,</text><text x="68" y="711" class="body">besproeide tuin en herstelde bressen en</text><text x="68" y="754" class="body">paden.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Sabbat · 13–14</text><text x="68" y="903" class="body">Geen eigen zin; de dag eren en vreugde</text><text x="68" y="946" class="body">vinden in de HEERE.</text><text x="46" y="1039" class="note">De leeswijzer bewaart de samenhang van belofte,</text><text x="46" y="1075" class="note">opdracht en aanklacht in de plaatselijke</text><text x="46" y="1111" class="note">hoofdstuktekst.</text></svg>