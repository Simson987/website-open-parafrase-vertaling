<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Troost en vernieuwde kracht</title><desc id="desc">Opbouw, onderscheiden stemmen en gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Troost en vernieuwde kracht</text><text x="44" y="113" class="ref">Jesaja 40:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Troost en roep · 1–11</text><text x="68" y="241" class="body">Verzoende schuld, rechte weg, blijvend</text><text x="68" y="284" class="body">woord, goed nieuws en herderlijke zorg.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onvergelijkbaar · 12–26</text><text x="68" y="433" class="body">Water en bergen meten, volken als</text><text x="68" y="476" class="body">druppel; gemaakte beelden tegenover</text><text x="68" y="519" class="body">Schepper en sterren.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vernieuwen · 27–31</text><text x="68" y="668" class="body">Geen verborgen weg of vergeten recht;</text><text x="68" y="711" class="body">de vermoeide krijgt kracht en wie wacht</text><text x="68" y="754" class="body">loopt verder.</text><text x="46" y="847" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst;</text><text x="46" y="883" class="note">bij redevoeringen wordt ook zichtbaar wie</text><text x="46" y="919" class="note">spreekt en wie antwoordt.</text></svg>