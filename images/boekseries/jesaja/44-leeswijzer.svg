<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Gevormd, vergeten hout en herstel</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gevormd, vergeten hout en herstel</text><text x="44" y="113" class="ref">Jesaja 44:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zegen · 1–8</text><text x="68" y="241" class="body">Gekozen Jakob, water en Geest, groei</text><text x="68" y="284" class="body">als wilgen en de enige Rots.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Beelden · 9–20</text><text x="68" y="433" class="body">Vaklieden, gekapte boom, brandstof en</text><text x="68" y="476" class="body">beeld; geen inzicht in het gebruikte</text><text x="68" y="519" class="body">hout.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verlossing · 21–23</text><text x="68" y="668" class="body">Niet vergeten; overtredingen als nevel</text><text x="68" y="711" class="body">weggeveegd; terugkeer en gejuich.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Herstel · 24–28</text><text x="68" y="860" class="body">Maker en Verlosser; Jeruzalem en</text><text x="68" y="903" class="body">tempel; Kores als herder.</text><text x="46" y="996" class="note">De leeswijzer verbindt belofte en aanklacht en</text><text x="46" y="1032" class="note">maakt de wisselende aanspraak zichtbaar.</text><text x="46" y="1068" class="note">Beeldspraak blijft verbonden met haar</text><text x="46" y="1104" class="note">verscontext.</text></svg>