<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Assur en de terugkerende rest</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Assur en de terugkerende rest</text><text x="44" y="113" class="ref">Jesaja 10:1–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onrecht · 1–4</text><text x="68" y="241" class="body">Wetten beroven armen, weduwen en wezen;</text><text x="68" y="284" class="body">de dag van de afrekening.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Werktuig en trots · 5–19</text><text x="68" y="433" class="body">Assur als stok; eigen grootspraak, bijl</text><text x="68" y="476" class="body">en zaag, vuur en weinig bomen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Rest · 20–27</text><text x="68" y="625" class="body">Niet meer steunen op de onderdrukker;</text><text x="68" y="668" class="body">terugkeer, bemoediging en het verbroken</text><text x="68" y="711" class="body">juk.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Nadering en grens · 28–34</text><text x="68" y="860" class="body">De plaatsen vóór Jeruzalem; ten slotte</text><text x="68" y="903" class="body">worden hoge takken omgehakt.</text><text x="46" y="996" class="note">De leeswijzer onderscheidt aanklacht, visioen,</text><text x="46" y="1032" class="note">vergelijking en aangekondigde toekomst.</text><text x="46" y="1068" class="note">Versverwijzingen volgen de plaatselijke</text><text x="46" y="1104" class="note">hoofdstukindeling.</text></svg>