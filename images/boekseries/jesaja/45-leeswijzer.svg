<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Kores, de Maker en redding</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kores, de Maker en redding</text><text x="44" y="113" class="ref">Jesaja 45:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kores · 1–7</text><text x="68" y="241" class="body">Geroepen gezalfde; geopende poorten,</text><text x="68" y="284" class="body">schatten en de enige HEERE.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Maker · 8–13</text><text x="68" y="433" class="body">Regen van gerechtigheid, klei en Maker;</text><text x="68" y="476" class="body">stad en ballingen zonder losprijs.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Redding · 14–25</text><text x="68" y="625" class="body">Volken, eeuwige verlossing, bewoonbare</text><text x="68" y="668" class="body">aarde en de oproep tot alle einden.</text><text x="46" y="761" class="note">De leeswijzer verbindt belofte en aanklacht en</text><text x="46" y="797" class="note">maakt de wisselende aanspraak zichtbaar.</text><text x="46" y="833" class="note">Beeldspraak blijft verbonden met haar</text><text x="46" y="869" class="note">verscontext.</text></svg>