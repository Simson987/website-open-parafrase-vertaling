<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Goed nieuws en de Knecht</title><desc id="desc">Versgroepen en hun onderlinge samenhang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Goed nieuws en de Knecht</text><text x="44" y="113" class="ref">Jesaja 52:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sion · 1–6</text><text x="68" y="241" class="body">Kracht en kleding; banden los en</text><text x="68" y="284" class="body">verlossing zonder geld.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nieuws en vertrek · 7–12</text><text x="68" y="433" class="body">Boodschapper, wachters, juichende</text><text x="68" y="476" class="body">puinhopen en vertrek zonder haast.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Knecht · 13–15</text><text x="68" y="625" class="body">Verstandig handelen en verhoging;</text><text x="68" y="668" class="body">ontzetting over Zijn verwoeste gestalte</text><text x="68" y="711" class="body">en koningen die zwijgen.</text><text x="46" y="804" class="note">De leeswijzer bewaart de samenhang van belofte,</text><text x="46" y="840" class="note">opdracht en aanklacht in de plaatselijke</text><text x="46" y="876" class="note">hoofdstuktekst.</text></svg>