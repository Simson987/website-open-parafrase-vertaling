<svg xmlns="http://www.w3.org/2000/svg" width="840" height="707" viewBox="0 0 840 707" role="img" aria-labelledby="title desc"><title id="title">Namen van het gegeven Kind</title><desc id="desc">Namen en kenmerken van de aangekondigde heerschappij.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="707" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Namen van het gegeven Kind</text><text x="44" y="113" class="ref">Jesaja 9:5–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Namen · vers 5</text><text x="68" y="241" class="body">Wonderlijk; Raadsman; Sterke God;</text><text x="68" y="284" class="body">eeuwige Vader; Vredevorst.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Heerschappij · vers 6</text><text x="68" y="433" class="body">Op de troon van David; recht,</text><text x="68" y="476" class="body">gerechtigheid en vrede zonder einde.</text><text x="46" y="569" class="note">De aankondiging verbindt het gegeven Kind met de</text><text x="46" y="605" class="note">troon van David, recht, gerechtigheid en vrede</text><text x="46" y="641" class="note">zonder einde.</text></svg>