<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Verkeerde toevlucht en ontferming</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verkeerde toevlucht en ontferming</text><text x="44" y="113" class="ref">Jesaja 30:1–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Egypte · 1–7</text><text x="68" y="241" class="body">Eigen plannen, vergeefse hulp, goederen</text><text x="68" y="284" class="body">op ezels en kamelen; Rahab die stilzit.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Weigeren · 8–17</text><text x="68" y="433" class="body">Vastleggen van het woord; leugentaal</text><text x="68" y="476" class="body">gevraagd; muur en kruik breken; rust</text><text x="68" y="519" class="body">geweigerd en vlucht.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ontferming · 18–26</text><text x="68" y="668" class="body">Wachten, antwoord, onderwijs, de weg,</text><text x="68" y="711" class="body">beelden wegwerpen en overvloedige regen</text><text x="68" y="754" class="body">en oogst.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Lof en oordeel · 27–33</text><text x="68" y="903" class="body">Vuur- en waterbeelden, feestzang,</text><text x="68" y="946" class="body">fluitspel en het einde van Assur.</text><text x="46" y="1039" class="note">De versgroepen verbinden de onderscheiden</text><text x="46" y="1075" class="note">stemmen, vergelijkingen en beloften in de</text><text x="46" y="1111" class="note">plaatselijke tekst.</text></svg>