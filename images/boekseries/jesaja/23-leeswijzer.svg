<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Tyrus, handel en omkeer</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tyrus, handel en omkeer</text><text x="44" y="113" class="ref">Jesaja 23:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Val · 1–14</text><text x="68" y="241" class="body">Schepen van Tarsis, Sidon, graan van de</text><text x="68" y="284" class="body">Nijl, Chittim en vernederde</text><text x="68" y="327" class="body">handelstrots.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vergeten · 15–16</text><text x="68" y="476" class="body">Zeventig jaar; het lied van de vergeten</text><text x="68" y="519" class="body">vrouw met harp.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bestemming · 17–18</text><text x="68" y="668" class="body">Handel keert terug; opbrengst wordt</text><text x="68" y="711" class="body">niet opgepot maar dient voedsel en</text><text x="68" y="754" class="body">kleding voor wie voor de HEERE wonen.</text><text x="46" y="847" class="note">De versgroepen verbinden de onderscheiden</text><text x="46" y="883" class="note">stemmen, vergelijkingen en beloften in de</text><text x="46" y="919" class="note">plaatselijke tekst.</text></svg>