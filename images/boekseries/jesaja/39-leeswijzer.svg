<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Schatten en voorzegde afvoer</title><desc id="desc">Opbouw, onderscheiden stemmen en gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schatten en voorzegde afvoer</text><text x="44" y="113" class="ref">Jesaja 39:1–8</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bezoek · 1–2</text><text x="68" y="241" class="body">Merodach-Baladan stuurt boden, brieven</text><text x="68" y="284" class="body">en geschenk; Hizkia toont al zijn</text><text x="68" y="327" class="body">bezit.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vragen · 3–4</text><text x="68" y="476" class="body">Jesaja vraagt waarvandaan en wat zij</text><text x="68" y="519" class="body">zagen; Babel en alles in huis.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Aankondiging en reactie · 5–8</text><text x="68" y="668" class="body">Schatten en nakomelingen naar Babel;</text><text x="68" y="711" class="body">Hizkia denkt aan vrede in zijn eigen</text><text x="68" y="754" class="body">dagen.</text><text x="46" y="847" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst;</text><text x="46" y="883" class="note">bij redevoeringen wordt ook zichtbaar wie</text><text x="46" y="919" class="note">spreekt en wie antwoordt.</text></svg>