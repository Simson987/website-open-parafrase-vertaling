<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1021" viewBox="0 0 840 1021" role="img" aria-labelledby="title desc"><title id="title">Een rest onder beschutting</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1021" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een rest onder beschutting</text><text x="44" y="113" class="ref">Jesaja 4:1–6</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schande · 1</text><text x="68" y="241" class="body">Zeven vrouwen vragen één man zijn naam</text><text x="68" y="284" class="body">te dragen; zij zorgen voor eigen brood</text><text x="68" y="327" class="body">en kleding.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Heilig · 2–4</text><text x="68" y="476" class="body">Spruit, vrucht van het land,</text><text x="68" y="519" class="body">overgeblevenen en reiniging van Sion.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Beschut · 5–6</text><text x="68" y="668" class="body">Overdag wolk, in de nacht vuurgloed;</text><text x="68" y="711" class="body">schaduw en schuilplaats tegen storm en</text><text x="68" y="754" class="body">regen.</text><text x="46" y="847" class="note">De leeswijzer onderscheidt aanklacht, visioen,</text><text x="46" y="883" class="note">vergelijking en aangekondigde toekomst.</text><text x="46" y="919" class="note">Versverwijzingen volgen de plaatselijke</text><text x="46" y="955" class="note">hoofdstukindeling.</text></svg>