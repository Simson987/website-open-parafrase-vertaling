<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Aanklacht en herstel</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aanklacht en herstel</text><text x="44" y="113" class="ref">Jesaja 1:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Breuk · 1–9</text><text x="68" y="241" class="body">Juda en Jeruzalem; opstand, verwoesting</text><text x="68" y="284" class="body">en een kleine rest.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Omkeer · 10–20</text><text x="68" y="433" class="body">Offers en onrecht; leren recht doen,</text><text x="68" y="476" class="body">reinigen en luisteren.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Stad · 21–31</text><text x="68" y="625" class="body">Corrupte leiders; gezuiverd zilver,</text><text x="68" y="668" class="body">hersteld recht en verdorrende tuinen.</text><text x="46" y="761" class="note">De leeswijzer onderscheidt aanklacht, visioen,</text><text x="46" y="797" class="note">vergelijking en aangekondigde toekomst.</text><text x="46" y="833" class="note">Versverwijzingen volgen de plaatselijke</text><text x="46" y="869" class="note">hoofdstukindeling.</text></svg>