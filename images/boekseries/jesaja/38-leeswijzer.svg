<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Gebed, teken en danklied</title><desc id="desc">Opbouw, onderscheiden stemmen en gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, teken en danklied</text><text x="44" y="113" class="ref">Jesaja 38:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gebed · 1–3</text><text x="68" y="241" class="body">Ziekte, boodschap van Jesaja, gezicht</text><text x="68" y="284" class="body">naar de muur en tranen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Belofte en teken · 4–8</text><text x="68" y="433" class="body">Vijftien jaar erbij, bescherming en de</text><text x="68" y="476" class="body">schaduw tien treden terug.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dankgeschrift · 9–20</text><text x="68" y="625" class="body">Graf, tent, weefsel en vogels;</text><text x="68" y="668" class="body">genezing, vrede en de lof van levenden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Slotnotities · 21–22</text><text x="68" y="817" class="body">Vijgen als pleister en de vraag naar</text><text x="68" y="860" class="body">het teken van opgaan naar Gods huis.</text><text x="46" y="953" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst;</text><text x="46" y="989" class="note">bij redevoeringen wordt ook zichtbaar wie</text><text x="46" y="1025" class="note">spreekt en wie antwoordt.</text></svg>