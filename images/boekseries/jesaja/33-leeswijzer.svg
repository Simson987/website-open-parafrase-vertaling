<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Nood, recht en een rustige stad</title><desc id="desc">Opbouw, onderscheiden stemmen en gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nood, recht en een rustige stad</text><text x="44" y="113" class="ref">Jesaja 33:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gebed en nood · 1–9</text><text x="68" y="241" class="body">Verwoester, wachten, genade,</text><text x="68" y="284" class="body">vredesboden en verlaten wegen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rechtvaardig leven · 10–16</text><text x="68" y="433" class="body">Geen winst uit onderdrukking, geen</text><text x="68" y="476" class="body">omkoping of plannen met bloed; brood en</text><text x="68" y="519" class="body">water verzekerd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Sion · 17–24</text><text x="68" y="668" class="body">Koning, wijd land, onwrikbare tent,</text><text x="68" y="711" class="body">brede stromen, redding en vergeving.</text><text x="46" y="804" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst;</text><text x="46" y="840" class="note">bij redevoeringen wordt ook zichtbaar wie</text><text x="46" y="876" class="note">spreekt en wie antwoordt.</text></svg>