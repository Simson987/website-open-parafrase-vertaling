<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Babel verliest haar zekerheid</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Babel verliest haar zekerheid</text><text x="44" y="113" class="ref">Jesaja 47:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vernedering · 1–5</text><text x="68" y="241" class="body">De dochter van Babel van troon naar</text><text x="68" y="284" class="body">stof, handmolen en stilte.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aanklacht · 6–11</text><text x="68" y="433" class="body">Geen barmhartigheid voor ouderen;</text><text x="68" y="476" class="body">eigenwaan en plotseling verlies.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Geen redding · 12–15</text><text x="68" y="625" class="body">Bezweringen, hemelwaarnemers en</text><text x="68" y="668" class="body">handelaars helpen niet; de</text><text x="68" y="711" class="body">vuurvergelijking sluit af.</text><text x="46" y="804" class="note">De leeswijzer verbindt belofte en aanklacht en</text><text x="46" y="840" class="note">maakt de wisselende aanspraak zichtbaar.</text><text x="46" y="876" class="note">Beeldspraak blijft verbonden met haar</text><text x="46" y="912" class="note">verscontext.</text></svg>