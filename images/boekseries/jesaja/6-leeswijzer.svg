<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Visioen, reiniging en zending</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Visioen, reiniging en zending</text><text x="44" y="113" class="ref">Jesaja 6:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Visioen · 1–4</text><text x="68" y="241" class="body">In het sterfjaar van Uzzia: hoge troon,</text><text x="68" y="284" class="body">serafs, heilig-roep, bevende posten en</text><text x="68" y="327" class="body">rook.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Reiniging · 5–7</text><text x="68" y="476" class="body">Onreine lippen; een kool met de tang</text><text x="68" y="519" class="body">van het altaar; schuld weggenomen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zending · 8–10</text><text x="68" y="668" class="body">Hier ben ik; horen en niet begrijpen,</text><text x="68" y="711" class="body">zien en niet herkennen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Hoe lang? · 11–13</text><text x="68" y="860" class="body">Verlaten land; een tiende; stronk en</text><text x="68" y="903" class="body">heilig zaad als overblijvend beeld.</text><text x="46" y="996" class="note">De leeswijzer onderscheidt aanklacht, visioen,</text><text x="46" y="1032" class="note">vergelijking en aangekondigde toekomst.</text><text x="46" y="1068" class="note">Versverwijzingen volgen de plaatselijke</text><text x="46" y="1104" class="note">hoofdstukindeling.</text></svg>