<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">De namen van Sion</title><desc id="desc">Oude en nieuwe benamingen met hun verschillende aangesprokenen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De namen van Sion</text><text x="44" y="113" class="ref">Jesaja 62:4,12</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet meer · 4</text><text x="68" y="241" class="body">Verlatene; Verwoeste.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Wel · 4</text><text x="68" y="390" class="body">Mijn welbehagen is in haar; de Gehuwde.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Volk · 12</text><text x="68" y="539" class="body">Het heilige volk; de verlosten van de</text><text x="68" y="582" class="body">HEERE.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Stad · 12</text><text x="68" y="731" class="body">De Gezochte; de stad die niet verlaten</text><text x="68" y="774" class="body">is.</text><text x="46" y="867" class="note">De namen verwoorden het ontvangen welbehagen, de</text><text x="46" y="903" class="note">verbondenheid en het einde van verlatenheid.</text><text x="46" y="939" class="note">Volk en stad hebben elk hun eigen benamingen.</text></svg>