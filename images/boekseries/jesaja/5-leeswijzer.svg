<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1021" viewBox="0 0 840 1021" role="img" aria-labelledby="title desc"><title id="title">Wijngaard en wee-woorden</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1021" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijngaard en wee-woorden</text><text x="44" y="113" class="ref">Jesaja 5:1–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lied · 1–7</text><text x="68" y="241" class="body">Zorgvuldige aanleg, zure druiven en de</text><text x="68" y="284" class="body">uitleg: Israël en Juda; verwacht recht</text><text x="68" y="327" class="body">werd onrecht.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wee · 8–23</text><text x="68" y="476" class="body">Land stapelen, drank, spot, kwaad goed</text><text x="68" y="519" class="body">noemen, eigenwaan en omgekocht recht.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Oordeel · 24–30</text><text x="68" y="668" class="body">Vuurvergelijking, uitgestrekte hand en</text><text x="68" y="711" class="body">een snel naderend volk; donkerte over</text><text x="68" y="754" class="body">het land.</text><text x="46" y="847" class="note">De leeswijzer onderscheidt aanklacht, visioen,</text><text x="46" y="883" class="note">vergelijking en aangekondigde toekomst.</text><text x="46" y="919" class="note">Versverwijzingen volgen de plaatselijke</text><text x="46" y="955" class="note">hoofdstukindeling.</text></svg>