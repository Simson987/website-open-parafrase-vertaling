<svg xmlns="http://www.w3.org/2000/svg" width="840" height="919" viewBox="0 0 840 919" role="img" aria-labelledby="title desc"><title id="title">Vier veranderingen van materiaal</title><desc id="desc">De vier exacte materiaalwisselingen en de aansluitende bestuursbelofte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="919" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier veranderingen van materiaal</text><text x="44" y="113" class="ref">Jesaja 60:17–18</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In plaats van brons</text><text x="68" y="241" class="body">Goud.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">In plaats van ijzer</text><text x="68" y="390" class="body">Zilver.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">In plaats van hout</text><text x="68" y="539" class="body">Brons.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">In plaats van stenen</text><text x="68" y="688" class="body">IJzer.</text><text x="46" y="781" class="note">De materiaalbeelden worden gevolgd door vrede</text><text x="46" y="817" class="note">als opzichter en gerechtigheid als bestuur. De</text><text x="46" y="853" class="note">muren heten Redding en de poorten Lof.</text></svg>