<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Gebed en antwoord</title><desc id="desc">Opbouw, onderscheiden stemmen en gecontroleerde versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed en antwoord</text><text x="44" y="113" class="ref">Jesaja 37:1–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste boodschap · 1–13</text><text x="68" y="241" class="body">Rouw, gezantschap naar Jesaja,</text><text x="68" y="284" class="body">bemoediging en een nieuwe dreigbrief.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gebed · 14–20</text><text x="68" y="433" class="body">Brieven uitgespreid; erkenning van de</text><text x="68" y="476" class="body">ene Schepper en vraag om redding.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Antwoord en teken · 21–35</text><text x="68" y="625" class="body">Sanheribs trots begrensd; drie</text><text x="68" y="668" class="body">oogstjaren, wortel en vrucht; Jeruzalem</text><text x="68" y="711" class="body">beschermd.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Afloop · 36–38</text><text x="68" y="860" class="body">185.000 in het kamp; Sanherib naar</text><text x="68" y="903" class="body">Ninevé; zijn dood en Esar-Haddon als</text><text x="68" y="946" class="body">opvolger.</text><text x="46" y="1039" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst;</text><text x="46" y="1075" class="note">bij redevoeringen wordt ook zichtbaar wie</text><text x="46" y="1111" class="note">spreekt en wie antwoordt.</text></svg>