<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Stadsnood en beheerders</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stadsnood en beheerders</text><text x="44" y="113" class="ref">Jesaja 22:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Stad · 1–14</text><text x="68" y="241" class="body">Lawaai, vlucht, tranen, waterwerken en</text><text x="68" y="284" class="body">muren; geen blik naar de Maker.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sebna · 15–19</text><text x="68" y="433" class="body">Eigen hoog graf, prachtige wagens en</text><text x="68" y="476" class="body">verlies van ambt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Eljakim · 20–24</text><text x="68" y="625" class="body">Zoon van Hilkia; mantel, gordel, macht,</text><text x="68" y="668" class="body">sleutel en stevige pin.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Slot · 25</text><text x="68" y="817" class="body">De vastgeslagen pin raakt los en de</text><text x="68" y="860" class="body">eraan hangende last valt.</text><text x="46" y="953" class="note">De versgroepen verbinden de onderscheiden</text><text x="46" y="989" class="note">stemmen, vergelijkingen en beloften in de</text><text x="46" y="1025" class="note">plaatselijke tekst.</text></svg>