<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Elk gewas zijn eigen bewerking</title><desc id="desc">De exact verschillende zaai- en dorshandelingen bij de genoemde gewassen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elk gewas zijn eigen bewerking</text><text x="44" y="113" class="ref">Jesaja 28:24–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zaaien · 25</text><text x="68" y="241" class="body">Dille strooien, komijn zaaien; tarwe in</text><text x="68" y="284" class="body">rijen, gerst op zijn plek en spelt aan</text><text x="68" y="327" class="body">de rand.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dille en komijn · 27</text><text x="68" y="476" class="body">Dille met een stok, komijn met een</text><text x="68" y="519" class="body">staf; geen dorsslee of wagenwiel.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Broodkoren · 28</text><text x="68" y="668" class="body">Fijnmaken, maar niet eindeloos dorsen</text><text x="68" y="711" class="body">of verbrijzelen.</text><text x="46" y="804" class="note">De vergelijking vraagt aandacht voor passende</text><text x="46" y="840" class="note">maat, volgorde en begrenzing van bewerking. De</text><text x="46" y="876" class="note">landbouwhandelingen zijn geen reeks willekeurige</text><text x="46" y="912" class="note">straffen.</text></svg>