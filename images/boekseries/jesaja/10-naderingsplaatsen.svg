<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Plaatsen in de tekstvolgorde</title><desc id="desc">Exact genoemde plaatsen met hun onderscheiden handelingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plaatsen in de tekstvolgorde</text><text x="44" y="113" class="ref">Jesaja 10:28–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 28</text><text x="68" y="241" class="body">Ajath, Migron en Michmas: komst,</text><text x="68" y="284" class="body">doortocht en neergelegde uitrusting.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 29</text><text x="68" y="433" class="body">Bergpas en Geba; Rama beeft en Gibea</text><text x="68" y="476" class="body">van Saul vlucht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vers 30</text><text x="68" y="625" class="body">Gallim moet roepen; Laïs moet het</text><text x="68" y="668" class="body">horen; arm Anathoth.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vers 31</text><text x="68" y="817" class="body">Madmena vlucht; inwoners van Gebim</text><text x="68" y="860" class="body">zoeken veiligheid.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Vers 32</text><text x="68" y="1009" class="body">Nob: een gebalde vuist tegen Sion en</text><text x="68" y="1052" class="body">Jeruzalem.</text><text x="46" y="1145" class="note">Tekstvolgorde, geen kaart op schaal of bewezen</text><text x="46" y="1181" class="note">marsroute. Nadering, aanspreken en vluchten</text><text x="46" y="1217" class="note">hebben elk hun eigen formulering.</text></svg>