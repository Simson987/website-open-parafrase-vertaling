<svg xmlns="http://www.w3.org/2000/svg" width="840" height="771" viewBox="0 0 840 771"><title>Hout: brandstof en beeld</title><rect width="840" height="771" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Hout: brandstof en beeld</text><text x="42" y="105" font-size="25">Jesaja 44:14–19</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Een gekapte boom</text><path d="M470 215 V235 H75 V495.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 330.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Een deel als brandstof</text><text x="175" y="337" font-size="29">Zich warmen, brood bakken en vlees</text><text x="175" y="375" font-size="29">braden.</text><path d="M75 495.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="425" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="462" font-size="31" font-weight="700">De rest als beeld</text><text x="175" y="502" font-size="29">Een zelfgemaakt beeld om voor te</text><text x="175" y="540" font-size="29">knielen en om redding te vragen.</text><text x="42" y="612" font-size="26">De aanklacht zet de twee bestemmingen naast</text><text x="42" y="646" font-size="26">elkaar: beide gebruiken hetzelfde hout. Het</text><text x="42" y="680" font-size="26">onbegrip gaat om het niet herkennen van die</text><text x="42" y="714" font-size="26">tegenstelling.</text></g></svg>