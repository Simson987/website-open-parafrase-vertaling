<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Troost, luisteren en ontwaken</title><desc id="desc">Versgroepen en hun onderlinge samenhang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Troost, luisteren en ontwaken</text><text x="44" y="113" class="ref">Jesaja 51:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herkomst en belofte · 1–8</text><text x="68" y="241" class="body">Abraham en Sara; Sion als tuin,</text><text x="68" y="284" class="body">gerechtigheid en blijvende redding.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ontwaak · 9–16</text><text x="68" y="433" class="body">Herinnering aan de zeeweg, terugkeer en</text><text x="68" y="476" class="body">de Maker die troost.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jeruzalem · 17–23</text><text x="68" y="625" class="body">De beker van duizeling; niemand leidt</text><text x="68" y="668" class="body">haar, maar de beker wordt weggenomen.</text><text x="46" y="761" class="note">De leeswijzer bewaart de samenhang van belofte,</text><text x="46" y="797" class="note">opdracht en aanklacht in de plaatselijke</text><text x="46" y="833" class="note">hoofdstuktekst.</text></svg>