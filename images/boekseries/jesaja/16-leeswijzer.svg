<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Toevlucht, trots en rouw</title><desc id="desc">Opbouw van de profetie met gecontroleerde namen en versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toevlucht, trots en rouw</text><text x="44" y="113" class="ref">Jesaja 16:1–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Raad · 1–5</text><text x="68" y="241" class="body">Lammeren, verdrevenen beschermen, geen</text><text x="68" y="284" class="body">vluchtelingen verraden en een troon van</text><text x="68" y="327" class="body">recht.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Klacht · 6–12</text><text x="68" y="476" class="body">Trots van Moab, vernielde ranken,</text><text x="68" y="519" class="body">verdwenen oogstvreugde en verdriet.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Termijn · 13–14</text><text x="68" y="668" class="body">Binnen drie jaar wordt Moabs eer</text><text x="68" y="711" class="body">veracht; de rest is klein en</text><text x="68" y="754" class="body">machteloos.</text><text x="46" y="847" class="note">Aankondiging, beeldspraak en reactie hebben</text><text x="46" y="883" class="note">ieder hun plaats in de profetie. De versgroepen</text><text x="46" y="919" class="note">laten de samenhang van het hoofdstuk zien.</text></svg>