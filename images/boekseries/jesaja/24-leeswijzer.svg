<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Verwoesting en stemmen van lof</title><desc id="desc">Samenhang van de profetie met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verwoesting en stemmen van lof</text><text x="44" y="113" class="ref">Jesaja 24:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Allen · 1–6</text><text x="68" y="241" class="body">Maatschappelijke rollen bieden geen</text><text x="68" y="284" class="body">vrijstelling; wetten en verbond</text><text x="68" y="327" class="body">geschonden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Stad en oogst · 7–13</text><text x="68" y="476" class="body">Wijn en instrumenten zwijgen, stad en</text><text x="68" y="519" class="body">poort breken, een nalezing blijft.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Lof en klacht · 14–16</text><text x="68" y="668" class="body">Stemmen vanaf zee en aarde; toch klinkt</text><text x="68" y="711" class="body">de klacht over verraad.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Wankelen en regeren · 17–23</text><text x="68" y="860" class="body">Angst, kuil, strik en wankelende aarde;</text><text x="68" y="903" class="body">oordeel en de regering in Sion.</text><text x="46" y="996" class="note">De versgroepen verbinden de onderscheiden</text><text x="46" y="1032" class="note">stemmen, vergelijkingen en beloften in de</text><text x="46" y="1068" class="note">plaatselijke tekst.</text></svg>