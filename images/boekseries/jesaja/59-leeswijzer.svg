<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Schuld en de Verlosser</title><desc id="desc">Versgroepen en hun onderlinge samenhang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schuld en de Verlosser</text><text x="44" y="113" class="ref">Jesaja 59:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Scheiding · 1–8</text><text x="68" y="241" class="body">Zonden, leugen, geweld, eieren en</text><text x="68" y="284" class="body">webben; geen weg van vrede.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Belijdenis · 9–15</text><text x="68" y="433" class="body">Duister, tasten en wachten; eigen</text><text x="68" y="476" class="body">schuld erkend en waarheid op straat</text><text x="68" y="519" class="body">gevallen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ingrijpen · 16–21</text><text x="68" y="668" class="body">Geen voorbidder; gerechtigheid en</text><text x="68" y="711" class="body">redding als uitrusting; vergelding,</text><text x="68" y="754" class="body">Verlosser en blijvend verbondswoord.</text><text x="46" y="847" class="note">De leeswijzer bewaart de samenhang van belofte,</text><text x="46" y="883" class="note">opdracht en aanklacht in de plaatselijke</text><text x="46" y="919" class="note">hoofdstuktekst.</text></svg>