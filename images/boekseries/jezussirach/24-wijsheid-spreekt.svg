<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wie spreekt en waar zij rust vindt</title><desc id="desc">Wie spreekt en waar zij rust vindt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie spreekt en waar zij rust vindt</text><text x="44" y="113" class="ref">Jezus Sirach 24:1–12,20–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De stem · 1–7</text><text x="68" y="241" class="body">De gepersonifieerde wijsheid vertelt</text><text x="68" y="284" class="body">over haar oorsprong, rondgang en zoeken</text><text x="68" y="327" class="body">naar rust.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De opdracht · 8–9</text><text x="68" y="476" class="body">De Schepper laat haar tent rusten in</text><text x="68" y="519" class="body">Jakob, met erfdeel in Jeruzalem.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De worteling · 10–12</text><text x="68" y="668" class="body">Heilige tent, Sion, geheiligde stad en</text><text x="68" y="711" class="body">geëerd volk.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De uitleg · 20–26</text><text x="68" y="860" class="body">Moederlijke uitnodiging, blijvende</text><text x="68" y="903" class="body">vruchten en het boek van het verbond.</text><text x="46" y="996" class="note">De vrouwelijke ik-stem is de sprekende wijsheid</text><text x="46" y="1032" class="note">in deze lofrede.</text></svg>