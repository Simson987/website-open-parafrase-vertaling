<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Erfdeel en opvolging</title><desc id="desc">Erfdeel en opvolging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Erfdeel en opvolging</text><text x="44" y="113" class="ref">Jezus Sirach 45:25–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het levensonderhoud · 25–26</text><text x="68" y="241" class="body">Eerste opbrengst en offers als deel</text><text x="68" y="284" class="body">voor Aäron en zijn nageslacht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het erfdeel · 27</text><text x="68" y="433" class="body">Geen landdeel onder het volk; de Heere</text><text x="68" y="476" class="body">Zelf is het deel van zijn erfenis.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Pinehas · 28–30</text><text x="68" y="625" class="body">Het verbond van vrede verbindt inzet</text><text x="68" y="668" class="body">aan blijvende priesterlijke eer.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vergelijking · 31</text><text x="68" y="817" class="body">Een Davidszoon erft het koningschap;</text><text x="68" y="860" class="body">Aäron en zijn nageslacht het</text><text x="68" y="903" class="body">priesterschap.</text><text x="46" y="996" class="note">De tekst vergelijkt opvolging en erfdeel; het</text><text x="46" y="1032" class="note">schema maakt geen aanspraak op een volledige</text><text x="46" y="1068" class="note">geslachtslijst.</text></svg>