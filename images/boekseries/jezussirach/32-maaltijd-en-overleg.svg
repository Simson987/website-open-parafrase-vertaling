<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Tafelmanieren en overleg</title><desc id="desc">Tafelmanieren en overleg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tafelmanieren en overleg</text><text x="44" y="113" class="ref">Jezus Sirach 32:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De voorzitter · 1–3</text><text x="68" y="241" class="body">Eerst anderen verzorgen, dan zelf</text><text x="68" y="284" class="body">zitten en samen vreugde delen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sprekers en muziek · 4–11</text><text x="68" y="433" class="body">Ouderen spreken met kennis; jongeren</text><text x="68" y="476" class="body">kort en op verzoek; passende stilte</text><text x="68" y="519" class="body">eert muziek.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het vertrek · 12–14</text><text x="68" y="668" class="body">Op tijd naar huis en de Maker danken.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De levenshouding · 15–24</text><text x="68" y="817" class="body">Onderwijs, goede raad en overleg vóór</text><text x="68" y="860" class="body">handelen, met aandacht voor de weg en</text><text x="68" y="903" class="body">het gebod.</text><text x="46" y="996" class="note">De lessen over een passend moment aan tafel</text><text x="46" y="1032" class="note">lopen over in zorgvuldig handelen in het leven.</text></svg>