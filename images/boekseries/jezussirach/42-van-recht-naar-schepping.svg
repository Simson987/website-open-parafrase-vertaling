<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Van recht naar schepping</title><desc id="desc">Van recht naar schepping met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van recht naar schepping</text><text x="44" y="113" class="ref">Jezus Sirach 42:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Recht en verantwoording · 1–10</text><text x="68" y="241" class="body">Wet, eerlijk oordeel, bezit, gewichten,</text><text x="68" y="284" class="body">handel en geschreven administratie.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zorgen in het huis · 11–17</text><text x="68" y="433" class="body">De spreker beschrijft vaderlijke zorgen</text><text x="68" y="476" class="body">en scherpe uitspraken over omgang.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De overgang · 18–21</text><text x="68" y="625" class="body">Vanaf vers 18 volgt lof op de werken</text><text x="68" y="668" class="body">van de Schepper.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Kennis en samenhang · 22–31</text><text x="68" y="817" class="body">Niets blijft verborgen; de werken</text><text x="68" y="860" class="body">dienen en versterken elkaar.</text><text x="46" y="953" class="note">De huishoudelijke uitspraken en de lof op de</text><text x="46" y="989" class="note">schepping zijn verschillende delen van het</text><text x="46" y="1025" class="note">hoofdstuk.</text></svg>