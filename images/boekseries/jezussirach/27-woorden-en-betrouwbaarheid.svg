<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Woorden en betrouwbaarheid</title><desc id="desc">Woorden en betrouwbaarheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Woorden en betrouwbaarheid</text><text x="44" y="113" class="ref">Jezus Sirach 27:1–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De toets · 1–7</text><text x="68" y="241" class="body">Handel, zeef, oven en boomvrucht leiden</text><text x="68" y="284" class="body">naar het toetsen van een mens in zijn</text><text x="68" y="327" class="body">spreken.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De omgang · 8–15</text><text x="68" y="476" class="body">Recht, waarheid, bedachtzaamheid en</text><text x="68" y="519" class="body">waarschuwingen tegen ruzie.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het geheim · 16–22</text><text x="68" y="668" class="body">Verklappen tast vertrouwen aan; vogel</text><text x="68" y="711" class="body">en ree verbeelden het ongrijpbare</text><text x="68" y="754" class="body">verlies.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De terugslag · 23–30</text><text x="68" y="903" class="body">Zoete schijnwoorden, geworpen steen,</text><text x="68" y="946" class="body">kuil en strik laten kwaad op de dader</text><text x="68" y="989" class="body">terugkomen.</text><text x="46" y="1082" class="note">De eerste drie bestaande beelden horen bij de</text><text x="46" y="1118" class="note">toets; het vogelbeeld vult het afzonderlijke</text><text x="46" y="1154" class="note">vertrouwensdeel aan.</text></svg>