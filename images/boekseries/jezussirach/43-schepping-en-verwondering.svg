<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Schepping en verwondering</title><desc id="desc">Schepping en verwondering met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schepping en verwondering</text><text x="44" y="113" class="ref">Jezus Sirach 43:1–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aan de hemel · 1–13</text><text x="68" y="241" class="body">Hemel, zon, maan, sterren en regenboog</text><text x="68" y="284" class="body">wekken lof.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het weer · 14–24</text><text x="68" y="433" class="body">Wolken, sneeuw, bliksem, hagel, wind,</text><text x="68" y="476" class="body">rijp, ijs en dauw tonen</text><text x="68" y="519" class="body">verscheidenheid.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Op en in zee · 25–28</text><text x="68" y="668" class="body">Diepte, eilanden, zeevaarders en grote</text><text x="68" y="711" class="body">zeedieren.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De grens van kennis · 29–36</text><text x="68" y="860" class="body">Veel blijft verborgen; de lof gaat de</text><text x="68" y="903" class="body">volledige menselijke beschrijving te</text><text x="68" y="946" class="body">boven.</text><text x="46" y="1039" class="note">Het hoofdstuk is scheppingspoëzie; de beelden</text><text x="46" y="1075" class="note">zijn illustraties bij de genoemde</text><text x="46" y="1111" class="note">natuurverschijnselen.</text></svg>