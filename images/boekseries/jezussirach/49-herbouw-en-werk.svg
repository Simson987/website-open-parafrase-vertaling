<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Herbouw en het genoemde werk</title><desc id="desc">Herbouw en het genoemde werk met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herbouw en het genoemde werk</text><text x="44" y="113" class="ref">Jezus Sirach 49:13–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zerubbabel · 13–14</text><text x="68" y="241" class="body">Met een zegelring vergeleken; verbonden</text><text x="68" y="284" class="body">aan de tempelherbouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jesua, zoon van Josadak · 14</text><text x="68" y="433" class="body">Met Zerubbabel verbonden aan het weer</text><text x="68" y="476" class="body">oprichten van het heilige huis.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nehemia · 15</text><text x="68" y="625" class="body">Vervallen muren, poorten met grendels</text><text x="68" y="668" class="body">en herstel van de huisvloeren.</text><text x="46" y="761" class="note">De naam Jesua en zijn vader Josadak volgen de</text><text x="46" y="797" class="note">plaatselijke tekst. De zegelring is een</text><text x="46" y="833" class="note">vergelijking.</text></svg>