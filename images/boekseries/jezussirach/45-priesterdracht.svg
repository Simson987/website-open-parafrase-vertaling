<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De genoemde priesterdracht</title><desc id="desc">De genoemde priesterdracht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde priesterdracht</text><text x="44" y="113" class="ref">Jezus Sirach 45:7–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kleding · 9–11</text><text x="68" y="241" class="body">Onderkleding, lang gewaad, priesterrok,</text><text x="68" y="284" class="body">granaatappels en gouden belletjes.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Borstlap · 12–13</text><text x="68" y="433" class="body">Goud, blauwpurper, roodpurper,</text><text x="68" y="476" class="body">scharlaken en kostbare stenen als</text><text x="68" y="519" class="body">herinnering.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Hoofd · 14</text><text x="68" y="668" class="body">Gouden kroon boven de tulband, met</text><text x="68" y="711" class="body">zegel van heiligheid.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De dragers · 15–16</text><text x="68" y="860" class="body">De bijzondere kleding is verbonden aan</text><text x="68" y="903" class="body">Aäron en zijn nageslacht.</text><text x="46" y="996" class="note">De onderdelen volgen deze plaatselijke tekst;</text><text x="46" y="1032" class="note">details uit andere hoofdstukken worden niet als</text><text x="46" y="1068" class="note">nieuwe lijst toegevoegd.</text></svg>