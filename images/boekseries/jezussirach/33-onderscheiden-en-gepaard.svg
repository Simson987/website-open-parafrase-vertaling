<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Onderscheiden en gepaard</title><desc id="desc">Onderscheiden en gepaard met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onderscheiden en gepaard</text><text x="44" y="113" class="ref">Jezus Sirach 33:7–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De dagen · 7–9</text><text x="68" y="241" class="body">Dezelfde zon geeft licht, terwijl</text><text x="68" y="284" class="body">tijden, feesten en gewone dagen</text><text x="68" y="327" class="body">onderscheiden zijn.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De mensen · 10–14</text><text x="68" y="476" class="body">Allen uit aarde, met onderscheiden</text><text x="68" y="519" class="body">wegen; als klei in de hand van de</text><text x="68" y="562" class="body">Maker.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De paren · 15</text><text x="68" y="711" class="body">Goed en kwaad, leven en dood, ontzag en</text><text x="68" y="754" class="body">zondigen worden tegenover elkaar gezet.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De onderwijzer · 16–18</text><text x="68" y="903" class="body">Als laatste druivenverzamelaar werkt</text><text x="68" y="946" class="body">hij voor iedereen die onderwijs zoekt.</text><text x="46" y="1039" class="note">Het pottenbakkers- en druivenbeeld leggen de</text><text x="46" y="1075" class="note">redenering over onderscheiden werken uit.</text></svg>