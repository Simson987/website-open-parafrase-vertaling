<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Mozes, Aäron en Pinehas</title><desc id="desc">Mozes, Aäron en Pinehas met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mozes, Aäron en Pinehas</text><text x="44" y="113" class="ref">Jezus Sirach 45:1–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mozes · 1–6</text><text x="68" y="241" class="body">Roeping, zachtmoedigheid, horen van de</text><text x="68" y="284" class="body">stem en onderwijs in de wet.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aäron · 7–27</text><text x="68" y="433" class="body">Broer van Mozes, uit Levi; zalving,</text><text x="68" y="476" class="body">priesterschap, onderwijs en</text><text x="68" y="519" class="body">levensonderhoud.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Pinehas · 28–30</text><text x="68" y="668" class="body">Zoon van Eleazar; zijn inzet wordt</text><text x="68" y="711" class="body">verbonden met een verbond van vrede.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De slotzegen · 31–32</text><text x="68" y="860" class="body">Koningschap en priesterschap worden</text><text x="68" y="903" class="body">vergeleken; wijsheid voor rechtvaardig</text><text x="68" y="946" class="body">bestuur.</text><text x="46" y="1039" class="note">De drie genoemde hoofdpersonen hebben</text><text x="46" y="1075" class="note">onderscheiden rollen; de vergelijking met David</text><text x="46" y="1111" class="note">voegt geen vierde priester toe.</text></svg>