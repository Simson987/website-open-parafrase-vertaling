<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Spreken, geven en het moment</title><desc id="desc">Spreken, geven en het moment met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Spreken, geven en het moment</text><text x="44" y="113" class="ref">Jezus Sirach 20:1–31</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tijdig antwoord · 1–7</text><text x="68" y="241" class="body">Terechtwijzing, schulderkenning en</text><text x="68" y="284" class="body">verstandig zwijgen vragen het juiste</text><text x="68" y="327" class="body">moment.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De gave · 8–17</text><text x="68" y="476" class="body">Sommige giften schaden; een kleine gave</text><text x="68" y="519" class="body">met veel verwijten maakt geen</text><text x="68" y="562" class="body">vriendschap.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De tong · 18–26</text><text x="68" y="711" class="body">Een misplaatste grap, onhoudbare</text><text x="68" y="754" class="body">belofte en voortdurende leugen brengen</text><text x="68" y="797" class="body">val en schaamte.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Open wijsheid · 27–31</text><text x="68" y="946" class="body">Wijs spreken en werken hebben nut;</text><text x="68" y="989" class="body">geschenken kunnen oordeel verblinden en</text><text x="68" y="1032" class="body">verborgen wijsheid mist nut.</text><text x="46" y="1125" class="note">Het gunstige effect van goede woorden wordt</text><text x="46" y="1161" class="note">naast de schade van verkeerd gegeven of</text><text x="46" y="1197" class="note">gesproken dingen gezet.</text></svg>