<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Grenzen, vriendschap en raad</title><desc id="desc">Grenzen, vriendschap en raad met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Grenzen, vriendschap en raad</text><text x="44" y="113" class="ref">Jezus Sirach 9:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste waarschuwingen · 1–11</text><text x="68" y="241" class="body">Jaloezie, ontrouw, begeerte en een</text><text x="68" y="284" class="body">riskant drinkgelag worden afgewezen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Beproefde vriendschap · 12–13</text><text x="68" y="433" class="body">Bewaar een oude vriend; nieuwe</text><text x="68" y="476" class="body">vriendschap is als wijn die moet</text><text x="68" y="519" class="body">rijpen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Eer en macht · 14–18</text><text x="68" y="668" class="body">Geen afgunst om schijnbaar succes;</text><text x="68" y="711" class="body">voorzichtigheid bij dodelijke macht.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Goede omgang · 19–22</text><text x="68" y="860" class="body">Vraag wijzen raad, kies rechtvaardige</text><text x="68" y="903" class="body">tafelgenoten en spreek met verstand.</text><text x="46" y="996" class="note">De opbouw bewaart de verschillende sociale</text><text x="46" y="1032" class="note">lessen naast het beeld van rijpende wijn.</text></svg>