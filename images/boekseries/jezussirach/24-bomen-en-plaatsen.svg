<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Bomen en hun genoemde plaatsen</title><desc id="desc">Bomen en hun genoemde plaatsen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bomen en hun genoemde plaatsen</text><text x="44" y="113" class="ref">Jezus Sirach 24:13–15</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ceder · 13</text><text x="68" y="241" class="body">Libanon.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Cipres · 13</text><text x="68" y="390" class="body">De bergen van Hermon.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Dadelpalm en rozenstruik · 14</text><text x="68" y="539" class="body">Engedi en Jericho.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Olijfboom en plataan · 15</text><text x="68" y="688" class="body">Een fraai veld en opkomen uit het</text><text x="68" y="731" class="body">water.</text><text x="46" y="824" class="note">Het zijn groeivergelijkingen waarmee de</text><text x="46" y="860" class="note">sprekende wijsheid zichzelf beschrijft.</text></svg>