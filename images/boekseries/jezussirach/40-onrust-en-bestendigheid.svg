<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Menselijke onrust en wat blijft</title><desc id="desc">Menselijke onrust en wat blijft met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Menselijke onrust en wat blijft</text><text x="44" y="113" class="ref">Jezus Sirach 40:1–16,28–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gedeelde last · 1–8</text><text x="68" y="241" class="body">Onrust van geboorte tot dood, bij troon</text><text x="68" y="284" class="body">en stof, purper en grof linnen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De onzekerheid · 9–10</text><text x="68" y="433" class="body">Terugkeer naar aarde en zee, met</text><text x="68" y="476" class="body">dreiging van onheil.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat vergaat · 11–15</text><text x="68" y="625" class="body">Onrechtvaardig bezit en onbetrouwbare</text><text x="68" y="668" class="body">wortels tegenover blijvende trouw.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wat standhoudt · 16,28–31</text><text x="68" y="817" class="body">Goeddoen en aalmoes; daarna de scherpe</text><text x="68" y="860" class="body">waarschuwing tegen afhankelijk leven</text><text x="68" y="903" class="body">van andermans tafel.</text><text x="46" y="996" class="note">De vergelijking van menselijke posities gaat aan</text><text x="46" y="1032" class="note">de reeks waarderingen van goede dingen vooraf.</text></svg>