<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De priestergaven</title><desc id="desc">De priestergaven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De priestergaven</text><text x="44" y="113" class="ref">Jezus Sirach 7:29–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De houding · 29–30</text><text x="68" y="241" class="body">Liefde voor de Maker, ontzag en eer</text><text x="68" y="284" class="body">voor Zijn dienaren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De eerstelingen · 32</text><text x="68" y="433" class="body">De eerste opbrengst wordt samen met het</text><text x="68" y="476" class="body">schuldoffer genoemd.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De overige gaven · 33</text><text x="68" y="625" class="body">Gaven van de schouders, het</text><text x="68" y="668" class="body">heiligingsoffer en eerstelingen van de</text><text x="68" y="711" class="body">heilige dingen.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De maatstaf · 31</text><text x="68" y="860" class="body">Geven zoals bevolen is.</text><text x="46" y="953" class="note">De opsomming blijft bij de namen in dit</text><text x="46" y="989" class="note">hoofdstuk; aantallen of gewichten staan hier</text><text x="46" y="1025" class="note">niet bij.</text></svg>