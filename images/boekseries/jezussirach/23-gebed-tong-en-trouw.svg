<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Gebed, tong en trouw</title><desc id="desc">Gebed, tong en trouw met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, tong en trouw</text><text x="44" y="113" class="ref">Jezus Sirach 23:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het gebed · 1–5</text><text x="68" y="241" class="body">Vraag om onderwijs van het hart en</text><text x="68" y="284" class="body">bescherming tegen hoogmoed en begeerte.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het spreken · 6–18</text><text x="68" y="433" class="body">Waarachtige woorden tegenover</text><text x="68" y="476" class="body">gewoontezweren, overtrokken eden en</text><text x="68" y="519" class="body">schelden.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De verborgen daad · 19–28</text><text x="68" y="668" class="body">De gedachte dat duisternis en muren</text><text x="68" y="711" class="body">zonde verbergen wordt doorbroken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De huwelijkstrouw · 29–35</text><text x="68" y="860" class="body">Het slot bespreekt ontrouw, gevolgen en</text><text x="68" y="903" class="body">ontzag voor Gods geboden.</text><text x="46" y="996" class="note">De ogen die helderder zijn dan de zon drukken</text><text x="46" y="1032" class="note">Gods kennis uit; de passage is geen verslag van</text><text x="46" y="1068" class="note">een zichtbaar oog boven de stad.</text></svg>