<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Naam en gepaste schaamte</title><desc id="desc">Naam en gepaste schaamte met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Naam en gepaste schaamte</text><text x="44" y="113" class="ref">Jezus Sirach 41:1–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sterven · 1–7</text><text x="68" y="241" class="body">De dood wordt verschillend ervaren,</text><text x="68" y="284" class="body">maar treft alle generaties.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nalatenschap · 8–16</text><text x="68" y="433" class="body">Slecht gedrag schaadt het nageslacht;</text><text x="68" y="476" class="body">een goede naam gaat boven goud.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wijsheid delen · 17–19</text><text x="68" y="625" class="body">Geleerde wijsheid bewaren en niet</text><text x="68" y="668" class="body">nutteloos verborgen houden.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gepaste schaamte · 20–30</text><text x="68" y="817" class="body">Recht, trouw, eerlijk bezit, respect</text><text x="68" y="860" class="body">voor anderen en het bewaren van</text><text x="68" y="903" class="body">geheimen.</text><text x="46" y="996" class="note">De lange slotlijst concretiseert welk gedrag de</text><text x="46" y="1032" class="note">spreker afkeurt.</text></svg>