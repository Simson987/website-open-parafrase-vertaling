<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Onderzoek vóór je oordeel</title><desc id="desc">Onderzoek vóór je oordeel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onderzoek vóór je oordeel</text><text x="44" y="113" class="ref">Jezus Sirach 19:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat je hoort · 1–12</text><text x="68" y="241" class="body">Wantrouw snelle overlevering en laat</text><text x="68" y="284" class="body">roddel bij je sterven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wat je onderzoekt · 13–17</text><text x="68" y="433" class="body">Spreek vriend en naaste eerst aan; iets</text><text x="68" y="476" class="body">kan ongedaan, ongezegd of onbedoeld</text><text x="68" y="519" class="body">zijn.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wat wijsheid is · 18–23</text><text x="68" y="668" class="body">Ontzag, wetskennis en rechtvaardigheid</text><text x="68" y="711" class="body">verschillen van slimme</text><text x="68" y="754" class="body">onrechtvaardigheid.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Wat verborgen kan zijn · 24–29</text><text x="68" y="903" class="body">Schijnbare nederigheid kan bedrog</text><text x="68" y="946" class="body">bedekken; terechtwijzen vraagt het</text><text x="68" y="989" class="body">juiste moment.</text><text x="46" y="1082" class="note">Het hoofdstuk verbindt beheerst spreken aan</text><text x="46" y="1118" class="note">zorgvuldig toetsen en eerlijk handelen.</text></svg>