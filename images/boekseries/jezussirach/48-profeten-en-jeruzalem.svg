<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Profeten en Jeruzalem</title><desc id="desc">Profeten en Jeruzalem met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Profeten en Jeruzalem</text><text x="44" y="113" class="ref">Jezus Sirach 48:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Elia · 1–12</text><text x="68" y="241" class="body">Vurig woord, hongersnood, wonderen,</text><text x="68" y="284" class="body">opdracht en de vurige wagen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Elisa · 13–15</text><text x="68" y="433" class="body">De Geest vervult hem; wonderlijke</text><text x="68" y="476" class="body">werken in leven en dood.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het volk · 16–18</text><text x="68" y="625" class="body">Aanhoudende zonde, wegvoering en een</text><text x="68" y="668" class="body">klein overblijfsel met een</text><text x="68" y="711" class="body">Davidsheerser.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Hizkia en Jesaja · 19–28</text><text x="68" y="860" class="body">Waterwerken, Assyrische dreiging,</text><text x="68" y="903" class="body">gezamenlijk gebed, redding en</text><text x="68" y="946" class="body">profetische troost.</text><text x="46" y="1039" class="note">Het vuur van Elia’s woord is beeldspraak; de</text><text x="46" y="1075" class="note">vurige wagen is een afzonderlijk aangehaald</text><text x="46" y="1111" class="note">wonder.</text></svg>