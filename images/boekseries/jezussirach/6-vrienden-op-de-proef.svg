<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Welke vriend blijft in nood?</title><desc id="desc">Welke vriend blijft in nood? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Welke vriend blijft in nood?</text><text x="44" y="113" class="ref">Jezus Sirach 6:5–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Veel vrede · 5–7</text><text x="68" y="241" class="body">Vriendelijke woorden maken vrienden;</text><text x="68" y="284" class="body">kies een raadgever zorgvuldig en</text><text x="68" y="327" class="body">beproef vertrouwen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zolang het uitkomt · 8–12</text><text x="68" y="476" class="body">Voordeelvriend, veranderde vijand en</text><text x="68" y="519" class="body">tafelgenoot kunnen wegblijven in nood.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De trouwe vriend · 14–16</text><text x="68" y="668" class="body">Bescherming, onschatbare schat en</text><text x="68" y="711" class="body">medicijn voor het leven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De eigen houding · 17</text><text x="68" y="860" class="body">Wie ontzag heeft voor de Heere,</text><text x="68" y="903" class="body">gedraagt zich goed in vriendschappen.</text><text x="46" y="996" class="note">De genoemde soorten vriendschap zijn voorbeelden</text><text x="46" y="1032" class="note">en vergelijkingen, geen namenlijst.</text></svg>