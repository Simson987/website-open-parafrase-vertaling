<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Weldaad en betrouwbaarheid</title><desc id="desc">Weldaad en betrouwbaarheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Weldaad en betrouwbaarheid</text><text x="44" y="113" class="ref">Jezus Sirach 12:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste oproep · 1–6</text><text x="68" y="241" class="body">Het hoofdstuk vraagt zorgvuldig te</text><text x="68" y="284" class="body">letten op de ontvanger van weldaden.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De toets · 7–8</text><text x="68" y="433" class="body">Voorspoed en tegenspoed tonen</text><text x="68" y="476" class="body">verschillende kanten van vriend en</text><text x="68" y="519" class="body">vijand.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De schijn · 9–15</text><text x="68" y="668" class="body">Roestend koper, een schoongeveegde</text><text x="68" y="711" class="body">spiegel en zoete woorden verklaren</text><text x="68" y="754" class="body">verborgen gevaar.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De gelegenheid · 16–18</text><text x="68" y="903" class="body">Geveinsde hulp kan bij tegenspoed in</text><text x="68" y="946" class="body">verraad omslaan.</text><text x="46" y="1039" class="note">De scherpe adviezen worden weergegeven als het</text><text x="46" y="1075" class="note">onderwijs van dit hoofdstuk; de koper- en</text><text x="46" y="1111" class="note">slangbeelden zijn vergelijkingen.</text></svg>