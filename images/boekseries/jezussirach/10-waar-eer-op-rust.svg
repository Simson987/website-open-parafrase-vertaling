<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Waar bestuur en eer op rusten</title><desc id="desc">Waar bestuur en eer op rusten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waar bestuur en eer op rusten</text><text x="44" y="113" class="ref">Jezus Sirach 10:1–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het bestuur · 1–5</text><text x="68" y="241" class="body">Een wijze leider vormt het volk; macht</text><text x="68" y="284" class="body">en welslagen liggen bij de Heere.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De val · 6–21</text><text x="68" y="433" class="body">Hoogmoed, onrecht en bedrieglijke</text><text x="68" y="476" class="body">rijkdom brengen omverwerping.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het aanzien · 22–28</text><text x="68" y="625" class="body">Ontzag en kennis tellen bij rijk, arm</text><text x="68" y="668" class="body">en knecht.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het handelen · 29–34</text><text x="68" y="817" class="body">Werk, brood, zachtmoedigheid en</text><text x="68" y="860" class="body">waardigheid wegen zwaarder dan</text><text x="68" y="903" class="body">opscheppen.</text><text x="46" y="996" class="note">Sociale rang, rijkdom, verstand en ontzag worden</text><text x="46" y="1032" class="note">als verschillende gronden van waardering</text><text x="46" y="1068" class="note">besproken.</text></svg>