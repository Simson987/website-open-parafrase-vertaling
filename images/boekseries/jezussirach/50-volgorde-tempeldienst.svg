<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Volgorde bij de dienst</title><desc id="desc">Volgorde bij de dienst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volgorde bij de dienst</text><text x="44" y="113" class="ref">Jezus Sirach 50:15–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beker · 15–16</text><text x="68" y="241" class="body">Druivensap wordt aan de voet van het</text><text x="68" y="284" class="body">altaar uitgegoten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Trompetten · 17</text><text x="68" y="433" class="body">De zonen van Aäron laten een groot</text><text x="68" y="476" class="body">geschal horen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gemeente · 18–20</text><text x="68" y="625" class="body">Neerbuigen, zingen en smeken tot de</text><text x="68" y="668" class="body">dienst voltooid is.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zegen · 21–22</text><text x="68" y="817" class="body">Simon daalt af en heft de handen; het</text><text x="68" y="860" class="body">volk buigt opnieuw.</text><text x="46" y="953" class="note">De pijlloze leesvolgorde volgt de versvolgorde</text><text x="46" y="989" class="note">van de beschreven eredienst.</text></svg>