<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Het verband tussen offer en recht</title><desc id="desc">Het verband tussen offer en recht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het verband tussen offer en recht</text><text x="44" y="113" class="ref">Jezus Sirach 35:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gehoorzamen en goeddoen · 1–7</text><text x="68" y="241" class="body">Wet bewaren, weldaden beantwoorden,</text><text x="68" y="284" class="body">aalmoes geven en met onrecht breken</text><text x="68" y="327" class="body">heten offers.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gul geven · 8–12</text><text x="68" y="476" class="body">Eerste opbrengst en tiende, met</text><text x="68" y="519" class="body">vrolijkheid en volgens ontvangen gave.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De onpartijdige rechter · 13–18</text><text x="68" y="668" class="body">Arme, wees en weduwe worden gehoord;</text><text x="68" y="711" class="body">het nederige gebed houdt aan.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Tijdige ontferming · 19–23</text><text x="68" y="860" class="body">Daden worden vergolden en het volk</text><text x="68" y="903" class="body">vindt vreugde; barmhartigheid is als</text><text x="68" y="946" class="body">regen in droogte.</text><text x="46" y="1039" class="note">De herkomst van de gave en het recht van</text><text x="46" y="1075" class="note">kwetsbaren zijn verbonden aan de eredienst.</text></svg>