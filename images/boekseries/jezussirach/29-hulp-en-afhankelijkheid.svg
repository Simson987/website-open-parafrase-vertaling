<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Hulp en afhankelijkheid</title><desc id="desc">Hulp en afhankelijkheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hulp en afhankelijkheid</text><text x="44" y="113" class="ref">Jezus Sirach 29:1–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lenen · 1–10</text><text x="68" y="241" class="body">Hulp veronderstelt betrouwbaarheid;</text><text x="68" y="284" class="body">uitstel en schelden maken de helper tot</text><text x="68" y="327" class="body">vijand.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Barmhartigheid · 11–16</text><text x="68" y="476" class="body">Blijf geduldig helpen en leg een schat</text><text x="68" y="519" class="body">van aalmoezen neer.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Borgstelling · 17–24</text><text x="68" y="668" class="body">De borg zet zich in; de geholpen naaste</text><text x="68" y="711" class="body">mag hem niet vergeten en hulp vraagt</text><text x="68" y="754" class="body">eigen zorgvuldigheid.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Wonen · 25–32</text><text x="68" y="903" class="body">Basisbehoeften en tevredenheid met</text><text x="68" y="946" class="body">eigen onderdak tegenover de onzekerheid</text><text x="68" y="989" class="body">van wonen bij anderen.</text><text x="46" y="1082" class="note">De tekst houdt vrijgevigheid en de gevolgen van</text><text x="46" y="1118" class="note">afhankelijkheid in één betoog bijeen.</text></svg>