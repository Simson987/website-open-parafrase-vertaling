<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Dreiging en redding</title><desc id="desc">Dreiging en redding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dreiging en redding</text><text x="44" y="113" class="ref">Jezus Sirach 48:19–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorbereiding · 19</text><text x="68" y="241" class="body">Hizkia versterkt de stad en leidt water</text><text x="68" y="284" class="body">door de rots naar binnen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dreiging · 20–21</text><text x="68" y="433" class="body">Sanherib zendt de Rabsake; de bevolking</text><text x="68" y="476" class="body">vreest.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verhoring · 22–24</text><text x="68" y="625" class="body">Gezamenlijk gebed en redding worden met</text><text x="68" y="668" class="body">Jesaja verbonden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Leven en toekomst · 25–28</text><text x="68" y="817" class="body">Hizkia’s trouw, de teruggaande zon,</text><text x="68" y="860" class="body">langer leven en Jesaja’s troost.</text><text x="46" y="953" class="note">De hoofdstuklof bevat meerdere momenten uit de</text><text x="46" y="989" class="note">geschiedenis van Hizkia en Jesaja.</text></svg>