<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Wet en waterlopen in de lofrede</title><desc id="desc">Wet en waterlopen in de lofrede met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wet en waterlopen in de lofrede</text><text x="44" y="113" class="ref">Jezus Sirach 24:26–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het boek · 26</text><text x="68" y="241" class="body">De lof wordt verbonden aan het</text><text x="68" y="284" class="body">verbondsboek en de wet van Mozes voor</text><text x="68" y="327" class="body">Jakob.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wijsheid · 27</text><text x="68" y="476" class="body">Pison en Tigris in de dagen van de</text><text x="68" y="519" class="body">eerste vruchten.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verstand en kennis · 28–29</text><text x="68" y="668" class="body">Eufraat en Jordaan bij de oogst; Gichon</text><text x="68" y="711" class="body">bij de druivenoogst.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het onderwijs · 30–38</text><text x="68" y="860" class="body">Niet te doorgronden; een kanaal wordt</text><text x="68" y="903" class="body">rivier en zee, licht voor verre landen</text><text x="68" y="946" class="body">en komende geslachten.</text><text x="46" y="1039" class="note">De riviernamen zijn vergelijkingen voor</text><text x="46" y="1075" class="note">overvloedig onderwijs; het schema is een</text><text x="46" y="1111" class="note">tekstverband, geen gereconstrueerde landkaart.</text></svg>