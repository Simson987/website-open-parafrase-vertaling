<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Gebed, zoeken en uitnodiging</title><desc id="desc">Gebed, zoeken en uitnodiging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, zoeken en uitnodiging</text><text x="44" y="113" class="ref">Jezus Sirach 51:1–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dank om redding · 1–16</text><text x="68" y="241" class="body">Bedreiging, laster, herinnerde</text><text x="68" y="284" class="body">barmhartigheid, gebed en verhoring.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zoeken naar wijsheid · 17–30</text><text x="68" y="433" class="body">Van jongs af bidden, luisteren, leren,</text><text x="68" y="476" class="body">oefenen en danken.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De uitnodiging · 31–38</text><text x="68" y="625" class="body">Het huis van onderwijs, wijsheid zonder</text><text x="68" y="668" class="body">geld, het juk aannemen en tijdig</text><text x="68" y="711" class="body">handelen.</text><text x="46" y="804" class="note">Tanden, vuur, dorst, koop en juk functioneren in</text><text x="46" y="840" class="note">deze poëtische dank en uitnodiging; zij vormen</text><text x="46" y="876" class="note">geen volledige reisbeschrijving.</text></svg>