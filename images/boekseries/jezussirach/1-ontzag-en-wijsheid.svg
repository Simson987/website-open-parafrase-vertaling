<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Ontzag en wijsheid</title><desc id="desc">Ontzag en wijsheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ontzag en wijsheid</text><text x="44" y="113" class="ref">Jezus Sirach 1:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oorsprong · 1–9</text><text x="68" y="241" class="body">Alle wijsheid komt van de Heere en</text><text x="68" y="284" class="body">wordt naar Zijn gave over de werken</text><text x="68" y="327" class="body">uitgegoten.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het begin · 13–14</text><text x="68" y="476" class="body">Ontzag voor de Heere is het begin van</text><text x="68" y="519" class="body">de wijsheid en haar vaste fundament.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De verzadiging en kroon · 15–19</text><text x="68" y="668" class="body">Vruchten, vrede, kennis, inzicht en eer</text><text x="68" y="711" class="body">worden met haar verbonden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De wortel en takken · 20–21</text><text x="68" y="860" class="body">Ontzag is de wortel, lang leven de</text><text x="68" y="903" class="body">takken. Ontzag verdrijft misdaden.</text><text x="46" y="996" class="note">De verschillende groeibeelden beschrijven de</text><text x="46" y="1032" class="note">samenhang van ontzag, wijsheid en leven.</text></svg>