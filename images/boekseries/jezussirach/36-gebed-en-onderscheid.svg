<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Gebed en onderscheid</title><desc id="desc">Gebed en onderscheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed en onderscheid</text><text x="44" y="113" class="ref">Jezus Sirach 36:1–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De volken · 1–12</text><text x="68" y="241" class="body">Een gebed om ontferming, tekenen,</text><text x="68" y="284" class="body">kennis van God en bevrijding van</text><text x="68" y="327" class="body">tegenstanders.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het volk en de stad · 13–19</text><text x="68" y="476" class="body">Verzameling van Jakob, erfdeel,</text><text x="68" y="519" class="body">Jeruzalem, profeten en verhoring</text><text x="68" y="562" class="body">volgens Aärons zegen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het oordeel · 20–22</text><text x="68" y="711" class="body">Zoals de tong eten proeft, herkent het</text><text x="68" y="754" class="body">verstandige hart leugen.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het huis · 23–28</text><text x="68" y="903" class="body">Goede omgang, genezende woorden,</text><text x="68" y="946" class="body">passende hulp en een vaste</text><text x="68" y="989" class="body">verblijfplaats.</text><text x="46" y="1082" class="note">Bij vers 20 begint de praktische wijsheid na het</text><text x="46" y="1118" class="note">gebed; het smaakbeeld vormt de overgang.</text></svg>