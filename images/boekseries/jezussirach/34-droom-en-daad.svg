<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Droom, ervaring en echte omkeer</title><desc id="desc">Droom, ervaring en echte omkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Droom, ervaring en echte omkeer</text><text x="44" y="113" class="ref">Jezus Sirach 34:1–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onbetrouwbare hoop · 1–8</text><text x="68" y="241" class="body">Droom, schaduw en spiegel worden</text><text x="68" y="284" class="body">tegenover wet en betrouwbare mond</text><text x="68" y="327" class="body">gezet.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Ervaring en steun · 9–18</text><text x="68" y="476" class="body">Reizen leert; ontzag vindt hoop,</text><text x="68" y="519" class="body">schaduw en bescherming.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De herkomst van de gave · 19–24</text><text x="68" y="668" class="body">Onrechtvaardig verkregen offers,</text><text x="68" y="711" class="body">geroofd brood en onthouden loon worden</text><text x="68" y="754" class="body">afgewezen.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Tegengestelde daden · 25–28</text><text x="68" y="903" class="body">Bouwen en afbreken, bidden en vloeken,</text><text x="68" y="946" class="body">wassen en weer aanraken verklaren</text><text x="68" y="989" class="body">vasten zonder blijvende omkeer.</text><text x="46" y="1082" class="note">De vergelijkingen maken zichtbaar waarom een</text><text x="46" y="1118" class="note">ritueel dat door de volgende daad ongedaan wordt</text><text x="46" y="1154" class="note">gemaakt geen vrucht geeft.</text></svg>