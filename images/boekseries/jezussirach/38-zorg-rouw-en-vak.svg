<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Zorg, rouw en vakbekwaamheid</title><desc id="desc">Zorg, rouw en vakbekwaamheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zorg, rouw en vakbekwaamheid</text><text x="44" y="113" class="ref">Jezus Sirach 38:1–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De genezing · 1–15</text><text x="68" y="241" class="body">Eer voor dokter en geneesmiddelen,</text><text x="68" y="284" class="body">gebed en ruimte voor hun werk.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het afscheid · 16–24</text><text x="68" y="433" class="body">Tranen, passende begrafenis en daarna</text><text x="68" y="476" class="body">ruimte voor troost.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De ambachten · 25–40</text><text x="68" y="625" class="body">Landbouwer, houtbewerker, zegelsnijder,</text><text x="68" y="668" class="body">smid en pottenbakker dragen de stad.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De studie · 25,41</text><text x="68" y="817" class="body">Toewijding en beschikbare tijd worden</text><text x="68" y="860" class="body">verbonden aan wetsonderzoek.</text><text x="46" y="953" class="note">Het hoofdstuk erkent vakmanschap en maakt</text><text x="46" y="989" class="note">tegelijk onderscheid met de taak van de</text><text x="46" y="1025" class="note">geleerde.</text></svg>