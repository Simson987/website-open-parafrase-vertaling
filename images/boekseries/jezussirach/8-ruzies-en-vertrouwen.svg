<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Conflicten en vertrouwen afwegen</title><desc id="desc">Conflicten en vertrouwen afwegen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Conflicten en vertrouwen afwegen</text><text x="44" y="113" class="ref">Jezus Sirach 8:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruzie · 1–8,13–14</text><text x="68" y="241" class="body">Macht, rijkdom, veelpraterij en spot</text><text x="68" y="284" class="body">kunnen het conflict vergroten; eer</text><text x="68" y="327" class="body">leeftijd en omkeer.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Leren · 9–12</text><text x="68" y="476" class="body">Ouderen dragen onderwijs van hun vaders</text><text x="68" y="519" class="body">over en leren passend antwoorden.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verbintenissen · 15–19</text><text x="68" y="668" class="body">Lening, borg, rechtspraak en</text><text x="68" y="711" class="body">reisgezelschap vragen besef van risico</text><text x="68" y="754" class="body">en eigen vermogen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Vertrouwelijkheid · 20–22</text><text x="68" y="903" class="body">Raad en het delen van geheimen vragen</text><text x="68" y="946" class="body">zorgvuldig gekozen mensen.</text><text x="46" y="1039" class="note">De vermaningen verbinden voorzichtigheid met</text><text x="46" y="1075" class="note">eerbied en leren.</text></svg>