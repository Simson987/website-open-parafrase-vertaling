<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Bezit, erfenis en huiswerk</title><desc id="desc">Bezit, erfenis en huiswerk met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bezit, erfenis en huiswerk</text><text x="44" y="113" class="ref">Jezus Sirach 33:19–31</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij leven · 19–22</text><text x="68" y="241" class="body">Geef de eigen macht en bezit niet zo</text><text x="68" y="284" class="body">uit handen dat afhankelijkheid</text><text x="68" y="327" class="body">ontstaat.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Aan het levenseinde · 23</text><text x="68" y="476" class="body">Verdeel dan de erfenis.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het werk · 24–29</text><text x="68" y="625" class="body">Geschikt werk, voedsel en correctie</text><text x="68" y="668" class="body">worden genoemd, met oordeel en</text><text x="68" y="711" class="body">begrenzing van hardheid.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De knecht als broer · 30–31</text><text x="68" y="860" class="body">Behandel hem als het eigen leven en als</text><text x="68" y="903" class="body">broer; onrecht kan hem doen weggaan.</text><text x="46" y="996" class="note">De regels over bezit en knecht staan in het</text><text x="46" y="1032" class="note">tweede hoofdstukdeel en worden als</text><text x="46" y="1068" class="note">tekstonderwijs weergegeven.</text></svg>