<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Uiterlijk, succes en de afloop</title><desc id="desc">Uiterlijk, succes en de afloop met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uiterlijk, succes en de afloop</text><text x="44" y="113" class="ref">Jezus Sirach 11:1–35</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het eerste oordeel · 1–9</text><text x="68" y="241" class="body">Klein uiterlijk kan veel waarde hebben;</text><text x="68" y="284" class="body">onderzoek eerst en luister vóór je</text><text x="68" y="327" class="body">antwoordt.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bezit en werk · 10–23</text><text x="68" y="476" class="body">Inspanning garandeert geen rijkdom;</text><text x="68" y="519" class="body">ontvangen zegen en trouw werk blijven</text><text x="68" y="562" class="body">belangrijk.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het levensgeheel · 24–29</text><text x="68" y="711" class="body">Goede en kwade dagen wisselen; aan het</text><text x="68" y="754" class="body">eind komen de daden aan het licht.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het huis · 30–35</text><text x="68" y="903" class="body">Voorzichtigheid bij laster, verborgen</text><text x="68" y="946" class="body">plannen en onbetrouwbare gasten.</text><text x="46" y="1039" class="note">Bij, koningskroon, rustend bezit en patrijs zijn</text><text x="46" y="1075" class="note">verschillende voorbeelden in deze waarschuwing</text><text x="46" y="1111" class="note">tegen een te vroeg oordeel.</text></svg>