<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Gaven, verbond en omkeer</title><desc id="desc">Gaven, verbond en omkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gaven, verbond en omkeer</text><text x="44" y="113" class="ref">Jezus Sirach 17:1–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het maaksel · 1–8</text><text x="68" y="241" class="body">Aarde, beperkte dagen, macht over</text><text x="68" y="284" class="body">dieren, verstand, spraak, zintuigen en</text><text x="68" y="327" class="body">hart.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het verbond · 9–14</text><text x="68" y="476" class="body">Wet, oordelen en naastenplicht; Israël</text><text x="68" y="519" class="body">wordt als Gods eigen deel genoemd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het toezicht · 15–18</text><text x="68" y="668" class="body">Daden blijven zichtbaar, met sparen,</text><text x="68" y="711" class="body">genade en een weg terug.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De oproep · 19–28</text><text x="68" y="860" class="body">Keer van onrecht terug, prijs God</text><text x="68" y="903" class="body">zolang je leeft en erken de menselijke</text><text x="68" y="946" class="body">sterfelijkheid.</text><text x="46" y="1039" class="note">De gaven aan de mens worden verbonden aan</text><text x="46" y="1075" class="note">verantwoordelijkheid en de uitnodiging tot</text><text x="46" y="1111" class="note">terugkeer.</text></svg>