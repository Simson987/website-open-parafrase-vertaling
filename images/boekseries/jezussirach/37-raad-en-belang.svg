<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Raad, eigen hart en gebed</title><desc id="desc">Raad, eigen hart en gebed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Raad, eigen hart en gebed</text><text x="44" y="113" class="ref">Jezus Sirach 37:1–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vriend · 1–6</text><text x="68" y="241" class="body">Een naam alleen is niet genoeg; denk in</text><text x="68" y="284" class="body">voorspoed aan wie je vriend is.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De raadgever · 7–13</text><text x="68" y="433" class="body">Vraag naar zijn eigen belang en zoek</text><text x="68" y="476" class="body">iemand die ontzag heeft en met je</text><text x="68" y="519" class="body">meeleeft.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De toets · 14–19</text><text x="68" y="668" class="body">Eigen hart, gebed, woord en overleg</text><text x="68" y="711" class="body">gaan aan handelen vooraf.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De vrucht · 20–32</text><text x="68" y="860" class="body">Wijsheid moet ook de spreker helpen;</text><text x="68" y="903" class="body">onderzoek wat je goeddoet en beheers je</text><text x="68" y="946" class="body">eetlust.</text><text x="46" y="1039" class="note">Het hart wordt in vers 15 met zeven wachters</text><text x="46" y="1075" class="note">vergeleken; het is geen telling van aanwezige</text><text x="46" y="1111" class="note">raadgevers.</text></svg>