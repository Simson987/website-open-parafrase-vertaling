<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Beelden van wijs en dwaas</title><desc id="desc">Beelden van wijs en dwaas met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beelden van wijs en dwaas</text><text x="44" y="113" class="ref">Jezus Sirach 21:1–31</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zonde en onrecht · 1–11</text><text x="68" y="241" class="body">Slang, leeuwentanden, zwaard, brandhout</text><text x="68" y="284" class="body">en een weg naar de kuil beelden gevaar</text><text x="68" y="327" class="body">uit.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Leren · 12–20</text><text x="68" y="476" class="body">Wijsheid als levende bron; de dwaas als</text><text x="68" y="519" class="body">een lek vat dat niets bewaart.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Tucht · 21–24</text><text x="68" y="668" class="body">De een ervaart boeien; de ander een</text><text x="68" y="711" class="body">gouden sieraad en armband.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Omgang · 25–31</text><text x="68" y="860" class="body">Huizen en deuren eerbiedigen, woorden</text><text x="68" y="903" class="body">afwegen en roddel laten.</text><text x="46" y="996" class="note">De beelden monden uit in heel concrete lessen</text><text x="46" y="1032" class="note">over luisteren, grenzen en de tong.</text></svg>