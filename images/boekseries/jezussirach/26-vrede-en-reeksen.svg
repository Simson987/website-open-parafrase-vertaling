<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Vrede, angst en verdriet</title><desc id="desc">Vrede, angst en verdriet met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrede, angst en verdriet</text><text x="44" y="113" class="ref">Jezus Sirach 26:1–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De goede verhouding · 1–4</text><text x="68" y="241" class="body">Een flinke, goede vrouw brengt vrede en</text><text x="68" y="284" class="body">vreugde, in rijkdom en armoede.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Drie en een vierde · 5–13</text><text x="68" y="433" class="body">Laster van de stad, samenscholing, een</text><text x="68" y="476" class="body">verzonnen leugen en de jaloerse tong.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De lof en waarschuwingen · 14–29</text><text x="68" y="625" class="body">Inzicht, bescheidenheid en trouw worden</text><text x="68" y="668" class="body">geprezen, met licht- en</text><text x="68" y="711" class="body">zuilvergelijkingen.</text><rect x="42" y="769" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Twee en een derde · 30–33</text><text x="68" y="860" class="body">Armoede van een strijder, verachting</text><text x="68" y="903" class="body">van verstandigen en terugkeer van recht</text><text x="68" y="946" class="body">naar zonde; daarna koopman en</text><text x="68" y="989" class="body">herbergier.</text><text x="46" y="1082" class="note">Het schema bewaart de twee getalsreeksen en de</text><text x="46" y="1118" class="note">verschillende delen van dit hoofdstuk.</text></svg>