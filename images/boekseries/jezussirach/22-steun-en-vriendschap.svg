<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Steun en herstel van vriendschap</title><desc id="desc">Steun en herstel van vriendschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Steun en herstel van vriendschap</text><text x="44" y="113" class="ref">Jezus Sirach 22:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onwil om te leren · 1–18</text><text x="68" y="241" class="body">Moddersteen, mest, scherven en slaap</text><text x="68" y="284" class="body">verbeelden luiheid en onverstand.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Goede raad · 19–22</text><text x="68" y="433" class="body">Een stevig ingemetselde balk en</text><text x="68" y="476" class="body">verzorgd pleisterwerk staan tegenover</text><text x="68" y="519" class="body">wankele palen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Herstel en breuk · 23–26</text><text x="68" y="668" class="body">Er is terugkeer na ruzie; minachting,</text><text x="68" y="711" class="body">hoogmoed, verraad en een verklapt</text><text x="68" y="754" class="body">geheim doen vrienden weggaan.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Trouw en beheersing · 27–31</text><text x="68" y="903" class="body">Blijf bij een naaste in armoede en</text><text x="68" y="946" class="body">verdrukking en vraag om bewaking van je</text><text x="68" y="989" class="body">mond.</text><text x="46" y="1082" class="note">De houten balk is een vergelijking voor</text><text x="46" y="1118" class="note">doordachte raad; de vriendschapslessen sluiten</text><text x="46" y="1154" class="note">erop aan.</text></svg>