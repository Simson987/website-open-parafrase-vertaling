<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">Waar de ambachtslieden op letten</title><desc id="desc">Waar de ambachtslieden op letten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waar de ambachtslieden op letten</text><text x="44" y="113" class="ref">Jezus Sirach 38:26–40</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Landbouw · 26–27</text><text x="68" y="241" class="body">Voren trekken en het vee voeren.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Hout en zegels · 28–30</text><text x="68" y="390" class="body">Werk voltooien en de afbeelding</text><text x="68" y="433" class="body">zorgvuldig uitsnijden.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Metaal · 31–33</text><text x="68" y="582" class="body">Vuur, model, hamerslagen en versiering.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Aardewerk · 34–36</text><text x="68" y="731" class="body">Wiel, kleivorm, afwerking en oven;</text><text x="68" y="774" class="body">handen en voeten werken samen.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">De stad · 37–40</text><text x="68" y="923" class="body">Ieder is knap in zijn vak; zonder hen</text><text x="68" y="966" class="body">kan de stad niet bestaan.</text><text x="46" y="1059" class="note">De genoemde werkzaamheden zijn afzonderlijke</text><text x="46" y="1095" class="note">ambachten in het betoog.</text></svg>