<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">De reeksen in dit hoofdstuk</title><desc id="desc">De reeksen in dit hoofdstuk met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De reeksen in dit hoofdstuk</text><text x="44" y="113" class="ref">Jezus Sirach 25:1–31</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie mooie dingen · 1–2</text><text x="68" y="241" class="body">Eendracht tussen broeders, vriendschap</text><text x="68" y="284" class="body">met de naaste en harmonie tussen man en</text><text x="68" y="327" class="body">vrouw.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Drie afgewezen levens · 3–4</text><text x="68" y="476" class="body">Hoogmoed bij de arme, leugen bij de</text><text x="68" y="519" class="body">rijke en overspel bij de oude man.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wijsheid en geluk · 5–16</text><text x="68" y="668" class="body">Ervaring en ontzag; vers 9 kondigt</text><text x="68" y="711" class="body">negen en een tiende gelukspreking aan.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het scherpe slot · 17–31</text><text x="68" y="860" class="body">Vergelijkingen over vijandschap en</text><text x="68" y="903" class="body">huwelijksconflict leiden naar de</text><text x="68" y="946" class="body">genoemde scheidingsbrief.</text><text x="46" y="1039" class="note">De waarderingen en vergelijkingen worden</text><text x="46" y="1075" class="note">weergegeven als de opeenvolgende uitspraken van</text><text x="46" y="1111" class="note">deze tekst.</text></svg>