<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Leiders en trouw</title><desc id="desc">Leiders en trouw met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leiders en trouw</text><text x="44" y="113" class="ref">Jezus Sirach 46:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jozua · 1–8</text><text x="68" y="241" class="body">Opvolger van Mozes; redding, erfdeel,</text><text x="68" y="284" class="body">verlengde dag en gebed met hagel als</text><text x="68" y="327" class="body">hulp.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jozua en Kaleb · 9–12</text><text x="68" y="476" class="body">Tegen het gemopper in; bewaard om het</text><text x="68" y="519" class="body">erfdeel te ontvangen, Kaleb tot in</text><text x="68" y="562" class="body">ouderdom sterk.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De richters · 13–14</text><text x="68" y="711" class="body">Hun trouw en hun naam worden gezegend;</text><text x="68" y="754" class="body">uitlopend gebeente is beeldspraak.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Samuël · 15–22</text><text x="68" y="903" class="body">Profeet, bestuur, zalving, gebed,</text><text x="68" y="946" class="body">rekenschap en een laatste profetisch</text><text x="68" y="989" class="body">woord.</text><text x="46" y="1082" class="note">De lof verbindt verschillende generaties. De</text><text x="46" y="1118" class="note">genoemde scènes vallen niet op één tijdstip.</text></svg>