<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Zorg, zachtmoedigheid en luisteren</title><desc id="desc">Zorg, zachtmoedigheid en luisteren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zorg, zachtmoedigheid en luisteren</text><text x="44" y="113" class="ref">Jezus Sirach 3:1–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ouders · 1–18</text><text x="68" y="241" class="body">Eer met daden en woorden; zorg in</text><text x="68" y="284" class="body">ouderdom, ook wanneer het verstand</text><text x="68" y="327" class="body">afneemt.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het eigen werk · 19–22</text><text x="68" y="476" class="body">Werk zachtmoedig en word nederiger</text><text x="68" y="519" class="body">naarmate je groter bent.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Kennis · 23–30</text><text x="68" y="668" class="body">Denk zorgvuldig na over de opdracht en</text><text x="68" y="711" class="body">luister naar spreuken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Barmhartigheid · 31–32</text><text x="68" y="860" class="body">Zoals water vuur dooft, wordt de</text><text x="68" y="903" class="body">werking van barmhartigheid uitgelegd.</text><text x="46" y="996" class="note">Ouderenzorg, nederigheid en luisterbereidheid</text><text x="46" y="1032" class="note">vormen de drie praktische lessen naast het</text><text x="46" y="1068" class="note">slotbeeld.</text></svg>