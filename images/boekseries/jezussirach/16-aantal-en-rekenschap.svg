<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Aantal en rekenschap</title><desc id="desc">Aantal en rekenschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aantal en rekenschap</text><text x="44" y="113" class="ref">Jezus Sirach 16:1–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het aantal · 1–6</text><text x="68" y="241" class="body">Eén rechtvaardige weegt in dit betoog</text><text x="68" y="284" class="body">zwaarder dan duizend goddeloze</text><text x="68" y="327" class="body">kinderen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De herinneringen · 7–15</text><text x="68" y="476" class="body">Reuzen, Lots omgeving, een zondigend</text><text x="68" y="519" class="body">volk, 600.000 voetvolk en de farao</text><text x="68" y="562" class="body">illustreren oordeel en ontferming.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De uitvlucht · 16–23</text><text x="68" y="711" class="body">Zich onzichtbaar wanen tussen de</text><text x="68" y="754" class="body">menigte wordt afgewezen; Gods wegen</text><text x="68" y="797" class="body">blijven groot.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De orde · 24–30</text><text x="68" y="946" class="body">Onderwijs wijst op de onderscheiden</text><text x="68" y="989" class="body">werken en de aarde vol goede gaven.</text><text x="46" y="1082" class="note">De aantallen horen bij verschillende</text><text x="46" y="1118" class="note">voorbeelden: duizend bij de waardevergelijking</text><text x="46" y="1154" class="note">en 600.000 bij het herinnerde voetvolk.</text></svg>