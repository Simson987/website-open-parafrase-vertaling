<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Geuren, takken en vrucht</title><desc id="desc">Geuren, takken en vrucht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geuren, takken en vrucht</text><text x="44" y="113" class="ref">Jezus Sirach 24:16–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geur · 16–17</text><text x="68" y="241" class="body">Kaneel, geurbal, uitgelezen mirre,</text><text x="68" y="284" class="body">galbanum, onyx, stacte en reukwerk in</text><text x="68" y="327" class="body">de tent.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Takken · 18</text><text x="68" y="476" class="body">Als een terpentijnboom, prachtig en</text><text x="68" y="519" class="body">aangenaam uitgespreid.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bloei en vrucht · 19</text><text x="68" y="668" class="body">Als een uitlopende wijnstok, met geur</text><text x="68" y="711" class="body">en vrucht van eer en rijkdom.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De uitnodiging · 20–24</text><text x="68" y="860" class="body">Liefde, ontzag, kennis en hoop; komen,</text><text x="68" y="903" class="body">eten en drinken van wat zij</text><text x="68" y="946" class="body">voortbrengt.</text><text x="46" y="1039" class="note">De namen volgen deze plaatselijke verzen,</text><text x="46" y="1075" class="note">inclusief het woord onyx in de opsomming.</text></svg>