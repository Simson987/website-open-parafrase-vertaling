<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Van inspanning naar vreugde</title><desc id="desc">Van inspanning naar vreugde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van inspanning naar vreugde</text><text x="44" y="113" class="ref">Jezus Sirach 6:18–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vrucht · 18–20</text><text x="68" y="241" class="body">Onderwijs vraagt arbeid en geduld</text><text x="68" y="284" class="body">voordat de opbrengst komt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Last · 21–26</text><text x="68" y="433" class="body">Een proefsteen, boeien, halsband en</text><text x="68" y="476" class="body">dragen verbeelden de eerste moeite.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Sieraad · 27–32</text><text x="68" y="625" class="body">Volhouden leidt tot rust; banden worden</text><text x="68" y="668" class="body">bescherming, mantel en kroon.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De praktijk · 33–37</text><text x="68" y="817" class="body">Luisteren naar ouderen, de wijze</text><text x="68" y="860" class="body">bezoeken en de geboden overdenken.</text><text x="46" y="953" class="note">De boeien en halsbanden behoren tot de</text><text x="46" y="989" class="note">vergelijking over onderwijs en veranderen in</text><text x="46" y="1025" class="note">beelden van eer.</text></svg>