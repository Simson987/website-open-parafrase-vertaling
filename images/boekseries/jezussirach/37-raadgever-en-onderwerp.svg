<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1558" viewBox="0 0 840 1558" role="img" aria-labelledby="title desc"><title id="title">Raadgever en onderwerp</title><desc id="desc">Raadgever en onderwerp met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1558" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Raadgever en onderwerp</text><text x="44" y="113" class="ref">Jezus Sirach 37:12–13</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vrouw</text><text x="68" y="241" class="body">Over haar rivale.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Bange man</text><text x="68" y="390" class="body">Over oorlog.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Koopman en koper</text><text x="68" y="539" class="body">Over de handel en over de verkoop.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Jaloers en onbarmhartig mens</text><text x="68" y="688" class="body">Over dankbaarheid en over goeddoen.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Luiaard</text><text x="68" y="837" class="body">Over werk.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Gehuurde dagloner</text><text x="68" y="986" class="body">Over het afmaken van het werk.</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">Trage knecht</text><text x="68" y="1135" class="body">Over zwaar werk.</text><rect x="42" y="1193" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">Het positieve criterium · 13</text><text x="68" y="1284" class="body">Ontzag voor God, de geboden houden en</text><text x="68" y="1327" class="body">verdriet hebben wanneer jij struikelt.</text><text x="46" y="1420" class="note">Dit zijn de combinaties waarvoor de spreker</text><text x="46" y="1456" class="note">waarschuwt vanwege belang of ongeschiktheid bij</text><text x="46" y="1492" class="note">het onderwerp.</text></svg>