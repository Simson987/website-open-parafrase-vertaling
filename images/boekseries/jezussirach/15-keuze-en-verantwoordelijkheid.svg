<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Keuze en verantwoordelijkheid</title><desc id="desc">Keuze en verantwoordelijkheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Keuze en verantwoordelijkheid</text><text x="44" y="113" class="ref">Jezus Sirach 15:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gave van wijsheid · 1–10</text><text x="68" y="241" class="body">Ontvangst, brood, water, steun en</text><text x="68" y="284" class="body">vreugde worden in beelden beschreven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De verkeerde uitvlucht · 11–13</text><text x="68" y="433" class="body">God als oorzaak van afdwalen aanvoeren</text><text x="68" y="476" class="body">wordt afgewezen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De keuze · 14–17</text><text x="68" y="625" class="body">Geboden en trouw, vuur en water, leven</text><text x="68" y="668" class="body">en dood liggen voor de mens.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De rekenschap · 18–20</text><text x="68" y="817" class="body">God ziet het handelen en geeft niemand</text><text x="68" y="860" class="body">opdracht of toestemming om te zondigen.</text><text x="46" y="953" class="note">Vuur en water zijn het keuzebeeld; de mens</text><text x="46" y="989" class="note">blijft verantwoordelijk voor zijn handelen.</text></svg>