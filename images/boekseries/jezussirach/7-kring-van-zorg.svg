<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Een brede kring van zorg</title><desc id="desc">Een brede kring van zorg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een brede kring van zorg</text><text x="44" y="113" class="ref">Jezus Sirach 7:18–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dichtbij · 18–21,27–28</text><text x="68" y="241" class="body">Vriend, broer, echtgenoot, knecht,</text><text x="68" y="284" class="body">dagloner en ouders verdienen trouw en</text><text x="68" y="327" class="body">eer.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het huishouden · 22–26</text><text x="68" y="476" class="body">Zorg voor vee; onderwijs kinderen en</text><text x="68" y="519" class="body">zoek een verstandig huwelijk.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De eredienst · 29–33</text><text x="68" y="668" class="body">Ontzag, priesters eren en hun</text><text x="68" y="711" class="body">voorgeschreven aandeel geven.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De kwetsbaren · 34–38</text><text x="68" y="860" class="body">Armen, doden, rouwenden en zieken niet</text><text x="68" y="903" class="body">vergeten; bij alles aan het einde</text><text x="68" y="946" class="body">denken.</text><text x="46" y="1039" class="note">De voorbeelden verbreden de verantwoordelijkheid</text><text x="46" y="1075" class="note">van eigen huis naar gemeenschap en eredienst.</text></svg>