<svg xmlns="http://www.w3.org/2000/svg" width="840" height="900" viewBox="0 0 840 900"><title>Drie rollen bij lenen en borg</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52725e"/></marker></defs><rect width="840" height="900" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Drie rollen bij lenen en borg</text><text x="42" y="108" font-size="27">Jezus Sirach 29:1–3,17–24</text><rect x="40" y="190" width="290" height="150" rx="18" fill="white" stroke="#92a18e"/><text x="185" y="242" text-anchor="middle" font-size="31" font-weight="700">De uitlener</text><text x="185" y="292" text-anchor="middle" font-size="25">Helpt in nood</text><rect x="510" y="190" width="290" height="150" rx="18" fill="white" stroke="#92a18e"/><text x="655" y="242" text-anchor="middle" font-size="31" font-weight="700">De naaste</text><text x="655" y="292" text-anchor="middle" font-size="25">Geeft tijdig terug</text><path d="M330 265H503" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="245" text-anchor="middle" font-size="25">leent</text><rect x="270" y="500" width="300" height="150" rx="18" fill="white" stroke="#92a18e"/><text x="420" y="555" text-anchor="middle" font-size="31" font-weight="700">De borg</text><text x="420" y="605" text-anchor="middle" font-size="25">Zet zich in</text><path d="M420 500C420 395 655 430 655 348" fill="none" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><text x="565" y="455" text-anchor="middle" font-size="25">borg voor</text><text x="42" y="730" font-size="27">Vergeet niet wie borg voor je stond · 18</text><text x="42" y="779" font-size="27">Hulp naar vermogen en eigen zorgvuldigheid · 24</text><text x="42" y="840" font-size="25">Schematische rollen uit het onderwijs in dit hoofdstuk.</text></g></svg>