<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wat hoger gewaardeerd wordt</title><desc id="desc">Wat hoger gewaardeerd wordt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat hoger gewaardeerd wordt</text><text x="44" y="113" class="ref">Jezus Sirach 40:19–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vreugde · 19–20</text><text x="68" y="241" class="body">Wijsheid boven wijn en muziek; een</text><text x="68" y="284" class="body">vriendelijke tong boven fluit en</text><text x="68" y="327" class="body">snarenspel.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Nabijheid · 21–22</text><text x="68" y="476" class="body">Groen gewas boven wat het oog behaagt;</text><text x="68" y="519" class="body">man en vrouw boven vriend en kameraad.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Hulp · 23–24</text><text x="68" y="668" class="body">Aalmoes boven broers en hulp; goede</text><text x="68" y="711" class="body">raad boven goud en zilver.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Moed · 25–27</text><text x="68" y="860" class="body">Ontzag voor de Heere boven geld en</text><text x="68" y="903" class="body">kracht, als een gezegende tuin.</text><text x="46" y="996" class="note">Elke rij groepeert de afzonderlijke</text><text x="46" y="1032" class="note">vergelijkingen met hun eigen versnummers.</text></svg>