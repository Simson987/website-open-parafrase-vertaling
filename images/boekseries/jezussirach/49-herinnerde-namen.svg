<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De herinnerde namen</title><desc id="desc">De herinnerde namen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De herinnerde namen</text><text x="44" y="113" class="ref">Jezus Sirach 49:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Josia en Jeremia · 1–9</text><text x="68" y="241" class="body">Herstel van ontzag, falende koningen,</text><text x="68" y="284" class="body">verwoesting en het profetische woord.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Profeten · 10–12</text><text x="68" y="433" class="body">Ezechiëls visioen en de gezegende</text><text x="68" y="476" class="body">herinnering aan de twaalf profeten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Herbouwers · 13–15</text><text x="68" y="625" class="body">Zerubbabel en Jesua bouwen de tempel;</text><text x="68" y="668" class="body">Nehemia herstelt muren en poorten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vroege vaderen · 16–19</text><text x="68" y="817" class="body">Henoch, Jozef, Sem, Set en Adam worden</text><text x="68" y="860" class="body">in de slotlof genoemd.</text><text x="46" y="953" class="note">Dit is de volgorde van de loftekst; de vroege</text><text x="46" y="989" class="note">vaderen in het slot leefden niet na de</text><text x="46" y="1025" class="note">herbouwers.</text></svg>