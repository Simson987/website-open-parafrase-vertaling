<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Hulp, onderwijs en waarheid</title><desc id="desc">Hulp, onderwijs en waarheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hulp, onderwijs en waarheid</text><text x="44" y="113" class="ref">Jezus Sirach 4:1–36</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De naaste · 1–11</text><text x="68" y="241" class="body">Snel helpen, vriendelijk luisteren,</text><text x="68" y="284" class="body">onrecht keren en wezen en hun moeder</text><text x="68" y="327" class="body">steunen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het onderwijs · 12–22</text><text x="68" y="476" class="body">Wijsheid beproeft, leidt, verblijdt en</text><text x="68" y="519" class="body">onthult; afdwalen heeft gevolgen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het spreken · 23–33</text><text x="68" y="668" class="body">Waarheid bewaren, schuld erkennen en</text><text x="68" y="711" class="body">wijsheid op het juiste moment</text><text x="68" y="754" class="body">uitspreken.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het handelen · 34–36</text><text x="68" y="903" class="body">Werk ijverig, wees mild in huis en houd</text><text x="68" y="946" class="body">je hand open om te geven.</text><text x="46" y="1039" class="note">De drie bestaande zorgbeelden horen bij het</text><text x="46" y="1075" class="note">eerste deel; de verdere lessen verbinden woord</text><text x="46" y="1111" class="note">en daad.</text></svg>