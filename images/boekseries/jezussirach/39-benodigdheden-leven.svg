<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Tien levensbenodigdheden</title><desc id="desc">Tien levensbenodigdheden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tien levensbenodigdheden</text><text x="44" y="113" class="ref">Jezus Sirach 39:30–31</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Water en vuur</text><text x="68" y="241" class="body">Om te leven.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">IJzer en zout</text><text x="68" y="390" class="body">Als belangrijke middelen genoemd.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Tarwemeel, melk en honing</text><text x="68" y="539" class="body">Drie genoemde voedingsmiddelen.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Druivensap, olie en kleding</text><text x="68" y="688" class="body">De laatste drie elementen van de</text><text x="68" y="731" class="body">opsomming.</text><text x="46" y="824" class="note">Deze tien dingen vormen de lijst in vers 30;</text><text x="46" y="860" class="note">vers 31 bespreekt hun verschillende uitwerking.</text></svg>