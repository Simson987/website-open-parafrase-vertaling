<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Simon en de tempeldienst</title><desc id="desc">Simon en de tempeldienst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Simon en de tempeldienst</text><text x="44" y="113" class="ref">Jezus Sirach 50:1–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herstel · 1–5</text><text x="68" y="241" class="body">Heiligdom, muur, wateropslag en zorg</text><text x="68" y="284" class="body">voor het volk.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De lofbeelden · 6–10</text><text x="68" y="433" class="body">Hemellichten, bloemen, wierook,</text><text x="68" y="476" class="body">sierwerk en bomen beschrijven zijn</text><text x="68" y="519" class="body">luister.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De dienst · 11–20</text><text x="68" y="668" class="body">Altaar, priesterkring, beker,</text><text x="68" y="711" class="body">trompetten, neerbuigen, zang en gebed.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zegen en slot · 21–30</text><text x="68" y="860" class="body">Simon zegent; dank en vredesgebed</text><text x="68" y="903" class="body">volgen, daarna de afsluiting van het</text><text x="68" y="946" class="body">onderwijs.</text><text x="46" y="1039" class="note">De natuurvergelijkingen beschrijven de luister</text><text x="46" y="1075" class="note">van Simon; zij zijn geen verschillende personen</text><text x="46" y="1111" class="note">of reizen.</text></svg>