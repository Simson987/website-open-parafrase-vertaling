<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Rijkdom en het gehoor van anderen</title><desc id="desc">Rijkdom en het gehoor van anderen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rijkdom en het gehoor van anderen</text><text x="44" y="113" class="ref">Jezus Sirach 13:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ongelijke kracht · 1–17</text><text x="68" y="241" class="body">Pek en een botsende ketel verbeelden</text><text x="68" y="284" class="body">invloed, afhankelijkheid en uitbuiting.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De dierbeelden · 18–23</text><text x="68" y="433" class="body">Soortgenoten, wolf en lam, hyena en</text><text x="68" y="476" class="body">hond en leeuw en wilde ezel illustreren</text><text x="68" y="519" class="body">de verhoudingen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De dubbele maat · 24–28</text><text x="68" y="668" class="body">De rijke krijgt hulp en aandacht; de</text><text x="68" y="711" class="body">arme wordt verstoten of niet gehoord.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het slot · 29–31</text><text x="68" y="860" class="body">Rijkdom zonder zonde wordt goed</text><text x="68" y="903" class="body">genoemd; het hart en verstandig overleg</text><text x="68" y="946" class="body">blijven van belang.</text><text x="46" y="1039" class="note">Het hoofdstuk benoemt een scheve sociale</text><text x="46" y="1075" class="note">praktijk. Het slot maakt onderscheid tussen</text><text x="46" y="1111" class="note">rijkdom en onrecht.</text></svg>