<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Zekerheid, omkeer en woorden</title><desc id="desc">Zekerheid, omkeer en woorden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zekerheid, omkeer en woorden</text><text x="44" y="113" class="ref">Jezus Sirach 5:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Valse zekerheid · 1–7</text><text x="68" y="241" class="body">Rijkdom, eigen kracht en een beroep op</text><text x="68" y="284" class="body">geduld of vergeving zijn geen grond om</text><text x="68" y="327" class="body">door te zondigen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De oproep · 8–10</text><text x="68" y="476" class="body">Stel bekering niet uit en steun niet op</text><text x="68" y="519" class="body">onrechtvaardige rijkdom.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Eenduidig spreken · 11–15</text><text x="68" y="668" class="body">Blijf bij het zekere, luister snel,</text><text x="68" y="711" class="body">antwoord geduldig en zwijg bij gebrek</text><text x="68" y="754" class="body">aan inzicht.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De naaste · 16–18</text><text x="68" y="903" class="body">Roddel, dubbel spreken en</text><text x="68" y="946" class="body">valstrikken met de tong worden</text><text x="68" y="989" class="body">afgewezen.</text><text x="46" y="1082" class="note">Het hoofdstuk verbindt verantwoordelijkheid voor</text><text x="46" y="1118" class="note">handelen met verantwoordelijkheid voor spreken.</text></svg>