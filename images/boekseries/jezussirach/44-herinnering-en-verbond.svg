<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Herinnering en verbond</title><desc id="desc">Herinnering en verbond met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herinnering en verbond</text><text x="44" y="113" class="ref">Jezus Sirach 44:1–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De lof · 1–9</text><text x="68" y="241" class="body">Leiders, raadgevers, profeten, leraren,</text><text x="68" y="284" class="body">dichters en welgestelden worden</text><text x="68" y="327" class="body">herinnerd.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De vergeten en de trouwe · 10–16</text><text x="68" y="476" class="body">Niet ieder houdt een bekende naam;</text><text x="68" y="519" class="body">barmhartige daden en verbondstrouw</text><text x="68" y="562" class="body">blijven.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Henoch en Noach · 17–19</text><text x="68" y="711" class="body">Henoch als voorbeeld; Noach met</text><text x="68" y="754" class="body">bewaring van leven en verbond.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De aartsvaders · 20–26</text><text x="68" y="903" class="body">Abraham, Izak en Jakob; zegen, talrijk</text><text x="68" y="946" class="body">nageslacht en twaalf stammen.</text><text x="46" y="1039" class="note">Het hoofdstuk prijst de vaderen en haalt hun</text><text x="46" y="1075" class="note">geschiedenis aan; het is geen nieuwe gebeurtenis</text><text x="46" y="1111" class="note">met al deze mensen samen.</text></svg>