<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Opvolging en breuk</title><desc id="desc">Opvolging en breuk met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opvolging en breuk</text><text x="44" y="113" class="ref">Jezus Sirach 47:14–28</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">David → Salomo · 14</text><text x="68" y="241" class="body">Salomo volgt als Davids zoon op.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Salomo → Rehabeam · 26</text><text x="68" y="390" class="body">De genoemde opvolger is uit zijn</text><text x="68" y="433" class="body">nageslacht; zijn beleid doet het volk</text><text x="68" y="476" class="body">afvallen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jerobeam, zoon van Nebat · 27</text><text x="68" y="625" class="body">Een onderscheiden persoon, verbonden</text><text x="68" y="668" class="body">aan het afvallige Israël en Efraïm.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gevolg en overblijfsel · 22–28</text><text x="68" y="817" class="body">Het rijk scheurt; barmhartigheid</text><text x="68" y="860" class="body">bewaart een wortel, maar zonde leidt</text><text x="68" y="903" class="body">tot verdrijving.</text><text x="46" y="996" class="note">Jerobeam is niet als zoon van Salomo</text><text x="46" y="1032" class="note">weergegeven; de tekst noemt Nebat als zijn</text><text x="46" y="1068" class="note">vader.</text></svg>