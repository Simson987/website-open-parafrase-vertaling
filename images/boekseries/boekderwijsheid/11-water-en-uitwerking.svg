<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Eén middel, twee uitwerkingen</title><desc id="desc">Eén middel, twee uitwerkingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eén middel, twee uitwerkingen</text><text x="44" y="113" class="ref">Wijsheid 11:4–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het eigen volk · 4,8–11</text><text x="68" y="241" class="body">Dorst, roepen en overvloedig rotswater;</text><text x="68" y="284" class="body">beproefd als door een vader.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De tegenstanders · 7,11–15</text><text x="68" y="433" class="body">Het water wordt een plaag; onderzocht</text><text x="68" y="476" class="body">als door een strenge koning.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dieren · 16–17</text><text x="68" y="625" class="body">De vereerde dieren keren terug in de</text><text x="68" y="668" class="body">straf.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De les · 17</text><text x="68" y="817" class="body">Waarmee men zondigt, daarmee wordt men</text><text x="68" y="860" class="body">gestraft.</text><text x="46" y="953" class="note">Het hoofdstuk vergelijkt twee uitwerkingen; de</text><text x="46" y="989" class="note">beelden worden niet tot één enkel</text><text x="46" y="1025" class="note">woestijnvoorval samengevoegd.</text></svg>