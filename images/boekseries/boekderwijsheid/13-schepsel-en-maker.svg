<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Van zichtbaar werk naar de maker</title><desc id="desc">Van zichtbaar werk naar de maker met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van zichtbaar werk naar de maker</text><text x="44" y="113" class="ref">Wijsheid 13:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat mensen zien · 1–2</text><text x="68" y="241" class="body">Goede dingen, vuur, wind, sterren,</text><text x="68" y="284" class="body">water en hemellichten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De gevolgtrekking · 3–5</text><text x="68" y="433" class="body">Schoonheid en kracht wijzen volgens het</text><text x="68" y="476" class="body">betoog op een grotere maker.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De zoekende mensen · 6–7</text><text x="68" y="625" class="body">Zij onderzoeken de mooie werken en</text><text x="68" y="668" class="body">willen vinden.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het verwijt · 8–10</text><text x="68" y="817" class="body">Kennis van de wereld wordt niet tot</text><text x="68" y="860" class="body">erkenning van de Heere gebracht;</text><text x="68" y="903" class="body">maakwerk wordt god genoemd.</text><text x="46" y="996" class="note">Natuurelementen en menselijke beelden zijn de</text><text x="46" y="1032" class="note">twee besproken vormen van verwarring.</text></svg>