<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Veranderende elementen en tonen</title><desc id="desc">Veranderende elementen en tonen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Veranderende elementen en tonen</text><text x="44" y="113" class="ref">Wijsheid 19:6–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Land en water · 6–9</text><text x="68" y="241" class="body">De wolk beschermt en waar water was</text><text x="68" y="284" class="body">ontstaat een droge weg.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Herinnerde dieren · 10–12</text><text x="68" y="433" class="body">Vliegen, kikkers en kwartels roepen</text><text x="68" y="476" class="body">eerdere ervaringen op.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vergelijking · 17</text><text x="68" y="625" class="body">Elementen veranderen zoals tonen in een</text><text x="68" y="668" class="body">snarenspel, met blijvende klank.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vuur en water · 18–20</text><text x="68" y="817" class="body">De gewone werking wordt aangepast: vuur</text><text x="68" y="860" class="body">brandt in water en hemels eten blijft</text><text x="68" y="903" class="body">behouden.</text><text x="46" y="996" class="note">Het snarenspel is een vergelijking die de</text><text x="46" y="1032" class="note">wonderen uitlegt, geen afzonderlijk verteld</text><text x="46" y="1068" class="note">optreden van een muzikant.</text></svg>