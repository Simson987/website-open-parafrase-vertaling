<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat het gebed vraagt</title><desc id="desc">Wat het gebed vraagt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat het gebed vraagt</text><text x="44" y="113" class="ref">Wijsheid 9:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De opdracht · 1–3,7–8</text><text x="68" y="241" class="body">De wereld en het volk rechtvaardig</text><text x="68" y="284" class="body">besturen; tempel en altaar bouwen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De beperking · 5–6,13–16</text><text x="68" y="433" class="body">De mens is zwak, kort van leven en</text><text x="68" y="476" class="body">onzeker in zijn gedachten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het verzoek · 4,9–11,17</text><text x="68" y="625" class="body">Wijsheid wordt bij God gezocht en van</text><text x="68" y="668" class="body">Zijn heerlijke troon gevraagd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het doel · 12,18–19</text><text x="68" y="817" class="body">Aangenaam werk, rechtvaardig bestuur,</text><text x="68" y="860" class="body">rechte paden en redding.</text><text x="46" y="953" class="note">Het schema ordent het gebed thematisch; de</text><text x="46" y="989" class="note">versnummers bewaren de oorspronkelijke plaatsen.</text></svg>