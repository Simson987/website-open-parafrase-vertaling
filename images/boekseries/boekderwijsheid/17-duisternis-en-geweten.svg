<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Duisternis, geluid en geweten</title><desc id="desc">Duisternis, geluid en geweten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Duisternis, geluid en geweten</text><text x="44" y="113" class="ref">Wijsheid 17:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De omgeving · 2–6</text><text x="68" y="241" class="body">Een lange nacht, gesloten huizen en</text><text x="68" y="284" class="body">onvoldoende licht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het innerlijk · 7–16</text><text x="68" y="433" class="body">Mislukte toverkunst, schuld en</text><text x="68" y="476" class="body">onzekerheid voeden de angst.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De geluiden · 17–19</text><text x="68" y="625" class="body">Wind, vogels, water, stenen, dieren en</text><text x="68" y="668" class="body">echo’s worden als bedreiging ervaren.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De tegenstelling · 20–21</text><text x="68" y="817" class="body">Elders helder licht en gewoon werk;</text><text x="68" y="860" class="body">voor hen een zware nacht en innerlijke</text><text x="68" y="903" class="body">last.</text><text x="46" y="996" class="note">Gewone geluiden en de angstige duiding ervan</text><text x="46" y="1032" class="note">worden in het betoog met elkaar verbonden.</text></svg>