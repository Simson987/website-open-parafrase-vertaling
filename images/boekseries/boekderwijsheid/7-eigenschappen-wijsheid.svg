<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Hoe de wijsheid beschreven wordt</title><desc id="desc">Hoe de wijsheid beschreven wordt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoe de wijsheid beschreven wordt</text><text x="44" y="113" class="ref">Wijsheid 7:22–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Haar geest · 22–23</text><text x="68" y="241" class="body">Verstandig, heilig, veelzijdig, zuiver,</text><text x="68" y="284" class="body">goeddoend, vriendelijk, vast en</text><text x="68" y="327" class="body">betrouwbaar.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Haar werking · 24,27</text><text x="68" y="476" class="body">Doordringt alles; blijft zichzelf en</text><text x="68" y="519" class="body">vernieuwt alles; maakt vrienden van God</text><text x="68" y="562" class="body">en profeten.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De beelden · 25–26</text><text x="68" y="711" class="body">Damp, zuivere uitstroming, weerschijn,</text><text x="68" y="754" class="body">vlekkeloze spiegel en beeld van</text><text x="68" y="797" class="body">goedheid.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Haar glans · 29–30</text><text x="68" y="946" class="body">Mooier dan zon en sterren; de boosheid</text><text x="68" y="989" class="body">overweldigt haar niet.</text><text x="46" y="1082" class="note">Een samenvattende groepering van de lange</text><text x="46" y="1118" class="note">lofbeschrijving; de beelden zijn geen letterlijk</text><text x="46" y="1154" class="note">levensverhaal van een vrouw.</text></svg>