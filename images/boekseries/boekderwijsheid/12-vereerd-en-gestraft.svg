<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Van dierenverering naar erkenning</title><desc id="desc">Van dierenverering naar erkenning met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9" /><text x="44" y="65" class="title">Van dierenverering naar erkenning</text><text x="44" y="113" class="ref">Wijsheid 12:23–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2" /><text x="68" y="193" class="label">De dwaling · 23–24</text><text x="68" y="241" class="body">Mensen houden zelfs verachte dieren</text><text x="68" y="284" class="body">voor goden.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2" /><text x="68" y="385" class="label">De waarschuwing · 25</text><text x="68" y="433" class="body">Een bespottelijk oordeel behandelt hun</text><text x="68" y="476" class="body">dwaasheid als die van onwetende</text><text x="68" y="519" class="body">kinderen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2" /><text x="68" y="620" class="label">De ernst · 26</text><text x="68" y="668" class="body">Niet luisteren naar die waarschuwing</text><text x="68" y="711" class="body">leidt tot zwaarder oordeel.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2" /><text x="68" y="812" class="label">De erkenning · 27</text><text x="68" y="860" class="body">Door de straf via hun vermeende goden</text><text x="68" y="903" class="body">erkennen zij wie de ware God is.</text><text x="46" y="996" class="note">Het slot verbindt de dwaling, waarschuwing en</text><text x="46" y="1032" class="note">erkenning aan de gevolgen van het oordeel.</text></svg>