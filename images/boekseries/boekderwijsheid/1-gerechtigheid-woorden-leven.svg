<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Gerechtigheid, woorden en leven</title><desc id="desc">Gerechtigheid, woorden en leven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gerechtigheid, woorden en leven</text><text x="44" y="113" class="ref">Wijsheid 1:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zoeken · 1–5</text><text x="68" y="241" class="body">Bestuurders worden geroepen tot</text><text x="68" y="284" class="body">gerechtigheid, een eenvoudig hart en</text><text x="68" y="327" class="body">afstand van bedrog.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Spreken · 6–11</text><text x="68" y="476" class="body">God kent hart en tong; laster, leugen</text><text x="68" y="519" class="body">en verborgen woorden blijven niet</text><text x="68" y="562" class="body">onopgemerkt.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Leven · 12–15</text><text x="68" y="711" class="body">Zoek de ondergang niet; God schiep om</text><text x="68" y="754" class="body">te bestaan en gerechtigheid is</text><text x="68" y="797" class="body">onsterfelijk.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De verkeerde keuze · 16</text><text x="68" y="946" class="body">De goddelozen roepen de dood naar zich</text><text x="68" y="989" class="body">toe en sluiten er een verbond mee.</text><text x="46" y="1082" class="note">Opbouw van het betoog, met spreken als de</text><text x="46" y="1118" class="note">verbinding tussen het innerlijk en het handelen.</text></svg>