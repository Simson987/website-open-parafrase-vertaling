<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De wapens van het ambt</title><desc id="desc">De wapens van het ambt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De wapens van het ambt</text><text x="44" y="113" class="ref">Wijsheid 18:21–25</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat hij meebrengt · 21</text><text x="68" y="241" class="body">Gebed en verzoening door reukwerk.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Hoe hij overwint · 22</text><text x="68" y="390" class="body">Met het woord en de herinnering aan</text><text x="68" y="433" class="body">eden en verbonden.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Waar hij staat · 23</text><text x="68" y="582" class="body">Tussen de getroffenen en de levenden.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Wat hij draagt · 24</text><text x="68" y="731" class="body">Een lang gewaad, vier rijen stenen met</text><text x="68" y="774" class="body">de eer van de voorouders en de</text><text x="68" y="817" class="body">hoofdband.</text><text x="46" y="910" class="note">De tekst zet de ambtelijke voorbede tegenover</text><text x="46" y="946" class="note">lichaamskracht en wapengeweld.</text></svg>