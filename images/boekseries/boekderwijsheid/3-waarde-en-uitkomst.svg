<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Wat werkelijk vrucht draagt</title><desc id="desc">Wat werkelijk vrucht draagt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat werkelijk vrucht draagt</text><text x="44" y="113" class="ref">Wijsheid 3:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rechtvaardigen · 1–9</text><text x="68" y="241" class="body">In Gods hand en in vrede; als goud</text><text x="68" y="284" class="body">beproefd, met hoop en ontferming.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zonder wijsheid · 10–12</text><text x="68" y="433" class="body">Lege hoop, vergeefse moeite en</text><text x="68" y="476" class="body">nutteloos werk.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zuiver leven · 13–15</text><text x="68" y="625" class="body">Ook zonder kinderen worden zuiverheid</text><text x="68" y="668" class="body">en geen onrecht doen geëerd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Onrecht · 16–19</text><text x="68" y="817" class="body">Een groot nageslacht of lang leven</text><text x="68" y="860" class="body">geeft in dit betoog geen blijvende eer.</text><text x="46" y="953" class="note">Goud, vonken, vrucht en wortel zijn</text><text x="46" y="989" class="note">vergelijkingen. De morele waardering wordt niet</text><text x="46" y="1025" class="note">aan aantallen kinderen afgemeten.</text></svg>