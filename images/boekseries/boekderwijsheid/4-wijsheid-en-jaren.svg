<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Wijsheid en het aantal jaren</title><desc id="desc">Wijsheid en het aantal jaren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijsheid en het aantal jaren</text><text x="44" y="113" class="ref">Wijsheid 4:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Deugd · 1–6</text><text x="68" y="241" class="body">Blijvende herinnering tegenover ondiepe</text><text x="68" y="284" class="body">wortels en onrijpe vruchten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ware ouderdom · 7–9</text><text x="68" y="433" class="body">Eer wordt gemeten aan wijsheid en een</text><text x="68" y="476" class="body">zuiver leven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Een vroeg voltooid leven · 10–15</text><text x="68" y="625" class="body">Wie God behaagt kan in korte tijd lange</text><text x="68" y="668" class="body">tijden vervullen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De omkering · 16–20</text><text x="68" y="817" class="body">De gestorven rechtvaardige staat</text><text x="68" y="860" class="body">tegenover levend onrecht en de komende</text><text x="68" y="903" class="body">rekenschap.</text><text x="46" y="996" class="note">Het beeld van grijs haar wordt uitgelegd als</text><text x="46" y="1032" class="note">wijsheid; veel kalenderjaren zijn geen bewijs</text><text x="46" y="1068" class="note">van gerechtigheid.</text></svg>