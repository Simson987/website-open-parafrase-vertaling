<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Vier lessen van de wijsheid</title><desc id="desc">Vier lessen van de wijsheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier lessen van de wijsheid</text><text x="44" y="113" class="ref">Wijsheid 8:7–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De genoemde deugden · 7</text><text x="68" y="241" class="body">Nuchterheid, verstand, gerechtigheid en</text><text x="68" y="284" class="body">moed.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Haar raad · 8–12</text><text x="68" y="433" class="body">Inzicht in geschiedenissen, woorden en</text><text x="68" y="476" class="body">raadsels; raad in zorg en bij</text><text x="68" y="519" class="body">rechtspraak.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Haar omgang · 13–18</text><text x="68" y="668" class="body">Blijvende herinnering, vreugde, rust en</text><text x="68" y="711" class="body">verstand.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De gave · 19–21</text><text x="68" y="860" class="body">De spreker beseft dat alleen God haar</text><text x="68" y="903" class="body">kan geven en begint te bidden.</text><text x="46" y="996" class="note">De bruid en huisgenoot uit 2 en 9–16</text><text x="46" y="1032" class="note">personifiëren de wijsheid; er wordt geen</text><text x="46" y="1068" class="note">huwelijk met een historische vrouw beschreven.</text></svg>