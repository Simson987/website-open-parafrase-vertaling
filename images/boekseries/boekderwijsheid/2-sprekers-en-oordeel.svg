<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Wie spreekt in dit hoofdstuk?</title><desc id="desc">Wie spreekt in dit hoofdstuk? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie spreekt in dit hoofdstuk?</text><text x="44" y="113" class="ref">Wijsheid 2:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hun overleg · 1–5</text><text x="68" y="241" class="body">De goddelozen noemen het leven kort,</text><text x="68" y="284" class="body">toevallig en zonder terugkeer.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hun gevolgtrekking · 6–20</text><text x="68" y="433" class="body">Zij kiezen weelde, onderdrukking en het</text><text x="68" y="476" class="body">beproeven van de rechtvaardige.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het oordeel van de tekst · 21–22</text><text x="68" y="625" class="body">Zij vergissen zich; hun boosheid</text><text x="68" y="668" class="body">verblindt hen voor Gods geheimen en het</text><text x="68" y="711" class="body">loon.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De tegenstem · 23–24</text><text x="68" y="860" class="body">De mens is geschapen om niet te</text><text x="68" y="903" class="body">vergaan; de dood komt door afgunst.</text><text x="46" y="996" class="note">De uitspraken in het overleg worden</text><text x="46" y="1032" class="note">toegeschreven aan de goddelozen; ze zijn niet</text><text x="46" y="1068" class="note">het eindoordeel van de verteller.</text></svg>