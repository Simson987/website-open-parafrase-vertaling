<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Waarom macht geduldig oordeelt</title><desc id="desc">Waarom macht geduldig oordeelt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom macht geduldig oordeelt</text><text x="44" y="113" class="ref">Wijsheid 12:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De werkwijze · 1–10</text><text x="68" y="241" class="body">Langzame terechtwijzing en tijd om van</text><text x="68" y="284" class="body">kwaad af te zien.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De grond · 12–18</text><text x="68" y="433" class="body">Geen onmacht of angst:</text><text x="68" y="476" class="body">rechtvaardigheid, heerschappij en</text><text x="68" y="519" class="body">geduld.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De les voor het volk · 19–21</text><text x="68" y="668" class="body">Vriendelijk voor mensen zijn, hoop op</text><text x="68" y="711" class="body">bekering en zorg voor de eigen</text><text x="68" y="754" class="body">kinderen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De toepassing · 22</text><text x="68" y="903" class="body">Bij eigen rechtspraak op goedheid</text><text x="68" y="946" class="body">letten en zelf ontferming verwachten.</text><text x="46" y="1039" class="note">Dit is de redenering van het hoofdstuk. De</text><text x="46" y="1075" class="note">eerste illustraties tonen wespen, mild oordelen</text><text x="46" y="1111" class="note">en omkeer.</text></svg>