<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Van vluchteling tot bevrijd volk</title><desc id="desc">Van vluchteling tot bevrijd volk met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van vluchteling tot bevrijd volk</text><text x="44" y="113" class="ref">Wijsheid 10:10–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vlucht voor een broer · 10–12</text><text x="68" y="241" class="body">Leiding, gezegend werk en bescherming</text><text x="68" y="284" class="body">in de strijd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De verkochte rechtvaardige · 13–14</text><text x="68" y="433" class="body">Niet verlaten in put en boeien; daarna</text><text x="68" y="476" class="body">scepter, macht en eer.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het onderdrukte volk · 15–19</text><text x="68" y="625" class="body">Wonderen, beschutting, nachtelijk licht</text><text x="68" y="668" class="body">en doorgang door de Rode Zee.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het antwoord · 20–21</text><text x="68" y="817" class="body">Gezamenlijke lof en geopende monden.</text><text x="46" y="910" class="note">De wijsheid is de handelende kracht in deze</text><text x="46" y="946" class="note">terugblik; de menselijke verhalen zijn</text><text x="46" y="982" class="note">verschillende voorbeelden.</text></svg>