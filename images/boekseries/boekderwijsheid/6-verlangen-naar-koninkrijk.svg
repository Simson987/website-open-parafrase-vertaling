<svg xmlns="http://www.w3.org/2000/svg" width="840" height="882" viewBox="0 0 840 882"><title>Van verlangen naar nabijheid</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="882" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Van verlangen naar nabijheid</text><text x="42" y="105" font-size="25">Wijsheid 6:17–20</text><rect x="150" y="155" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="191" text-anchor="middle" font-size="31">Verlangen naar onderwijs</text><path d="M420 209 V229" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="235" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="271" text-anchor="middle" font-size="31">Zorg om onderwezen te worden</text><path d="M420 289 V309" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="315" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="351" text-anchor="middle" font-size="31">Liefde</text><path d="M420 369 V389" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="395" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="431" text-anchor="middle" font-size="31">Houden van de wetten</text><path d="M420 449 V469" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="475" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="511" text-anchor="middle" font-size="31">Zekerheid niet te vergaan</text><path d="M420 529 V549" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="555" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="591" text-anchor="middle" font-size="31">Dicht bij God</text><path d="M420 609 V629" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="635" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="671" text-anchor="middle" font-size="31">Het koninkrijk</text><text x="42" y="735" font-size="26">Redeneringsstappen uit 17–20. De laatste zin</text><text x="42" y="769" font-size="26">verbindt het verlangen naar wijsheid met het</text><text x="42" y="803" font-size="26">koninkrijk.</text></g></svg>