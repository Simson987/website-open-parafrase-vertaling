<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De omgang met vreemdelingen</title><desc id="desc">De omgang met vreemdelingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De omgang met vreemdelingen</text><text x="44" y="113" class="ref">Wijsheid 19:13–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sodom · 13</text><text x="68" y="241" class="body">De onbekenden die kwamen werden niet</text><text x="68" y="284" class="body">opgenomen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Egypte · 13–15</text><text x="68" y="433" class="body">Weldoende vreemdelingen werden tot</text><text x="68" y="476" class="body">slavernij en zwaar werk gedwongen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het eerdere onthaal · 15</text><text x="68" y="625" class="body">Wie met een feest ontvangen waren,</text><text x="68" y="668" class="body">deelden al dezelfde rechten.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het slotbeeld · 16</text><text x="68" y="817" class="body">Blindheid en zoeken naar de eigen deur</text><text x="68" y="860" class="body">herinneren aan de mannen voor de deur</text><text x="68" y="903" class="body">van de rechtvaardige.</text><text x="46" y="996" class="note">De tekst legt twee voorbeelden naast elkaar en</text><text x="46" y="1032" class="note">noemt de Egyptische vijandschap zwaarder.</text></svg>