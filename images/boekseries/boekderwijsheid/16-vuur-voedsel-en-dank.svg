<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Vuur, brood en dankbaarheid</title><desc id="desc">Vuur, brood en dankbaarheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vuur, brood en dankbaarheid</text><text x="44" y="113" class="ref">Wijsheid 16:16–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vuur en water · 16–19</text><text x="68" y="241" class="body">Regen en hagel begeleiden een vuur dat</text><text x="68" y="284" class="body">de gewassen van de tegenstanders</text><text x="68" y="327" class="body">verteert.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Brood uit de hemel · 20–26</text><text x="68" y="476" class="body">De gave voedt het volk; de schepping</text><text x="68" y="519" class="body">dient en het woord houdt in stand.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Smelten · 22–23,27</text><text x="68" y="668" class="body">Wat het vuur spaart, smelt door een</text><text x="68" y="711" class="body">kleine zonnestraal.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vroeg danken · 28–29</text><text x="68" y="860" class="body">De zon vóór zijn met dank; ondankbare</text><text x="68" y="903" class="body">hoop is als verdwijnende rijp.</text><text x="46" y="996" class="note">De verschillende uitwerkingen van de elementen</text><text x="46" y="1032" class="note">verbinden de wonderen met de oproep tot dank.</text></svg>