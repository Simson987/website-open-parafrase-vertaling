<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De genoemde kennisgebieden</title><desc id="desc">De genoemde kennisgebieden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde kennisgebieden</text><text x="44" y="113" class="ref">Wijsheid 7:17–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wereld en elementen · 17</text><text x="68" y="241" class="body">Hoe de wereld in elkaar zit en de</text><text x="68" y="284" class="body">elementen werken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tijd en hemel · 18–19</text><text x="68" y="433" class="body">Tijden, zonnewendes, seizoenen, jaar en</text><text x="68" y="476" class="body">sterren.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Leven en beweging · 20</text><text x="68" y="625" class="body">Dieren, winden, gedachten, planten en</text><text x="68" y="668" class="body">wortels.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De bron · 21</text><text x="68" y="817" class="body">De wijsheid leert het verborgene en het</text><text x="68" y="860" class="body">openbare.</text><text x="46" y="953" class="note">Dit ordent de opsomming zonder er moderne</text><text x="46" y="989" class="note">vakken, ontdekkingen of onbekende formules aan</text><text x="46" y="1025" class="note">toe te voegen.</text></svg>