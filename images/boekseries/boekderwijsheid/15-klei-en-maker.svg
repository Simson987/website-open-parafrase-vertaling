<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De klei, de pot en de maker</title><desc id="desc">De klei, de pot en de maker met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De klei, de pot en de maker</text><text x="44" y="113" class="ref">Wijsheid 15:7–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dezelfde grondstof · 7–8</text><text x="68" y="241" class="body">De pottenbakker vormt gebruiksgoed en</text><text x="68" y="284" class="body">een vermeende god uit dezelfde klei.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De levende maker · 8–11</text><text x="68" y="433" class="body">Zelf uit aarde genomen, kort van leven</text><text x="68" y="476" class="body">en afhankelijk van ontvangen adem.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De winstgedachte · 9,12–13</text><text x="68" y="625" class="body">Eer zoeken in namaak en winst zelfs uit</text><text x="68" y="668" class="body">het kwade.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het levenloze maaksel · 15–17</text><text x="68" y="817" class="body">Het beeld kan niet zien, ademen, horen,</text><text x="68" y="860" class="body">tasten of lopen.</text><text x="46" y="953" class="note">De vergelijking verklaart waarom de levende</text><text x="46" y="989" class="note">maker in dit betoog hoger staat dan zijn</text><text x="46" y="1025" class="note">levenloze maaksel.</text></svg>