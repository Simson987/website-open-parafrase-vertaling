<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat de valse eed niet veilig maakt</title><desc id="desc">Wat de valse eed niet veilig maakt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat de valse eed niet veilig maakt</text><text x="44" y="113" class="ref">Wijsheid 14:22–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verkeerde vertrouwen · 28–29</text><text x="68" y="241" class="body">Men verwacht geen kwaad van een valse</text><text x="68" y="284" class="body">eed bij levenloze beelden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste grond · 30</text><text x="68" y="433" class="body">Verkeerd over God denken en zich aan de</text><text x="68" y="476" class="body">afgoden vastklampen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tweede grond · 30</text><text x="68" y="625" class="body">Onrechtvaardig en bedrieglijk zweren en</text><text x="68" y="668" class="body">de heiligheid verachten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De uitkomst · 31</text><text x="68" y="817" class="body">Het oordeel volgt de overtreding, niet</text><text x="68" y="860" class="body">de macht van het aangeroepen beeld.</text><text x="46" y="953" class="note">Het schema koppelt de twee genoemde gronden van</text><text x="46" y="989" class="note">het oordeel aan het slot van het betoog.</text></svg>