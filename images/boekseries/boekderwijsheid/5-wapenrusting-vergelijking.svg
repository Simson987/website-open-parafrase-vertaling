<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Wapenrusting als beeldspraak</title><desc id="desc">Wapenrusting als beeldspraak met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wapenrusting als beeldspraak</text><text x="44" y="113" class="ref">Wijsheid 5:18–24</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Borstharnas · 19</text><text x="68" y="241" class="body">Gerechtigheid.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Helm · 19</text><text x="68" y="390" class="body">Eerlijk oordeel.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Schild en zwaard · 20–21</text><text x="68" y="539" class="body">Heiligheid en strenge toorn.</text><rect x="42" y="597" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">De schepping · 22–24</text><text x="68" y="688" class="body">Bliksem als pijlen, hagel als</text><text x="68" y="731" class="body">slingerstenen, zee, rivieren en</text><text x="68" y="774" class="body">wervelwind.</text><text x="46" y="867" class="note">Dit schema koppelt de genoemde beelden aan hun</text><text x="46" y="903" class="note">betekenis; het tekent God niet als een</text><text x="46" y="939" class="note">menselijke krijger.</text></svg>