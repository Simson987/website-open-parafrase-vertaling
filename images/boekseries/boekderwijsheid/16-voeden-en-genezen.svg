<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Plagen, voedsel en genezing</title><desc id="desc">Plagen, voedsel en genezing met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plagen, voedsel en genezing</text><text x="44" y="113" class="ref">Wijsheid 16:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dieren en eten · 1–4</text><text x="68" y="241" class="body">Plagen voor de onderdrukkers, kwartels</text><text x="68" y="284" class="body">voor het volk in gebrek.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het teken · 5–8</text><text x="68" y="433" class="body">Het reddingsteken herinnert aan het</text><text x="68" y="476" class="body">gebod; God redt wie zich ernaartoe</text><text x="68" y="519" class="body">keert.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De genezing · 9–12</text><text x="68" y="668" class="body">Ontferming en het woord worden als de</text><text x="68" y="711" class="body">bron van herstel aangewezen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De grens · 13–15</text><text x="68" y="860" class="body">God heeft macht over leven en dood;</text><text x="68" y="903" class="body">mensen kunnen de uitgegane geest niet</text><text x="68" y="946" class="body">terughalen.</text><text x="46" y="1039" class="note">De tekst onderscheidt het zichtbare teken van</text><text x="46" y="1075" class="note">Degene die redt.</text></svg>