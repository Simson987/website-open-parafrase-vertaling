<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Licht, paasnacht en voorbede</title><desc id="desc">Licht, paasnacht en voorbede met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Licht, paasnacht en voorbede</text><text x="44" y="113" class="ref">Wijsheid 18:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Licht en leiding · 1–4</text><text x="68" y="241" class="body">Groot licht voor de heiligen en een</text><text x="68" y="284" class="body">vuurkolom op de reis.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vooraf bekende nacht · 5–13</text><text x="68" y="433" class="body">Verbondenheid in offer en lof tegenover</text><text x="68" y="476" class="body">rouw en de erkenning van Gods kinderen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het almachtige woord · 14–19</text><text x="68" y="625" class="body">In de stilte daalt het woord neer,</text><text x="68" y="668" class="body">vergeleken met een krijgsheld met het</text><text x="68" y="711" class="body">gebod als zwaard.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Voorbede in de woestijn · 20–25</text><text x="68" y="860" class="body">Gebed en verzoenend reukwerk stuiten de</text><text x="68" y="903" class="body">plaag onder het eigen volk.</text><text x="46" y="996" class="note">De laatste voorbede is een later</text><text x="46" y="1032" class="note">woestijnvoorbeeld; het schema onderscheidt dit</text><text x="46" y="1068" class="note">van de paasnacht.</text></svg>