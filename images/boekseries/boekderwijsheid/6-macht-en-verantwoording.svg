<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Macht vraagt verantwoording</title><desc id="desc">Macht vraagt verantwoording met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Macht vraagt verantwoording</text><text x="44" y="113" class="ref">Wijsheid 6:1–11,21–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oorsprong · 3</text><text x="68" y="241" class="body">Macht en gezag worden door de Heere</text><text x="68" y="284" class="body">gegeven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het onderzoek · 4–8</text><text x="68" y="433" class="body">Rechtspraak, wet en raad worden</text><text x="68" y="476" class="body">onderzocht; grootheid geeft geen</text><text x="68" y="519" class="body">vrijstelling.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het antwoord · 9–11</text><text x="68" y="668" class="body">Koningen worden opgeroepen wijsheid te</text><text x="68" y="711" class="body">leren en onderwijs te verlangen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het welzijn · 21–25</text><text x="68" y="860" class="body">Eer de wijsheid; een wijze koning is</text><text x="68" y="903" class="body">het welzijn van het volk.</text><text x="46" y="996" class="note">De oproep richt zich tot koningen en rechters,</text><text x="46" y="1032" class="note">met bijzondere verantwoordelijkheid voor wie</text><text x="46" y="1068" class="note">hoog geplaatst is.</text></svg>