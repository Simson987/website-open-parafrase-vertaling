<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat gebeurt er met hetzelfde hout?</title><desc id="desc">Wat gebeurt er met hetzelfde hout? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat gebeurt er met hetzelfde hout?</text><text x="44" y="113" class="ref">Wijsheid 13:11–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het nuttige werk · 11</text><text x="68" y="241" class="body">De timmerman maakt iets bruikbaars voor</text><text x="68" y="284" class="body">het dagelijks leven.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De resten · 12</text><text x="68" y="433" class="body">Schaafsel dient om eten te koken.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het overblijvende stuk · 13–16</text><text x="68" y="582" class="body">Een krom stuk wordt gesneden, geverfd</text><text x="68" y="625" class="body">en vastgezet omdat het zichzelf niet</text><text x="68" y="668" class="body">kan helpen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De omkering · 17–19</text><text x="68" y="817" class="body">Toch wordt het om gezondheid, leven,</text><text x="68" y="860" class="body">reis en winst gevraagd.</text><text x="46" y="953" class="note">De ironie berust op de tegenstelling tussen hulp</text><text x="46" y="989" class="note">nodig hebben en om hulp worden gevraagd.</text></svg>