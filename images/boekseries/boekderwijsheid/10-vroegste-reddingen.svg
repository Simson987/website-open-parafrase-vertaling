<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1084" viewBox="0 0 840 1084" role="img" aria-labelledby="title desc"><title id="title">Wijsheid in de vroegste verhalen</title><desc id="desc">Wijsheid in de vroegste verhalen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1084" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijsheid in de vroegste verhalen</text><text x="44" y="113" class="ref">Wijsheid 10:1–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerstgevormde vader · 1–2</text><text x="68" y="241" class="body">Bewaard en uit zijn val getrokken.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De broedermoordenaar · 3</text><text x="68" y="390" class="body">Valt door woede van de wijsheid af.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Het eenvoudige hout · 4</text><text x="68" y="539" class="body">De rechtvaardige wordt door de vloed</text><text x="68" y="582" class="body">heen gered.</text><rect x="42" y="640" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Verwarring en vuur · 5–9</text><text x="68" y="731" class="body">Een vader blijft standvastig over zijn</text><text x="68" y="774" class="body">zoon; een rechtvaardige ontkomt aan de</text><text x="68" y="817" class="body">brandende steden.</text><text x="46" y="910" class="note">De verzen vertellen de herinnerde verhalen</text><text x="46" y="946" class="note">zonder deze personen bij naam te noemen; de</text><text x="46" y="982" class="note">bijbehorende scènes zijn herkenbare Bijbelse</text><text x="46" y="1018" class="note">toespelingen.</text></svg>