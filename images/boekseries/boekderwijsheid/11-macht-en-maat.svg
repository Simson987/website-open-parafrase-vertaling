<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Grote macht, maat en ontferming</title><desc id="desc">Grote macht, maat en ontferming met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Grote macht, maat en ontferming</text><text x="44" y="113" class="ref">Wijsheid 11:18–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat had gekund · 18–21</text><text x="68" y="241" class="body">Beren, leeuwen, onbekende dieren en één</text><text x="68" y="284" class="body">ademstoot worden als mogelijkheden</text><text x="68" y="327" class="body">genoemd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wat de tekst zegt · 21–23</text><text x="68" y="476" class="body">Alles is geordend naar maat, getal en</text><text x="68" y="519" class="body">gewicht; de wereld is als stof of dauw.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Waarom sparen · 24</text><text x="68" y="668" class="body">Macht gaat samen met ontferming en</text><text x="68" y="711" class="body">ruimte voor bekering.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Waarom behouden · 25–27</text><text x="68" y="860" class="body">God houdt van wat Hij gemaakt heeft en</text><text x="68" y="903" class="body">spaart wat van Hem is.</text><text x="46" y="996" class="note">De vuurblazende dieren zijn een hypothetische</text><text x="46" y="1032" class="note">mogelijkheid, geen vertelde historische plaag.</text></svg>