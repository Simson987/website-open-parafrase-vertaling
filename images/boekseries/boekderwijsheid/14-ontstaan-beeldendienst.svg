<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Twee wegen naar beeldendienst</title><desc id="desc">Twee wegen naar beeldendienst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee wegen naar beeldendienst</text><text x="44" y="113" class="ref">Wijsheid 14:12–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verdriet · 15–16</text><text x="68" y="241" class="body">Een vader maakt een beeld van zijn</text><text x="68" y="284" class="body">verloren zoon; de gewoonte wordt later</text><text x="68" y="327" class="body">als wet gehouden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Afstand · 17</text><text x="68" y="476" class="body">Een afbeelding vervangt de afwezige</text><text x="68" y="519" class="body">koning om hem te eren.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Eerzucht · 18–20</text><text x="68" y="668" class="body">De kunstenaar verfraait het beeld; het</text><text x="68" y="711" class="body">volk gaat de vereerde mens voor god</text><text x="68" y="754" class="body">houden.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het gezamenlijke gevolg · 21</text><text x="68" y="903" class="body">Aan steen en hout wordt de naam gegeven</text><text x="68" y="946" class="body">die hun niet toekomt.</text><text x="46" y="1039" class="note">Dit zijn de oorsprongsverklaringen in het</text><text x="46" y="1075" class="note">betoog; de tekst geeft hier geen namen of</text><text x="46" y="1111" class="note">jaartallen.</text></svg>