<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Twee groepen van zeven</title><desc id="desc">De veertien namen in hun verschillende functies.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee groepen van zeven</text><text x="44" y="113" class="ref">Esther 1:10–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zeven hofbeambten</text><text x="68" y="241" class="body">Mehuman, Biztha, Charbona, Bigtha,</text><text x="68" y="284" class="body">Abagtha, Zethar en Charchas brengen de</text><text x="68" y="327" class="body">oproep over.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zeven leiders</text><text x="68" y="476" class="body">Carsena, Sethar, Admatha, Tharsis,</text><text x="68" y="519" class="body">Meres, Marsena en Memuchan staan dicht</text><text x="68" y="562" class="body">bij de koning.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Memuchan</text><text x="68" y="711" class="body">Licht zijn advies over Vasthi en het</text><text x="68" y="754" class="body">koninklijke bevel toe.</text><text x="46" y="847" class="note">De hofbeambten zijn niet dezelfde groep als de</text><text x="46" y="883" class="note">zeven leiders die raad geven.</text></svg>