<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Twee uitnodigingen en Haman</title><desc id="desc">De twee uitnodigingen en de omslag van Hamans vreugde naar woede.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee uitnodigingen en Haman</text><text x="44" y="113" class="ref">Esther 5:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Derde dag</text><text x="68" y="241" class="body">Koninklijke kleding, binnenhof, scepter</text><text x="68" y="284" class="body">en genegenheid.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste maaltijd</text><text x="68" y="433" class="body">Vandaag met de koning en Haman.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Volgende uitnodiging</text><text x="68" y="582" class="body">Morgen opnieuw; Esther stelt haar</text><text x="68" y="625" class="body">eigenlijke verzoek uit.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Haman buiten</text><text x="68" y="774" class="body">Vrolijk weg, boos door de zittende</text><text x="68" y="817" class="body">Mordechai; thuis rijkdom, zonen en eer</text><text x="68" y="860" class="body">opsommen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Zeres en vrienden</text><text x="68" y="1009" class="body">Adviseren een paal voor Mordechai;</text><text x="68" y="1052" class="body">Haman laat die maken.</text><text x="46" y="1145" class="note">De tweede maaltijd wordt voorbereid en</text><text x="46" y="1181" class="note">uitgenodigd; zij vindt pas in het vervolg</text><text x="46" y="1217" class="note">plaats. Het ophangen is hier een plan.</text></svg>