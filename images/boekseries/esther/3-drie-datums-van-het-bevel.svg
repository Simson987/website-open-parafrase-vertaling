<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Drie datums rond het bevel</title><desc id="desc">Het verschil tussen loting, het opstellen van het bevel en de geplande geweldsdag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie datums rond het bevel</text><text x="44" y="113" class="ref">Esther 3:7–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nisan, jaar twaalf</text><text x="68" y="241" class="body">Het pur, het lot, wordt voor Haman</text><text x="68" y="284" class="body">geworpen; uitkomst in Adar.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nisan dertien</text><text x="68" y="433" class="body">Schrijvers geroepen; het bevel op</text><text x="68" y="476" class="body">schrift en met de koningsring</text><text x="68" y="519" class="body">verzegeld.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Adar dertien</text><text x="68" y="668" class="body">Geplande dag van uitroeiing, doden en</text><text x="68" y="711" class="body">plunderen; ook kinderen en vrouwen</text><text x="68" y="754" class="body">worden bedreigd.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Bekendmaking</text><text x="68" y="903" class="body">Afschriften in de gewesten;</text><text x="68" y="946" class="body">voorbereiding op de vastgestelde dag.</text><text x="46" y="1039" class="note">Nisan is maand één en Adar maand twaalf. De</text><text x="46" y="1075" class="note">verzenddatum en de bedreigde uitvoeringsdatum</text><text x="46" y="1111" class="note">zijn verschillende dagen.</text></svg>