<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1362" viewBox="0 0 840 1362" role="img" aria-labelledby="title desc"><title id="title">Voorbereiding, kroon, kroniek</title><desc id="desc">Verzorgingsduur, koninklijke datum en het vastgelegde onderzoek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1362" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voorbereiding, kroon, kroniek</text><text x="44" y="113" class="ref">Esther 2:12–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twaalf maanden</text><text x="68" y="241" class="body">Zes maanden mirreolie, zes maanden</text><text x="68" y="284" class="body">balsem en andere middelen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tebeth, jaar zeven</text><text x="68" y="433" class="body">Esther komt in maand tien bij</text><text x="68" y="476" class="body">Ahasveros.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Koningin</text><text x="68" y="625" class="body">Kroon, koninklijke plaats, feest,</text><text x="68" y="668" class="body">kwijtschelding en geschenken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Verborgen afkomst</text><text x="68" y="817" class="body">Esther heeft haar volk en familie nog</text><text x="68" y="860" class="body">niet bekendgemaakt.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het onderzoek</text><text x="68" y="1009" class="body">Mordechai ontdekt het plan; Esther</text><text x="68" y="1052" class="body">meldt het; bevestigd en in de kronieken</text><text x="68" y="1095" class="body">geschreven.</text><text x="46" y="1188" class="note">De kronieknotitie is belangrijk voor het</text><text x="46" y="1224" class="note">vervolg. De passage noemt terechtstelling van de</text><text x="46" y="1260" class="note">twee samenzweerders; die wordt niet in de</text><text x="46" y="1296" class="note">schrijfscène afgebeeld.</text></svg>