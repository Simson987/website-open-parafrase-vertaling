<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Dagen, aantallen en rust</title><desc id="desc">Afzonderlijke aantallen en het verschil tussen de rustdagen in Susan en de overige steden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dagen, aantallen en rust</text><text x="44" y="113" class="ref">Esther 9:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Adar dertien, Susan</text><text x="68" y="241" class="body">Vijfhonderd mannen en de tien zonen van</text><text x="68" y="284" class="body">Haman gedood; geen buit genomen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verlenging in Susan</text><text x="68" y="433" class="body">Esther vraagt een extra dag en het</text><text x="68" y="476" class="body">ophangen van Hamans tien zonen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Adar veertien, Susan</text><text x="68" y="625" class="body">Driehonderd mannen gedood; opnieuw geen</text><text x="68" y="668" class="body">buit genomen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Andere gewesten</text><text x="68" y="817" class="body">75.000 vijanden gedood; geen buit</text><text x="68" y="860" class="body">genomen. Strijd op dag dertien, rust op</text><text x="68" y="903" class="body">dag veertien.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Twee rustdagen</text><text x="68" y="1052" class="body">Open steden: veertien. Susan, na twee</text><text x="68" y="1095" class="body">dagen: vijftien.</text><text x="46" y="1188" class="note">Dit overzicht noemt de dodelijke aantallen</text><text x="46" y="1224" class="note">expliciet. De passage wordt niet tot uitsluitend</text><text x="46" y="1260" class="note">een onschuldig feestverhaal teruggebracht.</text></svg>