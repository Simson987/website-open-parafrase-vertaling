<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1647" viewBox="0 0 840 1647" role="img" aria-labelledby="title desc"><title id="title">Purim: brieven en herdenken</title><desc id="desc">Het verband tussen de naam, twee brieven, data en manieren van herdenken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1647" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Purim: brieven en herdenken</text><text x="44" y="113" class="ref">Esther 9:20–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mordechai’s brief</text><text x="68" y="241" class="body">Elk jaar Adar veertien en vijftien;</text><text x="68" y="284" class="body">rust en omkeer van verdriet naar</text><text x="68" y="327" class="body">vreugde.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Concrete viering</text><text x="68" y="476" class="body">Maaltijden, elkaar porties sturen en</text><text x="68" y="519" class="body">gaven aan de armen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Pur en Purim</text><text x="68" y="668" class="body">De naam herinnert aan het lot waarmee</text><text x="68" y="711" class="body">Haman het geweld plande.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Blijvende afspraak</text><text x="68" y="860" class="body">Generaties, families, gewesten en</text><text x="68" y="903" class="body">steden moeten de dagen blijven</text><text x="68" y="946" class="body">gedenken.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Tweede brief</text><text x="68" y="1095" class="body">Esther, dochter van Abichaïl, en</text><text x="68" y="1138" class="body">Mordechai bevestigen de regeling met</text><text x="68" y="1181" class="body">gezag, vrede en trouw.</text><rect x="42" y="1239" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1282" class="label">Vasten en roepen</text><text x="68" y="1330" class="body">Ook vastgelegd naast de feestdagen;</text><text x="68" y="1373" class="body">Esthers bevel wordt in een boek</text><text x="68" y="1416" class="body">geschreven.</text><text x="46" y="1509" class="note">De strijd, de eerste rustdagen en de latere</text><text x="46" y="1545" class="note">brieven zijn verschillende fasen van het</text><text x="46" y="1581" class="note">hoofdstuk.</text></svg>