<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1405" viewBox="0 0 840 1405" role="img" aria-labelledby="title desc"><title id="title">Boodschappen via Hatach</title><desc id="desc">De heen-en-weergaande berichten en hun rol bij Esthers besluit.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1405" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boodschappen via Hatach</text><text x="44" y="113" class="ref">Esther 4:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Buiten de poort</text><text x="68" y="241" class="body">Mordechai in rouwkleren; hij mag</text><text x="68" y="284" class="body">daarmee niet naar binnen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste poging</text><text x="68" y="433" class="body">Esther stuurt kleding; Mordechai</text><text x="68" y="476" class="body">weigert die.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hatach heen</text><text x="68" y="625" class="body">Vraagt wat er is; ontvangt het verhaal</text><text x="68" y="668" class="body">en een afschrift.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Hatach terug</text><text x="68" y="817" class="body">Legt Esther het gevaar voor; brengt</text><text x="68" y="860" class="body">haar antwoord over het toegangsverbod</text><text x="68" y="903" class="body">terug.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Besluit</text><text x="68" y="1052" class="body">Esther vraagt drie dagen vasten en</text><text x="68" y="1095" class="body">besluit ongevraagd naar de koning te</text><text x="68" y="1138" class="body">gaan.</text><text x="46" y="1231" class="note">De uitwisseling verloopt via Hatach en</text><text x="46" y="1267" class="note">boodschappen; het hoofdstuk beschrijft geen</text><text x="46" y="1303" class="note">rechtstreeks gesprek tussen Esther en Mordechai</text><text x="46" y="1339" class="note">bij de poort.</text></svg>