<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Familie en hoffuncties</title><desc id="desc">De expliciet genoemde verwantschap en de verschillende rollen aan het hof.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familie en hoffuncties</text><text x="44" y="113" class="ref">Esther 2:5–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mordechai’s lijn</text><text x="68" y="241" class="body">Kis → Simeï → Jaïr → Mordechai; stam</text><text x="68" y="284" class="body">Benjamin.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Esther / Hadassa</text><text x="68" y="433" class="body">Dochter van Abichaïl, Mordechai’s oom;</text><text x="68" y="476" class="body">door Mordechai als dochter aangenomen</text><text x="68" y="519" class="body">na de dood van haar ouders.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Hegai</text><text x="68" y="668" class="body">Over het eerste vrouwenverblijf;</text><text x="68" y="711" class="body">verzorging en raad.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Saasgaz</text><text x="68" y="860" class="body">Over het tweede vrouwenverblijf en de</text><text x="68" y="903" class="body">bijvrouwen.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Bigthan en Theres</text><text x="68" y="1052" class="body">Drempelbewakers met een moordplan;</text><text x="68" y="1095" class="body">Mordechai ontdekt het en Esther meldt</text><text x="68" y="1138" class="body">het namens hem.</text><text x="46" y="1231" class="note">Mordechai is opvoeder én verwant, niet Esthers</text><text x="46" y="1267" class="note">biologische vader. De twee hofbeambten met</text><text x="46" y="1303" class="note">verblijftaken blijven apart.</text></svg>