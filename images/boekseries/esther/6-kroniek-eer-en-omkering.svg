<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1518" viewBox="0 0 840 1518" role="img" aria-labelledby="title desc"><title id="title">Kroniek, eer en omkering</title><desc id="desc">De oorzaak-gevolgketen van de kronieknotitie naar de omkering en het volgende maal.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1518" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kroniek, eer en omkering</text><text x="44" y="113" class="ref">Esther 6:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De nacht</text><text x="68" y="241" class="body">Slapeloze koning hoort de kronieken;</text><text x="68" y="284" class="body">Mordechai’s redding staat beschreven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Geen eer ontvangen</text><text x="68" y="433" class="body">De koning vraagt naar eerdere beloning;</text><text x="68" y="476" class="body">er is niets gegeven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hamans bedoeling</text><text x="68" y="625" class="body">Komt om Mordechai’s ophanging te</text><text x="68" y="668" class="body">vragen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn vergissing</text><text x="68" y="817" class="body">Denkt dat de koning hém wil eren; stelt</text><text x="68" y="860" class="body">koningskleed, paard en uitroep voor.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het bevel</text><text x="68" y="1009" class="body">Haman moet het zelf voor Mordechai</text><text x="68" y="1052" class="body">uitvoeren en niets weglaten.</text><rect x="42" y="1110" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Het vervolg</text><text x="68" y="1201" class="body">Mordechai terug bij de poort; Haman</text><text x="68" y="1244" class="body">treurig naar huis en daarna haastig</text><text x="68" y="1287" class="body">naar Esthers maaltijd.</text><text x="46" y="1380" class="note">Hamans verwachting en de feitelijke ontvanger</text><text x="46" y="1416" class="note">van de eer worden onderscheiden. Het ereteken is</text><text x="46" y="1452" class="note">geen kroning tot koning.</text></svg>