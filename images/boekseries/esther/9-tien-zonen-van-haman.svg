<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1331" viewBox="0 0 840 1331"><title>De tien zonen van Haman</title><rect width="840" height="1331" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">De tien zonen van Haman</text><text x="42" y="105" font-size="25">Esther 9:7–10</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Haman</text><path d="M470 215 V235 H75 V1093.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 292.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Parsandatha</text><path d="M75 381.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="349" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="386" font-size="31" font-weight="700">Dalfon</text><path d="M75 470.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="438" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="475" font-size="31" font-weight="700">Asfata</text><path d="M75 559.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="527" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="564" font-size="31" font-weight="700">Poratha</text><path d="M75 648.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="616" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="653" font-size="31" font-weight="700">Adalia</text><path d="M75 737.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="705" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="742" font-size="31" font-weight="700">Aridatha</text><path d="M75 826.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="794" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="831" font-size="31" font-weight="700">Parmastha</text><path d="M75 915.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="883" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="920" font-size="31" font-weight="700">Arisai</text><path d="M75 1004.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="972" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="1009" font-size="31" font-weight="700">Aridai</text><path d="M75 1093.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="1061" width="640" height="65" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="1098" font-size="31" font-weight="700">Vaizatha</text><text x="42" y="1172" font-size="26">De tien namen staan naast elkaar als broers,</text><text x="42" y="1206" font-size="26">niet als opeenvolgende generaties; de tekst</text><text x="42" y="1240" font-size="26">vermeldt hun dood en dat de buit niet genomen</text><text x="42" y="1274" font-size="26">werd.</text></g></svg>