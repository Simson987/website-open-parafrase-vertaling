<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Gevaar, vasten en besluit</title><desc id="desc">De verschillende termijnen en het persoonlijke risico van Esthers stap.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gevaar, vasten en besluit</text><text x="44" y="113" class="ref">Esther 4:11–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Regel van het hof</text><text x="68" y="241" class="body">Ongevraagd in de binnenhof: dood,</text><text x="68" y="284" class="body">tenzij de koning de gouden scepter</text><text x="68" y="327" class="body">toereikt.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dertig dagen</text><text x="68" y="476" class="body">Esther is al dertig dagen niet</text><text x="68" y="519" class="body">geroepen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Mordechai’s antwoord</text><text x="68" y="668" class="body">Paleis biedt geen zekere ontsnapping;</text><text x="68" y="711" class="body">wie weet koningin voor juist deze tijd.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Drie dagen</text><text x="68" y="860" class="body">Alle Joden in Susan vasten voor haar;</text><text x="68" y="903" class="body">zij en haar meisjes ook, zonder eten of</text><text x="68" y="946" class="body">drinken.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De stap</text><text x="68" y="1095" class="body">Daarna naar de koning, ook al is het</text><text x="68" y="1138" class="body">tegen de wet.</text><text x="46" y="1231" class="note">Deze passage noemt vasten en Esthers besluit;</text><text x="46" y="1267" class="note">zij garandeert hier nog geen gunstige afloop.</text></svg>