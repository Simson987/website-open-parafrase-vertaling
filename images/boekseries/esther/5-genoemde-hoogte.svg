<svg xmlns="http://www.w3.org/2000/svg" width="840" height="900" viewBox="0 0 840 900"><title>De genoemde hoogte: 22,5 meter</title><rect width="840" height="900" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">De genoemde hoogte</text><text x="42" y="110" font-size="28">Esther 5:14 · 22,5 meter</text><path d="M360 190V700" stroke="#83613d" stroke-width="18"/><path d="M490 190V700M470 190H510M470 700H510" stroke="#52725e" stroke-width="4"/><text x="535" y="450" font-size="33">22,5 m</text><text x="42" y="770" font-size="27">Alleen de hoogte is schematisch weergegeven.</text><text x="42" y="812" font-size="27">Vorm en uitvoering zijn hier niet gereconstrueerd.</text><text x="42" y="854" font-size="27">Het hoofdstuk beschrijft voorbereiding, geen executie.</text></g></svg>