<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1448" viewBox="0 0 840 1448" role="img" aria-labelledby="title desc"><title id="title">Van weigering naar vervolging</title><desc id="desc">De escalatie van persoonlijke woede naar een rijkwijd vervolgingsbevel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1448" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van weigering naar vervolging</text><text x="44" y="113" class="ref">Esther 3:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Haman verhoogd</text><text x="68" y="241" class="body">Zoon van Hammedatha uit Agag; anderen</text><text x="68" y="284" class="body">moeten buigen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mordechai weigert</text><text x="68" y="433" class="body">Hij heeft verteld dat hij Joods is;</text><text x="68" y="476" class="body">Haman wil daarom zijn hele volk</text><text x="68" y="519" class="body">vernietigen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Koninklijke macht</text><text x="68" y="668" class="body">Haman vraagt een vernietigingsbesluit</text><text x="68" y="711" class="body">en biedt circa 340 ton zilver; de</text><text x="68" y="754" class="body">koning geeft zijn zegelring.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Meertalige brieven</text><text x="68" y="903" class="body">Schrijvers, bestuurders en alle</text><text x="68" y="946" class="body">gewesten; verzegeld in de naam van de</text><text x="68" y="989" class="body">koning.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Het slotbeeld</text><text x="68" y="1138" class="body">Boden haastig weg; koning en Haman</text><text x="68" y="1181" class="body">drinken, Susan in verwarring.</text><text x="46" y="1274" class="note">Hamans collectieve beschuldiging en</text><text x="46" y="1310" class="note">vernietigingsplan worden als onrecht en dreiging</text><text x="46" y="1346" class="note">weergegeven, niet als een al uitgevoerde</text><text x="46" y="1382" class="note">gebeurtenis.</text></svg>