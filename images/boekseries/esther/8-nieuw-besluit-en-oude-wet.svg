<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1726" viewBox="0 0 840 1726" role="img" aria-labelledby="title desc"><title id="title">Nieuw besluit en oude wet</title><desc id="desc">Juridische volgorde, twee datums en de verschillende taken van Esther en Mordechai.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1726" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nieuw besluit en oude wet</text><text x="44" y="113" class="ref">Esther 8:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Huis en zegelring</text><text x="68" y="241" class="body">Esther krijgt Hamans huis; Mordechai</text><text x="68" y="284" class="body">krijgt de ring en beheert het huis.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Esther vraagt herroeping</text><text x="68" y="433" class="body">Zij pleit voor het leven van haar volk</text><text x="68" y="476" class="body">en familie.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Een nieuw besluit</text><text x="68" y="625" class="body">De koning noemt een verzegeld</text><text x="68" y="668" class="body">koninklijk geschrift onherroepelijk; er</text><text x="68" y="711" class="body">komt een afzonderlijk tegenbevel.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Sivan drieëntwintig</text><text x="68" y="860" class="body">Maand drie: brieven in eigen schrift en</text><text x="68" y="903" class="body">taal naar 127 gewesten, India tot</text><text x="68" y="946" class="body">Nubië.</text><rect x="42" y="1004" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Adar dertien</text><text x="68" y="1095" class="body">Maand twaalf: samenkomen en voor het</text><text x="68" y="1138" class="body">leven opkomen tegen aanvallende</text><text x="68" y="1181" class="body">machten; de tekst noemt ook vrouwen,</text><text x="68" y="1224" class="body">kinderen en buit.</text><rect x="42" y="1282" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1325" class="label">Bekendmaking en vreugde</text><text x="68" y="1373" class="body">Snelle koninklijke paarden; Mordechai</text><text x="68" y="1416" class="body">in blauw, wit, goud en purper; Susan</text><text x="68" y="1459" class="body">juicht.</text><text x="46" y="1552" class="note">Het tegenbevel wist het eerdere stuk niet</text><text x="46" y="1588" class="note">eenvoudig uit. De verstrekkende geweldsbepaling</text><text x="46" y="1624" class="note">blijft als inhoud van de toenmalige brief</text><text x="46" y="1660" class="note">zichtbaar.</text></svg>