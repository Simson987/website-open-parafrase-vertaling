<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Feesten en koninklijk besluit</title><desc id="desc">Data, twee feestlocaties en de stap van weigering naar koninklijk besluit.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Feesten en koninklijk besluit</text><text x="44" y="113" class="ref">Esther 1:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rijk en plaats</text><text x="68" y="241" class="body">127 gewesten, India tot Nubië;</text><text x="68" y="284" class="body">Ahasveros in Susan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jaar drie</text><text x="68" y="433" class="body">180 dagen rijkdom tonen aan leiders;</text><text x="68" y="476" class="body">daarna zeven dagen feest voor Susan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee feesten</text><text x="68" y="625" class="body">Koning in de paleistuin; Vasthi met</text><text x="68" y="668" class="body">vrouwen in het paleis.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De weigering</text><text x="68" y="817" class="body">Op de zevende dag weigert Vasthi de</text><text x="68" y="860" class="body">oproep; de koning wordt boos.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Memuchans voorstel</text><text x="68" y="1009" class="body">Vasthi’s koninklijke plaats aan een</text><text x="68" y="1052" class="body">ander; brief in eigen schrift en taal</text><text x="68" y="1095" class="body">naar elk gewest.</text><text x="46" y="1188" class="note">Het advies en de voorgestelde gevolgen worden</text><text x="46" y="1224" class="note">aan Memuchan toegeschreven; het hoofdstuk</text><text x="46" y="1260" class="note">vertelt geen terechtstelling van Vasthi.</text></svg>