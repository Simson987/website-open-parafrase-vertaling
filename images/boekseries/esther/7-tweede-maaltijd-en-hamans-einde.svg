<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De tweede maaltijd</title><desc id="desc">Volgorde en sprekers bij de tweede maaltijd, zonder gebeurtenissen uit de eerste maaltijd te mengen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De tweede maaltijd</text><text x="44" y="113" class="ref">Esther 7:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Esthers verzoek</text><text x="68" y="241" class="body">Leven voor haarzelf en haar volk; Haman</text><text x="68" y="284" class="body">als onderdrukker aangewezen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De paleistuin</text><text x="68" y="433" class="body">Koning woedend naar buiten; Haman</text><text x="68" y="476" class="body">smeekt Esther om zijn leven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De terugkeer</text><text x="68" y="625" class="body">Haman op de bank; de koning ziet dit</text><text x="68" y="668" class="body">als geweld tegen de koningin.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het gezicht bedekt</text><text x="68" y="817" class="body">Na het woord van de koning bedekken de</text><text x="68" y="860" class="body">aanwezigen Hamans gezicht.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Charbona en het bevel</text><text x="68" y="1009" class="body">Noemt de paal van 22,5 meter voor</text><text x="68" y="1052" class="body">Mordechai; de koning laat Haman daaraan</text><text x="68" y="1095" class="body">ophangen.</text><text x="46" y="1188" class="note">De dreiging tegen Mordechai keert zich tegen</text><text x="46" y="1224" class="note">Haman. De beschuldiging bij de bank is</text><text x="46" y="1260" class="note">weergegeven als het woord van de koning.</text></svg>