<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Werken, verbond, wijsheid</title><desc id="desc">Het verband tussen grote werken, trouw en het slot over wijsheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Werken, verbond, wijsheid</text><text x="44" y="113" class="ref">Psalm 111:2–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Werken · 2–4</text><text x="68" y="241" class="body">Groot, onderzocht, rechtvaardig,</text><text x="68" y="284" class="body">genadig en barmhartig.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verbond · 5–6</text><text x="68" y="433" class="body">Voedsel, herinnerd verbond en gegeven</text><text x="68" y="476" class="body">land.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Betrouwbaarheid · 7–9</text><text x="68" y="625" class="body">Waarheid, recht, vaste bevelen en</text><text x="68" y="668" class="body">verlossing.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wijsheid · 10</text><text x="68" y="817" class="body">Ontzag als begin; inzicht bij wie</text><text x="68" y="860" class="body">ernaar leeft.</text><text x="46" y="953" class="note">Onderzoeken en leven naar de bevelen horen bij</text><text x="46" y="989" class="note">elkaar. Het overzicht verbindt het</text><text x="46" y="1025" class="note">landschapsbeeld met verbond, verlossing en</text><text x="46" y="1061" class="note">wijsheid.</text></svg>