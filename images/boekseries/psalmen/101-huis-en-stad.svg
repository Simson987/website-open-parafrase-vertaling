<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Huis en stad</title><desc id="desc">Van persoonlijke oprechtheid naar de omgang met mensen en het stadsbestuur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Huis en stad</text><text x="44" y="113" class="ref">Psalm 101:2–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eigen huis · 2–4</text><text x="68" y="241" class="body">Een oprecht hart en afstand van het</text><text x="68" y="284" class="body">kwaad.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Omgang · 5–7</text><text x="68" y="433" class="body">Roddelen, hoogmoed, bedrog en leugen</text><text x="68" y="476" class="body">tegenover trouwe mensen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De stad · 8</text><text x="68" y="625" class="body">Het voornemen om wie onrecht doen uit</text><text x="68" y="668" class="body">de stad te verwijderen.</text><text x="46" y="761" class="note">Het lied verwoordt koninklijke voornemens over</text><text x="46" y="797" class="note">eigen leven en bestuur. De tekst noemt ook harde</text><text x="46" y="833" class="note">oordeelswoorden; een overzicht houdt die bij hun</text><text x="46" y="869" class="note">verband.</text></svg>