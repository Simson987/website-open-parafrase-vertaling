<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Van Sion naar de oogst</title><desc id="desc">Drie samenhangende delen van de lofpsalm, voorbij alleen de oogstbeelden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Sion naar de oogst</text><text x="44" y="113" class="ref">Psalm 65:2–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nabijheid · 2–5</text><text x="68" y="241" class="body">Gehoord gebed, verzoende schuld en</text><text x="68" y="284" class="body">welkom in de voorhoven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verre horizon · 6–9</text><text x="68" y="433" class="body">Redding, bergen, zeeën, volken, morgen</text><text x="68" y="476" class="body">en avond.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bezocht land · 10–14</text><text x="68" y="625" class="body">Water, zachte voren, ontkieming,</text><text x="68" y="668" class="body">overvloed, kudden en koren.</text><text x="46" y="761" class="note">De lof verbindt verzoening en nabijheid in Sion</text><text x="46" y="797" class="note">met de wereldwijde horizon en de vruchtbaarheid</text><text x="46" y="833" class="note">van het land. De oogst vormt het uitbundige</text><text x="46" y="869" class="note">slot.</text></svg>