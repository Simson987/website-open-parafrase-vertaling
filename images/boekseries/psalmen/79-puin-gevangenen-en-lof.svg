<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Puin, gevangenen en lof</title><desc id="desc">Samenhang van de verwoeste stad, bedreigde gevangenen en gezamenlijke lofbelofte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Puin, gevangenen en lof</text><text x="44" y="113" class="ref">Psalm 79:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verwoesting · 1–4</text><text x="68" y="241" class="body">De tempel en stad liggen in puin;</text><text x="68" y="284" class="body">verlies en schande worden uitgesproken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hoelang · 5–9</text><text x="68" y="433" class="body">Hulp en vergeving worden om de eer van</text><text x="68" y="476" class="body">Gods naam gevraagd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gevangenen · 10–12</text><text x="68" y="625" class="body">Verhoor hun kreunen, bewaar het</text><text x="68" y="668" class="body">bedreigde leven en doe recht.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het wij · 13</text><text x="68" y="817" class="body">Het volk als kudde belooft lof van</text><text x="68" y="860" class="body">geslacht op geslacht.</text><text x="46" y="953" class="note">De psalm spreekt vanuit gezamenlijk verlies. Het</text><text x="46" y="989" class="note">kuddebeeld verwoordt blijvend toebehoren midden</text><text x="46" y="1025" class="note">in de nood.</text></svg>