<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Sion zien en doorvertellen</title><desc id="desc">De beweging van stadslof via dreiging naar herinnering, rondgang en overdracht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sion zien en doorvertellen</text><text x="44" y="113" class="ref">Psalm 48:2–15</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lof op de stad · 2–4</text><text x="68" y="241" class="body">Heilige berg, vreugde en burcht.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Schrik van koningen · 5–8</text><text x="68" y="390" class="body">Samen optrekken, schrik, vlucht en de</text><text x="68" y="433" class="body">vergelijking met stormmacht.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Gehoord en gezien · 9–12</text><text x="68" y="582" class="body">Overgeleverde trouw wordt in de stad</text><text x="68" y="625" class="body">overdacht en bezongen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Rondgang · 13–15</text><text x="68" y="774" class="body">Torens, muur en paleizen bekijken om</text><text x="68" y="817" class="body">het aan latere mensen te vertellen.</text><text x="46" y="910" class="note">De rondgang heeft een doel: vertellen aan de</text><text x="46" y="946" class="note">volgende generatie. De scheepsstorm voegt een</text><text x="46" y="982" class="note">afzonderlijk beeld van ontzagwekkende macht toe.</text></svg>