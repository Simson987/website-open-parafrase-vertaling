<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Koningswoord en priestereed</title><desc id="desc">Koninklijke en priesterlijke uitspraken in de korte psalm.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Koningswoord en priestereed</text><text x="44" y="113" class="ref">Psalm 110:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 1</text><text x="68" y="241" class="body">De HEERE spreekt tot mijn Heere: zitten</text><text x="68" y="284" class="body">aan Mijn rechterhand.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 2–3</text><text x="68" y="433" class="body">Scepter uit Sion, heerschappij en een</text><text x="68" y="476" class="body">gewillig volk.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vers 4</text><text x="68" y="625" class="body">De gezworen uitspraak over blijvend</text><text x="68" y="668" class="body">priesterschap naar de orde van</text><text x="68" y="711" class="body">Melchizedek.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vers 5–7</text><text x="68" y="860" class="body">Oordeel onder volken en het slotbeeld</text><text x="68" y="903" class="body">van drinken uit de beek.</text><text x="46" y="996" class="note">De aanduidingen volgen de woorden van de psalm.</text><text x="46" y="1032" class="note">Het schema bewaart het onderscheid tussen de</text><text x="46" y="1068" class="note">sprekende HEERE en de aangesproken mijn Heere.</text></svg>