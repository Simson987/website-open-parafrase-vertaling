<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Gebed en zelfbewaking</title><desc id="desc">De verbinding tussen bidden, zelfbewaking en bescherming.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed en zelfbewaking</text><text x="44" y="113" class="ref">Psalm 141:2–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gebed · 2</text><text x="68" y="241" class="body">Als reukwerk en opgeheven handen als</text><text x="68" y="284" class="body">avondoffer.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eigen mond en hart · 3–4</text><text x="68" y="433" class="body">Bewaren voor kwaad en voor meegaan met</text><text x="68" y="476" class="body">onrecht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Terechtwijzing · 5</text><text x="68" y="625" class="body">Goede correctie ontvangen, vergeleken</text><text x="68" y="668" class="body">met olie.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nood en uitweg · 6–10</text><text x="68" y="817" class="body">Graf en val; ogen op de HEERE en veilig</text><text x="68" y="860" class="body">voorbijgaan.</text><text x="46" y="953" class="note">De bidder vraagt ook bewaking van eigen woorden</text><text x="46" y="989" class="note">en neigingen. Het oliebeeld typeert de goede</text><text x="46" y="1025" class="note">terechtwijzing.</text></svg>