<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Van vragen naar de tocht</title><desc id="desc">De omslag van vragen naar herinnering en het slotbeeld van de geleide kudde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van vragen naar de tocht</text><text x="44" y="113" class="ref">Psalm 77:2–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nacht · 2–7</text><text x="68" y="241" class="body">Uitgestrekte hand, slapeloosheid en</text><text x="68" y="284" class="body">vroegere liederen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vragen · 8–11</text><text x="68" y="433" class="body">Weggestoten? Trouw voorbij? Belofte ten</text><text x="68" y="476" class="body">einde? Genade vergeten?</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Herinneren · 12–16</text><text x="68" y="625" class="body">De bidder overdenkt wonderen en de</text><text x="68" y="668" class="body">bevrijding van Jakob en Jozef.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Onzichtbare voetstappen · 17–21</text><text x="68" y="817" class="body">Storm en zee; het volk wordt als een</text><text x="68" y="860" class="body">kudde geleid door Mozes en Aäron.</text><text x="46" y="953" class="note">De herinnering vervangt de nachtelijke vragen</text><text x="46" y="989" class="note">niet door een nieuwe reis. Zij geeft taal aan</text><text x="46" y="1025" class="note">vertrouwen op een weg waarvan de voetstappen</text><text x="46" y="1061" class="note">onzichtbaar bleven.</text></svg>