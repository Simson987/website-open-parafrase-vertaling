<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">Woorden en vrede</title><desc id="desc">De klacht over bedrieglijke woorden en het verlangen naar vrede.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Woorden en vrede</text><text x="44" y="113" class="ref">Psalm 120:2–7</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Red mij · 2</text><text x="68" y="241" class="body">Valse lippen en een bedrieglijke tong.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vraag · 3–4</text><text x="68" y="390" class="body">De tong wordt aangesproken; pijlen en</text><text x="68" y="433" class="body">gloeiende kolen.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vreemdeling · 5</text><text x="68" y="582" class="body">Mesech en tenten van Kedar.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Tegenstelling · 6–7</text><text x="68" y="731" class="body">Ik zoek vrede; zij zijn uit op oorlog.</text><text x="46" y="824" class="note">Mesech en Kedar zijn de twee genoemde namen. Het</text><text x="46" y="860" class="note">lied geeft hier geen te volgen reisroute tussen</text><text x="46" y="896" class="note">beide.</text></svg>