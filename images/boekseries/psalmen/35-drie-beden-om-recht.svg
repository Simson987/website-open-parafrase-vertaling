<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Drie beden om recht</title><desc id="desc">Drie opeenvolgende gebedsgroepen en het contrast van eerdere zorg met huidige vijandschap.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie beden om recht</text><text x="44" y="113" class="ref">Psalm 35:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste bede · 1–10</text><text x="68" y="241" class="body">Strijd voor mijn zaak; verborgen net en</text><text x="68" y="284" class="body">kuil keren op de dader terug.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede bede · 11–18</text><text x="68" y="433" class="body">Valse getuigen en kwaad voor goed;</text><text x="68" y="476" class="body">vroegere zorg wordt met spot</text><text x="68" y="519" class="body">beantwoord.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Derde bede · 19–28</text><text x="68" y="668" class="body">Zwijg niet bij bedrog; doe recht en</text><text x="68" y="711" class="body">laat de vrienden van het recht juichen.</text><text x="46" y="804" class="note">Schild, speer, kaf, net en leeuwen vormen de</text><text x="46" y="840" class="note">beeldtaal van de klacht. Het herhaalde doel is</text><text x="46" y="876" class="note">recht, redding en lof in de samenkomst.</text></svg>