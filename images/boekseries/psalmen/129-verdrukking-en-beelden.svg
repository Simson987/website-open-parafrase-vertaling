<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Verdrukking en beelden</title><desc id="desc">Samenhang van verdrukking, bevrijding en het verdorrende dakgras.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verdrukking en beelden</text><text x="44" y="113" class="ref">Psalm 129:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herhaald · 1–2</text><text x="68" y="241" class="body">Vaak benauwd vanaf de jeugd, maar niet</text><text x="68" y="284" class="body">overwonnen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rug en touwen · 3–4</text><text x="68" y="433" class="body">Ploegen als beeld van verdrukking;</text><text x="68" y="476" class="body">doorgesneden touwen als bevrijding.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dakgras · 5–8</text><text x="68" y="625" class="body">Verdorren vóór de oogst; handen blijven</text><text x="68" y="668" class="body">leeg en de oogstzegen klinkt niet.</text><text x="46" y="761" class="note">De ploegvoren over de rug verbeelden</text><text x="46" y="797" class="note">verdrukking. De leeswijzer beeldt die</text><text x="46" y="833" class="note">vergelijking niet uit als een anatomische</text><text x="46" y="869" class="note">verwonding.</text></svg>