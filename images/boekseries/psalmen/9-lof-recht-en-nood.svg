<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Lof, recht en nood</title><desc id="desc">De wisseling tussen lof, recht en opnieuw uitgesproken hulpvraag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lof, recht en nood</text><text x="44" y="113" class="ref">Psalm 9:2–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herinnerde redding · 2–7</text><text x="68" y="241" class="body">De bidder looft en kijkt terug op</text><text x="68" y="284" class="body">teruggedrongen vijanden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Blijvend recht · 8–13</text><text x="68" y="433" class="body">Recht over de wereld en een burcht voor</text><text x="68" y="476" class="body">onderdrukten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Huidige nood · 14–19</text><text x="68" y="625" class="body">Gebed om genade, lof in Sion en hoop</text><text x="68" y="668" class="body">voor armen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Laatste oproep · 20–21</text><text x="68" y="817" class="body">Laat de volken weten dat zij mensen</text><text x="68" y="860" class="body">zijn.</text><text x="46" y="953" class="note">De lof neemt de nieuwe nood niet weg. Burcht,</text><text x="46" y="989" class="note">kuil, net en doodspoort zijn de beelden waarmee</text><text x="46" y="1025" class="note">de psalm bescherming en omkering verwoordt.</text></svg>