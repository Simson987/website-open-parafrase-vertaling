<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Van hoelang naar gehoord</title><desc id="desc">De beweging van uitputting naar geloof in het gehoorde gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van hoelang naar gehoord</text><text x="44" y="113" class="ref">Psalm 6:2–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanspraak · 2–5</text><text x="68" y="241" class="body">Vraag om genade, genezing en redding;</text><text x="68" y="284" class="body">hoelang nog?</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nacht · 6–8</text><text x="68" y="433" class="body">Dood, zuchten, tranen en verzwakte</text><text x="68" y="476" class="body">ogen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Omslag · 9–10</text><text x="68" y="625" class="body">De bidder zegt dat de HEERE zijn huilen</text><text x="68" y="668" class="body">en smeken gehoord heeft.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Verwachting · 11</text><text x="68" y="817" class="body">De tegenstanders zullen beschaamd</text><text x="68" y="860" class="body">omkeren.</text><text x="46" y="953" class="note">Het keerpunt ligt in het uitgesproken vertrouwen</text><text x="46" y="989" class="note">dat het gebed gehoord is. De bidder ziet vanuit</text><text x="46" y="1025" class="note">dat vertrouwen uit naar de omkeer van zijn</text><text x="46" y="1061" class="note">tegenstanders.</text></svg>