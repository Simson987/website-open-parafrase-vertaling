<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Aanklacht, vloek en hulp</title><desc id="desc">De onderdelen van de klacht en het verschil tussen uitgesproken wens en vertelde gebeurtenis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aanklacht, vloek en hulp</text><text x="44" y="113" class="ref">Psalm 109:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beschuldiging · 1–5</text><text x="68" y="241" class="body">Valse woorden en haat tegenover liefde;</text><text x="68" y="284" class="body">toch bidden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vloekwoorden · 6–20</text><text x="68" y="433" class="body">Oordeel, ambt, gezin, schuld en een</text><text x="68" y="476" class="body">vloek als kleed.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Maar U · 21–29</text><text x="68" y="625" class="body">De arme en gekwetste bidder vraagt</text><text x="68" y="668" class="body">redding en zegen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Lof · 30–31</text><text x="68" y="817" class="body">God staat aan de rechterhand van de</text><text x="68" y="860" class="body">arme tegenover wie hem veroordelen.</text><text x="46" y="953" class="note">De heftige wensen staan als woorden in de</text><text x="46" y="989" class="note">klacht. De leeswijzer presenteert ze niet als</text><text x="46" y="1025" class="note">gebeurtenissen die al zijn uitgevoerd.</text></svg>