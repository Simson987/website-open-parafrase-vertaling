<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc"><title id="title">Gekend en doorgrond</title><desc id="desc">De vijf delen en het herhaalde doorgronden in het gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1319" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gekend en doorgrond</text><text x="44" y="113" class="ref">Psalm 139:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gekend · 1–6</text><text x="68" y="241" class="body">Zitten, opstaan, gaan, liggen en het</text><text x="68" y="284" class="body">nog ongesproken woord.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nergens buiten · 7–12</text><text x="68" y="433" class="body">Hemel, dodenrijk, uiterste zee, donker</text><text x="68" y="476" class="body">en licht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gevormd · 13–18</text><text x="68" y="625" class="body">Weven, borduurwerk, dagen en gedachten</text><text x="68" y="668" class="body">talrijker dan zand.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Afkeer · 19–22</text><text x="68" y="817" class="body">De bidder spreekt zijn afkeer van Gods</text><text x="68" y="860" class="body">vijanden uit.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Toets mij · 23–24</text><text x="68" y="1009" class="body">Opnieuw doorgronden; gedachten kennen</text><text x="68" y="1052" class="body">en leiden op de eeuwige weg.</text><text x="46" y="1145" class="note">Begin en slot delen het doorgronden. De</text><text x="46" y="1181" class="note">zelftoetsing volgt ook op de scherpe</text><text x="46" y="1217" class="note">vijandwoorden; de beelden zijn geen anatomische</text><text x="46" y="1253" class="note">afbeelding van Gods handelen.</text></svg>