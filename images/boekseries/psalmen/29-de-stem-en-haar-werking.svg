<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De stem en haar werking</title><desc id="desc">De ruimtelijke beweging door de natuur en de overgang naar de zegen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De stem en haar werking</text><text x="44" y="113" class="ref">Psalm 29:3–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Water · 3–4</text><text x="68" y="241" class="body">Donder, kracht en majesteit boven het</text><text x="68" y="284" class="body">grote water.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bergen en bomen · 5–6</text><text x="68" y="433" class="body">Ceders van de Libanon en de Sirjon in</text><text x="68" y="476" class="body">springende beeldtaal.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vuur en woestijn · 7–8</text><text x="68" y="625" class="body">Vlammen en de bevende woestijn van</text><text x="68" y="668" class="body">Kades.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bos en tempel · 9</text><text x="68" y="817" class="body">Hinden, ontbladerde bossen en de</text><text x="68" y="860" class="body">uitroep eer.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Koningschap en zegen · 10–11</text><text x="68" y="1009" class="body">Blijvend koningschap, kracht en vrede</text><text x="68" y="1052" class="body">voor het volk.</text><text x="46" y="1145" class="note">De herhaalde stem van de HEERE verbindt alle</text><text x="46" y="1181" class="note">natuurgebieden. De beweging eindigt met kracht</text><text x="46" y="1217" class="note">en vrede voor het volk.</text></svg>