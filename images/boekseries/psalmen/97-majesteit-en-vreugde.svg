<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Majesteit en vreugde</title><desc id="desc">De verbinding van ontzag, reacties en rechtvaardig leven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Majesteit en vreugde</text><text x="44" y="113" class="ref">Psalm 97:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Koningschap · 1–6</text><text x="68" y="241" class="body">Aarde en eilanden; wolk, vuur, bliksem</text><text x="68" y="284" class="body">en smeltende bergen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Reacties · 7–9</text><text x="68" y="433" class="body">Beschaamde beeldendienst en vreugde in</text><text x="68" y="476" class="body">Sion en Juda.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Leven · 10–12</text><text x="68" y="625" class="body">Haat het kwaad, ontvangen bewaring en</text><text x="68" y="668" class="body">licht gezaaid voor rechtvaardigen.</text><text x="46" y="761" class="note">De majesteitsbeelden staan naast een concrete</text><text x="46" y="797" class="note">levensoproep. Licht zaaien en bergen als was</text><text x="46" y="833" class="note">zijn poëtische vergelijkingen.</text></svg>