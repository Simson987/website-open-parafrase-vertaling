<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Grot, klacht en hoop</title><desc id="desc">De genoemde situatie, de hulpvraag en de toekomstige verwachting.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Grot, klacht en hoop</text><text x="44" y="113" class="ref">Psalm 142:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 1</text><text x="68" y="241" class="body">Een gebed van David toen hij in de grot</text><text x="68" y="284" class="body">was.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Klacht · 2–5</text><text x="68" y="433" class="body">Roepen, verborgen val en niemand die</text><text x="68" y="476" class="body">omziet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Toevlucht · 6–7</text><text x="68" y="625" class="body">Mijn deel in het land van levenden;</text><text x="68" y="668" class="body">hulp tegen sterkere vervolgers.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bede en verwachting · 8</text><text x="68" y="817" class="body">Haal mij uit de gevangenis;</text><text x="68" y="860" class="body">rechtvaardigen zullen mij omringen.</text><text x="46" y="953" class="note">Alleen het opschrift noemt hier de grot. Omringd</text><text x="46" y="989" class="note">worden is een verwachting in het gebed; de psalm</text><text x="46" y="1025" class="note">beschrijft geen al vertelde feestelijke</text><text x="46" y="1061" class="note">bevrijding.</text></svg>