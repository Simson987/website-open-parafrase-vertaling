<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Schuld, vernieuwing en lof</title><desc id="desc">De samenhang van historische aanleiding, belijdenis, vernieuwing en het bredere slotgebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schuld, vernieuwing en lof</text><text x="44" y="113" class="ref">Psalm 51:2–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 2</text><text x="68" y="241" class="body">Natan komt bij David na zijn omgang met</text><text x="68" y="284" class="body">Batseba.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Belijdenis · 3–11</text><text x="68" y="433" class="body">Genade, wassen, erkende schuld,</text><text x="68" y="476" class="body">waarheid en reiniging.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vernieuwing · 12–14</text><text x="68" y="625" class="body">Zuiver hart, vaste geest en herstelde</text><text x="68" y="668" class="body">vreugde.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Antwoord · 15–19</text><text x="68" y="817" class="body">Anderen leren, bevrijding van</text><text x="68" y="860" class="body">bloedschuld, open lippen en een</text><text x="68" y="903" class="body">verslagen hart.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Sion · 20–21</text><text x="68" y="1052" class="body">Het persoonlijke gebed eindigt met de</text><text x="68" y="1095" class="body">stad en eerlijke offers.</text><text x="46" y="1188" class="note">De hysop verbeeldt reiniging. De gevraagde</text><text x="46" y="1224" class="note">vernieuwing omvat hart, geest, vreugde, spreken</text><text x="46" y="1260" class="note">en de bereidheid anderen de weg te leren.</text></svg>