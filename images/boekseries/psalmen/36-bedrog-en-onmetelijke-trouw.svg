<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Bedrog en onmetelijke trouw</title><desc id="desc">De tegenstelling tussen zelfmisleiding en de breedte van Gods trouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bedrog en onmetelijke trouw</text><text x="44" y="113" class="ref">Psalm 36:2–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zelfmisleiding · 2–5</text><text x="68" y="241" class="body">Geen ontzag, zichzelf goedpraten,</text><text x="68" y="284" class="body">bedrieglijke woorden en beraamd</text><text x="68" y="327" class="body">onrecht.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Omvattende trouw · 6–7</text><text x="68" y="476" class="body">Hemel en wolken, hoge bergen en diepe</text><text x="68" y="519" class="body">zee.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ontvangen leven · 8–10</text><text x="68" y="668" class="body">Vleugels, huis, vreugdebeek, levensbron</text><text x="68" y="711" class="body">en licht.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Gebed · 11–13</text><text x="68" y="860" class="body">Blijf trouw en bescherm tegen de macht</text><text x="68" y="903" class="body">van onrecht.</text><text x="46" y="996" class="note">De omvang van trouw en gerechtigheid wordt met</text><text x="46" y="1032" class="note">hoogten en diepten verbeeld. De levensbron staat</text><text x="46" y="1068" class="note">binnen diezelfde belijdenis van ontvangen</text><text x="46" y="1104" class="note">goedheid.</text></svg>