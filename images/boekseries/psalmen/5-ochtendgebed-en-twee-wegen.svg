<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Ochtendgebed en twee wegen</title><desc id="desc">De samenhang van ochtendgebed, eerbied en de tegenstelling van onrecht en schuilen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ochtendgebed en twee wegen</text><text x="44" y="113" class="ref">Psalm 5:2–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ochtend · 2–4</text><text x="68" y="241" class="body">Woorden, zuchten, voorleggen en</text><text x="68" y="284" class="body">wachten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onrecht · 5–7</text><text x="68" y="433" class="body">Leugen, geweld en bedrog passen niet</text><text x="68" y="476" class="body">bij Gods nabijheid.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Toegang en leiding · 8–9</text><text x="68" y="625" class="body">Door trouw binnengaan, buigen en om een</text><text x="68" y="668" class="body">rechte weg bidden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tegenovergestelde stemmen · 10–13</text><text x="68" y="817" class="body">Misleidende taal tegenover vreugde en</text><text x="68" y="860" class="body">bescherming voor wie schuilt.</text><text x="46" y="953" class="note">De open-grafvergelijking tekent onbetrouwbare</text><text x="46" y="989" class="note">taal. De rechte weg en het schild zijn beelden</text><text x="46" y="1025" class="note">van leiding en goedheid.</text></svg>