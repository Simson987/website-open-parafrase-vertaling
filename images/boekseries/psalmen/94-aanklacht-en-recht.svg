<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Aanklacht en recht</title><desc id="desc">De concrete slachtoffers en de beweging naar troost en recht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aanklacht en recht</text><text x="44" y="113" class="ref">Psalm 94:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanklacht · 1–7</text><text x="68" y="241" class="body">Trots en geweld tegen volk, weduwe,</text><text x="68" y="284" class="body">vreemdeling en wees.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tegenwerping · 8–11</text><text x="68" y="433" class="body">De maker van oor en oog hoort en ziet.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Troost en onderricht · 12–19</text><text x="68" y="582" class="body">Wet, trouw en troost houden de bidder</text><text x="68" y="625" class="body">overeind.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De rechterstoel · 20–23</text><text x="68" y="774" class="body">Wetten die ellende maken tegenover God</text><text x="68" y="817" class="body">als burcht en rechter.</text><text x="46" y="910" class="note">De slotbede om recht hangt samen met concreet</text><text x="46" y="946" class="note">onrecht. Opleiding, troost en bescherming staan</text><text x="46" y="982" class="note">midden in die maatschappelijke aanklacht.</text></svg>