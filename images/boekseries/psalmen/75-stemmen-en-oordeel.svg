<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Stemmen en oordeel</title><desc id="desc">De sprekerswisselingen en de functies van de drie grote vergelijkingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stemmen en oordeel</text><text x="44" y="113" class="ref">Psalm 75:2–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gemeenschap · 2</text><text x="68" y="241" class="body">Wij prijzen en vertellen de wonderen.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Godsspraak · 3–6</text><text x="68" y="390" class="body">Het juiste moment, eerlijk oordeel,</text><text x="68" y="433" class="body">vaste zuilen en de waarschuwing tegen</text><text x="68" y="476" class="body">opscheppen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Toelichting · 7–9</text><text x="68" y="625" class="body">Verhoging ligt bij God; de beker</text><text x="68" y="668" class="body">verwoordt het oordeel.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Antwoord · 10–11</text><text x="68" y="817" class="body">Vertellen en zingen; neerhalen en</text><text x="68" y="860" class="body">opheffen van de hoorns.</text><text x="46" y="953" class="note">Zuilen, hoorn en beker zijn de dragende beelden</text><text x="46" y="989" class="note">van orde, macht en oordeel. De leeswijzer</text><text x="46" y="1025" class="note">onderscheidt wie aan het woord is.</text></svg>