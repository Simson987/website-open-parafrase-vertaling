<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc"><title id="title">Wegen, schuld en verwachten</title><desc id="desc">Het samengaan van leren, vergeving en redding en het bredere slotgebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1319" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wegen, schuld en verwachten</text><text x="44" y="113" class="ref">Psalm 25:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vertrouwen · 1–3</text><text x="68" y="241" class="body">Niet beschaamd worden en de HEERE</text><text x="68" y="284" class="body">verwachten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Leren en herinneren · 4–7</text><text x="68" y="433" class="body">Wegen leren; beroep op trouw tegenover</text><text x="68" y="476" class="body">de zonden van de jeugd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Goedheid en verbond · 8–14</text><text x="68" y="625" class="body">Leiding, vergeving, ontzag en</text><text x="68" y="668" class="body">bekendmaking van het verbond.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nood en bevrijding · 15–21</text><text x="68" y="817" class="body">Net, eenzaamheid, angst, schuld en</text><text x="68" y="860" class="body">vijanden.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Verbreding · 22</text><text x="68" y="1009" class="body">De persoonlijke hulpvraag wordt gebed</text><text x="68" y="1052" class="body">om verlossing voor Israël.</text><text x="46" y="1145" class="note">Weg, pad en net verbinden leiding met</text><text x="46" y="1181" class="note">bevrijding. De bidder noemt tegelijk eigen</text><text x="46" y="1217" class="note">schuld en onrecht van vijanden; die twee vragen</text><text x="46" y="1253" class="note">blijven naast elkaar staan.</text></svg>