<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Feest, bevrijding en luisteren</title><desc id="desc">De verbinding van feest, herinnering en de oproep tot trouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Feest, bevrijding en luisteren</text><text x="44" y="113" class="ref">Psalm 81:2–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Feestoproep · 2–6</text><text x="68" y="241" class="body">Lied, tamboerijn, snaren en ramshoorn.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Bevrijding · 7–8</text><text x="68" y="390" class="body">Schouderlast, draagkorf, hulp uit nood</text><text x="68" y="433" class="body">en toetsing bij Meriba.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De oproep · 9–11</text><text x="68" y="582" class="body">Luisteren en geen vreemde god dienen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Weigering en verlangen · 12–17</text><text x="68" y="731" class="body">Eigen wegen tegenover luisteren, hulp</text><text x="68" y="774" class="body">en verzadiging.</text><text x="46" y="867" class="note">De feestmuziek leidt naar een godsspraak over</text><text x="46" y="903" class="note">ontvangen bevrijding en gewenst luisteren. Tarwe</text><text x="46" y="939" class="note">en honing horen bij de belofte van verzadiging.</text></svg>