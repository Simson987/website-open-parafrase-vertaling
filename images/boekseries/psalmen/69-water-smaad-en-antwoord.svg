<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Water, smaad en antwoord</title><desc id="desc">De verschillende fasen van de klacht, zonder vergeldingswensen als reeds gebeurde gebeurtenissen te tekenen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Water, smaad en antwoord</text><text x="44" y="113" class="ref">Psalm 69:2–37</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Klacht · 2–13</text><text x="68" y="241" class="body">Diep water, modder, roepen en</text><text x="68" y="284" class="body">vervreemding; eigen schuld en vijandige</text><text x="68" y="327" class="body">smaad.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bede · 14–22</text><text x="68" y="476" class="body">Antwoord, erbarmen en nabijheid; troost</text><text x="68" y="519" class="body">ontbreekt en dorst krijgt azijn.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vergeldingsroep · 23–30</text><text x="68" y="668" class="body">De bidder vraagt om de omkeer van de</text><text x="68" y="711" class="body">macht van zijn belagers.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Lof en toekomst · 31–37</text><text x="68" y="860" class="body">Armen worden gehoord; lof, herbouw en</text><text x="68" y="903" class="body">een erfdeel voor het nageslacht.</text><text x="46" y="996" class="note">Water en slijk verbeelden het ontbreken van</text><text x="46" y="1032" class="note">vaste grond. De slothoop reikt van de eenzame</text><text x="46" y="1068" class="note">bidder naar Sion en toekomstige bewoners.</text></svg>