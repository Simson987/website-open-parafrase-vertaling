<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Stemmen in de koningspsalm</title><desc id="desc">De sprekerswisselingen en de beweging van opstand naar oproep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stemmen in de koningspsalm</text><text x="44" y="113" class="ref">Psalm 2:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Volken en vorsten · 1–3</text><text x="68" y="241" class="body">Samenzweren en hun banden willen</text><text x="68" y="284" class="body">verbreken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hemelse reactie · 4–6</text><text x="68" y="433" class="body">Spot, toorn en de aanstelling van de</text><text x="68" y="476" class="body">koning op Sion.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De Gezalfde · 7–9</text><text x="68" y="625" class="body">Hij maakt het besluit over zoon en</text><text x="68" y="668" class="body">erfdeel bekend.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Waarschuwing · 10–12</text><text x="68" y="817" class="body">Koningen worden aangesproken:</text><text x="68" y="860" class="body">verstandig zijn, dienen en schuilen.</text><text x="46" y="953" class="note">In deze koningspsalm wisselen stemmen elkaar af.</text><text x="46" y="989" class="note">Scepter en aardewerk verbeelden macht. De oproep</text><text x="46" y="1025" class="note">tot ontzag eindigt met geluk voor wie schuilt.</text></svg>