<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Verborgen, gebed en hulp</title><desc id="desc">Het verschil tussen de vertelsituatie en de woorden van het daaropvolgende gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verborgen, gebed en hulp</text><text x="44" y="113" class="ref">Psalm 54:2–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 2</text><text x="68" y="241" class="body">De mannen uit Zif vertellen Saul dat</text><text x="68" y="284" class="body">David bij hen verborgen is.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bede · 3–5</text><text x="68" y="433" class="body">Redding, recht en een gehoord gebed</text><text x="68" y="476" class="body">tegenover wrede belagers.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vertrouwen · 6–7</text><text x="68" y="625" class="body">God als helper en het terugkeren van</text><text x="68" y="668" class="body">kwaad op de belagers.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dank · 8–9</text><text x="68" y="817" class="body">Vrijwillig offer, lof op Gods naam en</text><text x="68" y="860" class="body">gesproken reddingsvertrouwen.</text><text x="46" y="953" class="note">De concrete aanleiding staat in het opschrift.</text><text x="46" y="989" class="note">Het gebed verbindt bedreiging met vertrouwen en</text><text x="46" y="1025" class="note">vrijwillige dankbaarheid.</text></svg>