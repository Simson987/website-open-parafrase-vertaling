<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Roepen, rust en dank</title><desc id="desc">De gang van persoonlijk roepen naar openbare dank.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Roepen, rust en dank</text><text x="44" y="113" class="ref">Psalm 116:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hij hoort · 1–6</text><text x="68" y="241" class="body">Liefde, benauwdheid, roepen en</text><text x="68" y="284" class="body">ontvangen redding.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mijn ziel · 7–11</text><text x="68" y="433" class="body">Terug naar rust; leven, ogen en voeten</text><text x="68" y="476" class="body">bewaard.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat teruggeven · 12–16</text><text x="68" y="625" class="body">Beker, naam, geloften en losgemaakte</text><text x="68" y="668" class="body">boeien.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Voor heel het volk · 17–19</text><text x="68" y="817" class="body">Dankoffer en geloften in de voorhoven,</text><text x="68" y="860" class="body">in Jeruzalem.</text><text x="46" y="953" class="note">De lof krijgt een gezamenlijke plaats in het</text><text x="46" y="989" class="note">bijzijn van het volk. Losgemaakte boeien zijn</text><text x="46" y="1025" class="note">verbonden met het spreken als dienaar.</text></svg>