<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Waarop vertrouwen</title><desc id="desc">De tegenstelling tussen menselijke begrenzing en blijvende hulp.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarop vertrouwen</text><text x="44" y="113" class="ref">Psalm 146:3–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Menselijke grens · 3–4</text><text x="68" y="241" class="body">Vorsten kunnen niet blijvend redden;</text><text x="68" y="284" class="body">hun plannen vergaan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Blijvende helper · 5–6</text><text x="68" y="433" class="body">De God van Jakob is Schepper en blijft</text><text x="68" y="476" class="body">trouw.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Concrete hulp · 7–9</text><text x="68" y="625" class="body">Recht, brood, vrijheid, zicht en steun</text><text x="68" y="668" class="body">voor gebogenen en kwetsbaren.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Koningschap · 10</text><text x="68" y="817" class="body">Regeren voor eeuwig, van geslacht op</text><text x="68" y="860" class="body">geslacht.</text><text x="46" y="953" class="note">Het vertrouwen krijgt gestalte in concrete zorg.</text><text x="46" y="989" class="note">Gevangenen, blinden, vreemdelingen, wees en</text><text x="46" y="1025" class="note">weduwe worden afzonderlijk genoemd.</text></svg>