<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Schuld, ziekte en eenzaamheid</title><desc id="desc">De verbinding tussen lichamelijke klacht, eenzaamheid, belijdenis en hulpgeroep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schuld, ziekte en eenzaamheid</text><text x="44" y="113" class="ref">Psalm 38:2–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lichaam en schuld · 2–11</text><text x="68" y="241" class="body">Last, pijn, koorts, zuchten en verlies</text><text x="68" y="284" class="body">van kracht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mensen rondom · 12–15</text><text x="68" y="433" class="body">Vrienden blijven weg; vijanden smeden</text><text x="68" y="476" class="body">plannen; de bidder zwijgt.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Belijden en hopen · 16–21</text><text x="68" y="625" class="body">Hij verwacht antwoord, erkent schuld en</text><text x="68" y="668" class="body">noemt kwaad dat voor goed vergolden</text><text x="68" y="711" class="body">wordt.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Laatste roep · 22–23</text><text x="68" y="860" class="body">Verlaat mij niet; kom mij snel te hulp.</text><text x="46" y="953" class="note">Dit gedicht geeft de bidder een stem in pijn en</text><text x="46" y="989" class="note">schuld. De sociale afstand en het gehoopte</text><text x="46" y="1025" class="note">antwoord horen bij dezelfde nood.</text></svg>