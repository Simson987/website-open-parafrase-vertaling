<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1362" viewBox="0 0 840 1362" role="img" aria-labelledby="title desc"><title id="title">Stilte en ware zekerheid</title><desc id="desc">Het herhaalde alleen en de tegenstelling met aanzien, bedrog en groeiend bezit.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1362" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stilte en ware zekerheid</text><text x="44" y="113" class="ref">Psalm 62:2–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste belijdenis · 2–3</text><text x="68" y="241" class="body">Alleen bij God stil; rots, redding en</text><text x="68" y="284" class="body">burcht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tegenstem · 4–5</text><text x="68" y="433" class="body">Overhellende muur, leugen en</text><text x="68" y="476" class="body">zegenwoorden met verborgen vloek.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Opnieuw · 6–9</text><text x="68" y="625" class="body">Stil zijn, wachten en het hart voor God</text><text x="68" y="668" class="body">uitstorten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gewicht · 10–11</text><text x="68" y="817" class="body">Menselijke aanzien en bezit bieden geen</text><text x="68" y="860" class="body">vaste zekerheid.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Slot · 12–13</text><text x="68" y="1009" class="body">Kracht en trouw worden aan God</text><text x="68" y="1052" class="body">toegeschreven, naast vergelding naar</text><text x="68" y="1095" class="body">daden.</text><text x="46" y="1188" class="note">De belijdenis wordt hernomen en vervolgens tot</text><text x="46" y="1224" class="note">het volk gericht. De weegschaal en de muur</text><text x="46" y="1260" class="note">verbeelden de kwetsbaarheid van</text><text x="46" y="1296" class="note">schijnzekerheden.</text></svg>