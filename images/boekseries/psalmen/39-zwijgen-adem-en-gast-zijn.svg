<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Zwijgen, adem en gast zijn</title><desc id="desc">Van ingehouden woorden naar de vraag om ruimte binnen een kort leven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zwijgen, adem en gast zijn</text><text x="44" y="113" class="ref">Psalm 39:2–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zwijgen en spreken · 2–4</text><text x="68" y="241" class="body">De tong in toom; pijn en innerlijke</text><text x="68" y="284" class="body">hitte worden een gebed.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kortheid · 5–7</text><text x="68" y="433" class="body">Dagen als een handbreed, mens als adem</text><text x="68" y="476" class="body">en schaduw.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hoop · 8–12</text><text x="68" y="625" class="body">De hoop richt zich op God; vraag om</text><text x="68" y="668" class="body">bevrijding en verlichting.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gast · 13–14</text><text x="68" y="817" class="body">Een vreemdeling bij God bidt met tranen</text><text x="68" y="860" class="body">om nog te mogen opleven.</text><text x="46" y="953" class="note">Handbreed, adem, schaduw en mot verwoorden de</text><text x="46" y="989" class="note">kwetsbaarheid van een kort bestaan. Het</text><text x="46" y="1025" class="note">slotbeeld van een gast geeft daaraan een</text><text x="46" y="1061" class="note">persoonlijke gebedsvorm.</text></svg>