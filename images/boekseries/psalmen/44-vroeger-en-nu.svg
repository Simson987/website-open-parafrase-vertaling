<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Vroeger en nu</title><desc id="desc">De tegenstelling van overgeleverde redding en huidige nood, zonder verzonnen schuldoorzaak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vroeger en nu</text><text x="44" y="113" class="ref">Psalm 44:2–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Overgeleverd · 2–9</text><text x="68" y="241" class="body">De vaderen vertellen van redding en het</text><text x="68" y="284" class="body">ontvangen land; het vertrouwen ligt</text><text x="68" y="327" class="body">niet in eigen wapens.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Maar nu · 10–17</text><text x="68" y="476" class="body">Terugdeinzen, verstrooiing, spot en</text><text x="68" y="519" class="body">schaamte.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De spanning · 18–23</text><text x="68" y="668" class="body">Het volk zegt het verbond niet vergeten</text><text x="68" y="711" class="body">te zijn en ervaart toch verdrukking.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het gebed · 24–27</text><text x="68" y="860" class="body">Word wakker, vergeet de nood niet en</text><text x="68" y="903" class="body">help om Uw trouw.</text><text x="46" y="996" class="note">Het is een gezamenlijke klacht. De</text><text x="46" y="1032" class="note">schapenvergelijking verwoordt kwetsbaarheid; het</text><text x="46" y="1068" class="note">volk beroept zich op trouw midden in onbegrepen</text><text x="46" y="1104" class="note">nederlaag.</text></svg>