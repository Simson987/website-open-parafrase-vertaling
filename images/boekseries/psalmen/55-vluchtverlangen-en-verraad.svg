<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Vluchtverlangen en verraad</title><desc id="desc">De verbinding van bedreigende stad, persoonlijke breuk en volhardend gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vluchtverlangen en verraad</text><text x="44" y="113" class="ref">Psalm 55:2–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Angst · 2–9</text><text x="68" y="241" class="body">Druk en doodsangst leiden tot de wens</text><text x="68" y="284" class="body">om als een duif weg te vliegen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Stad en vriend · 10–16</text><text x="68" y="433" class="body">Geweld, bedrog en het pijnlijke verraad</text><text x="68" y="476" class="body">van een vroegere vertrouweling.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gebed · 17–20</text><text x="68" y="625" class="body">Avond, morgen en middag roepen en</text><text x="68" y="668" class="body">gehoord worden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gebroken afspraak · 21–24</text><text x="68" y="817" class="body">Zachte woorden verbergen strijd; de</text><text x="68" y="860" class="body">zorg wordt aan de HEERE toevertrouwd.</text><text x="46" y="953" class="note">De verrader wordt als voormalige vertrouweling</text><text x="46" y="989" class="note">beschreven maar hier niet bij naam genoemd. Het</text><text x="46" y="1025" class="note">duivenbeeld verwoordt een wens naar rust, geen</text><text x="46" y="1061" class="note">werkelijk wegvliegen van een mens.</text></svg>