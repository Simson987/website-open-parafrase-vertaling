<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Machthebbers en recht</title><desc id="desc">De argumentlijn van de aanklacht en de functie van de heftige beeldspraak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Machthebbers en recht</text><text x="44" y="113" class="ref">Psalm 58:2–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 2–3</text><text x="68" y="241" class="body">Spreken machthebbers recht? De klacht</text><text x="68" y="284" class="body">noemt juist gepland geweld.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onbereikbaarheid · 4–6</text><text x="68" y="433" class="body">Leugen en het beeld van een dove,</text><text x="68" y="476" class="body">giftige slang.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vergeldingsbede · 7–10</text><text x="68" y="625" class="body">Leeuwentanden, wegvloeiend water, slak,</text><text x="68" y="668" class="body">vroeg afgebroken leven en een</text><text x="68" y="711" class="body">weggevaagde doornstruik.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Slot · 11–12</text><text x="68" y="860" class="body">Vreugde om vergelding en de erkenning</text><text x="68" y="903" class="body">dat God recht doet op aarde.</text><text x="46" y="996" class="note">De harde vergeldingsbeelden staan in een klacht</text><text x="46" y="1032" class="note">tegen onrecht. De drie illustraties tonen het</text><text x="46" y="1068" class="note">rechtsthema, de slang en het water; de</text><text x="46" y="1104" class="note">leeswijzer benoemt de overige beeldgroepen.</text></svg>