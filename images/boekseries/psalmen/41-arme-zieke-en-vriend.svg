<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Arme, zieke en vriend</title><desc id="desc">De overgang van zorg voor kwetsbaren naar de eigen ziekte en geschonden vriendschap.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Arme, zieke en vriend</text><text x="44" y="113" class="ref">Psalm 41:2–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aandacht · 2–4</text><text x="68" y="241" class="body">Oog voor de arme en steun op het</text><text x="68" y="284" class="body">ziekbed.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eigen klacht · 5–10</text><text x="68" y="433" class="body">Genade en genezing; leugenachtig</text><text x="68" y="476" class="body">bezoek, kwaadsprekerij en verraad van</text><text x="68" y="519" class="body">de broodvriend.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Hulpvraag · 11–13</text><text x="68" y="668" class="body">Overeind komen en blijvend staande</text><text x="68" y="711" class="body">gehouden worden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Lof · 14</text><text x="68" y="860" class="body">De God van Israël wordt geprezen van</text><text x="68" y="903" class="body">eeuwigheid tot eeuwigheid.</text><text x="46" y="996" class="note">Brood delen geeft de vertrouwensband aan die</text><text x="46" y="1032" class="note">door verraad wordt geschonden. De lof aan het</text><text x="46" y="1068" class="note">einde plaatst de klacht in een grotere</text><text x="46" y="1104" class="note">belijdenis.</text></svg>