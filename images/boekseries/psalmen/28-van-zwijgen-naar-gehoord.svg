<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Van zwijgen naar gehoord</title><desc id="desc">De overgang van gevreesd zwijgen via dank naar een gezamenlijk gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van zwijgen naar gehoord</text><text x="44" y="113" class="ref">Psalm 28:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vrees · 1–2</text><text x="68" y="241" class="body">Zwijgen zou als de kuil zijn; de handen</text><text x="68" y="284" class="body">gaan omhoog in gebed.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onderscheid · 3–5</text><text x="68" y="433" class="body">Vriendelijke woorden met kwaad in het</text><text x="68" y="476" class="body">hart en daden die terugkomen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dank · 6–7</text><text x="68" y="625" class="body">Gehoord smeken; kracht, schild en een</text><text x="68" y="668" class="body">juichend hart.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het volk · 8–9</text><text x="68" y="817" class="body">De hulp voor de bidder wordt een gebed</text><text x="68" y="860" class="body">voor volk en Gezalfde.</text><text x="46" y="953" class="note">Het herderbeeld van weiden en dragen besluit het</text><text x="46" y="989" class="note">gebed. De psalm verbindt persoonlijke verhoring</text><text x="46" y="1025" class="note">met zorg voor het hele volk.</text></svg>