<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De omslag in het heiligdom</title><desc id="desc">De redeneerbeweging van afgunst via inzicht naar nabijheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De omslag in het heiligdom</text><text x="44" y="113" class="ref">Psalm 73:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bijna uitgegleden · 1–3</text><text x="68" y="241" class="body">Asaf begint met goedheid en belijdt</text><text x="68" y="284" class="body">zijn afgunst.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wat hij ziet · 4–16</text><text x="68" y="433" class="body">Voorspoed van opscheppers en twijfel</text><text x="68" y="476" class="body">aan de waarde van een zuiver hart.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Keerpunt · 17–20</text><text x="68" y="625" class="body">In het heiligdom ziet hij hun einde;</text><text x="68" y="668" class="body">gladheid en droom verbeelden</text><text x="68" y="711" class="body">kwetsbaarheid.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Toch nabij · 21–28</text><text x="68" y="860" class="body">Erkende verbittering, ontvangen raad en</text><text x="68" y="903" class="body">God als blijvend deel.</text><text x="46" y="996" class="note">De waargenomen voorspoed wordt door het keerpunt</text><text x="46" y="1032" class="note">opnieuw gewogen. De rots verbeeldt de vastheid</text><text x="46" y="1068" class="note">die de bidder uiteindelijk zoekt.</text></svg>