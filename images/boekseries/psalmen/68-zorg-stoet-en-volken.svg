<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Zorg, stoet en volken</title><desc id="desc">Vijf delen van de lange lofpsalm en hun eigen motieven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zorg, stoet en volken</text><text x="44" y="113" class="ref">Psalm 68:2–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Redding en zorg · 2–7</text><text x="68" y="241" class="body">Vijanden verstrooien; wezen, weduwen,</text><text x="68" y="284" class="body">eenzamen en gevangenen ontvangen zorg.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Herinnerde tocht · 8–19</text><text x="68" y="433" class="body">Woestijn, Sinaï, regen,</text><text x="68" y="476" class="body">nieuwsbrengsters, koningen en de</text><text x="68" y="519" class="body">gekozen berg.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Dagelijks dragen · 20–24</text><text x="68" y="668" class="body">Redding en een uitweg uit de dood</text><text x="68" y="711" class="body">tegenover de vijanden.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Stoet · 25–30</text><text x="68" y="860" class="body">Zangers, muzikanten, tamboerijnen en</text><text x="68" y="903" class="body">genoemde stammen trekken naar het</text><text x="68" y="946" class="body">heiligdom.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Wereldwijde lof · 31–36</text><text x="68" y="1095" class="body">Egypte, Nubië en koninkrijken van de</text><text x="68" y="1138" class="body">aarde; kracht voor het volk.</text><text x="46" y="1231" class="note">De psalm verbindt bevrijding, zorg en een</text><text x="46" y="1267" class="note">feestelijke stoet. Duivenvleugels, bergen en</text><text x="46" y="1303" class="note">wagens dragen poëtische machtstaal.</text></svg>