<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Twee eden en Sion</title><desc id="desc">De twee gezworen uitspraken en de samenhang met Sion.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee eden en Sion</text><text x="44" y="113" class="ref">Psalm 132:2–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">David zweert · 2–5</text><text x="68" y="241" class="body">Geen huis of slaap vóór er een woning</text><text x="68" y="284" class="body">gevonden is.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wij gaan · 6–10</text><text x="68" y="433" class="body">Efratha, velden van Jaär, woning, ark</text><text x="68" y="476" class="body">en de bede voor de gezalfde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De HEERE zweert · 11–12</text><text x="68" y="625" class="body">Een zoon op de troon; verbond en</text><text x="68" y="668" class="body">getuigenissen voor de zonen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Sion · 13–18</text><text x="68" y="817" class="body">Rustplaats, brood, redding, vreugde,</text><text x="68" y="860" class="body">hoorn, lamp en bloeiende kroon.</text><text x="46" y="953" class="note">De twee eden hebben verschillende sprekers. De</text><text x="46" y="989" class="note">namen volgen de tekst; dit overzicht maakt geen</text><text x="46" y="1025" class="note">niet beschreven route van de ark.</text></svg>