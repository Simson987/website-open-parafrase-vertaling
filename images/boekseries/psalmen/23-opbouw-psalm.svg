<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Van herder naar gastheer</title><desc id="desc">Opbouw van Psalm 23: de herder leidt en geeft rust; in het dal spreekt de dichter God aan; de gastheer geeft een tafel, olie en overvloed; trouw en Gods huis vormen de afsluiting.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van herder naar gastheer</text><text x="44" y="113" class="ref">Psalm 23:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 1–3 · Leiding en rust</text><text x="68" y="241" class="body">De HEERE als herder: weiden, water,</text><text x="68" y="284" class="body">nieuwe kracht en het goede spoor.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 4 · Nabijheid in gevaar</text><text x="68" y="433" class="body">Het donkere dal: stok en staf geven</text><text x="68" y="476" class="body">moed. Het gedicht spreekt nu</text><text x="68" y="519" class="body">rechtstreeks tot U.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vers 5 · Ontvangst en overvloed</text><text x="68" y="668" class="body">De gedekte tafel, zalving met olie en</text><text x="68" y="711" class="body">een overvloeiende beker.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vers 6 · Trouw en thuis</text><text x="68" y="860" class="body">Geluk en trouw; blijven in het huis van</text><text x="68" y="903" class="body">de HEERE.</text><text x="46" y="996" class="note">Een leeswijzer bij de poëzie, geen tijdlijn van</text><text x="46" y="1032" class="note">gebeurtenissen uit Davids leven.</text></svg>