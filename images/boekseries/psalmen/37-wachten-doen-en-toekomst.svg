<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Wachten, doen en toekomst</title><desc id="desc">De instructies, contrasten en afsluitende toekomstvergelijking van de lange wijsheidpsalm.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wachten, doen en toekomst</text><text x="44" y="113" class="ref">Psalm 37:1–40</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin · 1–11</text><text x="68" y="241" class="body">Geen afgunst of drift; vertrouwen, goed</text><text x="68" y="284" class="body">doen en wachten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twee levenswijzen · 12–26</text><text x="68" y="433" class="body">Bedreiging en bezitsdrang tegenover</text><text x="68" y="476" class="body">recht, mededogen en geven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De weg bewaren · 27–34</text><text x="68" y="625" class="body">Goed doen, wijs spreken en op de HEERE</text><text x="68" y="668" class="body">wachten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Einde · 35–40</text><text x="68" y="817" class="body">De machtige boom verdwijnt; het einde</text><text x="68" y="860" class="body">van de eerlijke is vrede en redding.</text><text x="46" y="953" class="note">Het wijsheidslied spreekt een hoorder aan die de</text><text x="46" y="989" class="note">voorspoed van onrecht ziet. Het verbindt geduld</text><text x="46" y="1025" class="note">met actief goeddoen en een blik op het einde.</text></svg>