<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1253" viewBox="0 0 840 1253" role="img" aria-labelledby="title desc"><title id="title">Onderricht en uitwerking</title><desc id="desc">Exacte parallelle relaties van vers 8–10 uit de plaatselijke vertaling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1253" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onderricht en uitwerking</text><text x="44" y="113" class="ref">Psalm 19:8–10</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wet → volmaakt</text><text x="68" y="241" class="body">Geeft nieuwe kracht.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Getuigenis → betrouwbaar</text><text x="68" y="390" class="body">Maakt de eenvoudige wijs.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Bevelen → eerlijk</text><text x="68" y="539" class="body">Maken het hart blij.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Gebod → zuiver</text><text x="68" y="688" class="body">Geeft licht aan de ogen.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Ontzag → rein</text><text x="68" y="837" class="body">Blijft voor altijd.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Regels → waar</text><text x="68" y="986" class="body">Zijn samen rechtvaardig.</text><text x="46" y="1079" class="note">De psalm verbindt telkens een aanduiding van</text><text x="46" y="1115" class="note">Gods onderricht met een eigenschap en een</text><text x="46" y="1151" class="note">uitwerking. Daarna volgen de beelden van goud en</text><text x="46" y="1187" class="note">honing en het gebed om reiniging.</text></svg>