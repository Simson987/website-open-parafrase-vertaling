<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Wijnstok en refrein</title><desc id="desc">De ontwikkeling van de wijnstokvergelijking en de drie refreinen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijnstok en refrein</text><text x="44" y="113" class="ref">Psalm 80:2–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herder · 2–3</text><text x="68" y="241" class="body">Israël als kudde; Efraïm, Benjamin en</text><text x="68" y="284" class="body">Manasse worden genoemd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Refrein · 4, 8 en 20</text><text x="68" y="433" class="body">Breng ons terug; laat Uw gezicht</text><text x="68" y="476" class="body">lichten, dan worden wij gered.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Geplante wijnstok · 9–12</text><text x="68" y="625" class="body">Uit Egypte gehaald, geworteld en ver</text><text x="68" y="668" class="body">uitgebreid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bedreigd · 13–17</text><text x="68" y="817" class="body">Doorbroken muur, dieren, vuur en</text><text x="68" y="860" class="body">omhakken.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Bede · 18–20</text><text x="68" y="1009" class="body">Houd ons in leven; de oproep tot</text><text x="68" y="1052" class="body">herstel klinkt opnieuw.</text><text x="46" y="1145" class="note">De wijnstok verbeeldt het volk. De herhaalde</text><text x="46" y="1181" class="note">terugkeerbede omvat zowel de herinnerde groei</text><text x="46" y="1217" class="note">als de ervaren verwoesting.</text></svg>