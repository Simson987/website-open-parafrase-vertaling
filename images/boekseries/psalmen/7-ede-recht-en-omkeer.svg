<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Eed, recht en omkeer</title><desc id="desc">De logische samenhang tussen onschuldseed, gericht en terugkerend onrecht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eed, recht en omkeer</text><text x="44" y="113" class="ref">Psalm 7:4–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorwaardelijke eed · 4–6</text><text x="68" y="241" class="body">Als ik onrecht deed, laat mij dan de</text><text x="68" y="284" class="body">gevolgen treffen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vraag om recht · 7–12</text><text x="68" y="433" class="body">God toetst harten; de bidder vraagt</text><text x="68" y="476" class="body">gerechtigheid.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Waarschuwing · 13–14</text><text x="68" y="625" class="body">Zwaard en boog tekenen het komende</text><text x="68" y="668" class="body">gericht.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Eigen kwaad keert terug · 15–17</text><text x="68" y="817" class="body">Zwangerschap, geboorte en kuil zijn</text><text x="68" y="860" class="body">beelden voor de terugslag van onrecht.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Slot · 18</text><text x="68" y="1009" class="body">Lof om Gods gerechtigheid.</text><text x="46" y="1102" class="note">De bidder legt zijn onschuld in voorwaardelijke</text><text x="46" y="1138" class="note">eden voor. De kuil verbeeldt hoe het eigen kwaad</text><text x="46" y="1174" class="note">op de dader terugvalt.</text></svg>