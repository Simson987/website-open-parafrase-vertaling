<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Stemmen van Psalm 10</title><desc id="desc">De tegengestelde stemmen in de klacht over onrecht en het antwoord daarop.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stemmen van Psalm 10</text><text x="44" y="113" class="ref">Psalm 10:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De bidder · 1–2</text><text x="68" y="241" class="body">Waarom ver weg? De arme wordt</text><text x="68" y="284" class="body">opgejaagd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De goddeloze · 3–11</text><text x="68" y="433" class="body">Zijn zelfverzekerde uitspraken: geen</text><text x="68" y="476" class="body">God, geen gevaar, niemand ziet het.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De bidder antwoordt · 12–15</text><text x="68" y="625" class="body">Vergeet de ellendigen niet; U ziet het</text><text x="68" y="668" class="body">onrecht wel.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vertrouwen · 16–18</text><text x="68" y="817" class="body">Koning voor altijd; horen, versterken</text><text x="68" y="860" class="body">en recht doen aan wees en onderdrukte.</text><text x="46" y="953" class="note">Uitspraken als er is geen God worden aan de</text><text x="46" y="989" class="note">goddeloze toegeschreven. De leeuw is de</text><text x="46" y="1025" class="note">vergelijking voor zijn verborgen bedreiging,</text><text x="46" y="1061" class="note">geen dier dat de bidder werkelijk aanvalt.</text></svg>