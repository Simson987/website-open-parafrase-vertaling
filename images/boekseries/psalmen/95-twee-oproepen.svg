<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Twee oproepen</title><desc id="desc">De omslag van aanbidding naar luisteren en de woestijnwaarschuwing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee oproepen</text><text x="44" y="113" class="ref">Psalm 95:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kom en juich · 1–5</text><text x="68" y="241" class="body">Danklied voor de Maker van zee, droog</text><text x="68" y="284" class="body">land en bergen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kom en buig · 6–7</text><text x="68" y="433" class="body">Het volk als kudde buigt voor zijn</text><text x="68" y="476" class="body">Maker.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Luister vandaag · 7–11</text><text x="68" y="625" class="body">Maak je hart niet hard: Meriba en Massa</text><text x="68" y="668" class="body">herinneren aan beproeven en afdwalen.</text><text x="46" y="761" class="note">De uitnodiging tot lof gaat over in een</text><text x="46" y="797" class="note">dringende oproep om vandaag te luisteren. Het</text><text x="46" y="833" class="note">verleden wordt als waarschuwing aangehaald.</text></svg>