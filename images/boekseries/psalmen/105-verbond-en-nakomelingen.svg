<svg xmlns="http://www.w3.org/2000/svg" width="840" height="676" viewBox="0 0 840 676"><title>Verbond en nakomelingen</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="676" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Verbond en nakomelingen</text><text x="42" y="105" font-size="25">Psalm 105:6–11</text><rect x="150" y="155" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="191" text-anchor="middle" font-size="31">Abraham · dienaar · 6, 9</text><path d="M420 209 V229" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="235" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="271" text-anchor="middle" font-size="31">Izak · eed · 9</text><path d="M420 289 V309" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="315" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="351" text-anchor="middle" font-size="31">Jakob, Israël · verbond · 10</text><path d="M420 369 V389" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="395" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="431" text-anchor="middle" font-size="31">Landbelofte: Kanaän · 11</text><text x="42" y="495" font-size="26">De eerste drie namen volgen de tekst over het</text><text x="42" y="529" font-size="26">verbond. De laatste stap is de genoemde</text><text x="42" y="563" font-size="26">landbelofte; het schema stelt die stap niet als</text><text x="42" y="597" font-size="26">een persoon voor.</text></g></svg>