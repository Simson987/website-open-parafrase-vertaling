<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1084" viewBox="0 0 840 1084" role="img" aria-labelledby="title desc"><title id="title">Avond en morgen</title><desc id="desc">De historische aanleiding en het contrast tussen avondlijke dreiging en morgenlijke lof.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1084" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Avond en morgen</text><text x="44" y="113" class="ref">Psalm 59:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 1</text><text x="68" y="241" class="body">Saul laat Davids huis bewaken om hem te</text><text x="68" y="284" class="body">doden.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hulpgeroep · 2–6</text><text x="68" y="433" class="body">Red mij, zie de belagers en doe recht.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Avond · 7–16</text><text x="68" y="582" class="body">Terugkerende honden, zwaardachtige</text><text x="68" y="625" class="body">woorden, trots en hun eigen leugens.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Morgen · 17–18</text><text x="68" y="774" class="body">De bidder zingt over trouw, kracht en</text><text x="68" y="817" class="body">God als zijn burcht.</text><text x="46" y="910" class="note">Het hondenbeeld keert in de avond terug.</text><text x="46" y="946" class="note">Daartegenover staat de morgenlijke lof; zo</text><text x="46" y="982" class="note">krijgt de psalm een hoorbaar en zichtbaar</text><text x="46" y="1018" class="note">tijdscontrast.</text></svg>