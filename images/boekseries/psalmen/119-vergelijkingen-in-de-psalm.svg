<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Vergelijkingen in de psalm</title><desc id="desc">De hoofdvergelijkingen met exact gecontroleerde verwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vergelijkingen in de psalm</text><text x="44" y="113" class="ref">Psalm 119:72–176</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Goud en zilver · 72, 127</text><text x="68" y="241" class="body">De wet en geboden worden hoger</text><text x="68" y="284" class="body">gewaardeerd dan rijkdom.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Leren zak · 83</text><text x="68" y="433" class="body">De rookzak verbeeldt de benarde bidder</text><text x="68" y="476" class="body">die niet vergeet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Honing en lamp · 103, 105</text><text x="68" y="625" class="body">Zoetheid en licht geven taal aan de</text><text x="68" y="668" class="body">waarde van het woord.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Erfdeel en schild · 111, 114</text><text x="68" y="817" class="body">Vreugde, schuilen en hoop.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Buit en schaap · 162, 176</text><text x="68" y="966" class="body">Vreugde over de belofte; dwalen en de</text><text x="68" y="1009" class="body">vraag gezocht te worden.</text><text x="46" y="1102" class="note">De vergelijkingen beschrijven waardering, nood</text><text x="46" y="1138" class="note">en afhankelijkheid. Het schaap in het slot is</text><text x="46" y="1174" class="note">een beeld voor de dienaar die om zoeken vraagt.</text></svg>