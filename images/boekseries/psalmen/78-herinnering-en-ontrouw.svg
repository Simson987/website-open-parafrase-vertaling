<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Herinnering en ontrouw</title><desc id="desc">Vijf grote gedeelten van de lange historische leerpsalm.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herinnering en ontrouw</text><text x="44" y="113" class="ref">Psalm 78:1–72</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Doel · 1–8</text><text x="68" y="241" class="body">Doorvertellen, hopen en niet opnieuw</text><text x="68" y="284" class="body">koppig worden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Woestijn · 9–39</text><text x="68" y="433" class="body">Zee, wolk, water en voedsel; vergeten,</text><text x="68" y="476" class="body">uitdagen en toch ontvangen erbarmen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Egypte en het land · 40–55</text><text x="68" y="625" class="body">Tekenen, plagen, uittocht en een</text><text x="68" y="668" class="body">ontvangen erfdeel.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Opnieuw ontrouw · 56–64</text><text x="68" y="817" class="body">Offerhoogten en beelden; Silo en de</text><text x="68" y="860" class="body">verloren luister.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Keuze en herder · 65–72</text><text x="68" y="1009" class="body">Juda en Sion; David vanachter de</text><text x="68" y="1052" class="body">schapen naar het weiden van het volk.</text><text x="46" y="1145" class="note">De herinneringen zijn geen losse verzameling</text><text x="46" y="1181" class="note">wonderen. Herhaalde ontrouw staat tegenover</text><text x="46" y="1217" class="note">barmhartigheid en ontvangen leiding.</text></svg>