<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc"><title id="title">Recht in de kring</title><desc id="desc">De onderdelen van het gericht zonder een niet gegeven voorstelling van de hemelse kring.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1319" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Recht in de kring</text><text x="44" y="113" class="ref">Psalm 82:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opening · 1</text><text x="68" y="241" class="body">God staat in de kring van de goden en</text><text x="68" y="284" class="body">spreekt recht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verwijt · 2</text><text x="68" y="433" class="body">Onrechtvaardig oordelen en de kant van</text><text x="68" y="476" class="body">het kwaad kiezen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Opdracht · 3–4</text><text x="68" y="625" class="body">Recht doen aan arme, wees, verdrukte en</text><text x="68" y="668" class="body">behoeftige; bevrijden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Uitspraak · 5–7</text><text x="68" y="817" class="body">Onbegrip, wankelende fundamenten en</text><text x="68" y="860" class="body">sterven als mensen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Slotgebed · 8</text><text x="68" y="1009" class="body">Oordeel de aarde; alle volken behoren U</text><text x="68" y="1052" class="body">toe.</text><text x="46" y="1145" class="note">Het overzicht houdt de woorden goden en zonen</text><text x="46" y="1181" class="note">van de Allerhoogste bij de tekst. De concrete</text><text x="46" y="1217" class="note">opdracht is recht en bevrijding voor wie</text><text x="46" y="1253" class="note">kwetsbaar zijn.</text></svg>