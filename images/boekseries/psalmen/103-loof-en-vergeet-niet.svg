<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Loof en vergeet niet</title><desc id="desc">De omlijsting en de vergelijkingen in het loflied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Loof en vergeet niet</text><text x="44" y="113" class="ref">Psalm 103:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mijn ziel · 1–5</text><text x="68" y="241" class="body">Niet vergeten: vergeving, genezing,</text><text x="68" y="284" class="body">ontferming en nieuwe kracht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Trouw en ontferming · 6–18</text><text x="68" y="433" class="body">Recht, geduld, hemel en aarde, oost en</text><text x="68" y="476" class="body">west, vader en kinderen, gras en bloem.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Alles · 19–22</text><text x="68" y="625" class="body">Engelen, dienaren en werken worden tot</text><text x="68" y="668" class="body">lof geroepen; opnieuw mijn ziel.</text><text x="46" y="761" class="note">De vergelijkingen vergroten de taal voor trouw</text><text x="46" y="797" class="note">en menselijke kwetsbaarheid. Het lied eindigt</text><text x="46" y="833" class="note">met dezelfde oproep aan de eigen ziel waarmee</text><text x="46" y="869" class="note">het begon.</text></svg>