<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Bedrog en blijvende trouw</title><desc id="desc">Historische aanleiding, kritiek op bedrieglijke taal en twee vormen van zekerheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bedrog en blijvende trouw</text><text x="44" y="113" class="ref">Psalm 52:2–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 2</text><text x="68" y="241" class="body">Doëg uit Edom bericht Saul dat David</text><text x="68" y="284" class="body">bij Achimelech is geweest.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aanklacht · 3–6</text><text x="68" y="433" class="body">Pochen, de tong als een scheermes en</text><text x="68" y="476" class="body">leugen boven eerlijke taal.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ontworteling · 7–9</text><text x="68" y="625" class="body">Vertrouwen op rijkdom en kwaad eindigt</text><text x="68" y="668" class="body">in afbraak.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Groene olijfboom · 10–11</text><text x="68" y="817" class="body">De bidder stelt vertrouwen op Gods</text><text x="68" y="860" class="body">blijvende trouw tegenover die valse</text><text x="68" y="903" class="body">zekerheid.</text><text x="46" y="996" class="note">Scheermes, ontworteling en groene olijfboom</text><text x="46" y="1032" class="note">vormen de scherpe tegenstellingen van het</text><text x="46" y="1068" class="note">gedicht. Het opschrift benoemt de aanleiding</text><text x="46" y="1104" class="note">voor de aanklacht.</text></svg>