<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Waarom, waarmee en wie</title><desc id="desc">De plaats, reden, instrumenten en allesomvattende slotoproep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom, waarmee en wie</text><text x="44" y="113" class="ref">Psalm 150:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Waar · 1</text><text x="68" y="241" class="body">In het heiligdom en het machtige</text><text x="68" y="284" class="body">hemelgewelf.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waarom · 2</text><text x="68" y="433" class="body">Machtige daden en geweldige grootheid.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Waarmee · 3–5</text><text x="68" y="582" class="body">Ramshoorn, luit, harp, tamboerijn,</text><text x="68" y="625" class="body">fluit, snaren, pijpen en cimbalen.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Wie · 6</text><text x="68" y="774" class="body">Alles wat adem heeft.</text><text x="46" y="867" class="note">De instrumentnamen volgen deze vertaling. De</text><text x="46" y="903" class="note">slotregel verruimt de oproep tot alles wat adem</text><text x="46" y="939" class="note">heeft.</text></svg>