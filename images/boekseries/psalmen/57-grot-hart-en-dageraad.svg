<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Grot, hart en dageraad</title><desc id="desc">Verhaalsituatie, poëtische beelden en het omlijstende refrein.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Grot, hart en dageraad</text><text x="44" y="113" class="ref">Psalm 57:1–12</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 1</text><text x="68" y="241" class="body">David vlucht voor Saul in de grot.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Schuilen en dreiging · 2–5</text><text x="68" y="390" class="body">Vleugelschaduw tegenover leeuwen, vuur</text><text x="68" y="433" class="body">en scherpe wapentaal.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Refrein · 6 en 12</text><text x="68" y="582" class="body">Verhef U boven de hemel; laat Uw eer</text><text x="68" y="625" class="body">over de aarde gaan.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Omkering en lof · 7–11</text><text x="68" y="774" class="body">De eigen kuil van de belagers; een</text><text x="68" y="817" class="body">gereed hart, luit en harp en de</text><text x="68" y="860" class="body">dageraad wekken.</text><text x="46" y="953" class="note">De grot is de genoemde schuilplaats; de vleugels</text><text x="46" y="989" class="note">zijn een beschermingsbeeld. De lof krijgt door</text><text x="46" y="1025" class="note">het herhaalde refrein een horizon van hemel en</text><text x="46" y="1061" class="note">aarde.</text></svg>