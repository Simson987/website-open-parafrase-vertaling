<svg xmlns="http://www.w3.org/2000/svg" width="840" height="856" viewBox="0 0 840 856" role="img" aria-labelledby="title desc"><title id="title">Loflied en oordeelswoorden</title><desc id="desc">De overgang van lof en redding naar de woorden over oordeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="856" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Loflied en oordeelswoorden</text><text x="44" y="113" class="ref">Psalm 149:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gemeente · 1–3</text><text x="68" y="241" class="body">Nieuw lied, vreugde, fluit, tamboerijn</text><text x="68" y="284" class="body">en harp.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zachtmoedigen · 4–5</text><text x="68" y="433" class="body">Redding, eer en jubelen op het bed.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Oordeel · 6–9</text><text x="68" y="582" class="body">Lof en zwaard; wraak, gebonden koningen</text><text x="68" y="625" class="body">en opgeschreven recht.</text><text x="46" y="718" class="note">De slotverzen bevatten ook oordeels- en</text><text x="46" y="754" class="note">strijdtaal. Dit overzicht benoemt die woorden</text><text x="46" y="790" class="note">zonder een niet vertelde veldslag te verzinnen.</text></svg>