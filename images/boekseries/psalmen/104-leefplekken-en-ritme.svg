<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1233" viewBox="0 0 840 1233" role="img" aria-labelledby="title desc"><title id="title">Leefplekken en ritme</title><desc id="desc">Natuurmotieven, voedsel en de afwisseling van nacht en dag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1233" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leefplekken en ritme</text><text x="44" y="113" class="ref">Psalm 104:10–30</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Water · 10–13</text><text x="68" y="241" class="body">Bronnen voor veldieren en vogels.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Voeding en wonen · 14–18</text><text x="68" y="390" class="body">Gras, brood, wijn, olie; ceders, nesten</text><text x="68" y="433" class="body">en rotsen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Tijden · 19–23</text><text x="68" y="582" class="body">Maan en zon; nachtdieren, daarna de</text><text x="68" y="625" class="body">werkende mens.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Zee · 24–26</text><text x="68" y="774" class="body">Ontelbare dieren, schepen en de</text><text x="68" y="817" class="body">genoemde Leviathan.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Ontvangen leven · 27–30</text><text x="68" y="966" class="body">Voedsel, adem, sterven en vernieuwing.</text><text x="46" y="1059" class="note">De psalm ordent leefplekken en afhankelijkheid.</text><text x="46" y="1095" class="note">De namen en beelden zijn poëtisch onderricht;</text><text x="46" y="1131" class="note">dit overzicht bepaalt geen zoologische</text><text x="46" y="1167" class="note">identiteit van Leviathan.</text></svg>