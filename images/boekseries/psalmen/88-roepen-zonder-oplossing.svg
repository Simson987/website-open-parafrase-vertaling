<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Roepen zonder oplossing</title><desc id="desc">De aanhoudende klacht en het open einde van Psalm 88.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Roepen zonder oplossing</text><text x="44" y="113" class="ref">Psalm 88:2–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dag en nacht · 2–3</text><text x="68" y="241" class="body">De bidder blijft roepen tot de God die</text><text x="68" y="284" class="body">redt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Diepte en afstand · 4–10</text><text x="68" y="433" class="body">Graf, kuil, golven en verdwenen</text><text x="68" y="476" class="body">bekenden geven taal aan de nood.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vragen · 11–13</text><text x="68" y="625" class="body">Klinken trouw en lof ook in het graf en</text><text x="68" y="668" class="body">de vergetelheid?</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Opnieuw roepen · 14–19</text><text x="68" y="817" class="body">Morgengebed, waaromvragen en het donker</text><text x="68" y="860" class="body">als laatste bekende.</text><text x="46" y="953" class="note">De tekst eindigt in het donker. Het ochtendgebed</text><text x="46" y="989" class="note">is volgehouden roepen; de psalm vertelt hier</text><text x="46" y="1025" class="note">geen daaropvolgende oplossing.</text></svg>