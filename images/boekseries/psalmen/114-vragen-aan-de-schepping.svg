<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Vragen aan de schepping</title><desc id="desc">Personificatie, herhaling en de antwoordbeweging in de uittochtpsalm.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vragen aan de schepping</text><text x="44" y="113" class="ref">Psalm 114:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uittocht · 1–2</text><text x="68" y="241" class="body">Israël uit Egypte; Juda en Israël als</text><text x="68" y="284" class="body">heiligdom en gebied.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Reactie · 3–4</text><text x="68" y="433" class="body">Zee en Jordaan; bergen als rammen en</text><text x="68" y="476" class="body">heuvels als lammeren.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vragen · 5–6</text><text x="68" y="625" class="body">Dezelfde wateren en bergen worden</text><text x="68" y="668" class="body">rechtstreeks aangesproken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Antwoord · 7–8</text><text x="68" y="817" class="body">Beef voor de God van Jakob, die rots</text><text x="68" y="860" class="body">tot waterbron maakt.</text><text x="46" y="953" class="note">Het hernemen van de beelden maakt de vraag-en-</text><text x="46" y="989" class="note">antwoordbeweging zichtbaar. Springende bergen</text><text x="46" y="1025" class="note">zijn een vergelijking met dieren.</text></svg>