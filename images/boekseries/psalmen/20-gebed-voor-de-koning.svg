<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc"><title id="title">Gebed voor de koning</title><desc id="desc">De wisseling tussen wens, wij, ik, tegenstelling en slotgebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1319" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed voor de koning</text><text x="44" y="113" class="ref">Psalm 20:2–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De wens · 2–5</text><text x="68" y="241" class="body">Antwoord, bescherming, hulp en het</text><text x="68" y="284" class="body">aannemen van offers.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het wij · 6</text><text x="68" y="433" class="body">Samen juichen en vlaggen hijsen in Gods</text><text x="68" y="476" class="body">naam.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het ik · 7</text><text x="68" y="625" class="body">Uitgesproken vertrouwen in de redding</text><text x="68" y="668" class="body">van de Gezalfde.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tegenstelling · 8–9</text><text x="68" y="817" class="body">Wagens en paarden tegenover vertrouwen</text><text x="68" y="860" class="body">op Gods naam.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Slotgebed · 10</text><text x="68" y="1009" class="body">Red de koning en antwoord als wij</text><text x="68" y="1052" class="body">roepen.</text><text x="46" y="1145" class="note">Het hoofdstuk is een gebed om hulp en</text><text x="46" y="1181" class="note">vertrouwen. De offers en vlaggen dienen de</text><text x="46" y="1217" class="note">woorden van de bidders; het slot blijft om</text><text x="46" y="1253" class="note">antwoord vragen.</text></svg>