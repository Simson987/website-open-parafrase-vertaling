<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Nood, vertrouwen en moed</title><desc id="desc">De herhaalde wisseling tussen nood en vertrouwen, eindigend in bemoediging van anderen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nood, vertrouwen en moed</text><text x="44" y="113" class="ref">Psalm 31:2–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schuilen · 2–9</text><text x="68" y="241" class="body">Rots, burcht, net en ruimte; het leven</text><text x="68" y="284" class="body">wordt toevertrouwd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sociaal en lichamelijk · 10–14</text><text x="68" y="433" class="body">Verdriet, uitputting, vermijding, kruik</text><text x="68" y="476" class="body">en gefluister.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Toch vertrouwen · 15–19</text><text x="68" y="625" class="body">Mijn tijden liggen in Uw hand; red mij</text><text x="68" y="668" class="body">en laat Uw gezicht lichten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Lof en bemoediging · 20–25</text><text x="68" y="817" class="body">Beschutting, trouw en een oproep om</text><text x="68" y="860" class="body">lief te hebben en moed te houden.</text><text x="46" y="953" class="note">Het kapotte aardewerk verbeeldt vergeten en</text><text x="46" y="989" class="note">afgewezen worden. De vaste belijdenis van</text><text x="46" y="1025" class="note">vertrouwen verschijnt midden in de nog</text><text x="46" y="1061" class="note">uitgesproken nood.</text></svg>