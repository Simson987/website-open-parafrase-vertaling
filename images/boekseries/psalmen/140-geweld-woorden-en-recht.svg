<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Geweld, woorden en recht</title><desc id="desc">Dreiging, gevraagde bescherming en recht voor de armen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geweld, woorden en recht</text><text x="44" y="113" class="ref">Psalm 140:2–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dreiging · 2–6</text><text x="68" y="241" class="body">Geweld, oorlog, slangentong en</text><text x="68" y="284" class="body">verborgen vallen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bede · 7–9</text><text x="68" y="433" class="body">Luister, bescherm en laat hun plan niet</text><text x="68" y="476" class="body">slagen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Oordeelswoorden · 10–12</text><text x="68" y="625" class="body">Lippen, kolen en kuilen verwoorden het</text><text x="68" y="668" class="body">gevraagde oordeel.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vertrouwen · 13–14</text><text x="68" y="817" class="body">Recht voor ellendigen en armen, gevolgd</text><text x="68" y="860" class="body">door lof.</text><text x="46" y="953" class="note">De slang verbeeldt kwaadaardige woorden. De</text><text x="46" y="989" class="note">oordeelsbeelden staan in het gebed; zij</text><text x="46" y="1025" class="note">vertellen hier geen reeds uitgevoerde</text><text x="46" y="1061" class="note">gebeurtenis.</text></svg>