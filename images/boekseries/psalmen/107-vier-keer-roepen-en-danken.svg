<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Vier keer roepen en danken</title><desc id="desc">De vier hulpverhalen met hun exacte roep- en dankrefreinen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier keer roepen en danken</text><text x="44" y="113" class="ref">Psalm 107:4–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verdwaalden · 4–9</text><text x="68" y="241" class="body">Honger en dorst; een rechte weg en een</text><text x="68" y="284" class="body">stad om te wonen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gevangenen · 10–16</text><text x="68" y="433" class="body">Donker en ijzer; uitgeleid en verbroken</text><text x="68" y="476" class="body">deuren.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zieken · 17–22</text><text x="68" y="625" class="body">Eten afgewezen; genezing en dankoffers.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Zeevaarders · 23–32</text><text x="68" y="774" class="body">Storm en angst; stilte en de gewenste</text><text x="68" y="817" class="body">haven.</text><text x="46" y="910" class="note">Elke groep roept in nood en krijgt daarna de</text><text x="46" y="946" class="note">oproep om te danken. Refreinen: roepen in 6, 13,</text><text x="46" y="982" class="note">19 en 28; danken in 8, 15, 21 en 31.</text></svg>