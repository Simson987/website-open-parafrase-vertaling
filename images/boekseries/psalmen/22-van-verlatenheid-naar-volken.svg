<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1362" viewBox="0 0 840 1362" role="img" aria-labelledby="title desc"><title id="title">Van verlatenheid naar volken</title><desc id="desc">De grote beweging van de lange klaagpsalm en haar afzonderlijke beeldgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1362" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van verlatenheid naar volken</text><text x="44" y="113" class="ref">Psalm 22:2–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Klacht en herinnering · 2–12</text><text x="68" y="241" class="body">Roepen zonder antwoord, vertrouwen van</text><text x="68" y="284" class="body">de vaderen, spot en vertrouwen vanaf de</text><text x="68" y="327" class="body">geboorte.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dreiging · 13–19</text><text x="68" y="476" class="body">Stieren, leeuw en honden; water, was en</text><text x="68" y="519" class="body">potscherf; kleding en lot.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Keerpunt · 20–23</text><text x="68" y="668" class="body">Roep om hulp, het antwoord en de</text><text x="68" y="711" class="body">belofte van lof in de kring.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Grote kring · 24–27</text><text x="68" y="860" class="body">Gehoorde ellende, lof, beloften en eten</text><text x="68" y="903" class="body">voor armen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Alle volken · 28–32</text><text x="68" y="1052" class="body">Wereldwijde omkeer en het doorvertellen</text><text x="68" y="1095" class="body">aan komende geslachten.</text><text x="46" y="1188" class="note">De dier- en lichaamsbeelden verwoorden</text><text x="46" y="1224" class="note">bedreiging en uitputting. Het slot opent de</text><text x="46" y="1260" class="note">kring van de eenzame bidder naar armen, volken</text><text x="46" y="1296" class="note">en toekomstige generaties.</text></svg>