<svg xmlns="http://www.w3.org/2000/svg" width="840" height="892" viewBox="0 0 840 892" role="img" aria-labelledby="title desc"><title id="title">De genoemde bondgenoten</title><desc id="desc">Exacte namen en de expliciet genoemde steunrelatie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="892" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde bondgenoten</text><text x="44" y="113" class="ref">Psalm 83:7–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 7</text><text x="68" y="241" class="body">Edom, Ismaëlieten, Moab en Hagrieten.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vers 8</text><text x="68" y="390" class="body">Gebal, Ammon, Amalek, Filistea en de</text><text x="68" y="433" class="body">inwoners van Tyrus.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vers 9</text><text x="68" y="582" class="body">Ook Assur sluit zich aan; zij zijn een</text><text x="68" y="625" class="body">sterke arm voor de kinderen van Lot.</text><text x="46" y="718" class="note">De namen volgen de volgorde van de psalm. De</text><text x="46" y="754" class="note">kinderen van Lot worden als ontvangers van steun</text><text x="46" y="790" class="note">genoemd; de tekening voegt geen reisroute of</text><text x="46" y="826" class="note">moderne grens toe.</text></svg>