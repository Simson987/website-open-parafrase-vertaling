<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Kom kijken, kom luisteren</title><desc id="desc">De verschuiving van alle volken naar ons en ik en de twee uitnodigingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kom kijken, kom luisteren</text><text x="44" y="113" class="ref">Psalm 66:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De hele aarde · 1–7</text><text x="68" y="241" class="body">Lof en de oproep Gods daden te zien;</text><text x="68" y="284" class="body">herinnerde doortocht van zee en rivier.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ons · 8–12</text><text x="68" y="433" class="body">Leven bewaren en toetsing als zilver;</text><text x="68" y="476" class="body">net, last, vuur en water naar</text><text x="68" y="519" class="body">overvloed.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ik · 13–15</text><text x="68" y="668" class="body">Beloofde offers worden gebracht na de</text><text x="68" y="711" class="body">nood.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Luister · 16–20</text><text x="68" y="860" class="body">Persoonlijk vertellen van gehoord gebed</text><text x="68" y="903" class="body">en blijvende trouw.</text><text x="46" y="996" class="note">De psalm gaat van wereldwijd lofverlangen via</text><text x="46" y="1032" class="note">gezamenlijke beproeving naar een persoonlijke</text><text x="46" y="1068" class="note">getuigenis. Kijken en luisteren geven die</text><text x="46" y="1104" class="note">overgang woorden.</text></svg>