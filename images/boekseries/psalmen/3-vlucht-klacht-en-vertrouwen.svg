<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1041" viewBox="0 0 840 1041" role="img" aria-labelledby="title desc"><title id="title">Vlucht, klacht en vertrouwen</title><desc id="desc">Historische situering onderscheiden van de beeldtaal van het gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1041" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vlucht, klacht en vertrouwen</text><text x="44" y="113" class="ref">Psalm 3:1–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 1</text><text x="68" y="241" class="body">David vlucht voor zijn zoon Absalom.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Veel tegenstanders · 2–3</text><text x="68" y="390" class="body">Zij zeggen dat God hem niet zal redden.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Tegenstem · 4–7</text><text x="68" y="539" class="body">De HEERE als schild; roepen, slapen en</text><text x="68" y="582" class="body">weer wakker worden.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Gebed en slot · 8–9</text><text x="68" y="731" class="body">Vraag om redding en zegen voor het</text><text x="68" y="774" class="body">volk.</text><text x="46" y="867" class="note">De vlucht heeft een historische aanduiding in</text><text x="46" y="903" class="note">het opschrift. Schild en gebroken tanden zijn</text><text x="46" y="939" class="note">poëtische beschermingstaal en overwinningstaal,</text><text x="46" y="975" class="note">geen extra veldslag in dit hoofdstuk.</text></svg>