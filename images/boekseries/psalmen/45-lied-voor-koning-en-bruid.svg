<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Lied voor koning en bruid</title><desc id="desc">De geadresseerden en tekstgedeelten van het koninklijke bruiloftslied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lied voor koning en bruid</text><text x="44" y="113" class="ref">Psalm 45:2–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zanger · 2</text><text x="68" y="241" class="body">Zijn tong als de pen van een vaardige</text><text x="68" y="284" class="body">schrijver.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De koning · 3–10</text><text x="68" y="433" class="body">Woord, waarheid, recht, scepter,</text><text x="68" y="476" class="body">vreugdeolie, geur en koninklijke</text><text x="68" y="519" class="body">pracht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De bruid · 11–16</text><text x="68" y="668" class="body">Luisteren, een nieuwe verbondenheid en</text><text x="68" y="711" class="body">de feestelijke intocht met vriendinnen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Toekomst · 17–18</text><text x="68" y="860" class="body">Zonen, herinnering van geslacht op</text><text x="68" y="903" class="body">geslacht en blijvende lof.</text><text x="46" y="996" class="note">Het opschrift noemt een liefdeslied. Het gedicht</text><text x="46" y="1032" class="note">wisselt de aanspreking van koning en bruid af;</text><text x="46" y="1068" class="note">waarheid en gerechtigheid horen bij de</text><text x="46" y="1104" class="note">koninklijke lof.</text></svg>