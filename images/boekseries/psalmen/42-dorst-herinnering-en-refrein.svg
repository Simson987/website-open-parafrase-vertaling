<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Dorst, herinnering en refrein</title><desc id="desc">De verschillende tijdlagen, de Korachitische aanduiding en het tweemaal terugkerende refrein.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dorst, herinnering en refrein</text><text x="44" y="113" class="ref">Psalm 42:1–12</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 1</text><text x="68" y="241" class="body">Een leerlied van de zonen van Korach.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Dorst en herinnering · 2–5</text><text x="68" y="390" class="body">Hert, tranen en de vroegere feeststoet.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Eerste refrein · 6</text><text x="68" y="539" class="body">Waarom bedroefd? Hoop op God; ik zal</text><text x="68" y="582" class="body">Hem weer prijzen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Diepte en nacht · 7–11</text><text x="68" y="731" class="body">Jordaan en Hermon, watervallen, golven,</text><text x="68" y="774" class="body">nachtlied en hoon.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Herhaald refrein · 12</text><text x="68" y="923" class="body">Dezelfde aanspraak tot de eigen ziel</text><text x="68" y="966" class="body">keert terug.</text><text x="46" y="1059" class="note">Het hert en de golven verbeelden verlangen en</text><text x="46" y="1095" class="note">overweldiging. De feeststoet wordt herinnerd;</text><text x="46" y="1131" class="note">het refrein spreekt de eigen ziel moed in.</text></svg>