<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Vertrouwen, zoeken en wachten</title><desc id="desc">De wisseling van belijdenis naar hulpvraag en de afsluitende oproep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vertrouwen, zoeken en wachten</text><text x="44" y="113" class="ref">Psalm 27:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Belijdenis · 1–3</text><text x="68" y="241" class="body">Licht en redding dragen vertrouwen</text><text x="68" y="284" class="body">tegenover een leger.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eén verlangen · 4–6</text><text x="68" y="433" class="body">Wonen bij de HEERE, beschutting, offers</text><text x="68" y="476" class="body">en lof.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Directe hulpvraag · 7–12</text><text x="68" y="625" class="body">Horen, nabijheid, aanneming en leiding</text><text x="68" y="668" class="body">tegenover valse getuigen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Verwachting · 13–14</text><text x="68" y="817" class="body">Goedheid zien en met een sterk hart</text><text x="68" y="860" class="body">wachten.</text><text x="46" y="953" class="note">Vertrouwen en smeken staan in dezelfde psalm.</text><text x="46" y="989" class="note">Het begin sluit de latere hulpvraag niet uit;</text><text x="46" y="1025" class="note">het slot geeft wachten als oproep mee.</text></svg>