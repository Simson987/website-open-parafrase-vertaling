<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Verbond, dank en levensweg</title><desc id="desc">De twee aangesproken groepen en de samenhang van danklied, verbond en handelen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verbond, dank en levensweg</text><text x="44" y="113" class="ref">Psalm 50:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bijeenroepen · 1–6</text><text x="68" y="241" class="body">Aarde, hemel en verbondsvolk worden tot</text><text x="68" y="284" class="body">het gericht geroepen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Offers · 7–15</text><text x="68" y="433" class="body">God heeft de dierenwereld al; dank,</text><text x="68" y="476" class="body">beloften en roepen in nood worden</text><text x="68" y="519" class="body">gevraagd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Woorden en daden · 16–21</text><text x="68" y="668" class="body">Verbondstaal past niet bij diefstal,</text><text x="68" y="711" class="body">overspel, bedrog en kwaadspreken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Slot · 22–23</text><text x="68" y="860" class="body">Begrijpen, dank en de goede weg</text><text x="68" y="903" class="body">verbinden zich met redding.</text><text x="46" y="996" class="note">Het opschrift noemt Asaf. Het gedicht plaatst</text><text x="46" y="1032" class="note">offerpraktijk naast dankbaarheid en een</text><text x="46" y="1068" class="note">overeenkomstige levenswandel.</text></svg>