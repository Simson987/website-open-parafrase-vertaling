<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Viermaal hoelang</title><desc id="desc">De herhaling en de opbouw van een korte klaagpsalm.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Viermaal hoelang</text><text x="44" y="113" class="ref">Psalm 13:2–7</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Klacht · 2–3</text><text x="68" y="241" class="body">Viermaal hoelang: vergeten,</text><text x="68" y="284" class="body">verborgenheid, zorgen en de macht van</text><text x="68" y="327" class="body">de vijand.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vraag · 4–5</text><text x="68" y="476" class="body">Kijk, antwoord en geef licht; laat de</text><text x="68" y="519" class="body">vijand niet juichen.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vertrouwen · 6</text><text x="68" y="668" class="body">Maar ik vertrouw op Uw trouw.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Lof · 7</text><text x="68" y="817" class="body">De bidder wil zingen om ontvangen</text><text x="68" y="860" class="body">goedheid.</text><text x="46" y="953" class="note">De herhaalde vraag wordt gevolgd door een</text><text x="46" y="989" class="note">scherpe omslag. De drie aanwezige illustraties</text><text x="46" y="1025" class="note">volgen die beweging van klacht via gebed naar</text><text x="46" y="1061" class="note">lof.</text></svg>