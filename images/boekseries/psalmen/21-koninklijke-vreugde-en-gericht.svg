<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Koninklijke vreugde en gericht</title><desc id="desc">De beweging van ontvangen zegen via vertrouwen naar gericht en gezamenlijke lof.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Koninklijke vreugde en gericht</text><text x="44" y="113" class="ref">Psalm 21:2–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ontvangen zegen · 2–7</text><text x="68" y="241" class="body">Redding, verhoord verlangen, kroon,</text><text x="68" y="284" class="body">leven, eer en vreugde.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De grond · 8</text><text x="68" y="433" class="body">Vertrouwen op de HEERE en de trouw van</text><text x="68" y="476" class="body">de Allerhoogste.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vijandige plannen · 9–13</text><text x="68" y="625" class="body">Gericht en mislukking van kwade</text><text x="68" y="668" class="body">voornemens.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Slot · 14</text><text x="68" y="817" class="body">Gezamenlijk zingen om Gods kracht.</text><text x="46" y="910" class="note">Kroon en vreugde staan in een koninklijk</text><text x="46" y="946" class="note">danklied. De oven en boog verwoorden het gericht</text><text x="46" y="982" class="note">in krachtige poëtische taal.</text></svg>