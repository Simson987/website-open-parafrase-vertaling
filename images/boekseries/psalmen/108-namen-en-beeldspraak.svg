<svg xmlns="http://www.w3.org/2000/svg" width="840" height="892" viewBox="0 0 840 892" role="img" aria-labelledby="title desc"><title id="title">Namen en beeldspraak</title><desc id="desc">De geografische namen en de eraan gekoppelde vergelijkingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="892" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Namen en beeldspraak</text><text x="44" y="113" class="ref">Psalm 108:8–10</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verdelen en meten · 8</text><text x="68" y="241" class="body">Sichem en het dal van Sukkot.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Van Mij · 9</text><text x="68" y="390" class="body">Gilead en Manasse; Efraïm als helm,</text><text x="68" y="433" class="body">Juda als scepter.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Beelden · 10</text><text x="68" y="582" class="body">Moab als waskom; een sandaal op Edom;</text><text x="68" y="625" class="body">juichen over Filistea.</text><text x="46" y="718" class="note">De namen staan in de volgorde van de godsspraak.</text><text x="46" y="754" class="note">Helm, scepter, waskom en sandaal zijn</text><text x="46" y="790" class="note">machtsbeelden; dit is geen kaart met</text><text x="46" y="826" class="note">vastgestelde grenzen.</text></svg>