<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Eerlijk gebed en bescherming</title><desc id="desc">De volgorde van onschuld, bescherming, gevaar en uiteindelijke verzadiging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eerlijk gebed en bescherming</text><text x="44" y="113" class="ref">Psalm 17:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onderzoek · 1–5</text><text x="68" y="241" class="body">Eerlijke lippen, getoetst hart en</text><text x="68" y="284" class="body">stappen in het spoor.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bescherming · 6–9</text><text x="68" y="433" class="body">Roepen, oogappel en schaduw van</text><text x="68" y="476" class="body">vleugels.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bedreiging · 10–14</text><text x="68" y="625" class="body">Harde harten en een verborgen leeuw;</text><text x="68" y="668" class="body">vraag om bevrijding.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Eigen verlangen · 15</text><text x="68" y="817" class="body">Verzadigd worden met Gods aanblik in</text><text x="68" y="860" class="body">gerechtigheid.</text><text x="46" y="953" class="note">De vleugels en de leeuw zijn beelden van</text><text x="46" y="989" class="note">bescherming en bedreiging. Het slot plaatst het</text><text x="46" y="1025" class="note">eigen verlangen naast het aardse deel van de</text><text x="46" y="1061" class="note">tegenstanders.</text></svg>