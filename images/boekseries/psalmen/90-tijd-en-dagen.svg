<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Tijd en onze dagen</title><desc id="desc">Tijdvergelijkingen en hun verbinding met wijsheid en dagelijks werk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tijd en onze dagen</text><text x="44" y="113" class="ref">Psalm 90:2–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eeuwigheid · 2–4</text><text x="68" y="241" class="body">God vóór de bergen; duizend jaar</text><text x="68" y="284" class="body">vergeleken met gisteren en een</text><text x="68" y="327" class="body">nachtwake.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vergankelijkheid · 5–10</text><text x="68" y="476" class="body">Slaap, gras en een zucht; zeventig of</text><text x="68" y="519" class="body">bij kracht tachtig jaren.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wijsheid · 11–12</text><text x="68" y="668" class="body">Onze dagen leren tellen om een wijs</text><text x="68" y="711" class="body">hart te krijgen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bede · 13–17</text><text x="68" y="860" class="body">Ontferming, vreugde, werk voor dienaren</text><text x="68" y="903" class="body">en luister aan hun kinderen.</text><text x="46" y="996" class="note">De getallen staan in een gebed over de korte</text><text x="46" y="1032" class="note">menselijke tijd. Het is geen tijdrekening</text><text x="46" y="1068" class="note">waarmee een datum wordt voorspeld.</text></svg>