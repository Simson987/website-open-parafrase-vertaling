<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Onrust, stad en vrede</title><desc id="desc">De contrasterende waterbeelden en de tweemaal terugkerende burchtbelijdenis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onrust, stad en vrede</text><text x="44" y="113" class="ref">Psalm 46:2–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schepping in beroering · 2–4</text><text x="68" y="241" class="body">Schuilplaats in nood, ook bij bruisend</text><text x="68" y="284" class="body">water en bevende bergen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Stad en refrein · 5–8</text><text x="68" y="433" class="body">Rivier, blijvende stad en de</text><text x="68" y="476" class="body">belijdenis: de HEERE is met ons.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Oorlogen eindigen · 9–11</text><text x="68" y="625" class="body">Gebroken wapens en de oproep om los te</text><text x="68" y="668" class="body">laten en God te kennen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Refrein · 12</text><text x="68" y="817" class="body">De belijdenis van de burcht wordt</text><text x="68" y="860" class="body">herhaald.</text><text x="46" y="953" class="note">Woelige zee en de vreugdegevende rivier staan</text><text x="46" y="989" class="note">tegenover elkaar. Het herhaalde refrein verbindt</text><text x="46" y="1025" class="note">beschutting met het einde van de strijd.</text></svg>