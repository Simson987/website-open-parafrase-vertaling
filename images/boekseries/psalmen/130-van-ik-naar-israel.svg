<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Van ik naar Israël</title><desc id="desc">De beweging van persoonlijk roepen naar de gezamenlijke oproep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van ik naar Israël</text><text x="44" y="113" class="ref">Psalm 130:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uit de diepten · 1–2</text><text x="68" y="241" class="body">De ik roept en vraagt gehoord te</text><text x="68" y="284" class="body">worden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vergeving · 3–4</text><text x="68" y="433" class="body">Wie kan standhouden? Bij U is</text><text x="68" y="476" class="body">vergeving.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wachten · 5–6</text><text x="68" y="625" class="body">Hoop op het woord, meer dan wachters op</text><text x="68" y="668" class="body">de morgen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Israël · 7–8</text><text x="68" y="817" class="body">De oproep wordt gezamenlijk: hoop,</text><text x="68" y="860" class="body">trouw en veel verlossing.</text><text x="46" y="953" class="note">De herhaling van wachten verdiept het verlangen.</text><text x="46" y="989" class="note">Het slot richt de persoonlijke hoop tot Israël.</text></svg>