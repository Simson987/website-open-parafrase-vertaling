<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Herinneren en geleid worden</title><desc id="desc">Van bezwijkende kracht via herinnering naar gehoorzame leiding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herinneren en geleid worden</text><text x="44" y="113" class="ref">Psalm 143:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hoor · 1–4</text><text x="68" y="241" class="body">Geen mens rechtvaardig; vervolging,</text><text x="68" y="284" class="body">donker en een bezwijkende geest.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Herinnering · 5–6</text><text x="68" y="433" class="body">Vroegere daden en het dorstige land als</text><text x="68" y="476" class="body">zielsbeeld.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Morgen en weg · 7–10</text><text x="68" y="625" class="body">Trouw horen, weten waar te gaan en</text><text x="68" y="668" class="body">geleid worden over effen land.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Houd mij in leven · 11–12</text><text x="68" y="817" class="body">Redding om naam en gerechtigheid;</text><text x="68" y="860" class="body">slotbede tegen de vijanden.</text><text x="46" y="953" class="note">Het dorstige land is een vergelijking voor het</text><text x="46" y="989" class="note">verlangen. De weg wordt verbonden met leren doen</text><text x="46" y="1025" class="note">wat God wil.</text></svg>