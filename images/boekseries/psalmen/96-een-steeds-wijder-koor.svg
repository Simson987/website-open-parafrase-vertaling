<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Een steeds wijder koor</title><desc id="desc">Van vertellers naar volken en de hele schepping in de oproep tot lof.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een steeds wijder koor</text><text x="44" y="113" class="ref">Psalm 96:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hele aarde · 1–3</text><text x="68" y="241" class="body">Zingen en vertellen onder volken en</text><text x="68" y="284" class="body">naties.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Families van volken · 7–10</text><text x="68" y="433" class="body">Eer geven, offer brengen en eerlijk</text><text x="68" y="476" class="body">oordeel verkondigen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Schepping · 11–12</text><text x="68" y="625" class="body">Hemel, aarde, zee, veld en alle bomen</text><text x="68" y="668" class="body">doen mee.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Waarom · 13</text><text x="68" y="817" class="body">De komst om de wereld met gerechtigheid</text><text x="68" y="860" class="body">en waarheid te oordelen.</text><text x="46" y="953" class="note">Het juichen van veld en bomen is personificatie.</text><text x="46" y="989" class="note">De wijder wordende oproep mondt uit in de</text><text x="46" y="1025" class="note">aankondiging van rechtvaardig oordeel.</text></svg>