<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Twee wegen in Psalm 1</title><desc id="desc">Psalm 1 vergelijkt twee wegen: de rechtvaardige als een vruchtbare boom aan het water en de goddeloze als kaf in de wind. Vers 6 sluit beide wegen af.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee wegen in Psalm 1</text><text x="44" y="113" class="ref">Psalm 1:1–6</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De rechtvaardige · vers 1–3</text><text x="68" y="241" class="body">Gaat niet mee met kwaad; houdt van Gods</text><text x="68" y="284" class="body">wet. Beeld: een vruchtbare boom aan het</text><text x="68" y="327" class="body">water.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De goddeloze · vers 4–5</text><text x="68" y="476" class="body">Houdt geen stand. Beeld: kaf dat de</text><text x="68" y="519" class="body">wind wegblaast.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De afsluiting · vers 6</text><text x="68" y="668" class="body">De HEERE kent de weg van de</text><text x="68" y="711" class="body">rechtvaardigen. De weg van de</text><text x="68" y="754" class="body">goddelozen loopt dood.</text><text x="46" y="847" class="note">Dit overzicht volgt de beeldspraak van het</text><text x="46" y="883" class="note">gedicht; het is geen historische gebeurtenis.</text></svg>