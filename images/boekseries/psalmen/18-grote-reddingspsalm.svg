<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1511" viewBox="0 0 840 1511" role="img" aria-labelledby="title desc"><title id="title">De grote reddingspsalm</title><desc id="desc">Zes tekstgedeelten van de lange psalm met hun verschillende motieven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1511" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De grote reddingspsalm</text><text x="44" y="113" class="ref">Psalm 18:1–51</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift en belijdenis · 1–4</text><text x="68" y="241" class="body">David noemt redding van vijanden en</text><text x="68" y="284" class="body">Saul; rots, burcht en schild.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nood en storm · 5–16</text><text x="68" y="433" class="body">Doodsbanden, hulpgeroep en een</text><text x="68" y="476" class="body">kosmische stormbeschrijving.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Redding en recht · 17–28</text><text x="68" y="625" class="body">Diep water, ruimte, eigen levensweg en</text><text x="68" y="668" class="body">Gods antwoord.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Toegerust · 29–37</text><text x="68" y="817" class="body">Lamp, muur, hinde, bronzen boog, schild</text><text x="68" y="860" class="body">en vaste stappen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Overwinning · 38–46</text><text x="68" y="1009" class="body">De koning beschrijft teruggedrongen</text><text x="68" y="1052" class="body">vijanden en volken.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Lof · 47–51</text><text x="68" y="1201" class="body">God leeft; lof onder de volken en trouw</text><text x="68" y="1244" class="body">aan David en zijn nageslacht.</text><text x="46" y="1337" class="note">Het opschrift verbindt de psalm met Davids</text><text x="46" y="1373" class="note">redding. De dichter spreekt daarover in machtige</text><text x="46" y="1409" class="note">storm-, reddings- en strijdbeelden; de</text><text x="46" y="1445" class="note">leeswijzer houdt de delen samen.</text></svg>