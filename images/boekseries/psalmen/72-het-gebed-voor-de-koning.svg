<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Het gebed voor de koning</title><desc id="desc">Het verband tussen koninklijke macht en daadwerkelijke zorg voor kwetsbaren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het gebed voor de koning</text><text x="44" y="113" class="ref">Psalm 72:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Recht · 1–4</text><text x="68" y="241" class="body">Recht voor volk, armen en kinderen van</text><text x="68" y="284" class="body">behoeftigen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vrede · 5–7</text><text x="68" y="433" class="body">Blijvende eerbied en vruchtbaarheid,</text><text x="68" y="476" class="body">als zachte regen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bereik · 8–11</text><text x="68" y="625" class="body">Zeeën, rivier, woestijn en verre</text><text x="68" y="668" class="body">koningen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De reden · 12–14</text><text x="68" y="817" class="body">Hij redt wie geen helper heeft; hun</text><text x="68" y="860" class="body">leven is kostbaar.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Zegen en lof · 15–20</text><text x="68" y="1009" class="body">Gebed, goud, koren, blijvende naam en</text><text x="68" y="1052" class="body">lof op de God van Israël.</text><text x="46" y="1145" class="note">Het opschrift luidt voor Salomo. Het gedicht</text><text x="46" y="1181" class="note">bidt om rechtvaardig koningschap; de beelden</text><text x="46" y="1217" class="note">verwoorden gewenste vrede en zegen.</text></svg>