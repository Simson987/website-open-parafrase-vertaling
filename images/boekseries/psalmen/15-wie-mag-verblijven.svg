<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1389" viewBox="0 0 840 1389" role="img" aria-labelledby="title desc"><title id="title">Wie mag verblijven</title><desc id="desc">Het verband tussen de openingsvraag en de concrete sociale gedragskenmerken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1389" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie mag verblijven</text><text x="44" y="113" class="ref">Psalm 15:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 1</text><text x="68" y="241" class="body">Wie mag in Gods tent en op Zijn heilige</text><text x="68" y="284" class="body">berg verblijven?</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Handelen en waarheid · 2</text><text x="68" y="433" class="body">Oprecht leven, goed doen en waarheid</text><text x="68" y="476" class="body">uit het hart.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Omgaan met anderen · 3</text><text x="68" y="625" class="body">Roddel, schade en schande vermijden.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Trouw · 4</text><text x="68" y="774" class="body">Ontzag eren en beloften ook bij schade</text><text x="68" y="817" class="body">houden.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Geld en recht · 5</text><text x="68" y="966" class="body">Geen geld uitlenen tegen rente en geen</text><text x="68" y="1009" class="body">omkoping tegen een onschuldige.</text><rect x="42" y="1067" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Het antwoord · 5</text><text x="68" y="1158" class="body">Wie zo handelt, zal niet wankelen.</text><text x="46" y="1251" class="note">De toegangsvraag wordt met levenshouding</text><text x="46" y="1287" class="note">beantwoord. Spreken, trouw en geldgebruik horen</text><text x="46" y="1323" class="note">in hetzelfde antwoord bijeen.</text></svg>