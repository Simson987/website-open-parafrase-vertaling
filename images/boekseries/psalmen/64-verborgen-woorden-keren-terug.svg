<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Verborgen woorden keren terug</title><desc id="desc">De beweging van verborgen overleg via omkering naar publieke erkenning.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verborgen woorden keren terug</text><text x="44" y="113" class="ref">Psalm 64:2–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gebed · 2–3</text><text x="68" y="241" class="body">Bewaar mij voor de dreiging en het</text><text x="68" y="284" class="body">verborgen overleg.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hun taal · 4–7</text><text x="68" y="433" class="body">Tong als zwaard, woord als pijl,</text><text x="68" y="476" class="body">verborgen vallen en de vraag wie het</text><text x="68" y="519" class="body">ziet.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Omkering · 8–9</text><text x="68" y="668" class="body">De pijl en de eigen tong keren tegen</text><text x="68" y="711" class="body">hen terug.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Openlijke reactie · 10–11</text><text x="68" y="860" class="body">Mensen vertellen Gods werk;</text><text x="68" y="903" class="body">rechtvaardigen schuilen en juichen.</text><text x="46" y="996" class="note">Scherpe wapens verbeelden bittere taal. De</text><text x="46" y="1032" class="note">omslag gaat van heimelijk beraamd kwaad naar</text><text x="46" y="1068" class="note">zichtbaar geworden gevolgen en uitgesproken</text><text x="46" y="1104" class="note">vreugde.</text></svg>