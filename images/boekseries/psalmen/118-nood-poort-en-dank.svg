<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Nood, poort en dank</title><desc id="desc">De samenhang van persoonlijke hulp, binnenkomen en gemeenschappelijke dank.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nood, poort en dank</text><text x="44" y="113" class="ref">Psalm 118:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Refrein · 1–4</text><text x="68" y="241" class="body">Israël, huis van Aäron en wie ontzag</text><text x="68" y="284" class="body">hebben: blijvende trouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ontvangen hulp · 5–18</text><text x="68" y="433" class="body">Ruimte, schuilen, omringd zijn en leven</text><text x="68" y="476" class="body">om te vertellen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Binnenkomen · 19–24</text><text x="68" y="625" class="body">Poorten, dank en de afgekeurde steen</text><text x="68" y="668" class="body">als hoeksteen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Begroeten en loven · 25–29</text><text x="68" y="817" class="body">Redding vragen, zegen, licht en</text><text x="68" y="860" class="body">feestoffer; opnieuw het refrein.</text><text x="46" y="953" class="note">De beelden van nood en bouwen staan in een</text><text x="46" y="989" class="note">gezamenlijke dankbeweging. Het slot herneemt de</text><text x="46" y="1025" class="note">openingswoorden.</text></svg>