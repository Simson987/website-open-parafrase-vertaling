<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Stemmen van vertrouwen</title><desc id="desc">Aanspreekvormen en beelden van bescherming in het lied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stemmen van vertrouwen</text><text x="44" y="113" class="ref">Psalm 91:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schuilen · 1–2</text><text x="68" y="241" class="body">De schuilende mens en het ik dat zijn</text><text x="68" y="284" class="body">vertrouwen uitspreekt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aangesproken met je · 3–13</text><text x="68" y="433" class="body">Val, vleugels, nacht, weg, engelen en</text><text x="68" y="476" class="body">gevaar.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De ik-belofte · 14–16</text><text x="68" y="625" class="body">Bevrijden, antwoorden, nabij zijn in</text><text x="68" y="668" class="body">nood en redding laten zien.</text><text x="46" y="761" class="note">Schuilplaats, vleugels, schild en weg geven</text><text x="46" y="797" class="note">woorden aan vertrouwen. De verschillende</text><text x="46" y="833" class="note">aanspreekvormen helpen de beweging van het lied</text><text x="46" y="869" class="note">volgen.</text></svg>