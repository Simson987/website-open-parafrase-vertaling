<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Puin, herinnering en verbond</title><desc id="desc">Het contrast tussen huidige verwoesting, herinnerde macht en verbondsberoep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Puin, herinnering en verbond</text><text x="44" y="113" class="ref">Psalm 74:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verwoesting · 1–11</text><text x="68" y="241" class="body">Heiligdom, snijwerk en</text><text x="68" y="284" class="body">samenkomstplaatsen vernield; de vraag</text><text x="68" y="327" class="body">hoelang blijft open.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Toch Koning · 12–17</text><text x="68" y="476" class="body">Herinnerde macht over zee en monsters;</text><text x="68" y="519" class="body">bron, dag, nacht en seizoenen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Beroep · 18–23</text><text x="68" y="668" class="body">Denk aan naam, armen en verbond; voer</text><text x="68" y="711" class="body">Uw zaak.</text><text x="46" y="804" class="note">De kwetsbare duif verbeeldt het bedreigde volk.</text><text x="46" y="840" class="note">De scheppingsherinnering staat midden in de nog</text><text x="46" y="876" class="note">onbeantwoorde klacht over de ruïnes.</text></svg>