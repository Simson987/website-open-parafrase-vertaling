<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Dorst, verzadiging en nacht</title><desc id="desc">De contrasten dorst en verzadiging, dag en nacht, bedreiging en vreugde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dorst, verzadiging en nacht</text><text x="44" y="113" class="ref">Psalm 63:1–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Situering en verlangen · 1–3</text><text x="68" y="241" class="body">David in de woestijn van Juda; dorst</text><text x="68" y="284" class="body">naar God en herinnering aan het</text><text x="68" y="327" class="body">heiligdom.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Lof en verzadiging · 4–6</text><text x="68" y="476" class="body">Trouw beter dan leven; handen en</text><text x="68" y="519" class="body">lippen, een rijke maaltijd als</text><text x="68" y="562" class="body">vergelijking.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Nacht en hulp · 7–9</text><text x="68" y="711" class="body">Nadenken op bed en vreugde onder de</text><text x="68" y="754" class="body">vleugels.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Slot · 10–12</text><text x="68" y="903" class="body">Ondergang van belagers tegenover de</text><text x="68" y="946" class="body">vreugde van de koning.</text><text x="46" y="1039" class="note">Het dorre land draagt het beeld van verlangen.</text><text x="46" y="1075" class="note">De maaltijd verbeeldt innerlijke verzadiging; de</text><text x="46" y="1111" class="note">nacht is tijd van herinnering en vertrouwen.</text></svg>