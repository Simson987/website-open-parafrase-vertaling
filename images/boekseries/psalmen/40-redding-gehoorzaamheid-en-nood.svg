<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Redding, gehoorzaamheid en nood</title><desc id="desc">Het verband van ontvangen redding, gehoorzaamheid, getuigenis en hernieuwd smeken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Redding, gehoorzaamheid en nood</text><text x="44" y="113" class="ref">Psalm 40:2–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ervaren redding · 2–6</text><text x="68" y="241" class="body">Wachten, gehoord worden, van put naar</text><text x="68" y="284" class="body">rots en een nieuw lied.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Antwoord · 7–11</text><text x="68" y="433" class="body">Geopende oren, de boekrol, graag Gods</text><text x="68" y="476" class="body">wil doen en openlijk vertellen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nieuwe nood · 12–16</text><text x="68" y="625" class="body">Rampen, schuld en vijanden; opnieuw de</text><text x="68" y="668" class="body">vraag om snelle hulp.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Slot · 17–18</text><text x="68" y="817" class="body">Lof voor allen die zoeken, en de arme</text><text x="68" y="860" class="body">bidder vraagt om bevrijding.</text><text x="46" y="953" class="note">Het dankgedeelte gaat over in een nieuwe</text><text x="46" y="989" class="note">hulpvraag. De veilige rots maakt het latere</text><text x="46" y="1025" class="note">roepen in nood niet overbodig.</text></svg>