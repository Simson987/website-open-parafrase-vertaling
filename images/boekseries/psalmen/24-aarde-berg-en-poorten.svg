<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Aarde, berg en poorten</title><desc id="desc">Drie gedeelten en de herhaalde dialoog bij de poorten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aarde, berg en poorten</text><text x="44" y="113" class="ref">Psalm 24:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Van wie? · 1–2</text><text x="68" y="241" class="body">De aarde en haar bewoners behoren aan</text><text x="68" y="284" class="body">de HEERE.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wie mag? · 3–6</text><text x="68" y="433" class="body">Reine handen, zuiver hart en</text><text x="68" y="476" class="body">eerlijkheid beantwoorden de vraag naar</text><text x="68" y="519" class="body">de heilige plaats.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Oproep · 7 en 9</text><text x="68" y="668" class="body">Poorten en oude deuren moeten opengaan.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vraag en antwoord · 8 en 10</text><text x="68" y="817" class="body">Wie is de Koning van de eer? De HEERE,</text><text x="68" y="860" class="body">machtig en de HEERE van de</text><text x="68" y="903" class="body">legermachten.</text><text x="46" y="996" class="note">De herhaalde poortoproep en het antwoord vormen</text><text x="46" y="1032" class="note">een dialoog in de psalm. De illustratie laat de</text><text x="46" y="1068" class="note">poorten zien zonder de Koning als menselijk</text><text x="46" y="1104" class="note">personage vast te leggen.</text></svg>