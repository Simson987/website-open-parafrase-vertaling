<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Twee soorten woorden</title><desc id="desc">De tegenstelling tussen vleiende menselijke taal en betrouwbare toezegging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee soorten woorden</text><text x="44" y="113" class="ref">Psalm 12:2–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Menselijke taal · 2–5</text><text x="68" y="241" class="body">Ontrouw, vleierij, dubbelhartigheid en</text><text x="68" y="284" class="body">het idee dat de tong altijd wint.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het antwoord · 6</text><text x="68" y="433" class="body">Om ellende en het kreunen van armen</text><text x="68" y="476" class="body">klinkt de toezegging van redding.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zuiverheid · 7</text><text x="68" y="625" class="body">Gods woorden worden vergeleken met</text><text x="68" y="668" class="body">zevenmaal gezuiverd zilver.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bewaring · 8–9</text><text x="68" y="817" class="body">Gebed en vertrouwen te midden van een</text><text x="68" y="860" class="body">wereld die het lage prijst.</text><text x="46" y="953" class="note">Het zilverbeeld dient de zuiverheid van de</text><text x="46" y="989" class="note">woorden. Zevenmaal is het genoemde aantal; de</text><text x="46" y="1025" class="note">psalm geeft geen stappenplan voor</text><text x="46" y="1061" class="note">metaalbewerking.</text></svg>