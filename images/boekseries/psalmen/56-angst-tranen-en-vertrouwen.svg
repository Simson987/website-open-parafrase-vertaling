<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Angst, tranen en vertrouwen</title><desc id="desc">Historische situering, dreiging en het tweemaal terugkerende vertrouwen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Angst, tranen en vertrouwen</text><text x="44" y="113" class="ref">Psalm 56:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 1</text><text x="68" y="241" class="body">De Filistijnen hebben David in Gat</text><text x="68" y="284" class="body">gegrepen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De belagers · 2–8</text><text x="68" y="433" class="body">Druk, verdraaide woorden en het</text><text x="68" y="476" class="body">bespieden van stappen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gezien verdriet · 9–10</text><text x="68" y="625" class="body">Omzwervingen tellen, tranenkruik, boek</text><text x="68" y="668" class="body">en de belijdenis: God is met mij.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Terugkerend vertrouwen · 4–5, 11–14</text><text x="68" y="817" class="body">Op God vertrouwen, Zijn woord prijzen</text><text x="68" y="860" class="body">en de beloften nakomen.</text><text x="46" y="953" class="note">Angst en vertrouwen worden herhaald naast elkaar</text><text x="46" y="989" class="note">uitgesproken. De kruik en het boek verbeelden</text><text x="46" y="1025" class="note">verdriet dat niet wordt vergeten.</text></svg>