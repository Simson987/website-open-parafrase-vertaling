<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Werk, rust en erfdeel</title><desc id="desc">De drie samenhangende delen van het pelgrimslied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Werk, rust en erfdeel</text><text x="44" y="113" class="ref">Psalm 127:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bouwen en bewaken · 1</text><text x="68" y="241" class="body">Huis en stad; eigen inspanning blijft</text><text x="68" y="284" class="body">afhankelijk.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zorg en slaap · 2</text><text x="68" y="433" class="body">Vroeg en laat werken tegenover</text><text x="68" y="476" class="body">ontvangen rust.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Kinderen · 3–5</text><text x="68" y="625" class="body">Erfdeel en beloning, vergeleken met</text><text x="68" y="668" class="body">pijlen in een gevulde koker.</text><text x="46" y="761" class="note">De pijlen zijn een vergelijking voor zonen; het</text><text x="46" y="797" class="note">lied vertelt hier geen aanval door kinderen.</text><text x="46" y="833" class="note">Huis, stad en gezin verbinden zorg met ontvangen</text><text x="46" y="869" class="note">gave.</text></svg>