<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1233" viewBox="0 0 840 1233" role="img" aria-labelledby="title desc"><title id="title">Het terugkerende refrein</title><desc id="desc">Vijf gedeelten met het door alle verzen herhaalde antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1233" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het terugkerende refrein</text><text x="44" y="113" class="ref">Psalm 136:1–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lof · 1–4</text><text x="68" y="241" class="body">Goedheid, God boven goden en grote</text><text x="68" y="284" class="body">wonderen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Schepping · 5–9</text><text x="68" y="433" class="body">Hemel, aarde, zon, maan en sterren.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bevrijding · 10–16</text><text x="68" y="582" class="body">Egypte, uittocht, Schelfzee en</text><text x="68" y="625" class="body">woestijn.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Erfdeel · 17–22</text><text x="68" y="774" class="body">Sihon en Og; land voor Israël.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Dichtbij · 23–26</text><text x="68" y="923" class="body">Onze vernedering, bevrijding, voedsel</text><text x="68" y="966" class="body">voor al het levende en slotlof.</text><text x="46" y="1059" class="note">Alle 26 verzen antwoorden met hetzelfde refrein:</text><text x="46" y="1095" class="note">Zijn trouw duurt voor altijd. De herinnering</text><text x="46" y="1131" class="note">beweegt van schepping naar bevrijding en</text><text x="46" y="1167" class="note">dagelijks voedsel.</text></svg>