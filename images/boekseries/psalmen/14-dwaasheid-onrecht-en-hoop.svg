<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Dwaasheid, onrecht en hoop</title><desc id="desc">De overgang van geciteerde ontkenning naar oordeel, sociale nood en reddingshoop.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dwaasheid, onrecht en hoop</text><text x="44" y="113" class="ref">Psalm 14:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een geciteerde stem · 1</text><text x="68" y="241" class="body">De dwaas zegt in zijn hart: er is geen</text><text x="68" y="284" class="body">God.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De toets · 2–3</text><text x="68" y="433" class="body">Zoeken naar verstand en goeddoen; het</text><text x="68" y="476" class="body">oordeel is breed.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Machtsmisbruik · 4–6</text><text x="68" y="625" class="body">Het volk opeten als brood en de arme</text><text x="68" y="668" class="body">bespotten staan tegenover toevlucht.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Slotverlangen · 7</text><text x="68" y="817" class="body">Redding uit Sion en vreugde voor Jakob</text><text x="68" y="860" class="body">en Israël.</text><text x="46" y="953" class="note">Het eten van mensen is de vergelijking voor</text><text x="46" y="989" class="note">uitbuiting. Jakob en Israël benoemen in het slot</text><text x="46" y="1025" class="note">het volk waarop de reddingshoop gericht is.</text></svg>