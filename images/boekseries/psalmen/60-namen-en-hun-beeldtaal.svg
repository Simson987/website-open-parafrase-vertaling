<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1445" viewBox="0 0 840 1445" role="img" aria-labelledby="title desc"><title id="title">Namen en hun beeldtaal</title><desc id="desc">Exacte plaatsnaam-beeldrelaties in de plaatselijke tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1445" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Namen en hun beeldtaal</text><text x="44" y="113" class="ref">Psalm 60:8–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sichem en Sukkot · 8</text><text x="68" y="241" class="body">Sichem verdelen; het dal van Sukkot</text><text x="68" y="284" class="body">opmeten.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gilead en Manasse · 9</text><text x="68" y="433" class="body">Beide worden mijn genoemd.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Efraïm · 9</text><text x="68" y="582" class="body">De helm op het hoofd.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Juda · 9</text><text x="68" y="731" class="body">De scepter.</text><rect x="42" y="789" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Moab · 10</text><text x="68" y="880" class="body">De waskom.</text><rect x="42" y="938" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="981" class="label">Edom · 10</text><text x="68" y="1029" class="body">Daarop wordt de sandaal geworpen.</text><rect x="42" y="1087" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1130" class="label">Filistea · 10</text><text x="68" y="1178" class="body">Daarover klinkt gejuich.</text><text x="46" y="1271" class="note">Dit is een overzicht van de namen en de hun</text><text x="46" y="1307" class="note">gegeven beelden. De relaties komen uit deze drie</text><text x="46" y="1343" class="note">verzen; de tekening geeft geen extra</text><text x="46" y="1379" class="note">landsgrenzen of reisroute.</text></svg>