<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Gemaakt en vertrouwen</title><desc id="desc">De exacte zintuigen en lichaamsdelen en de drie aangesproken groepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gemaakt en vertrouwen</text><text x="44" y="113" class="ref">Psalm 115:4–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mensenwerk · 4–8</text><text x="68" y="241" class="body">Mond, ogen, oren, neus, handen, voeten</text><text x="68" y="284" class="body">en keel zonder vermogen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Drie oproepen · 9–11</text><text x="68" y="433" class="body">Israël, huis van Aäron en wie ontzag</text><text x="68" y="476" class="body">hebben: vertrouw; hulp en schild.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zegen · 12–15</text><text x="68" y="625" class="body">Dezelfde groepen, klein en groot, met</text><text x="68" y="668" class="body">hun kinderen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ons antwoord · 16–18</text><text x="68" y="817" class="body">Hemel en aarde, de stilte van de doden</text><text x="68" y="860" class="body">en de lof van het wij.</text><text x="46" y="953" class="note">De opsomming over de afgoden contrasteert</text><text x="46" y="989" class="note">gemaakte vormen met werkelijk vermogen. De</text><text x="46" y="1025" class="note">herhaling verbindt vertrouwen met ontvangen</text><text x="46" y="1061" class="note">zegen.</text></svg>