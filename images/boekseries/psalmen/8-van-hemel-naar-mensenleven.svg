<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Van hemel naar mensenleven</title><desc id="desc">De omlijsting van de psalm en het verband tussen verwondering, menselijke eer en dierenwereld.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van hemel naar mensenleven</text><text x="44" y="113" class="ref">Psalm 8:2–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Omlijsting · 2 en 10</text><text x="68" y="241" class="body">Dezelfde lof op Gods naam omringt de</text><text x="68" y="284" class="body">psalm.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Klein en groot · 3–5</text><text x="68" y="433" class="body">Kinderstemmen, maan en sterren roepen</text><text x="68" y="476" class="body">de vraag naar de mens op.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Eer en taak · 6–7</text><text x="68" y="625" class="body">De mens ontvangt eer en een plaats</text><text x="68" y="668" class="body">binnen de schepping.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Drie leefgebieden · 8–9</text><text x="68" y="817" class="body">Dieren van veld, vogels van de hemel en</text><text x="68" y="860" class="body">vissen van de zee.</text><text x="46" y="953" class="note">De scheppingsbeelden zijn poëtische lof en</text><text x="46" y="989" class="note">verwondering. Het schema ordent de genoemde</text><text x="46" y="1025" class="note">gebieden zonder een nieuwe historische scène aan</text><text x="46" y="1061" class="note">de psalm toe te voegen.</text></svg>