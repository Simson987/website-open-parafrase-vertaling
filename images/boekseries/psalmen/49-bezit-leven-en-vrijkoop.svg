<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Bezit, leven en vrijkoop</title><desc id="desc">Redenering van universeel gehoor via onbetaalbaar leven naar bevrijding van vrees voor rijkdom.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bezit, leven en vrijkoop</text><text x="44" y="113" class="ref">Psalm 49:2–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Iedereen hoort · 2–5</text><text x="68" y="241" class="body">Gewoon en aanzienlijk, rijk en arm; de</text><text x="68" y="284" class="body">spreker brengt wijsheid.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bezit schiet tekort · 6–14</text><text x="68" y="433" class="body">Rijkdom kan de losprijs van een leven</text><text x="68" y="476" class="body">niet betalen. Ook wijze en dwaze mensen</text><text x="68" y="519" class="body">sterven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het tegenwoord · 15–16</text><text x="68" y="668" class="body">De dood als herder tegenover de</text><text x="68" y="711" class="body">belijdenis dat God het leven vrijkoopt.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Daarom · 17–21</text><text x="68" y="860" class="body">Wees niet bang voor toenemende pracht:</text><text x="68" y="903" class="body">zij wordt niet meegenomen in de dood.</text><text x="46" y="996" class="note">Dit wijsheidslied onderzoekt wat bezit vermag.</text><text x="46" y="1032" class="note">De herhaling van pracht en vergankelijkheid zet</text><text x="46" y="1068" class="note">de grens van rijkdom naast hoop op God.</text></svg>