<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Hemel, aarde en mensen</title><desc id="desc">De verbreding van de lofoproep door de opsommingen heen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hemel, aarde en mensen</text><text x="44" y="113" class="ref">Psalm 148:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vanuit de hemel · 1–6</text><text x="68" y="241" class="body">Engelen, lichten en wateren; geschapen</text><text x="68" y="284" class="body">op bevel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vanaf de aarde · 7–10</text><text x="68" y="433" class="body">Diepten, weer, bergen, bomen, dieren en</text><text x="68" y="476" class="body">vogels.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Alle mensen · 11–12</text><text x="68" y="625" class="body">Koningen, volken en rechters; jong en</text><text x="68" y="668" class="body">oud.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn naam · 13–14</text><text x="68" y="817" class="body">Boven aarde en hemel; het volk dat</text><text x="68" y="860" class="body">dicht bij Hem is.</text><text x="46" y="953" class="note">De oproep omvat de hele genoemde schepping. De</text><text x="46" y="989" class="note">opsomming is een uitnodiging tot lof en geen</text><text x="46" y="1025" class="note">inventaris met niet gegeven aantallen.</text></svg>