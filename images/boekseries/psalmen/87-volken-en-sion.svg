<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Volken en Sion</title><desc id="desc">De namen en herhaalde geboorteformule, zonder een verzonnen burgerregister of familiebanden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volken en Sion</text><text x="44" y="113" class="ref">Psalm 87:4–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Genoemd · 4</text><text x="68" y="241" class="body">Rahab en Babel; Filistea en Tyrus, met</text><text x="68" y="284" class="body">Nubië.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sion · 5</text><text x="68" y="433" class="body">Deze en die is daar geboren; de</text><text x="68" y="476" class="body">Allerhoogste houdt haar staande.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Meegeteld · 6</text><text x="68" y="625" class="body">Bij het opschrijven van volken klinkt</text><text x="68" y="668" class="body">opnieuw: deze is daar geboren.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het lied · 7</text><text x="68" y="817" class="body">Zangers en dansers: al mijn bronnen</text><text x="68" y="860" class="body">zijn in u.</text><text x="46" y="953" class="note">Geboorte, meegeteld worden en bronnen verbinden</text><text x="46" y="989" class="note">de volken met Sion. Rahab blijft hier de naam</text><text x="46" y="1025" class="note">zoals die in het vers staat.</text></svg>