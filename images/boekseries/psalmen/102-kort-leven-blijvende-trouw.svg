<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Kort leven, blijvende trouw</title><desc id="desc">De beweging van persoonlijke nood naar Sion en blijvende jaren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kort leven, blijvende trouw</text><text x="44" y="113" class="ref">Psalm 102:4–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mijn dagen · 4–12</text><text x="68" y="241" class="body">Rook, verdord gras, eenzame vogels en</text><text x="68" y="284" class="body">een lange schaduw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sion · 13–23</text><text x="68" y="433" class="body">Puin, herbouw, gehoord gebed,</text><text x="68" y="476" class="body">gevangenen en samengekomen volken.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Mijn God · 24–29</text><text x="68" y="625" class="body">Een verkort leven tegenover Uw</text><text x="68" y="668" class="body">blijvende jaren; kinderen en</text><text x="68" y="711" class="body">nageslacht.</text><text x="46" y="804" class="note">De klacht wisselt van het ik naar de stad en</text><text x="46" y="840" class="note">weer terug. Het kledingstuk verbeeldt de</text><text x="46" y="876" class="note">vergankelijkheid van hemel en aarde.</text></svg>