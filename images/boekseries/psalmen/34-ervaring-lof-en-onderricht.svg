<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Ervaring, lof en onderricht</title><desc id="desc">De beweging van het opschrift via lof naar ethisch onderricht en bemoediging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ervaring, lof en onderricht</text><text x="44" y="113" class="ref">Psalm 34:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opschrift · 1</text><text x="68" y="241" class="body">David wordt bij Abimelech weggestuurd</text><text x="68" y="284" class="body">en kan vertrekken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Samen loven · 2–11</text><text x="68" y="433" class="body">Zoeken, antwoord, redding en proeven</text><text x="68" y="476" class="body">van goedheid.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Leren · 12–15</text><text x="68" y="625" class="body">Luisteren, eerlijk spreken, goed doen</text><text x="68" y="668" class="body">en vrede najagen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nabijheid · 16–23</text><text x="68" y="817" class="body">Gehoord geroep, gebroken harten,</text><text x="68" y="860" class="body">tegenslag en vrijgekocht leven.</text><text x="46" y="953" class="note">De herinnering aan redding leidt naar lof en</text><text x="46" y="989" class="note">vervolgens naar onderricht. Het hoofdstuk</text><text x="46" y="1025" class="note">verbindt vertrouwen met concreet spreken en</text><text x="46" y="1061" class="note">handelen.</text></svg>