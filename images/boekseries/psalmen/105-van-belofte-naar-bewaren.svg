<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Van belofte naar bewaren</title><desc id="desc">Verband tussen verbond, Jozef, bevrijding en het slotdoel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van belofte naar bewaren</text><text x="44" y="113" class="ref">Psalm 105:8–45</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Belofte · 8–15</text><text x="68" y="241" class="body">Abraham, Izak, Jakob; Kanaän en</text><text x="68" y="284" class="body">bescherming.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jozef · 16–22</text><text x="68" y="433" class="body">Hongersnood, gevangenschap, vrijlating</text><text x="68" y="476" class="body">en beheer.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Egypte · 23–38</text><text x="68" y="625" class="body">Groei, verdrukking, Mozes en Aäron,</text><text x="68" y="668" class="body">tekenen en vertrek.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Woestijn en land · 39–45</text><text x="68" y="817" class="body">Wolk, vuur, voedsel en water; ontvangen</text><text x="68" y="860" class="body">land om de voorschriften te bewaren.</text><text x="46" y="953" class="note">Het doel van het herinneren staat in het slot:</text><text x="46" y="989" class="note">de voorschriften houden en de wetten bewaren. De</text><text x="46" y="1025" class="note">plagen staan in de volgorde van deze psalm.</text></svg>