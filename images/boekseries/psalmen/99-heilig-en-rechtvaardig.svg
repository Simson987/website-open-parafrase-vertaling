<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1233" viewBox="0 0 840 1233" role="img" aria-labelledby="title desc"><title id="title">Heilig en rechtvaardig</title><desc id="desc">Heiligheidsrefreinen en de genoemde personen in het lied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1233" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Heilig en rechtvaardig</text><text x="44" y="113" class="ref">Psalm 99:1–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Heilig is Hij · 3</text><text x="68" y="241" class="body">De grote naam prijzen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Recht · 4</text><text x="68" y="390" class="body">Een Koning die van recht houdt:</text><text x="68" y="433" class="body">eerlijkheid en gerechtigheid.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Heilig is Hij · 5</text><text x="68" y="582" class="body">Verheffen en buigen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Antwoord · 6–8</text><text x="68" y="731" class="body">Mozes, Aäron en Samuël; roepen,</text><text x="68" y="774" class="body">antwoord, regels en vergeving.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Heilig · 9</text><text x="68" y="923" class="body">Verheffen en buigen voor de heilige</text><text x="68" y="966" class="body">berg.</text><text x="46" y="1059" class="note">De herhaalde heiligheidswoorden verbinden lof</text><text x="46" y="1095" class="note">met recht, gehoorzaamheid en vergeving. De drie</text><text x="46" y="1131" class="note">genoemde personen worden hier herinnerd, niet</text><text x="46" y="1167" class="note">als één ontmoeting geschilderd.</text></svg>