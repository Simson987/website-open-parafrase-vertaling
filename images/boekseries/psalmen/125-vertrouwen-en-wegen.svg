<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Vertrouwen en wegen</title><desc id="desc">De relatie tussen omringende bergen, levensweg en vrede.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vertrouwen en wegen</text><text x="44" y="113" class="ref">Psalm 125:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vergelijking · 1–2</text><text x="68" y="241" class="body">Standvastig als Sion; omringd zoals de</text><text x="68" y="284" class="body">stad door bergen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onrecht · 3</text><text x="68" y="433" class="body">De scepter van goddeloosheid en de</text><text x="68" y="476" class="body">handen van rechtvaardigen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bede · 4</text><text x="68" y="625" class="body">Goed doen aan de goeden en oprechten.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Slot · 5</text><text x="68" y="774" class="body">Kromme wegen tegenover vrede over</text><text x="68" y="817" class="body">Israël.</text><text x="46" y="910" class="note">De bergen vormen het ruimtelijke beeld voor</text><text x="46" y="946" class="note">bewaring. De psalm verbindt vertrouwen met recht</text><text x="46" y="982" class="note">doen en oprechtheid.</text></svg>