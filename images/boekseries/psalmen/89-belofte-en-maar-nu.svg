<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc"><title id="title">Belofte en maar nu</title><desc id="desc">Samenhang van de lange koningspsalm met de omslag bij vers 39.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1319" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Belofte en maar nu</text><text x="44" y="113" class="ref">Psalm 89:4–53</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verbond · 4–5</text><text x="68" y="241" class="body">David, nageslacht en een blijvende</text><text x="68" y="284" class="body">troon.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Lof · 6–19</text><text x="68" y="433" class="body">Onvergelijkelijke macht en een troon</text><text x="68" y="476" class="body">gedragen door recht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Belofte · 20–38</text><text x="68" y="625" class="body">Zalving, trouw en verbond; zon en maan</text><text x="68" y="668" class="body">als vergelijkingen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Maar nu · 39–46</text><text x="68" y="817" class="body">Afwijzing, kroon in het stof,</text><text x="68" y="860" class="body">doorbroken muren en neergehaalde troon.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Hoe lang · 47–53</text><text x="68" y="1009" class="body">Een kort mensenleven, de vraag naar</text><text x="68" y="1052" class="body">vroegere trouw en de slotlof.</text><text x="46" y="1145" class="note">Het contrast tussen de uitgesproken belofte en</text><text x="46" y="1181" class="note">de ervaren afwijzing vormt de kern van de</text><text x="46" y="1217" class="note">klacht. De slotlof wist de gestelde vragen niet</text><text x="46" y="1253" class="note">uit.</text></svg>