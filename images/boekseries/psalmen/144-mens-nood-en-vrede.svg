<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Mens, nood en vrede</title><desc id="desc">Het verband van vergankelijkheid, hulpvraag en de verlangde volksvrede.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mens, nood en vrede</text><text x="44" y="113" class="ref">Psalm 144:3–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mens · 3–4</text><text x="68" y="241" class="body">Gekend worden en vergankelijk zijn als</text><text x="68" y="284" class="body">adem en schaduw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hulp · 5–8</text><text x="68" y="433" class="body">Hemel, bergen, bliksem en groot water;</text><text x="68" y="476" class="body">redding van bedrog.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nieuw lied · 9–11</text><text x="68" y="625" class="body">Luit, bevrijding en de herhaalde</text><text x="68" y="668" class="body">hulpvraag.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Verlangen · 12–15</text><text x="68" y="817" class="body">Jongeren, volle schuren, kudden en</text><text x="68" y="860" class="body">straten zonder geschreeuw.</text><text x="46" y="953" class="note">Het slot tekent verlangde voorspoed en vrede in</text><text x="46" y="989" class="note">het leven van het volk. Planten en hoekzuilen</text><text x="46" y="1025" class="note">zijn vergelijkingen voor zonen en dochters.</text></svg>