<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Herstel, voedsel en woord</title><desc id="desc">De relatie van stadsherstel, natuurzorg en het gegeven woord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herstel, voedsel en woord</text><text x="44" y="113" class="ref">Psalm 147:2–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herstel · 2–6</text><text x="68" y="241" class="body">Bijeenbrengen, genezen, sterren tellen</text><text x="68" y="284" class="body">en zachtmoedigen steunen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Voedsel · 7–11</text><text x="68" y="433" class="body">Regen, gras, vee en raven; hoop boven</text><text x="68" y="476" class="body">spierkracht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Stad · 12–14</text><text x="68" y="625" class="body">Sterke poorten, gezegende kinderen,</text><text x="68" y="668" class="body">vrede en tarwe.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Woord · 15–20</text><text x="68" y="817" class="body">Sneeuw, rijp, ijs en dooi;</text><text x="68" y="860" class="body">voorschriften voor Jakob en Israël.</text><text x="46" y="953" class="note">Het snelle woord verbindt de natuurbeelden met</text><text x="46" y="989" class="note">het bekendmaken van regels. De sterren en het</text><text x="46" y="1025" class="note">gebroken hart staan in dezelfde lofbeweging.</text></svg>