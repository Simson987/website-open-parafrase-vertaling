<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1362" viewBox="0 0 840 1362" role="img" aria-labelledby="title desc"><title id="title">Leren en leven</title><desc id="desc">Vijf leesvensters op de lange gebedspsalm met gecontroleerde versgrenzen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1362" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leren en leven</text><text x="44" y="113" class="ref">Psalm 119:9–176</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zoeken en leren · 9–40</text><text x="68" y="241" class="body">Een zuiver pad, open ogen, inzicht en</text><text x="68" y="284" class="body">de bede om leven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Spreken en hopen · 41–88</text><text x="68" y="433" class="body">Voor koningen, in het</text><text x="68" y="476" class="body">vreemdelingenhuis, in de nacht en in</text><text x="68" y="519" class="body">verdrukking.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Liefhebben en bewaren · 89–128</text><text x="68" y="668" class="body">Vast woord, groter inzicht, zoete</text><text x="68" y="711" class="body">woorden, lamp en erfdeel.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Licht en nabijheid · 129–160</text><text x="68" y="860" class="body">Inzicht, vaste stappen, tranen, recht</text><text x="68" y="903" class="body">en nachtelijk roepen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Loven en gezocht worden · 161–176</text><text x="68" y="1052" class="body">Vrede, veelvuldige lof en de dienaar</text><text x="68" y="1095" class="body">als verloren schaap.</text><text x="46" y="1188" class="note">Dit zijn leesvensters op terugkerende motieven.</text><text x="46" y="1224" class="note">De bidder spreekt over liefde tot het woord en</text><text x="46" y="1260" class="note">blijft tegelijk om inzicht, redding en zoeken</text><text x="46" y="1296" class="note">vragen.</text></svg>