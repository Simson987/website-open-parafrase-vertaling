<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Keuze, daden en lof</title><desc id="desc">Exacte namen, herinnerde daden en de groepen in de slotoproep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Keuze, daden en lof</text><text x="44" y="113" class="ref">Psalm 135:4–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Keuze en macht · 4–7</text><text x="68" y="241" class="body">Jakob en Israël; hemel, aarde, zee en</text><text x="68" y="284" class="body">weer.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Herinnering · 8–12</text><text x="68" y="433" class="body">Egypte en Farao; Sihon, koning van de</text><text x="68" y="476" class="body">Amorieten, en Og, koning van Basan;</text><text x="68" y="519" class="body">Kanaän als erfdeel.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Naam en medelijden · 13–14</text><text x="68" y="668" class="body">Blijvende naam, recht en ontferming.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Mensenwerk · 15–18</text><text x="68" y="817" class="body">Stomme afgoden zonder adem tegenover de</text><text x="68" y="860" class="body">levende macht.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Oproep · 19–21</text><text x="68" y="1009" class="body">Israël, Aäron, Levi en wie ontzag</text><text x="68" y="1052" class="body">hebben: prijs uit Sion.</text><text x="46" y="1145" class="note">De persoons- en groepsnamen zijn die van de</text><text x="46" y="1181" class="note">psalm. Hun plaats in het lied verbindt ontvangen</text><text x="46" y="1217" class="note">erfdeel en hulp met de oproep tot lof.</text></svg>