<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1057" viewBox="0 0 840 1057" role="img" aria-labelledby="title desc"><title id="title">Openen, zoeken en beschrijven</title><desc id="desc">Versgroepen en beeldvelden van het liefdeslied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1057" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Openen, zoeken en beschrijven</text><text x="44" y="113" class="ref">Hooglied 5:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tuin · 1</text><text x="68" y="241" class="body">Specerijen, honing, wijn en melk; een</text><text x="68" y="284" class="body">oproep te genieten.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nachtelijke passage · 2–8</text><text x="68" y="433" class="body">Slapen en wakker hart; kloppen, openen,</text><text x="68" y="476" class="body">vertrek, zoeken en geweld door</text><text x="68" y="519" class="body">wachters.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vraag en antwoord · 9–16</text><text x="68" y="668" class="body">Wat maakt hem bijzonder? Een portret in</text><text x="68" y="711" class="body">kostbare stoffen, planten en</text><text x="68" y="754" class="body">landschapsbeelden.</text><text x="46" y="847" class="note">Leeswijzer bij liefdespoëzie. Vergelijkingen</text><text x="46" y="883" class="note">zijn geen letterlijke veranderingen van</text><text x="46" y="919" class="note">lichamen. De wisselende stemmen en beelden</text><text x="46" y="955" class="note">worden niet tot één bewezen historische scène</text><text x="46" y="991" class="note">samengevoegd.</text></svg>