<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1206" viewBox="0 0 840 1206" role="img" aria-labelledby="title desc"><title id="title">Sterk en niet te koop</title><desc id="desc">Versgroepen en beeldvelden van het liefdeslied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1206" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sterk en niet te koop</text><text x="44" y="113" class="ref">Hooglied 8:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verlangen en refrein · 1–4</text><text x="68" y="241" class="body">Nabijheid zonder verachting, moederhuis</text><text x="68" y="284" class="body">en het eigen moment van de liefde.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kracht · 5–7</text><text x="68" y="433" class="body">Samen omhoog; zegel, dood, vuur en</text><text x="68" y="476" class="body">water; liefde is niet met bezit te</text><text x="68" y="519" class="body">kopen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Eigen stem · 8–12</text><text x="68" y="668" class="body">Zusje, muur en deur; eigen wijngaard</text><text x="68" y="711" class="body">naast de wijngaard van Salomo.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Slot · 13–14</text><text x="68" y="860" class="body">Laat je stem horen; kom als een gazelle</text><text x="68" y="903" class="body">op de bergen vol specerijen.</text><text x="46" y="996" class="note">Leeswijzer bij liefdespoëzie. Vergelijkingen</text><text x="46" y="1032" class="note">zijn geen letterlijke veranderingen van</text><text x="46" y="1068" class="note">lichamen. De wisselende stemmen en beelden</text><text x="46" y="1104" class="note">worden niet tot één bewezen historische scène</text><text x="46" y="1140" class="note">samengevoegd.</text></svg>