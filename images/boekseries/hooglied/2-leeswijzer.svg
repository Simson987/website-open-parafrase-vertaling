<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1163" viewBox="0 0 840 1163" role="img" aria-labelledby="title desc"><title id="title">Lente en het eigen moment</title><desc id="desc">Versgroepen en beeldvelden van het liefdeslied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1163" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lente en het eigen moment</text><text x="44" y="113" class="ref">Hooglied 2:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vergelijking · 1–6</text><text x="68" y="241" class="body">Lelie en appelboom; schaduw, vruchten</text><text x="68" y="284" class="body">en omhelzing.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Refrein · 7</text><text x="68" y="433" class="body">Maak de liefde niet wakker voordat zij</text><text x="68" y="476" class="body">het zelf wil.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Uitnodiging · 8–14</text><text x="68" y="625" class="body">Gazelle, venster, voorbijgaande winter,</text><text x="68" y="668" class="body">bloemen, vijgen en duif.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wijngaard en verbondenheid · 15–17</text><text x="68" y="817" class="body">Kleine vossen; ik ben van hem en hij</text><text x="68" y="860" class="body">van mij; keer terug.</text><text x="46" y="953" class="note">Leeswijzer bij liefdespoëzie. Vergelijkingen</text><text x="46" y="989" class="note">zijn geen letterlijke veranderingen van</text><text x="46" y="1025" class="note">lichamen. De wisselende stemmen en beelden</text><text x="46" y="1061" class="note">worden niet tot één bewezen historische scène</text><text x="46" y="1097" class="note">samengevoegd.</text></svg>