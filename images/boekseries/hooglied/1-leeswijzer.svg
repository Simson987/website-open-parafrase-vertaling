<svg xmlns="http://www.w3.org/2000/svg" width="840" height="971" viewBox="0 0 840 971" role="img" aria-labelledby="title desc"><title id="title">Verlangen, kudde en geuren</title><desc id="desc">Versgroepen en beeldvelden van het liefdeslied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="971" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verlangen, kudde en geuren</text><text x="44" y="113" class="ref">Hooglied 1:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verlangen · 1–4</text><text x="68" y="241" class="body">Liefde boven wijn; naam als geurige</text><text x="68" y="284" class="body">olie.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zelf spreken · 5–8</text><text x="68" y="433" class="body">Donker en mooi; de wijngaard en de</text><text x="68" y="476" class="body">vraag naar de kudde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vergelijkingen · 9–17</text><text x="68" y="625" class="body">Merrie, sieraden, nardus, mirre,</text><text x="68" y="668" class="body">hennabloemen en duiven.</text><text x="46" y="761" class="note">Leeswijzer bij liefdespoëzie. Vergelijkingen</text><text x="46" y="797" class="note">zijn geen letterlijke veranderingen van</text><text x="46" y="833" class="note">lichamen. De wisselende stemmen en beelden</text><text x="46" y="869" class="note">worden niet tot één bewezen historische scène</text><text x="46" y="905" class="note">samengevoegd.</text></svg>