<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1206" viewBox="0 0 840 1206" role="img" aria-labelledby="title desc"><title id="title">Zoeken en een draagkoets</title><desc id="desc">Versgroepen en beeldvelden van het liefdeslied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1206" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zoeken en een draagkoets</text><text x="44" y="113" class="ref">Hooglied 3:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nachtelijk zoeken · 1–4</text><text x="68" y="241" class="body">Bed, straten, wachters, vinden en het</text><text x="68" y="284" class="body">huis van haar moeder.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Refrein · 5</text><text x="68" y="433" class="body">Maak de liefde niet wakker voordat zij</text><text x="68" y="476" class="body">het zelf wil.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Draagkoets · 6–10</text><text x="68" y="625" class="body">Geurende stoet; zestig helden;</text><text x="68" y="668" class="body">Libanonhout, zilveren stijlen, gouden</text><text x="68" y="711" class="body">bodem en purperen zitting.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Oproep · 11</text><text x="68" y="860" class="body">Kijk naar de gekroonde koning op de</text><text x="68" y="903" class="body">vreugdevolle bruiloftsdag.</text><text x="46" y="996" class="note">Leeswijzer bij liefdespoëzie. Vergelijkingen</text><text x="46" y="1032" class="note">zijn geen letterlijke veranderingen van</text><text x="46" y="1068" class="note">lichamen. De wisselende stemmen en beelden</text><text x="46" y="1104" class="note">worden niet tot één bewezen historische scène</text><text x="46" y="1140" class="note">samengevoegd.</text></svg>