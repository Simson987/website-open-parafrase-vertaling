<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1014" viewBox="0 0 840 1014" role="img" aria-labelledby="title desc"><title id="title">Schoonheid in vergelijkingen</title><desc id="desc">Versgroepen en beeldvelden van het liefdeslied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1014" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schoonheid in vergelijkingen</text><text x="44" y="113" class="ref">Hooglied 4:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Portret · 1–7</text><text x="68" y="241" class="body">Duiven, geiten, schapen, scharlaken</text><text x="68" y="284" class="body">draad, granaatappel, toren en</text><text x="68" y="327" class="body">gazellenjongen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Nabijheid · 8–11</text><text x="68" y="476" class="body">Bergen, blik en halsketting; liefde,</text><text x="68" y="519" class="body">geur, honing en melk.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Tuin · 12–16</text><text x="68" y="668" class="body">Afgesloten tuin en bron; vruchten,</text><text x="68" y="711" class="body">specerijen, stromend water en wind.</text><text x="46" y="804" class="note">Leeswijzer bij liefdespoëzie. Vergelijkingen</text><text x="46" y="840" class="note">zijn geen letterlijke veranderingen van</text><text x="46" y="876" class="note">lichamen. De wisselende stemmen en beelden</text><text x="46" y="912" class="note">worden niet tot één bewezen historische scène</text><text x="46" y="948" class="note">samengevoegd.</text></svg>