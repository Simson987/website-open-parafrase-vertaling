<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Nederigheid en morgen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nederigheid en morgen</text><text x="44" y="113" class="ref">Jakobus 4:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–6 · Verlangens en ruzie</text><text x="68" y="241" class="body">Verkeerd begeren en bidden; genade voor</text><text x="68" y="284" class="body">nederigen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">7–10 · Naderen en zuiveren</text><text x="68" y="433" class="body">Onderwerping, weerstand, berouw en</text><text x="68" y="476" class="body">nederigheid.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">11–12 · Geen kwaadspreken</text><text x="68" y="625" class="body">Eén Wetgever; oordeel de ander niet.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">13–17 · Plannen en goeddoen</text><text x="68" y="774" class="body">Het leven als damp; als de Heere het</text><text x="68" y="817" class="body">wil.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>