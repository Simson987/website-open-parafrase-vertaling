<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De oproepen om terug te keren</title><desc id="desc">De oproepen om terug te keren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De oproepen om terug te keren</text><text x="44" y="113" class="ref">Jakobus 4:6–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onderwerpen en weerstaan</text><text x="68" y="241" class="body">Onderwerp je aan God; weersta de</text><text x="68" y="284" class="body">duivel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Naderen en zuiveren</text><text x="68" y="433" class="body">Nader tot God; was handen en zuiver het</text><text x="68" y="476" class="body">hart.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Treur en besef</text><text x="68" y="625" class="body">Neem de eigen toestand ernstig.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Verneder je</text><text x="68" y="774" class="body">De Heere zal verhogen.</text><text x="46" y="867" class="note">Handen wassen en hart zuiveren staan samen in de</text><text x="46" y="903" class="note">oproep tot omkeer.</text></svg>