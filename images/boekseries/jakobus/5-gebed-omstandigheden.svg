<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Gebed, zang en zorg</title><desc id="desc">Gebed, zang en zorg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, zang en zorg</text><text x="44" y="113" class="ref">Jakobus 5:13–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Moeite of vreugde</text><text x="68" y="241" class="body">Bidden of een psalm zingen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Ziekte</text><text x="68" y="390" class="body">De oudsten roepen; gebed en zalving in</text><text x="68" y="433" class="body">de Naam van de Heere.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Samen</text><text x="68" y="582" class="body">Overtredingen belijden en voor elkaar</text><text x="68" y="625" class="body">bidden.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Afgedwaald</text><text x="68" y="774" class="body">De ander terugbrengen van de dwaalweg.</text><text x="46" y="867" class="note">De oproepen verbinden het gebed met concrete</text><text x="46" y="903" class="note">zorg in de gemeenschap.</text></svg>