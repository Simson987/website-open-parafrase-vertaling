<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Hoe de kudde wordt gehoed</title><desc id="desc">Hoe de kudde wordt gehoed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoe de kudde wordt gehoed</text><text x="44" y="113" class="ref">1 Petrus 5:1–4</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet gedwongen</text><text x="68" y="241" class="body">Maar vrijwillig toezicht houden.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Niet uit winstbejag</text><text x="68" y="390" class="body">Maar van harte.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Niet overheersen</text><text x="68" y="539" class="body">Maar een voorbeeld voor de kudde zijn.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">De verwachting</text><text x="68" y="688" class="body">De Opperherder en de onverwelkelijke</text><text x="68" y="731" class="body">krans van heerlijkheid.</text><text x="46" y="824" class="note">De herderwoorden worden op de oudsten en hun</text><text x="46" y="860" class="note">omgang met de gemeente toegepast.</text></svg>