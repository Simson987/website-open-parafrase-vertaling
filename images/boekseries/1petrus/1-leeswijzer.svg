<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Levende hoop en heilig leven</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levende hoop en heilig leven</text><text x="44" y="113" class="ref">1 Petrus 1:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–9 · Erfenis en beproeving</text><text x="68" y="241" class="body">Vreemdelingen, levende hoop en de</text><text x="68" y="284" class="body">echtheid van geloof.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">10–12 · Onderzocht en verkondigd</text><text x="68" y="433" class="body">Profeten zochten de tijd; het evangelie</text><text x="68" y="476" class="body">is nu gebracht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">13–21 · Hoop en ontzag</text><text x="68" y="625" class="body">Heilig leven en vrijgekocht door</text><text x="68" y="668" class="body">Christus.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">22–25 · Liefde en het Woord</text><text x="68" y="817" class="body">Oprechte liefde; vergankelijk gras en</text><text x="68" y="860" class="body">een blijvend Woord.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>