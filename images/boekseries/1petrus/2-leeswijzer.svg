<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Stenen, vrijheid en het voorbeeld</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stenen, vrijheid en het voorbeeld</text><text x="44" y="113" class="ref">1 Petrus 2:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–10 · Groeien en gebouwd worden</text><text x="68" y="241" class="body">Melk, levende stenen, hoeksteen en Gods</text><text x="68" y="284" class="body">volk.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">11–17 · Tussen de volken</text><text x="68" y="433" class="body">Goeddoen, vrije dienst en ieder eer</text><text x="68" y="476" class="body">geven.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">18–20 · Onterecht lijden</text><text x="68" y="625" class="body">Verdragen als men goeddoet.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">21–25 · Christus volgen</text><text x="68" y="774" class="body">Geen vergelding; Hij droeg zonden en is</text><text x="68" y="817" class="body">de Herder.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>