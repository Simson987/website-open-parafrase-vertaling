<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Dienen en lijden als christen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dienen en lijden als christen</text><text x="44" y="113" class="ref">1 Petrus 4:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–6 · Een andere levenswijze</text><text x="68" y="241" class="body">Gods wil tegenover vroegere verlangens</text><text x="68" y="284" class="body">en uitspattingen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">7–11 · Waken en dienen</text><text x="68" y="433" class="body">Gebed, liefde, gastvrijheid en de</text><text x="68" y="476" class="body">ontvangen gaven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">12–19 · Verdrukking en vertrouwen</text><text x="68" y="625" class="body">Geen schaamte als christen; goeddoen en</text><text x="68" y="668" class="body">de ziel toevertrouwen.</text><text x="46" y="761" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="797" class="note">de plaatselijke versindeling.</text></svg>