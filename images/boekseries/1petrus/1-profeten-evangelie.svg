<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Van onderzoek naar verkondiging</title><desc id="desc">Van onderzoek naar verkondiging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van onderzoek naar verkondiging</text><text x="44" y="113" class="ref">1 Petrus 1:10–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De profeten</text><text x="68" y="241" class="body">Onderzochten de genade, het lijden van</text><text x="68" y="284" class="body">Christus en de heerlijkheid daarna.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hun dienst</text><text x="68" y="433" class="body">Bestemd voor de latere hoorders.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De verkondigers</text><text x="68" y="582" class="body">Brachten het evangelie door de Heilige</text><text x="68" y="625" class="body">Geest.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De engelen</text><text x="68" y="774" class="body">Verlangen erin te kijken.</text><text x="46" y="867" class="note">De tekst verbindt profetisch onderzoek met het</text><text x="46" y="903" class="note">verkondigde evangelie.</text></svg>