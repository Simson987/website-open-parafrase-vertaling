<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De steen en het geestelijke huis</title><desc id="desc">De steen en het geestelijke huis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De steen en het geestelijke huis</text><text x="44" y="113" class="ref">1 Petrus 2:4–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Christus</text><text x="68" y="241" class="body">Levende, uitgekozen en kostbare steen;</text><text x="68" y="284" class="body">hoeksteen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De gelovigen</text><text x="68" y="433" class="body">Levende stenen in een geestelijk huis</text><text x="68" y="476" class="body">en heilig priesterschap.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De roeping</text><text x="68" y="625" class="body">Gods grote daden verkondigen: uit</text><text x="68" y="668" class="body">duisternis naar licht.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De verandering</text><text x="68" y="817" class="body">Vroeger geen volk en geen ontferming;</text><text x="68" y="860" class="body">nu Gods volk met ontferming.</text><text x="46" y="953" class="note">Steen, huis en priesterschap zijn samenhangende</text><text x="46" y="989" class="note">beelden voor Christus en Zijn gemeenschap.</text></svg>