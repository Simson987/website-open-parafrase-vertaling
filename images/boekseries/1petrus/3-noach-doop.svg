<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Noach, doop en Christus</title><desc id="desc">Noach, doop en Christus met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Noach, doop en Christus</text><text x="44" y="113" class="ref">1 Petrus 3:18–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Christus · vers 18–19</text><text x="68" y="241" class="body">Eens geleden; levend gemaakt;</text><text x="68" y="284" class="body">verkondiging aan de geesten in de</text><text x="68" y="327" class="body">gevangenis.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Noach · vers 20</text><text x="68" y="476" class="body">God wachtte; in de ark werden acht</text><text x="68" y="519" class="body">mensen door water gered.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De doop · vers 21</text><text x="68" y="668" class="body">Het tegenbeeld; een vraag van goed</text><text x="68" y="711" class="body">geweten, door Jezus’ opstanding.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De hemel · vers 22</text><text x="68" y="860" class="body">Jezus aan Gods rechterhand; engelen,</text><text x="68" y="903" class="body">machten en krachten onderworpen.</text><text x="46" y="996" class="note">De opeenvolgende tekstgegevens blijven</text><text x="46" y="1032" class="note">onderscheiden; niet benoemde geesten krijgen</text><text x="46" y="1068" class="note">geen verzonnen namen.</text></svg>