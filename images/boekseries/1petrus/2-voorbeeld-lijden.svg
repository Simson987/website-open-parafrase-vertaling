<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De voetstappen van Christus</title><desc id="desc">De voetstappen van Christus met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De voetstappen van Christus</text><text x="44" y="113" class="ref">1 Petrus 2:21–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zijn woorden</text><text x="68" y="241" class="body">Geen bedrog; niet terugschelden of</text><text x="68" y="284" class="body">dreigen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn vertrouwen</text><text x="68" y="433" class="body">Het overgeven aan Hem die rechtvaardig</text><text x="68" y="476" class="body">oordeelt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn offer</text><text x="68" y="625" class="body">Zonden dragen op het hout, om voor</text><text x="68" y="668" class="body">gerechtigheid te leven.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Onze terugkeer</text><text x="68" y="817" class="body">Van dwalende schapen naar de Herder en</text><text x="68" y="860" class="body">Opziener.</text><text x="46" y="953" class="note">De tekst verbindt Christus’ voorbeeld met Zijn</text><text x="46" y="989" class="note">reddende werk.</text></svg>