<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Azaria en Jotham in Juda</title><desc id="desc">Gecontroleerde namen, leeftijd, bestuur en opvolging in Juda.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Azaria en Jotham in Juda</text><text x="44" y="113" class="ref">2 Koningen 15:1–7, 32–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Azaria</text><text x="68" y="241" class="body">Zoon van Amazia; zestien bij aantreden</text><text x="68" y="284" class="body">en 52 jaar regering; moeder Jecholia.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het aparte huis</text><text x="68" y="433" class="body">Hij blijft melaats; zijn zoon Jotham</text><text x="68" y="476" class="body">leidt paleis en land.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jotham als koning</text><text x="68" y="625" class="body">25 bij aantreden; zestien jaar; moeder</text><text x="68" y="668" class="body">Jerusa, dochter van Zadok.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn bouwwerk</text><text x="68" y="817" class="body">De bovenste poort van het huis van de</text><text x="68" y="860" class="body">HEERE.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De opvolging</text><text x="68" y="1009" class="body">Jothams zoon Achaz wordt koning.</text><text x="46" y="1102" class="note">De tekst gebruikt voor Azaria ook de naam Uzzia.</text><text x="46" y="1138" class="note">De hoogten blijven onder beide koningen bestaan.</text></svg>