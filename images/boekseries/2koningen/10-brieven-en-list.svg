<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Brieven en een list</title><desc id="desc">De geweldsreeks en het verschil tussen de aangekondigde bedoeling en de list.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Brieven en een list</text><text x="44" y="113" class="ref">2 Koningen 10:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste brief</text><text x="68" y="241" class="body">De bestuurders durven geen van Achabs</text><text x="68" y="284" class="body">zonen koning te maken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede brief</text><text x="68" y="433" class="body">Zeventig zonen worden gedood; hun</text><text x="68" y="476" class="body">hoofden naar Jizreël gestuurd.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij Beth-Heked</text><text x="68" y="625" class="body">42 broers van Ahazia worden gedood.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Jonadab, zoon van Rechab</text><text x="68" y="774" class="body">Geeft Jehu zijn hand en rijdt met hem</text><text x="68" y="817" class="body">mee.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De list bij Baäl</text><text x="68" y="966" class="body">Een aangekondigd groot offer verzamelt</text><text x="68" y="1009" class="body">de dienaren; Jehu laat hen doden en</text><text x="68" y="1052" class="body">breekt de tempel af.</text><text x="46" y="1145" class="note">Jehu’s belofte Baäl meer te dienen is volgens de</text><text x="46" y="1181" class="note">tekst een list, geen werkelijke</text><text x="46" y="1217" class="note">geloofsbelijdenis.</text></svg>