<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Zes koningen in Israël</title><desc id="desc">De korte regeringen, staatsgrepen en enige vermelde vader-zoonopvolging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes koningen in Israël</text><text x="44" y="113" class="ref">2 Koningen 15:8–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zacharia → Sallum</text><text x="68" y="241" class="body">Zacharia: zes maanden; Sallum doodt hem</text><text x="68" y="284" class="body">en regeert één maand.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Menahem</text><text x="68" y="433" class="body">Doodt Sallum; regeert tien jaar en</text><text x="68" y="476" class="body">betaalt Pul met zilver van rijke</text><text x="68" y="519" class="body">mannen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Pekahia</text><text x="68" y="668" class="body">Zoon van Menahem; twee jaar regering;</text><text x="68" y="711" class="body">door officier Pekah gedood.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Pekah</text><text x="68" y="860" class="body">Zoon van Remalia; twintig jaar genoemd;</text><text x="68" y="903" class="body">Assyrië verovert noordelijke gebieden.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Hosea</text><text x="68" y="1052" class="body">Zoon van Ela; doodt Pekah en volgt hem</text><text x="68" y="1095" class="body">op.</text><text x="46" y="1188" class="note">Opvolgingspijlen zijn geen familierelaties.</text><text x="46" y="1224" class="note">Menahems gruwelijke geweld in Tifsah wordt in</text><text x="46" y="1260" class="note">vers 16 apart vermeld.</text></svg>