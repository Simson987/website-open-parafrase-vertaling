<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">De weg van het wetboek</title><desc id="desc">De overdracht van de rol en de vijf personen die Hulda raadplegen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De weg van het wetboek</text><text x="44" y="113" class="ref">2 Koningen 22:8–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hilkia</text><text x="68" y="241" class="body">De hogepriester vindt het boek en geeft</text><text x="68" y="284" class="body">het aan Safan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Safan</text><text x="68" y="433" class="body">Leest het zelf, doet verslag van het</text><text x="68" y="476" class="body">bouwgeld en leest de koning voor.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Josia</text><text x="68" y="625" class="body">Scheurt zijn kleren en laat de HEERE</text><text x="68" y="668" class="body">raadplegen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vijf gezanten</text><text x="68" y="817" class="body">Hilkia, Ahikam, Achbor, Safan en Asaja.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Hulda</text><text x="68" y="966" class="body">Profetes in de nieuwe wijk van</text><text x="68" y="1009" class="body">Jeruzalem; zij geeft het antwoord.</text><text x="46" y="1102" class="note">Safan is de schrijver die aan de koning</text><text x="46" y="1138" class="note">voorleest; hij is niet de hogepriester Hilkia.</text></svg>