<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Zeven jaar en herstel</title><desc id="desc">De verblijfstijd, samenloop bij de koning en omvang van het rechtsherstel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeven jaar en herstel</text><text x="44" y="113" class="ref">2 Koningen 8:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De waarschuwing</text><text x="68" y="241" class="body">Elisa kondigt zeven jaren hongersnood</text><text x="68" y="284" class="body">aan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het verblijf</text><text x="68" y="433" class="body">De vrouw woont met haar gezin in het</text><text x="68" y="476" class="body">land van de Filistijnen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De terugkomst</text><text x="68" y="625" class="body">Zij vraagt haar huis en land terug.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Gehazi’s verhaal</text><text x="68" y="774" class="body">Juist bij zijn relaas over de levende</text><text x="68" y="817" class="body">zoon verschijnen moeder en zoon.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het herstel</text><text x="68" y="966" class="body">Een hofbeambte moet bezit én alle</text><text x="68" y="1009" class="body">gemiste opbrengst teruggeven.</text><text x="46" y="1102" class="note">Dit terugblikkende verhaal vermeldt Gehazi’s</text><text x="46" y="1138" class="note">toestand of een precieze datering ten opzichte</text><text x="46" y="1174" class="note">van hoofdstuk 5 niet.</text></svg>