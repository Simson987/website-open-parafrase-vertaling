<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Opvolgers in Juda en Israël</title><desc id="desc">De parallelle opvolging en het onderscheid tussen twee Jerobeams.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opvolgers in Juda en Israël</text><text x="44" y="113" class="ref">2 Koningen 14:16–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Israël</text><text x="68" y="241" class="body">Joas → zijn zoon Jerobeam; Jerobeam</text><text x="68" y="284" class="body">regeert 41 jaar.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Juda</text><text x="68" y="433" class="body">Amazia leeft vijftien jaar langer dan</text><text x="68" y="476" class="body">Joas van Israël; daarna volgt zijn zoon</text><text x="68" y="519" class="body">Azaria.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Azaria</text><text x="68" y="668" class="body">Zestien jaar bij aantreden; herbouwt</text><text x="68" y="711" class="body">Elath.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Jerobeams grensherstel</text><text x="68" y="860" class="body">Van de weg naar Hamath tot de zee van</text><text x="68" y="903" class="body">de Vlakte, volgens het woord door Jona.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Jona</text><text x="68" y="1052" class="body">Zoon van Amitthai, profeet uit</text><text x="68" y="1095" class="body">Gath-Hefer.</text><text x="46" y="1188" class="note">Deze Jerobeam is de zoon van Joas, niet</text><text x="46" y="1224" class="note">Jerobeam, de zoon van Nebat, naar wie de</text><text x="46" y="1260" class="note">zondeweg heet.</text></svg>