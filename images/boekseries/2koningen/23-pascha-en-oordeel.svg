<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Pascha en blijvend oordeel</title><desc id="desc">Het feest, de beoordeling van Josia en de blijvende waarschuwing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Pascha en blijvend oordeel</text><text x="44" y="113" class="ref">2 Koningen 23:21–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De opdracht</text><text x="68" y="241" class="body">Pascha vieren volgens het boek van het</text><text x="68" y="284" class="body">verbond.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De tijd</text><text x="68" y="433" class="body">Achttiende jaar van Josia; een</text><text x="68" y="476" class="body">uitzonderlijk feest sinds richters en</text><text x="68" y="519" class="body">koningen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De toewijding</text><text x="68" y="668" class="body">Met heel hart, ziel en kracht naar de</text><text x="68" y="711" class="body">wet van Mozes.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Toch blijft het oordeel</text><text x="68" y="860" class="body">De toorn vanwege Manasse wordt niet</text><text x="68" y="903" class="body">weggenomen; Juda en Jeruzalem worden</text><text x="68" y="946" class="body">verworpen.</text><text x="46" y="1039" class="note">Josia’s toewijding en het blijvende oordeel over</text><text x="46" y="1075" class="note">Juda staan beide in de tekst.</text></svg>