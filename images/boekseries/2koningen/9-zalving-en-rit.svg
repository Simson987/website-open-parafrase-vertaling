<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Zalving en de rit naar Jizreël</title><desc id="desc">Opdracht, familie, bevestiging en twee boodschappers vóór de ontmoeting.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zalving en de rit naar Jizreël</text><text x="44" y="113" class="ref">2 Koningen 9:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Elisa’s leerling</text><text x="68" y="241" class="body">Brengt olie naar Ramoth in Gilead en</text><text x="68" y="284" class="body">zalft Jehu in een aparte kamer.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jehu’s afkomst</text><text x="68" y="433" class="body">Zoon van Josafat, zoon van Nimsi.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De publieke uitroeping</text><text x="68" y="582" class="body">De aanvoerders leggen mantels op de</text><text x="68" y="625" class="body">treden en blazen de bazuin.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Twee boden</text><text x="68" y="774" class="body">Beide ruiters keren niet terug maar</text><text x="68" y="817" class="body">sluiten achter Jehu aan.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De ontmoeting</text><text x="68" y="966" class="body">Joram en Ahazia rijden elk in hun wagen</text><text x="68" y="1009" class="body">naar Naboths stuk land.</text><text x="46" y="1102" class="note">Jehu’s vader Josafat is hier niet de koning van</text><text x="46" y="1138" class="note">Juda; de namenlijst geeft hem een andere</text><text x="46" y="1174" class="note">afstamming.</text></svg>