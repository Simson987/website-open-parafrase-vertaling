<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Hulda’s tweeledige antwoord</title><desc id="desc">Het onderscheid tussen oordeel over de plaats en het persoonlijke antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hulda’s tweeledige antwoord</text><text x="44" y="113" class="ref">2 Koningen 22:15–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Over de plaats</text><text x="68" y="241" class="body">Onheil volgens het boek vanwege</text><text x="68" y="284" class="body">verlaten van de HEERE en andere goden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Over de koning</text><text x="68" y="433" class="body">Zacht geworden hart, vernedering,</text><text x="68" y="476" class="body">gescheurde kleren en tranen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het gehoorde gebed</text><text x="68" y="625" class="body">God zegt de koning gehoord te hebben.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De belofte</text><text x="68" y="774" class="body">Josia zal het aangekondigde onheil over</text><text x="68" y="817" class="body">deze plaats niet met zijn ogen zien.</text><text x="46" y="910" class="note">De belofte gaat over het niet zien van dit</text><text x="46" y="946" class="note">onheil; het volgende hoofdstuk vertelt</text><text x="46" y="982" class="note">afzonderlijk over zijn dood bij Megiddo.</text></svg>