<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Hervorming op vele plaatsen</title><desc id="desc">Plaatsen en verschillende soorten ingrepen in Josia’s hervorming.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hervorming op vele plaatsen</text><text x="44" y="113" class="ref">2 Koningen 23:4–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In en bij de tempel</text><text x="68" y="241" class="body">Voorwerpen voor afgoden eruit; huizen,</text><text x="68" y="284" class="body">altaren en zonnewagens weg.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kidron</text><text x="68" y="433" class="body">Beeld verbrand en verpulverd; ook gruis</text><text x="68" y="476" class="body">van altaren hierheen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hinnom en omgeving</text><text x="68" y="625" class="body">Tofeth onrein gemaakt om kinderoffers</text><text x="68" y="668" class="body">te verhinderen; ook Salomo’s hoogten</text><text x="68" y="711" class="body">aangepakt.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bethel</text><text x="68" y="860" class="body">Jerobeams altaar afgebroken; het graf</text><text x="68" y="903" class="body">van de man van God blijft onaangeroerd.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Samaria’s steden</text><text x="68" y="1052" class="body">Hoogtetempels verwijderd; de tekst</text><text x="68" y="1095" class="body">noemt ook de dood van de priesters.</text><text x="46" y="1188" class="note">De hervorming is een reeks op meerdere locaties,</text><text x="46" y="1224" class="note">geen enkel gelijktijdig pleinmoment.</text></svg>