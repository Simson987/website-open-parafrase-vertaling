<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Herstel en vijftien jaren</title><desc id="desc">De omslag van doodsaankondiging naar herstel en de betekenis van de aantallen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herstel en vijftien jaren</text><text x="44" y="113" class="ref">2 Koningen 20:1–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste boodschap</text><text x="68" y="241" class="body">Regel je zaken; Hizkia zal sterven.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het gebed</text><text x="68" y="390" class="body">Hij wendt zich naar de muur en huilt.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">De nieuwe boodschap</text><text x="68" y="539" class="body">Nog voor Jesaja het middelste voorhof</text><text x="68" y="582" class="body">verlaat: teruggaan met herstelwoord.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De belofte</text><text x="68" y="731" class="body">Over drie dagen naar het huis van de</text><text x="68" y="774" class="body">HEERE; vijftien extra levensjaren.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Het teken</text><text x="68" y="923" class="body">De schaduw gaat tien treden terug op</text><text x="68" y="966" class="body">Achaz’ zonnewijzer.</text><text x="46" y="1059" class="note">De drie dagen, vijftien jaren en tien treden</text><text x="46" y="1095" class="note">betreffen verschillende onderdelen van het</text><text x="46" y="1131" class="note">verhaal.</text></svg>