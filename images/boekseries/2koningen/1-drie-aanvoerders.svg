<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Drie aanvoerders</title><desc id="desc">De drie boodschappen en het afwijkende verloop bij de derde aanvoerder.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie aanvoerders</text><text x="44" y="113" class="ref">2 Koningen 1:9–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste</text><text x="68" y="241" class="body">Kom naar beneden; vuur verteert hem en</text><text x="68" y="284" class="body">zijn vijftig man.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De tweede</text><text x="68" y="433" class="body">Kom snel naar beneden; hetzelfde</text><text x="68" y="476" class="body">oordeel volgt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De derde</text><text x="68" y="625" class="body">Knielt en smeekt om zijn leven en dat</text><text x="68" y="668" class="body">van zijn vijftig mannen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De toestemming</text><text x="68" y="817" class="body">De engel zegt Elia zonder angst mee te</text><text x="68" y="860" class="body">gaan.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Bij Ahazia</text><text x="68" y="1009" class="body">Elia herhaalt het oordeel; Ahazia</text><text x="68" y="1052" class="body">sterft zonder zoon en Joram volgt op.</text><text x="46" y="1145" class="note">Joram in Israël is een andere koning dan de hier</text><text x="46" y="1181" class="note">tevens genoemde Joram, zoon van Josafat, in</text><text x="46" y="1217" class="note">Juda.</text></svg>