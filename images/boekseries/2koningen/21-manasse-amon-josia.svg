<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Manasse, Amon en Josia</title><desc id="desc">Vader-zoonopvolging, leeftijden, duur en de twee graven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Manasse, Amon en Josia</text><text x="44" y="113" class="ref">2 Koningen 21:1, 18–26; 22:1</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Manasse</text><text x="68" y="241" class="body">Twaalf jaar bij aantreden; 55 jaar</text><text x="68" y="284" class="body">regering; moeder Hefzibah.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Amon</text><text x="68" y="433" class="body">Zoon van Manasse; 22 bij aantreden;</text><text x="68" y="476" class="body">twee jaar regering; moeder Mesullemet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De samenzwering</text><text x="68" y="625" class="body">Amon wordt door dienaren gedood; het</text><text x="68" y="668" class="body">volk doodt de samenzweerders.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Josia</text><text x="68" y="817" class="body">Zoon van Amon; door het volk koning</text><text x="68" y="860" class="body">gemaakt; acht bij aantreden volgens</text><text x="68" y="903" class="body">22:1.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De graven</text><text x="68" y="1052" class="body">Manasse en Amon worden in de tuin van</text><text x="68" y="1095" class="body">Uzza begraven.</text><text x="46" y="1188" class="note">De genoemde leeftijden staan bij het aantreden,</text><text x="46" y="1224" class="note">niet bij de dood van de koningen.</text></svg>