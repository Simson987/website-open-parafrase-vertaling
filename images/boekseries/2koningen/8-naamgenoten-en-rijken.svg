<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Naamgenoten en twee rijken</title><desc id="desc">Twee gelijknamige koningen en de opvolging en ontmoeting tussen de rijken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Naamgenoten en twee rijken</text><text x="44" y="113" class="ref">2 Koningen 8:16–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Israël</text><text x="68" y="241" class="body">Joram, zoon van Achab; raakt gewond bij</text><text x="68" y="284" class="body">Ramoth en herstelt in Jizreël.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Juda: Jehoram</text><text x="68" y="433" class="body">Zoon van Josafat; 32 bij aantreden,</text><text x="68" y="476" class="body">acht jaar koning; getrouwd in Achabs</text><text x="68" y="519" class="body">huis.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De opstanden</text><text x="68" y="668" class="body">Edom wordt onafhankelijk; ook Libna</text><text x="68" y="711" class="body">komt in opstand.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Juda: Ahazia</text><text x="68" y="860" class="body">Zoon van Jehoram; 22 bij aantreden, één</text><text x="68" y="903" class="body">jaar koning.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het bezoek</text><text x="68" y="1052" class="body">Ahazia uit Juda bezoekt Joram van</text><text x="68" y="1095" class="body">Israël in Jizreël.</text><text x="46" y="1188" class="note">De twee Jorams worden onderscheiden door hun</text><text x="46" y="1224" class="note">vader en rijk; zij worden niet tot één persoon</text><text x="46" y="1260" class="note">samengevoegd.</text></svg>