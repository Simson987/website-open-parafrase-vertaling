<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Gedalia en de tocht naar Egypte</title><desc id="desc">Familie, vier aanvoerders, moord en de daaropvolgende vlucht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gedalia en de tocht naar Egypte</text><text x="44" y="113" class="ref">2 Koningen 25:22–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanstelling</text><text x="68" y="241" class="body">Gedalia, zoon van Ahikam, zoon van</text><text x="68" y="284" class="body">Safan, over de achterblijvers.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De ontmoeting in Mizpa</text><text x="68" y="433" class="body">Ismaël, Johanan, Seraja en Jaäzanja</text><text x="68" y="476" class="body">komen met hun mannen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De oproep</text><text x="68" y="625" class="body">Blijf in het land en dien de koning van</text><text x="68" y="668" class="body">Babel.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De zevende maand</text><text x="68" y="817" class="body">Ismaël komt met tien mannen en doodt</text><text x="68" y="860" class="body">Gedalia en anderen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De reactie</text><text x="68" y="1009" class="body">Het volk en de legeraanvoerders trekken</text><text x="68" y="1052" class="body">uit angst naar Egypte.</text><text x="46" y="1145" class="note">Gedalia is een aangestelde bestuurder; hij wordt</text><text x="46" y="1181" class="note">geen nieuwe koning van Juda genoemd.</text></svg>