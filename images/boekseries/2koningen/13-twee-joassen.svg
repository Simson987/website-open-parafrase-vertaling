<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">Twee koningen met de naam Joas</title><desc id="desc">De twee Joassen en de onderscheiden opvolging in Israël en Syrië.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee koningen met de naam Joas</text><text x="44" y="113" class="ref">2 Koningen 13:1–13, 24–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Juda</text><text x="68" y="241" class="body">Joas, zoon van Ahazia; zijn 23ste en</text><text x="68" y="284" class="body">37ste jaar geven tijdsaanduidingen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Israël: Joahaz</text><text x="68" y="433" class="body">Zoon van Jehu; zeventien jaar regering;</text><text x="68" y="476" class="body">smeekt om hulp.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Israël: Joas</text><text x="68" y="625" class="body">Zoon van Joahaz; zestien jaar regering;</text><text x="68" y="668" class="body">bezoekt Elisa.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Syrië</text><text x="68" y="817" class="body">Hazaël → zijn zoon Benhadad.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Israëls opvolging</text><text x="68" y="966" class="body">Joas → Jerobeam op zijn troon.</text><text x="46" y="1059" class="note">De gelijke naam maakt de koning van Juda niet</text><text x="46" y="1095" class="note">dezelfde als de koning van Israël.</text></svg>