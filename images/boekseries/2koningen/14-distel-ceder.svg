<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De distel en de ceder</title><desc id="desc">Fabel, waarschuwing en historisch gevolg zorgvuldig onderscheiden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De distel en de ceder</text><text x="44" y="113" class="ref">2 Koningen 14:9–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In het verhaal</text><text x="68" y="241" class="body">De distel vraagt de dochter van de</text><text x="68" y="284" class="body">ceder voor zijn zoon.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De afloop van het beeld</text><text x="68" y="433" class="body">Een wild dier vertrapt de distel.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De toepassing</text><text x="68" y="582" class="body">Joas waarschuwt Amazia tegen hoogmoed</text><text x="68" y="625" class="body">na zijn overwinning op Edom.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Amazia luistert niet</text><text x="68" y="774" class="body">Bij Beth-Semes wordt Juda verslagen en</text><text x="68" y="817" class="body">Amazia gevangen.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Jeruzalem</text><text x="68" y="966" class="body">Circa 180 meter muur wordt afgebroken;</text><text x="68" y="1009" class="body">schatten en gijzelaars worden</text><text x="68" y="1052" class="body">meegenomen.</text><text x="46" y="1145" class="note">Dit is een fabel in Joas’ antwoord, geen</text><text x="46" y="1181" class="note">werkelijke huwelijksaanvraag tussen twee</text><text x="46" y="1217" class="note">planten.</text></svg>