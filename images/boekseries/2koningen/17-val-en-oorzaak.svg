<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De val van Samaria</title><desc id="desc">Tijdlijn en de in de tekst gegeven oorzaken van de wegvoering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De val van Samaria</text><text x="44" y="113" class="ref">2 Koningen 17:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hosea</text><text x="68" y="241" class="body">Negen jaar koning; onderdaan van</text><text x="68" y="284" class="body">Salmaneser en schatplichtig.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De breuk</text><text x="68" y="433" class="body">Zoekt steun bij So in Egypte en betaalt</text><text x="68" y="476" class="body">niet meer; wordt gevangengezet.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het beleg</text><text x="68" y="625" class="body">Drie jaar; in zijn negende jaar wordt</text><text x="68" y="668" class="body">Samaria ingenomen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De wegvoering</text><text x="68" y="817" class="body">Naar Halah, Habor aan de Gozan en</text><text x="68" y="860" class="body">steden van de Meden.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De uitleg</text><text x="68" y="1009" class="body">Afgoderij, afwijzing van wet en verbond</text><text x="68" y="1052" class="body">en niet luisteren naar de profeten.</text><text x="46" y="1145" class="note">Het hoofdstuk geeft zowel politieke</text><text x="46" y="1181" class="note">gebeurtenissen als zijn theologische uitleg; ook</text><text x="46" y="1217" class="note">Juda wordt om ongehoorzaamheid bekritiseerd.</text></svg>