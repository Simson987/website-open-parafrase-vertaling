<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1376" viewBox="0 0 840 1376" role="img" aria-labelledby="title desc"><title id="title">Geld voor het herstel</title><desc id="desc">De verandering in inzameling, beheer en besteding van het herstelgeld.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1376" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geld voor het herstel</text><text x="44" y="113" class="ref">2 Koningen 12:4–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerdere regeling</text><text x="68" y="241" class="body">Priesters ontvangen de gaven, maar in</text><text x="68" y="284" class="body">het 23ste jaar is er nog geen herstel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nieuwe inzameling</text><text x="68" y="433" class="body">Een kist met een gat in het deksel</text><text x="68" y="476" class="body">naast het altaar.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tellen en wegen</text><text x="68" y="625" class="body">De koninklijke schrijver en</text><text x="68" y="668" class="body">hogepriester beheren het ingezamelde</text><text x="68" y="711" class="body">geld.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De besteding</text><text x="68" y="860" class="body">Opzichters betalen timmerlieden,</text><text x="68" y="903" class="body">bouwers, metselaars, steenhouwers en</text><text x="68" y="946" class="body">materialen.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De scheiding</text><text x="68" y="1095" class="body">Geen gouden of zilveren voorwerpen</text><text x="68" y="1138" class="body">hiervan; schuld- en zondoffergeld is</text><text x="68" y="1181" class="body">voor de priesters.</text><text x="46" y="1274" class="note">Het hoofdstuk onderscheidt bouwgeld en inkomsten</text><text x="46" y="1310" class="note">die aan de priesters toekomen.</text></svg>