<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">De familie en Joas’ redding</title><desc id="desc">De gecontroleerde familiebanden en leeftijden rond de redding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De familie en Joas’ redding</text><text x="44" y="113" class="ref">2 Koningen 11:1–3, 21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Athalia</text><text x="68" y="241" class="body">Moeder van de gestorven koning Ahazia;</text><text x="68" y="284" class="body">zij regeert over het land.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Joseba</text><text x="68" y="433" class="body">Dochter van koning Joram en zus van</text><text x="68" y="476" class="body">Ahazia.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Joas</text><text x="68" y="625" class="body">Zoon van Ahazia; Joseba verbergt hem</text><text x="68" y="668" class="body">met zijn voedster.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De verborgen jaren</text><text x="68" y="817" class="body">Zes jaar in het huis van de HEERE.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het aantreden</text><text x="68" y="966" class="body">Joas is zeven jaar als hij koning</text><text x="68" y="1009" class="body">wordt.</text><text x="46" y="1102" class="note">Joseba is Joas’ tante, niet zijn moeder. De</text><text x="46" y="1138" class="note">voedster is een derde, afzonderlijk genoemde</text><text x="46" y="1174" class="note">persoon.</text></svg>