<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Verwachting en eenvoudig bevel</title><desc id="desc">Verwachting, opdracht, omkeer, belijdenis en geweigerd geschenk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verwachting en eenvoudig bevel</text><text x="44" y="113" class="ref">2 Koningen 5:9–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Naämans verwachting</text><text x="68" y="241" class="body">De profeet zelf zal naar buiten komen</text><text x="68" y="284" class="body">en met zijn hand genezen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De boodschap</text><text x="68" y="433" class="body">Een bode zegt: zeven keer wassen in de</text><text x="68" y="476" class="body">Jordaan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De weerstand</text><text x="68" y="625" class="body">Naäman noemt Abana en Farpar in</text><text x="68" y="668" class="body">Damaskus beter en gaat boos weg.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De dienaren</text><text x="68" y="817" class="body">Raden aan juist deze eenvoudige</text><text x="68" y="860" class="body">opdracht op te volgen.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Na het herstel</text><text x="68" y="1009" class="body">Erkenning van Israëls God; Elisa</text><text x="68" y="1052" class="body">weigert het geschenk en laat hem in</text><text x="68" y="1095" class="body">vrede gaan.</text><text x="46" y="1188" class="note">Naäman blijft een volwassen man; de vergelijking</text><text x="46" y="1224" class="note">met kinderhuid gaat over het herstel van zijn</text><text x="46" y="1260" class="note">huid.</text></svg>