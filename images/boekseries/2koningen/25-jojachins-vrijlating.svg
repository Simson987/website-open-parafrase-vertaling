<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Jojachins vrijlating</title><desc id="desc">Datering, identiteit en concrete veranderingen bij zijn vrijlating.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jojachins vrijlating</text><text x="44" y="113" class="ref">2 Koningen 25:27–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De lange gevangenschap</text><text x="68" y="241" class="body">Zevenendertigste jaar sinds Jojachins</text><text x="68" y="284" class="body">wegvoering.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De nieuwe koning</text><text x="68" y="433" class="body">Evilmerodach komt in Babel aan de</text><text x="68" y="476" class="body">macht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De datum</text><text x="68" y="625" class="body">Twaalfde maand, 27e dag in diens eerste</text><text x="68" y="668" class="body">regeringsjaar.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De verandering</text><text x="68" y="817" class="body">Uit de gevangenis, vriendelijk</text><text x="68" y="860" class="body">ontvangen en hoger dan andere koningen</text><text x="68" y="903" class="body">geplaatst.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het onderhoud</text><text x="68" y="1052" class="body">Andere kleren, eten aan de koningstafel</text><text x="68" y="1095" class="body">en dagelijks een vast deel.</text><text x="46" y="1188" class="note">Jojachin is dezelfde koning die in hoofdstuk 24</text><text x="46" y="1224" class="note">op zijn achttiende werd weggevoerd; hier is hij</text><text x="46" y="1260" class="note">ruim vijftig.</text></svg>