<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Babel ziet de schatten</title><desc id="desc">Bezoek, onbegrensd tonen, toekomstig oordeel en opvolging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Babel ziet de schatten</text><text x="44" y="113" class="ref">2 Koningen 20:12–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De afzender</text><text x="68" y="241" class="body">Berodach-Baladan, zoon van Baladan,</text><text x="68" y="284" class="body">koning van Babel.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De ontvangst</text><text x="68" y="433" class="body">Brieven en geschenk na Hizkia’s ziekte.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Hizkia toont alles</text><text x="68" y="582" class="body">Zilver, goud, specerijen, olie, wapens</text><text x="68" y="625" class="body">en schatkamers.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Jesaja’s woord</text><text x="68" y="774" class="body">Later zal alles naar Babel gaan; ook</text><text x="68" y="817" class="body">nakomelingen naar het hof.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het slot</text><text x="68" y="966" class="body">Waterleiding als bouwwerk genoemd;</text><text x="68" y="1009" class="body">Manasse volgt Hizkia op.</text><text x="46" y="1102" class="note">De aangekondigde wegvoering is toekomstig; zij</text><text x="46" y="1138" class="note">vindt niet plaats tijdens het bezoek van de</text><text x="46" y="1174" class="note">boden.</text></svg>