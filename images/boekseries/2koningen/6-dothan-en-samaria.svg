<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Van Dothan naar Samaria</title><desc id="desc">De wisseling tussen zien en blindheid en de gang naar vrijlating.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Dothan naar Samaria</text><text x="44" y="113" class="ref">2 Koningen 6:8–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Waarschuwingen</text><text x="68" y="241" class="body">Elisa onthult herhaaldelijk de Syrische</text><text x="68" y="284" class="body">plannen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Omsingeling in Dothan</text><text x="68" y="433" class="body">Het leger zoekt Elisa; zijn dienaar</text><text x="68" y="476" class="body">ziet eerst alleen de vijand.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Geopende ogen</text><text x="68" y="625" class="body">De berg vol paarden en wagens van vuur.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Blindheid en leiding</text><text x="68" y="774" class="body">De Syriërs volgen Elisa en komen midden</text><text x="68" y="817" class="body">in Samaria.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Barmhartige uitweg</text><text x="68" y="966" class="body">Geen executie: brood, water en een</text><text x="68" y="1009" class="body">groot feestmaal; daarna mogen zij</text><text x="68" y="1052" class="body">terug.</text><text x="46" y="1145" class="note">Het latere beleg door Benhadads hele leger</text><text x="46" y="1181" class="note">begint een nieuwe episode in vers 24.</text></svg>