<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Drie koningen en Babel</title><desc id="desc">Drie regeringen, twee naamsvormen en de juiste familiebanden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie koningen en Babel</text><text x="44" y="113" class="ref">2 Koningen 24:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jojakim</text><text x="68" y="241" class="body">Dient Babel drie jaar, komt in opstand;</text><text x="68" y="284" class="body">zijn zoon Jojachin volgt op.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jojachin</text><text x="68" y="433" class="body">Achttien bij aantreden; drie maanden;</text><text x="68" y="476" class="body">geeft zich met moeder en hof over.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De wegvoering</text><text x="68" y="625" class="body">Schatten, gezagdragers, strijders en</text><text x="68" y="668" class="body">vaklieden naar Babel; armen blijven.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Mattanja → Zedekia</text><text x="68" y="817" class="body">Oom van Jojachin; door Babel aangesteld</text><text x="68" y="860" class="body">en hernoemd.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Zedekia</text><text x="68" y="1009" class="body">21 bij aantreden; elf jaar; komt</text><text x="68" y="1052" class="body">eveneens in opstand.</text><text x="46" y="1145" class="note">Jojachin is Jojakims zoon; Zedekia is Jojachins</text><text x="46" y="1181" class="note">oom. De namen en relaties worden niet</text><text x="46" y="1217" class="note">verwisseld.</text></svg>