<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Vijf verhalen over voorziening</title><desc id="desc">Vijf delen met hun eigen situatie en uitkomst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijf verhalen over voorziening</text><text x="44" y="113" class="ref">2 Koningen 4:1–44</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De weduwe</text><text x="68" y="241" class="body">Geleende lege potten vullen; olie</text><text x="68" y="284" class="body">verkopen om schuld te betalen en van</text><text x="68" y="327" class="body">het overige leven.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De kamer in Sunem</text><text x="68" y="476" class="body">Gastvrijheid voor Elisa; belofte en</text><text x="68" y="519" class="body">geboorte van een zoon.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het herstel van de zoon</text><text x="68" y="668" class="body">De moeder zoekt Elisa; na zijn gebed</text><text x="68" y="711" class="body">keert het leven terug.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De soeppot in Gilgal</text><text x="68" y="860" class="body">Onbekende wilde kalebassen; na</text><text x="68" y="903" class="body">toevoeging van meel is de soep niet</text><text x="68" y="946" class="body">meer schadelijk.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De gerstebroden</text><text x="68" y="1095" class="body">Twintig broden en verse korenaren voor</text><text x="68" y="1138" class="body">honderd mannen; er blijft over.</text><text x="46" y="1231" class="note">Dit hoofdstuk bundelt verschillende huishoudens</text><text x="46" y="1267" class="note">en momenten; de twee vrouwen worden niet</text><text x="46" y="1303" class="note">samengevoegd.</text></svg>