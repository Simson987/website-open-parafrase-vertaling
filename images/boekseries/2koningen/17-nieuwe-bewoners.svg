<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Nieuwe bewoners en hun goden</title><desc id="desc">Precieze plaatsnamen en godennamen bij de vermengde eredienst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nieuwe bewoners en hun goden</text><text x="44" y="113" class="ref">2 Koningen 17:24–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De herkomst</text><text x="68" y="241" class="body">Babel, Chuta, Avva, Hamath en</text><text x="68" y="284" class="body">Sefarvaim.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De teruggekeerde priester</text><text x="68" y="433" class="body">Onderwijst in Bethel hoe de HEERE te</text><text x="68" y="476" class="body">vereren.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Babel, Chut en Hamath</text><text x="68" y="625" class="body">Sukkoth-Benoth, Nergal en Asima.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Avieten en Sefarvieten</text><text x="68" y="774" class="body">Nibhaz en Tartak; Adramelech en</text><text x="68" y="817" class="body">Anamelech.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het probleem</text><text x="68" y="966" class="body">Verering van de HEERE vermengd met</text><text x="68" y="1009" class="body">eigen beelden; het verbond verbiedt</text><text x="68" y="1052" class="body">andere goden.</text><text x="46" y="1145" class="note">De tekst noemt ook dodelijke leeuwenaanvallen en</text><text x="46" y="1181" class="note">Sefarvitische kinderoffers; het schema beeldt</text><text x="46" y="1217" class="note">die niet uit.</text></svg>