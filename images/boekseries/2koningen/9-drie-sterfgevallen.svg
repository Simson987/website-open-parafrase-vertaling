<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Drie sterfgevallen</title><desc id="desc">De gewelddadige afloop met juiste personen, locaties en verwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie sterfgevallen</text><text x="44" y="113" class="ref">2 Koningen 9:24–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Joram van Israël</text><text x="68" y="241" class="body">Jehu schiet hem; Bidkar krijgt bevel</text><text x="68" y="284" class="body">hem op Naboths land te leggen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ahazia van Juda</text><text x="68" y="433" class="body">Wordt tijdens zijn vlucht geraakt;</text><text x="68" y="476" class="body">sterft in Megiddo en wordt in Jeruzalem</text><text x="68" y="519" class="body">begraven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Izebel</text><text x="68" y="668" class="body">Kijkt uit het raam; hovelingen werpen</text><text x="68" y="711" class="body">haar op Jehu’s bevel naar beneden.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het oordeel</text><text x="68" y="860" class="body">De tekst verbindt Naboths land en</text><text x="68" y="903" class="body">Izebels einde met eerder gesproken</text><text x="68" y="946" class="body">woorden.</text><text x="46" y="1039" class="note">De drie personen sterven op verschillende</text><text x="46" y="1075" class="note">plaatsen en manieren; de twee koningen krijgen</text><text x="46" y="1111" class="note">niet hetzelfde graf.</text></svg>