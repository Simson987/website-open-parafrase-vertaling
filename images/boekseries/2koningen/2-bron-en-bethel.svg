<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Bron en de weg naar Bethel</title><desc id="desc">De twee verschillende afsluitende gebeurtenissen en verdere reis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bron en de weg naar Bethel</text><text x="44" y="113" class="ref">2 Koningen 2:19–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jericho</text><text x="68" y="241" class="body">Mooie ligging, maar slecht water en</text><text x="68" y="284" class="body">onvruchtbaar land.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nieuwe schaal met zout</text><text x="68" y="433" class="body">Elisa werpt het zout in de bron en</text><text x="68" y="476" class="body">spreekt Gods herstelwoord.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De weg omhoog</text><text x="68" y="625" class="body">Jongens bespotten Elisa; hij vervloekt</text><text x="68" y="668" class="body">hen in de naam van de HEERE.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het oordeel</text><text x="68" y="817" class="body">Twee beren verscheuren 42 jongens.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De verdere reis</text><text x="68" y="966" class="body">Naar de Karmel en daarna terug naar</text><text x="68" y="1009" class="body">Samaria.</text><text x="46" y="1102" class="note">Het herstel van de bron en het gewelddadige</text><text x="46" y="1138" class="note">gebeuren op de weg zijn aparte gebeurtenissen.</text></svg>