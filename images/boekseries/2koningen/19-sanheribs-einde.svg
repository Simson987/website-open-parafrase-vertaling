<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Terugtocht en Sanheribs einde</title><desc id="desc">Onderscheid tussen de nachtelijke ramp, terugtocht en latere familiedaad.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Terugtocht en Sanheribs einde</text><text x="44" y="113" class="ref">2 Koningen 19:35–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In het kamp</text><text x="68" y="241" class="body">De engel van de HEERE doodt 185.000 man</text><text x="68" y="284" class="body">in één nacht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De terugtocht</text><text x="68" y="433" class="body">Sanherib keert terug en blijft in</text><text x="68" y="476" class="body">Ninevé.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn dood</text><text x="68" y="625" class="body">Adramelech en Sarezer doden hun vader</text><text x="68" y="668" class="body">in Nisrochs tempel.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vlucht</text><text x="68" y="817" class="body">Zij vluchten naar Ararat.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De opvolger</text><text x="68" y="966" class="body">Esar-Haddon, eveneens een zoon van</text><text x="68" y="1009" class="body">Sanherib, wordt koning.</text><text x="46" y="1102" class="note">De dood in Ninevé is een later afzonderlijk</text><text x="46" y="1138" class="note">moment, geen sterfgeval in het kamp bij</text><text x="46" y="1174" class="note">Jeruzalem.</text></svg>