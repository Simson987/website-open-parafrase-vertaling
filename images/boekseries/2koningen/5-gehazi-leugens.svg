<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Gehazi’s twee leugens</title><desc id="desc">De verzonnen aanleiding, het geschenk en de tweede ontkenning.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gehazi’s twee leugens</text><text x="44" y="113" class="ref">2 Koningen 5:20–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tegen Naäman</text><text x="68" y="241" class="body">Beweert door Elisa gestuurd te zijn</text><text x="68" y="284" class="body">voor twee nieuwe profetenleerlingen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het verkregene</text><text x="68" y="433" class="body">Ongeveer 68 kilo zilver en twee stel</text><text x="68" y="476" class="body">feestkleren, gedragen door twee</text><text x="68" y="519" class="body">dienaren.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De verberging</text><text x="68" y="668" class="body">Bergt alles thuis op en laat de mannen</text><text x="68" y="711" class="body">vertrekken.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Tegen Elisa</text><text x="68" y="860" class="body">Beweert nergens heen geweest te zijn.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het oordeel</text><text x="68" y="1009" class="body">Naämans melaatsheid zal aan hem en zijn</text><text x="68" y="1052" class="body">nakomelingen blijven kleven.</text><text x="46" y="1145" class="note">De twee profetenleerlingen zijn deel van</text><text x="46" y="1181" class="note">Gehazi’s verzonnen boodschap, niet twee</text><text x="46" y="1217" class="note">werkelijk aangekomen gasten.</text></svg>