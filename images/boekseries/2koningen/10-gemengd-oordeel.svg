<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Een gemengd oordeel over Jehu</title><desc id="desc">De positieve en negatieve onderdelen van het oordeel en de opvolging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een gemengd oordeel over Jehu</text><text x="44" y="113" class="ref">2 Koningen 10:28–36</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wel beëindigd</text><text x="68" y="241" class="body">De dienst van Baäl in Israël.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Niet beëindigd</text><text x="68" y="390" class="body">De gouden kalveren in Bethel en Dan en</text><text x="68" y="433" class="body">Jerobeams zonde.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De belofte</text><text x="68" y="582" class="body">Zijn zonen zullen tot het vierde</text><text x="68" y="625" class="body">geslacht op Israëls troon zitten.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het verlies</text><text x="68" y="774" class="body">Hazaël neemt gebied ten oosten van de</text><text x="68" y="817" class="body">Jordaan af: Gilead en Basan.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De opvolging</text><text x="68" y="966" class="body">Na 28 jaar regering volgt zijn zoon</text><text x="68" y="1009" class="body">Joahaz hem op.</text><text x="46" y="1102" class="note">De belofte over opvolging heft de kritiek op</text><text x="46" y="1138" class="note">Jehu’s onvolkomen trouw niet op.</text></svg>