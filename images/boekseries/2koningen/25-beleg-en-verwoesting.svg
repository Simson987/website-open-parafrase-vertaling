<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Beleg, bres en verwoesting</title><desc id="desc">De opeenvolgende data en onderscheiden vormen van verwoesting en wegvoering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beleg, bres en verwoesting</text><text x="44" y="113" class="ref">2 Koningen 25:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin van het beleg</text><text x="68" y="241" class="body">Zedekia’s negende jaar, tiende maand,</text><text x="68" y="284" class="body">tiende dag.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De bres</text><text x="68" y="433" class="body">In zijn elfde jaar; vierde maand,</text><text x="68" y="476" class="body">negende dag; honger en nachtelijke</text><text x="68" y="519" class="body">vlucht.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zedekia</text><text x="68" y="668" class="body">Gevangen bij Jericho; zonen gedood in</text><text x="68" y="711" class="body">Ribla; zelf blind en geboeid naar</text><text x="68" y="754" class="body">Babel.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De brand</text><text x="68" y="903" class="body">Vijfde maand, zevende dag; Nebuzaradan</text><text x="68" y="946" class="body">verbrandt tempel, paleis en huizen.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Daarna</text><text x="68" y="1095" class="body">Muren en koperwerk afgebroken;</text><text x="68" y="1138" class="body">wegvoering en executies in Ribla.</text><text x="46" y="1231" class="note">De val van de stad en de brand worden met</text><text x="46" y="1267" class="note">verschillende maanddata verteld.</text></svg>