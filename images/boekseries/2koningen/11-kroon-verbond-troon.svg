<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Kroon, verbond en troon</title><desc id="desc">De publieke gebeurtenissen met hun plaats en volgorde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kroon, verbond en troon</text><text x="44" y="113" class="ref">2 Koningen 11:12–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De kroning</text><text x="68" y="241" class="body">Kroon, getuigenis en zalving;</text><text x="68" y="284" class="body">toejuiching door het volk.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Athalia</text><text x="68" y="433" class="body">Komt op het geluid af; wordt buiten het</text><text x="68" y="476" class="body">huis van de HEERE gedood.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het verbond</text><text x="68" y="625" class="body">Tussen de HEERE, koning en volk; ook</text><text x="68" y="668" class="body">tussen koning en volk.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Baäls tempel</text><text x="68" y="817" class="body">Afgebroken; priester Mattan wordt</text><text x="68" y="860" class="body">gedood.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het paleis</text><text x="68" y="1009" class="body">Joas wordt naar beneden gebracht en</text><text x="68" y="1052" class="body">gaat op de koningstroon zitten.</text><text x="46" y="1145" class="note">De tekst onderscheidt de kroning in de</text><text x="46" y="1181" class="note">tempelomgeving van het latere zitten op de</text><text x="46" y="1217" class="note">paleistroon.</text></svg>