<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Oordeel en beeldspraak</title><desc id="desc">De drie beelden en hun plaats in het profetische oordeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oordeel en beeldspraak</text><text x="44" y="113" class="ref">2 Koningen 21:10–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanklacht</text><text x="68" y="241" class="body">Manasse brengt Juda verder op een</text><text x="68" y="284" class="body">dwaalweg dan de eerdere volken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Meetsnoer en paslood</text><text x="68" y="433" class="body">Samaria en Achabs huis worden</text><text x="68" y="476" class="body">maatstaven voor Jeruzalems oordeel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De schoongeveegde schaal</text><text x="68" y="625" class="body">Beeld van het wegnemen en omkeren van</text><text x="68" y="668" class="body">Jeruzalem.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De overlevering</text><text x="68" y="817" class="body">De rest van het erfdeel wordt buit van</text><text x="68" y="860" class="body">vijanden.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Onschuldig bloed</text><text x="68" y="1009" class="body">Het hoofdstuk noemt ook het vele</text><text x="68" y="1052" class="body">bloedvergieten van Manasse.</text><text x="46" y="1145" class="note">Meetsnoer, paslood en schaal zijn vergelijkingen</text><text x="46" y="1181" class="note">in de profetie; geen verslag van een bouwkundige</text><text x="46" y="1217" class="note">opmeting.</text></svg>