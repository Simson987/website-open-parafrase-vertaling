<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Na Josia’s dood</title><desc id="desc">De machtswisseling en naamsverandering onder Egyptische invloed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Na Josia’s dood</text><text x="44" y="113" class="ref">2 Koningen 23:29–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Megiddo</text><text x="68" y="241" class="body">Necho doodt Josia; dienaren brengen hem</text><text x="68" y="284" class="body">naar Jeruzalem.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Joahaz</text><text x="68" y="433" class="body">23 bij aantreden; drie maanden; door</text><text x="68" y="476" class="body">Necho gevangengezet en naar Egypte</text><text x="68" y="519" class="body">gebracht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Eljakim → Jojakim</text><text x="68" y="668" class="body">Ook zoon van Josia; Necho verandert</text><text x="68" y="711" class="body">zijn naam en maakt hem koning.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Jojakim</text><text x="68" y="860" class="body">25 bij aantreden; elf jaar; haalt</text><text x="68" y="903" class="body">belasting op om Egypte te betalen.</text><text x="46" y="996" class="note">Joahaz en Jojakim zijn verschillende zonen van</text><text x="46" y="1032" class="note">Josia. De nieuwe naam maakt Eljakim niet tot een</text><text x="46" y="1068" class="note">derde zoon.</text></svg>