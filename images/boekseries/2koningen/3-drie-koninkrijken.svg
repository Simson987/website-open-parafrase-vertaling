<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1154" viewBox="0 0 840 1154" role="img" aria-labelledby="title desc"><title id="title">Drie bondgenoten tegen Moab</title><desc id="desc">De vier partijen en de oorzaak van de terugtocht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1154" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie bondgenoten tegen Moab</text><text x="44" y="113" class="ref">2 Koningen 3:7–27</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Israël</text><text x="68" y="241" class="body">Joram, zoon van Achab.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Juda</text><text x="68" y="390" class="body">Josafat stemt in met de tocht.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Edom</text><text x="68" y="539" class="body">De koning van Edom trekt mee via de</text><text x="68" y="582" class="body">woestijnroute.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Moab</text><text x="68" y="731" class="body">Mesa komt na Achabs dood in opstand.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">De terugtocht</text><text x="68" y="880" class="body">Na Mesa’s offer van zijn oudste zoon op</text><text x="68" y="923" class="body">de muur keren de bondgenoten terug.</text><text x="46" y="1016" class="note">Het offer op de muur is Mesa’s daad. Het wordt</text><text x="46" y="1052" class="note">niet voorgesteld als Israëlitisch gebod of als</text><text x="46" y="1088" class="note">Elisas aanwijzing.</text></svg>