<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1405" viewBox="0 0 840 1405" role="img" aria-labelledby="title desc"><title id="title">Assyrië en het nieuwe altaar</title><desc id="desc">Buitenlandse afhankelijkheid en de opeenvolgende tempelwijzigingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1405" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Assyrië en het nieuwe altaar</text><text x="44" y="113" class="ref">2 Koningen 16:7–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achaz vraagt hulp</text><text x="68" y="241" class="body">Stuurt goud en zilver naar</text><text x="68" y="284" class="body">Tiglath-Pilezer.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Damaskus</text><text x="68" y="433" class="body">Assyrië verovert de stad, voert</text><text x="68" y="476" class="body">bewoners naar Kir en doodt Rezin.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het voorbeeld</text><text x="68" y="625" class="body">Achaz stuurt vanuit Damaskus het</text><text x="68" y="668" class="body">altaarontwerp aan Uria.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De verandering</text><text x="68" y="817" class="body">Het oude koperen altaar naar de</text><text x="68" y="860" class="body">noordkant; het nieuwe wordt het</text><text x="68" y="903" class="body">offeraltaar.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De overige ingrepen</text><text x="68" y="1052" class="body">Wasbekkens en zee van hun dragers;</text><text x="68" y="1095" class="body">gangen en koninklijke ingang aangepast;</text><text x="68" y="1138" class="body">Hizkia volgt later op.</text><text x="46" y="1231" class="note">De tekst keurt Achaz’ eerdere</text><text x="46" y="1267" class="note">kinderofferpraktijk in vers 3 af. Het</text><text x="46" y="1303" class="note">buitenlandse altaar is een andere latere</text><text x="46" y="1339" class="note">handeling.</text></svg>