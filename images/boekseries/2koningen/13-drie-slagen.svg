<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Drie slagen, drie overwinningen</title><desc id="desc">De twee pijlhandelingen en hun later genoemde vervulling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie slagen, drie overwinningen</text><text x="44" y="113" class="ref">2 Koningen 13:14–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De koning</text><text x="68" y="241" class="body">Joas van Israël bezoekt de stervende</text><text x="68" y="284" class="body">Elisa.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De eerste pijl</text><text x="68" y="433" class="body">Door het oostelijke venster:</text><text x="68" y="476" class="body">aankondiging van redding tegen Syrië.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De pijlen op de grond</text><text x="68" y="625" class="body">Joas slaat drie keer en stopt.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Elisa’s reactie</text><text x="68" y="774" class="body">Vijf of zes keer had volledige</text><text x="68" y="817" class="body">overwinning betekend; nu drie</text><text x="68" y="860" class="body">overwinningen.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De vervulling</text><text x="68" y="1009" class="body">Joas verslaat Benhadad, zoon van</text><text x="68" y="1052" class="body">Hazaël, drie keer en neemt steden</text><text x="68" y="1095" class="body">terug.</text><text x="46" y="1188" class="note">De zieke Elisa en de later levende man in zijn</text><text x="46" y="1224" class="note">graf zijn verschillende personen.</text></svg>