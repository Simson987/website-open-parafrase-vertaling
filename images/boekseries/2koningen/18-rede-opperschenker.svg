<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De rede van de opperschenker</title><desc id="desc">Sprekers, taalkeuze, propaganda en de bevolen stilte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De rede van de opperschenker</text><text x="44" y="113" class="ref">2 Koningen 18:17–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De drie Judeeërs</text><text x="68" y="241" class="body">Eljakim, zoon van Hilkia; Sebna; Joah,</text><text x="68" y="284" class="body">zoon van Asaf.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het vertrouwen aangevallen</text><text x="68" y="433" class="body">Egypte heet een geknakte rietstok;</text><text x="68" y="476" class="body">Hizkia’s hervorming wordt verdacht</text><text x="68" y="519" class="body">gemaakt.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De taal</text><text x="68" y="668" class="body">Zij vragen Aramees; hij roept juist</text><text x="68" y="711" class="body">Judees naar het volk op de muur.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De beloften en dreiging</text><text x="68" y="860" class="body">Eerst eigen voedsel, daarna wegvoering</text><text x="68" y="903" class="body">naar een ander land.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het antwoord</text><text x="68" y="1052" class="body">Het volk zwijgt op koninklijk bevel; de</text><text x="68" y="1095" class="body">drie doen verslag aan Hizkia.</text><text x="46" y="1188" class="note">De bewering dat de HEERE Assyrië opdracht gaf is</text><text x="46" y="1224" class="note">onderdeel van de vijandelijke rede, niet het</text><text x="46" y="1260" class="note">oordeel van de verteller.</text></svg>