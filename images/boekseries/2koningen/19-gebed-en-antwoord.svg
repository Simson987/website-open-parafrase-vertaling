<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">De brief, het gebed en antwoord</title><desc id="desc">Gebedsvraag, profetische beeldspraak, oogstjaren en bescherming van Jeruzalem.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De brief, het gebed en antwoord</text><text x="44" y="113" class="ref">2 Koningen 19:14–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De brief</text><text x="68" y="241" class="body">Hizkia legt Sanheribs woorden open in</text><text x="68" y="284" class="body">het huis van de HEERE.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het gebed</text><text x="68" y="433" class="body">Erkent dat mensenbeelden vernietigd</text><text x="68" y="476" class="body">zijn; vraagt redding opdat alle rijken</text><text x="68" y="519" class="body">God kennen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Jesaja’s bericht</text><text x="68" y="668" class="body">God heeft het gebed gehoord; de</text><text x="68" y="711" class="body">hoogmoed van Assyrië wordt beantwoord.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het oogstteken</text><text x="68" y="860" class="body">Eerst spontaan gewas, daarna nieuwe</text><text x="68" y="903" class="body">groei; in het derde jaar zaaien en</text><text x="68" y="946" class="body">oogsten.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De stadsbelofte</text><text x="68" y="1095" class="body">Sanherib zal de stad niet binnenkomen</text><text x="68" y="1138" class="body">en er geen pijl in schieten.</text><text x="46" y="1231" class="note">De dochter Sion en het wortelschieten van de</text><text x="46" y="1267" class="note">rest zijn beeldspraak in het profetische</text><text x="46" y="1303" class="note">antwoord.</text></svg>