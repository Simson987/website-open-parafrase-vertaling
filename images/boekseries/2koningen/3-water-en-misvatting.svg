<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Water en een misvatting</title><desc id="desc">Opdracht, voorziening en de verkeerde gevolgtrekking van Moab.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Water en een misvatting</text><text x="44" y="113" class="ref">2 Koningen 3:15–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De harpspeler</text><text x="68" y="241" class="body">Tijdens het spelen ontvangt Elisa het</text><text x="68" y="284" class="body">woord.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De opdracht</text><text x="68" y="433" class="body">Kuilen in het dal graven.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De belofte</text><text x="68" y="582" class="body">Geen wind of regen zien, maar toch</text><text x="68" y="625" class="body">water voor mensen en dieren.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De volgende morgen</text><text x="68" y="774" class="body">Water komt uit de richting van Edom.</text><rect x="42" y="832" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">De misvatting</text><text x="68" y="923" class="body">Moab ziet rood water in de ochtendzon</text><text x="68" y="966" class="body">en denkt dat de koningen elkaar</text><text x="68" y="1009" class="body">doodden.</text><text x="46" y="1102" class="note">Het water lijkt op bloed door de waarneming van</text><text x="46" y="1138" class="note">de Moabieten; de tekst noemt het geen werkelijk</text><text x="46" y="1174" class="note">bloedbad tussen de drie koningen.</text></svg>