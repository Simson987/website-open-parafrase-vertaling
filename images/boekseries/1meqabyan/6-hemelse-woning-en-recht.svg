<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Hemelse woning en recht</title><desc id="desc">Hemelse woning en recht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hemelse woning en recht</text><text x="44" y="113" class="ref">1 Meqabyan 6:2–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Woning · 2–10</text><text x="68" y="241" class="body">Abraham, Izak, Jakob, David, Salomo,</text><text x="68" y="284" class="body">Ezechiël; goud, zilver, hyacint, topaas</text><text x="68" y="327" class="body">en smaragd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Water en tuin · 7–9</text><text x="68" y="476" class="body">Levenswater, tent van licht, zuilen van</text><text x="68" y="519" class="body">Hermon; wijngaarden, olijven en geuren.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Rechtvaardigheid · 11–13</text><text x="68" y="668" class="body">Red onderdrukte, vreemdeling en wees;</text><text x="68" y="711" class="body">voed hongerige en geef dorstige</text><text x="68" y="754" class="body">drinken.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Verantwoording · 14–18</text><text x="68" y="903" class="body">Harde heersers verliezen eer; Schepper</text><text x="68" y="946" class="body">kent hart en hoort zuiver gebed.</text><text x="46" y="1039" class="note">De hemelse zaal en tuin zijn beschrijvingen van</text><text x="46" y="1075" class="note">hoop, onderscheiden van Sauls aardse verhaal.</text></svg>