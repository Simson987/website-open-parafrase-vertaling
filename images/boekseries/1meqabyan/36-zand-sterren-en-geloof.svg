<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Zand, sterren en geloof</title><desc id="desc">Zand, sterren en geloof met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zand, sterren en geloof</text><text x="44" y="113" class="ref">1 Meqabyan 36:39–46</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zand · 39–40,42</text><text x="68" y="241" class="body">In deze uitleg: zielen van zondaars bij</text><text x="68" y="284" class="body">opstanding en oordeel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sterren · 39,41</text><text x="68" y="433" class="body">In deze uitleg: rechtvaardigen schijnen</text><text x="68" y="476" class="body">in hemels koninkrijk.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Geloof · 43</text><text x="68" y="625" class="body">Abraham gelooft; Sara krijgt op hoge</text><text x="68" y="668" class="body">leeftijd Izak.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Slot · 44–46</text><text x="68" y="817" class="body">Goed gedaan: eeuwig leven; kwaad</text><text x="68" y="860" class="body">gedaan: eeuwig oordeel.</text><text x="46" y="953" class="note">Zand en sterren krijgen hier uitdrukkelijk</text><text x="46" y="989" class="note">verschillende betekenissen; die uitleg wordt</text><text x="46" y="1025" class="note">niet tot één algemene aantalsbelofte</text><text x="46" y="1061" class="note">vereenvoudigd.</text></svg>