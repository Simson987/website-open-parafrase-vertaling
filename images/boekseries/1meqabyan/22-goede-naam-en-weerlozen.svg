<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Goede naam en weerlozen</title><desc id="desc">Goede naam en weerlozen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Goede naam en weerlozen</text><text x="44" y="113" class="ref">1 Meqabyan 22:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herinnering · 1–5</text><text x="68" y="241" class="body">Goede en slechte heersers onderzoeken;</text><text x="68" y="284" class="body">zachtmoedig en eerlijk leven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Recht · 6–7</text><text x="68" y="433" class="body">Weduwe en wees redden; als vader voor</text><text x="68" y="476" class="body">de wees; tranen niet veroorzaken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vrede · 8</text><text x="68" y="625" class="body">Vrede zoeken en najagen; gebed wordt</text><text x="68" y="668" class="body">gehoord.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Rekenschap · 9–11</text><text x="68" y="817" class="body">Kwaad en verborgen schuilplaatsen</text><text x="68" y="860" class="body">ontkomen niet; eer voor wie eert.</text><text x="46" y="953" class="note">Deze aansporingen zijn onderwijs aan de lezer,</text><text x="46" y="989" class="note">geen opeenvolgende rechtszaken van één genoemde</text><text x="46" y="1025" class="note">koning.</text></svg>