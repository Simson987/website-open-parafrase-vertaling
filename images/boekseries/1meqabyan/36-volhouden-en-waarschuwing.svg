<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Volhouden en waarschuwing</title><desc id="desc">Volhouden en waarschuwing met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volhouden en waarschuwing</text><text x="44" y="113" class="ref">1 Meqabyan 36:1–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Heersers · 1–15</text><text x="68" y="241" class="body">Macedoniërs, Amalekieten en Ismaëliet</text><text x="68" y="284" class="body">aangesproken; zegen en oordeel</text><text x="68" y="327" class="body">verbonden aan daden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Voorbeelden · 16–22</text><text x="68" y="476" class="body">Job, Abraham, Mozes, Izak en Jakob;</text><text x="68" y="519" class="body">volhouden en kinderen onderwijzen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ondankbaarheid · 23–34</text><text x="68" y="668" class="body">Manna en blijvende kleren; toch</text><text x="68" y="711" class="body">afgoden: Kanaän, Baäl, Marya, Dagon,</text><text x="68" y="754" class="body">Apollon, Artemis, Rasion.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Herhaling · 35–38</text><text x="68" y="903" class="body">Benauwdheid → roepen → ontferming →</text><text x="68" y="946" class="body">nieuwe ontrouw; verbond met vaderen</text><text x="68" y="989" class="body">blijft genoemd.</text><text x="46" y="1082" class="note">De afgodennamen zijn de plaatselijke opsomming.</text><text x="46" y="1118" class="note">Kanaän wordt als uitgehouwen beeld genoemd.</text></svg>