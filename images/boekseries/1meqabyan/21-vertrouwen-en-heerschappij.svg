<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Vertrouwen en heerschappij</title><desc id="desc">Vertrouwen en heerschappij met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vertrouwen en heerschappij</text><text x="44" y="113" class="ref">1 Meqabyan 21:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorbeelden · 1–6</text><text x="68" y="241" class="body">David uit Sauls en Absaloms hand;</text><text x="68" y="284" class="body">Hizkia gered; Manasse gevangen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Keuze · 7–18</text><text x="68" y="433" class="body">Vertrouwen boven leger, paarden en</text><text x="68" y="476" class="body">rijkdom; gave en oordeel naar daden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Rentmeesterschap · 19–26</text><text x="68" y="625" class="body">Mens heeft gezag over dieren; koning</text><text x="68" y="668" class="body">blijft dienaar van Schepper.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gebed en erfdeel · 27–31</text><text x="68" y="817" class="body">Zuiver gebed; hemel en aarde als gave;</text><text x="68" y="860" class="body">Abraham, Izak, Jakob, David, Hizkia,</text><text x="68" y="903" class="body">Samuël.</text><text x="46" y="996" class="note">De tekst noemt bij Hizkia een hoogmoedige</text><text x="46" y="1032" class="note">Syriër; de naam van die vijand wordt hier niet</text><text x="46" y="1068" class="note">gegeven.</text></svg>