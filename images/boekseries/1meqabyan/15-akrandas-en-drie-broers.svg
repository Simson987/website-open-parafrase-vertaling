<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Akrandas en drie broers</title><desc id="desc">Akrandas en drie broers met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Akrandas en drie broers</text><text x="44" y="113" class="ref">1 Meqabyan 15:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dreiging · 1–7</text><text x="68" y="241" class="body">Akrandas van Midjan; leger uit Syrië,</text><text x="68" y="284" class="body">Cilicië en Damascus; Jordaan; schatting</text><text x="68" y="327" class="body">geëist.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Broers · 8–11</text><text x="68" y="476" class="body">Mabkyus, Maqabyus, Juda; horen rouw en</text><text x="68" y="519" class="body">besluiten tot bevrijding.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Strijd · 12–16</text><text x="68" y="668" class="body">Middagmaaltijd; koning gedood; vlucht</text><text x="68" y="711" class="body">over Jordaan; buit voor Israël.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Daarna · 17–18</text><text x="68" y="860" class="body">Korte trouw gevolgd door nieuw kwaad en</text><text x="68" y="903" class="body">geroofde oogsten en kudden.</text><text x="46" y="996" class="note">Deze drie broers hebben andere namen dan Abya,</text><text x="46" y="1032" class="note">Sela en Fentos uit hoofdstuk 3.</text></svg>