<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Drie namen, vijf broers</title><desc id="desc">Drie namen, vijf broers met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie namen, vijf broers</text><text x="44" y="113" class="ref">1 Meqabyan 3:1–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Genoemde drie · 1–19</text><text x="68" y="241" class="body">Abya, Sela, Fentos; belofte van</text><text x="68" y="284" class="body">opstanding; weigeren bij koning; 3</text><text x="68" y="327" class="body">dagen en nachten cel.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dieren · 20–27</text><text x="68" y="476" class="body">Luipaard, beer, leeuw buigen; keren</text><text x="68" y="519" class="body">tegen oppassers; koning vlucht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Twee jongere broers · 28–32</text><text x="68" y="668" class="body">Willen samen blijven en sterven; vijf</text><text x="68" y="711" class="body">broers worden opgesloten.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Einde · 33–38</text><text x="68" y="860" class="body">Na 3 dagen oven; zij sterven; engelen</text><text x="68" y="903" class="body">dragen zielen naar Abraham, Izak en</text><text x="68" y="946" class="body">Jakob.</text><text x="46" y="1039" class="note">De twee jongere broers blijven hier naamloos.</text><text x="46" y="1075" class="note">Hun komst maakt drie genoemde martelaren tot</text><text x="46" y="1111" class="note">vijf broers.</text></svg>