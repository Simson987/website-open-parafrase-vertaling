<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Wijngaard en verbond</title><desc id="desc">Wijngaard en verbond met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijngaard en verbond</text><text x="44" y="113" class="ref">1 Meqabyan 12:1–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wijngaard · 1–11</text><text x="68" y="241" class="body">Sodom en Gomorra als vergelijking;</text><text x="68" y="284" class="body">regen van hoogmoed; vrucht van onrecht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Afgodendienst · 10–23</text><text x="68" y="433" class="body">Baäl en Dagon; offers, wijn en wierook;</text><text x="68" y="476" class="body">dochter van Jeruzalem aangesproken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verbroken woord · 24–40</text><text x="68" y="625" class="body">Verwijt van ontrouw, hebzucht en</text><text x="68" y="668" class="body">onderdrukking; oordeel aangekondigd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Slot · 41–44</text><text x="68" y="817" class="body">Onrechtvaardigen treuren; wie woord</text><text x="68" y="860" class="body">houdt ontvangt zegen en rust.</text><text x="46" y="953" class="note">Dochter van Jeruzalem is de aangesproken</text><text x="46" y="989" class="note">gemeenschap. De wijngaardbeelden zijn geen</text><text x="46" y="1025" class="note">portret van één vrouw.</text></svg>