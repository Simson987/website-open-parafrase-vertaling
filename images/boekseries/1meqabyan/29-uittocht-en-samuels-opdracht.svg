<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Uittocht en Samuëls opdracht</title><desc id="desc">Uittocht en Samuëls opdracht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uittocht en Samuëls opdracht</text><text x="44" y="113" class="ref">1 Meqabyan 29:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Egypte · 1–4</text><text x="68" y="241" class="body">Tichelstenen zonder stro; Mozes en</text><text x="68" y="284" class="body">Aäron als hulp; Farao eindigt in zee.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aansporing · 5–11</text><text x="68" y="433" class="body">Goed besturen, liefhebben, vertrouwen</text><text x="68" y="476" class="body">en rechte wegen; genade na omkeer.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">David · 12–13</text><text x="68" y="625" class="body">Goliat, Saul en Absalom als gevaren</text><text x="68" y="668" class="body">waaruit hij gered wordt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Samuël · 14–17</text><text x="68" y="817" class="body">Als kind bij Eli; stelt koningen aan;</text><text x="68" y="860" class="body">zalft David, zoon van Isaï uit Juda.</text><text x="46" y="953" class="note">De rede wisselt voorbeelden uit het verleden af</text><text x="46" y="989" class="note">met directe aansporingen.</text></svg>