<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Reuzen, dagen en onderwijs</title><desc id="desc">Reuzen, dagen en onderwijs met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reuzen, dagen en onderwijs</text><text x="44" y="113" class="ref">1 Meqabyan 18:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rekenschap · 1</text><text x="68" y="241" class="body">Ieder verschijnt voor wat hij gedaan</text><text x="68" y="284" class="body">heeft.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Engelen en reuzen · 2–6</text><text x="68" y="433" class="body">Trots, overtreding en oordeel; kracht</text><text x="68" y="476" class="body">geeft geen vrijstelling.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Kortere dagen · 7–9</text><text x="68" y="625" class="body">Oorspronkelijk jaartal afgebroken;</text><text x="68" y="668" class="body">tekst verbindt verkorting aan</text><text x="68" y="711" class="body">overtreding.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vaderen · 10–12</text><text x="68" y="860" class="body">Goede levenswandel en onderwijs aan</text><text x="68" y="903" class="body">zonen én dochters.</text><text x="46" y="996" class="note">Het ontbrekende jaartal in vers 7 blijft open.</text><text x="46" y="1032" class="note">De levensduurverklaring is de uitleg van deze</text><text x="46" y="1068" class="note">tekst.</text></svg>