<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Hoogmoed, bedrog en dwang</title><desc id="desc">Hoogmoed, bedrog en dwang met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoogmoed, bedrog en dwang</text><text x="44" y="113" class="ref">1 Meqabyan 1:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Koning · 1–7</text><text x="68" y="241" class="body">Tsiruts’aidan vertrouwt op paarden,</text><text x="68" y="284" class="body">leger en afgoden; stelt priesters aan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bedrog · 8–13</text><text x="68" y="433" class="body">Priesters eten zelf; vorst denkt dat</text><text x="68" y="476" class="body">beelden leven en hem gemaakt hebben.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tempel · 16–24</text><text x="68" y="625" class="body">Man- en vrouwbeelden; brons, ijzer,</text><text x="68" y="668" class="body">lood; goud, zilver; voedsel en wijn.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dwang · 14–15,25–28</text><text x="68" y="817" class="body">Dreiging tegen weigeraars en hun bezit;</text><text x="68" y="860" class="body">onschuldig bloed als aanklacht.</text><text x="46" y="953" class="note">De scheppingsmacht van de afgoden is de bewering</text><text x="46" y="989" class="note">van de koning; de verteller wijst die af.</text></svg>