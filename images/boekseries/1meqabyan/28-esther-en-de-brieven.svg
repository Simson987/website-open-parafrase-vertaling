<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Esther en de brieven</title><desc id="desc">Esther en de brieven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Esther en de brieven</text><text x="44" y="113" class="ref">1 Meqabyan 28:38–49</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste bevel · 38–40</text><text x="68" y="241" class="body">Artaxerxes genoemd; 10.000</text><text x="68" y="284" class="body">zilverstukken; zegelbrief en bedreigde</text><text x="68" y="327" class="body">dag; India tot Ethiopië.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gebed · 41–44</text><text x="68" y="476" class="body">Mordechai bericht Esther; vasten en</text><text x="68" y="519" class="body">berouw; beiden rouwkleren en as.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Maaltijd · 45–46</text><text x="68" y="668" class="body">Esther vindt genade; koning en Haman</text><text x="68" y="711" class="body">komen; Hamans plan keert om.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Nieuwe brief · 47–49</text><text x="68" y="860" class="body">Joden met rust laten; geen slavernij,</text><text x="68" y="903" class="body">roof, onderdrukking of verwoesting.</text><text x="46" y="996" class="note">De tekst legt het eerste zilverplan bij</text><text x="46" y="1032" class="note">Artaxerxes; dit schema volgt die plaatselijke</text><text x="46" y="1068" class="note">formulering.</text></svg>