<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Manna, sterfelijkheid en stad</title><desc id="desc">Manna, sterfelijkheid en stad met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Manna, sterfelijkheid en stad</text><text x="44" y="113" class="ref">1 Meqabyan 33:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Manna · 1</text><text x="68" y="241" class="body">Brood van engelen; gegeven opdat volk</text><text x="68" y="284" class="body">rechtvaardig dient.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verwijt · 2–4</text><text x="68" y="433" class="body">Dienst verwaarloosd; oordeel en kortere</text><text x="68" y="476" class="body">dagen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Koning · 5–7</text><text x="68" y="625" class="body">Mens die vandaag leeft en morgen</text><text x="68" y="668" class="body">sterft; reden tegen hoogmoed.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Stad · 8–11</text><text x="68" y="817" class="body">Woning van licht, kronen en tronen voor</text><text x="68" y="860" class="body">wie Gods wil doet.</text><text x="46" y="953" class="note">Het brood wordt herinnerd als gave; de lichte</text><text x="46" y="989" class="note">stad is een toekomstverwachting.</text></svg>