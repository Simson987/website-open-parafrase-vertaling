<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Beelden van opstanding</title><desc id="desc">Beelden van opstanding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beelden van opstanding</text><text x="44" y="113" class="ref">1 Meqabyan 7:24–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aarde en geboorte · 24</text><text x="68" y="241" class="body">Aarde geeft terug; vergeleken met een</text><text x="68" y="284" class="body">schoot bij de bevalling.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wolken · 25</text><text x="68" y="433" class="body">Regen kan Gods bevel niet tegenhouden.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Woord · 26–30</text><text x="68" y="582" class="body">Leven door Gods woord; dood en leven,</text><text x="68" y="625" class="body">neerbrengen en verhogen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Beker · 31–33</text><text x="68" y="774" class="body">Aards rijk vergaat; beker tot eer of</text><text x="68" y="817" class="body">schande; aanstelling en afzetting.</text><text x="46" y="910" class="note">Dit zijn vergelijkingen en Schriftwoorden in een</text><text x="46" y="946" class="note">rede, geen gelijktijdige nieuwe gebeurtenissen.</text></svg>