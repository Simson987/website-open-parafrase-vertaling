<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Gezag en vergankelijkheid</title><desc id="desc">Gezag en vergankelijkheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gezag en vergankelijkheid</text><text x="44" y="113" class="ref">1 Meqabyan 25:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Omvang · 1–9</text><text x="68" y="241" class="body">Onder aarde, hemel en zee; slang, vis,</text><text x="68" y="284" class="body">vogel en dieren; Noba, Saba, Ethiopië,</text><text x="68" y="327" class="body">Hindeke.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zorg · 10–14</text><text x="68" y="476" class="body">Staf en schapen; wolken, gras en koren;</text><text x="68" y="519" class="body">gebed van weduwe en wees.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vergankelijk · 14–16</text><text x="68" y="668" class="body">Storm, wolk, vogel, mot, made, woord en</text><text x="68" y="711" class="body">schaduw verbeelden verdwijnende</text><text x="68" y="754" class="body">rijkdom.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Rechtvaardige rijkdom · 17–18</text><text x="68" y="903" class="body">Delen, kleden, loon betalen, recht en</text><text x="68" y="946" class="body">eerlijke maat; slotzin breekt af.</text><text x="46" y="1039" class="note">De namen Noba, Saba en Hindeke blijven zoals</text><text x="46" y="1075" class="note">geschreven. De herdersstaf verbeeldt Gods zorg.</text></svg>