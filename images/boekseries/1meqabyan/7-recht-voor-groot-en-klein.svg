<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Recht voor groot en klein</title><desc id="desc">Recht voor groot en klein met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Recht voor groot en klein</text><text x="44" y="113" class="ref">1 Meqabyan 7:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onder gezag · 1–6</text><text x="68" y="241" class="body">Ook koning heeft een Schepper boven</text><text x="68" y="284" class="body">zich; oordeel zonder aanzien des</text><text x="68" y="327" class="body">persoons.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Nabij woord · 7–13</text><text x="68" y="476" class="body">Vuur en water als keuze; woord niet</text><text x="68" y="519" class="body">onbereikbaar, maar nabij in mond en</text><text x="68" y="562" class="body">hand.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Geschil · 14–17</text><text x="68" y="711" class="body">Geen geschenk aannemen; onschuldige</text><text x="68" y="754" class="body">niet onderdrukken; rekenschap bij</text><text x="68" y="797" class="body">opstanding.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Trots en oordeel · 18–23</text><text x="68" y="946" class="body">Leger en muziek voeden trots; rijk en</text><text x="68" y="989" class="body">arm staan samen; boeken gaan open.</text><text x="46" y="1082" class="note">Het vuur en water zijn een keuzevergelijking; de</text><text x="46" y="1118" class="note">hemelse rechtszaal verbeeldt verantwoording.</text></svg>