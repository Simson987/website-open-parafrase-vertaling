<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Verbond, gebod en kalf</title><desc id="desc">Verbond, gebod en kalf met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verbond, gebod en kalf</text><text x="44" y="113" class="ref">1 Meqabyan 14:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vloed · 1–3</text><text x="68" y="241" class="body">Ark en verbond met Noach; geen tweede</text><text x="68" y="284" class="body">watervloed; voedsel, regen en goede</text><text x="68" y="327" class="body">levenswandel.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Geboden · 4–10</text><text x="68" y="476" class="body">God en naaste liefhebben; geen afgoden,</text><text x="68" y="519" class="body">overspel, moord, diefstal, leugen of</text><text x="68" y="562" class="body">begeerte.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Kalf · 11–17</text><text x="68" y="711" class="body">Horeb; Mozes en Jozua dalen af; gejoel</text><text x="68" y="754" class="body">om wijn; beeld vermalen in bron.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Erfenis en hoop · 18–23</text><text x="68" y="903" class="body">Land melk en honing; tuin van vreugde;</text><text x="68" y="946" class="body">nieuwe onderdrukking na ontrouw.</text><text x="46" y="1039" class="note">Deze vertelling zegt dat het beeld in een bron</text><text x="46" y="1075" class="note">wordt geworpen. De bron wordt niet stilzwijgend</text><text x="46" y="1111" class="note">een andere waterplaats.</text></svg>