<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Saul, Samuël en David</title><desc id="desc">Saul, Samuël en David met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Saul, Samuël en David</text><text x="44" y="113" class="ref">1 Meqabyan 6:19–37</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bevel · 19–23</text><text x="68" y="241" class="body">Amalek; Saul spaart koning en anderen;</text><text x="68" y="284" class="body">opdracht om David, zoon van Isaï, te</text><text x="68" y="327" class="body">zalven.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tafel · 24–29</text><text x="68" y="476" class="body">Agag links van Saul; Samuël spreekt;</text><text x="68" y="519" class="body">Saul grijpt kleed en het scheurt.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Afwijzing · 30–33</text><text x="68" y="668" class="body">Koninkrijk gescheurd; verzoek om eer</text><text x="68" y="711" class="body">afgewezen; Agag wordt gedood.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Huizen · 34–37</text><text x="68" y="860" class="body">Sauls huis vernederd; Davids huis</text><text x="68" y="903" class="body">verhoogd; verteller verbindt recht aan</text><text x="68" y="946" class="body">oordeel.</text><text x="46" y="1039" class="note">Dit schema volgt de argumentatie en</text><text x="46" y="1075" class="note">geweldsopvatting van de tekst; de doding wordt</text><text x="46" y="1111" class="note">zakelijk benoemd.</text></svg>