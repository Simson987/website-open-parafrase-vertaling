<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Plaatsen, lamp en wijnstok</title><desc id="desc">Plaatsen, lamp en wijnstok met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plaatsen, lamp en wijnstok</text><text x="44" y="113" class="ref">1 Meqabyan 11:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Plaatsen · 1–2</text><text x="68" y="241" class="body">Hermon, Zebulon, Edomia, Tyrus, Sidon</text><text x="68" y="284" class="body">en dochters van Juda in de aanklacht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jeruzalem · 3–5</text><text x="68" y="433" class="body">Bij opstanding komt schande aan licht;</text><text x="68" y="476" class="body">lamp van Gods wijsheid.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wijnstok · 6–7</text><text x="68" y="625" class="body">Sodom en Gomorra; bittere trossen als</text><text x="68" y="668" class="body">beeld van daden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wijn · 8</text><text x="68" y="817" class="body">Vergif van draak en adder als</text><text x="68" y="860" class="body">vergelijking.</text><text x="46" y="953" class="note">De wijnstok en lamp zijn beeldspraak in een</text><text x="46" y="989" class="note">aanklacht, geen verslag van een echte</text><text x="46" y="1025" class="note">gifproductie.</text></svg>