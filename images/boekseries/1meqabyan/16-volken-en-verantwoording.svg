<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Volken en verantwoording</title><desc id="desc">Volken en verantwoording met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volken en verantwoording</text><text x="44" y="113" class="ref">1 Meqabyan 16:1–9</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste reeks · 1–2</text><text x="68" y="241" class="body">Tyrus, Sidon, overkant Jordaan, Gilead,</text><text x="68" y="284" class="body">Karan, Kanaänieten, Jebusieten,</text><text x="68" y="327" class="body">Girgasieten, Edom, Amalek.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Onderscheid · 3–5</text><text x="68" y="476" class="body">Sommigen leven goed en kennen God;</text><text x="68" y="519" class="body">anderen niet; Ameneser, koning van</text><text x="68" y="562" class="body">Syrië genoemd.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Tweede reeks · 6–8</text><text x="68" y="711" class="body">Gilead, Gelabuhe, Samaria, Patos,</text><text x="68" y="754" class="body">Arabië, Medië, Partus, Siwsigya,</text><text x="68" y="797" class="body">Kappadocië.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Tegen stad · 9</text><text x="68" y="946" class="body">Cesarea, Gilead en Amalek; hemelse</text><text x="68" y="989" class="body">dienst als slotbeeld.</text><text x="46" y="1082" class="note">De plaatselijke namen zijn ongewijzigd; de tekst</text><text x="46" y="1118" class="note">noemt binnen de volken zowel goede als kwade</text><text x="46" y="1154" class="note">levenswandel.</text></svg>