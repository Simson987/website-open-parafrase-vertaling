<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Gaven en bewaring</title><desc id="desc">Gaven en bewaring met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gaven en bewaring</text><text x="44" y="113" class="ref">1 Meqabyan 31:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gaven · 1–3</text><text x="68" y="241" class="body">David: gunst; Salomo: wijsheid; Hizkia:</text><text x="68" y="284" class="body">extra jaren; Simson: kracht en zwakte.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verkorting · 3</text><text x="68" y="433" class="body">Goliats dagen korter.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bewaring · 4–6</text><text x="68" y="582" class="body">David gered uit Goliats, Sauls en</text><text x="68" y="625" class="body">andere tegenstanders hand; gebod</text><text x="68" y="668" class="body">bewaren.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Erfdeel · 7</text><text x="68" y="817" class="body">Zuiver en licht land van de vaderen.</text><text x="46" y="910" class="note">Dit is een reeks voorbeelden van Gods gave, geen</text><text x="46" y="946" class="note">chronologische koningslijst.</text></svg>