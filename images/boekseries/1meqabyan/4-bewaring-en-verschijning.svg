<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Bewaring en verschijning</title><desc id="desc">Bewaring en verschijning met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bewaring en verschijning</text><text x="44" y="113" class="ref">1 Meqabyan 4:1–37</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lichamen · 1–7</text><text x="68" y="241" class="body">Vuur en zee vernietigen niet; dieren</text><text x="68" y="284" class="body">raken niet; vogels beschutten; vijf</text><text x="68" y="327" class="body">begraven.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Nacht · 8–18</text><text x="68" y="476" class="body">Koning bang; martelaren verklaren dat</text><text x="68" y="519" class="body">zij leven en weigeren eigen vergelding.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Oproep · 19–28</text><text x="68" y="668" class="body">Afgoden kunnen niets; keer terug tot</text><text x="68" y="711" class="body">God; verschijning verdwijnt.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Les · 29–37</text><text x="68" y="860" class="body">Koning blijft afdwalen; koningschap als</text><text x="68" y="903" class="body">proef; groot en klein aan Schepper</text><text x="68" y="946" class="body">gebonden.</text><text x="46" y="1039" class="note">Lichamen, zielen en nachtelijke verschijning</text><text x="46" y="1075" class="note">zijn verschillende lagen van het verhaal.</text></svg>