<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Hoogmoedige koningen</title><desc id="desc">Hoogmoedige koningen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoogmoedige koningen</text><text x="44" y="113" class="ref">1 Meqabyan 5:1–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Re’itawi · 1</text><text x="68" y="241" class="body">Verheft zichzelf en sterft plotseling.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Nimrod · 2</text><text x="68" y="390" class="body">IJzeren bed wegens kracht; door God</text><text x="68" y="433" class="body">neergeslagen.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Nebukadnezar · 3–5</text><text x="68" y="582" class="body">Claimt zonsopgang; 7 jaar bij dieren;</text><text x="68" y="625" class="body">erkent Schepper; krijgt koninkrijk</text><text x="68" y="668" class="body">terug.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tsiruts’aidan · 7–14</text><text x="68" y="817" class="body">Aangesproken als mens en stof; hoogmoed</text><text x="68" y="860" class="body">leidt niet tot goddelijkheid.</text><text x="46" y="953" class="note">De ijzeren bednaam blijft Nimrod zoals hier</text><text x="46" y="989" class="note">geschreven; geen naam uit een ander boek</text><text x="46" y="1025" class="note">ingevoegd.</text></svg>