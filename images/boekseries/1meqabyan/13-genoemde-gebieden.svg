<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Genoemde gebieden</title><desc id="desc">Genoemde gebieden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Genoemde gebieden</text><text x="44" y="113" class="ref">1 Meqabyan 13:1–3,19–24</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin · 1</text><text x="68" y="241" class="body">Tyrus, Sidon en streken van Juda.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Reeks · 3</text><text x="68" y="390" class="body">Kafarnaüm, Samaria, Galilea, Syrië,</text><text x="68" y="433" class="body">Damascus, Cyprus, Achaje,</text><text x="68" y="476" class="body">Jordaanstreek.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Herinnering · 19</text><text x="68" y="625" class="body">Horeb, Massa, Sinaï en Amalek.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Uittocht · 20–24</text><text x="68" y="774" class="body">Erfdeel, Egypte, zee en Sinaï in</text><text x="68" y="817" class="body">terugblik.</text><text x="46" y="910" class="note">Deze reeksen zijn tekstverbanden en geen</text><text x="46" y="946" class="note">aaneengesloten reisroute. Sablanjos blijft de</text><text x="46" y="982" class="note">naam uit vers 3.</text></svg>