<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Verleiding en overdracht</title><desc id="desc">Verleiding en overdracht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verleiding en overdracht</text><text x="44" y="113" class="ref">1 Meqabyan 19:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kaïns huis · 1–5</text><text x="68" y="241" class="body">Lier, trom, fluit, luit; vrouw van</text><text x="68" y="284" class="body">Abel; dal Kefaz richting Arabië;</text><text x="68" y="327" class="body">engelen en dochters.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Adam en Eva · 6–10</text><text x="68" y="476" class="body">Verleiding door belofte als goden te</text><text x="68" y="519" class="body">worden; hoogmoed en kortere dagen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Onderwijs · 11–15</text><text x="68" y="668" class="body">Goed doen én het aan kinderen</text><text x="68" y="711" class="body">vertellen; volgende generatie leert</text><text x="68" y="754" class="body">opnieuw.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Barmhartigheid · 16–17</text><text x="68" y="903" class="body">Gebed gehoord; toorn niet volledig</text><text x="68" y="946" class="body">ontbrand.</text><text x="46" y="1039" class="note">De aangehaalde familiegeschiedenis wordt</text><text x="46" y="1075" class="note">weergegeven zoals dit hoofdstuk haar vertelt;</text><text x="46" y="1111" class="note">ontbrekende eigennamen worden niet toegevoegd.</text></svg>