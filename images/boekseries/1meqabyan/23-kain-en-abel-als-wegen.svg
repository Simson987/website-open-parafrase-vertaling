<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Kaïn en Abel als wegen</title><desc id="desc">Kaïn en Abel als wegen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kaïn en Abel als wegen</text><text x="44" y="113" class="ref">1 Meqabyan 23:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kaïn · 1–2</text><text x="68" y="241" class="body">Doodt argeloze broer; jaloezie om een</text><text x="68" y="284" class="body">vrouw zoals hier verteld.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Abel · 3–4</text><text x="68" y="433" class="body">Zachtmoedig als lam; voorbeeld voor wie</text><text x="68" y="476" class="body">God liefheeft.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Openbaarheid · 5–6</text><text x="68" y="625" class="body">Geschrift op nek en schouders als beeld</text><text x="68" y="668" class="body">van openbaar gemaakte daden.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Uitspraak · 7</text><text x="68" y="817" class="body">Oordeel over onrecht aangekondigd.</text><text x="46" y="910" class="note">Abels lam is een vergelijking van</text><text x="46" y="946" class="note">zachtmoedigheid; het schema houdt dit apart van</text><text x="46" y="982" class="note">de moordvertelling.</text></svg>