<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Natuurbeelden van opstanding</title><desc id="desc">Natuurbeelden van opstanding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Natuurbeelden van opstanding</text><text x="44" y="113" class="ref">1 Meqabyan 8:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Boom · 1–5</text><text x="68" y="241" class="body">Wortel, aarde, water, wind en zon;</text><text x="68" y="284" class="body">groei en vrucht als vergelijking.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verzameling · 6–15</text><text x="68" y="433" class="body">Stof, dauw, wind, warmte en ziel weer</text><text x="68" y="476" class="body">samen; Ezechiël en de vier winden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nacht en ochtend · 16–21</text><text x="68" y="625" class="body">Slapen en opstaan; ochtendlicht en</text><text x="68" y="668" class="body">nieuwe wereld.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zaad en vrucht · 22–32</text><text x="68" y="817" class="body">Tarwe, gerst, gierst, komijn; vijg,</text><text x="68" y="860" class="body">amandel, noot, wijnstok; ieder eigen</text><text x="68" y="903" class="body">vrucht.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Dauw · 33–35</text><text x="68" y="1052" class="body">Ceder Libanon en dauw Hermon;</text><text x="68" y="1095" class="body">jeneverstruik en winterregen;</text><text x="68" y="1138" class="body">levensdauw.</text><text x="46" y="1231" class="note">De tekst geeft theologische vergelijkingen; geen</text><text x="46" y="1267" class="note">natuurkundig model van het ontstaan van een</text><text x="46" y="1303" class="note">ziel.</text></svg>