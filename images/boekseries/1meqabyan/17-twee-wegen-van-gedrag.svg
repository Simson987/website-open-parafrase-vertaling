<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Twee wegen van gedrag</title><desc id="desc">Twee wegen van gedrag met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee wegen van gedrag</text><text x="44" y="113" class="ref">1 Meqabyan 17:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kwade weg · 1–5</text><text x="68" y="241" class="body">Edom en Amalek als voorbeeld; roof,</text><text x="68" y="284" class="body">hebzucht, bedrog, onrecht en geweld.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Goede weg · 6</text><text x="68" y="433" class="body">Nederigheid, zachtmoedigheid,</text><text x="68" y="476" class="body">naastenliefde, broederliefde en vrede.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Praktijk · 7</text><text x="68" y="625" class="body">Niemand voortrekken; geen</text><text x="68" y="668" class="body">onderdrukking, geweld of bedrog.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Waarschuwing · 8</text><text x="68" y="817" class="body">Ruzie en verleiding voeren naar</text><text x="68" y="860" class="body">oordeel.</text><text x="46" y="953" class="note">Sebelyanos in vers 3 en Seblanyos in vers 5 zijn</text><text x="46" y="989" class="note">de twee plaatselijke schrijfwijzen.</text></svg>