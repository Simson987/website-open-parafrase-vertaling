<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Dauw, bazuin en opstanding</title><desc id="desc">Dauw, bazuin en opstanding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dauw, bazuin en opstanding</text><text x="44" y="113" class="ref">1 Meqabyan 9:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Landschappen · 1–2</text><text x="68" y="241" class="body">Gilboa, Libanon, Gilead en Elam hebben</text><text x="68" y="284" class="body">regen nodig voor groen en dieren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aanklacht · 3–6</text><text x="68" y="433" class="body">Opstand en afgodendienst; Cyprus,</text><text x="68" y="476" class="body">Damascus, Athene en Meden genoemd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bazuin · 7–8</text><text x="68" y="625" class="body">Michaël de aartsengel blaast bij</text><text x="68" y="668" class="body">opstanding.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Verandering · 9–10</text><text x="68" y="817" class="body">Bergen vlak, diepten droog, effen weg;</text><text x="68" y="860" class="body">opstanding voor alles wat leeft.</text><text x="46" y="953" class="note">De regenbeelden leiden naar de verwachting van</text><text x="46" y="989" class="note">opstanding; de plaatsnamen vormen geen</text><text x="46" y="1025" class="note">reisroute.</text></svg>