<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Trots, tekenen en herinnering</title><desc id="desc">Trots, tekenen en herinnering met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Trots, tekenen en herinnering</text><text x="44" y="113" class="ref">1 Meqabyan 13:1–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Trotse tegenstander · 1–10</text><text x="68" y="241" class="body">Zoon van verderf, beelden en onrecht;</text><text x="68" y="284" class="body">verduisterde zon, maan en vallende</text><text x="68" y="327" class="body">sterren.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Morgenster · 11–18</text><text x="68" y="476" class="body">Verhoging boven hemel en sterren;</text><text x="68" y="519" class="body">vernedering wegens hoogmoed;</text><text x="68" y="562" class="body">bescherming van wees en weduwe.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Israël · 19–20</text><text x="68" y="711" class="body">Horeb, Massa, Sinaï, Amalek en</text><text x="68" y="754" class="body">verspieders; angst voor sterke muren.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Zorg · 21–26</text><text x="68" y="903" class="body">Wolk en vuurkolom, engel bij zee en 40</text><text x="68" y="946" class="body">jaar manna; toch verzet.</text><text x="46" y="1039" class="note">Voorspelling, morgensterbeeld en herinnering aan</text><text x="46" y="1075" class="note">de uittocht zijn afzonderlijke delen van de</text><text x="46" y="1111" class="note">rede.</text></svg>