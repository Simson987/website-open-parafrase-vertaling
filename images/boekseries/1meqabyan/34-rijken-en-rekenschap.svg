<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Rijken en rekenschap</title><desc id="desc">Rijken en rekenschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rijken en rekenschap</text><text x="44" y="113" class="ref">1 Meqabyan 34:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vergelijkingen · 1–2</text><text x="68" y="241" class="body">Rome sterker dan Macedonië, Ninevé,</text><text x="68" y="284" class="body">Perzië; Ethiopië dan Alexandrië; Moab</text><text x="68" y="327" class="body">dan Amalek.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Onrust · 3–7</text><text x="68" y="476" class="body">Rijk tegen rijk; honger, pest,</text><text x="68" y="519" class="body">aardbeving, droogte; dag als bliksem.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Genoemde gebieden · 8–13</text><text x="68" y="668" class="body">Juda, Cyprus, Samaria, Damascus,</text><text x="68" y="711" class="body">Babylon, Arabië, India, Nubië, Seba,</text><text x="68" y="754" class="body">Egypte, Ethiopië.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Inzicht en toets · 14–18</text><text x="68" y="903" class="body">Daniël en Gods Geest; verborgen daden</text><text x="68" y="946" class="body">openbaar; goud en zilver als</text><text x="68" y="989" class="body">vergelijking.</text><text x="46" y="1082" class="note">De sterkteverhoudingen en plaatsnamen volgen de</text><text x="46" y="1118" class="note">voorspelling in de tekst, niet een moderne</text><text x="46" y="1154" class="note">staatkundige ranglijst.</text></svg>