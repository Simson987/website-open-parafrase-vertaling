<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Meqabyos en de berg</title><desc id="desc">Meqabyos en de berg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Meqabyos en de berg</text><text x="44" y="113" class="ref">1 Meqabyan 2:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin · 1–2</text><text x="68" y="241" class="body">Meqabyos uit Benjamin; vers 2 breekt</text><text x="68" y="284" class="body">af.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Confrontatie · 3–13</text><text x="68" y="433" class="body">Vier vorsten met soldaten; weigering;</text><text x="68" y="476" class="body">sterke jongemannen ontkomen naar berg.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Stad · 14–16</text><text x="68" y="625" class="body">Soldaten dreigen; inwoners roepen</text><text x="68" y="668" class="body">omhoog en huilen samen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gebed · 17–28</text><text x="68" y="817" class="body">Naar oosten; Schepper belijden;</text><text x="68" y="860" class="body">bereidheid tot sterven; verschijning</text><text x="68" y="903" class="body">afgebroken.</text><text x="46" y="996" class="note">De afgebroken zinnen worden niet aangevuld met</text><text x="46" y="1032" class="note">namen of gebeurtenissen uit andere versies.</text></svg>