<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Vaderen en herhaalde redding</title><desc id="desc">Vaderen en herhaalde redding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vaderen en herhaalde redding</text><text x="44" y="113" class="ref">1 Meqabyan 28:1–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Overdracht · 1–12</text><text x="68" y="241" class="body">Kaïn, Abel, Set en Noach; kinderen</text><text x="68" y="284" class="body">onderwijzen; ook afgoderij.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verbond · 13–21</text><text x="68" y="433" class="body">Abraham, Izak, Jakob; erfdeel, koningen</text><text x="68" y="476" class="body">en priesters; voedsel en jonge raven.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Genoemde redders · 23–33</text><text x="68" y="625" class="body">Profeten en richters; David, Jefta,</text><text x="68" y="668" class="body">Gideon, Simson, Debora en Barak, Judit,</text><text x="68" y="711" class="body">Mattatias en zonen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Achimelech · 34–37</text><text x="68" y="860" class="body">Reus gedood; vlucht tot Jabbok; daarna</text><text x="68" y="903" class="body">nieuwe ontrouw en Chaldeeuwse</text><text x="68" y="946" class="body">gevangenschap.</text><text x="46" y="1039" class="note">De redders staan in de volgorde van dit</text><text x="46" y="1075" class="note">hoofdstuk, niet in een uit andere boeken</text><text x="46" y="1111" class="note">gereconstrueerde tijdlijn.</text></svg>