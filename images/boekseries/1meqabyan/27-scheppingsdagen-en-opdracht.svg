<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Scheppingsdagen en opdracht</title><desc id="desc">Scheppingsdagen en opdracht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Scheppingsdagen en opdracht</text><text x="44" y="113" class="ref">1 Meqabyan 27:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin · 1–5</text><text x="68" y="241" class="body">Licht en donker; hemel als tentkleed;</text><text x="68" y="284" class="body">wateren en zand als grens.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dag 3 en 4 · 6–9</text><text x="68" y="433" class="body">Gewassen en bomen; zon, maan en sterren</text><text x="68" y="476" class="body">scheiden dag en nacht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dag 5 en 6 · 10–13</text><text x="68" y="625" class="body">Waterdieren en vogels; landdieren;</text><text x="68" y="668" class="body">daarna Adam naar Gods beeld.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tuin en arbeid · 14–20</text><text x="68" y="817" class="body">Bewerken en prijzen; verbod; Eva en</text><text x="68" y="860" class="body">Adam eten; buiten tuin doornen en</text><text x="68" y="903" class="body">arbeid.</text><text x="46" y="996" class="note">De scheppingsvoorstelling volgt de beeldtaal van</text><text x="46" y="1032" class="note">deze tekst; geen moderne kosmologische</text><text x="46" y="1068" class="note">doorsnede.</text></svg>