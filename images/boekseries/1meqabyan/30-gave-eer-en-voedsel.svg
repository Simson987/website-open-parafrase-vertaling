<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Gave, eer en voedsel</title><desc id="desc">Gave, eer en voedsel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gave, eer en voedsel</text><text x="44" y="113" class="ref">1 Meqabyan 30:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sauls huis · 1–8</text><text x="68" y="241" class="body">Verwerping wegens overtreding; gave van</text><text x="68" y="284" class="body">heerschappij niet vanzelfsprekend.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eer · 9–11</text><text x="68" y="433" class="body">Schepper stelt vast, oordeelt, doodt en</text><text x="68" y="476" class="body">maakt levend.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Mensen · 12</text><text x="68" y="625" class="body">Voedsel voor arme en rijke.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Dieren · 13–16</text><text x="68" y="774" class="body">Vee, vogels, vissen, slangen,</text><text x="68" y="817" class="body">zeemonsters, krokodillen, ingota’s,</text><text x="68" y="860" class="body">nijlpaarden en gehoornde dieren.</text><text x="46" y="953" class="note">Ingota’s blijft de plaatselijke benaming; er</text><text x="46" y="989" class="note">wordt geen onbewezen diersoort aan gekoppeld.</text></svg>