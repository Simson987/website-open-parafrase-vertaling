<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Grenzen aan hun macht</title><desc id="desc">Grenzen aan hun macht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Grenzen aan hun macht</text><text x="44" y="113" class="ref">Openbaring 9:4–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geen schade aan planten</text><text x="68" y="241" class="body">Gras, groen gewas en bomen mogen niet</text><text x="68" y="284" class="body">getroffen worden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wie worden getroffen?</text><text x="68" y="433" class="body">Mensen zonder het zegel van God op hun</text><text x="68" y="476" class="body">voorhoofd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Duur en grens</text><text x="68" y="625" class="body">Vijf maanden pijnigen; geen macht om te</text><text x="68" y="668" class="body">doden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Twee namen van hun koning</text><text x="68" y="817" class="body">De engel van de afgrond: Abaddon in het</text><text x="68" y="860" class="body">Hebreeuws, Apollyon in het Grieks.</text><text x="46" y="953" class="note">Dit beschrijft het visioen; geen identificatie</text><text x="46" y="989" class="note">met een hedendaags volk of wapen.</text></svg>