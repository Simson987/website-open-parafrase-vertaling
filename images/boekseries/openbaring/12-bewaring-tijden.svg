<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De vrouw wordt bewaard</title><desc id="desc">De vrouw wordt bewaard met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vrouw wordt bewaard</text><text x="44" y="113" class="ref">Openbaring 12:6,14–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste tijdsaanduiding · vers 6</text><text x="68" y="241" class="body">In de woestijn wordt zij 1260 dagen</text><text x="68" y="284" class="body">gevoed.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede tijdsaanduiding · vers 14</text><text x="68" y="433" class="body">Een tijd en tijden en een halve tijd,</text><text x="68" y="476" class="body">buiten het zicht van de slang.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De rivier · vers 15–16</text><text x="68" y="625" class="body">De slang spuwt water; de aarde slokt</text><text x="68" y="668" class="body">het op.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het overige nageslacht · vers 17</text><text x="68" y="817" class="body">Bewaart Gods geboden en heeft het</text><text x="68" y="860" class="body">getuigenis van Jezus.</text><text x="46" y="953" class="note">Beide tijdsaanduidingen blijven in de woorden</text><text x="46" y="989" class="note">van dit hoofdstuk staan.</text></svg>