<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Gebed en vuur bij het altaar</title><desc id="desc">Gebed en vuur bij het altaar met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed en vuur bij het altaar</text><text x="44" y="113" class="ref">Openbaring 8:3–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een andere engel</text><text x="68" y="241" class="body">Staat met een gouden wierookvat bij het</text><text x="68" y="284" class="body">gouden altaar vóór de troon.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wierook en gebeden</text><text x="68" y="433" class="body">Veel wierook wordt gegeven om te</text><text x="68" y="476" class="body">offeren met de gebeden van alle</text><text x="68" y="519" class="body">heiligen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De rook stijgt op</text><text x="68" y="668" class="body">De wierook met de gebeden stijgt uit de</text><text x="68" y="711" class="body">hand van de engel op vóór God.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vuur naar de aarde</text><text x="68" y="860" class="body">Het vat wordt met altaarvuur gevuld en</text><text x="68" y="903" class="body">op aarde geworpen; stemmen, donder,</text><text x="68" y="946" class="body">bliksem en aardbeving volgen.</text><text x="46" y="1039" class="note">De volgorde volgt het visioen; er wordt geen</text><text x="46" y="1075" class="note">moderne gebeurtenis aan gekoppeld.</text></svg>