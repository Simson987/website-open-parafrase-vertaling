<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wie prijzen, en waarom?</title><desc id="desc">Wie prijzen, en waarom? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie prijzen, en waarom?</text><text x="44" y="113" class="ref">Openbaring 5:8–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wezens en oudsten · vers 8–10</text><text x="68" y="241" class="body">Een nieuw lied: het Lam kocht mensen</text><text x="68" y="284" class="body">uit elke stam, taal, volk en natie.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Veel engelen · vers 11–12</text><text x="68" y="433" class="body">Kracht, rijkdom, wijsheid, sterkte,</text><text x="68" y="476" class="body">eer, heerlijkheid en dank.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Elk schepsel · vers 13</text><text x="68" y="625" class="body">Dank, eer, heerlijkheid en kracht aan</text><text x="68" y="668" class="body">Hem op de troon en het Lam.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het antwoord · vers 14</text><text x="68" y="817" class="body">De vier wezens zeggen amen; de oudsten</text><text x="68" y="860" class="body">aanbidden.</text><text x="46" y="953" class="note">De gouden schalen vol reukwerk worden in vers 8</text><text x="46" y="989" class="note">uitgelegd als de gebeden van de heiligen.</text></svg>