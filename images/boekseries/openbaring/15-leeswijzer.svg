<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Lied en zeven schalen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lied en zeven schalen</text><text x="44" y="113" class="ref">Openbaring 15:1–8</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–4 · Teken en lied</text><text x="68" y="241" class="body">Zeven engelen; overwinnaars bij de</text><text x="68" y="284" class="body">glazen zee zingen het lied van Mozes en</text><text x="68" y="327" class="body">van het Lam.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">5–7 · Uit de tempel</text><text x="68" y="476" class="body">Zeven engelen in glanzend linnen</text><text x="68" y="519" class="body">ontvangen zeven gouden schalen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">8 · De tempel vol rook</text><text x="68" y="668" class="body">Niemand kan naar binnen tot de zeven</text><text x="68" y="711" class="body">plagen voorbij zijn.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>