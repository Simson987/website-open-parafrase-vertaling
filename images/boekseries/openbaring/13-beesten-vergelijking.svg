<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Twee beesten onderscheiden</title><desc id="desc">Twee beesten onderscheiden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee beesten onderscheiden</text><text x="44" y="113" class="ref">Openbaring 13:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uit de zee · vers 1–2</text><text x="68" y="241" class="body">Zeven koppen, tien horens, tien kronen</text><text x="68" y="284" class="body">op de horens; als luipaard, beer en</text><text x="68" y="327" class="body">leeuw.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Macht van het eerste · vers 5–7</text><text x="68" y="476" class="body">Tweeënveertig maanden; laster en oorlog</text><text x="68" y="519" class="body">tegen de heiligen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Uit de aarde · vers 11–15</text><text x="68" y="668" class="body">Twee horens als een lam, spreekt als de</text><text x="68" y="711" class="body">draak; bevordert aanbidding van het</text><text x="68" y="754" class="body">eerste.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Merkteken · vers 16–18</text><text x="68" y="903" class="body">Rechterhand of voorhoofd; kopen en</text><text x="68" y="946" class="body">verkopen; het getal is 666.</text><text x="46" y="1039" class="note">De tien kronen van dit beest verschillen van de</text><text x="46" y="1075" class="note">zeven kronen van de draak in 12:3.</text></svg>