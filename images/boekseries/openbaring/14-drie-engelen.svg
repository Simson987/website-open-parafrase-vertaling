<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Drie boodschappen</title><desc id="desc">Drie boodschappen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie boodschappen</text><text x="44" y="113" class="ref">Openbaring 14:6–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste engel · vers 6–7</text><text x="68" y="241" class="body">Eeuwig evangelie voor alle volken:</text><text x="68" y="284" class="body">ontzag voor God en aanbidding van de</text><text x="68" y="327" class="body">Schepper.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tweede engel · vers 8</text><text x="68" y="476" class="body">Babylon, de grote stad, is gevallen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Derde engel · vers 9–11</text><text x="68" y="625" class="body">Waarschuwing voor aanbidding van het</text><text x="68" y="668" class="body">beest, zijn beeld en zijn merkteken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Daarna · vers 12–13</text><text x="68" y="817" class="body">Volharding en geloof; gelukkig wie in</text><text x="68" y="860" class="body">de Heere sterft, de werken gaan mee.</text><text x="46" y="953" class="note">Boodschappen in tekstvolgorde; de aangekondigde</text><text x="46" y="989" class="note">oordelen worden niet tot moderne gebeurtenissen</text><text x="46" y="1025" class="note">herleid.</text></svg>