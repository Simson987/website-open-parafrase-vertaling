<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wie zijn deze mensen?</title><desc id="desc">Wie zijn deze mensen? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie zijn deze mensen?</text><text x="44" y="113" class="ref">Openbaring 7:9–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat Johannes ziet · vers 9</text><text x="68" y="241" class="body">Een ontelbare menigte uit elke natie,</text><text x="68" y="284" class="body">stam, volk en taal.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wat zij dragen</text><text x="68" y="433" class="body">Lange witte kleren en palmtakken.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Wat de oudste verklaart</text><text x="68" y="582" class="body">Zij komen uit de grote verdrukking; hun</text><text x="68" y="625" class="body">kleren zijn in het bloed van het Lam</text><text x="68" y="668" class="body">witgemaakt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wat zij ontvangen · vers 15–17</text><text x="68" y="817" class="body">Gods nabijheid, geen honger of dorst,</text><text x="68" y="860" class="body">levend water en afgewiste tranen.</text><text x="46" y="953" class="note">Het gehoorde aantal en de daarna geziene menigte</text><text x="46" y="989" class="note">worden in de leesvolgorde weergegeven.</text></svg>