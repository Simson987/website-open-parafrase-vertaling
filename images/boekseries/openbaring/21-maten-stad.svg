<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De maten van de stad</title><desc id="desc">De maten van de stad met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De maten van de stad</text><text x="44" y="113" class="ref">Openbaring 21:15–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lengte = breedte = hoogte</text><text x="68" y="241" class="body">De stad is vierkant en heeft gelijke</text><text x="68" y="284" class="body">lengte, breedte en hoogte.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Stad · vers 16</text><text x="68" y="433" class="body">Ongeveer 2400 kilometer volgens de</text><text x="68" y="476" class="body">plaatselijke hoofdstukweergave.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Muur · vers 17</text><text x="68" y="625" class="body">144 maten naar menselijke maat:</text><text x="68" y="668" class="body">ongeveer 65 meter.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Materialen · vers 18 en 21</text><text x="68" y="817" class="body">Muur van jaspis; stad en straat van</text><text x="68" y="860" class="body">zuiver goud als glas; elke poort uit</text><text x="68" y="903" class="body">één parel.</text><text x="46" y="996" class="note">Maten volgens het visioen en de gebruikte</text><text x="46" y="1032" class="note">hoofdstuktekst; geen ontwerp voor een hedendaags</text><text x="46" y="1068" class="note">gebouw.</text></svg>