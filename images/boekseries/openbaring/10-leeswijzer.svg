<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">De engel en het boekje</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De engel en het boekje</text><text x="44" y="113" class="ref">Openbaring 10:1–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–4 · Engel en zeven donders</text><text x="68" y="241" class="body">De sterke engel daalt neer. Wat de</text><text x="68" y="284" class="body">zeven donders zeggen, mag niet</text><text x="68" y="327" class="body">opgeschreven worden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">5–7 · De eed</text><text x="68" y="476" class="body">Bij het klinken van de zevende bazuin</text><text x="68" y="519" class="body">wordt Gods geheim vervuld.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">8–11 · Ontvangen, eten, spreken</text><text x="68" y="668" class="body">Johannes eet het boekje: zoet in de</text><text x="68" y="711" class="body">mond, bitter in de maag; hij moet weer</text><text x="68" y="754" class="body">profeteren.</text><text x="46" y="847" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="883" class="note">de plaatselijke versindeling.</text></svg>