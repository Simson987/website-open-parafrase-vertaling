<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De namen van de ruiter</title><desc id="desc">De namen van de ruiter met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De namen van de ruiter</text><text x="44" y="113" class="ref">Openbaring 19:11–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Trouw en Waarachtig · vers 11</text><text x="68" y="241" class="body">Hij oordeelt en voert rechtvaardig</text><text x="68" y="284" class="body">oorlog.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Een onbekende naam · vers 12</text><text x="68" y="433" class="body">Alleen Hijzelf kent deze geschreven</text><text x="68" y="476" class="body">naam.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het Woord van God · vers 13</text><text x="68" y="625" class="body">De tekst noemt deze Naam bij Zijn</text><text x="68" y="668" class="body">kleed.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Koning en Heer · vers 16</text><text x="68" y="817" class="body">Koning van de koningen en Heer van de</text><text x="68" y="860" class="body">heren.</text><text x="46" y="953" class="note">De onbekende naam wordt niet ingevuld; de</text><text x="46" y="989" class="note">expliciet gegeven Namen blijven onderscheiden.</text></svg>