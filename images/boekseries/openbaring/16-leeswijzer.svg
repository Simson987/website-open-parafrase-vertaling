<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">De zeven schalen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De zeven schalen</text><text x="44" y="113" class="ref">Openbaring 16:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–7 · De eerste drie</text><text x="68" y="241" class="body">Aarde, zee, rivieren en bronnen; de</text><text x="68" y="284" class="body">oordelen worden rechtvaardig genoemd.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">8–11 · Vier en vijf</text><text x="68" y="433" class="body">De zon verbrandt en het rijk van het</text><text x="68" y="476" class="body">beest wordt donker; er volgt geen</text><text x="68" y="519" class="body">bekering.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">12–16 · De zesde</text><text x="68" y="668" class="body">De Eufraat droogt op; drie onreine</text><text x="68" y="711" class="body">geesten verzamelen de koningen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">17–21 · De zevende</text><text x="68" y="860" class="body">In de lucht: het is gebeurd;</text><text x="68" y="903" class="body">aardbeving, gescheurde stad en grote</text><text x="68" y="946" class="body">hagel.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>