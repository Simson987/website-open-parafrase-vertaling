<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Leven, boeken en oordeel</title><desc id="desc">Leven, boeken en oordeel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leven, boeken en oordeel</text><text x="44" y="113" class="ref">Openbaring 20:4–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste opstanding · vers 4–6</text><text x="68" y="241" class="body">Wie met Christus leeft en heerst, wordt</text><text x="68" y="284" class="body">gelukkig en heilig genoemd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Geoordeeld · vers 12–13</text><text x="68" y="433" class="body">Klein en groot; ieder naar de werken</text><text x="68" y="476" class="body">die in de boeken staan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het boek van het leven</text><text x="68" y="625" class="body">Een ander boek wordt naast de boeken</text><text x="68" y="668" class="body">geopend.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tweede dood · vers 14–15</text><text x="68" y="817" class="body">De vuurpoel wordt de tweede dood</text><text x="68" y="860" class="body">genoemd; dood en dodenrijk gaan daarin.</text><text x="46" y="953" class="note">Dit ordent de eigen benamingen van het visioen,</text><text x="46" y="989" class="note">zonder een extra eindtijdmodel.</text></svg>