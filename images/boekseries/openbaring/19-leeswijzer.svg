<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Lof, bruiloft en overwinning</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Lof, bruiloft en overwinning</text><text x="44" y="113" class="ref">Openbaring 19:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–6 · Halleluja</text><text x="68" y="241" class="body">De grote menigte, oudsten en vier</text><text x="68" y="284" class="body">wezens loven God om Zijn rechtvaardig</text><text x="68" y="327" class="body">oordeel.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">7–10 · De bruiloft</text><text x="68" y="476" class="body">Bruid in zuiver linnen; uitnodiging</text><text x="68" y="519" class="body">voor de maaltijd; de engel weigert</text><text x="68" y="562" class="body">aanbidding.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">11–16 · De ruiter</text><text x="68" y="711" class="body">Trouw en Waarachtig; het Woord van God;</text><text x="68" y="754" class="body">Koning van de koningen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">17–21 · Het oordeel</text><text x="68" y="903" class="body">Beest en valse profeet worden gegrepen;</text><text x="68" y="946" class="body">hun legers worden verslagen.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>