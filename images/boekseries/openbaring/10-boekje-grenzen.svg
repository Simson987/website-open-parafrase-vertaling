<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat wel en niet wordt gezegd</title><desc id="desc">Wat wel en niet wordt gezegd met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat wel en niet wordt gezegd</text><text x="44" y="113" class="ref">Openbaring 10:4–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet opschrijven · vers 4</text><text x="68" y="241" class="body">Wat de zeven donderslagen spraken, moet</text><text x="68" y="284" class="body">verzegeld blijven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wel ontvangen · vers 8–9</text><text x="68" y="433" class="body">Het open boekje wordt aan Johannes</text><text x="68" y="476" class="body">gegeven om te eten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee ervaringen · vers 10</text><text x="68" y="625" class="body">Zoet als honing in de mond; bitter in</text><text x="68" y="668" class="body">de maag.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nieuwe opdracht · vers 11</text><text x="68" y="817" class="body">Opnieuw profeteren over volken, naties,</text><text x="68" y="860" class="body">talen en koningen.</text><text x="46" y="953" class="note">De inhoud van de verzegelde donderslagen wordt</text><text x="46" y="989" class="note">hier niet ingevuld.</text></svg>