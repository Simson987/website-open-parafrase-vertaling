<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat het lied bezingt</title><desc id="desc">Wat het lied bezingt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat het lied bezingt</text><text x="44" y="113" class="ref">Openbaring 15:3–4</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Werken</text><text x="68" y="241" class="body">Groot en wonderlijk zijn Gods werken.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Wegen</text><text x="68" y="390" class="body">Rechtvaardig en waarachtig zijn Gods</text><text x="68" y="433" class="body">wegen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Heiligheid</text><text x="68" y="582" class="body">God alleen is heilig en Zijn Naam</text><text x="68" y="625" class="body">verdient eer.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Volken</text><text x="68" y="774" class="body">Alle volken zullen komen en zich</text><text x="68" y="817" class="body">buigen; Zijn rechtvaardige daden zijn</text><text x="68" y="860" class="body">zichtbaar.</text><text x="46" y="953" class="note">Het lied van Mozes en van het Lam zoals het in</text><text x="46" y="989" class="note">deze verzen staat.</text></svg>