<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Rivier en levensboom</title><desc id="desc">Rivier en levensboom met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rivier en levensboom</text><text x="44" y="113" class="ref">Openbaring 22:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oorsprong van de rivier</text><text x="68" y="241" class="body">Het heldere levenswater komt uit de</text><text x="68" y="284" class="body">troon van God en van het Lam.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Plaats van de boom</text><text x="68" y="433" class="body">Midden op de straat, aan weerskanten</text><text x="68" y="476" class="body">van de rivier.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vrucht en bladeren</text><text x="68" y="625" class="body">Twaalf keer vrucht, elke maand opnieuw;</text><text x="68" y="668" class="body">bladeren tot genezing van de volken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Licht en dienst</text><text x="68" y="817" class="body">Geen vloek of nacht; God geeft licht en</text><text x="68" y="860" class="body">Zijn dienaren zullen Hem dienen.</text><text x="46" y="953" class="note">De boom draagt niet twaalf soorten vrucht: de</text><text x="46" y="989" class="note">tekst zegt twaalf keer, elke maand.</text></svg>