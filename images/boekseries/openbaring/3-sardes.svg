<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Sardes: word wakker</title><desc id="desc">Sardes: word wakker met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sardes: word wakker</text><text x="44" y="113" class="ref">Openbaring 3:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Toestand</text><text x="68" y="241" class="body">De naam levend te zijn, maar dood;</text><text x="68" y="284" class="body">werken niet volmaakt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oproep</text><text x="68" y="433" class="body">Wakker worden, versterken, herinneren,</text><text x="68" y="476" class="body">bewaren en bekeren.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Een paar mensen</text><text x="68" y="625" class="body">Zij hebben hun kleren niet bevuild.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Belofte</text><text x="68" y="774" class="body">Witte kleren, de naam in het levensboek</text><text x="68" y="817" class="body">en belijdenis voor de Vader.</text><text x="46" y="910" class="note">De oproep tot waakzaamheid staat naast het</text><text x="46" y="946" class="note">beloofde behoud van de naam.</text></svg>