<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Pergamum: vasthouden en omkeer</title><desc id="desc">Pergamum: vasthouden en omkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Pergamum: vasthouden en omkeer</text><text x="44" y="113" class="ref">Openbaring 2:12–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Erkend</text><text x="68" y="241" class="body">De Naam vasthouden, ook bij de dood van</text><text x="68" y="284" class="body">Antipas.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verwijt</text><text x="68" y="433" class="body">De leer van Bileam en van de</text><text x="68" y="476" class="body">Nikolaïeten vasthouden.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Oproep</text><text x="68" y="625" class="body">Bekeer je.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Belofte</text><text x="68" y="774" class="body">Verborgen manna en een witte steen met</text><text x="68" y="817" class="body">een nieuwe naam.</text><text x="46" y="910" class="note">De tekst maakt de nieuwe naam niet aan de lezer</text><text x="46" y="946" class="note">bekend.</text></svg>