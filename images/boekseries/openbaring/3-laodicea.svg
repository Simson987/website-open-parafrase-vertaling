<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Laodicea: lauw en toch geroepen</title><desc id="desc">Laodicea: lauw en toch geroepen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Laodicea: lauw en toch geroepen</text><text x="44" y="113" class="ref">Openbaring 3:14–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Toestand</text><text x="68" y="241" class="body">Lauw; denkt rijk te zijn en merkt het</text><text x="68" y="284" class="body">eigen gebrek niet.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Raad</text><text x="68" y="433" class="body">Gelouterd goud, witte kleren en oogzalf</text><text x="68" y="476" class="body">kopen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Oproep</text><text x="68" y="625" class="body">IJverig zijn, bekeren en de kloppende</text><text x="68" y="668" class="body">stem horen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Belofte</text><text x="68" y="817" class="body">Samen eten en delen in Zijn troon.</text><text x="46" y="910" class="note">Terechtwijzing wordt hier verbonden met liefde</text><text x="46" y="946" class="note">en opvoeding.</text></svg>