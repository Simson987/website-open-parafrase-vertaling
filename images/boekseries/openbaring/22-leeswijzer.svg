<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Water, woorden en verwachting</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Water, woorden en verwachting</text><text x="44" y="113" class="ref">Openbaring 22:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · De rivier en de boom</text><text x="68" y="241" class="body">Water van het leven, twaalf keer</text><text x="68" y="284" class="body">vrucht, geen vloek en geen nacht.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">6–11 · Betrouwbare woorden</text><text x="68" y="433" class="body">Bewaar de profetie; de engel weigert</text><text x="68" y="476" class="body">aanbidding; het boek wordt niet</text><text x="68" y="519" class="body">verzegeld.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">12–17 · Ik kom snel</text><text x="68" y="668" class="body">Jezus spreekt; Geest en bruid zeggen:</text><text x="68" y="711" class="body">Kom. Het levenswater is voor niets.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">18–21 · Slot</text><text x="68" y="860" class="body">Niets toevoegen of weghalen;</text><text x="68" y="903" class="body">verwachting van Jezus en genade voor</text><text x="68" y="946" class="body">allen.</text><text x="46" y="1039" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1075" class="note">de plaatselijke versindeling.</text></svg>