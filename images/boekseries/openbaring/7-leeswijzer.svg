<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Verzegeling en menigte</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verzegeling en menigte</text><text x="44" y="113" class="ref">Openbaring 7:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3 · Eerst verzegelen</text><text x="68" y="241" class="body">Vier engelen houden de winden tegen;</text><text x="68" y="284" class="body">een andere engel beveelt te wachten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">4–8 · Het gehoorde aantal</text><text x="68" y="433" class="body">144.000 uit twaalf genoemde stammen,</text><text x="68" y="476" class="body">telkens 12.000.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">9–12 · De geziene menigte</text><text x="68" y="625" class="body">Ontelbaar, uit alle volken; witte</text><text x="68" y="668" class="body">kleren, palmen en lof.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">13–17 · Herkomst en vertroosting</text><text x="68" y="817" class="body">Uit de grote verdrukking; dienen,</text><text x="68" y="860" class="body">geweid worden en tranen afgewist.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>