<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wie rouwen om Babylon?</title><desc id="desc">Wie rouwen om Babylon? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie rouwen om Babylon?</text><text x="44" y="113" class="ref">Openbaring 18:9–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Koningen · vers 9–10</text><text x="68" y="241" class="body">Zien de rook, blijven ver weg en rouwen</text><text x="68" y="284" class="body">om het snelle oordeel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Handelaars · vers 11–16</text><text x="68" y="433" class="body">Niemand koopt hun waren meer; zij</text><text x="68" y="476" class="body">treuren om de verdwenen rijkdom.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zeevarenden · vers 17–19</text><text x="68" y="625" class="body">Stuurlui, opvarenden, matrozen en wie</text><text x="68" y="668" class="body">op zee werken, klagen vanaf een</text><text x="68" y="711" class="body">afstand.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Wat terugkomt</text><text x="68" y="860" class="body">De klacht over één uur; de ontzaglijke</text><text x="68" y="903" class="body">rijkdom valt weg.</text><text x="46" y="996" class="note">De rouw om verloren voordeel verschilt van de</text><text x="46" y="1032" class="note">oproep aan Gods volk om weg te gaan.</text></svg>