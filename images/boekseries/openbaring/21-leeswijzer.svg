<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Alles wordt nieuw</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Alles wordt nieuw</text><text x="44" y="113" class="ref">Openbaring 21:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–8 · Nieuwe schepping</text><text x="68" y="241" class="body">Nieuwe hemel en aarde; God woont bij</text><text x="68" y="284" class="body">mensen, tranen en dood verdwijnen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">9–21 · De stad gemeten</text><text x="68" y="433" class="body">De engel toont Jeruzalem: poorten,</text><text x="68" y="476" class="body">fundamenten, maten en kostbare</text><text x="68" y="519" class="body">materialen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">22–27 · Gods heerlijkheid</text><text x="68" y="668" class="body">Geen tempel, geen nacht; het Lam is</text><text x="68" y="711" class="body">haar lamp en de poorten blijven open.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>