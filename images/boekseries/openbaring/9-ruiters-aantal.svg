<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1019" viewBox="0 0 840 1019" role="img" aria-labelledby="title desc"><title id="title">Het gehoorde aantal</title><desc id="desc">Het gehoorde aantal met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1019" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het gehoorde aantal</text><text x="44" y="113" class="ref">Openbaring 9:13–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vier engelen</text><text x="68" y="241" class="body">Gebonden bij de grote Eufraat; gereed</text><text x="68" y="284" class="body">voor uur, dag, maand en jaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het aantal ruiters</text><text x="68" y="433" class="body">20.000 × 10.000 = 200.000.000. Johannes</text><text x="68" y="476" class="body">zegt dat hij het aantal hoorde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Drie plagen</text><text x="68" y="625" class="body">Vuur, rook en zwavel uit de mond van de</text><text x="68" y="668" class="body">paarden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het getroffen deel</text><text x="68" y="817" class="body">Door deze drie plagen sterft een derde</text><text x="68" y="860" class="body">van de mensen.</text><text x="46" y="953" class="note">De aantallen horen bij de vertelde visioenscène.</text></svg>