<svg xmlns="http://www.w3.org/2000/svg" width="840" height="870" viewBox="0 0 840 870"><title>Twaalf poorten</title><rect width="840" height="870" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="44" y="60" font-size="36" font-weight="700">Twaalf poorten</text><text x="44" y="105" font-size="28">Openbaring 21:12–14</text><rect x="180" y="240" width="480" height="390" fill="#e6ead9" stroke="#52725e" stroke-width="5"/><text x="420" y="187" text-anchor="middle" font-size="30">Noord · 3</text><text x="420" y="686" text-anchor="middle" font-size="30">Zuid · 3</text><text x="88" y="437" text-anchor="middle" font-size="28">West</text><text x="88" y="477" text-anchor="middle" font-size="28">3</text><text x="752" y="437" text-anchor="middle" font-size="28">Oost</text><text x="752" y="477" text-anchor="middle" font-size="28">3</text><circle cx="280" cy="240" r="20" fill="#d8ad56"/><circle cx="280" cy="630" r="20" fill="#d8ad56"/><circle cx="180" cy="320" r="20" fill="#d8ad56"/><circle cx="660" cy="320" r="20" fill="#d8ad56"/><circle cx="420" cy="240" r="20" fill="#d8ad56"/><circle cx="420" cy="630" r="20" fill="#d8ad56"/><circle cx="180" cy="435" r="20" fill="#d8ad56"/><circle cx="660" cy="435" r="20" fill="#d8ad56"/><circle cx="560" cy="240" r="20" fill="#d8ad56"/><circle cx="560" cy="630" r="20" fill="#d8ad56"/><circle cx="180" cy="550" r="20" fill="#d8ad56"/><circle cx="660" cy="550" r="20" fill="#d8ad56"/><text x="420" y="390" text-anchor="middle" font-size="30">12 poorten · 12 engelen</text><text x="420" y="440" text-anchor="middle" font-size="28">Namen van Israëls stammen</text><text x="420" y="490" text-anchor="middle" font-size="28">12 fundamenten:</text><text x="420" y="530" text-anchor="middle" font-size="28">namen van de apostelen</text><text x="44" y="766" font-size="27">Schematisch bovenaanzicht, niet op schaal.</text><text x="44" y="808" font-size="27">Drie poorten aan elk van de vier zijden.</text></g></svg>