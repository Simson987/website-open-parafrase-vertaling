<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Smyrna: trouw in het lijden</title><desc id="desc">Smyrna: trouw in het lijden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Smyrna: trouw in het lijden</text><text x="44" y="113" class="ref">Openbaring 2:8–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Erkend</text><text x="68" y="241" class="body">Verdrukking en armoede, en toch rijk.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vooruitzicht</text><text x="68" y="390" class="body">Gevangenis en tien dagen verdrukking.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Oproep</text><text x="68" y="539" class="body">Niet bang zijn; trouw zijn tot de dood.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Belofte</text><text x="68" y="688" class="body">De krans van het leven; niet getroffen</text><text x="68" y="731" class="body">door de tweede dood.</text><text x="46" y="824" class="note">In deze brief wordt geen eigen tekort van de</text><text x="46" y="860" class="note">gemeente genoemd.</text></svg>