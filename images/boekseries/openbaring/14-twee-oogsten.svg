<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Twee oogstbeelden</title><desc id="desc">Twee oogstbeelden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee oogstbeelden</text><text x="44" y="113" class="ref">Openbaring 14:14–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste beeld · vers 14–16</text><text x="68" y="241" class="body">Iemand als een mensenzoon zit op een</text><text x="68" y="284" class="body">witte wolk, met gouden krans en scherpe</text><text x="68" y="327" class="body">zeis.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Oproep uit de tempel</text><text x="68" y="476" class="body">Een engel roept dat het uur van maaien</text><text x="68" y="519" class="body">gekomen is; de aarde wordt gemaaid.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Tweede beeld · vers 17–19</text><text x="68" y="668" class="body">Een engel met zeis ontvangt de oproep</text><text x="68" y="711" class="body">om de rijpe druiven af te snijden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De perskuip · vers 19–20</text><text x="68" y="860" class="body">De druiven gaan in de perskuip van Gods</text><text x="68" y="903" class="body">toorn buiten de stad.</text><text x="46" y="996" class="note">De engel met zeis en de mensenzoon op de wolk</text><text x="46" y="1032" class="note">zijn twee onderscheiden figuren.</text></svg>