<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Stilte en vier bazuinen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stilte en vier bazuinen</text><text x="44" y="113" class="ref">Openbaring 8:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–2 · Het zevende zegel</text><text x="68" y="241" class="body">Ongeveer een half uur stilte in de</text><text x="68" y="284" class="body">hemel; zeven engelen ontvangen zeven</text><text x="68" y="327" class="body">bazuinen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">3–5 · Wierook en gebeden</text><text x="68" y="476" class="body">Een andere engel brengt wierook met de</text><text x="68" y="519" class="body">gebeden; vuur uit het altaar wordt op</text><text x="68" y="562" class="body">aarde geworpen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">6–12 · De eerste vier bazuinen</text><text x="68" y="711" class="body">Oordelen treffen aarde, zee, rivieren</text><text x="68" y="754" class="body">en hemellichten; de tekst noemt telkens</text><text x="68" y="797" class="body">eigen aantallen.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">13 · Drie weeën</text><text x="68" y="946" class="body">Een arend kondigt de drie resterende</text><text x="68" y="989" class="body">bazuinen aan.</text><text x="46" y="1082" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1118" class="note">de plaatselijke versindeling.</text></svg>