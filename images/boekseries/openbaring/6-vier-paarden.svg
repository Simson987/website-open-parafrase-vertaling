<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De vier paarden op volgorde</title><desc id="desc">De vier paarden op volgorde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vier paarden op volgorde</text><text x="44" y="113" class="ref">Openbaring 6:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste · wit</text><text x="68" y="241" class="body">Boog en krans; uittrekken als</text><text x="68" y="284" class="body">overwinnaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede · rood</text><text x="68" y="433" class="body">Een groot zwaard; de vrede van de aarde</text><text x="68" y="476" class="body">wegnemen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Derde · zwart</text><text x="68" y="625" class="body">Weegschaal; tarwe en gerst voor een</text><text x="68" y="668" class="body">dagloon.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vierde · vaal</text><text x="68" y="817" class="body">De dood als ruiter; het dodenrijk</text><text x="68" y="860" class="body">volgt; macht over een vierde van de</text><text x="68" y="903" class="body">aarde.</text><text x="46" y="996" class="note">De kleuren, voorwerpen en genoemde macht volgen</text><text x="46" y="1032" class="note">het visioen; er worden geen moderne personen aan</text><text x="46" y="1068" class="note">gekoppeld.</text></svg>