<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat de engel verklaart</title><desc id="desc">Wat de engel verklaart met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat de engel verklaart</text><text x="44" y="113" class="ref">Openbaring 17:9–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zeven koppen · vers 9–10</text><text x="68" y="241" class="body">Zeven bergen; ook zeven koningen: vijf</text><text x="68" y="284" class="body">gevallen, één aanwezig, één nog te</text><text x="68" y="327" class="body">komen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tien horens · vers 12–13</text><text x="68" y="476" class="body">Tien koningen die één uur macht krijgen</text><text x="68" y="519" class="body">en hun kracht aan het beest geven.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het water · vers 15</text><text x="68" y="668" class="body">Volken, menigten, naties en talen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vrouw · vers 18</text><text x="68" y="817" class="body">De grote stad die over de koningen van</text><text x="68" y="860" class="body">de aarde heerst.</text><text x="46" y="953" class="note">De verklaringen van de engel zijn weergegeven;</text><text x="46" y="989" class="note">de stad en koningen krijgen geen extra namen.</text></svg>