<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Babylons val en de rouw</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Babylons val en de rouw</text><text x="44" y="113" class="ref">Openbaring 18:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–8 · Gevallen en verlaten</text><text x="68" y="241" class="body">De engel kondigt de val aan; Gods volk</text><text x="68" y="284" class="body">wordt geroepen weg te gaan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">9–19 · Drie groepen rouwen</text><text x="68" y="433" class="body">Koningen, handelaars en mensen op zee</text><text x="68" y="476" class="body">blijven ver weg en klagen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">20–24 · Oordeel bevestigd</text><text x="68" y="625" class="body">Oproep tot vreugde in de hemel;</text><text x="68" y="668" class="body">molensteen als teken van de definitieve</text><text x="68" y="711" class="body">val.</text><text x="46" y="804" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="840" class="note">de plaatselijke versindeling.</text></svg>