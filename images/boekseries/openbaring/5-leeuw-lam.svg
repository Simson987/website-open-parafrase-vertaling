<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Leeuw, wortel en Lam</title><desc id="desc">Leeuw, wortel en Lam met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leeuw, wortel en Lam</text><text x="44" y="113" class="ref">Openbaring 5:5–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aankondiging · vers 5</text><text x="68" y="241" class="body">De Leeuw uit Juda en de wortel van</text><text x="68" y="284" class="body">David heeft overwonnen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het gezicht · vers 6</text><text x="68" y="433" class="body">Een staand Lam, dat eruitziet als</text><text x="68" y="476" class="body">geslacht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zeven horens en zeven ogen</text><text x="68" y="625" class="body">De ogen worden verklaard als de zeven</text><text x="68" y="668" class="body">geesten, over de aarde uitgestuurd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De handeling · vers 7–8</text><text x="68" y="817" class="body">Het Lam neemt de boekrol; de wezens en</text><text x="68" y="860" class="body">oudsten vallen neer.</text><text x="46" y="953" class="note">De titels, aantallen en de uitleg van het</text><text x="46" y="989" class="note">visioen zijn tekstueel weergegeven.</text></svg>