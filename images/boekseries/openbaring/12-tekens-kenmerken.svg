<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Kenmerken van de tekenen</title><desc id="desc">Kenmerken van de tekenen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kenmerken van de tekenen</text><text x="44" y="113" class="ref">Openbaring 12:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vrouw · vers 1</text><text x="68" y="241" class="body">Bekleed met de zon; maan onder de</text><text x="68" y="284" class="body">voeten; krans van twaalf sterren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De rode draak · vers 3</text><text x="68" y="433" class="body">Zeven koppen, tien horens en zeven</text><text x="68" y="476" class="body">kronen op de koppen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het kind · vers 5</text><text x="68" y="625" class="body">Een zoon die de volken met een ijzeren</text><text x="68" y="668" class="body">staf zal hoeden; weggerukt naar God.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De draak benoemd · vers 9</text><text x="68" y="817" class="body">De oude slang, duivel en satan, die de</text><text x="68" y="860" class="body">hele wereld misleidt.</text><text x="46" y="953" class="note">Kenmerken en benamingen volgen het visioen zelf;</text><text x="46" y="989" class="note">geen extra historische identificatie.</text></svg>