<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Tijden en aantallen</title><desc id="desc">Tijden en aantallen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tijden en aantallen</text><text x="44" y="113" class="ref">Openbaring 11:2–13</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">42 maanden · vers 2</text><text x="68" y="241" class="body">De volken vertrappen de heilige stad.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">1260 dagen · vers 3</text><text x="68" y="390" class="body">De twee getuigen profeteren in</text><text x="68" y="433" class="body">rouwkleren.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">3½ dag · vers 9–11</text><text x="68" y="582" class="body">Hun lichamen blijven liggen; daarna</text><text x="68" y="625" class="body">gaan zij weer staan.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Aardbeving · vers 13</text><text x="68" y="774" class="body">Een tiende van de stad stort in;</text><text x="68" y="817" class="body">zevenduizend mensen sterven.</text><text x="46" y="910" class="note">De tekstgegevens worden weergegeven zonder ze</text><text x="46" y="946" class="note">naar moderne jaartallen om te rekenen.</text></svg>