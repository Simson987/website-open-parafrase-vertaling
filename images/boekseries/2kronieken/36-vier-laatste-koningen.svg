<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Vier laatste koningen</title><desc id="desc">Namen, alternatieve naam en exacte duur per koning.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier laatste koningen</text><text x="44" y="113" class="ref">2 Kronieken 36:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Joahaz</text><text x="68" y="241" class="body">23 jaar; drie maanden. Door Egypte</text><text x="68" y="284" class="body">afgezet en weggevoerd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jojakim</text><text x="68" y="433" class="body">Eljakim krijgt deze naam; 25 jaar, elf</text><text x="68" y="476" class="body">jaar koning. Nebukadnezar bindt hem.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jojachin</text><text x="68" y="625" class="body">Dit hoofdstuk noemt acht jaar; drie</text><text x="68" y="668" class="body">maanden en tien dagen koning; naar</text><text x="68" y="711" class="body">Babel.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zedekia</text><text x="68" y="860" class="body">21 jaar; elf jaar koning. Verwerpt</text><text x="68" y="903" class="body">Jeremia en breekt zijn eed aan Babel.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Ook leiders en volk</text><text x="68" y="1052" class="body">Worden ontrouw en maken Gods huis</text><text x="68" y="1095" class="body">onrein.</text><text x="46" y="1188" class="note">Dit is opvolgingsvolgorde, geen vader-zoonketen.</text><text x="46" y="1224" class="note">De leeftijd van Jojachin blijft zoals hier</text><text x="46" y="1260" class="note">vermeld.</text></svg>