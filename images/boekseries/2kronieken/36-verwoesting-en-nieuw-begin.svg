<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1455" viewBox="0 0 840 1455" role="img" aria-labelledby="title desc"><title id="title">Verwoesting en nieuw begin</title><desc id="desc">Waarschuwing, ondergang, rust en de nieuwe toestemming.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1455" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verwoesting en nieuw begin</text><text x="44" y="113" class="ref">2 Kronieken 36:15–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Boden verworpen</text><text x="68" y="241" class="body">Herhaalde waarschuwingen bespot;</text><text x="68" y="284" class="body">uiteindelijk geen herstel meer</text><text x="68" y="327" class="body">mogelijk.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Verwoesting</text><text x="68" y="476" class="body">Chaldeeën doden zonder onderscheid,</text><text x="68" y="519" class="body">voeren schatten weg, verbranden tempel</text><text x="68" y="562" class="body">en paleizen en breken de stadsmuur af.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Wegvoering</text><text x="68" y="711" class="body">Overlevenden als dienaren naar Babel</text><text x="68" y="754" class="body">tot Perzië aan de macht komt.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Zeventig jaar</text><text x="68" y="903" class="body">Het land ligt braak en ontvangt zijn</text><text x="68" y="946" class="body">sabbatsrust; verbonden met Jeremia’s</text><text x="68" y="989" class="body">woord.</text><rect x="42" y="1047" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Kores’ eerste jaar</text><text x="68" y="1138" class="body">Openbare en geschreven oproep om Gods</text><text x="68" y="1181" class="body">huis in Jeruzalem te bouwen; wie tot</text><text x="68" y="1224" class="body">Gods volk hoort mag optrekken.</text><text x="46" y="1317" class="note">De aankondiging van terugkeer sluit het</text><text x="46" y="1353" class="note">hoofdstuk af; de feitelijke bouw begint hier nog</text><text x="46" y="1389" class="note">niet.</text></svg>