<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Dreiging, gebed en redding</title><desc id="desc">De bedreiging, gezamenlijke voorbede en afzonderlijke gevolgen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dreiging, gebed en redding</text><text x="44" y="113" class="ref">2 Kronieken 32:9–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vanuit Lachis</text><text x="68" y="241" class="body">Sanherib stuurt dienaren en honende</text><text x="68" y="284" class="body">brieven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Doel van de taal</text><text x="68" y="433" class="body">Luid in het Judees roepen om de</text><text x="68" y="476" class="body">bewoners op de muur bang te maken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gebed</text><text x="68" y="625" class="body">Jehizkia en Jesaja, zoon van Amoz,</text><text x="68" y="668" class="body">roepen naar de hemel.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Redding</text><text x="68" y="817" class="body">Een engel treft het Assyrische leger;</text><text x="68" y="860" class="body">Sanherib keert beschaamd terug en wordt</text><text x="68" y="903" class="body">later door zijn zonen gedood.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Daarna</text><text x="68" y="1052" class="body">Rust, geschenken en hoog aanzien voor</text><text x="68" y="1095" class="body">Jehizkia.</text><text x="46" y="1188" class="note">Het legeroordeel en Sanheribs dood in zijn eigen</text><text x="46" y="1224" class="note">godentempel zijn niet dezelfde plaats of</text><text x="46" y="1260" class="note">hetzelfde moment.</text></svg>