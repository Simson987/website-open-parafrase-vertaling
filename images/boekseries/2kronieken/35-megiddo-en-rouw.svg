<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Megiddo en de rouw</title><desc id="desc">Waarschuwing, keuzes, vervoer en de beschreven rouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Megiddo en de rouw</text><text x="44" y="113" class="ref">2 Kronieken 35:20–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Necho’s bericht</text><text x="68" y="241" class="body">Hij trekt naar Karchemis aan de Eufraat</text><text x="68" y="284" class="body">en zegt niet tegen Juda te komen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Josia’s keuze</text><text x="68" y="433" class="body">Vermomt zich en luistert niet; strijd</text><text x="68" y="476" class="body">in het dal van Megiddo.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee wagens</text><text x="68" y="625" class="body">Na de verwonding naar een tweede wagen</text><text x="68" y="668" class="body">overgebracht en naar Jeruzalem gereden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dood en begrafenis</text><text x="68" y="817" class="body">Sterft in Jeruzalem; begraven bij zijn</text><text x="68" y="860" class="body">voorouders.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Klaaglied</text><text x="68" y="1009" class="body">Jeremia en zangers en zangeressen</text><text x="68" y="1052" class="body">rouwen; een blijvende klaagtraditie.</text><text x="46" y="1145" class="note">Het feest en de latere veldslag zijn</text><text x="46" y="1181" class="note">afzonderlijke episodes; zijn dood wordt in</text><text x="46" y="1217" class="note">Jeruzalem geplaatst.</text></svg>