<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Twee koningen in de strijd</title><desc id="desc">Vermomming, persoonsverwisseling en verschillende afloop.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee koningen in de strijd</text><text x="44" y="113" class="ref">2 Kronieken 18:28–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achab</text><text x="68" y="241" class="body">Draagt een vermomming; Josafat houdt</text><text x="68" y="284" class="body">zijn koninklijke kleding.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De Syrische opdracht</text><text x="68" y="433" class="body">De wagenaanvoerders zoeken alleen de</text><text x="68" y="476" class="body">koning van Israël.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vergissing</text><text x="68" y="625" class="body">Zij zien Josafat voor hem aan; hij</text><text x="68" y="668" class="body">roept, God helpt en de achtervolgers</text><text x="68" y="711" class="body">keren zich af.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Een willekeurig schot</text><text x="68" y="860" class="body">Achab wordt tussen de pantserdelen</text><text x="68" y="903" class="body">getroffen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Zonsondergang</text><text x="68" y="1052" class="body">Hij houdt zich tot de avond in zijn</text><text x="68" y="1095" class="body">wagen overeind en sterft.</text><text x="46" y="1188" class="note">Josafat wordt gered en keert later terug; de</text><text x="46" y="1224" class="note">stervende koning in dit hoofdstuk is Achab.</text></svg>