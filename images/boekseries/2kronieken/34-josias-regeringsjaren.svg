<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Josia’s hervormingsjaren</title><desc id="desc">De vier tijdspunten en het herstelwerk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Josia’s hervormingsjaren</text><text x="44" y="113" class="ref">2 Kronieken 34:1–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Acht jaar oud</text><text x="68" y="241" class="body">Begint zijn 31-jarige regering.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Regeringsjaar acht</text><text x="68" y="390" class="body">Zoekt de God van David; ongeveer</text><text x="68" y="433" class="body">zestien jaar oud.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Regeringsjaar twaalf</text><text x="68" y="582" class="body">Begint de reiniging van afgoden, ook in</text><text x="68" y="625" class="body">noordelijke gebieden; ongeveer twintig</text><text x="68" y="668" class="body">jaar oud.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Regeringsjaar achttien</text><text x="68" y="817" class="body">Tempelherstel en vondst van het</text><text x="68" y="860" class="body">wetboek; ongeveer 26 jaar oud.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Trouw werk</text><text x="68" y="1009" class="body">Geld naar opzichters en vaklieden;</text><text x="68" y="1052" class="body">Levieten leiden, schrijven en bewaken.</text><text x="46" y="1145" class="note">Leeftijd en regeringsjaar zijn verschillende</text><text x="46" y="1181" class="note">tellers; de reiniging omvat ook het verbranden</text><text x="46" y="1217" class="note">van priesterbeenderen volgens de tekst.</text></svg>