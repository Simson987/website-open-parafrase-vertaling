<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Ontrouw, nederigheid en verlies</title><desc id="desc">Chronologie, aantallen en de beperkte redding in dit hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ontrouw, nederigheid en verlies</text><text x="44" y="113" class="ref">2 Kronieken 12:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vijfde regeringsjaar</text><text x="68" y="241" class="body">Sisak valt binnen nadat Rehabeam en het</text><text x="68" y="284" class="body">volk de wet verlaten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het leger</text><text x="68" y="433" class="body">1.200 wagens, 60.000 ruiters en</text><text x="68" y="476" class="body">ontelbaar voetvolk.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nederig antwoord</text><text x="68" y="625" class="body">Koning en leiders erkennen dat de HEERE</text><text x="68" y="668" class="body">rechtvaardig is; geen totale</text><text x="68" y="711" class="body">vernietiging, wel onderwerping.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Schatten</text><text x="68" y="860" class="body">Goud en gouden schilden worden</text><text x="68" y="903" class="body">meegenomen; koper vervangt ze.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Regering en opvolging</text><text x="68" y="1052" class="body">Begonnen op 41 jaar, zeventien jaar</text><text x="68" y="1095" class="body">koning; moeder Naäma uit Ammon; na hem</text><text x="68" y="1138" class="body">Abia.</text><text x="46" y="1231" class="note">Nederigheid voorkomt de totale ondergang, maar</text><text x="46" y="1267" class="note">maakt het verlies en de onderwerping niet</text><text x="46" y="1303" class="note">ongedaan.</text></svg>