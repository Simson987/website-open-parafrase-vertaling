<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Hoogmoed en afzondering</title><desc id="desc">Vergrijp, gevolgen en de overgang naar Jotham.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoogmoed en afzondering</text><text x="44" y="113" class="ref">2 Kronieken 26:16–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De grens</text><text x="68" y="241" class="body">Koning Uzzia wil reukwerk offeren;</text><text x="68" y="284" class="body">Azaria en tachtig priesters spreken hem</text><text x="68" y="327" class="body">tegen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De ziekte</text><text x="68" y="476" class="body">Terwijl hij boos wordt, verschijnt</text><text x="68" y="519" class="body">melaatsheid op zijn voorhoofd; hij</text><text x="68" y="562" class="body">haast zich naar buiten.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Apart huis</text><text x="68" y="711" class="body">Blijft ziek tot zijn dood en afgesneden</text><text x="68" y="754" class="body">van het huis van de HEERE.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Jotham</text><text x="68" y="903" class="body">Zijn zoon beheert het paleis en spreekt</text><text x="68" y="946" class="body">recht; later koning in zijn plaats.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Begrafenis</text><text x="68" y="1095" class="body">Op het veld bij de koningsgraven,</text><text x="68" y="1138" class="body">vanwege zijn ziekte.</text><text x="46" y="1231" class="note">Koning, priester en bestuurder hebben</text><text x="46" y="1267" class="note">verschillende bevoegdheden; Jothams taak begint</text><text x="46" y="1303" class="note">al tijdens vaders afzondering.</text></svg>