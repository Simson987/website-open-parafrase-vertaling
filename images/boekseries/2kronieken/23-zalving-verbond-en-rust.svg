<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Zalving, verbond en rust</title><desc id="desc">De gebeurtenissen inclusief het beschreven geweld en het herstel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zalving, verbond en rust</text><text x="44" y="113" class="ref">2 Kronieken 23:11–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De koning</text><text x="68" y="241" class="body">Kroon en getuigenis; Jojada en zijn</text><text x="68" y="284" class="body">zonen zalven Joas.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Athalia</text><text x="68" y="433" class="body">Komt op het gejuich af, roept verraad</text><text x="68" y="476" class="body">en wordt buiten het heiligdom bij de</text><text x="68" y="519" class="body">Paardenpoort gedood.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het verbond</text><text x="68" y="668" class="body">HEERE, volk en koning; Baäls tempel</text><text x="68" y="711" class="body">wordt afgebroken en Matthan gedood.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Herstel</text><text x="68" y="860" class="body">Dienstgroepen, zang en poortbewaking</text><text x="68" y="903" class="body">worden geregeld.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De troon</text><text x="68" y="1052" class="body">Joas gaat naar het paleis; volk</text><text x="68" y="1095" class="body">verheugd en stad rustig.</text><text x="46" y="1188" class="note">Zalving bij het huis van God en plaatsnemen op</text><text x="46" y="1224" class="note">de paleistroon zijn twee verschillende momenten.</text></svg>