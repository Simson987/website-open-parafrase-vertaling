<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Hoogmoed en twee Joassen</title><desc id="desc">Personen, beeldspraak, de doorbroken muur en de afloop.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoogmoed en twee Joassen</text><text x="44" y="113" class="ref">2 Kronieken 25:14–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Amazia</text><text x="68" y="241" class="body">Zoon van Joas, koning van Juda; neemt</text><text x="68" y="284" class="body">Edoms goden mee en verwerpt een</text><text x="68" y="327" class="body">waarschuwing.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Joas van Israël</text><text x="68" y="476" class="body">Zoon van Joahaz, kleinzoon van Jehu;</text><text x="68" y="519" class="body">antwoordt met de gelijkenis van distel</text><text x="68" y="562" class="body">en ceder.</text><rect x="42" y="620" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bij Beth-Semes</text><text x="68" y="711" class="body">Juda verslagen; Amazia gevangen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Jeruzalem</text><text x="68" y="860" class="body">180 meter muur afgebroken van</text><text x="68" y="903" class="body">Efraïmpoort tot Hoekpoort; schatten en</text><text x="68" y="946" class="body">gijzelaars naar Samaria.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Later</text><text x="68" y="1095" class="body">Amazia leeft vijftien jaar langer dan</text><text x="68" y="1138" class="body">Joas van Israël en wordt bij Lachis</text><text x="68" y="1181" class="body">gedood.</text><text x="46" y="1274" class="note">De twee Joassen zijn niet dezelfde koning.</text><text x="46" y="1310" class="note">Distel en ceder zijn de parabel in Joas’</text><text x="46" y="1346" class="note">antwoord.</text></svg>