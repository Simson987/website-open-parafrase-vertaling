<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Geschenken en soldaten</title><desc id="desc">Aantallen per leider en het onderscheid met de vestinggarnizoenen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geschenken en soldaten</text><text x="44" y="113" class="ref">2 Kronieken 17:10–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geschenken</text><text x="68" y="241" class="body">Filistijnen brengen zilver; Arabieren</text><text x="68" y="284" class="body">7.700 rammen en 7.700 bokken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Drie groepen uit Juda</text><text x="68" y="433" class="body">Adna 300.000; Johanan 280.000; Amasia,</text><text x="68" y="476" class="body">zoon van Zichri, 200.000.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee uit Benjamin</text><text x="68" y="625" class="body">Eljada 200.000; Jozabad 180.000.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Daarnaast</text><text x="68" y="774" class="body">Nog mannen in de versterkte steden;</text><text x="68" y="817" class="body">voorraadsteden en burchten worden</text><text x="68" y="860" class="body">gebouwd.</text><text x="46" y="953" class="note">Deze telling van dienstgroepen omvat niet de</text><text x="46" y="989" class="note">afzonderlijk genoemde garnizoenen.</text></svg>