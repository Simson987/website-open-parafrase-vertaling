<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1455" viewBox="0 0 840 1455" role="img" aria-labelledby="title desc"><title id="title">Amazia en het gehuurde leger</title><desc id="desc">Recht, aantallen, opdracht en de gewelddadige gevolgen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1455" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Amazia en het gehuurde leger</text><text x="44" y="113" class="ref">2 Kronieken 25:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Regering</text><text x="68" y="241" class="body">Begint op 25 jaar; 29 jaar koning.</text><text x="68" y="284" class="body">Moeder Joaddan uit Jeruzalem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eigen schuld</text><text x="68" y="433" class="body">Doodt vaders moordenaars, maar spaart</text><text x="68" y="476" class="body">hun kinderen volgens Mozes’ wet.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Troepen</text><text x="68" y="625" class="body">300.000 uit Juda en Benjamin; 100.000</text><text x="68" y="668" class="body">uit Israël gehuurd voor circa 3,4 ton</text><text x="68" y="711" class="body">zilver.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De waarschuwing</text><text x="68" y="860" class="body">Israëls troepen terugsturen; de HEERE</text><text x="68" y="903" class="body">kan meer geven dan de verloren</text><text x="68" y="946" class="body">betaling.</text><rect x="42" y="1004" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Gevolgen</text><text x="68" y="1095" class="body">Tienduizend doden in het Zoutdal en</text><text x="68" y="1138" class="body">tienduizend gevangenen gedood;</text><text x="68" y="1181" class="body">teruggestuurde troepen plunderen en</text><text x="68" y="1224" class="body">doden drieduizend.</text><text x="46" y="1317" class="note">De overwinnaars plegen zwaar geweld; het schema</text><text x="46" y="1353" class="note">laat dat niet als een louter vreedzame triomf</text><text x="46" y="1389" class="note">staan.</text></svg>