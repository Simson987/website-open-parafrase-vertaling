<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Vrees, gebed en Jahaziël</title><desc id="desc">Aanleiding, gebed, bemoediging en genoemde plaatsen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrees, gebed en Jahaziël</text><text x="44" y="113" class="ref">2 Kronieken 20:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het bericht</text><text x="68" y="241" class="body">Moab, Ammon en mensen van Seïr naderen;</text><text x="68" y="284" class="body">bij Engedi.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De reactie</text><text x="68" y="433" class="body">Vasten en zoeken; heel Juda, vrouwen en</text><text x="68" y="476" class="body">kinderen inbegrepen, staat voor God.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Josafats gebed</text><text x="68" y="625" class="body">Wij hebben geen kracht en weten niet</text><text x="68" y="668" class="body">wat te doen; onze ogen zijn op U.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Jahaziël</text><text x="68" y="817" class="body">Uit Asafs Levietenfamilie; niet vrezen,</text><text x="68" y="860" class="body">God zal strijden; naar de pas van Ziz</text><text x="68" y="903" class="body">bij Jeruël.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De morgen</text><text x="68" y="1052" class="body">Naar Thekoa; vertrouwen op God en Zijn</text><text x="68" y="1095" class="body">profeten.</text><text x="46" y="1188" class="note">De toespraak van Jahaziël en Josafats gebed zijn</text><text x="46" y="1224" class="note">afzonderlijke momenten.</text></svg>