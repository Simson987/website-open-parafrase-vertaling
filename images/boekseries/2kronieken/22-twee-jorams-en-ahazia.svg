<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Twee Jorams en Ahazia</title><desc id="desc">De gelijknamige koningen en de bezoeker met hun juiste relaties.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee Jorams en Ahazia</text><text x="44" y="113" class="ref">2 Kronieken 22:1–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Joram van Juda</text><text x="68" y="241" class="body">Zoon van Josafat; vader van Ahazia.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Joram van Israël</text><text x="68" y="390" class="body">Zoon van Achab; raakt gewond bij Ramoth</text><text x="68" y="433" class="body">en herstelt in Jizreël.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Ahazia</text><text x="68" y="582" class="body">Koning van Juda; gaat bij de gewonde</text><text x="68" y="625" class="body">Joram op bezoek en trekt met hem tegen</text><text x="68" y="668" class="body">Jehu op.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Jehu</text><text x="68" y="817" class="body">Oordeelt over Achabs huis; Ahazia wordt</text><text x="68" y="860" class="body">gevonden en gedood.</text><text x="46" y="953" class="note">Dit hoofdstuk noemt 42 jaar voor Ahazia en één</text><text x="46" y="989" class="note">regeringsjaar. De twee Jorams worden niet als</text><text x="46" y="1025" class="note">dezelfde persoon getekend.</text></svg>