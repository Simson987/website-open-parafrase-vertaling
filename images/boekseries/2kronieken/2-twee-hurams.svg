<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Huram en Huram-Abi</title><desc id="desc">Namen, herkomst en taken zonder de twee personen te vermengen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Huram en Huram-Abi</text><text x="44" y="113" class="ref">2 Kronieken 2:3–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Huram</text><text x="68" y="241" class="body">Koning van Tyrus; ontvangt het verzoek</text><text x="68" y="284" class="body">en antwoordt per brief.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Huram-Abi</text><text x="68" y="433" class="body">De gestuurde vakman; moeder uit Dan,</text><text x="68" y="476" class="body">vader uit Tyrus.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn vaardigheden</text><text x="68" y="625" class="body">Goud, zilver, koper, ijzer, steen,</text><text x="68" y="668" class="body">hout, kleuren, fijn linnen en</text><text x="68" y="711" class="body">graveerwerk.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Samenwerking</text><text x="68" y="860" class="body">Met de vaklieden van Salomo en die van</text><text x="68" y="903" class="body">David.</text><text x="46" y="996" class="note">Koning en vakman zijn twee verschillende</text><text x="46" y="1032" class="note">personen; dit hoofdstuk noemt Dan bij de moeder.</text></svg>