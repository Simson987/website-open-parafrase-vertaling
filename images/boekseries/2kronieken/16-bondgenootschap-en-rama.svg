<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Bondgenootschap en Rama</title><desc id="desc">Partijen, middelen, plaatsen en Hanani’s reactie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bondgenootschap en Rama</text><text x="44" y="113" class="ref">2 Kronieken 16:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Baësa</text><text x="68" y="241" class="body">Versterkt Rama om verkeer naar Juda te</text><text x="68" y="284" class="body">blokkeren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Asa en Benhadad</text><text x="68" y="433" class="body">Zilver en goud naar Damascus om</text><text x="68" y="476" class="body">Benhadads verbond met Baësa te breken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De aanval</text><text x="68" y="625" class="body">Ijon, Dan, Abel-Maïm en voorraadsteden</text><text x="68" y="668" class="body">van Nafthali; Baësa stopt met bouwen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Hergebruik</text><text x="68" y="817" class="body">Stenen en hout uit Rama naar Geba en</text><text x="68" y="860" class="body">Mizpa.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Hanani</text><text x="68" y="1009" class="body">Verwijt vertrouwen op Syrië; Asa zet</text><text x="68" y="1052" class="body">hem gevangen en onderdrukt mensen.</text><text x="46" y="1145" class="note">Politiek succes en de profetische beoordeling</text><text x="46" y="1181" class="note">daarvan staan naast elkaar.</text></svg>