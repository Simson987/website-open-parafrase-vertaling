<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Scheba: vragen en geschenken</title><desc id="desc">De beweging van vragen via waarneming naar erkenning en uitwisseling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Scheba: vragen en geschenken</text><text x="44" y="113" class="ref">2 Kronieken 9:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aankomst</text><text x="68" y="241" class="body">Raadsels en vragen; kamelen met</text><text x="68" y="284" class="body">specerijen, goud en edelstenen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waarneming</text><text x="68" y="433" class="body">Wijsheid, paleis, tafel, dienaren en</text><text x="68" y="476" class="body">opgang maken diepe indruk.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Erkenning</text><text x="68" y="625" class="body">Zij prijst God en noemt recht en</text><text x="68" y="668" class="body">gerechtigheid als doel van Salomo’s</text><text x="68" y="711" class="body">koningschap.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Wederzijdse gaven</text><text x="68" y="860" class="body">Zij geeft circa vier ton goud en</text><text x="68" y="903" class="body">kostbaarheden; Salomo geeft haar wat</text><text x="68" y="946" class="body">zij vraagt en meer.</text><text x="46" y="1039" class="note">Haar bezoek wordt niet tot alleen rijkdom</text><text x="46" y="1075" class="note">teruggebracht; vragen en rechtspraak horen bij</text><text x="46" y="1111" class="note">de passage.</text></svg>