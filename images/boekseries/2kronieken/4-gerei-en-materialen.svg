<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Gerei en materialen</title><desc id="desc">Aantallen, materialen en de plaats van het gietwerk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gerei en materialen</text><text x="44" y="113" class="ref">2 Kronieken 4:7–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tien en tien</text><text x="68" y="241" class="body">Tien gouden kandelaars en tien tafels:</text><text x="68" y="284" class="body">telkens vijf rechts en vijf links.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Goud</text><text x="68" y="433" class="body">Honderd sprengschalen; ook altaar,</text><text x="68" y="476" class="body">lampen, bekers, gerei en deuren.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Koper</text><text x="68" y="625" class="body">Zuilen, zee, onderstellen, wasvaten,</text><text x="68" y="668" class="body">potten, scheppen en vorken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vierhonderd</text><text x="68" y="817" class="body">Granaatappels rond twee kapitelen, in</text><text x="68" y="860" class="body">twee rijen per vlechtwerk.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Gietplaats</text><text x="68" y="1009" class="body">Jordaanvlakte tussen Sukkoth en</text><text x="68" y="1052" class="body">Zeredatha, in vaste kleivormen.</text><text x="46" y="1145" class="note">De aantallen per hoofdstuk worden behouden;</text><text x="46" y="1181" class="note">hoofdstuk 3 noemt honderd bij zijn eigen</text><text x="46" y="1217" class="note">beschrijving van het vlechtwerk.</text></svg>