<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Levieten bij de reiniging</title><desc id="desc">Alle genoemde Levieten met hun families en gecontroleerde namen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levieten bij de reiniging</text><text x="44" y="113" class="ref">2 Kronieken 29:12–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kahath en Merari</text><text x="68" y="241" class="body">Mahath, zoon van Amasai, en Joël, zoon</text><text x="68" y="284" class="body">van Azarja; Kis, zoon van Abdi, en</text><text x="68" y="327" class="body">Azarja, zoon van Jehaleël.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gerson</text><text x="68" y="476" class="body">Joah, zoon van Zimma, en Eden, zoon van</text><text x="68" y="519" class="body">Joah.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Elizafan en Asaf</text><text x="68" y="668" class="body">Simri en Jeïel; Zecharja en Mattanja.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Heman en Jeduthun</text><text x="68" y="817" class="body">Jehiël en Simeï; Semaja en Uzziël.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Samen</text><text x="68" y="966" class="body">Roepen hun broers bijeen, heiligen zich</text><text x="68" y="1009" class="body">en reinigen op gezag van het woord van</text><text x="68" y="1052" class="body">de HEERE.</text><text x="46" y="1145" class="note">Azarja en Joah staan met verschillende vaders of</text><text x="46" y="1181" class="note">generaties genoemd; Jeïel en Jehiël behouden hun</text><text x="46" y="1217" class="note">eigen spelling.</text></svg>