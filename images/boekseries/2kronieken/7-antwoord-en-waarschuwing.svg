<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Antwoord en waarschuwing</title><desc id="desc">De samenhang van gebed, bekering, belofte en waarschuwing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Antwoord en waarschuwing</text><text x="44" y="113" class="ref">2 Kronieken 7:12–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gebed gehoord</text><text x="68" y="241" class="body">God kiest de plaats als huis waar</text><text x="68" y="284" class="body">geofferd wordt.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij droogte of plaag</text><text x="68" y="433" class="body">Nederig worden, bidden, God zoeken en</text><text x="68" y="476" class="body">slechte wegen verlaten: horen,</text><text x="68" y="519" class="body">vergeven, land genezen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Aan Salomo</text><text x="68" y="668" class="body">Geboden houden; belofte over het</text><text x="68" y="711" class="body">koningschap.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bij afkeer</text><text x="68" y="860" class="body">Andere goden dienen leidt tot weggerukt</text><text x="68" y="903" class="body">worden en verwerping van het huis.</text><text x="46" y="996" class="note">Zegen en waarschuwing staan beide in het</text><text x="46" y="1032" class="note">nachtelijke antwoord; het gebouw is geen</text><text x="46" y="1068" class="note">vrijbrief voor ontrouw.</text></svg>