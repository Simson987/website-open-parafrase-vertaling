<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Omsingeling en afloop</title><desc id="desc">De hinderlaag, reactie en gevolgen met exacte plaatsnamen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Omsingeling en afloop</text><text x="44" y="113" class="ref">2 Kronieken 13:13–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee fronten</text><text x="68" y="241" class="body">Jerobeams leger staat voor Juda en een</text><text x="68" y="284" class="body">omtrekkende groep achter hen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De reactie</text><text x="68" y="433" class="body">Juda roept tot God; priesters blazen de</text><text x="68" y="476" class="body">trompetten en mannen heffen de</text><text x="68" y="519" class="body">strijdkreet aan.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De afloop</text><text x="68" y="668" class="body">Israël vlucht; de tekst noemt 500.000</text><text x="68" y="711" class="body">gesneuvelden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Ingenomen plaatsen</text><text x="68" y="860" class="body">Bethel, Jesana en Efron, met omliggende</text><text x="68" y="903" class="body">plaatsen.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Daarna</text><text x="68" y="1052" class="body">Jerobeam herstelt niet; Abia wordt</text><text x="68" y="1095" class="body">sterker en krijgt 22 zonen en zestien</text><text x="68" y="1138" class="body">dochters.</text><text x="46" y="1231" class="note">Tactisch verloop, geen schaalkaart; de genoemde</text><text x="46" y="1267" class="note">zware verliezen worden niet uit het verslag</text><text x="46" y="1303" class="note">weggelaten.</text></svg>