<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Amon en de opvolging</title><desc id="desc">Aantreden, beoordeling, dood en opvolging zonder ze te vermengen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Amon en de opvolging</text><text x="44" y="113" class="ref">2 Kronieken 33:21–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Amon</text><text x="68" y="241" class="body">22 jaar bij aantreden; twee jaar</text><text x="68" y="284" class="body">koning.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn keuze</text><text x="68" y="433" class="body">Dient de beelden en verootmoedigt zich</text><text x="68" y="476" class="body">niet zoals Manasse.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De samenzwering</text><text x="68" y="625" class="body">Dienaren doden hem in zijn huis.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het volk</text><text x="68" y="774" class="body">Doodt de samenzweerders en stelt zijn</text><text x="68" y="817" class="body">zoon Josia aan.</text><text x="46" y="910" class="note">Manasse en Amon zijn twee regeringen in</text><text x="46" y="946" class="note">hetzelfde hoofdstuk; hun reactie op schuld</text><text x="46" y="982" class="note">verschilt.</text></svg>