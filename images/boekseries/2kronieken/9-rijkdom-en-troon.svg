<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Rijkdom, troon en afloop</title><desc id="desc">Aantallen, troononderdelen en de overgang naar Rehabeam.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rijkdom, troon en afloop</text><text x="44" y="113" class="ref">2 Kronieken 9:13–31</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Goud en schilden</text><text x="68" y="241" class="body">Circa 23 ton per jaar; 200 grote</text><text x="68" y="284" class="body">schilden van circa 7 kilo en 300</text><text x="68" y="327" class="body">kleinere van circa 3,5 kilo.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Troon</text><text x="68" y="476" class="body">Ivoor met goud; zes treden met twaalf</text><text x="68" y="519" class="body">leeuwen, naast de zitting nog twee</text><text x="68" y="562" class="body">leeuwen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Handel</text><text x="68" y="711" class="body">Driejaarlijkse vaart met goud, zilver,</text><text x="68" y="754" class="body">ivoor, apen en pauwen; paarden uit</text><text x="68" y="797" class="body">Egypte en elders.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Stallen en ruiters</text><text x="68" y="946" class="body">4.000 stallen voor paarden en wagens en</text><text x="68" y="989" class="body">12.000 ruiters.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Opvolging</text><text x="68" y="1138" class="body">Na veertig jaar sterft Salomo; Rehabeam</text><text x="68" y="1181" class="body">wordt koning.</text><text x="46" y="1274" class="note">Twaalf leeuwen op de treden en twee bij de</text><text x="46" y="1310" class="note">leuningen zijn onderscheiden groepen; aantallen</text><text x="46" y="1346" class="note">volgen dit hoofdstuk.</text></svg>