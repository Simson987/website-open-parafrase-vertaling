<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Gebed in strijd en ballingschap</title><desc id="desc">Strijd, inkeer en de slotbede zonder toekomst en inwijding te verwisselen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed in strijd en ballingschap</text><text x="44" y="113" class="ref">2 Kronieken 6:34–42</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ten strijde</text><text x="68" y="241" class="body">Bidden naar de gekozen stad en het</text><text x="68" y="284" class="body">huis; vraag om recht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wegvoering</text><text x="68" y="433" class="body">Er is niemand zonder zonde;</text><text x="68" y="476" class="body">gevangenschap kan volgen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Terugkeer van het hart</text><text x="68" y="625" class="body">Inkeer en schuldbelijdenis in het land</text><text x="68" y="668" class="body">van gevangenschap; bidden naar land,</text><text x="68" y="711" class="body">stad en huis.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Slotbede</text><text x="68" y="860" class="body">Gods ogen en oren open; rustplaats,</text><text x="68" y="903" class="body">ark, priesters, getrouwen en trouw aan</text><text x="68" y="946" class="body">David.</text><text x="46" y="1039" class="note">Ballingschap staat hier als mogelijk toekomstig</text><text x="46" y="1075" class="note">geval in Salomo’s gebed.</text></svg>