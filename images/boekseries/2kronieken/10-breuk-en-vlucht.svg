<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Breuk en vlucht</title><desc id="desc">Reden, breuk en vlucht met correcte persoonsrollen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Breuk en vlucht</text><text x="44" y="113" class="ref">2 Kronieken 10:15–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De verteller</text><text x="68" y="241" class="body">Verbindt de wending met het woord via</text><text x="68" y="284" class="body">Ahia uit Silo aan Jerobeam.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Israël</text><text x="68" y="433" class="body">Keert zich af van Davids huis en gaat</text><text x="68" y="476" class="body">naar huis.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Juda</text><text x="68" y="625" class="body">Rehabeam blijft koning over de</text><text x="68" y="668" class="body">Israëlieten in Juda’s steden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Hadoram</text><text x="68" y="817" class="body">Opzichter over dwangarbeid, wordt</text><text x="68" y="860" class="body">gestenigd en sterft.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Rehabeam</text><text x="68" y="1009" class="body">Vlucht op zijn wagen naar Jeruzalem.</text><text x="46" y="1102" class="note">Dit hoofdstuk noemt Hadoram; hij wordt niet</text><text x="46" y="1138" class="note">verward met Hadoram, de zoon van Thou, uit het</text><text x="46" y="1174" class="note">eerdere boek.</text></svg>