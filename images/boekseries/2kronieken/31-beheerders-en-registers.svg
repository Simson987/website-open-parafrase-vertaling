<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1448" viewBox="0 0 840 1448" role="img" aria-labelledby="title desc"><title id="title">Beheerders en registers</title><desc id="desc">Alle beheerders en het onderscheid tussen familie- en dienstregistratie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1448" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beheerders en registers</text><text x="44" y="113" class="ref">2 Kronieken 31:13–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tien opzichters</text><text x="68" y="241" class="body">Jehiël, Azazja, Nahath, Asahel,</text><text x="68" y="284" class="body">Jerimoth, Jozabad, Eliël, Jismachja,</text><text x="68" y="327" class="body">Mahath en Benaja.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Kore, zoon van Jimna</text><text x="68" y="476" class="body">Oostelijke poortwachter; vrijwillige</text><text x="68" y="519" class="body">gaven en verdeling.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zes helpers</text><text x="68" y="668" class="body">Eden, Minjamin, Jesua, Semaja, Amarja</text><text x="68" y="711" class="body">en Sechanja.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Registers</text><text x="68" y="860" class="body">Familiegroepen en dienst; Levieten</text><text x="68" y="903" class="body">vanaf twintig, met gezinnen ook</text><text x="68" y="946" class="body">vermeld.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Trouw</text><text x="68" y="1095" class="body">In steden en op weidegronden ontvangen</text><text x="68" y="1138" class="body">de aangewezen groepen hun deel, klein</text><text x="68" y="1181" class="body">en groot.</text><text x="46" y="1274" class="note">Vers 16 noemt drie jaar en ouder bij het</text><text x="46" y="1310" class="note">register; vers 17 noemt twintig bij de</text><text x="46" y="1346" class="note">Levitische dienst. Het zijn verschillende</text><text x="46" y="1382" class="note">vermeldingen.</text></svg>