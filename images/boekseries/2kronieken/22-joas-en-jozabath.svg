<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Joas gered en verborgen</title><desc id="desc">De drie beschermende rollen en de exacte familiebanden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Joas gered en verborgen</text><text x="44" y="113" class="ref">2 Kronieken 22:10–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Athalia</text><text x="68" y="241" class="body">Moeder van Ahazia; doodt de</text><text x="68" y="284" class="body">koningskinderen na zijn dood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jozabath</text><text x="68" y="433" class="body">Dochter van Joram, zus van Ahazia en</text><text x="68" y="476" class="body">vrouw van priester Jojada.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Joas</text><text x="68" y="625" class="body">Zoon van Ahazia; Jozabath brengt hem en</text><text x="68" y="668" class="body">zijn voedster in een slaapkamer in</text><text x="68" y="711" class="body">veiligheid.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zes jaar</text><text x="68" y="860" class="body">Verborgen in het huis van God, terwijl</text><text x="68" y="903" class="body">Athalia regeert.</text><text x="46" y="996" class="note">Jozabath is Joas’ tante; Jojada haar man. De</text><text x="46" y="1032" class="note">voedster is een afzonderlijke aanwezige persoon.</text></svg>