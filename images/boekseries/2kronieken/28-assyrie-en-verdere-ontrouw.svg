<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Assyrië en verdere ontrouw</title><desc id="desc">Buitenlandse hulp, verlies en de sluiting van het heiligdom.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Assyrië en verdere ontrouw</text><text x="44" y="113" class="ref">2 Kronieken 28:16–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nog meer verlies</text><text x="68" y="241" class="body">Edom en Filistijnen nemen gebieden en</text><text x="68" y="284" class="body">gevangenen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Assyrië</text><text x="68" y="433" class="body">Tiglath-Pilneser helpt niet; ondanks</text><text x="68" y="476" class="body">schatten uit tempel, paleis en leiders</text><text x="68" y="519" class="body">brengt hij Achaz in het nauw.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Damascus’ goden</text><text x="68" y="668" class="body">Achaz offert hun omdat hij denkt dat</text><text x="68" y="711" class="body">zij de Syriërs helpen; het wordt zijn</text><text x="68" y="754" class="body">ondergang.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De deuren dicht</text><text x="68" y="903" class="body">Gerei stukgeslagen, heiligdom gesloten,</text><text x="68" y="946" class="body">altaren in Jeruzalem en offerhoogten in</text><text x="68" y="989" class="body">Juda.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Opvolging</text><text x="68" y="1138" class="body">Achaz buiten de koningsgraven begraven;</text><text x="68" y="1181" class="body">zijn zoon Jehizkia wordt koning.</text><text x="46" y="1274" class="note">De geschenken aan Assyrië brengen hier geen</text><text x="46" y="1310" class="note">redding; het verslag noemt juist toenemende</text><text x="46" y="1346" class="note">ontrouw.</text></svg>