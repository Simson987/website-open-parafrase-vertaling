<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Gezin en opvolgingskeuze</title><desc id="desc">Genoemde herkomst, kinderen van Maächa en opvolgingskeuze.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gezin en opvolgingskeuze</text><text x="44" y="113" class="ref">2 Kronieken 11:18–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Genoemde huwelijken</text><text x="68" y="241" class="body">Mahalath, dochter van Jerimoth uit</text><text x="68" y="284" class="body">Davids familie; Abihaïl, dochter van</text><text x="68" y="327" class="body">Eliab, zoon van Isaï.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Nog genoemde zonen</text><text x="68" y="476" class="body">Vers 19 noemt Jeüs, Semaria en Zaham.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Maächa</text><text x="68" y="625" class="body">Dochter van Absalom; kinderen Abia,</text><text x="68" y="668" class="body">Attai, Ziza en Selomith.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Aantallen</text><text x="68" y="817" class="body">Achttien vrouwen, zestig bijvrouwen, 28</text><text x="68" y="860" class="body">zonen en zestig dochters.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Opvolging</text><text x="68" y="1009" class="body">Abia, zoon van Maächa, wordt leider</text><text x="68" y="1052" class="body">onder zijn broers en beoogd opvolger.</text><text x="46" y="1145" class="note">De tekst noemt Mahalath en Abihaïl en verwijst</text><text x="46" y="1181" class="note">in vers 19 met zij naar de moeder; de drie zonen</text><text x="46" y="1217" class="note">blijven bij die eigen passage.</text></svg>