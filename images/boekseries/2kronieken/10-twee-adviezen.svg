<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Twee adviezen aan Rehabeam</title><desc id="desc">Tegenovergestelde raad en het gekozen antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee adviezen aan Rehabeam</text><text x="44" y="113" class="ref">2 Kronieken 10:4–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag van het volk</text><text x="68" y="241" class="body">Minder hard werk en een lichter juk;</text><text x="68" y="284" class="body">dan zullen zij dienen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De oudsten</text><text x="68" y="433" class="body">Wees goed en vriendelijk, spreek goede</text><text x="68" y="476" class="body">woorden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn tijdgenoten</text><text x="68" y="625" class="body">Maak het juk zwaarder en dreig met</text><text x="68" y="668" class="body">strengere bestraffing.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De keuze</text><text x="68" y="817" class="body">Na drie dagen geeft Rehabeam een hard</text><text x="68" y="860" class="body">antwoord volgens zijn tijdgenoten.</text><text x="46" y="953" class="note">Juk, pink en schorpioenen horen bij beeldspraak</text><text x="46" y="989" class="note">en dreiging; het zijn geen letterlijk afgebeelde</text><text x="46" y="1025" class="note">dieren op het plein.</text></svg>