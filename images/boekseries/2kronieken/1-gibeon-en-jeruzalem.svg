<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Gibeon en Jeruzalem</title><desc id="desc">Twee locaties, verzoek en antwoord bij Salomo’s begin.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gibeon en Jeruzalem</text><text x="44" y="113" class="ref">2 Kronieken 1:3–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gibeon</text><text x="68" y="241" class="body">De ontmoetingstent van Mozes en het</text><text x="68" y="284" class="body">koperen altaar van Bezaleël, zoon van</text><text x="68" y="327" class="body">Uri en kleinzoon van Hur.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jeruzalem</text><text x="68" y="476" class="body">De ark staat in de tent die David</text><text x="68" y="519" class="body">ervoor heeft gemaakt.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De nachtelijke vraag</text><text x="68" y="668" class="body">Salomo vraagt wijsheid en inzicht om</text><text x="68" y="711" class="body">Gods volk te leiden en recht te</text><text x="68" y="754" class="body">spreken.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het antwoord</text><text x="68" y="903" class="body">Wijsheid en inzicht, en daarnaast</text><text x="68" y="946" class="body">rijkdom, bezit en eer; vervolgens keert</text><text x="68" y="989" class="body">Salomo naar Jeruzalem terug.</text><text x="46" y="1082" class="note">De twee tenten en plaatsen worden niet</text><text x="46" y="1118" class="note">samengevoegd.</text></svg>