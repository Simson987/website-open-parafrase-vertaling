<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1376" viewBox="0 0 840 1376" role="img" aria-labelledby="title desc"><title id="title">Offers, zang en vreugde</title><desc id="desc">Aantallen, muziek, hulp en de vreugde bij de herstelde dienst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1376" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Offers, zang en vreugde</text><text x="44" y="113" class="ref">2 Kronieken 29:20–36</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste reeks</text><text x="68" y="241" class="body">Zeven stieren, zeven rammen, zeven</text><text x="68" y="284" class="body">lammeren en zeven bokken; voor</text><text x="68" y="327" class="body">koningshuis, heiligdom en Juda.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Heel Israël</text><text x="68" y="476" class="body">De koning beveelt verzoening voor heel</text><text x="68" y="519" class="body">Israël.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zang en trompetten</text><text x="68" y="668" class="body">Begint bij het brandoffer; de</text><text x="68" y="711" class="body">vergadering buigt en knielt.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Verdere gaven</text><text x="68" y="860" class="body">70 runderen, 100 rammen en 200 lammeren</text><text x="68" y="903" class="body">als brandoffer; 600 runderen en 3.000</text><text x="68" y="946" class="body">schapen als gewijde gaven.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De helpers</text><text x="68" y="1095" class="body">Te weinig priesters; Levieten helpen</text><text x="68" y="1138" class="body">tot het werk klaar is. Koning en volk</text><text x="68" y="1181" class="body">verheugen zich.</text><text x="46" y="1274" class="note">De verschillende offerreeksen en gewijde gaven</text><text x="46" y="1310" class="note">worden niet als één identiek getal samengevoegd.</text></svg>