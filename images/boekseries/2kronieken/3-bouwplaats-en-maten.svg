<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Bouwplaats en hoofdmaten</title><desc id="desc">Plaats, datering en expliciet genoemde bouwmaten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bouwplaats en hoofdmaten</text><text x="44" y="113" class="ref">2 Kronieken 3:1–9</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Plaats en begin</text><text x="68" y="241" class="body">Moria in Jeruzalem, Ornans dorsvloer;</text><text x="68" y="284" class="body">tweede dag van maand twee in Salomo’s</text><text x="68" y="327" class="body">vierde regeringsjaar.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het huis</text><text x="68" y="476" class="body">Volgens de oude maat ongeveer 27 meter</text><text x="68" y="519" class="body">lang en 9 meter breed.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Voorhal</text><text x="68" y="668" class="body">Ongeveer 9 meter breed en volgens dit</text><text x="68" y="711" class="body">vers 54 meter hoog.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Allerheiligste</text><text x="68" y="860" class="body">Ongeveer 9 bij 9 meter; bekleed met</text><text x="68" y="903" class="body">ongeveer twintig ton goud.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Versiering</text><text x="68" y="1052" class="body">Cipres, goud, palmen, vlechtwerk,</text><text x="68" y="1095" class="body">kostbare stenen en gegraveerde cherubs.</text><text x="46" y="1188" class="note">Afgeronde maten volgen deze vertaling; de</text><text x="46" y="1224" class="note">voorhalhoogte wordt niet stilzwijgend gewijzigd.</text></svg>