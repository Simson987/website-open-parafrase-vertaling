<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Stedenbouw en arbeid</title><desc id="desc">Bouwplaatsen, groepen en de reden voor de verhuizing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stedenbouw en arbeid</text><text x="44" y="113" class="ref">2 Kronieken 8:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Na twintig jaar</text><text x="68" y="241" class="body">Werk aan tempel en paleis; daarna</text><text x="68" y="284" class="body">stedenbouw en vestiging.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Genoemde plaatsen</text><text x="68" y="433" class="body">Hamath-Zoba, Tadmor, Hoog- en</text><text x="68" y="476" class="body">Laag-Beth-Horon en Baälath.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dwangarbeid</text><text x="68" y="625" class="body">Overgebleven Hethieten, Amorieten,</text><text x="68" y="668" class="body">Ferezieten, Hevieten en Jebusieten.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Israëlieten</text><text x="68" y="817" class="body">Soldaten en bevelhebbers; geen slaven</text><text x="68" y="860" class="body">voor dit werk. Daarnaast 250</text><text x="68" y="903" class="body">opzichters.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Eigen woning</text><text x="68" y="1052" class="body">De dochter van Farao verhuist uit</text><text x="68" y="1095" class="body">Davids stad wegens de heilige plaatsen</text><text x="68" y="1138" class="body">waar de ark was.</text><text x="46" y="1231" class="note">De verschillende arbeidsgroepen worden benoemd;</text><text x="46" y="1267" class="note">dit is geen beeld van uitsluitend vrijwillige</text><text x="46" y="1303" class="note">bouwarbeid.</text></svg>