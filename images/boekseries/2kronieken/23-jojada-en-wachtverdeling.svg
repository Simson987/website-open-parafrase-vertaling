<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Jojada en de wachtverdeling</title><desc id="desc">Namen, drie posten en het onderscheid in toegang.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jojada en de wachtverdeling</text><text x="44" y="113" class="ref">2 Kronieken 23:1–10</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vijf aanvoerders</text><text x="68" y="241" class="body">Azarja, zoon van Jeroham; Ismaël, zoon</text><text x="68" y="284" class="body">van Johanan; Azarja, zoon van Obed;</text><text x="68" y="327" class="body">Maäseja, zoon van Adaja; Elisafat, zoon</text><text x="68" y="370" class="body">van Zichri.</text><rect x="42" y="428" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Drie groepen</text><text x="68" y="519" class="body">Eén derde bij de drempels; één bij het</text><text x="68" y="562" class="body">paleis; één bij de Fundamentpoort.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Toegang</text><text x="68" y="711" class="body">Volk in de voorhoven; alleen priesters</text><text x="68" y="754" class="body">en dienstdoende Levieten het huis</text><text x="68" y="797" class="body">binnen.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Rond de koning</text><text x="68" y="946" class="body">Levieten bewaken hem met Davids speren</text><text x="68" y="989" class="body">en schilden; dienstgroepen blijven</text><text x="68" y="1032" class="body">bijeen.</text><text x="46" y="1125" class="note">De twee Azarja’s hebben verschillende vaders.</text><text x="46" y="1161" class="note">Dit is taakverdeling, geen plattegrond met</text><text x="46" y="1197" class="note">verzonnen afstanden.</text></svg>