<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Boek, gezanten en Hulda</title><desc id="desc">De juiste rollen en de weg van het gevonden boek naar verbondsvernieuwing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boek, gezanten en Hulda</text><text x="44" y="113" class="ref">2 Kronieken 34:15–33</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hilkia en Safan</text><text x="68" y="241" class="body">Hogepriester vindt het boek; schrijver</text><text x="68" y="284" class="body">brengt het naar de koning en leest</text><text x="68" y="327" class="body">voor.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vijf gezanten</text><text x="68" y="476" class="body">Hilkia, Ahikam, Abdon, Safan en Asaja;</text><text x="68" y="519" class="body">naar profetes Hulda.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Hulda</text><text x="68" y="668" class="body">Vrouw van Sallum, kledingbeheerder;</text><text x="68" y="711" class="body">woont in de nieuwe wijk van Jeruzalem.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het antwoord</text><text x="68" y="860" class="body">Oordeel over de plaats; de nederige</text><text x="68" y="903" class="body">koning zal het aangekondigde onheil</text><text x="68" y="946" class="body">niet zien.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Verbond</text><text x="68" y="1095" class="body">Josia leest aan het volk voor en</text><text x="68" y="1138" class="body">verbindt zich met hart en ziel aan de</text><text x="68" y="1181" class="body">geboden.</text><text x="46" y="1274" class="note">Safan is schrijver en Hilkia hogepriester.</text><text x="46" y="1310" class="note">Hulda’s antwoord en de openbare lezing zijn</text><text x="46" y="1346" class="note">verschillende fasen.</text></svg>