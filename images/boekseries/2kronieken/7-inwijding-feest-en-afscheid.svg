<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Inwijding, feest en afscheid</title><desc id="desc">Aantallen, dienst en tijdsaanduidingen bij de inwijding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Inwijding, feest en afscheid</text><text x="44" y="113" class="ref">2 Kronieken 7:4–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Offers</text><text x="68" y="241" class="body">22.000 runderen en 120.000 schapen; de</text><text x="68" y="284" class="body">voorhof wordt mede gebruikt omdat het</text><text x="68" y="327" class="body">altaar te klein is.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dienst</text><text x="68" y="476" class="body">Priesters op hun post, Levieten met</text><text x="68" y="519" class="body">Davids instrumenten en trompetters</text><text x="68" y="562" class="body">tegenover hen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Twee perioden</text><text x="68" y="711" class="body">Zeven dagen inwijding van het altaar en</text><text x="68" y="754" class="body">zeven dagen feest; een feestelijke</text><text x="68" y="797" class="body">slotdag.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Naar huis</text><text x="68" y="946" class="body">Op dag 23 van de zevende maand; blij om</text><text x="68" y="989" class="body">het goede aan David, Salomo en Israël.</text><text x="46" y="1082" class="note">De twee zevendaagse perioden blijven</text><text x="46" y="1118" class="note">afzonderlijk; de genoemde slotdag wordt niet tot</text><text x="46" y="1154" class="note">één kort feest teruggebracht.</text></svg>