<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1376" viewBox="0 0 840 1376" role="img" aria-labelledby="title desc"><title id="title">Kist, geld en herstel</title><desc id="desc">De geldstroom en het werk onder Jojada.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1376" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kist, geld en herstel</text><text x="44" y="113" class="ref">2 Kronieken 24:4–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste oproep</text><text x="68" y="241" class="body">Joas vraagt de bijdrage; de Levieten</text><text x="68" y="284" class="body">haastten zich aanvankelijk niet.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De kist</text><text x="68" y="433" class="body">Buiten bij de poort; volk en leiders</text><text x="68" y="476" class="body">brengen blij hun bijdrage.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verantwoording</text><text x="68" y="625" class="body">Koninklijke schrijver en gemachtigde</text><text x="68" y="668" class="body">van de hogepriester legen de kist;</text><text x="68" y="711" class="body">steeds teruggezet.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vaklieden en restgeld</text><text x="68" y="860" class="body">Steen, hout, ijzer en koper;</text><text x="68" y="903" class="body">overgebleven geld voor gouden en</text><text x="68" y="946" class="body">zilveren gerei.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Jojada</text><text x="68" y="1095" class="body">Sterft op 130 jaar en wordt bij de</text><text x="68" y="1138" class="body">koningen begraven wegens zijn goede</text><text x="68" y="1181" class="body">werk.</text><text x="46" y="1274" class="note">De inzameling, controle, besteding en</text><text x="46" y="1310" class="note">restbestemming zijn onderscheiden stappen.</text></svg>