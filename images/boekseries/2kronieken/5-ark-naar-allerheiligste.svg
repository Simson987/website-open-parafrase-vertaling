<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">De ark naar haar plaats</title><desc id="desc">Volgorde en plaatsing met alleen de hier genoemde inhoud van de ark.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De ark naar haar plaats</text><text x="44" y="113" class="ref">2 Kronieken 5:2–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zevende maand</text><text x="68" y="241" class="body">Oudsten, stamhoofden en families komen</text><text x="68" y="284" class="body">voor het feest bijeen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dragen</text><text x="68" y="433" class="body">Levieten tillen de ark; priesters en</text><text x="68" y="476" class="body">Levieten brengen ook tent en heilig</text><text x="68" y="519" class="body">gerei.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Binnenste vertrek</text><text x="68" y="668" class="body">Ark en draagbomen komen onder de</text><text x="68" y="711" class="body">uitgespreide vleugels van de cherubs.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Inhoud</text><text x="68" y="860" class="body">Alleen de twee stenen platen die Mozes</text><text x="68" y="903" class="body">bij Horeb in de ark legde.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Zang en wolk</text><text x="68" y="1052" class="body">Zangers aan de oostkant van het altaar,</text><text x="68" y="1095" class="body">120 trompetters; de wolk verhindert de</text><text x="68" y="1138" class="body">priesterdienst.</text><text x="46" y="1231" class="note">De stoet, plaatsing, muziek en wolk zijn</text><text x="46" y="1267" class="note">verschillende fasen.</text></svg>