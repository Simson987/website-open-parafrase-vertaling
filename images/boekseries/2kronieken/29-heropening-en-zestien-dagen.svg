<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Heropening en zestien dagen</title><desc id="desc">Regering, volgorde, tijdsduur en taken bij de reiniging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Heropening en zestien dagen</text><text x="44" y="113" class="ref">2 Kronieken 29:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jehizkia</text><text x="68" y="241" class="body">Begint op 25 jaar; 29 jaar koning.</text><text x="68" y="284" class="body">Moeder Abia, dochter van Zacharia.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jaar één, maand één</text><text x="68" y="433" class="body">Deuren geopend en hersteld; priesters</text><text x="68" y="476" class="body">en Levieten bijeengeroepen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dag één tot acht</text><text x="68" y="625" class="body">Heiliging vanaf de eerste dag; op dag</text><text x="68" y="668" class="body">acht bij de voorhal.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tot dag zestien</text><text x="68" y="817" class="body">Nog acht dagen voor het huis; op dag</text><text x="68" y="860" class="body">zestien klaar.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Werkverdeling</text><text x="68" y="1009" class="body">Priesters brengen onreinheid naar de</text><text x="68" y="1052" class="body">voorhof; Levieten dragen die naar de</text><text x="68" y="1095" class="body">Kidron.</text><text x="46" y="1188" class="note">De oorspronkelijke deuren worden heropend; de</text><text x="46" y="1224" class="note">reiniging is niet op één dag voltooid.</text></svg>