<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Profeten en Micha’s waarschuwing</title><desc id="desc">Partijen, tegengestelde uitspraken en de gevangenzetting.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Profeten en Micha’s waarschuwing</text><text x="44" y="113" class="ref">2 Kronieken 18:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verbond</text><text x="68" y="241" class="body">Josafat gaat met Achab naar Ramoth in</text><text x="68" y="284" class="body">Gilead, maar vraagt eerst Gods woord.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vierhonderd profeten</text><text x="68" y="433" class="body">Voorspellen succes; Zedekia toont</text><text x="68" y="476" class="body">ijzeren horens.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Micha, zoon van Jimla</text><text x="68" y="625" class="body">Zegt alleen te spreken wat God zegt;</text><text x="68" y="668" class="body">beeld van schapen zonder herder en een</text><text x="68" y="711" class="body">hemels visioen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Gevolg</text><text x="68" y="860" class="body">Zedekia slaat Micha; Achab laat hem met</text><text x="68" y="903" class="body">brood en water opsluiten.</text><text x="46" y="996" class="note">Micha’s visioen is zijn weergegeven profetische</text><text x="46" y="1032" class="note">gezicht; de ijzeren horens zijn een gemaakte</text><text x="46" y="1068" class="note">symbolische voorstelling.</text></svg>