<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Cherubs en twee zuilen</title><desc id="desc">Vleugelrelaties, materialen en namen van de zuilen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Cherubs en twee zuilen</text><text x="44" y="113" class="ref">2 Kronieken 3:10–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee cherubs</text><text x="68" y="241" class="body">Rechtop, naar de zaal gericht; elke</text><text x="68" y="284" class="body">vleugel ongeveer 2,25 meter.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wand tot wand</text><text x="68" y="433" class="body">Vier vleugels spannen samen ongeveer 9</text><text x="68" y="476" class="body">meter; buitenste vleugels raken de</text><text x="68" y="519" class="body">wanden, binnenste elkaar.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Voorhangsel</text><text x="68" y="668" class="body">Blauwpurper, purper, karmozijn en fijn</text><text x="68" y="711" class="body">linnen, met cherubs.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zuilen</text><text x="68" y="860" class="body">Ongeveer 16 meter hoog met kapitelen</text><text x="68" y="903" class="body">van 2,25 meter; rechts Jachin, links</text><text x="68" y="946" class="body">Boaz.</text><text x="46" y="1039" class="note">De vleugellengten vormen samen de breedte; de</text><text x="46" y="1075" class="note">zijden volgen de beschrijving in de tekst.</text></svg>