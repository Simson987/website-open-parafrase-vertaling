<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Jehu en het rechtspreken</title><desc id="desc">Profetische terechtwijzing en de principes van rechtspraak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jehu en het rechtspreken</text><text x="44" y="113" class="ref">2 Kronieken 19:2–10</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jehu, zoon van Hanani</text><text x="68" y="241" class="body">Verwijt Josafat hulp aan de goddeloze;</text><text x="68" y="284" class="body">erkent ook het zoeken van God en</text><text x="68" y="327" class="body">verwijderen van gewijde palen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Stad voor stad</text><text x="68" y="476" class="body">Josafat brengt het volk terug en stelt</text><text x="68" y="519" class="body">rechters in de vestingsteden aan.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Beginselen</text><text x="68" y="668" class="body">Ontzag, trouw en toegewijd hart; geen</text><text x="68" y="711" class="body">onrecht, partijdigheid of omkoping.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">In Jeruzalem</text><text x="68" y="860" class="body">Levieten, priesters en familiehoofden</text><text x="68" y="903" class="body">behandelen geschillen en waarschuwen</text><text x="68" y="946" class="body">tegen schuld.</text><text x="46" y="1039" class="note">Jehu is hier de zoon van de ziener Hanani; hij</text><text x="46" y="1075" class="note">wordt niet met de latere koning van Israël</text><text x="46" y="1111" class="note">verward.</text></svg>