<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Regering en de gebroken vloot</title><desc id="desc">Regeringsgegevens, beoordeling en het tweede bondgenootschap.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Regering en de gebroken vloot</text><text x="44" y="113" class="ref">2 Kronieken 20:31–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Josafat</text><text x="68" y="241" class="body">Begint op 35 jaar; 25 jaar koning.</text><text x="68" y="284" class="body">Moeder Azuba, dochter van Silhi.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Beoordeling</text><text x="68" y="433" class="body">Gaat Asa’s weg, maar offerhoogten</text><text x="68" y="476" class="body">blijven en het volk is niet volledig</text><text x="68" y="519" class="body">toegewijd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ahazia</text><text x="68" y="668" class="body">Koning van Israël; goddeloze bondgenoot</text><text x="68" y="711" class="body">bij de scheepsbouw in Ezeon-Geber.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Eliëzer</text><text x="68" y="860" class="body">Zoon van Dodava uit Maresa; kondigt aan</text><text x="68" y="903" class="body">dat God het werk verscheurt.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De uitkomst</text><text x="68" y="1052" class="body">Schipbreuk; zij kunnen niet naar Tarsis</text><text x="68" y="1095" class="body">varen.</text><text x="46" y="1188" class="note">De mislukte vloot volgt als afzonderlijke</text><text x="46" y="1224" class="note">episode na de overwinning en rust.</text></svg>