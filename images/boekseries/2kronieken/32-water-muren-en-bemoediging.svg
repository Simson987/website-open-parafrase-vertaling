<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Water, muren en bemoediging</title><desc id="desc">Watermaatregelen en verdediging naast de uitgesproken hoop.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Water, muren en bemoediging</text><text x="44" y="113" class="ref">2 Kronieken 32:1–8, 30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sanherib</text><text x="68" y="241" class="body">Belegert Juda’s vestingsteden en richt</text><text x="68" y="284" class="body">zich op Jeruzalem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Water buiten de stad</text><text x="68" y="433" class="body">Bronnen en beek afgesloten zodat de</text><text x="68" y="476" class="body">vijand die niet gebruikt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verdediging</text><text x="68" y="625" class="body">Gebroken muur herbouwd, extra muur,</text><text x="68" y="668" class="body">Millo versterkt, wapens en schilden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gihon</text><text x="68" y="817" class="body">Bovenste uitloop afgesloten; water naar</text><text x="68" y="860" class="body">de westkant van Davids stad geleid.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Bemoediging</text><text x="68" y="1009" class="body">Met ons is de HEERE; het volk steunt op</text><text x="68" y="1052" class="body">Jehizkia’s woorden.</text><text x="46" y="1145" class="note">Het schema geeft de tekstuele samenhang, geen</text><text x="46" y="1181" class="note">ongedocumenteerde exacte tunnelroute op een</text><text x="46" y="1217" class="note">moderne kaart.</text></svg>