<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Gebed en verlengd feest</title><desc id="desc">Voorbede, antwoord, tijdsduur en onderscheiden gevers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed en verlengd feest</text><text x="44" y="113" class="ref">2 Kronieken 30:18–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voor wie niet rein waren</text><text x="68" y="241" class="body">Uit Efraïm, Manasse, Issaschar en</text><text x="68" y="284" class="body">Zebulon; Jehizkia bidt om verzoening</text><text x="68" y="327" class="body">voor wie God met heel hun hart zoeken.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het antwoord</text><text x="68" y="476" class="body">God hoort en geneest het volk.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zeven plus zeven</text><text x="68" y="625" class="body">Eerst zeven dagen ongezuurde broden,</text><text x="68" y="668" class="body">daarna gezamenlijk besloten extra zeven</text><text x="68" y="711" class="body">dagen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De bijdragen</text><text x="68" y="860" class="body">Koning: 1.000 stieren en 7.000 schapen;</text><text x="68" y="903" class="body">leiders: 1.000 stieren en 10.000</text><text x="68" y="946" class="body">schapen.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Samen blij</text><text x="68" y="1095" class="body">Juda, gekomen Israëlieten en</text><text x="68" y="1138" class="body">vreemdelingen; priesters zegenen het</text><text x="68" y="1181" class="body">volk en hun gebed wordt gehoord.</text><text x="46" y="1274" class="note">Het gebed om reinheid, de verlenging en de</text><text x="46" y="1310" class="note">priesterzegen zijn verschillende momenten binnen</text><text x="46" y="1346" class="note">één feest.</text></svg>