<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Onderwijzers met het wetboek</title><desc id="desc">Alle genoemde onderwijzers, hun groepen en hun taak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onderwijzers met het wetboek</text><text x="44" y="113" class="ref">2 Kronieken 17:7–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vijf leiders</text><text x="68" y="241" class="body">Ben-Chaïl, Obadja, Zecharja, Nethaneël</text><text x="68" y="284" class="body">en Michaja.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Negen Levieten</text><text x="68" y="433" class="body">Semaja, Nethanja, Zebadja, Asaël,</text><text x="68" y="476" class="body">Semiramoth, Jonathan, Adonia, Tobia en</text><text x="68" y="519" class="body">Tob-Adonia.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Twee priesters</text><text x="68" y="668" class="body">Elisama en Joram.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Opdracht in jaar drie</text><text x="68" y="817" class="body">Met het wetboek alle steden van Juda</text><text x="68" y="860" class="body">rondgaan en het volk onderwijzen.</text><text x="46" y="953" class="note">Gelijknamige personen in andere hoofdstukken</text><text x="46" y="989" class="note">worden niet zonder bron aan deze leraren</text><text x="46" y="1025" class="note">gelijkgesteld.</text></svg>