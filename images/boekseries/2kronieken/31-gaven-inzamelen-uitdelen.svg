<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Van afbreken naar uitdelen</title><desc id="desc">Stappen, tijdsduur en eerste verantwoordelijken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van afbreken naar uitdelen</text><text x="44" y="113" class="ref">2 Kronieken 31:1–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Na het feest</text><text x="68" y="241" class="body">Gewijde stenen, palen, hoogten en</text><text x="68" y="284" class="body">altaren weg uit Juda, Benjamin, Efraïm</text><text x="68" y="327" class="body">en Manasse.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Geregelde dienst</text><text x="68" y="476" class="body">Priesters en Levieten; de koning geeft</text><text x="68" y="519" class="body">uit eigen bezit voor de vaste offers.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het volk</text><text x="68" y="668" class="body">Eerstelingen van graan, wijn, olie en</text><text x="68" y="711" class="body">honing; tienden, dieren en gewijde</text><text x="68" y="754" class="body">gaven.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Maand drie tot zeven</text><text x="68" y="903" class="body">Stapels verzameld; genoeg voedsel en</text><text x="68" y="946" class="body">veel over, volgens hogepriester Azaria</text><text x="68" y="989" class="body">uit Zadoks huis.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Opslagkamers</text><text x="68" y="1138" class="body">In het huis ingericht; Chonanja leidt,</text><text x="68" y="1181" class="body">zijn broer Simeï is tweede.</text><text x="46" y="1274" class="note">De hervorming, vaste ondersteuning en</text><text x="46" y="1310" class="note">voorraadverdeling vormen samen één herstel van</text><text x="46" y="1346" class="note">de dienst.</text></svg>