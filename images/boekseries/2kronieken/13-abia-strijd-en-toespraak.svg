<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Abia’s strijd en toespraak</title><desc id="desc">Datering, twee legers en de inhoud van de toespraak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Abia’s strijd en toespraak</text><text x="44" y="113" class="ref">2 Kronieken 13:1–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Datering</text><text x="68" y="241" class="body">Jerobeams achttiende jaar; Abia regeert</text><text x="68" y="284" class="body">drie jaar. Moeder: Michaja, dochter van</text><text x="68" y="327" class="body">Uriël uit Gibea.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Legers</text><text x="68" y="476" class="body">Abia: 400.000; Jerobeam: 800.000.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Berg Zemaraïm</text><text x="68" y="625" class="body">Abia spreekt over Davids koningschap en</text><text x="68" y="668" class="body">het zoutverbond.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn tegenstelling</text><text x="68" y="817" class="body">Gouden kalveren en eigen priesters</text><text x="68" y="860" class="body">tegenover de HEERE, Aärons priesters en</text><text x="68" y="903" class="body">de geregelde eredienst.</text><text x="46" y="996" class="note">De moedernaam volgt dit hoofdstuk; Abia’s</text><text x="46" y="1032" class="note">oordeel over de twee erediensten is zijn</text><text x="46" y="1068" class="note">toespraak.</text></svg>