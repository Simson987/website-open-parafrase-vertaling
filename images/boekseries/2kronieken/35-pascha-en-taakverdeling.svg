<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Pascha en taakverdeling</title><desc id="desc">Datum, taken, bereiding en exacte bijdragen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Pascha en taakverdeling</text><text x="44" y="113" class="ref">2 Kronieken 35:1–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Datum</text><text x="68" y="241" class="body">Dag veertien van maand één in Josia’s</text><text x="68" y="284" class="body">achttiende jaar; daarna zeven dagen</text><text x="68" y="327" class="body">ongezuurde broden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De ark</text><text x="68" y="476" class="body">In Salomo’s huis; geen dragen op</text><text x="68" y="519" class="body">schouders meer, maar dienen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Josia’s gave</text><text x="68" y="668" class="body">30.000 lammeren en jonge geitenbokken</text><text x="68" y="711" class="body">en 3.000 runderen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Leiders van het huis</text><text x="68" y="860" class="body">Hilkia, Zacharia en Jehiël: 2.600</text><text x="68" y="903" class="body">kleinvee en 300 runderen.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Levitische leiders</text><text x="68" y="1052" class="body">Chonanja, Semaja, Nethaneël, Hasabja,</text><text x="68" y="1095" class="body">Jeïel en Jozabad: 5.000 kleinvee en 500</text><text x="68" y="1138" class="body">runderen.</text><text x="46" y="1231" class="note">De verschillende bijdragen en gevers blijven</text><text x="46" y="1267" class="note">apart; paaslam wordt geroosterd, andere gaven</text><text x="46" y="1303" class="note">worden gekookt.</text></svg>