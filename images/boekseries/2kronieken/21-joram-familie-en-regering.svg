<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Joram en zijn broers</title><desc id="desc">Alle broers, erfenis, geweld en verbondsbelofte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Joram en zijn broers</text><text x="44" y="113" class="ref">2 Kronieken 21:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Josafats zonen</text><text x="68" y="241" class="body">Joram; Azarja, Jehiël, Zecharja,</text><text x="68" y="284" class="body">Azarjahu, Michaël en Sefatja.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De erfenis</text><text x="68" y="433" class="body">De broers krijgen rijkdom en vestingen;</text><text x="68" y="476" class="body">oudste zoon Joram het koningschap.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het geweld</text><text x="68" y="625" class="body">Joram doodt zijn broers en ook leiders</text><text x="68" y="668" class="body">om zijn positie te versterken.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Regering</text><text x="68" y="817" class="body">Begint op 32 jaar; acht jaar in</text><text x="68" y="860" class="body">Jeruzalem; getrouwd met een dochter van</text><text x="68" y="903" class="body">Achab.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het verbond</text><text x="68" y="1052" class="body">God wil Davids huis niet vernietigen</text><text x="68" y="1095" class="body">vanwege Zijn belofte.</text><text x="46" y="1188" class="note">Azarja en Azarjahu zijn twee apart genoemde</text><text x="46" y="1224" class="note">namen, geen weg te werken herhaling.</text></svg>