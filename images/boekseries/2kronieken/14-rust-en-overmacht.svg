<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Rust en overmacht onder Asa</title><desc id="desc">Rust, verschillende troepen en de volledige afloop van de veldtocht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rust en overmacht onder Asa</text><text x="44" y="113" class="ref">2 Kronieken 14:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tien jaar rust</text><text x="68" y="241" class="body">Na Abia volgt Asa; hij verwijdert</text><text x="68" y="284" class="body">vreemde eredienst en versterkt steden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Juda en Benjamin</text><text x="68" y="433" class="body">300.000 met schilden en speren; 280.000</text><text x="68" y="476" class="body">met schilden en bogen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zerah uit Nubië</text><text x="68" y="625" class="body">Een miljoen man en driehonderd wagens;</text><text x="68" y="668" class="body">strijd bij Maresa in het dal Zefatha.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Asa’s gebed</text><text x="68" y="817" class="body">Hij steunt op God tegenover de</text><text x="68" y="860" class="body">overmacht.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Gerar en terugkeer</text><text x="68" y="1009" class="body">Achtervolging, verwoeste en geplunderde</text><text x="68" y="1052" class="body">steden; schapen en kamelen als buit</text><text x="68" y="1095" class="body">naar Jeruzalem.</text><text x="46" y="1188" class="note">Gebed, overwinning en het gewelddadige plunderen</text><text x="46" y="1224" class="note">zijn afzonderlijke fasen; aantallen volgen deze</text><text x="46" y="1260" class="note">tekst.</text></svg>