<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Uzzia’s groei en organisatie</title><desc id="desc">Regeringsgegevens en de onderscheiden bouw- en legertaken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uzzia’s groei en organisatie</text><text x="44" y="113" class="ref">2 Kronieken 26:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Regering</text><text x="68" y="241" class="body">Begint op zestien jaar; 52 jaar koning.</text><text x="68" y="284" class="body">Moeder Jecholia uit Jeruzalem.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zoeken en bouwen</text><text x="68" y="433" class="body">In Zacharia’s tijd zoekt hij God;</text><text x="68" y="476" class="body">Eloth, muren, torens, putten en</text><text x="68" y="519" class="body">landbouw.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het leger</text><text x="68" y="668" class="body">2.600 familiehoofden en 307.500</text><text x="68" y="711" class="body">soldaten; Jeïel, Mahaseja en Hananja</text><text x="68" y="754" class="body">bij de organisatie.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Uitrusting</text><text x="68" y="903" class="body">Schilden, speren, helmen, pantsers,</text><text x="68" y="946" class="body">bogen en slingerstenen.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Oorlogstuig</text><text x="68" y="1095" class="body">Vakmensen bedenken toestellen voor</text><text x="68" y="1138" class="body">pijlen en grote stenen op torens en</text><text x="68" y="1181" class="body">hoeken.</text><text x="46" y="1274" class="note">De tekst beschrijft geen precieze bouwtekening</text><text x="46" y="1310" class="note">van de toestellen; daar wordt geen moderne</text><text x="46" y="1346" class="note">machine bij verzonnen.</text></svg>