<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Na Jojada’s dood</title><desc id="desc">De late omslag, profetenmoord, nederlaag en opvolging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Na Jojada’s dood</text><text x="44" y="113" class="ref">2 Kronieken 24:17–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De omslag</text><text x="68" y="241" class="body">Joas luistert naar de leiders; het volk</text><text x="68" y="284" class="body">verlaat Gods huis en dient afgoden.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Profetisch woord</text><text x="68" y="433" class="body">Zacharia, Jojada’s zoon, waarschuwt en</text><text x="68" y="476" class="body">wordt op koninklijk bevel gestenigd in</text><text x="68" y="519" class="body">de voorhof.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Syrië</text><text x="68" y="668" class="body">Een klein leger verslaat het grote;</text><text x="68" y="711" class="body">leiders gedood, buit naar Damascus.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Joas’ einde</text><text x="68" y="860" class="body">Dienaren doden hem op zijn bed; wel in</text><text x="68" y="903" class="body">Davids stad, niet in de koningsgraven</text><text x="68" y="946" class="body">begraven.</text><rect x="42" y="1004" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Opvolging</text><text x="68" y="1095" class="body">Zijn zoon Amazia wordt koning.</text><text x="46" y="1188" class="note">De koning die eerst herstelde, keert zich later</text><text x="46" y="1224" class="note">af; Zacharia is de zoon van zijn vroegere</text><text x="46" y="1260" class="note">beschermer.</text></svg>