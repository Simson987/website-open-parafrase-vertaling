<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Werkers en goederen</title><desc id="desc">Aantallen en de twee richtingen van de uitwisseling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Werkers en goederen</text><text x="44" y="113" class="ref">2 Kronieken 2:2, 7–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dragers en steenhouwers</text><text x="68" y="241" class="body">70.000 dragers en 80.000 steenhouwers</text><text x="68" y="284" class="body">in het bergland.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Opzichters</text><text x="68" y="433" class="body">3.600; samen 153.600 getelde</text><text x="68" y="476" class="body">vreemdelingen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hout</text><text x="68" y="625" class="body">Ceder, cipres en sandelhout uit de</text><text x="68" y="668" class="body">Libanon; over zee op vlotten naar Jafo,</text><text x="68" y="711" class="body">daarna naar Jeruzalem.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Voor de houthakkers</text><text x="68" y="860" class="body">Ongeveer 4.400 ton tarwe en evenveel</text><text x="68" y="903" class="body">gerst; 440.000 liter wijn en evenveel</text><text x="68" y="946" class="body">olie.</text><text x="46" y="1039" class="note">De aantallen werkers tellen exact op; levering</text><text x="46" y="1075" class="note">en tegenprestatie zijn afzonderlijke stromen.</text></svg>