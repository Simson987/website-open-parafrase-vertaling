<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Asa’s laatste regeringsjaren</title><desc id="desc">Ziekte, overlijden en de beschreven begrafeniszorg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Asa’s laatste regeringsjaren</text><text x="44" y="113" class="ref">2 Kronieken 16:11–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jaar 39</text><text x="68" y="241" class="body">Ziek aan zijn voeten; zoekt volgens de</text><text x="68" y="284" class="body">tekst niet de HEERE, maar de dokters.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jaar 41</text><text x="68" y="433" class="body">Asa sterft.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het graf</text><text x="68" y="582" class="body">Voor zichzelf uitgehakt in de Stad van</text><text x="68" y="625" class="body">David; een bed met specerijen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Groot vuur</text><text x="68" y="774" class="body">Een groot vuur wordt ter ere van hem</text><text x="68" y="817" class="body">ontstoken.</text><text x="46" y="910" class="note">Het genoemde vuur wordt niet als verbranding van</text><text x="46" y="946" class="note">zijn lichaam uitgelegd; die handeling staat niet</text><text x="46" y="982" class="note">in dit verslag.</text></svg>