<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Zoeken, verbond en hervorming</title><desc id="desc">Oproep, tijd, verbond, sanctie en hervorming in hun volgorde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zoeken, verbond en hervorming</text><text x="44" y="113" class="ref">2 Kronieken 15:1–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Azaria, zoon van Oded</text><text x="68" y="241" class="body">Zoeken leidt tot vinden; verlaten tot</text><text x="68" y="284" class="body">verlaten worden. Wees sterk en laat de</text><text x="68" y="327" class="body">handen niet verslappen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vijftiende jaar, maand drie</text><text x="68" y="476" class="body">Vergadering met Juda, Benjamin en</text><text x="68" y="519" class="body">toegestroomden uit Efraïm, Manasse en</text><text x="68" y="562" class="body">Simeon.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Offer en verbond</text><text x="68" y="711" class="body">700 runderen en 7.000 schapen; God</text><text x="68" y="754" class="body">zoeken met hart en ziel.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De sanctie</text><text x="68" y="903" class="body">De tekst verbindt de doodstraf aan niet</text><text x="68" y="946" class="body">zoeken, ongeacht leeftijd of geslacht.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Maächa en gaven</text><text x="68" y="1095" class="body">Asa zet haar af, vernietigt haar beeld</text><text x="68" y="1138" class="body">bij de Kidron en brengt gewijde gaven</text><text x="68" y="1181" class="body">binnen.</text><text x="46" y="1274" class="note">De harde verbondsbepaling wordt in woorden</text><text x="46" y="1310" class="note">benoemd; er wordt geen uitvoering daarvan bij</text><text x="46" y="1346" class="note">verzonnen.</text></svg>