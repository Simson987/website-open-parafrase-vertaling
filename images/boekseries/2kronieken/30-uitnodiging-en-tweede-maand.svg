<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Uitnodiging in de tweede maand</title><desc id="desc">Reden, datum en verschillende reacties op de uitnodiging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Uitnodiging in de tweede maand</text><text x="44" y="113" class="ref">2 Kronieken 30:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Reden voor uitstel</text><text x="68" y="241" class="body">Niet genoeg geheiligde priesters en het</text><text x="68" y="284" class="body">volk nog niet bijeen; gezamenlijk</text><text x="68" y="327" class="body">besluit voor maand twee.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De oproep</text><text x="68" y="476" class="body">Van Berseba tot Dan; brieven ook aan</text><text x="68" y="519" class="body">Efraïm en Manasse.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Twee reacties</text><text x="68" y="668" class="body">Spot in Efraïm, Manasse en Zebulon;</text><text x="68" y="711" class="body">sommigen uit Aser, Manasse en Zebulon</text><text x="68" y="754" class="body">komen wel.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Jeruzalem</text><text x="68" y="903" class="body">Altaren weggehaald naar de Kidron;</text><text x="68" y="946" class="body">pascha op dag veertien van maand twee.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Dienst</text><text x="68" y="1095" class="body">Priesters en Levieten heiligen zich;</text><text x="68" y="1138" class="body">Levieten helpen wie niet rein is.</text><text x="46" y="1231" class="note">Uitstel, uitnodiging, zuivering en viering zijn</text><text x="46" y="1267" class="note">onderscheiden stappen; spot en gehoorzaamheid</text><text x="46" y="1303" class="note">bestaan naast elkaar.</text></svg>