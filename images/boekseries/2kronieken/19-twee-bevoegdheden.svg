<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Twee bevoegdheden in Jeruzalem</title><desc id="desc">De juiste personen, rollen en ondersteuning.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee bevoegdheden in Jeruzalem</text><text x="44" y="113" class="ref">2 Kronieken 19:11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Amarja</text><text x="68" y="241" class="body">Hogepriester; over alles wat met de</text><text x="68" y="284" class="body">HEERE te maken heeft.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zebadja</text><text x="68" y="433" class="body">Zoon van Ismaël, leider van Juda; over</text><text x="68" y="476" class="body">alles wat met de koning te maken heeft.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Levieten</text><text x="68" y="625" class="body">Staan als ambtenaren klaar.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De opdracht</text><text x="68" y="774" class="body">Wees sterk en doe het; de HEERE zal met</text><text x="68" y="817" class="body">de goede zijn.</text><text x="46" y="910" class="note">Twee onderscheiden verantwoordelijkheden, met</text><text x="46" y="946" class="note">ondersteunende ambtenaren; geen verzonnen</text><text x="46" y="982" class="note">moderne rechtbanktitels.</text></svg>