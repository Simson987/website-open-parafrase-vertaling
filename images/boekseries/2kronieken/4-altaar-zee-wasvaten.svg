<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Altaar, zee en wasvaten</title><desc id="desc">Maten, steunrunderen en verschillende wasfuncties.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Altaar, zee en wasvaten</text><text x="44" y="113" class="ref">2 Kronieken 4:1–6, 10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Koperen altaar</text><text x="68" y="241" class="body">Ongeveer 9 bij 9 meter en 4,5 meter</text><text x="68" y="284" class="body">hoog.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gegoten zee</text><text x="68" y="433" class="body">Rond: doorsnede 4,5 meter; hoogte 2,25</text><text x="68" y="476" class="body">meter; genoemde omtrek 13,5 meter.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wand en inhoud</text><text x="68" y="625" class="body">Ongeveer 7,5 centimeter dik; capaciteit</text><text x="68" y="668" class="body">circa 66.000 liter.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Twaalf runderen</text><text x="68" y="817" class="body">Drie naar elk van de vier</text><text x="68" y="860" class="body">windrichtingen; achterkanten naar</text><text x="68" y="903" class="body">binnen.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Twee functies</text><text x="68" y="1052" class="body">Zee: priesters wassen zich. Tien</text><text x="68" y="1095" class="body">wasvaten: vijf per zijde, om offerdelen</text><text x="68" y="1138" class="body">te spoelen.</text><text x="46" y="1231" class="note">De afgeronde omtrek en doorsnede zijn de</text><text x="46" y="1267" class="note">vermelde maten; de zee staat oostelijk naar het</text><text x="46" y="1303" class="note">zuiden.</text></svg>