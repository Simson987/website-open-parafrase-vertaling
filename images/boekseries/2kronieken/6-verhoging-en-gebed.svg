<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Verhoging en gebedsrichting</title><desc id="desc">Afmetingen en het onderscheid tussen gebedsplaats en Gods woonplaats.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verhoging en gebedsrichting</text><text x="44" y="113" class="ref">2 Kronieken 6:12–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Koperen verhoging</text><text x="68" y="241" class="body">Midden op de voorhof; ongeveer 2,25 bij</text><text x="68" y="284" class="body">2,25 meter en 1,35 meter hoog.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Salomo</text><text x="68" y="433" class="body">Knielt voor de vergadering en spreidt</text><text x="68" y="476" class="body">zijn handen naar de hemel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verbond en trouw</text><text x="68" y="625" class="body">Hij vraagt bevestiging van Gods belofte</text><text x="68" y="668" class="body">aan David.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gods woonplaats</text><text x="68" y="817" class="body">Zelfs de hoogste hemel kan God niet</text><text x="68" y="860" class="body">bevatten; Salomo vraagt dat God vanuit</text><text x="68" y="903" class="body">de hemel hoort en vergeeft.</text><text x="46" y="996" class="note">De verhoging is de gebedsplaats, niet het</text><text x="46" y="1032" class="note">brandofferaltaar.</text></svg>