<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Ziekte, hoogmoed en proef</title><desc id="desc">Het latere persoonlijke verloop en de beproeving.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ziekte, hoogmoed en proef</text><text x="44" y="113" class="ref">2 Kronieken 32:24–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ziekte en teken</text><text x="68" y="241" class="body">Jehizkia bidt, krijgt antwoord en een</text><text x="68" y="284" class="body">wonderteken.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hoogmoed en nederigheid</text><text x="68" y="433" class="body">Reageert eerst niet dankbaar; daarna</text><text x="68" y="476" class="body">verootmoediging met Jeruzalem, zodat</text><text x="68" y="519" class="body">toorn tijdens zijn leven uitblijft.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bezit</text><text x="68" y="668" class="body">Schatkamers, schuren, stallen en</text><text x="68" y="711" class="body">kudden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Babel</text><text x="68" y="860" class="body">Gezanten vragen naar het teken; God</text><text x="68" y="903" class="body">beproeft wat in zijn hart is.</text><rect x="42" y="961" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Afloop</text><text x="68" y="1052" class="body">Met eer begraven; Manasse volgt hem op.</text><text x="46" y="1145" class="note">Dit hoofdstuk specificeert het wonderteken niet</text><text x="46" y="1181" class="note">verder; er wordt hier geen andere</text><text x="46" y="1217" class="note">tekenbeschrijving ingevuld.</text></svg>