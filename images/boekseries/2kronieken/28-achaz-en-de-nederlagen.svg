<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1455" viewBox="0 0 840 1455" role="img" aria-labelledby="title desc"><title id="title">Achaz en de nederlagen</title><desc id="desc">Ontrouw, nederlagen, aantallen en de omkeer naar zorg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1455" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Achaz en de nederlagen</text><text x="44" y="113" class="ref">2 Kronieken 28:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achaz</text><text x="68" y="241" class="body">Begint op twintig jaar, zestien jaar</text><text x="68" y="284" class="body">koning; Baälbeelden, verboden offers en</text><text x="68" y="327" class="body">het verbranden van zonen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Nederlagen</text><text x="68" y="476" class="body">Syrië voert gevangenen naar Damascus;</text><text x="68" y="519" class="body">Pekah doodt 120.000 op één dag.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Naar Samaria</text><text x="68" y="668" class="body">200.000 vrouwen, zonen en dochters als</text><text x="68" y="711" class="body">gevangenen; Oded wijst op Israëls eigen</text><text x="68" y="754" class="body">schuld.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Vier leiders</text><text x="68" y="903" class="body">Azaria, Berechja, Jehizkia en Amasa</text><text x="68" y="946" class="body">weigeren dat de gevangenen worden</text><text x="68" y="989" class="body">binnengebracht.</text><rect x="42" y="1047" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Ontferming</text><text x="68" y="1138" class="body">Kleren, schoenen, voedsel, drinken,</text><text x="68" y="1181" class="body">olie en ezels voor zwakken; naar</text><text x="68" y="1224" class="body">Jericho, dan terug naar Samaria.</text><text x="46" y="1317" class="note">De wrede offers en oorlog staan in woorden; de</text><text x="46" y="1353" class="note">zorgscène volgt pas nadat gevangenen en buit</text><text x="46" y="1389" class="note">worden losgelaten.</text></svg>