<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Van oorlog naar vestingen</title><desc id="desc">Afgelaste strijd, alle vestingnamen en de toestroom naar Juda.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van oorlog naar vestingen</text><text x="44" y="113" class="ref">2 Kronieken 11:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het leger</text><text x="68" y="241" class="body">180.000 uit Juda en Benjamin,</text><text x="68" y="284" class="body">opgeroepen om het rijk terug te winnen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Semaja’s woord</text><text x="68" y="433" class="body">Niet tegen broers strijden; zij</text><text x="68" y="476" class="body">gehoorzamen en keren terug.</text><rect x="42" y="534" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vijftien steden</text><text x="68" y="625" class="body">Bethlehem, Etham, Thekoa, Beth-Zur,</text><text x="68" y="668" class="body">Socho, Adullam, Gath, Maresa, Zif,</text><text x="68" y="711" class="body">Adoraïm, Lachis, Azeka, Zora, Ajalon en</text><text x="68" y="754" class="body">Hebron.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Versterking van Juda</text><text x="68" y="903" class="body">Voorraad, wapens en bevelhebbers;</text><text x="68" y="946" class="body">priesters, Levieten en zoekers uit</text><text x="68" y="989" class="body">andere stammen komen naar Juda.</text><text x="46" y="1082" class="note">De broederoorlog wordt hier afgelast; de komst</text><text x="46" y="1118" class="note">van Levieten volgt Jerobeams uitsluiting.</text></svg>