<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Vaste dienst en zeevaart</title><desc id="desc">Het dienstrooster, de genoemde havens en de opbrengst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vaste dienst en zeevaart</text><text x="44" y="113" class="ref">2 Kronieken 8:12–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vaste offers</text><text x="68" y="241" class="body">Elke dag, sabbatten, nieuwemaansdagen</text><text x="68" y="284" class="body">en drie jaarfeesten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Drie feesten</text><text x="68" y="433" class="body">Ongezuurde broden, Wekenfeest en</text><text x="68" y="476" class="body">Loofhuttenfeest.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dienstgroepen</text><text x="68" y="625" class="body">Priesters, Levieten en poortwachters</text><text x="68" y="668" class="body">volgens Davids regeling.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zeevaart</text><text x="68" y="817" class="body">Via Ezeon-Geber en Eloth in Edom;</text><text x="68" y="860" class="body">Hurams zeelui varen met Salomo’s mensen</text><text x="68" y="903" class="body">naar Ofir.</text><rect x="42" y="961" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Goud</text><text x="68" y="1052" class="body">Zij brengen ongeveer vijftien ton mee.</text><text x="46" y="1145" class="note">De zeevaarders en de vaste tempeldienst zijn</text><text x="46" y="1181" class="note">twee onderscheiden onderwerpen in dit hoofdstuk.</text></svg>