<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Zang, buit en Beracha</title><desc id="desc">Volgorde, tijdsduur en plaats van de dank.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zang, buit en Beracha</text><text x="44" y="113" class="ref">2 Kronieken 20:21–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zangers voorop</text><text x="68" y="241" class="body">Loven Gods blijvende trouw voor het</text><text x="68" y="284" class="body">leger uit.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vijanden onderling</text><text x="68" y="433" class="body">Ammon en Moab keren zich tegen Seïr en</text><text x="68" y="476" class="body">vervolgens tegen elkaar.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij de wachttoren</text><text x="68" y="625" class="body">Juda vindt de verslagen menigte; geen</text><text x="68" y="668" class="body">eigen strijd beschreven.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Drie dagen buit</text><text x="68" y="817" class="body">Zoveel bezittingen, kleren en</text><text x="68" y="860" class="body">kostbaarheden dat zij die nauwelijks</text><text x="68" y="903" class="body">dragen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Dag vier en terugkeer</text><text x="68" y="1052" class="body">Lof in het dal Beracha; daarna blij</text><text x="68" y="1095" class="body">naar Jeruzalem met instrumenten.</text><text x="46" y="1188" class="note">Het dal Beracha is de plaats van de dank op dag</text><text x="46" y="1224" class="note">vier, niet de naam van de eerste</text><text x="46" y="1260" class="note">legeropstelling.</text></svg>