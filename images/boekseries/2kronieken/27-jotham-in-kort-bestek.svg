<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Jotham in kort bestek</title><desc id="desc">Regering, beoordeling, bouw en de driejarige schatting.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jotham in kort bestek</text><text x="44" y="113" class="ref">2 Kronieken 27:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Regering</text><text x="68" y="241" class="body">Begint op 25 jaar, zestien jaar koning;</text><text x="68" y="284" class="body">moeder Jerusa, dochter van Zadok.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Beoordeling</text><text x="68" y="433" class="body">Doet wat juist is, gaat de tempel niet</text><text x="68" y="476" class="body">binnen; het volk blijft verkeerd</text><text x="68" y="519" class="body">handelen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bouw</text><text x="68" y="668" class="body">Bovenpoort, Ofelmuur, steden, burchten</text><text x="68" y="711" class="body">en torens.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Ammon</text><text x="68" y="860" class="body">Na overwinning drie jaar circa 3,4 ton</text><text x="68" y="903" class="body">zilver, 2.200 ton tarwe en evenveel</text><text x="68" y="946" class="body">gerst per jaar.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Opvolging</text><text x="68" y="1095" class="body">Na zijn dood wordt zijn zoon Achaz</text><text x="68" y="1138" class="body">koning.</text><text x="46" y="1231" class="note">De schatting wordt drie achtereenvolgende jaren</text><text x="46" y="1267" class="note">gebracht, met dezelfde genoemde hoeveelheid per</text><text x="46" y="1303" class="note">jaar.</text></svg>