<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Data, route en geschenken</title><desc id="desc">Data, route en geschenken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Data, route en geschenken</text><text x="44" y="113" class="ref">Jubileeën 29:5–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gilead · 5–8</text><text x="68" y="241" class="body">Vertrek maand 1, dag 21; ingehaald</text><text x="68" y="284" class="body">maand 3, dag 13; eed en maaltijd op de</text><text x="68" y="327" class="body">vijftiende.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jabbok en Jordaan · 13–14</text><text x="68" y="476" class="body">Jabbok: maand 9, dag 11; Jordaan: jaar</text><text x="68" y="519" class="body">1 van jaarweek 5.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Izak en Rebekka · 15–17</text><text x="68" y="668" class="body">Kleding en voedsel voor vader; vier</text><text x="68" y="711" class="body">keer per jaar voor moeder; zij wonen</text><text x="68" y="754" class="body">bij Abrahams toren.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Ezau · 18–20</text><text x="68" y="903" class="body">Mahalath, dochter van Ismaël; vertrekt</text><text x="68" y="946" class="body">naar Seïr; Izak bij Hebron.</text><text x="46" y="1039" class="note">De volgorde is een routeoverzicht; bij de</text><text x="46" y="1075" class="note">vijftiende wordt geen ongenoemde maand of extra</text><text x="46" y="1111" class="note">reisduur ingevuld.</text></svg>