<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Gosen, graan en overdracht</title><desc id="desc">Gosen, graan en overdracht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gosen, graan en overdracht</text><text x="44" y="113" class="ref">Jubileeën 45:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aankomst · 1–7</text><text x="68" y="241" class="body">Maand 4, dag 1; omhelzing en maaltijd;</text><text x="68" y="284" class="body">Gosen en Rameses; brood in hongersnood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Graanwet · 8–12</text><text x="68" y="433" class="body">Na 7 hongerjaren: 1 van 5 delen voor</text><text x="68" y="476" class="body">koning; 4 voor voedsel en zaaigoed.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Afscheid · 13–15</text><text x="68" y="625" class="body">17 jaar in Egypte; zegen aan zonen;</text><text x="68" y="668" class="body">begrafenis in Machpela.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Boeken · 16</text><text x="68" y="817" class="body">Eigen boeken en voorouderboeken aan</text><text x="68" y="860" class="body">Levi om te bewaren en te vernieuwen.</text><text x="46" y="953" class="note">De tekst noemt bij het graf Abraham; de</text><text x="46" y="989" class="note">leeswijzer vervangt die plaatselijke formulering</text><text x="46" y="1025" class="note">niet door een andere naam.</text></svg>