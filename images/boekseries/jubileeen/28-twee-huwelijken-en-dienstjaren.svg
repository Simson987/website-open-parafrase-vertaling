<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Twee huwelijken en dienstjaren</title><desc id="desc">Twee huwelijken en dienstjaren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee huwelijken en dienstjaren</text><text x="44" y="113" class="ref">Jubileeën 28:1–10,25–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste dienst · 1–4</text><text x="68" y="241" class="body">7 jaar voor Rachel; feest, maar Laban</text><text x="68" y="284" class="body">geeft Lea met Zilpa.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Feestweek · 6–9</text><text x="68" y="433" class="body">Eerst 7 feestdagen van Lea; daarna</text><text x="68" y="476" class="body">Rachel met Bilha.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tweede dienst · 8–10</text><text x="68" y="625" class="body">Nog 7 jaar voor Rachel; 14 jaar dienst</text><text x="68" y="668" class="body">voor de huwelijken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Loon · 25–30</text><text x="68" y="817" class="body">Daarna kuddehoeden; getekende dieren</text><text x="68" y="860" class="body">als loon; rijkdom en Labans jaloezie.</text><text x="46" y="953" class="note">Bilha is volgens vers 9 de zus van Zilpa. De</text><text x="46" y="989" class="note">zeven feestdagen zijn geen derde periode van</text><text x="46" y="1025" class="note">zeven dienstjaren.</text></svg>