<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Twee reizen en borgtocht</title><desc id="desc">Twee reizen en borgtocht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee reizen en borgtocht</text><text x="44" y="113" class="ref">Jubileeën 42:4–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste reis · 4–8</text><text x="68" y="241" class="body">10 zonen zonder Benjamin; Simeon</text><text x="68" y="284" class="body">blijft; 9 keren terug met graan en</text><text x="68" y="327" class="body">goud.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Nood · 9–19</text><text x="68" y="476" class="body">Jakob weigert eerst; Ruben noemt zijn</text><text x="68" y="519" class="body">twee zonen; Juda staat zelf borg.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Tweede reis · 20–22</text><text x="68" y="668" class="body">Benjamin mee; balsem, amandelen,</text><text x="68" y="711" class="body">pistachenoten en honing; Simeon vrij.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Maaltijd · 23–25</text><text x="68" y="860" class="body">Ieder een portie; Benjamin zevenmaal</text><text x="68" y="903" class="body">zoveel; Jozef beproeft hun gezindheid.</text><text x="46" y="996" class="note">Hier staat zevenmaal voor Benjamin, niet de</text><text x="46" y="1032" class="note">verhouding uit een ander Bijbelboek.</text></svg>