<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Twee zonen en de uitdaging</title><desc id="desc">Twee zonen en de uitdaging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee zonen en de uitdaging</text><text x="44" y="113" class="ref">Jubileeën 17:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Feest · 1–7</text><text x="68" y="241" class="body">Izak gespeend; Abraham blij; Sara</text><text x="68" y="284" class="body">jaloers; twee beloften over</text><text x="68" y="327" class="body">nakomelingen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Hagar en Ismaël · 8–14</text><text x="68" y="476" class="body">Brood en waterzak; woestijn, olijfboom</text><text x="68" y="519" class="body">en put; boogschutter, Egyptische vrouw,</text><text x="68" y="562" class="body">zoon Nebajot.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Mastema · 15–16</text><text x="68" y="711" class="body">Maand 1, dag 12: hemelse stemmen en</text><text x="68" y="754" class="body">uitdaging over liefde tot Izak.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Beproefd · 17–18</text><text x="68" y="903" class="body">Land, hongersnood en rijkdom van</text><text x="68" y="946" class="body">koningen; Abraham trouw.</text><text x="46" y="1039" class="note">De hemelse uitdaging is het slot van dit</text><text x="46" y="1075" class="note">hoofdstuk; de concrete opdracht volgt in</text><text x="46" y="1111" class="note">hoofdstuk 18.</text></svg>