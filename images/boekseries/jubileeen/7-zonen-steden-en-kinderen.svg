<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Zonen, steden en kinderen</title><desc id="desc">Zonen, steden en kinderen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zonen, steden en kinderen</text><text x="44" y="113" class="ref">Jubileeën 7:10–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Cham · 10–14</text><text x="68" y="241" class="body">Kanaän vervloekt; stad naar vrouw</text><text x="68" y="284" class="body">Neëlatamaük.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sem · 11,16–18</text><text x="68" y="433" class="body">Gezegend; stad Sedeqetelbab naar zijn</text><text x="68" y="476" class="body">vrouw; zonen Elam, Assur en Arfachsad.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jafeth · 12,15,19</text><text x="68" y="625" class="body">Ruimte gewenst; zonen Gomer, Magog,</text><text x="68" y="668" class="body">Madai, Javan, Tubal, Mesech en Thiras.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Rond Lubar · 17</text><text x="68" y="817" class="body">Sedeqetelbab oost; Neëlatamaük noord;</text><text x="68" y="860" class="body">Adatanêses aan de zeezijde.</text><text x="46" y="953" class="note">Adatanêses wordt als plaatsnaam vermeld zonder</text><text x="46" y="989" class="note">een stichter toe te voegen die vers 17 niet</text><text x="46" y="1025" class="note">uitdrukkelijk noemt.</text></svg>