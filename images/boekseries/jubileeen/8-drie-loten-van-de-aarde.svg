<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Drie loten van de aarde</title><desc id="desc">Drie loten van de aarde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie loten van de aarde</text><text x="44" y="113" class="ref">Jubileeën 8:10–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sem · 12–21</text><text x="68" y="241" class="body">Midden van de aarde; Eden, Rode Zee,</text><text x="68" y="284" class="body">oosten, India, Basan, Libanon en Kaftor</text><text x="68" y="327" class="body">genoemd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Cham · 22–24</text><text x="68" y="476" class="body">Over de Gihon; vuurbergen en zuidelijke</text><text x="68" y="519" class="body">grenzen naar Gadir en grote zee.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Jafeth · 25–29</text><text x="68" y="668" class="body">Over de Tina; Gog, Qelt, Maük, Gadir,</text><text x="68" y="711" class="body">Fara en Rafa genoemd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Klimaat · 30</text><text x="68" y="860" class="body">Cham heet; Jafeth koud; Sem een</text><text x="68" y="903" class="body">mengeling.</text><text x="46" y="996" class="note">Dit is een overzicht van het tekstuele</text><text x="46" y="1032" class="note">wereldbeeld. De oude grenzen worden niet als</text><text x="46" y="1068" class="note">moderne politieke kaart getekend.</text></svg>