<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Opdracht, stop en terugkeer</title><desc id="desc">Opdracht, stop en terugkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opdracht, stop en terugkeer</text><text x="44" y="113" class="ref">Jubileeën 18:1–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Heen · 1–7</text><text x="68" y="241" class="body">Izak mee; 2 knechten en ezel; op dag 3</text><text x="68" y="284" class="body">bij de plaats; knechten blijven bij de</text><text x="68" y="327" class="body">waterput.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Stop · 8–12</text><text x="68" y="476" class="body">Handeling onderbroken door de</text><text x="68" y="519" class="body">engelenroep; jongen niets aandoen; ram</text><text x="68" y="562" class="body">in de plaats.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Naam en belofte · 13–16</text><text x="68" y="711" class="body">God heeft gezien; berg Sion genoemd;</text><text x="68" y="754" class="body">zegen voor alle volken.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Terug · 17–19</text><text x="68" y="903" class="body">Naar Berseba; zeven dagen tocht en</text><text x="68" y="946" class="body">jaarlijkse feestherinnering.</text><text x="46" y="1039" class="note">De illustratie toont de onderbreking en het</text><text x="46" y="1075" class="note">veilige kind; Mastema wordt niet als tweede God</text><text x="46" y="1111" class="note">getekend.</text></svg>