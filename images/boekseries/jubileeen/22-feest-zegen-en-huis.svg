<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Feest, zegen en huis</title><desc id="desc">Feest, zegen en huis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Feest, zegen en huis</text><text x="44" y="113" class="ref">Jubileeën 22:1–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Familiefeest · 1–9</text><text x="68" y="241" class="body">Izak en Ismaël komen; Jakob brengt</text><text x="68" y="284" class="body">dankoffer; Abraham 175 en dankbaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zegen · 10–15</text><text x="68" y="433" class="body">Kracht, reiniging, vergeving en</text><text x="68" y="476" class="body">vernieuwd verbond voor Jakob.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Opdracht · 16–24</text><text x="68" y="625" class="body">Geboden houden, afgoden mijden,</text><text x="68" y="668" class="body">huwelijk en het huis van Abraham.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nabijheid · 25–30</text><text x="68" y="817" class="body">Jakob slaapt bij zijn grootvader; zeven</text><text x="68" y="860" class="body">kussen en een laatste gebed om trouw.</text><text x="46" y="953" class="note">De handelingen zijn al in drie beelden aanwezig;</text><text x="46" y="989" class="note">dit schema voegt de structuur en het toegezegde</text><text x="46" y="1025" class="note">huis toe.</text></svg>