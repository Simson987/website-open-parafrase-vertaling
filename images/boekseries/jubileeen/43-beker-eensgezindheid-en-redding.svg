<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Beker, eenheid en redding</title><desc id="desc">Beker, eenheid en redding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beker, eenheid en redding</text><text x="44" y="113" class="ref">Jubileeën 43:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beproeving · 1–10</text><text x="68" y="241" class="body">Beheerder verstopt beker en vindt hem</text><text x="68" y="284" class="body">bij Benjamin; broers keren samen terug.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Juda · 11–13</text><text x="68" y="433" class="body">Biedt zichzelf aan als slaaf in de</text><text x="68" y="476" class="body">plaats van Benjamin.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bekendmaking · 14–20</text><text x="68" y="625" class="body">Jozef spreekt Hebreeuws; 2 hongerjaren</text><text x="68" y="668" class="body">voorbij, nog 5; familie moet komen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Terugreis · 21–24</text><text x="68" y="817" class="body">Wagens, kleren, zilver en 10</text><text x="68" y="860" class="body">graanezels; Jakob kan het bericht niet</text><text x="68" y="903" class="body">geloven.</text><text x="46" y="996" class="note">De beker is geplaatst door de beheerder;</text><text x="46" y="1032" class="note">Benjamin wordt niet als werkelijke dief</text><text x="46" y="1068" class="note">voorgesteld.</text></svg>