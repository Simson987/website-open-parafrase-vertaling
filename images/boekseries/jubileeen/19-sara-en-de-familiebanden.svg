<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Sara en de familiebanden</title><desc id="desc">Sara en de familiebanden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sara en de familiebanden</text><text x="44" y="113" class="ref">Jubileeën 19:7–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sara · 7</text><text x="68" y="241" class="body">127 jaar = 2 jubeljaren + 4 jaarweken +</text><text x="68" y="284" class="body">1 jaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rebekka · 10</text><text x="68" y="433" class="body">Dochter van Bethuël en zus van Laban;</text><text x="68" y="476" class="body">Bethuël is zoon van Nahor en Milka.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nahor · 10</text><text x="68" y="625" class="body">Broer van Abraham; Rebekka trouwt met</text><text x="68" y="668" class="body">Izak.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ketura · 11–12</text><text x="68" y="817" class="body">6 zonen: Zimran, Joksan, Medan, Midian,</text><text x="68" y="860" class="body">Jisbak en Suah.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Izak en Rebekka · 13</text><text x="68" y="1009" class="body">Twee zonen: Jakob en Ezau.</text><text x="46" y="1102" class="note">Hagar is volgens vers 11 al vóór Sara gestorven.</text><text x="46" y="1138" class="note">De familie volgt de plaatselijke namen en</text><text x="46" y="1174" class="note">relaties.</text></svg>