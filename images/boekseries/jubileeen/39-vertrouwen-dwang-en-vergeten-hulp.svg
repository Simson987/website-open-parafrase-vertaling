<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Dwang en vergeten hulp</title><desc id="desc">Dwang en vergeten hulp met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dwang en vergeten hulp</text><text x="44" y="113" class="ref">Jubileeën 39:3–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In het huis · 3–5</text><text x="68" y="241" class="body">Heer vertrouwt alles aan Jozef toe;</text><text x="68" y="284" class="body">zijn werk slaagt.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dwang en beschuldiging · 6–11</text><text x="68" y="433" class="body">Herhaald aandringen; Jozef weigert;</text><text x="68" y="476" class="body">vrouw houdt vast en beschuldigt hem</text><text x="68" y="519" class="body">vals; kleed en deur gezien.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">In de gevangenis · 12–15</text><text x="68" y="668" class="body">Verantwoordelijkheid; twee jaar;</text><text x="68" y="711" class="body">schenker en bakker aan zijn zorg</text><text x="68" y="754" class="body">toevertrouwd.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Dromen · 16–18</text><text x="68" y="903" class="body">Verteld en uitgelegd; uitkomst klopt;</text><text x="68" y="946" class="body">schenker vergeet Jozef.</text><text x="46" y="1039" class="note">De naam van de Egyptische heer staat hier niet.</text><text x="46" y="1075" class="note">De valse beschuldiging wordt niet als daad van</text><text x="46" y="1111" class="note">Jozef gepresenteerd.</text></svg>