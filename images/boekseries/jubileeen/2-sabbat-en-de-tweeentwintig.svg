<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Sabbat en de tweeëntwintig</title><desc id="desc">Sabbat en de tweeëntwintig met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sabbat en de tweeëntwintig</text><text x="44" y="113" class="ref">Jubileeën 2:17–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ritme · 17–18</text><text x="68" y="241" class="body">Zes dagen werk, zevende rust; twee</text><text x="68" y="284" class="body">grote engelengroepen rusten mee.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Israël · 19–24</text><text x="68" y="433" class="body">Jakobs nakomelingen gekozen; samen</text><text x="68" y="476" class="body">eten, drinken en loven; 22 stamvaders</text><text x="68" y="519" class="body">Adam–Jakob.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Heilig houden · 25–30</text><text x="68" y="668" class="body">Geen werk of ontheiliging; de tekst</text><text x="68" y="711" class="body">noemt ook geen dragen tussen huizen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Teken · 31–33</text><text x="68" y="860" class="body">Als blijvende wet en getuigenis aan</text><text x="68" y="903" class="body">Israël gegeven.</text><text x="46" y="996" class="note">De twee tellingen van 22, soorten en stamvaders,</text><text x="46" y="1032" class="note">staan in verschillende verzen; er wordt geen</text><text x="46" y="1068" class="note">ongenoemde volledige namenlijst ingevuld.</text></svg>