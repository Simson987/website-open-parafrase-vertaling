<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Refaïeten en koningssteden</title><desc id="desc">Refaïeten en koningssteden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Refaïeten en koningssteden</text><text x="44" y="113" class="ref">Jubileeën 29:9–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Land</text><text x="68" y="241" class="body">Gilead werd eerder land van de</text><text x="68" y="284" class="body">Refaïeten genoemd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Grenzen</text><text x="68" y="433" class="body">Van het land van de Ammonieten tot de</text><text x="68" y="476" class="body">berg Hermon.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Koninklijke steden</text><text x="68" y="625" class="body">Karnaïm · Astharoth · Edreï · Misur ·</text><text x="68" y="668" class="body">Beon.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het oordeel</text><text x="68" y="817" class="body">Vernietigd vanwege slechte daden en</text><text x="68" y="860" class="body">zware onderdrukking.</text><text x="46" y="953" class="note">De vijf stadnamen volgen deze lijst; het schema</text><text x="46" y="989" class="note">plaatst ze niet op onbevestigde moderne</text><text x="46" y="1025" class="note">locaties.</text></svg>