<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Van eed naar gewapende dreiging</title><desc id="desc">Van eed naar gewapende dreiging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van eed naar gewapende dreiging</text><text x="44" y="113" class="ref">Jubileeën 37:1–19,24–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zonen · 1–8</text><text x="68" y="241" class="body">Verzetten zich tegen verkoop en</text><text x="68" y="284" class="body">vredeseed; dreigen ook hun vader.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Huurkrachten · 9–10</text><text x="68" y="433" class="body">1000 bij Aram en Aduram; 1000 uit Moab</text><text x="68" y="476" class="body">en Ammon.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ezau · 11–13</text><text x="68" y="625" class="body">Gedwongen voorop; eigen oude kwaad</text><text x="68" y="668" class="body">herleeft; vredeseed vergeten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Waarschuwing · 14–19</text><text x="68" y="817" class="body">Hebron meldt 4000 gewapenden; Jakob</text><text x="68" y="860" class="body">sluit de torenpoort.</text><text x="46" y="953" class="note">De twee genoemde groepen van 1000 vormen niet op</text><text x="46" y="989" class="note">zichzelf de 4000 uit het bericht; de tekst wordt</text><text x="46" y="1025" class="note">niet met verzonnen manschappen aangevuld.</text></svg>