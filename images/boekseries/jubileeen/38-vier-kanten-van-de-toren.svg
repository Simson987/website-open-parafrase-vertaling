<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Vier kanten van de toren</title><desc id="desc">Vier kanten van de toren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier kanten van de toren</text><text x="44" y="113" class="ref">Jubileeën 38:4–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zuid · 5</text><text x="68" y="241" class="body">Juda, Nafthali, Gad; 50 knechten.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Oost · 6</text><text x="68" y="390" class="body">Levi, Dan, Aser; 50 man; Moab en Ammon.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Noord · 7</text><text x="68" y="539" class="body">Ruben, Issaschar, Zebulon; 50 man;</text><text x="68" y="582" class="body">Filistijnen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">West · 8</text><text x="68" y="731" class="body">Simeon, Benjamin, Hanoch, zoon van</text><text x="68" y="774" class="body">Ruben; 50 man; Edom en Horieten.</text><text x="46" y="867" class="note">Hanoch is Rubens zoon. De schemaformatie telt</text><text x="46" y="903" class="note">hem niet als twaalfde zoon van Jakob en voegt</text><text x="46" y="939" class="note">Jozef niet aan een richting toe.</text></svg>