<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1270" viewBox="0 0 840 1270" role="img" aria-labelledby="title desc"><title id="title">Erfgenaam, tijd en land</title><desc id="desc">Erfgenaam, tijd en land met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1270" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Erfgenaam, tijd en land</text><text x="44" y="113" class="ref">Jubileeën 14:1–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Erfgenaam · 1–7</text><text x="68" y="241" class="body">Eliëzer uit Damascus, zoon van slavin</text><text x="68" y="284" class="body">Maseq, is niet de beloofde erfgenaam;</text><text x="68" y="327" class="body">eigen zoon en sterrenbelofte.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tijd · 9–17</text><text x="68" y="476" class="body">Maand 3; driejarige koe, geit en ram;</text><text x="68" y="519" class="body">twee vogels; 400 jaar verdrukking en</text><text x="68" y="562" class="body">vierde generatie terug.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Land · 18</text><text x="68" y="711" class="body">Van rivier van Egypte tot Eufraat:</text><text x="68" y="754" class="body">Kenieten, Kenizieten, Kadmonieten,</text><text x="68" y="797" class="body">Ferezieten, Refaïeten, Fakorieten en</text><text x="68" y="840" class="body">Hivvieten.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Sarai en Hagar · 20–24</text><text x="68" y="989" class="body">Verbond in Noachs verbondsmaand; Sarai</text><text x="68" y="1032" class="body">vertelt haar raad; Hagar krijgt een</text><text x="68" y="1075" class="body">zoon.</text><text x="46" y="1168" class="note">De zeven volkennamen zijn precies deze lijst;</text><text x="46" y="1204" class="note">Eliëzers moeder Maseq wordt niet weggelaten.</text></svg>