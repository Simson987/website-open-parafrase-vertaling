<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Twee namen, twee rouwmomenten</title><desc id="desc">Twee namen, twee rouwmomenten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee namen, twee rouwmomenten</text><text x="44" y="113" class="ref">Jubileeën 32:30–34</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Debora · 30</text><text x="68" y="241" class="body">Verzorgster van Rebekka; sterft in</text><text x="68" y="284" class="body">nacht van dag 23; begraven onder eik</text><text x="68" y="327" class="body">bij de rivier.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Allon-Bachuth · 30</text><text x="68" y="476" class="body">Eik van de rouw om Debora; rivier van</text><text x="68" y="519" class="body">Debora.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Rebekka en Jakob · 31–32</text><text x="68" y="668" class="body">Zij terug naar Izak; Jakob volgt tot</text><text x="68" y="711" class="body">Kabratan.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Rachel en zoon · 33–34</text><text x="68" y="860" class="body">Ben-oni, zoon van mijn pijn; vader</text><text x="68" y="903" class="body">noemt hem Benjamin; Rachel sterft en</text><text x="68" y="946" class="body">wordt in Efrath/Bethlehem begraven.</text><text x="46" y="1039" class="note">Debora’s eik en Rachels graf zijn verschillende</text><text x="46" y="1075" class="note">plaatsen en momenten. De geboorte krijgt een</text><text x="46" y="1111" class="note">bedekt beeld van het kind.</text></svg>