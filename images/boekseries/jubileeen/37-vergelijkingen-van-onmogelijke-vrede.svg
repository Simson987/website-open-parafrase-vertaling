<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">Beelden van onmogelijke vrede</title><desc id="desc">Beelden van onmogelijke vrede met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beelden van onmogelijke vrede</text><text x="44" y="113" class="ref">Jubileeën 37:20–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wild zwijn · 20</text><text x="68" y="241" class="body">Zachte wol in plaats van borstels en</text><text x="68" y="284" class="body">horens als hert of schaap.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wolf en lam · 21</text><text x="68" y="433" class="body">Vrede zonder verslinden.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Leeuw en rund · 22</text><text x="68" y="582" class="body">Leeuw als schuilplaats voor het rund.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Raaf · 23</text><text x="68" y="731" class="body">Zo wit als de witte raza.</text><text x="46" y="824" class="note">Dit zijn Ezau’s onmogelijke voorwaarden voor</text><text x="46" y="860" class="note">vrede, geen echte dierveranderingen. Raza blijft</text><text x="46" y="896" class="note">de plaatselijke naam zonder soortidentificatie.</text></svg>