<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Dagen, tuin en reiniging</title><desc id="desc">Dagen, tuin en reiniging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dagen, tuin en reiniging</text><text x="44" y="113" class="ref">Jubileeën 3:8–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Adam · 8–9</text><text x="68" y="241" class="body">Eerste week geschapen; na 40 dagen naar</text><text x="68" y="284" class="body">Eden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eva · 8,12</text><text x="68" y="433" class="body">In tweede week getoond; na 80 dagen</text><text x="68" y="476" class="body">naar Eden.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zoon · 10</text><text x="68" y="625" class="body">7 dagen en 33 dagen: samen 40.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Dochter · 11–14</text><text x="68" y="774" class="body">14 dagen en 66 dagen: samen 80.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">In de tuin · 15–17</text><text x="68" y="923" class="body">Zeven jaar bewerken, bewaken en</text><text x="68" y="966" class="body">voorraad verzamelen.</text><text x="46" y="1059" class="note">Het schema toont de verbanden van de tekst met</text><text x="46" y="1095" class="note">reinheidsperioden; het geeft geen medische</text><text x="46" y="1131" class="note">uitleg van kraamtijd.</text></svg>