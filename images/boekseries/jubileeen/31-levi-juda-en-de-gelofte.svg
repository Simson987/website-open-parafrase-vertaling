<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Levi, Juda en de gelofte</title><desc id="desc">Levi, Juda en de gelofte met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levi, Juda en de gelofte</text><text x="44" y="113" class="ref">Jubileeën 31:1–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorbereiding · 1–3</text><text x="68" y="241" class="body">Reinigen en vreemde goden vernietigen;</text><text x="68" y="284" class="body">naar Beth-el op maand 7, dag 1.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rechterhand · 12–17</text><text x="68" y="433" class="body">Levi: heiligdomdienst, rechters en</text><text x="68" y="476" class="body">spreken van recht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Linkerhand · 12,18–21</text><text x="68" y="625" class="body">Juda: heerschappij, hulp en vrede voor</text><text x="68" y="668" class="body">Jakobs nakomelingen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Reis · 26–32</text><text x="68" y="817" class="body">Izak 165 en te oud; Rebekka en Debora</text><text x="68" y="860" class="body">gaan mee; gelofte uitvoeren.</text><text x="46" y="953" class="note">De handen zijn die van Izak: Levi rechts en Juda</text><text x="46" y="989" class="note">links. De zegenrollen blijven onderscheiden.</text></svg>