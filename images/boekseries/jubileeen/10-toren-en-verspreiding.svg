<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Toren en verspreiding</title><desc id="desc">Toren en verspreiding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toren en verspreiding</text><text x="44" y="113" class="ref">Jubileeën 10:18–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bouw · 18–21</text><text x="68" y="241" class="body">Sinear; gebakken stenen en asfalt; 43</text><text x="68" y="284" class="body">jaar; 5433 el hoogte.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De bakstenen · 21</text><text x="68" y="433" class="body">Breedte: 13 hele bakstenen; een derde</text><text x="68" y="476" class="body">baksteen voor de hoogte, volgens de</text><text x="68" y="519" class="body">tekst.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Einde · 22–27</text><text x="68" y="668" class="body">Taal verward; bouw stopt; wind werpt</text><text x="68" y="711" class="body">toren om; verspreiding.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Landkeuze · 28–36</text><text x="68" y="860" class="body">Kanaän blijft in Sems gebied tegen de</text><text x="68" y="903" class="body">waarschuwing; Madai krijgt land en</text><text x="68" y="946" class="body">woont in Medië.</text><text x="46" y="1039" class="note">De baksteenformulering en elmaat worden niet tot</text><text x="46" y="1075" class="note">een nauwkeurige moderne bouwtekening omgerekend.</text></svg>