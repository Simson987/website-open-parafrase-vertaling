<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Dina, geweld en reacties</title><desc id="desc">Dina, geweld en reacties met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dina, geweld en reacties</text><text x="44" y="113" class="ref">Jubileeën 30:1–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin · 1–3</text><text x="68" y="241" class="body">Salem bij Sichem; Dina ontvoerd en</text><text x="68" y="284" class="body">onteerd door Sichem, zoon van Hemor;</text><text x="68" y="327" class="body">huwelijksvraag.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Simeon en Levi · 4–6</text><text x="68" y="476" class="body">Geweld tegen de mannen van de stad; de</text><text x="68" y="519" class="body">verteller duidt dit als gericht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wet en registratie · 7–23</text><text x="68" y="668" class="body">Huwelijksverbod, Levietenkeuze en</text><text x="68" y="711" class="body">hemelse beoordeling volgens deze rede.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De afloop · 24–26</text><text x="68" y="860" class="body">Dina terug; buit meegenomen; Jakob</text><text x="68" y="903" class="body">spreekt zijn zonen aan uit vrees;</text><text x="68" y="946" class="body">steden blijven bang.</text><text x="46" y="1039" class="note">Dina’s ontering en de doding worden zakelijk</text><text x="46" y="1075" class="note">benoemd. De beelden tonen terugkeer en dienst,</text><text x="46" y="1111" class="note">zonder het geweld uit te beelden.</text></svg>