<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Offers, reinheid en oprechtheid</title><desc id="desc">Offers, reinheid en oprechtheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Offers, reinheid en oprechtheid</text><text x="44" y="113" class="ref">Jubileeën 21:6–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dankoffer · 6–11</text><text x="68" y="241" class="body">Bloed op altaar; vet, meel, olie en</text><text x="68" y="284" class="body">drankoffer; altijd zout.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tijd · 10</text><text x="68" y="433" class="body">Eten op dag 1 en dag 2; vóór</text><text x="68" y="476" class="body">zonsondergang van dag 2 op; niets tot</text><text x="68" y="519" class="body">dag 3.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Reinheid · 16–18</text><text x="68" y="668" class="body">Lichaam, handen en voeten wassen vóór</text><text x="68" y="711" class="body">en na; bloed met aarde bedekken.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Recht en zegen · 19–26</text><text x="68" y="860" class="body">Geen omkoping bij mensenbloed; oprecht</text><text x="68" y="903" class="body">leven; plant van gerechtigheid en</text><text x="68" y="946" class="body">vredeswens.</text><text x="46" y="1039" class="note">De regels worden als tekstverband getoond; de</text><text x="46" y="1075" class="note">drie bestaande beelden tonen onderricht, zout en</text><text x="46" y="1111" class="note">wassen.</text></svg>