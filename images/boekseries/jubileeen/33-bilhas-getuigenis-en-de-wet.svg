<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Bilha’s getuigenis en de wet</title><desc id="desc">Bilha’s getuigenis en de wet met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bilha’s getuigenis en de wet</text><text x="44" y="113" class="ref">Jubileeën 33:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afwezigheid · 1</text><text x="68" y="241" class="body">Jakob en Lea naar Izak op maand 10, dag</text><text x="68" y="284" class="body">1.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bilha · 2–7</text><text x="68" y="433" class="body">Ruben komt terwijl zij slaapt; zij</text><text x="68" y="476" class="body">merkt het pas later en vertelt het</text><text x="68" y="519" class="body">Jakob.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Reactie · 8–9</text><text x="68" y="668" class="body">Jakob kwaad op Ruben; verdere relatie</text><text x="68" y="711" class="body">met Bilha stopt.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Wet en toelichting · 10–20</text><text x="68" y="860" class="body">Verbod en straf; de rede verklaart</text><text x="68" y="903" class="body">Rubens voortleven met nog niet volledig</text><text x="68" y="946" class="body">bekendgemaakte wet.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Familiebezoek · 21–23</text><text x="68" y="1095" class="body">Bij Abrahamshuis; Ruben als</text><text x="68" y="1138" class="body">eerstgeborene genoemd; eerbied voor</text><text x="68" y="1181" class="body">Izak en Rebekka.</text><text x="46" y="1274" class="note">De vertelling beschrijft geen instemming van</text><text x="46" y="1310" class="note">Bilha. Haar getuigenis en de latere strafregel</text><text x="46" y="1346" class="note">worden afzonderlijk samengevat.</text></svg>