<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1468" viewBox="0 0 840 1468" role="img" aria-labelledby="title desc"><title id="title">Namen bij Lea en Zilpa</title><desc id="desc">Namen bij Lea en Zilpa met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1468" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Namen bij Lea en Zilpa</text><text x="44" y="113" class="ref">Jubileeën 44:12–22</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben · 12</text><text x="68" y="241" class="body">Hanoch, Pallu, Hezron, Karmi.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Simeon · 13</text><text x="68" y="390" class="body">Jemuël, Jamin, Ohad, Jachin, Zohar,</text><text x="68" y="433" class="body">Saul; Saul uit Fenicische vrouw.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Levi en Juda · 14–15</text><text x="68" y="582" class="body">Levi: Gerson, Kehath, Merari. Juda:</text><text x="68" y="625" class="body">Sela, Perez, Zerah.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Issaschar en Zebulon · 16–18</text><text x="68" y="774" class="body">Tola, Puwa, Jasub, Simron; Sered, Elon,</text><text x="68" y="817" class="body">Jahleel. Ook zus Dina genoemd.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Gad · 19–20</text><text x="68" y="966" class="body">Zifjon, Haggi, Schuni, Ezbon, Eri,</text><text x="68" y="1009" class="body">Areli, Arodi.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Aser · 21–22</text><text x="68" y="1158" class="body">Jimna, Jisva, Jisvi, Berija; zus Sera.</text><text x="68" y="1201" class="body">Teksttotalen: 14 en 44.</text><text x="46" y="1294" class="note">De vaders staan bij de kinderlijsten. De</text><text x="46" y="1330" class="note">genoemde totalen worden als teksttotalen</text><text x="46" y="1366" class="note">bewaard, niet met verzonnen namen sluitend</text><text x="46" y="1402" class="note">gemaakt.</text></svg>