<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Mozes: van kind tot vlucht</title><desc id="desc">Mozes: van kind tot vlucht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mozes: van kind tot vlucht</text><text x="44" y="113" class="ref">Jubileeën 47:1–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geboorte · 1–4</text><text x="68" y="241" class="body">Onderdrukking; bevel over jongens;</text><text x="68" y="284" class="body">kistje met pek en asfalt; 7 dagen</text><text x="68" y="327" class="body">tussen riet.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zorg · 5–8</text><text x="68" y="476" class="body">Tharmut hoort huilen; zus haalt moeder</text><text x="68" y="519" class="body">Jochebed; zij krijgt loon.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Onderwijs · 9–10</text><text x="68" y="668" class="body">Amram leert schrijven; na 3 jaarweken</text><text x="68" y="711" class="body">naar hof; 3 jaarweken daar.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vlucht · 11–12</text><text x="68" y="860" class="body">Twee Israëlieten vechten; aanklacht</text><text x="68" y="903" class="body">over Egyptenaar maakt Mozes bang.</text><text x="46" y="996" class="note">De Egyptische dood wordt hier in de aanklacht</text><text x="46" y="1032" class="note">genoemd; dit schema volgt die aanklacht.</text><text x="46" y="1068" class="note">Jaarweek betekent zeven jaar.</text></svg>