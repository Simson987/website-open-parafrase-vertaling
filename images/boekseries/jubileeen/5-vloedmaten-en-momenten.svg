<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Vloedmaten en momenten</title><desc id="desc">Vloedmaten en momenten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vloedmaten en momenten</text><text x="44" y="113" class="ref">Jubileeën 5:22–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bouw en ingang · 22–23</text><text x="68" y="241" class="body">Jubeljaar 2, jaarweek 5: bouw in jaar</text><text x="68" y="284" class="body">5; ingang in jaar 6, maand 2, dag 1–16.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Water · 24–27</text><text x="68" y="433" class="body">Zeven hemelsluizen en zeven bronnen; 40</text><text x="68" y="476" class="body">dagen en nachten; 15 el boven bergen;</text><text x="68" y="519" class="body">150 dagen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Lubar · 28–30</text><text x="68" y="668" class="body">Ark rust op Lubar in Ararat; bronnen</text><text x="68" y="711" class="body">dicht in maand 4; toppen zichtbaar op</text><text x="68" y="754" class="body">maand 10, dag 1.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Uitgang · 31–32</text><text x="68" y="903" class="body">Aarde droog; op dag 27 van die maand</text><text x="68" y="946" class="body">opent Noach de ark voor de dieren.</text><text x="46" y="1039" class="note">De lokale indeling en formulering die maand</text><text x="46" y="1075" class="note">blijven staan; er worden geen ontbrekende</text><text x="46" y="1111" class="note">maanden ingevuld.</text></svg>