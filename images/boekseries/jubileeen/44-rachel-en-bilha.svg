<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Namen bij Rachel en Bilha</title><desc id="desc">Namen bij Rachel en Bilha met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Namen bij Rachel en Bilha</text><text x="44" y="113" class="ref">Jubileeën 44:23–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jozef · 23–24</text><text x="68" y="241" class="body">Manasse en Efraïm al in Egypte; moeder</text><text x="68" y="284" class="body">Asnath, dochter van Potifera uit On.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Benjamin · 25–26</text><text x="68" y="433" class="body">Bela, Becher, Asbel, Gera, Naäman,</text><text x="68" y="476" class="body">Echi, Ros, Muppim, Huppim, Ard.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dan · 27–29</text><text x="68" y="625" class="body">Chusim, Samon, Asudi, Ijaka, Salomon;</text><text x="68" y="668" class="body">alleen Chusim blijft in leven.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nafthali · 30–31</text><text x="68" y="817" class="body">Jahzeel, Guni, Jezer, Sillem, Iv; Iv</text><text x="68" y="860" class="body">sterft in Egypte.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Teksttotalen · 26,32–34</text><text x="68" y="1009" class="body">Rachel 14; later 26; totaal Jakob 70.</text><text x="68" y="1052" class="body">Er en Onan al in Kanaän gestorven.</text><text x="46" y="1145" class="note">De twee verschillende Racheltotalen worden niet</text><text x="46" y="1181" class="note">geharmoniseerd. Dan en Nafthali zijn zonen van</text><text x="46" y="1217" class="note">Bilha; zij is Rachels slavin.</text></svg>