<svg xmlns="http://www.w3.org/2000/svg" width="840" height="770" viewBox="0 0 840 770" role="img" aria-labelledby="title desc"><title id="title">Erfdelen van Cham</title><desc id="desc">Erfdelen van Cham met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="770" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Erfdelen van Cham</text><text x="44" y="113" class="ref">Jubileeën 9:1</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Cusch</text><text x="68" y="241" class="body">Eerste deel, in het oosten.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Mitsraim</text><text x="68" y="390" class="body">Ten westen van Cusch.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Put</text><text x="68" y="539" class="body">Verder ten westen van Mitsraim.</text><text x="46" y="632" class="note">Deze passage noemt drie zonen en gebieden.</text><text x="46" y="668" class="note">Kanaän wordt hier niet als vierde erfdeel</text><text x="46" y="704" class="note">toegevoegd.</text></svg>