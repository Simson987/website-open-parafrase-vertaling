<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Familie, keuze en vertrek</title><desc id="desc">Familie, keuze en vertrek met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familie, keuze en vertrek</text><text x="44" y="113" class="ref">Jubileeën 12:9–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Familie · 9–11</text><text x="68" y="241" class="body">Abram met Sarai, dochter van zijn</text><text x="68" y="284" class="body">vader; Haran krijgt Lot; Nahor trouwt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ur en Haran · 12–15</text><text x="68" y="433" class="body">Abram 60; brand en dood van Haran;</text><text x="68" y="476" class="body">Terah verhuist naar Haran.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Sterren en gebed · 16–24</text><text x="68" y="625" class="body">Regen in Gods hand; Abram kiest voor</text><text x="68" y="668" class="body">Hem en ontvangt zegen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Taal en boeken · 25–27</text><text x="68" y="817" class="body">Engel spreekt Hebreeuws, taal van de</text><text x="68" y="860" class="body">schepping; Abram bestudeert boeken.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Weggaan · 28–31</text><text x="68" y="1009" class="body">Kanaän bekijken; vader zegent; Lot</text><text x="68" y="1052" class="body">meenemen, Nahor blijft.</text><text x="46" y="1145" class="note">De plaats Haran en Abrams broer Haran hebben</text><text x="46" y="1181" class="note">dezelfde naam, maar verschillende rollen.</text></svg>