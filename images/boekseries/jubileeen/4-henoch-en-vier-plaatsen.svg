<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Henoch en de vier plaatsen</title><desc id="desc">Henoch en de vier plaatsen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Henoch en de vier plaatsen</text><text x="44" y="113" class="ref">Jubileeën 4:17–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Henoch · 17–24</text><text x="68" y="241" class="body">Schrift, kalender en visioenen; getuigt</text><text x="68" y="284" class="body">tegen wachters; naar Eden gebracht.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vier plaatsen · 25–26</text><text x="68" y="433" class="body">Eden; berg van het oosten; Sinaï; Sion.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Adam · 29–30</text><text x="68" y="582" class="body">Sterft 70 jaar vóór 1000: 930 jaar;</text><text x="68" y="625" class="body">begraven in zijn scheppingsland.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Kaïn · 31–32</text><text x="68" y="774" class="body">Huis valt op hem; vergeldingsregel met</text><text x="68" y="817" class="body">hetzelfde voorwerp.</text><text x="46" y="910" class="note">De vier plaatsen zijn een tekstlijst, geen kaart</text><text x="46" y="946" class="note">met veronderstelde moderne coördinaten.</text></svg>