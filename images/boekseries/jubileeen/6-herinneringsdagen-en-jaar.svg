<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1154" viewBox="0 0 840 1154" role="img" aria-labelledby="title desc"><title id="title">Herinneringsdagen en jaar</title><desc id="desc">Herinneringsdagen en jaar met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1154" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herinneringsdagen en jaar</text><text x="44" y="113" class="ref">Jubileeën 6:23–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Maand 1, dag 1 · 25</text><text x="68" y="241" class="body">Opdracht voor de ark; later aarde droog</text><text x="68" y="284" class="body">en ark geopend.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Maand 4, dag 1 · 26</text><text x="68" y="433" class="body">Dieptebronnen gesloten.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Maand 7, dag 1 · 26</text><text x="68" y="582" class="body">Afgronden open; water zakt weg.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Maand 10, dag 1 · 27</text><text x="68" y="731" class="body">Bergtoppen zichtbaar; Noach blij.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Jaar · 30–38</text><text x="68" y="880" class="body">52 weken × 7 dagen = 364 dagen;</text><text x="68" y="923" class="body">waarschuwing tegen verschuiven.</text><text x="46" y="1016" class="note">Vers 23 noemt alleen maand 1, 4 en 10; vers 26</text><text x="46" y="1052" class="note">voegt maand 7 toe. De leeswijzer bewaart beide</text><text x="46" y="1088" class="note">formuleringen.</text></svg>