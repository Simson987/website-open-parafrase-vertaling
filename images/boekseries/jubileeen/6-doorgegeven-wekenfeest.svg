<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Het doorgegeven wekenfeest</title><desc id="desc">Het doorgegeven wekenfeest met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het doorgegeven wekenfeest</text><text x="44" y="113" class="ref">Jubileeën 6:18–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In de hemel</text><text x="68" y="241" class="body">Van schepping tot Noach: 26 jubeljaren</text><text x="68" y="284" class="body">en 5 jaarweken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Noach en zonen</text><text x="68" y="433" class="body">7 jubeljaren en 1 jaarweek, tot Noachs</text><text x="68" y="476" class="body">dood.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Daarna</text><text x="68" y="625" class="body">Feest verloren tot Abraham; Abraham,</text><text x="68" y="668" class="body">Izak en Jakob houden het.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Mozes en Israël</text><text x="68" y="817" class="body">Jaarlijks één dag in deze maand; twee</text><text x="68" y="860" class="body">kanten: weken en eerste vruchten.</text><text x="46" y="953" class="note">De aangegeven duur is een tekstgegeven; het</text><text x="46" y="989" class="note">schema zet die niet om in een ongenoemde</text><text x="46" y="1025" class="note">absolute jaartelling.</text></svg>