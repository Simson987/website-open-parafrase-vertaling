<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Bijeenkomst en erfenis</title><desc id="desc">Bijeenkomst en erfenis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bijeenkomst en erfenis</text><text x="44" y="113" class="ref">Jubileeën 20:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie groepen · 1</text><text x="68" y="241" class="body">Ismaël met 12 zonen; Izak met 2; 6</text><text x="68" y="284" class="body">zonen van Ketura met hun kinderen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onderricht · 2–10</text><text x="68" y="433" class="body">Liefde, gerechtigheid, verbond, trouw</text><text x="68" y="476" class="body">en afwijzen van afgoden; waarschuwing</text><text x="68" y="519" class="body">met Sodom.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bezittingen · 11</text><text x="68" y="668" class="body">Geschenken aan Ismaëls en Ketura’s</text><text x="68" y="711" class="body">zonen; al zijn bezit voor Izak.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Oostwaarts · 12–13</text><text x="68" y="860" class="body">Paran tot grens van Babel; families</text><text x="68" y="903" class="body">vermengen zich; Arabieren en</text><text x="68" y="946" class="body">Ismaëlieten genoemd.</text><text x="46" y="1039" class="note">De aantallen gaan over de hier genoemde groepen;</text><text x="46" y="1075" class="note">de namen van de twaalf zonen worden niet uit</text><text x="46" y="1111" class="note">andere hoofdstukken ingevuld.</text></svg>