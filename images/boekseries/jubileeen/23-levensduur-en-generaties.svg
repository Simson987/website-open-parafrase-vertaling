<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Levensduur en generaties</title><desc id="desc">Levensduur en generaties met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levensduur en generaties</text><text x="44" y="113" class="ref">Jubileeën 23:8–32</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Abraham · 8</text><text x="68" y="241" class="body">3 jubeljaren + 4 jaarweken = 175 jaar.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Verval · 9–25</text><text x="68" y="390" class="body">Voorouders: 19 jubeljaren; latere</text><text x="68" y="433" class="body">generaties minder dan 2; rampspoed en</text><text x="68" y="476" class="body">onderlinge strijd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Keerpunt · 26</text><text x="68" y="625" class="body">Kinderen bestuderen wetten en keren</text><text x="68" y="668" class="body">terug naar gerechtigheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Herstel · 27–31</text><text x="68" y="817" class="body">Bijna 1000 jaar; vrede, genezing en</text><text x="68" y="860" class="body">vreugde; beenderen rusten in aarde.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Getuigenis · 32</text><text x="68" y="1009" class="body">Mozes moet het opschrijven voor latere</text><text x="68" y="1052" class="body">generaties.</text><text x="46" y="1145" class="note">De levenscijfers zijn onderdeel van de</text><text x="46" y="1181" class="note">vooruitblik. Het herstelbeeld krijgt daarom het</text><text x="46" y="1217" class="note">type beloftebeeld.</text></svg>