<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Zeven koningsplaatsen</title><desc id="desc">Zeven koningsplaatsen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeven koningsplaatsen</text><text x="44" y="113" class="ref">Jubileeën 34:2–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3 · 4</text><text x="68" y="241" class="body">Tafu · Arees · Seragan.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">4–7 · 4</text><text x="68" y="390" class="body">Selo · Gaäz · Bethoron · Maänisakir.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Bij Izak · 3</text><text x="68" y="539" class="body">Jakob, Levi, Juda en Jozef; Benjamin</text><text x="68" y="582" class="body">blijft als jongste.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Uittocht · 5–9</text><text x="68" y="731" class="body">Bericht; Jakob met drie zonen en 6000</text><text x="68" y="774" class="body">man; kudden terug en thuiskomst.</text><text x="46" y="867" class="note">De namen zijn plaatsen van koningen, geen zeven</text><text x="46" y="903" class="note">persoonsnamen. Benjamin wordt niet bij de drie</text><text x="46" y="939" class="note">uitrukkende zonen geteld.</text></svg>