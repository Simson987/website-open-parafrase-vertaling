<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Van gesprek naar Elda</title><desc id="desc">Van gesprek naar Elda met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van gesprek naar Elda</text><text x="44" y="113" class="ref">Jubileeën 3:18–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gesprek · 18–20</text><text x="68" y="241" class="body">Vrouw en slang; aantrekkelijke boom en</text><text x="68" y="284" class="body">vrucht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bedekking · 21–26</text><text x="68" y="433" class="body">Eerst vijgenbladeren; daarna kleren van</text><text x="68" y="476" class="body">dierenhuiden en vertrek.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Reukwerk en taal · 27–31</text><text x="68" y="625" class="body">Galban, mirresap, geurige hars en</text><text x="68" y="668" class="body">nardus; dieren verliezen hun gedeelde</text><text x="68" y="711" class="body">spraak.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Elda · 32–35</text><text x="68" y="860" class="body">Vertrek op maand 4, dag 1; naam Eva;</text><text x="68" y="903" class="body">grondbewerking.</text><text x="46" y="996" class="note">De nieuwe scène toont het reukoffer met geklede</text><text x="46" y="1032" class="note">volwassenen. Dierentaal is een gegeven van het</text><text x="46" y="1068" class="note">verhaal.</text></svg>