<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Bilha, Zilpa en Rachel</title><desc id="desc">Bilha, Zilpa en Rachel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bilha, Zilpa en Rachel</text><text x="44" y="113" class="ref">Jubileeën 28:18–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bilha · 18</text><text x="68" y="241" class="body">Eerste zoon wordt geboren; hier zonder</text><text x="68" y="284" class="body">naam.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bilha · 19</text><text x="68" y="433" class="body">Nafthali; maand 7, dag 5; jaar 2 van</text><text x="68" y="476" class="body">jaarweek 4.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zilpa · 20–21</text><text x="68" y="625" class="body">Gad: maand 8, dag 12, jaar 3; Aser:</text><text x="68" y="668" class="body">maand 11, dag 2, jaar 5; jaarweek 4.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Rachel · 24–25</text><text x="68" y="817" class="body">Vruchtbaar geworden; Jozefs geboorte</text><text x="68" y="860" class="body">leidt het verzoek tot vertrek in.</text><text x="46" y="953" class="note">De naam Dan staat niet bij de eerste Bilha-zoon</text><text x="46" y="989" class="note">in de plaatselijke tekst en wordt hier niet</text><text x="46" y="1025" class="note">stilzwijgend toegevoegd.</text></svg>