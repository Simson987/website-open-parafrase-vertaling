<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Verbond, teken en bloed</title><desc id="desc">Verbond, teken en bloed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verbond, teken en bloed</text><text x="44" y="113" class="ref">Jubileeën 6:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanvang · 1–4</text><text x="68" y="241" class="body">Maand 3, dag 1 uit de ark; offer en</text><text x="68" y="284" class="body">verbond; vaste zaai- en oogstorde.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Leven · 5–14</text><text x="68" y="433" class="body">Talrijk worden; voedsel toegestaan,</text><text x="68" y="476" class="body">bloed uitgezonderd; rekenschap voor</text><text x="68" y="519" class="body">mensenbloed.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Regenboog · 15–16</text><text x="68" y="668" class="body">Teken dat geen allesvernietigende vloed</text><text x="68" y="711" class="body">terugkomt.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Wekenfeest · 17–22</text><text x="68" y="860" class="body">Jaarlijkse vernieuwing van het verbond,</text><text x="68" y="903" class="body">ook feest van de eerste vruchten.</text><text x="46" y="996" class="note">Het verbond en de feesten krijgen eigen regels;</text><text x="46" y="1032" class="note">de offers worden niet grafisch uitgebeeld.</text></svg>