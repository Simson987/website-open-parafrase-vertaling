<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Mastema en de uittocht</title><desc id="desc">Mastema en de uittocht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mastema en de uittocht</text><text x="44" y="113" class="ref">Jubileeën 48:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Terugkeer · 1–4</text><text x="68" y="241" class="body">Na 5 jaarweken en 1 jaar; Mastema</text><text x="68" y="284" class="body">bedreigt onderweg; engel redt.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oordelen · 5–11</text><text x="68" y="433" class="body">Tien aangekondigd; bloed, kikkers,</text><text x="68" y="476" class="body">luizen, steekvliegen, zweren,</text><text x="68" y="519" class="body">veesterfte en hagel genoemd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Achtervolging · 12–14</text><text x="68" y="668" class="body">Wagens en paarden; engel ertussen;</text><text x="68" y="711" class="body">Egyptenaren in zee.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Dagen en bezit · 15–19</text><text x="68" y="860" class="body">14–18 opgesloten; dag 19 losgelaten;</text><text x="68" y="903" class="body">zilver, goud, koper en kleren als</text><text x="68" y="946" class="body">arbeidsbetaling.</text><text x="46" y="1039" class="note">De opsomming noemt niet alle tien oordelen</text><text x="46" y="1075" class="note">afzonderlijk. Ontbrekende namen worden niet</text><text x="46" y="1111" class="note">ingevoegd; Mastema’s dagen volgen de tekst.</text></svg>