<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Twee gerechten, twee bezoeken</title><desc id="desc">Twee gerechten, twee bezoeken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee gerechten, twee bezoeken</text><text x="44" y="113" class="ref">Jubileeën 26:1–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ezau weg · 1–4</text><text x="68" y="241" class="body">Izak vraagt jachtgerecht en wil</text><text x="68" y="284" class="body">zegenen; Rebekka hoort het.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jakob naar binnen · 5–24</text><text x="68" y="433" class="body">Twee bokjes, Ezau’s kleren, gerecht en</text><text x="68" y="476" class="body">brood; stem en handen; maaltijd, kus en</text><text x="68" y="519" class="body">zegen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ezau terug · 25–32</text><text x="68" y="668" class="body">Jakob verbergt zich; Izak schrikt; Ezau</text><text x="68" y="711" class="body">vraagt bitter om zegen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Dreiging · 34–35</text><text x="68" y="860" class="body">Leven van zwaard; Ezau denkt aan het</text><text x="68" y="903" class="body">doden van Jakob na Izaks dood.</text><text x="46" y="996" class="note">De plaatselijke reeks bevat geen vers 33. De</text><text x="46" y="1032" class="note">leeswijzer vult die ontbrekende verszin niet</text><text x="46" y="1068" class="note">aan.</text></svg>