<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Abrams route en terugkeer</title><desc id="desc">Abrams route en terugkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Abrams route en terugkeer</text><text x="44" y="113" class="ref">Jubileeën 13:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Haran → Kanaän · 1–9</text><text x="68" y="241" class="body">Sarai mee; hoog eikenland; altaar bij</text><text x="68" y="284" class="body">Beth-el en Ai.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Hebron → zuiden · 10</text><text x="68" y="433" class="body">Twee jaar in Hebron; verder tot Lot</text><text x="68" y="476" class="body">komt.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Egypte · 11–15</text><text x="68" y="625" class="body">Vijf jaar vóór Sarai weggenomen wordt;</text><text x="68" y="668" class="body">plagen; teruggegeven en terug naar</text><text x="68" y="711" class="body">Beth-el/Ai.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Lot · 16–21</text><text x="68" y="860" class="body">Lot naar Sodom; Abram verdrietig;</text><text x="68" y="903" class="body">landbelofte en opdracht rond te lopen.</text><text x="46" y="996" class="note">Zoan wordt volgens vers 12 zeven jaar na Hebron</text><text x="46" y="1032" class="note">gebouwd; dit blijft relatieve teksttijd.</text></svg>