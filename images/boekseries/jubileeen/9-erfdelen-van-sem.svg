<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Erfdelen van Sem</title><desc id="desc">Erfdelen van Sem met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Erfdelen van Sem</text><text x="44" y="113" class="ref">Jubileeën 9:2–6</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1 · Elam</text><text x="68" y="241" class="body">Oost van de Tigris; India, Rode Zee,</text><text x="68" y="284" class="body">Dedan, Mebri, Ela, Susan, Pharnak en</text><text x="68" y="327" class="body">Tina.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">2 · Assur</text><text x="68" y="476" class="body">Assur, Nineve, Sinear en Sak, tot dicht</text><text x="68" y="519" class="body">bij India.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">3 · Arfachsad</text><text x="68" y="668" class="body">Chaldea, oost van Eufraat; Rode Zee,</text><text x="68" y="711" class="body">Libanon, Sanir en Amana.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">4 · Aram</text><text x="68" y="860" class="body">Mesopotamië tussen Tigris en Eufraat;</text><text x="68" y="903" class="body">Assur en Arara als grenzen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">5 · Lud</text><text x="68" y="1052" class="body">Bergen van Assur tot grote zee;</text><text x="68" y="1095" class="body">oostelijk gebied naast Assur.</text><text x="46" y="1188" class="note">De lijst verduidelijkt de vijf erfdelen zonder</text><text x="46" y="1224" class="note">de drie bestaande lotingsscènes te herhalen.</text></svg>