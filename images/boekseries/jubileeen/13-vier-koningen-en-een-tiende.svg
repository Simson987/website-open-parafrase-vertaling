<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Vier koningen en een tiende</title><desc id="desc">Vier koningen en een tiende met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier koningen en een tiende</text><text x="44" y="113" class="ref">Jubileeën 13:22–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vier · 22</text><text x="68" y="241" class="body">Kedor-laomer — Elam; Amrafel — Sinear;</text><text x="68" y="284" class="body">Arioch — Ellasar; Tideal — de volken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gevangen en terug · 23–25</text><text x="68" y="433" class="body">Lot meegenomen tot Dan; bericht; Abram</text><text x="68" y="476" class="body">verslaat Kedor-laomer en keert terug.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tiende · 25–27</text><text x="68" y="625" class="body">Aan Melchizedek; blijvende tiende van</text><text x="68" y="668" class="body">zaad, wijn, olie, runderen en schapen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Buit · 28–29</text><text x="68" y="817" class="body">Koning van Sodom vraagt mensen terug;</text><text x="68" y="860" class="body">Abram weigert zijn bezit.</text><text x="46" y="953" class="note">De namen en koninkrijken volgen de plaatselijke</text><text x="46" y="989" class="note">spelling; er worden geen extra bondgenoten uit</text><text x="46" y="1025" class="note">andere boeken bijgezet.</text></svg>