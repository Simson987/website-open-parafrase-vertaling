<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">Sabbat: jaren en dagen</title><desc id="desc">Sabbat: jaren en dagen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sabbat: jaren en dagen</text><text x="44" y="113" class="ref">Jubileeën 50:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Plaatsen · 1–3</text><text x="68" y="241" class="body">Dagen in Sin tussen Elim en Sinaï;</text><text x="68" y="284" class="body">jaren en jubeljaren op Sinaï; land zal</text><text x="68" y="327" class="body">rusten.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Telling · 4–5</text><text x="68" y="476" class="body">49 jubeljaren + 1 jaarweek + 2 jaar;</text><text x="68" y="519" class="body">nog 40 jaar tot oversteek Jordaan.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Rust · 6–9</text><text x="68" y="668" class="body">Zes dagen werken; dag 7 rust voor</text><text x="68" y="711" class="body">gezin, dienaren, vee en vreemdeling;</text><text x="68" y="754" class="body">dag 6 voorbereiden.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Heiligdom · 10–13</text><text x="68" y="903" class="body">Wierook en offers gaan door; strenge</text><text x="68" y="946" class="body">straffen voor ander werk.</text><text x="46" y="1039" class="note">De nog niet bekendgemaakte jaaraanvang wordt</text><text x="46" y="1075" class="note">niet ingevuld. Voorschriften en</text><text x="46" y="1111" class="note">toekomstverwachting zijn geen nieuwe</text><text x="46" y="1147" class="note">verhaalmomenten.</text></svg>