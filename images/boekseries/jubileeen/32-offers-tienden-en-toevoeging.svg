<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Offers, tienden en Toevoeging</title><desc id="desc">Offers, tienden en Toevoeging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Offers, tienden en Toevoeging</text><text x="44" y="113" class="ref">Jubileeën 32:1–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin · 1–4</text><text x="68" y="241" class="body">Levi droomt van priesterschap; dag 15:</text><text x="68" y="284" class="body">14 runderen, 28 rammen, 49 schapen, 60</text><text x="68" y="327" class="body">lammeren, 29 bokjes.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tienden · 5–15</text><text x="68" y="476" class="body">Gelofte en reine dieren; tweede tiende</text><text x="68" y="519" class="body">elk jaar op gekozen plaats eten; oude</text><text x="68" y="562" class="body">rest verbranden.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Visioen · 16–26</text><text x="68" y="711" class="body">Dag 22; naam Israël; zeven platen; hier</text><text x="68" y="754" class="body">geen eeuwig heiligdom bouwen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Toevoeging · 27–29</text><text x="68" y="903" class="body">Na de zeven dagen nog één feestdag met</text><text x="68" y="946" class="body">dezelfde offers.</text><text x="46" y="1039" class="note">De zeven platen bevatten niet zeven afzonderlijk</text><text x="46" y="1075" class="note">opgesomde wetten; het schema vult hun teksten</text><text x="46" y="1111" class="note">niet in.</text></svg>