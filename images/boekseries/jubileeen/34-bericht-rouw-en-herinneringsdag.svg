<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Bericht, rouw en herinneringsdag</title><desc id="desc">Bericht, rouw en herinneringsdag met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bericht, rouw en herinneringsdag</text><text x="44" y="113" class="ref">Jubileeën 34:10–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De mantel · 10–13</text><text x="68" y="241" class="body">Plan tegen Jozef; mantel met</text><text x="68" y="284" class="body">bokkenbloed op maand 7, dag 10; Jakob</text><text x="68" y="327" class="body">denkt aan een wild dier.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Drievoudige rouw · 14–17</text><text x="68" y="476" class="body">Verdriet om Jozef; Bilha sterft in</text><text x="68" y="519" class="body">Qafratef; Dina sterft; beide bij Rachel</text><text x="68" y="562" class="body">begraven.</text><rect x="42" y="620" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Een jaar · 17</text><text x="68" y="711" class="body">Jakob blijft rouwen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Jaarlijkse herinnering · 18–19</text><text x="68" y="860" class="body">Maand 7, dag 10: verootmoediging en</text><text x="68" y="903" class="body">verzoening met een bokje.</text><text x="46" y="996" class="note">Het doodsbericht is wat de familie gelooft;</text><text x="46" y="1032" class="note">Jozef leeft verder in hoofdstuk 39. De</text><text x="46" y="1068" class="note">leeswijzer maakt zijn dood niet tot vastgesteld</text><text x="46" y="1104" class="note">feit.</text></svg>