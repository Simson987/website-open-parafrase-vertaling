<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Geesten en boeken</title><desc id="desc">Geesten en boeken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geesten en boeken</text><text x="44" y="113" class="ref">Jubileeën 10:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gebed · 1–6</text><text x="68" y="241" class="body">Noachs zonen klagen; Noach vraagt</text><text x="68" y="284" class="body">bescherming van de levenden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verdeling · 7–11</text><text x="68" y="433" class="body">Mastema vraagt een deel: 1/10 blijft,</text><text x="68" y="476" class="body">9/10 naar de oordeelsplaats.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Onderricht · 10–14</text><text x="68" y="625" class="body">Engelen leren over geneesmiddelen;</text><text x="68" y="668" class="body">Noach schrijft en geeft boeken aan Sem.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Noach · 15–17</text><text x="68" y="817" class="body">Begraven op Lubar; 950 jaar = 19</text><text x="68" y="860" class="body">jubeljaren en 2 jaarweken.</text><text x="46" y="953" class="note">Geneesmiddelen worden beschreven als onderdeel</text><text x="46" y="989" class="note">van dit verhaal; de leeswijzer geeft geen</text><text x="46" y="1025" class="note">recepten of medische werking aan concrete</text><text x="46" y="1061" class="note">planten.</text></svg>