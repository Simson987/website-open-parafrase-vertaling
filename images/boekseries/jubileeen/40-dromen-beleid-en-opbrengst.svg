<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Dromen, beleid en opbrengst</title><desc id="desc">Dromen, beleid en opbrengst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dromen, beleid en opbrengst</text><text x="44" y="113" class="ref">Jubileeën 40:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dromen · 1–3</text><text x="68" y="241" class="body">Twee dromen in één nacht; Jozef</text><text x="68" y="284" class="body">verklaart één boodschap.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Beleid · 4–9</text><text x="68" y="433" class="body">Voedsel per stad voor 7 hongerjaren;</text><text x="68" y="476" class="body">tweede man, tweede wagen, fijn linnen</text><text x="68" y="519" class="body">en goud.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Naam en leeftijd · 10–11</text><text x="68" y="668" class="body">Zafnath Paäneah; 30 jaar voor Farao.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Overvloed · 12–13</text><text x="68" y="817" class="body">7 jaren; één maat levert 1800 maten;</text><text x="68" y="860" class="body">graan niet meer te tellen.</text><text x="46" y="953" class="note">De maatverhouding is precies de tekst. De</text><text x="46" y="989" class="note">droominhoud van koeien of aren wordt hier niet</text><text x="46" y="1025" class="note">uitgewerkt omdat dit hoofdstuk die niet</text><text x="46" y="1061" class="note">beschrijft.</text></svg>