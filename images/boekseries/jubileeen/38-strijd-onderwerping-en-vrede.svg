<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">Strijd, onderwerping en vrede</title><desc id="desc">Strijd, onderwerping en vrede met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Strijd, onderwerping en vrede</text><text x="44" y="113" class="ref">Jubileeën 38:1–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij de toren · 1–3</text><text x="68" y="241" class="body">Juda spoort Jakob aan; Ezau en de</text><text x="68" y="284" class="body">Arameeër Aduran worden door pijlen</text><text x="68" y="327" class="body">gedood.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Uitval · 4–8</text><text x="68" y="476" class="body">Vier kanten; westelijke groep doodt 400</text><text x="68" y="519" class="body">krijgers, 600 vluchten.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Seïr · 9–12</text><text x="68" y="668" class="body">Achtervolging en onderwerping; Jakob</text><text x="68" y="711" class="body">beveelt vrede in plaats van verdere</text><text x="68" y="754" class="body">doding.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Gevolg · 13–14</text><text x="68" y="903" class="body">Edom onder juk tot Jakobs vertrek naar</text><text x="68" y="946" class="body">Egypte en in de vertellerstijd.</text><text x="46" y="1039" class="note">De naam is hier Aduran, tegenover Aduram in</text><text x="46" y="1075" class="note">hoofdstuk 37. De geweldshandelingen worden</text><text x="46" y="1111" class="note">zakelijk beschreven zonder nieuwe</text><text x="46" y="1147" class="note">dodingstaferelen.</text></svg>