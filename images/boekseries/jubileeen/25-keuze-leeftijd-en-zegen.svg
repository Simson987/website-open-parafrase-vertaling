<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Keuze, leeftijd en zegen</title><desc id="desc">Keuze, leeftijd en zegen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Keuze, leeftijd en zegen</text><text x="44" y="113" class="ref">Jubileeën 25:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Raad · 1–3</text><text x="68" y="241" class="body">Rebekka vraagt een vrouw uit haar</text><text x="68" y="284" class="body">vaders familie, niet uit Kanaän.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jakob · 4–10</text><text x="68" y="433" class="body">63 jaar; wil een dochter van Laban;</text><text x="68" y="476" class="body">noemt 22 jaar aandringen van zijn</text><text x="68" y="519" class="body">broer.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Gebed · 11–15</text><text x="68" y="668" class="body">Rebekka looft en legt beide handen op</text><text x="68" y="711" class="body">Jakobs hoofd.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Beelden · 16–23</text><text x="68" y="860" class="body">Kinderen als de maanden; verdere</text><text x="68" y="903" class="body">nakomelingen als sterren en zeezand;</text><text x="68" y="946" class="body">land en blijvende naam.</text><text x="46" y="1039" class="note">Maanden, sterren en zand zijn vergelijkingen</text><text x="46" y="1075" class="note">voor talrijkheid, geen extra geboortelijst in</text><text x="46" y="1111" class="note">dit hoofdstuk.</text></svg>