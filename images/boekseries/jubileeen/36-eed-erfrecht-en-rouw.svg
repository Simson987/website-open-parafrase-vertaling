<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Eed, erfrecht en rouw</title><desc id="desc">Eed, erfrecht en rouw met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eed, erfrecht en rouw</text><text x="44" y="113" class="ref">Jubileeën 36:1–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Laatste opdracht · 1–11</text><text x="68" y="241" class="body">Machpela als graf; liefde als broers en</text><text x="68" y="284" class="body">plechtige eed om elkaar niet te</text><text x="68" y="327" class="body">schaden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bezitsverdeling · 12–16</text><text x="68" y="476" class="body">Grootste deel met toren voor</text><text x="68" y="519" class="body">eerstgeborene; Ezau erkent dat Jakob</text><text x="68" y="562" class="body">dit recht gekocht heeft.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Afscheid · 17–20</text><text x="68" y="711" class="body">Samen eten; Izak slaapt in; Ezau naar</text><text x="68" y="754" class="body">Seïr, Jakob bij Hebron.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Lea · 21–24</text><text x="68" y="903" class="body">Sterft; links van Sara bij Rebekka</text><text x="68" y="946" class="body">begraven; kinderen troosten Jakob.</text><text x="46" y="1039" class="note">De toewijzing van de toren volgt Ezau’s</text><text x="46" y="1075" class="note">erkenning; ze wordt niet ondanks zijn verkoop</text><text x="46" y="1111" class="note">toch aan Ezau gegeven.</text></svg>