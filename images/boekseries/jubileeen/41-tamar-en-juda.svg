<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Tamar, Juda en het onderpand</title><desc id="desc">Tamar, Juda en het onderpand met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tamar, Juda en het onderpand</text><text x="44" y="113" class="ref">Jubileeën 41:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Familie · 1–7</text><text x="68" y="241" class="body">Er trouwt Tamar en sterft; Onan als</text><text x="68" y="284" class="body">zwager; Sela wordt haar niet gegeven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bewijs · 8–19</text><text x="68" y="433" class="body">Timna; ring, halssnoer en staf; Juda</text><text x="68" y="476" class="body">erkent: Tamar is rechtvaardiger.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Kinderen · 20–22</text><text x="68" y="625" class="body">Perez en Zerah; einde van de zeven</text><text x="68" y="668" class="body">overvloedjaren.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Berouw · 23–28</text><text x="68" y="817" class="body">Juda verootmoedigt zich; droom over</text><text x="68" y="860" class="body">vergeving; daarna algemene strafregel.</text><text x="46" y="953" class="note">De uitspraak over Tamar, Juda’s berouw en de</text><text x="46" y="989" class="note">latere wet zijn verschillende tekststemmen.</text></svg>