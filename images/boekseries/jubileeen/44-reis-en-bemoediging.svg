<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Reis en bemoediging</title><desc id="desc">Reis en bemoediging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reis en bemoediging</text><text x="44" y="113" class="ref">Jubileeën 44:1–10</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hebron → Berseba · 1</text><text x="68" y="241" class="body">Maand 3, dag 1 vertrek; dag 7 offer.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Herinnering · 2–4</text><text x="68" y="390" class="body">Beth-eldroom; angst voor Egypte;</text><text x="68" y="433" class="body">eerstelingenfeest met oud graan.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Toezegging · 5–6</text><text x="68" y="582" class="body">Dag 16: meegaan, terugbrengen en</text><text x="68" y="625" class="body">begraven in het land; Jozef sluit zijn</text><text x="68" y="668" class="body">ogen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Berseba → Egypte · 7–10</text><text x="68" y="817" class="body">Dag 16 vertrek met wagens; Juda vooruit</text><text x="68" y="860" class="body">om Gosen te verkennen.</text><text x="46" y="953" class="note">De eerstevruchten worden hier met oud graan</text><text x="46" y="989" class="note">gevierd wegens de hongersnood; geen nieuwe</text><text x="46" y="1025" class="note">Kanaänitische oogst.</text></svg>