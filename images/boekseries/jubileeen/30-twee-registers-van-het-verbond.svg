<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Twee registers van het verbond</title><desc id="desc">Twee registers van het verbond met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee registers van het verbond</text><text x="44" y="113" class="ref">Jubileeën 30:18–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Levi · 18–19</text><text x="68" y="241" class="body">Priesterschap en levietendienst; zegen</text><text x="68" y="284" class="body">en gerechtigheid als getuigenis.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vriend · 20–21</text><text x="68" y="433" class="body">Gerechtigheid onthouden; opgeschreven</text><text x="68" y="476" class="body">als vriend en rechtvaardige.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vijand · 22</text><text x="68" y="625" class="body">Bij overtreding uit boek van leven</text><text x="68" y="668" class="body">geschrapt; bij wie vernietigd worden</text><text x="68" y="711" class="body">geschreven.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Duiding · 23</text><text x="68" y="860" class="body">De rede waardeert de wraak als oprecht;</text><text x="68" y="903" class="body">Jakobs angst staat daarnaast in vers</text><text x="68" y="946" class="body">25.</text><text x="46" y="1039" class="note">De uitleg onderscheidt de hemelse waardering in</text><text x="46" y="1075" class="note">de rede en Jakobs eigen reactie, zonder die</text><text x="46" y="1111" class="note">gelijk te trekken.</text></svg>