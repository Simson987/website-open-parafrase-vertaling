<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Kaïnan en zijn familie</title><desc id="desc">Kaïnan en zijn familie met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kaïnan en zijn familie</text><text x="44" y="113" class="ref">Jubileeën 8:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Arfachsad en Rasu’eja · 1</text><text x="68" y="241" class="body">Kaïnan is hun zoon; Rasu’eja is dochter</text><text x="68" y="284" class="body">van Susan, dochter van Elam.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rotschrift · 2–4</text><text x="68" y="433" class="body">Kaïnan leest en kopieert wachtersleer;</text><text x="68" y="476" class="body">houdt dit verborgen voor Noach.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Kaïnan en Mêlka · 5–6</text><text x="68" y="625" class="body">Mêlka is dochter van Abaday, zoon van</text><text x="68" y="668" class="body">Jafeth; zoon Selah.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Selah en Mû’ak · 6–8</text><text x="68" y="817" class="body">Mû’ak is dochter van Kesed, broer van</text><text x="68" y="860" class="body">Selahs vader; Heber en daarna Peleg</text><text x="68" y="903" class="body">genoemd.</text><text x="46" y="996" class="note">Het schema volgt de formulering bij de laatste</text><text x="46" y="1032" class="note">geboorten zonder een verdergaande ouderkoppeling</text><text x="46" y="1068" class="note">toe te voegen.</text></svg>