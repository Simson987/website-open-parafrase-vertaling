<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Van ravenjacht naar zaaibak</title><desc id="desc">Van ravenjacht naar zaaibak met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van ravenjacht naar zaaibak</text><text x="44" y="113" class="ref">Jubileeën 11:19–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verjagen · 19–21</text><text x="68" y="241" class="body">Abram houdt de vogels tegen; 70 keer op</text><text x="68" y="284" class="body">één dag.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Meegaan · 22</text><text x="68" y="433" class="body">Zaaiers vragen zijn hulp tot de</text><text x="68" y="476" class="body">zaaitijd voorbij is.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bak op ploegbalk · 23</text><text x="68" y="625" class="body">Zaad in de bak boven de grond; valt op</text><text x="68" y="668" class="body">het ploegijzer.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bedekken · 23–24</text><text x="68" y="817" class="body">Zaad wordt in de aarde bedekt; bij elke</text><text x="68" y="860" class="body">ploeg toegepast.</text><text x="46" y="953" class="note">De technische volgorde volgt het hoofdstuk; de</text><text x="46" y="989" class="note">bestaande ploegillustratie is een voorstelling,</text><text x="46" y="1025" class="note">geen opgemeten reconstructie.</text></svg>