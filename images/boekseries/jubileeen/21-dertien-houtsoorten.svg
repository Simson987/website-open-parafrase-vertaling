<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1154" viewBox="0 0 840 1154" role="img" aria-labelledby="title desc"><title id="title">Dertien houtsoorten</title><desc id="desc">Dertien houtsoorten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1154" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dertien houtsoorten</text><text x="44" y="113" class="ref">Jubileeën 21:12–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3</text><text x="68" y="241" class="body">Cipres · defran · sagad.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">4–6</text><text x="68" y="390" class="body">Pijnboom · spar · ceder.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">7–9</text><text x="68" y="539" class="body">Savenhout · palm · olijfboom.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">10–13</text><text x="68" y="688" class="body">Mirre · laurier · jeneverbes, arbat</text><text x="68" y="731" class="body">genoemd · balsem.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Kwaliteit · 13–14</text><text x="68" y="880" class="body">Stevig, gaaf, gezond en jong; geen</text><text x="68" y="923" class="body">ander of oud hout.</text><text x="46" y="1016" class="note">De minder bekende namen blijven ongewijzigd. Er</text><text x="46" y="1052" class="note">worden geen moderne botanische soorten aan</text><text x="46" y="1088" class="note">defran of sagad gekoppeld.</text></svg>