<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">De eerste familierelaties</title><desc id="desc">De eerste familierelaties met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eerste familierelaties</text><text x="44" y="113" class="ref">Jubileeën 4:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Adam en Eva · 1–10</text><text x="68" y="241" class="body">Kaïn en Abel; dochter Azura; zus Awan</text><text x="68" y="284" class="body">genoemd; nog negen zonen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kaïn en Awan · 9</text><text x="68" y="433" class="body">Zoon Henoch, aan het einde van</text><text x="68" y="476" class="body">jubeljaar 4.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Seth en Azura · 11–12</text><text x="68" y="625" class="body">Zoon Enos; Enos roept de naam van God</text><text x="68" y="668" class="body">aan.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Enos en Noam · 13</text><text x="68" y="817" class="body">Zoon Kenan.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Kenan en Mualelit · 14</text><text x="68" y="966" class="body">Zoon Mahalal-el.</text><text x="46" y="1059" class="note">De Henoch van Kaïn en Awan wordt niet verwisseld</text><text x="46" y="1095" class="note">met de later beschreven schrijver Henoch.</text></svg>