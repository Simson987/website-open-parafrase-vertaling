<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Verbond, breuk en herstel</title><desc id="desc">Verbond, breuk en herstel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verbond, breuk en herstel</text><text x="44" y="113" class="ref">Jubileeën 1:1–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sinaï · 1–7</text><text x="68" y="241" class="body">Jaar 1, maand 3, dag 16; zes dagen</text><text x="68" y="284" class="body">wolk, roep op dag 7; 40 dagen en</text><text x="68" y="327" class="body">nachten.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Breuk · 8–14</text><text x="68" y="476" class="body">Vreemde goden, vergeten geboden,</text><text x="68" y="519" class="body">verworpen getuigen en gevangenschap.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Herstel · 15–25</text><text x="68" y="668" class="body">Terugkeer met heel het hart,</text><text x="68" y="711" class="body">bijeenbrengen, gebed van Mozes en</text><text x="68" y="754" class="body">vaderschap.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Schrijven · 26–29</text><text x="68" y="903" class="body">Jaarweken en jubeljaren; engel met</text><text x="68" y="946" class="body">platen; nieuwe schepping en heiligdom</text><text x="68" y="989" class="body">op Sion.</text><text x="46" y="1082" class="note">Het schema onderscheidt Mozes’ bergverblijf van</text><text x="46" y="1118" class="note">de daarin aangekondigde toekomst.</text></svg>