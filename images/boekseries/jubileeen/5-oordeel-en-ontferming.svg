<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Oordeel en ontferming</title><desc id="desc">Oordeel en ontferming met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oordeel en ontferming</text><text x="44" y="113" class="ref">Jubileeën 5:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verdorven wegen · 1–5</text><text x="68" y="241" class="body">De hele aarde; alleen Noach vindt</text><text x="68" y="284" class="body">genade.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Engelen en zonen · 6–11</text><text x="68" y="433" class="body">Macht afgenomen, zonen geoordeeld;</text><text x="68" y="476" class="body">engelen gebonden tot het gericht; 120</text><text x="68" y="519" class="body">jaar genoemd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Rechtvaardig gericht · 12–16</text><text x="68" y="668" class="body">Hemelse platen; groten en kleinen; geen</text><text x="68" y="711" class="body">omkoping.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Omkeren en redding · 17–21</text><text x="68" y="860" class="body">Vergeving bij bekering; Noach en zonen</text><text x="68" y="903" class="body">gered; opdracht voor de ark.</text><text x="46" y="996" class="note">De 120 jaar blijven de genoemde tekstmaat; het</text><text x="46" y="1032" class="note">schema rekent er geen afzonderlijke</text><text x="46" y="1068" class="note">vloedkalender uit.</text></svg>