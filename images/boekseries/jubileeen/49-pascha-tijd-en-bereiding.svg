<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Pascha: tijd en bereiding</title><desc id="desc">Pascha: tijd en bereiding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Pascha: tijd en bereiding</text><text x="44" y="113" class="ref">Jubileeën 49:1–15,22–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Datum · 1,7–11</text><text x="68" y="241" class="body">Maand 1, dag 14; elk jaar op eigen dag;</text><text x="68" y="284" class="body">eten in de nacht vanaf zonsondergang.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tijdsgrens · 10–12</text><text x="68" y="433" class="body">Tussen twee avonden; tot het derde deel</text><text x="68" y="476" class="body">van de nacht; resten verbranden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bereiding · 13</text><text x="68" y="625" class="body">Geroosterd in vuur; niet rauw of</text><text x="68" y="668" class="body">gekookt in water.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Herinnering · 2–6,22–23</text><text x="68" y="817" class="body">Beschermde huizen; lof en vertrek; 7</text><text x="68" y="860" class="body">dagen ongezuurd brood; feest eindigt</text><text x="68" y="903" class="body">aan zee.</text><text x="46" y="996" class="note">De plaatselijke delen van dag en nacht worden</text><text x="46" y="1032" class="note">niet in moderne kloktijden omgezet.</text></svg>