<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1389" viewBox="0 0 840 1389" role="img" aria-labelledby="title desc"><title id="title">Zes dagen in dit hoofdstuk</title><desc id="desc">Zes dagen in dit hoofdstuk met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1389" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes dagen in dit hoofdstuk</text><text x="44" y="113" class="ref">Jubileeën 2:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dag 1 · 2–3</text><text x="68" y="241" class="body">Hemel, aarde, water, dienende geesten,</text><text x="68" y="284" class="body">duisternis en licht; zeven grote</text><text x="68" y="327" class="body">werken.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dag 2 · 4</text><text x="68" y="476" class="body">Hemelgewelf en verdeling van water.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dag 3 · 5–7</text><text x="68" y="625" class="body">Droog land, zeeën, rivieren en</text><text x="68" y="668" class="body">verzamelplaatsen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Dag 4 · 8–10</text><text x="68" y="817" class="body">Zon, maan en sterren; tijden en licht.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Dag 5 · 11–12</text><text x="68" y="966" class="body">Zeedieren, vissen en vogels.</text><rect x="42" y="1024" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1067" class="label">Dag 6 · 13–16</text><text x="68" y="1115" class="body">Landdieren en mens, man en vrouw;</text><text x="68" y="1158" class="body">voltooiing; 22 soorten genoemd.</text><text x="46" y="1251" class="note">De lijst volgt deze plaatselijke tekst. Er wordt</text><text x="46" y="1287" class="note">geen plantenpassage toegevoegd die hier niet</text><text x="46" y="1323" class="note">afzonderlijk staat.</text></svg>