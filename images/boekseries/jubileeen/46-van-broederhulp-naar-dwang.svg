<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Van broederhulp naar dwang</title><desc id="desc">Van broederhulp naar dwang met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van broederhulp naar dwang</text><text x="44" y="113" class="ref">Jubileeën 46:1–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Samenleven · 1–2</text><text x="68" y="241" class="body">Groei en hulp zolang Jozef leeft.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Jozef · 3–8</text><text x="68" y="390" class="body">110 jaar; 17 in Kanaän, 10 dienaar; eed</text><text x="68" y="433" class="body">over beenderen; begrafenis in Egypte.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Kanaän en Egypte · 7–11</text><text x="68" y="582" class="body">Nieuwe koning, gesloten poorten en</text><text x="68" y="625" class="body">oorlog; Amram blijft in Hebrons</text><text x="68" y="668" class="body">bergland.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Onderdrukking · 12–16</text><text x="68" y="817" class="body">Angst voor talrijk volk; opzichters en</text><text x="68" y="860" class="body">zware arbeid; groei gaat door.</text><text x="46" y="953" class="note">De 17 en 10 jaren zijn afzonderlijke</text><text x="46" y="989" class="note">levensdelen, geen volledige som van Jozefs 110</text><text x="46" y="1025" class="note">jaar.</text></svg>