<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1432" viewBox="0 0 840 1432" role="img" aria-labelledby="title desc"><title id="title">De genoemde huwelijken</title><desc id="desc">De genoemde huwelijken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1432" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde huwelijken</text><text x="44" y="113" class="ref">Jubileeën 4:15–33</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mahalal-el · 15</text><text x="68" y="241" class="body">Dina, dochter van Barakeël; dochter van</text><text x="68" y="284" class="body">zijn tante.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jered · 16</text><text x="68" y="433" class="body">Baraka, dochter van Rasueël; dochter</text><text x="68" y="476" class="body">van zijn tante.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Henoch · 20</text><text x="68" y="625" class="body">Edni, dochter van Daniël; dochter van</text><text x="68" y="668" class="body">zijn tante.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Methusalach · 27</text><text x="68" y="817" class="body">Edna, dochter van Ezraël; zoon Lamech.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Lamech · 28</text><text x="68" y="966" class="body">Betenos, dochter van Barakeël; zoon</text><text x="68" y="1009" class="body">Noach.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Noach · 33</text><text x="68" y="1158" class="body">Emzara, dochter van Rakiël; dochter van</text><text x="68" y="1201" class="body">zijn zus.</text><text x="46" y="1294" class="note">De namen en verwantschappen volgen dit</text><text x="46" y="1330" class="note">hoofdstuk; ontbrekende afstammingszinnen worden</text><text x="46" y="1366" class="note">niet uit Genesis aangevuld.</text></svg>