<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Twee jongens en de zegen</title><desc id="desc">Twee jongens en de zegen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee jongens en de zegen</text><text x="44" y="113" class="ref">Jubileeën 19:14–31</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jakob · 14–16</text><text x="68" y="241" class="body">Schrift en tenten; geliefd bij Abraham.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Ezau · 14–16</text><text x="68" y="390" class="body">Veld, jacht en strijd; geliefd bij</text><text x="68" y="433" class="body">Izak.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Rebekka · 17–25</text><text x="68" y="582" class="body">Opdracht goed voor Jakob te zorgen;</text><text x="68" y="625" class="body">zandvergelijking en voortgaande zegen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Zegen · 26–31</text><text x="68" y="774" class="body">Kus en gebed; geen macht voor Mastema;</text><text x="68" y="817" class="body">Rebekka bij de ontmoeting.</text><text x="46" y="910" class="note">De voorkeuren van Abraham, Izak en Rebekka</text><text x="46" y="946" class="note">worden onderscheiden; de jongens krijgen geen</text><text x="46" y="982" class="note">ongenoemde leeftijd.</text></svg>