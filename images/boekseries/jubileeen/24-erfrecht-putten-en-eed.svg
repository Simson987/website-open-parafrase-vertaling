<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Erfrecht, putten en eed</title><desc id="desc">Erfrecht, putten en eed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Erfrecht, putten en eed</text><text x="44" y="113" class="ref">Jubileeën 24:1–33</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee broers · 3–7</text><text x="68" y="241" class="body">Ezau geeft eerstgeboorterecht onder eed</text><text x="68" y="284" class="body">voor brood en rode soep; Jakob krijgt</text><text x="68" y="327" class="body">de positie.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gerar · 1–17</text><text x="68" y="476" class="body">7 jaar bij Lachai-Roï; hongersnood; 3</text><text x="68" y="519" class="body">jaarweken in Gerar; Abimelech stuurt</text><text x="68" y="562" class="body">hem weg.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Putten · 18–25</text><text x="68" y="711" class="body">Oude putten weer open; ruzie,</text><text x="68" y="754" class="body">Benauwdheid, Ruimte; daarna Berseba,</text><text x="68" y="797" class="body">stromende en droge put.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Eed · 26–33</text><text x="68" y="946" class="body">Abimelech, Ahuzzath en Pichol; Izak</text><text x="68" y="989" class="body">ervaart dwang en spreekt een vloek uit.</text><text x="46" y="1082" class="note">De putnamen blijven Benauwdheid en Ruimte zoals</text><text x="46" y="1118" class="note">hier geschreven; geen namen uit andere versies</text><text x="46" y="1154" class="note">worden ingevuld.</text></svg>