<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Onderricht en fruitjaren</title><desc id="desc">Onderricht en fruitjaren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onderricht en fruitjaren</text><text x="44" y="113" class="ref">Jubileeën 7:20–39</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geboden · 20–34</text><text x="68" y="241" class="body">Recht doen, bedekking, lof, ouders</text><text x="68" y="284" class="body">eren, liefde en geen bloed eten of</text><text x="68" y="327" class="body">vergieten.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Planten · 35–37</text><text x="68" y="476" class="body">Jaar 1–3 geen eetbare oogst; jaar 4</text><text x="68" y="519" class="body">heilige eerste vrucht; jaar 5</text><text x="68" y="562" class="body">vrijgeven.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Doorgifte · 38–39</text><text x="68" y="711" class="body">Henoch → Methusalach → Lamech → Noach →</text><text x="68" y="754" class="body">zijn zonen.</text><text x="46" y="847" class="note">De fruitjaren zijn de beschreven voorschriften;</text><text x="46" y="883" class="note">de wijngaardscène en de bedekking zijn al</text><text x="46" y="919" class="note">afzonderlijk aanwezig.</text></svg>