<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1303" viewBox="0 0 840 1303" role="img" aria-labelledby="title desc"><title id="title">Erfdelen van Jafeth</title><desc id="desc">Erfdelen van Jafeth met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1303" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Erfdelen van Jafeth</text><text x="44" y="113" class="ref">Jubileeën 9:7–15</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1 · Gomer · 8</text><text x="68" y="241" class="body">Oosten, zuidkant tot rivier Tina.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Madai · 9</text><text x="68" y="390" class="body">West van zijn twee broers; eilanden en</text><text x="68" y="433" class="body">kusten.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">4 · Javan · 10</text><text x="68" y="582" class="body">Eilanden, ook aan de kant van Lud.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">5 · Tubal · 11</text><text x="68" y="731" class="body">Landtongen naar Lud tot de derde.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">6 · Mesech · 12</text><text x="68" y="880" class="body">Over de derde landtong tot oost van</text><text x="68" y="923" class="body">Gadir.</text><rect x="42" y="981" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1024" class="label">7 · Thiras · 13</text><text x="68" y="1072" class="body">Vier grote eilanden dicht bij Cham.</text><text x="46" y="1165" class="note">Magog krijgt in dit hoofdstuk geen afzonderlijk</text><text x="46" y="1201" class="note">beschreven deel. Er wordt geen ontbrekend tweede</text><text x="46" y="1237" class="note">lot of nummer voor Madai verzonnen.</text></svg>