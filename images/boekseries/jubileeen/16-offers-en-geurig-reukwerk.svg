<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Offers en geurig reukwerk</title><desc id="desc">Offers en geurig reukwerk met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Offers en geurig reukwerk</text><text x="44" y="113" class="ref">Jubileeën 16:22–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Elke dag · 22</text><text x="68" y="241" class="body">2 runderen, 2 rammen, 7 schapen, 1</text><text x="68" y="284" class="body">jonge bok.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dankoffer · 23</text><text x="68" y="433" class="body">7 rammen, 7 bokjes, 7 schapen, 7</text><text x="68" y="476" class="body">bokken; graan- en drankoffers.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Genoemd reukwerk · 24</text><text x="68" y="625" class="body">Galban, mirresap, nardus, mirre,</text><text x="68" y="668" class="body">geurige aar, kostuswortel.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Telling · 24</text><text x="68" y="817" class="body">De tekst zegt deze zeven, maar schrijft</text><text x="68" y="860" class="body">hier zes namen uit; gelijke delen, fijn</text><text x="68" y="903" class="body">en zuiver gemengd.</text><text x="46" y="996" class="note">De ontbrekende zevende naam wordt niet uit een</text><text x="46" y="1032" class="note">andere reukwerklijst aangevuld. Het schema is</text><text x="46" y="1068" class="note">een telling, geen bereidingsrecept.</text></svg>