<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wie als oudste aanstellen?</title><desc id="desc">Wie als oudste aanstellen? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie als oudste aanstellen?</text><text x="44" y="113" class="ref">Titus 1:5–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gezin · vers 6</text><text x="68" y="241" class="body">Onberispelijk, man van één vrouw en</text><text x="68" y="284" class="body">gelovige kinderen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Afwijzen · vers 7</text><text x="68" y="433" class="body">Eigenzinnigheid, drift, wijnverslaving,</text><text x="68" y="476" class="body">ruzie en oneerlijke winst.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nastreven · vers 8</text><text x="68" y="625" class="body">Gastvrijheid, liefde voor het goede,</text><text x="68" y="668" class="body">beheersing, recht en heiligheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Leer · vers 9</text><text x="68" y="817" class="body">Het betrouwbare woord vasthouden;</text><text x="68" y="860" class="body">bemoedigen en weerleggen.</text><text x="46" y="953" class="note">Deze eisen horen bij Titus’ opdracht in elke</text><text x="46" y="989" class="note">stad op Kreta.</text></svg>