<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De reisverzoeken</title><desc id="desc">De reisverzoeken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De reisverzoeken</text><text x="44" y="113" class="ref">Titus 3:12–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Artemas of Tychikus</text><text x="68" y="241" class="body">Paulus zal een van hen naar Titus</text><text x="68" y="284" class="body">sturen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Titus naar Nikopolis</text><text x="68" y="433" class="body">Naar Paulus komen; Paulus wil daar</text><text x="68" y="476" class="body">overwinteren.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zenas en Apollos</text><text x="68" y="625" class="body">Goed op weg helpen zodat zij niets</text><text x="68" y="668" class="body">tekortkomen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De eigen mensen</text><text x="68" y="817" class="body">Leren in echte behoeften te voorzien</text><text x="68" y="860" class="body">door goede werken.</text><text x="46" y="953" class="note">Artemas en Tychikus zijn als alternatief</text><text x="46" y="989" class="note">genoemd; niet als een verplicht samen reizend</text><text x="46" y="1025" class="note">tweetal.</text></svg>