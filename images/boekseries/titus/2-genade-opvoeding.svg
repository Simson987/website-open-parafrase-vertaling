<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Wat de genade doet</title><desc id="desc">Wat de genade doet met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat de genade doet</text><text x="44" y="113" class="ref">Titus 2:11–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verschenen · vers 11</text><text x="68" y="241" class="body">Redding voor alle mensen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Opvoeden · vers 12</text><text x="68" y="390" class="body">Goddeloosheid en wereldse verlangens</text><text x="68" y="433" class="body">afwijzen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Leven en verwachten · vers 12–13</text><text x="68" y="582" class="body">Bezonnen, rechtvaardig en vroom; de</text><text x="68" y="625" class="body">gelukkige hoop.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Vrijgekocht · vers 14</text><text x="68" y="774" class="body">Een eigen, gereinigd volk, vol ijver</text><text x="68" y="817" class="body">voor goede werken.</text><text x="46" y="910" class="note">De opvoeding volgt in de tekst op het</text><text x="46" y="946" class="note">verschijnen van Gods genade.</text></svg>