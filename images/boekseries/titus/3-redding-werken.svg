<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Barmhartigheid en werken</title><desc id="desc">Barmhartigheid en werken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Barmhartigheid en werken</text><text x="44" y="113" class="ref">Titus 3:3–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vroeger · vers 3</text><text x="68" y="241" class="body">Onverstand, ongehoorzaamheid, afgunst</text><text x="68" y="284" class="body">en haat.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gods goedheid · vers 4–5</text><text x="68" y="433" class="body">Gered naar Zijn barmhartigheid, niet op</text><text x="68" y="476" class="body">grond van eigen rechtvaardige werken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vernieuwing · vers 5–7</text><text x="68" y="625" class="body">De Heilige Geest, genade en de hoop op</text><text x="68" y="668" class="body">het eeuwige leven.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Daarom · vers 8</text><text x="68" y="817" class="body">Gelovigen doen hun best om goede werken</text><text x="68" y="860" class="body">te doen.</text><text x="46" y="953" class="note">Goede werken worden verbonden met de ontvangen</text><text x="46" y="989" class="note">redding.</text></svg>