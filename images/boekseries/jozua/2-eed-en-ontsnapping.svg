<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De eed en de ontsnapping</title><desc id="desc">De voorwaarden van de eed en de drie dagen vóór het verslag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eed en de ontsnapping</text><text x="44" y="113" class="ref">Jozua 2:14–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De toezegging</text><text x="68" y="241" class="body">Het leven van de verkenners staat borg</text><text x="68" y="284" class="body">voor Rachab en haar familie.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het teken</text><text x="68" y="433" class="body">Een rood koord aan het raam waardoor de</text><text x="68" y="476" class="body">mannen afdalen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De familie</text><text x="68" y="625" class="body">Vader, moeder, broers en familie bijeen</text><text x="68" y="668" class="body">in haar huis; buiten de deur geldt de</text><text x="68" y="711" class="body">bescherming niet.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vertrouwelijkheid</text><text x="68" y="860" class="body">Hun zaak niet verraden.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De route van terugkeer</text><text x="68" y="1009" class="body">Drie dagen in het gebergte, daarna naar</text><text x="68" y="1052" class="body">Jozua om verslag uit te brengen.</text><text x="46" y="1145" class="note">Het rode teken, het ontsnappingstouw en de</text><text x="46" y="1181" class="note">voorwaarden zijn onderdelen van dezelfde</text><text x="46" y="1217" class="note">afspraak.</text></svg>