<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">List, eed en gevolg</title><desc id="desc">De opeenvolging van misleiding, ongevraagde raad, eed, ontdekking en gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">List, eed en gevolg</text><text x="44" y="113" class="ref">Jozua 9:3–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De list</text><text x="68" y="241" class="body">Oude zakken, opgelapte wijnzakken,</text><text x="68" y="284" class="body">versleten kleding en beschimmeld brood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wat ontbreekt?</text><text x="68" y="433" class="body">Men bekijkt de proviand maar vraagt de</text><text x="68" y="476" class="body">HEERE niet om raad.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De eed</text><text x="68" y="625" class="body">Vrede en het in leven laten van de</text><text x="68" y="668" class="body">Gibeonieten.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Drie dagen later</text><text x="68" y="817" class="body">Hun nabijheid blijkt; Gibeon, Chefira,</text><text x="68" y="860" class="body">Beëroth en Kirjath-Jearim worden</text><text x="68" y="903" class="body">genoemd.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het gevolg</text><text x="68" y="1052" class="body">De eed blijft staan; zij worden</text><text x="68" y="1095" class="body">houthakkers en waterdragers voor</text><text x="68" y="1138" class="body">gemeenschap en altaar.</text><text x="46" y="1231" class="note">De verre herkomst is hun voorwendsel, niet de</text><text x="46" y="1267" class="note">conclusie van het verhaal.</text></svg>