<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De 31 koningen — deel 2</title><desc id="desc">De westelijke koningslijst in exacte tekstvolgorde, 17 tot 31.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De 31 koningen — deel 2</text><text x="44" y="113" class="ref">Jozua 12:9–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">17–20</text><text x="68" y="241" class="body">17. Tappuah · 18. Hefer · 19. Afek ·</text><text x="68" y="284" class="body">20. Lassaron</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">21–24</text><text x="68" y="433" class="body">21. Madon · 22. Hazor · 23.</text><text x="68" y="476" class="body">Simron-Meron · 24. Achsaf</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">25–28</text><text x="68" y="625" class="body">25. Taänach · 26. Megiddo · 27. Kedes ·</text><text x="68" y="668" class="body">28. Jokneam bij de Karmel</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">29–31</text><text x="68" y="817" class="body">29. Dor in Nafath-Dor · 30. De volken</text><text x="68" y="860" class="body">bij Gilgal · 31. Tirza</text><text x="46" y="953" class="note">De nummers maken alleen de volgorde van de lijst</text><text x="46" y="989" class="note">zichtbaar; de tekst noemt bij iedere koning één.</text></svg>