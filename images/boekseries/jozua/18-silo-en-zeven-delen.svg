<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Silo en de zeven delen</title><desc id="desc">De procedure van landbeschrijving tot loting in Silo.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Silo en de zeven delen</text><text x="44" y="113" class="ref">Jozua 18:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De ontmoetingsplaats</text><text x="68" y="241" class="body">De ontmoetingstent wordt in Silo</text><text x="68" y="284" class="body">opgericht.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De zeven stammen</text><text x="68" y="433" class="body">Hun erfdeel is nog niet verdeeld.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De verkenners</text><text x="68" y="582" class="body">Drie mannen per stam worden uitgezonden</text><text x="68" y="625" class="body">om het land te beschrijven.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De beschrijving</text><text x="68" y="774" class="body">Stad voor stad in een boek, verdeeld in</text><text x="68" y="817" class="body">zeven delen.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het lot</text><text x="68" y="966" class="body">Terug in Silo werpt Jozua het lot;</text><text x="68" y="1009" class="body">Benjamin krijgt het eerste deel.</text><text x="46" y="1102" class="note">Drie mannen per stam is de opdrachtformulering;</text><text x="46" y="1138" class="note">er wordt geen niet genoemd totaal aan mannen</text><text x="46" y="1174" class="note">toegevoegd.</text></svg>