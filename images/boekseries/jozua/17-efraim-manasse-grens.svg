<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Efraïm en Manasse naast elkaar</title><desc id="desc">De bijzondere grensverhoudingen en de vraag naar meer ruimte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Efraïm en Manasse naast elkaar</text><text x="44" y="113" class="ref">Jozua 17:7–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beek Kana</text><text x="68" y="241" class="body">Manasse ten noorden, Efraïm ten zuiden</text><text x="68" y="284" class="body">volgens de beschrijving.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tappuah</text><text x="68" y="433" class="body">Het land is van Manasse, de stad zelf</text><text x="68" y="476" class="body">van Efraïm.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verspreide steden</text><text x="68" y="625" class="body">Manasse heeft steden binnen Issaschar</text><text x="68" y="668" class="body">en Aser; inwoners blijven wonen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het bezwaar</text><text x="68" y="817" class="body">Het huis van Jozef vraagt meer ruimte</text><text x="68" y="860" class="body">en noemt ijzeren wagens in de vlakte.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Jozua’s antwoord</text><text x="68" y="1009" class="body">Ruimte in het beboste bergland maken en</text><text x="68" y="1052" class="body">de sterke tegenstanders verdrijven.</text><text x="46" y="1145" class="note">De ruimtelijke verhoudingen volgen de tekst; ze</text><text x="46" y="1181" class="note">vervangen geen volledige geografische kaart.</text></svg>