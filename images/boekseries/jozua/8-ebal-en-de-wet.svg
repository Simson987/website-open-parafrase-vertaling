<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Ebal en de woorden van de wet</title><desc id="desc">De altaarbouw, de schriftelijke en gesproken wet en de brede kring van hoorders.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ebal en de woorden van de wet</text><text x="44" y="113" class="ref">Jozua 8:30–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het altaar</text><text x="68" y="241" class="body">Onbehouwen stenen; niet met ijzer</text><text x="68" y="284" class="body">bewerkt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het afschrift</text><text x="68" y="433" class="body">Jozua schrijft de wet op de stenen in</text><text x="68" y="476" class="body">bijzijn van Israël.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De gemeenschap</text><text x="68" y="625" class="body">Aan weerszijden van de ark, richting</text><text x="68" y="668" class="body">Gerizim en Ebal.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De hoorders</text><text x="68" y="817" class="body">Mannen, vrouwen, kinderen en</text><text x="68" y="860" class="body">vreemdelingen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Wat wordt gelezen?</text><text x="68" y="1009" class="body">Alle woorden: zegen en vloek, zonder</text><text x="68" y="1052" class="body">iets over te slaan.</text><text x="46" y="1145" class="note">Dit hoofdstuk beschrijft uitvoering van de</text><text x="46" y="1181" class="note">eerdere opdracht in Deuteronomium 27.</text></svg>