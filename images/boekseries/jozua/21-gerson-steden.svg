<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">De dertien steden van Gerson</title><desc id="desc">De dertien steden voor Gerson in de vier genoemde stamgebieden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De dertien steden van Gerson</text><text x="44" y="113" class="ref">Jozua 21:27–33</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Half Manasse · twee</text><text x="68" y="241" class="body">Golan in Basan · Beesthera.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Issaschar · vier</text><text x="68" y="390" class="body">Kisjon · Dobrath · Jarmuth · En-Gannim.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Aser · vier</text><text x="68" y="539" class="body">Misal · Abdon · Helkath · Rehob.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Nafthali · drie</text><text x="68" y="688" class="body">Kedes in Galilea · Hammoth-Dor ·</text><text x="68" y="731" class="body">Karthan.</text><text x="46" y="824" class="note">Alle genoemde steden hebben weidegronden; Golan</text><text x="46" y="860" class="note">en Kedes zijn tevens vrijsteden.</text></svg>