<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Bekentenis en vondst</title><desc id="desc">De precieze voorwerpen, gewichten, plaatsing en bevestiging door de boden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bekentenis en vondst</text><text x="44" y="113" class="ref">Jozua 7:21–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De genoemde voorwerpen</text><text x="68" y="241" class="body">Een mantel uit Babylonië, ongeveer 2,2</text><text x="68" y="284" class="body">kilo zilver en circa 550 gram goud in</text><text x="68" y="327" class="body">een staaf.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De verstopplaats</text><text x="68" y="476" class="body">In de grond in de tent; het zilver lag</text><text x="68" y="519" class="body">eronder.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De controle</text><text x="68" y="668" class="body">Boden gaan naar de tent en vinden het</text><text x="68" y="711" class="body">zoals verteld.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De overdracht</text><text x="68" y="860" class="body">De voorwerpen komen voor Jozua en</text><text x="68" y="903" class="body">Israël te liggen.</text><text x="46" y="996" class="note">De gewichten volgen de omrekening van de</text><text x="46" y="1032" class="note">plaatselijke vertaling; geen muntstukken worden</text><text x="46" y="1068" class="note">toegevoegd.</text></svg>