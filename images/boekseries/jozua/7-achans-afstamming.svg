<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1032" viewBox="0 0 840 1032" role="img" aria-labelledby="title desc"><title id="title">De afstamming van Achan</title><desc id="desc">Juda, Zerah, Zabdi, Charmi en Achan in de gecontroleerde volgorde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1032" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De afstamming van Achan</text><text x="44" y="113" class="ref">Jozua 7:1 en 16–18</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Stam</text><text x="68" y="241" class="body">Juda</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Voorvader</text><text x="68" y="390" class="body">Zerah</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Zoon van Zerah</text><text x="68" y="539" class="body">Zabdi</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Zoon van Zabdi</text><text x="68" y="688" class="body">Charmi</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Zoon van Charmi</text><text x="68" y="837" class="body">Achan</text><text x="46" y="930" class="note">Van boven naar beneden: stam, voorvader en drie</text><text x="46" y="966" class="note">generaties. De namen volgen vers 1 en 18.</text></svg>