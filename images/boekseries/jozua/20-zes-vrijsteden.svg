<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1181" viewBox="0 0 840 1181" role="img" aria-labelledby="title desc"><title id="title">De zes vrijsteden</title><desc id="desc">De zes vrijsteden met de juiste stam en kant van de Jordaan.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1181" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De zes vrijsteden</text><text x="44" y="113" class="ref">Jozua 20:7–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">West · Nafthali</text><text x="68" y="241" class="body">Kedes in Galilea.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">West · Efraïm</text><text x="68" y="390" class="body">Sichem in het bergland.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">West · Juda</text><text x="68" y="539" class="body">Kirjath-Arba, dat is Hebron.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Oost · Ruben</text><text x="68" y="688" class="body">Bezer op de woestijnhoogvlakte.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Oost · Gad</text><text x="68" y="837" class="body">Ramoth in Gilead.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Oost · Manasse</text><text x="68" y="986" class="body">Golan in Basan.</text><text x="46" y="1079" class="note">Drie aan iedere kant van de Jordaan; ook</text><text x="46" y="1115" class="note">inwonende vreemdelingen hebben toegang.</text></svg>