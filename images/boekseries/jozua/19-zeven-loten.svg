<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1075" viewBox="0 0 840 1075" role="img" aria-labelledby="title desc"><title id="title">De zeven loten op volgorde</title><desc id="desc">De exacte volgorde van de zeven stammen en de daaropvolgende gave aan Jozua.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1075" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De zeven loten op volgorde</text><text x="44" y="113" class="ref">Jozua 18:11 en 19:1–48</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste lot</text><text x="68" y="241" class="body">Benjamin — Jozua 18:11.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tweede en derde lot</text><text x="68" y="390" class="body">Simeon binnen Juda; daarna Zebulon.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Vierde en vijfde lot</text><text x="68" y="539" class="body">Issaschar; daarna Aser.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Zesde en zevende lot</text><text x="68" y="688" class="body">Nafthali; daarna Dan.</text><rect x="42" y="746" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Na de loten</text><text x="68" y="837" class="body">Jozua krijgt Timnath-Serah, op zijn</text><text x="68" y="880" class="body">verzoek, in het bergland van Efraïm.</text><text x="46" y="973" class="note">Het eerste lot staat in het vorige hoofdstuk; de</text><text x="46" y="1009" class="note">andere zes worden hier voortgezet.</text></svg>