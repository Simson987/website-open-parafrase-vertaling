<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De verdere veldtocht</title><desc id="desc">De opeenvolgende steden en de afzonderlijke rol van Horam uit Gezer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De verdere veldtocht</text><text x="44" y="113" class="ref">Jozua 10:28–43</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Makkeda → Libna</text><text x="68" y="241" class="body">Na de gebeurtenissen bij Gibeon volgen</text><text x="68" y="284" class="body">deze twee steden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Lachis</text><text x="68" y="433" class="body">Op de tweede dag ingenomen; Horam van</text><text x="68" y="476" class="body">Gezer komt te hulp en wordt verslagen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Eglon → Hebron → Debir</text><text x="68" y="625" class="body">Het verdere verloop zoals het hoofdstuk</text><text x="68" y="668" class="body">het opsomt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Terugkeer</text><text x="68" y="817" class="body">Jozua en Israël keren naar het kamp in</text><text x="68" y="860" class="body">Gilgal terug.</text><text x="46" y="953" class="note">Een tekstuele routevolgorde zonder verzonnen</text><text x="46" y="989" class="note">coördinaten, afstanden of precieze dagduur van</text><text x="46" y="1025" class="note">de hele tocht.</text></svg>