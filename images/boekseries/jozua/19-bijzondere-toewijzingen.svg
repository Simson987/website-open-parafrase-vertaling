<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Bijzondere toewijzingen</title><desc id="desc">De uitzonderingen en afsluiting van de verdeling zonder gefingeerde grenzen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bijzondere toewijzingen</text><text x="44" y="113" class="ref">Jozua 19:1–51</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Simeon</text><text x="68" y="241" class="body">Midden in Juda, omdat Juda’s toegewezen</text><text x="68" y="284" class="body">gebied te groot was.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zebulon en Issaschar</text><text x="68" y="433" class="body">Eigen grenzen en stedengroepen worden</text><text x="68" y="476" class="body">afzonderlijk beschreven.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Aser en Nafthali</text><text x="68" y="625" class="body">Eigen noordelijke grens- en</text><text x="68" y="668" class="body">stedennamen; ook zee en Jordaan spelen</text><text x="68" y="711" class="body">een rol.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Dan</text><text x="68" y="860" class="body">De stam neemt Lesem in en noemt de stad</text><text x="68" y="903" class="body">voortaan Dan.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Jozua en de voltooiing</text><text x="68" y="1052" class="body">Timnath-Serah wordt opgebouwd; in Silo</text><text x="68" y="1095" class="body">bij de tent is de verdeling voltooid.</text><text x="46" y="1188" class="note">Lesem → Dan is een naamsverandering; Timnath-</text><text x="46" y="1224" class="note">Serah wordt aan Jozua gegeven na de</text><text x="46" y="1260" class="note">stamverdeling.</text></svg>