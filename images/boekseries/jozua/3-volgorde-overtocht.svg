<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De volgorde bij de overtocht</title><desc id="desc">De volgorde, de afstand en het verschil tussen de verre waterwal en de oversteekplaats.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De volgorde bij de overtocht</text><text x="44" y="113" class="ref">Jozua 3:3–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Volgen met afstand</text><text x="68" y="241" class="body">De ark volgen op ongeveer 900 meter</text><text x="68" y="284" class="body">afstand volgens deze vertaling.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het begin</text><text x="68" y="433" class="body">De voeten van de priesters raken het</text><text x="68" y="476" class="body">water bij de volle oevers.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Stroomopwaarts</text><text x="68" y="625" class="body">Het water staat heel ver weg stil bij</text><text x="68" y="668" class="body">Adam, naast Sarthan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De doorgang</text><text x="68" y="817" class="body">Tegenover Jericho trekt Israël over</text><text x="68" y="860" class="body">droge grond.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De priesters</text><text x="68" y="1009" class="body">Blijven midden in de Jordaan staan tot</text><text x="68" y="1052" class="body">iedereen over is.</text><text x="46" y="1145" class="note">De waterwal bij Adam wordt niet als twee</text><text x="46" y="1181" class="note">zeemuren naast de wandelaars voorgesteld.</text></svg>