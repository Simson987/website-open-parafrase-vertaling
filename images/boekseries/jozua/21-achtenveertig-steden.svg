<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Samen achtenveertig steden</title><desc id="desc">De vier toewijzingsgroepen en hun controleerbare optelling tot 48 steden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Samen achtenveertig steden</text><text x="44" y="113" class="ref">Jozua 21:4–8 en 41–42</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aärons nakomelingen</text><text x="68" y="241" class="body">Kahathieten: 13 steden uit Juda, Simeon</text><text x="68" y="284" class="body">en Benjamin.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Overige Kahathieten</text><text x="68" y="433" class="body">10 steden uit Efraïm, Dan en half</text><text x="68" y="476" class="body">Manasse.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gersonieten</text><text x="68" y="625" class="body">13 steden uit Issaschar, Aser, Nafthali</text><text x="68" y="668" class="body">en half Manasse in Basan.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Merarieten</text><text x="68" y="817" class="body">12 steden uit Ruben, Gad en Zebulon.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Totaal</text><text x="68" y="966" class="body">13 + 10 + 13 + 12 = 48; iedere stad</text><text x="68" y="1009" class="body">heeft weidegronden.</text><text x="46" y="1102" class="note">Aärons nakomelingen zijn onderdeel van Kahath,</text><text x="46" y="1138" class="note">niet een vierde zoon van Levi.</text></svg>