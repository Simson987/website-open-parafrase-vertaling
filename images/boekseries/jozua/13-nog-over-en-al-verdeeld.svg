<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Nog over en al verdeeld</title><desc id="desc">Het verschil tussen overblijvend land, opdracht tot verdeling en eerder toegewezen erfdelen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nog over en al verdeeld</text><text x="44" y="113" class="ref">Jozua 13:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nog te verwerven</text><text x="68" y="241" class="body">Filistijns gebied, Gesuri, gebieden bij</text><text x="68" y="284" class="body">Sidon, Libanon en de ingang van Hamath.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De opdracht nu</text><text x="68" y="433" class="body">Alvast verdelen onder negen stammen en</text><text x="68" y="476" class="body">de halve stam Manasse.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Al eerder toegewezen</text><text x="68" y="625" class="body">Ruben, Gad en de andere helft van</text><text x="68" y="668" class="body">Manasse ten oosten van de Jordaan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Niet geheel verdreven</text><text x="68" y="817" class="body">Gesurieten en Maächathieten wonen nog</text><text x="68" y="860" class="body">onder Israël.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Levi</text><text x="68" y="1009" class="body">Geen stamgebied: de HEERE en de offers</text><text x="68" y="1052" class="body">worden als hun erfdeel genoemd.</text><text x="46" y="1145" class="note">Een toewijzing en feitelijke beheersing zijn in</text><text x="46" y="1181" class="note">deze tekst niet automatisch hetzelfde.</text></svg>