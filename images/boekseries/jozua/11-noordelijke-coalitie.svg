<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">De noordelijke coalitie</title><desc id="desc">De coalitie, het verloop en het onderscheid tussen Hazor en andere heuvelsteden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De noordelijke coalitie</text><text x="44" y="113" class="ref">Jozua 11:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oproep</text><text x="68" y="241" class="body">Jabin van Hazor roept Jobab van Madon</text><text x="68" y="284" class="body">en de koningen van Simron en Achsaf,</text><text x="68" y="327" class="body">met andere gebieden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De verzamelplaats</text><text x="68" y="476" class="body">Het water van Merom; veel mensen,</text><text x="68" y="519" class="body">paarden en wagens.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De overval</text><text x="68" y="668" class="body">Jozua valt onverwacht aan;</text><text x="68" y="711" class="body">achtervolging tot Sidon, Misrefoth-Maim</text><text x="68" y="754" class="body">en het dal van Mizpa.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De steden</text><text x="68" y="903" class="body">Hazor wordt verbrand; de andere</text><text x="68" y="946" class="body">genoemde heuvelsteden niet.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De duur en de afsluiting</text><text x="68" y="1095" class="body">Lange tijd oorlog; daarna verdeling van</text><text x="68" y="1138" class="body">het land en rust.</text><text x="46" y="1231" class="note">Het hoofdstuk noemt zowel een snelle overval als</text><text x="46" y="1267" class="note">een lange oorlogstijd; die duren worden niet</text><text x="46" y="1303" class="note">gelijkgesteld.</text></svg>