<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">De oostelijke toewijzing</title><desc id="desc">De drie oostelijke toewijzingen met onderscheid van het erfdeel van Levi.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De oostelijke toewijzing</text><text x="44" y="113" class="ref">Jozua 13:15–33</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben · vers 15–23</text><text x="68" y="241" class="body">Aroër, de hoogvlakte bij Medeba en</text><text x="68" y="284" class="body">steden van het vroegere gebied van</text><text x="68" y="327" class="body">Sihon; de Jordaan als grens.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gad · vers 24–28</text><text x="68" y="476" class="body">Jaëzer, steden van Gilead en het dal;</text><text x="68" y="519" class="body">tot het einde van het meer Kinnereth</text><text x="68" y="562" class="body">aan de oostzijde.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Half Manasse · vers 29–31</text><text x="68" y="711" class="body">Basan, het rijk van Og, zestig dorpen</text><text x="68" y="754" class="body">van Jaïr en de genoemde helft van</text><text x="68" y="797" class="body">Gilead.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Machirs nakomelingen</text><text x="68" y="946" class="body">Astharoth en Edreï bij de genoemde</text><text x="68" y="989" class="body">helft van zijn nakomelingen.</text><rect x="42" y="1047" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Levi · vers 33</text><text x="68" y="1138" class="body">De HEERE zelf als erfdeel.</text><text x="46" y="1231" class="note">Dit zijn samenvattende tekstankers, geen</text><text x="46" y="1267" class="note">ingetekende moderne grenzen.</text></svg>