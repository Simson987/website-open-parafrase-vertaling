<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">De dertien steden voor Aäron</title><desc id="desc">Alle dertien steden en het onderscheid tussen Hebron en Kalebs omliggende bezit.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De dertien steden voor Aäron</text><text x="44" y="113" class="ref">Jozua 21:9–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uit Juda en Simeon · negen</text><text x="68" y="241" class="body">Hebron · Libna · Jatthir · Esthemoa ·</text><text x="68" y="284" class="body">Holon · Debir · Ain · Jutta ·</text><text x="68" y="327" class="body">Beth-Semes.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Uit Benjamin · vier</text><text x="68" y="476" class="body">Gibeon · Geba · Anathoth · Almon.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij Hebron</text><text x="68" y="625" class="body">De stad en weidegronden voor de</text><text x="68" y="668" class="body">priesters; het omliggende land en</text><text x="68" y="711" class="body">dorpen voor Kaleb.</text><text x="46" y="804" class="note">De tekst behandelt Juda en Simeon samen; de</text><text x="46" y="840" class="note">negen steden worden hier niet alsnog over die</text><text x="46" y="876" class="note">twee verdeeld.</text></svg>