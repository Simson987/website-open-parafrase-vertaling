<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Jozef en het deel van Efraïm</title><desc id="desc">Het verband tussen Jozefs twee stammen, Efraïms grens en steden binnen Manasse.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jozef en het deel van Efraïm</text><text x="44" y="113" class="ref">Jozua 16:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jozef</text><text x="68" y="241" class="body">Manasse en Efraïm ontvangen hun</text><text x="68" y="284" class="body">erfdeel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De gemeenschappelijke aanzet</text><text x="68" y="433" class="body">Jordaan bij Jericho, omhoog naar Bethel</text><text x="68" y="476" class="body">en verder richting Gezer en zee.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het deel van Efraïm</text><text x="68" y="625" class="body">Eigen grensverloop met onder meer</text><text x="68" y="668" class="body">Beth-Horon, Janoah, de Jordaan, Tappuah</text><text x="68" y="711" class="body">en de beek Kana.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Steden binnen Manasse</text><text x="68" y="860" class="body">Enkele steden met dorpen zijn apart</text><text x="68" y="903" class="body">voor Efraïm.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Gezer</text><text x="68" y="1052" class="body">De Kanaänieten blijven wonen en worden</text><text x="68" y="1095" class="body">tot dwangarbeid verplicht.</text><text x="46" y="1188" class="note">De tekst noemt zowel grensverloop als ingesloten</text><text x="46" y="1224" class="note">steden; geen vereenvoudigde gesloten kaartvorm.</text></svg>