<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Benjamin: twee stedengroepen</title><desc id="desc">Alle 26 genoemde steden in twee groepen en de ligging van Benjamin.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Benjamin: twee stedengroepen</text><text x="44" y="113" class="ref">Jozua 18:11–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De ligging</text><text x="68" y="241" class="body">Tussen Juda en het huis van Jozef; de</text><text x="68" y="284" class="body">Jordaan is de oostgrens.</text><rect x="42" y="342" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste twaalf · vers 21–24</text><text x="68" y="433" class="body">Jericho · Beth-Hogla · Emek-Keziz ·</text><text x="68" y="476" class="body">Beth-Araba · Zemaraïm · Bethel ·</text><text x="68" y="519" class="body">Haävvim · Para · Ofra ·</text><text x="68" y="562" class="body">Chefar-Haämmonai · Ofni · Gaba.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Volgende veertien · vers 25–28</text><text x="68" y="711" class="body">Gibeon · Rama · Beëroth · Mizpe ·</text><text x="68" y="754" class="body">Chefira · Moza · Rekem · Jirpeël ·</text><text x="68" y="797" class="body">Tharala · Zela · Elef · Jebusi</text><text x="68" y="840" class="body">(Jeruzalem) · Gibath · Kirjath.</text><text x="46" y="933" class="note">De twee groepen en aliassen volgen de verzen;</text><text x="46" y="969" class="note">Jeruzalem wordt als alias niet dubbel geteld.</text></svg>