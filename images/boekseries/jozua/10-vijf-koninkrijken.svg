<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1260" viewBox="0 0 840 1260" role="img" aria-labelledby="title desc"><title id="title">De vijf aanvallende koningen</title><desc id="desc">De vijf steden met hun koningen, zonder koning Debir te verwarren met de latere stad.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1260" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vijf aanvallende koningen</text><text x="44" y="113" class="ref">Jozua 10:3–6</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jeruzalem</text><text x="68" y="241" class="body">Adoni-Zedek</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Hebron</text><text x="68" y="390" class="body">Hoham</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Jarmuth</text><text x="68" y="539" class="body">Piram</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Lachis</text><text x="68" y="688" class="body">Jafia</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Eglon</text><text x="68" y="837" class="body">Debir</text><rect x="42" y="895" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Hun gezamenlijke doel</text><text x="68" y="986" class="body">Gibeon aanvallen wegens het verbond;</text><text x="68" y="1029" class="body">Gibeon vraagt Jozua om hulp.</text><text x="46" y="1122" class="note">Debir is hier de naam van de koning van Eglon;</text><text x="46" y="1158" class="note">de stad Debir verschijnt later in hetzelfde</text><text x="46" y="1194" class="note">hoofdstuk.</text></svg>