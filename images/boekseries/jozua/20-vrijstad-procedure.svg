<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De weg door de vrijstad</title><desc id="desc">De opeenvolging van opvang, onderzoek, verblijf en toegestane terugkeer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De weg door de vrijstad</text><text x="44" y="113" class="ref">Jozua 20:3–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zonder opzet</text><text x="68" y="241" class="body">Het beschreven geval betreft doden</text><text x="68" y="284" class="body">zonder opzet of eerdere haat.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij de poort</text><text x="68" y="433" class="body">De vluchteling vertelt de oudsten wat</text><text x="68" y="476" class="body">er is gebeurd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Opvang en bescherming</text><text x="68" y="625" class="body">De stad geeft woonruimte; niet aan de</text><text x="68" y="668" class="body">bloedwreker uitleveren.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Rechtspraak en verblijf</text><text x="68" y="817" class="body">Terechtstaan voor de gemeenschap;</text><text x="68" y="860" class="body">verblijf tot de dood van de</text><text x="68" y="903" class="body">hogepriester.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Daarna</text><text x="68" y="1052" class="body">Terugkeer naar eigen stad en eigen huis</text><text x="68" y="1095" class="body">is toegestaan.</text><text x="46" y="1188" class="note">Opvang is niet hetzelfde als het overslaan van</text><text x="46" y="1224" class="note">rechtspraak; de voorwaarden worden apart</text><text x="46" y="1260" class="note">vermeld.</text></svg>