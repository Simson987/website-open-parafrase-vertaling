<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Grensankers van Juda</title><desc id="desc">De vier grenszijden van Juda en enkele gecontroleerde herkenningspunten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Grensankers van Juda</text><text x="44" y="113" class="ref">Jozua 15:2–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zuid</text><text x="68" y="241" class="body">Zuidpunt van de Zoutzee, langs onder</text><text x="68" y="284" class="body">meer Kades-Barnea, tot de beek van</text><text x="68" y="327" class="body">Egypte en de zee.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Oost</text><text x="68" y="476" class="body">De Zoutzee tot aan de monding van de</text><text x="68" y="519" class="body">Jordaan.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Noord</text><text x="68" y="668" class="body">Vanaf de Jordaanmonding langs onder</text><text x="68" y="711" class="body">meer En-Rogel, de zuidkant van</text><text x="68" y="754" class="body">Jeruzalem en Kirjath-Jearim.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Verder naar het westen</text><text x="68" y="903" class="body">Via onder meer Beth-Semes, Timna en</text><text x="68" y="946" class="body">Jabneël naar de zee.</text><rect x="42" y="1004" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">West</text><text x="68" y="1095" class="body">De Grote Zee met de kust.</text><text x="46" y="1188" class="note">Geselecteerde tekstankers; tussenpunten staan in</text><text x="46" y="1224" class="note">de verzen. Geen schaal of moderne grenslijn.</text></svg>