<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Kaleb, Othniël en Achsa</title><desc id="desc">De personen, onderlinge relaties en het verzoek met de dubbele bronnengave.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kaleb, Othniël en Achsa</text><text x="44" y="113" class="ref">Jozua 15:13–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kaleb</text><text x="68" y="241" class="body">Krijgt Hebron; verdrijft Sesai, Ahiman</text><text x="68" y="284" class="body">en Talmai.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Debir</text><text x="68" y="433" class="body">De vroegere naam is Kirjath-Sefer.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Othniël</text><text x="68" y="582" class="body">Zoon van Kenaz, die als broer van Kaleb</text><text x="68" y="625" class="body">wordt genoemd; hij neemt de stad in.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Achsa</text><text x="68" y="774" class="body">Dochter van Kaleb, trouwt met Othniël</text><text x="68" y="817" class="body">en vraagt waterbronnen.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De gave</text><text x="68" y="966" class="body">Kaleb geeft de bovenste én de onderste</text><text x="68" y="1009" class="body">bronnen.</text><text x="46" y="1102" class="note">Relaties en plaatsnamen volgen dit hoofdstuk; de</text><text x="46" y="1138" class="note">twee soorten bronnen blijven afzonderlijk.</text></svg>