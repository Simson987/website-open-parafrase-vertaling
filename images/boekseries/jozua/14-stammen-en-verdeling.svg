<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Stammen en de verdeling</title><desc id="desc">De verhoudingen van de landverdeling en de bijzondere plaats van Jozef en Levi.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stammen en de verdeling</text><text x="44" y="113" class="ref">Jozua 14:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De verdelers</text><text x="68" y="241" class="body">Priester Eleazar, Jozua en de</text><text x="68" y="284" class="body">familiehoofden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">In Kanaän</text><text x="68" y="433" class="body">Negen stammen en een halve stam via het</text><text x="68" y="476" class="body">lot.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ten oosten</text><text x="68" y="625" class="body">Twee stammen en een halve stam hadden</text><text x="68" y="668" class="body">hun erfdeel al.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Jozef telt als twee</text><text x="68" y="817" class="body">Efraïm en Manasse vormen twee stammen.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Levi</text><text x="68" y="966" class="body">Geen stamgebied, wel woonsteden met</text><text x="68" y="1009" class="body">weidegrond.</text><text x="46" y="1102" class="note">De twee helften van Manasse horen bij dezelfde</text><text x="46" y="1138" class="note">stam; Levi krijgt wel woonplaatsen.</text></svg>