<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Zes dagen en de zevende dag</title><desc id="desc">Het aantal dagen en ronden en de volgorde van de stoet bij Jericho.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes dagen en de zevende dag</text><text x="44" y="113" class="ref">Jozua 6:3–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dag 1 tot en met 6</text><text x="68" y="241" class="body">Iedere dag één ronde; daarna terug naar</text><text x="68" y="284" class="body">het kamp.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De zevende dag</text><text x="68" y="433" class="body">Zeven ronden, vroeg in de morgen</text><text x="68" y="476" class="body">begonnen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De priesterlijke groep</text><text x="68" y="625" class="body">Zeven priesters met zeven ramshoorns</text><text x="68" y="668" class="body">voor de ark.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De orde van de stoet</text><text x="68" y="817" class="body">Gewapende mannen, hoornblazers, ark en</text><text x="68" y="860" class="body">achterhoede.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het afgesproken moment</text><text x="68" y="1009" class="body">Geen menselijk gejuich tot Jozua het</text><text x="68" y="1052" class="body">beveelt; dan juichen en het instorten</text><text x="68" y="1095" class="body">van de muur.</text><text x="46" y="1188" class="note">De hoorns klinken tijdens de rondgang; het bevel</text><text x="46" y="1224" class="note">tot zwijgen betreft de stemmen van het volk.</text></svg>