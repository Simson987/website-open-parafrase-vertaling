<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">De hinderlaag bij Ai</title><desc id="desc">De posities en de beschreven fasen bij Ai, met behoud van beide genoemde aantallen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De hinderlaag bij Ai</text><text x="44" y="113" class="ref">Jozua 8:3–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste opdracht</text><text x="68" y="241" class="body">30.000 mannen worden ’s nachts</text><text x="68" y="284" class="body">uitgezonden voor de hinderlaag achter</text><text x="68" y="327" class="body">de stad.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De opstelling</text><text x="68" y="476" class="body">Het hoofdleger ten noorden van Ai, met</text><text x="68" y="519" class="body">een dal ertussen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De westelijke positie</text><text x="68" y="668" class="body">Vers 12 noemt ongeveer 5.000 mannen</text><text x="68" y="711" class="body">tussen Bethel en Ai, ten westen van de</text><text x="68" y="754" class="body">stad.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De schijnvlucht</text><text x="68" y="903" class="body">Jozua lokt de verdedigers uit de stad</text><text x="68" y="946" class="body">richting de woestijn.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Het teken en de omkeer</text><text x="68" y="1095" class="body">De uitgestoken speer is het teken; de</text><text x="68" y="1138" class="body">hinderlaag neemt de open stad in.</text><text x="46" y="1231" class="note">De twee aantallen worden beide met hun eigen</text><text x="46" y="1267" class="note">vers vermeld; ze worden niet zonder toelichting</text><text x="46" y="1303" class="note">opgeteld.</text></svg>