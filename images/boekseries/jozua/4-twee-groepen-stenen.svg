<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Twee groepen van twaalf stenen</title><desc id="desc">Het verschil tussen de stenen in Gilgal en de stenen midden in de Jordaan.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee groepen van twaalf stenen</text><text x="44" y="113" class="ref">Jozua 4:3–9 en 19–24</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twaalf mannen</text><text x="68" y="241" class="body">Uit elke stam één man.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Stenen uit de bedding</text><text x="68" y="390" class="body">Ieder neemt één steen mee vanaf de plek</text><text x="68" y="433" class="body">van de priesters.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">In Gilgal</text><text x="68" y="582" class="body">Jozua richt deze twaalf meegenomen</text><text x="68" y="625" class="body">stenen op als herinnering.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Ook in de Jordaan</text><text x="68" y="774" class="body">Vers 9 noemt daarnaast twaalf stenen</text><text x="68" y="817" class="body">die Jozua midden in de rivier opricht.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De latere vraag</text><text x="68" y="966" class="body">Kinderen vragen naar de betekenis:</text><text x="68" y="1009" class="body">Israël ging op droge grond door de</text><text x="68" y="1052" class="body">Jordaan.</text><text x="46" y="1145" class="note">De twee vermeldingen van twaalf worden niet tot</text><text x="46" y="1181" class="note">één locatie samengevoegd.</text></svg>