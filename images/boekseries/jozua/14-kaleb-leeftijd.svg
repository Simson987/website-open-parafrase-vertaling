<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Kaleb: veertig naar vijfentachtig</title><desc id="desc">De controleerbare tijdlijn van Kalebs verkenning tot de toewijzing van Hebron.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kaleb: veertig naar vijfentachtig</text><text x="44" y="113" class="ref">Jozua 14:7–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">40 jaar</text><text x="68" y="241" class="body">Toen Mozes hem vanuit Kades-Barnea als</text><text x="68" y="284" class="body">verkenner uitstuurde.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">45 jaren later</text><text x="68" y="433" class="body">De genoemde tijd sinds de belofte.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">85 jaar</text><text x="68" y="582" class="body">Kalebs leeftijd bij het verzoek om het</text><text x="68" y="625" class="body">bergland.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De uitkomst</text><text x="68" y="774" class="body">Jozua zegent hem en geeft Hebron als</text><text x="68" y="817" class="body">erfdeel.</text><text x="46" y="910" class="note">40 + 45 = 85. De tekst spreekt over zijn kracht</text><text x="46" y="946" class="note">zonder een nieuwe leeftijd te verzinnen.</text></svg>