<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De afscheidswoorden van Jozua</title><desc id="desc">De opbouw van terugblik, oproep en waarschuwing, met herkenning van beeldspraak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De afscheidswoorden van Jozua</text><text x="44" y="113" class="ref">Jozua 23:3–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Terugblik</text><text x="68" y="241" class="body">De HEERE heeft gestreden en de goede</text><text x="68" y="284" class="body">beloften gehouden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wat nog volgt</text><text x="68" y="433" class="body">Overblijvende volken worden nog genoemd</text><text x="68" y="476" class="body">naast het toegewezen erfdeel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De oproep</text><text x="68" y="625" class="body">De wet nauwkeurig doen; liefhebben en</text><text x="68" y="668" class="body">zich aan de HEERE vasthouden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De waarschuwing</text><text x="68" y="817" class="body">Afval en het dienen van andere goden</text><text x="68" y="860" class="body">brengen verlies van het goede land.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De beelden</text><text x="68" y="1009" class="body">Valstrik, net, zweep en doorns</text><text x="68" y="1052" class="body">verwoorden de aangekondigde gevolgen.</text><text x="46" y="1145" class="note">De waarschuwing staat naast de herinnering aan</text><text x="46" y="1181" class="note">vervulde beloften; beide horen bij Jozua’s</text><text x="46" y="1217" class="note">toespraak.</text></svg>