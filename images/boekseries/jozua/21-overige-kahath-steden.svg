<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">De overige Kahathieten</title><desc id="desc">De tien toewijzingen aan de overige Kahathieten, gegroepeerd naar stam.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De overige Kahathieten</text><text x="44" y="113" class="ref">Jozua 21:20–26</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Efraïm · vier</text><text x="68" y="241" class="body">Sichem · Gezer · Kibzaïm · Beth-Horon.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Dan · vier</text><text x="68" y="390" class="body">Elteke · Gibbethon · Ajalon ·</text><text x="68" y="433" class="body">Gath-Rimmon.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Half Manasse · twee</text><text x="68" y="582" class="body">Taänach · Gath-Rimmon.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Samen</text><text x="68" y="731" class="body">Tien steden met hun weidegronden.</text><text x="46" y="824" class="note">Gath-Rimmon staat in de plaatselijke tekst zowel</text><text x="46" y="860" class="note">bij Dan als bij half Manasse; beide vermeldingen</text><text x="46" y="896" class="note">blijven behouden.</text></svg>