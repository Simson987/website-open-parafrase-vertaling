<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Zelafead en zijn vijf dochters</title><desc id="desc">De afstammingslijn, alle vijf namen en de toekenning van het erfdeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zelafead en zijn vijf dochters</text><text x="44" y="113" class="ref">Jozua 17:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De lijn naar Zelafead</text><text x="68" y="241" class="body">Manasse → Machir → Gilead → Hefer →</text><text x="68" y="284" class="body">Zelafead.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn kinderen</text><text x="68" y="433" class="body">Geen zonen; Machla, Noa, Hogla, Milka</text><text x="68" y="476" class="body">en Tirza.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het verzoek</text><text x="68" y="625" class="body">Voor Eleazar, Jozua en de leiders</text><text x="68" y="668" class="body">verwijzen zij naar het bevel aan Mozes.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De uitkomst</text><text x="68" y="817" class="body">Een erfdeel tussen de broers van hun</text><text x="68" y="860" class="body">vader.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Tien delen</text><text x="68" y="1009" class="body">De tekst noemt tien delen voor Manasse</text><text x="68" y="1052" class="body">naast Gilead en Basan in het oosten.</text><text x="46" y="1145" class="note">De naamvolgorde van de dochters volgt vers 3;</text><text x="46" y="1181" class="note">aantallen gebieden zijn geen aantallen kinderen.</text></svg>