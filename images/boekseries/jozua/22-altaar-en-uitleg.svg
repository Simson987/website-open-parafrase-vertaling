<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Het altaar en de uitleg</title><desc id="desc">De aanleiding, het gesprek en de vreedzame oplossing van het altaarmisverstand.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het altaar en de uitleg</text><text x="44" y="113" class="ref">Jozua 22:10–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat men ziet en hoort</text><text x="68" y="241" class="body">Een groot altaar bij de Jordaan; vrees</text><text x="68" y="284" class="body">voor ontrouw en een tweede offerplaats.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerst een afvaardiging</text><text x="68" y="433" class="body">Pinehas en tien leiders gaan luisteren.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Wat de bouwers bedoelen</text><text x="68" y="582" class="body">Een getuige voor latere generaties dat</text><text x="68" y="625" class="body">beide kanten bij de HEERE horen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Wat het niet dient</text><text x="68" y="774" class="body">Geen eigen plaats voor brandoffers,</text><text x="68" y="817" class="body">graanoffers of dankoffers.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De uitkomst</text><text x="68" y="966" class="body">Pinehas brengt verslag; Israël ziet af</text><text x="68" y="1009" class="body">van oorlog en looft God.</text><text x="46" y="1102" class="note">Het vermoeden van de toehoorders wordt van de</text><text x="46" y="1138" class="note">door de bouwers gegeven bedoeling onderscheiden.</text></svg>