<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Drie slotvermeldingen</title><desc id="desc">De drie afzonderlijke begrafenisvermeldingen met gecontroleerde leeftijden en familierelaties.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie slotvermeldingen</text><text x="44" y="113" class="ref">Jozua 24:29–33</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jozua</text><text x="68" y="241" class="body">Sterft op 110-jarige leeftijd; begraven</text><text x="68" y="284" class="body">in zijn eigen Timnath-Serah, ten</text><text x="68" y="327" class="body">noorden van de berg Gaäs.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jozefs beenderen</text><text x="68" y="476" class="body">Uit Egypte meegenomen, nu begraven in</text><text x="68" y="519" class="body">Sichem op het eerder door Jakob</text><text x="68" y="562" class="body">gekochte land.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Eleazar</text><text x="68" y="711" class="body">Zoon van Aäron; begraven op de heuvel</text><text x="68" y="754" class="body">van zijn zoon Pinehas in Efraïm.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De tussenliggende getuigenis</text><text x="68" y="903" class="body">Israël dient de HEERE in de dagen van</text><text x="68" y="946" class="body">Jozua en de oudsten die hem overleven.</text><text x="46" y="1039" class="note">Dit zijn drie verschillende personen en</text><text x="46" y="1075" class="note">plaatsen; er wordt geen gezamenlijk graf</text><text x="46" y="1111" class="note">getekend.</text></svg>