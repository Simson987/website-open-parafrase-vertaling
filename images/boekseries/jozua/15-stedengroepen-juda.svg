<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">De stedengroepen van Juda</title><desc id="desc">De regio’s en de door het hoofdstuk zelf gegeven stedentotalen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De stedengroepen van Juda</text><text x="44" y="113" class="ref">Jozua 15:20–63</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het zuiden · vers 21–32</text><text x="68" y="241" class="body">Een lange naamlijst; de tekst sluit af</text><text x="68" y="284" class="body">met 29 steden met hun dorpen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het laagland · vers 33–44</text><text x="68" y="433" class="body">Drie groepen met in de tekst 14, 16 en</text><text x="68" y="476" class="body">9 steden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De kust · vers 45–47</text><text x="68" y="625" class="body">Ekron, Asdod en Gaza met omliggende</text><text x="68" y="668" class="body">plaatsen tot aan de beek en zee.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het bergland · vers 48–60</text><text x="68" y="817" class="body">Achtereenvolgens groepen van 11, 9, 10,</text><text x="68" y="860" class="body">6 en 2 steden.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De woestijn · vers 61–62</text><text x="68" y="1009" class="body">Zes steden, waaronder de Zoutstad en</text><text x="68" y="1052" class="body">Engedi.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Jeruzalem · vers 63</text><text x="68" y="1201" class="body">De Jebusieten worden niet verdreven en</text><text x="68" y="1244" class="body">blijven er wonen.</text><text x="46" y="1337" class="note">Aantallen zijn de afsluitende aantallen van de</text><text x="46" y="1373" class="note">tekst, niet een nieuwe telling van aliassen of</text><text x="46" y="1409" class="note">naamvormen.</text></svg>