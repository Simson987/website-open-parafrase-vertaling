<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De eerste dagen in Gilgal</title><desc id="desc">De opeenvolging van herstel, pascha, landopbrengst, het einde van manna en de ontmoeting.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eerste dagen in Gilgal</text><text x="44" y="113" class="ref">Jozua 5:8–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Na de besnijdenis</text><text x="68" y="241" class="body">In het kamp blijven totdat de mannen</text><text x="68" y="284" class="body">genezen zijn.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Veertiende dag, avond</text><text x="68" y="433" class="body">Het pascha vieren in de vlakte van</text><text x="68" y="476" class="body">Jericho.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De dag na het pascha</text><text x="68" y="625" class="body">Ongezuurde broden en geroosterd koren</text><text x="68" y="668" class="body">uit het land eten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De volgende dag</text><text x="68" y="817" class="body">Het manna houdt op; men eet voortaan</text><text x="68" y="860" class="body">van het land.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De ontmoeting bij Jericho</text><text x="68" y="1009" class="body">Jozua ontmoet de aanvoerder en trekt op</text><text x="68" y="1052" class="body">zijn bevel de sandalen uit.</text><text x="46" y="1145" class="note">De lichamelijke ingreep wordt niet afgebeeld; de</text><text x="46" y="1181" class="note">beschreven dagvolgorde blijft intact.</text></svg>