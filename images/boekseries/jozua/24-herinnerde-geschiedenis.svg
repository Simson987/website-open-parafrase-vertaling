<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De herinnerde geschiedenis</title><desc id="desc">De chronologische hoofdlijn van de historische terugblik in Jozua 24.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De herinnerde geschiedenis</text><text x="44" y="113" class="ref">Jozua 24:2–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De voorouders</text><text x="68" y="241" class="body">Terah, Abraham en Nahor; Abraham wordt</text><text x="68" y="284" class="body">geroepen en krijgt Izak.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Izak en zijn zonen</text><text x="68" y="433" class="body">Jakob en Ezau; Ezau krijgt Seïr, Jakob</text><text x="68" y="476" class="body">en zijn zonen gaan naar Egypte.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Mozes en Aäron</text><text x="68" y="625" class="body">Plagen, uittocht, zee en de lange tijd</text><text x="68" y="668" class="body">in de woestijn.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ten oosten van de Jordaan</text><text x="68" y="817" class="body">Amorieten; Balak en Bileam, waarbij</text><text x="68" y="860" class="body">vloek in zegen verandert.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Ten westen</text><text x="68" y="1009" class="body">Overtocht, Jericho en andere volken;</text><text x="68" y="1052" class="body">steden en opbrengst als ontvangen gave.</text><text x="46" y="1145" class="note">Dit is de geschiedenis die in de toespraak wordt</text><text x="46" y="1181" class="note">herinnerd, geen reeks nieuwe gebeurtenissen in</text><text x="46" y="1217" class="note">Sichem.</text></svg>