<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Twee klachten en een antwoord</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee klachten en een antwoord</text><text x="44" y="113" class="ref">Habakuk 1:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Klacht · 1–4</text><text x="68" y="241" class="body">Lang roepen, geweld en onrecht, wet</text><text x="68" y="284" class="body">verslapt en recht verdraaid.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het antwoord · 5–11</text><text x="68" y="433" class="body">Chaldeeën komen, snel en angstwekkend,</text><text x="68" y="476" class="body">gevangenen en vestingen; eigen kracht</text><text x="68" y="519" class="body">tot god gemaakt.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De nieuwe vraag · 12–17</text><text x="68" y="668" class="body">Zijn reinheid tegenover kwaad; waarom</text><text x="68" y="711" class="body">onrecht verdragen? Mensen als vissen en</text><text x="68" y="754" class="body">sleepnet, roof zonder medelijden.</text><text x="46" y="847" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="883" class="note">volgen de plaatselijke versindeling.</text></svg>