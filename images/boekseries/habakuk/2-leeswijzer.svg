<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Visioen, wachten en vijf weeën</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Visioen, wachten en vijf weeën</text><text x="44" y="113" class="ref">Habakuk 2:1–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het antwoord bewaren · 1–4</text><text x="68" y="241" class="body">Wachtpost, tafels, vastgestelde tijd;</text><text x="68" y="284" class="body">wachten, rechtvaardige leeft door</text><text x="68" y="327" class="body">geloof.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De vijf weeën · 5–19</text><text x="68" y="476" class="body">Hebzucht en roof, oneerlijke winst,</text><text x="68" y="519" class="body">stad met bloed, naaste beschamen en</text><text x="68" y="562" class="body">afgoden zonder adem.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De tegenstelling · 14,20</text><text x="68" y="711" class="body">Aarde vol kennis als water de zee</text><text x="68" y="754" class="body">bedekt; Hij in heilige tempel, heel de</text><text x="68" y="797" class="body">aarde stil.</text><text x="46" y="890" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="926" class="note">volgen de plaatselijke versindeling.</text></svg>