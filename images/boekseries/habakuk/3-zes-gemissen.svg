<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Zes gemissen, toch vreugde</title><desc id="desc">Zes gemissen, toch vreugde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes gemissen, toch vreugde</text><text x="44" y="113" class="ref">Habakuk 3:17–19</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vijg en wijnstok</text><text x="68" y="241" class="body">Geen bloei, geen vrucht.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Olijf en veld</text><text x="68" y="390" class="body">Geen opbrengst, geen voedsel.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Kooi en stal</text><text x="68" y="539" class="body">Geen schaap, geen rund.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Het toch</text><text x="68" y="688" class="body">Juichen in Hem, blij in reddende God;</text><text x="68" y="731" class="body">kracht en hindevoeten.</text><text x="46" y="824" class="note">Dit is de voorwaardelijke belijdenis van het</text><text x="46" y="860" class="note">gebed; geen zes extra historische rampen.</text></svg>