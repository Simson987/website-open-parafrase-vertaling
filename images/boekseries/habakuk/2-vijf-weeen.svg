<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De vijf wee-uitspraken</title><desc id="desc">De vijf wee-uitspraken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vijf wee-uitspraken</text><text x="44" y="113" class="ref">Habakuk 2:6–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Roof · 6–8</text><text x="68" y="241" class="body">Opstapelen wat niet van hem is,</text><text x="68" y="284" class="body">onderpanden; beroofde volken roven</text><text x="68" y="327" class="body">terug.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Oneerlijke winst · 9–11</text><text x="68" y="476" class="body">Hoog nest voor eigen huis, schande,</text><text x="68" y="519" class="body">steen en balk getuigen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bloedstad · 12–14</text><text x="68" y="668" class="body">Bouwen met onrecht, vergeefse arbeid;</text><text x="68" y="711" class="body">aarde vol kennis.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Beschaamde naaste · 15–17</text><text x="68" y="860" class="body">Dronken maken om te ontbloten; schande</text><text x="68" y="903" class="body">en beker keren terug.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Stomme afgoden · 18–20</text><text x="68" y="1052" class="body">Hout en steen met metaal, geen adem;</text><text x="68" y="1095" class="body">daartegenover Hij in tempel en stilte.</text><text x="46" y="1188" class="note">De vijf concrete aanklachten blijven</text><text x="46" y="1224" class="note">onderscheiden; vernedering wordt niet letterlijk</text><text x="46" y="1260" class="note">afgebeeld.</text></svg>