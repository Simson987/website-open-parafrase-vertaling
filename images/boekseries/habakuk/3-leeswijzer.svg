<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Gebed, beven en toch juichen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed, beven en toch juichen</text><text x="44" y="113" class="ref">Habakuk 3:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het gebed · 1–2</text><text x="68" y="241" class="body">Klaagliedwijs, gehoord en bang, werk</text><text x="68" y="284" class="body">levend houden, ontferming in toorn.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De verschijningstaal · 3–15</text><text x="68" y="433" class="body">Theman/Paran, licht, bergen en tenten,</text><text x="68" y="476" class="body">rivieren en zee, paarden en redding;</text><text x="68" y="519" class="body">poëtische machtstaal.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De eigen reactie · 16–19</text><text x="68" y="668" class="body">Beven en wachten; ook zonder zes</text><text x="68" y="711" class="body">opbrengsten toch juichen, kracht en</text><text x="68" y="754" class="body">voeten als hinde; snaarspel.</text><text x="46" y="847" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="883" class="note">volgen de plaatselijke versindeling.</text></svg>