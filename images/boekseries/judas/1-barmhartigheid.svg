<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Opbouwen en je ontfermen</title><desc id="desc">Opbouwen en je ontfermen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opbouwen en je ontfermen</text><text x="44" y="113" class="ref">Judas 1:20–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zelf · vers 20–21</text><text x="68" y="241" class="body">Opbouwen in geloof, bidden en in Gods</text><text x="68" y="284" class="body">liefde blijven.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twijfelaars · vers 22</text><text x="68" y="433" class="body">Je over hen ontfermen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Anderen · vers 23</text><text x="68" y="582" class="body">Redden als uit vuur; barmhartig zijn</text><text x="68" y="625" class="body">met ontzag.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Gods bewaring · vers 24</text><text x="68" y="774" class="body">Hij kan voor struikelen bewaren en met</text><text x="68" y="817" class="body">vreugde voor Zich stellen.</text><text x="46" y="910" class="note">Het vuurbeeld en de ontferming horen bij de</text><text x="46" y="946" class="note">oproep om mensen te helpen.</text></svg>