<svg xmlns="http://www.w3.org/2000/svg" width="840" height="734" viewBox="0 0 840 734" role="img" aria-labelledby="title desc"><title id="title">Drie genoemde dwaalwegen</title><desc id="desc">Drie genoemde dwaalwegen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="734" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie genoemde dwaalwegen</text><text x="44" y="113" class="ref">Judas 1:11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kaïn</text><text x="68" y="241" class="body">Zijn weg gaan.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Bileam</text><text x="68" y="390" class="body">Voor geld in zijn dwaling terechtkomen.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Korach</text><text x="68" y="539" class="body">Door zijn verzet omkomen.</text><text x="46" y="632" class="note">De brief brengt deze drie namen bijeen als</text><text x="46" y="668" class="note">waarschuwing.</text></svg>