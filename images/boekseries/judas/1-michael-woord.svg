<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Michaël en het oordeel</title><desc id="desc">Michaël en het oordeel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Michaël en het oordeel</text><text x="44" y="113" class="ref">Judas 1:8–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het contrast</text><text x="68" y="241" class="body">De misleiders lasteren de hemelse</text><text x="68" y="284" class="body">machten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De twist</text><text x="68" y="433" class="body">Michaël en de duivel twisten over het</text><text x="68" y="476" class="body">lichaam van Mozes.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Michaëls terughoudendheid</text><text x="68" y="625" class="body">Hij spreekt geen lasterend oordeel uit.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Zijn woorden</text><text x="68" y="774" class="body">De Heere zal je bestraffen.</text><text x="46" y="867" class="note">Het voorbeeld onderbouwt de waarschuwing tegen</text><text x="46" y="903" class="note">lasteren wat men niet kent.</text></svg>