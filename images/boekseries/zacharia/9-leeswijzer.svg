<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">De nederige Koning en redding</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nederige Koning en redding</text><text x="44" y="113" class="ref">Zacharia 9:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kust en steden · 1–8</text><text x="68" y="241" class="body">Chadrach/Damaskus, Hamath/Tyrus/Sidon</text><text x="68" y="284" class="body">en Filistijnse steden; trots en bezit</text><text x="68" y="327" class="body">weg, bescherming huis.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De Koning · 9–10</text><text x="68" y="476" class="body">Rechtvaardig, reddend en nederig op</text><text x="68" y="519" class="body">ezelveulen; oorlogsmiddelen weg, vrede</text><text x="68" y="562" class="body">tot einden aarde.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De vrijgekochten · 11–17</text><text x="68" y="711" class="body">Droge put en terugkeer met hoop;</text><text x="68" y="754" class="body">Juda/Efraïm als boog/pijl, storm en</text><text x="68" y="797" class="body">bescherming, volk als</text><text x="68" y="840" class="body">kudde/kroonstenen.</text><text x="46" y="933" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="969" class="note">volgen de plaatselijke versindeling.</text></svg>