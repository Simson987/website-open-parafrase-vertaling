<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1227" viewBox="0 0 840 1227" role="img" aria-labelledby="title desc"><title id="title">Koning over de hele aarde</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1227" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Koning over de hele aarde</text><text x="44" y="113" class="ref">Zacharia 14:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dag en berg · 1–7</text><text x="68" y="241" class="body">Beleg, plundering/wegvoering; strijd,</text><text x="68" y="284" class="body">Olijfberg gespleten en vlucht naar</text><text x="68" y="327" class="body">Azal; bijzondere dag met avondlicht.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Water en wonen · 8–11</text><text x="68" y="476" class="body">Oostelijke/westelijke zee zomer/winter,</text><text x="68" y="519" class="body">één Koning/naam, land vlak en stad</text><text x="68" y="562" class="body">hoog, veilig wonen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Gericht en optrekken · 12–19</text><text x="68" y="711" class="body">Plaag en paniek, rijkdom bijeen;</text><text x="68" y="754" class="body">overblijvende volken jaarlijks naar</text><text x="68" y="797" class="body">Loofhuttenfeest, niet komen/geen regen.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Het gewone heilig · 20–21</text><text x="68" y="946" class="body">Paardenbellen en potten voor Hem</text><text x="68" y="989" class="body">heilig, offerkoken, geen handelaar meer</text><text x="68" y="1032" class="body">in huis.</text><text x="46" y="1125" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="1161" class="note">volgen de plaatselijke versindeling.</text></svg>