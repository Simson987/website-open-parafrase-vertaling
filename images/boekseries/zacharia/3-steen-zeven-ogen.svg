<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Eén steen, zeven ogen</title><desc id="desc">Eén steen, zeven ogen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eén steen, zeven ogen</text><text x="44" y="113" class="ref">Zacharia 3:8–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De beloofde Knecht</text><text x="68" y="241" class="body">De Spruit komt; Josua en vrienden als</text><text x="68" y="284" class="body">teken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De steen</text><text x="68" y="433" class="body">Eén steen voor Josua, zeven ogen; Hij</text><text x="68" y="476" class="body">graveert.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De uitkomst</text><text x="68" y="625" class="body">Schuld van land in één dag weg; elkaar</text><text x="68" y="668" class="body">uitnodigen onder wijnstok en vijg.</text><text x="46" y="761" class="note">Het eigen opschrift wordt niet verzonnen en de</text><text x="46" y="797" class="note">zeven ogen worden niet tot zeven extra personen</text><text x="46" y="833" class="note">gemaakt.</text></svg>