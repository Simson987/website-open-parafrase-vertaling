<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Regen, herders en terugkeer</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Regen, herders en terugkeer</text><text x="44" y="113" class="ref">Zacharia 10:1–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Regen en bedrog · 1–2</text><text x="68" y="241" class="body">Late regen vragen;</text><text x="68" y="284" class="body">huisgoden/waarzeggers/dromen troosten</text><text x="68" y="327" class="body">niet, schapen zonder herder.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Omzien en kracht · 3–7</text><text x="68" y="476" class="body">Herders/bokken aangesproken, Juda als</text><text x="68" y="519" class="body">strijdros; hoeksteen/pin/boog/leiders,</text><text x="68" y="562" class="body">Juda/Jozef gered en Efraïm blij.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het verzamelen · 8–12</text><text x="68" y="711" class="body">Fluiten, vrijgekocht en talrijk, verre</text><text x="68" y="754" class="body">landen met kinderen terug; Egypte/Assur</text><text x="68" y="797" class="body">naar Gilead/Libanon, vernederde macht.</text><text x="46" y="890" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="926" class="note">volgen de plaatselijke versindeling.</text></svg>