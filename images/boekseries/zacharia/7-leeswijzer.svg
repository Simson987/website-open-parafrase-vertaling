<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Vasten en eerlijk recht</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vasten en eerlijk recht</text><text x="44" y="113" class="ref">Zacharia 7:1–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 1–3</text><text x="68" y="241" class="body">Darius jaar vier, Chisleu dag vier;</text><text x="68" y="284" class="body">Sarezer/Regem-Melech en mannen vragen</text><text x="68" y="327" class="body">over maand vijf.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De tegenvraag · 4–7</text><text x="68" y="476" class="body">Voor Hem gevast in maand vijf/zeven,</text><text x="68" y="519" class="body">zeventig jaar? Eigen eten/drinken en</text><text x="68" y="562" class="body">vroegere woorden.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het oude woord en weigering · 8–14</text><text x="68" y="711" class="body">Eerlijk recht, trouw/barmhartigheid,</text><text x="68" y="754" class="body">kwetsbaren niet onderdrukken;</text><text x="68" y="797" class="body">rug/oor/hart hard, niet gehoord en</text><text x="68" y="840" class="body">verstrooid.</text><text x="46" y="933" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="969" class="note">volgen de plaatselijke versindeling.</text></svg>