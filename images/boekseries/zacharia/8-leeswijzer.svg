<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Waarheid, vrede en samen zoeken</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarheid, vrede en samen zoeken</text><text x="44" y="113" class="ref">Zacharia 8:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Veilig wonen · 1–8</text><text x="68" y="241" class="body">Sion, stad van waarheid, ouderen en</text><text x="68" y="284" class="body">spelende jeugd, redding uit oost en</text><text x="68" y="327" class="body">west.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Sterke handen en eerlijkheid · 9–17</text><text x="68" y="476" class="body">Van tekort naar vrucht/dauw en zegen,</text><text x="68" y="519" class="body">niet bang; waarheid, vrederecht, geen</text><text x="68" y="562" class="body">kwaad of valse eed.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Vasten en volken · 18–23</text><text x="68" y="711" class="body">Vier vastenmaanden naar vreugde;</text><text x="68" y="754" class="body">steden/volken zoeken, tien mannen bij</text><text x="68" y="797" class="body">mantel Judeeër.</text><text x="46" y="890" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="926" class="note">volgen de plaatselijke versindeling.</text></svg>