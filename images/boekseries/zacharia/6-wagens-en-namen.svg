<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Wagens, richtingen en namen</title><desc id="desc">Wagens, richtingen en namen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wagens, richtingen en namen</text><text x="44" y="113" class="ref">Zacharia 6:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Paarden · 2–3</text><text x="68" y="241" class="body">Eerste rood, tweede zwart, derde wit,</text><text x="68" y="284" class="body">vierde gevlekt/sterk.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Richtingen · 5–8</text><text x="68" y="433" class="body">Vier winden; zwart naar noorden, wit</text><text x="68" y="476" class="body">erachter, gevlekt naar zuiden, sterke</text><text x="68" y="519" class="body">doorkruisen aarde.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Gaven en huis · 10–11</text><text x="68" y="668" class="body">Cheldai, Tobia, Jedaja; huis Josia,</text><text x="68" y="711" class="body">zoon Zefanja; kroon op Josua, zoon</text><text x="68" y="754" class="body">Jozadak.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Aandenken · 14</text><text x="68" y="903" class="body">Chelem, Tobia, Jedaja en Chen, zoon</text><text x="68" y="946" class="body">Zefanja.</text><text x="46" y="1039" class="note">De twee namenreeksen blijven volgens de eigen</text><text x="46" y="1075" class="note">verzen staan. Cheldai/Chelem en Josia/Chen</text><text x="46" y="1111" class="note">worden niet zonder tekstbasis samengevoegd.</text></svg>