<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1075" viewBox="0 0 840 1075" role="img" aria-labelledby="title desc"><title id="title">De families in de rouw</title><desc id="desc">De families in de rouw met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1075" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De families in de rouw</text><text x="44" y="113" class="ref">Zacharia 12:10–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Huis van David</text><text x="68" y="241" class="body">Familie apart, hun vrouwen apart.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Huis van Nathan</text><text x="68" y="390" class="body">Familie apart, hun vrouwen apart.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Huis van Levi</text><text x="68" y="539" class="body">Familie apart, hun vrouwen apart.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Familie van Simeï</text><text x="68" y="688" class="body">Familie apart, hun vrouwen apart.</text><rect x="42" y="746" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Alle overige families</text><text x="68" y="837" class="body">Iedere familie apart, hun vrouwen</text><text x="68" y="880" class="body">apart.</text><text x="46" y="973" class="note">Dit is een opsomming van rouwgroepen, geen</text><text x="46" y="1009" class="note">stamboom met ongenoemde vader-zoonrelaties.</text></svg>