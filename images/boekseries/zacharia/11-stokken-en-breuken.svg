<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Twee namen en twee breuken</title><desc id="desc">Twee namen en twee breuken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee namen en twee breuken</text><text x="44" y="113" class="ref">Zacharia 11:7–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vriendelijkheid · 7,10–11</text><text x="68" y="241" class="body">Eerste stok gebroken: verbond met alle</text><text x="68" y="284" class="body">volken verbroken, ellendige schapen</text><text x="68" y="327" class="body">herkennen woord.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Dertig zilverstukken · 12–13</text><text x="68" y="476" class="body">Loon gewogen, in huis van de HEERE naar</text><text x="68" y="519" class="body">pottenbakker geworpen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verbondenheid · 7,14</text><text x="68" y="668" class="body">Tweede stok gebroken: verbondenheid</text><text x="68" y="711" class="body">tussen Juda en Israël verbreken.</text><text x="46" y="804" class="note">De twee breuken hebben volgens hun eigen verzen</text><text x="46" y="840" class="note">een verschillend genoemd verband.</text></svg>