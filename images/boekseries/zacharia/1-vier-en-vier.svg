<svg xmlns="http://www.w3.org/2000/svg" width="840" height="671" viewBox="0 0 840 671" role="img" aria-labelledby="title desc"><title id="title">Vier hoorns en vier smeden</title><desc id="desc">Vier hoorns en vier smeden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="671" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier hoorns en vier smeden</text><text x="44" y="113" class="ref">Zacharia 1:18–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De hoorns</text><text x="68" y="241" class="body">Vier; verstrooiden Juda, Israël en</text><text x="68" y="284" class="body">Jeruzalem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De smeden</text><text x="68" y="433" class="body">Vier; jagen schrik aan en werpen hoorns</text><text x="68" y="476" class="body">van de volken neer.</text><text x="46" y="569" class="note">De tekst geeft aantallen en functie, geen lijst</text><text x="46" y="605" class="note">van vier bij naam geïdentificeerde rijken.</text></svg>