<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Beelden en terugkeerplaatsen</title><desc id="desc">Beelden en terugkeerplaatsen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Beelden en terugkeerplaatsen</text><text x="44" y="113" class="ref">Zacharia 10:3–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uit Juda · 3–4</text><text x="68" y="241" class="body">Strijdros, hoeksteen, tentpin,</text><text x="68" y="284" class="body">strijdboog en leiders.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De beloofde groepen · 6–9</text><text x="68" y="433" class="body">Juda en Jozef, Efraïm met kinderen;</text><text x="68" y="476" class="body">vrijgekocht en terugkerend.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Van en naar · 10</text><text x="68" y="625" class="body">Uit Egypte en Assur verzameld naar</text><text x="68" y="668" class="body">Gilead en Libanon.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het slot · 11–12</text><text x="68" y="817" class="body">Zee van benauwdheid, Nijl en macht</text><text x="68" y="860" class="body">Assur/Egypte; kracht en in Zijn naam</text><text x="68" y="903" class="body">gaan.</text><text x="46" y="996" class="note">Herkomst en bestemming blijven tekstwoorden,</text><text x="46" y="1032" class="note">geen moderne routekaart.</text></svg>