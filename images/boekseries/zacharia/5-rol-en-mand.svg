<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">De twee visioenen onderscheiden</title><desc id="desc">De twee visioenen onderscheiden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee visioenen onderscheiden</text><text x="44" y="113" class="ref">Zacharia 5:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rol · 1–4</text><text x="68" y="241" class="body">Ongeveer 10 m lang en 5 m breed, vloek</text><text x="68" y="284" class="body">over dief en valse eed.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Mand · 5–8</text><text x="68" y="433" class="body">Schuld, vrouw genaamd goddeloosheid en</text><text x="68" y="476" class="body">loden sluiting.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dragende vrouwen · 9–11</text><text x="68" y="625" class="body">Twee, ooievaarsvleugels, mand naar</text><text x="68" y="668" class="body">Sinear en op voetstuk.</text><text x="46" y="761" class="note">Afmetingen horen bij de rol; de tekst geeft geen</text><text x="46" y="797" class="note">exacte inhoudsmaat voor de grote korenmand.</text></svg>