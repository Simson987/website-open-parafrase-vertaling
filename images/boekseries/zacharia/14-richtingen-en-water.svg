<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Berg, richtingen en water</title><desc id="desc">Berg, richtingen en water met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Berg, richtingen en water</text><text x="44" y="113" class="ref">Zacharia 14:4–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De berg · 4–5</text><text x="68" y="241" class="body">Ten oosten van Jeruzalem; groot dal</text><text x="68" y="284" class="body">oost-west, berghelften noord/zuid,</text><text x="68" y="327" class="body">vlucht tot Azal.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De dag · 6–7</text><text x="68" y="476" class="body">Bijzondere dag, bij Hem bekend; tegen</text><text x="68" y="519" class="body">avond licht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het water · 8</text><text x="68" y="668" class="body">Uit Jeruzalem, helft oostelijke zee en</text><text x="68" y="711" class="body">helft westelijke zee, zomer/winter.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De Koning en woning · 9–11</text><text x="68" y="860" class="body">Eén naam, land vlak en Jeruzalem</text><text x="68" y="903" class="body">hoog/veilig.</text><text x="46" y="996" class="note">Schematische tekstgeografie: geen voorspelde</text><text x="46" y="1032" class="note">moderne breuklijn of actuele kaart.</text></svg>