<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">Bellen en potten heilig</title><desc id="desc">Bellen en potten heilig met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bellen en potten heilig</text><text x="44" y="113" class="ref">Zacharia 14:20–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Op paardenbellen</text><text x="68" y="241" class="body">HEILIG VOOR DE HEERE.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Potten in Zijn huis</text><text x="68" y="390" class="body">Als sprengschalen voor het altaar.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Alle potten in Jeruzalem/Juda</text><text x="68" y="539" class="body">Heilig, door offeraars gebruikt om te</text><text x="68" y="582" class="body">koken.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Het huis</text><text x="68" y="731" class="body">Geen handelaar meer.</text><text x="46" y="824" class="note">De woorden van de belinscriptie staan exact als</text><text x="46" y="860" class="note">in de plaatselijke vertaling; de rasterbeelden</text><text x="46" y="896" class="note">hoeven geen tekst te verzinnen.</text></svg>