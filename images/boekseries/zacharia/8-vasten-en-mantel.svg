<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Vasten, vreugde en tien mannen</title><desc id="desc">Vasten, vreugde en tien mannen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vasten, vreugde en tien mannen</text><text x="44" y="113" class="ref">Zacharia 8:19–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vier maanden · 19</text><text x="68" y="241" class="body">Vierde, vijfde, zevende en tiende</text><text x="68" y="284" class="body">maand; van vasten naar vrolijke</text><text x="68" y="327" class="body">feesten, waarheid/vrede liefhebben.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Veel steden · 20–22</text><text x="68" y="476" class="body">Bewoners nodigen elkaar uit, veel</text><text x="68" y="519" class="body">volken zoeken Hem in Jeruzalem.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Tien mannen · 23</text><text x="68" y="668" class="body">Uit allerlei talen grijpen zij mantel</text><text x="68" y="711" class="body">van een Judeeër: gehoord dat God met</text><text x="68" y="754" class="body">jullie is.</text><text x="46" y="847" class="note">De tien worden als tekstaantal bewaard; talen</text><text x="46" y="883" class="note">worden niet met verzonnen hedendaagse vlaggen</text><text x="46" y="919" class="note">vastgelegd.</text></svg>