<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Boekrol en korenmand</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Boekrol en korenmand</text><text x="44" y="113" class="ref">Zacharia 5:1–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De rol · 1–4</text><text x="68" y="241" class="body">Vliegende rol ongeveer 10 bij 5 m;</text><text x="68" y="284" class="body">vloek tegen dief en valse eed,</text><text x="68" y="327" class="body">hout/stenen van huis verteerd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De mand · 5–8</text><text x="68" y="476" class="body">Grote korenmand als schuld, vrouw als</text><text x="68" y="519" class="body">goddeloosheid, loden deksel.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De verplaatsing · 9–11</text><text x="68" y="668" class="body">Twee vrouwen met ooievaarsvleugels</text><text x="68" y="711" class="body">dragen naar Sinear, huis en voetstuk</text><text x="68" y="754" class="body">gereed.</text><text x="46" y="847" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="883" class="note">volgen de plaatselijke versindeling.</text></svg>