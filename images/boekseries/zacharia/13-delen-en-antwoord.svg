<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Twee delen en het derde</title><desc id="desc">Twee delen en het derde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee delen en het derde</text><text x="44" y="113" class="ref">Zacharia 13:7–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herder en kudde · 7</text><text x="68" y="241" class="body">Slaan en verstrooien; Zijn hand naar de</text><text x="68" y="284" class="body">kleinen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twee delen · 8</text><text x="68" y="433" class="body">Uitgeroeid en sterven.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Derde deel · 8–9</text><text x="68" y="582" class="body">Blijft over, vuur en loutering als</text><text x="68" y="625" class="body">zilver/goud.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het antwoord · 9</text><text x="68" y="774" class="body">Zij roepen, Hij verhoort; dit is mijn</text><text x="68" y="817" class="body">volk, de HEERE is mijn God.</text><text x="46" y="910" class="note">Het overblijvende derde wordt beproefd; er wordt</text><text x="46" y="946" class="note">geen extra vierde groep verzonnen.</text></svg>