<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Onderdelen en gegeven uitleg</title><desc id="desc">Onderdelen en gegeven uitleg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Onderdelen en gegeven uitleg</text><text x="44" y="113" class="ref">Zacharia 4:2–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het zichtbare</text><text x="68" y="241" class="body">Goud, oliehouder, zeven lampen/pijpjes,</text><text x="68" y="284" class="body">twee bomen rechts en links.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De bouwbelofte</text><text x="68" y="433" class="body">Zerubbabel grondvest én voltooit, door</text><text x="68" y="476" class="body">Geest, sluitsteen en schietlood.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De zeven en twee</text><text x="68" y="625" class="body">Zeven ogen doorkruisen aarde; twee</text><text x="68" y="668" class="body">gezalfden staan voor de Heer van heel</text><text x="68" y="711" class="body">de aarde.</text><text x="46" y="804" class="note">De plaatselijke tekst geeft deze uitleg. Geen</text><text x="46" y="840" class="note">onbekende persoonsnamen van de twee gezalfden</text><text x="46" y="876" class="note">zijn ingevuld.</text></svg>