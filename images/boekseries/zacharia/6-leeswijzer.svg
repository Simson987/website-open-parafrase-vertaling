<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1035" viewBox="0 0 840 1035" role="img" aria-labelledby="title desc"><title id="title">Vier wagens en een kroon</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1035" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier wagens en een kroon</text><text x="44" y="113" class="ref">Zacharia 6:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het visioen · 1–8</text><text x="68" y="241" class="body">Twee bronzen bergen, vier wagens,</text><text x="68" y="284" class="body">paardkleuren en richtingen, vier winden</text><text x="68" y="327" class="body">en Geest rust in noorden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De handeling · 9–11</text><text x="68" y="476" class="body">Gaven van ballingen, huis Josia,</text><text x="68" y="519" class="body">zilver/goud en kroon op hogepriester</text><text x="68" y="562" class="body">Josua.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het woord · 12–15</text><text x="68" y="711" class="body">Man Spruit, tempel en troon,</text><text x="68" y="754" class="body">priester/heerser in vrede; kroon als</text><text x="68" y="797" class="body">aandenken, mensen van ver bouwen bij</text><text x="68" y="840" class="body">goed luisteren.</text><text x="46" y="933" class="note">Beeldspraak, klacht, herinnering en belofte</text><text x="46" y="969" class="note">volgen de plaatselijke versindeling.</text></svg>