<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De vergeleken bedieningen</title><desc id="desc">De vergeleken bedieningen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vergeleken bedieningen</text><text x="44" y="113" class="ref">2 Korinthiërs 3:7–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Letters in steen · vers 7</text><text x="68" y="241" class="body">De bediening van de dood kwam al met</text><text x="68" y="284" class="body">heerlijkheid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De Geest · vers 8</text><text x="68" y="433" class="body">De bediening van de Geest is veel</text><text x="68" y="476" class="body">heerlijker.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Veroordeling en gerechtigheid · vers 9</text><text x="68" y="625" class="body">Paulus vergelijkt hun heerlijkheid.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Wat verdwijnt en wat blijft · vers 11</text><text x="68" y="774" class="body">Wat blijft is overvloedig in</text><text x="68" y="817" class="body">heerlijkheid.</text><text x="46" y="910" class="note">De vergelijkingen volgen Paulus’ eigen woorden</text><text x="46" y="946" class="note">en de aangehaalde glans van Mozes.</text></svg>