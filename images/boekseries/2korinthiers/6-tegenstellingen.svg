<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De genoemde tegenstellingen</title><desc id="desc">De genoemde tegenstellingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde tegenstellingen</text><text x="44" y="113" class="ref">2 Korinthiërs 6:8–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Reputatie</text><text x="68" y="241" class="body">Eer en oneer; slechte en goede naam;</text><text x="68" y="284" class="body">bedriegers en toch waar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bekend en levend</text><text x="68" y="433" class="body">Onbekend en toch bekend; stervend en</text><text x="68" y="476" class="body">toch levend.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Straf en verdriet</text><text x="68" y="625" class="body">Gestraft maar niet gedood; bedroefd</text><text x="68" y="668" class="body">maar altijd blij.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Armoede en bezit</text><text x="68" y="817" class="body">Arm maar velen rijk makend; niets</text><text x="68" y="860" class="body">hebben en alles bezitten.</text><text x="46" y="953" class="note">De tegenstellingen beschrijven de bediening;</text><text x="46" y="989" class="note">rijkdom is hier niet uitsluitend geld.</text></svg>