<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Bereidheid, vermogen en gelijkheid</title><desc id="desc">Bereidheid, vermogen en gelijkheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bereidheid, vermogen en gelijkheid</text><text x="44" y="113" class="ref">2 Korinthiërs 8:10–15</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat begonnen is</text><text x="68" y="241" class="body">Maak het willen ook met handelen af.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De maat</text><text x="68" y="390" class="body">Wat iemand heeft telt; niet wat hij</text><text x="68" y="433" class="body">niet heeft.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De bedoeling</text><text x="68" y="582" class="body">Niet de een ontlasten door de ander te</text><text x="68" y="625" class="body">belasten.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De wederkerigheid</text><text x="68" y="774" class="body">Huidige overvloed vult tekort aan;</text><text x="68" y="817" class="body">later kan het omgekeerd zijn.</text><text x="46" y="910" class="note">De aangehaalde woorden over veel en weinig</text><text x="46" y="946" class="note">verzamelen ondersteunen de genoemde gelijkheid.</text></svg>