<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Gratis verkondigd in Korinthe</title><desc id="desc">Gratis verkondigd in Korinthe met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gratis verkondigd in Korinthe</text><text x="44" y="113" class="ref">2 Korinthiërs 11:7–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De werkwijze</text><text x="68" y="241" class="body">Paulus verkondigde het evangelie van</text><text x="68" y="284" class="body">God gratis.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De ondersteuning</text><text x="68" y="433" class="body">Andere gemeenschappen droegen bij aan</text><text x="68" y="476" class="body">zijn dienst.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij het tekort</text><text x="68" y="625" class="body">De gelovigen uit Macedonië vulden aan</text><text x="68" y="668" class="body">wat ontbrak.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zijn bedoeling</text><text x="68" y="817" class="body">Niet tot last zijn; zijn liefde wordt</text><text x="68" y="860" class="body">daardoor niet ontkend.</text><text x="46" y="953" class="note">Het woord beroofd in vers 8 staat in Paulus’</text><text x="46" y="989" class="note">betoog over ontvangen ondersteuning.</text></svg>