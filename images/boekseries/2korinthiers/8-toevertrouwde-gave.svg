<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Samen de gave beheren</title><desc id="desc">Samen de gave beheren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Samen de gave beheren</text><text x="44" y="113" class="ref">2 Korinthiërs 8:16–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Titus</text><text x="68" y="241" class="body">Metgezel en medewerker; hij gaat uit</text><text x="68" y="284" class="body">eigen beweging.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste medegelovige</text><text x="68" y="433" class="body">Om het evangeliewerk geprezen en door</text><text x="68" y="476" class="body">gemeenten aangewezen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tweede medegelovige</text><text x="68" y="625" class="body">Vaak beproefd en ijverig bevonden.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De reden voor gezamenlijk beheer</text><text x="68" y="774" class="body">Voorkom verwijten en doe goed voor de</text><text x="68" y="817" class="body">Heere én voor mensen.</text><text x="46" y="910" class="note">De twee medegelovigen krijgen hier geen naam;</text><text x="46" y="946" class="note">het schema laat hun identiteit open.</text></svg>