<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Toetsing, opbouw en vrede</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toetsing, opbouw en vrede</text><text x="44" y="113" class="ref">2 Korinthiërs 13:1–13</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–4 · Het derde bezoek</text><text x="68" y="241" class="body">Getuigen, kracht en Christus die leeft.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">5–10 · Onderzoek en gebed</text><text x="68" y="390" class="body">Toets jezelf; het gezag is gegeven om</text><text x="68" y="433" class="body">op te bouwen.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">11–12 · Eensgezind leven</text><text x="68" y="582" class="body">Bemoediging, vrede en de heilige groet.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">13 · De zegen</text><text x="68" y="731" class="body">Genade, liefde en gemeenschap voor</text><text x="68" y="774" class="body">allen.</text><text x="46" y="867" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="903" class="note">de plaatselijke versindeling.</text></svg>