<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Toetsen en opbouwen</title><desc id="desc">Toetsen en opbouwen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toetsen en opbouwen</text><text x="44" y="113" class="ref">2 Korinthiërs 13:5–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oproep</text><text x="68" y="241" class="body">Onderzoek en toets jezelf of je in het</text><text x="68" y="284" class="body">geloof bent.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het gebed</text><text x="68" y="433" class="body">Dat de gemeente geen kwaad doet, maar</text><text x="68" y="476" class="body">het goede.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De waarheid</text><text x="68" y="625" class="body">Paulus kan niets tegen de waarheid</text><text x="68" y="668" class="body">doen, alleen ervoor.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het gezag</text><text x="68" y="817" class="body">Om op te bouwen, niet om af te breken.</text><text x="46" y="910" class="note">Paulus schrijft van ver om bij zijn komst geen</text><text x="46" y="946" class="note">streng optreden nodig te maken.</text></svg>