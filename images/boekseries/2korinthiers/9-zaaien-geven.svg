<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Het zaaibeeld en het geven</title><desc id="desc">Het zaaibeeld en het geven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het zaaibeeld en het geven</text><text x="44" y="113" class="ref">2 Korinthiërs 9:6–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spaarzaam en rijk zaaien</text><text x="68" y="241" class="body">Het beeld noemt een overeenkomstige</text><text x="68" y="284" class="body">oogst.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het hart · vers 7</text><text x="68" y="433" class="body">Geven zoals besloten, niet verdrietig</text><text x="68" y="476" class="body">of gedwongen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Genoeg · vers 8–10</text><text x="68" y="625" class="body">Genade voor goed werk, zaad voor de</text><text x="68" y="668" class="body">zaaier en brood.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het doel · vers 11</text><text x="68" y="817" class="body">Rijk om vrijgevig te zijn, zodat God</text><text x="68" y="860" class="body">dank ontvangt.</text><text x="46" y="953" class="note">De bedoelde vrucht leidt tot goed werk</text><text x="46" y="989" class="note">en dank aan God.</text></svg>