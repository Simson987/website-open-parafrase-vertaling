<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De genoemde beproevingen</title><desc id="desc">De genoemde beproevingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde beproevingen</text><text x="44" y="113" class="ref">2 Korinthiërs 11:23–28</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vijf keer</text><text x="68" y="241" class="body">Veertig min één slagen van de Joden.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Drie keer en één keer</text><text x="68" y="390" class="body">Met stokken geslagen; één keer</text><text x="68" y="433" class="body">gestenigd.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Drie schipbreuken</text><text x="68" y="582" class="body">Daarnaast noemt Paulus een nacht en dag</text><text x="68" y="625" class="body">op zee.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Voortdurend</text><text x="68" y="774" class="body">Reisgevaar, arbeid, gebrek en zorg voor</text><text x="68" y="817" class="body">alle gemeenten.</text><text x="46" y="910" class="note">Deze getallen komen uit deze brief; de genoemde</text><text x="46" y="946" class="note">schipbreuken worden niet met latere reizen</text><text x="46" y="982" class="note">vereenzelvigd.</text></svg>