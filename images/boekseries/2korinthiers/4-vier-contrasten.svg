<svg xmlns="http://www.w3.org/2000/svg" width="840" height="883" viewBox="0 0 840 883" role="img" aria-labelledby="title desc"><title id="title">Vier keer niet ten onder</title><desc id="desc">Vier keer niet ten onder met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="883" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier keer niet ten onder</text><text x="44" y="113" class="ref">2 Korinthiërs 4:8–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Van alle kanten bedrukt</text><text x="68" y="241" class="body">Maar niet in het nauw gedreven.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het soms niet meer weten</text><text x="68" y="390" class="body">Maar niet wanhopen.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Vervolgd</text><text x="68" y="539" class="body">Maar niet in de steek gelaten.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Neergeworpen</text><text x="68" y="688" class="body">Maar niet vernietigd.</text><text x="46" y="781" class="note">De vier woordparen benoemen echte moeite én</text><text x="46" y="817" class="note">volharding; geen afwezigheid van lijden.</text></svg>