<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Het eerdere reisvoornemen</title><desc id="desc">Het eerdere reisvoornemen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het eerdere reisvoornemen</text><text x="44" y="113" class="ref">2 Korinthiërs 1:15–17, 23</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste bezoek</text><text x="68" y="241" class="body">Eerst naar Korinthe gaan.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Daarna</text><text x="68" y="390" class="body">Via Korinthe naar Macedonië.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Terugweg</text><text x="68" y="539" class="body">Weer bij de gemeente langs.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Verder</text><text x="68" y="688" class="body">Door hen op weg geholpen worden naar</text><text x="68" y="731" class="body">Judea.</text><text x="46" y="824" class="note">Paulus beschrijft een eerder voornemen en</text><text x="46" y="860" class="note">verklaart in vers 23 waarom hij nog niet kwam.</text></svg>