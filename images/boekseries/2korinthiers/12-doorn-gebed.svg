<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Doorn, gebed en genade</title><desc id="desc">Doorn, gebed en genade met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Doorn, gebed en genade</text><text x="44" y="113" class="ref">2 Korinthiërs 12:7–10</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gegeven doorn</text><text x="68" y="241" class="body">Opdat Paulus niet hoogmoedig wordt.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het gebed</text><text x="68" y="390" class="body">Drie keer vraagt hij dat die wijkt.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Het antwoord</text><text x="68" y="539" class="body">Mijn genade is genoeg voor je; kracht</text><text x="68" y="582" class="body">in zwakheid.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De reactie</text><text x="68" y="731" class="body">Liever roemen in zwakheden, zodat</text><text x="68" y="774" class="body">Christus’ kracht in hem woont.</text><text x="46" y="867" class="note">Paulus noemt de doorn en zijn bedoeling,</text><text x="46" y="903" class="note">maar geeft hier geen nadere omschrijving.</text></svg>