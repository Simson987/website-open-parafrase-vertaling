<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Waarvoor leven wij?</title><desc id="desc">Waarvoor leven wij? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarvoor leven wij?</text><text x="44" y="113" class="ref">2 Korinthiërs 5:14–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De liefde van Christus</text><text x="68" y="241" class="body">Dringt Paulus en zijn medewerkers.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Gestorven en opgewekt</text><text x="68" y="390" class="body">Niet voor zichzelf leven, maar voor</text><text x="68" y="433" class="body">Hem.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Nieuwe schepping</text><text x="68" y="582" class="body">In Christus is het oude voorbij.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Dienst en oproep</text><text x="68" y="731" class="body">De verzoening bekendmaken en tot</text><text x="68" y="774" class="body">verzoening met God oproepen.</text><text x="46" y="867" class="note">Het schema verbindt nieuw leven met de oproep en</text><text x="46" y="903" class="note">het werk dat Paulus beschrijft.</text></svg>