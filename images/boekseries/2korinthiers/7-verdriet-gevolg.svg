<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Wat het verdriet teweegbrengt</title><desc id="desc">Wat het verdriet teweegbrengt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat het verdriet teweegbrengt</text><text x="44" y="113" class="ref">2 Korinthiërs 7:8–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De brief</text><text x="68" y="241" class="body">Heeft voor een tijd verdriet gedaan.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Verdriet naar Gods wil</text><text x="68" y="390" class="body">Brengt bekering en redding zonder</text><text x="68" y="433" class="body">spijt.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Verdriet van de wereld</text><text x="68" y="582" class="body">Brengt de dood.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De zichtbare vrucht</text><text x="68" y="731" class="body">Inzet, verantwoording, afkeer, ontzag,</text><text x="68" y="774" class="body">verlangen, ijver en recht.</text><text x="46" y="867" class="note">Paulus benoemt het concrete effect van</text><text x="46" y="903" class="note">zijn brief op de gemeente.</text></svg>