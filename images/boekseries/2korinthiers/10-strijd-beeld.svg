<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De strijdvergelijking uitgelegd</title><desc id="desc">De strijdvergelijking uitgelegd met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De strijdvergelijking uitgelegd</text><text x="44" y="113" class="ref">2 Korinthiërs 10:3–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet van vlees en bloed</text><text x="68" y="241" class="body">Paulus wijst vleselijke wapens af.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De bolwerken</text><text x="68" y="390" class="body">Hij spreekt over redeneringen en wat</text><text x="68" y="433" class="body">tegen Gods kennis opstaat.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De gedachten</text><text x="68" y="582" class="body">Worden gericht op gehoorzaamheid aan</text><text x="68" y="625" class="body">Christus.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het gezag</text><text x="68" y="774" class="body">Is gegeven om op te bouwen, niet om af</text><text x="68" y="817" class="body">te breken.</text><text x="46" y="910" class="note">Bolwerken en wapens zijn beeldspraak in dit</text><text x="46" y="946" class="note">betoog; er wordt geen militaire aanval</text><text x="46" y="982" class="note">beschreven.</text></svg>