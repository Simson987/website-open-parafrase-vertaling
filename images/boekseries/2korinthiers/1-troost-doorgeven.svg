<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Ontvangen troost doorgeven</title><desc id="desc">Ontvangen troost doorgeven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ontvangen troost doorgeven</text><text x="44" y="113" class="ref">2 Korinthiërs 1:3–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">God troost</text><text x="68" y="241" class="body">De Vader vol barmhartigheid troost in</text><text x="68" y="284" class="body">alle moeite.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wij ontvangen</text><text x="68" y="433" class="body">Troost door Christus bij het lijden.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Wij kunnen troosten</text><text x="68" y="582" class="body">Anderen helpen met de troost die wij</text><text x="68" y="625" class="body">zelf kregen.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Jullie helpen mee</text><text x="68" y="774" class="body">Door gebed, zodat velen ook God danken.</text><text x="46" y="867" class="note">De samenhang is onderlinge troost en gebed, niet</text><text x="46" y="903" class="note">de belofte dat alle moeite verdwijnt.</text></svg>