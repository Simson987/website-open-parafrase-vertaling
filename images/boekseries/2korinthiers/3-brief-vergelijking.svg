<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De gemeenschap als brief</title><desc id="desc">De gemeenschap als brief met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gemeenschap als brief</text><text x="44" y="113" class="ref">2 Korinthiërs 3:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geen zelfaanprijzing</text><text x="68" y="241" class="body">Paulus stelt de vraag naar</text><text x="68" y="284" class="body">aanbevelingsbrieven.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jullie zijn onze brief</text><text x="68" y="433" class="body">Gekend en gelezen door alle mensen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Een brief van Christus</text><text x="68" y="582" class="body">Met de Geest geschreven; niet met inkt</text><text x="68" y="625" class="body">op stenen platen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De bekwaamheid</text><text x="68" y="774" class="body">God maakt geschikt voor de dienst van</text><text x="68" y="817" class="body">het nieuwe verbond.</text><text x="46" y="910" class="note">Brief en hart zijn beeldspraak; er staat geen</text><text x="46" y="946" class="note">inkttekst op menselijke huid.</text></svg>