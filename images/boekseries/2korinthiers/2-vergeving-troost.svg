<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Van straf naar troost</title><desc id="desc">Van straf naar troost met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van straf naar troost</text><text x="44" y="113" class="ref">2 Korinthiërs 2:5–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De straf · vers 6</text><text x="68" y="241" class="body">De straf van de meerderheid is genoeg</text><text x="68" y="284" class="body">geweest.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De volgende stap · vers 7</text><text x="68" y="433" class="body">Nu vergeven en troosten.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het gevaar</text><text x="68" y="582" class="body">Niet door al te groot verdriet laten</text><text x="68" y="625" class="body">verslinden.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De oproep · vers 8–11</text><text x="68" y="774" class="body">Laat liefde merken en vergeef; geef de</text><text x="68" y="817" class="body">satan geen voordeel.</text><text x="46" y="910" class="note">De persoon wordt niet bij name genoemd; het</text><text x="46" y="946" class="note">schema voegt geen identiteit toe.</text></svg>