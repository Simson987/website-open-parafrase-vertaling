<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De uitwerking van deze dienst</title><desc id="desc">De uitwerking van deze dienst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De uitwerking van deze dienst</text><text x="44" y="113" class="ref">2 Korinthiërs 9:12–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tekort aangevuld</text><text x="68" y="241" class="body">De heiligen ontvangen de benodigde</text><text x="68" y="284" class="body">hulp.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dank aan God</text><text x="68" y="433" class="body">De dienst brengt veel dankbaarheid</text><text x="68" y="476" class="body">voort.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Eer en gemeenschap</text><text x="68" y="625" class="body">De ontvangers eren God om</text><text x="68" y="668" class="body">gehoorzaamheid en vrijgevigheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gebed en verlangen</text><text x="68" y="817" class="body">Zij bidden voor de gevers en verlangen</text><text x="68" y="860" class="body">naar hen.</text><text x="46" y="953" class="note">De ontvangers en gevers worden door de gave met</text><text x="46" y="989" class="note">elkaar verbonden.</text></svg>