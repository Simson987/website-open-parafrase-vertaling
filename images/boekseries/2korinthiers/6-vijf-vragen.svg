<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De vijf vergelijkende vragen</title><desc id="desc">De vijf vergelijkende vragen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De vijf vergelijkende vragen</text><text x="44" y="113" class="ref">2 Korinthiërs 6:14–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gerechtigheid en licht</text><text x="68" y="241" class="body">Wat delen gerechtigheid met onrecht en</text><text x="68" y="284" class="body">licht met duisternis?</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Christus en de gelovige</text><text x="68" y="433" class="body">Welke overeenkomst met Belial of met</text><text x="68" y="476" class="body">een ongelovige?</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De tempel van God</text><text x="68" y="625" class="body">Wat past er bij afgoden?</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De toepassing</text><text x="68" y="774" class="body">Wij zijn de tempel van de levende God.</text><text x="46" y="867" class="note">De vijf vragen worden in drie groepen</text><text x="46" y="903" class="note">samengevat; tempel en span zijn vergelijkingen.</text></svg>