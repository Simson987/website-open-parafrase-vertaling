<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">Ruimte bij drie oogsten</title><desc id="desc">Graan, olijven en druiven naast elkaar met de genoemde ontvangers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ruimte bij drie oogsten</text><text x="44" y="113" class="ref">Deuteronomium 24:19–22</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het graan</text><text x="68" y="241" class="body">Een vergeten schoof niet ophalen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De olijven</text><text x="68" y="390" class="body">Na het afslaan niet opnieuw de takken</text><text x="68" y="433" class="body">afzoeken.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De druiven</text><text x="68" y="582" class="body">Na de oogst geen nalezing houden.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Voor wie?</text><text x="68" y="731" class="body">Vreemdeling, wees en weduwe mogen ervan</text><text x="68" y="774" class="body">profiteren.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">De herinnering</text><text x="68" y="923" class="body">Bedenk dat je zelf slaaf in Egypte bent</text><text x="68" y="966" class="body">geweest.</text><text x="46" y="1059" class="note">Het gaat om drie concrete vormen van</text><text x="46" y="1095" class="note">achterlaten, niet om drie extra oogstrondes.</text></svg>