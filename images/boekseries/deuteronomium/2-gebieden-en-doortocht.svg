<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Gebieden en doortocht</title><desc id="desc">De verschillende instructies voor Ezau, Moab, Ammon en Sihon en de genoemde reisduur.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebieden en doortocht</text><text x="44" y="113" class="ref">Deuteronomium 2:1–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Seïr en Ezau</text><text x="68" y="241" class="body">Geen strijd of landinname; voedsel en</text><text x="68" y="284" class="body">water kopen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Moab en Lot</text><text x="68" y="433" class="body">Ar is aan Lots nakomelingen gegeven;</text><text x="68" y="476" class="body">geen strijd beginnen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ammon en Lot</text><text x="68" y="625" class="body">Hun gebied ontzien; niet in bezit</text><text x="68" y="668" class="body">nemen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Sihon en Hesbon</text><text x="68" y="817" class="body">Vredesvoorstel, weigering, strijd bij</text><text x="68" y="860" class="body">Jahaz en landinname.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De genoemde duur</text><text x="68" y="1009" class="body">Van Kades-Barnea tot de Zered: 38 jaar.</text><text x="46" y="1102" class="note">De drie te ontziene gebieden worden niet verward</text><text x="46" y="1138" class="note">met Sihons gebied.</text></svg>