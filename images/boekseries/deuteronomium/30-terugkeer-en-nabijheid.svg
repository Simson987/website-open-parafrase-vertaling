<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Terugkeer en het nabije woord</title><desc id="desc">De samenhang van terugkeer, innerlijke verandering, het nabije woord en de keuze voor het leven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Terugkeer en het nabije woord</text><text x="44" y="113" class="ref">Deuteronomium 30:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Terugdenken en terugkeren</text><text x="68" y="241" class="body">In de verstrooiing ter harte nemen,</text><text x="68" y="284" class="body">omkeren en luisteren.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De beloofde verzameling</text><text x="68" y="433" class="body">God verzamelt uit de verstrooiing en</text><text x="68" y="476" class="body">brengt terug naar het land.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het hart</text><text x="68" y="625" class="body">De besnijdenis van het hart is</text><text x="68" y="668" class="body">beeldspraak voor innerlijke toewijding.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het woord is nabij</text><text x="68" y="817" class="body">Niet in de hemel of overzee: in mond en</text><text x="68" y="860" class="body">hart om het te doen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De voorgelegde keuze</text><text x="68" y="1009" class="body">Leven en goed tegenover dood en kwaad;</text><text x="68" y="1052" class="body">liefhebben, luisteren en vasthouden.</text><text x="46" y="1145" class="note">De terugkeer is een belofte in de toespraak; het</text><text x="46" y="1181" class="note">hartsbeeld wordt niet als lichamelijk tafereel</text><text x="46" y="1217" class="note">getekend.</text></svg>