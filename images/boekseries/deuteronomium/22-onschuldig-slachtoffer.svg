<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Geen schuld bij het slachtoffer</title><desc id="desc">De expliciete onschuld van het meisje in het in vers 25–27 beschreven geval.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geen schuld bij het slachtoffer</text><text x="44" y="113" class="ref">Deuteronomium 22:25–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het beschreven geval</text><text x="68" y="241" class="body">Een verloofd meisje wordt in het veld</text><text x="68" y="284" class="body">met geweld overmeesterd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De dader</text><text x="68" y="433" class="body">De tekst legt de schuld bij de man die</text><text x="68" y="476" class="body">haar overmeestert.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het meisje</text><text x="68" y="625" class="body">Haar niets aandoen: zij heeft geen</text><text x="68" y="668" class="body">zonde begaan die de dood verdient.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De vergelijking</text><text x="68" y="817" class="body">De tekst vergelijkt de daad met een</text><text x="68" y="860" class="body">aanval waarbij iemand zijn naaste</text><text x="68" y="903" class="body">doodt.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De reden in vers 27</text><text x="68" y="1052" class="body">Zij riep om hulp, maar er was niemand</text><text x="68" y="1095" class="body">die haar redde.</text><text x="46" y="1188" class="note">Een beschrijvende leeswijzer bij dit specifieke</text><text x="46" y="1224" class="note">historische rechtsgeval, zonder geweldsbeeld.</text></svg>