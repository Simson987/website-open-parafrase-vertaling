<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Nieuwe platen en dienst</title><desc id="desc">Nieuwe platen, de dienst van Levi en de opdrachten tot liefde, recht en gehoorzaamheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nieuwe platen en dienst</text><text x="44" y="113" class="ref">Deuteronomium 10:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nieuwe platen</text><text x="68" y="241" class="body">Mozes hakt twee platen; de tien woorden</text><text x="68" y="284" class="body">worden opnieuw geschreven en in de</text><text x="68" y="327" class="body">houten ark gelegd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Levi</text><text x="68" y="476" class="body">De ark dragen, dienen en zegenen; de</text><text x="68" y="519" class="body">HEERE is hun erfdeel.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wat gevraagd wordt</text><text x="68" y="668" class="body">Vrezen, zijn wegen gaan, liefhebben,</text><text x="68" y="711" class="body">dienen en de geboden houden.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Recht en liefde</text><text x="68" y="860" class="body">De tekst noemt wees, weduwe en</text><text x="68" y="903" class="body">vreemdeling; geen partijdigheid of</text><text x="68" y="946" class="body">omkoping.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De vreemdeling</text><text x="68" y="1095" class="body">Liefhebben, omdat Israël zelf</text><text x="68" y="1138" class="body">vreemdeling in Egypte was.</text><text x="46" y="1231" class="note">De lichamelijke woorden over het hart in vers 16</text><text x="46" y="1267" class="note">zijn beeldspraak over niet langer koppig zijn.</text></svg>