<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">De stamzegen — eerste deel</title><desc id="desc">De eerste vijf genoemde stammen in de zegen, met de eigen onderwerpen en versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De stamzegen — eerste deel</text><text x="44" y="113" class="ref">Deuteronomium 33:6–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben · vers 6</text><text x="68" y="241" class="body">Leven, niet sterven en talrijke mannen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Juda · vers 7</text><text x="68" y="390" class="body">Gehoord worden, terugkeer en hulp</text><text x="68" y="433" class="body">tegenover vijanden.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Levi · vers 8–11</text><text x="68" y="582" class="body">Urim en Thummim; het verbond bewaren,</text><text x="68" y="625" class="body">wet onderwijzen en offers brengen.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Benjamin · vers 12</text><text x="68" y="774" class="body">Veiligheid en dagelijkse bescherming.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Jozef · vers 13–17</text><text x="68" y="923" class="body">Land, dauw en opbrengst; Efraïm en</text><text x="68" y="966" class="body">Manasse worden afzonderlijk genoemd.</text><text x="46" y="1059" class="note">Dit is de volgorde van de zegen; Simeon krijgt</text><text x="46" y="1095" class="note">in dit hoofdstuk geen afzonderlijke strofe.</text></svg>