<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1376" viewBox="0 0 840 1376" role="img" aria-labelledby="title desc"><title id="title">Drie jaarlijkse feesten</title><desc id="desc">De drie feesten, hun telling of oogstmoment en de breed genoemde deelnemers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1376" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie jaarlijkse feesten</text><text x="44" y="113" class="ref">Deuteronomium 16:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Pascha en ongezuurde broden</text><text x="68" y="241" class="body">In de maand Abib; herinnering aan de</text><text x="68" y="284" class="body">nachtelijke uittocht en zeven dagen</text><text x="68" y="327" class="body">ongezuurd brood.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wekenfeest</text><text x="68" y="476" class="body">Zeven weken tellen vanaf het begin van</text><text x="68" y="519" class="body">de graanoogst; een vrijwillige gave</text><text x="68" y="562" class="body">naar draagkracht.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Loofhuttenfeest</text><text x="68" y="711" class="body">Zeven dagen na het binnenhalen van</text><text x="68" y="754" class="body">dorsvloer en wijnpers.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Samen vieren</text><text x="68" y="903" class="body">Gezin, huisgenoten, Leviet,</text><text x="68" y="946" class="body">vreemdeling, wees en weduwe worden</text><text x="68" y="989" class="body">genoemd.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Drie keer verschijnen</text><text x="68" y="1138" class="body">Niet met lege handen; ieder geeft naar</text><text x="68" y="1181" class="body">de ontvangen zegen.</text><text x="46" y="1274" class="note">De timing volgt de oogstverwijzingen van dit</text><text x="46" y="1310" class="note">hoofdstuk; geen moderne kalenderdatums.</text></svg>