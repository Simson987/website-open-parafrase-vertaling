<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Liefde en dagelijks onderwijs</title><desc id="desc">De samenhang tussen liefde, dagelijks onderwijs, herinneringstekenen en het antwoord aan een kind.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Liefde en dagelijks onderwijs</text><text x="44" y="113" class="ref">Deuteronomium 6:4–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin</text><text x="68" y="241" class="body">De HEERE is de enige HEERE; liefhebben</text><text x="68" y="284" class="body">met heel hart, ziel en kracht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De hele dag</text><text x="68" y="433" class="body">Thuis en onderweg, bij gaan liggen en</text><text x="68" y="476" class="body">opstaan over de woorden spreken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zichtbare herinnering</text><text x="68" y="625" class="body">Hand, voorhoofd, deurposten en poorten</text><text x="68" y="668" class="body">worden genoemd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bij voorspoed</text><text x="68" y="817" class="body">Niet vergeten wie uit het slavenhuis</text><text x="68" y="860" class="body">bevrijdde.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Als een kind vraagt</text><text x="68" y="1009" class="body">De ouder vertelt over slavernij,</text><text x="68" y="1052" class="body">bevrijding en de betekenis van de</text><text x="68" y="1095" class="body">voorschriften.</text><text x="46" y="1188" class="note">Een leeswijzer bij onderwijs en herinnering,</text><text x="46" y="1224" class="note">zonder latere vormen van gebruik als voorschrift</text><text x="46" y="1260" class="note">in te vullen.</text></svg>