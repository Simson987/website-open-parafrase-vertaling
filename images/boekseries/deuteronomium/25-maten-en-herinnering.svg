<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Eerlijke maten en herinnering</title><desc id="desc">De afzonderlijke bepalingen over recht, dorsen, eerlijke maten en de herinnering aan Amalek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eerlijke maten en herinnering</text><text x="44" y="113" class="ref">Deuteronomium 25:1–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rechtspraak</text><text x="68" y="241" class="body">De onschuldige vrijspreken; de tekst</text><text x="68" y="284" class="body">stelt ook een bovengrens aan</text><text x="68" y="327" class="body">lijfstraffen.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De dorsende os</text><text x="68" y="476" class="body">Niet muilbanden wanneer hij dorst.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gewicht en maat</text><text x="68" y="625" class="body">Geen twee verschillende gewichten of</text><text x="68" y="668" class="body">maten gebruiken; eerlijk en volledig</text><text x="68" y="711" class="body">meten.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Amalek herinneren</text><text x="68" y="860" class="body">De tekst herinnert aan de aanval op</text><text x="68" y="903" class="body">vermoeide achterblijvers bij de</text><text x="68" y="946" class="body">uittocht.</text><text x="46" y="1039" class="note">Deze onderdelen staan naast elkaar; het schema</text><text x="46" y="1075" class="note">maakt er geen doorlopend tafereel van.</text></svg>