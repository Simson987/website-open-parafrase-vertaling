<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Iedere zeven jaar voorlezen</title><desc id="desc">De termijn, het feest, de deelnemers en het doel van de wetlezing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Iedere zeven jaar voorlezen</text><text x="44" y="113" class="ref">Deuteronomium 31:9–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wanneer?</text><text x="68" y="241" class="body">Aan het eind van elke zeven jaar, in</text><text x="68" y="284" class="body">het jaar van kwijtschelding.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Welk feest?</text><text x="68" y="433" class="body">Tijdens het loofhuttenfeest, op de</text><text x="68" y="476" class="body">gekozen plaats.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wie luisteren?</text><text x="68" y="625" class="body">Mannen, vrouwen, kinderen en de</text><text x="68" y="668" class="body">vreemdelingen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Waarom?</text><text x="68" y="817" class="body">Horen, leren vrezen en de woorden van</text><text x="68" y="860" class="body">de wet doen; ook de kinderen leren</text><text x="68" y="903" class="body">luisteren.</text><text x="46" y="996" class="note">De scène illustreert de voorgeschreven</text><text x="46" y="1032" class="note">toekomstige samenkomst.</text></svg>