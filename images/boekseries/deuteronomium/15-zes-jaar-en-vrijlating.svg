<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Zes jaar en de vrijlating</title><desc id="desc">De zes dienstjaren, de vrijlating met middelen en de uitzondering voor wie wil blijven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes jaar en de vrijlating</text><text x="44" y="113" class="ref">Deuteronomium 15:12–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voor man én vrouw</text><text x="68" y="241" class="body">De bepaling noemt een Hebreeuwse man of</text><text x="68" y="284" class="body">vrouw.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zes jaar dienst</text><text x="68" y="433" class="body">In het zevende jaar vrijlaten.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Niet met lege handen</text><text x="68" y="582" class="body">Ruim meegeven uit kudde, dorsvloer en</text><text x="68" y="625" class="body">wijnpers.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Als iemand wil blijven</text><text x="68" y="774" class="body">De tekst kent ook een afzonderlijke</text><text x="68" y="817" class="body">regeling voor blijvende dienst.</text><text x="46" y="910" class="note">De algemene vrijlating en de uitzondering worden</text><text x="46" y="946" class="note">apart gehouden; lichamelijke handelingen worden</text><text x="46" y="982" class="note">niet afgebeeld.</text></svg>