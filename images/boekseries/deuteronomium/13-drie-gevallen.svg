<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Drie gevallen van verleiding</title><desc id="desc">De drie besproken gevallen en de nadruk op zorgvuldig onderzoek van een bericht over een stad.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie gevallen van verleiding</text><text x="44" y="113" class="ref">Deuteronomium 13:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Profeet of dromer</text><text x="68" y="241" class="body">Zelfs een uitgekomen teken maakt een</text><text x="68" y="284" class="body">oproep tot andere goden niet</text><text x="68" y="327" class="body">betrouwbaar.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Naaste of vriend</text><text x="68" y="476" class="body">De tekst bespreekt ook verleiding door</text><text x="68" y="519" class="body">een vertrouwd persoon.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Een bericht over een stad</text><text x="68" y="668" class="body">Eerst onderzoeken, uitzoeken en goed</text><text x="68" y="711" class="body">navragen of het bericht vaststaat.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De gezamenlijke kern</text><text x="68" y="860" class="body">Trouw aan de HEERE; de tekst noemt bij</text><text x="68" y="903" class="body">de gevallen verschillende straffen.</text><text x="46" y="996" class="note">Een beschrijvende leeswijzer bij historische</text><text x="46" y="1032" class="note">religieuze rechtstekst; straffen worden niet</text><text x="46" y="1068" class="note">afgebeeld.</text></svg>