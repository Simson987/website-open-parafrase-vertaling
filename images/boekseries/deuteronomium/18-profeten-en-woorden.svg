<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Profeten en hun woorden</title><desc id="desc">De belofte van een profeet en de beschreven toets op uitgesproken woorden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Profeten en hun woorden</text><text x="44" y="113" class="ref">Deuteronomium 18:9–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet de genoemde waarzeggerij</text><text x="68" y="241" class="body">Het hoofdstuk sluit de opgesomde</text><text x="68" y="284" class="body">occulte praktijken uit.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De beloofde profeet</text><text x="68" y="433" class="body">Uit de broeders, zoals Mozes; Gods</text><text x="68" y="476" class="body">woorden in zijn mond.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De opdracht</text><text x="68" y="625" class="body">Luisteren naar de woorden die in Gods</text><text x="68" y="668" class="body">naam worden gesproken.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Een toets in de tekst</text><text x="68" y="817" class="body">Komt een in de naam van de HEERE</text><text x="68" y="860" class="body">gesproken woord niet uit, dan heeft de</text><text x="68" y="903" class="body">HEERE het niet gesproken.</text><text x="46" y="996" class="note">De toets wordt gelezen naast Deuteronomium 13,</text><text x="46" y="1032" class="note">waar een teken tot afval kan verleiden.</text></svg>