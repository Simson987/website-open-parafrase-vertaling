<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Recht zonder omkoping</title><desc id="desc">De opdracht aan rechters en het verbod op partijdigheid en omkoping.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Recht zonder omkoping</text><text x="44" y="113" class="ref">Deuteronomium 16:18–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In de steden</text><text x="68" y="241" class="body">Rechters en bestuurders aanstellen voor</text><text x="68" y="284" class="body">de stammen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De opdracht</text><text x="68" y="433" class="body">Eerlijk rechtspreken, het recht niet</text><text x="68" y="476" class="body">buigen en geen partij kiezen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Geen omkoopgeld</text><text x="68" y="625" class="body">De tekst verbindt omkoping met</text><text x="68" y="668" class="body">blindheid van wijzen en verdraaide</text><text x="68" y="711" class="body">woorden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De afsluiting</text><text x="68" y="860" class="body">Gerechtigheid nastreven; geen gewijde</text><text x="68" y="903" class="body">paal of heilige steen naast het altaar.</text><text x="46" y="996" class="note">Een leeswijzer bij de overgang van feestregels</text><text x="46" y="1032" class="note">naar rechtspraak en eredienst.</text></svg>