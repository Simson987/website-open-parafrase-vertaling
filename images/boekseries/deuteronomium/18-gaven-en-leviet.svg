<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Gaven en de komende Leviet</title><desc id="desc">De priesterlijke delen en het gelijke aandeel van een vrijwillig komende Leviet.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gaven en de komende Leviet</text><text x="44" y="113" class="ref">Deuteronomium 18:1–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geen stamgebied als erfdeel</text><text x="68" y="241" class="body">De HEERE zelf is het erfdeel van Levi.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De genoemde offerdelen</text><text x="68" y="390" class="body">Schouder, beide kaken en maag worden</text><text x="68" y="433" class="body">aan de priester gegeven.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De eerste opbrengst</text><text x="68" y="582" class="body">Koren, nieuwe wijn, olie en de eerste</text><text x="68" y="625" class="body">wol.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Een Leviet komt vrijwillig</text><text x="68" y="774" class="body">Hij mag op de gekozen plaats dienen en</text><text x="68" y="817" class="body">krijgt een gelijk deel te eten.</text><text x="46" y="910" class="note">De voedsel- en dienstregeling staan naast</text><text x="46" y="946" class="note">elkaar; er worden geen slachtbeelden gemaakt.</text></svg>