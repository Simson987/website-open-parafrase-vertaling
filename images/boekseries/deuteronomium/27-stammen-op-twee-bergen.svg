<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Stammen op de twee bergen</title><desc id="desc">De twaalf stammen verdeeld over Gerizim en Ebal volgens Deuteronomium 27.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stammen op de twee bergen</text><text x="44" y="113" class="ref">Deuteronomium 27:11–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gerizim — voor de zegen</text><text x="68" y="241" class="body">Simeon · Levi · Juda · Issaschar ·</text><text x="68" y="284" class="body">Jozef · Benjamin</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ebal — voor de vloek</text><text x="68" y="433" class="body">Ruben · Gad · Aser · Zebulon · Dan ·</text><text x="68" y="476" class="body">Nafthali</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De Levieten</text><text x="68" y="625" class="body">Spreken de daaropvolgende woorden luid</text><text x="68" y="668" class="body">tot alle mannen van Israël.</text><text x="46" y="761" class="note">De verdeling volgt precies de zes namen per berg</text><text x="46" y="797" class="note">in vers 12 en 13; geen geografische afstand</text><text x="46" y="833" class="note">wordt gesuggereerd.</text></svg>