<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Getuigen en de grenspaal</title><desc id="desc">De grensregel en de procedure bij getuigenissen en valse beschuldiging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Getuigen en de grenspaal</text><text x="44" y="113" class="ref">Deuteronomium 19:14–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De grenspaal</text><text x="68" y="241" class="body">Niet verzetten wat de voorouders hebben</text><text x="68" y="284" class="body">geplaatst.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vaststelling van een zaak</text><text x="68" y="433" class="body">Twee of drie getuigen; één getuige is</text><text x="68" y="476" class="body">niet genoeg.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bij verdenking van vals getuigen</text><text x="68" y="625" class="body">Beide partijen verschijnen voor</text><text x="68" y="668" class="body">priesters en rechters.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Grondig onderzoek</text><text x="68" y="817" class="body">De rechters zoeken uit of de</text><text x="68" y="860" class="body">beschuldiging vals is.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het beginsel</text><text x="68" y="1009" class="body">De bedoelde straf keert volgens de</text><text x="68" y="1052" class="body">tekst tegen de valse getuige terug.</text><text x="46" y="1145" class="note">Een beschrijving van de historische</text><text x="46" y="1181" class="note">rechtsregels, zonder strafuitvoering.</text></svg>