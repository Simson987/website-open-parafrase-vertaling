<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">Wie staan voor het verbond?</title><desc id="desc">De genoemde deelnemers en de uitdrukkelijke uitbreiding tot wie niet aanwezig zijn.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie staan voor het verbond?</text><text x="44" y="113" class="ref">Deuteronomium 29:10–15</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De genoemde leiders</text><text x="68" y="241" class="body">Stamhoofden, oudsten en bestuurders.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De hele gemeenschap</text><text x="68" y="390" class="body">Mannen, vrouwen en kinderen.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">De vreemdeling in het kamp</text><text x="68" y="539" class="body">Van de houthakker tot de waterdrager.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Ook wie er niet staan</text><text x="68" y="688" class="body">Het verbond wordt ook betrokken op wie</text><text x="68" y="731" class="body">op dat moment niet aanwezig zijn.</text><text x="46" y="824" class="note">De brede opsomming vormt één gemeenschap;</text><text x="46" y="860" class="note">kleding of uiterlijk bepalen geen afzonderlijke</text><text x="46" y="896" class="note">rang.</text></svg>