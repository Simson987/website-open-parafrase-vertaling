<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De latere vraag over het land</title><desc id="desc">De vraag van latere bezoekers, het antwoord en het onderscheid tussen verborgen en geopenbaard.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De latere vraag over het land</text><text x="44" y="113" class="ref">Deuteronomium 29:22–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie zullen vragen?</text><text x="68" y="241" class="body">Een volgend geslacht en vreemdelingen</text><text x="68" y="284" class="body">uit een ver land.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wat zien zij in de waarschuwing?</text><text x="68" y="433" class="body">Een onvruchtbaar land van zwavel en</text><text x="68" y="476" class="body">zout.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vraag</text><text x="68" y="625" class="body">Waarom heeft de HEERE dit land zo</text><text x="68" y="668" class="body">behandeld?</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het gegeven antwoord</text><text x="68" y="817" class="body">Het verbond verlaten en andere goden</text><text x="68" y="860" class="body">dienen; verbanning wordt genoemd.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De slotzin</text><text x="68" y="1009" class="body">Het verborgene behoort aan de HEERE;</text><text x="68" y="1052" class="body">het geopenbaarde aan ons en onze</text><text x="68" y="1095" class="body">kinderen om te doen.</text><text x="46" y="1188" class="note">Een toekomstgerichte waarschuwing met vraag en</text><text x="46" y="1224" class="note">antwoord; geen naam van een later rijk wordt</text><text x="46" y="1260" class="note">toegevoegd.</text></svg>