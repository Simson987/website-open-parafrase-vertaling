<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">De beschreven zwagerplicht</title><desc id="desc">De aanleiding, de functie van de eerste zoon en de procedure bij weigering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De beschreven zwagerplicht</text><text x="44" y="113" class="ref">Deuteronomium 25:5–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het genoemde geval</text><text x="68" y="241" class="body">Broers wonen samen; één sterft zonder</text><text x="68" y="284" class="body">zoon.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het voorstel van de tekst</text><text x="68" y="433" class="body">Zijn broer neemt de weduwe tot vrouw;</text><text x="68" y="476" class="body">de eerste zoon zet de naam van de</text><text x="68" y="519" class="body">overledene voort.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Als de broer weigert</text><text x="68" y="668" class="body">De weduwe spreekt de oudsten bij de</text><text x="68" y="711" class="body">poort aan.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De openbare procedure</text><text x="68" y="860" class="body">Oudsten spreken met hem; bij blijvende</text><text x="68" y="903" class="body">weigering volgt het genoemde</text><text x="68" y="946" class="body">schoenritueel.</text><text x="46" y="1039" class="note">Een beschrijving van het specifieke historische</text><text x="46" y="1075" class="note">familie- en erfrecht, zonder verzonnen namen.</text></svg>