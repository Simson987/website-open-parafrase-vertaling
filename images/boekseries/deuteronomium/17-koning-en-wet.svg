<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De koning onder de wet</title><desc id="desc">De voorwaarden en beperkingen van de koning en de functie van zijn wetafschrift.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De koning onder de wet</text><text x="44" y="113" class="ref">Deuteronomium 17:14–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie koning mag zijn</text><text x="68" y="241" class="body">De HEERE kiest; iemand uit de eigen</text><text x="68" y="284" class="body">broeders, geen buitenlander.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Geen ophoping</text><text x="68" y="433" class="body">Niet veel paarden, vrouwen, zilver of</text><text x="68" y="476" class="body">goud voor zichzelf verzamelen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Een eigen afschrift</text><text x="68" y="625" class="body">De wet overschrijven uit het boek bij</text><text x="68" y="668" class="body">de Levitische priesters.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Levenslang lezen</text><text x="68" y="817" class="body">Leren vrezen en de woorden en</text><text x="68" y="860" class="body">voorschriften doen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Niet boven zijn broeders</text><text x="68" y="1009" class="body">Geen verheven hart en niet van het</text><text x="68" y="1052" class="body">gebod afwijken.</text><text x="46" y="1145" class="note">De tekst beperkt het koningschap; rijkdom en</text><text x="46" y="1181" class="note">aantallen worden niet als ideaal verbeeld.</text></svg>