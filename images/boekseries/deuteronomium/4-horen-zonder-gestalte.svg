<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Horen zonder een gestalte</title><desc id="desc">Het verband tussen herinneren, de woorden bij Horeb, het verbond en de waarschuwing tegen beelden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Horen zonder een gestalte</text><text x="44" y="113" class="ref">Deuteronomium 4:9–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herinneren en doorgeven</text><text x="68" y="241" class="body">Wat gezien is niet vergeten; aan</text><text x="68" y="284" class="body">kinderen en kleinkinderen vertellen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij Horeb</text><text x="68" y="433" class="body">Het volk hoort woorden uit het vuur,</text><text x="68" y="476" class="body">maar ziet geen gestalte.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het verbond</text><text x="68" y="625" class="body">De tien woorden op twee stenen platen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De waarschuwing</text><text x="68" y="774" class="body">Geen godenbeelden maken of</text><text x="68" y="817" class="body">hemellichamen dienen.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Zoeken en terugkeren</text><text x="68" y="966" class="body">Ook na verstrooiing de HEERE zoeken met</text><text x="68" y="1009" class="body">heel hart en ziel; zijn verbond blijft</text><text x="68" y="1052" class="body">genoemd.</text><text x="46" y="1145" class="note">De stem wordt niet als een menselijk lichaam in</text><text x="46" y="1181" class="note">het vuur afgebeeld.</text></svg>