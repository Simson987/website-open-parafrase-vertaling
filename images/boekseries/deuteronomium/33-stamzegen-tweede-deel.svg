<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1439" viewBox="0 0 840 1439" role="img" aria-labelledby="title desc"><title id="title">De stamzegen — tweede deel</title><desc id="desc">De tweede helft van de stamzegen en de gezamenlijke afsluiting.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1439" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De stamzegen — tweede deel</text><text x="44" y="113" class="ref">Deuteronomium 33:18–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zebulon en Issaschar</text><text x="68" y="241" class="body">Vers 18–19: vreugde bij uittrekken en</text><text x="68" y="284" class="body">in tenten; rijkdom van zee en zand.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gad</text><text x="68" y="433" class="body">Vers 20–21: ruimte, het gekozen eerste</text><text x="68" y="476" class="body">deel en optreden met de leiders.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dan</text><text x="68" y="625" class="body">Vers 22: het beeld van een jonge leeuw</text><text x="68" y="668" class="body">uit Basan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nafthali</text><text x="68" y="817" class="body">Vers 23: gunst en zegen; het westen en</text><text x="68" y="860" class="body">zuiden in bezit nemen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Aser</text><text x="68" y="1009" class="body">Vers 24–25: zegen, olie en grendels van</text><text x="68" y="1052" class="body">ijzer en koper.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">De gezamenlijke afsluiting</text><text x="68" y="1201" class="body">Vers 26–29: Gods hulp, toevlucht en de</text><text x="68" y="1244" class="body">veiligheid van Israël.</text><text x="46" y="1337" class="note">Leeuw, olie en eeuwige armen zijn poëtische</text><text x="46" y="1373" class="note">taal; geen gezinsportretten van de stamvaders.</text></svg>