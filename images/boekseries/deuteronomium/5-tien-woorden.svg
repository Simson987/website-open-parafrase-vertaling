<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">De tien woorden: leeswijzer</title><desc id="desc">De inhoud en versgroepen van de tien woorden in Deuteronomium 5.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De tien woorden: leeswijzer</text><text x="44" y="113" class="ref">Deuteronomium 5:6–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verzen 6–10</text><text x="68" y="241" class="body">Bevrijding uit Egypte; geen andere</text><text x="68" y="284" class="body">goden en geen beelden dienen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 11</text><text x="68" y="433" class="body">De naam niet misbruiken.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Verzen 12–15</text><text x="68" y="582" class="body">Sabbat voor mensen én vee; herinnering</text><text x="68" y="625" class="body">aan de slavernij in Egypte.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Verzen 16–20</text><text x="68" y="774" class="body">Ouders eren; geen moord, overspel,</text><text x="68" y="817" class="body">diefstal of valse getuigenis.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Vers 21</text><text x="68" y="966" class="body">Niet verlangen naar wat bij de naaste</text><text x="68" y="1009" class="body">hoort.</text><text x="46" y="1102" class="note">De verwijzingen volgen de tekst zonder een</text><text x="46" y="1138" class="note">traditiegebonden nummering van de geboden op te</text><text x="46" y="1174" class="note">leggen.</text></svg>