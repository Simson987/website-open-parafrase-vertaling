<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Leiders en rechtspraak</title><desc id="desc">De verschillende groepsgroottes en de route van moeilijke rechtszaken naar Mozes.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leiders en rechtspraak</text><text x="44" y="113" class="ref">Deuteronomium 1:9–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gedeelde verantwoordelijkheid</text><text x="68" y="241" class="body">Wijze, verstandige en ervaren mannen</text><text x="68" y="284" class="body">uit de stammen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Groepen</text><text x="68" y="433" class="body">Leiders over duizend, honderd, vijftig</text><text x="68" y="476" class="body">en tien; daarnaast bestuurders.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Eerlijk luisteren</text><text x="68" y="625" class="body">Kleine en grote partijen horen;</text><text x="68" y="668" class="body">Israëliet en inwonende vreemdeling.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Moeilijke zaken</text><text x="68" y="817" class="body">Aan Mozes voorleggen; hij zal</text><text x="68" y="860" class="body">luisteren.</text><text x="46" y="953" class="note">Dit hoofdstuk vertelt terug hoe de leiders en</text><text x="46" y="989" class="note">rechters werden aangesteld.</text></svg>