<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De belijdenis bij de oogst</title><desc id="desc">De stappen van de belijdenis die de aanbieding van de eerstelingen begeleidt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De belijdenis bij de oogst</text><text x="44" y="113" class="ref">Deuteronomium 26:5–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin</text><text x="68" y="241" class="body">Een Arameeër als vader; met</text><text x="68" y="284" class="body">weinig mensen naar Egypte.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">In Egypte</text><text x="68" y="433" class="body">Een groot volk, maar onderdrukt en</text><text x="68" y="476" class="body">zwaar belast.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het roepen</text><text x="68" y="625" class="body">De HEERE hoort en ziet ellende en</text><text x="68" y="668" class="body">onderdrukking.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De uittocht en het land</text><text x="68" y="817" class="body">Bevrijding en het ontvangen land worden</text><text x="68" y="860" class="body">genoemd.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De eerstelingen</text><text x="68" y="1009" class="body">De eerste opbrengst aanbieden en samen</text><text x="68" y="1052" class="body">met Leviet en vreemdeling blij zijn.</text><text x="46" y="1145" class="note">De geschiedenis wordt in de uitgesproken</text><text x="46" y="1181" class="note">belijdenis herinnerd, niet opnieuw ter plekke</text><text x="46" y="1217" class="note">beleefd.</text></svg>