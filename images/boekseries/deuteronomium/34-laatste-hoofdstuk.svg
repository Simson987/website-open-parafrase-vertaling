<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1439" viewBox="0 0 840 1439" role="img" aria-labelledby="title desc"><title id="title">Mozes en de opvolging</title><desc id="desc">De laatste gebeurtenissen rond Mozes, de rouw en de overgang naar Jozua.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1439" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mozes en de opvolging</text><text x="44" y="113" class="ref">Deuteronomium 34:1–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nebo en Pisga</text><text x="68" y="241" class="body">Mozes ziet het land vanaf de hoogte</text><text x="68" y="284" class="body">tegenover Jericho, maar steekt niet</text><text x="68" y="327" class="body">over.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Sterven en begraven</text><text x="68" y="476" class="body">Hij sterft in Moab; de tekst zegt dat</text><text x="68" y="519" class="body">niemand de plaats van zijn graf weet.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zijn leeftijd</text><text x="68" y="668" class="body">120 jaar; zijn ogen en kracht waren</text><text x="68" y="711" class="body">niet verdwenen.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Dertig dagen rouw</text><text x="68" y="860" class="body">Israël rouwt in de vlakte van Moab.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Jozua</text><text x="68" y="1009" class="body">Vervuld met de geest van wijsheid; het</text><text x="68" y="1052" class="body">volk luistert naar hem.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">De slotgetuigenis</text><text x="68" y="1201" class="body">De tekst benadrukt de uitzonderlijke</text><text x="68" y="1244" class="body">plaats van Mozes en zijn tekenen.</text><text x="46" y="1337" class="note">Er wordt geen grafplaats aangewezen en geen</text><text x="46" y="1373" class="note">zichtbaar grafmonument verzonnen.</text></svg>