<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Drie oostelijke vrijsteden</title><desc id="desc">De drie vrijsteden met hun streek, stam en de genoemde voorwaarde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie oostelijke vrijsteden</text><text x="44" y="113" class="ref">Deuteronomium 4:41–43</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bezer</text><text x="68" y="241" class="body">In de woestijn, op de hoogvlakte; voor</text><text x="68" y="284" class="body">Ruben.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ramoth</text><text x="68" y="433" class="body">In Gilead; voor Gad.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Golan</text><text x="68" y="582" class="body">In Basan; voor Manasse.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De bedoelde toevlucht</text><text x="68" y="731" class="body">Bij onopzettelijk doden, zonder</text><text x="68" y="774" class="body">voorafgaande vijandschap.</text><text x="46" y="867" class="note">Dit hoofdstuk noemt de drie steden aan de</text><text x="46" y="903" class="note">oostkant van de Jordaan.</text></svg>