<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Maaltijd en heilige gave</title><desc id="desc">Het onderscheid tussen dagelijks vlees eten en de heilige gaven op de gekozen plaats.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Maaltijd en heilige gave</text><text x="44" y="113" class="ref">Deuteronomium 12:5–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gewoon vlees in de woonplaats</text><text x="68" y="241" class="body">De tekst staat eten in de eigen steden</text><text x="68" y="284" class="body">toe; rein en onrein mogen samen eten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Heilige gaven en geloften</text><text x="68" y="433" class="body">Meenemen naar de plaats die de HEERE</text><text x="68" y="476" class="body">zal kiezen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gezamenlijke vreugde</text><text x="68" y="625" class="body">Gezin, huisgenoten en de Leviet worden</text><text x="68" y="668" class="body">genoemd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De grens die blijft</text><text x="68" y="817" class="body">Geen bloed eten; de tekst verbindt</text><text x="68" y="860" class="body">bloed met het leven.</text><text x="46" y="953" class="note">De gewone maaltijd en het eten bij de gekozen</text><text x="46" y="989" class="note">plaats zijn verschillende regelingen.</text></svg>