<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Land, regen en de keuze</title><desc id="desc">De vergelijking van de landen en het verband met regen, gehoorzaamheid, Gerizim en Ebal.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Land, regen en de keuze</text><text x="44" y="113" class="ref">Deuteronomium 11:10–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Egypte</text><text x="68" y="241" class="body">De tekst vergelijkt het bevloeien van</text><text x="68" y="284" class="body">een groentetuin met het vroegere land.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het nieuwe land</text><text x="68" y="433" class="body">Bergen en dalen, afhankelijk van regen</text><text x="68" y="476" class="body">uit de hemel.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De genoemde voorwaarde</text><text x="68" y="625" class="body">Liefhebben, dienen en gehoorzamen;</text><text x="68" y="668" class="body">regen, opbrengst en gras worden</text><text x="68" y="711" class="body">toegezegd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Zegen en vloek</text><text x="68" y="860" class="body">Luisteren tegenover afwijken; Gerizim</text><text x="68" y="903" class="body">hoort bij zegen en Ebal bij vloek.</text><text x="46" y="996" class="note">De bergen zijn een voorgeschreven toekomstig</text><text x="46" y="1032" class="note">moment; het hoofdstuk vertelt niet dat het daar</text><text x="46" y="1068" class="note">al is uitgevoerd.</text></svg>