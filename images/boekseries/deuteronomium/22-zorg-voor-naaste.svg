<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Zorg voor mens en dier</title><desc id="desc">Een overzicht van terugbrengen, helpen, vogels sparen en een veilige dakrand.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zorg voor mens en dier</text><text x="44" y="113" class="ref">Deuteronomium 22:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gevonden dieren en spullen</text><text x="68" y="241" class="body">Terugbrengen; is de eigenaar onbekend,</text><text x="68" y="284" class="body">dan bewaren totdat hij ernaar vraagt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Een gevallen lastdier</text><text x="68" y="433" class="body">Samen met de eigenaar helpen het weer</text><text x="68" y="476" class="body">op te richten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Een vogelnest</text><text x="68" y="625" class="body">De moeder laten gaan; moeder en jongen</text><text x="68" y="668" class="body">niet samen meenemen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Een nieuw huis</text><text x="68" y="817" class="body">Een borstwering op het dak maken om een</text><text x="68" y="860" class="body">val te voorkomen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Andere voorschriften</text><text x="68" y="1009" class="body">De tekst noemt ook kleding, menging van</text><text x="68" y="1052" class="body">zaad of stoffen, het span en kwasten.</text><text x="46" y="1145" class="note">De losse bepalingen worden als afzonderlijke</text><text x="46" y="1181" class="note">gevallen gelezen.</text></svg>