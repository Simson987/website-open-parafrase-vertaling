<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De opbouw van het lied</title><desc id="desc">De structuur van het lied en de daaropvolgende oproep aan de hoorders.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De opbouw van het lied</text><text x="44" y="113" class="ref">Deuteronomium 32:1–47</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 1–14</text><text x="68" y="241" class="body">Hemel en aarde aangesproken; Gods trouw</text><text x="68" y="284" class="body">en zorg worden bezongen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 15–18</text><text x="68" y="433" class="body">Jesuruns overvloed gaat over in ontrouw</text><text x="68" y="476" class="body">en het vergeten van de Rots.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vers 19–35</text><text x="68" y="625" class="body">Oordeel, vijanden en gebrek aan inzicht</text><text x="68" y="668" class="body">worden uitgesproken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vers 36–43</text><text x="68" y="817" class="body">Recht doen, ontferming en Gods unieke</text><text x="68" y="860" class="body">macht.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Vers 44–47</text><text x="68" y="1009" class="body">Mozes en Jozua spreken het lied; de</text><text x="68" y="1052" class="body">woorden moeten ter harte worden</text><text x="68" y="1095" class="body">genomen.</text><text x="46" y="1188" class="note">Regen, Rots en arend zijn beelden in een lied.</text><text x="46" y="1224" class="note">Ze worden niet als één historisch tafereel</text><text x="46" y="1260" class="note">samengevoegd.</text></svg>