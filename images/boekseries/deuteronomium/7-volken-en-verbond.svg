<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De volken en het verbond</title><desc id="desc">De zeven volken, de reden van de keuze en de samenhang van trouw, geleidelijkheid en waarschuwing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De volken en het verbond</text><text x="44" y="113" class="ref">Deuteronomium 7:1–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zeven genoemde volken</text><text x="68" y="241" class="body">Hethieten, Girgasieten, Amorieten,</text><text x="68" y="284" class="body">Kanaänieten, Ferezieten, Hevieten en</text><text x="68" y="327" class="body">Jebusieten.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De reden van de keuze</text><text x="68" y="476" class="body">Liefde en de eed aan de voorouders,</text><text x="68" y="519" class="body">niet Israëls grotere aantal.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De genoemde trouw</text><text x="68" y="668" class="body">Verbond en goedheid voor wie Hem</text><text x="68" y="711" class="body">liefhebben en zijn geboden houden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Geleidelijk</text><text x="68" y="860" class="body">De tekst zegt: beetje bij beetje, niet</text><text x="68" y="903" class="body">alles in één keer.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De waarschuwing</text><text x="68" y="1052" class="body">Geen godenbeelden of het goud en zilver</text><text x="68" y="1095" class="body">daaraan tot een valstrik laten worden.</text><text x="46" y="1188" class="note">Een beschrijving van deze historische religieuze</text><text x="46" y="1224" class="note">tekst; verovering en vernietiging worden niet</text><text x="46" y="1260" class="note">afgebeeld.</text></svg>