<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Bescherming en gebruik</title><desc id="desc">De bescherming van een vluchteling en de grenzen bij druiven en koren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bescherming en gebruik</text><text x="44" y="113" class="ref">Deuteronomium 23:15–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een gevluchte slaaf</text><text x="68" y="241" class="body">Niet uitleveren; hij mag een passende</text><text x="68" y="284" class="body">woonplaats kiezen en niet worden</text><text x="68" y="327" class="body">onderdrukt.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Rente</text><text x="68" y="476" class="body">De tekst maakt onderscheid tussen de</text><text x="68" y="519" class="body">volksgenoot en de buitenlander.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Een gelofte</text><text x="68" y="668" class="body">Een gedane gelofte nakomen; geen</text><text x="68" y="711" class="body">gelofte doen is op zichzelf geen zonde.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">In de wijngaard</text><text x="68" y="860" class="body">Wel druiven eten, niet de eigen mand</text><text x="68" y="903" class="body">vullen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">In het koren</text><text x="68" y="1052" class="body">Wel met de hand aren plukken, niet de</text><text x="68" y="1095" class="body">sikkel in andermans koren slaan.</text><text x="46" y="1188" class="note">Gastvrijheid, geloften en het beperkte gebruik</text><text x="46" y="1224" class="note">van andermans oogst zijn afzonderlijke regels.</text></svg>