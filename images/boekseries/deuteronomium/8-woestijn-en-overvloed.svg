<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Woestijn en overvloed</title><desc id="desc">De tegenstelling en samenhang tussen woestijnervaring, overvloed, dankbaarheid en de waarschuwing voor hoogmoed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Woestijn en overvloed</text><text x="44" y="113" class="ref">Deuteronomium 8:2–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De woestijn</text><text x="68" y="241" class="body">Veertig jaar: nederigheid, beproeving,</text><text x="68" y="284" class="body">manna, kleding en water.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het goede land</text><text x="68" y="433" class="body">Water, tarwe, gerst, druiven, vijgen,</text><text x="68" y="476" class="body">granaatappels, olijfolie en honing; ook</text><text x="68" y="519" class="body">ijzer en koper.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Na het eten</text><text x="68" y="668" class="body">De HEERE loven voor het gegeven land.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bij groeiende rijkdom</text><text x="68" y="817" class="body">Huizen, kudden, zilver en goud kunnen</text><text x="68" y="860" class="body">tot vergeten en hoogmoed leiden.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De herinnering</text><text x="68" y="1009" class="body">De kracht om rijkdom te verwerven wordt</text><text x="68" y="1052" class="body">aan de HEERE toegeschreven.</text><text x="46" y="1145" class="note">De overvloed is een landbeschrijving en belofte,</text><text x="46" y="1181" class="note">niet een nieuwe oogstgebeurtenis in het kamp.</text></svg>