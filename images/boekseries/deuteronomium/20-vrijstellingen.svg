<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">Wie mag naar huis?</title><desc id="desc">De vier genoemde vrijstellingen en de daaropvolgende aanstelling van aanvoerders.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie mag naar huis?</text><text x="44" y="113" class="ref">Deuteronomium 20:5–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een nieuw huis</text><text x="68" y="241" class="body">Gebouwd maar nog niet ingewijd.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Een wijngaard</text><text x="68" y="390" class="body">Geplant maar nog niet van geoogst.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Verloofd</text><text x="68" y="539" class="body">Nog niet getrouwd.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Bang en moedeloos</text><text x="68" y="688" class="body">Mag terug, zodat zijn angst de anderen</text><text x="68" y="731" class="body">niet ontmoedigt.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Daarna</text><text x="68" y="880" class="body">De bestuurders stellen legeraanvoerders</text><text x="68" y="923" class="body">aan.</text><text x="46" y="1016" class="note">De vier gronden staan afzonderlijk in de</text><text x="46" y="1052" class="note">toespraak vóór de strijd.</text></svg>