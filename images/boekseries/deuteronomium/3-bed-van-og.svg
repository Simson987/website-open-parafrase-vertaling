<svg xmlns="http://www.w3.org/2000/svg" width="840" height="883" viewBox="0 0 840 883" role="img" aria-labelledby="title desc"><title id="title">Het bed van Og</title><desc id="desc">De twee afmetingen, het materiaal en de plaats van Ogs bed volgens de plaatselijke vertaling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="883" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het bed van Og</text><text x="44" y="113" class="ref">Deuteronomium 3:11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Materiaal</text><text x="68" y="241" class="body">De tekst noemt een bed van ijzer.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De genoemde lengte</text><text x="68" y="390" class="body">Ongeveer vier meter.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">De genoemde breedte</text><text x="68" y="539" class="body">Ongeveer 1,8 meter.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">De genoemde plaats</text><text x="68" y="688" class="body">Rabba van de Ammonieten.</text><text x="46" y="781" class="note">De maten horen bij het bed; daaruit wordt geen</text><text x="46" y="817" class="note">exacte lichaamslengte van Og berekend.</text></svg>