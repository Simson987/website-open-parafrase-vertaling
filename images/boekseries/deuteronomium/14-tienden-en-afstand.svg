<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Tienden en de lange reis</title><desc id="desc">De regeling bij grote afstand en de bijzondere plaatselijke tiende in het derde jaar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tienden en de lange reis</text><text x="44" y="113" class="ref">Deuteronomium 14:22–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Elk jaar</text><text x="68" y="241" class="body">Een tiende van de veldopbrengst; eten</text><text x="68" y="284" class="body">bij de gekozen plaats.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Als de weg te lang is</text><text x="68" y="433" class="body">Opbrengst verkopen, het geld meenemen</text><text x="68" y="476" class="body">en op de bestemming voedsel kopen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De Leviet</text><text x="68" y="625" class="body">Niet in de steek laten; hij heeft geen</text><text x="68" y="668" class="body">eigen erfdeel.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Elk derde jaar</text><text x="68" y="817" class="body">De tiende in de eigen woonplaats</text><text x="68" y="860" class="body">bijeenbrengen voor Leviet, vreemdeling,</text><text x="68" y="903" class="body">wees en weduwe.</text><text x="46" y="996" class="note">Jaarlijkse maaltijd en plaatselijke voorziening</text><text x="46" y="1032" class="note">in het derde jaar worden onderscheiden.</text></svg>