<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Zegen en waarschuwing</title><desc id="desc">De opbouw van de zegen en de uitvoerige waarschuwingen, met onderscheid tussen toespraak en gebeurtenis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zegen en waarschuwing</text><text x="44" y="113" class="ref">Deuteronomium 28:1–68</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 1–14: de zegen</text><text x="68" y="241" class="body">Gehoorzamen: stad en veld, gezin en</text><text x="68" y="284" class="body">oogst, voorraad, regen en veiligheid.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 15–19: de omkering</text><text x="68" y="433" class="body">Dezelfde dagelijkse gebieden keren</text><text x="68" y="476" class="body">terug onder de vloek bij</text><text x="68" y="519" class="body">ongehoorzaamheid.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vers 20–48: ontregeling</text><text x="68" y="668" class="body">Ziekte, droogte, misoogst, onveiligheid</text><text x="68" y="711" class="body">en afhankelijkheid.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vers 49–57: belegering</text><text x="68" y="860" class="body">Een vijand van ver, benauwing en</text><text x="68" y="903" class="body">extreme honger.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Vers 58–68: verstrooiing</text><text x="68" y="1052" class="body">Afname van het volk, verspreiding en</text><text x="68" y="1095" class="body">angst zonder rust.</text><text x="46" y="1188" class="note">Dit zijn voorwaardelijke toezeggingen en</text><text x="46" y="1224" class="note">waarschuwingen in de toespraak, geen verslag van</text><text x="46" y="1260" class="note">al voltrokken gebeurtenissen.</text></svg>