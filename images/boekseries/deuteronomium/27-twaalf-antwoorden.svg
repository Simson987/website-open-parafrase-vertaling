<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Twaalf keer antwoord: amen</title><desc id="desc">Een op verzen controleerbaar overzicht van de twaalf uitspraken en het antwoord van het volk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twaalf keer antwoord: amen</text><text x="44" y="113" class="ref">Deuteronomium 27:15–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 15–17</text><text x="68" y="241" class="body">Verborgen afgodsbeeld · ouders</text><text x="68" y="284" class="body">verachten · grenspaal verzetten.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 18–20</text><text x="68" y="433" class="body">Een blinde misleiden · recht van</text><text x="68" y="476" class="body">kwetsbaren buigen · de vrouw van de</text><text x="68" y="519" class="body">vader nemen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vers 21–23</text><text x="68" y="668" class="body">Gemeenschap met een dier · een zuster ·</text><text x="68" y="711" class="body">een schoonmoeder.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vers 24–26</text><text x="68" y="860" class="body">Verborgen moord · omkoopgeld voor moord</text><text x="68" y="903" class="body">op een onschuldige · de wet niet doen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het antwoord</text><text x="68" y="1052" class="body">Na elke uitspraak antwoordt het hele</text><text x="68" y="1095" class="body">volk: amen.</text><text x="46" y="1188" class="note">De twaalf uitspraken zijn per vers gegroepeerd;</text><text x="46" y="1224" class="note">lichamelijke handelingen en geweld worden niet</text><text x="46" y="1260" class="note">afgebeeld.</text></svg>