<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Wet en lied als getuigen</title><desc id="desc">Het verschillende vastleggen van lied en wetboek en de functie van beide als getuige.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wet en lied als getuigen</text><text x="44" y="113" class="ref">Deuteronomium 31:19–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het lied opschrijven</text><text x="68" y="241" class="body">Mozes schrijft het die dag op en leert</text><text x="68" y="284" class="body">het de Israëlieten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Van buiten kennen</text><text x="68" y="433" class="body">Het lied blijft bekend bij de</text><text x="68" y="476" class="body">nakomelingen en zal tegen hen getuigen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De wet afronden</text><text x="68" y="625" class="body">Mozes schrijft de woorden van de wet</text><text x="68" y="668" class="body">volledig op.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Naast de ark</text><text x="68" y="817" class="body">Het wetboek komt naast de ark als</text><text x="68" y="860" class="body">getuige, niet in de ark.</text><text x="46" y="953" class="note">De plaats van het wetboek is uitdrukkelijk naast</text><text x="46" y="989" class="note">de ark; het lied en het wetboek worden</text><text x="46" y="1025" class="note">onderscheiden.</text></svg>