<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Bij een onbekende dader</title><desc id="desc">De volgorde van onderzoek, vaststelling van de dichtstbijzijnde stad en verklaring.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bij een onbekende dader</text><text x="44" y="113" class="ref">Deuteronomium 21:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De uitgangssituatie</text><text x="68" y="241" class="body">Een dode is in het veld gevonden;</text><text x="68" y="284" class="body">niemand weet wie hem heeft gedood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De afstand vaststellen</text><text x="68" y="433" class="body">Oudsten en rechters meten naar de</text><text x="68" y="476" class="body">omliggende steden.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De dichtstbijzijnde stad</text><text x="68" y="625" class="body">Haar oudsten handelen volgens het</text><text x="68" y="668" class="body">genoemde ritueel; de Levitische</text><text x="68" y="711" class="body">priesters komen erbij.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De verklaring en het gebed</text><text x="68" y="860" class="body">De oudsten verklaren hun onschuld en</text><text x="68" y="903" class="body">vragen verzoening voor het volk.</text><text x="46" y="996" class="note">Een procedureoverzicht; dood lichaam en</text><text x="46" y="1032" class="note">dierenritueel worden niet afgebeeld.</text></svg>