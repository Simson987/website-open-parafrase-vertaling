<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Oostelijke erfdelen</title><desc id="desc">De toewijzing van de oostelijke erfdelen en de verplichting om de andere stammen te helpen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oostelijke erfdelen</text><text x="44" y="113" class="ref">Deuteronomium 3:8–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De veroverde streek</text><text x="68" y="241" class="body">Van de Arnon tot de Hermon, met Gilead</text><text x="68" y="284" class="body">en Basan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ruben en Gad</text><text x="68" y="433" class="body">Gebied vanaf Aroër en een deel van</text><text x="68" y="476" class="body">Gilead, met de genoemde grenzen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Halve stam Manasse</text><text x="68" y="625" class="body">Overig Gilead en Basan; Machir en Jaïr</text><text x="68" y="668" class="body">krijgen afzonderlijke vermeldingen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De gezamenlijke opdracht</text><text x="68" y="817" class="body">Strijdbare mannen gaan mee tot ook hun</text><text x="68" y="860" class="body">broers rust en een erfdeel hebben.</text><text x="46" y="953" class="note">Tekstueel gebiedsoverzicht; geen onbevestigde</text><text x="46" y="989" class="note">moderne grenslijnen.</text></svg>