<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De terugblik op Kades</title><desc id="desc">De opeenvolgende keuzes en gevolgen in de terugblik op Kades-Barnea.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De terugblik op Kades</text><text x="44" y="113" class="ref">Deuteronomium 1:19–46</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verkenning</text><text x="68" y="241" class="body">Twaalf mannen brengen vruchten en een</text><text x="68" y="284" class="body">goed verslag.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Weigering</text><text x="68" y="433" class="body">Gemopper en angst leiden tot niet</text><text x="68" y="476" class="body">optrekken.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De uitspraak</text><text x="68" y="625" class="body">De genoemde generatie keert om; Kaleb,</text><text x="68" y="668" class="body">Jozua en de kinderen krijgen een eigen</text><text x="68" y="711" class="body">plaats in het vervolg.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Daarna eigenmachtig optrekken</text><text x="68" y="860" class="body">Ondanks de waarschuwing gaan zij toch;</text><text x="68" y="903" class="body">zij worden verslagen en keren terug.</text><text x="46" y="996" class="note">De verkenning, de weigering en de latere opmars</text><text x="46" y="1032" class="note">zijn verschillende fasen.</text></svg>