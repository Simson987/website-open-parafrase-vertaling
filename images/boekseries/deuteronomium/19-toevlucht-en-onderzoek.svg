<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Toevlucht en onderzoek</title><desc id="desc">De voorwaarden, bereikbaarheid en onderzoeksvraag bij de drie vrijsteden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toevlucht en onderzoek</text><text x="44" y="113" class="ref">Deuteronomium 19:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie steden</text><text x="68" y="241" class="body">Wegen voorbereiden en het land in drie</text><text x="68" y="284" class="body">gebieden indelen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het genoemde ongeval</text><text x="68" y="433" class="body">Een bijlkop schiet los zonder eerdere</text><text x="68" y="476" class="body">vijandschap; de doodslager mag</text><text x="68" y="519" class="body">vluchten.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Waarom bereikbaarheid telt</text><text x="68" y="668" class="body">Een te lange weg kan hem aan de</text><text x="68" y="711" class="body">bloedwreker blootstellen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bij uitbreiding van het gebied</text><text x="68" y="860" class="body">Nog drie steden aanwijzen volgens de</text><text x="68" y="903" class="body">genoemde voorwaarde.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Bij opzettelijke vijandschap</text><text x="68" y="1052" class="body">De tekst behandelt dit anders; de</text><text x="68" y="1095" class="body">vrijstad is geen vrijstelling van</text><text x="68" y="1138" class="body">onderzoek.</text><text x="46" y="1231" class="note">De onbedoelde en opzettelijke gevallen worden</text><text x="46" y="1267" class="note">niet samengevoegd.</text></svg>