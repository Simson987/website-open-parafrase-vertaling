<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Pand, inkomen en dagloon</title><desc id="desc">Het verband tussen onderpand, bestaansmiddelen, tijdige betaling en kwetsbare mensen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Pand, inkomen en dagloon</text><text x="44" y="113" class="ref">Deuteronomium 24:6–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een handmolen</text><text x="68" y="241" class="body">Niet als onderpand nemen: daarmee zou</text><text x="68" y="284" class="body">men iemands levensonderhoud nemen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij het innen van een pand</text><text x="68" y="433" class="body">De schuldeiser blijft buiten; de</text><text x="68" y="476" class="body">schuldenaar brengt het naar buiten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De mantel van een arme</text><text x="68" y="625" class="body">Vóór zonsondergang teruggeven, zodat</text><text x="68" y="668" class="body">hij erin kan slapen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het dagloon</text><text x="68" y="817" class="body">Diezelfde dag betalen, vóór</text><text x="68" y="860" class="body">zonsondergang; ook bij een vreemdeling.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Recht beschermen</text><text x="68" y="1009" class="body">Het recht van vreemdeling en wees niet</text><text x="68" y="1052" class="body">buigen; geen mantel van een weduwe als</text><text x="68" y="1095" class="body">pand.</text><text x="46" y="1188" class="note">De twee bepalingen over zonsondergang hebben een</text><text x="46" y="1224" class="note">verschillend doel.</text></svg>