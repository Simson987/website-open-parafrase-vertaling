<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Het recht van de eerstgeborene</title><desc id="desc">Het verschil tussen persoonlijke voorkeur en het erfrecht van de werkelijke eerstgeborene.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het recht van de eerstgeborene</text><text x="44" y="113" class="ref">Deuteronomium 21:15–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee vrouwen</text><text x="68" y="241" class="body">De tekst bespreekt een geliefde en een</text><text x="68" y="284" class="body">minder geliefde vrouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De werkelijke eerstgeborene</text><text x="68" y="433" class="body">Is hij de zoon van de minder geliefde</text><text x="68" y="476" class="body">vrouw, dan blijft zijn recht gelden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Een dubbel deel</text><text x="68" y="625" class="body">De eerstgeboren zoon krijgt twee delen</text><text x="68" y="668" class="body">van de nalatenschap.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Geen omkering uit voorkeur</text><text x="68" y="817" class="body">De vader mag de zoon van de geliefde</text><text x="68" y="860" class="body">vrouw niet in zijn plaats eerstgeborene</text><text x="68" y="903" class="body">maken.</text><text x="46" y="996" class="note">De verhouding is twee delen tegenover één gewoon</text><text x="46" y="1032" class="note">erfdeel; er wordt geen aantal zonen bij</text><text x="46" y="1068" class="note">verzonnen.</text></svg>