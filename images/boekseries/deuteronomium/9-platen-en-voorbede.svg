<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Platen, opstand en voorbede</title><desc id="desc">De volgorde van platen, opstand, verwijdering van het kalf en Mozes’ voorbede.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Platen, opstand en voorbede</text><text x="44" y="113" class="ref">Deuteronomium 9:7–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Op de berg</text><text x="68" y="241" class="body">Veertig dagen en nachten; twee stenen</text><text x="68" y="284" class="body">platen van het verbond.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het gegoten kalf</text><text x="68" y="433" class="body">Mozes daalt af, ziet het kalf en breekt</text><text x="68" y="476" class="body">de platen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het beeld verwijderd</text><text x="68" y="625" class="body">Het kalf wordt verbrand, vergruisd en</text><text x="68" y="668" class="body">als stof in de beek gegooid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De voorbede</text><text x="68" y="817" class="body">Mozes bidt voor het volk en ook voor</text><text x="68" y="860" class="body">Aäron.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het argument</text><text x="68" y="1009" class="body">Bevrijding, verbond met de voorouders</text><text x="68" y="1052" class="body">en Gods naam onder de volken.</text><text x="46" y="1145" class="note">De terugblik wordt verteld om eigen</text><text x="46" y="1181" class="note">rechtvaardigheid als reden voor het landbezit te</text><text x="46" y="1217" class="note">weerspreken.</text></svg>