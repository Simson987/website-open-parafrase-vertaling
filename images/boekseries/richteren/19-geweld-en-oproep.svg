<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Het geweld en de oproep</title><desc id="desc">Een feitelijke leeswijzer die het ernstige vervolg niet verzwijgt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het geweld en de oproep</text><text x="44" y="113" class="ref">Richteren 19:22–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De omsingeling</text><text x="68" y="241" class="body">Mannen bedreigen de gast; de gastheer</text><text x="68" y="284" class="body">biedt de vrouwen aan.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vrouw uitgeleverd</text><text x="68" y="433" class="body">De Leviet brengt zijn bijvrouw naar</text><text x="68" y="476" class="body">buiten; zij wordt verkracht en</text><text x="68" y="519" class="body">mishandeld.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De ochtend</text><text x="68" y="668" class="body">Zij ligt aan de drempel en antwoordt</text><text x="68" y="711" class="body">niet; hij neemt haar mee.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De rondzending</text><text x="68" y="860" class="body">Hij verdeelt haar lichaam in twaalf</text><text x="68" y="903" class="body">stukken en stuurt die door Israël.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het antwoord</text><text x="68" y="1052" class="body">Denk na, geef raad en spreek: zo</text><text x="68" y="1095" class="body">eindigt het hoofdstuk.</text><text x="46" y="1188" class="note">De handelwijze van de mannen wordt als</text><text x="46" y="1224" class="note">schanddaad verteld. Haar mishandeling en lichaam</text><text x="46" y="1260" class="note">worden niet afgebeeld.</text></svg>