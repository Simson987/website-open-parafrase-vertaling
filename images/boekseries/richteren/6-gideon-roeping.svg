<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1376" viewBox="0 0 840 1376" role="img" aria-labelledby="title desc"><title id="title">Van dorsvloer naar roeping</title><desc id="desc">De fasen van Gideons roeping en het verband met de tweede naam Jerubbaäl.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1376" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van dorsvloer naar roeping</text><text x="44" y="113" class="ref">Richteren 6:1–35</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De nood</text><text x="68" y="241" class="body">Zeven jaar Midian; voedsel wordt</text><text x="68" y="284" class="body">vernield, Israël schuilt in het</text><text x="68" y="327" class="body">gebergte.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Ofra</text><text x="68" y="476" class="body">Gideon, zoon van Joas uit de</text><text x="68" y="519" class="body">Abiëzrieten, dorst tarwe in de</text><text x="68" y="562" class="body">wijnpers.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De roeping</text><text x="68" y="711" class="body">Zijn bezwaren over nood en geringe</text><text x="68" y="754" class="body">afkomst staan naast de belofte van Gods</text><text x="68" y="797" class="body">aanwezigheid.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De tekens en het altaar</text><text x="68" y="946" class="body">Het offerteken; een altaar met de naam</text><text x="68" y="989" class="body">De HEERE is vrede.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">De nacht en de oproep</text><text x="68" y="1138" class="body">Baäls altaar afgebroken; de naam</text><text x="68" y="1181" class="body">Jerubbaäl; daarna boden en ramshoorn.</text><text x="46" y="1274" class="note">De naam Jerubbaäl is een andere naam voor</text><text x="46" y="1310" class="note">Gideon, geen tweede leider.</text></svg>