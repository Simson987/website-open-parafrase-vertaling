<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1448" viewBox="0 0 840 1448" role="img" aria-labelledby="title desc"><title id="title">De gelofte en Jefta’s dochter</title><desc id="desc">De volgorde van gelofte, enig kind, twee maanden en de jaarlijkse vier dagen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1448" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De gelofte en Jefta’s dochter</text><text x="44" y="113" class="ref">Richteren 11:30–40</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gelofte</text><text x="68" y="241" class="body">Wat hem bij behouden terugkeer als</text><text x="68" y="284" class="body">eerste uit huis tegemoet komt, zal hij</text><text x="68" y="327" class="body">als brandoffer brengen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De terugkeer</text><text x="68" y="476" class="body">Zijn enige kind, zijn dochter, komt met</text><text x="68" y="519" class="body">tamboerijn en dans tegemoet.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Haar verzoek</text><text x="68" y="668" class="body">Twee maanden met vriendinnen in de</text><text x="68" y="711" class="body">bergen rouwen om het maagd blijven.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het slot</text><text x="68" y="860" class="body">Na terugkeer voltrekt Jefta de gedane</text><text x="68" y="903" class="body">gelofte; de tekst beschrijft geen</text><text x="68" y="946" class="body">uitvoeringstechniek.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De jaarlijkse gewoonte</text><text x="68" y="1095" class="body">Dochters van Israël gaan vier dagen per</text><text x="68" y="1138" class="body">jaar; deze vertaling zegt: met haar</text><text x="68" y="1181" class="body">spreken.</text><text x="46" y="1274" class="note">De tragische tekst en de formulering van deze</text><text x="46" y="1310" class="note">vertaling blijven zichtbaar; geen</text><text x="46" y="1346" class="note">offeruitvoering of verzonnen naam voor de</text><text x="46" y="1382" class="note">dochter.</text></svg>