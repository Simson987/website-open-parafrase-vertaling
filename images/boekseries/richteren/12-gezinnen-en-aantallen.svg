<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Twee gezinnen en hun aantallen</title><desc id="desc">De verschillende dertigtallen van Ebzan en de optelling 40 + 30 bij Abdon.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee gezinnen en hun aantallen</text><text x="44" y="113" class="ref">Richteren 12:9 en 14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ebzan</text><text x="68" y="241" class="body">Dertig zonen en dertig dochters.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De huwelijken</text><text x="68" y="390" class="body">Dochters buiten de familie; voor de</text><text x="68" y="433" class="body">zonen dertig vrouwen van buiten.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Abdon</text><text x="68" y="582" class="body">Veertig zonen en dertig kleinzonen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De rijdieren</text><text x="68" y="731" class="body">Zeventig ezelsveulens voor die veertig</text><text x="68" y="774" class="body">plus dertig nakomelingen.</text><text x="46" y="867" class="note">Er worden geen namen aan de niet bij naam</text><text x="46" y="903" class="note">genoemde kinderen gegeven.</text></svg>