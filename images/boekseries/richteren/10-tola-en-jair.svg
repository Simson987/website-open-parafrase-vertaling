<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">Tola en Jaïr</title><desc id="desc">De exacte afkomst, termijnen, drie dertigtallen en begraafplaatsen van de twee rechters.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tola en Jaïr</text><text x="44" y="113" class="ref">Richteren 10:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tola</text><text x="68" y="241" class="body">Zoon van Pua, zoon van Dodo, uit</text><text x="68" y="284" class="body">Issaschar; woont in Samir in Efraïm.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn termijn</text><text x="68" y="433" class="body">23 jaar rechter; begraven in Samir.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Jaïr</text><text x="68" y="582" class="body">Een Gileadiet; 22 jaar rechter.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Drie keer dertig</text><text x="68" y="731" class="body">Dertig zonen, dertig ezelsveulens en</text><text x="68" y="774" class="body">dertig steden in Gilead.</text><rect x="42" y="832" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Zijn einde</text><text x="68" y="923" class="body">Begraven in Kamon.</text><text x="46" y="1016" class="note">De dertig steden heten Havvoth-Jaïr; hier worden</text><text x="46" y="1052" class="note">geen niet gegeven zonennamen ingevuld.</text></svg>