<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De tocht van de Danieten</title><desc id="desc">De opeenvolgende plaatsen, vijf verkenners en zeshonderd mannen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De tocht van de Danieten</text><text x="44" y="113" class="ref">Richteren 18:2–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zora en Esthaol</text><text x="68" y="241" class="body">Vijf mannen verkennen; bezoek aan Micha</text><text x="68" y="284" class="body">en de Leviet.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Laïs</text><text x="68" y="433" class="body">Een rustig gelegen stad, ver van Sidon;</text><text x="68" y="476" class="body">de mannen keren terug.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De nieuwe tocht</text><text x="68" y="625" class="body">600 gewapende mannen; kamp bij</text><text x="68" y="668" class="body">Kirjath-jearim, Machane-dan genoemd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Opnieuw bij Micha</text><text x="68" y="817" class="body">Cultusvoorwerpen en priester worden</text><text x="68" y="860" class="body">meegenomen; Micha’s protest helpt niet.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Laïs wordt Dan</text><text x="68" y="1009" class="body">De stad wordt aangevallen, verbrand en</text><text x="68" y="1052" class="body">opnieuw opgebouwd; daarna hernoemd.</text><text x="46" y="1145" class="note">De mooie ligging in het verkennersverslag wordt</text><text x="46" y="1181" class="note">onderscheiden van de gewelddadige inname.</text></svg>