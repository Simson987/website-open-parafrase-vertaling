<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Zilver en een eigen priester</title><desc id="desc">De twee verschillende zilverbedragen en de opvolgende priesterlijke aanstellingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zilver en een eigen priester</text><text x="44" y="113" class="ref">Richteren 17:2–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Teruggegeven zilver</text><text x="68" y="241" class="body">Micha geeft de 1.100 zilverstukken aan</text><text x="68" y="284" class="body">zijn moeder terug.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Naar de edelsmid</text><text x="68" y="433" class="body">Zij geeft 200 zilverstukken voor het</text><text x="68" y="476" class="body">gesneden en gegoten beeld.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De eerste aanstelling</text><text x="68" y="625" class="body">Micha wijdt een van zijn zonen als</text><text x="68" y="668" class="body">priester.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De Leviet</text><text x="68" y="817" class="body">Komt uit Bethlehem en zoekt een</text><text x="68" y="860" class="body">woonplaats.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De afspraak</text><text x="68" y="1009" class="body">Jaarlijks tien zilverstukken, kleren en</text><text x="68" y="1052" class="body">levensonderhoud; Micha stelt hem aan.</text><text x="46" y="1145" class="note">Micha’s verwachting van voorspoed is zijn eigen</text><text x="46" y="1181" class="note">uitspraak. Vers 6 zegt: ieder deed wat goed was</text><text x="46" y="1217" class="note">in eigen ogen.</text></svg>