<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Drie groepen en het teken</title><desc id="desc">De drie groepen, hun voorwerpen en de opeenvolging van het nachtelijke teken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie groepen en het teken</text><text x="44" y="113" class="ref">Richteren 7:16–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De indeling</text><text x="68" y="241" class="body">300 mannen in drie groepen; Gideon</text><text x="68" y="284" class="body">trekt met honderd op.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Voor ieder</text><text x="68" y="433" class="body">Een ramshoorn en een lege kruik met een</text><text x="68" y="476" class="body">fakkel erin.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het tijdstip</text><text x="68" y="625" class="body">Begin van de middelste nachtwacht, na</text><text x="68" y="668" class="body">het aflossen van de wachten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het teken</text><text x="68" y="817" class="body">Hoorns blazen en kruiken breken; fakkel</text><text x="68" y="860" class="body">links en hoorn rechts.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De reactie</text><text x="68" y="1009" class="body">Ieder blijft staan; in het vijandelijke</text><text x="68" y="1052" class="body">kamp ontstaat paniek en vlucht.</text><text x="46" y="1145" class="note">De fakkels zijn pas zichtbaar nadat de kruiken</text><text x="46" y="1181" class="note">breken; er wordt geen extra wapen in een derde</text><text x="46" y="1217" class="note">hand getekend.</text></svg>