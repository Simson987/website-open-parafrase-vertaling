<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Jefta’s antwoord aan de koning</title><desc id="desc">De eis, Jefta’s historische antwoord en het uitblijven van overeenstemming.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jefta’s antwoord aan de koning</text><text x="44" y="113" class="ref">Richteren 11:12–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eis van de koning</text><text x="68" y="241" class="body">Teruggave van land tussen Arnon, Jabbok</text><text x="68" y="284" class="body">en Jordaan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jefta’s onderscheid</text><text x="68" y="433" class="body">Volgens zijn antwoord is het land niet</text><text x="68" y="476" class="body">van Moab of Ammon afgenomen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De herinnerde route</text><text x="68" y="625" class="body">Edom en Moab weigeren doorgang; Israël</text><text x="68" y="668" class="body">trekt om hen heen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Sihon van Hesbon</text><text x="68" y="817" class="body">Amoritisch gebied wordt na zijn aanval</text><text x="68" y="860" class="body">veroverd.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De genoemde tijd</text><text x="68" y="1009" class="body">Jefta spreekt over 300 jaar bewoning;</text><text x="68" y="1052" class="body">de koning luistert niet.</text><text x="46" y="1145" class="note">Dit is het diplomatieke betoog van Jefta; de</text><text x="46" y="1181" class="note">woorden van beide partijen worden herkenbaar</text><text x="46" y="1217" class="note">toegeschreven.</text></svg>