<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1482" viewBox="0 0 840 1482" role="img" aria-labelledby="title desc"><title id="title">De blijvende bewoners</title><desc id="desc">De per stam genoemde plaatsen en de uiteenlopende uitkomsten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1482" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De blijvende bewoners</text><text x="44" y="113" class="ref">Richteren 1:21–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Benjamin en Efraïm</text><text x="68" y="241" class="body">Jebusieten in Jeruzalem; Kanaänieten in</text><text x="68" y="284" class="body">Gezer.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Manasse</text><text x="68" y="433" class="body">Beth-Sean, Taänach, Dor, Jibleam en</text><text x="68" y="476" class="body">Megiddo met omliggende plaatsen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zebulon</text><text x="68" y="625" class="body">Kitron en Nahalol; inwoners doen</text><text x="68" y="668" class="body">dwangarbeid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Aser</text><text x="68" y="817" class="body">Akko, Sidon, Achlab, Achzib, Chelba,</text><text x="68" y="860" class="body">Afik en Rechob; Aser woont tussen hen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Nafthali</text><text x="68" y="1009" class="body">Beth-Semes en Beth-Anath; bewoners doen</text><text x="68" y="1052" class="body">dwangarbeid.</text><rect x="42" y="1110" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Dan en het huis van Jozef</text><text x="68" y="1201" class="body">Dan naar het bergland gedrongen; in</text><text x="68" y="1244" class="body">Heres, Ajalon en Saalbim later</text><text x="68" y="1287" class="body">dwangarbeid.</text><text x="46" y="1380" class="note">Het hoofdstuk maakt verschil tussen verdrijven,</text><text x="46" y="1416" class="note">samen wonen en dwangarbeid.</text></svg>