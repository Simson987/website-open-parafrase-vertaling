<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De reis en de overnachting</title><desc id="desc">De plaatsen en dagen tot de overnachting in Gibea.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De reis en de overnachting</text><text x="44" y="113" class="ref">Richteren 19:1–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Efraïm → Bethlehem</text><text x="68" y="241" class="body">De Leviet haalt de vrouw op na vier</text><text x="68" y="284" class="body">maanden bij haar vader.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vertraagd vertrek</text><text x="68" y="433" class="body">Drie dagen verblijf; op de vierde</text><text x="68" y="476" class="body">opnieuw blijven, op de vijfde laat</text><text x="68" y="519" class="body">vertrekken.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Jebus voorbij</text><text x="68" y="668" class="body">De knecht stelt overnachten voor; de</text><text x="68" y="711" class="body">Leviet kiest Gibea of Rama.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Gibea</text><text x="68" y="860" class="body">Zonsondergang en wachten op het plein.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De oude man</text><text x="68" y="1009" class="body">Eveneens uit Efraïm; hij geeft onderdak</text><text x="68" y="1052" class="body">en voer voor de ezels.</text><text x="46" y="1145" class="note">De gastvrije ontvangst is het eerste deel van</text><text x="46" y="1181" class="note">een hoofdstuk met een gruwelijk vervolg.</text></svg>