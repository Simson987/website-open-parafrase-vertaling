<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Personen en hun rol</title><desc id="desc">De vijf rollen en de gecontroleerde relaties, aantallen en herkomstplaatsen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Personen en hun rol</text><text x="44" y="113" class="ref">Richteren 4:2–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jabin</text><text x="68" y="241" class="body">Koning van Kanaän in Hazor; twintig</text><text x="68" y="284" class="body">jaar onderdrukking en 900 wagens.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sisera</text><text x="68" y="433" class="body">Zijn legeraanvoerder uit</text><text x="68" y="476" class="body">Haroseth-Haggojim.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Debora</text><text x="68" y="625" class="body">Profetes en rechter; vrouw van</text><text x="68" y="668" class="body">Lappidoth.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Barak</text><text x="68" y="817" class="body">Zoon van Abinoam uit Kedes in Nafthali;</text><text x="68" y="860" class="body">10.000 mannen uit Nafthali en Zebulon.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Jaël en Heber</text><text x="68" y="1009" class="body">Jaël is Hebers vrouw; hun familie heeft</text><text x="68" y="1052" class="body">vrede met Jabin.</text><text x="46" y="1145" class="note">De Jabin van dit verhaal wordt niet zonder</text><text x="46" y="1181" class="note">bronbewijs gelijkgesteld aan Jabin uit Jozua 11.</text></svg>