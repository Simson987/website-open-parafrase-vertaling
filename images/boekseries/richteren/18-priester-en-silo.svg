<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Priesterlijn en Silo</title><desc id="desc">De naamvolgorde en de twee afsluitende tijdsaanduidingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Priesterlijn en Silo</text><text x="44" y="113" class="ref">Richteren 18:30–31</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De genoemde priester</text><text x="68" y="241" class="body">Jonathan.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Zijn vader</text><text x="68" y="390" class="body">Gersom.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">De genoemde voorvader</text><text x="68" y="539" class="body">Manasse, volgens de naam in deze</text><text x="68" y="582" class="body">plaatselijke vertaling.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De opvolging</text><text x="68" y="731" class="body">Jonathan en zijn zonen als priesters</text><text x="68" y="774" class="body">bij Dan.</text><rect x="42" y="832" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">De tijdsaanduidingen</text><text x="68" y="923" class="body">Tot de ballingschap van het land; het</text><text x="68" y="966" class="body">beeld staat er terwijl Gods huis in</text><text x="68" y="1009" class="body">Silo is.</text><text x="46" y="1102" class="note">De naam Manasse is hier precies overgenomen uit</text><text x="46" y="1138" class="note">de gebruikte hoofdstuktekst.</text></svg>