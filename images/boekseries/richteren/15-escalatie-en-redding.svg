<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1561" viewBox="0 0 840 1561" role="img" aria-labelledby="title desc"><title id="title">Escalatie en nieuwe redding</title><desc id="desc">De hoofdstukvolgorde, twee touwen, de roep om water en de twintig jaren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1561" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Escalatie en nieuwe redding</text><text x="44" y="113" class="ref">Richteren 15:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De geweigerde toegang</text><text x="68" y="241" class="body">De vader heeft Simsons vrouw aan zijn</text><text x="68" y="284" class="body">metgezel gegeven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De brand en het antwoord</text><text x="68" y="433" class="body">Vossen en fakkels brengen brand; de</text><text x="68" y="476" class="body">Filistijnen doden vrouw en vader met</text><text x="68" y="519" class="body">vuur.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Etam en Juda</text><text x="68" y="668" class="body">Simson verblijft bij de rots; 3.000</text><text x="68" y="711" class="body">mannen komen en binden hem met twee</text><text x="68" y="754" class="body">nieuwe touwen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Lechi</text><text x="68" y="903" class="body">Touwen vallen uiteen; een ezelskaak</text><text x="68" y="946" class="body">wordt gebruikt en daarna weggegooid.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Dorst en water</text><text x="68" y="1095" class="body">Simson roept; er komt water en zijn</text><text x="68" y="1138" class="body">kracht keert terug.</text><rect x="42" y="1196" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1239" class="label">De termijn</text><text x="68" y="1287" class="body">Twintig jaar rechter in de tijd van de</text><text x="68" y="1330" class="body">Filistijnen.</text><text x="46" y="1423" class="note">De opeenvolgende vergeldingen worden beschreven</text><text x="46" y="1459" class="note">zonder brandende dieren of menselijke</text><text x="46" y="1495" class="note">slachtoffers af te beelden.</text></svg>