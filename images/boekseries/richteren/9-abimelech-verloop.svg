<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1518" viewBox="0 0 840 1518" role="img" aria-labelledby="title desc"><title id="title">Abimelech, Sichem en Tebez</title><desc id="desc">De verschillende fasen, drie jaren en twee afzonderlijke plaatsen in Abimelechs verhaal.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1518" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Abimelech, Sichem en Tebez</text><text x="44" y="113" class="ref">Richteren 9:1–57</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De machtsgreep</text><text x="68" y="241" class="body">Steun uit Sichem, zeventig</text><text x="68" y="284" class="body">zilverstukken en de moord op de broers;</text><text x="68" y="327" class="body">Jotham ontkomt.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Drie jaar later</text><text x="68" y="476" class="body">De verhouding met Sichem verslechtert;</text><text x="68" y="519" class="body">Gaäl daagt Abimelech uit.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zebul en de hinderlagen</text><text x="68" y="668" class="body">Eerst vier groepen, later drie; Gaäl</text><text x="68" y="711" class="body">wordt verdreven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Sichem</text><text x="68" y="860" class="body">Stad en toren worden verwoest; de</text><text x="68" y="903" class="body">verteller beschrijft massaal geweld.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Tebez</text><text x="68" y="1052" class="body">Bij de toren raakt een molensteen</text><text x="68" y="1095" class="body">Abimelech; zijn wapendrager doodt hem.</text><rect x="42" y="1153" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1196" class="label">De verteller</text><text x="68" y="1244" class="body">Het einde wordt verbonden aan zijn</text><text x="68" y="1287" class="body">eerdere kwaad en Jothams vloek.</text><text x="46" y="1380" class="note">Het hoofdstuk keurt de machtsgreep niet goed;</text><text x="46" y="1416" class="note">geweld wordt tekstueel samengevat, zonder</text><text x="46" y="1452" class="note">grafisch tafereel.</text></svg>