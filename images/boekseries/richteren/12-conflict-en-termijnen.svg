<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Conflict en vier termijnen</title><desc id="desc">Het conflict en de opeenvolgende vier rechters met exacte termijnen en plaatsen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Conflict en vier termijnen</text><text x="44" y="113" class="ref">Richteren 12:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Efraïm en Gilead</text><text x="68" y="241" class="body">Een verwijt mondt uit in strijd;</text><text x="68" y="284" class="body">Schibboleth en Sibboleth bij de</text><text x="68" y="327" class="body">Jordaan.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jefta</text><text x="68" y="476" class="body">Zes jaar rechter; begraven in een stad</text><text x="68" y="519" class="body">van Gilead.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ebzan</text><text x="68" y="668" class="body">Zeven jaar; uit Bethlehem en daar</text><text x="68" y="711" class="body">begraven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Elon</text><text x="68" y="860" class="body">Tien jaar; Zebuloniet, begraven in</text><text x="68" y="903" class="body">Ajalon in Zebulon.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Abdon</text><text x="68" y="1052" class="body">Acht jaar; zoon van Hillel, begraven in</text><text x="68" y="1095" class="body">Pirhathon in Efraïm.</text><text x="46" y="1188" class="note">Ajalon wordt hier uitdrukkelijk in Zebulon</text><text x="46" y="1224" class="note">geplaatst; de termijnen worden niet met andere</text><text x="46" y="1260" class="note">hoofdstukken samengevoegd.</text></svg>