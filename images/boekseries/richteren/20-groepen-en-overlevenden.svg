<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Groepen en overlevenden</title><desc id="desc">De legers, de achtervolgingsaantallen en de zeshonderd overlevenden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Groepen en overlevenden</text><text x="44" y="113" class="ref">Richteren 20:15–17 en 44–47</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Benjamin uit de steden</text><text x="68" y="241" class="body">26.000 strijders.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Gibea</text><text x="68" y="390" class="body">Daarnaast 700 uitgekozen mannen; ook</text><text x="68" y="433" class="body">een groep van 700 linkshandigen wordt</text><text x="68" y="476" class="body">genoemd.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Israël zonder Benjamin</text><text x="68" y="625" class="body">400.000 strijders.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De laatste achtervolging</text><text x="68" y="774" class="body">18.000, daarna 5.000 en 2.000; samen</text><text x="68" y="817" class="body">25.000 in vers 44–46.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Rimmon</text><text x="68" y="966" class="body">600 overlevenden blijven vier maanden</text><text x="68" y="1009" class="body">bij de rots.</text><text x="46" y="1102" class="note">De twee vermeldingen van 700 zijn geen opdracht</text><text x="46" y="1138" class="note">om 700 extra bij elkaar op te tellen.</text></svg>