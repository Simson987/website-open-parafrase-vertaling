<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De aankondiging van Simson</title><desc id="desc">De onderscheiden voorschriften voor moeder en zoon en de aangekondigde taak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De aankondiging van Simson</text><text x="44" y="113" class="ref">Richteren 13:3–14 en 24–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De ouders</text><text x="68" y="241" class="body">Manoach uit Zora, uit Dan; zijn vrouw</text><text x="68" y="284" class="body">krijgt in dit hoofdstuk geen eigen</text><text x="68" y="327" class="body">naam.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De zoon</text><text x="68" y="476" class="body">Een aangekondigde geboorte; later noemt</text><text x="68" y="519" class="body">zijn moeder hem Simson.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De opdracht aan de moeder</text><text x="68" y="668" class="body">Geen wijn of sterke drank, niets van de</text><text x="68" y="711" class="body">wijnstok en niets onreins.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De opdracht voor de zoon</text><text x="68" y="860" class="body">Vanaf de moederschoot Nazireër; geen</text><text x="68" y="903" class="body">scheermes op zijn hoofd.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De aangekondigde taak</text><text x="68" y="1052" class="body">Beginnen Israël te redden uit de macht</text><text x="68" y="1095" class="body">van de Filistijnen.</text><text x="46" y="1188" class="note">Een beschrijving van de opdracht in het verhaal;</text><text x="46" y="1224" class="note">de vrouw krijgt geen verzonnen naam of extra</text><text x="46" y="1260" class="note">genealogie.</text></svg>