<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Het raadsel en de zeven dagen</title><desc id="desc">De herkomst van het raadsel, dubbele kledinginzet en exacte feesttermijn.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het raadsel en de zeven dagen</text><text x="44" y="113" class="ref">Richteren 14:8–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De achtergrond</text><text x="68" y="241" class="body">Honing uit de leeuw, gedeeld met de</text><text x="68" y="284" class="body">ouders zonder de herkomst te vertellen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De inzet</text><text x="68" y="433" class="body">Dertig linnen hemden en dertig stel</text><text x="68" y="476" class="body">feestkleren.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De termijn</text><text x="68" y="625" class="body">Zeven dagen feest; na drie dagen nog</text><text x="68" y="668" class="body">geen oplossing.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De druk</text><text x="68" y="817" class="body">De gasten bedreigen de vrouw; op de</text><text x="68" y="860" class="body">zevende dag geeft zij de verklaring</text><text x="68" y="903" class="body">door.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De uitkomst</text><text x="68" y="1052" class="body">De gasten antwoorden vóór</text><text x="68" y="1095" class="body">zonsondergang; Simson betaalt de</text><text x="68" y="1138" class="body">kleding na geweld in Askelon.</text><text x="46" y="1231" class="note">De bedreiging en het latere geweld horen bij de</text><text x="46" y="1267" class="note">vertelling; ze worden niet als feestideaal</text><text x="46" y="1303" class="note">voorgesteld.</text></svg>