<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Na de eerste overwinning</title><desc id="desc">De opeenvolging en verschillende reacties van Gideon na de overwinning.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Na de eerste overwinning</text><text x="44" y="113" class="ref">Richteren 8:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Efraïm</text><text x="68" y="241" class="body">Een verwijt wordt door Gideons antwoord</text><text x="68" y="284" class="body">tot bedaren gebracht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sukkoth en Pnuël</text><text x="68" y="433" class="body">Weigeren de uitgeputte achtervolgers</text><text x="68" y="476" class="body">brood.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De koningen</text><text x="68" y="625" class="body">Zebah en Tsalmuna worden na de</text><text x="68" y="668" class="body">achtervolging gevangengenomen en</text><text x="68" y="711" class="body">gedood.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De dorpen</text><text x="68" y="860" class="body">Gideon keert terug voor de</text><text x="68" y="903" class="body">aangekondigde vergelding.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het heersersvoorstel</text><text x="68" y="1052" class="body">Gideon weigert heerschappij voor</text><text x="68" y="1095" class="body">zichzelf en zijn zoon en wijst op de</text><text x="68" y="1138" class="body">HEERE.</text><text x="46" y="1231" class="note">De vreedzame woorden tegen Efraïm en de harde</text><text x="46" y="1267" class="note">vergelding elders blijven verschillende delen</text><text x="46" y="1303" class="note">van het verhaal.</text></svg>