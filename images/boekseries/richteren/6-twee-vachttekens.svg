<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De twee tekens met de vacht</title><desc id="desc">De twee tegengestelde vachttekens met hun volgorde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee tekens met de vacht</text><text x="44" y="113" class="ref">Richteren 6:36–40</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste vraag</text><text x="68" y="241" class="body">Dauw alleen op de vacht; de grond</text><text x="68" y="284" class="body">eromheen droog.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste uitkomst</text><text x="68" y="433" class="body">Gideon wringt een schaal water uit de</text><text x="68" y="476" class="body">vacht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tweede vraag</text><text x="68" y="625" class="body">De vacht droog; dauw op de grond</text><text x="68" y="668" class="body">eromheen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tweede uitkomst</text><text x="68" y="817" class="body">God doet het die nacht zoals gevraagd.</text><text x="46" y="910" class="note">De toestand van vacht en grond keert om; de twee</text><text x="46" y="946" class="note">foto’s horen bij twee verschillende ochtenden.</text></svg>