<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">Bethel en een nieuw Luz</title><desc id="desc">De twee verschillende plaatsen met de naam Luz en de rol van de gespaarde inwoner.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bethel en een nieuw Luz</text><text x="44" y="113" class="ref">Richteren 1:23–26</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oude naam</text><text x="68" y="241" class="body">Bethel heette vroeger Luz.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De verkenners</text><text x="68" y="390" class="body">Vragen een uitgaande inwoner de toegang</text><text x="68" y="433" class="body">tot de stad te wijzen.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De belofte</text><text x="68" y="582" class="body">Zij beloven hem goed te behandelen.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De uitkomst</text><text x="68" y="731" class="body">De man en zijn familie worden gespaard.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Een nieuwe plaats</text><text x="68" y="880" class="body">Hij bouwt in het land van de Hethieten</text><text x="68" y="923" class="body">een stad die hij ook Luz noemt.</text><text x="46" y="1016" class="note">De oude naam van Bethel en de nieuwe stad Luz</text><text x="46" y="1052" class="note">worden niet als één plek getekend.</text></svg>