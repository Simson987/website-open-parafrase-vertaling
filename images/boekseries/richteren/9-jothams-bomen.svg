<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De bomen in Jothams gelijkenis</title><desc id="desc">De vier achtereenvolgens gevraagde planten en de toepassing op Abimelech en Sichem.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De bomen in Jothams gelijkenis</text><text x="44" y="113" class="ref">Richteren 9:8–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Olijfboom</text><text x="68" y="241" class="body">Weigert: zijn olie opgeven om boven de</text><text x="68" y="284" class="body">bomen te zweven?</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vijgenboom</text><text x="68" y="433" class="body">Weigert: zijn zoetheid en goede vrucht</text><text x="68" y="476" class="body">opgeven?</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wijnstok</text><text x="68" y="625" class="body">Weigert: de wijn die God en mensen blij</text><text x="68" y="668" class="body">maakt opgeven?</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Doornstruik</text><text x="68" y="817" class="body">Biedt schaduw aan en dreigt anders met</text><text x="68" y="860" class="body">vuur tegen de ceders.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De toepassing</text><text x="68" y="1009" class="body">Eerlijkheid tegenover Gideons familie</text><text x="68" y="1052" class="body">wordt getoetst; wederzijdse verwoesting</text><text x="68" y="1095" class="body">wordt aangekondigd.</text><text x="46" y="1188" class="note">Sprekende bomen zijn een gelijkenis binnen</text><text x="46" y="1224" class="note">Jothams toespraak, geen historische gebeurtenis</text><text x="46" y="1260" class="note">in een bos.</text></svg>