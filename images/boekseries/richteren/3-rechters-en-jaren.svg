<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Rechters en genoemde jaren</title><desc id="desc">De twee gegeven periodenparen en de beperkte gegevens over Samgar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rechters en genoemde jaren</text><text x="44" y="113" class="ref">Richteren 3:8–31</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Othniël</text><text x="68" y="241" class="body">Acht jaar dienst onder</text><text x="68" y="284" class="body">Kuschan-Rischataïm; daarna veertig jaar</text><text x="68" y="327" class="body">rust.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Ehud</text><text x="68" y="476" class="body">Achttien jaar dienst onder Eglon van</text><text x="68" y="519" class="body">Moab; daarna tachtig jaar rust.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Samgar</text><text x="68" y="668" class="body">Zoon van Anath; 600 Filistijnen en een</text><text x="68" y="711" class="body">ossenstok worden genoemd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bij Samgar ontbreken jaren</text><text x="68" y="860" class="body">Het hoofdstuk geeft voor hem geen</text><text x="68" y="903" class="body">onderdrukkings- of rusttermijn.</text><text x="46" y="996" class="note">De termijnen blijven per verhaal staan; er wordt</text><text x="46" y="1032" class="note">geen sluitende kalender of extra regeringsduur</text><text x="46" y="1068" class="note">van gemaakt.</text></svg>