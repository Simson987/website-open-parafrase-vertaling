<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">De drie strijddagen</title><desc id="desc">De drie dagen en de gegeven aantallen met hun versverwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De drie strijddagen</text><text x="44" y="113" class="ref">Richteren 20:18–46</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste dag</text><text x="68" y="241" class="body">Juda voorop; 22.000 Israëlieten vallen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tweede dag</text><text x="68" y="390" class="body">Opnieuw raad vragen; 18.000 Israëlieten</text><text x="68" y="433" class="body">vallen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Voor de derde dag</text><text x="68" y="582" class="body">Huilen, vasten, offers en raad vragen;</text><text x="68" y="625" class="body">Pinehas wordt genoemd.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De derde dag</text><text x="68" y="774" class="body">Een schijnvlucht en hinderlaag; rook</text><text x="68" y="817" class="body">uit Gibea is het afgesproken teken.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De twee totaalcijfers</text><text x="68" y="966" class="body">Vers 35 noemt 25.100 Benjaminieten;</text><text x="68" y="1009" class="body">vers 46 noemt 25.000.</text><text x="46" y="1102" class="note">De verscijfers blijven apart zichtbaar;</text><text x="46" y="1138" class="note">verschillende formuleringen worden niet</text><text x="46" y="1174" class="note">stilzwijgend gelijkgemaakt.</text></svg>