<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Gaza, de pilaren en het slot</title><desc id="desc">De gevangenschap, het slot en de plaats van de begrafenis.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gaza, de pilaren en het slot</text><text x="44" y="113" class="ref">Richteren 16:21–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gaza</text><text x="68" y="241" class="body">Gevangen, twee koperen kettingen en</text><text x="68" y="284" class="body">graan malen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het haar</text><text x="68" y="433" class="body">Begint na het afscheren weer te</text><text x="68" y="476" class="body">groeien.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het gebouw</text><text x="68" y="625" class="body">Een jongen leidt hem; ongeveer 3.000</text><text x="68" y="668" class="body">toeschouwers op het dak.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gebed en pilaren</text><text x="68" y="817" class="body">Rechter- en linkerhand aan de twee</text><text x="68" y="860" class="body">middelste pilaren; daarna de</text><text x="68" y="903" class="body">instorting.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De begrafenis</text><text x="68" y="1052" class="body">Familie begraaft hem in Manoachs graf</text><text x="68" y="1095" class="body">tussen Zora en Esthaol; twintig jaar</text><text x="68" y="1138" class="body">rechter.</text><text x="46" y="1231" class="note">De vertelling verbindt zijn gebed met het</text><text x="46" y="1267" class="note">laatste optreden; een nieuw goddelijk personage</text><text x="46" y="1303" class="note">wordt niet toegevoegd.</text></svg>