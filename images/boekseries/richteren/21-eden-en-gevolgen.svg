<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">Eden en ernstige gevolgen</title><desc id="desc">De samenhang tussen eden, de getallen en de gewelddadige oplossingen van de oudsten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eden en ernstige gevolgen</text><text x="44" y="113" class="ref">Richteren 21:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eerste eed</text><text x="68" y="241" class="body">Geen eigen dochter aan een Benjaminiet</text><text x="68" y="284" class="body">geven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De ontbrekende groep</text><text x="68" y="433" class="body">Niemand uit Jabes in Gilead was bij de</text><text x="68" y="476" class="body">bijeenkomst.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het geweld in Jabes</text><text x="68" y="625" class="body">12.000 mannen worden gestuurd; 400</text><text x="68" y="668" class="body">jonge vrouwen worden meegebracht.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het tekort</text><text x="68" y="817" class="body">Voor de 600 overlevenden zijn 400</text><text x="68" y="860" class="body">vrouwen onvoldoende.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het plan in Silo</text><text x="68" y="1009" class="body">Vrouwen worden uit het dansfeest</text><text x="68" y="1052" class="body">geroofd; daarna herbouw en vertrek.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Het slotwoord</text><text x="68" y="1201" class="body">Geen koning; ieder deed wat goed was in</text><text x="68" y="1244" class="body">eigen ogen.</text><text x="46" y="1337" class="note">De tekst beschrijft ontvoering en geweld; deze</text><text x="46" y="1373" class="note">gebeurtenissen zijn geen vreedzame</text><text x="46" y="1409" class="note">huwelijksplechtigheid.</text></svg>