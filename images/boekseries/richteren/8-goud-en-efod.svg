<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Goud, efod en het latere gevolg</title><desc id="desc">De inzameling, de efod en de negatieve beoordeling door de verteller.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Goud, efod en het latere gevolg</text><text x="44" y="113" class="ref">Richteren 8:24–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De inzameling</text><text x="68" y="241" class="body">Iedereen geeft een gouden ring uit de</text><text x="68" y="284" class="body">buit op de uitgespreide mantel.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De hoeveelheid</text><text x="68" y="433" class="body">Ongeveer 19 kilo goud aan ringen</text><text x="68" y="476" class="body">volgens deze vertaling, naast andere</text><text x="68" y="519" class="body">sieraden.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De efod</text><text x="68" y="668" class="body">Gideon maakt een efod en zet die in</text><text x="68" y="711" class="body">Ofra neer.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het gevolg</text><text x="68" y="860" class="body">Het wordt een valstrik voor Gideon en</text><text x="68" y="903" class="body">zijn familie; het volk loopt er ontrouw</text><text x="68" y="946" class="body">achteraan.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De afsluiting</text><text x="68" y="1095" class="body">Veertig jaar rust tijdens Gideons</text><text x="68" y="1138" class="body">leven; na zijn dood opnieuw afval.</text><text x="46" y="1231" class="note">De tekst geeft hier geen precies bouwontwerp van</text><text x="46" y="1267" class="note">de efod; het schema verzint er geen.</text></svg>