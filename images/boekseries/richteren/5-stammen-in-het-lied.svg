<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">De stammen in het lied</title><desc id="desc">De genoemde groepen en het contrast in hun deelname volgens Debora’s lied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De stammen in het lied</text><text x="44" y="113" class="ref">Richteren 5:14–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Genoemd bij de inzet</text><text x="68" y="241" class="body">Efraïm, Benjamin en Machir; Zebulon met</text><text x="68" y="284" class="body">de schrijversstaf.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Issaschar</text><text x="68" y="433" class="body">Vorsten bij Debora; Barak trekt te voet</text><text x="68" y="476" class="body">het dal in.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ruben</text><text x="68" y="625" class="body">Lang nadenken bij de schaapskooien.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Gilead, Dan en Aser</text><text x="68" y="774" class="body">Over de Jordaan, bij de schepen en aan</text><text x="68" y="817" class="body">de kust gebleven.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Zebulon en Nafthali</text><text x="68" y="966" class="body">Hun leven gewaagd op de hoogten van het</text><text x="68" y="1009" class="body">land.</text><text x="46" y="1102" class="note">Dit zijn de waarderingen en beelden van het</text><text x="46" y="1138" class="note">lied; Machir en Gilead worden niet stilzwijgend</text><text x="46" y="1174" class="note">door een andere naam vervangen.</text></svg>