<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1432" viewBox="0 0 840 1432" role="img" aria-labelledby="title desc"><title id="title">De opbouw van het lied</title><desc id="desc">De perspectiefwisselingen en beeldspraak in het lied, onderscheiden van de vertelling in hoofdstuk 4.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1432" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De opbouw van het lied</text><text x="44" y="113" class="ref">Richteren 5:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 1–11</text><text x="68" y="241" class="body">Lof, herinnering aan nood en aan de</text><text x="68" y="284" class="body">vrijwillige inzet.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 12–18</text><text x="68" y="433" class="body">Oproep aan Debora en Barak; deelname en</text><text x="68" y="476" class="body">aarzeling van de groepen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vers 19–23</text><text x="68" y="625" class="body">Strijd, sterren en Kison; het oordeel</text><text x="68" y="668" class="body">over Meroz.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vers 24–27</text><text x="68" y="817" class="body">Jaël wordt geprezen; Sisera’s einde.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Vers 28–30</text><text x="68" y="966" class="body">Sisera’s moeder verwacht zijn terugkeer</text><text x="68" y="1009" class="body">en spreekt over buit.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Vers 31</text><text x="68" y="1158" class="body">Vijanden en wie God liefhebben</text><text x="68" y="1201" class="body">tegenover elkaar; veertig jaar rust.</text><text x="46" y="1294" class="note">De sterren, smeltende bergen en opgaande zon</text><text x="46" y="1330" class="note">zijn poëtische taal. De verwachte buit is een</text><text x="46" y="1366" class="note">gedachte van de wachtenden.</text></svg>