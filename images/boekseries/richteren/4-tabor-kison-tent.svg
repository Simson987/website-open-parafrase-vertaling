<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Tabor, Kison en de tent</title><desc id="desc">De stappen en plaatswisselingen van het verhaal in Richteren 4.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tabor, Kison en de tent</text><text x="44" y="113" class="ref">Richteren 4:6–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De opdracht</text><text x="68" y="241" class="body">Barak moet naar de Tabor; Sisera wordt</text><text x="68" y="284" class="body">naar de Kison gelokt.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De voorwaarde van Barak</text><text x="68" y="433" class="body">Debora moet meegaan; zij stemt toe.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De afdaling</text><text x="68" y="582" class="body">Barak trekt met 10.000 man van de berg</text><text x="68" y="625" class="body">af.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De vlucht</text><text x="68" y="774" class="body">Sisera laat zijn wagen achter en vlucht</text><text x="68" y="817" class="body">te voet naar Jaëls tent.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het einde</text><text x="68" y="966" class="body">Jaël doodt Sisera; Barak komt bij de</text><text x="68" y="1009" class="body">tent. Israël krijgt de overhand op</text><text x="68" y="1052" class="body">Jabin.</text><text x="46" y="1145" class="note">De tent en de rivier zijn verschillende scènes;</text><text x="46" y="1181" class="note">de gewelddadige dood wordt niet grafisch</text><text x="46" y="1217" class="note">getoond.</text></svg>