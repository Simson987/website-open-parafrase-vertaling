<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Van de berg naar Sion</title><desc id="desc">Van de berg naar Sion met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van de berg naar Sion</text><text x="44" y="113" class="ref">Hebreeën 12:18–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De tastbare berg · vers 18–21</text><text x="68" y="241" class="body">Vuur, duisternis, storm, bazuin en</text><text x="68" y="284" class="body">ontzagwekkende stem.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sion · vers 22</text><text x="68" y="433" class="body">Het hemelse Jeruzalem en de engelen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De vergadering · vers 23</text><text x="68" y="582" class="body">Eerstgeborenen, God als Rechter en</text><text x="68" y="625" class="body">volmaakte rechtvaardigen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Jezus · vers 24</text><text x="68" y="774" class="body">Middelaar van het nieuwe verbond en het</text><text x="68" y="817" class="body">sprekende bloed.</text><text x="46" y="910" class="note">Het contrast hoort bij de oproep om de Spreker</text><text x="46" y="946" class="note">niet af te wijzen.</text></svg>