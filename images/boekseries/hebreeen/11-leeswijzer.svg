<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Een reeks getuigen van geloof</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een reeks getuigen van geloof</text><text x="44" y="113" class="ref">Hebreeën 11:1–40</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–7 · Het ongeziene vertrouwen</text><text x="68" y="241" class="body">Schepping, Abel, Henoch en Noach.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">8–22 · De aartsvaders</text><text x="68" y="390" class="body">Roeping, belofte, zegen en de verwachte</text><text x="68" y="433" class="body">uittocht.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">23–31 · Uittocht en land</text><text x="68" y="582" class="body">Mozes, zee, Jericho en Rachab.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">32–40 · Overwinning en lijden</text><text x="68" y="731" class="body">Geloof blijkt in redding én volharding</text><text x="68" y="774" class="body">zonder ontvangen vervulling.</text><text x="46" y="867" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="903" class="note">de plaatselijke versindeling.</text></svg>