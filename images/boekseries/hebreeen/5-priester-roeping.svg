<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Roeping, lijden en priesterschap</title><desc id="desc">Roeping, lijden en priesterschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Roeping, lijden en priesterschap</text><text x="44" y="113" class="ref">Hebreeën 5:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Menselijke hogepriester</text><text x="68" y="241" class="body">Voor mensen aangesteld; mild door eigen</text><text x="68" y="284" class="body">zwakheid.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aäron · vers 4</text><text x="68" y="433" class="body">De eer wordt door roeping ontvangen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Christus · vers 5–6, 10</text><text x="68" y="582" class="body">Door God Zoon en Priester naar</text><text x="68" y="625" class="body">Melchizedeks orde genoemd.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Lijden en gehoorzaamheid</text><text x="68" y="774" class="body">Zijn gebed, gehoorzaamheid en eeuwige</text><text x="68" y="817" class="body">redding.</text><text x="46" y="910" class="note">De vergelijking laat zowel overeenkomsten als</text><text x="46" y="946" class="note">Christus’ eigen roeping zien.</text></svg>