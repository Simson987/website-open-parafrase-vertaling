<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De laatste namen in de reeks</title><desc id="desc">De laatste namen in de reeks met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De laatste namen in de reeks</text><text x="44" y="113" class="ref">Hebreeën 11:32–40</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Richters</text><text x="68" y="241" class="body">Gideon, Barak, Simson en Jefta.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Koning en profeet</text><text x="68" y="390" class="body">David, Samuël en de profeten.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Overwinning · vers 33–35</text><text x="68" y="539" class="body">Recht doen, beloften ontvangen en</text><text x="68" y="582" class="body">redding ervaren.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Lijden · vers 35–40</text><text x="68" y="731" class="body">Mishandeling, gevangenschap en</text><text x="68" y="774" class="body">volharding; nog wachten op vervulling.</text><text x="46" y="867" class="note">De tekst verbindt geloof zowel met overwinning</text><text x="46" y="903" class="note">als met lijden.</text></svg>