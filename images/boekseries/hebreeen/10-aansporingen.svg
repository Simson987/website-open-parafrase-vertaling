<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Drie keer laten wij</title><desc id="desc">Drie keer laten wij met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie keer laten wij</text><text x="44" y="113" class="ref">Hebreeën 10:19–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Naderen · vers 22</text><text x="68" y="241" class="body">Met een oprecht hart en volle</text><text x="68" y="284" class="body">geloofszekerheid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vasthouden · vers 23</text><text x="68" y="433" class="body">Onwrikbaar aan de belijdenis van de</text><text x="68" y="476" class="body">hoop.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Op elkaar letten · vers 24–25</text><text x="68" y="625" class="body">Tot liefde en goed werk aansporen;</text><text x="68" y="668" class="body">samenkomen en bemoedigen.</text><text x="46" y="761" class="note">De drie oproepen volgen op de geopende toegang</text><text x="46" y="797" class="note">en de grote Priester.</text></svg>