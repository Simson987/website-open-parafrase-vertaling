<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Offers van lof en goeddoen</title><desc id="desc">Offers van lof en goeddoen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Offers van lof en goeddoen</text><text x="44" y="113" class="ref">Hebreeën 13:12–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Naar Hem · vers 12–14</text><text x="68" y="241" class="body">Jezus buiten de poort; Zijn smaad</text><text x="68" y="284" class="body">dragen en de komende stad zoeken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Lippen · vers 15</text><text x="68" y="433" class="body">Zijn Naam belijden als een blijvend</text><text x="68" y="476" class="body">lofoffer.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Daden · vers 16</text><text x="68" y="625" class="body">Goeddoen en delen niet vergeten.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Gods vreugde · vers 16</text><text x="68" y="774" class="body">Zulke offers behagen Hem.</text><text x="46" y="867" class="note">De offerwoorden worden toegepast op lof en</text><text x="46" y="903" class="note">concrete onderlinge hulp.</text></svg>