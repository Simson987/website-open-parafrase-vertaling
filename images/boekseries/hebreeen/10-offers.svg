<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Herhaald en eens voorgoed</title><desc id="desc">Herhaald en eens voorgoed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herhaald en eens voorgoed</text><text x="44" y="113" class="ref">Hebreeën 10:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De priesters · vers 1–4, 11</text><text x="68" y="241" class="body">Dagelijks en jaarlijks dezelfde offers;</text><text x="68" y="284" class="body">herinnering aan zonden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Christus · vers 10, 12–14</text><text x="68" y="433" class="body">Zijn lichaam als één offer; voor altijd</text><text x="68" y="476" class="body">gezeten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het getuigenis · vers 15–17</text><text x="68" y="625" class="body">Wet in hart en verstand; zonden niet</text><text x="68" y="668" class="body">meer gedenken.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De conclusie · vers 18</text><text x="68" y="817" class="body">Waar vergeving is, hoeft geen zondoffer</text><text x="68" y="860" class="body">meer gebracht te worden.</text><text x="46" y="953" class="note">De herhaling en het ene offer staan in het</text><text x="46" y="989" class="note">betoog tegenover elkaar.</text></svg>