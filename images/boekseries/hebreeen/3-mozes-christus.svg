<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Mozes en Christus in het huis</title><desc id="desc">Mozes en Christus in het huis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mozes en Christus in het huis</text><text x="44" y="113" class="ref">Hebreeën 3:1–6</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mozes · vers 2, 5</text><text x="68" y="241" class="body">Trouw als dienaar in Gods huis.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Christus · vers 3–6</text><text x="68" y="390" class="body">Meer heerlijkheid; trouw als Zoon over</text><text x="68" y="433" class="body">Zijn huis.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bouwer en huis · vers 3–4</text><text x="68" y="582" class="body">De bouwer krijgt meer eer dan het huis.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Wij · vers 6</text><text x="68" y="731" class="body">Zijn huis, als wij vrijmoedigheid en</text><text x="68" y="774" class="body">hoop vasthouden.</text><text x="46" y="867" class="note">Het huis is hier een vergelijking voor Gods</text><text x="46" y="903" class="note">gemeenschap.</text></svg>