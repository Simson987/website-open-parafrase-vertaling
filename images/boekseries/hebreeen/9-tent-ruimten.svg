<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De twee delen van de tent</title><desc id="desc">De twee delen van de tent met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee delen van de tent</text><text x="44" y="113" class="ref">Hebreeën 9:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het voorste deel · vers 2</text><text x="68" y="241" class="body">Het heilige: kandelaar, tafel en</text><text x="68" y="284" class="body">toonbroden.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Achter het tweede voorhangsel</text><text x="68" y="433" class="body">Het heilige der heiligen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De genoemde voorwerpen · vers 4–5</text><text x="68" y="582" class="body">Gouden wierookaltaar en ark; boven de</text><text x="68" y="625" class="body">ark cherubs en verzoendeksel.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De toegang · vers 6–7</text><text x="68" y="774" class="body">Priesters geregeld voorin; de</text><text x="68" y="817" class="body">hogepriester eenmaal per jaar in het</text><text x="68" y="860" class="body">tweede deel.</text><text x="46" y="953" class="note">De plaatsing en toegang volgen de beschrijving</text><text x="46" y="989" class="note">van dit hoofdstuk.</text></svg>