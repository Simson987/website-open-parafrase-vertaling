<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De Zoon en de engelen</title><desc id="desc">De Zoon en de engelen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De Zoon en de engelen</text><text x="44" y="113" class="ref">Hebreeën 1:2–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De Zoon · vers 2–4</text><text x="68" y="241" class="body">Erfgenaam, Schepper, drager en reiniger</text><text x="68" y="284" class="body">van zonden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Koningschap · vers 5–9</text><text x="68" y="433" class="body">Zoon genoemd, aanbeden en met een</text><text x="68" y="476" class="body">blijvende troon.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De Schepper · vers 10–12</text><text x="68" y="625" class="body">De schepping verandert; Hij blijft</text><text x="68" y="668" class="body">dezelfde.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De engelen · vers 13–14</text><text x="68" y="817" class="body">Dienende geesten voor wie de redding</text><text x="68" y="860" class="body">zullen erven.</text><text x="46" y="953" class="note">Het hoofdstuk vergelijkt hun plaats en taak met</text><text x="46" y="989" class="note">Schriftwoorden.</text></svg>