<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De verwijzingen naar rust</title><desc id="desc">De verwijzingen naar rust met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De verwijzingen naar rust</text><text x="44" y="113" class="ref">Hebreeën 4:1–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zevende dag · vers 4</text><text x="68" y="241" class="body">God rustte van Zijn werken.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De ongehoorzamen · vers 5–6</text><text x="68" y="390" class="body">Zij gingen niet binnen.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">David en Jozua · vers 7–8</text><text x="68" y="539" class="body">Later klinkt opnieuw vandaag; Jozua is</text><text x="68" y="582" class="body">niet het laatste woord.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Het volk van God · vers 9–11</text><text x="68" y="731" class="body">Er blijft sabbatsrust over; span je in</text><text x="68" y="774" class="body">om binnen te gaan.</text><text x="46" y="867" class="note">De aangehaalde teksten dragen het betoog over de</text><text x="46" y="903" class="note">overblijvende rust.</text></svg>