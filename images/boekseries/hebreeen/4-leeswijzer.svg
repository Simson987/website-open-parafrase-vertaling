<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Rust, het Woord en genade</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rust, het Woord en genade</text><text x="44" y="113" class="ref">Hebreeën 4:1–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · De belofte van rust</text><text x="68" y="241" class="body">Horen met geloof; Gods rust sinds de</text><text x="68" y="284" class="body">zevende dag.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">6–11 · Vandaag binnengaan</text><text x="68" y="433" class="body">David, Jozua en de rust die overblijft.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">12–13 · Het levende Woord</text><text x="68" y="582" class="body">Gedachten en bedoelingen worden</text><text x="68" y="625" class="body">doorgrond.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">14–16 · De Hogepriester</text><text x="68" y="774" class="body">Vasthouden en vrijmoedig om tijdige</text><text x="68" y="817" class="body">hulp gaan.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>