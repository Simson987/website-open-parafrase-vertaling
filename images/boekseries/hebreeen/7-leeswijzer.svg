<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Een blijvend priesterschap</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een blijvend priesterschap</text><text x="44" y="113" class="ref">Hebreeën 7:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–10 · Abraham en Melchizedek</text><text x="68" y="241" class="body">Zegen, tiende en de plaats van Levi in</text><text x="68" y="284" class="body">het betoog.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">11–19 · Een ander priesterschap</text><text x="68" y="433" class="body">Afkomst uit Juda en kracht van</text><text x="68" y="476" class="body">onvergankelijk leven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">20–28 · Eed en eeuwigheid</text><text x="68" y="625" class="body">Een beter verbond; voorbede en één</text><text x="68" y="668" class="body">offer door de volmaakte Zoon.</text><text x="46" y="761" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="797" class="note">de plaatselijke versindeling.</text></svg>