<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Volharding, opvoeding en Sion</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volharding, opvoeding en Sion</text><text x="44" y="113" class="ref">Hebreeën 12:1–29</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3 · De wedstrijd</text><text x="68" y="241" class="body">Last afleggen en kijken naar Jezus.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">4–13 · Opvoeding verdragen</text><text x="68" y="390" class="body">Heiligheid, gerechtigheid en weer recht</text><text x="68" y="433" class="body">lopen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">14–17 · Vrede en waakzaamheid</text><text x="68" y="582" class="body">Geen bitterheid; de waarschuwing van</text><text x="68" y="625" class="body">Ezau.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">18–29 · Berg en Koninkrijk</text><text x="68" y="774" class="body">Van angst naar Sion; luister en dien</text><text x="68" y="817" class="body">met ontzag.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>