<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Waarom gelijk aan Zijn broeders?</title><desc id="desc">Waarom gelijk aan Zijn broeders? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom gelijk aan Zijn broeders?</text><text x="44" y="113" class="ref">Hebreeën 2:10–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Samen · vers 10–13</text><text x="68" y="241" class="body">Kinderen tot heerlijkheid brengen en</text><text x="68" y="284" class="body">hen broeders noemen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vlees en bloed · vers 14</text><text x="68" y="433" class="body">Deel krijgen aan hun menselijke bestaan</text><text x="68" y="476" class="body">en sterven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bevrijding · vers 14–15</text><text x="68" y="625" class="body">De macht van de dood doorbreken en</text><text x="68" y="668" class="body">angstige slaven bevrijden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Hogepriester · vers 17–18</text><text x="68" y="817" class="body">Verzoenen en helpen, omdat Hij Zelf</text><text x="68" y="860" class="body">geleden en beproeving gekend heeft.</text><text x="46" y="953" class="note">De brief verbindt menswording, lijden,</text><text x="46" y="989" class="note">verzoening en hulp.</text></svg>