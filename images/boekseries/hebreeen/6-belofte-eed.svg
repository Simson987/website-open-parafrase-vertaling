<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Belofte, eed en hoop</title><desc id="desc">Belofte, eed en hoop met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Belofte, eed en hoop</text><text x="44" y="113" class="ref">Hebreeën 6:13–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Abraham · vers 13–15</text><text x="68" y="241" class="body">God beloofde zegen en talrijk</text><text x="68" y="284" class="body">nageslacht; Abraham wachtte geduldig.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De eed · vers 16–17</text><text x="68" y="433" class="body">God bevestigde Zijn onveranderlijke</text><text x="68" y="476" class="body">plan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De zekerheid · vers 18</text><text x="68" y="625" class="body">Twee onveranderlijke dingen; God kan</text><text x="68" y="668" class="body">niet liegen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het anker · vers 19–20</text><text x="68" y="817" class="body">Hoop binnen het voorhangsel; Jezus als</text><text x="68" y="860" class="body">voorloper en Hogepriester.</text><text x="46" y="953" class="note">De ankervergelijking verwijst naar zekere hoop</text><text x="46" y="989" class="note">en Jezus’ priesterschap.</text></svg>