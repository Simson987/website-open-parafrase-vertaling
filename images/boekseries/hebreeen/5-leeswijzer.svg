<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">Roeping en volwassen worden</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Roeping en volwassen worden</text><text x="44" y="113" class="ref">Hebreeën 5:1–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–4 · De menselijke priester</text><text x="68" y="241" class="body">Geroepen, mild en zelf ook zwak.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">5–10 · De geroepen Zoon</text><text x="68" y="390" class="body">Priester voor eeuwig; gebed, lijden en</text><text x="68" y="433" class="body">gehoorzaamheid.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">11–14 · Leren onderscheiden</text><text x="68" y="582" class="body">Van melk naar vast voedsel en geoefend</text><text x="68" y="625" class="body">waarnemen.</text><text x="46" y="718" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="754" class="note">de plaatselijke versindeling.</text></svg>