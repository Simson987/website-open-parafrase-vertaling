<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Het priesterschap vergeleken</title><desc id="desc">Het priesterschap vergeleken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het priesterschap vergeleken</text><text x="44" y="113" class="ref">Hebreeën 7:11–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De Levitische priesters</text><text x="68" y="241" class="body">Afstamming, veel opvolgers en offers</text><text x="68" y="284" class="body">die herhaald worden.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De andere orde</text><text x="68" y="433" class="body">Naar Melchizedek; de Heere is uit Juda.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De eed en het leven</text><text x="68" y="582" class="body">Met eed aangesteld; een onvergankelijk</text><text x="68" y="625" class="body">priesterschap.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De Zoon</text><text x="68" y="774" class="body">Altijd voorbede; één eigen offer, voor</text><text x="68" y="817" class="body">eeuwig volmaakt.</text><text x="46" y="910" class="note">Het betoog verbindt het nieuwe priesterschap met</text><text x="46" y="946" class="note">een beter verbond.</text></svg>