<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De leer en het ontvangen</title><desc id="desc">De leer en het ontvangen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De leer en het ontvangen</text><text x="44" y="113" class="ref">2 Johannes 1:7–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De misleiding</text><text x="68" y="241" class="body">Niet belijden dat Jezus Christus in het</text><text x="68" y="284" class="body">vlees gekomen is.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De waakzaamheid</text><text x="68" y="433" class="body">Op jezelf letten, om het gewerkte niet</text><text x="68" y="476" class="body">kwijt te raken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het blijven</text><text x="68" y="625" class="body">Wie in Christus’ leer blijft, heeft</text><text x="68" y="668" class="body">Vader en Zoon.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De ontvangst</text><text x="68" y="817" class="body">Wie deze leer niet brengt, niet in huis</text><text x="68" y="860" class="body">ontvangen of groeten.</text><text x="46" y="953" class="note">De beperking van ontvangst staat in deze brief</text><text x="46" y="989" class="note">bij de genoemde misleiding.</text></svg>