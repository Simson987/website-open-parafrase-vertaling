<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Verschillende huwelijkssituaties</title><desc id="desc">Verschillende huwelijkssituaties met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verschillende huwelijkssituaties</text><text x="44" y="113" class="ref">1 Korinthiërs 7:10–16, 36–40</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Getrouwd · vers 10–11</text><text x="68" y="241" class="body">Geen scheiding zoeken; bij scheiding</text><text x="68" y="284" class="body">ongetrouwd of verzoend.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ongelovige partner · vers 12–16</text><text x="68" y="433" class="body">Blijven als die wil blijven; bij</text><text x="68" y="476" class="body">vertrek geldt de genoemde uitzondering.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verloofd · vers 36–38</text><text x="68" y="625" class="body">Trouwen is geen zonde; blijven kan</text><text x="68" y="668" class="body">zonder dwang.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Weduwe · vers 39–40</text><text x="68" y="817" class="body">Vrij om in de Heere te trouwen; Paulus</text><text x="68" y="860" class="body">geeft ook zijn mening.</text><text x="46" y="953" class="note">Dit ordent de besproken gevallen en verwijst</text><text x="46" y="989" class="note">naar de volledige nuances van de genoemde</text><text x="46" y="1025" class="note">verzen.</text></svg>