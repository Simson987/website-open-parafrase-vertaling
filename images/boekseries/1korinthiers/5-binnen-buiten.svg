<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Wie binnen en wie buiten zijn</title><desc id="desc">Wie binnen en wie buiten zijn met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie binnen en wie buiten zijn</text><text x="44" y="113" class="ref">1 Korinthiërs 5:9–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet iedereen in de wereld</text><text x="68" y="241" class="body">Anders zouden de gelovigen de wereld</text><text x="68" y="284" class="body">moeten verlaten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Iemand die zich broeder noemt</text><text x="68" y="433" class="body">De genoemde hardnekkige praktijken</text><text x="68" y="476" class="body">vragen om verantwoordelijkheid.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wie binnen zijn</text><text x="68" y="625" class="body">De gemeenschap moet oordelen over haar</text><text x="68" y="668" class="body">eigen midden.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Wie buiten zijn</text><text x="68" y="817" class="body">God oordeelt over hen.</text><text x="46" y="910" class="note">Dit schema verduidelijkt de uitdrukkelijke</text><text x="46" y="946" class="note">afbakening die Paulus aan zijn eerdere brief</text><text x="46" y="982" class="note">geeft.</text></svg>