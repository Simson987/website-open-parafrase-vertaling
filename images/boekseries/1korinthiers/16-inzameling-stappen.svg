<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De inzameling voorbereiden</title><desc id="desc">De inzameling voorbereiden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De inzameling voorbereiden</text><text x="44" y="113" class="ref">1 Korinthiërs 16:1–4</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Iedere eerste dag van de week</text><text x="68" y="241" class="body">Ieder legt iets opzij naar wat hij</text><text x="68" y="284" class="body">verdiend heeft.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vooraf sparen</text><text x="68" y="433" class="body">Niet pas beginnen als Paulus komt.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Geschikte mensen</text><text x="68" y="582" class="body">De gemeente wijst mensen aan om de gave</text><text x="68" y="625" class="body">te brengen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Naar Jeruzalem</text><text x="68" y="774" class="body">Met een brief van Paulus; mogelijk</text><text x="68" y="817" class="body">reist hij zelf mee.</text><text x="46" y="910" class="note">De voorwaarden voor Paulus’ eigen meereizen</text><text x="46" y="946" class="note">blijven voorwaardelijk.</text></svg>