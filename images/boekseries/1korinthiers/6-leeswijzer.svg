<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Recht, vrijheid en het lichaam</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Recht, vrijheid en het lichaam</text><text x="44" y="113" class="ref">1 Korinthiërs 6:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–8 · Onderlinge geschillen</text><text x="68" y="241" class="body">Rechtszaken tegen elkaar zijn al een</text><text x="68" y="284" class="body">nederlaag.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">9–11 · Een veranderd bestaan</text><text x="68" y="433" class="body">Schoongewassen, geheiligd en</text><text x="68" y="476" class="body">rechtvaardig verklaard.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">12–17 · Vrijheid en verbondenheid</text><text x="68" y="625" class="body">Niet alles is nuttig; het lichaam hoort</text><text x="68" y="668" class="body">bij Christus.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">18–20 · Eer God met je lichaam</text><text x="68" y="817" class="body">Vlucht van ontucht; de Geest woont in</text><text x="68" y="860" class="body">jullie.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>