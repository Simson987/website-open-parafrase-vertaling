<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">De genoemde waarschuwingen</title><desc id="desc">De genoemde waarschuwingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde waarschuwingen</text><text x="44" y="113" class="ref">1 Korinthiërs 10:6–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geen afgodendienst · vers 7</text><text x="68" y="241" class="body">Het aangehaalde eten, drinken en</text><text x="68" y="284" class="body">dansen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Geen ontucht · vers 8</text><text x="68" y="433" class="body">De tekst noemt 23.000 doden op één dag.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Christus niet uitdagen · vers 9</text><text x="68" y="582" class="body">Paulus noemt het omkomen door slangen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Niet mopperen · vers 10–12</text><text x="68" y="731" class="body">De voorbeelden waarschuwen wie denkt</text><text x="68" y="774" class="body">vast te staan.</text><text x="46" y="867" class="note">De getallen en voorbeelden volgen deze</text><text x="46" y="903" class="note">plaatselijke tekst; geen afbeelding van</text><text x="46" y="939" class="note">slachtoffers nodig.</text></svg>