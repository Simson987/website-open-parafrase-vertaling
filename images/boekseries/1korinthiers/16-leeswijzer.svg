<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Gave, reizen en medewerkers</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gave, reizen en medewerkers</text><text x="44" y="113" class="ref">1 Korinthiërs 16:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–4 · De inzameling</text><text x="68" y="241" class="body">Wekelijks sparen en geschikte</text><text x="68" y="284" class="body">boodschappers naar Jeruzalem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">5–12 · Voornemens en ontvangst</text><text x="68" y="433" class="body">Paulus, Timotheüs en Apollos hebben</text><text x="68" y="476" class="body">verschillende plannen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">13–18 · Liefde en waardering</text><text x="68" y="625" class="body">Wees sterk; waardeer wie zich inzetten.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">19–24 · Groeten</text><text x="68" y="774" class="body">Asia, Aquila en Prisca; Paulus schrijft</text><text x="68" y="817" class="body">de groet zelf.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>