<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">De genoemde gaven van de Geest</title><desc id="desc">De genoemde gaven van de Geest met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde gaven van de Geest</text><text x="44" y="113" class="ref">1 Korinthiërs 12:8–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 8</text><text x="68" y="241" class="body">Woord van wijsheid en woord van kennis.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vers 9</text><text x="68" y="390" class="body">Geloof en gaven om te genezen.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Vers 10 · eerste deel</text><text x="68" y="539" class="body">Wonderen, profetie en onderscheid van</text><text x="68" y="582" class="body">geesten.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Vers 10 · tweede deel</text><text x="68" y="731" class="body">Verschillende talen en de uitleg</text><text x="68" y="774" class="body">daarvan.</text><rect x="42" y="832" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Vers 11</text><text x="68" y="923" class="body">Dezelfde Geest deelt uit zoals Hij wil.</text><text x="46" y="1016" class="note">De negen aanduidingen volgen vers 8–10 en zijn</text><text x="46" y="1052" class="note">geen rangorde.</text></svg>