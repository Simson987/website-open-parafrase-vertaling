<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Zuurdeeg als vergelijking</title><desc id="desc">Zuurdeeg als vergelijking met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zuurdeeg als vergelijking</text><text x="44" y="113" class="ref">1 Korinthiërs 5:6–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Een beetje zuurdeeg</text><text x="68" y="241" class="body">Maakt het hele deeg zuur.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het oude zuurdeeg</text><text x="68" y="390" class="body">Beeld voor slechtheid en kwaad.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Ongezuurde broden</text><text x="68" y="539" class="body">Beeld voor zuiverheid en waarheid.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Het paaslam</text><text x="68" y="688" class="body">Paulus noemt Christus ons geslachte</text><text x="68" y="731" class="body">paaslam.</text><text x="46" y="824" class="note">De broodbeelden verklaren het betoog; hier wordt</text><text x="46" y="860" class="note">geen nieuwe historische paasmaaltijd beschreven.</text></svg>