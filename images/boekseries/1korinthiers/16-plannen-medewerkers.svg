<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Verschillende reisvoornemens</title><desc id="desc">Verschillende reisvoornemens met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verschillende reisvoornemens</text><text x="44" y="113" class="ref">1 Korinthiërs 16:5–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Paulus</text><text x="68" y="241" class="body">Via Macedonië naar Korinthe; mogelijk</text><text x="68" y="284" class="body">langer of in de winter.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tot Pinksteren</text><text x="68" y="433" class="body">Paulus blijft in Efeze, met kansen én</text><text x="68" y="476" class="body">tegenstanders.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Timotheüs</text><text x="68" y="625" class="body">Hartelijk ontvangen, niet kleineren en</text><text x="68" y="668" class="body">in vrede verder helpen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Apollos</text><text x="68" y="817" class="body">Komt nu niet; later als het hem</text><text x="68" y="860" class="body">uitkomt.</text><text x="46" y="953" class="note">De brief noemt plannen en verzoeken; dit is geen</text><text x="46" y="989" class="note">kaart van reeds voltooide reizen.</text></svg>