<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Delen in de opbrengst</title><desc id="desc">Delen in de opbrengst met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Delen in de opbrengst</text><text x="44" y="113" class="ref">1 Korinthiërs 9:7–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Soldaat, wijnbouwer en herder</text><text x="68" y="241" class="body">Kosten, vruchten en melk horen bij hun</text><text x="68" y="284" class="body">werk.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De dorsende os</text><text x="68" y="433" class="body">Mag volgens de wet geen muilkorf</text><text x="68" y="476" class="body">dragen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ploegen en dorsen</text><text x="68" y="625" class="body">Gebeurt in de hoop op een eigen deel.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De gevolgtrekking</text><text x="68" y="774" class="body">Wie het evangelie verkondigt, mag ervan</text><text x="68" y="817" class="body">leven.</text><text x="46" y="910" class="note">Paulus verdedigt een recht waarvan hij zelf</text><text x="46" y="946" class="note">vervolgens afziet.</text></svg>