<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Als er geen opstanding was</title><desc id="desc">Als er geen opstanding was met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Als er geen opstanding was</text><text x="44" y="113" class="ref">1 Korinthiërs 15:12–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De betwiste uitspraak</text><text x="68" y="241" class="body">Sommigen zeggen dat er geen opstanding</text><text x="68" y="284" class="body">van de doden is.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De gevolgtrekking</text><text x="68" y="433" class="body">Dan zou ook Christus niet opgewekt</text><text x="68" y="476" class="body">zijn.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De gevolgen · vers 14–19</text><text x="68" y="625" class="body">Zinloze verkondiging en geloof; nog</text><text x="68" y="668" class="body">zonden en verloren gestorvenen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De omkeer · vers 20</text><text x="68" y="817" class="body">Maar Christus is opgewekt uit de doden.</text><text x="46" y="910" class="note">Het schema maakt Paulus’ voorwaardelijke</text><text x="46" y="946" class="note">redenering zichtbaar, met zijn uitdrukkelijke</text><text x="46" y="982" class="note">slotsom.</text></svg>