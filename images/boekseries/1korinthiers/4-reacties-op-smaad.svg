<svg xmlns="http://www.w3.org/2000/svg" width="840" height="734" viewBox="0 0 840 734" role="img" aria-labelledby="title desc"><title id="title">Drie reacties op tegenstand</title><desc id="desc">Drie reacties op tegenstand met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="734" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie reacties op tegenstand</text><text x="44" y="113" class="ref">1 Korinthiërs 4:11–13</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uitgescholden</text><text x="68" y="241" class="body">Dan zegenen wij.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vervolgd</text><text x="68" y="390" class="body">Dan verdragen wij het.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Belasterd</text><text x="68" y="539" class="body">Dan spreken wij vriendelijk.</text><text x="46" y="632" class="note">De drie woordparen volgen de plaatselijke tekst</text><text x="46" y="668" class="note">en staan naast honger, arbeid en gebrek.</text></svg>