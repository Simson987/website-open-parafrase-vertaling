<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Fundament en getoetst werk</title><desc id="desc">Fundament en getoetst werk met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Fundament en getoetst werk</text><text x="44" y="113" class="ref">1 Korinthiërs 3:10–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het ene fundament</text><text x="68" y="241" class="body">Jezus Christus; niemand kan een ander</text><text x="68" y="284" class="body">fundament leggen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De zes materialen</text><text x="68" y="433" class="body">Goud, zilver, edelstenen, hout, hooi en</text><text x="68" y="476" class="body">stro.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het toetsen</text><text x="68" y="625" class="body">De dag en het vuur maken de waarde van</text><text x="68" y="668" class="body">het werk zichtbaar.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Twee uitkomsten voor het werk</text><text x="68" y="817" class="body">Wat blijft, krijgt loon; wat verbrandt,</text><text x="68" y="860" class="body">betekent schade.</text><text x="46" y="953" class="note">Dit is Paulus’ bouwvergelijking; de materialen</text><text x="46" y="989" class="note">zijn geen bouwadvies voor een tempel.</text></svg>