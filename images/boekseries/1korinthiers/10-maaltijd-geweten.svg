<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Markt, maaltijd en geweten</title><desc id="desc">Markt, maaltijd en geweten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Markt, maaltijd en geweten</text><text x="44" y="113" class="ref">1 Korinthiërs 10:23–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het uitgangspunt · vers 23–24</text><text x="68" y="241" class="body">Niet alles bouwt op; zoek het belang</text><text x="68" y="284" class="body">van de ander.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Op de markt · vers 25–26</text><text x="68" y="433" class="body">Eet zonder onderzoek naar de herkomst</text><text x="68" y="476" class="body">om je geweten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Op uitnodiging · vers 27</text><text x="68" y="625" class="body">Als je gaat, eet wat wordt voorgezet</text><text x="68" y="668" class="body">zonder onderzoek.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bij de melding offervlees · vers 28–29</text><text x="68" y="817" class="body">Eet dan niet, om de ander en diens</text><text x="68" y="860" class="body">geweten.</text><text x="46" y="953" class="note">Deze gevallen worden in het hoofdstuk</text><text x="46" y="989" class="note">uitdrukkelijk van afgodische tafelgemeenschap</text><text x="46" y="1025" class="note">onderscheiden.</text></svg>