<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Vier uitspraken en drie vragen</title><desc id="desc">Vier uitspraken en drie vragen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier uitspraken en drie vragen</text><text x="44" y="113" class="ref">1 Korinthiërs 1:12–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vier uitspraken</text><text x="68" y="241" class="body">Ik ben van Paulus, Apollos, Cefas of</text><text x="68" y="284" class="body">Christus.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vraag 1 · vers 13</text><text x="68" y="433" class="body">Is Christus verdeeld?</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vraag 2 en 3 · vers 13</text><text x="68" y="582" class="body">Is Paulus voor jullie gekruisigd, of in</text><text x="68" y="625" class="body">zijn naam gedoopt?</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De opdracht · vers 17</text><text x="68" y="774" class="body">Christus stuurde Paulus om het</text><text x="68" y="817" class="body">evangelie te verkondigen.</text><text x="46" y="910" class="note">De genoemde namen zijn geen vier verschillende</text><text x="46" y="946" class="note">verlossers; Paulus bestrijdt de verdeeldheid.</text></svg>