<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Vrijheid en het geweten</title><desc id="desc">Vrijheid en het geweten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrijheid en het geweten</text><text x="44" y="113" class="ref">1 Korinthiërs 8:7–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De kennis</text><text x="68" y="241" class="body">Niet iedereen heeft hetzelfde inzicht</text><text x="68" y="284" class="body">over offervlees.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het voorbeeld</text><text x="68" y="433" class="body">Iemand ziet een ander aanliggen in een</text><text x="68" y="476" class="body">afgodstempel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het gevaar</text><text x="68" y="625" class="body">Zijn zwakke geweten wordt aangemoedigd</text><text x="68" y="668" class="body">tegen zijn overtuiging.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De reactie van Paulus</text><text x="68" y="817" class="body">Laat de ander niet struikelen; liever</text><text x="68" y="860" class="body">geen vlees meer.</text><text x="46" y="953" class="note">Het voorbeeld is voorwaardelijk en geen verslag</text><text x="46" y="989" class="note">van een concrete maaltijd in Korinthe.</text></svg>