<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">De genoemde getuigen</title><desc id="desc">De genoemde getuigen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde getuigen</text><text x="44" y="113" class="ref">1 Korinthiërs 15:5–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 5</text><text x="68" y="241" class="body">Cefas, daarna de twaalf.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vers 6</text><text x="68" y="390" class="body">Meer dan vijfhonderd mensen tegelijk;</text><text x="68" y="433" class="body">de meesten leven nog.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vers 7</text><text x="68" y="582" class="body">Jakobus, daarna alle apostelen.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Vers 8</text><text x="68" y="731" class="body">Als laatste noemt Paulus zichzelf.</text><text x="46" y="824" class="note">Dit is de volgorde van de getuigenlijst in deze</text><text x="46" y="860" class="note">brief; geen extra locaties of kalenderdata</text><text x="46" y="896" class="note">toegevoegd.</text></svg>