<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Bekendgemaakt door de Geest</title><desc id="desc">Bekendgemaakt door de Geest met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bekendgemaakt door de Geest</text><text x="44" y="113" class="ref">1 Korinthiërs 2:10–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie kent de mens? · vers 11</text><text x="68" y="241" class="body">De geest van die mens zelf kent wat in</text><text x="68" y="284" class="body">hem omgaat.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wie kent God? · vers 11</text><text x="68" y="433" class="body">De Geest van God kent wat in God</text><text x="68" y="476" class="body">omgaat.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat ontvangen wij? · vers 12</text><text x="68" y="625" class="body">De Geest uit God, om het geschonkene te</text><text x="68" y="668" class="body">kennen.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Hoe spreken wij? · vers 13</text><text x="68" y="817" class="body">Met woorden die de Heilige Geest leert.</text><text x="46" y="910" class="note">Het schema volgt de vergelijking van vers 11</text><text x="46" y="946" class="note">zonder de Geest als een mens te portretteren.</text></svg>