<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Ontvangen en doorgegeven</title><desc id="desc">Ontvangen en doorgegeven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ontvangen en doorgegeven</text><text x="44" y="113" class="ref">1 Korinthiërs 11:23–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het brood · vers 23–24</text><text x="68" y="241" class="body">Jezus dankte, brak het en gaf het tot</text><text x="68" y="284" class="body">Zijn gedachtenis.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De beker · vers 25</text><text x="68" y="433" class="body">Na de maaltijd: het nieuwe verbond in</text><text x="68" y="476" class="body">Zijn bloed.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De gedachtenis</text><text x="68" y="625" class="body">Doe dit om Hem te gedenken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De verkondiging · vers 26</text><text x="68" y="774" class="body">De dood van de Heere verkondigen,</text><text x="68" y="817" class="body">totdat Hij komt.</text><text x="46" y="910" class="note">De volgorde van brood en beker volgt de woorden</text><text x="46" y="946" class="note">die Paulus heeft doorgegeven.</text></svg>