<svg xmlns="http://www.w3.org/2000/svg" width="840" height="754" viewBox="0 0 840 754"><title>Dienaren op Gods akker</title><rect width="840" height="754" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Dienaren op Gods akker</text><text x="42" y="105" font-size="25">1 Korinthiërs 3:5–9</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Jullie zijn de akker van God</text><path d="M470 215 V235 H75 V565.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 311.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Paulus</text><text x="175" y="337" font-size="29">Ik heb geplant.</text><path d="M75 438.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="387" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="424" font-size="31" font-weight="700">Apollos</text><text x="175" y="464" font-size="29">Heeft water gegeven.</text><path d="M75 565.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="514" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="551" font-size="31" font-weight="700">God</text><text x="175" y="591" font-size="29">Heeft laten groeien.</text><text x="42" y="663" font-size="26">De dienaren werken samen; de groei wordt aan God</text><text x="42" y="697" font-size="26">toegeschreven. Dit is een vergelijking.</text></g></svg>