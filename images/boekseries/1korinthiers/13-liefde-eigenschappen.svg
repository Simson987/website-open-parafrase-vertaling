<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Wat liefde doet en laat</title><desc id="desc">Wat liefde doet en laat met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat liefde doet en laat</text><text x="44" y="113" class="ref">1 Korinthiërs 13:4–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geduldig en vriendelijk</text><text x="68" y="241" class="body">Niet jaloers, opschepperig of</text><text x="68" y="284" class="body">opgeblazen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Niet op zichzelf gericht</text><text x="68" y="433" class="body">Niet onbehoorlijk, verbitterd of het</text><text x="68" y="476" class="body">kwade aanrekenend.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Blij met de waarheid</text><text x="68" y="625" class="body">Niet blij met onrecht.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Volhardend</text><text x="68" y="774" class="body">Bedekt, gelooft, hoopt en verdraagt</text><text x="68" y="817" class="body">alles.</text><text x="46" y="910" class="note">De eigenschappen worden in vier leesbare groepen</text><text x="46" y="946" class="note">geordend naar de plaatselijke tekst.</text></svg>