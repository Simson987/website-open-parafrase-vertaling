<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Bevel, toestemming en mening</title><desc id="desc">Bevel, toestemming en mening met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bevel, toestemming en mening</text><text x="44" y="113" class="ref">1 Korinthiërs 7:6–10, 12, 25, 35, 40</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 6 · Toestemming</text><text x="68" y="241" class="body">Paulus noemt dit toestemming, geen</text><text x="68" y="284" class="body">bevel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 10 · De Heere</text><text x="68" y="433" class="body">Bij de getrouwden noemt hij een gebod</text><text x="68" y="476" class="body">van de Heere.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vers 12 en 25 · Paulus</text><text x="68" y="625" class="body">Hij onderscheidt zijn woorden en zijn</text><text x="68" y="668" class="body">betrouwbare mening.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vers 35 en 40 · Zijn bedoeling</text><text x="68" y="817" class="body">Helpen zonder vast te binden; advies</text><text x="68" y="860" class="body">over blijven.</text><text x="46" y="953" class="note">De aanduidingen bewaren de verschillen die</text><text x="46" y="989" class="note">Paulus in de brief zelf maakt.</text></svg>