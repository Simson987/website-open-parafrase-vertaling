<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Een recht en een eigen keuze</title><desc id="desc">Een recht en een eigen keuze met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een recht en een eigen keuze</text><text x="44" y="113" class="ref">1 Korinthiërs 9:12–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het recht</text><text x="68" y="241" class="body">Onderhoud ontvangen bij de</text><text x="68" y="284" class="body">verkondiging.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Paulus’ keuze</text><text x="68" y="433" class="body">Van dat recht geen gebruik maken en</text><text x="68" y="476" class="body">gratis verkondigen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zijn bedoeling</text><text x="68" y="625" class="body">Het evangelie niet in de weg staan.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Zijn dienstbaarheid</text><text x="68" y="774" class="body">Vrij van allen, en toch dienaar van</text><text x="68" y="817" class="body">allen om mensen te winnen.</text><text x="46" y="910" class="note">Recht en vrijwillig afzien blijven beide</text><text x="46" y="946" class="note">onderdeel van zijn betoog.</text></svg>