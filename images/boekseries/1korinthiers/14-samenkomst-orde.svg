<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Om de beurt en met uitleg</title><desc id="desc">Om de beurt en met uitleg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Om de beurt en met uitleg</text><text x="44" y="113" class="ref">1 Korinthiërs 14:26–33, 39–40</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Talen · vers 27–28</text><text x="68" y="241" class="body">Twee, hoogstens drie, om de beurt; één</text><text x="68" y="284" class="body">legt uit.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zonder uitlegger · vers 28</text><text x="68" y="433" class="body">Zwijgen in de samenkomst; voor zichzelf</text><text x="68" y="476" class="body">tot God spreken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Profeten · vers 29–31</text><text x="68" y="625" class="body">Twee of drie; anderen beoordelen;</text><text x="68" y="668" class="body">ruimte voor de volgende.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het doel · vers 26, 33 en 40</text><text x="68" y="817" class="body">Opbouw, vrede en orde.</text><text x="46" y="910" class="note">Het schema behandelt de spreekorde; lees ook de</text><text x="46" y="946" class="note">overige aanwijzingen van het hoofdstuk.</text></svg>