<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Eer, verbondenheid en de maaltijd</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eer, verbondenheid en de maaltijd</text><text x="44" y="113" class="ref">1 Korinthiërs 11:1–34</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–16 · Hoofd en bedekking</text><text x="68" y="241" class="body">Paulus redeneert over bidden,</text><text x="68" y="284" class="body">profeteren en wederzijdse</text><text x="68" y="327" class="body">verbondenheid.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">17–22 · Scheuringen aan tafel</text><text x="68" y="476" class="body">De een heeft honger; de ander neemt</text><text x="68" y="519" class="body">alvast zijn maaltijd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">23–26 · Ontvangen en doorgegeven</text><text x="68" y="668" class="body">Brood en beker tot gedachtenis van de</text><text x="68" y="711" class="body">Heere.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">27–34 · Onderzoek en wachten</text><text x="68" y="860" class="body">Onderscheid het lichaam; wacht op</text><text x="68" y="903" class="body">elkaar.</text><text x="46" y="996" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1032" class="note">de plaatselijke versindeling.</text></svg>