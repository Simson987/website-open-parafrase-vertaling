<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Dienstgroepen en registratie</title><desc id="desc">Verschillende dienstgroepen en de functie van afstammingsbewijs.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dienstgroepen en registratie</text><text x="44" y="113" class="ref">Ezra 2:36–63</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vier priestergroepen</text><text x="68" y="241" class="body">Jedaja 973; Immer 1.052; Pashur 1.247;</text><text x="68" y="284" class="body">Harim 1.017.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Levieten en zangers</text><text x="68" y="433" class="body">Jesua en Kadmiël uit Hodavja 74; Asafs</text><text x="68" y="476" class="body">nakomelingen 128.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Poortwachters</text><text x="68" y="625" class="body">Sallum, Ater, Talmon, Akkub, Hatita en</text><text x="68" y="668" class="body">Sobai: samen 139.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Tempelknechten en dienaren</text><text x="68" y="817" class="body">Samen 392; hun familielijsten staan in</text><text x="68" y="860" class="body">vers 43–58.</text><rect x="42" y="918" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Zonder aantoonbare herkomst</text><text x="68" y="1009" class="body">Delaja, Tobia en Nekoda: 652; ook</text><text x="68" y="1052" class="body">priesters zonder registerbewijs mogen</text><text x="68" y="1095" class="body">voorlopig niet van de allerheiligste</text><text x="68" y="1138" class="body">gaven eten.</text><text x="46" y="1231" class="note">De toelating van de priesters blijft uitgesteld</text><text x="46" y="1267" class="note">tot een priester met urim en tummim; er wordt</text><text x="46" y="1303" class="note">geen ontbrekend register verzonnen.</text></svg>