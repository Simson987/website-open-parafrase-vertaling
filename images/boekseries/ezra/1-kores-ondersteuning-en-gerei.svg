<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1448" viewBox="0 0 840 1448" role="img" aria-labelledby="title desc"><title id="title">Kores, hulp en heilig gerei</title><desc id="desc">Opdracht, ondersteuning, overdracht en het zichtbare verschil tussen lijst en totaal.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1448" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kores, hulp en heilig gerei</text><text x="44" y="113" class="ref">Ezra 1:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oproep</text><text x="68" y="241" class="body">Kores’ eerste jaar; optrekken naar</text><text x="68" y="284" class="body">Jeruzalem en Gods huis bouwen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De helpers</text><text x="68" y="433" class="body">Buren geven zilver, goud, bezit, vee en</text><text x="68" y="476" class="body">vrijwillige gaven.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De bewaarders</text><text x="68" y="625" class="body">Kores laat Mithredath, de schatmeester,</text><text x="68" y="668" class="body">voorwerpen uittellen aan Sesbazar,</text><text x="68" y="711" class="body">leider van Juda.</text><rect x="42" y="769" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Genoemde soorten</text><text x="68" y="860" class="body">30 gouden schalen, 1.000 zilveren</text><text x="68" y="903" class="body">schalen, 29 messen; 30 gouden bekers,</text><text x="68" y="946" class="body">410 andere zilveren bekers en 1.000</text><text x="68" y="989" class="body">andere voorwerpen.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Het genoemde totaal</text><text x="68" y="1138" class="body">5.400 gouden en zilveren voorwerpen mee</text><text x="68" y="1181" class="body">naar Jeruzalem.</text><text x="46" y="1274" class="note">De gespecificeerde aantallen tellen op tot</text><text x="46" y="1310" class="note">2.499; het opgegeven totaal is 5.400. Het</text><text x="46" y="1346" class="note">verschil wordt niet met verzonnen voorwerpen</text><text x="46" y="1382" class="note">gevuld.</text></svg>