<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Reisgroepen en leiders</title><desc id="desc">Leiders en genoemde groepsaantallen zonder ontbrekende namen te verzinnen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reisgroepen en leiders</text><text x="44" y="113" class="ref">Ezra 8:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie lijnen</text><text x="68" y="241" class="body">Pinehas: Gersom; Ithamar: Daniël;</text><text x="68" y="284" class="body">David: Hattus.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Paros en Pahath-Moab</text><text x="68" y="433" class="body">Zacharja met 150; Eljehoenai met 200.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Sechanja en Adin</text><text x="68" y="582" class="body">De zoon van Jahaziël met 300; Ebed met</text><text x="68" y="625" class="body">vijftig.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Elam, Sefatja en Joab</text><text x="68" y="774" class="body">Jesaja met zeventig; Zebadja met</text><text x="68" y="817" class="body">tachtig; Obadja met 218.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Andere groepen</text><text x="68" y="966" class="body">Selomith 160, Babai 28, Azgad 110,</text><text x="68" y="1009" class="body">Adonikam zestig, Bigvai zeventig.</text><text x="46" y="1102" class="note">Vers 5 en 10 geven een vadersnaam zonder de</text><text x="46" y="1138" class="note">eigennaam van de zoon. Die wordt niet ingevuld;</text><text x="46" y="1174" class="note">Babai en Bebai staan in vers 11 in eigen vormen.</text></svg>