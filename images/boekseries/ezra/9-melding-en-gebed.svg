<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1455" viewBox="0 0 840 1455" role="img" aria-labelledby="title desc"><title id="title">Melding, rouw en gebed</title><desc id="desc">De beweging van bericht via rouw naar schuldbelijdenis en genade.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1455" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Melding, rouw en gebed</text><text x="44" y="113" class="ref">Ezra 9:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De melding</text><text x="68" y="241" class="body">Ook leiders, priesters en Levieten</text><text x="68" y="284" class="body">hebben buitenlandse huwelijken gesloten</text><text x="68" y="327" class="body">en de gruwelijke daden overgenomen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Ezra’s rouw</text><text x="68" y="476" class="body">Scheurt kleed en mantel, trekt haren</text><text x="68" y="519" class="body">uit en zit verslagen tot het</text><text x="68" y="562" class="body">avondoffer.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Schuldbelijdenis</text><text x="68" y="711" class="body">Gezamenlijke schuld sinds de voorouders</text><text x="68" y="754" class="body">en de gevolgen van oorlog en</text><text x="68" y="797" class="body">gevangenschap.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Ontvangen genade</text><text x="68" y="946" class="body">Een overgebleven groep, herbouw en</text><text x="68" y="989" class="body">bescherming onder Perzische koningen.</text><rect x="42" y="1047" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">De vraag</text><text x="68" y="1138" class="body">Na die genade toch opnieuw de geboden</text><text x="68" y="1181" class="body">verlaten? Ezra erkent Gods</text><text x="68" y="1224" class="body">rechtvaardigheid.</text><text x="46" y="1317" class="note">Het schema beschrijft Ezra’s eigen gebed en de</text><text x="46" y="1353" class="note">toenmalige verbondscrisis; de gebedsbeelden zijn</text><text x="46" y="1389" class="note">geen aparte historische rampen op dat moment.</text></svg>