<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Voltooiing, inwijding, pascha</title><desc id="desc">Data, offeraantallen en de deelnemers aan het feest.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voltooiing, inwijding, pascha</text><text x="44" y="113" class="ref">Ezra 6:15–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voltooiing</text><text x="68" y="241" class="body">Dag drie van Adar in Darius’ zesde</text><text x="68" y="284" class="body">jaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Inwijding</text><text x="68" y="433" class="body">100 runderen, 200 rammen, 400 lammeren</text><text x="68" y="476" class="body">en twaalf bokken voor heel Israël.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Dienstgroepen</text><text x="68" y="625" class="body">Priesters en Levieten volgens Mozes’</text><text x="68" y="668" class="body">boek.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Pascha</text><text x="68" y="817" class="body">Dag veertien van maand één; ook wie</text><text x="68" y="860" class="body">zich afkeert van onreinheid en God</text><text x="68" y="903" class="body">zoekt eet mee.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Feest</text><text x="68" y="1052" class="body">Zeven dagen ongezuurde broden met</text><text x="68" y="1095" class="body">blijdschap.</text><text x="46" y="1188" class="note">Bouwvoltooiing, inwijding en pascha zijn</text><text x="46" y="1224" class="note">onderscheiden gebeurtenissen met eigen datums.</text></svg>