<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Ahava: Levieten en vasten</title><desc id="desc">De voorbereiding en de verschillende groepen bij de rivier.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ahava: Levieten en vasten</text><text x="44" y="113" class="ref">Ezra 8:15–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie dagen</text><text x="68" y="241" class="body">Ezra onderzoekt het kamp en vindt nog</text><text x="68" y="284" class="body">geen Levieten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Naar Chasifja</text><text x="68" y="433" class="body">Een gezantschap naar Iddo om dienaren</text><text x="68" y="476" class="body">voor Gods huis te vragen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De komst</text><text x="68" y="625" class="body">Serebja met achttien; Hasabja en Jesaja</text><text x="68" y="668" class="body">met twintig; 220 tempelknechten.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vasten</text><text x="68" y="817" class="body">Veilige reis gevraagd voor mensen,</text><text x="68" y="860" class="body">kinderen en bezit; geen soldaten of</text><text x="68" y="903" class="body">ruiters aangevraagd.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Twaalf bewaarders</text><text x="68" y="1052" class="body">Serebja, Hasabja en tien broers worden</text><text x="68" y="1095" class="body">aangewezen.</text><text x="46" y="1188" class="note">Het ontbreken van Levieten wordt eerst opgemerkt</text><text x="46" y="1224" class="note">en daarna opgelost; de groepen worden niet bij</text><text x="46" y="1260" class="note">aankomst teruggeprojecteerd.</text></svg>