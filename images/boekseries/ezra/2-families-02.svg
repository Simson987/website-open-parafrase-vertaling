<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1664" viewBox="0 0 840 1664" role="img" aria-labelledby="title desc"><title id="title">Familiegroepen, tweede deel</title><desc id="desc">De namen en aantallen uit deze eigen passage.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1664" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familiegroepen, tweede deel</text><text x="44" y="113" class="ref">Ezra 2:12–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Azgad</text><text x="68" y="241" class="body">1.222</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Adonikam</text><text x="68" y="390" class="body">666</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Bigvai</text><text x="68" y="539" class="body">2.056</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Adin</text><text x="68" y="688" class="body">454</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Ater</text><text x="68" y="837" class="body">98; via Hizkia</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">Bezai</text><text x="68" y="986" class="body">323</text><rect x="42" y="1044" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1087" class="label">Jora</text><text x="68" y="1135" class="body">112</text><rect x="42" y="1193" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1236" class="label">Hasum</text><text x="68" y="1284" class="body">223</text><rect x="42" y="1342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1385" class="label">Gibbar</text><text x="68" y="1433" class="body">95</text><text x="46" y="1526" class="note">Genoemde groep en aantal; geen vader-zoonketen.</text><text x="46" y="1562" class="note">Gelijknamige families in andere lijsten krijgen</text><text x="46" y="1598" class="note">niet automatisch hetzelfde getal.</text></svg>