<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Priesters en dienstgroepen</title><desc id="desc">Alle namen uit de genoemde priester- en dienstgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Priesters en dienstgroepen</text><text x="44" y="113" class="ref">Ezra 10:18–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jesua’s familie</text><text x="68" y="241" class="body">Maäseja, Eliëzer, Jarib en Gedalja;</text><text x="68" y="284" class="body">belofte van wegsturen en een ram als</text><text x="68" y="327" class="body">schuldoffer.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Immer</text><text x="68" y="476" class="body">Hanani en Zebadja.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Harim</text><text x="68" y="625" class="body">Maäseja, Elia, Semaja, Jehiël en Uzia.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Pashur</text><text x="68" y="774" class="body">Eljoënai, Maäseja, Ismaël, Nethaneël,</text><text x="68" y="817" class="body">Jozabad en Elasa.</text><rect x="42" y="875" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Levieten en anderen</text><text x="68" y="966" class="body">Jozabad, Simeï, Kelaja/Kelita,</text><text x="68" y="1009" class="body">Pethahja, Juda en Eliëzer; zanger</text><text x="68" y="1052" class="body">Eljasib; poortwachters Sallum, Telem en</text><text x="68" y="1095" class="body">Uri.</text><text x="46" y="1188" class="note">Kelaja en Kelita zijn twee namen van dezelfde</text><text x="46" y="1224" class="note">persoon; herhaalde namen in andere families</text><text x="46" y="1260" class="note">worden niet samengevoegd.</text></svg>