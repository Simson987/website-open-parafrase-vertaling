<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Herbouw, vraag en antwoord</title><desc id="desc">Profeten, bestuurders en de gang van het officiële onderzoek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herbouw, vraag en antwoord</text><text x="44" y="113" class="ref">Ezra 5:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bemoediging</text><text x="68" y="241" class="body">Haggai en Zacharia, zoon van Iddo,</text><text x="68" y="284" class="body">steunen Zerubbabel en Jesua.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onderzoek</text><text x="68" y="433" class="body">Thathnai en Sthar-Boznai vragen naar</text><text x="68" y="476" class="body">bevel en namen; het werk wordt</text><text x="68" y="519" class="body">voorlopig niet gestopt.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De verklaring</text><text x="68" y="668" class="body">Eerder huis gebouwd, door schuld</text><text x="68" y="711" class="body">verwoest; Kores beval herbouw en</text><text x="68" y="754" class="body">teruggave van het gerei.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Sesbazar</text><text x="68" y="903" class="body">Ontving de voorwerpen en legde volgens</text><text x="68" y="946" class="body">het antwoord de fundamenten.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Verzoek aan Darius</text><text x="68" y="1095" class="body">Zoek het bevel van Kores in het</text><text x="68" y="1138" class="body">koninklijke archief en stuur een</text><text x="68" y="1181" class="body">besluit.</text><text x="46" y="1274" class="note">De verklaring van de oudsten is als hun antwoord</text><text x="46" y="1310" class="note">weergegeven; de archiefvondst volgt in hoofdstuk</text><text x="46" y="1346" class="note">6.</text></svg>