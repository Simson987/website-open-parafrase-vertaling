<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Bewaren en verantwoorden</title><desc id="desc">Voorraad, bewaarders, reistijd en controle bij aankomst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bewaren en verantwoorden</text><text x="44" y="113" class="ref">Ezra 8:25–36</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afgewogen gaven</text><text x="68" y="241" class="body">Circa 22 ton zilver, honderd zilveren</text><text x="68" y="284" class="body">voorwerpen van circa 34 kilo elk, 3,4</text><text x="68" y="327" class="body">ton goud, twintig gouden bekers en twee</text><text x="68" y="370" class="body">kostbare koperen voorwerpen.</text><rect x="42" y="428" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Vertrek</text><text x="68" y="519" class="body">Dag twaalf van maand één vanaf Ahava;</text><text x="68" y="562" class="body">bescherming onderweg.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Jeruzalem</text><text x="68" y="711" class="body">Drie dagen rust; op dag vier tellen,</text><text x="68" y="754" class="body">wegen en alles opschrijven.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Vier ontvangers</text><text x="68" y="903" class="body">Meremoth, Eleazar, Jozabad en Noadja</text><text x="68" y="946" class="body">met genoemde vaders.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Offers en bevelen</text><text x="68" y="1095" class="body">Twaalf stieren, 96 rammen, 77 lammeren,</text><text x="68" y="1138" class="body">twaalf bokken; koninklijke wetten aan</text><text x="68" y="1181" class="body">bestuurders overhandigd.</text><text x="46" y="1274" class="note">Gaven worden vóór en na de reis gewogen; de</text><text x="46" y="1310" class="note">afzonderlijke honderd voorwerpen blijven naast</text><text x="46" y="1346" class="note">het genoemde zilvergewicht staan.</text></svg>