<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1362" viewBox="0 0 840 1362" role="img" aria-labelledby="title desc"><title id="title">Tegenstand onder koningen</title><desc id="desc">Koningsnamen en onderwerpen zonder alle brieven op één dag te plaatsen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1362" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tegenstand onder koningen</text><text x="44" y="113" class="ref">Ezra 4:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kores tot Darius</text><text x="68" y="241" class="body">Afgewezen aanbod, ontmoediging en</text><text x="68" y="284" class="body">ingehuurde raadgevers tegen de bouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ahasveros</text><text x="68" y="433" class="body">Aanklacht aan het begin van zijn</text><text x="68" y="476" class="body">regering.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Arthahsasta</text><text x="68" y="625" class="body">Brief over Jeruzalem als opstandige</text><text x="68" y="668" class="body">stad, belasting en muren; antwoord</text><text x="68" y="711" class="body">beveelt stop tot nader bevel.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Uitvoering</text><text x="68" y="860" class="body">Rehum en Simsai dwingen het werk te</text><text x="68" y="903" class="body">stoppen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Terug naar de tempelbouw</text><text x="68" y="1052" class="body">Vers 24 noemt stilstand tot Darius’</text><text x="68" y="1095" class="body">tweede jaar.</text><text x="46" y="1188" class="note">Het hoofdstuk verzamelt verschillende perioden</text><text x="46" y="1224" class="note">van tegenstand. De stadsmuren in de brief zijn</text><text x="46" y="1260" class="note">niet automatisch dezelfde bouwfase als het</text><text x="46" y="1296" class="note">tempelfundament.</text></svg>