<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1491" viewBox="0 0 840 1491" role="img" aria-labelledby="title desc"><title id="title">Voorstel, regen en onderzoek</title><desc id="desc">Voorstel, sanctie, tegenstemmen en tijdsverloop van het onderzoek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1491" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voorstel, regen en onderzoek</text><text x="44" y="113" class="ref">Ezra 10:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sechanja’s voorstel</text><text x="68" y="241" class="body">Verbond om de buitenlandse vrouwen en</text><text x="68" y="284" class="body">hun kinderen weg te sturen; Ezra laat</text><text x="68" y="327" class="body">een eed afleggen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Drie dagen</text><text x="68" y="476" class="body">Oproep met verlies van bezit en</text><text x="68" y="519" class="body">uitsluiting als sanctie voor</text><text x="68" y="562" class="body">wegblijven.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Dag twintig, maand negen</text><text x="68" y="711" class="body">Vergadering rilt op het plein in de</text><text x="68" y="754" class="body">stortregen.</text><rect x="42" y="812" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Bezwaar en regeling</text><text x="68" y="903" class="body">Te veel mensen en regen; behandeling</text><text x="68" y="946" class="body">per stad en tijdstip. Jonathan,</text><text x="68" y="989" class="body">Jehazia, Mesullam en Sabbethai zijn</text><text x="68" y="1032" class="body">tegen.</text><rect x="42" y="1090" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1133" class="label">Onderzoeksperiode</text><text x="68" y="1181" class="body">Van dag één van maand tien tot dag één</text><text x="68" y="1224" class="body">van maand één.</text><text x="46" y="1317" class="note">Het wegsturen van vrouwen en kinderen is de</text><text x="46" y="1353" class="note">harde inhoud van het voorstel; dit overzicht</text><text x="46" y="1389" class="note">verzwijgt die niet en verzint geen uitgebeelde</text><text x="46" y="1425" class="note">geweldsscène.</text></svg>