<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Reis en koninklijke opdracht</title><desc id="desc">Tijd, persoonlijke toewijding en inhoud van de machtiging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reis en koninklijke opdracht</text><text x="44" y="113" class="ref">Ezra 7:6–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De reis</text><text x="68" y="241" class="body">Arthahsasta’s zevende jaar; vertrek op</text><text x="68" y="284" class="body">dag één van maand één, aankomst op dag</text><text x="68" y="327" class="body">één van maand vijf.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Ezra’s hart</text><text x="68" y="476" class="body">Wet zoeken, doen en Israël onderwijzen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vrije deelname</text><text x="68" y="625" class="body">Israëlieten en dienstgroepen mogen met</text><text x="68" y="668" class="body">hem mee.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Middelen</text><text x="68" y="817" class="body">Tot circa 3,4 ton zilver, 22 ton tarwe,</text><text x="68" y="860" class="body">2.200 liter wijn en 2.200 liter olie;</text><text x="68" y="903" class="body">zout zonder vaste limiet.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Bestuur</text><text x="68" y="1052" class="body">Rechters aanstellen, onwetenden</text><text x="68" y="1095" class="body">onderwijzen; dienaren van Gods huis</text><text x="68" y="1138" class="body">vrij van belasting, accijns en tol.</text><text x="46" y="1231" class="note">Ezra is priester en schriftgeleerde, geen</text><text x="46" y="1267" class="note">koning; de brief verleent hem onderscheiden</text><text x="46" y="1303" class="note">taken en middelen.</text></svg>