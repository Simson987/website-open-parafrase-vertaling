<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1376" viewBox="0 0 840 1376" role="img" aria-labelledby="title desc"><title id="title">Altaar vóór het fundament</title><desc id="desc">Tijdstappen, juiste vadersnamen en de gemengde reactie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1376" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Altaar vóór het fundament</text><text x="44" y="113" class="ref">Ezra 3:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zevende maand</text><text x="68" y="241" class="body">Eensgezind bijeen; Jesua, zoon van</text><text x="68" y="284" class="body">Jozadak, en Zerubbabel, zoon van</text><text x="68" y="327" class="body">Sealthiël, gaan voor.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Eerste dag</text><text x="68" y="476" class="body">Offers vanaf dag één van maand zeven;</text><text x="68" y="519" class="body">tempel nog niet gegrondvest.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Materiaal</text><text x="68" y="668" class="body">Betaling aan vaklieden en voedsel,</text><text x="68" y="711" class="body">drinken en olie voor hout uit Libanon</text><text x="68" y="754" class="body">via Jafo.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Jaar twee, maand twee</text><text x="68" y="903" class="body">De bouw begint; Levieten vanaf twintig</text><text x="68" y="946" class="body">jaar houden toezicht.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Het fundament</text><text x="68" y="1095" class="body">Trompetten, cimbalen en dank; gejuich</text><text x="68" y="1138" class="body">én huilen van wie het eerste huis</text><text x="68" y="1181" class="body">gekend hebben.</text><text x="46" y="1274" class="note">Altaarherstel en de latere tempelgrondlegging</text><text x="46" y="1310" class="note">zijn niet hetzelfde bouwmoment.</text></svg>