<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Families in de verdere lijst</title><desc id="desc">Groepsindeling, herhaalde namen en de expliciete vermelding van kinderen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Families in de verdere lijst</text><text x="44" y="113" class="ref">Ezra 10:25–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste groepen</text><text x="68" y="241" class="body">Paros, Elam, Zatthu, Bebai, Bani en</text><text x="68" y="284" class="body">Pahath-Moab.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Daarna</text><text x="68" y="433" class="body">Harim en Hasum; opnieuw een lange groep</text><text x="68" y="476" class="body">bij Bani in vers 34–42.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Laatste groep</text><text x="68" y="625" class="body">Nebo: Jeïel, Mattithja, Zabad, Zebina,</text><text x="68" y="668" class="body">Jaddai, Joël en Benaja.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De slotzin</text><text x="68" y="817" class="body">Allen hadden buitenlandse vrouwen;</text><text x="68" y="860" class="body">sommigen hadden met hen kinderen</text><text x="68" y="903" class="body">gekregen.</text><text x="46" y="996" class="note">De lijst noemt twee passages met Bani en</text><text x="46" y="1032" class="note">tweemaal Malchia bij Paros. De eigen lijstvorm</text><text x="46" y="1068" class="note">blijft behouden; geen nieuwe verwantschappen</text><text x="46" y="1104" class="note">afgeleid.</text></svg>