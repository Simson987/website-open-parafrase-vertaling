<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Gevonden bevel en voorziening</title><desc id="desc">De archiefvondst, bouwvoorwaarden en dagelijkse ondersteuning.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gevonden bevel en voorziening</text><text x="44" y="113" class="ref">Ezra 6:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Archiefonderzoek</text><text x="68" y="241" class="body">Zoeken in Babel; rol gevonden in</text><text x="68" y="284" class="body">Achmetha in Medië.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kores’ bevel</text><text x="68" y="433" class="body">Herbouw; circa 27 meter hoog en breed;</text><text x="68" y="476" class="body">drie steenlagen en één houtlaag; kosten</text><text x="68" y="519" class="body">uit de koninklijke kas.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Darius’ antwoord</text><text x="68" y="668" class="body">Werk met rust laten en betalen uit de</text><text x="68" y="711" class="body">belastinginkomsten van het gebied.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Dagelijkse benodigdheden</text><text x="68" y="860" class="body">Offerdieren, tarwe, zout, wijn en olie;</text><text x="68" y="903" class="body">priesters geven de behoefte aan.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De sanctie</text><text x="68" y="1052" class="body">Verandering van het besluit wordt met</text><text x="68" y="1095" class="body">dood en verwoesting van het huis</text><text x="68" y="1138" class="body">bedreigd.</text><text x="46" y="1231" class="note">De twee koninklijke teksten worden</text><text x="46" y="1267" class="note">onderscheiden; de genoemde bouwmaten vormen geen</text><text x="46" y="1303" class="note">complete plattegrond.</text></svg>