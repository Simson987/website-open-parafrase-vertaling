<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Totalen, dieren en gaven</title><desc id="desc">De aparte totalen, soorten dieren, gaven en vestiging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Totalen, dieren en gaven</text><text x="44" y="113" class="ref">Ezra 2:64–70</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vergadering</text><text x="68" y="241" class="body">42.360; daarnaast 7.337 slaven en</text><text x="68" y="284" class="body">slavinnen en 200 zangers en</text><text x="68" y="327" class="body">zangeressen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Rijdieren</text><text x="68" y="476" class="body">736 paarden, 245 muildieren, 435</text><text x="68" y="519" class="body">kamelen en 6.720 ezels.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vrijwillige gaven</text><text x="68" y="668" class="body">61.000 gouden munten, ongeveer 2,9 ton</text><text x="68" y="711" class="body">zilver en honderd priestergewaden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vestiging</text><text x="68" y="860" class="body">Dienstgroepen en heel Israël gaan in</text><text x="68" y="903" class="body">hun eigen steden wonen.</text><text x="46" y="996" class="note">De aanvullende groepen worden niet zonder</text><text x="46" y="1032" class="note">toelichting bij een ander lijsttotaal gevoegd;</text><text x="46" y="1068" class="note">bedragen volgen deze vertaling.</text></svg>