hor="middle" font-size="31">Azarja</text><path d="M420 1329 V1349" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="1355" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="1391" text-anchor="middle" font-size="31">Seraja</text><path d="M420 1409 V1429" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="1435" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="1471" text-anchor="middle" font-size="31">Ezra</text><text x="42" y="1535" font-size="26">De keten volgt de in dit hoofdstuk genoemde</text><text x="42" y="1569" font-size="26">afstamming in omgekeerde leesrichting, van Aäron</text><text x="42" y="1603" font-size="26">naar Ezra; terugkerende namen blijven aparte</text><text x="42" y="1637" font-size="26">posities.</text></g></svg>