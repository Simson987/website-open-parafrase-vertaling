<svg xmlns="http://www.w3.org/2000/svg" width="840" height="793" viewBox="0 0 840 793" role="img" aria-labelledby="title desc"><title id="title">Twee verklaringen van het onheil</title><desc id="desc">De tegengestelde verklaringen van volk en profeet in hun eigen woorden samengevat.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="793" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee verklaringen van het onheil</text><text x="44" y="113" class="ref">Jeremia 44:17–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De menigte · 17–19</text><text x="68" y="241" class="body">Toen wij offerden, hadden wij brood en</text><text x="68" y="284" class="body">voorspoed. Sinds wij stopten, is er</text><text x="68" y="327" class="body">gebrek, zwaard en honger.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jeremia · 21–23</text><text x="68" y="476" class="body">Juist het offeren aan andere goden en</text><text x="68" y="519" class="body">niet luisteren bracht Gods oordeel en</text><text x="68" y="562" class="body">maakte het land verlaten.</text><text x="46" y="655" class="note">De twee oorzakelijke verklaringen worden niet</text><text x="46" y="691" class="note">samengevoegd. Aan het einde van de rede wordt</text><text x="46" y="727" class="note">gevraagd wiens woord standhoudt.</text></svg>