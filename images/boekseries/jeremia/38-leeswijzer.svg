<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1107" viewBox="0 0 840 1107" role="img" aria-labelledby="title desc"><title id="title">De put en de geheime raad</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1107" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De put en de geheime raad</text><text x="44" y="113" class="ref">Jeremia 38:1–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">In de put · 1–6</text><text x="68" y="241" class="body">Woorden over uitgaan maken vorsten</text><text x="68" y="284" class="body">boos; de koning laat hen begaan.</text><text x="68" y="327" class="body">Jeremia zakt in waterloze modder.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De redding · 7–13</text><text x="68" y="476" class="body">Ebed-Melech vraagt recht, krijgt dertig</text><text x="68" y="519" class="body">mannen, haalt lappen en touwen en laat</text><text x="68" y="562" class="body">Jeremia omhooghalen.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bij Zedekia · 14–28</text><text x="68" y="711" class="body">Geheim gesprek, twee uitkomsten en</text><text x="68" y="754" class="body">vrees voor overlopers; gesprek</text><text x="68" y="797" class="body">verborgen, Jeremia blijft in de</text><text x="68" y="840" class="body">wachtplaats.</text><text x="46" y="933" class="note">De versgroepen volgen deze hoofdstuktekst. Een</text><text x="46" y="969" class="note">belofte is onderscheiden van de beschreven</text><text x="46" y="1005" class="note">situatie en van woorden die eerder ontvangen</text><text x="46" y="1041" class="note">waren.</text></svg>