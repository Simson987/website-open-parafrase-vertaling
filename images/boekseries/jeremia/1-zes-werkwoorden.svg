<svg xmlns="http://www.w3.org/2000/svg" width="840" height="664" viewBox="0 0 840 664" role="img" aria-labelledby="title desc"><title id="title">Zes werkwoorden van de opdracht</title><desc id="desc">De zes werkwoorden exact gegroepeerd.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="664" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes werkwoorden van de opdracht</text><text x="44" y="113" class="ref">Jeremia 1:10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afbreken</text><text x="68" y="241" class="body">Uitrukken; afbreken; verwoesten;</text><text x="68" y="284" class="body">omverhalen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Opbouwen</text><text x="68" y="433" class="body">Bouwen; planten.</text><text x="46" y="526" class="note">De opdracht geldt volken en koninkrijken. De</text><text x="46" y="562" class="note">vier afbrekende werkwoorden en de twee</text><text x="46" y="598" class="note">opbouwende werkwoorden worden alle genoemd.</text></svg>