<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">Ark, troon en samenkomst</title><desc id="desc">De ark, het nieuwe spreken over Jeruzalem en de gezamenlijke terugkeer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ark, troon en samenkomst</text><text x="44" y="113" class="ref">Jeremia 3:16–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ark · 16</text><text x="68" y="241" class="body">Niet meer over spreken, eraan denken,</text><text x="68" y="284" class="body">haar missen of opnieuw maken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jeruzalem · 17</text><text x="68" y="433" class="body">Genoemd: de troon van de HEERE; alle</text><text x="68" y="476" class="body">volken verzamelen zich daar.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Juda en Israël · 18</text><text x="68" y="625" class="body">Samen uit het noorden naar het geërfde</text><text x="68" y="668" class="body">land.</text><text x="46" y="761" class="note">Dit is een toekomstbelofte in de oproep tot</text><text x="46" y="797" class="note">terugkeer. De tekst vraagt niet om de bouw van</text><text x="46" y="833" class="note">een nieuwe ark.</text></svg>