<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Zeventig jaar en de beker</title><desc id="desc">Hoofdstukopbouw met gecontroleerde namen en verwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zeventig jaar en de beker</text><text x="44" y="113" class="ref">Jeremia 25:1–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Juda en Babel · 1–14</text><text x="68" y="241" class="body">Drieëntwintig jaar niet geluisterd;</text><text x="68" y="284" class="body">zeventig jaar dienst aan Babel, daarna</text><text x="68" y="327" class="body">oordeel over Babel zelf.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De beker · 15–29</text><text x="68" y="476" class="body">Juda eerst en vele andere volken</text><text x="68" y="519" class="body">daarna; ook de weigeraars gaan niet</text><text x="68" y="562" class="body">vrijuit.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Wereldwijde klacht · 30–38</text><text x="68" y="711" class="body">Rechtszaak, storm en slachtoffers;</text><text x="68" y="754" class="body">herders en leiders kunnen niet</text><text x="68" y="797" class="body">vluchten, hun weide is verwoest.</text><text x="46" y="890" class="note">Namen en versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="926" class="note">Het schema houdt beschreven gebeurtenissen,</text><text x="46" y="962" class="note">aankondigingen en voorwaarden uiteen.</text></svg>