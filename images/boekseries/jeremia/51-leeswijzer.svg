<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1299" viewBox="0 0 840 1299" role="img" aria-labelledby="title desc"><title id="title">Babel: beelden, oproep en teken</title><desc id="desc">Volledige inhoudelijke hoofdstukopbouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1299" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Babel: beelden, oproep en teken</text><text x="44" y="113" class="ref">Jeremia 51:1–64</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Waarschuwing en lof · 1–19</text><text x="68" y="241" class="body">Wind, wannen, gouden beker en vluchten;</text><text x="68" y="284" class="body">Medië opgewekt, de Maker tegenover</text><text x="68" y="327" class="body">ademloze beelden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vergelding · 20–44</text><text x="68" y="476" class="body">Hamer en uitgebrande berg; volken</text><text x="68" y="519" class="body">opgeroepen, rennende boden, dorsvloer</text><text x="68" y="562" class="body">en de klacht van Sion.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Weggaan · 45–58</text><text x="68" y="711" class="body">Niet vrezen voor geruchten; herinner</text><text x="68" y="754" class="body">Jeruzalem, beelden bezocht, muren en</text><text x="68" y="797" class="body">poorten vallen.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Seraja · 59–64</text><text x="68" y="946" class="body">In Zedekia’s vierde jaar: schrift mee,</text><text x="68" y="989" class="body">in Babel hardop lezen, steen eraan en</text><text x="68" y="1032" class="body">in de Frath werpen.</text><text x="46" y="1125" class="note">De versgroepen en namen volgen deze</text><text x="46" y="1161" class="note">hoofdstuktekst. Vergelijkingen, gesproken</text><text x="46" y="1197" class="note">beloften en gebeurtenissen staan in hun eigen</text><text x="46" y="1233" class="note">verband.</text></svg>