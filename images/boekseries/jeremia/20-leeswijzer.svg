<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Pashur en Jeremia’s klacht</title><desc id="desc">Leeswijzer met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Pashur en Jeremia’s klacht</text><text x="44" y="113" class="ref">Jeremia 20:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gebeurtenis · 1–6</text><text x="68" y="241" class="body">Pashur hoort, slaat, zet vast en laat</text><text x="68" y="284" class="body">vrij; nieuwe naam en aangekondigde</text><text x="68" y="327" class="body">wegvoering naar Babel.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De profeet · 7–13</text><text x="68" y="476" class="body">Spot, spreken als onhoudbaar vuur,</text><text x="68" y="519" class="body">fluisterende vrienden, vertrouwen,</text><text x="68" y="562" class="body">recht en lof.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De slotklacht · 14–18</text><text x="68" y="711" class="body">De geboortedag vervloekt; vraag waarom</text><text x="68" y="754" class="body">hij geboren is om moeite, verdriet en</text><text x="68" y="797" class="body">schaamte te zien.</text><text x="46" y="890" class="note">De volgorde volgt deze hoofdstuktekst.</text><text x="46" y="926" class="note">Vergelijkingen zijn onderscheiden van beschreven</text><text x="46" y="962" class="note">handelingen en van voorwaardelijke woorden.</text></svg>