<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Het juk en de voorwerpen</title><desc id="desc">Hoofdstukopbouw met gecontroleerde namen en verwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het juk en de voorwerpen</text><text x="44" y="113" class="ref">Jeremia 27:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De boden · 1–11</text><text x="68" y="241" class="body">Jukken voor vijf koningen; dienst aan</text><text x="68" y="284" class="body">Babel en waarschuwing voor de leugen</text><text x="68" y="327" class="body">van niet dienen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zedekia · 12–15</text><text x="68" y="476" class="body">Dien Babel en leef; niet luisteren naar</text><text x="68" y="519" class="body">niet gezonden profeten.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Priesters en volk · 16–22</text><text x="68" y="668" class="body">Geen snelle terugkomst van voorwerpen;</text><text x="68" y="711" class="body">bid voor wat resteert, dat ook naar</text><text x="68" y="754" class="body">Babel gaat tot Hij ernaar omziet.</text><text x="46" y="847" class="note">Namen en versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="883" class="note">Het schema houdt beschreven gebeurtenissen,</text><text x="46" y="919" class="note">aankondigingen en voorwaarden uiteen.</text></svg>