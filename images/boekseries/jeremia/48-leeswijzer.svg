<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1064" viewBox="0 0 840 1064" role="img" aria-labelledby="title desc"><title id="title">Moab: hoogmoed, rouw en keer</title><desc id="desc">Volledige inhoudelijke hoofdstukopbouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1064" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Moab: hoogmoed, rouw en keer</text><text x="44" y="113" class="ref">Jeremia 48:1–47</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onbezorgd en geschokt · 1–25</text><text x="68" y="241" class="body">Steden verwoest, vertrouwen op</text><text x="68" y="284" class="body">schatten; wijn op droesem wordt</text><text x="68" y="327" class="body">uitgegoten, staf en hoorn gebroken.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Spot en klacht · 26–39</text><text x="68" y="476" class="body">Spot keert terug; duif in de kloof,</text><text x="68" y="519" class="body">hoogmoed, geween om wijnstok en oogst,</text><text x="68" y="562" class="body">hart als klagende fluit.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Geen ontkomen en slot · 40–47</text><text x="68" y="711" class="body">Arend, angst, kuil en strik, vuur en</text><text x="68" y="754" class="body">gevangenschap; toch een slotwoord over</text><text x="68" y="797" class="body">keren van Moabs lot.</text><text x="46" y="890" class="note">De versgroepen en namen volgen deze</text><text x="46" y="926" class="note">hoofdstuktekst. Vergelijkingen, gesproken</text><text x="46" y="962" class="note">beloften en gebeurtenissen staan in hun eigen</text><text x="46" y="998" class="note">verband.</text></svg>