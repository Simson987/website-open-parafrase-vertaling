<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1107" viewBox="0 0 840 1107" role="img" aria-labelledby="title desc"><title id="title">De ondergang en een vrijlating</title><desc id="desc">Volledige inhoudelijke hoofdstukopbouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1107" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De ondergang en een vrijlating</text><text x="44" y="113" class="ref">Jeremia 52:1–34</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beleg en koning · 1–11</text><text x="68" y="241" class="body">Zedekia’s regering; honger, bres,</text><text x="68" y="284" class="body">vlucht, gevangenneming, vonnis en</text><text x="68" y="327" class="body">gevangenschap tot zijn dood.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Brand en wegvoering · 12–27</text><text x="68" y="476" class="body">Nebuzaradan, branden en muren afbreken;</text><text x="68" y="519" class="body">armen blijven, brons en kostbaarheden</text><text x="68" y="562" class="body">weg, leiders in Ribla gedood.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Getallen en slot · 28–34</text><text x="68" y="711" class="body">Drie wegvoeringen met totaal 4600;</text><text x="68" y="754" class="body">Jojachin later vrijgelaten, vriendelijk</text><text x="68" y="797" class="body">ontvangen, aan tafel en dagelijks</text><text x="68" y="840" class="body">onderhouden.</text><text x="46" y="933" class="note">De versgroepen en namen volgen deze</text><text x="46" y="969" class="note">hoofdstuktekst. Vergelijkingen, gesproken</text><text x="46" y="1005" class="note">beloften en gebeurtenissen staan in hun eigen</text><text x="46" y="1041" class="note">verband.</text></svg>