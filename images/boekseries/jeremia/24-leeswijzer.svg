<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Twee korven uitgelegd</title><desc id="desc">Hoofdstukopbouw met gecontroleerde namen en verwijzingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee korven uitgelegd</text><text x="44" y="113" class="ref">Jeremia 24:1–10</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gezicht · 1–3</text><text x="68" y="241" class="body">Na Jechonia’s wegvoering: twee korven</text><text x="68" y="284" class="body">voor de tempel, heel goede en oneetbaar</text><text x="68" y="327" class="body">slechte vijgen.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Goede vijgen · 4–7</text><text x="68" y="476" class="body">De ballingen van Juda in het land van</text><text x="68" y="519" class="body">de Chaldeeën; ten goede aanzien,</text><text x="68" y="562" class="body">terugbrengen, bouwen en een kennend</text><text x="68" y="605" class="body">hart.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Slechte vijgen · 8–10</text><text x="68" y="754" class="body">Zedekia, zijn vorsten, achterblijvers</text><text x="68" y="797" class="body">en wie in Egypte wonen; smaad, zwaard,</text><text x="68" y="840" class="body">honger en pest.</text><text x="46" y="933" class="note">Namen en versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="969" class="note">Het schema houdt beschreven gebeurtenissen,</text><text x="46" y="1005" class="note">aankondigingen en voorwaarden uiteen.</text></svg>