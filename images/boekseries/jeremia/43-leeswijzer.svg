<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1064" viewBox="0 0 840 1064" role="img" aria-labelledby="title desc"><title id="title">Naar Egypte tegen het woord in</title><desc id="desc">Volledige inhoudelijke hoofdstukopbouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1064" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Naar Egypte tegen het woord in</text><text x="44" y="113" class="ref">Jeremia 43:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het antwoord · 1–7</text><text x="68" y="241" class="body">Azarja en Johanan ontkennen de zending,</text><text x="68" y="284" class="body">beschuldigen Baruch en nemen de rest,</text><text x="68" y="327" class="body">Jeremia en Baruch mee naar Tachpanhes.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het teken · 8–10</text><text x="68" y="476" class="body">Grote stenen in de klei bij het paleis</text><text x="68" y="519" class="body">verbergen; Nebukadrezars troon en tent</text><text x="68" y="562" class="body">worden daar aangekondigd.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De uitleg · 11–13</text><text x="68" y="711" class="body">Oordeel over Egypte, tempels en</text><text x="68" y="754" class="body">gedenkstenen; de vreemde veiligheid</text><text x="68" y="797" class="body">blijkt geen ontkomen.</text><text x="46" y="890" class="note">De versgroepen en namen volgen deze</text><text x="46" y="926" class="note">hoofdstuktekst. Vergelijkingen, gesproken</text><text x="46" y="962" class="note">beloften en gebeurtenissen staan in hun eigen</text><text x="46" y="998" class="note">verband.</text></svg>