<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1534" viewBox="0 0 840 1534" role="img" aria-labelledby="title desc"><title id="title">Vijf woorden over de volken</title><desc id="desc">Volledige inhoudelijke hoofdstukopbouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1534" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijf woorden over de volken</text><text x="44" y="113" class="ref">Jeremia 49:1–39</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ammon · 1–6</text><text x="68" y="241" class="body">Gad en Rabba, vertrouwen op schatten,</text><text x="68" y="284" class="body">verstrooiing en later een keer in het</text><text x="68" y="327" class="body">lot.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Edom · 7–22</text><text x="68" y="476" class="body">Theman, Ezau, Dedan en Bozra;</text><text x="68" y="519" class="body">blootgelegde schuilplaatsen, arendsnest</text><text x="68" y="562" class="body">en leeuw.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Damaskus · 23–27</text><text x="68" y="711" class="body">Hamath en Arpad horen onheil; angst,</text><text x="68" y="754" class="body">vlucht en vuur bij de paleizen van</text><text x="68" y="797" class="body">Benhadad.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Kedar en Hazor · 28–33</text><text x="68" y="946" class="body">Tenten, goederen, kudden en kamelen</text><text x="68" y="989" class="body">buit; naar windstreken verstrooid en</text><text x="68" y="1032" class="body">verlaten.</text><rect x="42" y="1090" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1133" class="label">Elam · 34–39</text><text x="68" y="1181" class="body">Boog gebroken, vier winden en overal</text><text x="68" y="1224" class="body">verdrevenen; een slotbelofte van</text><text x="68" y="1267" class="body">herstel.</text><text x="46" y="1360" class="note">De versgroepen en namen volgen deze</text><text x="46" y="1396" class="note">hoofdstuktekst. Vergelijkingen, gesproken</text><text x="46" y="1432" class="note">beloften en gebeurtenissen staan in hun eigen</text><text x="46" y="1468" class="note">verband.</text></svg>