<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Elam en de vier winden</title><desc id="desc">Kracht, verstrooiing, oordeel en de eigen slotbelofte van Elam.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elam en de vier winden</text><text x="44" y="113" class="ref">Jeremia 49:34–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kracht · 35</text><text x="68" y="241" class="body">De boog, hun voornaamste kracht, wordt</text><text x="68" y="284" class="body">gebroken.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verstrooiing · 36</text><text x="68" y="433" class="body">Vier winden uit de vier hoeken van de</text><text x="68" y="476" class="body">hemel; geen volk zonder verdrevenen van</text><text x="68" y="519" class="body">Elam.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Oordeel · 37–38</text><text x="68" y="668" class="body">Vrees, zwaard en verdelging van koning</text><text x="68" y="711" class="body">en vorsten.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Slot · 39</text><text x="68" y="860" class="body">Aan het einde van de dagen zal het lot</text><text x="68" y="903" class="body">van Elam keren.</text><text x="46" y="996" class="note">Deze laatste deelrede begint aan het begin van</text><text x="46" y="1032" class="note">Zedekia’s regering. De vier windrichtingen</text><text x="46" y="1068" class="note">duiden de omvang van de verstrooiing aan.</text></svg>