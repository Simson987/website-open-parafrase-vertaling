<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Alarm, weigering en toetsing</title><desc id="desc">Overzicht van de inhoudelijke beweging van het hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Alarm, weigering en toetsing</text><text x="44" y="113" class="ref">Jeremia 6:1–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Belegering · 1–9</text><text x="68" y="241" class="body">Vlucht, Thekoa en Beth-Cherem; aanval,</text><text x="68" y="284" class="body">wal en zorgvuldige nalezing als van een</text><text x="68" y="327" class="body">wijnstok.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Niet luisteren · 10–21</text><text x="68" y="476" class="body">Bedrog en valse vrede; oude paden en</text><text x="68" y="519" class="body">wachters geweigerd, offers zonder</text><text x="68" y="562" class="body">gehoorzaamheid.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Schrik en toetsing · 22–30</text><text x="68" y="711" class="body">Noordelijk leger, rouw en de toetser;</text><text x="68" y="754" class="body">tevergeefs gesmolten en verworpen</text><text x="68" y="797" class="body">zilver.</text><text x="46" y="890" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="926" class="note">Aanklacht, beeldspraak, opdracht en belofte</text><text x="46" y="962" class="note">hebben elk hun eigen plaats.</text></svg>