<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Waarheid en recht gezocht</title><desc id="desc">Overzicht van de inhoudelijke beweging van het hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarheid en recht gezocht</text><text x="44" y="113" class="ref">Jeremia 5:1–31</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zoektocht · 1–13</text><text x="68" y="241" class="body">Straten, gewone mensen en groten; allen</text><text x="68" y="284" class="body">weigeren terugkeer en ontkennen het</text><text x="68" y="327" class="body">komende onheil.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bezoeking · 14–19</text><text x="68" y="476" class="body">Woorden als vuur; een ver volk neemt</text><text x="68" y="519" class="body">voedsel en bezit. Geen volledig einde;</text><text x="68" y="562" class="body">dienen in vreemd land.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De tegenstelling · 20–31</text><text x="68" y="711" class="body">Zee en regen tegenover opstandig hart;</text><text x="68" y="754" class="body">bedrog, verwaarloosde armen en geliefde</text><text x="68" y="797" class="body">leugenprofetie.</text><text x="46" y="890" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="926" class="note">Aanklacht, beeldspraak, opdracht en belofte</text><text x="46" y="962" class="note">hebben elk hun eigen plaats.</text></svg>