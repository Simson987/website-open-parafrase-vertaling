<svg xmlns="http://www.w3.org/2000/svg" width="840" height="955" viewBox="0 0 840 955" role="img" aria-labelledby="title desc"><title id="title">Elf genoemde steden van Moab</title><desc id="desc">Exacte elfdelige stedenreeks met de eigen versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="955" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Elf genoemde steden van Moab</text><text x="44" y="113" class="ref">Jeremia 48:21–24</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste groep · 21</text><text x="68" y="241" class="body">Holon; Jahza; Mefaath.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tweede groep · 22</text><text x="68" y="390" class="body">Dibon; Nebo; Beth-Diblathaim.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Derde groep · 23</text><text x="68" y="539" class="body">Kirjathaim; Beth-Gamul; Beth-Meon.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Vierde groep · 24</text><text x="68" y="688" class="body">Kerioth; Bozra.</text><text x="46" y="781" class="note">De passage sluit af met alle steden van Moab,</text><text x="46" y="817" class="note">ver weg en dichtbij. Dit is de specifieke reeks</text><text x="46" y="853" class="note">van vers 21–24; elders in het hoofdstuk staan</text><text x="46" y="889" class="note">meer namen.</text></svg>