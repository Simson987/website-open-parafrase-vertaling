<svg xmlns="http://www.w3.org/2000/svg" width="840" height="793" viewBox="0 0 840 793" role="img" aria-labelledby="title desc"><title id="title">Twee voorwaardelijke woorden</title><desc id="desc">Oordeel en belofte met hun verschillende voorwaarden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="793" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee voorwaardelijke woorden</text><text x="44" y="113" class="ref">Jeremia 18:7–10</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aangekondigd onheil · 7–8</text><text x="68" y="241" class="body">Als een volk zich bekeert van zijn</text><text x="68" y="284" class="body">boosheid, krijgt Hij spijt van het</text><text x="68" y="327" class="body">voorgenomen kwaad.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Aangekondigd goed · 9–10</text><text x="68" y="476" class="body">Als een volk kwaad doet en niet</text><text x="68" y="519" class="body">luistert, krijgt Hij spijt van het</text><text x="68" y="562" class="body">beloofde goede.</text><text x="46" y="655" class="note">Beide mogelijkheden staan in de uitleg na het</text><text x="46" y="691" class="note">werk van de pottenbakker. Daarna wordt Juda tot</text><text x="46" y="727" class="note">concrete verandering opgeroepen.</text></svg>