<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Terugkeer en schuldbelijdenis</title><desc id="desc">Overzicht van de inhoudelijke beweging van het hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Terugkeer en schuldbelijdenis</text><text x="44" y="113" class="ref">Jeremia 3:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ontrouw · 1–11</text><text x="68" y="241" class="body">Israël en Juda als twee zussen; Juda</text><text x="68" y="284" class="body">keert slechts in schijn terug.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Uitnodiging · 12–20</text><text x="68" y="433" class="body">Erken schuld, keer terug; herders,</text><text x="68" y="476" class="body">Sion, volken en gezamenlijke terugkeer.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Antwoord · 21–25</text><text x="68" y="625" class="body">Huilen, roep tot genezing en erkenning:</text><text x="68" y="668" class="body">redding ligt bij de HEERE, wij hebben</text><text x="68" y="711" class="body">niet geluisterd.</text><text x="46" y="804" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="840" class="note">Aanklacht, beeldspraak, opdracht en belofte</text><text x="46" y="876" class="note">hebben elk hun eigen plaats.</text></svg>