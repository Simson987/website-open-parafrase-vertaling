<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Het nieuwe verbond</title><desc id="desc">De vier samenhangende onderdelen van de verbondsbelofte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het nieuwe verbond</text><text x="44" y="113" class="ref">Jeremia 31:31–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Met wie? · 31</text><text x="68" y="241" class="body">Het huis van Israël en het huis van</text><text x="68" y="284" class="body">Juda.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het verschil · 32</text><text x="68" y="433" class="body">Niet als het verbond bij de uittocht</text><text x="68" y="476" class="body">uit Egypte, dat zij verbraken.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat Hij geeft · 33</text><text x="68" y="625" class="body">Wet in hun binnenste en in hun hart;</text><text x="68" y="668" class="body">Hij hun God, zij Zijn volk.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Kennen en vergeving · 34</text><text x="68" y="817" class="body">Allen kennen Hem, klein tot groot;</text><text x="68" y="860" class="body">schuld vergeven en zonden niet meer</text><text x="68" y="903" class="body">gedacht.</text><text x="46" y="996" class="note">De belofte bevat relatie, innerlijke wet, kennis</text><text x="46" y="1032" class="note">en vergeving. Elk onderdeel heeft een eigen</text><text x="46" y="1068" class="note">plaats in de tekst.</text></svg>