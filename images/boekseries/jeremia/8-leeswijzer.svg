<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Niet terugkeren en geen genezing</title><desc id="desc">Overzicht van de inhoudelijke beweging van het hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Niet terugkeren en geen genezing</text><text x="44" y="113" class="ref">Jeremia 8:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oordeel en weigering · 1–9</text><text x="68" y="241" class="body">Graven onteerd; geen berouw, vogels</text><text x="68" y="284" class="body">kennen hun tijden, schrijvers vervalsen</text><text x="68" y="327" class="body">wijsheid.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Valse vrede · 10–17</text><text x="68" y="476" class="body">Winst en bedrog, geen vrucht, vlucht,</text><text x="68" y="519" class="body">paarden en onbezweerbare slangen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De klacht · 18–22</text><text x="68" y="668" class="body">Verdriet, onbeantwoorde reddingshoop,</text><text x="68" y="711" class="body">voorbije oogst en de vraag naar balsem</text><text x="68" y="754" class="body">en genezer.</text><text x="46" y="847" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="883" class="note">Aanklacht, beeldspraak, opdracht en belofte</text><text x="46" y="919" class="note">hebben elk hun eigen plaats.</text></svg>