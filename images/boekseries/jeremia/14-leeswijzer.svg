<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Droogte en de roep om regen</title><desc id="desc">Leeswijzer met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Droogte en de roep om regen</text><text x="44" y="113" class="ref">Jeremia 14:1–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het land · 1–6</text><text x="68" y="241" class="body">Treuren, lege kruiken, gebarsten grond,</text><text x="68" y="284" class="body">verlaten jong en dieren zonder groen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gebed en antwoord · 7–16</text><text x="68" y="433" class="body">Schuld beleden; voorbede en offers niet</text><text x="68" y="476" class="body">gehoord; de beloofde vrede blijkt</text><text x="68" y="519" class="body">leugen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Klacht en wachten · 17–22</text><text x="68" y="668" class="body">Tranen, zwaard en honger; bede om</text><text x="68" y="711" class="body">verbondstrouw en erkenning dat alleen</text><text x="68" y="754" class="body">de HEERE regen geeft.</text><text x="46" y="847" class="note">De volgorde volgt deze hoofdstuktekst.</text><text x="46" y="883" class="note">Vergelijkingen zijn onderscheiden van beschreven</text><text x="46" y="919" class="note">handelingen en van voorwaardelijke woorden.</text></svg>