<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Wie luistert naar welke stem?</title><desc id="desc">Twee aangesproken groepen, hun ontvangen woord en hun verschillende reactie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie luistert naar welke stem?</text><text x="44" y="113" class="ref">Jeremia 35:6–19</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Rechabieten · 6–11</text><text x="68" y="241" class="body">Hun vader Jonadab, zoon van Rechab,</text><text x="68" y="284" class="body">beval hun leefwijze. Zij hielden zijn</text><text x="68" y="327" class="body">woorden en weken voor oorlog naar</text><text x="68" y="370" class="body">Jeruzalem uit.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Juda · 13–17</text><text x="68" y="519" class="body">De HEERE sprak herhaaldelijk en stuurde</text><text x="68" y="562" class="body">profeten tot bekering. Zij luisterden</text><text x="68" y="605" class="body">niet en antwoordden niet.</text><rect x="42" y="663" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Uitkomsten · 17–19</text><text x="68" y="754" class="body">Aangekondigd kwaad over Juda; blijvende</text><text x="68" y="797" class="body">dienst voor het huis van Jonadab.</text><text x="46" y="890" class="note">Het contrast draait om luisteren en doen. De</text><text x="46" y="926" class="note">familieafspraak over tenten en wijn wordt niet</text><text x="46" y="962" class="note">tot een bevel voor heel Juda gemaakt.</text></svg>