<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1107" viewBox="0 0 840 1107" role="img" aria-labelledby="title desc"><title id="title">Valse hoop en gevangenschap</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1107" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Valse hoop en gevangenschap</text><text x="44" y="113" class="ref">Jeremia 37:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het leger · 1–10</text><text x="68" y="241" class="body">Zedekia luistert niet maar vraagt</text><text x="68" y="284" class="body">gebed; Egyptische opmars heft beleg</text><text x="68" y="327" class="body">tijdelijk op, Chaldeeën komen terug.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De poort en kerker · 11–16</text><text x="68" y="476" class="body">Jeremia naar Benjamin; Jerija</text><text x="68" y="519" class="body">beschuldigt hem van overlopen.</text><text x="68" y="562" class="body">Ontkenning genegeerd, opgesloten bij</text><text x="68" y="605" class="body">Jonathan.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De koning en het brood · 17–21</text><text x="68" y="754" class="body">Geheim gevraagd woord, overgave aan</text><text x="68" y="797" class="body">Babel en bede niet terug naar de</text><text x="68" y="840" class="body">kelder; wachtplaats en dagelijks brood.</text><text x="46" y="933" class="note">De versgroepen volgen deze hoofdstuktekst. Een</text><text x="46" y="969" class="note">belofte is onderscheiden van de beschreven</text><text x="46" y="1005" class="note">situatie en van woorden die eerder ontvangen</text><text x="46" y="1041" class="note">waren.</text></svg>