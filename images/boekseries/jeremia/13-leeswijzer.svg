<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Gordel, kruiken en hoogmoed</title><desc id="desc">Leeswijzer met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gordel, kruiken en hoogmoed</text><text x="44" y="113" class="ref">Jeremia 13:1–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gordel · 1–11</text><text x="68" y="241" class="body">Kopen, dragen, verbergen, ophalen en</text><text x="68" y="284" class="body">uitleg: bedoelde verbondenheid maar</text><text x="68" y="327" class="body">geen gehoor.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Kruiken en waarschuwing · 12–19</text><text x="68" y="476" class="body">Dronkenschap en botsing, eer vóór</text><text x="68" y="519" class="body">donker, tranen, koning en</text><text x="68" y="562" class="body">koningin-moeder, gesloten steden.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Schuld en verstrooiing · 20–27</text><text x="68" y="711" class="body">Kudde kwijt; vraag naar huid en</text><text x="68" y="754" class="body">vlekken, stoppels op de wind en</text><text x="68" y="797" class="body">Jeruzalems onreinheid.</text><text x="46" y="890" class="note">De volgorde volgt deze hoofdstuktekst.</text><text x="46" y="926" class="note">Vergelijkingen zijn onderscheiden van beschreven</text><text x="46" y="962" class="note">handelingen en van voorwaardelijke woorden.</text></svg>