<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1064" viewBox="0 0 840 1064" role="img" aria-labelledby="title desc"><title id="title">Vrijheid weer ingetrokken</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1064" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrijheid weer ingetrokken</text><text x="44" y="113" class="ref">Jeremia 34:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het beleg · 1–7</text><text x="68" y="241" class="body">Woord aan Zedekia: gevangenschap maar</text><text x="68" y="284" class="body">geen dood door het zwaard; Jeruzalem,</text><text x="68" y="327" class="body">Lachis en Azeka belegerd.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vrijlating en omkeer · 8–16</text><text x="68" y="476" class="body">Verbond tot vrijheid voor Hebreeuwse</text><text x="68" y="519" class="body">mannen en vrouwen; eerst vrij, daarna</text><text x="68" y="562" class="body">gedwongen terug in dienst.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het antwoord · 17–22</text><text x="68" y="711" class="body">Vrijheid voor zwaard, pest en honger;</text><text x="68" y="754" class="body">verbond overtreden, leger keert terug</text><text x="68" y="797" class="body">en steden worden verlaten.</text><text x="46" y="890" class="note">De versgroepen volgen deze hoofdstuktekst. Een</text><text x="46" y="926" class="note">belofte is onderscheiden van de beschreven</text><text x="46" y="962" class="note">situatie en van woorden die eerder ontvangen</text><text x="46" y="998" class="note">waren.</text></svg>