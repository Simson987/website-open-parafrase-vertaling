<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Personen, geld en akten</title><desc id="desc">Exacte betrokkenen, prijs, akten en wijze van bewaring.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Personen, geld en akten</text><text x="44" y="113" class="ref">Jeremia 32:8–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verkoper en koper · 8–10</text><text x="68" y="241" class="body">Hanameël, zoon van Jeremia’s oom</text><text x="68" y="284" class="body">Sallum; Jeremia koopt voor zeventien</text><text x="68" y="327" class="body">zilverstukken.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bewaarder en getuigen · 11–12</text><text x="68" y="476" class="body">Baruch, zoon van Nerija, zoon van</text><text x="68" y="519" class="body">Machseja; Hanameël, ondertekenaars en</text><text x="68" y="562" class="body">Judeeërs zien de overdracht.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Twee akten · 11–15</text><text x="68" y="711" class="body">Verzegelde koopakte met bepalingen en</text><text x="68" y="754" class="body">open akte; samen in een aarden pot om</text><text x="68" y="797" class="body">lang te bewaren.</text><text x="46" y="890" class="note">De namen geven verwantschap en bewaring aan. De</text><text x="46" y="926" class="note">aankoop is gedaan tijdens het beleg en wijst</text><text x="46" y="962" class="note">naar latere aankopen in het land.</text></svg>