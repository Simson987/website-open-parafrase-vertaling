<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De bronzen zuilen: maten</title><desc id="desc">Alle genoemde maten en de twee verschillende granaatappelaantallen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De bronzen zuilen: maten</text><text x="44" y="113" class="ref">Jeremia 52:20–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zuil · 21</text><text x="68" y="241" class="body">Ongeveer 8 meter hoog; meetlint van</text><text x="68" y="284" class="body">ongeveer 5,5 meter eromheen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wand · 21</text><text x="68" y="433" class="body">Vier vingers dik; de zuil is hol.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Kapiteel · 22</text><text x="68" y="582" class="body">Ongeveer 2,20 meter hoog; brons,</text><text x="68" y="625" class="body">vlechtwerk en granaatappels; de andere</text><text x="68" y="668" class="body">zuil net zo.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Granaatappels · 23</text><text x="68" y="817" class="body">96 aan de zijkanten; 100 in totaal</text><text x="68" y="860" class="body">rondom op het vlechtwerk.</text><text x="46" y="953" class="note">De meters zijn de benaderde maten van deze</text><text x="46" y="989" class="note">weergave. De tekst onderscheidt hoogte, omtrek,</text><text x="46" y="1025" class="note">wand, kapiteel en aantallen.</text></svg>