<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1021" viewBox="0 0 840 1021" role="img" aria-labelledby="title desc"><title id="title">Het woord over de Filistijnen</title><desc id="desc">Volledige inhoudelijke hoofdstukopbouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1021" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het woord over de Filistijnen</text><text x="44" y="113" class="ref">Jeremia 47:1–7</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het beeld · 1–3</text><text x="68" y="241" class="body">Vóór Farao Gaza verslaat; water uit het</text><text x="68" y="284" class="body">noorden als overstromende beek,</text><text x="68" y="327" class="body">dreunende wagens en slappe handen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het bereik · 4–5</text><text x="68" y="476" class="body">Filistijnen en hulp aan Tyrus en Sidon;</text><text x="68" y="519" class="body">Kafthor, Gaza en Askelon, rouw in de</text><text x="68" y="562" class="body">vlakte.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het zwaard · 6–7</text><text x="68" y="711" class="body">Bede om rust, maar het ontvangen bevel</text><text x="68" y="754" class="body">richt zich op Askelon en de zeekust.</text><text x="46" y="847" class="note">De versgroepen en namen volgen deze</text><text x="46" y="883" class="note">hoofdstuktekst. Vergelijkingen, gesproken</text><text x="46" y="919" class="note">beloften en gebeurtenissen staan in hun eigen</text><text x="46" y="955" class="note">verband.</text></svg>