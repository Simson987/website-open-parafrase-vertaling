<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Tranen, bedrog en kennen</title><desc id="desc">Overzicht van de inhoudelijke beweging van het hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tranen, bedrog en kennen</text><text x="44" y="113" class="ref">Jeremia 9:1–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verlangen en aanklacht · 1–9</text><text x="68" y="241" class="body">Tranen en een reizigershut; tong als</text><text x="68" y="284" class="body">boog en pijl, bedrog zelfs onder</text><text x="68" y="327" class="body">verwanten.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Verwoesting en rouw · 10–22</text><text x="68" y="476" class="body">Verbrande weiden en steden; wet</text><text x="68" y="519" class="body">verlaten, verstrooiing en aangeleerde</text><text x="68" y="562" class="body">klaagliederen.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het juiste roemen · 23–26</text><text x="68" y="711" class="body">Geen wijsheid, kracht of rijkdom;</text><text x="68" y="754" class="body">kennen van goedheid, recht en</text><text x="68" y="797" class="body">gerechtigheid; het hart blijft</text><text x="68" y="840" class="body">beslissend.</text><text x="46" y="933" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="969" class="note">Aanklacht, beeldspraak, opdracht en belofte</text><text x="46" y="1005" class="note">hebben elk hun eigen plaats.</text></svg>