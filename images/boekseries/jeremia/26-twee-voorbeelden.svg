<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Twee aangehaalde voorbeelden</title><desc id="desc">De twee voorbeelden en de bescherming van Jeremia apart weergegeven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee aangehaalde voorbeelden</text><text x="44" y="113" class="ref">Jeremia 26:18–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Micha en Hizkia · 18–19</text><text x="68" y="241" class="body">Micha uit Moreseth waarschuwde voor</text><text x="68" y="284" class="body">Sions ondergang. Hizkia vreesde en</text><text x="68" y="327" class="body">smeekte; Micha werd niet gedood.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Uria en Jojakim · 20–23</text><text x="68" y="476" class="body">Uria, zoon van Semaja, sprak hetzelfde</text><text x="68" y="519" class="body">als Jeremia. Vlucht naar Egypte, door</text><text x="68" y="562" class="body">Elnathan teruggehaald en gedood.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Jeremia en Ahikam · 24</text><text x="68" y="711" class="body">Ahikam, zoon van Safan, beschermde</text><text x="68" y="754" class="body">Jeremia tegen overgave aan het volk.</text><text x="46" y="847" class="note">De tekst geeft verschillende reacties op</text><text x="46" y="883" class="note">profetische waarschuwing. De namen en uitkomsten</text><text x="46" y="919" class="note">horen bij hun eigen verhaal.</text></svg>