<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1064" viewBox="0 0 840 1064" role="img" aria-labelledby="title desc"><title id="title">Een rol verbrand en herschreven</title><desc id="desc">Hoofdstukopbouw met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1064" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een rol verbrand en herschreven</text><text x="44" y="113" class="ref">Jeremia 36:1–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schrijven en lezen · 1–19</text><text x="68" y="241" class="body">Vierde jaar opdracht; vijfde jaar</text><text x="68" y="284" class="body">vasten, Baruch leest publiek en voor de</text><text x="68" y="327" class="body">vorsten, die schrikken.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Voor de koning · 20–26</text><text x="68" y="476" class="body">Jehudi leest; Jojakim snijdt kolommen</text><text x="68" y="519" class="body">af en verbrandt ze ondanks protest.</text><text x="68" y="562" class="body">Schrijver en profeet verborgen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Opnieuw schrijven · 27–32</text><text x="68" y="711" class="body">Andere rol, alle eerdere woorden en</text><text x="68" y="754" class="body">veel soortgelijke erbij; oordeel over</text><text x="68" y="797" class="body">de koning en zijn huis.</text><text x="46" y="890" class="note">De versgroepen volgen deze hoofdstuktekst. Een</text><text x="46" y="926" class="note">belofte is onderscheiden van de beschreven</text><text x="46" y="962" class="note">situatie en van woorden die eerder ontvangen</text><text x="46" y="998" class="note">waren.</text></svg>