<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1064" viewBox="0 0 840 1064" role="img" aria-labelledby="title desc"><title id="title">Gebed gevraagd, raad geweigerd</title><desc id="desc">Volledige inhoudelijke hoofdstukopbouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1064" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed gevraagd, raad geweigerd</text><text x="44" y="113" class="ref">Jeremia 42:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verzoek · 1–6</text><text x="68" y="241" class="body">Vraag naar weg en daad; Jeremia belooft</text><text x="68" y="284" class="body">alles te zeggen en de rest belooft te</text><text x="68" y="327" class="body">gehoorzamen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Na tien dagen · 7–18</text><text x="68" y="476" class="body">Blijven: bouwen, planten en</text><text x="68" y="519" class="body">barmhartigheid. Naar Egypte: het</text><text x="68" y="562" class="body">gevreesde zwaard en de honger volgen.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De slotwaarschuwing · 19–22</text><text x="68" y="711" class="body">Ga niet naar Egypte; eigen misleiding</text><text x="68" y="754" class="body">benoemd en de aangekondigde gevolgen</text><text x="68" y="797" class="body">herhaald.</text><text x="46" y="890" class="note">De versgroepen en namen volgen deze</text><text x="46" y="926" class="note">hoofdstuktekst. Vergelijkingen, gesproken</text><text x="46" y="962" class="note">beloften en gebeurtenissen staan in hun eigen</text><text x="46" y="998" class="note">verband.</text></svg>