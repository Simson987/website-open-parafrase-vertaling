<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Vertrouwen, hart en sabbat</title><desc id="desc">Leeswijzer met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vertrouwen, hart en sabbat</text><text x="44" y="113" class="ref">Jeremia 17:1–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schuld en vertrouwen · 1–8</text><text x="68" y="241" class="body">IJzeren stift, verloren erfdeel; dorre</text><text x="68" y="284" class="body">struik tegenover boom met wortels naar</text><text x="68" y="327" class="body">water.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Hart en gebed · 9–18</text><text x="68" y="476" class="body">Het hart doorgrond; patrijs en</text><text x="68" y="519" class="body">onrechtvaardige rijkdom, levende bron,</text><text x="68" y="562" class="body">genezing en bescherming.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bij de poorten · 19–27</text><text x="68" y="711" class="body">Geen lasten of werk op de sabbat;</text><text x="68" y="754" class="body">luisteren brengt bewoning en offers,</text><text x="68" y="797" class="body">weigeren onblusbaar vuur.</text><text x="46" y="890" class="note">De volgorde volgt deze hoofdstuktekst.</text><text x="46" y="926" class="note">Vergelijkingen zijn onderscheiden van beschreven</text><text x="46" y="962" class="note">handelingen en van voorwaardelijke woorden.</text></svg>