<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1193" viewBox="0 0 840 1193" role="img" aria-labelledby="title desc"><title id="title">Wie drinken de beker?</title><desc id="desc">Volledige reeks genoemde landen, steden en groepen in de bekerpassage.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1193" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie drinken de beker?</text><text x="44" y="113" class="ref">Jeremia 25:18–26</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin · 18–21</text><text x="68" y="241" class="body">Jeruzalem en Juda; Farao en Egypte;</text><text x="68" y="284" class="body">mengvolk, Uz, Filistijnen: Askelon,</text><text x="68" y="327" class="body">Gaza, Ekron, rest van Asdod; Edom,</text><text x="68" y="370" class="body">Moab, Ammonieten.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Verder · 22–24</text><text x="68" y="519" class="body">Tyrus, Sidon, eilanden aan de overkant;</text><text x="68" y="562" class="body">Dedan, Thema, Buz en kaalgeschoren</text><text x="68" y="605" class="body">slapen; Arabië en mengvolk in de</text><text x="68" y="648" class="body">woestijn.</text><rect x="42" y="706" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">Slot · 25–26</text><text x="68" y="797" class="body">Zimri, Elam, Medië; noordelijke</text><text x="68" y="840" class="body">koningen dichtbij en veraf, alle</text><text x="68" y="883" class="body">koninkrijken; de koning van Sesach na</text><text x="68" y="926" class="body">hen.</text><text x="46" y="1019" class="note">Dit is een geordende namenlijst uit het</text><text x="46" y="1055" class="note">bekerbeeld, geen kaart met vastgestelde grenzen.</text><text x="46" y="1091" class="note">De koning van Sesach wordt in deze verzen als</text><text x="46" y="1127" class="note">laatste genoemd.</text></svg>