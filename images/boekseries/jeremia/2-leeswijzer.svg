<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Verlaten en vergeten</title><desc id="desc">Overzicht van de inhoudelijke beweging van het hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verlaten en vergeten</text><text x="44" y="113" class="ref">Jeremia 2:1–37</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Herinnering · 1–8</text><text x="68" y="241" class="body">Bruidstijd, woestijn en vruchtbaar</text><text x="68" y="284" class="body">land; priesters, herders en profeten</text><text x="68" y="327" class="body">zijn afgedwaald.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Aanklacht · 9–28</text><text x="68" y="476" class="body">Eer ingeruild; bron verlaten en lekke</text><text x="68" y="519" class="body">bakken gemaakt; vreemde hulp en</text><text x="68" y="562" class="body">afgoden.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Ontkenning · 29–37</text><text x="68" y="711" class="body">Tucht geweigerd, profeten gedood, God</text><text x="68" y="754" class="body">vergeten; onschuld geclaimd en helpers</text><text x="68" y="797" class="body">verworpen.</text><text x="46" y="890" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="926" class="note">Aanklacht, beeldspraak, opdracht en belofte</text><text x="46" y="962" class="note">hebben elk hun eigen plaats.</text></svg>