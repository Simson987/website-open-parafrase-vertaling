<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Afzondering en terugkeer</title><desc id="desc">Leeswijzer met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Afzondering en terugkeer</text><text x="44" y="113" class="ref">Jeremia 16:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afzondering · 1–9</text><text x="68" y="241" class="body">Geen huwelijk, rouwmaaltijd of</text><text x="68" y="284" class="body">feestmaal; de komende ramp onderbreekt</text><text x="68" y="327" class="body">gezin, troost en vreugde.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Uitleg en belofte · 10–18</text><text x="68" y="476" class="body">Voorouders verlaten de wet, kinderen</text><text x="68" y="519" class="body">nog erger; verbanning en terugkeer,</text><text x="68" y="562" class="body">vissers en jagers.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Toevlucht · 19–21</text><text x="68" y="711" class="body">Volken erkennen geërfde leugen en lege</text><text x="68" y="754" class="body">goden; de naam en macht van de HEERE</text><text x="68" y="797" class="body">worden bekend.</text><text x="46" y="890" class="note">De volgorde volgt deze hoofdstuktekst.</text><text x="46" y="926" class="note">Vergelijkingen zijn onderscheiden van beschreven</text><text x="46" y="962" class="note">handelingen en van voorwaardelijke woorden.</text></svg>