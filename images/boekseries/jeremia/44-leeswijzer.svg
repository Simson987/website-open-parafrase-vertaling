<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1107" viewBox="0 0 840 1107" role="img" aria-labelledby="title desc"><title id="title">Wiens woord houdt stand?</title><desc id="desc">Volledige inhoudelijke hoofdstukopbouw.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1107" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wiens woord houdt stand?</text><text x="44" y="113" class="ref">Jeremia 44:1–30</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanklacht · 1–14</text><text x="68" y="241" class="body">Judeeërs in vier Egyptische gebieden</text><text x="68" y="284" class="body">horen waarom Juda verlaten werd;</text><text x="68" y="327" class="body">afgoderij voortgezet, ook nu volgt</text><text x="68" y="370" class="body">oordeel.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Het weerwoord · 15–19</text><text x="68" y="519" class="body">De menigte weigert en schrijft vroegere</text><text x="68" y="562" class="body">voorspoed aan wierook en drankoffers</text><text x="68" y="605" class="body">toe.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het antwoord · 20–30</text><text x="68" y="754" class="body">Jeremia verklaart juist afgoderij als</text><text x="68" y="797" class="body">oorzaak; weinige vluchtelingen keren</text><text x="68" y="840" class="body">terug. Hofra’s overgave als teken.</text><text x="46" y="933" class="note">De versgroepen en namen volgen deze</text><text x="46" y="969" class="note">hoofdstuktekst. Vergelijkingen, gesproken</text><text x="46" y="1005" class="note">beloften en gebeurtenissen staan in hun eigen</text><text x="46" y="1041" class="note">verband.</text></svg>