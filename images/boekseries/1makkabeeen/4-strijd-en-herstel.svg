<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Strijd en herstel</title><desc id="desc">Strijd en herstel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Strijd en herstel</text><text x="44" y="113" class="ref">1 Makkabeeën 4:1–61</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Emmaüs · 1–25</text><text x="68" y="241" class="body">Nachtelijke bewegingen, een leeg kamp,</text><text x="68" y="284" class="body">overwinning en dank op de terugweg.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bet-Sur · 26–35</text><text x="68" y="433" class="body">Lysias komt het volgende jaar terug,</text><text x="68" y="476" class="body">maar wordt opnieuw verslagen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De reiniging · 36–51</text><text x="68" y="625" class="body">Rouw, priesters, verwijderde oude</text><text x="68" y="668" class="body">stenen, nieuw altaar en nieuwe</text><text x="68" y="711" class="body">voorwerpen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Inwijding en bewaring · 52–61</text><text x="68" y="860" class="body">25 Kislev, acht dagen vreugde,</text><text x="68" y="903" class="body">jaarlijkse viering en versterking van</text><text x="68" y="946" class="body">Sion en Bet-Sur.</text><text x="46" y="1039" class="note">De twee veldtochten gaan aan het herstel vooraf;</text><text x="46" y="1075" class="note">het jaarlijkse feest begint op de genoemde dag.</text></svg>