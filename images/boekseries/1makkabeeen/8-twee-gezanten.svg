<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De twee gezanten</title><desc id="desc">De twee gezanten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee gezanten</text><text x="44" y="113" class="ref">1 Makkabeeën 8:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat Judas hoorde · 1–16</text><text x="68" y="241" class="body">Een bericht over Romeinse macht,</text><text x="68" y="284" class="body">overwinningen, bestuur en trouw aan</text><text x="68" y="327" class="body">vrienden.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Eupolemus · 17</text><text x="68" y="476" class="body">Zoon van Johannes, zoon van Akkos.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jason · 17</text><text x="68" y="625" class="body">Zoon van Eleazar.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De opdracht · 18–22</text><text x="68" y="774" class="body">Een lange reis, verzoek om</text><text x="68" y="817" class="body">bondgenootschap en een afschrift op</text><text x="68" y="860" class="body">koperen platen.</text><text x="46" y="953" class="note">De eerste zestien verzen vertellen wat aan Judas</text><text x="46" y="989" class="note">over Rome wordt bericht; het schema presenteert</text><text x="46" y="1025" class="note">die gegevens als tekstinhoud.</text></svg>