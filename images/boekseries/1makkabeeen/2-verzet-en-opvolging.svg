<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Verzet en opvolging</title><desc id="desc">Verzet en opvolging met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verzet en opvolging</text><text x="44" y="113" class="ref">1 Makkabeeën 2:15–70</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De weigering · 15–22</text><text x="68" y="241" class="body">Mattathias wijst de beloning af en</text><text x="68" y="284" class="body">houdt vast aan het voorouderlijke</text><text x="68" y="327" class="body">verbond.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Opstand en vlucht · 23–38</text><text x="68" y="476" class="body">Geweld bij het altaar, vlucht en de</text><text x="68" y="519" class="body">ramp bij de holen op sabbat.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het besluit · 39–48</text><text x="68" y="668" class="body">Verdediging bij aanval op sabbat,</text><text x="68" y="711" class="body">aansluiting van medestanders en</text><text x="68" y="754" class="body">rondtrekkend verzet.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De overdracht · 49–70</text><text x="68" y="903" class="body">Voorbeelden uit de vaderen, taken voor</text><text x="68" y="946" class="body">Simon en Judas, zegen en begrafenis.</text><text x="46" y="1039" class="note">De opeenvolging maakt zichtbaar hoe de ramp</text><text x="46" y="1075" class="note">aanleiding geeft tot het besluit over</text><text x="46" y="1111" class="note">verdediging.</text></svg>