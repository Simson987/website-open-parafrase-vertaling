<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Overdracht en verraad</title><desc id="desc">Overdracht en verraad met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Overdracht en verraad</text><text x="44" y="113" class="ref">1 Makkabeeën 16:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De overdracht · 1–10</text><text x="68" y="241" class="body">Simon zendt Judas en Johannes; Johannes</text><text x="68" y="284" class="body">steekt als eerste de beek over.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De val · 11–17</text><text x="68" y="433" class="body">Ptolemeüs, zoon van Abubus en</text><text x="68" y="476" class="body">schoonzoon van de hogepriester, beraamt</text><text x="68" y="519" class="body">de maaltijd in Dok.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De waarschuwing · 18–22</text><text x="68" y="668" class="body">Het plan strekt zich naar Gazara uit,</text><text x="68" y="711" class="body">maar Johannes hoort het op tijd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het vervolg · 23–24</text><text x="68" y="860" class="body">Zijn verdere daden en hogepriesterschap</text><text x="68" y="903" class="body">worden naar andere jaarboeken verwezen.</text><text x="46" y="996" class="note">De Judas in deze eerste verzen is Simons zoon,</text><text x="46" y="1032" class="note">niet de eerder gestorven Judas de Makkabeeër.</text></svg>