<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Mattathias en zijn zonen</title><desc id="desc">Mattathias en zijn zonen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Mattathias en zijn zonen</text><text x="44" y="113" class="ref">1 Makkabeeën 2:1–5,65–66</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vader · 1</text><text x="68" y="241" class="body">Mattathias, zoon van Johannes, zoon van</text><text x="68" y="284" class="body">Simeon; priester uit Jojarib, wonend in</text><text x="68" y="327" class="body">Modin.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De vijf zonen · 2–5</text><text x="68" y="476" class="body">Johannes/Jaddis, Simon/Thassi, Judas/de</text><text x="68" y="519" class="body">Makkabeeër, Eleazar/Auäran en</text><text x="68" y="562" class="body">Jonathan/Sapfus.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De raadgever · 65</text><text x="68" y="711" class="body">Simon zal voor zijn broers een vader</text><text x="68" y="754" class="body">zijn.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De legerleider · 66</text><text x="68" y="903" class="body">Judas wordt als sterk en krachtig</text><text x="68" y="946" class="body">aangewezen voor de oorlog.</text><text x="46" y="1039" class="note">De bijnamen volgen deze editie; de rol van Simon</text><text x="46" y="1075" class="note">is onderscheiden van de legerleiding van Judas.</text></svg>