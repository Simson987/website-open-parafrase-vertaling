<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Eed en vertrouwen</title><desc id="desc">Eed en vertrouwen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eed en vertrouwen</text><text x="44" y="113" class="ref">1 Makkabeeën 7:12–18,27–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij Alcimus en Bacchides · 12–18</text><text x="68" y="241" class="body">Schriftgeleerden en Asideeën zoeken</text><text x="68" y="284" class="body">recht en vrede; de priesterlijke</text><text x="68" y="327" class="body">afkomst wekt vertrouwen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De eed · 15–18</text><text x="68" y="476" class="body">Geen kwaad beloven, maar zestig mannen</text><text x="68" y="519" class="body">doden: het volk noemt dit een verbroken</text><text x="68" y="562" class="body">verbond.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bij Nikanor · 27–30</text><text x="68" y="711" class="body">Een klein vredesbezoek verbergt een</text><text x="68" y="754" class="body">plan om Judas te grijpen; Judas ontdekt</text><text x="68" y="797" class="body">het bedrog.</text><text x="46" y="890" class="note">De tekst toont het verschil tussen vredeswoorden</text><text x="46" y="926" class="note">en feitelijk handelen.</text></svg>