<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Simon en de ommekeer</title><desc id="desc">Simon en de ommekeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Simon en de ommekeer</text><text x="44" y="113" class="ref">1 Makkabeeën 13:1–54</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De keuze · 1–11</text><text x="68" y="241" class="body">Simon bemoedigt het volk en wordt</text><text x="68" y="284" class="body">leider; de steden worden versterkt.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het bedrog · 12–30</text><text x="68" y="433" class="body">Tryfon vraagt geld en gijzelaars maar</text><text x="68" y="476" class="body">houdt Jonathan vast; sneeuw, dood en</text><text x="68" y="519" class="body">begrafenis volgen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De vrijheid · 31–42</text><text x="68" y="668" class="body">Tryfon grijpt de kroon, Demetrius</text><text x="68" y="711" class="body">verleent vrijstelling en een nieuwe</text><text x="68" y="754" class="body">datering begint.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De vestingen · 43–54</text><text x="68" y="903" class="body">Gazara, de burcht van Jeruzalem en</text><text x="68" y="946" class="body">Johannes als veldheer.</text><text x="46" y="1039" class="note">De rouw om Jonathan en de latere vreugde bij de</text><text x="46" y="1075" class="note">burcht zijn verschillende gebeurtenissen.</text></svg>