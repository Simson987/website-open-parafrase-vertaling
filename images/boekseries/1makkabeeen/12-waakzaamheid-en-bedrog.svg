<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Waakzaamheid en bedrog</title><desc id="desc">Waakzaamheid en bedrog met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waakzaamheid en bedrog</text><text x="44" y="113" class="ref">1 Makkabeeën 12:24–54</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Waakzaam · 24–32</text><text x="68" y="241" class="body">Verkenners, nachtwacht, vijandelijke</text><text x="68" y="284" class="body">vuren en een gemiste achtervolging.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Versterken · 33–38</text><text x="68" y="433" class="body">Simon in Joppe, overleg over de</text><text x="68" y="476" class="body">scheidingsmuur, herstel en Adida.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tryfons plan · 39–47</text><text x="68" y="625" class="body">Eer en beloften doen Jonathan het</text><text x="68" y="668" class="body">grootste deel van zijn troepen</text><text x="68" y="711" class="body">wegsturen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De val · 48–54</text><text x="68" y="860" class="body">Poorten dicht, gevangenneming en grote</text><text x="68" y="903" class="body">rouw; de anderen keren naar Judea</text><text x="68" y="946" class="body">terug.</text><text x="46" y="1039" class="note">De angstige melding aan het slot loopt niet</text><text x="46" y="1075" class="note">vooruit op de latere bevestiging van Jonathans</text><text x="46" y="1111" class="note">lot.</text></svg>