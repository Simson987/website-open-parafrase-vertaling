<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Voorbeelden van trouw</title><desc id="desc">Voorbeelden van trouw met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voorbeelden van trouw</text><text x="44" y="113" class="ref">1 Makkabeeën 2:52–60</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Abraham en Jozef · 52–53</text><text x="68" y="241" class="body">Trouw in beproeving; het gebod bewaren</text><text x="68" y="284" class="body">in nood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Pinehas, Jozua, Kaleb · 54–56</text><text x="68" y="433" class="body">Priesterschap, uitvoering van het woord</text><text x="68" y="476" class="body">en ontvangen erfdeel.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">David en Elia · 57–58</text><text x="68" y="625" class="body">Koningsverbond en ijver voor de wet.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Hananja, Azarja, Misaël · 59</text><text x="68" y="774" class="body">Geloof en redding uit de vlammen.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Daniël · 60</text><text x="68" y="923" class="body">Eenvoud en redding uit de muil van de</text><text x="68" y="966" class="body">leeuwen.</text><text x="46" y="1059" class="note">Dit zijn de herinnerde voorbeelden in</text><text x="46" y="1095" class="note">Mattathias’ toespraak, geen tegelijk aanwezige</text><text x="46" y="1131" class="note">raadgevers.</text></svg>