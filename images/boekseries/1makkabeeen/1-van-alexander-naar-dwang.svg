<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Van Alexander naar dwang</title><desc id="desc">Van Alexander naar dwang met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Alexander naar dwang</text><text x="44" y="113" class="ref">1 Makkabeeën 1:1–68</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Macht en opvolging · 1–16</text><text x="68" y="241" class="body">Alexander, zijn dienaren en Antiochus;</text><text x="68" y="284" class="body">een deel van Israël neemt vreemde</text><text x="68" y="327" class="body">gewoonten over.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Oorlog en plundering · 17–29</text><text x="68" y="476" class="body">Egypte, de tempelvoorwerpen en rouw in</text><text x="68" y="519" class="body">Israël.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De bezette stad · 30–43</text><text x="68" y="668" class="body">Bedrog, verwoesting, een burcht en</text><text x="68" y="711" class="body">vlucht van bewoners.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De dwang · 44–68</text><text x="68" y="860" class="body">Eén volk en vreemde wetten; onderdrukte</text><text x="68" y="903" class="body">eredienst, verbrande boeken en</text><text x="68" y="946" class="body">volgehouden trouw.</text><text x="46" y="1039" class="note">De briefbevelen en het geweld worden als</text><text x="46" y="1075" class="note">handelingen van de onderdrukkers beschreven.</text></svg>