<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Veranderende bondgenoten</title><desc id="desc">Veranderende bondgenoten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Veranderende bondgenoten</text><text x="44" y="113" class="ref">1 Makkabeeën 11:1–58</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ptolemeüs · 1–19</text><text x="68" y="241" class="body">Van schoonvader en bondgenoot naar twee</text><text x="68" y="284" class="body">kronen; Cleopatra gaat naar Demetrius.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Demetrius · 20–37</text><text x="68" y="433" class="body">Jonathan wordt bevestigd;</text><text x="68" y="476" class="body">belastingbrief en daarna ontslag van</text><text x="68" y="519" class="body">eigen troepen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De gebroken belofte · 38–52</text><text x="68" y="668" class="body">Tryfon bereidt een nieuwe koning voor;</text><text x="68" y="711" class="body">Joodse hulp redt Demetrius, maar wordt</text><text x="68" y="754" class="body">niet goed vergolden.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De jonge Antiochus · 53–58</text><text x="68" y="903" class="body">Tryfon kroont Alexanders zoon; Jonathan</text><text x="68" y="946" class="body">en Simon krijgen opnieuw erkenning.</text><text x="46" y="1039" class="note">De jonge Antiochus is hier Alexanders zoon,</text><text x="46" y="1075" class="note">onderscheiden van Antiochus Eupator uit</text><text x="46" y="1111" class="note">hoofdstuk 6.</text></svg>