<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Brieven en afzenders</title><desc id="desc">Brieven en afzenders met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Brieven en afzenders</text><text x="44" y="113" class="ref">1 Makkabeeën 12:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jonathan → Rome · 1–4</text><text x="68" y="241" class="body">Vriendschap vernieuwen; de raad geeft</text><text x="68" y="284" class="body">veilige geleidebrieven mee.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jonathan → Sparta · 5–18</text><text x="68" y="433" class="body">Broederschap herinneren en om antwoord</text><text x="68" y="476" class="body">vragen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Numenius en Antipater · 16–17</text><text x="68" y="625" class="body">Numenius is zoon van Antiochus;</text><text x="68" y="668" class="body">Antipater is zoon van Jason.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De oudere brief · 19–23</text><text x="68" y="817" class="body">Areüs richt zich tot Onias en noemt de</text><text x="68" y="860" class="body">Joden en Spartanen broeders uit</text><text x="68" y="903" class="body">Abraham.</text><text x="46" y="996" class="note">De Abrahamverwantschap wordt als bewering uit de</text><text x="46" y="1032" class="note">geciteerde brief weergegeven, niet als nieuw</text><text x="46" y="1068" class="note">uitgewerkte stamboom.</text></svg>