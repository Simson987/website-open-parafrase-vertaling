<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Twee koninklijke aanbiedingen</title><desc id="desc">Twee koninklijke aanbiedingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee koninklijke aanbiedingen</text><text x="44" y="113" class="ref">1 Makkabeeën 10:1–47</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Demetrius eerst · 3–14</text><text x="68" y="241" class="body">Vriendschap, wapens en vrijlating van</text><text x="68" y="284" class="body">gijzelaars; Jonathan herbouwt</text><text x="68" y="327" class="body">Jeruzalem.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Alexander · 15–21</text><text x="68" y="476" class="body">Hogepriesterschap, vriendschap,</text><text x="68" y="519" class="body">purperen mantel en gouden kroon.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Demetrius opnieuw · 22–45</text><text x="68" y="668" class="body">Vrijstellingen, inkomsten, erkenning en</text><text x="68" y="711" class="body">bijdragen voor tempel en muren.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Jonathans keuze · 46–47</text><text x="68" y="860" class="body">De eerdere onderdrukking maakt</text><text x="68" y="903" class="body">Demetrius’ woorden ongeloofwaardig; men</text><text x="68" y="946" class="body">kiest Alexander.</text><text x="46" y="1039" class="note">Het schema onderscheidt beloften in brieven van</text><text x="46" y="1075" class="note">wat Jonathan en het volk aannemen.</text></svg>