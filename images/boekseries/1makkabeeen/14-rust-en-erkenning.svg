<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Rust en erkenning</title><desc id="desc">Rust en erkenning met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rust en erkenning</text><text x="44" y="113" class="ref">1 Makkabeeën 14:1–49</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Demetrius · 1–3</text><text x="68" y="241" class="body">Zijn tocht naar Medië eindigt met</text><text x="68" y="284" class="body">gevangenneming bij Arsaces.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De rust · 4–15</text><text x="68" y="433" class="body">Werk, opbrengst, pleinen, voedsel,</text><text x="68" y="476" class="body">wijnstok/vijgenboom en een verfraaid</text><text x="68" y="519" class="body">heiligdom.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De buitenlandse erkenning · 16–24</text><text x="68" y="668" class="body">Rome en Sparta vernieuwen vriendschap;</text><text x="68" y="711" class="body">Numenius brengt een gouden schild.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De binnenlandse erkenning · 25–49</text><text x="68" y="860" class="body">Het volk legt Simons taken, eer en</text><text x="68" y="903" class="body">aanstelling vast op koperen platen.</text><text x="46" y="996" class="note">De aanstelling blijft volgens vers 41 gelden</text><text x="46" y="1032" class="note">totdat er een betrouwbare profeet opstaat.</text></svg>