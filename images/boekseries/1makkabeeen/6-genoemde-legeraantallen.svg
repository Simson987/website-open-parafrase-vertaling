<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">De genoemde legeraantallen</title><desc id="desc">De genoemde legeraantallen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde legeraantallen</text><text x="44" y="113" class="ref">1 Makkabeeën 6:30,35–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het hele leger · 30</text><text x="68" y="241" class="body">100.000 man voetvolk, 20.000 ruiters en</text><text x="68" y="284" class="body">32 olifanten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij elke olifant · 35</text><text x="68" y="433" class="body">1.000 man voetvolk en 500 uitgelezen</text><text x="68" y="476" class="body">ruiters worden ingedeeld.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De houten toren · 37</text><text x="68" y="625" class="body">De plaatselijke tekst noemt 32</text><text x="68" y="668" class="body">strijders op elk dier en een Indiër die</text><text x="68" y="711" class="body">het dier mende.</text><text x="46" y="804" class="note">De grote aantallen zijn exact als tekstgegevens</text><text x="46" y="840" class="note">weergegeven; dit is geen schaalreconstructie van</text><text x="46" y="876" class="note">draagvermogen.</text></svg>