<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820"><title>Het grafmonument in Modin</title><rect width="840" height="820" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Het grafmonument in Modin</text><text x="42" y="105" font-size="25">1 Makkabeeën 13:27–30</text><rect x="50" y="250" width="740" height="80" fill="#d5d4c3" stroke="#6b756a"/><path d="M70 250 L105 165 L140 250 Z" fill="#dfe8d6" stroke="#52725e" stroke-width="2"/><text x="105" y="290" text-anchor="middle" font-size="28">1</text><path d="M170 250 L205 165 L240 250 Z" fill="#dfe8d6" stroke="#52725e" stroke-width="2"/><text x="205" y="290" text-anchor="middle" font-size="28">2</text><path d="M270 250 L305 165 L340 250 Z" fill="#dfe8d6" stroke="#52725e" stroke-width="2"/><text x="305" y="290" text-anchor="middle" font-size="28">3</text><path d="M370 250 L405 165 L440 250 Z" fill="#dfe8d6" stroke="#52725e" stroke-width="2"/><text x="405" y="290" text-anchor="middle" font-size="28">4</text><path d="M470 250 L505 165 L540 250 Z" fill="#dfe8d6" stroke="#52725e" stroke-width="2"/><text x="505" y="290" text-anchor="middle" font-size="28">5</text><path d="M570 250 L605 165 L640 250 Z" fill="#dfe8d6" stroke="#52725e" stroke-width="2"/><text x="605" y="290" text-anchor="middle" font-size="28">6</text><path d="M670 250 L705 165 L740 250 Z" fill="#dfe8d6" stroke="#52725e" stroke-width="2"/><text x="705" y="290" text-anchor="middle" font-size="28">7</text><text x="42" y="390" font-size="27">Zeven piramides · 28</text><text x="42" y="440" font-size="27">Vader, moeder en vier broers worden genoemd.</text><text x="42" y="500" font-size="27">Geslepen stenen en grote zuilen · 27,29</text><text x="42" y="550" font-size="27">Wapens en uitgehakte schepen · 29</text><text x="42" y="640" font-size="27">Schematisch ontwerp; geen schaalreconstructie.</text><text x="42" y="685" font-size="27">De tekst wijst niet elke piramide apart toe.</text><text x="42" y="730" font-size="27">De schepen zijn vanaf zee zichtbaar bedoeld.</text></g></svg>