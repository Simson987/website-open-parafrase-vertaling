<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Bruiloft, eer en strijd</title><desc id="desc">Bruiloft, eer en strijd met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bruiloft, eer en strijd</text><text x="44" y="113" class="ref">1 Makkabeeën 10:48–89</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Alexander wint · 48–50</text><text x="68" y="241" class="body">Demetrius valt in de strijd.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De bruiloft · 51–58</text><text x="68" y="390" class="body">Ptolemeüs verbindt zijn dochter</text><text x="68" y="433" class="body">Cleopatra met Alexander in Ptolemaïs.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De eer · 59–66</text><text x="68" y="582" class="body">Jonathan ontvangt purper en publieke</text><text x="68" y="625" class="body">bescherming tegen aanklagers.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Een nieuwe tegenstander · 67–89</text><text x="68" y="774" class="body">De zoon Demetrius, Apollonius en de</text><text x="68" y="817" class="body">vlakte; Simon helpt, Alexander geeft</text><text x="68" y="860" class="body">gesp en Ekron.</text><text x="46" y="953" class="note">De latere Demetrius wordt in vers 67</text><text x="46" y="989" class="note">uitdrukkelijk als zoon van Demetrius benoemd.</text></svg>