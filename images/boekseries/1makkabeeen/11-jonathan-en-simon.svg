<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Jonathan en Simon</title><desc id="desc">Jonathan en Simon met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jonathan en Simon</text><text x="44" y="113" class="ref">1 Makkabeeën 11:59–73</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jonathan · 59–63</text><text x="68" y="241" class="body">Askelon, Gaza en richting Damascus;</text><text x="68" y="284" class="body">daarna tegenstanders in Kades.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Simon · 64–65</text><text x="68" y="433" class="body">Beleg van Bet-Sur en het overnemen van</text><text x="68" y="476" class="body">de stad.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hasor · 66–69</text><text x="68" y="625" class="body">Een hinderlaag en de vlucht van de</text><text x="68" y="668" class="body">eigen mannen; twee aanvoerders blijven.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gebed en terugkeer · 70–73</text><text x="68" y="817" class="body">Jonathan bidt, keert tot de strijd</text><text x="68" y="860" class="body">terug en de gevluchte mannen sluiten</text><text x="68" y="903" class="body">weer aan.</text><text x="46" y="996" class="note">De twee achterblijvende aanvoerders zijn</text><text x="46" y="1032" class="note">Mattathias, zoon van Absalom, en Judas, zoon van</text><text x="46" y="1068" class="note">Chalfi.</text></svg>