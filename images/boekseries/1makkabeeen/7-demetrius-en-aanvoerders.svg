<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Demetrius en de aanvoerders</title><desc id="desc">Demetrius en de aanvoerders met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Demetrius en de aanvoerders</text><text x="44" y="113" class="ref">1 Makkabeeën 7:1–50</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De troonwisseling · 1–9</text><text x="68" y="241" class="body">Demetrius wordt koning; Bacchides komt</text><text x="68" y="284" class="body">met Alcimus, die hogepriester wordt.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De gebroken vrede · 10–25</text><text x="68" y="433" class="body">Vriendelijke woorden, een geschonden</text><text x="68" y="476" class="body">eed en geweld; Alcimus zoekt steun</text><text x="68" y="519" class="body">tegen Judas.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Nikanor · 26–38</text><text x="68" y="668" class="body">Bedrieglijke ontmoeting, dreiging tegen</text><text x="68" y="711" class="body">het huis en priestergebed.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Adasa · 39–50</text><text x="68" y="860" class="body">Judas bidt, Nikanor valt en 13 Adar</text><text x="68" y="903" class="body">wordt een jaarlijkse vreugdedag.</text><text x="46" y="996" class="note">De twee bedrieglijke vredescontacten hebben</text><text x="46" y="1032" class="note">verschillende hoofdpersonen.</text></svg>