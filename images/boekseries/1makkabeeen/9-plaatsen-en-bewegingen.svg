<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Plaatsen en bewegingen</title><desc id="desc">Plaatsen en bewegingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plaatsen en bewegingen</text><text x="44" y="113" class="ref">1 Makkabeeën 9:33–73</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tekoa en Asfar · 33</text><text x="68" y="241" class="body">Een wijkplaats in de woestijn.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Medeba en de Jordaan · 35–49</text><text x="68" y="390" class="body">Johannes’ bagageopdracht, wraak en een</text><text x="68" y="433" class="body">ontsnapping zwemmend over de rivier.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bet-Basi · 62–68</text><text x="68" y="582" class="body">Herbouw, belegering, Simon in de stad</text><text x="68" y="625" class="body">en Jonathan daarbuiten.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Michmas · 70–73</text><text x="68" y="774" class="body">Gezanten, vrijlating en Jonathans</text><text x="68" y="817" class="body">nieuwe bestuursplaats.</text><text x="46" y="910" class="note">De plaatsnamen zijn tekstankers, zonder</text><text x="46" y="946" class="note">veronderstelde moderne grens- of</text><text x="46" y="982" class="note">afstandsaanduidingen.</text></svg>