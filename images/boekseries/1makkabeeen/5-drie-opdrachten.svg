<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Drie opdrachten</title><desc id="desc">Drie opdrachten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie opdrachten</text><text x="44" y="113" class="ref">1 Makkabeeën 5:17–20,55–62</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Simon → Galilea</text><text x="68" y="241" class="body">Drieduizend man om de bedreigde</text><text x="68" y="284" class="body">broeders te redden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Judas en Jonathan → Gilead</text><text x="68" y="433" class="body">Achtduizend man voor de tocht naar de</text><text x="68" y="476" class="body">broeders aan de overzijde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jozef en Azaria → Judea</text><text x="68" y="625" class="body">Bewaken en geen strijd beginnen vóór de</text><text x="68" y="668" class="body">terugkeer.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De latere overtreding · 55–62</text><text x="68" y="817" class="body">Jozef en Azaria zoeken zelf naam bij</text><text x="68" y="860" class="body">Jamnia en worden verslagen.</text><text x="46" y="953" class="note">Jozef is de zoon van Zacharia. De drie</text><text x="46" y="989" class="note">opdrachten worden niet als één gezamenlijke</text><text x="46" y="1025" class="note">route getekend.</text></svg>