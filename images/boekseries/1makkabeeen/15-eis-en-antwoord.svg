<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Eis en antwoord</title><desc id="desc">Eis en antwoord met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eis en antwoord</text><text x="44" y="113" class="ref">1 Makkabeeën 15:28–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gevraagde gebieden · 28–30</text><text x="68" y="241" class="body">Joppe, Gazara en de burcht; daarnaast</text><text x="68" y="284" class="body">tollen en andere plaatsen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het alternatief · 31</text><text x="68" y="433" class="body">500 talenten voor de steden en 500 voor</text><text x="68" y="476" class="body">schade en tollen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Simons antwoord · 33–35</text><text x="68" y="625" class="body">Het erfdeel van de vaderen</text><text x="68" y="668" class="body">teruggehaald; voor Joppe en Gazara</text><text x="68" y="711" class="body">biedt hij 100 talenten.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De reactie · 36</text><text x="68" y="860" class="body">Athenobius keert zonder antwoord</text><text x="68" y="903" class="body">woedend terug; ook de koning wordt</text><text x="68" y="946" class="body">kwaad.</text><text x="46" y="1039" class="note">De bedragen zijn aanbiedingen en eisen van</text><text x="46" y="1075" class="note">verschillende sprekers, geen betaalde</text><text x="46" y="1111" class="note">eindafrekening.</text></svg>