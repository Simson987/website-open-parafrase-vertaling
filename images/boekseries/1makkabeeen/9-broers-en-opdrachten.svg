<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Broers en opdrachten</title><desc id="desc">Broers en opdrachten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Broers en opdrachten</text><text x="44" y="113" class="ref">1 Makkabeeën 9:19,28–38,62–67</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jonathan</text><text x="68" y="241" class="body">Gekozen als leider na Judas; neemt de</text><text x="68" y="284" class="body">leiding op zich.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Simon</text><text x="68" y="433" class="body">Begraaft Judas met Jonathan; blijft</text><text x="68" y="476" class="body">later in Bet-Basi bij de verdediging.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Johannes</text><text x="68" y="625" class="body">Krijgt de bagageopdracht richting de</text><text x="68" y="668" class="body">Nabateeërs; wordt bij Medeba gegrepen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Judas</text><text x="68" y="817" class="body">Zijn dood en nagedachtenis vormen het</text><text x="68" y="860" class="body">beginpunt van de opvolging.</text><text x="46" y="953" class="note">De broers worden niet als gelijktijdige</text><text x="46" y="989" class="note">opvolgers weergegeven; hun opdrachten</text><text x="46" y="1025" class="note">verschillen.</text></svg>