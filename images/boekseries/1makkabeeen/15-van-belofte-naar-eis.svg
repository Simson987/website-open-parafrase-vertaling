<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Van belofte naar eis</title><desc id="desc">Van belofte naar eis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van belofte naar eis</text><text x="44" y="113" class="ref">1 Makkabeeën 15:1–41</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Antiochus belooft · 1–14</text><text x="68" y="241" class="body">Vrijstellingen en eigen munten;</text><text x="68" y="284" class="body">vervolgens beleg van Dora.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Rome schrijft · 15–24</text><text x="68" y="433" class="body">Vriendschap bevestigd en brieven aan</text><text x="68" y="476" class="body">koningen en landen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Antiochus keert · 25–36</text><text x="68" y="625" class="body">Hulp geweigerd, afspraken gebroken en</text><text x="68" y="668" class="body">Athenobius met een eis naar Simon.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De nieuwe dreiging · 37–41</text><text x="68" y="817" class="body">Tryfon ontsnapt; Cendebeüs versterkt</text><text x="68" y="860" class="body">Kedron en doet uitvallen.</text><text x="46" y="953" class="note">De Romeinse brieven en de veranderende houding</text><text x="46" y="989" class="note">van Antiochus zijn twee afzonderlijke</text><text x="46" y="1025" class="note">diplomatieke lijnen.</text></svg>