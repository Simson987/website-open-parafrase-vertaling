<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Judas en de twee fronten</title><desc id="desc">Judas en de twee fronten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Judas en de twee fronten</text><text x="44" y="113" class="ref">1 Makkabeeën 3:1–60</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het optreden · 1–26</text><text x="68" y="241" class="body">Judas volgt zijn vader op; Apollonius</text><text x="68" y="284" class="body">en Seron worden verslagen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het koninklijke plan · 27–40</text><text x="68" y="433" class="body">Soldij, geldgebrek, Antiochus naar</text><text x="68" y="476" class="body">Perzië en Lysias met bevelhebbers naar</text><text x="68" y="519" class="body">Juda.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De dreiging · 41–43</text><text x="68" y="668" class="body">Handelaren verwachten gevangenen te</text><text x="68" y="711" class="body">kopen; Judas en zijn broers</text><text x="68" y="754" class="body">beraadslagen.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De voorbereiding · 44–60</text><text x="68" y="903" class="body">Gebed in Mispa, wet, trompetten,</text><text x="68" y="946" class="body">leiders en vrijstellingen voor de</text><text x="68" y="989" class="body">strijd.</text><text x="46" y="1082" class="note">De leeuw in vers 4 beschrijft Judas’ optreden</text><text x="46" y="1118" class="note">als vergelijking.</text></svg>