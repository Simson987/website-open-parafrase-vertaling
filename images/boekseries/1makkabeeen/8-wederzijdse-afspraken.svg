<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Wederzijdse afspraken</title><desc id="desc">Wederzijdse afspraken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wederzijdse afspraken</text><text x="44" y="113" class="ref">1 Makkabeeën 8:23–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oorlog tegen Rome · 24–26</text><text x="68" y="241" class="body">De Joden helpen van harte; zij leveren</text><text x="68" y="284" class="body">de vijand geen proviand, wapens, geld</text><text x="68" y="327" class="body">of schepen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Oorlog tegen de Joden · 27–28</text><text x="68" y="476" class="body">Rome helpt van harte; dezelfde</text><text x="68" y="519" class="body">leveringen aan de vijand worden</text><text x="68" y="562" class="body">geweerd.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Wijzigingen · 29–30</text><text x="68" y="711" class="body">Beide partijen mogen iets toevoegen of</text><text x="68" y="754" class="body">weglaten.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Demetrius · 31–32</text><text x="68" y="903" class="body">Rome waarschuwt hem het juk over hun</text><text x="68" y="946" class="body">vrienden niet te verzwaren.</text><text x="46" y="1039" class="note">Het verbond heeft wederzijdse bepalingen;</text><text x="46" y="1075" class="note">voorwaarden over tijd en omstandigheden blijven</text><text x="46" y="1111" class="note">in de tekst staan.</text></svg>