<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Simons vastgelegde taken</title><desc id="desc">Simons vastgelegde taken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Simons vastgelegde taken</text><text x="44" y="113" class="ref">1 Makkabeeën 14:41–49</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Leiding en priesterschap · 41</text><text x="68" y="241" class="body">Leider en hogepriester tot er een</text><text x="68" y="284" class="body">betrouwbare profeet opstaat.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Leger en aanstellingen · 42</text><text x="68" y="433" class="body">Veldheer; toezicht op dienst, land,</text><text x="68" y="476" class="body">wapens en vestingen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Bestuur en eer · 43–47</text><text x="68" y="625" class="body">Zorg voor het heiligdom, documenten op</text><text x="68" y="668" class="body">zijn naam en de genoemde eertekens.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De bewaring · 48–49</text><text x="68" y="817" class="body">Publieke koperen platen en een</text><text x="68" y="860" class="body">afschrift in de schatkamer.</text><text x="46" y="953" class="note">Het schema ordent de bepalingen van het</text><text x="46" y="989" class="note">volksbesluit, zonder er nieuwe bevoegdheden aan</text><text x="46" y="1025" class="note">toe te voegen.</text></svg>