<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Judas, Jonathan en rust</title><desc id="desc">Judas, Jonathan en rust met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Judas, Jonathan en rust</text><text x="44" y="113" class="ref">1 Makkabeeën 9:1–73</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verlies · 1–22</text><text x="68" y="241" class="body">Overmacht bij Elasa, dood van Judas,</text><text x="68" y="284" class="body">begrafenis en rouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het nieuwe leiderschap · 23–42</text><text x="68" y="433" class="body">Onderdrukking, keuze voor Jonathan,</text><text x="68" y="476" class="body">vlucht en de episode rond Johannes.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De strijd om ruimte · 43–57</text><text x="68" y="625" class="body">Jordaan, vestingen, gijzelaars, Alcimus</text><text x="68" y="668" class="body">en twee jaren rust.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het akkoord · 58–73</text><text x="68" y="817" class="body">Nieuw plan tegen Jonathan, Bet-Basi,</text><text x="68" y="860" class="body">vrede, vrijlating en bestuur in</text><text x="68" y="903" class="body">Michmas.</text><text x="46" y="996" class="note">De rust in het midden van het hoofdstuk wordt</text><text x="46" y="1032" class="note">gevolgd door een nieuw conflict en daarna vrede.</text></svg>