<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Tocht en terugkeer</title><desc id="desc">Tocht en terugkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tocht en terugkeer</text><text x="44" y="113" class="ref">1 Makkabeeën 5:24–54</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De heenweg · 24–27</text><text x="68" y="241" class="body">Jordaan, drie dagen woestijn en</text><text x="68" y="284" class="body">vreedzaam nieuws van de Nabateeërs.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De reddingsgevechten · 28–44</text><text x="68" y="433" class="body">Verschillende steden, Timotheüs en de</text><text x="68" y="476" class="body">oversteek van de beek.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De verzameling · 45</text><text x="68" y="625" class="body">Gezinnen met huisraad vormen een grote</text><text x="68" y="668" class="body">stoet.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De weg naar huis · 46–54</text><text x="68" y="817" class="body">Gesloten Efron, Jordaan bij Bet-San,</text><text x="68" y="860" class="body">achterhoede en dank op Sion.</text><text x="46" y="953" class="note">De routewoorden volgen de tekst; dit is geen</text><text x="46" y="989" class="note">kaart met veronderstelde moderne coördinaten.</text></svg>