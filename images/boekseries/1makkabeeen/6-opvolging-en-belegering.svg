<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Opvolging en belegering</title><desc id="desc">Opvolging en belegering met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opvolging en belegering</text><text x="44" y="113" class="ref">1 Makkabeeën 6:1–63</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Antiochus · 1–16</text><text x="68" y="241" class="body">Elymaïs, slecht nieuws, erkenning en de</text><text x="68" y="284" class="body">tekens voor Filippus; overlijden in</text><text x="68" y="327" class="body">jaar 149.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De zoon · 17–41</text><text x="68" y="476" class="body">Lysias stelt Antiochus Eupator aan; de</text><text x="68" y="519" class="body">veldtocht met olifanten volgt.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De druk · 42–54</text><text x="68" y="668" class="body">Eleazar, terugtocht, belegering en lege</text><text x="68" y="711" class="body">voorraden in het sabbatsjaar.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het politieke keerpunt · 55–63</text><text x="68" y="860" class="body">Filippus keert terug; vrede wordt</text><text x="68" y="903" class="body">aangeboden, de eed gebroken en</text><text x="68" y="946" class="body">Antiochië heroverd.</text><text x="46" y="1039" class="note">De koningsnaam Antiochus wordt voor vader en</text><text x="46" y="1075" class="note">zoon gebruikt; hun handelingen horen bij</text><text x="46" y="1111" class="note">verschillende personen.</text></svg>