<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Werk aan het heiligdom</title><desc id="desc">Werk aan het heiligdom met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Werk aan het heiligdom</text><text x="44" y="113" class="ref">1 Makkabeeën 4:42–59</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Reinigen · 42–46</text><text x="68" y="241" class="body">Priesters gekozen, besmette stenen</text><text x="68" y="284" class="body">weggehaald en oude altaarstenen apart</text><text x="68" y="327" class="body">bewaard.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Herbouwen · 47–48</text><text x="68" y="476" class="body">Hele stenen voor het nieuwe altaar;</text><text x="68" y="519" class="body">herstel van huis en voorhoven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Inrichten · 49–51</text><text x="68" y="668" class="body">Nieuwe voorwerpen, lampen, reukwerk,</text><text x="68" y="711" class="body">toonbroden en voorhangsels.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vieren · 52–59</text><text x="68" y="860" class="body">Op 25 Kislev in jaar 148; acht dagen</text><text x="68" y="903" class="body">inwijding en een jaarlijkse instelling.</text><text x="46" y="996" class="note">De apart gelegde oude stenen zijn onderscheiden</text><text x="46" y="1032" class="note">van de hele stenen voor het nieuwe altaar.</text></svg>