<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Bevelhebbers en taken</title><desc id="desc">Bevelhebbers en taken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bevelhebbers en taken</text><text x="44" y="113" class="ref">1 Makkabeeën 3:32–40,55–56</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lysias · 32–36</text><text x="68" y="241" class="body">Toezicht van Eufraat tot Egypte, zorg</text><text x="68" y="284" class="body">voor de koningszoon en een militaire</text><text x="68" y="327" class="body">opdracht.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Antiochus · 37</text><text x="68" y="476" class="body">Met de andere helft van de troepen op</text><text x="68" y="519" class="body">reis naar het oosten.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ptolemeüs, Nikanor, Gorgias · 38–40</text><text x="68" y="668" class="body">Door Lysias uitgekozen; kamp bij Emmaüs</text><text x="68" y="711" class="body">met 40.000 man en 7.000 ruiters.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Judas’ leiders · 55–56</text><text x="68" y="860" class="body">Over duizend, honderd, vijftig en tien;</text><text x="68" y="903" class="body">bouwers, pasgetrouwden, planters en</text><text x="68" y="946" class="body">angstigen mogen terug.</text><text x="46" y="1039" class="note">De koninklijke bevelslijn en Judas’</text><text x="46" y="1075" class="note">voorbereiding zijn afzonderlijke organisaties.</text></svg>