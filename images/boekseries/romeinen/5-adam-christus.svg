<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Adam en Christus in de vergelijking</title><desc id="desc">Adam en Christus in de vergelijking met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Adam en Christus in de vergelijking</text><text x="44" y="113" class="ref">Romeinen 5:12–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Adam</text><text x="68" y="241" class="body">Eén overtreding; ongehoorzaamheid;</text><text x="68" y="284" class="body">zonde en dood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Christus</text><text x="68" y="433" class="body">Gehoorzaamheid; genadegave; vrijspraak</text><text x="68" y="476" class="body">en leven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Geen gelijke maat</text><text x="68" y="625" class="body">Paulus noemt de genade overvloediger</text><text x="68" y="668" class="body">dan de overtreding.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De slotsom</text><text x="68" y="817" class="body">Genade heerst door gerechtigheid tot</text><text x="68" y="860" class="body">het eeuwige leven.</text><text x="46" y="953" class="note">Het schema volgt de vergelijking; het is geen</text><text x="46" y="989" class="note">afbeelding van een hemelse rechtszaal.</text></svg>