<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Verschillen zonder veroordelen</title><desc id="desc">Verschillen zonder veroordelen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verschillen zonder veroordelen</text><text x="44" y="113" class="ref">Romeinen 14:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eten · vers 2–3</text><text x="68" y="241" class="body">De een eet alles, een ander alleen</text><text x="68" y="284" class="body">groente.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dagen · vers 5</text><text x="68" y="433" class="body">De een onderscheidt dagen, de ander</text><text x="68" y="476" class="body">vindt ze gelijk.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Beiden · vers 6</text><text x="68" y="625" class="body">Wie eet en wie niet eet, danken God.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De omgang · vers 1–4</text><text x="68" y="774" class="body">Neem elkaar aan; kijk niet neer en</text><text x="68" y="817" class="body">veroordeel niet.</text><text x="46" y="910" class="note">Het schema toont Paulus’ voorbeelden van</text><text x="46" y="946" class="note">overtuigingen binnen de gemeenschap.</text></svg>