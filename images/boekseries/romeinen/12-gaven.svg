<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1262" viewBox="0 0 840 1262"><title>Verschillende genadegaven</title><rect width="840" height="1262" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Verschillende genadegaven</text><text x="42" y="105" font-size="25">Romeinen 12:4–8</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Velen, samen één lichaam</text><path d="M470 215 V235 H75 V1073.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 311.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Profetie</text><text x="175" y="337" font-size="29">Naar de maat van het geloof.</text><path d="M75 438.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="387" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="424" font-size="31" font-weight="700">Dienen</text><text x="175" y="464" font-size="29">Wie dienen mag, moet dienen.</text><path d="M75 565.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="514" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="551" font-size="31" font-weight="700">Onderwijzen</text><text x="175" y="591" font-size="29">Wie onderwijzen mag, moet onderwijzen.</text><path d="M75 692.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="641" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="678" font-size="31" font-weight="700">Bemoedigen</text><text x="175" y="718" font-size="29">Wie bemoedigen mag, moet bemoedigen.</text><path d="M75 819.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="768" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="805" font-size="31" font-weight="700">Uitdelen</text><text x="175" y="845" font-size="29">Eerlijk uitdelen.</text><path d="M75 946.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="895" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="932" font-size="31" font-weight="700">Leidinggeven</text><text x="175" y="972" font-size="29">Met inzet leidinggeven.</text><path d="M75 1073.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="1022" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="1059" font-size="31" font-weight="700">Barmhartig zijn</text><text x="175" y="1099" font-size="29">Met blijdschap barmhartig zijn.</text><text x="42" y="1171" font-size="26">De zeven genoemde gaven volgen vers 6–8;</text><text x="42" y="1205" font-size="26">lichaamsdelen zijn beeldspraak.</text></g></svg>