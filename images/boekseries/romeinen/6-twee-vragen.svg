<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Twee vragen over genade</title><desc id="desc">Twee vragen over genade met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee vragen over genade</text><text x="44" y="113" class="ref">Romeinen 6:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vraag 1 · vers 1</text><text x="68" y="241" class="body">Blijven zondigen zodat genade groter</text><text x="68" y="284" class="body">wordt?</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Antwoord · vers 2–11</text><text x="68" y="433" class="body">Absoluut niet: gestorven aan de zonde,</text><text x="68" y="476" class="body">levend met Christus.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vraag 2 · vers 15</text><text x="68" y="625" class="body">Zondigen omdat wij onder genade leven?</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Antwoord · vers 16–19</text><text x="68" y="774" class="body">Absoluut niet: gehoorzaam de</text><text x="68" y="817" class="body">gerechtigheid van harte.</text><text x="46" y="910" class="note">De twee vragen hebben hetzelfde afwijzende</text><text x="46" y="946" class="note">antwoord en een eigen uitleg.</text></svg>