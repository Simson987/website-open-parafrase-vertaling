<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760"><title>De genoemde familie</title><rect width="840" height="760" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">De genoemde familie</text><text x="42" y="105" font-size="25">Romeinen 9:7–13</text><g fill="none" stroke="#52725e" stroke-width="4"><path d="M420 235 V305"/><path d="M420 385 V450 H210 V495"/><path d="M420 450 H630 V495"/></g><rect x="180" y="155" width="480" height="80" rx="14" fill="#dfe8d6" stroke="#52725e"/><text x="420" y="205" text-anchor="middle" font-size="32" font-weight="700">Abraham en Sara</text><rect x="180" y="305" width="480" height="80" rx="14" fill="#dfe8d6" stroke="#52725e"/><text x="420" y="355" text-anchor="middle" font-size="32" font-weight="700">Izak en Rebekka</text><rect x="70" y="495" width="280" height="80" rx="14" fill="white" stroke="#52725e"/><text x="210" y="545" text-anchor="middle" font-size="32" font-weight="700">Jakob</text><rect x="490" y="495" width="280" height="80" rx="14" fill="white" stroke="#52725e"/><text x="630" y="545" text-anchor="middle" font-size="32" font-weight="700">Ezau</text><text x="42" y="640" font-size="27">De genoemde ouders en kinderen uit het betoog.</text><text x="42" y="680" font-size="27">De belofte en roeping staan centraal in vers 6–13.</text><text x="42" y="720" font-size="27">Dit schema is geen volledige stamboom van Abraham.</text></g></svg>