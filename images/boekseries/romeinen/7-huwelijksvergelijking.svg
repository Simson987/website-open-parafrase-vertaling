<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De huwelijksvergelijking</title><desc id="desc">De huwelijksvergelijking met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De huwelijksvergelijking</text><text x="44" y="113" class="ref">Romeinen 7:1–6</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zolang de man leeft</text><text x="68" y="241" class="body">De getrouwde vrouw is volgens het</text><text x="68" y="284" class="body">voorbeeld gebonden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Als hij sterft</text><text x="68" y="433" class="body">Zij is vrij van de wet die haar aan hem</text><text x="68" y="476" class="body">bond.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Toepassing · vers 4</text><text x="68" y="625" class="body">De gelovigen zijn voor de wet gestorven</text><text x="68" y="668" class="body">door Christus.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nieuwe verbondenheid</text><text x="68" y="817" class="body">Zij horen bij de Opgewekte en dragen</text><text x="68" y="860" class="body">vrucht voor God.</text><text x="46" y="953" class="note">Een vergelijking binnen het betoog, geen nieuwe</text><text x="46" y="989" class="note">vertelde bruiloft.</text></svg>