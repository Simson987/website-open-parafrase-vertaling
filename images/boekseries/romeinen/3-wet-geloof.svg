<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wet, genade en geloof</title><desc id="desc">Wet, genade en geloof met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wet, genade en geloof</text><text x="44" y="113" class="ref">Romeinen 3:19–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De wet · 19–20</text><text x="68" y="241" class="body">Sluit de mond en geeft kennis van</text><text x="68" y="284" class="body">zonde.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Genade · 21–24</text><text x="68" y="433" class="body">Gerechtigheid bekend; vrijspraak wordt</text><text x="68" y="476" class="body">om niet gegeven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Christus · 24–26</text><text x="68" y="625" class="body">Verlossing en verzoening tonen Gods</text><text x="68" y="668" class="body">gerechtigheid.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Geloof · 27–31</text><text x="68" y="817" class="body">Roemen is uitgesloten; één God</text><text x="68" y="860" class="body">rechtvaardigt beide groepen.</text><text x="46" y="953" class="note">De slotsom zegt tegelijk dat het geloof de wet</text><text x="46" y="989" class="note">bevestigt.</text></svg>