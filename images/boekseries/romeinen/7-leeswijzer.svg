<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">De goede wet en de strijd</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De goede wet en de strijd</text><text x="44" y="113" class="ref">Romeinen 7:1–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–6 · Een andere verbondenheid</text><text x="68" y="241" class="body">De huwelijksvergelijking verklaart het</text><text x="68" y="284" class="body">behoren bij Christus.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">7–13 · Wet en zonde</text><text x="68" y="433" class="body">Het gebod is goed; zonde misbruikt het.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">14–23 · Willen en doen</text><text x="68" y="582" class="body">Het gewilde goede gebeurt niet;</text><text x="68" y="625" class="body">innerlijke strijd.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">24–26 · De vraag om bevrijding</text><text x="68" y="774" class="body">Dank aan God door Jezus Christus.</text><text x="46" y="867" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="903" class="note">de plaatselijke versindeling.</text></svg>