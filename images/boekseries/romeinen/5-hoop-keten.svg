<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Van moeite naar hoop</title><desc id="desc">Van moeite naar hoop met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van moeite naar hoop</text><text x="44" y="113" class="ref">Romeinen 5:3–5</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Moeite</text><text x="68" y="241" class="body">Levert volharding op.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Volharding</text><text x="68" y="390" class="body">Levert ervaring op.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Ervaring</text><text x="68" y="539" class="body">Levert hoop op.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Hoop</text><text x="68" y="688" class="body">Stelt niet teleur; Gods liefde is door</text><text x="68" y="731" class="body">de Geest gegeven.</text><text x="46" y="824" class="note">Deze stappen volgen de formulering van de</text><text x="46" y="860" class="note">plaatselijke vertaling.</text></svg>