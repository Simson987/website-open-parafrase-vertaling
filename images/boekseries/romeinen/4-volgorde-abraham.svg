<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De volgorde bij Abraham</title><desc id="desc">De volgorde bij Abraham met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De volgorde bij Abraham</text><text x="44" y="113" class="ref">Romeinen 4:9–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerst geloof</text><text x="68" y="241" class="body">Als onbesnedene wordt geloof tot</text><text x="68" y="284" class="body">gerechtigheid gerekend.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Daarna het teken</text><text x="68" y="433" class="body">Besnijdenis wordt een zegel van die</text><text x="68" y="476" class="body">gerechtigheid.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Onbesneden gelovigen</text><text x="68" y="625" class="body">Abraham is ook hun vader.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Besneden gelovigen</text><text x="68" y="774" class="body">Ook zij volgen de voetsporen van zijn</text><text x="68" y="817" class="body">eerdere geloof.</text><text x="46" y="910" class="note">Deze volgorde komt uit Paulus’ redenering, niet</text><text x="46" y="946" class="note">uit een nieuwe stamboomtelling.</text></svg>