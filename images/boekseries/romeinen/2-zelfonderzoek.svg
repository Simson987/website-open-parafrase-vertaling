<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De oordelende lezer aangesproken</title><desc id="desc">De oordelende lezer aangesproken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De oordelende lezer aangesproken</text><text x="44" y="113" class="ref">Romeinen 2:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oordelen over anderen</text><text x="68" y="241" class="body">Dezelfde daden veroordelen ook de</text><text x="68" y="284" class="body">oordelende mens.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gods goedheid</text><text x="68" y="433" class="body">Zijn geduld wil tot bekering brengen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Horen en doen</text><text x="68" y="582" class="body">Alleen de wet horen maakt niet</text><text x="68" y="625" class="body">rechtvaardig.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De leraar zelf</text><text x="68" y="774" class="body">Wie een ander onderwijst, wordt op</text><text x="68" y="817" class="body">eigen gedrag bevraagd.</text><text x="46" y="910" class="note">De hoofdstuklogica roept tot zelfonderzoek, niet</text><text x="46" y="946" class="note">tot zelfverheffing.</text></svg>