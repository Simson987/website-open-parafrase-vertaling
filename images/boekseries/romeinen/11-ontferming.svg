<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Barmhartigheid in het betoog</title><desc id="desc">Barmhartigheid in het betoog met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Barmhartigheid in het betoog</text><text x="44" y="113" class="ref">Romeinen 11:25–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De volken · vers 30</text><text x="68" y="241" class="body">Vroeger ongehoorzaam; nu barmhartigheid</text><text x="68" y="284" class="body">ontvangen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zij · vers 31</text><text x="68" y="433" class="body">Ook zij zullen barmhartigheid</text><text x="68" y="476" class="body">ontvangen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gaven en roeping · vers 29</text><text x="68" y="625" class="body">God komt daarop niet terug.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De slotsom · vers 32</text><text x="68" y="774" class="body">God ontfermt Zich over allen die onder</text><text x="68" y="817" class="body">ongehoorzaamheid zijn.</text><text x="46" y="910" class="note">Lees dit met de waarschuwing tegen eigenwijsheid</text><text x="46" y="946" class="note">uit vers 25.</text></svg>