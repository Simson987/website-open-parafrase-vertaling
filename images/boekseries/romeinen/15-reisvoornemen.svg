<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Paulus’ reisvoornemen</title><desc id="desc">Paulus’ reisvoornemen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Paulus’ reisvoornemen</text><text x="44" y="113" class="ref">Romeinen 15:22–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerst · Jeruzalem</text><text x="68" y="241" class="body">De gave voor de arme heiligen</text><text x="68" y="284" class="body">overdragen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Daarna · Rome</text><text x="68" y="433" class="body">De gemeente op doorreis bezoeken en</text><text x="68" y="476" class="body">samen op adem komen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vervolgens · Spanje</text><text x="68" y="625" class="body">Paulus hoopt door Rome verder op weg</text><text x="68" y="668" class="body">geholpen te worden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Daarbij · gebed</text><text x="68" y="817" class="body">Voor redding en een goede ontvangst van</text><text x="68" y="860" class="body">zijn dienst.</text><text x="46" y="953" class="note">Dit zijn de plannen zoals Paulus ze hier</text><text x="46" y="989" class="note">beschrijft; het schema bevestigt geen</text><text x="46" y="1025" class="note">uitgevoerde reis naar Spanje.</text></svg>