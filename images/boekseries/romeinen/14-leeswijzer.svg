<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Aannemen en rekening houden</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aannemen en rekening houden</text><text x="44" y="113" class="ref">Romeinen 14:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–6 · Verschillende overtuigingen</text><text x="68" y="241" class="body">Eten en dagen zijn geen reden om elkaar</text><text x="68" y="284" class="body">te veroordelen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">7–12 · Wij zijn van de Heere</text><text x="68" y="433" class="body">Ieder zal zelf verantwoording afleggen</text><text x="68" y="476" class="body">aan God.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">13–18 · Geen struikelblok</text><text x="68" y="625" class="body">Liefde houdt rekening met de ander.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">19–23 · Vrede en opbouw</text><text x="68" y="774" class="body">Breek Gods werk niet af om eten; handel</text><text x="68" y="817" class="body">uit geloof.</text><text x="46" y="910" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="946" class="note">de plaatselijke versindeling.</text></svg>