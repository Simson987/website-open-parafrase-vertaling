<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Schuld, genade en geloof</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schuld, genade en geloof</text><text x="44" y="113" class="ref">Romeinen 3:1–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–8 · Gods trouw</text><text x="68" y="241" class="body">Menselijke ontrouw maakt Hem niet</text><text x="68" y="284" class="body">onwaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">9–20 · Iedereen onder de zonde</text><text x="68" y="433" class="body">De Schrift getuigt; de wet geeft kennis</text><text x="68" y="476" class="body">van zonde.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">21–26 · Gods gerechtigheid</text><text x="68" y="625" class="body">Om niet uit genade, door Jezus</text><text x="68" y="668" class="body">Christus.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">27–31 · Roemen uitgesloten</text><text x="68" y="817" class="body">Eén God voor Jood en niet-Jood;</text><text x="68" y="860" class="body">rechtvaardiging door geloof.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>