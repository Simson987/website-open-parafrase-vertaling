<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De olijfboom als beeld</title><desc id="desc">De olijfboom als beeld met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De olijfboom als beeld</text><text x="44" y="113" class="ref">Romeinen 11:16–24</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De wortel draagt</text><text x="68" y="241" class="body">De ingeënte tak draagt de wortel niet.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De wilde tak</text><text x="68" y="390" class="body">Deelt na het enten in de wortel van de</text><text x="68" y="433" class="body">olijfboom.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Geen hoogmoed</text><text x="68" y="582" class="body">Sta door geloof en blijf in Gods</text><text x="68" y="625" class="body">goedheid.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Opnieuw enten</text><text x="68" y="774" class="body">God kan eigen takken opnieuw enten als</text><text x="68" y="817" class="body">ongeloof niet blijft.</text><text x="46" y="910" class="note">Paulus gebruikt een vergelijking en waarschuwt</text><text x="46" y="946" class="note">tegen opscheppen tegenover de andere takken.</text></svg>