<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Vrede en opbouw voorop</title><desc id="desc">Vrede en opbouw voorop met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrede en opbouw voorop</text><text x="44" y="113" class="ref">Romeinen 14:13–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het Koninkrijk · vers 17</text><text x="68" y="241" class="body">Gerechtigheid, vrede en blijdschap door</text><text x="68" y="284" class="body">de Heilige Geest.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het doel · vers 19</text><text x="68" y="433" class="body">Zoek wat de vrede dient en elkaar</text><text x="68" y="476" class="body">opbouwt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De grens · vers 20–21</text><text x="68" y="625" class="body">Laat eten, vlees of wijn geen</text><text x="68" y="668" class="body">struikelblok worden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het geweten · vers 22–23</text><text x="68" y="817" class="body">Handel voor God en uit geloof, zonder</text><text x="68" y="860" class="body">twijfel te negeren.</text><text x="46" y="953" class="note">De ander opbouwen is belangrijker dan je eigen</text><text x="46" y="989" class="note">vrijheid doordrijven.</text></svg>