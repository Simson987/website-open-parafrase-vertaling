<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De verwisselingen in het betoog</title><desc id="desc">De verwisselingen in het betoog met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De verwisselingen in het betoog</text><text x="44" y="113" class="ref">Romeinen 1:21–32</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet danken en eren</text><text x="68" y="241" class="body">De gekende God krijgt geen eer als God.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Heerlijkheid ingeruild</text><text x="68" y="390" class="body">Vergankelijke beelden nemen de plaats</text><text x="68" y="433" class="body">van God in.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Waarheid ingeruild</text><text x="68" y="582" class="body">Het schepsel wordt geëerd in plaats van</text><text x="68" y="625" class="body">de Schepper.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Gevolgen</text><text x="68" y="774" class="body">Paulus beschrijft verkeerde verlangens,</text><text x="68" y="817" class="body">denken en onrecht.</text><text x="46" y="910" class="note">Het volgende hoofdstuk spreekt ook de oordelende</text><text x="46" y="946" class="note">lezer zelf aan.</text></svg>