<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Enkele mensen en hun rol</title><desc id="desc">Enkele mensen en hun rol met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Enkele mensen en hun rol</text><text x="44" y="113" class="ref">Romeinen 16:1–5, 21–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Febe · vers 1–2</text><text x="68" y="241" class="body">Dienares in Kenchreeën; aanbevolen om</text><text x="68" y="284" class="body">te ontvangen en helpen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Prisca en Aquila · vers 3–5</text><text x="68" y="433" class="body">Medewerkers; een gemeente komt in hun</text><text x="68" y="476" class="body">huis samen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tertius · vers 22</text><text x="68" y="625" class="body">Heeft deze brief opgeschreven.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Gajus en Erastus · vers 23</text><text x="68" y="774" class="body">Gastheer van Paulus en de gemeente;</text><text x="68" y="817" class="body">beheerder van de stad.</text><text x="46" y="910" class="note">Dit is een selectie van expliciet genoemde</text><text x="46" y="946" class="note">rollen, geen volledige lijst van alle groeten.</text></svg>