<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat kan ons niet scheiden?</title><desc id="desc">Wat kan ons niet scheiden? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat kan ons niet scheiden?</text><text x="44" y="113" class="ref">Romeinen 8:31–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verdrukking en gebrek</text><text x="68" y="241" class="body">Benauwdheid, vervolging, honger,</text><text x="68" y="284" class="body">armoede en gevaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dood en leven</text><text x="68" y="433" class="body">Ook deze twee worden uitdrukkelijk</text><text x="68" y="476" class="body">genoemd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Machten, tijd en ruimte</text><text x="68" y="625" class="body">Engelen, machthebbers, heden, toekomst,</text><text x="68" y="668" class="body">hoogte en diepte.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Niets in de schepping</text><text x="68" y="817" class="body">Kan scheiden van Gods liefde in</text><text x="68" y="860" class="body">Christus Jezus.</text><text x="46" y="953" class="note">De zekerheid betreft de liefde in de genoemde</text><text x="46" y="989" class="note">nood, niet het ontbreken van lijden.</text></svg>