<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Wet en zonde niet verwarren</title><desc id="desc">Wet en zonde niet verwarren met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wet en zonde niet verwarren</text><text x="44" y="113" class="ref">Romeinen 7:7–13</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De wet</text><text x="68" y="241" class="body">Maakt de zonde en begeerte kenbaar.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De zonde</text><text x="68" y="390" class="body">Grijpt door het gebod haar kans en</text><text x="68" y="433" class="body">misleidt.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het gebod</text><text x="68" y="582" class="body">Blijft heilig, rechtvaardig en goed.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De oorzaak van de dood</text><text x="68" y="731" class="body">Paulus noemt de zonde, die het goede</text><text x="68" y="774" class="body">misbruikt.</text><text x="46" y="867" class="note">Paulus beantwoordt uitdrukkelijk de vraag of de</text><text x="46" y="903" class="note">wet zelf zonde is.</text></svg>