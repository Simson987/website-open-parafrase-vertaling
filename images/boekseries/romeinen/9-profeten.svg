<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Hosea en Jesaja in het betoog</title><desc id="desc">Hosea en Jesaja in het betoog met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hosea en Jesaja in het betoog</text><text x="44" y="113" class="ref">Romeinen 9:25–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hosea · vers 25–26</text><text x="68" y="241" class="body">Niet-mijn-volk wordt mijn volk en</text><text x="68" y="284" class="body">geliefd genoemd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jesaja · vers 27</text><text x="68" y="433" class="body">Ook bij talrijk Israël wordt de geredde</text><text x="68" y="476" class="body">rest genoemd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jesaja · vers 28–29</text><text x="68" y="625" class="body">De Heere voert Zijn woord uit en laat</text><text x="68" y="668" class="body">nageslacht over.</text><text x="46" y="761" class="note">Dit zijn aangehaalde profetenwoorden binnen</text><text x="46" y="797" class="note">Paulus’ redenering.</text></svg>