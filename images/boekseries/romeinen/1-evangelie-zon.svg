<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Over wie gaat het evangelie?</title><desc id="desc">Over wie gaat het evangelie? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Over wie gaat het evangelie?</text><text x="44" y="113" class="ref">Romeinen 1:1–7</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beloofd</text><text x="68" y="241" class="body">Vooraf aangekondigd door de profeten in</text><text x="68" y="284" class="body">de Schriften.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De Zoon</text><text x="68" y="433" class="body">Als mens uit Davids nageslacht.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Jezus Christus</text><text x="68" y="582" class="body">Door opstanding met kracht als Gods</text><text x="68" y="625" class="body">Zoon aangewezen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Roeping</text><text x="68" y="774" class="body">Genade en apostelschap voor geloof</text><text x="68" y="817" class="body">onder alle volken.</text><text x="46" y="910" class="note">Dit ordent Paulus’ openingswoorden; geen nieuwe</text><text x="46" y="946" class="note">gebeurtenis toegevoegd.</text></svg>