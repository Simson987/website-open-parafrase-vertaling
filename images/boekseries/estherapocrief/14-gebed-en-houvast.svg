<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Esthers gebed en houvast</title><desc id="desc">Esthers gebed en houvast met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Esthers gebed en houvast</text><text x="44" y="113" class="ref">Esther (apocrief) 14:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De nood · 1–4</text><text x="68" y="241" class="body">Pracht afleggen, rouw aannemen en</text><text x="68" y="284" class="body">alleen bij God hulp zoeken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De herinnering · 5–10</text><text x="68" y="433" class="body">Verkiezing, belijdenis en de dreiging</text><text x="68" y="476" class="body">tegen volk en eredienst.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De bede · 11–14</text><text x="68" y="625" class="body">Kracht, juiste woorden tegenover de</text><text x="68" y="668" class="body">leeuw en verandering van het vijandige</text><text x="68" y="711" class="body">plan.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De trouw · 15–19</text><text x="68" y="860" class="body">Haar innerlijke afstand tot afgodische</text><text x="68" y="903" class="body">eer en de vraag om bevrijding uit</text><text x="68" y="946" class="body">angst.</text><text x="46" y="1039" class="note">De leeuw is een beeld voor de ontzagwekkende</text><text x="46" y="1075" class="note">koning; de tekst verhaalt geen ontmoeting met</text><text x="46" y="1111" class="note">een dier.</text></svg>