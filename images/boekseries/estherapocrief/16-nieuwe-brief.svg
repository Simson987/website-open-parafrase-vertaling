<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">De nieuwe brief</title><desc id="desc">De nieuwe brief met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nieuwe brief</text><text x="44" y="113" class="ref">Esther (apocrief) 16:1–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het beginsel · 1–9</text><text x="68" y="241" class="body">Waarschuwing tegen ondankbaar</text><text x="68" y="284" class="body">machtsmisbruik en oproep tot eerlijk</text><text x="68" y="327" class="body">oordelen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De beschuldigde raadgever · 10–14</text><text x="68" y="476" class="body">De brief wijt de aanslag aan Hamans</text><text x="68" y="519" class="body">bedrog tegen koning, Mordechai, Esther</text><text x="68" y="562" class="body">en haar volk.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De herroeping · 15–20</text><text x="68" y="711" class="body">Joodse wetten worden erkend; Hamans</text><text x="68" y="754" class="body">brieven niet uitvoeren, afschriften</text><text x="68" y="797" class="body">ophangen en hulp bieden.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Het feest en de sanctie · 21–24</text><text x="68" y="946" class="body">Vreugde om redding en een scherpe</text><text x="68" y="989" class="body">strafdreiging voor wie de brief niet</text><text x="68" y="1032" class="body">volgt.</text><text x="46" y="1125" class="note">De passage geeft de stem van de koninklijke</text><text x="46" y="1161" class="note">brief weer, met zijn lof, aanklacht en</text><text x="46" y="1197" class="note">strafdreiging.</text></svg>