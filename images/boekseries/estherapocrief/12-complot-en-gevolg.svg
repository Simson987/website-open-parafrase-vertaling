<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Complot en gevolg</title><desc id="desc">Complot en gevolg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Complot en gevolg</text><text x="44" y="113" class="ref">Esther (apocrief) 12:1–6</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gabatha en Tharra · 1–2</text><text x="68" y="241" class="body">Twee kamerdienaars bewaken het hof;</text><text x="68" y="284" class="body">Mordechai ontdekt hun plan en</text><text x="68" y="327" class="body">waarschuwt.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Onderzoek en kroniek · 3–4</text><text x="68" y="476" class="body">Bekentenis, straf en de vastlegging</text><text x="68" y="519" class="body">door koning en Mordechai.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De beloning · 5</text><text x="68" y="668" class="body">Mordechai krijgt hofdienst en</text><text x="68" y="711" class="body">geschenken.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De wrok · 6</text><text x="68" y="860" class="body">Haman, zoon van Ammedatha uit Buga,</text><text x="68" y="903" class="body">zoekt kwaad tegen Mordechai en zijn</text><text x="68" y="946" class="body">volk.</text><text x="46" y="1039" class="note">Ontdekking, registratie, beloning en tegenstand</text><text x="46" y="1075" class="note">vormen de opeenvolgende stappen.</text></svg>