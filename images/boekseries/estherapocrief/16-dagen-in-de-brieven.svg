<svg xmlns="http://www.w3.org/2000/svg" width="840" height="899" viewBox="0 0 840 899" role="img" aria-labelledby="title desc"><title id="title">De dagen in de twee brieven</title><desc id="desc">De dagen in de twee brieven met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="899" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De dagen in de twee brieven</text><text x="44" y="113" class="ref">Esther (apocrief) 13:6; 16:20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste brief · 13:6</text><text x="68" y="241" class="body">Veertiende dag van de twaalfde maand</text><text x="68" y="284" class="body">Adar: het vijandige bevel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede brief · 16:20</text><text x="68" y="433" class="body">Dertiende dag van de twaalfde maand</text><text x="68" y="476" class="body">Adar: hulp tegen aanvallers.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De uitlegging · 10:13</text><text x="68" y="625" class="body">Veertiende dag van Adar als feestdag</text><text x="68" y="668" class="body">met samenkomst en vreugde.</text><text x="46" y="761" class="note">De plaatselijke tekst noemt verschillende dagen.</text><text x="46" y="797" class="note">Dit overzicht houdt die versgegevens naast</text><text x="46" y="833" class="note">elkaar zonder ze gelijk te trekken.</text></svg>