<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Droom en uitleg</title><desc id="desc">Droom en uitleg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Droom en uitleg</text><text x="44" y="113" class="ref">Esther (apocrief) 10:4–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De kleine bron en rivier · 6</text><text x="68" y="241" class="body">Esther, met wie de koning trouwde en</text><text x="68" y="284" class="body">die hij koningin maakte.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De twee draken · 7</text><text x="68" y="433" class="body">Mordechai en Haman.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De volken · 8</text><text x="68" y="582" class="body">Zij die samenkwamen om de naam van de</text><text x="68" y="625" class="body">Joden uit te wissen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het geredde volk · 9–13</text><text x="68" y="774" class="body">Israël roept en wordt gered; twee loten</text><text x="68" y="817" class="body">en de feestdag op 14 Adar.</text><text x="46" y="910" class="note">Dit zijn Mordechais expliciete verklaringen van</text><text x="46" y="946" class="note">zijn droom; de draken zijn geen letterlijke</text><text x="46" y="982" class="note">mensenlichamen.</text></svg>