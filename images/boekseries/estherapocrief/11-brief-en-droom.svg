<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Brief en droom</title><desc id="desc">Brief en droom met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Brief en droom</text><text x="44" y="113" class="ref">Esther (apocrief) 11:1–10</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het overleveringsbericht · 1</text><text x="68" y="241" class="body">Dositheüs en zijn zoon Ptolemeüs</text><text x="68" y="284" class="body">brengen de Purimbrief; Lysimachus wordt</text><text x="68" y="327" class="body">als vertaler genoemd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De dromer · 2–3</text><text x="68" y="476" class="body">Mordechai, uit Benjamin, woont in Susan</text><text x="68" y="519" class="body">en dient aan het hof.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De nood · 4–7</text><text x="68" y="668" class="body">Draken, rumoer, volken, duisternis en</text><text x="68" y="711" class="body">een bedreigd rechtvaardig volk.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De omkeer · 8–10</text><text x="68" y="860" class="body">Gebed, bron en rivier, licht en zon;</text><text x="68" y="903" class="body">Mordechai ontwaakt en zoekt begrip.</text><text x="46" y="996" class="note">Het bericht over de brief staat in een andere</text><text x="46" y="1032" class="note">tijdlaag dan de daaropvolgende droom.</text></svg>