<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Besluit en smeekgebed</title><desc id="desc">Besluit en smeekgebed met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Besluit en smeekgebed</text><text x="44" y="113" class="ref">Esther (apocrief) 13:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De koninklijke aanspraak · 1–3</text><text x="68" y="241" class="body">Bestuur over 127 provincies en de door</text><text x="68" y="284" class="body">de brief geroemde Haman.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De beschuldiging en het bevel · 4–7</text><text x="68" y="433" class="body">De brief belastert een volk en beveelt</text><text x="68" y="476" class="body">uitroeiing op 14 Adar.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Mordechais gebed · 8–18</text><text x="68" y="625" class="body">Gods macht, de reden van zijn weigering</text><text x="68" y="668" class="body">en het verzoek om redding en vreugde.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het volk · 19</text><text x="68" y="817" class="body">Heel Israël roept uit alle macht tot</text><text x="68" y="860" class="body">God.</text><text x="46" y="953" class="note">De beschuldigingen in de brief zijn de vijandige</text><text x="46" y="989" class="note">beweringen van het bevel, geen oordeel van deze</text><text x="46" y="1025" class="note">leeswijzer.</text></svg>