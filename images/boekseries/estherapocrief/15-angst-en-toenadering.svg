<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Angst en toenadering</title><desc id="desc">Angst en toenadering met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Angst en toenadering</text><text x="44" y="113" class="ref">Esther (apocrief) 15:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De gang · 1–6</text><text x="68" y="241" class="body">Esther verandert van kleding en gaat</text><text x="68" y="284" class="body">met twee dienstmeisjes naar de koning.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De eerste inzinking · 7</text><text x="68" y="433" class="body">Zijn boze blik overweldigt haar; zij</text><text x="68" y="476" class="body">valt flauw.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De toenadering · 8–10</text><text x="68" y="625" class="body">Hij staat op, troost, raakt haar aan</text><text x="68" y="668" class="body">met de scepter en nodigt haar uit te</text><text x="68" y="711" class="body">spreken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het vervolg · 11–14</text><text x="68" y="860" class="body">Zij antwoordt met ontzag, valt opnieuw</text><text x="68" y="903" class="body">flauw en krijgt geruststelling.</text><text x="46" y="996" class="note">Twee inzinkingen worden genoemd. Het optreden</text><text x="46" y="1032" class="note">van de koning verandert tussen beide momenten.</text></svg>