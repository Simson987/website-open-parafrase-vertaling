<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Macht en het ondoorgrondelijke</title><desc id="desc">Samenhang van de besproken onderwerpen met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Macht en het ondoorgrondelijke</text><text x="44" y="113" class="ref">Prediker 8:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Koning en tijd · 1–9</text><text x="68" y="241" class="body">Bevel, eed, macht, passende tijd en de</text><text x="68" y="284" class="body">grens van menselijke adem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onrecht · 10–14</text><text x="68" y="433" class="body">Uitgesteld vonnis en omgekeerde</text><text x="68" y="476" class="body">uitkomsten blijven een raadsel.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vreugde en zoeken · 15–17</text><text x="68" y="625" class="body">Geniet van het gegeven leven; het</text><text x="68" y="668" class="body">geheel van Gods werk blijft</text><text x="68" y="711" class="body">ondoorgrondelijk.</text><text x="46" y="804" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst.</text><text x="46" y="840" class="note">Vergelijkingen, persoonlijke waarnemingen en</text><text x="46" y="876" class="note">raadsels vormen geen reeks nieuwe historische</text><text x="46" y="912" class="note">gebeurtenissen.</text></svg>