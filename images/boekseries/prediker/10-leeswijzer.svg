<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Kleine dwaasheid, grote schade</title><desc id="desc">Samenhang van de besproken onderwerpen met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kleine dwaasheid, grote schade</text><text x="44" y="113" class="ref">Prediker 10:1–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Invloed · 1–7</text><text x="68" y="241" class="body">Vlieg in zalf, kalmte bij woede en</text><text x="68" y="284" class="body">omgekeerde maatschappelijke posities.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vakmanschap · 8–11</text><text x="68" y="433" class="body">Gevaar bij werk; tijdig slijpen en te</text><text x="68" y="476" class="body">laat bezweren.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Woorden en bestuur · 12–20</text><text x="68" y="625" class="body">Woorden wegen, op tijd eten, een</text><text x="68" y="668" class="body">lekkend dak en een vogel die geluid</text><text x="68" y="711" class="body">meeneemt.</text><text x="46" y="804" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst.</text><text x="46" y="840" class="note">Vergelijkingen, persoonlijke waarnemingen en</text><text x="46" y="876" class="note">raadsels vormen geen reeks nieuwe historische</text><text x="46" y="912" class="note">gebeurtenissen.</text></svg>