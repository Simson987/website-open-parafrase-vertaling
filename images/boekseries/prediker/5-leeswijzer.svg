<svg xmlns="http://www.w3.org/2000/svg" width="840" height="978" viewBox="0 0 840 978" role="img" aria-labelledby="title desc"><title id="title">Weinig woorden, genoeg vreugde</title><desc id="desc">Samenhang van de besproken onderwerpen met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="978" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Weinig woorden, genoeg vreugde</text><text x="44" y="113" class="ref">Prediker 5:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Woorden · 1–6</text><text x="68" y="241" class="body">Niet overhaast spreken; een belofte</text><text x="68" y="284" class="body">nakomen en ontzag hebben.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Macht en bezit · 7–16</text><text x="68" y="433" class="body">Onderdrukking, geldhonger,</text><text x="68" y="476" class="body">slapeloosheid, verlies en niets</text><text x="68" y="519" class="body">meenemen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het gegeven deel · 17–19</text><text x="68" y="668" class="body">Eten, drinken en genieten van het werk</text><text x="68" y="711" class="body">en het leven dat gegeven is.</text><text x="46" y="804" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst.</text><text x="46" y="840" class="note">Vergelijkingen, persoonlijke waarnemingen en</text><text x="46" y="876" class="note">raadsels vormen geen reeks nieuwe historische</text><text x="46" y="912" class="note">gebeurtenissen.</text></svg>