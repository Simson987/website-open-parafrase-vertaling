<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1170" viewBox="0 0 840 1170" role="img" aria-labelledby="title desc"><title id="title">Gedenken en het slotwoord</title><desc id="desc">Samenhang van de besproken onderwerpen met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1170" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gedenken en het slotwoord</text><text x="44" y="113" class="ref">Prediker 12:1–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jeugd en ouderdom · 1–5</text><text x="68" y="241" class="body">Denk aan de Schepper vóór de moeilijke</text><text x="68" y="284" class="body">dagen; huis, stemmen, boom en weg zijn</text><text x="68" y="327" class="body">poëtische beelden.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Breekbaarheid · 6–8</text><text x="68" y="476" class="body">Koord, schaal, kruik en rad; stof keert</text><text x="68" y="519" class="body">terug en geest gaat naar God.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Onderricht · 9–12</text><text x="68" y="668" class="body">Onderzoeken, spreuken ordenen, waarheid</text><text x="68" y="711" class="body">en de grens van veel boeken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Slot · 13–14</text><text x="68" y="860" class="body">Ontzag, geboden en beoordeling van elk</text><text x="68" y="903" class="body">werk, ook het verborgen werk.</text><text x="46" y="996" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst.</text><text x="46" y="1032" class="note">Vergelijkingen, persoonlijke waarnemingen en</text><text x="46" y="1068" class="note">raadsels vormen geen reeks nieuwe historische</text><text x="46" y="1104" class="note">gebeurtenissen.</text></svg>