<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Wijsheid met grenzen</title><desc id="desc">Samenhang van de besproken onderwerpen met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijsheid met grenzen</text><text x="44" y="113" class="ref">Prediker 7:1–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beter en geduldig · 1–14</text><text x="68" y="241" class="body">Rouw, terechtwijzing, omkoping, geduld</text><text x="68" y="284" class="body">en goede en slechte dagen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Niet onaantastbaar · 15–22</text><text x="68" y="433" class="body">Onverwachte uitkomsten; geen mens doet</text><text x="68" y="476" class="body">altijd goed; eigen woorden erkennen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Zoeken · 23–29</text><text x="68" y="625" class="body">Wijsheid blijft ver; de valstrik en de</text><text x="68" y="668" class="body">moeizame persoonlijke zoektocht.</text><text x="46" y="761" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst.</text><text x="46" y="797" class="note">Vergelijkingen, persoonlijke waarnemingen en</text><text x="46" y="833" class="note">raadsels vormen geen reeks nieuwe historische</text><text x="46" y="869" class="note">gebeurtenissen.</text></svg>