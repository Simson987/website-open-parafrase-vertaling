<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Hebben en kunnen genieten</title><desc id="desc">Samenhang van de besproken onderwerpen met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hebben en kunnen genieten</text><text x="44" y="113" class="ref">Prediker 6:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het pijnlijke verschil · 1–6</text><text x="68" y="241" class="body">Bezit en een lang leven waarborgen geen</text><text x="68" y="284" class="body">genieten of rust.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verlangen · 7–9</text><text x="68" y="433" class="body">Zwoegen voor de mond; verlangen raakt</text><text x="68" y="476" class="body">niet vervuld.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Grenzen · 10–12</text><text x="68" y="625" class="body">Veel woorden, een leven als schaduw en</text><text x="68" y="668" class="body">een onbekende toekomst.</text><text x="46" y="761" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst.</text><text x="46" y="797" class="note">Vergelijkingen, persoonlijke waarnemingen en</text><text x="46" y="833" class="note">raadsels vormen geen reeks nieuwe historische</text><text x="46" y="869" class="note">gebeurtenissen.</text></svg>