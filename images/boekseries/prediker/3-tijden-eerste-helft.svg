<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Veertien tijdparen · 1</title><desc id="desc">De eerste acht tijdparen, letterlijk gecontroleerd tegen de plaatselijke tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Veertien tijdparen · 1</text><text x="44" y="113" class="ref">Prediker 3:2–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 2</text><text x="68" y="241" class="body">Geboren worden ↔ sterven; planten ↔</text><text x="68" y="284" class="body">oogsten.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 3</text><text x="68" y="433" class="body">Doden ↔ genezen; afbreken ↔ opbouwen.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vers 4</text><text x="68" y="582" class="body">Huilen ↔ lachen; rouwen ↔ dansen.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Vers 5</text><text x="68" y="731" class="body">Stenen weggooien ↔ verzamelen; omhelzen</text><text x="68" y="774" class="body">↔ niet omhelzen.</text><text x="46" y="867" class="note">Eerste acht paren van de veertien. De woorden</text><text x="46" y="903" class="note">benoemen de uiteenlopende tijden; ze zijn geen</text><text x="46" y="939" class="note">opdracht om elke handeling uit te voeren.</text></svg>