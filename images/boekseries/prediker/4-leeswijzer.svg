<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Macht, rust en samenzijn</title><desc id="desc">Samenhang van de besproken onderwerpen met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Macht, rust en samenzijn</text><text x="44" y="113" class="ref">Prediker 4:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onderdrukking · 1–3</text><text x="68" y="241" class="body">Tranen zonder trooster; de macht ligt</text><text x="68" y="284" class="body">bij de onderdrukkers.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Werk · 4–8</text><text x="68" y="433" class="body">Afgunst, de gevouwen hand, een hand vol</text><text x="68" y="476" class="body">rust en alleen zwoegen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Samen · 9–12</text><text x="68" y="625" class="body">Werk, overeind helpen, warmte en samen</text><text x="68" y="668" class="body">standhouden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Macht en luisteren · 13–17</text><text x="68" y="817" class="body">Wijze jongen, dwaze koning, wisselende</text><text x="68" y="860" class="body">aanhang en luisteren in Gods huis.</text><text x="46" y="953" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst.</text><text x="46" y="989" class="note">Vergelijkingen, persoonlijke waarnemingen en</text><text x="46" y="1025" class="note">raadsels vormen geen reeks nieuwe historische</text><text x="46" y="1061" class="note">gebeurtenissen.</text></svg>