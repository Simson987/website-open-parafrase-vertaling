<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1127" viewBox="0 0 840 1127" role="img" aria-labelledby="title desc"><title id="title">Leven, toeval en wijsheid</title><desc id="desc">Samenhang van de besproken onderwerpen met gecontroleerde versgroepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1127" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leven, toeval en wijsheid</text><text x="44" y="113" class="ref">Prediker 9:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sterfelijkheid · 1–6</text><text x="68" y="241" class="body">Iedereen sterft; onder de levenden is</text><text x="68" y="284" class="body">nog hoop.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het gegeven leven · 7–10</text><text x="68" y="433" class="body">Brood, wijn, kleding, liefde en werken</text><text x="68" y="476" class="body">met kracht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Geen garantie · 11–12</text><text x="68" y="625" class="body">Snelheid, kracht en kunde verzekeren de</text><text x="68" y="668" class="body">uitkomst niet.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Voorbeeldverhaal · 13–18</text><text x="68" y="817" class="body">Een arme wijze redt een kleine stad en</text><text x="68" y="860" class="body">wordt vergeten; wijsheid boven wapens.</text><text x="46" y="953" class="note">Leeswijzer bij de plaatselijke hoofdstuktekst.</text><text x="46" y="989" class="note">Vergelijkingen, persoonlijke waarnemingen en</text><text x="46" y="1025" class="note">raadsels vormen geen reeks nieuwe historische</text><text x="46" y="1061" class="note">gebeurtenissen.</text></svg>