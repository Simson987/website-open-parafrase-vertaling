<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1041" viewBox="0 0 840 1041" role="img" aria-labelledby="title desc"><title id="title">Veertien tijdparen · 2</title><desc id="desc">De laatste zes tijdparen en hun hoofdstukcontext.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1041" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Veertien tijdparen · 2</text><text x="44" y="113" class="ref">Prediker 3:6–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 6</text><text x="68" y="241" class="body">Zoeken ↔ verliezen; bewaren ↔</text><text x="68" y="284" class="body">weggooien.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 7</text><text x="68" y="433" class="body">Scheuren ↔ naaien; zwijgen ↔ spreken.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vers 8</text><text x="68" y="582" class="body">Liefhebben ↔ haten; oorlog ↔ vrede.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Vervolg · 9–22</text><text x="68" y="731" class="body">Werk en vreugde als gave; onrecht,</text><text x="68" y="774" class="body">oordeel en het terugkeren tot stof.</text><text x="46" y="867" class="note">Laatste zes paren van de veertien. Samen met het</text><text x="46" y="903" class="note">eerste schema telt de lijst acht plus zes paren.</text><text x="46" y="939" class="note">Het vervolg reflecteert op werk, tijd en</text><text x="46" y="975" class="note">sterfelijkheid.</text></svg>