<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Woord, waarheid en vrijheid</title><desc id="desc">Woord, waarheid en vrijheid met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Woord, waarheid en vrijheid</text><text x="44" y="113" class="ref">Johannes 8:31–47</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Blijven · 31–32</text><text x="68" y="241" class="body">Blijven in Jezus’ woord; werkelijk</text><text x="68" y="284" class="body">leerling, waarheid kennen en</text><text x="68" y="327" class="body">vrijgemaakt.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bezwaarmakers · 33–38</text><text x="68" y="476" class="body">Afkomst Abraham; Jezus spreekt over</text><text x="68" y="519" class="body">slavernij aan zonde en vrijheid door</text><text x="68" y="562" class="body">Zoon.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Daden en luisteren · 39–47</text><text x="68" y="711" class="body">Kinderen doen vaders werken; waarheid</text><text x="68" y="754" class="body">en liefde tegenover leugen en</text><text x="68" y="797" class="body">doodsplan.</text><text x="46" y="890" class="note">Dit is het weergegeven gesprek over woord en</text><text x="46" y="926" class="note">daden, geen indeling van hedendaagse</text><text x="46" y="962" class="note">bevolkingsgroepen.</text></svg>