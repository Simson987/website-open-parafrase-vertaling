<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De twee avonden onderscheiden</title><desc id="desc">De twee avonden onderscheiden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee avonden onderscheiden</text><text x="44" y="113" class="ref">Johannes 20:19–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste avond · 19–23</text><text x="68" y="241" class="body">De deuren zijn gesloten; Jezus komt in</text><text x="68" y="284" class="body">hun midden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tomas ontbreekt · 24–25</text><text x="68" y="433" class="body">Hij hoort later het bericht en verlangt</text><text x="68" y="476" class="body">bewijs.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Acht dagen later · 26–28</text><text x="68" y="625" class="body">Tomas is erbij en belijdt: mijn Heere</text><text x="68" y="668" class="body">en mijn God.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Jezus’ woord · 29</text><text x="68" y="817" class="body">Gelukkig wie niet gezien hebben en toch</text><text x="68" y="860" class="body">geloven.</text><text x="46" y="953" class="note">De eerste avond en de ontmoeting met Tomas zijn</text><text x="46" y="989" class="note">geen gelijktijdige scène.</text></svg>