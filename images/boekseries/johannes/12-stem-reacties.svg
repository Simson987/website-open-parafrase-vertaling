<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Een stem en twee reacties</title><desc id="desc">Een stem en twee reacties met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een stem en twee reacties</text><text x="44" y="113" class="ref">Johannes 12:28–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De stem</text><text x="68" y="241" class="body">De naam is verheerlijkt en zal weer</text><text x="68" y="284" class="body">verheerlijkt worden.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sommigen in de menigte</text><text x="68" y="433" class="body">Zij denken dat het gedonderd heeft.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Anderen</text><text x="68" y="582" class="body">Zij denken dat een engel gesproken</text><text x="68" y="625" class="body">heeft.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Jezus’ uitleg</text><text x="68" y="774" class="body">De stem is omwille van de toehoorders</text><text x="68" y="817" class="body">gekomen.</text><text x="46" y="910" class="note">Reacties van de menigte zijn geen vaststelling</text><text x="46" y="946" class="note">dat er een engel zichtbaar was.</text></svg>