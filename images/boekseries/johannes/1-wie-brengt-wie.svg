<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962" role="img" aria-labelledby="title desc"><title id="title">Wie brengt wie bij Jezus?</title><desc id="desc">Wie brengt wie bij Jezus? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="962" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie brengt wie bij Jezus?</text><text x="44" y="113" class="ref">Johannes 1:35–50</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Johannes → twee</text><text x="68" y="241" class="body">Wijst Jezus als Lam aan; twee volgen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Andreas → Simon</text><text x="68" y="390" class="body">Vindt broer en brengt hem; Simon krijgt</text><text x="68" y="433" class="body">naam Cefas/Petrus.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Jezus → Filippus</text><text x="68" y="582" class="body">Volg mij; Filippus uit Bethsaïda.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Filippus → Nathanaël</text><text x="68" y="731" class="body">Kom kijken; vijgenboom en belijdenis.</text><text x="46" y="824" class="note">Pijlen zijn uitnodiging of aanwijzing, geen</text><text x="46" y="860" class="note">afstamming. Tweede eerste leerling krijgt hier</text><text x="46" y="896" class="note">geen naam.</text></svg>