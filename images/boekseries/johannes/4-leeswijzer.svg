<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Levend water en het levende kind</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levend water en het levende kind</text><text x="44" y="113" class="ref">Johannes 4:1–54</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij de bron · 1–26</text><text x="68" y="241" class="body">Judea via Samaria, Sichar/Jakobsbron;</text><text x="68" y="284" class="body">dorst en water, levenswaarheid,</text><text x="68" y="327" class="body">aanbidden in geest/waarheid, Messias.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Stad en oogst · 27–42</text><text x="68" y="476" class="body">Kruik achter, kom kijken; voedsel/werk</text><text x="68" y="519" class="body">en oogst, twee dagen, zelf horen en</text><text x="68" y="562" class="body">Redder van wereld.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Galilea · 43–54</text><text x="68" y="711" class="body">Kana, ambtenaar en zoon Kapernaüm;</text><text x="68" y="754" class="body">woord geloven, bericht onderweg en</text><text x="68" y="797" class="body">juiste uur; tweede teken.</text><text x="46" y="890" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="926" class="note">de plaatselijke versindeling.</text></svg>