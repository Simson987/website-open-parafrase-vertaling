<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Kana en de tempel</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kana en de tempel</text><text x="44" y="113" class="ref">Johannes 2:1–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kana · 1–11</text><text x="68" y="241" class="body">Bruiloft, wijn op, zes stenen vaten;</text><text x="68" y="284" class="body">vullen en proeven, eerste teken en</text><text x="68" y="327" class="body">geloof.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Reis en tempel · 12–22</text><text x="68" y="476" class="body">Kapernaüm, Pascha/Jeruzalem; verkopers</text><text x="68" y="519" class="body">weg, tekenvraag en drie dagen als Zijn</text><text x="68" y="562" class="body">lichaam.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Mensen · 23–25</text><text x="68" y="711" class="body">Tekenen en geloof in naam; Jezus kent</text><text x="68" y="754" class="body">wat in mensen omgaat.</text><text x="46" y="847" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="883" class="note">de plaatselijke versindeling.</text></svg>