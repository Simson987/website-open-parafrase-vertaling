<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">Wie getuigen van Jezus?</title><desc id="desc">Wie getuigen van Jezus? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie getuigen van Jezus?</text><text x="44" y="113" class="ref">Johannes 15:26–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De Trooster</text><text x="68" y="241" class="body">De Geest van de waarheid komt van de</text><text x="68" y="284" class="body">Vader.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jezus zendt Hem</text><text x="68" y="433" class="body">De Geest zal van Jezus getuigen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De leerlingen</text><text x="68" y="582" class="body">Zij getuigen ook: zij waren vanaf het</text><text x="68" y="625" class="body">begin bij Hem.</text><text x="46" y="718" class="note">De twee getuigenissen worden in de tekst</text><text x="46" y="754" class="note">onderscheiden.</text></svg>