<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Wat Jezus wel en niet zei</title><desc id="desc">Wat Jezus wel en niet zei met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Jezus wel en niet zei</text><text x="44" y="113" class="ref">Johannes 21:20–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Petrus vraagt</text><text x="68" y="241" class="body">Wat zal er met de andere leerling</text><text x="68" y="284" class="body">gebeuren?</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jezus antwoordt</text><text x="68" y="433" class="body">Als Ik wil dat hij blijft tot Ik kom,</text><text x="68" y="476" class="body">wat gaat jou dat aan?</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het gerucht</text><text x="68" y="625" class="body">Er werd gezegd dat die leerling niet</text><text x="68" y="668" class="body">zou sterven.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De verteller corrigeert</text><text x="68" y="817" class="body">Jezus had niet gezegd dat hij niet zou</text><text x="68" y="860" class="body">sterven.</text><text x="46" y="953" class="note">De voorwaardelijke uitspraak is geen belofte van</text><text x="46" y="989" class="note">onsterfelijkheid.</text></svg>