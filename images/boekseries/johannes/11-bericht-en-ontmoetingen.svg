<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Bericht, aankomst en ontmoetingen</title><desc id="desc">Bericht, aankomst en ontmoetingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bericht, aankomst en ontmoetingen</text><text x="44" y="113" class="ref">Johannes 11:3–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bericht · 3–16</text><text x="68" y="241" class="body">Ziek; nog twee dagen blijven; reis</text><text x="68" y="284" class="body">Judea en dood verklaard.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aankomst · 17–27</text><text x="68" y="433" class="body">Lazarus vier dagen graf; Marta tegemoet</text><text x="68" y="476" class="body">en belijdenis over opstanding/leven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Maria · 28–37</text><text x="68" y="625" class="body">Marta roept stil, Maria gaat en valt</text><text x="68" y="668" class="body">neer; Jezus bewogen en huilt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Graf · 38–44</text><text x="68" y="817" class="body">Steen weg, danken, roepen; gebonden</text><text x="68" y="860" class="body">naar buiten en losmaken.</text><text x="46" y="953" class="note">Twee dagen uitstel en vier dagen in graf blijven</text><text x="46" y="989" class="note">verschillende tijdsaanduidingen.</text></svg>