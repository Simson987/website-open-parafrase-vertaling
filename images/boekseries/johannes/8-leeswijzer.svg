<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1227" viewBox="0 0 840 1227" role="img" aria-labelledby="title desc"><title id="title">Licht, waarheid en vrijheid</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1227" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Licht, waarheid en vrijheid</text><text x="44" y="113" class="ref">Johannes 8:1–59</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vrouw · 1–11</text><text x="68" y="241" class="body">Vroeg tempel, aanklacht en schrijven;</text><text x="68" y="284" class="body">zonder zonde, beschuldigers weg, ga en</text><text x="68" y="327" class="body">zondig niet.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Getuigen · 12–30</text><text x="68" y="476" class="body">Licht van wereld, Jezus en Vader;</text><text x="68" y="519" class="body">oorsprong, vertrek en verhoogde</text><text x="68" y="562" class="body">Mensenzoon; velen geloven.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Blijven en vrijheid · 31–47</text><text x="68" y="711" class="body">Woord, waarheid en vrijmaken; Abraham,</text><text x="68" y="754" class="body">werken en leugen tegenover Gods</text><text x="68" y="797" class="body">woorden.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Abraham en vertrek · 48–59</text><text x="68" y="946" class="body">Eer, woord bewaren en leven; vóór</text><text x="68" y="989" class="body">Abraham ben ik; stenen en tempel</text><text x="68" y="1032" class="body">verlaten.</text><text x="46" y="1125" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1161" class="note">de plaatselijke versindeling.</text></svg>