<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Voor wie bidt Jezus?</title><desc id="desc">Voor wie bidt Jezus? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voor wie bidt Jezus?</text><text x="44" y="113" class="ref">Johannes 17:1–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De Zoon · 1–5</text><text x="68" y="241" class="body">Verheerlijk Uw Zoon, zodat Hij U</text><text x="68" y="284" class="body">verheerlijkt.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De gegeven leerlingen · 6–19</text><text x="68" y="433" class="body">Bewaar hen, bescherm hen en heilig hen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Wie later geloven · 20–23</text><text x="68" y="582" class="body">Ook voor wie door hun woord in Hem</text><text x="68" y="625" class="body">geloven.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het slot · 24–26</text><text x="68" y="774" class="body">Bij Hem zijn, liefde en bekendmaking</text><text x="68" y="817" class="body">van de naam.</text><text x="46" y="910" class="note">De bestaande gebedsscènes blijven; deze indeling</text><text x="46" y="946" class="note">volgt de gebedswoorden.</text></svg>