<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Drie vragen aan Petrus</title><desc id="desc">Drie vragen aan Petrus met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie vragen aan Petrus</text><text x="44" y="113" class="ref">Johannes 21:15–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste vraag · vers 15</text><text x="68" y="241" class="body">Petrus belijdt liefde: geef mijn</text><text x="68" y="284" class="body">lammeren te eten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede vraag · vers 16</text><text x="68" y="433" class="body">Petrus belijdt liefde: zorg voor mijn</text><text x="68" y="476" class="body">schapen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Derde vraag · vers 17</text><text x="68" y="625" class="body">Petrus is verdrietig: geef mijn schapen</text><text x="68" y="668" class="body">te eten.</text><text x="46" y="761" class="note">De drie formuleringen volgen de plaatselijke</text><text x="46" y="797" class="note">vertaling.</text></svg>