<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Het opschrift bij het kruis</title><desc id="desc">Het opschrift bij het kruis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het opschrift bij het kruis</text><text x="44" y="113" class="ref">Johannes 19:19–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De inhoud</text><text x="68" y="241" class="body">Jezus uit Nazareth, de Koning van de</text><text x="68" y="284" class="body">Joden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Drie talen</text><text x="68" y="433" class="body">Hebreeuws, Grieks en Latijn volgens</text><text x="68" y="476" class="body">deze tekst.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het bezwaar</text><text x="68" y="625" class="body">De overpriesters vragen om een andere</text><text x="68" y="668" class="body">formulering.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Pilatus’ antwoord</text><text x="68" y="817" class="body">Wat hij geschreven heeft, heeft hij</text><text x="68" y="860" class="body">geschreven.</text><text x="46" y="953" class="note">Nederlandse inhoudsweergave; geen</text><text x="46" y="989" class="note">ongecontroleerde oude lettertekens.</text></svg>