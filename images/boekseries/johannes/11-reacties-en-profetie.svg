<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Reacties en Kajafas’ woorden</title><desc id="desc">Reacties en Kajafas’ woorden met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reacties en Kajafas’ woorden</text><text x="44" y="113" class="ref">Johannes 11:45–57</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Getuigen · 45–48</text><text x="68" y="241" class="body">Velen geloven; anderen naar Farizeeën,</text><text x="68" y="284" class="body">raad vreest Romeinen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kajafas · 49–52</text><text x="68" y="433" class="body">Eén voor volk; verteller duidt</text><text x="68" y="476" class="body">profetie: Jezus voor volk en</text><text x="68" y="519" class="body">verstrooide kinderen bijeen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Vervolg · 53–57</text><text x="68" y="668" class="body">Doodsberaad, Efraïm en naderend Pascha;</text><text x="68" y="711" class="body">wie plaats weet moet melden.</text><text x="46" y="804" class="note">Vrees voor Romeinen is het argument van de raad;</text><text x="46" y="840" class="note">de profetische uitleg komt van de verteller.</text></svg>