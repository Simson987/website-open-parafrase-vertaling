<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">De wijnstok en de ranken</title><desc id="desc">De wijnstok en de ranken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De wijnstok en de ranken</text><text x="44" y="113" class="ref">Johannes 15:1–8</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De Vader</text><text x="68" y="241" class="body">De wijnbouwer.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Jezus</text><text x="68" y="390" class="body">De ware wijnstok.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">De leerlingen</text><text x="68" y="539" class="body">De ranken: blijf in Hem om vrucht te</text><text x="68" y="582" class="body">dragen.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Snoeien en vrucht</text><text x="68" y="731" class="body">Vruchtdragende ranken worden gereinigd.</text><text x="46" y="824" class="note">Beeldspraak over verbondenheid; geen</text><text x="46" y="860" class="note">afzonderlijke historische gebeurtenis.</text></svg>