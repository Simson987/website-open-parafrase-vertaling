<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">De verschillende reacties</title><desc id="desc">De verschillende reacties met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De verschillende reacties</text><text x="44" y="113" class="ref">Johannes 7:37–52</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Uitnodiging · 37–39</text><text x="68" y="241" class="body">Dorst: komen en drinken; water betekent</text><text x="68" y="284" class="body">de Geest, nog niet gegeven vóór</text><text x="68" y="327" class="body">verheerlijking.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Menigte · 40–44</text><text x="68" y="476" class="body">Profeet, Christus, vragen</text><text x="68" y="519" class="body">Galilea/Bethlehem; verdeeld en niet</text><text x="68" y="562" class="body">gegrepen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Dienaren · 45–49</text><text x="68" y="711" class="body">Nooit zo gesproken; leiders verwijten</text><text x="68" y="754" class="body">misleiding.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Nicodemus · 50–52</text><text x="68" y="903" class="body">Eerst horen en onderzoeken; anderen</text><text x="68" y="946" class="body">wijzen op Galilea.</text><text x="46" y="1039" class="note">Uitspraken van gesprekspartners blijven</text><text x="46" y="1075" class="note">onderscheiden van vertellersuitleg.</text></svg>