<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Feest, vragen en levend water</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Feest, vragen en levend water</text><text x="44" y="113" class="ref">Johannes 7:1–53</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Reis · 1–13</text><text x="68" y="241" class="body">Broers, nog niet mijn tijd; later</text><text x="68" y="284" class="body">heimelijk, menigte discussieert maar is</text><text x="68" y="327" class="body">bang.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Onderwijs · 14–36</text><text x="68" y="476" class="body">Leer van Gezondene, rechtvaardig</text><text x="68" y="519" class="body">oordelen; afkomst, grijpen lukt niet,</text><text x="68" y="562" class="body">dienaren en vertrekwoord.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Laatste dag · 37–53</text><text x="68" y="711" class="body">Dorst, water als Geest; verdeeldheid,</text><text x="68" y="754" class="body">dienaren keren terug, Nicodemus vraagt</text><text x="68" y="797" class="body">eerst horen, ieder naar huis.</text><text x="46" y="890" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="926" class="note">de plaatselijke versindeling.</text></svg>