<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Woord, bericht en hetzelfde uur</title><desc id="desc">Woord, bericht en hetzelfde uur met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Woord, bericht en hetzelfde uur</text><text x="44" y="113" class="ref">Johannes 4:46–54</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vraag · 46–50</text><text x="68" y="241" class="body">Zoon Kapernaüm, vader naar Jezus in</text><text x="68" y="284" class="body">Kana; ga, je zoon leeft; vader gelooft</text><text x="68" y="327" class="body">en vertrekt.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Onderweg · 51–52</text><text x="68" y="476" class="body">Dienaren: kind leeft; koorts gisteren</text><text x="68" y="519" class="body">op zevende uur verdwenen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Herkenning · 53–54</text><text x="68" y="668" class="body">Zelfde uur als Jezus’ woord; vader en</text><text x="68" y="711" class="body">huis geloven; tweede teken.</text><text x="46" y="804" class="note">Oude dagtelling behouden; geen moderne tijd op</text><text x="46" y="840" class="note">de klok vastgelegd.</text></svg>