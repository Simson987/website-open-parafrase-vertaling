<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Genezing, leven en getuigen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Genezing, leven en getuigen</text><text x="44" y="113" class="ref">Johannes 5:1–47</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bethesda · 1–18</text><text x="68" y="241" class="body">Vijf gangen, man 38 jaar ziek, mat en</text><text x="68" y="284" class="body">sabbat; tempelontmoeting en Vader</text><text x="68" y="327" class="body">werkt.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vader en Zoon · 19–30</text><text x="68" y="476" class="body">Werken, levend maken en oordeel;</text><text x="68" y="519" class="body">horen/vertrouwen, opstanding en</text><text x="68" y="562" class="body">rechtvaardig oordeel.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Getuigen · 31–47</text><text x="68" y="711" class="body">Johannes, werken, Vader en Schriften;</text><text x="68" y="754" class="body">Mozes en weigering naar Jezus te komen.</text><text x="46" y="847" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="883" class="note">de plaatselijke versindeling.</text></svg>