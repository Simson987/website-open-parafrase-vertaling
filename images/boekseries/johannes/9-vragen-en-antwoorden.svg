<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Wie vraagt, wie antwoordt?</title><desc id="desc">Wie vraagt, wie antwoordt? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie vraagt, wie antwoordt?</text><text x="44" y="113" class="ref">Johannes 9:8–38</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Buren · 8–12</text><text x="68" y="241" class="body">Herkenning, hoe en waar; man vertelt</text><text x="68" y="284" class="body">van Jezus en wassen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Leiders en ouders · 13–23</text><text x="68" y="433" class="body">Sabbat, identiteit en afkomst blind;</text><text x="68" y="476" class="body">ouders bevestigen zoon maar verwijzen</text><text x="68" y="519" class="body">vraag naar hem.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Man opnieuw · 24–34</text><text x="68" y="668" class="body">Eén ding weet hij: blind geweest en nu</text><text x="68" y="711" class="body">zien; verhoor en buitengezet.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Jezus · 35–38</text><text x="68" y="860" class="body">Zoekt hem, vraagt geloof; man belijdt</text><text x="68" y="903" class="body">en aanbidt.</text><text x="46" y="996" class="note">Uitspraken van de ondervragers zijn niet de</text><text x="46" y="1032" class="note">verklaring van de verteller.</text></svg>