<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Aantallen en antwoord</title><desc id="desc">Aantallen en antwoord met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aantallen en antwoord</text><text x="44" y="113" class="ref">Johannes 6:5–15 en 60–71</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vooraf · 5–9</text><text x="68" y="241" class="body">Tweehonderd penningen onvoldoende;</text><text x="68" y="284" class="body">jongen heeft vijf gerstebroden en twee</text><text x="68" y="327" class="body">visjes.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Maaltijd · 10–13</text><text x="68" y="476" class="body">Ongeveer vijfduizend mannen, allen</text><text x="68" y="519" class="body">genoeg en twaalf manden over.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Later · 60–71</text><text x="68" y="668" class="body">Velen trekken terug; twaalf gevraagd;</text><text x="68" y="711" class="body">Petrus belijdt en Judas aangekondigd.</text><text x="46" y="804" class="note">Voedselvermenigvuldiging en broodonderwijs</text><text x="46" y="840" class="note">blijven verbonden; geen letterlijk eten van</text><text x="46" y="876" class="note">lichaamsdelen getekend.</text></svg>