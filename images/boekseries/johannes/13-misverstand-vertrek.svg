<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">Waarom gaat Judas weg?</title><desc id="desc">Waarom gaat Judas weg? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarom gaat Judas weg?</text><text x="44" y="113" class="ref">Johannes 13:26–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat Jezus doet</text><text x="68" y="241" class="body">Hij geeft Judas het ingedoopte stuk</text><text x="68" y="284" class="body">brood.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wat sommigen denken</text><text x="68" y="433" class="body">Inkopen voor het feest of iets aan de</text><text x="68" y="476" class="body">armen geven.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Wat de vertelling meldt</text><text x="68" y="625" class="body">Judas gaat meteen weg; het is nacht.</text><text x="46" y="718" class="note">Het onderscheid tussen het vertelde en de</text><text x="46" y="754" class="note">vermoedens blijft zichtbaar.</text></svg>