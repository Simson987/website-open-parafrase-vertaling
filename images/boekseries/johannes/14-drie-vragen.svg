<svg xmlns="http://www.w3.org/2000/svg" width="840" height="777" viewBox="0 0 840 777" role="img" aria-labelledby="title desc"><title id="title">Drie leerlingen vragen verder</title><desc id="desc">Drie leerlingen vragen verder met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="777" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie leerlingen vragen verder</text><text x="44" y="113" class="ref">Johannes 14:5–24</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tomas · vers 5</text><text x="68" y="241" class="body">Hoe kunnen wij de weg weten?</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Filippus · vers 8</text><text x="68" y="390" class="body">Laat ons de Vader zien.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Judas · vers 22</text><text x="68" y="539" class="body">Niet Iskariot: waarom aan ons en niet</text><text x="68" y="582" class="body">de wereld?</text><text x="46" y="675" class="note">De derde vraag komt van Judas die niet Iskariot</text><text x="46" y="711" class="note">is.</text></svg>