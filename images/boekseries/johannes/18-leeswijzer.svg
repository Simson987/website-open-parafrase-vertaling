<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Tuin, binnenplaats en rechtbank</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tuin, binnenplaats en rechtbank</text><text x="44" y="113" class="ref">Johannes 18:1–40</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–12 · Gevangenneming</text><text x="68" y="241" class="body">Kedron, herkenning, terugdeinzen en</text><text x="68" y="284" class="body">binden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">13–24 · Annas</text><text x="68" y="433" class="body">Petrus komt binnen; Jezus wordt</text><text x="68" y="476" class="body">ondervraagd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">25–27 · Petrus</text><text x="68" y="625" class="body">Verdere ontkenningen en het kraaien van</text><text x="68" y="668" class="body">de haan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">28–40 · Pilatus</text><text x="68" y="817" class="body">Koningschap, waarheid en de roep om</text><text x="68" y="860" class="body">Barabbas.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>