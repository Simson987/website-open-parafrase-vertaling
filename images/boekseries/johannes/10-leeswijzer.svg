<svg xmlns="http://www.w3.org/2000/svg" width="840" height="992" viewBox="0 0 840 992" role="img" aria-labelledby="title desc"><title id="title">Herder, horen en één zijn</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="992" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herder, horen en één zijn</text><text x="44" y="113" class="ref">Johannes 10:1–42</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beeldspraak · 1–18</text><text x="68" y="241" class="body">Deur, stem en volgen; herder tegenover</text><text x="68" y="284" class="body">vreemde/huurling, leven geven en één</text><text x="68" y="327" class="body">kudde.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Reacties en feest · 19–30</text><text x="68" y="476" class="body">Verdeeldheid; winter, vernieuwing en</text><text x="68" y="519" class="body">Salomo’s zuilengang; werken, horen en</text><text x="68" y="562" class="body">veilig in hand; Vader en ik één.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Afwijzing en overkant · 31–42</text><text x="68" y="711" class="body">Stenen en godslasteringsvraag; Schrift</text><text x="68" y="754" class="body">en werken, ontkomen en Jordaan, veel</text><text x="68" y="797" class="body">geloof.</text><text x="46" y="890" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="926" class="note">de plaatselijke versindeling.</text></svg>