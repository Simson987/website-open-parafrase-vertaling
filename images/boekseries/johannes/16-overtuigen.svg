<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">Waarvan overtuigt de Geest?</title><desc id="desc">Waarvan overtuigt de Geest? met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="820" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarvan overtuigt de Geest?</text><text x="44" y="113" class="ref">Johannes 16:8–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zonde</text><text x="68" y="241" class="body">Omdat zij niet in Jezus geloven.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Gerechtigheid</text><text x="68" y="390" class="body">Omdat Jezus naar de Vader gaat en niet</text><text x="68" y="433" class="body">meer gezien wordt.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Oordeel</text><text x="68" y="582" class="body">Omdat de heerser van deze wereld</text><text x="68" y="625" class="body">veroordeeld is.</text><text x="46" y="718" class="note">De drie onderwerpen en hun redenen volgen de</text><text x="46" y="754" class="note">verzen.</text></svg>