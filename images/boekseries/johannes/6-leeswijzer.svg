<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1227" viewBox="0 0 840 1227" role="img" aria-labelledby="title desc"><title id="title">Brood, geloven en blijven</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1227" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Brood, geloven en blijven</text><text x="44" y="113" class="ref">Johannes 6:1–71</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Maaltijd · 1–15</text><text x="68" y="241" class="body">Filippus, Andreas en jongen; vijf</text><text x="68" y="284" class="body">gerstebroden/twee visjes, vijfduizend,</text><text x="68" y="327" class="body">twaalf manden en berg alleen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Meer en zoeken · 16–29</text><text x="68" y="476" class="body">Nacht, tegenwind en Jezus over water;</text><text x="68" y="519" class="body">overkant, menigte en geloven in</text><text x="68" y="562" class="body">Gezondene.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Brood van leven · 30–59</text><text x="68" y="711" class="body">Manna en werkelijk brood;</text><text x="68" y="754" class="body">komen/geloven, opwekken en leven door</text><text x="68" y="797" class="body">Hem; onderwijs synagoge.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Reacties · 60–71</text><text x="68" y="946" class="body">Harde woorden, Geest/leven en</text><text x="68" y="989" class="body">terugtrekken; twaalf, Petrus’ geloof en</text><text x="68" y="1032" class="body">Judas genoemd.</text><text x="46" y="1125" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="1161" class="note">de plaatselijke versindeling.</text></svg>