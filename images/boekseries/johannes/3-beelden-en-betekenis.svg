<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">De beelden in het gesprek</title><desc id="desc">De beelden in het gesprek met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De beelden in het gesprek</text><text x="44" y="113" class="ref">Johannes 3:3–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geboorte · 3–7</text><text x="68" y="241" class="body">Nieuw leven uit water en Geest; niet</text><text x="68" y="284" class="body">opnieuw lichamelijk geboren.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wind · 8</text><text x="68" y="433" class="body">Geluid hoorbaar, oorsprong en</text><text x="68" y="476" class="body">bestemming onzichtbaar; vergelijking</text><text x="68" y="519" class="body">met uit Geest geboren.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Slang · 14–17</text><text x="68" y="668" class="body">Mozes omhoog; Mensenzoon verhoogd,</text><text x="68" y="711" class="body">geloof en eeuwig leven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Licht · 19–21</text><text x="68" y="860" class="body">Kwaad verbergt, waarheid komt aan</text><text x="68" y="903" class="body">licht.</text><text x="46" y="996" class="note">Onderwijsbeelden onderscheiden; geen anatomische</text><text x="46" y="1032" class="note">geboorte of portret van God getekend.</text></svg>