<svg xmlns="http://www.w3.org/2000/svg" width="840" height="949" viewBox="0 0 840 949" role="img" aria-labelledby="title desc"><title id="title">Het Woord, getuigenis en volgen</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="949" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het Woord, getuigenis en volgen</text><text x="44" y="113" class="ref">Johannes 1:1–52</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het Woord · 1–18</text><text x="68" y="241" class="body">Bij God en God, schepping/leven/licht,</text><text x="68" y="284" class="body">aannemen en menswording; Zoon maakt</text><text x="68" y="327" class="body">Vader bekend.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Johannes · 19–34</text><text x="68" y="476" class="body">Wie bent u? Stem, waterdoop, Lam van</text><text x="68" y="519" class="body">God en Geest als duif; Zoon van God.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Leerlingen · 35–52</text><text x="68" y="668" class="body">Twee volgen, Andreas/Simon,</text><text x="68" y="711" class="body">Filippus/Nathanaël; kom kijken, namen</text><text x="68" y="754" class="body">en belijdenissen.</text><text x="46" y="847" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="883" class="note">de plaatselijke versindeling.</text></svg>