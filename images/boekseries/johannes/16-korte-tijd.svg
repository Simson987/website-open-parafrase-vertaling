<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Een korte tijd en blijvende vreugde</title><desc id="desc">Een korte tijd en blijvende vreugde met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Een korte tijd en blijvende vreugde</text><text x="44" y="113" class="ref">Johannes 16:16–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet zien, daarna weer zien</text><text x="68" y="241" class="body">De leerlingen vragen elkaar wat Jezus</text><text x="68" y="284" class="body">bedoelt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verdriet wordt vreugde</text><text x="68" y="433" class="body">Jezus gebruikt de vergelijking van een</text><text x="68" y="476" class="body">geboorte.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Blijvende vreugde</text><text x="68" y="625" class="body">Hij zal hen weer zien; niemand neemt</text><text x="68" y="668" class="body">die vreugde af.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gebed</text><text x="68" y="817" class="body">Zij mogen de Vader vragen in Jezus’</text><text x="68" y="860" class="body">naam.</text><text x="46" y="953" class="note">De geboorte is een vergelijking; de verstrooiing</text><text x="46" y="989" class="note">wordt aangekondigd.</text></svg>