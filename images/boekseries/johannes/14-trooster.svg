<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De beloofde Trooster</title><desc id="desc">De beloofde Trooster met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De beloofde Trooster</text><text x="44" y="113" class="ref">Johannes 14:16–26</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 16–17</text><text x="68" y="241" class="body">Een andere Trooster blijft; de Geest</text><text x="68" y="284" class="body">van de waarheid.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vers 17</text><text x="68" y="433" class="body">Hij blijft bij hen en zal in hen zijn.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vers 26</text><text x="68" y="582" class="body">De Vader zendt de heilige Geest in</text><text x="68" y="625" class="body">Jezus’ naam.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Vers 26</text><text x="68" y="774" class="body">Hij leert en herinnert aan Jezus’</text><text x="68" y="817" class="body">woorden.</text><text x="46" y="910" class="note">Beloften uit dit hoofdstuk; geen verzonnen</text><text x="46" y="946" class="note">zichtbare gedaante.</text></svg>