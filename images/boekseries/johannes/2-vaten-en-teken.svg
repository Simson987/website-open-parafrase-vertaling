<svg xmlns="http://www.w3.org/2000/svg" width="840" height="906" viewBox="0 0 840 906" role="img" aria-labelledby="title desc"><title id="title">Zes vaten en het teken</title><desc id="desc">Zes vaten en het teken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="906" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes vaten en het teken</text><text x="44" y="113" class="ref">Johannes 2:6–11 en 19–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Water · 6–7</text><text x="68" y="241" class="body">Zes stenen vaten, ieder ongeveer 80–120</text><text x="68" y="284" class="body">liter; tot de rand gevuld.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wijn · 8–11</text><text x="68" y="433" class="body">Dienaren weten vanwaar; leider proeft,</text><text x="68" y="476" class="body">bruidegom aangesproken; eerste teken.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tempelwoord · 19–22</text><text x="68" y="625" class="body">Drie dagen; Jezus sprak over Zijn</text><text x="68" y="668" class="body">lichaam. Leerlingen herinneren na</text><text x="68" y="711" class="body">opstanding.</text><text x="46" y="804" class="note">46 bouwjaren uit vers 20 blijven de reactie van</text><text x="46" y="840" class="note">de gesprekspartners; geen bouwdatum berekend.</text></svg>