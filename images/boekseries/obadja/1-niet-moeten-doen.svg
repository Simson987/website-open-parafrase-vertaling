<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Wat Edom niet had moeten doen</title><desc id="desc">De uitdrukkelijke reeks verboden handelingen en haar gevolg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Edom niet had moeten doen</text><text x="44" y="113" class="ref">Obadja 1:10–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De broer · 10–11</text><text x="68" y="241" class="body">Geweld tegen Jakob en erbij staan toen</text><text x="68" y="284" class="body">vreemden Jeruzalem binnengingen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het ongeluk · 12</text><text x="68" y="433" class="body">Niet toekijken, niet blij zijn, niet</text><text x="68" y="476" class="body">hoog opgeven over de dag van nood.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De poort en bezit · 13</text><text x="68" y="625" class="body">Niet binnengaan, niet naar ellende</text><text x="68" y="668" class="body">kijken, geen hand naar bezit</text><text x="68" y="711" class="body">uitstrekken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De vlucht · 14</text><text x="68" y="860" class="body">Niet op kruising afsnijden en</text><text x="68" y="903" class="body">overlevenden niet uitleveren.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De terugkeer van de daad · 15</text><text x="68" y="1052" class="body">Zoals jij gedaan hebt, zal met jou</text><text x="68" y="1095" class="body">gedaan worden.</text><text x="46" y="1188" class="note">De herhaalde dag van nood verbindt de concrete</text><text x="46" y="1224" class="note">beschuldigingen. Het schema verzint geen aparte</text><text x="46" y="1260" class="note">veldslagen of extra daders.</text></svg>