<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1303" viewBox="0 0 840 1303" role="img" aria-labelledby="title desc"><title id="title">Gebieden en ballingen</title><desc id="desc">De expliciete groepen en gebieden uit de slotverzen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1303" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebieden en ballingen</text><text x="44" y="113" class="ref">Obadja 1:19–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mensen uit het zuiden · 19</text><text x="68" y="241" class="body">Bergland van Ezau in bezit.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Mensen uit de laagte · 19</text><text x="68" y="390" class="body">Land van Filistijnen; ook gebied van</text><text x="68" y="433" class="body">Efraïm en Samaria genoemd.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Benjamin · 19</text><text x="68" y="582" class="body">Gilead krijgen.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Israëlitische ballingen · 20</text><text x="68" y="731" class="body">Land van Kanaänieten tot aan Zarfath.</text><rect x="42" y="789" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Jeruzalems ballingen in Sefarad · 20</text><text x="68" y="880" class="body">Steden van het zuiden.</text><rect x="42" y="938" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="981" class="label">Het slot · 21</text><text x="68" y="1029" class="body">Redders op Sion oordelen bergland van</text><text x="68" y="1072" class="body">Ezau; koninkrijk van de HEERE.</text><text x="46" y="1165" class="note">Sefarad en Zarfath blijven met de namen uit de</text><text x="46" y="1201" class="note">tekst staan. Een onbewezen moderne plaats of</text><text x="46" y="1237" class="note">grens is niet toegevoegd.</text></svg>