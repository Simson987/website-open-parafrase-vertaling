<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1342" viewBox="0 0 840 1342" role="img" aria-labelledby="title desc"><title id="title">Edoms trots en Jakobs redding</title><desc id="desc">De volledige inhoud van het ene hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1342" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Edoms trots en Jakobs redding</text><text x="44" y="113" class="ref">Obadja 1:1–21</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vernedering · 1–9</text><text x="68" y="241" class="body">Gezant en volken, trots in rotskloven,</text><text x="68" y="284" class="body">arendsnest, geplunderde schatten,</text><text x="68" y="327" class="body">bondgenoten bedriegen, wijzen en helden</text><text x="68" y="370" class="body">weg.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De aanklacht · 10–14</text><text x="68" y="519" class="body">Geweld tegen broer Jakob; toekijken,</text><text x="68" y="562" class="body">leedvermaak, poort binnengaan, bezit</text><text x="68" y="605" class="body">pakken en vluchtelingen afsnijden.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De dag en redding · 15–18</text><text x="68" y="754" class="body">Daad op eigen hoofd, volken drinken;</text><text x="68" y="797" class="body">Sion heilig en redding, Jakob/Jozef</text><text x="68" y="840" class="body">vuur en Ezau stoppels.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Het bezit en slot · 19–21</text><text x="68" y="989" class="body">Gebieden weer bezeten, ballingen keren,</text><text x="68" y="1032" class="body">redders op Sion en het koninkrijk van</text><text x="68" y="1075" class="body">Hem.</text><text x="46" y="1168" class="note">Vergelijkingen, aanklacht en beloofde afloop</text><text x="46" y="1204" class="note">zijn onderscheiden; de rotsstad wordt niet</text><text x="46" y="1240" class="note">zonder bron met één moderne vindplaats</text><text x="46" y="1276" class="note">gelijkgesteld.</text></svg>