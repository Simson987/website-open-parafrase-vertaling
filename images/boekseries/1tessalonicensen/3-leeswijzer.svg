<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Timotheüs en het gebed</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Timotheüs en het gebed</text><text x="44" y="113" class="ref">1 Tessalonicensen 3:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–5 · De zending</text><text x="68" y="241" class="body">Vanuit Athene Timotheüs sturen om het</text><text x="68" y="284" class="body">geloof te versterken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">6–10 · Het goede bericht</text><text x="68" y="433" class="body">Geloof en liefde geven Paulus troost,</text><text x="68" y="476" class="body">vreugde en dank.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">11–13 · Het gebed</text><text x="68" y="625" class="body">Een geopende weg, groeiende liefde en</text><text x="68" y="668" class="body">standvastige harten.</text><text x="46" y="761" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="797" class="note">de plaatselijke versindeling.</text></svg>