<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Samen de Heere ontmoeten</title><desc id="desc">Samen de Heere ontmoeten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Samen de Heere ontmoeten</text><text x="44" y="113" class="ref">1 Tessalonicensen 4:13–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De grond · vers 13–14</text><text x="68" y="241" class="body">Jezus is gestorven en opgestaan; daarom</text><text x="68" y="284" class="body">is er hoop.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerst · vers 15–16</text><text x="68" y="433" class="body">De Heere daalt neer; de doden in</text><text x="68" y="476" class="body">Christus staan eerst op.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Daarna · vers 17</text><text x="68" y="625" class="body">De levenden worden samen met hen</text><text x="68" y="668" class="body">opgenomen om Hem te ontmoeten.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Altijd · vers 17–18</text><text x="68" y="817" class="body">Bij de Heere zijn; troost elkaar met</text><text x="68" y="860" class="body">deze woorden.</text><text x="46" y="953" class="note">Dit is het beschreven toekomstbeeld. De brief</text><text x="46" y="989" class="note">geeft hier geen kalenderdatum.</text></svg>