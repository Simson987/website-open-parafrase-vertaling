<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Ieder passend helpen</title><desc id="desc">Ieder passend helpen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ieder passend helpen</text><text x="44" y="113" class="ref">1 Tessalonicensen 5:14–15</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wie ongeregeld leeft</text><text x="68" y="241" class="body">Terechtwijzen.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Wie de moed verliest</text><text x="68" y="390" class="body">Bemoedigen.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Wie zwak is</text><text x="68" y="539" class="body">Ondersteunen.</text><rect x="42" y="597" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Tegenover iedereen</text><text x="68" y="688" class="body">Geduldig zijn en het goede zoeken; geen</text><text x="68" y="731" class="body">kwaad vergelden.</text><text x="46" y="824" class="note">De verschillende aansporingen staan samen in</text><text x="46" y="860" class="note">dezelfde oproep.</text></svg>