<svg xmlns="http://www.w3.org/2000/svg" width="840" height="926" viewBox="0 0 840 926" role="img" aria-labelledby="title desc"><title id="title">Geloof, liefde en hoop</title><desc id="desc">Geloof, liefde en hoop met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="926" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geloof, liefde en hoop</text><text x="44" y="113" class="ref">1 Tessalonicensen 5:8–11</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Borstharnas</text><text x="68" y="241" class="body">Geloof en liefde.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Helm</text><text x="68" y="390" class="body">De hoop op redding.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Bestemming</text><text x="68" y="539" class="body">Redding door Jezus Christus; samen met</text><text x="68" y="582" class="body">Hem leven.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Omgang</text><text x="68" y="731" class="body">Elkaar bemoedigen en opbouwen.</text><text x="46" y="824" class="note">Deze uitrusting is beeldspraak voor nuchter</text><text x="46" y="860" class="note">leven; de koppelingen volgen dit hoofdstuk.</text></svg>