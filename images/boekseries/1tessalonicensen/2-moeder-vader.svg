<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Twee beelden voor de zorg</title><desc id="desc">Twee beelden voor de zorg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee beelden voor de zorg</text><text x="44" y="113" class="ref">1 Tessalonicensen 2:7–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Als een moeder · vers 7–8</text><text x="68" y="241" class="body">Zacht zorgen en het eigen leven willen</text><text x="68" y="284" class="body">delen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Dag en nacht · vers 9–10</text><text x="68" y="433" class="body">Arbeiden om niemand te belasten; heilig</text><text x="68" y="476" class="body">en rechtvaardig leven.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Als een vader · vers 11–12</text><text x="68" y="625" class="body">Ieder bemoedigen, aansporen en oproepen</text><text x="68" y="668" class="body">waardig te leven.</text><text x="46" y="761" class="note">Moeder en vader zijn vergelijkingen voor de zorg</text><text x="46" y="797" class="note">van de verkondigers.</text></svg>