<svg xmlns="http://www.w3.org/2000/svg" width="840" height="863" viewBox="0 0 840 863" role="img" aria-labelledby="title desc"><title id="title">Wat Paulus voor hen bidt</title><desc id="desc">Wat Paulus voor hen bidt met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="863" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat Paulus voor hen bidt</text><text x="44" y="113" class="ref">1 Tessalonicensen 3:11–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De weg · vers 11</text><text x="68" y="241" class="body">God, de Vader, en Jezus leiden de weg</text><text x="68" y="284" class="body">naar jullie.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De liefde · vers 12</text><text x="68" y="433" class="body">Groeien in liefde voor elkaar en voor</text><text x="68" y="476" class="body">iedereen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De harten · vers 13</text><text x="68" y="625" class="body">Versterkt, onberispelijk en heilig bij</text><text x="68" y="668" class="body">de komst van Jezus.</text><text x="46" y="761" class="note">De drie gebedswensen volgen op Timotheüs’ goede</text><text x="46" y="797" class="note">bericht.</text></svg>