<svg xmlns="http://www.w3.org/2000/svg" width="840" height="777" viewBox="0 0 840 777" role="img" aria-labelledby="title desc"><title id="title">Drie dingen in de dank</title><desc id="desc">Drie dingen in de dank met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="777" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie dingen in de dank</text><text x="44" y="113" class="ref">1 Tessalonicensen 1:2–3</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Geloof</text><text x="68" y="241" class="body">Het werk dat uit het geloof voortkomt.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Liefde</text><text x="68" y="390" class="body">De inspanning die de liefde kost.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Hoop</text><text x="68" y="539" class="body">De volharding door de hoop op Jezus</text><text x="68" y="582" class="body">Christus.</text><text x="46" y="675" class="note">Paulus herinnert zich deze drie voor God, de</text><text x="46" y="711" class="note">Vader.</text></svg>