<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Gebed en bewaring</title><desc id="desc">Gebed en bewaring met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebed en bewaring</text><text x="44" y="113" class="ref">Gebed van Azaria 1:24–50</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lof en belijdenis · 24–33</text><text x="68" y="241" class="body">Azaria bidt midden in de vlam en erkent</text><text x="68" y="284" class="body">Gods recht en de ongehoorzaamheid van</text><text x="68" y="327" class="body">het volk.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Verbond en offer · 34–40</text><text x="68" y="476" class="body">Barmhartigheid om de vaderen; een</text><text x="68" y="519" class="body">gebroken hart waar offers ontbreken.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De smeekbede · 41–45</text><text x="68" y="668" class="body">Trouw volgen, ontferming en verlossing</text><text x="68" y="711" class="body">tot eer van Gods naam.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De bewaring · 46–50</text><text x="68" y="860" class="body">De oven wordt gestookt; de engel maakt</text><text x="68" y="903" class="body">een koele ruimte en het vuur raakt hen</text><text x="68" y="946" class="body">niet.</text><text x="46" y="1039" class="note">De negenenveertig el beschrijft de hoogte van de</text><text x="46" y="1075" class="note">vlam boven de oven, niet de maat van het gebouw.</text></svg>