<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1432" viewBox="0 0 840 1432" role="img" aria-labelledby="title desc"><title id="title">Stammen en telgroepen</title><desc id="desc">De precieze genoemde aantallen met hoofden apart benoemd.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1432" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stammen en telgroepen</text><text x="44" y="113" class="ref">1 Kronieken 12:24–37</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Juda en Simeon</text><text x="68" y="241" class="body">6.800 en 7.100 strijders.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Levi en Aäron</text><text x="68" y="390" class="body">4.600 Levieten; Jehojada met 3.700;</text><text x="68" y="433" class="body">Zadok met 22 familiehoofden.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Benjamin en Efraïm</text><text x="68" y="582" class="body">3.000 en 20.800; westelijk half Manasse</text><text x="68" y="625" class="body">18.000.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Issaschar en Zebulon</text><text x="68" y="774" class="body">200 hoofden met hun broeders; 50.000</text><text x="68" y="817" class="body">uit Zebulon.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Nafthali, Dan en Aser</text><text x="68" y="966" class="body">1.000 hoofden met 37.000 strijders; Dan</text><text x="68" y="1009" class="body">28.600; Aser 40.000.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Ten oosten van de Jordaan</text><text x="68" y="1158" class="body">Ruben, Gad en half Manasse samen</text><text x="68" y="1201" class="body">120.000.</text><text x="46" y="1294" class="note">Hoofden en strijders zijn verschillende</text><text x="46" y="1330" class="note">telgroepen; daarom wordt geen misleidend</text><text x="46" y="1366" class="note">opgeteld totaal gegeven.</text></svg>