<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Steden voor Aäron en Kahath</title><desc id="desc">De twee onderscheiden groepen binnen Kahaths families en hun woonrechten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Steden voor Aäron en Kahath</text><text x="44" y="113" class="ref">1 Kronieken 6:54–70</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aärons families</text><text x="68" y="241" class="body">Het eerste lot; dertien steden genoemd.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Hebron</text><text x="68" y="390" class="body">Stad en weidegronden voor hen; de</text><text x="68" y="433" class="body">akkers en dorpen voor Kaleb, zoon van</text><text x="68" y="476" class="body">Jefunne.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Juda en Benjamin</text><text x="68" y="625" class="body">Onder meer Libna, Jattir, Esthemoa,</text><text x="68" y="668" class="body">Debir, Asan, Beth-Semes, Geba, Allemeth</text><text x="68" y="711" class="body">en Anathoth.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Overige Kahathieten</text><text x="68" y="860" class="body">Tien steden; onder meer Sichem, Gezer,</text><text x="68" y="903" class="body">Jokmeam, Beth-Horon, Ajalon en</text><text x="68" y="946" class="body">Gath-Rimmon.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Half Manasse</text><text x="68" y="1095" class="body">Aner en Bileam met weidegronden bij de</text><text x="68" y="1138" class="body">overige Kahathieten.</text><text x="46" y="1231" class="note">De lijsten worden geselecteerd weergegeven;</text><text x="46" y="1267" class="note">stadsgrond en Kalebs akkers worden niet als</text><text x="46" y="1303" class="note">hetzelfde bezit getekend.</text></svg>