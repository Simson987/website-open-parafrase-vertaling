<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Helden en hun rangen</title><desc id="desc">Helden, taak en onderscheiden ranggroepen zonder alles tot één drietal te maken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Helden en hun rangen</text><text x="44" y="113" class="ref">1 Kronieken 11:10–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jasobam en Eleazar</text><text x="68" y="241" class="body">Jasobam, zoon van Hachmoni; Eleazar,</text><text x="68" y="284" class="body">zoon van Dodo uit Ahoah.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Drie bij Bethlehem</text><text x="68" y="433" class="body">Drie van de dertig halen water; David</text><text x="68" y="476" class="body">giet het voor de HEERE uit vanwege hun</text><text x="68" y="519" class="body">levensgevaar.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Abisai</text><text x="68" y="668" class="body">Joabs broer; geëerd onder de tweede</text><text x="68" y="711" class="body">drie, maar niet bij de eerste drie</text><text x="68" y="754" class="body">gerekend.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Benaja</text><text x="68" y="903" class="body">Zoon van Jojada uit Kabzeël; geëerd</text><text x="68" y="946" class="body">boven de dertig, niet bij de eerste</text><text x="68" y="989" class="body">drie; hoofd van de lijfwacht.</text><text x="46" y="1082" class="note">De tekst onderscheidt groepen en waardering; dit</text><text x="46" y="1118" class="note">is geen genealogie.</text></svg>