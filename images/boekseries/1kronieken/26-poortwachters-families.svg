<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Families van poortwachters</title><desc id="desc">De drie families en hun onderscheiden aantallen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Families van poortwachters</text><text x="44" y="113" class="ref">1 Kronieken 26:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Meselemja</text><text x="68" y="241" class="body">Uit Korah; zeven zonen genoemd; met</text><text x="68" y="284" class="body">zonen en verwanten achttien mannen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Obed-Edom</text><text x="68" y="433" class="body">Acht zonen genoemd; met hun zonen en</text><text x="68" y="476" class="body">verwanten 62 geschikte mannen.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hosa</text><text x="68" y="625" class="body">Uit Merari; Simri is hoofd hoewel niet</text><text x="68" y="668" class="body">de oudste; met zonen en verwanten</text><text x="68" y="711" class="body">dertien.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De loting</text><text x="68" y="860" class="body">Per familie, voor jong en oud gelijk.</text><text x="46" y="953" class="note">Het aantal zonen en de grotere groep met</text><text x="46" y="989" class="note">verwanten zijn verschillende tellingen.</text></svg>