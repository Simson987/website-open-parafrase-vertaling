<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Gibeon en de naamvormen</title><desc id="desc">Parallelle familiegegevens met zichtbare verschillen in naamvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gibeon en de naamvormen</text><text x="44" y="113" class="ref">1 Kronieken 9:35–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jeiël en Maächa</text><text x="68" y="241" class="body">Jeiël is stichter van Gibeon; Maächa is</text><text x="68" y="284" class="body">zijn vrouw.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De reeks naar Saul</text><text x="68" y="433" class="body">Ner → Kis → Saul → Jonathan →</text><text x="68" y="476" class="body">Merib-Baäl → Micha.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Na Achaz</text><text x="68" y="625" class="body">Hier staat Jaera; daarna Alemeth,</text><text x="68" y="668" class="body">Azmaveth en Zimri.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De gekozen verdere lijn</text><text x="68" y="817" class="body">Zimri → Moza → Bina → Refaja → Elasa →</text><text x="68" y="860" class="body">Azel.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Azels zes zonen</text><text x="68" y="1009" class="body">Azrikam, Bochru, Ismaël, Searja, Obadja</text><text x="68" y="1052" class="body">en Hanan.</text><text x="46" y="1145" class="note">Hoofdstuk 8 gebruikt in de parallelle lijst de</text><text x="46" y="1181" class="note">vormen Jehoadda en Rafa. De eigen schrijfwijzen</text><text x="46" y="1217" class="note">van elk hoofdstuk blijven behouden.</text></svg>