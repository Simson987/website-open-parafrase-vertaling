<svg xmlns="http://www.w3.org/2000/svg" width="840" height="864" viewBox="0 0 840 864"><title>Levi’s drie familietakken</title><rect width="840" height="864" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Levi’s drie familietakken</text><text x="42" y="105" font-size="25">1 Kronieken 6:1–3, 16–19</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Levi</text><path d="M470 215 V235 H75 V641.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 311.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Gerson</text><text x="175" y="337" font-size="29">Zonen: Libni en Simeï.</text><path d="M75 476.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="387" width="640" height="179" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="424" font-size="31" font-weight="700">Kahath</text><text x="175" y="464" font-size="29">Zonen: Amram, Jizhar, Hebron en Uzziël.</text><text x="175" y="502" font-size="29">Amrams kinderen: Aäron, Mozes en</text><text x="175" y="540" font-size="29">Mirjam.</text><path d="M75 641.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="590" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="627" font-size="31" font-weight="700">Merari</text><text x="175" y="667" font-size="29">Zonen: Maheli en Musi.</text><text x="42" y="739" font-size="26">Aäron, Mozes en Mirjam zijn drie kinderen van</text><text x="42" y="773" font-size="26">Amram; alleen Aärons zonen vormen de hier</text><text x="42" y="807" font-size="26">genoemde priesterlijn.</text></g></svg>