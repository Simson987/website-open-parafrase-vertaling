<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Abrahams familietakken</title><desc id="desc">De hoofd- en zijtakken rond Abraham met de exacte namen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Abrahams familietakken</text><text x="44" y="113" class="ref">1 Kronieken 1:28–37</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Izak</text><text x="68" y="241" class="body">Zonen: Ezau en Israël.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Ismaël</text><text x="68" y="390" class="body">Nebajoth, Kedar, Adbeel, Mibsam, Misma,</text><text x="68" y="433" class="body">Duma, Massa, Hadad, Thema, Jetur, Nafis</text><text x="68" y="476" class="body">en Kedma.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Kinderen bij Ketura</text><text x="68" y="625" class="body">Zimram, Joksan, Medan, Midian, Isbak en</text><text x="68" y="668" class="body">Suah.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Joksan en Midian</text><text x="68" y="817" class="body">Joksan: Scheba en Dedan. Midian: Efa,</text><text x="68" y="860" class="body">Efer, Henoch, Abida en Eldaa.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Ezau</text><text x="68" y="1009" class="body">Elifaz, Rehuël, Jehus, Jaëlam en Korah;</text><text x="68" y="1052" class="body">Amalek komt van Elifaz bij Timna.</text><text x="46" y="1145" class="note">Gelijknamigen zoals Henoch en Scheba krijgen</text><text x="46" y="1181" class="note">alleen de relaties die hier expliciet genoemd</text><text x="46" y="1217" class="note">zijn.</text></svg>