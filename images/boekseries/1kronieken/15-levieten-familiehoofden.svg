<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Zes Levietengroepen</title><desc id="desc">Familiehoofden, aantallen en voorbereiding van de dragers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zes Levietengroepen</text><text x="44" y="113" class="ref">1 Kronieken 15:5–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kahath en Merari</text><text x="68" y="241" class="body">Uriël met 120; Asaja met 220.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Gersom en Elizafan</text><text x="68" y="390" class="body">Joël met 130; Semaja met 200.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Hebron en Uzziël</text><text x="68" y="539" class="body">Eliël met 80; Amminadab met 112.</text><rect x="42" y="597" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Voorbereiding</text><text x="68" y="688" class="body">Zadok en Abjathar en de Levieten worden</text><text x="68" y="731" class="body">opgeroepen zich te heiligen; daarna</text><text x="68" y="774" class="body">dragen de Levieten de ark.</text><text x="46" y="867" class="note">De aantallen horen bij de genoemde groepen; de</text><text x="46" y="903" class="note">namen zijn familiehoofden, niet zes zonen van</text><text x="46" y="939" class="note">één vader.</text></svg>