<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Dank en voorbede van David</title><desc id="desc">De inhoudelijke beweging van lof, dank, nederigheid en voorbede.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dank en voorbede van David</text><text x="44" y="113" class="ref">1 Kronieken 29:10–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Lof</text><text x="68" y="241" class="body">Gods grootheid, macht, glorie en</text><text x="68" y="284" class="body">koningschap; alles is van Hem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ontvangen en teruggeven</text><text x="68" y="433" class="body">Alles komt uit Gods hand; het volk</text><text x="68" y="476" class="body">geeft wat het heeft ontvangen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vergankelijkheid</text><text x="68" y="625" class="body">Mensen zijn vreemdelingen en gasten;</text><text x="68" y="668" class="body">hun dagen als een schaduw.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Oprechtheid</text><text x="68" y="817" class="body">God toetst het hart; David vraagt</text><text x="68" y="860" class="body">blijvende toewijding bij het volk en</text><text x="68" y="903" class="body">Salomo.</text><rect x="42" y="961" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het antwoord</text><text x="68" y="1052" class="body">De vergadering prijst, buigt en knielt.</text><text x="46" y="1145" class="note">De schaduw is een vergelijking voor het</text><text x="46" y="1181" class="note">menselijke leven, geen aparte historische</text><text x="46" y="1217" class="note">gebeurtenis.</text></svg>