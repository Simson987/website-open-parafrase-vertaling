<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Gezinnen, gebed en beroepen</title><desc id="desc">Gebed, gecontroleerde korte takken en beroepen in Juda.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gezinnen, gebed en beroepen</text><text x="44" y="113" class="ref">1 Kronieken 4:9–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jabez</text><text x="68" y="241" class="body">Bidt om zegen, ruimer gebied, Gods hand</text><text x="68" y="284" class="body">en bescherming tegen kwaad en pijn; God</text><text x="68" y="327" class="body">geeft wat hij vraagt.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Kenaz</text><text x="68" y="476" class="body">Othniël en Seraja; Othniëls zoon</text><text x="68" y="519" class="body">Hathath; Seraja’s zoon Joab bij het Dal</text><text x="68" y="562" class="body">van de Vaklieden.</text><rect x="42" y="620" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Kaleb, zoon van Jefunne</text><text x="68" y="711" class="body">Iru, Ela en Naäm; Ela krijgt Kenaz.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Sela’s families</text><text x="68" y="860" class="body">Er, Lada en linnenwevers in Beth-Asbea;</text><text x="68" y="903" class="body">daarna oude berichten.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De pottenbakkers</text><text x="68" y="1052" class="body">Wonen bij plantages en tuinen en werken</text><text x="68" y="1095" class="body">voor de koning.</text><text x="46" y="1188" class="note">De genoemde Kenaz, Joab en Kaleb worden alleen</text><text x="46" y="1224" class="note">met de hier gegeven relaties verbonden.</text></svg>