<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Manasse en Efraïm</title><desc id="desc">Familietakken, rouw, een bouwster en de afsluitende lijn naar Jozua.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Manasse en Efraïm</text><text x="44" y="113" class="ref">1 Kronieken 7:14–29</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Manasse</text><text x="68" y="241" class="body">Asriël; bij de Syrische bijvrouw</text><text x="68" y="284" class="body">Machir, vader van Gilead.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Maächa en Machir</text><text x="68" y="433" class="body">Peres; zijn broer Seres met zonen Ulam</text><text x="68" y="476" class="body">en Rekem; Ulam krijgt Bedan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Efraïms verdriet</text><text x="68" y="625" class="body">Doden bij Gath; langdurige rouw en</text><text x="68" y="668" class="body">troost; daarna de geboorte van Beria.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Seëra</text><text x="68" y="817" class="body">Bouwt Beneden-Beth-Horon,</text><text x="68" y="860" class="body">Boven-Beth-Horon en Uzzen-Seëra.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De latere lijn</text><text x="68" y="1009" class="body">Telah → Tahan → Ladan → Ammihud →</text><text x="68" y="1052" class="body">Elisama → Non → Jozua.</text><text x="46" y="1145" class="note">De vele naamgenoten blijven in hun eigen</text><text x="46" y="1181" class="note">families. Seëra is een genoemde bouwende vrouw.</text></svg>