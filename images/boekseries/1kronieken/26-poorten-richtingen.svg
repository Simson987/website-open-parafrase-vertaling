<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Poorten en wachtposten</title><desc id="desc">Toewijzing en aantallen wachtposten per richting.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Poorten en wachtposten</text><text x="44" y="113" class="ref">1 Kronieken 26:14–19</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Oosten</text><text x="68" y="241" class="body">Salemja; zes Levieten.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Noorden</text><text x="68" y="390" class="body">Zijn zoon Zecharja; vier per dag.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Zuiden en voorraad</text><text x="68" y="539" class="body">Obed-Edom; vier per dag. Zijn zonen bij</text><text x="68" y="582" class="body">de voorraadkamers, twee aan twee.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Westen</text><text x="68" y="731" class="body">Suppim en Hosa, Schallechetpoort; vier</text><text x="68" y="774" class="body">aan de weg en twee bij het bijgebouw.</text><text x="46" y="867" class="note">Taakoverzicht per richting, geen bouwplattegrond</text><text x="46" y="903" class="note">op schaal. De tekst gebruikt hier Salemja als</text><text x="46" y="939" class="note">naamvorm.</text></svg>