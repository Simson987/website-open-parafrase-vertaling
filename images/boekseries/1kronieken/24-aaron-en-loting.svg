<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Aärons takken en de loting</title><desc id="desc">Priesterlijke takken, aantallen en registratie met de twee naamvormen zichtbaar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aärons takken en de loting</text><text x="44" y="113" class="ref">1 Kronieken 24:1–6</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aärons vier zonen</text><text x="68" y="241" class="body">Nadab, Abihu, Eleazar en Ithamar.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Twee priesterlijke takken</text><text x="68" y="390" class="body">Nadab en Abihu sterven zonder zonen;</text><text x="68" y="433" class="body">Eleazar en Ithamar vervullen de dienst.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Zestien en acht</text><text x="68" y="582" class="body">Zestien familiehoofden uit Eleazar en</text><text x="68" y="625" class="body">acht uit Ithamar: vierentwintig</text><text x="68" y="668" class="body">afdelingen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vastleggen</text><text x="68" y="817" class="body">De Levitische schrijver Semaja, zoon</text><text x="68" y="860" class="body">van Nethaneël, schrijft de indeling op</text><text x="68" y="903" class="body">bij koning en leiders.</text><text x="46" y="996" class="note">Vers 3 noemt Abimelech; vers 6 Achimelech, zoon</text><text x="46" y="1032" class="note">van Abjathar. De bronvormen worden niet</text><text x="46" y="1068" class="note">stilzwijgend gelijkgetrokken.</text></svg>