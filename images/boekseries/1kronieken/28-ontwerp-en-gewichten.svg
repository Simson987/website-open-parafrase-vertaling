<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Ontwerp, dienst en gewichten</title><desc id="desc">Welke onderdelen David aan Salomo overdraagt zonder verzonnen maten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ontwerp, dienst en gewichten</text><text x="44" y="113" class="ref">1 Kronieken 28:11–19</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De ruimten</text><text x="68" y="241" class="body">Voorhal, omringende gebouwen,</text><text x="68" y="284" class="body">voorraadkamers, bovenzalen,</text><text x="68" y="327" class="body">binnenkamers en ruimte voor het</text><text x="68" y="370" class="body">verzoendeksel.</text><rect x="42" y="428" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Voorhoven en voorraden</text><text x="68" y="519" class="body">Alle omringende kamers en schatten van</text><text x="68" y="562" class="body">het huis en de gewijde gaven.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De dienst</text><text x="68" y="711" class="body">Groepen priesters en Levieten,</text><text x="68" y="754" class="body">werkzaamheden en gerei.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Metalen per voorwerp</text><text x="68" y="903" class="body">Goud en zilver naar gewicht voor</text><text x="68" y="946" class="body">kandelaars, lampen, tafels, bekers en</text><text x="68" y="989" class="body">ander gerei.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Reukaltaar en cherubs</text><text x="68" y="1138" class="body">Goud voor het reukaltaar en het ontwerp</text><text x="68" y="1181" class="body">van de cherubs boven de ark.</text><text x="46" y="1274" class="note">Dit hoofdstuk noemt functies en gewichten per</text><text x="46" y="1310" class="note">soort, maar geeft hier geen exacte afmetingen</text><text x="46" y="1346" class="note">voor een plattegrond.</text></svg>