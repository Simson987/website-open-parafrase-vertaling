<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962"><title>Van Ram tot David</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="962" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Van Ram tot David</text><text x="42" y="105" font-size="25">1 Kronieken 2:9–15</text><rect x="150" y="155" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="191" text-anchor="middle" font-size="31">Ram</text><path d="M420 209 V229" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="235" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="271" text-anchor="middle" font-size="31">Amminadab</text><path d="M420 289 V309" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="315" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="351" text-anchor="middle" font-size="31">Nahesson</text><path d="M420 369 V389" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="395" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="431" text-anchor="middle" font-size="31">Salma</text><path d="M420 449 V469" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="475" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="511" text-anchor="middle" font-size="31">Boaz</text><path d="M420 529 V549" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="555" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="591" text-anchor="middle" font-size="31">Obed</text><path d="M420 609 V629" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="635" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="671" text-anchor="middle" font-size="31">Isaï</text><path d="M420 689 V709" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="715" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="751" text-anchor="middle" font-size="31">David</text><text x="42" y="815" font-size="26">Dit is de gekozen lijn uit Hezrons tak. David is</text><text x="42" y="849" font-size="26">in deze lijst Isaï’s zevende zoon; broers en</text><text x="42" y="883" font-size="26">zussen staan in een apart schema.</text></g></svg>