<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">De onderbroken arktocht</title><desc id="desc">Plaatsen, keerpunt en tijdsduur van de onderbroken tocht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De onderbroken arktocht</text><text x="44" y="113" class="ref">1 Kronieken 13:5–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Van Baäla naar de stad</text><text x="68" y="241" class="body">Baäla is Kirjath-Jearim in Juda. Een</text><text x="68" y="284" class="body">nieuwe wagen vervoert de ark; Uza en</text><text x="68" y="327" class="body">Ahio begeleiden hem.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bij Chidons dorsvloer</text><text x="68" y="476" class="body">De runderen struikelen; Uza grijpt de</text><text x="68" y="519" class="body">ark en sterft.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Davids reactie</text><text x="68" y="668" class="body">Verdriet en vrees; de tocht naar Davids</text><text x="68" y="711" class="body">stad wordt onderbroken.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Bij Obed-Edom</text><text x="68" y="860" class="body">De ark blijft drie maanden; zijn huis</text><text x="68" y="903" class="body">ontvangt zegen.</text><text x="46" y="996" class="note">De nieuwe wagen is de beschreven werkwijze, geen</text><text x="46" y="1032" class="note">goedkeuring. De latere draagwijze staat in</text><text x="46" y="1068" class="note">hoofdstuk 15.</text></svg>