<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Drie reuzen, drie strijders</title><desc id="desc">De juiste koppelingen tussen strijders en tegenstanders, met het exacte aantal vingers en tenen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie reuzen, drie strijders</text><text x="44" y="113" class="ref">1 Kronieken 20:4–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sibchai uit Husa</text><text x="68" y="241" class="body">Verslaat Sippai, een afstammeling van</text><text x="68" y="284" class="body">Rafa, bij Gezer.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Elhanan, zoon van Jaïr</text><text x="68" y="433" class="body">Verslaat Lachmi, de broer van Goliath</text><text x="68" y="476" class="body">uit Gath.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jonathan, zoon van Simea</text><text x="68" y="625" class="body">Davids neef verslaat de naamloze man</text><text x="68" y="668" class="body">uit Gath met zes vingers aan elke hand</text><text x="68" y="711" class="body">en zes tenen aan elke voet.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het totaal bij de laatste</text><text x="68" y="860" class="body">Twaalf vingers en twaalf tenen:</text><text x="68" y="903" class="body">vierentwintig samen.</text><text x="46" y="996" class="note">Lachmi is de broer van Goliath; de naamloze man</text><text x="46" y="1032" class="note">krijgt geen verzonnen eigennaam of extra</text><text x="46" y="1068" class="note">ledematen.</text></svg>