<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Voorraad voor de bouw</title><desc id="desc">De genoemde materialen, hoeveelheden en vaklieden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Voorraad voor de bouw</text><text x="44" y="113" class="ref">1 Kronieken 22:2–5, 14–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Steen en hout</text><text x="68" y="241" class="body">Steenhouwers bereiden stenen; cederhout</text><text x="68" y="284" class="body">komt uit Sidon en Tyrus.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">IJzer en koper</text><text x="68" y="433" class="body">IJzer voor spijkers en poortbeslagen;</text><text x="68" y="476" class="body">koper in onmeetbare hoeveelheid.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Goud en zilver</text><text x="68" y="625" class="body">Ongeveer 3.400 ton goud en 34.000 ton</text><text x="68" y="668" class="body">zilver volgens de omrekening in deze</text><text x="68" y="711" class="body">vertaling.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vaklieden</text><text x="68" y="860" class="body">Steenhouwers, steen- en houtbewerkers</text><text x="68" y="903" class="body">en allerlei bekwame werklieden.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Nog aanvullen</text><text x="68" y="1052" class="body">Salomo moet zelf meer toevoegen en aan</text><text x="68" y="1095" class="body">het werk gaan.</text><text x="46" y="1188" class="note">Deze voorraad is een voorbereiding; het</text><text x="46" y="1224" class="note">heiligdom staat hier nog niet voltooid.</text></svg>