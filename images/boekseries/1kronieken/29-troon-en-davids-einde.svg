<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">De troon en Davids einde</title><desc id="desc">De afloop van de vergadering, koningswisseling en samenvatting van Davids leven.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De troon en Davids einde</text><text x="44" y="113" class="ref">1 Kronieken 29:21–30</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De volgende morgen</text><text x="68" y="241" class="body">Offers en een vreugdevolle maaltijd.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Tweede aanstelling</text><text x="68" y="390" class="body">Salomo wordt opnieuw koning en gezalfd;</text><text x="68" y="433" class="body">ook Zadok wordt tot priester gezalfd.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Erkenning</text><text x="68" y="582" class="body">Leiders, helden en Davids zonen</text><text x="68" y="625" class="body">onderwerpen zich aan Salomo.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Davids regering</text><text x="68" y="774" class="body">Veertig jaar: zeven in Hebron en 33 in</text><text x="68" y="817" class="body">Jeruzalem; hij sterft op hoge leeftijd.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De beschreven geschiedenis</text><text x="68" y="966" class="body">Geschriften van Samuël, Nathan en Gad</text><text x="68" y="1009" class="body">worden genoemd.</text><text x="46" y="1102" class="note">De troonovergang en Davids overlijden worden als</text><text x="46" y="1138" class="note">afzonderlijke fasen beschreven; de bron noemt</text><text x="46" y="1174" class="note">geen sterfbedgesprek.</text></svg>