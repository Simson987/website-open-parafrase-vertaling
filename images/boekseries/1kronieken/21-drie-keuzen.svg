<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Gads drie voorgestelde keuzen</title><desc id="desc">De drie alternatieven met de exacte duur en Davids antwoord.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gads drie voorgestelde keuzen</text><text x="44" y="113" class="ref">1 Kronieken 21:9–14</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Drie jaar</text><text x="68" y="241" class="body">Honger.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Drie maanden</text><text x="68" y="390" class="body">Vluchten voor tegenstanders en hun</text><text x="68" y="433" class="body">zwaard.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Drie dagen</text><text x="68" y="582" class="body">Pest in het land en verderf door de</text><text x="68" y="625" class="body">engel van de HEERE.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Davids antwoord</text><text x="68" y="774" class="body">Hij valt liever in de hand van de HEERE</text><text x="68" y="817" class="body">vanwege Zijn grote barmhartigheid dan</text><text x="68" y="860" class="body">in de hand van mensen.</text><text x="46" y="953" class="note">Drie verschillende tijdseenheden: jaren, maanden</text><text x="46" y="989" class="note">en dagen. De pest volgt daarna in het verslag.</text></svg>