<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Schatten en toezicht</title><desc id="desc">Bewaring, herkomst en verschillende toezichtgebieden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schatten en toezicht</text><text x="44" y="113" class="ref">1 Kronieken 26:20–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voorraad van het huis</text><text x="68" y="241" class="body">Ahia; ook Zetham en Joël uit Jehiëli’s</text><text x="68" y="284" class="body">familie worden genoemd.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Sebuël en Selomith</text><text x="68" y="433" class="body">Sebuël leidt de schatten; Selomith en</text><text x="68" y="476" class="body">zijn verwanten beheren gewijde buit en</text><text x="68" y="519" class="body">gaven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wat is gewijd?</text><text x="68" y="668" class="body">Gaven van David, aanvoerders, Samuël,</text><text x="68" y="711" class="body">Saul, Abner en Joab voor onderhoud.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Buiten het heiligdom</text><text x="68" y="860" class="body">Chenanja en zijn zonen zijn opzichters</text><text x="68" y="903" class="body">en rechters.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">West en oost</text><text x="68" y="1052" class="body">Hasabja met 1.700 ten westen van de</text><text x="68" y="1095" class="body">Jordaan; Jeria’s 2.700 familiehoofden</text><text x="68" y="1138" class="body">over Ruben, Gad en half Manasse.</text><text x="46" y="1231" class="note">Schatbeheer en bestuurlijke taken worden</text><text x="46" y="1267" class="note">onderscheiden; de twee aantallen horen bij</text><text x="46" y="1303" class="note">verschillende gebieden.</text></svg>