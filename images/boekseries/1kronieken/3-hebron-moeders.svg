<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1173" viewBox="0 0 840 1173"><title>Davids zes zonen in Hebron</title><rect width="840" height="1173" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Davids zes zonen in Hebron</text><text x="42" y="105" font-size="25">1 Kronieken 3:1–4</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">David</text><path d="M470 215 V235 H75 V984.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 311.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Amnon</text><text x="175" y="337" font-size="29">Moeder: Ahinoam uit Jizreël.</text><path d="M75 438.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="387" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="424" font-size="31" font-weight="700">Daniël</text><text x="175" y="464" font-size="29">Moeder: Abigaïl uit Karmel.</text><path d="M75 584.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="514" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="551" font-size="31" font-weight="700">Absalom</text><text x="175" y="591" font-size="29">Moeder: Maächa, dochter van Thalmai,</text><text x="175" y="629" font-size="29">koning van Gesur.</text><path d="M75 730.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="679" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="716" font-size="31" font-weight="700">Adonia</text><text x="175" y="756" font-size="29">Moeder: Haggith.</text><path d="M75 857.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="806" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="843" font-size="31" font-weight="700">Sefatja</text><text x="175" y="883" font-size="29">Moeder: Abital.</text><path d="M75 984.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="933" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="970" font-size="31" font-weight="700">Jithream</text><text x="175" y="1010" font-size="29">Moeder: Egla, Davids vrouw.</text><text x="42" y="1082" font-size="26">De volgorde volgt de zes in Hebron geboren</text><text x="42" y="1116" font-size="26">zonen. De zoon heet in deze lijst Daniël.</text></g></svg>