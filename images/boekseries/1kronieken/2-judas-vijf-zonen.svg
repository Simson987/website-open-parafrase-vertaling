<svg xmlns="http://www.w3.org/2000/svg" width="840" height="737" viewBox="0 0 840 737"><title>Juda’s vijf zonen</title><rect width="840" height="737" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Juda’s vijf zonen</text><text x="42" y="105" font-size="25">1 Kronieken 2:3–5</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Juda</text><path d="M470 215 V235 H75 V495.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 330.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Er, Onan en Sela</text><text x="175" y="337" font-size="29">Bij de dochter van Sua; Er wordt wegens</text><text x="175" y="375" font-size="29">kwaad gedood.</text><path d="M75 495.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="425" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="462" font-size="31" font-weight="700">Perez en Zerah</text><text x="175" y="502" font-size="29">Bij Thamar, Juda’s schoondochter. Perez</text><text x="175" y="540" font-size="29">krijgt Hezron en Hamul.</text><text x="42" y="612" font-size="26">De vijf namen zijn Juda’s zonen; Perez en Zerah</text><text x="42" y="646" font-size="26">worden niet als kinderen van Er of Onan</text><text x="42" y="680" font-size="26">getekend.</text></g></svg>