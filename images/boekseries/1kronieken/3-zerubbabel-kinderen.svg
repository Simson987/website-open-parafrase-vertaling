<svg xmlns="http://www.w3.org/2000/svg" width="840" height="699" viewBox="0 0 840 699"><title>Zerubbabels kinderen</title><rect width="840" height="699" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Zerubbabels kinderen</text><text x="42" y="105" font-size="25">1 Kronieken 3:19–20</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Zerubbabel, zoon van Pedaja</text><path d="M470 215 V235 H75 V457.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 311.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Mesullam en Hananja</text><text x="175" y="337" font-size="29">Als zonen genoemd; Selomith is hun zus.</text><path d="M75 457.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="387" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="424" font-size="31" font-weight="700">Nog vijf kinderen</text><text x="175" y="464" font-size="29">Hasuba, Ohel, Berechja, Hasadja en</text><text x="175" y="502" font-size="29">Jusabhesed.</text><text x="42" y="574" font-size="26">De vijf uit vers 20 komen naast de drie uit vers</text><text x="42" y="608" font-size="26">19. Dit hoofdstuk noemt Pedaja als vader van</text><text x="42" y="642" font-size="26">Zerubbabel.</text></g></svg>