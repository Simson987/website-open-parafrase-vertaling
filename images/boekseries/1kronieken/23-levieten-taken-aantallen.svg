<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">38.000 Levieten, vier taken</title><desc id="desc">Vier aantallen en taken die exact optellen tot de genoemde groep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">38.000 Levieten, vier taken</text><text x="44" y="113" class="ref">1 Kronieken 23:3–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">24.000</text><text x="68" y="241" class="body">Toezicht op het werk in het huis van de</text><text x="68" y="284" class="body">HEERE.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">6.000</text><text x="68" y="433" class="body">Opzichters en rechters.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">4.000</text><text x="68" y="582" class="body">Poortwachters.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">4.000</text><text x="68" y="731" class="body">Lofzang met de door David gemaakte</text><text x="68" y="774" class="body">instrumenten.</text><text x="46" y="867" class="note">24.000 + 6.000 + 4.000 + 4.000 = 38.000. Deze</text><text x="46" y="903" class="note">telling begint in vers 3 bij dertig jaar.</text></svg>