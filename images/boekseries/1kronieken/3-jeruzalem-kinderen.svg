<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Davids kinderen in Jeruzalem</title><desc id="desc">De twee groepen en de herhaalde namen zonder weggevallen kinderen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Davids kinderen in Jeruzalem</text><text x="44" y="113" class="ref">1 Kronieken 3:5–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij Bath-Sua</text><text x="68" y="241" class="body">Simea, Sobab, Nathan en Salomo.</text><text x="68" y="284" class="body">Bath-Sua is dochter van Ammiël.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nog negen zonen</text><text x="68" y="433" class="body">Jibchar, Elisama, Elifelet, Nogah,</text><text x="68" y="476" class="body">Nefeg, Jafia, Elisama, Eljada en</text><text x="68" y="519" class="body">Elifelet.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verdere kinderen</text><text x="68" y="668" class="body">Ook zonen bij bijvrouwen; Thamar is hun</text><text x="68" y="711" class="body">zus.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De regeringsduur</text><text x="68" y="860" class="body">Hebron: zeven jaar en zes maanden;</text><text x="68" y="903" class="body">Jeruzalem: 33 jaar.</text><text x="46" y="996" class="note">Elisama en Elifelet staan elk tweemaal in de</text><text x="46" y="1032" class="note">negen namen. De schrijfwijzen en herhalingen van</text><text x="46" y="1068" class="note">deze tekst blijven zichtbaar.</text></svg>