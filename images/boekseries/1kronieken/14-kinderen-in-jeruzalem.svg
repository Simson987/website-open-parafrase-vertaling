<svg xmlns="http://www.w3.org/2000/svg" width="840" height="813" viewBox="0 0 840 813" role="img" aria-labelledby="title desc"><title id="title">Dertien zonen in Jeruzalem</title><desc id="desc">Alle dertien zonen met de bronspelling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="813" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dertien zonen in Jeruzalem</text><text x="44" y="113" class="ref">1 Kronieken 14:4–7</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste vier</text><text x="68" y="241" class="body">Sammua, Sobab, Nathan en Salomo.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Volgende vier</text><text x="68" y="390" class="body">Jibchar, Elisua, Elpelet en Nogah.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Laatste vijf</text><text x="68" y="539" class="body">Nefeg, Jafia, Elisama, Beëljada en</text><text x="68" y="582" class="body">Elifelet.</text><text x="46" y="675" class="note">De schrijfwijzen van dit hoofdstuk blijven</text><text x="46" y="711" class="note">behouden; Elpelet en Elifelet zijn twee</text><text x="46" y="747" class="note">afzonderlijk genoemde namen.</text></svg>