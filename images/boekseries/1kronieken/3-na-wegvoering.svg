<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Na de wegvoering</title><desc id="desc">De latere familienamen en een expliciet zichtbaar telverschil in de bron.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Na de wegvoering</text><text x="44" y="113" class="ref">1 Kronieken 3:15–24</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Josia’s zonen</text><text x="68" y="241" class="body">Johanan, Jojakim, Zedekia en Sallum.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Jechonia’s familie</text><text x="68" y="390" class="body">Jechonia, zoon van Jojakim, is</text><text x="68" y="433" class="body">weggevoerd; Sealthiël en Pedaja horen</text><text x="68" y="476" class="body">bij zijn nakomelingen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Pedaja</text><text x="68" y="625" class="body">Zerubbabel en Simeï.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Latere groepen</text><text x="68" y="774" class="body">Hananja’s zonen Pelatja en Jesaja;</text><text x="68" y="817" class="body">families van Refaja, Arnan, Obadja en</text><text x="68" y="860" class="body">Sechanja.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Nearja en Eljoënai</text><text x="68" y="1009" class="body">Nearja: Eljoënai, Hizkia en Azrikam.</text><text x="68" y="1052" class="body">Eljoënai: Hodajeva, Eljasib, Pelaja,</text><text x="68" y="1095" class="body">Akkub, Johanan, Delaja en Anani.</text><text x="46" y="1188" class="note">De tekst noemt in vers 22 vijf zonen bij de</text><text x="46" y="1224" class="note">formulering zes in totaal. Er wordt geen</text><text x="46" y="1260" class="note">ontbrekende naam bij verzonnen.</text></svg>