<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1475" viewBox="0 0 840 1475" role="img" aria-labelledby="title desc"><title id="title">Leiders van de stammen</title><desc id="desc">Alle genoemde stamleiders zonder ontbrekende stammen aan te vullen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1475" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leiders van de stammen</text><text x="44" y="113" class="ref">1 Kronieken 27:16–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben en Simeon</text><text x="68" y="241" class="body">Eliëzer, zoon van Zichri; Sefatja, zoon</text><text x="68" y="284" class="body">van Maächa.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Levi, Aäron en Juda</text><text x="68" y="433" class="body">Hasabja, zoon van Kemuël; Zadok; Elihu,</text><text x="68" y="476" class="body">Davids broer.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Issaschar en Zebulon</text><text x="68" y="625" class="body">Omri, zoon van Michaël; Jismaja, zoon</text><text x="68" y="668" class="body">van Obadja.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nafthali en Efraïm</text><text x="68" y="817" class="body">Jerimoth, zoon van Azriël; Hosea, zoon</text><text x="68" y="860" class="body">van Azazja.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Manasse west en oost</text><text x="68" y="1009" class="body">Joël, zoon van Pedaja; Jiddo, zoon van</text><text x="68" y="1052" class="body">Zecharja.</text><rect x="42" y="1110" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1153" class="label">Benjamin en Dan</text><text x="68" y="1201" class="body">Jaäsiël, zoon van Abner; Azarel, zoon</text><text x="68" y="1244" class="body">van Jeroham.</text><text x="46" y="1337" class="note">De tekst noemt niet iedere stam in deze lijst.</text><text x="46" y="1373" class="note">Joabs telling werd niet voltooid; mannen van</text><text x="46" y="1409" class="note">twintig en jonger waren uitgesloten.</text></svg>