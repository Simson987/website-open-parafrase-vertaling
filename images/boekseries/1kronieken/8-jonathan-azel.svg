<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1202" viewBox="0 0 840 1202"><title>Van Jonathan tot Azel</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="1202" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Van Jonathan tot Azel</text><text x="42" y="105" font-size="25">1 Kronieken 8:34–38</text><rect x="150" y="155" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="191" text-anchor="middle" font-size="31">Jonathan</text><path d="M420 209 V229" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="235" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="271" text-anchor="middle" font-size="31">Merib-Baäl</text><path d="M420 289 V309" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="315" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="351" text-anchor="middle" font-size="31">Micha</text><path d="M420 369 V389" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="395" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="431" text-anchor="middle" font-size="31">Achaz</text><path d="M420 449 V469" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="475" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="511" text-anchor="middle" font-size="31">Jehoadda</text><path d="M420 529 V549" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="555" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="591" text-anchor="middle" font-size="31">Zimri</text><path d="M420 609 V629" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="635" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="671" text-anchor="middle" font-size="31">Moza</text><path d="M420 689 V709" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="715" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="751" text-anchor="middle" font-size="31">Bina</text><path d="M420 769 V789" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="795" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="831" text-anchor="middle" font-size="31">Rafa</text><path d="M420 849 V869" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="875" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="911" text-anchor="middle" font-size="31">Elasa</text><path d="M420 929 V949" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="955" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="991" text-anchor="middle" font-size="31">Azel</text><text x="42" y="1055" font-size="26">Gekozen lijn: Alemeth en Azmaveth zijn broers</text><text x="42" y="1089" font-size="26">van Zimri. Azel heeft Azrikam, Bochru, Ismaël,</text><text x="42" y="1123" font-size="26">Searja, Obadja en Hanan.</text></g></svg>