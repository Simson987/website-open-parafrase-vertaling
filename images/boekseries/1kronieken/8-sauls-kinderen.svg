<svg xmlns="http://www.w3.org/2000/svg" width="840" height="915" viewBox="0 0 840 915"><title>Saul en zijn kinderen</title><rect width="840" height="915" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Saul en zijn kinderen</text><text x="42" y="105" font-size="25">1 Kronieken 8:33–35</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Saul, zoon van Kis</text><path d="M470 215 V235 H75 V692.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 311.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Jonathan</text><text x="175" y="337" font-size="29">Zijn zoon Merib-Baäl krijgt Micha.</text><path d="M75 438.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="387" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="424" font-size="31" font-weight="700">Malchi-Sua</text><text x="175" y="464" font-size="29">Zoon van Saul.</text><path d="M75 565.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="514" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="551" font-size="31" font-weight="700">Abinadab</text><text x="175" y="591" font-size="29">Zoon van Saul.</text><path d="M75 692.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="641" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="678" font-size="31" font-weight="700">Esbaäl</text><text x="175" y="718" font-size="29">Zoon van Saul.</text><text x="42" y="790" font-size="26">Ner is Kis’ vader. De vier vakken zijn Sauls</text><text x="42" y="824" font-size="26">zonen; Micha hoort twee generaties na Jonathan</text><text x="42" y="858" font-size="26">in deze reeks.</text></g></svg>