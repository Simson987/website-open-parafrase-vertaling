<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Terugkeer en dienstgroepen</title><desc id="desc">Stammen, dienstgroepen en onderscheiden aantallen bij de terugkeer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Terugkeer en dienstgroepen</text><text x="44" y="113" class="ref">1 Kronieken 9:2–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste teruggekeerden</text><text x="68" y="241" class="body">Israëlieten, priesters, Levieten en</text><text x="68" y="284" class="body">tempeldienaren op hun eigen bezit.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">In Jeruzalem</text><text x="68" y="433" class="body">Mensen uit Juda, Benjamin, Efraïm en</text><text x="68" y="476" class="body">Manasse.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De getelde groepen</text><text x="68" y="625" class="body">Bij Juda 690; Benjamin 956; priesters</text><text x="68" y="668" class="body">1.760.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Poortwachters</text><text x="68" y="817" class="body">Sallum, Akkub, Talmon en Ahiman; Sallum</text><text x="68" y="860" class="body">is hun hoofd.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De selectie</text><text x="68" y="1009" class="body">212 mannen; door David en Samuël de</text><text x="68" y="1052" class="body">taak toevertrouwd.</text><text x="46" y="1145" class="note">Deze aantallen horen bij verschillende genoemde</text><text x="46" y="1181" class="note">groepen en zijn niet één totaal van alle</text><text x="46" y="1217" class="note">teruggekeerden.</text></svg>