<svg xmlns="http://www.w3.org/2000/svg" width="840" height="775" viewBox="0 0 840 775"><title>Aser en zijn nakomelingen</title><rect width="840" height="775" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Aser en zijn nakomelingen</text><text x="42" y="105" font-size="25">1 Kronieken 7:30–40</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Aser</text><path d="M470 215 V235 H75 V495.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 311.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Jimna, Jisva en Jisvi</text><text x="175" y="337" font-size="29">Als zonen genoemd; Sera is hun zus.</text><path d="M75 495.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="387" width="640" height="217" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="424" font-size="31" font-weight="700">Beria</text><text x="175" y="464" font-size="29">Zonen Heber en Malchiël. Malchiël is</text><text x="175" y="502" font-size="29">vader van Birzavith. Heber krijgt</text><text x="175" y="540" font-size="29">Jaflet, Somer en Hotham, en hun zus</text><text x="175" y="578" font-size="29">Sua.</text><text x="42" y="650" font-size="26">Het hoofdstuk noemt bij de geslachtsregisters</text><text x="42" y="684" font-size="26">van Aser 26.000 strijdbare mannen. Beria in</text><text x="42" y="718" font-size="26">Efraïms verhaal is een naamgenoot.</text></g></svg>