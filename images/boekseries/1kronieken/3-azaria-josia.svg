 rx="12" fill="white" stroke="#92a18e"/><text x="420" y="671" text-anchor="middle" font-size="31">Josia</text><text x="42" y="735" font-size="26">Josia krijgt Johanan, Jojakim, Zedekia en</text><text x="42" y="769" font-size="26">Sallum. Deze vier zijn broers, geen vier</text><text x="42" y="803" font-size="26">opeenvolgende generaties.</text></g></svg>