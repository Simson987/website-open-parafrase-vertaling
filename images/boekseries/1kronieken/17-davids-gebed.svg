<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Davids antwoord in gebed</title><desc id="desc">De opbouw van Davids antwoord in gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Davids antwoord in gebed</text><text x="44" y="113" class="ref">1 Kronieken 17:16–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verwondering</text><text x="68" y="241" class="body">Wie ben ik, en wat is mijn huis, dat U</text><text x="68" y="284" class="body">mij zo ver gebracht hebt?</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Erkenning</text><text x="68" y="433" class="body">God kent Zijn dienaar; Zijn grote daden</text><text x="68" y="476" class="body">en de uittocht maken Hem bekend.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De belofte</text><text x="68" y="625" class="body">Laat Uw woord over Uw dienaar en zijn</text><text x="68" y="668" class="body">huis bevestigd worden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Naam en zegen</text><text x="68" y="817" class="body">Laat Uw naam groot zijn en het huis van</text><text x="68" y="860" class="body">Uw dienaar blijvend gezegend.</text><text x="46" y="953" class="note">David antwoordt op de belofte met verwondering,</text><text x="46" y="989" class="note">dank, erkenning en een beroep op Gods eigen</text><text x="46" y="1025" class="note">woord.</text></svg>