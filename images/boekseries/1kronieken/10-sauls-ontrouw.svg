<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">De uitleg van Sauls einde</title><desc id="desc">De redenen die de verteller zelf bij de overgang van het koningschap noemt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De uitleg van Sauls einde</text><text x="44" y="113" class="ref">1 Kronieken 10:13–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het oordeel</text><text x="68" y="241" class="body">Saul was de HEERE ontrouw en hield zich</text><text x="68" y="284" class="body">niet aan Zijn woord.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De raadpleging</text><text x="68" y="433" class="body">Hij liet een geest van een dode</text><text x="68" y="476" class="body">oproepen om raad te vragen.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het gemiste zoeken</text><text x="68" y="625" class="body">Hij zocht de HEERE niet.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De overgang</text><text x="68" y="774" class="body">God geeft het koningschap aan David,</text><text x="68" y="817" class="body">zoon van Isaï.</text><text x="46" y="910" class="note">Dit is de expliciete uitleg van de verteller bij</text><text x="46" y="946" class="note">het historische verslag, geen uitspraak van de</text><text x="46" y="982" class="note">Filistijnen.</text></svg>