<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Steden voor Gerson en Merari</title><desc id="desc">Toewijzende stammen, aantallen en geselecteerde stadsnamen voor de andere Levieten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Steden voor Gerson en Merari</text><text x="44" y="113" class="ref">1 Kronieken 6:62–63, 71–81</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gerson: dertien steden</text><text x="68" y="241" class="body">Uit Issaschar, Aser, Nafthali en</text><text x="68" y="284" class="body">Manasse in Basan.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Voorbeelden bij Gerson</text><text x="68" y="433" class="body">Golan, Astharoth, Kedes, Dobrath,</text><text x="68" y="476" class="body">Ramoth, Anem, Masal, Abdon, Hukok,</text><text x="68" y="519" class="body">Rehob, Hammon en Kirjathaim.</text><rect x="42" y="577" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Merari: twaalf steden</text><text x="68" y="668" class="body">Uit Ruben, Gad en Zebulon.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Voorbeelden bij Merari</text><text x="68" y="817" class="body">Rimmono, Thabor, Bezer, Jahza,</text><text x="68" y="860" class="body">Kedemoth, Mefaath, Ramoth in Gilead,</text><text x="68" y="903" class="body">Mahanaïm, Hesbon en Jaëzer.</text><text x="46" y="996" class="note">De namen Ramoth en Kedes komen met verschillende</text><text x="46" y="1032" class="note">gebiedsaanduidingen voor. Elk genoemde stad</text><text x="46" y="1068" class="note">heeft weidegronden.</text></svg>