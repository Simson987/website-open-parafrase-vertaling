<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Drie oostelijke stamgroepen</title><desc id="desc">Gebieden, aantallen en het verschil tussen hulp en later oordeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie oostelijke stamgroepen</text><text x="44" y="113" class="ref">1 Kronieken 5:11–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gad</text><text x="68" y="241" class="body">In Basan tot Salcha; Joël en Safam</text><text x="68" y="284" class="body">vooraan genoemd; registratie onder</text><text x="68" y="327" class="body">Jotham en Jerobeam.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Ruben, Gad en half Manasse</text><text x="68" y="476" class="body">44.760 geoefende soldaten; roepen God</text><text x="68" y="519" class="body">aan en ontvangen hulp tegen Hagarenen</text><text x="68" y="562" class="body">en bondgenoten.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De buit</text><text x="68" y="711" class="body">50.000 kamelen, 250.000 schapen, 2.000</text><text x="68" y="754" class="body">ezels en 100.000 gevangenen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Half Manasse</text><text x="68" y="903" class="body">Van Basan tot Baäl-Hermon, Senir en</text><text x="68" y="946" class="body">Hermon; zeven familiehoofden genoemd.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Latere ontrouw en ballingschap</text><text x="68" y="1095" class="body">Naar Halah, Habor, Hara en de Gozan</text><text x="68" y="1138" class="body">weggevoerd.</text><text x="46" y="1231" class="note">De eerdere overwinning en de latere wegvoering</text><text x="46" y="1267" class="note">staan als afzonderlijke fasen in hetzelfde</text><text x="46" y="1303" class="note">hoofdstuk.</text></svg>