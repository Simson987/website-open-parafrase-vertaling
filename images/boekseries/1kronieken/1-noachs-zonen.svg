<svg xmlns="http://www.w3.org/2000/svg" width="840" height="864" viewBox="0 0 840 864"><title>De drie takken na Noach</title><rect width="840" height="864" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">De drie takken na Noach</text><text x="42" y="105" font-size="25">1 Kronieken 1:4–17</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Noach</text><path d="M470 215 V235 H75 V622.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 330.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Sem</text><text x="175" y="337" font-size="29">Elam, Assur, Arfachsad, Lud en Aram</text><text x="175" y="375" font-size="29">worden bij Sem genoemd.</text><path d="M75 476.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="425" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="462" font-size="31" font-weight="700">Cham</text><text x="175" y="502" font-size="29">Cusch, Mitsraim, Put en Kanaän.</text><path d="M75 622.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="552" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="589" font-size="31" font-weight="700">Jafeth</text><text x="175" y="629" font-size="29">Gomer, Magog, Madai, Javan, Tubal,</text><text x="175" y="667" font-size="29">Mesech en Tiras.</text><text x="42" y="739" font-size="26">De drie verbonden hoofdtakken zijn broers. De</text><text x="42" y="773" font-size="26">verdere namen in elk vak zijn de daar genoemde</text><text x="42" y="807" font-size="26">nakomelingen.</text></g></svg>