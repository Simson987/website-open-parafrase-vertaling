<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Rabba: belegering en nasleep</title><desc id="desc">Afzonderlijke momenten rond Rabba met de beschreven dwang zichtbaar in woorden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rabba: belegering en nasleep</text><text x="44" y="113" class="ref">1 Kronieken 20:1–3</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het voorjaar</text><text x="68" y="241" class="body">Joab belegerde Rabba; David bleef in</text><text x="68" y="284" class="body">Jeruzalem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Na de inname</text><text x="68" y="433" class="body">David neemt de kostbare kroon en de</text><text x="68" y="476" class="body">buit mee.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De inwoners</text><text x="68" y="625" class="body">Zij worden weggevoerd voor arbeid met</text><text x="68" y="668" class="body">zagen, ijzeren sleden en bijlen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Terugkeer</text><text x="68" y="817" class="body">David en zijn volk keren terug naar</text><text x="68" y="860" class="body">Jeruzalem.</text><text x="46" y="953" class="note">De dwangarbeid wordt benoemd; de inname wordt</text><text x="46" y="989" class="note">niet als een vrijwillig bouwproject voorgesteld.</text></svg>