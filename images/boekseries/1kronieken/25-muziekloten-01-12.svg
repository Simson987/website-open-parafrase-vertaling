<svg xmlns="http://www.w3.org/2000/svg" width="840" height="919" viewBox="0 0 840 919" role="img" aria-labelledby="title desc"><title id="title">Muziekgroepen 1 tot 12</title><desc id="desc">De eerste twaalf muzikale dienstafdelingen in exacte volgorde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="919" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Muziekgroepen 1 tot 12</text><text x="44" y="113" class="ref">1 Kronieken 25:9–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–3</text><text x="68" y="241" class="body">Jozef; Gedalja; Zakkur.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">4–6</text><text x="68" y="390" class="body">Jizri; Nethanja; Bukkia.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">7–9</text><text x="68" y="539" class="body">Jesarela; Jesaja; Mattanja.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">10–12</text><text x="68" y="688" class="body">Simeï; Azareël; Hasabja.</text><text x="46" y="781" class="note">Dit is dienstvolgorde, geen stamboom. De</text><text x="46" y="817" class="note">familieleden en zonen dienen mee in groepen van</text><text x="46" y="853" class="note">twaalf.</text></svg>