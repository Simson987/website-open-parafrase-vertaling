<svg xmlns="http://www.w3.org/2000/svg" width="840" height="902" viewBox="0 0 840 902"><title>Isaï’s zonen en dochters</title><rect width="840" height="902" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Isaï’s zonen en dochters</text><text x="42" y="105" font-size="25">1 Kronieken 2:13–17</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Isaï</text><path d="M470 215 V235 H75 V660.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 330.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Zeven zonen</text><text x="175" y="337" font-size="29">Eliab, Abinadab, Simea, Nethaneël,</text><text x="175" y="375" font-size="29">Raddai, Ozem en David.</text><path d="M75 495.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="425" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="462" font-size="31" font-weight="700">Zeruja</text><text x="175" y="502" font-size="29">Zus van de zonen; moeder van Abisai,</text><text x="175" y="540" font-size="29">Joab en Asa-El.</text><path d="M75 660.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="590" width="640" height="141" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="627" font-size="31" font-weight="700">Abigaïl</text><text x="175" y="667" font-size="29">Hun zus; moeder van Amasa, met Jether</text><text x="175" y="705" font-size="29">de Ismaëliet als vader.</text><text x="42" y="777" font-size="26">Abisai, Joab, Asa-El en Amasa horen bij de</text><text x="42" y="811" font-size="26">volgende generatie. Deze Abigaïl wordt niet</text><text x="42" y="845" font-size="26">zonder bron aan een naamgenoot gelijkgesteld.</text></g></svg>