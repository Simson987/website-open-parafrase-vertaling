<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Familietakken in dit register</title><desc id="desc">Familietakken en naamgenoten met alleen de genoemde relaties.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Familietakken in dit register</text><text x="44" y="113" class="ref">1 Kronieken 23:6–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Gerson</text><text x="68" y="241" class="body">Ladan en Simeï; bij Ladan Jehiël,</text><text x="68" y="284" class="body">Zetham en Joël. Jeüs en Beria gelden</text><text x="68" y="327" class="body">samen als één familie.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Kehath</text><text x="68" y="476" class="body">Amram, Jizhar, Hebron en Uzziël. Amram</text><text x="68" y="519" class="body">heeft Aäron en Mozes.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Mozes</text><text x="68" y="668" class="body">Gersom → Sebuël; Eliëzer → Rehabja.</text><text x="68" y="711" class="body">Mozes’ nakomelingen worden tot Levi</text><text x="68" y="754" class="body">gerekend.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Merari</text><text x="68" y="903" class="body">Maheli en Musi. Maheli heeft Eleazar en</text><text x="68" y="946" class="body">Kis; Musi heeft Maheli, Eder en</text><text x="68" y="989" class="body">Jeremoth.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Eleazars dochters</text><text x="68" y="1138" class="body">Hij heeft geen zonen; zijn dochters</text><text x="68" y="1181" class="body">trouwen met de zonen van Kis.</text><text x="46" y="1274" class="note">Gersom, zoon van Mozes, is niet Gerson, zoon van</text><text x="46" y="1310" class="note">Levi. Zina en Zizza zijn de twee vormen in vers</text><text x="46" y="1346" class="note">10 en 11.</text></svg>