<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Bestuur onder David</title><desc id="desc">De ambten met de exacte namen en vaders in de bron.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bestuur onder David</text><text x="44" y="113" class="ref">1 Kronieken 18:14–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">David</text><text x="68" y="241" class="body">Recht en gerechtigheid voor zijn volk.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Joab en Josafat</text><text x="68" y="390" class="body">Joab over het leger; Josafat, zoon van</text><text x="68" y="433" class="body">Ahilud, kanselier.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De priesters</text><text x="68" y="582" class="body">Zadok, zoon van Ahitub, en Abimelech,</text><text x="68" y="625" class="body">zoon van Abjathar.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Sausa en Benaja</text><text x="68" y="774" class="body">Sausa is schrijver; Benaja, zoon van</text><text x="68" y="817" class="body">Jojada, over de Krethi en de Plethi.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Davids zonen</text><text x="68" y="966" class="body">De eersten naast de koning.</text><text x="46" y="1059" class="note">De priesternaam is hier Abimelech volgens dit</text><text x="46" y="1095" class="note">hoofdstuk; afstamming en ambt worden apart</text><text x="46" y="1131" class="note">vermeld.</text></svg>