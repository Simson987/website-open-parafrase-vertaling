<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Twee fronten bij Ammon</title><desc id="desc">De twee vijanden, beide bevelhebbers en hun afspraak.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee fronten bij Ammon</text><text x="44" y="113" class="ref">1 Kronieken 19:9–15</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ammonieten</text><text x="68" y="241" class="body">Stellen zich bij de stadspoort op.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Syrische huurlingen</text><text x="68" y="390" class="body">Staan afzonderlijk in het veld.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Joab</text><text x="68" y="539" class="body">Kiest mannen en stelt zich tegen de</text><text x="68" y="582" class="body">Syriërs op.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Abisai</text><text x="68" y="731" class="body">Leidt de overige troepen tegen de</text><text x="68" y="774" class="body">Ammonieten.</text><rect x="42" y="832" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Wederzijdse hulp</text><text x="68" y="923" class="body">Als één front te sterk wordt, helpt de</text><text x="68" y="966" class="body">andere groep. De Syriërs vluchten;</text><text x="68" y="1009" class="body">Ammon trekt de stad in.</text><text x="46" y="1102" class="note">Tactisch tekstschema, geen kaart op schaal; de</text><text x="46" y="1138" class="note">legers worden niet aan verzonnen windrichtingen</text><text x="46" y="1174" class="note">gekoppeld.</text></svg>