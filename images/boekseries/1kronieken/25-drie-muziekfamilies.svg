<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Drie muziekfamilies</title><desc id="desc">Families, aantallen en het zichtbare telverschil in de bron.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie muziekfamilies</text><text x="44" y="113" class="ref">1 Kronieken 25:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Asaf</text><text x="68" y="241" class="body">Zakkur, Jozef, Nethanja en Asarela;</text><text x="68" y="284" class="body">onder Asaf en de koning.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jeduthun</text><text x="68" y="433" class="body">Gedalja, Zeri, Jesaja, Hasabja en</text><text x="68" y="476" class="body">Mattithja; de tekst zegt zes, maar</text><text x="68" y="519" class="body">noemt hier vijf namen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Heman</text><text x="68" y="668" class="body">Veertien zonen en drie dochters; de</text><text x="68" y="711" class="body">zonen worden in vers 4 genoemd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Geoefende zangers</text><text x="68" y="860" class="body">288 vakkundige zangers; loting voor</text><text x="68" y="903" class="body">jong en oud, meester en leerling.</text><text x="46" y="996" class="note">De ontbrekende zesde naam in vers 3 wordt niet</text><text x="46" y="1032" class="note">verzonnen; naamvormen verschillen tussen</text><text x="46" y="1068" class="note">familie- en lotenlijst.</text></svg>