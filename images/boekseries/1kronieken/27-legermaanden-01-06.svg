<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1260" viewBox="0 0 840 1260" role="img" aria-labelledby="title desc"><title id="title">Legerdienst, maanden 1–6</title><desc id="desc">De eerste zes maanden met correcte aanvoerders en opvolging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1260" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Legerdienst, maanden 1–6</text><text x="44" y="113" class="ref">1 Kronieken 27:1–9</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1: Jasobam</text><text x="68" y="241" class="body">Zoon van Zabdiël, uit Perez.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">2: Dodai</text><text x="68" y="390" class="body">Uit Ahoah; Mikloth als tweede man.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">3: Benaja</text><text x="68" y="539" class="body">Zoon van Jojada; zijn zoon Ammizabad</text><text x="68" y="582" class="body">leidt zijn afdeling.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">4: Asahel</text><text x="68" y="731" class="body">Joabs broer; daarna zijn zoon Zebadja.</text><rect x="42" y="789" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">5: Samhuth</text><text x="68" y="880" class="body">Uit de familie Jizrah.</text><rect x="42" y="938" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="981" class="label">6: Ira</text><text x="68" y="1029" class="body">Zoon van Ikkes, uit Thekoa.</text><text x="46" y="1122" class="note">Elke maandafdeling telt 24.000 man; afdelingen</text><text x="46" y="1158" class="note">lossen elkaar af, niet allemaal tegelijk in</text><text x="46" y="1194" class="note">maanddienst.</text></svg>