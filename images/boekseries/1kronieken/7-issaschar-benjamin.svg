<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Issaschar en Benjamin</title><desc id="desc">De takken en verschillende telgroepen in de eerste lijsten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Issaschar en Benjamin</text><text x="44" y="113" class="ref">1 Kronieken 7:1–13</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Issaschar</text><text x="68" y="241" class="body">Thola, Pua, Jasib en Simron. Bij Thola</text><text x="68" y="284" class="body">22.600; alle Issascharfamilies samen</text><text x="68" y="327" class="body">87.000 dappere mannen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Uzzi en Jizrahja</text><text x="68" y="476" class="body">Uzzi → Jizrahja; diens zonen Michaël,</text><text x="68" y="519" class="body">Obadja, Joël en Jisia; vijf hoofden met</text><text x="68" y="562" class="body">hun vader meegerekend.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Benjamin</text><text x="68" y="711" class="body">Bela, Becher en Jediael; de drie takken</text><text x="68" y="754" class="body">hebben 22.034, 20.200 en 17.200 mannen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Nafthali</text><text x="68" y="903" class="body">Jahziël, Guni, Jezer en Sallum;</text><text x="68" y="946" class="body">nakomelingen van Bilha.</text><text x="46" y="1039" class="note">Aantallen van deelgroepen worden niet bij hun</text><text x="46" y="1075" class="note">eigen stamtotalen opgeteld. De zoon Benjamin bij</text><text x="46" y="1111" class="note">Bilhan is een naamgenoot.</text></svg>