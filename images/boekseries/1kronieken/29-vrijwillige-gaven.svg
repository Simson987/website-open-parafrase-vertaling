<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Vrijwillige gaven en beheer</title><desc id="desc">Herkomst, hoeveelheden, beheer en de vrijwillige gezindheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vrijwillige gaven en beheer</text><text x="44" y="113" class="ref">1 Kronieken 29:2–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Davids voorbereiding</text><text x="68" y="241" class="body">Goud, zilver, koper, ijzer, hout,</text><text x="68" y="284" class="body">sierstenen en marmer.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Davids persoonlijke gave</text><text x="68" y="433" class="body">Ongeveer honderd ton goud uit Ofir en</text><text x="68" y="476" class="body">240 ton gezuiverd zilver, bovenop de</text><text x="68" y="519" class="body">voorbereiding.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De leiders</text><text x="68" y="668" class="body">Ongeveer 170 ton goud en 10.000 gouden</text><text x="68" y="711" class="body">munten; 340 ton zilver, 610 ton koper</text><text x="68" y="754" class="body">en 3.400 ton ijzer.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Edelstenen</text><text x="68" y="903" class="body">Onder beheer van Jehiël uit Gersons</text><text x="68" y="946" class="body">familie.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De gezindheid</text><text x="68" y="1095" class="body">Vrijwillig en met toegewijd hart; volk</text><text x="68" y="1138" class="body">en David zijn verheugd.</text><text x="46" y="1231" class="note">De afgeronde tonnen volgen deze vertaling.</text><text x="46" y="1267" class="note">Davids eigen gave en de gaven van leiders zijn</text><text x="46" y="1303" class="note">afzonderlijke groepen.</text></svg>