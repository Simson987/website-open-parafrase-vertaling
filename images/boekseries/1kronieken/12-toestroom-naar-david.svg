<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Van Ziklag naar Hebron</title><desc id="desc">Vier fasen van de toestroom met beeldspraak duidelijk onderscheiden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Ziklag naar Hebron</text><text x="44" y="113" class="ref">1 Kronieken 12:1–23, 38–40</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ziklag</text><text x="68" y="241" class="body">Benjaminieten met boog en slinger;</text><text x="68" y="284" class="body">David houdt zich nog voor Saul</text><text x="68" y="327" class="body">verborgen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De vesting</text><text x="68" y="476" class="body">Gadieten en later Benjaminieten en</text><text x="68" y="519" class="body">Judeeërs; Amasai spreekt trouw uit.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Manasse</text><text x="68" y="668" class="body">Mannen sluiten zich aan bij Davids</text><text x="68" y="711" class="body">terugkeer; de groep groeit dagelijks.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Hebron</text><text x="68" y="860" class="body">Stammen komen eensgezind om David</text><text x="68" y="903" class="body">koning te maken; drie dagen eten en</text><text x="68" y="946" class="body">drinken.</text><text x="46" y="1039" class="note">Dit zijn fasen en ontmoetingen; de gazellen en</text><text x="46" y="1075" class="note">leeuwen in vers 8 zijn vergelijkingen voor</text><text x="46" y="1111" class="note">snelheid en moed.</text></svg>