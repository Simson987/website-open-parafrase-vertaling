<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1217" viewBox="0 0 840 1217" role="img" aria-labelledby="title desc"><title id="title">De eerste twaalf loten</title><desc id="desc">Alle namen en volgordenummers van de eerste twaalf dienstafdelingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1217" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De eerste twaalf loten</text><text x="44" y="113" class="ref">1 Kronieken 24:7–12</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1 en 2</text><text x="68" y="241" class="body">Jojarib; Jedaja.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">3 en 4</text><text x="68" y="390" class="body">Harim; Seorim.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">5 en 6</text><text x="68" y="539" class="body">Malchia; Mijamin.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">7 en 8</text><text x="68" y="688" class="body">Hakkoz; Abia.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">9 en 10</text><text x="68" y="837" class="body">Jesua; Sechanja.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">11 en 12</text><text x="68" y="986" class="body">Eljasib; Jakim.</text><text x="46" y="1079" class="note">Volgorde van de dienstafdelingen, geen vader-</text><text x="46" y="1115" class="note">zoonketen. Het volgende schema begint bij het</text><text x="46" y="1151" class="note">dertiende lot.</text></svg>