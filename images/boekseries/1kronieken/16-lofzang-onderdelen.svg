<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De beweging van de lofzang</title><desc id="desc">Liedstructuur met historische herinnering, oproep en poëzie apart.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De beweging van de lofzang</text><text x="44" y="113" class="ref">1 Kronieken 16:8–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dank en herinnering</text><text x="68" y="241" class="body">Roep Zijn naam aan, vertel Zijn</text><text x="68" y="284" class="body">wonderen en zoek Zijn aangezicht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verbond</text><text x="68" y="433" class="body">Abraham, Izak en Jakob; beloofd land en</text><text x="68" y="476" class="body">bescherming.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Alle volken</text><text x="68" y="625" class="body">Verkondig Gods heerlijkheid; de</text><text x="68" y="668" class="body">Schepper wordt onderscheiden van</text><text x="68" y="711" class="body">afgoden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Schepping en oordeel</text><text x="68" y="860" class="body">Hemel, aarde, zee, veld en bomen worden</text><text x="68" y="903" class="body">poëtisch tot vreugde opgeroepen.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Gebed en antwoord</text><text x="68" y="1052" class="body">Red ons en verzamel ons; het volk</text><text x="68" y="1095" class="body">antwoordt amen en prijst de HEERE.</text><text x="46" y="1188" class="note">De zingende bomen en jubelende velden zijn</text><text x="46" y="1224" class="note">beeldspraak in een lied, geen afzonderlijk</text><text x="46" y="1260" class="note">beschreven gebeurtenissen.</text></svg>