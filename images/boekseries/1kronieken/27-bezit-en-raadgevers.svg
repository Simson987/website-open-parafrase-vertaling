<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1376" viewBox="0 0 840 1376" role="img" aria-labelledby="title desc"><title id="title">Bezit en raadgevers</title><desc id="desc">Beheerders per bezit en de onderscheiden raadgevers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1376" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bezit en raadgevers</text><text x="44" y="113" class="ref">1 Kronieken 27:25–34</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schatten en voorraden</text><text x="68" y="241" class="body">Azmaveth en Jonathan, zoon van Uzzia;</text><text x="68" y="284" class="body">Ezri leidt de landarbeiders.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wijn en olie</text><text x="68" y="433" class="body">Simeï: wijngaarden; Zabdi: wijn.</text><text x="68" y="476" class="body">Baäl-Hanan: olijf- en vijgenbomen;</text><text x="68" y="519" class="body">Joas: olie.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Dieren</text><text x="68" y="668" class="body">Sitrai en Safat: runderen; Obil:</text><text x="68" y="711" class="body">kamelen; Jechdeja: ezelinnen; Jaziz:</text><text x="68" y="754" class="body">kleinvee.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Bij het hof</text><text x="68" y="903" class="body">Jonathan, Davids oom, is raadgever;</text><text x="68" y="946" class="body">Jehiël zorgt voor koningszonen; Husai</text><text x="68" y="989" class="body">is vriend van de koning.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Raad en leger</text><text x="68" y="1138" class="body">Achitofel, daarna Jojada en Abjathar;</text><text x="68" y="1181" class="body">Joab is legeraanvoerder.</text><text x="46" y="1274" class="note">Jonathan, zoon van Uzzia, en Jonathan, Davids</text><text x="46" y="1310" class="note">oom, worden niet tot één persoon samengevoegd.</text></svg>