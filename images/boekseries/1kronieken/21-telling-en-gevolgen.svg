<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Van telling naar oordeel</title><desc id="desc">Oorzaak, uitslag, schuld en gevolg van de volkstelling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van telling naar oordeel</text><text x="44" y="113" class="ref">1 Kronieken 21:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanleiding en bevel</text><text x="68" y="241" class="body">De satan zet David aan; David laat Joab</text><text x="68" y="284" class="body">van Ber-Seba tot Dan tellen, ondanks</text><text x="68" y="327" class="body">diens bezwaar.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Uitslag</text><text x="68" y="476" class="body">1.100.000 mannen in Israël en 470.000</text><text x="68" y="519" class="body">in Juda; Levi en Benjamin zijn niet</text><text x="68" y="562" class="body">meegeteld.</text><rect x="42" y="620" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Erkenning</text><text x="68" y="711" class="body">David belijdt zijn zonde en dwaasheid.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Pest en onderbreking</text><text x="68" y="860" class="body">70.000 doden; bij Jeruzalem beveelt God</text><text x="68" y="903" class="body">de engel zijn hand terug te trekken.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Davids gebed</text><text x="68" y="1052" class="body">Hij erkent zijn eigen schuld en vraagt</text><text x="68" y="1095" class="body">ontferming voor het volk.</text><text x="46" y="1188" class="note">De aantallen volgen dit hoofdstuk. Er wordt geen</text><text x="46" y="1224" class="note">gelijkstelling met een andere telling opgelegd.</text></svg>