<svg xmlns="http://www.w3.org/2000/svg" width="840" height="962" viewBox="0 0 840 962"><title>Van Simeon tot Simeï</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52725e"/></marker></defs><rect width="840" height="962" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Van Simeon tot Simeï</text><text x="42" y="105" font-size="25">1 Kronieken 4:24–27</text><rect x="150" y="155" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="191" text-anchor="middle" font-size="31">Simeon</text><path d="M420 209 V229" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="235" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="271" text-anchor="middle" font-size="31">Saul</text><path d="M420 289 V309" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="315" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="351" text-anchor="middle" font-size="31">Sallum</text><path d="M420 369 V389" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="395" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="431" text-anchor="middle" font-size="31">Mibsam</text><path d="M420 449 V469" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="475" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="511" text-anchor="middle" font-size="31">Misma</text><path d="M420 529 V549" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="555" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="591" text-anchor="middle" font-size="31">Hammuël</text><path d="M420 609 V629" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="635" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="671" text-anchor="middle" font-size="31">Zaccur</text><path d="M420 689 V709" stroke="#52725e" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="715" width="540" height="54" rx="12" fill="white" stroke="#92a18e"/><text x="420" y="751" text-anchor="middle" font-size="31">Simeï</text><text x="42" y="815" font-size="26">Gekozen lijn: Nemuël, Jamin, Jarib en Zerah zijn</text><text x="42" y="849" font-size="26">Sauls broers. Simeï heeft zestien zonen en zes</text><text x="42" y="883" font-size="26">dochters.</text></g></svg>