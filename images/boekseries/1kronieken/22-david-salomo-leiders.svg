<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">David, Salomo en de leiders</title><desc id="desc">De onderscheiden opdrachten en redenen bij de overgang naar Salomo.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">David, Salomo en de leiders</text><text x="44" y="113" class="ref">1 Kronieken 22:6–19</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">David</text><text x="68" y="241" class="body">Heeft het voornemen, maar mag wegens</text><text x="68" y="284" class="body">bloedvergieten en oorlogen het huis</text><text x="68" y="327" class="body">niet bouwen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Salomo</text><text x="68" y="476" class="body">Man van rust; krijgt de bouwopdracht en</text><text x="68" y="519" class="body">de belofte van Gods vaderschap.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wet en moed</text><text x="68" y="668" class="body">David vraagt om inzicht en verstand;</text><text x="68" y="711" class="body">Salomo moet de wet houden en sterk en</text><text x="68" y="754" class="body">moedig zijn.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Alle leiders</text><text x="68" y="903" class="body">Moeten Salomo helpen, God met hart en</text><text x="68" y="946" class="body">ziel zoeken en het heiligdom bouwen.</text><text x="46" y="1039" class="note">Bouwvoorbereiding, bouwopdracht en hulp zijn</text><text x="46" y="1075" class="note">verschillende rollen; de opdracht wordt niet aan</text><text x="46" y="1111" class="note">David toegeschreven.</text></svg>