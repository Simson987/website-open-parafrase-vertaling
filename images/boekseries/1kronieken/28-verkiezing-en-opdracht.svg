<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Verkiezing en opdracht</title><desc id="desc">Verkiezing, gehoorzaamheid, bouwopdracht en hulp onderscheiden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verkiezing en opdracht</text><text x="44" y="113" class="ref">1 Kronieken 28:2–10, 20–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">David</text><text x="68" y="241" class="body">Uit Juda en Isaï’s huis tot koning</text><text x="68" y="284" class="body">gekozen; wegens bloedvergieten geen</text><text x="68" y="327" class="body">tempelbouwer.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Salomo</text><text x="68" y="476" class="body">Uit Davids zonen gekozen om huis en</text><text x="68" y="519" class="body">voorhoven te bouwen.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het volk</text><text x="68" y="668" class="body">Geboden zoeken en houden; het land aan</text><text x="68" y="711" class="body">de kinderen doorgeven.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het hart</text><text x="68" y="860" class="body">Salomo moet God kennen en met toegewijd</text><text x="68" y="903" class="body">hart dienen; zoeken en verlaten hebben</text><text x="68" y="946" class="body">gevolgen.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De hulp</text><text x="68" y="1095" class="body">God laat hem niet in de steek;</text><text x="68" y="1138" class="body">priesters, Levieten, vaklieden, leiders</text><text x="68" y="1181" class="body">en volk staan klaar.</text><text x="46" y="1274" class="note">De belofte in vers 7 noemt ook standvastigheid</text><text x="46" y="1310" class="note">in de geboden; de oproep is niet alleen een</text><text x="46" y="1346" class="note">bouwtechnische instructie.</text></svg>