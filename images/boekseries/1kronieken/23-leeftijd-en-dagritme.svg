<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Leeftijd en dagelijks werk</title><desc id="desc">De gewijzigde leeftijdsregeling en dagelijkse en feestelijke taken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leeftijd en dagelijks werk</text><text x="44" y="113" class="ref">1 Kronieken 23:24–32</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twintig jaar en ouder</text><text x="68" y="241" class="body">De latere regeling volgens Davids</text><text x="68" y="284" class="body">laatste woorden; naast de eerdere</text><text x="68" y="327" class="body">telling vanaf dertig.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Geen draagtaak meer</text><text x="68" y="476" class="body">Door de rust en vestiging hoeven zij</text><text x="68" y="519" class="body">tent en gerei niet meer te dragen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Ondersteuning</text><text x="68" y="668" class="body">Naast Aärons nakomelingen: voorhoven,</text><text x="68" y="711" class="body">kamers, reiniging, brood, meel,</text><text x="68" y="754" class="body">bakwerk, maten en gewichten.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Vaste tijden</text><text x="68" y="903" class="body">Elke morgen en avond lof; ook bij</text><text x="68" y="946" class="body">sabbatten, nieuwemaansdagen en feesten.</text><text x="46" y="1039" class="note">De twee leeftijdsgrenzen staan in verschillende</text><text x="46" y="1075" class="note">passages; er wordt geen enkele uniforme grens</text><text x="46" y="1111" class="note">over het hele hoofdstuk gelegd.</text></svg>