<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">De dorsvloer en Gibeon</title><desc id="desc">Plaats, betaling en afloop met het onderscheid tussen dorsvloer en Gibeon.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De dorsvloer en Gibeon</text><text x="44" y="113" class="ref">1 Kronieken 21:18–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het bevel via Gad</text><text x="68" y="241" class="body">David moet een altaar oprichten op</text><text x="68" y="284" class="body">Ornans dorsvloer.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De volle prijs</text><text x="68" y="433" class="body">Ornan biedt alles aan; David weigert</text><text x="68" y="476" class="body">een offer dat hem niets kost en betaalt</text><text x="68" y="519" class="body">ongeveer zeven kilo goud.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het antwoord</text><text x="68" y="668" class="body">God antwoordt met vuur op het altaar;</text><text x="68" y="711" class="body">de engel steekt zijn zwaard in de</text><text x="68" y="754" class="body">schede.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Gibeon</text><text x="68" y="903" class="body">De oude ontmoetingstent en het</text><text x="68" y="946" class="body">brandofferaltaar staan daar, maar David</text><text x="68" y="989" class="body">durft er niet heen.</text><text x="46" y="1082" class="note">Dorsvloer en offerhoogte zijn twee plaatsen. De</text><text x="46" y="1118" class="note">vier zonen van Ornan verbergen zich tijdens het</text><text x="46" y="1154" class="note">eerdere zien van de engel.</text></svg>