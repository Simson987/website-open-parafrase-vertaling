<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Drie zangers en hun families</title><desc id="desc">De drie zangers met hun gecontroleerde herkomst en taken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie zangers en hun families</text><text x="44" y="113" class="ref">1 Kronieken 6:31–49</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Heman: Kahath</text><text x="68" y="241" class="body">Zoon van Joël, zoon van Samuël; zijn</text><text x="68" y="284" class="body">lange afstamming loopt via Korah en</text><text x="68" y="327" class="body">Jizhar naar Kahath.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Asaf rechts: Gerson</text><text x="68" y="476" class="body">Zoon van Berechja, zoon van Simea; de</text><text x="68" y="519" class="body">reeks eindigt via Jahath bij Gerson en</text><text x="68" y="562" class="body">Levi.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Ethan links: Merari</text><text x="68" y="711" class="body">Zoon van Kisi, zoon van Abdi; de reeks</text><text x="68" y="754" class="body">loopt via Maheli en Musi naar Merari.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De taak</text><text x="68" y="903" class="body">Zang bij de ontmoetingstent tot Salomo</text><text x="68" y="946" class="body">de tempel bouwt.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De priesters</text><text x="68" y="1095" class="body">Aäron en zijn zonen bij de altaren en</text><text x="68" y="1138" class="body">de verzoening; andere Levieten hebben</text><text x="68" y="1181" class="body">overige taken.</text><text x="46" y="1274" class="note">Rechts en links volgen de opstelling in de</text><text x="46" y="1310" class="note">tekst. Zangers en priesters worden niet als</text><text x="46" y="1346" class="note">dezelfde taak voorgesteld.</text></svg>