<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1217" viewBox="0 0 840 1217" role="img" aria-labelledby="title desc"><title id="title">Legerdienst, maanden 7–12</title><desc id="desc">De laatste zes maanden met plaats en stam of familie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1217" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Legerdienst, maanden 7–12</text><text x="44" y="113" class="ref">1 Kronieken 27:10–15</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">7: Helez</text><text x="68" y="241" class="body">Uit Pelon en de stam Efraïm.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">8: Sibbechai</text><text x="68" y="390" class="body">Uit Husa en de familie Zerah.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">9: Abiëzer</text><text x="68" y="539" class="body">Uit Anathoth en Benjamin.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">10: Maharai</text><text x="68" y="688" class="body">Uit Netofa en Zerah.</text><rect x="42" y="746" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">11: Benaja</text><text x="68" y="837" class="body">Uit Pirhathon en Efraïm.</text><rect x="42" y="895" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="938" class="label">12: Heldai</text><text x="68" y="986" class="body">Uit Netofa en Othniëls familie.</text><text x="46" y="1079" class="note">Ook elk van deze afdelingen telt 24.000. Benaja</text><text x="46" y="1115" class="note">uit Pirhathon is hier apart genoemd van Benaja,</text><text x="46" y="1151" class="note">zoon van Jojada.</text></svg>