<svg xmlns="http://www.w3.org/2000/svg" width="840" height="627" viewBox="0 0 840 627"><title>Asschurs twee gezinstakken</title><rect width="840" height="627" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="36" font-weight="700">Asschurs twee gezinstakken</text><text x="42" y="105" font-size="25">1 Kronieken 4:5–7</text><rect x="150" y="145" width="640" height="70" rx="12" fill="#dfe8d6" stroke="#52725e"/><text x="470" y="190" text-anchor="middle" font-size="32" font-weight="700">Asschur, vader van Thekoa</text><path d="M470 215 V235 H75 V438.5" fill="none" stroke="#52725e" stroke-width="3"/><path d="M75 311.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="260" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="297" font-size="31" font-weight="700">Naära</text><text x="175" y="337" font-size="29">Ahuzzam, Hefer, Temeni en Haähastari.</text><path d="M75 438.5 H150" stroke="#52725e" stroke-width="3"/><rect x="150" y="387" width="640" height="103" rx="12" fill="white" stroke="#92a18e"/><text x="175" y="424" font-size="31" font-weight="700">Hela</text><text x="175" y="464" font-size="29">Zereth, Jezohar en Ethnan.</text><text x="42" y="536" font-size="26">De groepen zijn naar moeder onderscheiden; Hela</text><text x="42" y="570" font-size="26">en Naära zijn niet Asschurs dochters.</text></g></svg>