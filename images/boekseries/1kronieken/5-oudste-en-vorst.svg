<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Oudste zoon en vorst</title><desc id="desc">Het onderscheid tussen Ruben, Jozef en Juda zonder de rollen te vermengen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Oudste zoon en vorst</text><text x="44" y="113" class="ref">1 Kronieken 5:1–3</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ruben</text><text x="68" y="241" class="body">Biologisch de oudste van Israël, maar</text><text x="68" y="284" class="body">onteert het bed van zijn vader.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jozefs zonen</text><text x="68" y="433" class="body">Ontvangen het recht van de oudste zoon.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Juda</text><text x="68" y="582" class="body">Wordt machtig onder zijn broers; uit</text><text x="68" y="625" class="body">hem komt de vorst.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Rubens zonen</text><text x="68" y="774" class="body">Hanoch, Pallu, Hezron en Charmi.</text><text x="46" y="867" class="note">Geboortevolgorde, eerstgeboorterecht en de</text><text x="46" y="903" class="note">vorstelijke lijn zijn drie verschillende zaken.</text></svg>