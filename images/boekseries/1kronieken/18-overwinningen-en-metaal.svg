<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Gebieden en kostbaarheden</title><desc id="desc">Gebieden, geschenken en de latere bestemming van het koper.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gebieden en kostbaarheden</text><text x="44" y="113" class="ref">1 Kronieken 18:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Filistijnen en Moab</text><text x="68" y="241" class="body">Gath wordt ingenomen; Moab brengt</text><text x="68" y="284" class="body">schatting.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zoba en Damascus</text><text x="68" y="433" class="body">Hadar-Ezer wordt verslagen; de Syriërs</text><text x="68" y="476" class="body">van Damascus worden onderworpen.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hamath</text><text x="68" y="625" class="body">Thou stuurt zijn zoon Hadoram met</text><text x="68" y="668" class="body">geschenken na Davids overwinning.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Koper uit twee steden</text><text x="68" y="817" class="body">Uit Tibchath en Chun; Salomo maakt er</text><text x="68" y="860" class="body">later het koperen zeevat, de pilaren en</text><text x="68" y="903" class="body">gerei van.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Edom</text><text x="68" y="1052" class="body">Abisai verslaat Edom in het Zoutdal;</text><text x="68" y="1095" class="body">David vestigt bezettingen.</text><text x="46" y="1188" class="note">De latere verwerking door Salomo wordt niet als</text><text x="46" y="1224" class="note">al in Davids tijd voltooid afgebeeld.</text></svg>