<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Poorten en dienstrooster</title><desc id="desc">Richtingen, aflossing en verschillende dagelijkse en wekelijkse taken.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Poorten en dienstrooster</text><text x="44" y="113" class="ref">1 Kronieken 9:24–33</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vier richtingen</text><text x="68" y="241" class="body">Oosten, westen, noorden en zuiden.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De aflossing</text><text x="68" y="390" class="body">Verwanten uit de dorpen komen telkens</text><text x="68" y="433" class="body">zeven dagen meedienen.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Vier hoofdpoortwachters</text><text x="68" y="582" class="body">Vaste zorg voor kamers en voorraden;</text><text x="68" y="625" class="body">overnachten rondom het huis en openen</text><text x="68" y="668" class="body">elke morgen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Voorraad en bereiding</text><text x="68" y="817" class="body">Gerei tellen; meel, wijn, olie, wierook</text><text x="68" y="860" class="body">en specerijen; priesterzonen bereiden</text><text x="68" y="903" class="body">de zalf.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Vaste taken</text><text x="68" y="1052" class="body">Mattithja maakt gebak; Kahathieten de</text><text x="68" y="1095" class="body">toonbroden per sabbat; zangers werken</text><text x="68" y="1138" class="body">dag en nacht.</text><text x="46" y="1231" class="note">De richtingen geven taakverdeling aan; dit</text><text x="46" y="1267" class="note">overzicht doet geen uitspraak over exacte</text><text x="46" y="1303" class="note">poortmaten of plattegrond.</text></svg>