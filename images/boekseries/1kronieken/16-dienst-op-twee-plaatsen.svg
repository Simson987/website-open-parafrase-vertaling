<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Dienst op twee plaatsen</title><desc id="desc">De twee locaties en de afloop van de plechtigheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dienst op twee plaatsen</text><text x="44" y="113" class="ref">1 Kronieken 16:37–43</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voor de ark</text><text x="68" y="241" class="body">Asaf en zijn broeders dienen dagelijks;</text><text x="68" y="284" class="body">Obed-Edom en de poortwachters hebben</text><text x="68" y="327" class="body">hun taken.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bij Gibeon</text><text x="68" y="476" class="body">Zadok en de priesters bij de</text><text x="68" y="519" class="body">ontmoetingstent; offers elke morgen en</text><text x="68" y="562" class="body">avond.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Muzikale dienst</text><text x="68" y="711" class="body">Heman en Jeduthun en anderen danken;</text><text x="68" y="754" class="body">zonen van Jeduthun bewaken de poort.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Naar huis</text><text x="68" y="903" class="body">Het volk vertrekt; David gaat zijn</text><text x="68" y="946" class="body">gezin zegenen.</text><text x="46" y="1039" class="note">De ark in Davids tent en de ontmoetingstent in</text><text x="46" y="1075" class="note">Gibeon worden niet tot één locatie samengevoegd.</text></svg>