<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">De trek van Simeons families</title><desc id="desc">Motief, tijd, aantallen en namen bij de twee verplaatsingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De trek van Simeons families</text><text x="44" y="113" class="ref">1 Kronieken 4:34–43</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De leiders</text><text x="68" y="241" class="body">Families worden groot; de namen staan</text><text x="68" y="284" class="body">in het geslachtsregister.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bij Gedor</text><text x="68" y="433" class="body">Zij zoeken en vinden goede, rustige</text><text x="68" y="476" class="body">weidegrond.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">In Hizkia’s tijd</text><text x="68" y="625" class="body">Zij verdrijven en doden de eerdere</text><text x="68" y="668" class="body">bewoners en gaan er wonen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Naar Seïr</text><text x="68" y="817" class="body">Vijfhonderd mannen onder Pelatja,</text><text x="68" y="860" class="body">Nearja, Refaja en Uzziël, de zonen van</text><text x="68" y="903" class="body">Iseï.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De uitkomst</text><text x="68" y="1052" class="body">Zij verslaan de overgebleven</text><text x="68" y="1095" class="body">Amalekieten en wonen er.</text><text x="46" y="1188" class="note">De rustig gevonden weidegrond betekent niet dat</text><text x="46" y="1224" class="note">de beschreven vestiging vreedzaam verliep.</text></svg>