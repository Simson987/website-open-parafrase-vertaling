<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Seïr en de koningen van Edom</title><desc id="desc">De twee verschillende soorten lijsten en hun namen zonder onterechte afstamming.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Seïr en de koningen van Edom</text><text x="44" y="113" class="ref">1 Kronieken 1:38–54</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Seïrs zonen</text><text x="68" y="241" class="body">Lotan, Sobal, Zibeon, Ana, Dison, Ezer</text><text x="68" y="284" class="body">en Disan.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste koningen</text><text x="68" y="433" class="body">Bela, zoon van Beor → Jobab, zoon van</text><text x="68" y="476" class="body">Zerah → Husam → Hadad, zoon van Bedad.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Daarna</text><text x="68" y="625" class="body">Samla → Saul uit Rehoboth → Baäl-Hanan,</text><text x="68" y="668" class="body">zoon van Achbor → Hadad.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Laatste Hadads vrouw</text><text x="68" y="817" class="body">Mehetabeël, dochter van Matred, dochter</text><text x="68" y="860" class="body">van Mee-Sahab.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De stamhoofden</text><text x="68" y="1009" class="body">Timna, Alja, Jetheth, Aholi-Bama, Ela,</text><text x="68" y="1052" class="body">Pinon, Kenaz, Theman, Mibzar, Magdiël</text><text x="68" y="1095" class="body">en Iram.</text><text x="46" y="1188" class="note">Koningsopvolging is geen stamboom; de twee</text><text x="46" y="1224" class="note">Hadads worden door hun plaats in de reeks</text><text x="46" y="1260" class="note">onderscheiden.</text></svg>