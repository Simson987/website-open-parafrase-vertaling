<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Twee betekenissen van huis</title><desc id="desc">Het woord huis als gebouw en als familie met de juiste ontvanger van de belofte.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee betekenissen van huis</text><text x="44" y="113" class="ref">1 Kronieken 17:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Davids voornemen</text><text x="68" y="241" class="body">Hij woont in een cederhouten huis,</text><text x="68" y="284" class="body">terwijl de ark onder tentdoek staat.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Nathans eerste antwoord</text><text x="68" y="433" class="body">Hij stemt aanvankelijk in; die nacht</text><text x="68" y="476" class="body">ontvangt hij een ander woord.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Een huis voor David</text><text x="68" y="625" class="body">God belooft een blijvend koningshuis:</text><text x="68" y="668" class="body">Davids dynastie.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Een huis voor Gods naam</text><text x="68" y="817" class="body">Een zoon na David zal het gebouw</text><text x="68" y="860" class="body">oprichten; de belofte noemt zijn troon</text><text x="68" y="903" class="body">en Gods trouw.</text><text x="46" y="996" class="note">Een paleis, een heiligdom en een dynastie zijn</text><text x="46" y="1032" class="note">verschillende betekenissen; David krijgt niet de</text><text x="46" y="1068" class="note">bouwopdracht.</text></svg>