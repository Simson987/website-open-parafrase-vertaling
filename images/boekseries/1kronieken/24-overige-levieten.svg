<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De overige Levieten</title><desc id="desc">De genoemde zijtakken en gelijke lotingsregel voor oud en jong.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De overige Levieten</text><text x="44" y="113" class="ref">1 Kronieken 24:20–31</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Amram en Rehabja</text><text x="68" y="241" class="body">Subael → Jechdeja; bij Rehabja is</text><text x="68" y="284" class="body">Jissia het hoofd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jizhar en Hebron</text><text x="68" y="433" class="body">Selomoth → Jahath; bij Hebron Jeria,</text><text x="68" y="476" class="body">Amarja, Jahaziël en Jekameam.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Uzziël</text><text x="68" y="625" class="body">Micha → Samir; Micha’s broer Jissia →</text><text x="68" y="668" class="body">Zecharja.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Merari</text><text x="68" y="817" class="body">Maheli en Musi; ook de tak via Jaazia</text><text x="68" y="860" class="body">met Beno, Soham, Zakkur en Hibri.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Dezelfde regel</text><text x="68" y="1009" class="body">Ook zij loten; voor het oudste hoofd</text><text x="68" y="1052" class="body">geldt dezelfde regel als voor zijn</text><text x="68" y="1095" class="body">jongste broer.</text><text x="46" y="1188" class="note">Dit hoofdstuk schrijft Subael en Selomoth;</text><text x="46" y="1224" class="note">hoofdstuk 23 heeft Sebuël en Selomith. De eigen</text><text x="46" y="1260" class="note">vormen blijven behouden.</text></svg>