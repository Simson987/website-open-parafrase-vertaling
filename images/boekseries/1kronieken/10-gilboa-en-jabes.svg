<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Van Gilboa naar Jabes</title><desc id="desc">De gebeurtenissen op Gilboa, in het dal en in Jabes in hun volgorde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Gilboa naar Jabes</text><text x="44" y="113" class="ref">1 Kronieken 10:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De strijd</text><text x="68" y="241" class="body">Israël vlucht op Gilboa; Jonathan,</text><text x="68" y="284" class="body">Abinadab en Malchi-Sua worden gedood.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Saul en de wapendrager</text><text x="68" y="433" class="body">De wapendrager weigert Saul te doden;</text><text x="68" y="476" class="body">beiden vallen uiteindelijk in hun eigen</text><text x="68" y="519" class="body">zwaard.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het dal</text><text x="68" y="668" class="body">Bewoners vluchten; Filistijnen nemen de</text><text x="68" y="711" class="body">steden in.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De volgende dag</text><text x="68" y="860" class="body">Filistijnen nemen Sauls hoofd en wapens</text><text x="68" y="903" class="body">mee naar hun godentempels.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De mannen van Jabes</text><text x="68" y="1052" class="body">Halen de lichamen weg, begraven de</text><text x="68" y="1095" class="body">beenderen onder de eik en vasten zeven</text><text x="68" y="1138" class="body">dagen.</text><text x="46" y="1231" class="note">Het hoofdstuk beschrijft Sauls dood, de</text><text x="46" y="1267" class="note">schending erna en de latere zorg van Jabes als</text><text x="46" y="1303" class="note">verschillende momenten.</text></svg>