<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">De tekens en de opdracht</title><desc id="desc">De aantallen, plaatsen en opeenvolgende bevestigingen van Sauls zalving.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De tekens en de opdracht</text><text x="44" y="113" class="ref">1 Samuël 10:2–10</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij Rachels graf</text><text x="68" y="241" class="body">Twee mannen: de ezelinnen zijn</text><text x="68" y="284" class="body">gevonden; Kis maakt zich zorgen om</text><text x="68" y="327" class="body">Saul.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Bij de eik van Tabor</text><text x="68" y="476" class="body">Drie mannen met drie bokjes, drie</text><text x="68" y="519" class="body">broden en wijn; Saul krijgt twee</text><text x="68" y="562" class="body">broden.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bij de heuvel van God</text><text x="68" y="711" class="body">Profeten met instrumenten; Saul zal met</text><text x="68" y="754" class="body">hen profeteren.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De verdere opdracht</text><text x="68" y="903" class="body">Naar Gilgal gaan; zeven dagen wachten</text><text x="68" y="946" class="body">tot Samuël komt.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De vervulling</text><text x="68" y="1095" class="body">God geeft een ander hart; de tekens</text><text x="68" y="1138" class="body">gebeuren die dag.</text><text x="46" y="1231" class="note">De drie gedragen broden en de twee ontvangen</text><text x="46" y="1267" class="note">broden hebben verschillende rollen.</text></svg>