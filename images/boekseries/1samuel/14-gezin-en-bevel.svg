<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1111" viewBox="0 0 840 1111" role="img" aria-labelledby="title desc"><title id="title">Sauls gezin en het bevel</title><desc id="desc">De gezinsleden en de relatie tot legeraanvoerder Abner.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1111" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sauls gezin en het bevel</text><text x="44" y="113" class="ref">1 Samuël 14:49–51</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Saul en Ahinoam</text><text x="68" y="241" class="body">Ahinoam is een dochter van Ahimaäz.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Genoemde zonen</text><text x="68" y="390" class="body">Jonathan, Isvi en Malchi-sua.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Genoemde dochters</text><text x="68" y="539" class="body">Merab is de oudste; Michal de jongste.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Sauls vader</text><text x="68" y="688" class="body">Kis.</text><rect x="42" y="746" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">De legeraanvoerder</text><text x="68" y="837" class="body">Abner is een zoon van Ner; Ner wordt de</text><text x="68" y="880" class="body">oom van Saul genoemd.</text><text x="46" y="973" class="note">De namenlijst volgt dit hoofdstuk. Latere</text><text x="46" y="1009" class="note">namenlijsten worden hier niet zonder bron</text><text x="46" y="1045" class="note">samengevoegd.</text></svg>