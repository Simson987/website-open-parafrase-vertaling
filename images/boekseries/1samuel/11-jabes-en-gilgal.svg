<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Van Jabes naar Gilgal</title><desc id="desc">De belegering, oproep, drie groepen en vernieuwing van het koningschap.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Jabes naar Gilgal</text><text x="44" y="113" class="ref">1 Samuël 11:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De eis van Nahas</text><text x="68" y="241" class="body">Verbond alleen met verminking van</text><text x="68" y="284" class="body">ieders rechteroog; Jabes vraagt zeven</text><text x="68" y="327" class="body">dagen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De oproep</text><text x="68" y="476" class="body">Boden bereiken Gibea; Saul roept Israël</text><text x="68" y="519" class="body">en Juda bijeen bij Bezek.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De aantallen</text><text x="68" y="668" class="body">300.000 Israëlieten en 30.000 mannen</text><text x="68" y="711" class="body">van Juda.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De bevrijding</text><text x="68" y="860" class="body">Drie groepen vallen in de laatste</text><text x="68" y="903" class="body">nachtwake aan; de Ammonieten worden</text><text x="68" y="946" class="body">verstrooid.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Het koningschap</text><text x="68" y="1095" class="body">Saul weigert de tegenstanders te doden;</text><text x="68" y="1138" class="body">bevestiging en dankoffers in Gilgal.</text><text x="46" y="1231" class="note">De gevraagde zeven dagen en het bericht over</text><text x="46" y="1267" class="note">redding de volgende dag horen bij verschillende</text><text x="46" y="1303" class="note">stappen.</text></svg>