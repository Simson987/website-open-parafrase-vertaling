<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Trouw en wantrouwen</title><desc id="desc">De verschillende relaties en de groei van Sauls wantrouwen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Trouw en wantrouwen</text><text x="44" y="113" class="ref">1 Samuël 18:1–30</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jonathan en David</text><text x="68" y="241" class="body">Verbond; mantel, kleding, zwaard, boog</text><text x="68" y="284" class="body">en gordel.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het lied van de vrouwen</text><text x="68" y="433" class="body">Duizend en tienduizend; Saul wordt</text><text x="68" y="476" class="body">jaloers.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De speer en het bevel</text><text x="68" y="625" class="body">David ontkomt twee keer; later</text><text x="68" y="668" class="body">bevelhebber over duizend.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Merab</text><text x="68" y="817" class="body">Wordt aan David toegezegd maar trouwt</text><text x="68" y="860" class="body">met Adriël, de Meholathiet.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Michal</text><text x="68" y="1009" class="body">Houdt van David en wordt zijn vrouw;</text><text x="68" y="1052" class="body">Sauls vrees en vijandschap nemen toe.</text><text x="46" y="1145" class="note">De liedgetallen zijn een loflied; Merab en</text><text x="46" y="1181" class="note">Michal hebben verschillende huwelijksuitkomsten.</text></svg>