<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Van bemiddeling naar de vlucht</title><desc id="desc">De fasen van bescherming, misleiding en de drie gezantschappen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van bemiddeling naar de vlucht</text><text x="44" y="113" class="ref">1 Samuël 19:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jonathan bemiddelt</text><text x="68" y="241" class="body">Saul zweert David niet te doden; David</text><text x="68" y="284" class="body">keert terug.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De nieuwe aanval</text><text x="68" y="433" class="body">Een speer in de muur; David ontkomt die</text><text x="68" y="476" class="body">nacht.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Michal helpt</text><text x="68" y="625" class="body">Raamvlucht; beeld en geitenvel als</text><text x="68" y="668" class="body">bedmisleiding.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Bij Samuël</text><text x="68" y="817" class="body">David naar Rama; daarna Najoth.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Boden en Saul</text><text x="68" y="966" class="body">Drie groepen boden profeteren; daarna</text><text x="68" y="1009" class="body">komt Saul zelf en profeteert ook.</text><text x="46" y="1102" class="note">De vernedering van Saul aan het slot wordt in</text><text x="46" y="1138" class="note">deze leeswijzer benoemd via het verloop; geen</text><text x="46" y="1174" class="note">naaktheid afgebeeld.</text></svg>