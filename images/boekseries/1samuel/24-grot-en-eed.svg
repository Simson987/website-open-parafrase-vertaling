<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Van de grot naar de eed</title><desc id="desc">Mantelslip, terughouding, bewijs en de verschillende bestemmingen aan het einde.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van de grot naar de eed</text><text x="44" y="113" class="ref">1 Samuël 24:3–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zoektocht</text><text x="68" y="241" class="body">Saul met 3.000 uitgekozen mannen bij</text><text x="68" y="284" class="body">En-gedi.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De grot</text><text x="68" y="433" class="body">David snijdt een mantelslip af; zijn</text><text x="68" y="476" class="body">geweten spreekt.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De terughouding</text><text x="68" y="625" class="body">Hij verhindert dat zijn mannen Saul</text><text x="68" y="668" class="body">aanvallen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Het bewijs</text><text x="68" y="817" class="body">Buiten toont hij de mantelslip en</text><text x="68" y="860" class="body">vraagt om recht.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De eed</text><text x="68" y="1009" class="body">Saul erkent Davids toekomst en vraagt</text><text x="68" y="1052" class="body">behoud van zijn nageslacht; David</text><text x="68" y="1095" class="body">zweert. Zij gaan uiteen.</text><text x="46" y="1188" class="note">De eed beëindigt dit gesprek; David keert met</text><text x="46" y="1224" class="note">zijn mannen naar de bergvesting terug.</text></svg>