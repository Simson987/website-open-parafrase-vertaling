<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Wat een koning zal nemen</title><desc id="desc">De verschillende gevolgen van de gevraagde koningsmacht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wat een koning zal nemen</text><text x="44" y="113" class="ref">1 Samuël 8:11–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De zonen</text><text x="68" y="241" class="body">Wagens, ruiters, bevel, akkers, oogst</text><text x="68" y="284" class="body">en wapenwerk.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De dochters</text><text x="68" y="433" class="body">Parfum maken, koken en bakken.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Het land</text><text x="68" y="582" class="body">Beste akkers, wijngaarden en</text><text x="68" y="625" class="body">olijfgaarden voor dienaren.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De tienden</text><text x="68" y="774" class="body">Een tiende van graan, wijngaarden en</text><text x="68" y="817" class="body">kudden.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Mensen en dieren</text><text x="68" y="966" class="body">Arbeidskrachten en ezels; uiteindelijk</text><text x="68" y="1009" class="body">zullen zij zelf slaven worden.</text><text x="46" y="1102" class="note">Dit is Samuëls waarschuwing bij de koningsvraag,</text><text x="46" y="1138" class="note">geen beschrijving van Sauls reeds ingevoerde</text><text x="46" y="1174" class="note">beleid.</text></svg>