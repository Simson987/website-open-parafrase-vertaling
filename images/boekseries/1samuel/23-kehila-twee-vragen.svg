<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Kehila: redding en vertrek</title><desc id="desc">De verschillende vragen en beslissingen rond de geredde stad.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kehila: redding en vertrek</text><text x="44" y="113" class="ref">1 Samuël 23:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De dreiging</text><text x="68" y="241" class="body">Filistijnen plunderen de dorsvloeren</text><text x="68" y="284" class="body">van Kehila.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twee keer raad</text><text x="68" y="433" class="body">David vraagt; zijn mannen zijn bang;</text><text x="68" y="476" class="body">hij vraagt opnieuw en gaat.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De redding</text><text x="68" y="625" class="body">David verslaat de Filistijnen en redt</text><text x="68" y="668" class="body">de stad.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Sauls plan</text><text x="68" y="817" class="body">Belegeren; David vraagt via Abjathar</text><text x="68" y="860" class="body">met de efod naar komst en uitlevering.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het vertrek</text><text x="68" y="1009" class="body">Ongeveer 600 man verlaten Kehila; Saul</text><text x="68" y="1052" class="body">ziet af van de tocht.</text><text x="46" y="1145" class="note">De aangekondigde uitlevering volgt op een vraag;</text><text x="46" y="1181" class="note">David vertrekt voordat die belegering</text><text x="46" y="1217" class="note">plaatsvindt.</text></svg>