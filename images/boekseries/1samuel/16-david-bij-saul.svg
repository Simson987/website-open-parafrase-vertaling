<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">David in Sauls dienst</title><desc id="desc">De verschillende stappen tussen herderswerk en dienst aan Saul.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">David in Sauls dienst</text><text x="44" y="113" class="ref">1 Samuël 16:14–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sauls angst</text><text x="68" y="241" class="body">De dienaren stellen een goede</text><text x="68" y="284" class="body">harpspeler voor.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De aanbeveling</text><text x="68" y="433" class="body">Een zoon van Isaï uit Bethlehem wordt</text><text x="68" y="476" class="body">genoemd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De boodschap aan Isaï</text><text x="68" y="625" class="body">David wordt bij de schapen vandaan</text><text x="68" y="668" class="body">opgeroepen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De gaven</text><text x="68" y="817" class="body">Ezel met brood, wijn en een</text><text x="68" y="860" class="body">geitenbokje.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De dienst</text><text x="68" y="1009" class="body">Saul krijgt David lief; David wordt</text><text x="68" y="1052" class="body">wapendrager; zijn spel brengt</text><text x="68" y="1095" class="body">verlichting.</text><text x="46" y="1188" class="note">De angst wordt via Sauls houding getoond; een</text><text x="46" y="1224" class="note">verzonnen zichtbaar wezen wordt niet toegevoegd.</text></svg>