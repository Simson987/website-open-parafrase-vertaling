<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De ark bij de Filistijnen</title><desc id="desc">De twee ochtenden en de verschillende Filistijnse steden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De ark bij de Filistijnen</text><text x="44" y="113" class="ref">1 Samuël 5:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eben-Haëzer → Asdod</text><text x="68" y="241" class="body">De ark wordt naast Dagon in diens huis</text><text x="68" y="284" class="body">gezet.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eerste ochtend</text><text x="68" y="433" class="body">Dagon ligt voorover; de inwoners zetten</text><text x="68" y="476" class="body">het beeld terug.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Tweede ochtend</text><text x="68" y="625" class="body">Opnieuw gevallen; hoofd en beide handen</text><text x="68" y="668" class="body">liggen op de drempel.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Asdod → Gath</text><text x="68" y="817" class="body">Gezwellen en paniek; de ark wordt</text><text x="68" y="860" class="body">doorgestuurd.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Gath → Ekron</text><text x="68" y="1009" class="body">Ook daar paniek; de vorsten moeten de</text><text x="68" y="1052" class="body">ark terugsturen.</text><text x="46" y="1145" class="note">Een route van genoemde plaatsen, geen landkaart</text><text x="46" y="1181" class="note">met onbewezen coördinaten.</text></svg>