<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">De rotsen en het teken</title><desc id="desc">Plaatsen, teken en groeiende deelname aan de strijd.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De rotsen en het teken</text><text x="44" y="113" class="ref">1 Samuël 14:4–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee rotspunten</text><text x="68" y="241" class="body">Bozes en Sene; noord tegenover Michmas,</text><text x="68" y="284" class="body">zuid tegenover Geba.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De twee mannen</text><text x="68" y="433" class="body">Jonathan en zijn wapendrager, zonder</text><text x="68" y="476" class="body">Saul in te lichten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee mogelijkheden</text><text x="68" y="625" class="body">Blijf staan: niet opklimmen. Kom naar</text><text x="68" y="668" class="body">ons toe: wel opklimmen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De eerste slag</text><text x="68" y="817" class="body">Ongeveer twintig man op ongeveer een</text><text x="68" y="860" class="body">halve akker; daarna paniek en</text><text x="68" y="903" class="body">aardbeving.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De omkeer</text><text x="68" y="1052" class="body">Sauls mannen, overgelopen Hebreeën en</text><text x="68" y="1095" class="body">verborgen Israëlieten sluiten aan.</text><text x="46" y="1188" class="note">De woorden van de voorpost bepalen het</text><text x="46" y="1224" class="note">afgesproken teken; de rotsnamen zijn geen extra</text><text x="46" y="1260" class="note">personen.</text></svg>