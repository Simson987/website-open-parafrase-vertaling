<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Ziklag en de misleiding</title><desc id="desc">De verblijfstijd, gezinnen en het verschil tussen aanvallen en verslag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ziklag en de misleiding</text><text x="44" y="113" class="ref">1 Samuël 27:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Naar Achis</text><text x="68" y="241" class="body">David met 600 mannen en hun gezinnen</text><text x="68" y="284" class="body">naar Gath.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De twee vrouwen</text><text x="68" y="433" class="body">Ahinoam uit Jizreël en Abigaïl, de</text><text x="68" y="476" class="body">weduwe van Nabal.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De woonplaats</text><text x="68" y="625" class="body">Achis geeft Ziklag; verblijf in</text><text x="68" y="668" class="body">Filistijns gebied: één jaar en vier</text><text x="68" y="711" class="body">maanden.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De werkelijke aanvallen</text><text x="68" y="860" class="body">Gesurieten, Girzieten en Amalekieten;</text><text x="68" y="903" class="body">niemand wordt levend meegenomen.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Wat Achis hoort</text><text x="68" y="1052" class="body">David noemt gebieden van Juda,</text><text x="68" y="1095" class="body">Jerahmeëlieten en Kenieten. Achis</text><text x="68" y="1138" class="body">vertrouwt die verklaring.</text><text x="46" y="1231" class="note">De werkelijke doelen en Davids voorstelling van</text><text x="46" y="1267" class="note">zaken blijven apart; zijn geweld wordt niet als</text><text x="46" y="1303" class="note">deugd voorgesteld.</text></svg>