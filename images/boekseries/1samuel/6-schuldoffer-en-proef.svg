<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Schuldoffer en de proef</title><desc id="desc">De onderscheiden instructies, aantallen en aankomst van de ark.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schuldoffer en de proef</text><text x="44" y="113" class="ref">1 Samuël 6:1–18</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De tijd</text><text x="68" y="241" class="body">Zeven maanden bij de Filistijnen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het advies</text><text x="68" y="390" class="body">Vijf gouden gezwellen en vijf gouden</text><text x="68" y="433" class="body">muizen naar de vijf vorsten.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De wagen</text><text x="68" y="582" class="body">Nieuw; twee zogende koeien zonder</text><text x="68" y="625" class="body">eerder juk; kalveren blijven in de</text><text x="68" y="668" class="body">stal.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De proef</text><text x="68" y="817" class="body">Rechtstreeks naar Beth-semes zou de</text><text x="68" y="860" class="body">herkomst van de ramp aanwijzen.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De aankomst</text><text x="68" y="1009" class="body">Tarweoogst; akker van Jozua; grote</text><text x="68" y="1052" class="body">steen; Levieten tillen ark en kistje</text><text x="68" y="1095" class="body">af.</text><text x="46" y="1188" class="note">Vers 18 noemt ook muizen naar het aantal steden</text><text x="46" y="1224" class="note">en dorpen. Die formulering blijft naast het</text><text x="46" y="1260" class="note">advies van vers 4 staan.</text></svg>