<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Saul in Endor</title><desc id="desc">De gebeurtenissen en deelnemers van Sauls nachtelijke bezoek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Saul in Endor</text><text x="44" y="113" class="ref">1 Samuël 28:3–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het voorafgaande</text><text x="68" y="241" class="body">Samuël is gestorven; Saul heeft</text><text x="68" y="284" class="body">waarzeggers en geestenbezweerders</text><text x="68" y="327" class="body">verdreven.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De nood</text><text x="68" y="476" class="body">Filistijnen in Sunem, Israël bij</text><text x="68" y="519" class="body">Gilboa; geen antwoord door dromen, urim</text><text x="68" y="562" class="body">of profeten.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De nachtelijke tocht</text><text x="68" y="711" class="body">Saul vermomd, met twee mannen, naar de</text><text x="68" y="754" class="body">vrouw in Endor.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De boodschap</text><text x="68" y="903" class="body">De mantel en de oude man worden door de</text><text x="68" y="946" class="body">vrouw beschreven; Saul hoort oordeel</text><text x="68" y="989" class="body">over zijn koningschap en toekomst.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Het vertrek</text><text x="68" y="1138" class="body">Saul valt neer; na aandringen eet hij;</text><text x="68" y="1181" class="body">zij vertrekken nog diezelfde nacht.</text><text x="46" y="1274" class="note">De vrouw beschrijft wat zij ziet. Het</text><text x="46" y="1310" class="note">rasterbeeld voegt geen uiterlijk van een</text><text x="46" y="1346" class="note">bovennatuurlijk wezen toe.</text></svg>