<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">Jabes handelt en rouwt</title><desc id="desc">Plaatsen en stappen van de zorg voor de doden en het vasten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jabes handelt en rouwt</text><text x="44" y="113" class="ref">1 Samuël 31:11–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het bericht</text><text x="68" y="241" class="body">Jabes in Gilead hoort wat met Saul is</text><text x="68" y="284" class="body">gedaan.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De nachtelijke tocht</text><text x="68" y="433" class="body">Strijdbare mannen lopen de hele nacht.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Bij Beth-san</text><text x="68" y="582" class="body">Zij halen de lichamen van Saul en zijn</text><text x="68" y="625" class="body">zonen van de muur.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Terug in Jabes</text><text x="68" y="774" class="body">De lichamen worden verbrand; beenderen</text><text x="68" y="817" class="body">onder de boom begraven.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De rouwtijd</text><text x="68" y="966" class="body">Zeven dagen vasten.</text><text x="46" y="1059" class="note">De actie voor Saul komt uit dezelfde stad Jabes</text><text x="46" y="1095" class="note">die hij in hoofdstuk 11 heeft bevrijd.</text></svg>