<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Tegenstellingen in het loflied</title><desc id="desc">Leeswijzer bij de poëtische omkeringen in Hanna’s gebed.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tegenstellingen in het loflied</text><text x="44" y="113" class="ref">1 Samuël 2:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sterk en zwak</text><text x="68" y="241" class="body">Gebroken boog tegenover nieuwe kracht</text><text x="68" y="284" class="body">voor wie struikelden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vol en hongerig</text><text x="68" y="433" class="body">Wie verzadigd was zoekt brood; de</text><text x="68" y="476" class="body">honger houdt op.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Laag en hoog</text><text x="68" y="625" class="body">Armoede en rijkdom; de geringe krijgt</text><text x="68" y="668" class="body">een ereplaats.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Waar de kracht ligt</text><text x="68" y="817" class="body">Niemand wint door eigen kracht; de</text><text x="68" y="860" class="body">HEERE beschermt wie Hem trouw zijn.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het einde van het lied</text><text x="68" y="1009" class="body">Oordeel tot de einden van de aarde;</text><text x="68" y="1052" class="body">kracht voor Zijn koning en gezalfde.</text><text x="46" y="1145" class="note">Dit is poëtisch gebed. De zeven kinderen in vers</text><text x="46" y="1181" class="note">5 vormen geen geboortelijst van Hanna.</text></svg>