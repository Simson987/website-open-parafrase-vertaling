<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1118" viewBox="0 0 840 1118" role="img" aria-labelledby="title desc"><title id="title">Plaatsen van de geschenken</title><desc id="desc">De gecontroleerde plaatsnamen van de geschenkenlijst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1118" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plaatsen van de geschenken</text><text x="44" y="113" class="ref">1 Samuël 30:27–31</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Vers 27</text><text x="68" y="241" class="body">Bethel, Ramoth in het zuiden, Jather.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vers 28</text><text x="68" y="390" class="body">Aroër, Sifmoth, Esthemoa.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Vers 29</text><text x="68" y="539" class="body">Rachel, steden van de Jerahmeëlieten en</text><text x="68" y="582" class="body">van de Kenieten.</text><rect x="42" y="640" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Vers 30</text><text x="68" y="731" class="body">Horma, Chor-asan, Atach.</text><rect x="42" y="789" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="832" class="label">Vers 31</text><text x="68" y="880" class="body">Hebron en alle plaatsen waar David met</text><text x="68" y="923" class="body">zijn mannen had rondgetrokken.</text><text x="46" y="1016" class="note">Rachel is hier de plaatsnaam zoals gespeld in</text><text x="46" y="1052" class="note">deze vertaling, niet de vrouw uit Genesis.</text></svg>