<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Ziklag en de achtervolging</title><desc id="desc">De verschillende aantallen en de hulp aan de achtergelaten Egyptenaar.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ziklag en de achtervolging</text><text x="44" y="113" class="ref">1 Samuël 30:1–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De derde dag</text><text x="68" y="241" class="body">Terug in verbrand Ziklag; vrouwen en</text><text x="68" y="284" class="body">kinderen weggevoerd, niemand gedood.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De raadpleging</text><text x="68" y="433" class="body">David vindt kracht bij de HEERE;</text><text x="68" y="476" class="body">Abjathar brengt de efod; achtervolging</text><text x="68" y="519" class="body">wordt bevestigd.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bij Besor</text><text x="68" y="668" class="body">600 vertrekken; 200 uitgeput achter;</text><text x="68" y="711" class="body">400 trekken verder.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De Egyptenaar</text><text x="68" y="860" class="body">Drie dagen zonder voedsel en water;</text><text x="68" y="903" class="body">brood, water, vijgenkoek en twee</text><text x="68" y="946" class="body">rozijnenkoeken.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De bevrijding</text><text x="68" y="1095" class="body">Hij wijst de weg; gevecht; iedereen en</text><text x="68" y="1138" class="body">alles wordt teruggebracht.</text><text x="46" y="1231" class="note">De genoemde 400 vluchtende Amalekieten op</text><text x="46" y="1267" class="note">kamelen zijn een andere groep dan Davids 400</text><text x="46" y="1303" class="note">achtervolgers.</text></svg>