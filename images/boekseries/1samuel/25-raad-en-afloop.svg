<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">De raad en de afloop</title><desc id="desc">De ingreep tegen wraak en de latere, afzonderlijke ontwikkelingen in het gezin.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De raad en de afloop</text><text x="44" y="113" class="ref">1 Samuël 25:20–44</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De ontmoeting</text><text x="68" y="241" class="body">Abigaïl buigt en spreekt tegen</text><text x="68" y="284" class="body">eigenmachtig bloedvergieten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Davids reactie</text><text x="68" y="433" class="body">Hij dankt voor haar verstandige raad en</text><text x="68" y="476" class="body">laat haar in vrede gaan.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De volgende ochtend</text><text x="68" y="625" class="body">Na Nabals roes vertelt zij hem alles;</text><text x="68" y="668" class="body">hij bezwijkt.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Ongeveer tien dagen</text><text x="68" y="817" class="body">Nabal sterft; David laat Abigaïl ten</text><text x="68" y="860" class="body">huwelijk vragen.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De gezinsrelaties</text><text x="68" y="1009" class="body">Abigaïl vertrekt met vijf</text><text x="68" y="1052" class="body">dienstmeisjes; ook Ahinoam is Davids</text><text x="68" y="1095" class="body">vrouw. Michal wordt aan Palti gegeven.</text><text x="46" y="1188" class="note">De bundel van de levenden en de slinger zijn</text><text x="46" y="1224" class="note">beeldspraak in Abigaïls toespraak.</text></svg>