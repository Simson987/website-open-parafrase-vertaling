<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Van Nob naar Gath</title><desc id="desc">De ontvangen hulp, de aanwezige getuige en Davids vluchtgedrag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van Nob naar Gath</text><text x="44" y="113" class="ref">1 Samuël 21:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Achimelechs vraag</text><text x="68" y="241" class="body">Waarom komt David alleen? David noemt</text><text x="68" y="284" class="body">een geheime koningsopdracht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het brood</text><text x="68" y="433" class="body">Geen gewoon brood; David ontvangt het</text><text x="68" y="476" class="body">weggenomen toonbrood.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De getuige</text><text x="68" y="625" class="body">Doëg, de Edomiet, is aanwezig.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het zwaard</text><text x="68" y="774" class="body">Goliaths zwaard ligt in een kleed</text><text x="68" y="817" class="body">achter de efod en wordt aan David</text><text x="68" y="860" class="body">gegeven.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Bij Achis in Gath</text><text x="68" y="1009" class="body">Herkenning en angst; David doet alsof</text><text x="68" y="1052" class="body">hij zijn verstand heeft verloren.</text><text x="46" y="1145" class="note">Davids verklaring over de koning is zijn eigen</text><text x="46" y="1181" class="note">dekmantel; de lezer ziet zijn vlucht voor Saul.</text></svg>