<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Nob en de vlucht van Abjathar</title><desc id="desc">Aanklacht, weigering, misdaad en bescherming van de overlevende priester.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nob en de vlucht van Abjathar</text><text x="44" y="113" class="ref">1 Samuël 22:9–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Doëgs bericht</text><text x="68" y="241" class="body">Achimelech gaf brood en Goliaths zwaard</text><text x="68" y="284" class="body">en vroeg raad voor David.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De verdediging</text><text x="68" y="433" class="body">Achimelech noemt Davids trouw en zegt</text><text x="68" y="476" class="body">niet van het conflict te weten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De weigering</text><text x="68" y="625" class="body">Sauls dienaren willen de priesters niet</text><text x="68" y="668" class="body">aanvallen.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De misdaad</text><text x="68" y="817" class="body">Doëg doodt 85 priesters; ook de</text><text x="68" y="860" class="body">bevolking en dieren van Nob worden</text><text x="68" y="903" class="body">gedood.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De overlevende</text><text x="68" y="1052" class="body">Abjathar, zoon van Achimelech, vlucht;</text><text x="68" y="1095" class="body">David erkent verantwoordelijkheid en</text><text x="68" y="1138" class="body">biedt bescherming.</text><text x="46" y="1231" class="note">De aantallen en verantwoordelijkheid worden</text><text x="46" y="1267" class="note">benoemd zonder de slachtoffers grafisch af te</text><text x="46" y="1303" class="note">beelden.</text></svg>