<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">Het dal en de uitrusting</title><desc id="desc">Legeropstelling, uitrusting en duur van de uitdaging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het dal en de uitrusting</text><text x="44" y="113" class="ref">1 Samuël 17:1–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Twee zijden</text><text x="68" y="241" class="body">Filistijnen en Israëlieten op</text><text x="68" y="284" class="body">tegenoverliggende bergen; het dal</text><text x="68" y="327" class="body">ertussen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Goliath uit Gath</text><text x="68" y="476" class="body">Bijna drie meter; koperen helm en</text><text x="68" y="519" class="body">schubbenpantser.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het gewicht</text><text x="68" y="668" class="body">Ongeveer 55 kilo pantser; ongeveer</text><text x="68" y="711" class="body">zeven kilo voor de ijzeren speerpunt.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De voorvechter</text><text x="68" y="860" class="body">Schilddrager gaat voor hem uit; hij</text><text x="68" y="903" class="body">vraagt één tegenstander.</text><rect x="42" y="961" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De duur</text><text x="68" y="1052" class="body">Veertig dagen, elke morgen en avond.</text><text x="46" y="1145" class="note">Maten en gewichten zijn de afgeronde waarden in</text><text x="46" y="1181" class="note">deze vertaling. Het schema is niet op schaal.</text></svg>