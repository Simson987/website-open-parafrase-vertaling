<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Groepen en plaatsen</title><desc id="desc">De aantallen, strijdposities en drie plunderrichtingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Groepen en plaatsen</text><text x="44" y="113" class="ref">1 Samuël 13:2–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin</text><text x="68" y="241" class="body">2.000 bij Saul in Michmas en bij</text><text x="68" y="284" class="body">Bethel; 1.000 bij Jonathan in Gibea.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De Filistijnen</text><text x="68" y="433" class="body">De tekst noemt 30.000 wagens, 6.000</text><text x="68" y="476" class="body">ruiters en zeer veel voetvolk.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Na het wachten</text><text x="68" y="625" class="body">Ongeveer 600 mensen blijven bij Saul;</text><text x="68" y="668" class="body">Jonathan is bij hem in Gibea.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Drie plundertochten</text><text x="68" y="817" class="body">Richting Ofra/Sual; richting</text><text x="68" y="860" class="body">Beth-horon; richting dal Zeboïm en</text><text x="68" y="903" class="body">woestijn.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De bewapening</text><text x="68" y="1052" class="body">Geen smid in Israël; op de strijddag</text><text x="68" y="1095" class="body">alleen Saul en Jonathan met zwaard of</text><text x="68" y="1138" class="body">speer.</text><text x="46" y="1231" class="note">De getallen volgen de plaatselijke vertaling,</text><text x="46" y="1267" class="note">zonder zelf een ander wagenaantal in te vullen.</text></svg>