<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Herinnering en de oproep</title><desc id="desc">Leeswijzer bij de historische terugblik en de oproep aan volk en koning.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herinnering en de oproep</text><text x="44" y="113" class="ref">1 Samuël 12:6–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Egypte</text><text x="68" y="241" class="body">Jakob en de vaders; roepen om hulp;</text><text x="68" y="284" class="body">Mozes en Aäron worden gestuurd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Vergeten en onderdrukking</text><text x="68" y="433" class="body">Sisera, Filistijnen en de koning van</text><text x="68" y="476" class="body">Moab worden genoemd.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Genoemde redders</text><text x="68" y="625" class="body">Jerubbaäl, Bedan, Jefta en Samuël.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De huidige keuze</text><text x="68" y="774" class="body">Nahas’ dreiging en de vraag om een</text><text x="68" y="817" class="body">koning; volk en koning moeten</text><text x="68" y="860" class="body">gehoorzamen.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Het teken en de toekomst</text><text x="68" y="1009" class="body">Donder en regen bij de tarweoogst;</text><text x="68" y="1052" class="body">gebed, onderwijs en de oproep tot</text><text x="68" y="1095" class="body">trouw.</text><text x="46" y="1188" class="note">De naam Bedan is precies de naam in deze</text><text x="46" y="1224" class="note">hoofdstuktekst; geen andere rechter wordt</text><text x="46" y="1260" class="note">daarvoor ingevuld.</text></svg>