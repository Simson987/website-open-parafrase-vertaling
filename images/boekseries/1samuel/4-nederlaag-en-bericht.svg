<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Twee nederlagen en het bericht</title><desc id="desc">Verloop van de veldslag, de verliezen en het bericht over de buitgemaakte ark.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee nederlagen en het bericht</text><text x="44" y="113" class="ref">1 Samuël 4:1–22</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij Eben-Haëzer en Afek</text><text x="68" y="241" class="body">Eerste nederlaag: ongeveer 4.000 man.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">De ark uit Silo</text><text x="68" y="390" class="body">De oudsten verwachten redding door haar</text><text x="68" y="433" class="body">komst; het kamp juicht.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Tweede nederlaag</text><text x="68" y="582" class="body">30.000 man; de ark buitgemaakt; Hofni</text><text x="68" y="625" class="body">en Pinehas sterven.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Het bericht aan Eli</text><text x="68" y="774" class="body">De bode uit Benjamin noemt volk, zonen</text><text x="68" y="817" class="body">en ark. Eli sterft; hij was 98 jaar en</text><text x="68" y="860" class="body">veertig jaar rechter.</text><rect x="42" y="918" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Ikabod</text><text x="68" y="1009" class="body">Pinehas’ vrouw sterft na de geboorte;</text><text x="68" y="1052" class="body">de naam verwijst naar de weggevoerde</text><text x="68" y="1095" class="body">eer en de ark.</text><text x="46" y="1188" class="note">De verwachtingen van de oudsten worden</text><text x="46" y="1224" class="note">onderscheiden van het werkelijke verloop.</text></svg>