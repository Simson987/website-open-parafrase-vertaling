<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1412" viewBox="0 0 840 1412" role="img" aria-labelledby="title desc"><title id="title">Van de gaven tot de strijd</title><desc id="desc">Voorziening, voorbereiding en de volgorde van de overwinning.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1412" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van de gaven tot de strijd</text><text x="44" y="113" class="ref">1 Samuël 17:17–51</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Isaï’s opdracht</text><text x="68" y="241" class="body">Ongeveer twintig liter geroosterd</text><text x="68" y="284" class="body">graan, tien broden en tien kazen</text><text x="68" y="327" class="body">meenemen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het kamp</text><text x="68" y="476" class="body">David laat de bagage achter; spreekt</text><text x="68" y="519" class="body">broers; hoort Goliath en krijgt Eliabs</text><text x="68" y="562" class="body">verwijt.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bij Saul</text><text x="68" y="711" class="body">David verwijst naar leeuw en beer;</text><text x="68" y="754" class="body">probeert de uitrusting maar trekt die</text><text x="68" y="797" class="body">uit.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Bij de beek</text><text x="68" y="946" class="body">Staf, slinger, herderstas en vijf</text><text x="68" y="989" class="body">gladde stenen.</text><rect x="42" y="1047" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Het gevecht</text><text x="68" y="1138" class="body">Eén geslingerde steen treft Goliath;</text><text x="68" y="1181" class="body">daarna gebruikt David diens zwaard.</text><text x="46" y="1274" class="note">De slinger en de steen gaan aan het zwaard</text><text x="46" y="1310" class="note">vooraf. De onthoofding wordt niet als</text><text x="46" y="1346" class="note">rasterbeeld getoond.</text></svg>