<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Het woud en de berg</title><desc id="desc">Bemoediging, verraad en de onverwachte onderbreking van de achtervolging.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het woud en de berg</text><text x="44" y="113" class="ref">1 Samuël 23:14–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zif</text><text x="68" y="241" class="body">Saul zoekt dagelijks; David blijft</text><text x="68" y="284" class="body">buiten zijn bereik.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jonathan</text><text x="68" y="433" class="body">Zoekt David in het woud op, bemoedigt</text><text x="68" y="476" class="body">hem en vernieuwt het verbond.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De Zifieten</text><text x="68" y="625" class="body">Bieden Saul informatie; hij vraagt</text><text x="68" y="668" class="body">nauwkeurige gegevens.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Maon</text><text x="68" y="817" class="body">Saul en David aan verschillende kanten</text><text x="68" y="860" class="body">van dezelfde berg; dreigende</text><text x="68" y="903" class="body">omsingeling.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De onderbreking</text><text x="68" y="1052" class="body">Een Filistijnse inval wordt gemeld;</text><text x="68" y="1095" class="body">Saul staakt de jacht. Plaatsnaam:</text><text x="68" y="1138" class="body">Sela-machlekoth.</text><text x="46" y="1231" class="note">Jonathans hoop tweede na David te worden is zijn</text><text x="46" y="1267" class="note">uitspraak, geen reeds vervulde benoeming.</text></svg>