<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1396" viewBox="0 0 840 1396" role="img" aria-labelledby="title desc"><title id="title">Roepen, luisteren en vertellen</title><desc id="desc">De opeenvolgende roepingen en Samuëls moeilijke boodschap.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1396" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Roepen, luisteren en vertellen</text><text x="44" y="113" class="ref">1 Samuël 3:4–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste en tweede roep</text><text x="68" y="241" class="body">Samuël loopt naar Eli, die hem</text><text x="68" y="284" class="body">terugstuurt.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De derde keer</text><text x="68" y="433" class="body">Eli begrijpt Wie de jongen roept en</text><text x="68" y="476" class="body">geeft hem antwoordwoorden.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Opnieuw geroepen</text><text x="68" y="625" class="body">Samuël antwoordt: Spreek, want Uw</text><text x="68" y="668" class="body">dienaar luistert.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De boodschap</text><text x="68" y="817" class="body">Oordeel over Eli’s huis, omdat hij zijn</text><text x="68" y="860" class="body">zonen niet heeft tegengehouden.</text><rect x="42" y="918" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De volgende ochtend</text><text x="68" y="1009" class="body">Deuren openen; alles aan Eli vertellen.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Samuël groeit op</text><text x="68" y="1158" class="body">De HEERE is met hem; heel Israël erkent</text><text x="68" y="1201" class="body">hem als profeet, van Dan tot Berseba.</text><text x="46" y="1294" class="note">De roep en de woorden worden weergegeven zonder</text><text x="46" y="1330" class="note">een verzonnen uiterlijk van God.</text></svg>