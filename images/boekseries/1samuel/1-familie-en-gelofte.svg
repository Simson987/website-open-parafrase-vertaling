<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Het gezin en Hanna’s gelofte</title><desc id="desc">Familierelaties, kinderloosheid, gelofte en toewijding van Samuël.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het gezin en Hanna’s gelofte</text><text x="44" y="113" class="ref">1 Samuël 1:1–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Elkana</text><text x="68" y="241" class="body">Zoon van Jerocham, van Elihu, van</text><text x="68" y="284" class="body">Tochu, van Zuf.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twee vrouwen</text><text x="68" y="433" class="body">Hanna heeft aanvankelijk geen kinderen;</text><text x="68" y="476" class="body">Peninna heeft zonen en dochters.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het gebed</text><text x="68" y="625" class="body">Hanna vraagt een zoon en belooft zijn</text><text x="68" y="668" class="body">leven aan de HEERE; geen scheermes op</text><text x="68" y="711" class="body">zijn hoofd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Het antwoord</text><text x="68" y="860" class="body">Samuël wordt geboren; Hanna blijft</text><text x="68" y="903" class="body">thuis tot hij gespeend is.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Naar Silo</text><text x="68" y="1052" class="body">Het jonge kind wordt bij Eli gebracht;</text><text x="68" y="1095" class="body">Hanna vertelt over haar gebed.</text><text x="46" y="1188" class="note">De familiegegevens en de gelofte zijn</text><text x="46" y="1224" class="note">verschillende onderdelen van het hoofdstuk.</text></svg>