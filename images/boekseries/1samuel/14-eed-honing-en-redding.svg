<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Eed, honing en redding</title><desc id="desc">De gevolgen van de eed en de opeenvolgende beslissingen over Jonathan.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eed, honing en redding</text><text x="44" y="113" class="ref">1 Samuël 14:24–46</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Sauls eed</text><text x="68" y="241" class="body">Niemand mag vóór de avond eten; het</text><text x="68" y="284" class="body">volk raakt uitgeput.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jonathan</text><text x="68" y="433" class="body">Heeft de eed niet gehoord en proeft</text><text x="68" y="476" class="body">honing met zijn staf.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Na de strijd</text><text x="68" y="625" class="body">Eten met bloed; Saul laat een steen</text><text x="68" y="668" class="body">brengen en bouwt een altaar.</text><rect x="42" y="726" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Geen antwoord</text><text x="68" y="817" class="body">De vraag over verdere achtervolging</text><text x="68" y="860" class="body">blijft onbeantwoord; lot tussen volk en</text><text x="68" y="903" class="body">Saul/Jonathan, dan tussen vader en</text><text x="68" y="946" class="body">zoon.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Het volk grijpt in</text><text x="68" y="1095" class="body">Jonathan wordt beschermd en niet</text><text x="68" y="1138" class="body">gedood; de achtervolging stopt.</text><text x="46" y="1231" class="note">De redding van Jonathan door het volk is een</text><text x="46" y="1267" class="note">afzonderlijke afloop na het gevecht.</text></svg>