<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De afspraak met de pijlen</title><desc id="desc">De twee signalen en het verschil tussen afspraak en beschreven uitvoering.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De afspraak met de pijlen</text><text x="44" y="113" class="ref">1 Samuël 20:18–23 en 35–40</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De plaats</text><text x="68" y="241" class="body">David wacht bij de steen Ezel.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het afgesproken spel</text><text x="68" y="390" class="body">Jonathan zal drie pijlen schieten alsof</text><text x="68" y="433" class="body">naar een doel.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Veilig signaal</text><text x="68" y="582" class="body">De pijlen liggen aan deze kant: David</text><text x="68" y="625" class="body">kan komen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Vertreksignaal</text><text x="68" y="774" class="body">De pijlen liggen voorbij de jongen:</text><text x="68" y="817" class="body">David moet weg.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Wat werkelijk gebeurt</text><text x="68" y="966" class="body">Jonathan schiet een pijl voorbij de</text><text x="68" y="1009" class="body">jongen en stuurt hem met de wapens naar</text><text x="68" y="1052" class="body">de stad.</text><text x="46" y="1145" class="note">Drie pijlen horen bij de afspraak; de beschreven</text><text x="46" y="1181" class="note">uitvoering richt de aandacht op één pijl.</text></svg>