<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Twee legers, twee richtingen</title><desc id="desc">De uiteenlopende beoordelingen en vertrekbestemmingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee legers, twee richtingen</text><text x="44" y="113" class="ref">1 Samuël 29:1–11</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin</text><text x="68" y="241" class="body">Filistijnen in Afek; Israël bij de bron</text><text x="68" y="284" class="body">in Jizreël.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De achterhoede</text><text x="68" y="433" class="body">David en zijn mannen trekken met Achis</text><text x="68" y="476" class="body">mee.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het bezwaar</text><text x="68" y="625" class="body">De andere aanvoerders vrezen dat David</text><text x="68" y="668" class="body">zich tegen hen keert.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Achis’ beslissing</text><text x="68" y="817" class="body">Hij vertrouwt David, maar stuurt hem</text><text x="68" y="860" class="body">wegens de vorsten terug.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Bij dageraad</text><text x="68" y="1009" class="body">David naar Filistijns gebied; het</text><text x="68" y="1052" class="body">Filistijnse leger naar Jizreël.</text><text x="46" y="1145" class="note">Achis’ vergelijking met een engel is zijn</text><text x="46" y="1181" class="note">compliment; David wordt niet als engel</text><text x="46" y="1217" class="note">afgebeeld.</text></svg>