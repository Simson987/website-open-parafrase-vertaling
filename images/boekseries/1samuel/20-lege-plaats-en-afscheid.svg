<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">De lege plaats en het afscheid</title><desc id="desc">De maaltijd op twee dagen en het afzonderlijke afscheid in het veld.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De lege plaats en het afscheid</text><text x="44" y="113" class="ref">1 Samuël 20:24–43</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste dag</text><text x="68" y="241" class="body">Davids plaats is leeg; Saul vermoedt</text><text x="68" y="284" class="body">onreinheid.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede dag</text><text x="68" y="433" class="body">Jonathan geeft de afgesproken</text><text x="68" y="476" class="body">verklaring over Bethlehem; Saul wordt</text><text x="68" y="519" class="body">woedend.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De speer</text><text x="68" y="668" class="body">Saul werpt naar Jonathan; Jonathan</text><text x="68" y="711" class="body">verlaat bedroefd de maaltijd.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De volgende morgen</text><text x="68" y="860" class="body">Het afgesproken teken in het veld; de</text><text x="68" y="903" class="body">jongen weet niets van de afspraak.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Zonder de jongen</text><text x="68" y="1052" class="body">David komt tevoorschijn; drie</text><text x="68" y="1095" class="body">buigingen, kussen en tranen; blijvend</text><text x="68" y="1138" class="body">verbond voor de nakomelingen.</text><text x="46" y="1231" class="note">De verklaring aan tafel is de afgesproken</text><text x="46" y="1267" class="note">dekmantel; David zelf blijft in het veld.</text></svg>