<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1197" viewBox="0 0 840 1197" role="img" aria-labelledby="title desc"><title id="title">Gelijk delen en geschenken</title><desc id="desc">Het geschil over de buit en het beginsel van gelijke delen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1197" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gelijk delen en geschenken</text><text x="44" y="113" class="ref">1 Samuël 30:21–31</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Terug bij de tweehonderd</text><text x="68" y="241" class="body">David begroet de achtergebleven mannen.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Het bezwaar</text><text x="68" y="390" class="body">Sommigen willen hun alleen hun gezinnen</text><text x="68" y="433" class="body">teruggeven.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Davids regel</text><text x="68" y="582" class="body">Wie strijdt en wie bij de bagage</text><text x="68" y="625" class="body">blijft, delen gelijk.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De vastlegging</text><text x="68" y="774" class="body">Een verordening en recht in Israël.</text><rect x="42" y="832" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">De geschenken</text><text x="68" y="923" class="body">Een deel gaat naar de oudsten van Juda,</text><text x="68" y="966" class="body">Davids vrienden.</text><text x="46" y="1059" class="note">De vermoeidheid van de achterblijvers wordt</text><text x="46" y="1095" class="note">onderscheiden van de afwijzing door sommige</text><text x="46" y="1131" class="note">strijders.</text></svg>