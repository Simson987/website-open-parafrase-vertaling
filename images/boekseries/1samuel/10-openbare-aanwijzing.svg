<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1247" viewBox="0 0 840 1247" role="img" aria-labelledby="title desc"><title id="title">De openbare aanwijzing</title><desc id="desc">De selectiestappen, de bagage en de uiteenlopende reacties.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1247" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De openbare aanwijzing</text><text x="44" y="113" class="ref">1 Samuël 10:17–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mizpa</text><text x="68" y="241" class="body">Het volk komt per stam en familie</text><text x="68" y="284" class="body">bijeen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het lot</text><text x="68" y="433" class="body">Benjamin → familie van Matri → Saul,</text><text x="68" y="476" class="body">zoon van Kis.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De afwezige kandidaat</text><text x="68" y="625" class="body">Saul wordt tussen de bagage gevonden.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Voor het volk</text><text x="68" y="774" class="body">Hij steekt met zijn schouders boven</text><text x="68" y="817" class="body">iedereen uit; het volk juicht.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Daarna</text><text x="68" y="966" class="body">Recht van het koningschap vastgelegd;</text><text x="68" y="1009" class="body">terug naar huis; ook minachting en</text><text x="68" y="1052" class="body">zwijgen.</text><text x="46" y="1145" class="note">De zalving aan het begin en de openbare</text><text x="46" y="1181" class="note">aanwijzing zijn afzonderlijke gebeurtenissen.</text></svg>