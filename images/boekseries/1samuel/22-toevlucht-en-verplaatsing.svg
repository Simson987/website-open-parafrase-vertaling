<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1161" viewBox="0 0 840 1161" role="img" aria-labelledby="title desc"><title id="title">Toevlucht en verplaatsing</title><desc id="desc">Wie bij David komen en hoe zijn gezin en groep zich verplaatsen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1161" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toevlucht en verplaatsing</text><text x="44" y="113" class="ref">1 Samuël 22:1–5</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Adullam</text><text x="68" y="241" class="body">Broers en vaders familie komen naar de</text><text x="68" y="284" class="body">grot.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De groep</text><text x="68" y="433" class="body">Mensen in nood, met schulden of</text><text x="68" y="476" class="body">verbittering; ongeveer 400 man.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Mizpa in Moab</text><text x="68" y="625" class="body">David vraagt onderdak voor zijn vader</text><text x="68" y="668" class="body">en moeder.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Gads raad</text><text x="68" y="817" class="body">Niet in de vesting blijven; naar Juda.</text><rect x="42" y="875" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Chereth</text><text x="68" y="966" class="body">David gaat naar het woud.</text><text x="46" y="1059" class="note">De plaats Mizpa wordt hier uitdrukkelijk in Moab</text><text x="46" y="1095" class="note">genoemd.</text></svg>