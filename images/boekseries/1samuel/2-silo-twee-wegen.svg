<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Twee wegen bij het heiligdom</title><desc id="desc">Het contrast tussen priestermisbruik, Samuëls groei en de waarschuwing aan Eli.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee wegen bij het heiligdom</text><text x="44" y="113" class="ref">1 Samuël 2:12–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hofni en Pinehas</text><text x="68" y="241" class="body">Misbruik van offers; zij luisteren niet</text><text x="68" y="284" class="body">naar Eli’s waarschuwing.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Samuël</text><text x="68" y="433" class="body">Dient als jongen in een linnen</text><text x="68" y="476" class="body">priesterkleed; krijgt jaarlijks een</text><text x="68" y="519" class="body">mantel.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Hanna’s gezin</text><text x="68" y="668" class="body">Na Samuël krijgt zij drie zonen en twee</text><text x="68" y="711" class="body">dochters.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De boodschap aan Eli</text><text x="68" y="860" class="body">De man van God spreekt over eer voor</text><text x="68" y="903" class="body">zijn zonen en ontrouw aan God.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Het teken en de belofte</text><text x="68" y="1052" class="body">De beide zonen zullen op één dag</text><text x="68" y="1095" class="body">sterven; een betrouwbare priester wordt</text><text x="68" y="1138" class="body">beloofd.</text><text x="46" y="1231" class="note">De aangekondigde sterfdag is hier nog toekomst;</text><text x="46" y="1267" class="note">de gebeurtenis staat in hoofdstuk 4.</text></svg>