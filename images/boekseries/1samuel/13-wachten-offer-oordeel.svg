<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Wachten, offer en oordeel</title><desc id="desc">De volgorde van het wachten, het eigenmachtige offer en de terechtwijzing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wachten, offer en oordeel</text><text x="44" y="113" class="ref">1 Samuël 13:8–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zeven dagen</text><text x="68" y="241" class="body">Saul wacht tot de vastgestelde tijd;</text><text x="68" y="284" class="body">het volk loopt weg.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het offer</text><text x="68" y="433" class="body">Saul brengt het brandoffer.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Samuël komt</text><text x="68" y="582" class="body">Juist na het offer; hij vraagt wat Saul</text><text x="68" y="625" class="body">heeft gedaan.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Sauls uitleg</text><text x="68" y="774" class="body">Weglopend volk, wachten en Filistijnse</text><text x="68" y="817" class="body">dreiging.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Het oordeel</text><text x="68" y="966" class="body">Ongehoorzaamheid; het koningschap zal</text><text x="68" y="1009" class="body">niet standhouden.</text><text x="46" y="1102" class="note">De excuses zijn Sauls antwoord; het oordeel is</text><text x="46" y="1138" class="note">Samuëls boodschap.</text></svg>