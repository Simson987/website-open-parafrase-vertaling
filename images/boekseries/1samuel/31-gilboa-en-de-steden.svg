<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Gilboa en de verlaten steden</title><desc id="desc">De volgorde en plaatsen van de nederlaag en nasleep.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gilboa en de verlaten steden</text><text x="44" y="113" class="ref">1 Samuël 31:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De nederlaag</text><text x="68" y="241" class="body">Israël vlucht op Gilboa; Jonathan,</text><text x="68" y="284" class="body">Abinadab en Malchisua sterven.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Saul en zijn wapendrager</text><text x="68" y="433" class="body">Saul raakt gewond en sterft door zijn</text><text x="68" y="476" class="body">eigen zwaard; de wapendrager volgt.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vlucht</text><text x="68" y="625" class="body">Steden aan de overkant van dal en</text><text x="68" y="668" class="body">Jordaan worden verlaten; Filistijnen</text><text x="68" y="711" class="body">komen er wonen.</text><rect x="42" y="769" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De volgende dag</text><text x="68" y="860" class="body">Filistijnen vinden Saul en zijn zonen.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Wapens en lichaam</text><text x="68" y="1009" class="body">Wapens in de Astartetempel; Sauls</text><text x="68" y="1052" class="body">lichaam aan de muur van Beth-san.</text><text x="46" y="1145" class="note">Deze leeswijzer benoemt het tragische verloop</text><text x="46" y="1181" class="note">zonder de zelfdoding of verminking in beelden te</text><text x="46" y="1217" class="note">tonen.</text></svg>