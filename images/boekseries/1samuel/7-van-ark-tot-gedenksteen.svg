<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Van de ark tot de gedenksteen</title><desc id="desc">De stappen tussen de bewaring van de ark en de gedenksteen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Van de ark tot de gedenksteen</text><text x="44" y="113" class="ref">1 Samuël 7:1–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kirjath-jearim</text><text x="68" y="241" class="body">Huis van Abinadab op de heuvel; zijn</text><text x="68" y="284" class="body">zoon Eleazar bewaakt de ark.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Twintig jaar</text><text x="68" y="433" class="body">Israël verlangt klagend naar de HEERE.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Mizpa</text><text x="68" y="582" class="body">Afgoden wegdoen; water uitgieten,</text><text x="68" y="625" class="body">vasten, belijden en gebed.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De strijd</text><text x="68" y="774" class="body">Samuëls offer en gebed; donder;</text><text x="68" y="817" class="body">achtervolging tot beneden Beth-kar.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Eben-Haëzer</text><text x="68" y="966" class="body">Steen tussen Mizpa en Sen: tot hiertoe</text><text x="68" y="1009" class="body">heeft de HEERE geholpen.</text><text x="46" y="1102" class="note">De gedenksteen van vers 12 volgt op gebed en</text><text x="46" y="1138" class="note">strijd; de ark blijft in het vooraf genoemde</text><text x="46" y="1174" class="note">huis.</text></svg>