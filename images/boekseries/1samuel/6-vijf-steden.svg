<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">Vijf vorsten, vijf steden</title><desc id="desc">De vijf steden en de moeilijkheden aan het einde van de terugkeer.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijf vorsten, vijf steden</text><text x="44" y="113" class="ref">1 Samuël 6:17–21</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vijf steden</text><text x="68" y="241" class="body">Asdod, Gaza, Askelon, Gath en Ekron.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Op de grote steen</text><text x="68" y="390" class="body">Ark en kistje op de akker van Jozua uit</text><text x="68" y="433" class="body">Beth-semes.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De waarschuwing</text><text x="68" y="582" class="body">In de ark kijken; het volk rouwt om het</text><text x="68" y="625" class="body">zware oordeel.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De plaatselijke cijfers</text><text x="68" y="774" class="body">Vers 19 noemt 70 man én 50.000 man. Die</text><text x="68" y="817" class="body">tekstvorm wordt hier niet stilzwijgend</text><text x="68" y="860" class="body">gewijzigd.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De oproep</text><text x="68" y="1009" class="body">Boden vragen Kirjath-jearim om de ark</text><text x="68" y="1052" class="body">op te halen.</text><text x="46" y="1145" class="note">De twee getallen zijn overgenomen uit deze</text><text x="46" y="1181" class="note">vertaling; dit schema lost de tekstvariant niet</text><text x="46" y="1217" class="note">op.</text></svg>