<svg xmlns="http://www.w3.org/2000/svg" width="840" height="969" viewBox="0 0 840 969" role="img" aria-labelledby="title desc"><title id="title">Samuëls jaarlijkse rechtsreis</title><desc id="desc">De vier plaatsen en het verschil tussen rondreis en woonplaats.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="969" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Samuëls jaarlijkse rechtsreis</text><text x="44" y="113" class="ref">1 Samuël 7:15–17</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bethel</text><text x="68" y="241" class="body">Hier spreekt Samuël recht.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Gilgal</text><text x="68" y="390" class="body">Ook deze plaats hoort bij de jaarlijkse</text><text x="68" y="433" class="body">rondreis.</text><rect x="42" y="491" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Mizpa</text><text x="68" y="582" class="body">Rechtspraak tijdens de rondreis.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">Terug naar Rama</text><text x="68" y="731" class="body">Zijn woonplaats; ook daar rechtspraak</text><text x="68" y="774" class="body">en een altaar.</text><text x="46" y="867" class="note">Dit is de genoemde reisvolgorde, zonder</text><text x="46" y="903" class="note">afstanden of ingetekende grenzen.</text></svg>