<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1283" viewBox="0 0 840 1283" role="img" aria-labelledby="title desc"><title id="title">De nachtelijke kampgang</title><desc id="desc">De twee Achimelechs, de metgezel, de voorwerpen en het gesprek op afstand.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1283" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De nachtelijke kampgang</text><text x="44" y="113" class="ref">1 Samuël 26:5–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De tochtgenoot</text><text x="68" y="241" class="body">Abisai, zoon van Zeruja en broer van</text><text x="68" y="284" class="body">Joab, gaat met David mee.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het slapende kamp</text><text x="68" y="433" class="body">Saul in het midden, Abner en volk</text><text x="68" y="476" class="body">rondom; speer bij het hoofd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De beslissing</text><text x="68" y="625" class="body">David verbiedt doden; neemt alleen</text><text x="68" y="668" class="body">speer en waterkruik.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Op grote afstand</text><text x="68" y="817" class="body">David roept Abner en Saul toe vanaf de</text><text x="68" y="860" class="body">overkant.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">De terugkeer</text><text x="68" y="1009" class="body">Een jongeman mag de speer halen; Saul</text><text x="68" y="1052" class="body">erkent zijn fout; ieder vertrekt apart.</text><text x="46" y="1145" class="note">Achimelech de Hethiet wordt ook als mogelijke</text><text x="46" y="1181" class="note">tochtgenoot genoemd; hij is niet de priester uit</text><text x="46" y="1217" class="note">Nob.</text></svg>