<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1290" viewBox="0 0 840 1290" role="img" aria-labelledby="title desc"><title id="title">Nabal en Abigaïls gaven</title><desc id="desc">De exacte aantallen van vee, boden, mannen en meegenomen voedsel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1290" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nabal en Abigaïls gaven</text><text x="44" y="113" class="ref">1 Samuël 25:2–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het bedrijf</text><text x="68" y="241" class="body">Nabal in Maon, bedrijf in Karmel; 3.000</text><text x="68" y="284" class="body">schapen en 1.000 geiten.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De vraag</text><text x="68" y="433" class="body">Tien boden van David vragen voedsel</text><text x="68" y="476" class="body">rond het scheren; Nabal weigert.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Davids mannen</text><text x="68" y="625" class="body">400 trekken met hem mee; 200 blijven</text><text x="68" y="668" class="body">bij de bagage.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Abigaïls voorraad</text><text x="68" y="817" class="body">200 broden, twee zakken wijn, vijf</text><text x="68" y="860" class="body">geslachte schapen en vijf maten</text><text x="68" y="903" class="body">geroosterd graan.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De koeken</text><text x="68" y="1052" class="body">100 rozijnenkoeken en 200 vijgenkoeken;</text><text x="68" y="1095" class="body">alles op ezels, knechten vooruit.</text><text x="46" y="1188" class="note">Vijf maten graan worden hier zonder zelfbedachte</text><text x="46" y="1224" class="note">literomrekening vermeld.</text></svg>