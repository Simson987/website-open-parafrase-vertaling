<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1204" viewBox="0 0 840 1204" role="img" aria-labelledby="title desc"><title id="title">Kiezen en zalven in Bethlehem</title><desc id="desc">De genoemde broers en de volgorde van Davids aanwijzing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1204" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kiezen en zalven in Bethlehem</text><text x="44" y="113" class="ref">1 Samuël 16:6–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eliab</text><text x="68" y="241" class="body">Samuël let aanvankelijk op zijn</text><text x="68" y="284" class="body">uiterlijk; de HEERE ziet het hart.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Abinadab en Samma</text><text x="68" y="433" class="body">Ook zij worden niet gekozen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Zeven zonen</text><text x="68" y="582" class="body">Isaï laat zeven zonen voorbijkomen;</text><text x="68" y="625" class="body">geen van hen is gekozen.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De jongste ontbreekt</text><text x="68" y="774" class="body">David is bij de schapen en wordt</text><text x="68" y="817" class="body">gehaald.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">De zalving</text><text x="68" y="966" class="body">Samuël zalft hem tussen zijn broers;</text><text x="68" y="1009" class="body">daarna vertrekt Samuël naar Rama.</text><text x="46" y="1102" class="note">De zeven voorbijgekomen zonen en de later</text><text x="46" y="1138" class="note">gehaalde jongste zijn samen acht zonen.</text></svg>