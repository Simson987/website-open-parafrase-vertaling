<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1333" viewBox="0 0 840 1333" role="img" aria-labelledby="title desc"><title id="title">Sauls afkomst en de zoektocht</title><desc id="desc">Afstamming en de fasen van de zoektocht die naar Samuël leidt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1333" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Sauls afkomst en de zoektocht</text><text x="44" y="113" class="ref">1 Samuël 9:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vaderlijn</text><text x="68" y="241" class="body">Afiah → Bechorath → Zeror → Abiël → Kis</text><text x="68" y="284" class="body">→ Saul.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De zoektocht</text><text x="68" y="433" class="body">Efraïm, Salisa, Sahalim en Benjamin;</text><text x="68" y="476" class="body">daarna het land Zuf.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het voorstel van de knecht</text><text x="68" y="625" class="body">De ziener raadplegen; ongeveer drie</text><text x="68" y="668" class="body">gram zilver beschikbaar.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De ontmoeting</text><text x="68" y="817" class="body">Waterputsters wijzen de weg; Samuël</text><text x="68" y="860" class="body">ontmoet Saul en zegt dat de ezelinnen</text><text x="68" y="903" class="body">gevonden zijn.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">De ereplaats</text><text x="68" y="1052" class="body">Ongeveer dertig genodigden; het</text><text x="68" y="1095" class="body">bewaarde deel; gesprek op het dak en</text><text x="68" y="1138" class="body">vertrek bij dageraad.</text><text x="46" y="1231" class="note">Pijlen betekenen in deze vaderlijn: vader van.</text><text x="46" y="1267" class="note">De tekst noemt de stad hier niet bij naam.</text></svg>