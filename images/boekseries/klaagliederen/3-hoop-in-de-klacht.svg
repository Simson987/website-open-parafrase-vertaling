<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Hoop midden in de klacht</title><desc id="desc">De beweging van herinnerde bitterheid naar hoop en geduldig wachten, met het vervolg in beeld.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hoop midden in de klacht</text><text x="44" y="113" class="ref">Klaagliederen 3:19–39</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Niet vergeten · 19–20</text><text x="68" y="241" class="body">Ellende, zwerven, alsem en bitterheid</text><text x="68" y="284" class="body">buigen de ziel neer.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ter harte nemen · 21–24</text><text x="68" y="433" class="body">Daarom hoop: trouw, niet vergaan,</text><text x="68" y="476" class="body">barmhartigheid elke morgen nieuw; de</text><text x="68" y="519" class="body">HEERE is mijn deel.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wachten · 25–30</text><text x="68" y="668" class="body">Zoeken en in stilte hopen, het juk</text><text x="68" y="711" class="body">dragen en alleen zwijgen; misschien is</text><text x="68" y="754" class="body">er hoop.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Ontferming en recht · 31–39</text><text x="68" y="903" class="body">Niet voor altijd verstoten, ontferming</text><text x="68" y="946" class="body">om trouw; onrecht in rechtszaken blijft</text><text x="68" y="989" class="body">gezien, eigen zonden onderzocht.</text><text x="46" y="1082" class="note">De hoop heft de klacht niet op. Vanaf vers 40</text><text x="46" y="1118" class="note">klinken opnieuw schuld, vijandschap, tranen en</text><text x="46" y="1154" class="note">een beroep op recht.</text></svg>