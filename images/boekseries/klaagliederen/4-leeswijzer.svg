<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Omgekeerde pracht en twee loten</title><desc id="desc"></desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Omgekeerde pracht en twee loten</text><text x="44" y="113" class="ref">Klaagliederen 4:1–22</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De omkering · 1–12</text><text x="68" y="241" class="body">Goud en kruiken, honger en teloorgang</text><text x="68" y="284" class="body">van vorsten; Sions vuur en de</text><text x="68" y="327" class="body">ongelofelijke binnenkomst van de</text><text x="68" y="370" class="body">vijand.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De oorzaak en afloop · 13–20</text><text x="68" y="519" class="body">Schuld van profeten en priesters,</text><text x="68" y="562" class="body">verstrooiing, vergeefse hulp,</text><text x="68" y="605" class="body">achtervolging en de gevangen gezalfde.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Sion en Edom · 21–22</text><text x="68" y="754" class="body">Edoms vreugde krijgt de beker; Sions</text><text x="68" y="797" class="body">schuld eindigt, Edoms schuld wordt</text><text x="68" y="840" class="body">bezocht.</text><text x="46" y="933" class="note">Dit zijn klaagliederen: stemwisselingen,</text><text x="46" y="969" class="note">beeldspraak, belijdenis en gebed. De klacht en</text><text x="46" y="1005" class="note">de open vragen blijven deel van het geheel.</text></svg>