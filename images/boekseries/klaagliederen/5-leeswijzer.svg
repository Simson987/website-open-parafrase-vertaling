<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1114" viewBox="0 0 840 1114" role="img" aria-labelledby="title desc"><title id="title">Denk aan ons en breng ons terug</title><desc id="desc">Leeswijzer die de klaagstem, de beeldspraak en de bede onderscheidt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1114" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Denk aan ons en breng ons terug</text><text x="44" y="113" class="ref">Klaagliederen 5:1–22</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ons lot · 1–10</text><text x="68" y="241" class="body">Vernedering, verloren erfdeel, wezen en</text><text x="68" y="284" class="body">weduwen, water en hout kopen,</text><text x="68" y="327" class="body">opgejaagd, honger en heerschappij van</text><text x="68" y="370" class="body">anderen.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Onze rouw · 11–18</text><text x="68" y="519" class="body">Geweld en dwangarbeid, lege poort en</text><text x="68" y="562" class="body">zwijgende muziek; gevallen kroon,</text><text x="68" y="605" class="body">beleden schuld en verlaten Sion.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Ons gebed · 19–22</text><text x="68" y="754" class="body">Blijvende troon, vraag naar vergeten en</text><text x="68" y="797" class="body">verlaten, breng ons terug en maak</text><text x="68" y="840" class="body">nieuw; een pijnlijke slotvraag blijft</text><text x="68" y="883" class="body">staan.</text><text x="46" y="976" class="note">Dit zijn klaagliederen: stemwisselingen,</text><text x="46" y="1012" class="note">beeldspraak, belijdenis en gebed. De klacht en</text><text x="46" y="1048" class="note">de open vragen blijven deel van het geheel.</text></svg>