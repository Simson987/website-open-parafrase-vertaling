<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Verwoesting en nachtroep</title><desc id="desc">Leeswijzer die de klaagstem, de beeldspraak en de bede onderscheidt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verwoesting en nachtroep</text><text x="44" y="113" class="ref">Klaagliederen 2:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Wat omverging · 1–9</text><text x="68" y="241" class="body">Pracht, woningen, vestingen, feest,</text><text x="68" y="284" class="body">sabbat, altaar en poorten; koning en</text><text x="68" y="327" class="body">vorsten ver weg, geen visioen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wie rouwen · 10–17</text><text x="68" y="476" class="body">Zwijgende oudsten en tranen; de grote</text><text x="68" y="519" class="body">breuk, misleidende profeten en</text><text x="68" y="562" class="body">spottende vijanden.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De roep · 18–22</text><text x="68" y="711" class="body">Tranen dag en nacht; hart als water</text><text x="68" y="754" class="body">uitstorten, handen heffen en vragen</text><text x="68" y="797" class="body">naar het ondraaglijke lot.</text><text x="46" y="890" class="note">Dit zijn klaagliederen: stemwisselingen,</text><text x="46" y="926" class="note">beeldspraak, belijdenis en gebed. De klacht en</text><text x="46" y="962" class="note">de open vragen blijven deel van het geheel.</text></svg>