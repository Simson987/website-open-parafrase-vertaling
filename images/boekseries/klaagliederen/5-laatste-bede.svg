<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Het laatste gebed</title><desc id="desc">De precieze gang van erkenning, vraag, verzoek en laatste vraag.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het laatste gebed</text><text x="44" y="113" class="ref">Klaagliederen 5:19–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">U · 19</text><text x="68" y="241" class="body">U troont voor altijd, van geslacht op</text><text x="68" y="284" class="body">geslacht.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Waarom? · 20</text><text x="68" y="433" class="body">Waarom voorgoed vergeten en zo lang</text><text x="68" y="476" class="body">verlaten?</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Breng ons terug · 21</text><text x="68" y="625" class="body">Dan keren wij terug; maak onze dagen</text><text x="68" y="668" class="body">nieuw als vroeger.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De slotvraag · 22</text><text x="68" y="817" class="body">Zou U ons helemaal verwerpen, zou U zo</text><text x="68" y="860" class="body">lang boos blijven?</text><text x="46" y="953" class="note">De laatste woorden staan in deze weergave als</text><text x="46" y="989" class="note">vragen. Het lied eindigt met het beroep op God</text><text x="46" y="1025" class="note">en de spanning van het wachten.</text></svg>