<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Ellende, hoop en beroep op recht</title><desc id="desc">Leeswijzer die de klaagstem, de beeldspraak en de bede onderscheidt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ellende, hoop en beroep op recht</text><text x="44" y="113" class="ref">Klaagliederen 3:1–66</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ik zie ellende · 1–18</text><text x="68" y="241" class="body">Duisternis, ommuring, beer en leeuw,</text><text x="68" y="284" class="body">pijl, alsem, as en verdwenen vrede.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Ik houd hoop · 19–39</text><text x="68" y="433" class="body">Bitterheid herinnerd én trouw ter harte</text><text x="68" y="476" class="body">genomen; nieuwe morgen, stil wachten,</text><text x="68" y="519" class="body">ontferming en recht.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wij keren terug · 40–54</text><text x="68" y="668" class="body">Wegen onderzoeken, hart en handen</text><text x="68" y="711" class="body">opheffen, schuld belijden; tranen,</text><text x="68" y="754" class="body">vijanden en water boven het hoofd.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Ik roep U aan · 55–66</text><text x="68" y="903" class="body">Gehoorde stem en wees niet bang;</text><text x="68" y="946" class="body">redding herinnerd, recht in de zaak</text><text x="68" y="989" class="body">gevraagd en vergelding gebeden.</text><text x="46" y="1082" class="note">Dit zijn klaagliederen: stemwisselingen,</text><text x="46" y="1118" class="note">beeldspraak, belijdenis en gebed. De klacht en</text><text x="46" y="1154" class="note">de open vragen blijven deel van het geheel.</text></svg>