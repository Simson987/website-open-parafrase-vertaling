<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De twee boodschappers</title><desc id="desc">De twee boodschappers met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee boodschappers</text><text x="44" y="113" class="ref">Kolossenzen 4:7–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tychikus</text><text x="68" y="241" class="body">Geliefde broeder, trouwe dienaar en</text><text x="68" y="284" class="body">mededienaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zijn opdracht</text><text x="68" y="433" class="body">Vertellen en bemoedigen; weten hoe het</text><text x="68" y="476" class="body">met de gemeente gaat.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Onesimus</text><text x="68" y="625" class="body">Trouwe en geliefde broeder; een van de</text><text x="68" y="668" class="body">Kolossenzen.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Samen</text><text x="68" y="817" class="body">Zij zullen vertellen wat bij Paulus</text><text x="68" y="860" class="body">gebeurt.</text><text x="46" y="953" class="note">Tychikus en Onesimus komen samen met het bericht</text><text x="46" y="989" class="note">over Paulus.</text></svg>