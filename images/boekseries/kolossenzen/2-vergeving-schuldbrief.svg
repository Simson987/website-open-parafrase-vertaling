<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Doop, vergeving en overwinning</title><desc id="desc">Doop, vergeving en overwinning met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Doop, vergeving en overwinning</text><text x="44" y="113" class="ref">Kolossenzen 2:11–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Met Christus · vers 11–12</text><text x="68" y="241" class="body">Besneden zonder mensenhanden, begraven</text><text x="68" y="284" class="body">en opgewekt in de doop.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Levend gemaakt · vers 13</text><text x="68" y="433" class="body">Alle overtredingen vergeven.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De schuldbrief · vers 14</text><text x="68" y="582" class="body">Uitgewist, weggenomen en aan het kruis</text><text x="68" y="625" class="body">genageld.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">De machten · vers 15</text><text x="68" y="774" class="body">Ontwapend en in Christus overwonnen.</text><text x="46" y="867" class="note">De schuldbrief en de overwinningsbeelden</text><text x="46" y="903" class="note">verklaren het betoog; er is geen nieuwe</text><text x="46" y="939" class="note">militaire veldslag beschreven.</text></svg>