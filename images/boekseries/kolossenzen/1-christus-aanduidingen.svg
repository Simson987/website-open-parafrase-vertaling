<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">De genoemde aanduidingen</title><desc id="desc">De genoemde aanduidingen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde aanduidingen</text><text x="44" y="113" class="ref">Kolossenzen 1:15–20</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Beeld en eerstgeborene</text><text x="68" y="241" class="body">Beeld van de onzichtbare God;</text><text x="68" y="284" class="body">eerstgeborene van de schepping.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Door Hem en voor Hem</text><text x="68" y="433" class="body">Alles is geschapen; alles bestaat samen</text><text x="68" y="476" class="body">in Hem.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Hoofd en begin</text><text x="68" y="625" class="body">Hoofd van het lichaam en eerstgeborene</text><text x="68" y="668" class="body">uit de doden.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Volheid en verzoening</text><text x="68" y="817" class="body">Volheid in Hem; vrede door het bloed</text><text x="68" y="860" class="body">van Zijn kruis.</text><text x="46" y="953" class="note">Paulus verbindt deze aanduidingen met Christus’</text><text x="46" y="989" class="note">plaats in schepping en verzoening.</text></svg>