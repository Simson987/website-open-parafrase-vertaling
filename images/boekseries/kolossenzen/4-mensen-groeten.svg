<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Enkele mensen in de groeten</title><desc id="desc">Enkele mensen in de groeten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Enkele mensen in de groeten</text><text x="44" y="113" class="ref">Kolossenzen 4:10–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aristarchus, Markus en Justus</text><text x="68" y="241" class="body">Medegevangene; neef van Barnabas; Jezus</text><text x="68" y="284" class="body">die Justus heet.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Epafras</text><text x="68" y="433" class="body">Bidt voor Kolosse en zet zich ook voor</text><text x="68" y="476" class="body">Laodicea en Hiërapolis in.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Lukas en Demas</text><text x="68" y="625" class="body">De geliefde arts en de andere genoemde</text><text x="68" y="668" class="body">groeter.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Nymfas</text><text x="68" y="817" class="body">Bij hem thuis komt een gemeenschap</text><text x="68" y="860" class="body">samen, volgens deze plaatselijke tekst.</text><text x="46" y="953" class="note">Deze personen worden in de slotgroeten bij naam</text><text x="46" y="989" class="note">genoemd.</text></svg>