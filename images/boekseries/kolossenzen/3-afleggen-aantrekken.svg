<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">Afleggen en aantrekken</title><desc id="desc">Afleggen en aantrekken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Afleggen en aantrekken</text><text x="44" y="113" class="ref">Kolossenzen 3:8–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afleggen · vers 8–9</text><text x="68" y="241" class="body">Drift, woede, kwaadaardigheid, laster,</text><text x="68" y="284" class="body">vuile taal en leugen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aantrekken · vers 12</text><text x="68" y="433" class="body">Barmhartigheid, goedheid, nederigheid,</text><text x="68" y="476" class="body">zachtmoedigheid en geduld.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Elkaar · vers 13</text><text x="68" y="625" class="body">Verdragen en vergeven zoals Christus</text><text x="68" y="668" class="body">vergeven heeft.</text><rect x="42" y="726" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Boven alles · vers 14–15</text><text x="68" y="817" class="body">Liefde als band; vrede en dankbaarheid.</text><text x="46" y="910" class="note">De kleding is een vergelijking voor de oude en</text><text x="46" y="946" class="note">de nieuwe levenswijze.</text></svg>