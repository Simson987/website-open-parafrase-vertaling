<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1012" viewBox="0 0 840 1012" role="img" aria-labelledby="title desc"><title id="title">De brieven laten voorlezen</title><desc id="desc">De brieven laten voorlezen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1012" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De brieven laten voorlezen</text><text x="44" y="113" class="ref">Kolossenzen 4:16–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Deze brief</text><text x="68" y="241" class="body">Eerst bij jullie voorgelezen en ook in</text><text x="68" y="284" class="body">Laodicea laten lezen.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De brief uit Laodicea</text><text x="68" y="433" class="body">Ook zelf lezen.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Archippus</text><text x="68" y="582" class="body">De ontvangen dienst in de Heere</text><text x="68" y="625" class="body">afmaken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Paulus</text><text x="68" y="774" class="body">Schrijft de groet zelf en vraagt aan</text><text x="68" y="817" class="body">zijn boeien te denken.</text><text x="46" y="910" class="note">De tekst noemt de andere brief zonder die nader</text><text x="46" y="946" class="note">te identificeren.</text></svg>