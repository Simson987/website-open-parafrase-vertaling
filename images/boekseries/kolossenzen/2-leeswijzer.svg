<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1055" viewBox="0 0 840 1055" role="img" aria-labelledby="title desc"><title id="title">Geworteld en vrij in Christus</title><desc id="desc">Opbouw van het volledige hoofdstuk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1055" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Geworteld en vrij in Christus</text><text x="44" y="113" class="ref">Kolossenzen 2:1–23</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">1–7 · Bemoedigd en vast</text><text x="68" y="241" class="body">Samengevoegd in liefde, geworteld in</text><text x="68" y="284" class="body">Christus.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">8–15 · De volheid in Hem</text><text x="68" y="433" class="body">Doop, vergeving, schuldbrief en</text><text x="68" y="476" class="body">ontwapende machten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">16–19 · Oordeel en het Hoofd</text><text x="68" y="625" class="body">Eten, dagen en engelenverering</text><text x="68" y="668" class="body">tegenover vasthouden aan Christus.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">20–23 · Menselijke regels</text><text x="68" y="817" class="body">De grondregels en hun schijn van</text><text x="68" y="860" class="body">wijsheid.</text><text x="46" y="953" class="note">Gebeurtenissen, onderwijs en beeldspraak volgen</text><text x="46" y="989" class="note">de plaatselijke versindeling.</text></svg>