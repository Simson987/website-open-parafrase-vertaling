<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Raderen en vertrekkende glans</title><desc id="desc">Hoofdstukopbouw met de verschillende vertelvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Raderen en vertrekkende glans</text><text x="44" y="113" class="ref">Ezechiël 10:1–22</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kolen en wolk · 1–8</text><text x="68" y="241" class="body">Troonachtig saffier, man in linnen</text><text x="68" y="284" class="body">ontvangt vuur; cherubs rechts van het</text><text x="68" y="327" class="body">huis, glans bij de drempel.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Raderen en gezichten · 9–17</text><text x="68" y="476" class="body">Vier turkooisachtige raderen, rad in</text><text x="68" y="519" class="body">rad en ogen; vier gezichten, niet</text><text x="68" y="562" class="body">omdraaien, samen bewegen en opstijgen.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Naar de oostpoort · 18–22</text><text x="68" y="711" class="body">Heerlijkheid van de drempel boven</text><text x="68" y="754" class="body">cherubs; zij stijgen op tot de</text><text x="68" y="797" class="body">oostpoort. Herkend als dezelfde wezens</text><text x="68" y="840" class="body">aan de Chebar.</text><text x="46" y="933" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="969" class="note">Visioen, gesproken opdracht, tekenhandeling en</text><text x="46" y="1005" class="note">verklaring worden onderscheiden.</text></svg>