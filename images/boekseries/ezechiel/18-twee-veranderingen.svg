<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Twee veranderingen van weg</title><desc id="desc">De twee verschillende veranderingen en hun gevolgen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee veranderingen van weg</text><text x="44" y="113" class="ref">Ezechiël 18:21–29</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Van kwaad naar recht · 21–23</text><text x="68" y="241" class="body">Alle zonden verlaten, wetten bewaren,</text><text x="68" y="284" class="body">recht en gerechtigheid doen: leven;</text><text x="68" y="327" class="body">vroegere overtredingen niet</text><text x="68" y="370" class="body">aangerekend.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Van recht naar kwaad · 24–26</text><text x="68" y="519" class="body">Gerechtigheid verlaten en gruwelen</text><text x="68" y="562" class="body">doen: sterven om eigen trouwbreuk;</text><text x="68" y="605" class="body">eerder goed niet meer aangerekend.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het antwoord · 27–29</text><text x="68" y="754" class="body">Wie terugkeert van kwaad en recht doet,</text><text x="68" y="797" class="body">blijft leven. De oneerlijkheidsvraag</text><text x="68" y="840" class="body">wordt teruggelegd bij het volk.</text><text x="46" y="933" class="note">De beide richtingen krijgen elk hun eigen</text><text x="46" y="969" class="note">voorwaarde en uitkomst. Daarna volgt de oproep</text><text x="46" y="1005" class="note">tot bekering en leven.</text></svg>