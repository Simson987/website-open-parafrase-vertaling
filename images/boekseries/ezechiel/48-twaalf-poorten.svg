<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1080" viewBox="0 0 840 1080"><title>Twaalf poorten en de stadsnaam</title><rect width="840" height="1080" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="35" font-weight="700">Twaalf poorten en de stadsnaam</text><text x="42" y="105" font-size="27">Ezechiël 48:30–35</text><rect x="205" y="270" width="430" height="430" fill="#e1ead8" stroke="#52725e" stroke-width="5"/><path d="M262 270 H288" stroke="#faf7ed" stroke-width="10"/><text x="275" y="235" text-anchor="middle" font-size="25">Ruben</text><path d="M407 270 H433" stroke="#faf7ed" stroke-width="10"/><text x="420" y="235" text-anchor="middle" font-size="25">Juda</text><path d="M552 270 H578" stroke="#faf7ed" stroke-width="10"/><text x="565" y="235" text-anchor="middle" font-size="25">Levi</text><path d="M262 700 H288" stroke="#faf7ed" stroke-width="10"/><text x="275" y="755" text-anchor="middle" font-size="25">Simeon</text><path d="M407 700 H433" stroke="#faf7ed" stroke-width="10"/><text x="420" y="755" text-anchor="middle" font-size="25">Issaschar</text><path d="M552 700 H578" stroke="#faf7ed" stroke-width="10"/><text x="565" y="755" text-anchor="middle" font-size="25">Zebulon</text><path d="M205 327 V353" stroke="#faf7ed" stroke-width="10"/><text x="175" y="349" text-anchor="end" font-size="25">Gad</text><path d="M205 472 V498" stroke="#faf7ed" stroke-width="10"/><text x="175" y="494" text-anchor="end" font-size="25">Aser</text><path d="M205 617 V643" stroke="#faf7ed" stroke-width="10"/><text x="175" y="639" text-anchor="end" font-size="25">Naftali</text><path d="M635 327 V353" stroke="#faf7ed" stroke-width="10"/><text x="665" y="349" text-anchor="start" font-size="25">Jozef</text><path d="M635 472 V498" stroke="#faf7ed" stroke-width="10"/><text x="665" y="494" text-anchor="start" font-size="25">Benjamin</text><path d="M635 617 V643" stroke="#faf7ed" stroke-width="10"/><text x="665" y="639" text-anchor="start" font-size="25">Dan</text><text x="420" y="185" text-anchor="middle" font-size="27" font-weight="700">NOORD</text><text x="420" y="810" text-anchor="middle" font-size="27" font-weight="700">ZUID</text><text x="70" y="290" font-size="24">WEST</text><text x="690" y="290" font-size="24">OOST</text><text x="420" y="450" text-anchor="middle" font-size="29" font-weight="700">DE HEERE IS DAAR</text><text x="420" y="505" text-anchor="middle" font-size="26">Elke zijde ruim 2 km</text><text x="420" y="550" text-anchor="middle" font-size="26">Omtrek ongeveer 9 km</text><text x="42" y="885" font-size="26">Namen per zijde volgen de tekst. De plaats binnen</text><text x="42" y="925" font-size="26">elke zijde is schematisch; geen straatplan toegevoegd.</text><text x="42" y="965" font-size="26">Levi en Jozef zijn poortnamen; Manasse en Efraïm</text><text x="42" y="1005" font-size="26">zijn afzonderlijke namen bij de landstroken.</text></g></svg>