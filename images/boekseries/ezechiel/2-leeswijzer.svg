<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">Opstaan, spreken en luisteren</title><desc id="desc">Hoofdstukopbouw met de verschillende vertelvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opstaan, spreken en luisteren</text><text x="44" y="113" class="ref">Ezechiël 2:1–10</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Opgericht · 1–2</text><text x="68" y="241" class="body">Mensenkind, sta op; de Geest zet hem op</text><text x="68" y="284" class="body">zijn voeten en hij hoort.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gezonden · 3–7</text><text x="68" y="433" class="body">Naar een opstandig volk; zeggen wat Hij</text><text x="68" y="476" class="body">spreekt, ongeacht horen of weigeren,</text><text x="68" y="519" class="body">niet vrezen voor woorden.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zelf horen · 8–10</text><text x="68" y="668" class="body">Niet zelf opstandig zijn; mond open,</text><text x="68" y="711" class="body">ontvangen rol, voor- en achterkant</text><text x="68" y="754" class="body">beschreven met klacht en gejammer.</text><text x="46" y="847" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="883" class="note">Visioen, gesproken opdracht, tekenhandeling en</text><text x="46" y="919" class="note">verklaring worden onderscheiden.</text></svg>