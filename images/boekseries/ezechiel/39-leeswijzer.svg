<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Gogs val en het verzamelen</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gogs val en het verzamelen</text><text x="44" y="113" class="ref">Ezechiël 39:1–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het einde · 1–8</text><text x="68" y="241" class="body">Boog en pijlen vallen, Gog op de</text><text x="68" y="284" class="body">bergen, vuur in Magog en op eilanden;</text><text x="68" y="327" class="body">heilige naam bekend.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het reinigen · 9–16</text><text x="68" y="476" class="body">Wapens zeven jaar stoken, zeven maanden</text><text x="68" y="519" class="body">begraven, daarna zoeken en merktekens;</text><text x="68" y="562" class="body">dal en Hamona.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het offerbeeld · 17–20</text><text x="68" y="711" class="body">Vogels en dieren naar het grote offer:</text><text x="68" y="754" class="body">een beeld van het oordeel, geen</text><text x="68" y="797" class="body">maaltijduitnodiging aan lezers.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Erkenning en herstel · 21–29</text><text x="68" y="946" class="body">Volken zien oordeel en reden voor</text><text x="68" y="989" class="body">ballingschap; lot van Jakob gekeerd,</text><text x="68" y="1032" class="body">allen verzameld en Geest uitgegoten.</text><text x="46" y="1125" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="1161" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="1197" class="note">beschreven bericht blijven onderscheiden.</text></svg>