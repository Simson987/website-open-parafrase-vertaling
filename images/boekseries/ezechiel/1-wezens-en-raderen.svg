<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Vier wezens en vier raderen</title><desc id="desc">Aantallen en onderlinge verbanden in het eerste visioen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier wezens en vier raderen</text><text x="44" y="113" class="ref">Ezechiël 1:5–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Elk wezen · 5–11</text><text x="68" y="241" class="body">Mensachtig; vier gezichten en vier</text><text x="68" y="284" class="body">vleugels, rechte benen, kalfshoeven en</text><text x="68" y="327" class="body">mensenhanden onder de vleugels.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De gezichten · 10</text><text x="68" y="476" class="body">Mens; leeuw rechts; stier links; arend.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">De vleugels · 11</text><text x="68" y="625" class="body">Twee raken de vleugels van de ander;</text><text x="68" y="668" class="body">twee bedekken het lichaam.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De raderen · 15–21</text><text x="68" y="817" class="body">Bij elk wezen een rad, glans als</text><text x="68" y="860" class="body">turkoois, rad in rad en velgen vol</text><text x="68" y="903" class="body">ogen; samen gaan, staan en opstijgen.</text><text x="46" y="996" class="note">Dit geeft de tekstuele verhoudingen van het</text><text x="46" y="1032" class="note">gezicht weer. Het is geen anatomische afbeelding</text><text x="46" y="1068" class="note">van een gewoon dier of mens.</text></svg>