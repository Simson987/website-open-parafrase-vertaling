<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">Poort en loopregels</title><desc id="desc">De vier verschillende openstellings- en loopregels.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Poort en loopregels</text><text x="44" y="113" class="ref">Ezechiël 46:1–12</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De binnenste oostpoort · 1–3</text><text x="68" y="241" class="body">Zes werkdagen gesloten; sabbat en</text><text x="68" y="284" class="body">nieuwe maan open. Vorst bij deurpost en</text><text x="68" y="327" class="body">drempel, volk bij de ingang; open tot</text><text x="68" y="370" class="body">avond.</text><rect x="42" y="428" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Vorst · 8</text><text x="68" y="519" class="body">In en uit via dezelfde voorhal.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Volk op feesten · 9–10</text><text x="68" y="668" class="body">Noord in → zuid uit; zuid in → noord</text><text x="68" y="711" class="body">uit. Niet terug door dezelfde poort;</text><text x="68" y="754" class="body">vorst in hun midden.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Vrijwillig offer · 12</text><text x="68" y="903" class="body">Oostpoort voor de vorst open; na zijn</text><text x="68" y="946" class="body">vertrek weer dicht.</text><text x="46" y="1039" class="note">Deze binnenste poort is niet de blijvend</text><text x="46" y="1075" class="note">gesloten buitenste oostpoort van hoofdstuk 44.</text><text x="46" y="1111" class="note">De eigen loopregels voor vorst en volk blijven</text><text x="46" y="1147" class="note">apart.</text></svg>