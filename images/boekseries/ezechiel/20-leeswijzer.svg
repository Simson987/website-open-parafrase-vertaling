<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1150" viewBox="0 0 840 1150" role="img" aria-labelledby="title desc"><title id="title">Opstand, naam en verzamelen</title><desc id="desc">Hoofdstukopbouw die tekstvorm en verklaring zichtbaar houdt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1150" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Opstand, naam en verzamelen</text><text x="44" y="113" class="ref">Ezechiël 20:1–49</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het verleden · 1–29</text><text x="68" y="241" class="body">Oudsten raadplegen; Egypte,</text><text x="68" y="284" class="body">woestijnouders en hun kinderen,</text><text x="68" y="327" class="body">sabbatten en offerhoogten. Telkens</text><text x="68" y="370" class="body">opstand en om Zijn naam sparen.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Het heden en wat komt · 30–44</text><text x="68" y="519" class="body">Geen hout en steen dienen als de</text><text x="68" y="562" class="body">volken; vergaderen, in de woestijn</text><text x="68" y="605" class="body">richten, onder de staf, aannemen en</text><text x="68" y="648" class="body">schuldbesef.</text><rect x="42" y="706" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">De zuidelijke gelijkenis · 45–49</text><text x="68" y="797" class="body">Bos met groene en dorre bomen brandt;</text><text x="68" y="840" class="body">de vraag van de profeet naar het</text><text x="68" y="883" class="body">spreken in gelijkenissen.</text><text x="46" y="976" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="1012" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="1048" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="1084" class="note">verband.</text></svg>