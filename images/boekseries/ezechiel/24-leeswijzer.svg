<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Pot, rouwteken en bericht</title><desc id="desc">De opbouw van het hoofdstuk met de verschillende sprekers en tekstvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Pot, rouwteken en bericht</text><text x="44" y="113" class="ref">Ezechiël 24:1–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Deze dag · 1–2</text><text x="68" y="241" class="body">Negende jaar, tiende maand, tiende dag:</text><text x="68" y="284" class="body">het beleg begint; de dag moet worden</text><text x="68" y="327" class="body">opgeschreven.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De pot · 3–14</text><text x="68" y="476" class="body">Water en goede stukken, koken en</text><text x="68" y="519" class="body">verwijderen, lege koperen pot in het</text><text x="68" y="562" class="body">vuur; hardnekkige aanslag als</text><text x="68" y="605" class="body">stadsschuld.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het persoonlijke teken · 15–24</text><text x="68" y="754" class="body">Vrouw sterft in de avond, volgende</text><text x="68" y="797" class="body">morgen geen gewone rouw; uitleg bij het</text><text x="68" y="840" class="body">verlies van heiligdom en kinderen.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">De aangekondigde bode · 25–27</text><text x="68" y="989" class="body">Op de genoemde dag komt een ontkomene,</text><text x="68" y="1032" class="body">mond gaat open en zwijgen eindigt;</text><text x="68" y="1075" class="body">Ezechiël is een teken.</text><text x="46" y="1168" class="note">De versgroepen volgen deze plaatselijke tekst.</text><text x="46" y="1204" class="note">Aankondiging, gelijkenis en beschreven handeling</text><text x="46" y="1240" class="note">worden onderscheiden.</text></svg>