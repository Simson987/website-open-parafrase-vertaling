<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Ruimten en drie lagen</title><desc id="desc">De hoofdruimten en de eigen structuur van de drie lagen zijkamers.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ruimten en drie lagen</text><text x="44" y="113" class="ref">Ezechiël 41:2–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hoofdruimten · 2–4</text><text x="68" y="241" class="body">Tempel 20 × 10 m; allerheiligste 10 ×</text><text x="68" y="284" class="body">10 m.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Kamers · 5–7</text><text x="68" y="433" class="body">Elke zijkamer 2 m breed; dertig per</text><text x="68" y="476" class="body">laag, drie lagen; boven breder, via</text><text x="68" y="519" class="body">middelste naar boven.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Muren en ruimte · 5,8–11</text><text x="68" y="668" class="body">Huismuur 3 m; kamerfundament ongeveer 3</text><text x="68" y="711" class="body">m hoog; buitenmuur 2,5 m, genoemde open</text><text x="68" y="754" class="body">ruimten 10 m en 2,5 m.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Westelijk gebouw · 12–15</text><text x="68" y="903" class="body">35 m breed, 45 m lang, muur 2,5 m;</text><text x="68" y="946" class="body">daarnaast afzonderlijke totale</text><text x="68" y="989" class="body">meetlijnen van 50 m.</text><text x="46" y="1082" class="note">De maten horen bij verschillende meetlijnen.</text><text x="46" y="1118" class="note">Deze zijkamers worden boven breder; de andere</text><text x="46" y="1154" class="note">kamers in hoofdstuk 42 worden boven smaller.</text></svg>