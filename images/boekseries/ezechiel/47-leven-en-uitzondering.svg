<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1256" viewBox="0 0 840 1256" role="img" aria-labelledby="title desc"><title id="title">Levend water, zout en vrucht</title><desc id="desc">De levenswerking, expliciete uitzondering en functie van vrucht en blad.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1256" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levend water, zout en vrucht</text><text x="44" y="113" class="ref">Ezechiël 47:8–12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De stroom · 8–9</text><text x="68" y="241" class="body">Naar oosten, Jordaanvlakte en zee;</text><text x="68" y="284" class="body">water gezond en leven waar de rivier</text><text x="68" y="327" class="body">komt, zeer veel vis.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vissers · 10</text><text x="68" y="476" class="body">Van En-Gedi tot En-Eglaïm, netten</text><text x="68" y="519" class="body">drogen, allerlei vis als in de grote</text><text x="68" y="562" class="body">zee.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Uitzondering · 11</text><text x="68" y="711" class="body">Moerassen en poelen worden niet gezond;</text><text x="68" y="754" class="body">zij blijven voor zout.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Beide oevers · 12</text><text x="68" y="903" class="body">Blad niet verwelkt, vrucht niet op,</text><text x="68" y="946" class="body">elke maand nieuw; vrucht als voedsel en</text><text x="68" y="989" class="body">blad als medicijn.</text><text x="46" y="1082" class="note">De zoute poelen worden niet weggelaten om de</text><text x="46" y="1118" class="note">voorstelling mooier te maken. Het schema geeft</text><text x="46" y="1154" class="note">de visioenbeschrijving, geen medische</text><text x="46" y="1190" class="note">gebruiksaanwijzing.</text></svg>