<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1021" viewBox="0 0 840 1021" role="img" aria-labelledby="title desc"><title id="title">Wijnhout en Jeruzalem</title><desc id="desc">Hoofdstukopbouw die tekstvorm en verklaring zichtbaar houdt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1021" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wijnhout en Jeruzalem</text><text x="44" y="113" class="ref">Ezechiël 15:1–8</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vraag · 1–3</text><text x="68" y="241" class="body">Wijnhout tegenover boshout: bruikbaar</text><text x="68" y="284" class="body">om iets te maken of een pin te snijden?</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Het vuur · 4–5</text><text x="68" y="433" class="body">Uiteinden verbrand en midden zwart; wat</text><text x="68" y="476" class="body">heel al onbruikbaar was, is nu nog</text><text x="68" y="519" class="body">minder bruikbaar.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De uitleg · 6–8</text><text x="68" y="668" class="body">Zo de bewoners van Jeruzalem; aan vuur</text><text x="68" y="711" class="body">overgegeven, het land verlaten om zware</text><text x="68" y="754" class="body">overtreding.</text><text x="46" y="847" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="883" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="919" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="955" class="note">verband.</text></svg>