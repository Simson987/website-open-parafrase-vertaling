<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Ontvangen en verkeerd gebruikt</title><desc id="desc">De concrete gaven, hun omkering en de plaats van het slotverbond.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ontvangen en verkeerd gebruikt</text><text x="44" y="113" class="ref">Ezechiël 16:10–21,60–63</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ontvangen · 10–14</text><text x="68" y="241" class="body">Kleding, leer, linnen, zijde, sieraden,</text><text x="68" y="284" class="body">kroon; meelbloem, honing en olie,</text><text x="68" y="327" class="body">koninklijke pracht.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Omgekeerd · 15–19</text><text x="68" y="476" class="body">Schoonheid voor ontrouw, kleding voor</text><text x="68" y="519" class="body">offerhoogten en beelden, goud en zilver</text><text x="68" y="562" class="body">voor beelden, voedsel als offer.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het dieptepunt · 20–21</text><text x="68" y="711" class="body">Zonen en dochters geofferd; hun leven</text><text x="68" y="754" class="body">niet beschermd.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het slot · 60–63</text><text x="68" y="903" class="body">Zijn verbond herinnerd en eeuwig</text><text x="68" y="946" class="body">opgericht; erkenning, schaamte en</text><text x="68" y="989" class="body">verzoening.</text><text x="46" y="1082" class="note">Het schema volgt de aanklacht tegen Jeruzalem</text><text x="46" y="1118" class="note">van ontvangen gave tot misbruik en het laatste</text><text x="46" y="1154" class="note">woord van verzoening.</text></svg>