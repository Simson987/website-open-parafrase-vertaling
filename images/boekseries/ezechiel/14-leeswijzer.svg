<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1107" viewBox="0 0 840 1107" role="img" aria-labelledby="title desc"><title id="title">Hart, raadpleging en gerechtigheid</title><desc id="desc">Hoofdstukopbouw die tekstvorm en verklaring zichtbaar houdt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1107" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Hart, raadpleging en gerechtigheid</text><text x="44" y="113" class="ref">Ezechiël 14:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De raadplegers · 1–11</text><text x="68" y="241" class="body">Oudsten met afgoden in het hart;</text><text x="68" y="284" class="body">terugkeer gevraagd, vrager en verleid</text><text x="68" y="327" class="body">profeet dragen hun schuld.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vier gevallen · 12–20</text><text x="68" y="476" class="body">Hongersnood, wilde dieren, zwaard en</text><text x="68" y="519" class="body">pest; zelfs Noach, Daniël en Job redden</text><text x="68" y="562" class="body">alleen zichzelf.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Jeruzalem en de rest · 21–23</text><text x="68" y="711" class="body">Vier zware straffen samen;</text><text x="68" y="754" class="body">overblijvende zonen en dochters komen,</text><text x="68" y="797" class="body">hun daden laten de reden van het</text><text x="68" y="840" class="body">oordeel zien.</text><text x="46" y="933" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="969" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="1005" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="1041" class="note">verband.</text></svg>