<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1299" viewBox="0 0 840 1299" role="img" aria-labelledby="title desc"><title id="title">Stenen in het klaaglied</title><desc id="desc">De exacte negen steennamen en hun plaats binnen het klaaglied.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1299" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Stenen in het klaaglied</text><text x="44" y="113" class="ref">Ezechiël 28:12–19</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aangesprokene · 12</text><text x="68" y="241" class="body">Het klaaglied is opgedragen aan de</text><text x="68" y="284" class="body">koning van Tyrus.</text><rect x="42" y="342" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">De negen namen · 13</text><text x="68" y="433" class="body">Robijn, topaas, diamant; turkoois,</text><text x="68" y="476" class="body">onyx, jaspis; saffier, granaat,</text><text x="68" y="519" class="body">smaragd. Daarbij goud, tamboerijnen en</text><text x="68" y="562" class="body">fluiten.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De beeldtaal · 14–16</text><text x="68" y="711" class="body">Gezalfde beschermende cherub, heilige</text><text x="68" y="754" class="body">berg, vurige stenen; onrecht, geweld en</text><text x="68" y="797" class="body">verbanning.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De omkering · 17–19</text><text x="68" y="946" class="body">Trots om schoonheid, bedorven wijsheid,</text><text x="68" y="989" class="body">op aarde geworpen, vuur en as voor wie</text><text x="68" y="1032" class="body">kijken.</text><text x="46" y="1125" class="note">Het schema geeft de beeldtaal en eigen</text><text x="46" y="1161" class="note">aanspreking weer. Het vult geen andere persoon</text><text x="46" y="1197" class="note">of mineralogische identificatie buiten deze</text><text x="46" y="1233" class="note">tekst in.</text></svg>