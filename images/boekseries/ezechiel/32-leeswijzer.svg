<svg xmlns="http://www.w3.org/2000/svg" width="840" height="879" viewBox="0 0 840 879" role="img" aria-labelledby="title desc"><title id="title">Twee klachten over Farao</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="879" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee klachten over Farao</text><text x="44" y="113" class="ref">Ezechiël 32:1–32</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste dag · 1–16</text><text x="68" y="241" class="body">Twaalfde jaar, twaalfde maand: leeuw en</text><text x="68" y="284" class="body">krokodil, net, donkerte, volken</text><text x="68" y="327" class="body">geschokt, Babels zwaard en stil water;</text><text x="68" y="370" class="body">vrouwen zingen.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Vijftiende dag · 17–32</text><text x="68" y="519" class="body">Twaalfde jaar: afdalen bij andere</text><text x="68" y="562" class="body">volken in de kuil, elk met hun menigte;</text><text x="68" y="605" class="body">Farao ziet hen en wordt daar</text><text x="68" y="648" class="body">neergelegd.</text><text x="46" y="741" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="777" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="813" class="note">beschreven bericht blijven onderscheiden.</text></svg>