<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1561" viewBox="0 0 840 1561" role="img" aria-labelledby="title desc"><title id="title">Volken in de tweede klacht</title><desc id="desc">Exacte opgesomde groepen en hun plaats in de klacht.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1561" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Volken in de tweede klacht</text><text x="44" y="113" class="ref">Ezechiël 32:22–32</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Assur · 22–23</text><text x="68" y="241" class="body">Heel zijn leger en graven rondom;</text><text x="68" y="284" class="body">schrik in het land van de levenden.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Elam · 24–25</text><text x="68" y="433" class="body">Hele menigte en graven; schande met wie</text><text x="68" y="476" class="body">in de kuil zijn.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Mesech en Tubal · 26–28</text><text x="68" y="625" class="body">Hun menigte, gevallen en onbesneden;</text><text x="68" y="668" class="body">apart onderscheid met vroegere helden</text><text x="68" y="711" class="body">en hun wapens.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Edom · 29</text><text x="68" y="860" class="body">Koningen en vorsten, ondanks hun macht</text><text x="68" y="903" class="body">bij de gevallenen.</text><rect x="42" y="961" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Noorden en Sidoniërs · 30</text><text x="68" y="1052" class="body">Machtigen van het noorden en alle</text><text x="68" y="1095" class="body">Sidoniërs, beschaamd om hun</text><text x="68" y="1138" class="body">schrikmacht.</text><rect x="42" y="1196" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1239" class="label">Farao · 31–32</text><text x="68" y="1287" class="body">Ziet hen en troost zich over zijn</text><text x="68" y="1330" class="body">menigte; zelf bij hen neergelegd.</text><text x="46" y="1423" class="note">De volgorde is die van het klaaglied. Dit is</text><text x="46" y="1459" class="note">geen geografische kaart van het dodenrijk of</text><text x="46" y="1495" class="note">extra historische ontmoeting.</text></svg>