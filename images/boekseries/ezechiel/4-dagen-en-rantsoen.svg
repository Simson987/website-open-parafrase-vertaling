<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Dagen, gewassen en rantsoen</title><desc id="desc">Exacte aantallen, namen en verbanden van de tekenhandeling.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Dagen, gewassen en rantsoen</text><text x="44" y="113" class="ref">Ezechiël 4:4–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tijd · 4–8</text><text x="68" y="241" class="body">Links: Israël, 390 dagen. Rechts: Juda,</text><text x="68" y="284" class="body">40 dagen. Elke dag voor een jaar.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Zes gewassen · 9</text><text x="68" y="433" class="body">Tarwe, gerst, bonen, linzen, gierst en</text><text x="68" y="476" class="body">spelt; samen in één pot voor brood.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Per dag · 10–11</text><text x="68" y="625" class="body">Ongeveer 200 gram eten en ongeveer 6</text><text x="68" y="668" class="body">deciliter water, op vaste tijden.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Brandstof · 12–15</text><text x="68" y="817" class="body">Eerst mensenpoep genoemd; na bezwaar</text><text x="68" y="860" class="body">wordt koeienmest in plaats daarvan</text><text x="68" y="903" class="body">toegestaan.</text><text x="46" y="996" class="note">Hoeveelheden volgen de benaderde maten van deze</text><text x="46" y="1032" class="note">weergave. Dagen, bestanddelen en voedselrantsoen</text><text x="46" y="1068" class="note">hebben elk hun eigen eenheid.</text></svg>