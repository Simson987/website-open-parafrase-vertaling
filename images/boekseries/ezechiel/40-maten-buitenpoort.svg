<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1448" viewBox="0 0 840 1448" role="img" aria-labelledby="title desc"><title id="title">Maten van muur en poorten</title><desc id="desc">Controleerbare maten, aantallen wachtkamers en verschil tussen zeven en acht treden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1448" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Maten van muur en poorten</text><text x="44" y="113" class="ref">Ezechiël 40:5–16,20–37</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Muur en meetlat · 5</text><text x="68" y="241" class="body">Meetlat ongeveer 3 m; muur één meetlat</text><text x="68" y="284" class="body">dik en één meetlat hoog.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wachtkamers · 7,10,12</text><text x="68" y="433" class="body">Drie per kant, elk één meetlat bij één</text><text x="68" y="476" class="body">meetlat; tussenruimte 2,5 m en</text><text x="68" y="519" class="body">afscheiding 0,5 m.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Opening en drempels · 6–13</text><text x="68" y="668" class="body">Drempels één meetlat diep; opening 5 m</text><text x="68" y="711" class="body">breed, genoemde lengte 6,5 m;</text><text x="68" y="754" class="body">dak-tot-dak 12,5 m.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Lengte · 15,21,25,29</text><text x="68" y="903" class="body">Poortcomplex 25 m lang; noord en zuid</text><text x="68" y="946" class="body">evenals de eerste poort, 12,5 m breed.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De trappen · 22,26,31,34,37</text><text x="68" y="1095" class="body">Buitenste noord en zuid: zeven treden.</text><text x="68" y="1138" class="body">De drie gemeten binnenpoorten: acht</text><text x="68" y="1181" class="body">treden.</text><text x="46" y="1274" class="note">De afgeronde meters zijn die van deze weergave.</text><text x="46" y="1310" class="note">De onderscheiden meetpunten worden niet tot één</text><text x="46" y="1346" class="note">nieuwe maat of volledige schaalplattegrond</text><text x="46" y="1382" class="note">samengevoegd.</text></svg>