<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1064" viewBox="0 0 840 1064" role="img" aria-labelledby="title desc"><title id="title">Nieuwe geest en vertrek</title><desc id="desc">Hoofdstukopbouw die tekstvorm en verklaring zichtbaar houdt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1064" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nieuwe geest en vertrek</text><text x="44" y="113" class="ref">Ezechiël 11:1–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij de poort · 1–13</text><text x="68" y="241" class="body">Slechte raad, potvergelijking</text><text x="68" y="284" class="body">omgekeerd, oordeel en Pelatja’s dood;</text><text x="68" y="327" class="body">de profeet vraagt naar de rest.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De verdrevenen · 14–21</text><text x="68" y="476" class="body">Heiligdom in vreemde landen,</text><text x="68" y="519" class="body">verzamelen, afgoden weg, één hart en</text><text x="68" y="562" class="body">nieuwe geest voor gehoorzaam leven.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het vertrek · 22–25</text><text x="68" y="711" class="body">Glans met cherubs naar de oostelijke</text><text x="68" y="754" class="body">berg; terug naar Chaldea, het visioen</text><text x="68" y="797" class="body">eindigt en wordt verteld.</text><text x="46" y="890" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="926" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="962" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="998" class="note">verband.</text></svg>