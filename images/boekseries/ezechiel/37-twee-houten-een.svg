<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Twee stukken hout, één volk</title><desc id="desc">De beide opschriften, handeling en de expliciete uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee stukken hout, één volk</text><text x="44" y="113" class="ref">Ezechiël 37:16–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste opschrift · 16</text><text x="68" y="241" class="body">Voor Juda en de Israëlieten die bij hem</text><text x="68" y="284" class="body">horen.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Tweede opschrift · 16</text><text x="68" y="433" class="body">Voor Jozef, het hout van Efraïm, en</text><text x="68" y="476" class="body">heel het volk van Israël dat bij hem</text><text x="68" y="519" class="body">hoort.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Samenvoegen · 17–20</text><text x="68" y="668" class="body">Eén in de hand van de profeet; uitleg:</text><text x="68" y="711" class="body">Jozef met Israëls stammen bij Juda, één</text><text x="68" y="754" class="body">in Zijn hand.</text><rect x="42" y="812" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De betekenis · 21–28</text><text x="68" y="903" class="body">Verzameld, één volk en Koning, geen</text><text x="68" y="946" class="body">twee koninkrijken; gereinigd, David als</text><text x="68" y="989" class="body">knecht en Herder, eeuwig vredesverbond</text><text x="68" y="1032" class="body">en woning.</text><text x="46" y="1125" class="note">De opschriften worden exact uit deze tekst</text><text x="46" y="1161" class="note">weergegeven. Het zijn geen namen van twee</text><text x="46" y="1197" class="note">onbekende personen of een biologische stamboom.</text></svg>