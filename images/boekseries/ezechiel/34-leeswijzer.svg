<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Herders, schapen en recht</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Herders, schapen en recht</text><text x="44" y="113" class="ref">Ezechiël 34:1–31</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De herders · 1–10</text><text x="68" y="241" class="body">Zichzelf weiden en zorg nalaten,</text><text x="68" y="284" class="body">hardheid en verstrooiing; schapen</text><text x="68" y="327" class="body">opgeëist en het verkeerde herderen</text><text x="68" y="370" class="body">beëindigd.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Zelf zoeken · 11–16</text><text x="68" y="519" class="body">Opzoeken, verzamelen, goed weiden en</text><text x="68" y="562" class="body">rust; verloren zoeken, gewond verbinden</text><text x="68" y="605" class="body">en ziek sterk maken, met recht.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Tussen de schapen · 17–22</text><text x="68" y="754" class="body">Goed gras vertrapt, water troebel,</text><text x="68" y="797" class="body">zwakken opzij; redding en recht tussen</text><text x="68" y="840" class="body">schaap en schaap.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Eén Herder · 23–31</text><text x="68" y="989" class="body">Knecht David, verbond van vrede,</text><text x="68" y="1032" class="body">veiligheid, regen en vrucht; schapen</text><text x="68" y="1075" class="body">zijn mensen, Hij hun God.</text><text x="46" y="1168" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="1204" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="1240" class="note">beschreven bericht blijven onderscheiden.</text></svg>