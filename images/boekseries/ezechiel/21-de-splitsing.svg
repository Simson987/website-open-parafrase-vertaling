<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">De twee getekende wegen</title><desc id="desc">De opdracht, twee genoemde bestemmingen en het aangekondigde besluit.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De twee getekende wegen</text><text x="44" y="113" class="ref">Ezechiël 21:18–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eén vertrek · 19</text><text x="68" y="241" class="body">Beide wegen beginnen in hetzelfde land;</text><text x="68" y="284" class="body">een wegwijzer aan het begin van de weg</text><text x="68" y="327" class="body">naar de stad.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Twee bestemmingen · 20</text><text x="68" y="476" class="body">Rabba van de Ammonieten; Juda met het</text><text x="68" y="519" class="body">versterkte Jeruzalem.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Bij de splitsing · 21</text><text x="68" y="668" class="body">Koning van Babel: pijlen schudden,</text><text x="68" y="711" class="body">huisgoden raadplegen en lever bekijken.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De uitkomst · 22–24</text><text x="68" y="860" class="body">Jeruzalem aangewezen in zijn</text><text x="68" y="903" class="body">rechterhand: aanvoerders, aanval,</text><text x="68" y="946" class="body">stormrammen, wal en torens.</text><text x="46" y="1039" class="note">Dit schema volgt de opdracht aan de profeet en</text><text x="46" y="1075" class="note">de gegeven uitleg. Het voegt geen eigen</text><text x="46" y="1111" class="note">geografische route, kaartafstand of advies tot</text><text x="46" y="1147" class="note">waarzeggerij toe.</text></svg>