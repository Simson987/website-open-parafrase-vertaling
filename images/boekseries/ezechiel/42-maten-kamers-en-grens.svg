<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1107" viewBox="0 0 840 1107" role="img" aria-labelledby="title desc"><title id="title">Kamers en begrenzing</title><desc id="desc">Eigen meeteenheden en functies van kamers en buitenbegrenzing.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1107" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kamers en begrenzing</text><text x="44" y="113" class="ref">Ezechiël 42:2–20</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Noordelijke kamers · 2–9</text><text x="68" y="241" class="body">Voorkant 50 × 25 m; gang 5 m, pad 0,5</text><text x="68" y="284" class="body">m; drie lagen, boven smaller. Muur en</text><text x="68" y="327" class="body">buitenkamers 25 m, tempelzijde 50 m.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gebruik · 13–14</text><text x="68" y="476" class="body">Heilige gaven eten en neerleggen:</text><text x="68" y="519" class="body">graan-, zond- en schuldoffer.</text><text x="68" y="562" class="body">Dienstkleren bewaren en omkleden voor</text><text x="68" y="605" class="body">het volk.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Omtrek · 16–20</text><text x="68" y="754" class="body">Oost 500 meetlatten, noord 500, zuid</text><text x="68" y="797" class="body">500, west 500; muur tussen heilig en</text><text x="68" y="840" class="body">gewoon.</text><text x="46" y="933" class="note">Bij de omtrek staat in deze tekst meetlatten,</text><text x="46" y="969" class="note">terwijl kamers in meters worden weergegeven. Die</text><text x="46" y="1005" class="note">eenheden blijven zichtbaar en worden niet</text><text x="46" y="1041" class="note">stilzwijgend gelijkgemaakt.</text></svg>