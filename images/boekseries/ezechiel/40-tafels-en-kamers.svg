<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1448" viewBox="0 0 840 1448" role="img" aria-labelledby="title desc"><title id="title">Tafels, kamers en het hof</title><desc id="desc">Aantallen, maten en dienstfuncties in het laatste hoofdstukdeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1448" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tafels, kamers en het hof</text><text x="44" y="113" class="ref">Ezechiël 40:38–49</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Acht tafels · 38–41</text><text x="68" y="241" class="body">Afspoelkamer, vier tafels aan elke</text><text x="68" y="284" class="body">zijde bij de poort, samen acht</text><text x="68" y="327" class="body">slachttafels.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vier stenen tafels · 42–43</text><text x="68" y="476" class="body">75 × 75 cm, 50 cm hoog, voor</text><text x="68" y="519" class="body">gereedschap; rondom haken van een</text><text x="68" y="562" class="body">handbreed.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Twee kamerrichtingen · 44–46</text><text x="68" y="711" class="body">Kamer naar zuiden: priesters voor het</text><text x="68" y="754" class="body">huis. Kamer naar noorden: altaardienst,</text><text x="68" y="797" class="body">Zadoks nakomelingen uit de Levieten.</text><rect x="42" y="855" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Vierkant hof · 47</text><text x="68" y="946" class="body">50 × 50 m; altaar voor het huis.</text><rect x="42" y="1004" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Voorhal · 48–49</text><text x="68" y="1095" class="body">10 m lang, 5,5 m breed; deurposten 2,5</text><text x="68" y="1138" class="body">m aan beide kanten; aan elke kant een</text><text x="68" y="1181" class="body">zuil.</text><text x="46" y="1274" class="note">Slachttafels, stenen gereedschapstafels en</text><text x="46" y="1310" class="note">kamers worden onderscheiden. De precieze</text><text x="46" y="1346" class="note">materiële voorstelling is een visioen, geen</text><text x="46" y="1382" class="note">bestaande bouwtekening.</text></svg>