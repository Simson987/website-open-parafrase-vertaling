<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1250" viewBox="0 0 840 1250"><title>Stamstroken van noord naar zuid</title><rect width="840" height="1250" fill="#faf7ed"/><g font-family="DejaVu Sans" fill="#203e32"><text x="42" y="62" font-size="35" font-weight="700">Stamstroken van noord naar zuid</text><text x="42" y="105" font-size="27">Ezechiël 48:1–29</text><text x="42" y="150" font-size="27">NOORD · elke stamstrook loopt oost–west</text><rect x="85" y="180" width="670" height="61" rx="5" fill="#edf1e7" stroke="#789173"/><text x="420" y="220" text-anchor="middle" font-size="30">Dan</text><rect x="85" y="247" width="670" height="61" rx="5" fill="#e1ead8" stroke="#789173"/><text x="420" y="287" text-anchor="middle" font-size="30">Aser</text><rect x="85" y="314" width="670" height="61" rx="5" fill="#edf1e7" stroke="#789173"/><text x="420" y="354" text-anchor="middle" font-size="30">Naftali</text><rect x="85" y="381" width="670" height="61" rx="5" fill="#e1ead8" stroke="#789173"/><text x="420" y="421" text-anchor="middle" font-size="30">Manasse</text><rect x="85" y="448" width="670" height="61" rx="5" fill="#edf1e7" stroke="#789173"/><text x="420" y="488" text-anchor="middle" font-size="30">Efraïm</text><rect x="85" y="515" width="670" height="61" rx="5" fill="#e1ead8" stroke="#789173"/><text x="420" y="555" text-anchor="middle" font-size="30">Ruben</text><rect x="85" y="582" width="670" height="61" rx="5" fill="#edf1e7" stroke="#789173"/><text x="420" y="622" text-anchor="middle" font-size="30">Juda</text><rect x="85" y="649" width="670" height="61" rx="5" fill="#e8d5aa" stroke="#789173"/><text x="420" y="689" text-anchor="middle" font-size="30">Afgezonderd deel en vorst</text><rect x="85" y="716" width="670" height="61" rx="5" fill="#edf1e7" stroke="#789173"/><text x="420" y="756" text-anchor="middle" font-size="30">Benjamin</text><rect x="85" y="783" width="670" height="61" rx="5" fill="#e1ead8" stroke="#789173"/><text x="420" y="823" text-anchor="middle" font-size="30">Simeon</text><rect x="85" y="850" width="670" height="61" rx="5" fill="#edf1e7" stroke="#789173"/><text x="420" y="890" text-anchor="middle" font-size="30">Issaschar</text><rect x="85" y="917" width="670" height="61" rx="5" fill="#e1ead8" stroke="#789173"/><text x="420" y="957" text-anchor="middle" font-size="30">Zebulon</text><rect x="85" y="984" width="670" height="61" rx="5" fill="#edf1e7" stroke="#789173"/><text x="420" y="1024" text-anchor="middle" font-size="30">Gad</text><text x="42" y="1095" font-size="27">ZUID · grens vanaf Thamar via Meriba bij Kades</text><text x="42" y="1135" font-size="26">Volgorde, geen geografische schaal of stamoppervlakte.</text><text x="42" y="1172" font-size="26">Het middendeel ligt tussen Juda en Benjamin.</text><text x="42" y="1209" font-size="26">Jozef heeft Manasse en Efraïm als twee landdelen.</text></g></svg>