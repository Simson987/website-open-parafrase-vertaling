<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1256" viewBox="0 0 840 1256" role="img" aria-labelledby="title desc"><title id="title">Het rouwteken en de uitleg</title><desc id="desc">De relatie tussen de persoonlijke handeling, vraag en uitleg aan het volk.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1256" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het rouwteken en de uitleg</text><text x="44" y="113" class="ref">Ezechiël 24:17–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ezechiëls handeling · 17–18</text><text x="68" y="241" class="body">In stilte kreunen, tulband en schoenen</text><text x="68" y="284" class="body">aan, snor niet bedekken, geen</text><text x="68" y="327" class="body">rouwbrood; zijn vrouw sterft ’s avonds.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Hun vraag · 19</text><text x="68" y="476" class="body">Het volk vraagt wat deze handeling voor</text><text x="68" y="519" class="body">hen betekent.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het aangekondigde verlies · 20–21</text><text x="68" y="668" class="body">Heiligdom, trotse sterkte en vreugde</text><text x="68" y="711" class="body">van ogen; achtergebleven zonen en</text><text x="68" y="754" class="body">dochters vallen.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">De overeenkomst · 22–24</text><text x="68" y="903" class="body">Dezelfde tekenen zonder gewone</text><text x="68" y="946" class="body">dodenrouw, wegkwijnen in schuld en</text><text x="68" y="989" class="body">onderling zuchten.</text><text x="46" y="1082" class="note">De vrouw van Ezechiël en het heiligdom worden</text><text x="46" y="1118" class="note">niet tot één gebeurtenis samengevoegd. De tekst</text><text x="46" y="1154" class="note">verklaart hoe zijn handeling een teken voor hen</text><text x="46" y="1190" class="note">is.</text></svg>