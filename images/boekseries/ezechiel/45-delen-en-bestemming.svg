<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Delen en bestemming</title><desc id="desc">De maten en toegewezen functies van land, stad en vorst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Delen en bestemming</text><text x="44" y="113" class="ref">Ezechiël 45:1–8</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Priesterdeel · 1–4</text><text x="68" y="241" class="body">Ongeveer 13 km bij 5 km; woningen en</text><text x="68" y="284" class="body">heiligdom. Het heiligdomvak is 250 ×</text><text x="68" y="327" class="body">250 m met 25 m vrije ruimte erom.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Levieten · 5</text><text x="68" y="476" class="body">Ongeveer 13 km bij 5 km, met twintig</text><text x="68" y="519" class="body">kamers.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Stad · 6</text><text x="68" y="668" class="body">Ongeveer 13 km lang en ruim 2 km breed;</text><text x="68" y="711" class="body">voor heel Israël.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vorst · 7–8</text><text x="68" y="860" class="body">Aan west- en oostkant van heilig deel</text><text x="68" y="903" class="body">en stad, naast de andere delen; volk</text><text x="68" y="946" class="body">niet meer onderdrukken.</text><text x="46" y="1039" class="note">De tekst geeft afgeronde maten. De delen zijn</text><text x="46" y="1075" class="note">geen opdrachten voor hedendaagse grondaankoop of</text><text x="46" y="1111" class="note">een complete moderne landkaart.</text></svg>