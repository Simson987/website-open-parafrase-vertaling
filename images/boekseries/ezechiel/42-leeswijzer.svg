<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1114" viewBox="0 0 840 1114" role="img" aria-labelledby="title desc"><title id="title">Heilige kamers en de omtrek</title><desc id="desc">Opbouw van het hoofdstuk met maten, voorschriften en afzonderlijke functies.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1114" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Heilige kamers en de omtrek</text><text x="44" y="113" class="ref">Ezechiël 42:1–20</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ligging en lagen · 1–12</text><text x="68" y="241" class="body">Kamers noord en zuid, gangen en</text><text x="68" y="284" class="body">ingangen; drie lagen, boven smaller</text><text x="68" y="327" class="body">door de galerijen, zonder</text><text x="68" y="370" class="body">voorhofzuilen.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Gebruik · 13–14</text><text x="68" y="519" class="body">Priesters eten en bewaren heilige</text><text x="68" y="562" class="body">gaven; dienstkleren blijven daar,</text><text x="68" y="605" class="body">andere kleren voor het volk.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Vier zijden · 15–20</text><text x="68" y="754" class="body">Door de oostpoort naar buiten; oost,</text><text x="68" y="797" class="body">noord, zuid en west gemeten, elk</text><text x="68" y="840" class="body">vijfhonderd meetlatten; heilig en</text><text x="68" y="883" class="body">gewoon onderscheiden.</text><text x="46" y="976" class="note">Het hoofdstuk behoort bij het beschreven</text><text x="46" y="1012" class="note">visioen. De indeling, afgeronde maten en</text><text x="46" y="1048" class="note">benamingen volgen deze plaatselijke tekst.</text></svg>