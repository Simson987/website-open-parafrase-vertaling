<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc"><title id="title">Drie mannen, vier gevallen</title><desc id="desc">Alle vier gevallen en de beperkte reikwijdte van de genoemde gerechtigheid.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1319" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie mannen, vier gevallen</text><text x="44" y="113" class="ref">Ezechiël 14:13–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hongersnood · 13–14</text><text x="68" y="241" class="body">Noach, Daniël en Job zouden alleen</text><text x="68" y="284" class="body">zichzelf redden door gerechtigheid.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wilde dieren · 15–16</text><text x="68" y="433" class="body">Zonen en dochters niet redden; alleen</text><text x="68" y="476" class="body">zijzelf gered, land verlaten.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het zwaard · 17–18</text><text x="68" y="625" class="body">Zonen en dochters niet redden; alleen</text><text x="68" y="668" class="body">zijzelf gered.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">De pest · 19–20</text><text x="68" y="817" class="body">Noach, Daniël en Job redden zoon noch</text><text x="68" y="860" class="body">dochter, alleen zichzelf.</text><rect x="42" y="918" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="961" class="label">Samen · 21</text><text x="68" y="1009" class="body">Zwaard, honger, wilde dieren en pest</text><text x="68" y="1052" class="body">over Jeruzalem.</text><text x="46" y="1145" class="note">Dit zijn voorwaardelijke gevallen, geen verteld</text><text x="46" y="1181" class="note">gezamenlijk bezoek van Noach, Daniël en Job aan</text><text x="46" y="1217" class="note">Ezechiël. De vier straffen worden daarna samen</text><text x="46" y="1253" class="note">genoemd.</text></svg>