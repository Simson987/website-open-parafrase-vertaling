<svg xmlns="http://www.w3.org/2000/svg" width="840" height="935" viewBox="0 0 840 935" role="img" aria-labelledby="title desc"><title id="title">Gezichten in twee beschrijvingen</title><desc id="desc">De precieze vier namen in elk van beide passages.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="935" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gezichten in twee beschrijvingen</text><text x="44" y="113" class="ref">Ezechiël 1:10; 10:14,20–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bij de Chebar · 1:10</text><text x="68" y="241" class="body">Mens, leeuw rechts, stier links en</text><text x="68" y="284" class="body">arend.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">In de tempel · 10:14</text><text x="68" y="433" class="body">Cherub, mens, leeuw en arend.</text><rect x="42" y="491" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">De herkenning · 10:20–22</text><text x="68" y="582" class="body">Ezechiël herkent dezelfde wezens; ieder</text><text x="68" y="625" class="body">heeft vier gezichten en vier vleugels,</text><text x="68" y="668" class="body">met mensenhanden eronder.</text><text x="46" y="761" class="note">De eerste benaming van hoofdstuk 10 wordt hier</text><text x="46" y="797" class="note">niet stilzwijgend door stier vervangen. Beide</text><text x="46" y="833" class="note">beschrijvingen en de expliciete herkenning</text><text x="46" y="869" class="note">blijven staan.</text></svg>