<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Levend water en gelijk erfdeel</title><desc id="desc">Opbouw van het hoofdstuk met maten, voorschriften en afzonderlijke functies.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Levend water en gelijk erfdeel</text><text x="44" y="113" class="ref">Ezechiël 47:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bron en diepte · 1–6</text><text x="68" y="241" class="body">Onder de drempel, via noordpoort naar</text><text x="68" y="284" class="body">buiten; viermaal 500 m, enkels, knieën,</text><text x="68" y="327" class="body">middel, niet meer doorwaadbaar.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Leven en zout · 7–12</text><text x="68" y="476" class="body">Bomen, gezond water, veel vis, vissers</text><text x="68" y="519" class="body">en netten; poelen blijven zout,</text><text x="68" y="562" class="body">maandvrucht en genezende bladeren.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Grenzen · 13–21</text><text x="68" y="711" class="body">Twaalf stammen, Jozef twee delen,</text><text x="68" y="754" class="body">gelijk erfdeel; noord, oost, zuid en</text><text x="68" y="797" class="body">west met hun genoemde plaatsen.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Vreemdelingen · 22–23</text><text x="68" y="946" class="body">Inwonende vreemdeling met kinderen als</text><text x="68" y="989" class="body">geboren Israëliet; erfdeel in de stam</text><text x="68" y="1032" class="body">waar hij woont.</text><text x="46" y="1125" class="note">Het hoofdstuk behoort bij het beschreven</text><text x="46" y="1161" class="note">visioen. De indeling, afgeronde maten en</text><text x="46" y="1197" class="note">benamingen volgen deze plaatselijke tekst.</text></svg>