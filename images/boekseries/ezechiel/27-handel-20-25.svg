<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1432" viewBox="0 0 840 1432" role="img" aria-labelledby="title desc"><title id="title">Handelspartners: tweede deel</title><desc id="desc">De resterende genoemde partners en de overgang naar het zwaar beladen schip.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1432" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Handelspartners: tweede deel</text><text x="44" y="113" class="ref">Ezechiël 27:20–25</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dedan · 20</text><text x="68" y="241" class="body">Zadeldekken om op te rijden.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Arabië en Kedar · 21</text><text x="68" y="390" class="body">Lammeren, rammen en bokken.</text><rect x="42" y="448" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Scheba en Raema · 22</text><text x="68" y="539" class="body">Beste specerijen, allerlei edelstenen</text><text x="68" y="582" class="body">en goud.</text><rect x="42" y="640" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="683" class="label">De groep · 23</text><text x="68" y="731" class="body">Haran, Kanne, Eden, handelaars van</text><text x="68" y="774" class="body">Scheba, Assur en Kilmad.</text><rect x="42" y="832" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="875" class="label">Hun producten · 24</text><text x="68" y="923" class="body">Prachtige kleren, blauwpurper en</text><text x="68" y="966" class="body">borduurwerk; kisten met kleurige</text><text x="68" y="1009" class="body">kleding, touw en cederhout.</text><rect x="42" y="1067" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1110" class="label">Schepen van Tarsis · 25</text><text x="68" y="1158" class="body">Voeren rond met de handelswaar; Tyrus</text><text x="68" y="1201" class="body">vol en zwaar beladen midden in zee.</text><text x="46" y="1294" class="note">Dedan komt in twee afzonderlijke regels met</text><text x="46" y="1330" class="note">verschillende goederen voor. Deze regels worden</text><text x="46" y="1366" class="note">niet stilzwijgend samengevoegd.</text></svg>