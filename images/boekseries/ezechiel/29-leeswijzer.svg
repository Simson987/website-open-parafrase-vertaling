<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Egypte en het loon voor Babel</title><desc id="desc">De opbouw van het hoofdstuk met de verschillende sprekers en tekstvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Egypte en het loon voor Babel</text><text x="44" y="113" class="ref">Ezechiël 29:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tiende jaar · 1–12</text><text x="68" y="241" class="body">Farao als krokodil die de rivier</text><text x="68" y="284" class="body">opeist, vissen, droog land en gebroken</text><text x="68" y="327" class="body">riet; veertig jaren verwoesting.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Na veertig jaar · 13–16</text><text x="68" y="476" class="body">Verzamelen naar Pathros; klein</text><text x="68" y="519" class="body">koninkrijk dat niet meer heerst en geen</text><text x="68" y="562" class="body">houvast voor Israël is.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Zevenentwintigste jaar · 17–21</text><text x="68" y="711" class="body">Babel kreeg voor werk tegen Tyrus geen</text><text x="68" y="754" class="body">loon; Egypte als loon, kracht voor</text><text x="68" y="797" class="body">Israël en weer spreken.</text><text x="46" y="890" class="note">De versgroepen volgen deze plaatselijke tekst.</text><text x="46" y="926" class="note">Aankondiging, gelijkenis en beschreven handeling</text><text x="46" y="962" class="note">worden onderscheiden.</text></svg>