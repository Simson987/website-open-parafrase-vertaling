<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1064" viewBox="0 0 840 1064" role="img" aria-labelledby="title desc"><title id="title">Twee perioden en twee taken</title><desc id="desc">De twee getallen, verschillende werkzaamheden en het vervolgonderzoek.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1064" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee perioden en twee taken</text><text x="44" y="113" class="ref">Ezechiël 39:9–16</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zeven jaar · 9–10</text><text x="68" y="241" class="body">Wapens als brandstof: grote en kleine</text><text x="68" y="284" class="body">schilden, bogen, pijlen, knotsen en</text><text x="68" y="327" class="body">speren; geen veld- of boshout nodig.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zeven maanden · 11–13</text><text x="68" y="476" class="body">Het volk begraaft om het land te</text><text x="68" y="519" class="body">reinigen, in het dal van de menigte van</text><text x="68" y="562" class="body">Gog.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Na zeven maanden · 14–16</text><text x="68" y="711" class="body">Aangewezen mannen onderzoeken</text><text x="68" y="754" class="body">voortdurend, merkteken bij een bot tot</text><text x="68" y="797" class="body">het begraven is; ook Hamona genoemd.</text><text x="46" y="890" class="note">De zeven jaren en zeven maanden zijn niet</text><text x="46" y="926" class="note">dezelfde periode. Het schema zegt niets over</text><text x="46" y="962" class="note">moderne wapentechniek of een eigen</text><text x="46" y="998" class="note">kalenderdatum.</text></svg>