<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Kijken en meten in het visioen</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kijken en meten in het visioen</text><text x="44" y="113" class="ref">Ezechiël 40:1–49</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Begin en buitenmuur · 1–5</text><text x="68" y="241" class="body">Jaar 25 ballingschap, jaar 14 na de</text><text x="68" y="284" class="body">val; visioen op hoge berg, man als</text><text x="68" y="327" class="body">brons met snoer en meetlat, kijken en</text><text x="68" y="370" class="body">vertellen.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Buitenpoorten en hof · 6–27</text><text x="68" y="519" class="body">Oost, noord en zuid, kamers en palmen;</text><text x="68" y="562" class="body">dertig kamers op het plaveisel en</text><text x="68" y="605" class="body">afstanden naar het binnenhof.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Binnenpoorten en tafels · 28–43</text><text x="68" y="754" class="body">Zuid, oost en noord, acht treden;</text><text x="68" y="797" class="body">afspoelkamer en tafels met hun maten en</text><text x="68" y="840" class="body">functie.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Kamers en huis · 44–49</text><text x="68" y="989" class="body">Kamers voor dienst in huis en bij</text><text x="68" y="1032" class="body">altaar, Zadoks nakomelingen; vierkant</text><text x="68" y="1075" class="body">hof en de voorhal met twee zuilen.</text><text x="46" y="1168" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="1204" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="1240" class="note">beschreven bericht blijven onderscheiden.</text></svg>