<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1114" viewBox="0 0 840 1114" role="img" aria-labelledby="title desc"><title id="title">Raadsel en gegeven uitleg</title><desc id="desc">Drie verbanden tussen raadselbeelden en de expliciete historische uitleg.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1114" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Raadsel en gegeven uitleg</text><text x="44" y="113" class="ref">Ezechiël 17:3–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Cedertop meegenomen · 3–4; 12</text><text x="68" y="241" class="body">De eerste arend neemt de top mee. In de</text><text x="68" y="284" class="body">uitleg neemt Babels koning Jeruzalems</text><text x="68" y="327" class="body">koning en vorsten mee.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Laag gehouden wijnstok · 5–6; 13–14</text><text x="68" y="476" class="body">Zaad bij water groeit laag. In de</text><text x="68" y="519" class="body">uitleg een koninklijke verwant onder</text><text x="68" y="562" class="body">eed, klein koninkrijk dat bij trouw</text><text x="68" y="605" class="body">blijft.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Naar de andere arend · 7–10; 15–21</text><text x="68" y="754" class="body">Wijnstok richt zich anders en</text><text x="68" y="797" class="body">verdroogt. In de uitleg boden naar</text><text x="68" y="840" class="body">Egypte, verbroken eed en oordeel in</text><text x="68" y="883" class="body">Babel.</text><text x="46" y="976" class="note">De uitleg staat in het hoofdstuk zelf. De namen</text><text x="46" y="1012" class="note">van de niet bij naam genoemde koninklijke</text><text x="46" y="1048" class="note">verwant worden hier niet aangevuld.</text></svg>