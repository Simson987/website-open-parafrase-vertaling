<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Regels voor de priesters</title><desc id="desc">De taakregels en afzonderlijke voorwaarden van de priesterdienst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Regels voor de priesters</text><text x="44" y="113" class="ref">Ezechiël 44:17–31</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Kleding en omgang · 17–22</text><text x="68" y="241" class="body">Linnen zonder wol, geen zweetgordel,</text><text x="68" y="284" class="body">kleding wisselen voor het volk; haar</text><text x="68" y="327" class="body">bijgeknipt, geen wijn bij binnengaan,</text><text x="68" y="370" class="body">huwelijksregels.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Onderwijs en recht · 23–24</text><text x="68" y="519" class="body">Heilig–gewoon, rein–onrein leren;</text><text x="68" y="562" class="body">rechtspraak naar Zijn regels, feesten</text><text x="68" y="605" class="body">en sabbatten houden.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Dode en reiniging · 25–27</text><text x="68" y="754" class="body">Alleen vader, moeder, zoon, dochter,</text><text x="68" y="797" class="body">broer of ongetrouwde zus; na reiniging</text><text x="68" y="840" class="body">zeven dagen, dan zondoffer bij dienst.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Erfdeel en voedsel · 28–31</text><text x="68" y="989" class="body">Hij hun bezit, geen land; offers en</text><text x="68" y="1032" class="body">eerste gaven, ook deeg, maar geen</text><text x="68" y="1075" class="body">gestorven of verscheurd dier.</text><text x="46" y="1168" class="note">De concrete familie-uitzonderingen worden als</text><text x="46" y="1204" class="note">regels voor deze priesters weergegeven, zonder</text><text x="46" y="1240" class="note">ze aan moderne beroepsgroepen toe te schrijven.</text></svg>