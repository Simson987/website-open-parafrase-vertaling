<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1240" viewBox="0 0 840 1240" role="img" aria-labelledby="title desc"><title id="title">Plaatsen in het woord</title><desc id="desc">De afzonderlijke plaatsen en de uitspraken die in het hoofdstuk aan hen verbonden zijn.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1240" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Plaatsen in het woord</text><text x="44" y="113" class="ref">Ezechiël 30:13–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Nof · 13,16</text><text x="68" y="241" class="body">Afgoden en nietige beelden weg; angst,</text><text x="68" y="284" class="body">ook elke dag in vers 16.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Pathros en Zoan · 14</text><text x="68" y="433" class="body">Pathros verwoest, vuur in Zoan.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">No en Sin · 14–16</text><text x="68" y="582" class="body">Recht over No en rijkdom weg; Sin als</text><text x="68" y="625" class="body">bolwerk, pijn; No opengebroken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Aven en Pibeseth · 17</text><text x="68" y="774" class="body">Jonge mannen vallen, vrouwen in</text><text x="68" y="817" class="body">ballingschap.</text><rect x="42" y="875" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Tachpanhes · 18</text><text x="68" y="966" class="body">Donkere dag, juk gebroken, trots weg,</text><text x="68" y="1009" class="body">wolk en ballingschap voor de dorpen.</text><text x="46" y="1102" class="note">De namen en uitspraken volgen deze weergave. Er</text><text x="46" y="1138" class="note">is geen gelijkstelling aan moderne steden of</text><text x="46" y="1174" class="note">nieuwe landkaart toegevoegd.</text></svg>