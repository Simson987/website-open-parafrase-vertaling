<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Het huis en zijn binnenwerk</title><desc id="desc">Opbouw van het hoofdstuk met maten, voorschriften en afzonderlijke functies.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het huis en zijn binnenwerk</text><text x="44" y="113" class="ref">Ezechiël 41:1–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tempel en binnenruimte · 1–4</text><text x="68" y="241" class="body">Tempel 20 × 10 m, binnenste heilige</text><text x="68" y="284" class="body">ruimte 10 × 10 m; ingangen met hun</text><text x="68" y="327" class="body">afzonderlijke maten.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zijkamers en gebouw · 5–15</text><text x="68" y="476" class="body">Drie lagen, dertig kamers per laag,</text><text x="68" y="519" class="body">naar boven breder; muren, open ruimten</text><text x="68" y="562" class="body">en gebouw aan de westkant.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Bekleding en deuren · 16–26</text><text x="68" y="711" class="body">Hout, smalle vensters, cherubs met twee</text><text x="68" y="754" class="body">gezichten en palmen, houten</text><text x="68" y="797" class="body">altaartafel; dubbele deuren met</text><text x="68" y="840" class="body">draaibare bladen.</text><text x="46" y="933" class="note">Het hoofdstuk behoort bij het beschreven</text><text x="46" y="969" class="note">visioen. De indeling, afgeronde maten en</text><text x="46" y="1005" class="note">benamingen volgen deze plaatselijke tekst.</text></svg>