<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1491" viewBox="0 0 840 1491" role="img" aria-labelledby="title desc"><title id="title">Het afgezonderde middendeel</title><desc id="desc">De eigendoms- en levensonderhoudrelaties van het middendeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1491" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het afgezonderde middendeel</text><text x="44" y="113" class="ref">Ezechiël 48:8–22</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Priesters en heiligdom · 9–12</text><text x="68" y="241" class="body">Ongeveer 13 × 5 km, heiligdom middenin;</text><text x="68" y="284" class="body">voor de trouwe nakomelingen van Zadok.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Levieten · 13–14</text><text x="68" y="433" class="body">Eveneens ongeveer 13 × 5 km; niet</text><text x="68" y="476" class="body">verkopen, ruilen of overdragen, het is</text><text x="68" y="519" class="body">heilig.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Stad en weide · 15–19</text><text x="68" y="668" class="body">Strook ongeveer 13 km bij ruim 2 km;</text><text x="68" y="711" class="body">stad ruim 2 km per zijde, weide rondom</text><text x="68" y="754" class="body">125 m.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Overblijvende grond · 18–19</text><text x="68" y="903" class="body">5 km naar oosten en 5 km naar westen;</text><text x="68" y="946" class="body">opbrengst voor de stadswerkers uit alle</text><text x="68" y="989" class="body">stammen.</text><rect x="42" y="1047" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">Geheel en vorst · 20–22</text><text x="68" y="1138" class="body">Afgezonderde vierkant ongeveer 13 × 13</text><text x="68" y="1181" class="body">km; vorst aan beide kanten, tussen Juda</text><text x="68" y="1224" class="body">en Benjamin.</text><text x="46" y="1317" class="note">De afgeronde maten blijven als benaderingen</text><text x="46" y="1353" class="note">staan. Zij worden niet opgeteld alsof alle</text><text x="46" y="1389" class="note">afrondingen samen een exact schaalontwerp</text><text x="46" y="1425" class="note">vormen.</text></svg>