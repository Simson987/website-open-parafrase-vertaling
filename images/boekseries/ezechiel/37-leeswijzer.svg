<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Botten, adem en één volk</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Botten, adem en één volk</text><text x="44" y="113" class="ref">Ezechiël 37:1–28</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het visioen · 1–10</text><text x="68" y="241" class="body">Dorre botten, woord, gerommel en</text><text x="68" y="284" class="body">samenvoegen; pezen, vlees en huid maar</text><text x="68" y="327" class="body">geen adem; tweede opdracht en levend</text><text x="68" y="370" class="body">staan.</text><rect x="42" y="428" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De uitleg · 11–14</text><text x="68" y="519" class="body">Heel Israël zonder hoop; graven openen,</text><text x="68" y="562" class="body">naar eigen land, Geest en leven.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het houtteken · 15–20</text><text x="68" y="711" class="body">Twee beschreven stukken met Juda en</text><text x="68" y="754" class="body">Jozef/Efraïm; één in de hand en uitleg</text><text x="68" y="797" class="body">voor de vragers.</text><rect x="42" y="855" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De belofte · 21–28</text><text x="68" y="946" class="body">Verzamelen, één volk en Koning,</text><text x="68" y="989" class="body">reinigen, knecht David, wonen en eeuwig</text><text x="68" y="1032" class="body">vredesverbond; heiligdom en woning bij</text><text x="68" y="1075" class="body">hen.</text><text x="46" y="1168" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="1204" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="1240" class="note">beschreven bericht blijven onderscheiden.</text></svg>