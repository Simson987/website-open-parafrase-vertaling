<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1299" viewBox="0 0 840 1299" role="img" aria-labelledby="title desc"><title id="title">Horen en waarschuwen</title><desc id="desc">De voorwaardelijke gevallen en hun expliciete toepassing op de profeet.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1299" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Horen en waarschuwen</text><text x="44" y="113" class="ref">Ezechiël 33:3–9</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hoorn gehoord, genegeerd · 3–5</text><text x="68" y="241" class="body">De hoorder sterft; eigen</text><text x="68" y="284" class="body">verantwoordelijkheid. Wie zich laat</text><text x="68" y="327" class="body">waarschuwen, redt zijn leven.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wachter zwijgt · 6</text><text x="68" y="476" class="body">Iemand sterft om eigen schuld, maar</text><text x="68" y="519" class="body">diens bloed wordt van de wachter</text><text x="68" y="562" class="body">geëist.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Toepassing op Ezechiël · 7–8</text><text x="68" y="711" class="body">Horen uit Zijn mond en waarschuwen;</text><text x="68" y="754" class="body">niet spreken betekent schuld van de</text><text x="68" y="797" class="body">goddeloze én aansprakelijkheid van de</text><text x="68" y="840" class="body">wachter.</text><rect x="42" y="898" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Waarschuwen, niet omkeren · 9</text><text x="68" y="989" class="body">Goddeloze sterft om eigen schuld, de</text><text x="68" y="1032" class="body">wachter heeft zijn leven gered.</text><text x="46" y="1125" class="note">Horen, reageren en waarschuwen zijn</text><text x="46" y="1161" class="note">onderscheiden verantwoordelijkheden. Het</text><text x="46" y="1197" class="note">hoofdstuk vervolgt met de oproep om te keren en</text><text x="46" y="1233" class="note">te leven.</text></svg>