<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1107" viewBox="0 0 840 1107" role="img" aria-labelledby="title desc"><title id="title">Twee arenden en een nieuwe tak</title><desc id="desc">Hoofdstukopbouw die tekstvorm en verklaring zichtbaar houdt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1107" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee arenden en een nieuwe tak</text><text x="44" y="113" class="ref">Ezechiël 17:1–24</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het raadsel · 1–10</text><text x="68" y="241" class="body">Eerste arend, cedertop en laag</text><text x="68" y="284" class="body">blijvende wijnstok; gericht op de</text><text x="68" y="327" class="body">andere arend en verdrogend in</text><text x="68" y="370" class="body">oostenwind.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De uitleg · 11–21</text><text x="68" y="519" class="body">Koning van Babel, wegvoering, eed aan</text><text x="68" y="562" class="body">een koninklijke verwant; opstand, boden</text><text x="68" y="605" class="body">naar Egypte en geen ontkomen.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het slotwoord · 22–24</text><text x="68" y="754" class="body">Hij plant zelf een tere cedertak op een</text><text x="68" y="797" class="body">hoge berg; grote ceder met vogels, hoog</text><text x="68" y="840" class="body">vernederd en laag verhoogd.</text><text x="46" y="933" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="969" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="1005" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="1041" class="note">verband.</text></svg>