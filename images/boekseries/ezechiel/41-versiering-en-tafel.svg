<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1107" viewBox="0 0 840 1107" role="img" aria-labelledby="title desc"><title id="title">Cherubs, palmen en tafel</title><desc id="desc">Exacte aantallen gezichten, deuren en de gegeven maten van de tafel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1107" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Cherubs, palmen en tafel</text><text x="44" y="113" class="ref">Ezechiël 41:18–25</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Versiering · 18–20</text><text x="68" y="241" class="body">Een palm tussen elke twee cherubs;</text><text x="68" y="284" class="body">iedere cherub heeft een mensengezicht</text><text x="68" y="327" class="body">en een leeuwengezicht, aan weerszijden</text><text x="68" y="370" class="body">van de palm.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Houten altaar · 22</text><text x="68" y="519" class="body">1,5 m hoog, 1 m lang, hoeken, voetstuk</text><text x="68" y="562" class="body">en wanden van hout; genoemd de tafel</text><text x="68" y="605" class="body">voor Zijn gezicht.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Deuren · 23–25</text><text x="68" y="754" class="body">Tempel en heiligdom elk twee deuren;</text><text x="68" y="797" class="body">elke deur twee draaibare bladen.</text><text x="68" y="840" class="body">Cherubs en palmen ook op de deuren.</text><text x="46" y="933" class="note">De twee gezichten van deze muurversiering zijn</text><text x="46" y="969" class="note">onderscheiden van de vier gezichten in eerdere</text><text x="46" y="1005" class="note">visioenen. Niet beschreven breedtematen zijn</text><text x="46" y="1041" class="note">niet ingevuld.</text></svg>