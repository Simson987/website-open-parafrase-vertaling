<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1213" viewBox="0 0 840 1213" role="img" aria-labelledby="title desc"><title id="title">De plicht van de wachter</title><desc id="desc"></desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1213" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De plicht van de wachter</text><text x="44" y="113" class="ref">Ezechiël 3:18–21</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Slechte mens niet gewaarschuwd · 18</text><text x="68" y="241" class="body">Die sterft om zijn schuld; zijn bloed</text><text x="68" y="284" class="body">wordt van de wachter geëist.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Slechte mens wel gewaarschuwd · 19</text><text x="68" y="433" class="body">Keert hij niet terug, dan sterft hij om</text><text x="68" y="476" class="body">zijn schuld; de wachter heeft zijn</text><text x="68" y="519" class="body">leven gered.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Rechtvaardige wijkt af · 20</text><text x="68" y="668" class="body">Hij sterft om zijn zonde; eerder goed</text><text x="68" y="711" class="body">telt niet, zijn bloed wordt van de</text><text x="68" y="754" class="body">wachter geëist.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Rechtvaardige gehoorzaamt · 21</text><text x="68" y="903" class="body">Hij leeft, want hij is gewaarschuwd; de</text><text x="68" y="946" class="body">wachter heeft zijn leven gered.</text><text x="46" y="1039" class="note">De verantwoordelijkheid om te spreken en de</text><text x="46" y="1075" class="note">reactie op het woord zijn onderscheiden. De</text><text x="46" y="1111" class="note">vierde regel bevat uitdrukkelijk dat de hoorder</text><text x="46" y="1147" class="note">niet zondigt.</text></svg>