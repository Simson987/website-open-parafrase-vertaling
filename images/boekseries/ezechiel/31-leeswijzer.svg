<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">De hoge ceder en zijn val</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De hoge ceder en zijn val</text><text x="44" y="113" class="ref">Ezechiël 31:1–18</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De vergelijking · 1–9</text><text x="68" y="241" class="body">Farao aangesproken, Assur als mooie</text><text x="68" y="284" class="body">hoge ceder met veel water; vogels,</text><text x="68" y="327" class="body">dieren en volken onder zijn takken.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Hoogmoed en val · 10–14</text><text x="68" y="476" class="body">Trots om hoogte, aan de machtigste</text><text x="68" y="519" class="body">overgegeven, vreemden hakken om; vogels</text><text x="68" y="562" class="body">en dieren bij de gevallen boom.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Rouw en toepassing · 15–18</text><text x="68" y="711" class="body">Diepte bedekt, stromen gestuit, bomen</text><text x="68" y="754" class="body">kwijnen en volken beven; afdalen,</text><text x="68" y="797" class="body">toegepast op Farao en zijn menigte.</text><text x="46" y="890" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="926" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="962" class="note">beschreven bericht blijven onderscheiden.</text></svg>