<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">De genoemde feestdagen</title><desc id="desc">De concrete dagen en onderscheiden dagelijkse hoeveelheden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde feestdagen</text><text x="44" y="113" class="ref">Ezechiël 45:18–25</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Maand 1, dag 1 en 7 · 18–20</text><text x="68" y="241" class="body">Gave jonge stier en reiniging van het</text><text x="68" y="284" class="body">huis; de zevende dag ook voor</text><text x="68" y="327" class="body">vergissing en onwetendheid.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Maand 1, dag 14 · 21–24</text><text x="68" y="476" class="body">Paasfeest, zeven dagen ongezuurd brood;</text><text x="68" y="519" class="body">stier voor vorst en volk, dagelijks</text><text x="68" y="562" class="body">zeven stieren, zeven rammen en een bok.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Graan en olie · 24</text><text x="68" y="711" class="body">Per stier en ram ongeveer 20 l meel;</text><text x="68" y="754" class="body">ongeveer 4 l olie per 20 l meel.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Maand 7, dag 15 · 25</text><text x="68" y="903" class="body">Zeven dagen hetzelfde voor zond-,</text><text x="68" y="946" class="body">brand- en graanoffer en olie.</text><text x="46" y="1039" class="note">De datums zijn maand- en dagnummers uit de</text><text x="46" y="1075" class="note">tekst. Zij zijn niet naar een kalenderdatum in</text><text x="46" y="1111" class="note">het huidige jaar omgerekend.</text></svg>