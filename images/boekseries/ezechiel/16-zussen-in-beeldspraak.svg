<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1326" viewBox="0 0 840 1326" role="img" aria-labelledby="title desc"><title id="title">Jeruzalem en haar zussen</title><desc id="desc">Exacte stadnamen en onderlinge beeldrelaties zonder genealogische verwarring.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1326" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Jeruzalem en haar zussen</text><text x="44" y="113" class="ref">Ezechiël 16:44–55,61</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het moeder-vaderbeeld · 44–45</text><text x="68" y="241" class="body">Moeder Hethitische, vader Amoriet; de</text><text x="68" y="284" class="body">aangesproken stad is Jeruzalem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oudere zus · 46</text><text x="68" y="433" class="body">Samaria met haar dochters, links van</text><text x="68" y="476" class="body">Jeruzalem.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Jongere zus · 46</text><text x="68" y="625" class="body">Sodom met haar dochters, rechts van</text><text x="68" y="668" class="body">Jeruzalem.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vergelijking · 47–55</text><text x="68" y="817" class="body">Jeruzalem deed erger, zussen lijken</text><text x="68" y="860" class="body">rechtvaardiger; hun lot wordt samen</text><text x="68" y="903" class="body">gekeerd.</text><rect x="42" y="961" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1004" class="label">Ontvangst · 61</text><text x="68" y="1052" class="body">Oudere en jongere zussen als dochters</text><text x="68" y="1095" class="body">ontvangen, met schaamte en herinnering.</text><text x="46" y="1188" class="note">Dit zijn steden in een verwantschapsbeeld. De</text><text x="46" y="1224" class="note">richtingen volgen links en rechts in deze tekst;</text><text x="46" y="1260" class="note">er is geen biologische stamboom getekend.</text></svg>