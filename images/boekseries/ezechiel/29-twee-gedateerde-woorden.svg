<svg xmlns="http://www.w3.org/2000/svg" width="840" height="829" viewBox="0 0 840 829" role="img" aria-labelledby="title desc"><title id="title">Twee gedateerde woorden</title><desc id="desc">Datering en inhoud van de twee afzonderlijke woorden, zonder een nieuwe vervullingsdatum te berekenen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="829" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee gedateerde woorden</text><text x="44" y="113" class="ref">Ezechiël 29:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Jaar 10 · 1–16</text><text x="68" y="241" class="body">Maand 10, dag 12. Krokodil en rietstok,</text><text x="68" y="284" class="body">verwoesting, veertig jaar, verzamelen</text><text x="68" y="327" class="body">naar Pathros en klein koninkrijk.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Jaar 27 · 17–21</text><text x="68" y="476" class="body">Maand 1, dag 1. Geen loon uit Tyrus</text><text x="68" y="519" class="body">voor Babels zware werk; Egypte als</text><text x="68" y="562" class="body">loon, Israëls hoorn en weer spreken.</text><text x="46" y="655" class="note">De tekst plaatst deze woorden uit verschillende</text><text x="46" y="691" class="note">jaren in één hoofdstuk. De veertig jaar hoort</text><text x="46" y="727" class="note">bij het eerste woord, niet bij de afstand tussen</text><text x="46" y="763" class="note">beide dateringen.</text></svg>