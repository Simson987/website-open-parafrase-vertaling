<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1064" viewBox="0 0 840 1064" role="img" aria-labelledby="title desc"><title id="title">Leugen, kalk en bevrijding</title><desc id="desc">Hoofdstukopbouw die tekstvorm en verklaring zichtbaar houdt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1064" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Leugen, kalk en bevrijding</text><text x="44" y="113" class="ref">Ezechiël 13:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De profeten · 1–9</text><text x="68" y="241" class="body">Eigen geest en niets gezien, vossen</text><text x="68" y="284" class="body">tussen ruïnen, geen bres gedicht; uit</text><text x="68" y="327" class="body">volk, register en land geweerd.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De muur · 10–16</text><text x="68" y="476" class="body">Vrede zeggen waar die ontbreekt is kalk</text><text x="68" y="519" class="body">op een zwakke muur; stortregen, hagel</text><text x="68" y="562" class="body">en storm leggen het fundament bloot.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De vrouwen · 17–23</text><text x="68" y="711" class="body">Eigen hart, banden en sluiers voor</text><text x="68" y="754" class="body">gerst en brood; rechtvaardige bedroefd,</text><text x="68" y="797" class="body">goddeloze gesterkt; volk wordt bevrijd.</text><text x="46" y="890" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="926" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="962" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="998" class="note">verband.</text></svg>