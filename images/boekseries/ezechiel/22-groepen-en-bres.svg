<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Wie de bres niet dichtmaakt</title><desc id="desc">De verschillende verantwoordelijkheden en de niet gevonden verdediger.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Wie de bres niet dichtmaakt</text><text x="44" y="113" class="ref">Ezechiël 22:25–30</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Profeten · 25,28</text><text x="68" y="241" class="body">Als leeuw, mensen verslonden en</text><text x="68" y="284" class="body">schatten weg; kalk, loze visioenen en</text><text x="68" y="327" class="body">woorden die niet gesproken zijn.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Priesters · 26</text><text x="68" y="476" class="body">Wet geweld aangedaan; geen onderscheid</text><text x="68" y="519" class="body">tussen heilig en gewoon, rein en</text><text x="68" y="562" class="body">onrein; sabbat genegeerd.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Vorsten · 27</text><text x="68" y="711" class="body">Als wolven: bloed en vernietiging voor</text><text x="68" y="754" class="body">winst.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Volk · 29</text><text x="68" y="903" class="body">Onderdrukking, roof en onrecht tegen</text><text x="68" y="946" class="body">arme, behoeftige en vreemdeling.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">De gezochte mens · 30</text><text x="68" y="1095" class="body">Muur herstellen en voor het land in de</text><text x="68" y="1138" class="body">bres staan; niemand gevonden.</text><text x="46" y="1231" class="note">Dezelfde profetengroep wordt tweemaal</text><text x="46" y="1267" class="note">aangeklaagd. Er wordt geen ontbrekende held als</text><text x="46" y="1303" class="note">bestaande redder ingevuld.</text></svg>