<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Toegang, offers en erfdeel</title><desc id="desc"></desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toegang, offers en erfdeel</text><text x="44" y="113" class="ref">Ezechiël 46:1–24</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Poort en offers · 1–15</text><text x="68" y="241" class="body">Werkdagen dicht, sabbat en nieuwe maan</text><text x="68" y="284" class="body">open; vorst en volk met eigen</text><text x="68" y="327" class="body">loopregels, vrijwillig offer en</text><text x="68" y="370" class="body">dagelijks morgenoffer.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Erfdeel · 16–18</text><text x="68" y="519" class="body">Gift aan zoon blijft, aan dienaar tot</text><text x="68" y="562" class="body">vrijlating; volk niet uit eigen bezit</text><text x="68" y="605" class="body">verdrijven.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De keukens · 19–24</text><text x="68" y="754" class="body">Heilige bereiding bij priesterkamers;</text><text x="68" y="797" class="body">vier gelijke hoekplaatsjes van 20 × 15</text><text x="68" y="840" class="body">m met kookplaatsen voor het volksoffer.</text><text x="46" y="933" class="note">Het hoofdstuk behoort bij het beschreven</text><text x="46" y="969" class="note">visioen. De indeling, afgeronde maten en</text><text x="46" y="1005" class="note">benamingen volgen deze plaatselijke tekst.</text></svg>