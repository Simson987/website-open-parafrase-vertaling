<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Het einde naar hun wegen</title><desc id="desc">Hoofdstukopbouw met de verschillende vertelvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het einde naar hun wegen</text><text x="44" y="113" class="ref">Ezechiël 7:1–27</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het is gekomen · 1–11</text><text x="68" y="241" class="body">Herhaald einde, ochtend, paniek en</text><text x="68" y="284" class="body">oordeel naar eigen wegen; hoogmoed en</text><text x="68" y="327" class="body">geweld als uitlopende stok.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wat niet helpt · 12–22</text><text x="68" y="476" class="body">Kopen en verkopen, gereedmaken zonder</text><text x="68" y="519" class="body">uittrekken; zilver, goud en sieraden</text><text x="68" y="562" class="body">redden niet, heiligdom ontheiligd.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Wat ontbreekt · 23–27</text><text x="68" y="711" class="body">Ketting en geweld, huizen in vreemde</text><text x="68" y="754" class="body">handen; geen vrede, visioen, onderwijs</text><text x="68" y="797" class="body">of raad, iedereen ontredderd.</text><text x="46" y="890" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="926" class="note">Visioen, gesproken opdracht, tekenhandeling en</text><text x="46" y="962" class="note">verklaring worden onderscheiden.</text></svg>