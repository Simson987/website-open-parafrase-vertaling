<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Land, eerlijkheid en feesten</title><desc id="desc">Opbouw van het hoofdstuk met maten, voorschriften en afzonderlijke functies.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Land, eerlijkheid en feesten</text><text x="44" y="113" class="ref">Ezechiël 45:1–25</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verdeling · 1–8</text><text x="68" y="241" class="body">Heilig deel, heiligdom, priesters,</text><text x="68" y="284" class="body">Levieten en stad; vorst aan beide</text><text x="68" y="327" class="body">kanten, geen onderdrukking van het</text><text x="68" y="370" class="body">volk.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Recht en gave · 9–17</text><text x="68" y="519" class="body">Geweld en verdrijving weg, eerlijke</text><text x="68" y="562" class="body">maten; graan, olie en lam voor de</text><text x="68" y="605" class="body">vorst, offers voor verzoening.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">De eerste maand · 18–24</text><text x="68" y="754" class="body">Eerste en zevende dag reinigen;</text><text x="68" y="797" class="body">veertiende dag paasfeest met zeven</text><text x="68" y="840" class="body">dagen ongezuurd brood en bepaalde</text><text x="68" y="883" class="body">dagelijkse offers.</text><rect x="42" y="941" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="984" class="label">De zevende maand · 25</text><text x="68" y="1032" class="body">Vijftiende dag, zeven dagen hetzelfde</text><text x="68" y="1075" class="body">voor offers, graan en olie.</text><text x="46" y="1168" class="note">Het hoofdstuk behoort bij het beschreven</text><text x="46" y="1204" class="note">visioen. De indeling, afgeronde maten en</text><text x="46" y="1240" class="note">benamingen volgen deze plaatselijke tekst.</text></svg>