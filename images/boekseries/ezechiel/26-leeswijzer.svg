<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">De val van Tyrus voorzegd</title><desc id="desc">De opbouw van het hoofdstuk met de verschillende sprekers en tekstvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De val van Tyrus voorzegd</text><text x="44" y="113" class="ref">Ezechiël 26:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spot en aankondiging · 1–6</text><text x="68" y="241" class="body">Tyrus blij om Jeruzalems gebroken</text><text x="68" y="284" class="body">poort; volken als golven, muren neer en</text><text x="68" y="327" class="body">netten op kale rots.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het beleg · 7–14</text><text x="68" y="476" class="body">Nebukadrezar uit het noorden, torens,</text><text x="68" y="519" class="body">wal en ram, paarden, puin in zee; lied</text><text x="68" y="562" class="body">en harp verstommen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De klacht · 15–18</text><text x="68" y="711" class="body">Vorsten van de zee van hun zetels,</text><text x="68" y="754" class="body">beven en klaaglied; eilanden ontsteld.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Het slot · 19–21</text><text x="68" y="903" class="body">Verwoesting, diep water en afdalen naar</text><text x="68" y="946" class="body">oude ruïnes; verdwijnen en niet</text><text x="68" y="989" class="body">teruggevonden worden.</text><text x="46" y="1082" class="note">De versgroepen volgen deze plaatselijke tekst.</text><text x="46" y="1118" class="note">Aankondiging, gelijkenis en beschreven handeling</text><text x="46" y="1154" class="note">worden onderscheiden.</text></svg>