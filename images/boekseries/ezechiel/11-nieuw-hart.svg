<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Eén hart en een nieuwe geest</title><desc id="desc">De relaties tussen verzamelen, nieuw hart, gehoorzaamheid en verbondsrelatie.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eén hart en een nieuwe geest</text><text x="44" y="113" class="ref">Ezechiël 11:17–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verzamelen · 17–18</text><text x="68" y="241" class="body">Uit de landen naar Israël;</text><text x="68" y="284" class="body">afschuwelijke goden en gruwelen</text><text x="68" y="327" class="body">weghalen.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De verandering · 19</text><text x="68" y="476" class="body">Eén hart, nieuwe geest; hart van steen</text><text x="68" y="519" class="body">weg, hart van vlees gegeven.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Het doel · 20</text><text x="68" y="668" class="body">Wetten leven, regels bewaren en doen;</text><text x="68" y="711" class="body">zij Zijn volk en Hij hun God.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De andere weg · 21</text><text x="68" y="860" class="body">Wie de afgoden blijft volgen, ontvangt</text><text x="68" y="903" class="body">zijn eigen weg op zijn hoofd.</text><text x="46" y="996" class="note">Het hartbeeld beschrijft een gegeven innerlijke</text><text x="46" y="1032" class="note">verandering en haar uitwerking. De tekst spreekt</text><text x="46" y="1068" class="note">niet over een lichamelijke operatie.</text></svg>