<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">De delen, poorten en stadsnaam</title><desc id="desc">Opbouw van het hoofdstuk met maten, voorschriften en afzonderlijke functies.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De delen, poorten en stadsnaam</text><text x="44" y="113" class="ref">Ezechiël 48:1–35</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Noordelijke delen · 1–7</text><text x="68" y="241" class="body">Dan, Aser, Naftali, Manasse, Efraïm,</text><text x="68" y="284" class="body">Ruben en Juda: elk een strook</text><text x="68" y="327" class="body">oost–west.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het afgezonderde deel · 8–22</text><text x="68" y="476" class="body">Heiligdom, priesters, Levieten, stad en</text><text x="68" y="519" class="body">weide; opbrengst voor werkers uit alle</text><text x="68" y="562" class="body">stammen, vorst aan beide kanten.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Zuidelijke delen · 23–29</text><text x="68" y="711" class="body">Benjamin, Simeon, Issaschar, Zebulon en</text><text x="68" y="754" class="body">Gad, met de zuidgrens.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Poorten en naam · 30–35</text><text x="68" y="903" class="body">Drie poorten per zijde, namen naar</text><text x="68" y="946" class="body">stammen; omtrek ongeveer 9 km, naam: DE</text><text x="68" y="989" class="body">HEERE IS DAAR.</text><text x="46" y="1082" class="note">Het hoofdstuk behoort bij het beschreven</text><text x="46" y="1118" class="note">visioen. De indeling, afgeronde maten en</text><text x="46" y="1154" class="note">benamingen volgen deze plaatselijke tekst.</text></svg>