<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1342" viewBox="0 0 840 1342" role="img" aria-labelledby="title desc"><title id="title">Ontvangen pracht en trouwbreuk</title><desc id="desc">Hoofdstukopbouw die tekstvorm en verklaring zichtbaar houdt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1342" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ontvangen pracht en trouwbreuk</text><text x="44" y="113" class="ref">Ezechiël 16:1–63</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het begin · 1–14</text><text x="68" y="241" class="body">Jeruzalem als verworpen kind, tot leven</text><text x="68" y="284" class="body">geroepen en groot geworden; bedekt,</text><text x="68" y="327" class="body">verbond, kleding, sieraden en voedsel</text><text x="68" y="370" class="body">ontvangen.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De ontrouw · 15–34</text><text x="68" y="519" class="body">Schoonheid en gaven voor afgoderij</text><text x="68" y="562" class="body">gebruikt; kinderen geofferd, vreemde</text><text x="68" y="605" class="body">verbonden en zelf betaalde minnaars.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het oordeel · 35–43</text><text x="68" y="754" class="body">Verzamelde minnaars, afbraak, verlies</text><text x="68" y="797" class="body">en brand; eigen weg komt terug,</text><text x="68" y="840" class="body">vergeten jeugd benoemd.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Zussen en verbond · 44–63</text><text x="68" y="989" class="body">Samaria en Sodom, Jeruzalem erger; hun</text><text x="68" y="1032" class="body">lot gekeerd, schaamte, herinnerd en</text><text x="68" y="1075" class="body">eeuwig verbond, verzoening.</text><text x="46" y="1168" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="1204" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="1240" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="1276" class="note">verband.</text></svg>