<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">De genoemde volken bij Gog</title><desc id="desc">De verschillende genoemde groepen met hun tekstuele rol.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De genoemde volken bij Gog</text><text x="44" y="113" class="ref">Ezechiël 38:2–8,13–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aangesprokene · 2–4</text><text x="68" y="241" class="body">Gog in Magog, hoofdvorst van Mesech en</text><text x="68" y="284" class="body">Tubal; leger met paarden en schilden.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Met hem · 5–6</text><text x="68" y="433" class="body">Perzen, Ethiopiërs en Put; Gomer met</text><text x="68" y="476" class="body">troepen en Beth-Togarma uit het verre</text><text x="68" y="519" class="body">noorden, met veel volken.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De vraagstellers · 13</text><text x="68" y="668" class="body">Scheba, Dedan en Tarsis’ handelaars met</text><text x="68" y="711" class="body">hun jonge leeuwen vragen naar het</text><text x="68" y="754" class="body">roven.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Doel en tijd · 8,14–16</text><text x="68" y="903" class="body">Verzameld Israël in hersteld land,</text><text x="68" y="946" class="body">veilig wonend; aan het einde van de</text><text x="68" y="989" class="body">jaren en de dagen.</text><text x="46" y="1082" class="note">De vraagstellers worden niet automatisch</text><text x="46" y="1118" class="note">bondgenoten in de aanval genoemd. Geen oude naam</text><text x="46" y="1154" class="note">wordt hier aan een huidige staat gelijkgesteld.</text></svg>