<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Glans terug en altaar gereinigd</title><desc id="desc">Opbouw van het hoofdstuk met maten, voorschriften en afzonderlijke functies.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Glans terug en altaar gereinigd</text><text x="44" y="113" class="ref">Ezechiël 43:1–27</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De terugkeer · 1–9</text><text x="68" y="241" class="body">Uit het oosten door de oostpoort het</text><text x="68" y="284" class="body">huis in, huis gevuld; stem, neervallen</text><text x="68" y="327" class="body">en wonen te midden van Israël zonder</text><text x="68" y="370" class="body">ontering.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Het ontwerp · 10–12</text><text x="68" y="519" class="body">Huis beschrijven, schaamte en opmeten;</text><text x="68" y="562" class="body">vorm, ingangen, uitgangen en regels</text><text x="68" y="605" class="body">opschrijven, gebied allerheiligst.</text><rect x="42" y="663" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het altaar · 13–17</text><text x="68" y="754" class="body">Maten, goot, randen, haard, vier hoorns</text><text x="68" y="797" class="body">en treden aan het oosten.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">De ingebruikneming · 18–27</text><text x="68" y="946" class="body">Zadoks nakomelingen, reinigen en</text><text x="68" y="989" class="body">verzoenen, tweede dag en zeven dagen;</text><text x="68" y="1032" class="body">vanaf de achtste dag aannemen.</text><text x="46" y="1125" class="note">Het hoofdstuk behoort bij het beschreven</text><text x="46" y="1161" class="note">visioen. De indeling, afgeronde maten en</text><text x="46" y="1197" class="note">benamingen volgen deze plaatselijke tekst.</text></svg>