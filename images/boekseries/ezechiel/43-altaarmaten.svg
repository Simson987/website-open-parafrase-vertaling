<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Maten van het altaar</title><desc id="desc">Alle gegeven onderdelen met hun eigen maten en oostelijke treden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Maten van het altaar</text><text x="44" y="113" class="ref">Ezechiël 43:13–17</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Goot en sokkel · 13</text><text x="68" y="241" class="body">Goot 0,5 m diep en 0,5 m breed; rand</text><text x="68" y="284" class="body">ongeveer 20 cm.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onderste en grote rand · 14</text><text x="68" y="433" class="body">Van goot tot onderste rand 1 m, breedte</text><text x="68" y="476" class="body">0,5 m; van kleine tot grote rand 2 m,</text><text x="68" y="519" class="body">breedte 0,5 m.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Haard · 15–16</text><text x="68" y="668" class="body">2 m hoog; 6 × 6 m vierkant; vier hoorns</text><text x="68" y="711" class="body">omhoog.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Omlijsting · 17</text><text x="68" y="860" class="body">7 × 7 m; rand 25 cm, goot 0,5 m; treden</text><text x="68" y="903" class="body">aan de oostkant.</text><text x="46" y="996" class="note">Maten staan per genoemd onderdeel. Er wordt geen</text><text x="46" y="1032" class="note">extra totale hoogte berekend uit mogelijk</text><text x="46" y="1068" class="note">verschillende meetpunten.</text></svg>