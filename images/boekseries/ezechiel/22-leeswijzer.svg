<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">De aanklacht en de oven</title><desc id="desc">De opbouw van het hoofdstuk met de verschillende sprekers en tekstvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De aanklacht en de oven</text><text x="44" y="113" class="ref">Ezechiël 22:1–31</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De stad · 1–16</text><text x="68" y="241" class="body">Bloed, afgoden, verdrukking,</text><text x="68" y="284" class="body">ontheiliging, seksueel geweld,</text><text x="68" y="327" class="body">geschenken en woeker; verstrooiing en</text><text x="68" y="370" class="body">zuivering.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">De oven · 17–22</text><text x="68" y="519" class="body">Metalen en schuim bijeengebracht in</text><text x="68" y="562" class="body">Jeruzalem; vuur en smelten als beeld</text><text x="68" y="605" class="body">van het oordeel.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Alle groepen · 23–31</text><text x="68" y="754" class="body">Profeten, priesters, vorsten en volk;</text><text x="68" y="797" class="body">geen mens gevonden om de muur te</text><text x="68" y="840" class="body">herstellen en in de bres te staan.</text><text x="46" y="933" class="note">De versgroepen volgen deze plaatselijke tekst.</text><text x="46" y="969" class="note">Aankondiging, gelijkenis en beschreven handeling</text><text x="46" y="1005" class="note">worden onderscheiden.</text></svg>