<svg xmlns="http://www.w3.org/2000/svg" width="840" height="985" viewBox="0 0 840 985" role="img" aria-labelledby="title desc"><title id="title">De namen en de steden</title><desc id="desc">Exacte namen, stadsidentiteiten en het verband van de gedeelde beker.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="985" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De namen en de steden</text><text x="44" y="113" class="ref">Ezechiël 23:4–35</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ohola · 4–10</text><text x="68" y="241" class="body">De oudste: Samaria. Assyriërs als</text><text x="68" y="284" class="body">minnaars, aan hen overgegeven.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Oholiba · 4,11–30</text><text x="68" y="433" class="body">Haar zus: Jeruzalem. Assyriërs,</text><text x="68" y="476" class="body">Chaldeeën en herinnering aan Egypte;</text><text x="68" y="519" class="body">nog verder in dezelfde weg.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">De gedeelde beker · 31–35</text><text x="68" y="668" class="body">Oholiba gaat de weg van haar zus en</text><text x="68" y="711" class="body">krijgt de diepe, wijde beker van</text><text x="68" y="754" class="body">Samaria: verwoesting en eenzaamheid.</text><text x="46" y="847" class="note">De vrouwen zijn een uitgesproken beeld voor twee</text><text x="46" y="883" class="note">steden. Dit is geen nieuwe biologische stamboom</text><text x="46" y="919" class="note">of afzonderlijk liefdesverhaal.</text></svg>