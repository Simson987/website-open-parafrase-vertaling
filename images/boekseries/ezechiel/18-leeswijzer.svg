<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1150" viewBox="0 0 840 1150" role="img" aria-labelledby="title desc"><title id="title">Ieder naar de eigen weg</title><desc id="desc"></desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1150" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ieder naar de eigen weg</text><text x="44" y="113" class="ref">Ezechiël 18:1–32</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Spreuk en generaties · 1–20</text><text x="68" y="241" class="body">Geen overgeërfde schuldregel:</text><text x="68" y="284" class="body">rechtvaardige vader, slechte zoon,</text><text x="68" y="327" class="body">anders handelende kleinzoon; elk draagt</text><text x="68" y="370" class="body">eigen gedrag.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Twee veranderingen · 21–29</text><text x="68" y="519" class="body">Goddeloze keert terug en leeft;</text><text x="68" y="562" class="body">rechtvaardige wijkt af en sterft.</text><text x="68" y="605" class="body">Aanklacht over oneerlijkheid</text><text x="68" y="648" class="body">beantwoord.</text><rect x="42" y="706" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="749" class="label">De oproep · 30–32</text><text x="68" y="797" class="body">Ieder geoordeeld naar eigen wegen;</text><text x="68" y="840" class="body">bekeer je, doe overtredingen weg, nieuw</text><text x="68" y="883" class="body">hart en nieuwe geest, leef.</text><text x="46" y="976" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="1012" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="1048" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="1084" class="note">verband.</text></svg>