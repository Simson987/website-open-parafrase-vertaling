<svg xmlns="http://www.w3.org/2000/svg" width="840" height="915" viewBox="0 0 840 915" role="img" aria-labelledby="title desc"><title id="title">Twee onderscheiden dienstgroepen</title><desc id="desc">De reden en precieze verschillen van de twee genoemde groepen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="915" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee onderscheiden dienstgroepen</text><text x="44" y="113" class="ref">Ezechiël 44:10–16</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Afgedwaalde Levieten · 10–14</text><text x="68" y="241" class="body">Schuld dragen; poortwacht, huisdienst,</text><text x="68" y="284" class="body">slachten en het volk dienen. Niet</text><text x="68" y="327" class="body">naderen als priester tot de</text><text x="68" y="370" class="body">allerheiligste gaven.</text><rect x="42" y="428" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Zadoks nakomelingen · 15–16</text><text x="68" y="519" class="body">Zorg voor het heiligdom gehouden;</text><text x="68" y="562" class="body">naderen om te dienen, vet en bloed</text><text x="68" y="605" class="body">offeren, het heiligdom binnen en aan de</text><text x="68" y="648" class="body">tafel.</text><text x="46" y="741" class="note">Beide groepen behoren tot Levieten, maar krijgen</text><text x="46" y="777" class="note">in deze passage verschillende</text><text x="46" y="813" class="note">verantwoordelijkheden. Het schema verwart dienst</text><text x="46" y="849" class="note">aan volk en huis niet met naderen tot de tafel.</text></svg>