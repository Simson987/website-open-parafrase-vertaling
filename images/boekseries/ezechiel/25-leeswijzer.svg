<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1220" viewBox="0 0 840 1220" role="img" aria-labelledby="title desc"><title id="title">Vier woorden over buurvolken</title><desc id="desc">De opbouw van het hoofdstuk met de verschillende sprekers en tekstvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1220" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier woorden over buurvolken</text><text x="44" y="113" class="ref">Ezechiël 25:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ammon · 1–7</text><text x="68" y="241" class="body">Spot om heiligdom, land en</text><text x="68" y="284" class="body">ballingschap; aan het oosten, Rabba</text><text x="68" y="327" class="body">voor kamelen en het land voor schapen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Moab en Seïr · 8–11</text><text x="68" y="476" class="body">Juda als andere volken bespot;</text><text x="68" y="519" class="body">grenssteden open en aan de volken uit</text><text x="68" y="562" class="body">het oosten overgegeven.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Edom · 12–14</text><text x="68" y="711" class="body">Wraak tegen Juda; woestenij van Theman</text><text x="68" y="754" class="body">tot Dedan, oordeel door Israël.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Filistijnen · 15–17</text><text x="68" y="903" class="body">Wraak en eeuwige vijandschap;</text><text x="68" y="946" class="body">Kretenzers en de rest aan de kust</text><text x="68" y="989" class="body">geoordeeld.</text><text x="46" y="1082" class="note">De versgroepen volgen deze plaatselijke tekst.</text><text x="46" y="1118" class="note">Aankondiging, gelijkenis en beschreven handeling</text><text x="46" y="1154" class="note">worden onderscheiden.</text></svg>