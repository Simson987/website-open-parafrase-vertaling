<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Haar verdeeld, stad geoordeeld</title><desc id="desc">Hoofdstukopbouw met de verschillende vertelvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Haar verdeeld, stad geoordeeld</text><text x="44" y="113" class="ref">Ezechiël 5:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het teken · 1–4</text><text x="68" y="241" class="body">Hoofd en baard scheren, wegen en in</text><text x="68" y="284" class="body">drieën delen; vuur, zwaard en wind, met</text><text x="68" y="327" class="body">een klein deel in de mantelpunt.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De aanklacht · 5–11</text><text x="68" y="476" class="body">Jeruzalem midden tussen volken, maar</text><text x="68" y="519" class="body">regels en wetten erger verworpen;</text><text x="68" y="562" class="body">heiligdom ontheiligd.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De verklaring · 12–17</text><text x="68" y="711" class="body">Drie groepen: pest en honger, zwaard,</text><text x="68" y="754" class="body">verstrooiing; schaamte, honger en</text><text x="68" y="797" class="body">oordeel naar Zijn gesproken woord.</text><text x="46" y="890" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="926" class="note">Visioen, gesproken opdracht, tekenhandeling en</text><text x="46" y="962" class="note">verklaring worden onderscheiden.</text></svg>