<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1107" viewBox="0 0 840 1107" role="img" aria-labelledby="title desc"><title id="title">Tekenen en geen uitstel</title><desc id="desc">Hoofdstukopbouw die tekstvorm en verklaring zichtbaar houdt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1107" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tekenen en geen uitstel</text><text x="44" y="113" class="ref">Ezechiël 12:1–28</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bagage en uitleg · 1–16</text><text x="68" y="241" class="body">Overdag bagage, ’s avonds muur</text><text x="68" y="284" class="body">doorgraven, gezicht bedekt. Voor de</text><text x="68" y="327" class="body">vorst en het volk: ballingschap, net en</text><text x="68" y="370" class="body">een kleine rest.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Brood en water · 17–20</text><text x="68" y="519" class="body">Bevend eten en bezorgd drinken als</text><text x="68" y="562" class="body">teken van het geweld en gebrek in stad</text><text x="68" y="605" class="body">en land.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Twee weerwoorden · 21–28</text><text x="68" y="754" class="body">Geen uitgelopen visioenen en geen verre</text><text x="68" y="797" class="body">toekomst om te negeren: het woord wordt</text><text x="68" y="840" class="body">niet langer uitgesteld.</text><text x="46" y="933" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="969" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="1005" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="1041" class="note">verband.</text></svg>