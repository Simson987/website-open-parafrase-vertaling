<svg xmlns="http://www.w3.org/2000/svg" width="840" height="872" viewBox="0 0 840 872" role="img" aria-labelledby="title desc"><title id="title">Twee beelden van vorsten</title><desc id="desc">Hoofdstukopbouw die tekstvorm en verklaring zichtbaar houdt.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="872" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Twee beelden van vorsten</text><text x="44" y="113" class="ref">Ezechiël 19:1–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Leeuwin en twee welpen · 1–9</text><text x="68" y="241" class="body">Eerste jonge leeuw geroofd en naar</text><text x="68" y="284" class="body">Egypte; na vervlogen hoop een andere,</text><text x="68" y="327" class="body">gevangen en naar Babel.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Wijnstok en scepters · 10–14</text><text x="68" y="476" class="body">Vruchtbaar aan water en sterke</text><text x="68" y="519" class="body">heerserstakken; uitgerukt, verdroogd,</text><text x="68" y="562" class="body">in de woestijn en verbrand; geen</text><text x="68" y="605" class="body">scepter over.</text><text x="46" y="698" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="734" class="note">Beeldverhaal, gelijkenis, voorwaardelijk geval</text><text x="46" y="770" class="note">en beschreven teken hebben elk hun eigen</text><text x="46" y="806" class="note">verband.</text></svg>