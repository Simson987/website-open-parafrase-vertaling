<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Ohola en Oholiba</title><desc id="desc">De opbouw van het hoofdstuk met de verschillende sprekers en tekstvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Ohola en Oholiba</text><text x="44" y="113" class="ref">Ezechiël 23:1–49</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De oudste · 1–10</text><text x="68" y="241" class="body">Ohola is Samaria. Ontrouw met Egypte en</text><text x="68" y="284" class="body">Assur, overgegeven aan de geliefde</text><text x="68" y="327" class="body">Assyriërs.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Haar zus · 11–35</text><text x="68" y="476" class="body">Oholiba is Jeruzalem. Nog erger,</text><text x="68" y="519" class="body">wandbeelden en boden, afkeer en</text><text x="68" y="562" class="body">terugverlangen; minnaars worden</text><text x="68" y="605" class="body">tegenstanders en dezelfde beker.</text><rect x="42" y="663" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Gedeelde aanklacht · 36–49</text><text x="68" y="754" class="body">Afgoden, kinderen geofferd, heiligdom</text><text x="68" y="797" class="body">en sabbat ontheiligd; wierook en olie</text><text x="68" y="840" class="body">misbruikt, oordeel en waarschuwing.</text><text x="46" y="933" class="note">De versgroepen volgen deze plaatselijke tekst.</text><text x="46" y="969" class="note">Aankondiging, gelijkenis en beschreven handeling</text><text x="46" y="1005" class="note">worden onderscheiden.</text></svg>