<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1319" viewBox="0 0 840 1319" role="img" aria-labelledby="title desc"><title id="title">Eerlijke maten en bijdragen</title><desc id="desc">De vier bijdragen en hun verschillende maat of verhouding.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1319" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eerlijke maten en bijdragen</text><text x="44" y="113" class="ref">Ezechiël 45:10–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerlijke maat · 10–12</text><text x="68" y="241" class="body">Droog en nat elk een tiende van</text><text x="68" y="284" class="body">ongeveer 220 l. Zilverstuk ongeveer 12</text><text x="68" y="327" class="body">g; zestig vormen samen een pond.</text><rect x="42" y="385" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tarwe en gerst · 13</text><text x="68" y="476" class="body">Van elk 220 l ongeveer 4 l als gave.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Olie · 14</text><text x="68" y="625" class="body">Van elke 220 l ongeveer 2 l als gave.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Kudde · 15</text><text x="68" y="774" class="body">Eén lam uit tweehonderd dieren, uit het</text><text x="68" y="817" class="body">waterrijke land van Israël.</text><rect x="42" y="875" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="918" class="label">Verantwoordelijkheid · 16–17</text><text x="68" y="966" class="body">Volk brengt aan de vorst; vorst</text><text x="68" y="1009" class="body">verzorgt de genoemde offers op feest,</text><text x="68" y="1052" class="body">nieuwe maand en sabbat.</text><text x="46" y="1145" class="note">De afgeronde liters worden overgenomen zoals</text><text x="46" y="1181" class="note">hier vermeld. Er zijn geen preciezere</text><text x="46" y="1217" class="note">percentages of moderne belastingregels aan</text><text x="46" y="1253" class="note">toegevoegd.</text></svg>