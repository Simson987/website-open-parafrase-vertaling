<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1028" viewBox="0 0 840 1028" role="img" aria-labelledby="title desc"><title id="title">Vijandschap en verlaten Seïr</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1028" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vijandschap en verlaten Seïr</text><text x="44" y="113" class="ref">Ezechiël 35:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Het oordeel · 1–9</text><text x="68" y="241" class="body">Seïr aangesproken; eeuwige vijandschap,</text><text x="68" y="284" class="body">overleveren van Israël en een volkomen</text><text x="68" y="327" class="body">woestenij.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De aanspraak · 10–13</text><text x="68" y="476" class="body">Twee volken en landen opeisen, jaloezie</text><text x="68" y="519" class="body">en grootspraak tegen de bergen van</text><text x="68" y="562" class="body">Israël; Hij heeft het gehoord.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De omkering · 14–15</text><text x="68" y="711" class="body">Blij om Israëls verwoeste erfdeel;</text><text x="68" y="754" class="body">hetzelfde treft Seïr en heel Edom,</text><text x="68" y="797" class="body">terwijl de aarde blij is.</text><text x="46" y="890" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="926" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="962" class="note">beschreven bericht blijven onderscheiden.</text></svg>