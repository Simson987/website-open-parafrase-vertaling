<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1256" viewBox="0 0 840 1256" role="img" aria-labelledby="title desc"><title id="title">Drie gelijke delen</title><desc id="desc">Alle derden en de afzonderlijke behandeling van enkele haren.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1256" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Drie gelijke delen</text><text x="44" y="113" class="ref">Ezechiël 5:2–4,12</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Eerste derde</text><text x="68" y="241" class="body">Haar in de stad verbranden · in de</text><text x="68" y="284" class="body">verklaring: pest en honger in hun</text><text x="68" y="327" class="body">midden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Tweede derde</text><text x="68" y="476" class="body">Met het zwaard rondom slaan · in de</text><text x="68" y="519" class="body">verklaring: vallen door het zwaard</text><text x="68" y="562" class="body">rondom.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Derde derde</text><text x="68" y="711" class="body">In de wind strooien · in de verklaring:</text><text x="68" y="754" class="body">naar alle windstreken verstrooid,</text><text x="68" y="797" class="body">zwaard erachteraan.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Klein aantal · 3–4</text><text x="68" y="946" class="body">Enkele haren in de mantelpunt binden;</text><text x="68" y="989" class="body">daarvan ook weer wat in het vuur.</text><text x="46" y="1082" class="note">Vers 12 geeft de drie uitkomsten bij het</text><text x="46" y="1118" class="note">voorafgaande teken. Het kleine aantal is een</text><text x="46" y="1154" class="note">aanvullende aanwijzing naast de verdeling in</text><text x="46" y="1190" class="note">derden.</text></svg>