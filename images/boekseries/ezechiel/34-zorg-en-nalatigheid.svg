<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1369" viewBox="0 0 840 1369" role="img" aria-labelledby="title desc"><title id="title">Nagelaten en beloofde zorg</title><desc id="desc">De verschillende ontbrekende zorgtaken en hun latere antwoorden.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1369" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Nagelaten en beloofde zorg</text><text x="44" y="113" class="ref">Ezechiël 34:4,11–16</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Zwak en ziek</text><text x="68" y="241" class="body">Niet sterk gemaakt of genezen · later</text><text x="68" y="284" class="body">het zieke sterk maken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gewond</text><text x="68" y="433" class="body">Niet verbonden · later het gewonde</text><text x="68" y="476" class="body">verbinden.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Verdwaald en verloren</text><text x="68" y="625" class="body">Niet teruggebracht of gezocht · later</text><text x="68" y="668" class="body">verloren zoeken en verdwaald</text><text x="68" y="711" class="body">terugbrengen.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">De omgang</text><text x="68" y="860" class="body">Hardheid, geweld en verstrooiing ·</text><text x="68" y="903" class="body">later opzoeken, verzamelen, goed weiden</text><text x="68" y="946" class="body">en rust.</text><rect x="42" y="1004" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1047" class="label">Het recht · 16–22</text><text x="68" y="1095" class="body">Ook oordeel over het vette en sterke en</text><text x="68" y="1138" class="body">over wie zwakken verdringen.</text><text x="46" y="1231" class="note">De belofte van zorg en het recht tussen de</text><text x="46" y="1267" class="note">dieren horen in hetzelfde herderbeeld. Vers 31</text><text x="46" y="1303" class="note">verklaart dat de schapen mensen zijn.</text></svg>