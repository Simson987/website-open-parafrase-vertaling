<svg xmlns="http://www.w3.org/2000/svg" width="840" height="942" viewBox="0 0 840 942" role="img" aria-labelledby="title desc"><title id="title">Schenking en behoud van erfdeel</title><desc id="desc">De relaties tussen vorst, zonen, dienaren en het beschermde volkserfdeel.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="942" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Schenking en behoud van erfdeel</text><text x="44" y="113" class="ref">Ezechiël 46:16–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aan een zoon · 16</text><text x="68" y="241" class="body">Gift uit het erfdeel van de vorst wordt</text><text x="68" y="284" class="body">blijvend bezit van de zonen.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Aan een dienaar · 17</text><text x="68" y="433" class="body">Gift blijft tot het jaar van vrijlating</text><text x="68" y="476" class="body">en keert daarna terug naar de vorst.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Het volk · 18</text><text x="68" y="625" class="body">Niets van hun erfdeel afnemen. De vorst</text><text x="68" y="668" class="body">geeft zijn zonen uit eigen bezit, zodat</text><text x="68" y="711" class="body">niemand verdreven wordt.</text><text x="46" y="804" class="note">De twee ontvangers hebben verschillende</text><text x="46" y="840" class="note">gevolgen. Deze regel beschermt juist het eigen</text><text x="46" y="876" class="note">erfdeel van het volk tegen toe-eigening.</text></svg>