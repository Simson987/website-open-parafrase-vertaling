<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1601" viewBox="0 0 840 1601" role="img" aria-labelledby="title desc"><title id="title">Handelspartners: eerste deel</title><desc id="desc">De eerste acht handelsvermeldingen met hun afzonderlijke producten.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1601" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Handelspartners: eerste deel</text><text x="44" y="113" class="ref">Ezechiël 27:12–19</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tarsis · 12</text><text x="68" y="241" class="body">Zilver, ijzer, tin en lood.</text><rect x="42" y="299" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Javan, Tubal, Mesech · 13</text><text x="68" y="390" class="body">Slaven en bronzen voorwerpen.</text><rect x="42" y="448" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="491" class="label">Beth-Togarma · 14</text><text x="68" y="539" class="body">Paarden, rijpaarden en muildieren.</text><rect x="42" y="597" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="640" class="label">Dedan en eilanden · 15</text><text x="68" y="688" class="body">Ivoren slagtanden en ebbenhout.</text><rect x="42" y="746" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="789" class="label">Syrië · 16</text><text x="68" y="837" class="body">Turkoois, purper, borduurwerk, fijn</text><text x="68" y="880" class="body">linnen, koraal en robijnen.</text><rect x="42" y="938" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="981" class="label">Juda en Israël · 17</text><text x="68" y="1029" class="body">Tarwe uit Minnit, gebak, honing, olie</text><text x="68" y="1072" class="body">en balsem.</text><rect x="42" y="1130" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1173" class="label">Damaskus · 18</text><text x="68" y="1221" class="body">Wijn uit Chelbon en witte wol.</text><rect x="42" y="1279" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1322" class="label">Dan en Javan · 19</text><text x="68" y="1370" class="body">Bewerkt ijzer, kaneel en kalmoes.</text><text x="46" y="1463" class="note">Het catalogiseert de beschreven handel, ook de</text><text x="46" y="1499" class="note">verhandelde mensen, zonder die praktijk goed te</text><text x="46" y="1535" class="note">keuren. Het tweede deel volgt apart.</text></svg>