<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1498" viewBox="0 0 840 1498" role="img" aria-labelledby="title desc"><title id="title">Grenzen en gelijk erfdeel</title><desc id="desc">Exacte grensnamen en inclusie van de genoemde vreemdelingen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1498" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Grenzen en gelijk erfdeel</text><text x="44" y="113" class="ref">Ezechiël 47:13–23</text><rect x="42" y="150" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Noord · 15–17</text><text x="68" y="241" class="body">Grote zee, Hethlon, Zedad, Hamath,</text><text x="68" y="284" class="body">Berotha, Sibraïm, Hazar-Hattichon;</text><text x="68" y="327" class="body">grens tot Hazar-Enon, langs Damaskus en</text><text x="68" y="370" class="body">Hamath.</text><rect x="42" y="428" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="471" class="label">Oost · 18</text><text x="68" y="519" class="body">Tussen Havran en Damaskus, Gilead en</text><text x="68" y="562" class="body">Israël; Jordaan van noordgrens tot</text><text x="68" y="605" class="body">oostelijke zee.</text><rect x="42" y="663" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Zuid · 19</text><text x="68" y="754" class="body">Thamar, water van Meriba bij Kades,</text><text x="68" y="797" class="body">beek tot grote zee.</text><rect x="42" y="855" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">West · 20</text><text x="68" y="946" class="body">Grote zee, van zuidgrens tot tegenover</text><text x="68" y="989" class="body">de weg naar Hamath.</text><rect x="42" y="1047" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="1090" class="label">De erfgenamen · 13–14,21–23</text><text x="68" y="1138" class="body">Twaalf stammen, Jozef twee delen;</text><text x="68" y="1181" class="body">gelijk erfdeel en ook voor inwonende</text><text x="68" y="1224" class="body">vreemdelingen met kinderen, in hun</text><text x="68" y="1267" class="body">woonstam.</text><text x="46" y="1360" class="note">Dit is een namenoverzicht, geen kaart met</text><text x="46" y="1396" class="note">onbevestigde moderne coördinaten. Hazar-Enon is</text><text x="46" y="1432" class="note">de schrijfwijze in dit hoofdstuk.</text></svg>