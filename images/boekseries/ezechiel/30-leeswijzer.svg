<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Egypte en gebroken kracht</title><desc id="desc">De opbouw van het hoofdstuk met de verschillende sprekers en tekstvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Egypte en gebroken kracht</text><text x="44" y="113" class="ref">Ezechiël 30:1–26</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De dag · 1–9</text><text x="68" y="241" class="body">Nabij en bewolkt; Egypte en bondgenoten</text><text x="68" y="284" class="body">vallen, van Migdol tot Syene, boden per</text><text x="68" y="327" class="body">schip naar Ethiopië.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Rivieren en steden · 10–19</text><text x="68" y="476" class="body">Nebukadrezar en zijn volk; water droog,</text><text x="68" y="519" class="body">afgoden weg, genoemde plaatsen</text><text x="68" y="562" class="body">geoordeeld en het juk gebroken.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De armen · 20–26</text><text x="68" y="711" class="body">Elfde jaar, eerste maand, zevende dag:</text><text x="68" y="754" class="body">Farao’s arm niet genezen, beide</text><text x="68" y="797" class="body">gebroken; Babels armen sterk en Egypte</text><text x="68" y="840" class="body">verstrooid.</text><text x="46" y="933" class="note">De versgroepen volgen deze plaatselijke tekst.</text><text x="46" y="969" class="note">Aankondiging, gelijkenis en beschreven handeling</text><text x="46" y="1005" class="note">worden onderscheiden.</text></svg>