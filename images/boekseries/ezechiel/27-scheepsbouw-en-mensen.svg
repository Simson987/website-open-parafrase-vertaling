<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1263" viewBox="0 0 840 1263" role="img" aria-labelledby="title desc"><title id="title">Het schip: bouw en mensen</title><desc id="desc">Exacte materialen, herkomsten en rollen in het scheepsbeeld.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1263" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Het schip: bouw en mensen</text><text x="44" y="113" class="ref">Ezechiël 27:5–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hout · 5–6</text><text x="68" y="241" class="body">Planken: cipres uit Senir. Mast: ceder</text><text x="68" y="284" class="body">uit Libanon. Riemen: eik uit Basan.</text><text x="68" y="327" class="body">Dek: ivoor uit Chittitische eilanden.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Doek · 7</text><text x="68" y="476" class="body">Zeil: fijn geborduurd linnen uit</text><text x="68" y="519" class="body">Egypte. Zonnedek: blauw- en roodpurper</text><text x="68" y="562" class="body">uit de eilanden van Elisa.</text><rect x="42" y="620" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De bemanning · 8–9</text><text x="68" y="711" class="body">Sidon en Arvad: roeiers. Tyrus’ wijzen:</text><text x="68" y="754" class="body">stuurlui. Gebals oudsten en vaklui:</text><text x="68" y="797" class="body">lekken dichten.</text><rect x="42" y="855" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="898" class="label">Het leger · 10–11</text><text x="68" y="946" class="body">Perzen, Lydiërs en Put: soldaten. Arvad</text><text x="68" y="989" class="body">en eigen leger: muren. Gammadieten:</text><text x="68" y="1032" class="body">torens.</text><text x="46" y="1125" class="note">Dit is het schipbeeld in een klaaglied over de</text><text x="46" y="1161" class="note">stad Tyrus. De herkomstnamen volgen de tekst,</text><text x="46" y="1197" class="note">zonder moderne grenzen toe te voegen.</text></svg>