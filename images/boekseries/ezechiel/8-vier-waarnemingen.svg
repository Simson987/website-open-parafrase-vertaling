<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Vier waarnemingen in de tempel</title><desc id="desc">Plaatsen, groepen, aantallen en houding per waarneming.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vier waarnemingen in de tempel</text><text x="44" y="113" class="ref">Ezechiël 8:5–16</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Noordelijke ingang · 5–6</text><text x="68" y="241" class="body">Het tergende beeld bij de altaarpoort.</text><rect x="42" y="299" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Kamer achter de muur · 7–13</text><text x="68" y="390" class="body">Kruipende dieren en afgoden op de</text><text x="68" y="433" class="body">muren; 70 oudsten met wierook, Jaäzanja</text><text x="68" y="476" class="body">middenin.</text><rect x="42" y="534" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Noordelijke poort · 14–15</text><text x="68" y="625" class="body">Zittende vrouwen die om Tammuz huilen.</text><rect x="42" y="683" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Binnenste voorhof · 16</text><text x="68" y="774" class="body">Ongeveer 25 mannen tussen voorhal en</text><text x="68" y="817" class="body">altaar; rug naar tempel, gezicht naar</text><text x="68" y="860" class="body">het oosten en de zon.</text><text x="46" y="953" class="note">De opeenvolging is die van het visioen. Alleen</text><text x="46" y="989" class="note">beschreven ruimtelijke relaties zijn opgenomen;</text><text x="46" y="1025" class="note">het schema is geen opgegraven tempelplattegrond.</text></svg>