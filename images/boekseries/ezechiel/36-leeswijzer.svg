<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Land, naam en nieuwe geest</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Land, naam en nieuwe geest</text><text x="44" y="113" class="ref">Ezechiël 36:1–38</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De bergen · 1–15</text><text x="68" y="241" class="body">Spot en roof, oordeel over buren;</text><text x="68" y="284" class="body">vrucht, bebouwing, steden en volk</text><text x="68" y="327" class="body">terug, geen verslinden meer.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De naam · 16–23</text><text x="68" y="476" class="body">Eigen kwaad en verstrooiing, heilige</text><text x="68" y="519" class="body">naam onder volken onteerd; handelen om</text><text x="68" y="562" class="body">Zijn naam, niet hun verdienste.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">De vernieuwing · 24–32</text><text x="68" y="711" class="body">Verzamelen, reinigen, nieuw hart en</text><text x="68" y="754" class="body">Geest, gehoorzaamheid, verbond en</text><text x="68" y="797" class="body">overvloed; schuld herinnerd en</text><text x="68" y="840" class="body">schaamte.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Het herstel · 33–38</text><text x="68" y="989" class="body">Steden herbouwd, woestenij als Eden,</text><text x="68" y="1032" class="body">volken erkennen, gebed en kudden</text><text x="68" y="1075" class="body">mensen.</text><text x="46" y="1168" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="1204" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="1240" class="note">beschreven bericht blijven onderscheiden.</text></svg>