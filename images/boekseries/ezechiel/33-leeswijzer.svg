<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1306" viewBox="0 0 840 1306" role="img" aria-labelledby="title desc"><title id="title">Waarschuwen, leven en horen</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1306" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarschuwen, leven en horen</text><text x="44" y="113" class="ref">Ezechiël 33:1–33</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De wachter · 1–9</text><text x="68" y="241" class="body">Hoorn horen of negeren, wel of niet</text><text x="68" y="284" class="body">waarschuwen; daarna Ezechiëls eigen</text><text x="68" y="327" class="body">opdracht en verantwoordelijkheid.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De omkeer · 10–20</text><text x="68" y="476" class="body">Bekeren en leven, recht doen en</text><text x="68" y="519" class="body">onderpand teruggeven; ieder naar eigen</text><text x="68" y="562" class="body">wegen, niet op eerder goed vertrouwen.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het bericht · 21–22</text><text x="68" y="711" class="body">Jaar 12, maand 10, dag 5: de stad is</text><text x="68" y="754" class="body">gevallen. Zijn mond was de avond ervoor</text><text x="68" y="797" class="body">geopend; de man komt de volgende</text><text x="68" y="840" class="body">morgen.</text><rect x="42" y="898" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="941" class="label">Twee groepen · 23–33</text><text x="68" y="989" class="body">Bewoners van puinhopen claimen land</text><text x="68" y="1032" class="body">ondanks kwaad; hoorders komen voor</text><text x="68" y="1075" class="body">mooie woorden maar doen ze niet.</text><text x="46" y="1168" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="1204" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="1240" class="note">beschreven bericht blijven onderscheiden.</text></svg>