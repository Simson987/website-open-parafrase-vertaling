<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1114" viewBox="0 0 840 1114" role="img" aria-labelledby="title desc"><title id="title">Teken van beleg en gebrek</title><desc id="desc">Hoofdstukopbouw met de verschillende vertelvormen.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1114" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Teken van beleg en gebrek</text><text x="44" y="113" class="ref">Ezechiël 4:1–17</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De stad · 1–3</text><text x="68" y="241" class="body">Jeruzalem op een tegel, kampen, wal,</text><text x="68" y="284" class="body">torens en stormrammen; een ijzeren</text><text x="68" y="327" class="body">plaat als muur.</text><rect x="42" y="385" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">De dagen · 4–8</text><text x="68" y="476" class="body">Linkerzij voor Israël 390 dagen,</text><text x="68" y="519" class="body">rechterzij voor Juda 40; elke dag voor</text><text x="68" y="562" class="body">een jaar, gebonden en gericht op de</text><text x="68" y="605" class="body">stad.</text><rect x="42" y="663" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="706" class="label">Het eten · 9–17</text><text x="68" y="754" class="body">Zes gewassen, afgewogen brood en</text><text x="68" y="797" class="body">afgemeten water; bezwaar tegen</text><text x="68" y="840" class="body">onreinheid en koeienmest toegestaan,</text><text x="68" y="883" class="body">gebrek voorspeld.</text><text x="46" y="976" class="note">De versgroepen volgen deze hoofdstuktekst.</text><text x="46" y="1012" class="note">Visioen, gesproken opdracht, tekenhandeling en</text><text x="46" y="1048" class="note">verklaring worden onderscheiden.</text></svg>