<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1071" viewBox="0 0 840 1071" role="img" aria-labelledby="title desc"><title id="title">Gog, het plan en het oordeel</title><desc id="desc">Volledige hoofdstukopbouw met de concrete overgangen in de tekst.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1071" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gog, het plan en het oordeel</text><text x="44" y="113" class="ref">Ezechiël 38:1–23</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">De aanvoerder en volken · 1–9</text><text x="68" y="241" class="body">Gog uit Magog, Mesech en Tubal;</text><text x="68" y="284" class="body">uitgeruste ruiters en bondgenoten tegen</text><text x="68" y="327" class="body">hersteld, verzameld land.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Het roofplan · 10–16</text><text x="68" y="476" class="body">Open dorpen, veilige bewoners en buit;</text><text x="68" y="519" class="body">vragen van handelspartners, uit het</text><text x="68" y="562" class="body">verre noorden als een wolk.</text><rect x="42" y="620" width="756" height="256" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Het antwoord · 17–23</text><text x="68" y="711" class="body">Eerder profetenwoord, woede, aardbeving</text><text x="68" y="754" class="body">en instorten; zwaard tegen elkaar,</text><text x="68" y="797" class="body">pest, stortregen, hagel, vuur en</text><text x="68" y="840" class="body">zwavel, bekendmaking.</text><text x="46" y="933" class="note">Deze versgroepen volgen de plaatselijke tekst.</text><text x="46" y="969" class="note">Gelijkenis, visioen, toekomstige aankondiging en</text><text x="46" y="1005" class="note">beschreven bericht blijven onderscheiden.</text></svg>