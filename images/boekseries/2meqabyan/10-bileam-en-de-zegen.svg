<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1005" viewBox="0 0 840 1005" role="img" aria-labelledby="title desc"><title id="title">Bileam en de zegen</title><desc id="desc">Bileam en de zegen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1005" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Bileam en de zegen</text><text x="44" y="113" class="ref">2 Meqabyan 10:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanbod · 3–6</text><text x="68" y="241" class="body">Balak, zoon van Zippor, biedt Bileam</text><text x="68" y="284" class="body">goud en zilver voor vervloeking.</text><rect x="42" y="342" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Woord · 7–10</text><text x="68" y="433" class="body">Vervloeking wordt zegen; Balak boos.</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Weigering · 11–13</text><text x="68" y="582" class="body">Geen huis vol rijkdom boven Gods woord</text><text x="68" y="625" class="body">en eigen ziel.</text><rect x="42" y="683" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Verbond · 14–15</text><text x="68" y="774" class="body">Zegen aan Jakob; daden goedmaken.</text><text x="46" y="867" class="note">Dit is het eerste voorbeeld van het hoofdstuk;</text><text x="46" y="903" class="note">daarna volgt een afzonderlijke terugblik op</text><text x="46" y="939" class="note">verwoesting en ballingschap.</text></svg>