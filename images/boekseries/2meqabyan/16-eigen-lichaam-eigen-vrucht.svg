<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Eigen lichaam, eigen vrucht</title><desc id="desc">Eigen lichaam, eigen vrucht met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Eigen lichaam, eigen vrucht</text><text x="44" y="113" class="ref">2 Meqabyan 16:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aangroei · 1–3</text><text x="68" y="241" class="body">Haar en nagels als zichtbaar voorbeeld</text><text x="68" y="284" class="body">voor opstanding met eigen lichaam.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Eigen soort · 4–7</text><text x="68" y="433" class="body">Tarwe blijft tarwe, gerst gerst;</text><text x="68" y="476" class="body">wijnstok wordt geen vijg en omgekeerd.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Overdracht · 8</text><text x="68" y="625" class="body">Ziel en lichaam komen op; daden blijven</text><text x="68" y="668" class="body">bepalend.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Uitkomst · 9–15</text><text x="68" y="817" class="body">Bazuin en levensdauw; goed tot leven,</text><text x="68" y="860" class="body">kwaad tot oordeel.</text><text x="46" y="953" class="note">De lichamelijke aangroei en planten zijn</text><text x="46" y="989" class="note">vergelijkingen waarmee de tekst ziel en lichaam</text><text x="46" y="1025" class="note">samen verdedigt.</text></svg>