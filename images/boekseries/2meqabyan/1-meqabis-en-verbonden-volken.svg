<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Meqabis en verbonden volken</title><desc id="desc">Meqabis en verbonden volken met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Meqabis en verbonden volken</text><text x="44" y="113" class="ref">2 Meqabyan 1:1–13</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Plaatsen · 1–7</text><text x="68" y="241" class="body">Remat in Moab; Jabbok, Gerag, Samaria,</text><text x="68" y="284" class="body">Jeruzalem; kamp in Gelabuhe.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Bondgenoten · 2,5,7</text><text x="68" y="433" class="body">Edomieten, Syriërs, Amalekieten en</text><text x="68" y="476" class="body">Filistijnen; hulp met goud, zilver,</text><text x="68" y="519" class="body">paarden en wagens.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Verwoesting · 8–11</text><text x="68" y="668" class="body">Stad verwoest; bevolking en weerlozen</text><text x="68" y="711" class="body">getroffen.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Terugkeer · 12–13</text><text x="68" y="860" class="body">Gevangenen en buit meegenomen; thuis</text><text x="68" y="903" class="body">feest.</text><text x="46" y="996" class="note">Meqabis is hier de Moabiet uit Remat. Het feest</text><text x="46" y="1032" class="note">hoort bij de aanvallers na de verwoesting.</text></svg>