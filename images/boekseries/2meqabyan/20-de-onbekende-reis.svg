<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">De onbekende reis</title><desc id="desc">De onbekende reis met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">De onbekende reis</text><text x="44" y="113" class="ref">2 Meqabyan 20:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Ontbrekend · 1–6</text><text x="68" y="241" class="body">Proviand, kleed, staf, sandalen;</text><text x="68" y="284" class="body">onbekende weg en geleiders.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Psalmwoord · 7–9</text><text x="68" y="433" class="body">David: U kent mijn pad; geen bekende</text><text x="68" y="476" class="body">helper in het duister.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Twee bestemmingen · 10–12</text><text x="68" y="625" class="body">Lichtengelen ontvangen rechtvaardige</text><text x="68" y="668" class="body">zielen; duisternis bij oordeel.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Waarschuwing · 13–14</text><text x="68" y="817" class="body">Weg van Kaïn en loon van Bileam:</text><text x="68" y="860" class="body">geschenk en onrecht.</text><text x="46" y="953" class="note">Reisuitrusting en weg verbeelden voorbereiding</text><text x="46" y="989" class="note">op sterven en rekenschap, geen beschreven</text><text x="46" y="1025" class="note">geografische route.</text></svg>