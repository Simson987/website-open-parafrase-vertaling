<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1141" viewBox="0 0 840 1141" role="img" aria-labelledby="title desc"><title id="title">Waarschuwing en Tsirutsaydan</title><desc id="desc">Waarschuwing en Tsirutsaydan met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1141" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Waarschuwing en Tsirutsaydan</text><text x="44" y="113" class="ref">2 Meqabyan 12:1–15</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanklacht · 1–3</text><text x="68" y="241" class="body">Machtigen doen eigen wil; vuur,</text><text x="68" y="284" class="body">stoppels en wervelwind als</text><text x="68" y="327" class="body">vergelijking.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Ontferming · 4–10</text><text x="68" y="476" class="body">Liefde, vertrouwen en terugkeer; stof</text><text x="68" y="519" class="body">en ziel kunnen weer tot bestaan komen.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Grootspraak · 11–13</text><text x="68" y="668" class="body">Tsirutsaydan claimt eeuwig leven;</text><text x="68" y="711" class="body">Telmyakos, engel van dood, komt; koning</text><text x="68" y="754" class="body">sterft.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Nasleep · 14–15</text><text x="68" y="903" class="body">Legers van Chaldeeuwse koning</text><text x="68" y="946" class="body">verwoesten en plunderen zijn stad.</text><text x="46" y="1039" class="note">De ontfermingrede en het plotselinge einde van</text><text x="46" y="1075" class="note">de koning zijn twee verschillende onderdelen.</text></svg>