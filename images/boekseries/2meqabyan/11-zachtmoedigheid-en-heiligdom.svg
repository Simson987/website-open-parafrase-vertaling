<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Zachtmoedigheid en heiligdom</title><desc id="desc">Zachtmoedigheid en heiligdom met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zachtmoedigheid en heiligdom</text><text x="44" y="113" class="ref">2 Meqabyan 11:1–25</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Mozes · 1–5</text><text x="68" y="241" class="body">Bidt verzoening voor beledigers;</text><text x="68" y="284" class="body">zachtmoedig genoemd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Korach en Asaf · 6–11</text><text x="68" y="433" class="body">Aanklacht en oordeel; bronzen</text><text x="68" y="476" class="body">wierookvaten worden verzameld.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Gerei en offers · 12–15</text><text x="68" y="625" class="body">Verzoendeksel, tent, cherub, bekkens,</text><text x="68" y="668" class="body">kannen, schalen, bakken, voorhof,</text><text x="68" y="711" class="body">omheining, pannen, altaren.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Verbond en gebed · 16–25</text><text x="68" y="860" class="body">Abraham, Izak, Jakob; Mozes, Aäron,</text><text x="68" y="903" class="body">Samuël, Elia en Salomo; heiligdom als</text><text x="68" y="946" class="body">gebedsplaats.</text><text x="46" y="1039" class="note">De namen en verbanden volgen deze passage; de</text><text x="46" y="1075" class="note">lijst is geen chronologische bouwgeschiedenis</text><text x="46" y="1111" class="note">van één tent.</text></svg>