<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Gave en twee wegen</title><desc id="desc">Gave en twee wegen met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gave en twee wegen</text><text x="44" y="113" class="ref">2 Meqabyan 9:1–27</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Hoogmoed · 1–8</text><text x="68" y="241" class="body">Mens wordt stof; Seblanyos weigert</text><text x="68" y="284" class="body">eerbied; macht over vijf koninkrijken.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Proef · 9–17</text><text x="68" y="433" class="body">Gave vraagt gehoorzaamheid; verheffen,</text><text x="68" y="476" class="body">bevrijden en opwekken; alles openbaar.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Brede weg · 18–22</text><text x="68" y="625" class="body">Geweld, roof, onrecht en minachting</text><text x="68" y="668" class="body">voor tranen; net van Satan.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Smalle weg · 23–27</text><text x="68" y="817" class="body">Nederigheid, liefde, vrede, vasten en</text><text x="68" y="860" class="body">gebed; afstand van onreine daden.</text><text x="46" y="953" class="note">Breed en smal zijn morele wegbeelden. De vijf</text><text x="46" y="989" class="note">koninkrijken krijgen hier geen afzonderlijke</text><text x="46" y="1025" class="note">namen.</text></svg>