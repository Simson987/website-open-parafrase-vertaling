<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Verwoesting en dubbele eer</title><desc id="desc">Verwoesting en dubbele eer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Verwoesting en dubbele eer</text><text x="44" y="113" class="ref">2 Meqabyan 10:16–28</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Verleden · 16–18</text><text x="68" y="241" class="body">Vloed of vijanden; koningen, profeten</text><text x="68" y="284" class="body">en Levieten weggevoerd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Jeruzalem · 19–24</text><text x="68" y="433" class="body">Wal en muur neer; heiligdom weg; stad</text><text x="68" y="476" class="body">als akker.</text><rect x="42" y="534" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Ontferming · 25–26</text><text x="68" y="625" class="body">Niet geheel vernietigd om Abraham, Izak</text><text x="68" y="668" class="body">en Jakob; dubbele eer in hemel en</text><text x="68" y="711" class="body">aarde.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Aansporing · 27–28</text><text x="68" y="860" class="body">Vorsten moeten goede eerdere koningen</text><text x="68" y="903" class="body">volgen.</text><text x="46" y="996" class="note">De verwoesting is een aangehaalde waarschuwing</text><text x="46" y="1032" class="note">naast Bileams verhaal, geen gevolg van diens</text><text x="46" y="1068" class="note">zegen.</text></svg>