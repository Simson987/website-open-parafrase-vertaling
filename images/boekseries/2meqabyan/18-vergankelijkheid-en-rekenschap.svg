<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Vergankelijkheid en rekenschap</title><desc id="desc">Vergankelijkheid en rekenschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Vergankelijkheid en rekenschap</text><text x="44" y="113" class="ref">2 Meqabyan 18:1–14</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onderwijs · 1–6</text><text x="68" y="241" class="body">Afwijzing van opstanding en misleiding</text><text x="68" y="284" class="body">van naasten worden aangeklaagd.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Adam · 7–9</text><text x="68" y="433" class="body">Dood en gezamenlijk opstaan verbonden</text><text x="68" y="476" class="body">aan Adam.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vergankelijkheid · 10–11</text><text x="68" y="625" class="body">Lichaam, licht van ogen en stem keren</text><text x="68" y="668" class="body">tot stof.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Vragen · 12–14</text><text x="68" y="817" class="body">Waar zijn jeugd, kracht, koninklijke</text><text x="68" y="860" class="body">tooi en smaak van feestmaal?</text><text x="46" y="953" class="note">De lege feestzaal en achtergebleven kroon</text><text x="46" y="989" class="note">verbeelden de retorische vragen, geen benoemde</text><text x="46" y="1025" class="note">paleisverwoesting.</text></svg>