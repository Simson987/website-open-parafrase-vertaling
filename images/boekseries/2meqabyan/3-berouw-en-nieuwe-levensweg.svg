<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Berouw en nieuwe levensweg</title><desc id="desc">Berouw en nieuwe levensweg met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Berouw en nieuwe levensweg</text><text x="44" y="113" class="ref">2 Meqabyan 3:1–29</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Remat · 1–10</text><text x="68" y="241" class="body">Tot hals in kuil; profeet</text><text x="68" y="284" class="body">teruggestuurd; vergeving en volhardende</text><text x="68" y="327" class="body">omkeer.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Opgericht · 11–15</text><text x="68" y="476" class="body">Belijdenis; profeet richt hem op en</text><text x="68" y="519" class="body">onderwijst goede levenswandel.</text><rect x="42" y="577" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Huis · 16–24</text><text x="68" y="668" class="body">Afgoden en waarzeggerij weg; ballingen</text><text x="68" y="711" class="body">als raadgevers en leraren voor</text><text x="68" y="754" class="body">kinderen.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Israël · 25–29</text><text x="68" y="903" class="body">Roepen, ontferming, rust en nieuwe</text><text x="68" y="946" class="body">ontrouw; richters als bevrijders.</text><text x="46" y="1039" class="note">Derde en vierde generatie en duizendste</text><text x="46" y="1075" class="note">generatie staan in de verbondsrede van vers 9,</text><text x="46" y="1111" class="note">niet in een berekende familietijdlijn.</text></svg>