<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Tarwe, wijnstok en maat</title><desc id="desc">Tarwe, wijnstok en maat met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Tarwe, wijnstok en maat</text><text x="44" y="113" class="ref">2 Meqabyan 17:1–12</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Tarwe · 1–6</text><text x="68" y="241" class="body">Korrel sterft, wortelt en draagt veel</text><text x="68" y="284" class="body">korrels; aarde, water, wind en zon.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Wijnstok · 6–8</text><text x="68" y="433" class="body">Fijne worteldraden, dauw en warmte;</text><text x="68" y="476" class="body">vrucht geperst als bloed van</text><text x="68" y="519" class="body">druiventros.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Wijn · 9–10</text><text x="68" y="668" class="body">Vreugde bij drinken; teveel maakt</text><text x="68" y="711" class="body">razend en verstoort zicht op gevaar.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Doel · 11–12</text><text x="68" y="860" class="body">God prijzen en vertrouwen op opstanding</text><text x="68" y="903" class="body">en woning van leven.</text><text x="46" y="996" class="note">Bloed van de druiventros betekent hier</text><text x="46" y="1032" class="note">uitgeperst sap. Het slot verbindt natuurbeelden</text><text x="46" y="1068" class="note">met opstandingshoop.</text></svg>