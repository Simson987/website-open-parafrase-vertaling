<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1048" viewBox="0 0 840 1048" role="img" aria-labelledby="title desc"><title id="title">Zorgvuldig onderzoek</title><desc id="desc">Zorgvuldig onderzoek met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1048" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Zorgvuldig onderzoek</text><text x="44" y="113" class="ref">2 Meqabyan 21:17–20</text><rect x="42" y="150" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Bescherming · 17–18</text><text x="68" y="241" class="body">Vrijstad totdat rechters recht spreken.</text><rect x="42" y="299" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="342" class="label">Vragen · 19</text><text x="68" y="390" class="body">Was er vijandschap? Wat viel: ijzer,</text><text x="68" y="433" class="body">steen of hout? Was het zonder opzet?</text><rect x="42" y="491" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="534" class="label">Onderzoek · 19–20</text><text x="68" y="582" class="body">Niet alleen de verklaring aannemen;</text><text x="68" y="625" class="body">nauwkeurig onderzoeken.</text><rect x="42" y="683" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="726" class="label">Onderscheid · 20</text><text x="68" y="774" class="body">Zonder opzet: vrijlaten; met opzet:</text><text x="68" y="817" class="body">vergelding naar misdaad.</text><text x="46" y="910" class="note">Vers 19 bevat een moeilijke verbinding van</text><text x="46" y="946" class="note">eerdere vijandschap en ongeluk. Vers 20</text><text x="46" y="982" class="note">formuleert het onderscheid naar opzet expliciet.</text></svg>