<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">IJzer, gebieden en voorbeeld</title><desc id="desc">IJzer, gebieden en voorbeeld met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">IJzer, gebieden en voorbeeld</text><text x="44" y="113" class="ref">2 Meqabyan 8:1–24</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">IJzer · 1–7</text><text x="68" y="241" class="body">Koninkrijk vergeleken met Daniëls</text><text x="68" y="284" class="body">ijzer; vermorzelen en hoogmoed.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Gebieden · 8–10</text><text x="68" y="433" class="body">Zebulon, Macedonië, Samaria, Syrië,</text><text x="68" y="476" class="body">Kedar, Sidon, Achaje, Tekeze en India.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Onderdrukking · 11–22</text><text x="68" y="625" class="body">Seblanyos als leermeester; geen hulp</text><text x="68" y="668" class="body">voor wees; Tarsis tot Jericho genoemd.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Jozua · 23–24</text><text x="68" y="817" class="body">Gibeon; zon staat stil; vijf koningen</text><text x="68" y="860" class="body">in één grot als aangehaald voorbeeld.</text><text x="46" y="953" class="note">De gebiedsreeks is geen gecontroleerde kaart van</text><text x="46" y="989" class="note">een historisch rijk; de leeswijzer volgt de</text><text x="46" y="1025" class="note">tekstnamen.</text></svg>