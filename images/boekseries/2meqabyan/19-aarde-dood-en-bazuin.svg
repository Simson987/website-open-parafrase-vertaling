<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Aarde, dood en bazuin</title><desc id="desc">Aarde, dood en bazuin met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Aarde, dood en bazuin</text><text x="44" y="113" class="ref">2 Meqabyan 19:1–15</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Aanspreking · 1–4</text><text x="68" y="241" class="body">Aarde aangesproken om schoonheid, stem</text><text x="68" y="284" class="body">en kracht die zij verzamelt.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Terugkeer · 5–9</text><text x="68" y="433" class="body">Dood en aarde krijgen stem; voedsel,</text><text x="68" y="476" class="body">dauw en lichaam als wederkerige</text><text x="68" y="519" class="body">beelden.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Zonder rangverschil · 10–13</text><text x="68" y="668" class="body">Rijk en arm, oud en jong, goed en kwaad</text><text x="68" y="711" class="body">worden niet ontzien.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Verwachting · 14–15</text><text x="68" y="860" class="body">Lichamen in aarde of rots tot bazuin;</text><text x="68" y="903" class="body">ieder naar zijn daden.</text><text x="46" y="996" class="note">Aarde en Dood zijn personificaties in een</text><text x="46" y="1032" class="note">klaagrede. De lichamelijke beelden worden niet</text><text x="46" y="1068" class="note">letterlijk als etende aarde getekend.</text></svg>