<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Weigering en verschijning</title><desc id="desc">Weigering en verschijning met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Weigering en verschijning</text><text x="44" y="113" class="ref">2 Meqabyan 6:1–24</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Dwang · 1–9</text><text x="68" y="241" class="body">Priesters willen zonen van Meqabis</text><text x="68" y="284" class="body">laten offeren; zij weigeren en worden</text><text x="68" y="327" class="body">aangeklaagd.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Voor koning · 10–13</text><text x="68" y="476" class="body">Tsirutsaydan dreigt; zij houden stand;</text><text x="68" y="519" class="body">sterven in vuur.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Nacht · 14–16</text><text x="68" y="668" class="body">Verschijnen levend met zwaarden; koning</text><text x="68" y="711" class="body">bang; herinnering aan Schepper.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Rede · 17–24</text><text x="68" y="860" class="body">God maakt hemel, aarde, zee en lichten;</text><text x="68" y="903" class="body">hoogmoed en beelden leiden tot oordeel.</text><text x="46" y="996" class="note">De rede wordt gesproken door de verschenen</text><text x="46" y="1032" class="note">martelaren, onderscheiden van het eerdere</text><text x="46" y="1068" class="note">verhoor.</text></svg>