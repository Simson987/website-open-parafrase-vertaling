<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1184" viewBox="0 0 840 1184" role="img" aria-labelledby="title desc"><title id="title">Rijkdom, zegen en erfdeel</title><desc id="desc">Rijkdom, zegen en erfdeel met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1184" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rijkdom, zegen en erfdeel</text><text x="44" y="113" class="ref">2 Meqabyan 21:1–28</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Onrechtmatig bezit · 1–11</text><text x="68" y="241" class="body">Rijkdom vergaat als wolk, rook,</text><text x="68" y="284" class="body">graszaad en was; ceder gezocht en</text><text x="68" y="327" class="body">verdwenen.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Zegen · 12–16</text><text x="68" y="476" class="body">Vrucht, oogst, vee, werk en hulp;</text><text x="68" y="519" class="body">Leviet ontvangt tienden en</text><text x="68" y="562" class="body">eerstgeborenen.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Vrijstad · 17–22</text><text x="68" y="711" class="body">Onderzoek van doodslag; onderscheid</text><text x="68" y="754" class="body">opzet en ongeluk; recht vóór afdoening.</text><rect x="42" y="812" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Slot · 23–28</text><text x="68" y="903" class="body">Tabernakel als hemels voorbeeld; Adam</text><text x="68" y="946" class="body">en Set; leven, gebed, berouw en</text><text x="68" y="989" class="body">blijvende lof.</text><text x="46" y="1082" class="note">De slotbelofte van zegen wordt onderscheiden van</text><text x="46" y="1118" class="note">de openingsaanklacht tegen geroofde rijkdom.</text></svg>