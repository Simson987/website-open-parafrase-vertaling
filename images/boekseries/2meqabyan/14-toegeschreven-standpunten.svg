<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Toegeschreven standpunten</title><desc id="desc">Toegeschreven standpunten met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Toegeschreven standpunten</text><text x="44" y="113" class="ref">2 Meqabyan 14:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Joden · 1</text><text x="68" y="241" class="body">De rede legt hun eten en drinken zonder</text><text x="68" y="284" class="body">toekomstverwachting in de mond.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Samaritanen · 2–5</text><text x="68" y="433" class="body">Volgens de rede: lichaam wordt stof;</text><text x="68" y="476" class="body">ziel als onzichtbare wind en donder.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Farizeeën · 6</text><text x="68" y="625" class="body">Volgens de rede: opstanding met ander,</text><text x="68" y="668" class="body">hemels lichaam.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Sadduceeën · 7–9</text><text x="68" y="817" class="body">Volgens de rede: geen opstanding van</text><text x="68" y="860" class="body">ziel of lichaam.</text><text x="46" y="953" class="note">Dit zijn aan groepen toegeschreven uitspraken in</text><text x="46" y="989" class="note">deze polemiek, geen algemene historische</text><text x="46" y="1025" class="note">beschrijving van al hun overtuigingen.</text></svg>