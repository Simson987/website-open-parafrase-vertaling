<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1091" viewBox="0 0 840 1091" role="img" aria-labelledby="title desc"><title id="title">Rede en ochtend</title><desc id="desc">Rede en ochtend met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1091" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Rede en ochtend</text><text x="44" y="113" class="ref">2 Meqabyan 7:1–9</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Waarschuwing · 1–4</text><text x="68" y="241" class="body">Bekering nu tegenover oordeel later;</text><text x="68" y="284" class="body">gemaakte beelden hebben geen adem.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Onderscheid · 5–6</text><text x="68" y="433" class="body">Dieren: één dood; aangesproken mens:</text><text x="68" y="476" class="body">tweede oordeel.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Nacht · 7–8</text><text x="68" y="625" class="body">Verschijning weg; koning blijft beven</text><text x="68" y="668" class="body">tot ochtend.</text><rect x="42" y="726" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Zoektocht · 9</text><text x="68" y="817" class="body">Wil begraven maar vindt lichamen niet;</text><text x="68" y="860" class="body">God heeft ze verborgen.</text><text x="46" y="953" class="note">De afwezigheid van lichamen is het vertelde</text><text x="46" y="989" class="note">wonder; er worden geen nieuwe overblijfselen bij</text><text x="46" y="1025" class="note">bedacht.</text></svg>