<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1098" viewBox="0 0 840 1098" role="img" aria-labelledby="title desc"><title id="title">Reday en omkeer</title><desc id="desc">Reday en omkeer met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1098" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Reday en omkeer</text><text x="44" y="113" class="ref">2 Meqabyan 2:1–11</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Waarschuwing · 1–5</text><text x="68" y="241" class="body">Reday de ziener; paarden en ijzer</text><text x="68" y="284" class="body">beschermen niet tegen aangekondigde</text><text x="68" y="327" class="body">ziekte.</text><rect x="42" y="385" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vergelijking · 6–7</text><text x="68" y="476" class="body">Koning als gras en as in wind; macht is</text><text x="68" y="519" class="body">tijdelijk.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Oproep · 8</text><text x="68" y="668" class="body">Terugkeer met zuiver hart, tranen en</text><text x="68" y="711" class="body">gebed.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Antwoord · 9–11</text><text x="68" y="860" class="body">Meqabis doet rouwkleed aan en strooit</text><text x="68" y="903" class="body">as.</text><text x="46" y="996" class="note">Sih en abeq zijn de ziektetermen van vers 4; er</text><text x="46" y="1032" class="note">wordt geen moderne diagnose ingevuld.</text></svg>