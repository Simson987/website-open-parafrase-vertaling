<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Keuze en opstandingshoop</title><desc id="desc">Keuze en opstandingshoop met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Keuze en opstandingshoop</text><text x="44" y="113" class="ref">2 Meqabyan 13:1–14</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Weigering · 1–3,7–10</text><text x="68" y="241" class="body">Zonen van Meqabis kiezen trouw boven</text><text x="68" y="284" class="body">tijdelijk genot en koninklijke</text><text x="68" y="327" class="body">dreiging.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Vergelijking · 4–6</text><text x="68" y="476" class="body">Eén paradijsdag boven tienduizenden</text><text x="68" y="519" class="body">jaren; mensenleven als schaduw en</text><text x="68" y="562" class="body">kaars.</text><rect x="42" y="620" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Ziel en lichaam · 11–13</text><text x="68" y="711" class="body">Opstanding van beide; wereld zonder</text><text x="68" y="754" class="body">ziekte, verdriet of dood.</text><rect x="42" y="812" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="855" class="label">Glans · 14</text><text x="68" y="903" class="body">Hoop op gezichten die zevenmaal meer</text><text x="68" y="946" class="body">stralen dan de zon.</text><text x="46" y="1039" class="note">Het hoofdstuk verklaart de keuze van de</text><text x="46" y="1075" class="note">martelaren en verbeeldt hun verwachting, geen</text><text x="46" y="1111" class="note">tweede martelaarsverhaal.</text></svg>