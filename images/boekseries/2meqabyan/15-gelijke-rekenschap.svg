<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Gelijke rekenschap</title><desc id="desc">Gelijke rekenschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Gelijke rekenschap</text><text x="44" y="113" class="ref">2 Meqabyan 15:1–21</text><rect x="42" y="150" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Daden · 1–6</text><text x="68" y="241" class="body">Eigen werken getuigen; oordeel in</text><text x="68" y="284" class="body">beelden van duisternis, storm en</text><text x="68" y="327" class="body">bliksem.</text><rect x="42" y="385" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="428" class="label">Gelijke rang · 7–9</text><text x="68" y="476" class="body">Heer/knecht, meesteres/dienares,</text><text x="68" y="519" class="body">koning/arme, vorst/kind, ouder/kind,</text><text x="68" y="562" class="body">rijk/arm en groot/klein.</text><rect x="42" y="620" width="756" height="127" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="663" class="label">Goede werken · 10–16</text><text x="68" y="711" class="body">Blijvende blijdschap en land van leven.</text><rect x="42" y="769" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Kwade werken · 17–21</text><text x="68" y="860" class="body">Ongetroost verdriet; worm en vuur als</text><text x="68" y="903" class="body">oordeelbeelden.</text><text x="46" y="996" class="note">De opgesomde rangen vormen een</text><text x="46" y="1032" class="note">gelijkheidscontrast voor het oordeel, geen</text><text x="46" y="1068" class="note">aardse rangschikking.</text></svg>