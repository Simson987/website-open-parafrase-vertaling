<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1177" viewBox="0 0 840 1177" role="img" aria-labelledby="title desc"><title id="title">Antwoord en opstanding</title><desc id="desc">Antwoord en opstanding met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1177" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Antwoord en opstanding</text><text x="44" y="113" class="ref">2 Meqabyan 14:10–36</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Schepper · 10–18</text><text x="68" y="241" class="body">Wie uit niet-bestaan schiep kan weer</text><text x="68" y="284" class="body">opwekken; rekenschap naar daden.</text><rect x="42" y="342" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Verzameling · 19–23</text><text x="68" y="433" class="body">Geest, stof en levensgeest;</text><text x="68" y="476" class="body">rechtvaardigen in paradijs; oordeel</text><text x="68" y="519" class="body">verwacht.</text><rect x="42" y="577" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="620" class="label">Onderwijs · 24–28</text><text x="68" y="668" class="body">Verantwoordelijkheid voor eigen woord</text><text x="68" y="711" class="body">en wie men onderwijst.</text><rect x="42" y="769" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="812" class="label">Vergelijkingen · 29–36</text><text x="68" y="860" class="body">Regen, boom, graan en geboorte; ziel</text><text x="68" y="903" class="body">terug in lichaam; bazuin en open</text><text x="68" y="946" class="body">werken.</text><text x="46" y="1039" class="note">Het touw aan de hals in verzen 11–15 is</text><text x="46" y="1075" class="note">oordeelsbeeldspraak, geen biologisch model of</text><text x="46" y="1111" class="note">afbeelding van echte wurging.</text></svg>