<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1134" viewBox="0 0 840 1134" role="img" aria-labelledby="title desc"><title id="title">Kinderen en ballingschap</title><desc id="desc">Kinderen en ballingschap met gecontroleerde tekstgegevens.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#193e32}.title{font-size:39px;font-weight:700}.ref{font-size:28px;fill:#6b705d}.label{font-size:31px;font-weight:700}.body{font-size:31px}.note{font-size:27px;fill:#626957}</style><rect width="840" height="1134" rx="24" fill="#f7f4e9"/><text x="44" y="65" class="title">Kinderen en ballingschap</text><text x="44" y="113" class="ref">2 Meqabyan 5:1–18</text><rect x="42" y="150" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="193" class="label">Voortzetting · 1–3</text><text x="68" y="241" class="body">Jongens groeien op; gebod van vader;</text><text x="68" y="284" class="body">hulp aan arme, wees en weduwe.</text><rect x="42" y="342" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="385" class="label">Inval · 4–9</text><text x="68" y="433" class="body">Tsirutsaydan van Chaldeeën;</text><text x="68" y="476" class="body">verwoesting, roof en gevangenschap.</text><rect x="42" y="534" width="756" height="170" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="577" class="label">Vasthouden · 10–11</text><text x="68" y="625" class="body">Kinderen weigeren de genoemde</text><text x="68" y="668" class="body">onreinheid.</text><rect x="42" y="726" width="756" height="213" rx="18" fill="#fff" stroke="#d9d9c9" stroke-width="2"/><text x="68" y="769" class="label">Baäl-Peor · 12–18</text><text x="68" y="817" class="body">Gemaakt door smid; zonder adem of</text><text x="68" y="860" class="body">kennis; kan niet eten, redden of</text><text x="68" y="903" class="body">heersen.</text><text x="46" y="996" class="note">Deze passage noemt geen namen of exact aantal</text><text x="46" y="1032" class="note">kinderen; die worden hier niet uit een ander</text><text x="46" y="1068" class="note">hoofdstuk ingevoegd.</text></svg>